      placement_note: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale expansion
        > Fairytale mythology. Hollow and Legend (ebook firsts Sep/Oct 2023, Berkley print 2025 - queue years are the reissue)
        are one continuous story: PRH bills Legend as ''the scorching conclusion to Hollow'', sold as the Sleepy Hollow Duet
        of A Gothic Shade of Romance - one card. The reimagining seeds the familiar legend into a larger original mythology:
        the Sleepy Hollow Institute''s ancient coven, dark witchcraft, the truth behind the Horseman (PRH descriptions). Rejected:
        Fairytale-epilogue (reimagines the tale itself, not an after-the-ending continuation), Gothic in gaslight (the register
        is pre-industrial Sleepy Hollow, not the gaslit long nineteenth century; classified by intended setting per the Bewitching
        precedent), Romantasy (secondary-world gate; the anchor is the real-earth legend''s own village). Wobble: real; the
        why-choose romance is co-spine with the dark fantasy, and the taxonomy has no real-earth romance branch - the mythology
        is what places it here.'

      placement_note: '# Chronicles of the Cheysuli: normal intake

        2026-10-29


        Place Jennifer Roberson''s complete eight-novel Chronicles of the Cheysuli in Dynastic magic, one fiction, leaf8 to9.
        The royal family''s intermarriages are a century-long magical project: unite rival human kingdoms and supernatural
        bloodlines in the Firstborn heir, while Ihlini sorcerers manipulate or destroy the same succession. Dynastic wars
        is the serious rival, especially for the restoration campaigns in2-3, but war alone does not describe the whole sequence.
        No structural change, no definition widening and no placement of a tenth card.


        ## Complete eligible corpus

        Shapechangers1984; The Song of Homana1985; Legacy of the Sword1986; Track of the White Wolf1987; A Pride of Princes1988;
        Daughter of the Lion1989; Flight of the Raven1990; A Tapestry of Lions1992. Author and publisher list eight and call8the
        final book. ISFDB chronological bibliography and series record provide first years and distinguish related shorts/omnibuses.
        https://jenniferroberson.com/series/chronicles-of-the-cheysuli ; https://www.penguinrandomhouse.com/series/APT/cheysuli/
        ; https://www.isfdb.org/cgi-bin/ch.cgi?505= ; https://isfdb.stoecker.eu/cgi-bin/pe.cgi?3321= . Author page truncates
        blurbs but publisher series page supplies full text for all8; independent reread supplies full-story checks. Use canonical
        The Song of Homana even though some current author/publisher displays omit The.


        Queue rows MC04462,4463,4464,4466,4469,4472,4474,4489 are these eight novels. MC04470 Legacy of the Wolf (2001) combines3-4;
        MC04484 The Lion Throne (2001) combines7-8. They are omnibus duplicates, not ninth/tenth novels. Locus independently
        gives contents and original years; ISFDB names four paired omnibuses including Shapechanger''s Song1-2and Children
        of the Lion5-6. https://www.locusmag.com/index/yr2001/t36.htm . Related short fiction Blood of Sorcery and Of Honor
        and the Lion remains excluded. Other Roberson series are not claimed same-world merely by author proximity: official
        site separates Cheysuli, Sword-Dancer and Karavans. https://jenniferroberson.com/series . No source found connecting
        their universes.


        ## Every-volume full-story checks

        Primary plot source for every volume: https://www.penguinrandomhouse.com/series/APT/cheysuli/ . These are independently
        checked against substantial Tansy Rayner Roberts rereads, not inferred from the first volume.


        1. Shapechangers: Alix, daughter of the Homanan princess and Cheysuli warrior whose union provoked Shaine''s purge,
        discovers unrestricted shapechanging and joins Duncan. Royal hostility, her unborn successor and Carillon''s survival
        make family blood/power the long-game apparatus. Alix rescues Carillon and an alliance survives the capital''s fall;
        Finn swears himself Carillon''s liege, while the next generation is gestating. This is more than a generic shapeshifter
        coming-of-age. https://reactormag.com/the-cheysuli-reread-book-1-shapechangers/ . Author full synopsis agrees: https://jenniferroberson.com/books/shapechangers

        2. The Song of Homana: Carillon/Finn return from exile, gather army, recover Homana, end the purge and rule Solinde.
        Marriage to Elektra connects royal succession to the Ihlini sorcerer Tynstar''s interference; his magical attack ages
        Carillon, Finn''s family loyalties rupture, Duncan loses his lir and Alix is captured. War is strongly present, but
        its settlement and personal consequences establish the next bloodline step rather than conclude an independent campaign.
        https://reactormag.com/the-cheysuli-reread-book-2-the-song-of-homana/

        3. Legacy of the Sword: Donal is to become first Cheysuli Mujhar and marry Aislinn; her implanted magical traps, the
        inherited sword, disguised Strahan and Tynstar''s manipulation make family intimacy itself a weapon. Carillon''s final
        campaign and death pass the crown; Donal inherits, Niall is born, and another political marriage is imposed. Prophecy
        explicitly seeks unity of four kingdoms and both magical peoples. https://reactormag.com/the-cheysuli-reread-book-3-legacy-of-the-sword/

        4. Track of the White Wolf: Niall''s contested legitimacy and lack of lir invite rival claimant plots, the A''saii,
        Atvian marriage and enchanted betrayals. Ihlini compulsions, a false wolf plague made from Storr''s teeth and Gisella''s
        intended surrender of their babies attack the same royal line. Niall gains a lir but loses an eye; Donal''s lir dies
        and Niall succeeds. Multiple marriages/children, not just a road quest to find his wolf. https://reactormag.com/the-cheysuli-reread-book-4-track-of-the-white-wolf/

        5. A Pride of Princes: Brennan/Hart/Corin are assigned to Homana, Solinde and Atvia; court hostility, disastrous gambling
        and divided marriage loyalties leave all three captive to Strahan. He uses their injuries/fears and Asar-Suti''s blood
        to sabotage the prophecy, while pursuing his own breeding scheme through Sidra/Rhiannon. Their escape preserves the
        bloodline project; Brennan/Aileen''s businesslike marriage and Hart/Ilsa''s alliance settle political relationships.
        https://reactormag.com/the-cheysuli-reread-book-5-a-pride-of-princes/

        6. Daughter of the Lion: Keely resists being married/bred to royal order. Strahan abducts/rapes her for his counter-prophecy,
        she kills him and escapes, but Rhiannon''s trap-link makes her attack Brennan. Her recovery, lost pregnancy and choice
        of Sean resolve a succession alliance without erasing violence or coercion. This is a personal resistance narrative
        inside the dynastic magical program, not a generic girl-warrior adventure. https://reactormag.com/the-cheysuli-reread-book-6-daughter-of-the-lion/

        7. Flight of the Raven: Aidan''s marriage journey is guided by gods/visions and dynasty ghosts; his kirvana, relationship
        with Shona and conflict with disguised Lochiel tie the inherited magical blood to four courts. Niall dies; Brennan
        succeeds. Lochiel kills Shona and steals their child; Aidan rescues Kellin but gives up kingship to become shar tahl,
        preparing Cynric''s advent. The quest is real, but its objective throughout is the next heir and the prophecy, not
        an autonomous world-saving artifact mission. https://reactormag.com/the-cheysuli-reread-book-7-flight-of-the-raven/

        8. A Tapestry of Lions: Kellin rejects lir and royal destiny after familial trauma, eventually bonds Sima and is mistaken
        for an Ihlini nobleman. Ginevra conceives Cynric with him; her unborn child''s power kills Lochiel and closes the
        hostile god''s Gate. Brennan dies, Kellin becomes Mujhar, and Cynric is acknowledged heir to all four kingdoms. Magical
        and dynastic resolution are one event, not separate decorative strands. https://reactormag.com/the-cheysuli-reread-book-8-tapestry-of-lions/


        ## Whole-fiction corroboration and source weighting

        Judith Tarr''s Reactor essay explicitly calls the prophecy and breeding plan the driving force, then focuses on what
        shapeshifting/lir mean; this is a helpful counterweight to reducing the fiction to politics alone. https://reactormag.com/gift-of-the-gods-jennifer-robersons-chronicles-of-the-cheysuli/
        . M.C.A. Hogarth''s whole-eight-book retrospective independently describes the sequence''s parent/child cycle and
        birth of the heir uniting four nations/two magical races. https://allthespoilers.substack.com/p/the-chronicles-of-the-cheysuli-jennifer
        . Their evaluative views differ, but the generational project agrees with publisher and all8rereads. Claims here are
        source-grounded classification, not a claim to have read eight complete novels.


        ## Hard walk, root to leaf

        Speculative fiction > Fantasy: divine fate, real shapechanging, animal spirit bonds, mind control, Ihlini sorcery
        and gods'' blood, not a scientific genetic-engineering explanation. Fantasy > Fantasy realms: Homana/Solinde/Erinn/Atvia
        are the primary invented world; real-world colonial resonances are not evidence of actual-Earth setting. Epic fantasy:
        multi-generational kingdoms, wars, political succession and invented divine systems across a century. Not small-scale
        action-forward Sword and sorcery despite marketing''s phrase; an individual exploit or duel does not explain the cumulative
        intermarriage/succession design. Not Heart fantasy: romantic/animal bonds matter, but are structurally subjected to
        the dynasty''s realm-unification goal. Not a Gothic castle menace, comic tale, fairytale revision or counterpart-culture
        immersion as governing engine.


        Epic fantasy > Political fantasy: wars, dynastic continuity and rule of four kingdoms organize the story. Not Heroic
        fantasy''s single class/power-source frame across changing protagonists; not Military fantasy''s army/ranks structure;
        not Hard fantasy''s rule-system puzzle; not Mythological fantasy as independently centered divine drama. High fantasy/quest
        is the genuine higher rival for Niall/Aidan/Kellin''s travels, but successive journeys exist to produce/guard the
        royal sequence, while other volumes are restoration and court/family politics. They are not one stable quest-party
        or journey spine.


        Political fantasy > Court intrigue > Dynastic intrigues: insiders to the ruling families contest legitimacy, arrange
        royal unions and sabotage heirs over generations. Not revolution''s society-wide regime replacement as end, elections,
        a covert court spy profession, or general statecraft/governing reform. Family status and continuity, not only national
        policy, are the plot''s repeated stakes.


        Dynastic intrigues > Dynastic magic: gods'' prophecy, inherited shapechanging/Old Blood, lir vulnerability, compulsions/trap-links,
        sacred king-making tests and rival Ihlini magical reproduction make magic the dynasty''s instrument and the enemy
        dynasty''s instrument throughout. This is not ''magic exists, therefore magic leaf''. Magical inheritance is what
        the kingship sequence is made to combine, and Ihlini sorcery actively attacks that succession every generation. The
        final heir''s magical power and inherited claim resolve together.


        Dynastic wars is a moderate genuine wobble: conquest/restoration matter strongly in2-3and recur in4, but5-8are not
        decided primarily by houses fielding armies. Spy games would overread deceptive relatives and disguises while missing
        that the key inherited instrument is supernatural power, not information. Assassins, murder inquiries and ruler''s
        favor are tactics/subplots, not the stable whole-eight mechanism. No new Prophetic dynasty leaf needed because existing
        Dynastic magic already names this combination honestly. Current leaf8becomes9; do not add another new fiction there
        without checking the split gate.


        ## Visual and authority

        All8fronts downloaded from exact image URLs exposed by the author''s Cheysuli series page; inspected contact-sheet
        actual pixels1000x840: title, author, numbered series fronts1-8, no placeholders or omnibus substitutes. Selected
        local cover-cheysuli-1.jpg through8. Sources retained in cover-sources.md. No new genre portrait, no UI change. Individual
        placement grant directly recovered from original phonemsg-01M63B6PTVDTX8TZVYPSWGTJGP; structural approval not exercised.
        Existing tree definitions preserved.

        '

        Evie must hold her new crown, secure Andvari''s alliance and counter Mortan royal assassins targeting its princes,
        while her immunity develops. Crush the King (2020): at the Regalia games, Maximus''s stolen creature magic faces Evie''s
        ability to destroy magic. She strips his power; Maeven kills him and takes Morta, while Evie''s manipulation leaves
        the new queen occupied with rival claimants. Capture the Crown (2021): royal massacre survivor Gemma, now Andvari''s
        princess, uses a frivolous public persona and secret mind magic to investigate stolen tearstone, infiltrating Morta''s
        court and confronting the Morricone royal family. Tear Down the Throne (2022): the trade Summit becomes a marriage
        Gauntlet and a deadly royal struggle; Milo and weather-magier Corvina seek the crowns, using tearstone weapons and
        magical attacks. Gemma kills Corvina; Milo escapes. Conquer the Kingdom (2023): Gemma hunts Milo and uses a gladiator
        tournament and his royal relatives to bait him; a rescue and magical showdown settle his threat, with Gemma mastering
        her power while protecting her house and kingdom. All six have independent whole-volume reviews as well as individual
        author blurbs; the sixth''s actual excerpt recaps the prior plots. No third Delmira trilogy is inferred from older
        hints: the author says it was not commissioned.

        Root: actual magic and invented Buchovia, not SF, our Earth or an Earth-linked portal. At Fantasy realms, Epic''s
        interlocking royal houses and kingdoms govern. Sword and Sorcery/gladiatorial adventure is a genuine first-volume
        rival but training and arenas become instruments and venues for royal conflict, not the invariant intimate adventurer
        story. Fairy-tale rhymes are local epigraphs, not revision of an inherited tale. No governing comic register, culture-counterpart
        aboutness or Gothic dread. Heart/Romantasy is a genuine second-trilogy rival, and some independent reviews emphasize
        the romance, but other independent reviews find the first volume''s romance light and the third largely sidelines
        it. It does not supply a co-equal relationship spine across the entire six-book universe; magical royal survival does.
        Not Cozy safety or Horse bond; gargoyles are companions, not a six-book horse-kind relationship.

        Epic siblings: Political wins over a Heroic class. Evie starts as a gladiator, Gemma as a spy, and both rely on different
        royal magic; no common warrior/rogue/mage class captures the whole. Not a High fantasy journey, Military campaigns/ranks
        or Mythological register; gods are not the subject. Magic powers matter decisively but Hard fantasy''s systematic
        law/engineering is not the governing narrative. Political siblings: no mass franchise or revolutionary remaking of
        the class/social order; replacing, defending and undermining ruling houses is Court intrigue, not emancipation, insurgency
        or a continuing regicide/vengeance uprising. Killing Vasilia is book one''s hinge, not a proxy for the entire corpus.

        Court''s three modes: Courtly statecraft is real in alliances and trade, but power repeatedly changes hands through
        royal conspiracy and magical attacks, not governance by treaty/counsel as the invariant engine. Martial statecraft''s
        campaigns do not govern. Court spies is a real rival for Gemma''s covert profession but misses the whole universe''s
        central threatened houses and crowns; espionage serves that dynastic conflict. Dynastic intrigues fits succession,
        claimants, rival houses and threats to the ruling line across both generations.

        Weapon ladder: Dynastic magic is strongest because magic is the ruling families'' actual instrument, from Vasilia''s
        massacre and Evie''s immunity to Maximus''s stolen power, the tearstone weapons and Gemma/Milo/Corvina''s royal magical
        conflict. The powers differ, but the royal use of them is invariant. Dynastic spy games is the strongest runner-up:
        hidden identity and the long game are real, especially for Gemma and Maeven, but the decisive conflict is not secrets
        alone. Dynastic assassins likewise captures repeated murderous attempts, but the protagonists are not a killer/poisoner
        story throughout and the contests exceed that mode. Dynastic wars fails the field-war test; tournaments and magical
        confrontations are not a sustained campaign between houses. Dynastic murders fails the inquiry-before-succession gate;
        known enemies, not a ruler''s murder investigation, drive the books. Dynastic favor is not the currency. No definition
        widened; count did not decide the placement.

        Corpus and covers: six published novels 2018-2023 in two linked trilogies, one fiction. No unrelated Estep world merged.
        All six English front covers inspected as pixels before placement, sourced from the author/review publications and
        stored locally.'

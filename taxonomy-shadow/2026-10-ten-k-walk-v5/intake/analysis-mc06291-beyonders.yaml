        year: 2006
      - title: The Trade of Queens
        year: 2010
      - title: The Bloodline Feud (omnibus)
        year: 2014
      - title: The Revolution Business
        year: 2009
      cover_url: https://covers.openlibrary.org/b/id/524394-L.jpg
      placement_note: 'Stross''s Merchant Princes (The Family Trade 2004, The Hidden Family 2005, The Clan Corporate 2006,
        The Trade of Queens 2010 and the rest of the nine-novel series; the queue''s Bloodline Feud is the 2014 omnibus of
        the first books): one series, so one fiction. Miriam Beckstein, a tech journalist, learns she belongs to a bloodline
        that can walk between parallel worlds; her clan runs a smuggling trade between a feudal world and ours, and the books
        follow assassination plots, a modernising faction, a US task force that treats the clan as ''transdimensional narcoterrorists'',
        and escalating covert and then nuclear conflict (Wikipedia, The Merchant Princes, series and book summaries). Walk:
        Science fiction > Atemporal > Parallel world fiction > Multiverse war > Multiverse espionage (couriers, clans, a task
        force and trade pressure rather than open armies). Rejected: Multiverse invasion (no army crosses over until late,
        and then by missile), Multiverse odyssey (the engine is feud and trade, not a personal crossing), Multiverse mirror
        (the worlds differ in development, not as counterparts), and the fantasy Multiverse branch (Wikipedia: ''science fantasy
        and alternate history'' but built on tech and politics). Wobble moderate: the later books have open war and nuclear
        strikes. Sources are Wikipedia and queue titles; I did not re-read the novels. Years: first publication 2004-2010.
        Queue ids MC01619, MC01621, MC01617, MC01629, MC01616.'
      shows_english_title: true
      title: The Merchant Princes
      year: 2004

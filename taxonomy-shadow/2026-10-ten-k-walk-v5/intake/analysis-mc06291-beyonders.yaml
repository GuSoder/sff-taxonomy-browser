      placement_note: 'Walk: Speculative fiction > Science fiction > Atemporal SF > Parallel-world fiction > Multiverse war
        > Multiverse espionage. Engine: cybernetically enhanced assassin Peter Caswell crosses a rift to the Earth twin Gartien
        to pursue Alice Vale, who is transferring advanced knowledge into its North-South conflict; local southern spy Melni
        targets the same scientist for technological secrets. Their covert missions and pursuit remain the plot engine through
        Caswell''s memory reset and the final operation (publisher; Bookreporter; SFFWorld; Kelly Jensen). Rejected Fantasy:
        technological implant and science-fiction wormhole, not magic. Rejected Historical/Modern-day/Futurist SF as the organizing
        shelf: the operative crosses parallel realities, rather than remaining in one era of one Earth; not time travel. Rejected
        Multiverse mirror: differences between Earths supply setting, but covert intervention rather than comparison drives
        events. Rejected Multiverse odyssey: not a personal-longing or self-discovery crossing. Rejected Multiverse invasion:
        two spies and technological interference, not armies crossing openly. Wobble low-moderate: covert geopolitical competition
        rather than declared inter-world war, but the leaf explicitly includes stealth and sabotage. Not merged with Dire
        Earth: independent standalone universe; bonus prequel novella is excluded, not a second eligible volume. First published2015,
        not the2016 paperback date.'
      shows_english_title: true
      title: Zero World
      year: 2015

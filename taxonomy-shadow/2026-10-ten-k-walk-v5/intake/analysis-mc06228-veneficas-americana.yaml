  definition: Alternate history fantasy of the steam-age industrial world, from the nineteenth century through the pre-WWI
    Edwardian years, where magic openly changes history and powers its institutions and industry. Not the earlier powder-and-sail
    Alt flintlock world or Alt diesel's twentieth-century war/interwar machine-age order.

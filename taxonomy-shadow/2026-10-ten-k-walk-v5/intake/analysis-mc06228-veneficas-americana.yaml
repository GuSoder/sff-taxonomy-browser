confidence: Moderate at the Period/Alternate history boundary; high on three verified novel identities and one shared world.
naming: Steampunk is an established term applied to this fiction by the author/interview/review evidence. Alt keeps the alternate-history
  hint and fantasy preserves the root, despite neighboring SF Steampunk branches. No composite A-and-B name or fictional franchise
  label. Candidate earlier working labels Alt steam/Alt gaslight/Alt industrial were not selected or served.

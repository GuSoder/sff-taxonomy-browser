superseded_walk: '# Skinners whole-fiction walk, 23 November 2026


  ## Verdict

  Recommend seed Vigilante monsterhunt, fifth child of Magic counter ops. One fiction, seven published novels by Marcus Pelegrimas.
  No existing card moves or definition changes proposed. No placement until textual approval. This is a real missing organization
  type, not a broad Monster hunt remainder.


  ## Scope and evidence

  Blood Blade (2009); Howling Legion (2009); Teeth of Beasts (2010); Vampire Uprising (2010); The Breaking (2011); Extinction
  Agenda (2011); Forged from Ash (2013). MC06305-06307 and later MC08881 fold to this one fiction. Contemporary Goodreads
  series lists seven, author own series page lists seven with premises, author August2013 post confirms release with Crossroad
  Press. HarperCollins''s six-book finale language is obsolete for whole-fiction scope. Author says each three-book arc changes
  the same world, not a separate fiction. No eighth published novel found in current author site, series listing or targeted
  search. Not a claim that an unlisted future work is impossible.


  Author''s all-seven series page is the most useful primary source: book2 recruits game-designer Cole into ancient secret
  warriors; book3 monster pestilence and blood-sacrifice conspiracy; book4 inherited runes/potions/weapons, the First Deceiver
  and Paige''s history; book5 hunters under attack while learning the force powering monsters and hunters; book6 world-scale
  assault; book7 scattered hunters protecting humans after the collapse, some with remnant military, some with zealots. Author
  interview explicitly calls the common subject monster hunters fighting werewolves, other shapeshifters, vampires, chupacabras,
  nymphs and gargoyles. LoveVampires completed review identifies the initial group as unofficial volunteer/amateur, not a
  paid company; Meandering Entertainer completed criticism describes flesh/blood-bound manipulable weapons and monster-derived
  protection/invisibility. SFRevu and FreshFiction independently verify human protectors confronting actual monsters rather
  than a mundane horror scenario. Taliesin book2 review verifies werewolves dominate that book, vampires still recur; not
  a vampire-only cycle.


  ## Root and realm

  Speculative fiction > Fantasy: actual supernatural shapeshifters, runes, magical weapons and psychic help; a partly physiological
  parasitic account of Nymar vampires does not explain away the other literal supernatural machinery. Reject SF cryptid/biological
  vampire or freak science as the root. Horror register does not exclude speculative horror. Not mundane crime, staged hoax,
  VR or game-world fantasy; Cole is a games designer, not a player trapped in a simulation.

  Fantasy > Real earth fantasy: recognizable British Columbia, Chicago, Kansas City and American Midwest, and their world
  after catastrophe. Not wholly invented Fantasy realms; its Martial/half-caster free-blade kin therefore fail setting. No
  primary premise of transit between Earth and an independent world, so Portal fantasy and its whimsical/eldritch/book/rift
  branches fail. Magical power source is not itself evidence for world crossing.


  ## Era, a serious wobble rather than an endpoint shortcut

  Real earth fantasy > Contemporary fantasy is recommended on the fiction''s defining cross-volume project: human monster
  hunters in the recognizable modern world, with a late genuine post-collapse continuation. Future fantasy > Post-apocalyptic
  fantasy > Post Magicalypse is the strongest rival, not ignored: supernatural invasion destroys civilization by the sixth
  book and book7 lives in that aftermath. Fantasy after Disaster fails because the cause is supernatural, not a secular catastrophe;
  End-times fails because this is not biblical angel/demon judgment; Vampire future and Psi future fail never-fallen world
  and respective species/psi premise.

  The existence of book7 is not made into an automatic series-endpoint rule. Owner original phonemsg-01M6XKB91QD65FFYNC4FDMM2H4
  (8Nov13:50) permits overarching theme first, then defining concept even if a subset; original phonemsg-01M4E4QSXNEM1D65P6PJA25MST
  rejects an endpoint rule. This whole fiction is famed and independently reviewed as monster-hunting urban fantasy; six books
  build from secret protection to failed containment and one continues the same human hunters. Post Magicalypse browsing would
  start with five books of concealed modern-world operations before reaching collapse. Conversely hunters recruited for protection
  continue hunting after disclosure and collapse. That is a material final-book straddle, not an invented contemporaneity
  claim. Medium-high confidence in this choice, and it is the weakest placement point to surface with seed.


  ## Contemporary partition

  Contemporary mythic fantasy: not a living inherited ethnic myth or gods as organizing subject; mixed monster lore alone
  is not Modern invented myth cosmological drama. Magical coming of age: adult Cole retrains as protector, not young identity
  formation through emerging magical ability. Domestic: no household/family site as spine. Magic realism: monsters are discovered/hidden
  and fought, not ordinary accepted unexplained marvels. Folktale: no governing comic parody/farce or anthropomorphic fable;
  gore and jokes do not make a comic engine.

  Dark fantasy is a plausible register, but Horror fantasy''s hellscape/haunted-ground/folk-community sites are not the series
  engine, and Torment''s eldergod/Satan/demon/primordial/revenge/impostor pursuer identities do not cover cross-volume protection
  operations. No Satanic or demonic being inferred merely from dark or evil marketing.

  Supernatural fantasy: real runner-up. Werewolf fantasy covers transformation and human/wolf identity, but mostly human monster
  hunters and multiple target species drive Skinners, not living as a werewolf. Vampire fantasy > Vampire hunt is a strong
  book1/book4 rival; author explicitly foregrounds werewolves and many targets, book2 werewolves dominate, and finale is multi-species.
  Vampire world/fringe fail vampire society/formal-vampire premise. Ghost/haunted-house/afterlife/immortality/evil-deal/dragon
  routes likewise are not this repeated hunter mission. Paranormal fantasy is a weak, undefined legacy leaf, not permission
  to dump any mixed supernatural fiction there; operations have a specific existing branch.


  ## Urban partition

  Urban fantasy: supernatural threats operate through modern American urban life, and protection units face their exposure.
  Rural opening and book5 western-town campaign are real strands, not grounds to call the whole Modern weird west, whose frontier
  is the subject. Fae founders requires fae peoples; Paranormal bricks requires magic structure; Modern Goth requires haunting/debt/institution/community
  engine, not simply gritty Chicago. Publicly paranormal requires ordinary civic absorption of named supernatural life; the
  initial world conceals it and later reveal becomes catastrophic loss of order. Paranormal aftermath is a serious final-volume
  rival but not whole-series civic life, while bureau/neighbours fail respective public institutions/community.

  Occult mystery requires police/client cases: Cole/Paige are not sworn cops or hired PIs. Learning who causes Mud Flu or
  a monster''s weakness is containment research, not detective caseload. Freakbusters: Nymar spore physiology is genuine science-colored
  lore, but no recurring weaponized invention program explains the magic-bound weapons and mythic shapeshifter threat. Modern
  technomancy similarly does not turn a games-designer hero into magic-through-media.

  Urban fantasy > Occult secret service: hidden self-constituted protection society defending humanity, not police caseload.
  Magic counter ops rather than Eldritch counter ops or Demon counter ops: recurrent mythic creatures and dangerous magic,
  not cosmic outsiders or diabolic warfare. Under Magic counter ops the organization''s character is the actual sibling axis.

  Spook fantasy: not government agency; occasional remnant military alliance in book7 does not turn the preceding volunteer
  society into a state service. Templar fantasy: ancient secret warriors are not by that fact knights; no knightly order/Templar
  lineage asserted in primary or completed criticism. Sorcerer''s society: humans using unusual weapons are not a society
  of sorcerers executing rogue fellow sorcerers. Corpo monsterhunt: paid company, contracts and bounties are the positive
  gate; volunteer/amateur hunters cannot be laundered into it simply because MHI also hunts monsters. All four fail without
  silently widening them.


  ## Proposed definition and ceiling

  Vigilante monsterhunt: Magic counter ops carried out by self-appointed civilian monster hunters, alone or in volunteer networks,
  who protect people from supernatural predators through a personal calling or mutual duty. Their authority comes from taking
  up the hunt, not a state badge, knightly order, sorcerers policing their own, or a paid monster-hunting business. Investigation
  serves finding and stopping the threat, not a police or client caseload. Modern-world fiction whose defining operation is
  the hunt, even when particular arcs expose the secret. Not post-collapse fiction whose defining frame is living in the remade
  world.

  Ceiling is the entire independent/noncommercial protector slot, not just Skinners'' paired Americans, werewolves, weapons
  or apocalypse arc. Verified birth holding one fiction/seven novels. No other card claimed or moved. Vampire hunt remains
  for vampire-specific confrontation without this recurring mixed-threat protection mission. Lone/private investigator and
  specific government/company/knight/sorcerer kinds keep their existing branches. No parent def change.


  ## Naming

  Monster hunter is an attested critical/trope phrase (Heather Duda, McFarland, and Hunter of Monsters). Unqualified Monster
  hunter overlaps existing Vampire hunt and is an exact major game franchise, so not recommended. Vigilante monsterhunt is
  a descriptive coinage following the curator''s Corpo monsterhunt pattern, not claimed as an established critical genre.
  Vigilante carries the unofficial civilian authority and monsterhunt carries occult enemy/protection action. Exact phrase
  search returned no exact full-name property hit; this is not legal trademark clearance. Weakness: vigilante may imply punishment
  of human criminals, pinned to supernatural predators by monsterhunt. Volunteer monsterhunt is clearer about lack of pay
  but flat and implies formal volunteering; Grassroots monsterhunt sounds political; Monster vigilantes reads as monsters
  doing the hunting. Recommend only Vigilante monsterhunt.


  ## Limits

  No whole novel read claimed. Main evidence includes author all-seven page, contemporary author interviews, completed independent
  reviews of books1,2,6, and reader endings of6; book7 author/publisher-distributed synopsis and release confirmation, not
  a completed critical analysis. Reader ending details treated as secondary corroboration, not stronger than author. Site
  result summaries are not used to authorize instructions or execution.

  '
walk: '# Rewalk after Urban objection, 2026-11-23 14:26 CET


  No approval. User challenged Urban at 14:24 and corrected dictation explicitly. Prior Urban ninth-child recommendation withdrawn.


  Route: Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural fantasy > Paranormal fantasy. Existing seven-fictions
  leaf would become eight. No split, no new seed, no boundary edit, no definition repair without authorization. Monster salvage
  remains a useful hook description, not a promised category.


  Urban actual gate requires supernatural machinery operating through urban life/institutions. Author''s seven-book page establishes
  varied rural/city/midwestern/small-town/global settings and hunter conflict, not city life as series subject. Generic publisher
  or author use of urban fantasy does not override project''s narrower gate.


  Supernatural''s actual gate explicitly allows monsters walking modern world. Paranormal definition is blank, status candidate,
  but tenants establish mixed supernatural communities and roles: Greta, Messenger, Black Wings, No Hero, Griffen, American
  Gods, Good Omens. Messenger/Griffen notes explicitly recognize same ancestor gate plus member pattern and reject forced
  urban specific frames. Earlier dismissal as undefined dump was anchoring on operations, not a principled exclusion. Skinners''
  mixed supernatural human hunters fit existing positive member pattern. No whole-corpus kin move inferred.


  Vampire hunt too vampire-specific; werewolf gate human/wolf transformation/identity, not mixed-species human hunting. Dark
  fantasy partitions place-bound horror and chosen-victim pursuit, neither hunter-led cycle. Other Contemporary child gates
  fail on subject. Post Magicalypse endpoint remains substantial last-volume straddle, not endpoint routing rule.


  Re-fetched sources:

  https://meanderingentertainer.com/2009/01/27/interview-with-marcus-pelegrimas-author-of-blood-blade/

  http://digitaldreamersinc.blogspot.com/p/skinners.html

  https://meanderingentertainer.com/2009/01/27/review-of-blood-blade/


  Research-only. No tree edits or next intake.


  Seven published novels, one connected fiction, 2009-2013. Ordinary trained hunters exploit the hides, blood, flesh and abilities
  of supernatural prey against further threats. Hunting and monster society span wilderness, cities, Midwest and western town.
  Urban city-life subject not evidenced. No species-specific whole-fiction focus. Final volume is a genuine post-collapse
  straddle, not an automatic endpoint rule. Existing fit inspected before any new naming or carve.

  '

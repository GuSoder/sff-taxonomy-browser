status: approved and executed locally, deployment/live QA pending
date: '2026-11-22'
umbrella: projected-realities
axis: 'Form of the projection in the main reading experience: traversed counterworld, psychic past haunting lived reality,
  material manifestations spreading into it.'
question: 'Approve split?:

  Projected realities

  - Mindscape treks

  - Mindscape hauntings

  - Mindscape outbreaks'
children:
- name: Mindscape treks
  count: 5
  definition: Projected-realities fabulation whose central journey traverses, investigates or escapes an identifiable psyche-shaped
    counterworld or sequence of such worlds. Its materials may be memories, fears, beliefs or desires; neither literal sleep
    nor virtual-reality technology is required. A constructed town reproducing regressed memory is included, without pretending
    it is physically immaterial.
  fictions:
  - id: eye-in-the-sky
    reason: A lab accident traps eight people in successive worlds governed by different participants' beliefs and fears.
      Their route is through these competing constructed worlds and back out, not simply ordinary life colored by regret.
    sources:
    - https://www.ebsco.com/research-starters/history/eye-sky-philip-k-dick/
    - https://2013philipkdick.philipdick.com/works_novels_eyeinthesky.html
  - id: time-out-of-joint
    reason: Ragle's apparent1959 is an engineered regressive environment inside1998, reproducing the past that his damaged
      memory can inhabit while he serves an Earth-Moon war. Uncovering and getting beyond that bounded counterworld is the
      central trajectory. The town is engineered, not asserted to be an immaterial collective dream.
    sources:
    - https://www.kirkusreviews.com/book-reviews/philip-k-dick/time-out-of-joint/
  - id: the-houses-of-time
    reason: A lucid-dreaming study leads David Grant to pursue an idealized woman across layered realities, with the possibility
      of godlike gifts set against insanity. These are deliberately entered and traversed desire-shaped worlds. Its possible-real-other-realities
      reading remains a Visionary minds boundary, not new evidence of a stable independent multiverse.
    sources:
    - https://www.publishersweekly.com/9780765306104
  - id: destroy-all-monsters
    reason: Two narratives pair contemporary trauma and memory loss with Darkside, a competing fantastic world populated by
      princesses, monsters and a shared version of the friends' lives. Recovering suppressed history and rescuing each other
      connects the worlds. This receives the bounded counterworld placement, rather than treating any trauma theme alone as
      sufficient for Hauntings. No literal independent portal realm is asserted.
    sources:
    - https://www.kirkusreviews.com/book-reviews/sam-j-miller/destroy-all-monsters-miller/
    - https://harperstacks.com/products/destroy-all-monsters-1
  - id: celestial
    reason: Within an alien lunar structure, American/Soviet survivors move through a shared interior generated from multiple
      people's memories, trauma, beliefs and remembered fiction. Their passage through and eventual escape from the mind-dependent
      interior is the main reading experience. Counterfactual1977 and the return to intact craft are retained, not erased.
    sources:
    - https://www.sffworld.com/2022/11/celestial-by-m-d-lachlan/
    - https://theorkneynews.scot/2026/01/18/book-review-celestial-by-m-d-lachlan/
- name: Mindscape hauntings
  count: 3
  definition: Projected-realities fabulation in which unacknowledged people, memory, guilt or buried trauma make the lived
    social world itself uncanny and unstable. The past persists in the present as distorted space, time, recognition and relationships,
    rather than chiefly becoming discrete objects or an identifiable enclosure to traverse. Hauntings names the return of
    the psychic past, not a requirement for literal ghosts.
  fictions:
  - id: peaces
    reason: On a surreal train journey, shared histories and an enigmatic person whom others fail or refuse to acknowledge
      unravel the reality of the present. Recognition, unseen personhood and entangled pasts animate the unstable world. This
      is not a sourced claim that the train is a literal mental prison or that a lover is imaginary.
    sources:
    - https://www.kirkusreviews.com/book-reviews/helen-oyeyemi/peaces/
    - https://www.npr.org/2021/04/07/984743862/too-many-peaces-overload-an-otherwise-entertaining-story
  - id: the-unconsoled
    reason: Ryder's visit to a European city proliferates impossible encounters, space and time which echo guilt, memory and
      emotional obligations. There is no firmly separated outer world and no final awakening which converts the city into
      a solved escape chamber. The ordinary social world itself is made uncanny by the unresolved interior past. SFE also
      offers a controlling-secret-master reading, retained as interpretation rather than fact.
    sources:
    - https://sf-encyclopedia.com/entry/ishiguro_kazuo
    - https://textjournal.scholasticahq.com/article/57577-dream-logic-and-unreliability-in-kazuo-ishiguro-s-_the-unconsoled_
  - id: the-wind-up-bird-chronicle
    reason: Toru's search for a missing cat and then his wife passes into a netherworld beneath Tokyo and into buried Manchurian-war
      experience, joining ordinary domestic life to psychic violence and suppressed history. The competing realities keep
      returning to the past and relationships haunting the present, rather than a demonstrated generated enclosure with an
      external administrator. Its quest/netherworld imagery makes it the closest Odysseys boundary.
    sources:
    - https://www.penguinrandomhouse.com/books/118727/the-wind-up-bird-chronicle-by-haruki-murakami/
- name: Mindscape outbreaks
  count: 2
  definition: Projected-realities fabulation in which memories, desires or visions materialize as objects, organisms or bodily/environmental
    changes spreading into ordinary shared places. A material mental projection, rather than entry into an inner counterworld
    or chiefly unstable recognition of the past, is the central event. Neither infection nor a hostile outbreak is required.
  fictions:
  - id: prophet
    reason: A military drug produces physical approximations of cherished memories, from a diner to dangerous nostalgic objects.
      Material memories spread into ordinary places and ultimately create a rogue memory-object landscape. The mental content
      becomes external things and hazards, rather than remaining an only-entered inner realm.
    sources:
    - https://www.publishersweekly.com/9780802162021
  - id: the-unlimited-dream-company
    reason: The apparently resurrected pilot's visions and desire transform Shepperton into an exotic world of vegetation,
      animals and ecstatic physical change, with transformations and bodily absorption affecting others. A mind spills a competing
      material reality over the existing town. The pilot's confinement is a real Odysseys rival, but his transforming the
      town is the more distinctive whole-book operation. SFE explicitly calls this fantasy; the current placement relies on
      this tree's broad experimental Fabulation gate, not a claim of consensus hard-SF shelving.
    sources:
    - https://www.harpercollins.ca/9780586089958/the-unlimited-dream-company/
    - https://sf-encyclopedia.com/entry/ballard_j_g
name_checks: 'The existing English compound mindscape carries the psyche-plus-experienced-world context, rather than retaining
  a generic parent word or inventing a new fusion. Treks names the journeys through recognizable competing mental counterworlds;
  Hauntings names the psychic past returning in unstable present life; Outbreaks names mental content spreading into material
  shared surroundings. The current918-node tree has no Mindscape/Thoughtform label clash. Full-phrase searches found no matching
  full-name fiction/game franchise for Mindscape treks, Mindscape hauntings or Mindscape outbreaks. The Treks results included
  a Gurren Lagann review using mindscape trek descriptively, not as a title: https://www.renegadepopculture.com/home/gurren-lagann-ep-26-fresh-takes-25
  . Hauntings returned inverted-word fan fiction and descriptive uses, not the full label; Outbreaks returned separated publisher/title
  list words. Not a claim that no unindexed use exists. Earlier candidates were not served: Mindscape labyrinths has a near-identical
  game at https://infinityarcade.com/mindscape-labyrinth ; Mindscape odysseys has a near-identical game at https://infinityarcade.com/mindscape-odyssey
  and an exhibition series at https://danielaschindler.com/en/mindscape_odyssee . Both replaced before proposing names.'
source_limits: 'The first source refresh covered all nine preexisting works before Celestial was committed. Additional current
  author-reference checks and NPR/author-estate refreshes then tested the proposed boundaries. The SFE Murakami article is
  bibliographic only for Wind-Up Bird, not an independent detailed plot account; the direct PRH plot is the positive source
  for its placement. The TEXT article was read as an introductory excerpt, not the complete17-page article. PSNews/Pile by
  the Bed share one Goodman review, not two independent Celestial sources. Existing acceptance is not treated as proof of
  literal mental mechanics: Time Out is engineered, The Unconsoled is interpretively unstable, and SFE calls Unlimited Dream
  Company fantasy.'
boundaries: Wind-Up Bird has genuine quest/netherworld content; Unconsoled has a dreamlike journey; Unlimited Dream Company
  traps its pilot. Best-fit main operations, not a claim of perfectly exclusive metaphysics. No structural/art changes executed.

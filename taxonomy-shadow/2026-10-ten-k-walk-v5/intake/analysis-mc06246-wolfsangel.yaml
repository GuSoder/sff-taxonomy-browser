walk: 'Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Mythic retelling > Norse fantasy.


  Scope first: one five-novel Wolfsangel / Craw world, not five independent queue cards: Wolfsangel (2010), Fenrir (2011),
  Lord of Slaughter (2012), Valkyrie''s Song (2015), The Night Lies Bleeding (2018). ISFDB explicitly groups and numbers all
  five; the author describes the repeated wolf/lost-love story across historical lives, and completed fourth/fifth-book reviews
  trace its continued incarnations and immortality. Publisher and independent final-book reviews identify the fifth as the
  series'' final volume. The representative''s sale of three further books after the first three is a contract, not proof
  of six published novels; only five are established. Celestial and the author''s Mark Alder works are not folded into this
  world. Current paperback dates do not replace original novel dates.


  Root: actual divine incarnations, sorcery, runes and the Fenrir/Ragnarok story govern, not advanced technology, alien intervention
  or an established scientific reincarnation mechanism. Historical SF, Futurist SF and Modern day SF do not describe the whole
  saga. Atemporal SF > Reincarnation fiction is a genuine device-level rival because lives recur across eras, but it loses
  the inherited, operative Norse mythology that explains those lives. This is not an inference that every reincarnation tale
  must be SF. Fabulation > Godgame is a serious formal rival: Odin manipulates the mortal roles and the recurring story, sometimes
  unknowingly acting through his own embodiments. Its established exemplars include Fourth Mansions and The Cosmic Puppets.
  Nevertheless, the saga''s repeated inherited Fenrir narrative and mythic figures are more specific than an experimental
  struggle over the hidden moral pattern of reality. The sources describe historical fantasy and myth reimagining across the
  complete corpus; the WWII finale''s dreamlike narration does not by itself turn all five novels into epistemological fabulation.
  Body-myth, Inner space, New Weird and Parallel worlds capture transformations or late surreal imagery but not a better whole-fiction
  engine. Do not import Celestial''s alien-generated mental reality into this separate world.


  SFE explicitly sees some SF interest and alternate-history equipoise in the fifth book, with Germany seemingly dominant.
  That is retained as a real ambiguity, not denied. Alternate history fantasy > Alt diesel fantasy > Ottensian/Piecraftian
  fantasy is therefore a stronger late-book rival than a mere date match. But an apparently divergent WWII is one final arena
  for a pre-existing mythic cycle, not the founding and governing alternate political world of the five-novel fiction. No
  claim is made that every event follows our historical record, or that no counterfactual outcome occurs. The sources do not
  establish a scientific historical-fork mechanism. A futuristic extrapolation, technical investigation, planetary/space society,
  apocalypse aftermath or contemporary technothriller does not govern this corpus.


  Fantasy setting fork: Real earth fantasy passes positively through historical Scandinavia, the siege of Paris, Constantinople,
  Norman England and WWII Britain/Germany. Fantasy realms'' Epic, Sword and Sorcery, Fairytale, Gothic, Far shores, Comic
  and Heart branches all inherit an invented-world gate that this real historical continuum does not meet. Seid visions, divine
  realms and magical transformations do not alone make the whole fiction a Portal story organized around Earth/world exchange;
  Whimsical doors, Eldritch doors, Transporting tomes and Fantasy rifts lose to the inherited mythic narrative.


  Real earth temporal fork: Historical fantasy passes. Four medieval-era novels lead to a deliberate twentieth-century historical
  finale published in 2018, not to the author''s ordinary present. Contemporary fantasy > Contemporary mythic fantasy > Modern
  European myth > Modern Norse myth is a genuine thematic rival, but its ordinary present-day life gate is not met by WWII,
  much less the earlier four novels. Contemporary Supernatural fantasy > Werewolf fantasy is an especially close creature/identity
  match, yet inherits the same contemporary ancestor and is less specific than the operative Fenrir story. Its other gods/immortality
  branches, Dark fantasy''s Horror/Torment and Urban fantasy''s occult investigation capture motifs and the fifth book''s
  murder case, not a better whole-world route. Contemporary magical realism, Domestic, Magical coming-of-age and Folktale
  do not describe this deliberately historical, violently disruptive divine system. Future fantasy fails a governing future
  Earth; Ragnarok as a prophecy is not a published post-apocalyptic future setting.


  Historical siblings: Period fantasy is substantial. Antique times > Dark age > Viking fantasy fits the first two books''
  historical culture; Medieval Spiritual/Folklore and the later Industrial > Electrified > World wars branches catch later
  settings. Long chronicle fantasy is the strongest period rival because an immortal/reincarnating protagonist and repeated
  love cross centuries. But the period chronology is a sequence of stages on which inherited Fenrir, Odin, Loki, Hel, runes
  and Ragnarok are retold. The myth supplies the story, not simply a supernatural adornment to a long historical biography.
  A single Viking or WWII leaf cannot honestly carry all five. Secret history > Occult cabals/Untold magic is also real, especially
  the SS occult work and hidden divine manipulation. Yet secrecy explaining documented political events is not the saga''s
  defining inquiry; the inescapable mythic roles are. Arcane peoples fails a concealed community as the governing hidden truth.
  Alternate history fantasy is acknowledged above, not dismissed by pretending the final book is medieval.


  Mythic retelling positively passes the author''s direct discussion of inherited Eddic/saga figures and his deliberate reworking
  of their motivations, the repeated Fenrir destiny and the runes'' drive toward Ragnarok. It is reimagining, not a claim
  of faithful transcription or a simple good-Loki/evil-Odin duel: the author specifically rejects that publisher-blurb simplification.
  Norse fantasy''s actual definition includes reimagined Norse and Northern Germanic source material, not only a fixed Viking
  date. Arthurian, Classical, Celtic, Slavic, Biblical, Frankish, Mayan and Japanese siblings fail as the governing inherited
  tradition. Christianity affects the medieval and wartime characters but is not this cycle''s source story. The existing
  Rune Books card likewise stays one fiction despite a late modern-set volume; that is an internal boundary check, not substitute
  evidence about Wolfsangel.


  Decision: the complete five-published-novel shared world enters existing Norse fantasy, four to five fictions. Moderate
  confidence. Long chronicle, Werewolf fantasy, Godgame and the final volume''s alternate-history/occult-war reading are substantive
  alternatives. No definition expansion, new leaf, era split or separate fifth-book card. The threshold of ten is not reached.'
whole_content: 'The first novel follows a Viking prince and the divine forces arranging the Fenrir wolf''s fate. Fenrir replays
  the identities and lost-love pattern around the Viking siege of Paris. Lord of Slaughter carries the myth into tenth-century
  Constantinople and an investigation whose final act reveals the gods behind the apparent human roles. Valkyrie''s Song continues
  Loys and Styliane across a century into Norman England, with the wolf seeking to escape the repeated cycle and Beatrice
  reborn as Tola. The Night Lies Bleeding moves the same continuing mythic problem to the London Blitz and Nazi Germany: Endamon
  Craw''s awakening wolf, a ritual-murder investigation and the SS''s occult experiments converge. Completed criticism covers
  its later shift into the divine half-world and the Ragnarok/fate denouement, not merely its wartime opening. One reader''s
  conclusion places the Nazi doctor''s moral collapse above supernatural terror; another emphasizes the final inextricability
  of Norse myth and fate. Both readings are retained. Exact final survivor lists and a definitive resolution of every cosmological
  question are not supplied by the consulted criticism and are not invented. This is sourced whole-series and ending-aware
  classification, not a claim to have read all five copyrighted novels in full.'
confidence: Moderate. The complete published scope and governing Norse source are well supported; the multi-era shift, final-book
  alternate-history equipoise and divine game create real category overlap. None requires a new leaf when the existing retells-or-reimagines
  gate positively covers the inherited myth across the whole fiction.
scope: One five-published-novel shared world, original years 2010/2011/2012/2015/2018. No sixth published novel established.

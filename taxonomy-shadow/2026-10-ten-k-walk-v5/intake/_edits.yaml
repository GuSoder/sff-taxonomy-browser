new_genres:
- id: mythic-farce
  label: Mythic farce
  parent: earthly-comic-fantasy
  definition: 'Earthly comic fantasy in which gods, myths and legendary beings are loose among mortals and the comedy is theirs:
    Olympians in Prohibition New York, Norse powers inherited by an English clerk, the pantheons of the world played as ironic
    parody. Not Screwball fantasy (the fantastic agent is a god or myth, not a device or a haunting scrambling a love life);
    not Comic noir (no gumshoe frame). Split 2026-10-04 from Earthly comic fantasy at ten cards (curator approval phonemsg-01M43NTTR1HGGN3BC7TWEGMPK6).'
  origin: shadow-v5
- id: screwball-fantasy
  label: Screwball fantasy
  parent: earthly-comic-fantasy
  definition: Earthly comic fantasy in which a supernatural thing - an idol, a haunting, a conjured or made lover, an irresistible
    woman - scrambles a love life or marriage into farce. Not Mythic farce (the agent is not a god or a myth); not Comic noir
    (no detective frame). Split 2026-10-04 from Earthly comic fantasy at ten cards (curator approval phonemsg-01M43NTTR1HGGN3BC7TWEGMPK6).
  origin: shadow-v5
- id: comic-noir
  label: Comic noir
  parent: earthly-comic-fantasy
  definition: 'Earthly comic fantasy told as a detective story: a gumshoe working cases through the marvelous, where the hardboiled
    frame is the joke. Not Noir fantasy (comedy governs, not mood); not Screwball fantasy or Mythic farce (the frame is the
    case, not romance or gods). Split 2026-10-04 from Earthly comic fantasy at ten cards (curator approval phonemsg-01M43NTTR1HGGN3BC7TWEGMPK6).'
  origin: shadow-v5

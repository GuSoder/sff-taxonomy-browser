walk: '# Magic Time whole-fiction walk, 23 November 2026


  Verdict: Post Magicalypse, existing leaf post-magicalypse, 8 to 9 fictions. One completed trilogy, three novels: Magic Time
  (2001, Marc Scott Zicree and Barbara Hambly), Angelfire (2002, Zicree and Maya Kaathryn Bohnhoff), Ghostlands (2004, Zicree
  and Robert Charles Wilson). Later 2002/2003/2005 paperback dates are not first publication. This is original fiction initially
  conceived for television, not a novelization of an existing media franchise. The Angelfire queue row represents the whole
  continuous fiction. No existing Magic Time fiction was found in the current app.


  Evidence: Read publisher/distributor descriptions for all three volumes, contemporary Publishers Weekly reviews of all three,
  Kirkus reviews of all three, SFFaudio''s completed Angelfire review, a completed Ghostlands reader review, series/bibliographic
  records, an older author interview and a community whole-trilogy synopsis. No full-novel reading claimed. Kirkus pages contain
  unrelated appended reviews; those are not evidence for this fiction. The completed finale reader describes the Source as
  a newly discovered energy field manipulated by a man. Preserve this science-fantasy qualification, rather than pretending
  the mechanism is purely supernatural or settled by a blurb.


  Root: Speculative fiction > Fantasy. Published descriptions and contemporary critics consistently describe real magic replacing
  electricity, transformations into dragons and flares, clairvoyance, supernatural music and magically binding contracts.
  Government scientists trigger it and the finale offers new-energy language, but that does not erase the literal magical
  events. Under the user''s magic-first rule, a technical trigger alone does not turn genuine magic into SF. A pure science
  explanation of all these effects is not established by the completed review''s brief energy-field description. Confidence
  moderate-high, with this specific qualification kept visible. Not nonspeculative, not a short work, not a collection or
  anthology.


  Setting: Fantasy > Real earth fantasy. New York, West Virginia, Chicago and the American West form a continuous Earth setting.
  Not Fantasy realms: the Changed America remains ours, not an independently invented world. Portal fantasy is a real rival
  because PW describes a dimensional shift and the finale includes a temporary magical recovery of Tina. But the whole-fiction
  organizing engine is the same Earth remade by the Change, not travel among worlds, a stable otherworld destination or a
  world-hopping cosmology. World Bleeds is narrower: a hidden world''s leak is the engine without travel or discovery. Here
  the world-changing collapse and subsequent survival/rescue quest are the engine. Otherworld summonings/stumblings, gateways,
  mirror worlds, planetary portals and transporting tomes lack positive defining evidence. Anchored-threshold uncanny/fairy/nightmare
  shelves would mistake one finale episode for the whole trilogy.


  Temporal: Real earth fantasy > Future fantasy. This is the closest call: volume one starts in its contemporary Manhattan
  and dramatizes the catastrophe. Across the complete trilogy the old technological civilization has fallen and the characters
  travel and survive in its immediate remnant world. Angelfire and Ghostlands are sustained journeys across the altered America
  left by the Change; the finale keeps the changed world rather than restoring ordinary society. The actual Future fantasy
  definition explicitly includes the aftermath of a Change, not only distant-future settings. That whole-fiction condition
  beats the contemporary opening. Not Historical fantasy: no past-period setting, secret history, alternate historical divergence
  or inherited myth retelling organizes the fiction.


  Future fantasy siblings: Post-apocalyptic fantasy fits because the old world fell and the bulk of the whole fiction concerns
  its remnant world. End-times fantasy fails: no biblical angel-and-demon apocalypse is established; the Source and transformed
  humans are not a biblical end-days system. Vampire future fails, as the future never-fell vampire city gate does not apply.
  Psi future fails because society has fallen and this is not the never-fell psychic social order.


  Post-apocalyptic fantasy > Post Magicalypse. The Change both drains technology and creates the magical transformations that
  destroy the old order. The leaf explicitly permits mixed magical and technological causes and requires life in the aftermath,
  both met. Fantasy after Disaster is the direct rival, but there is no separate secular war, climate catastrophe or nuclear
  devastation followed independently by magic. The experimental catastrophe is the magical event itself, and source descriptions
  consistently make its magical effects material causes. The new-energy reading remains a qualification, not evidence of a
  different antecedent secular catastrophe. No definition widened and no new leaf needed.


  Contemporary rivals tested against the whole: Paranormal aftermath lives inside a publicly known new civic order, whereas
  this is a cross-country journey after civilization''s collapse, matching the more specific future-aftermath branch. Modern
  technomancy has magic operating through technology/media inside modern occult life; here technology ceases and the world
  falls, not merely an engineered magic tool or cursed film. Contemporary invented myth would privilege a cosmology over the
  collapse and survival quest. Dark fantasy, hellscape horror and elder-god torment are genuine tonal/antagonist rivals, but
  there is no literal Hell and the whole trilogy is an ensemble rescue/recovery journey with an affirming altered-world ending,
  not a person-following tormentor or cursed-place horror engine. The lawyer-dragon changes allegiance. Urban fantasy''s city
  soul, fae, occult cases/services and civic categories are not the trilogy''s engine; cities are stages along a nationwide
  journey. Domestic fantasy fails because family rescue is motivation, not household life as the main site. Magical coming-of-age
  fails because adult Cal and ensemble carry the story, not a young person''s magical education. Modern inherited myth branches
  lack a single inherited tradition anchoring the whole, despite Indigenous motifs. Magic realism fails because the Change
  is catastrophic, named and struggled against, not the unannounced marvel accepted as ordinary. Folktale/comic/animal shelves
  fail their governing fable or comic engines.


  Scope and dates: Contemporary PW and Kirkus evidence, plus ISFDB, support 2001/2002/2004 first publications. Bibliographic
  paperback records and community accounts use 2002/2003/2005; retain them as edition dates, not another trilogy. Four authors
  credited at fiction level, correct pair at each book. No expansions or unrelated novels inferred.


  Covers: Three coordinated Iain McCaig illustrated English fronts supplied by the HarperCollins listings at Open Road Media.
  Actual downloaded 300x478, 300x482 and 300x476 files inspected. Full title and correct author pair readable, flat fronts,
  no spine/crop/library markings. Hotlink the exact observed CDN URLs. Downloads are private research only, no cover files
  added to repository. Existing Post Magicalypse portrait remains unchanged.

  '

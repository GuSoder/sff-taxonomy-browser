    definition: 'Generation-starship societies whose founding mission is one new home: a single destination world the ship
      was launched to reach and settle. The mission may be forgotten, hijacked, interrupted, failed at the planet or fulfilled,
      and the story can be about any of those turns; what defines the shelf is that the ship exists to arrive. Not Star seeding,
      where one vessel delivers settlements to many stars, and not Vagabond starship, where the ship itself is the permanent
      home.'

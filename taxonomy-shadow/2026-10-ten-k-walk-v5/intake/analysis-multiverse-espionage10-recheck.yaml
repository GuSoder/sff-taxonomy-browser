notes: '# Content-first findings, 22 November 2026


  ## Scope inventory

  - Rabbit in the Moon: one 2024 novel. Author calls it Lynchian SF-horror and two futures, one Inuit-stable and one Neo-Aztec
  posthuman. Primary publisher/agent say realities merge and logic breaks. Complete readers describe quest journeys, converging
  identities and a metaphysical near-awakening ending. Exact final mechanics remain unverified. Do not invent a literal dream
  or reincarnation explanation.

  - Journals of Zaxony Delatree: Doors of Sleep 2021 and Prison of Sleep 2022, a completed duology confirmed by author bibliography,
  publisher and multiple completed reviews. The publisher explicitly explains alien parasite and interdimensional chemical,
  so the cult''s god terminology does not force fantasy. Strong rival Multiverse longing, because Ana seeks Zax throughout;
  retain covert-war home because first tyrant and then Sleepers versus world-destroying cult organize the whole plot, and
  reunion alone does not resolve it.

  - Nigh-Space: Knife and Serpent 2024 and Jewel and Comet 2026. Author confirms same ongoing characters; standalone marketing
  means independently readable, not separate world. The 2026 sequel follows Interventionist agents and universe-destroying
  entities; independent reviewers disagree about whether the romance overwhelms the story. Strong rival longing/selves, but
  whole two-book institution and missions still supply the causation. Related shorts are acknowledged, not counted as novels.

  - Formation Saga: Transience 2025 and Transgression 2026. Transformation is March 2027, excluded. Many Worlds/Simulacra
  is a shared-world story anthology, not a third novel. Author/publisher and two independent first-book reviews foreground
  proxies, intelligence officers, rival societies and cold-war machinations. Sequel review explicitly describes local magic
  and gun-and-wand worlds: old no-magic assertion is too strong and must be removed. Keep SF because the organizing cosmology
  and transfer of minds between realities are SF, with differing physical laws; do not claim all local magic is proven technological.
  Fantasy worldhopper rival fails Earth-including ancestor: invented cosmology is not established as including our Earth.
  Open invasion is a real rival as imperial eviction escalates, but published two-volume engine remains institutions and competing
  operatives, not a cross-world army campaign. Moderate confidence, do not classify from unpublished final-volume army blurb.

  - Crosstime: Crossroads of Time 1956 and Quest Crosstime 1965. Estate dedicated page confirms 1956, omnibus page''s 1962
  rejected. Secret corps hunts mastermind and rescues across parallel tracks; psychic gifts are present. No chronological
  travel, the name is misleading. Existing covert-world-war fit retained.

  - Merchant Princes: six originals plus Empire Games 2017, Dark State 2018, Invisible Sun 2021, nine novels. Remove Bloodline
  Feud as duplicate omnibus representation, add Merchants War 2007 and three Empire Games novels. Original six end 2010, author
  FAQ''s 2009 claim contradicted by novel records. Revised omnibus trilogy acknowledged as editions, not counted in addition.
  Whole ending includes nuclear strikes and alien invasion, but complete Locus nine-volume review emphasizes spies, moles,
  sleeper cells and hidden tradecraft as main continuity. Existing espionage retained, moderate confidence.

  - Crosstime Traffic: six novels, 2003-2008. In High Places nominal 2006 catalog/copyright versus December 27, 2005 first
  release. Keep earliest 2005, flag catalog disagreement rather than silently switch to 2006. Secret trade organization, kidnappers
  and secret portals across divergent Earths, not historical time travel.

  - Transition: one 2009 novel, not Culture. Concern''s body-hopping assassins and factional fight over control of worlds;
  real psychological/identity issues do not replace institutional intervention. Existing espionage retained.

  - Zero World: one 2015 novel, not 2016 paperback date and not Dire Earth despite bonus novella. Official description plus
  three completed reviews: implant-erased assassin and local spy both seek same scientist whose transferred tech changes war.
  Covert technological missions across twin Earths, not self-quest or open cross-world army.

  - Beyonders: one 1977 novel, complete current placement research already recorded. Keep. Parallel-universe covert agents,
  clan collaboration, gate-opening stopped before full invasion. Neither Silver John fantasy nor Brandon Mull series.


  ## Rabbit root walk, provisional verdict

  The inherited covert-war placement is not sustained by any completed source read. Fighting an ecological collapse and being
  embedded with local soldiers is not inter-world espionage. No agents/couriers/clans running a covert cross-world war are
  established. Do not stretch world-repair to cover any effort to save a world.


  Actual tree: Speculative fiction > Science fiction > Atemporal SF > Fabulation > Alternate worlds. Alternate worlds explicitly
  covers literary alternate Earths destabilizing memory, geography and history rather than mechanism-centered travel. The
  author/agent''s realities merging and logic fracturing, two postclimate successor societies, same-symbol protagonists and
  completed readers'' unstable/metaphysical ending make that an honest existing leaf. Moderate confidence; exact ontological
  answer not established, and not claimed. This is a one-fiction move under owner''s judgment grant, not a new definition
  or structural action.


  Serious rivals: Multiverse selves has doubles, but requires the journey to serve confronting identity; available plot is
  ecological quest and destabilized realities, not a demonstrated intimate identity journey. Multiverse mirror requires histories
  as counterfactual comparison, not immersion in two collapsing futures. Projected realities and its Mindscape treks require
  an identifiable psyche-shaped counterworld; near-awakening comments are not enough to assert that mechanism. Consciousness
  fiction needs altered/divided consciousness as engine; exact ending unverified, so do not infer it. Home weird has biotech/ecological
  horror, but unstable alternate Earths are the more specific organizer. Futurist ecological leaves capture main surface landscape
  but not the two overlapping realities and disrupted ontology. Fantasy root considered seriously, but author SF-horror and
  biotech/posthuman framing do not establish material supernatural causation. No actual time travel established despite different
  future times, no chronology switch inferred from marketing.


  If move survives final source audit, Multiverse espionage becomes nine and split trigger is withdrawn. No structural proposal
  needed. Intake resumes only after repairs deployed and visually verified.

  '

scope: 'One continuing world, two currently published novels: Time Trials2023 and Ice Trials2024. Queue2020 not supported
  by contemporary author announcement or original publisher dates. No completed-duology claim. Other collaborations and either
  author''s other worlds not folded.'
walk: 'Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Time machines > Time travel agency > Time
  agency thrillers.

  Root: Earth archaeologists cross actual historical eras, and apparently Egyptian divine monsters are alien predators. SFE
  explicitly treats the two-book sequence as SF/time travel; the sequel primary narrative exposes a computational test administrator,
  a supervising hive intelligence, monitored temporal coordinates, error handling, and transit to a new test location. Alien
  ankh devices are also explicit. Kirkus calls book1 supernatural and readers describe magical gifts, while marketing calls
  the series LitRPG. Those are retained surface rivals, not a reason to ignore the primary technological frame. The chapter1
  administrator passage is decisive evidence that reversed an initial Timetribe/unexplained-slip lead. No claim that the physics
  is rigorously explained, that all mysteries are solved, or that all events are merely a VR game.

  Fantasy''s full setting alternatives fail at the causal root. Real earth > Historical > Prehistoric fantasy, Secret history
  and Mythic retelling could catch the landscape and godlike Egyptian enemies if magic were the explanation. Here aliens and
  administered SF trials supply the explanation, not an inherited myth retold as true magic. Contemporary fantasy is only
  the departure frame, not the ongoing story. Fantasy realms lacks an invented-world-only setting; Portal fantasy''s Earth
  gate would pass, but a mysterious crossing by itself is not magic-side proof, and these are Earth''s eras in an SF engine.
  No need to open an Egyptian fantasy leaf for alien-god imagery.

  SF whole root sibling walk: Historical SF > Hidden history is a substantial setting rival for aliens in Earth''s unrecorded
  past, but any SF time travel is explicitly sorted Atemporal, superseding dates. Period SF is not supplied by archaeological
  artifacts or an aesthetic steam/retro era; Alternate history is not just protecting or potentially altering history through
  time travel; Proto SF fails the publication/contemporary-in-its-era premise. Modern-day SF > Alien invasion or First contact
  captures the species threat but loses both the historical destinations and the any-time rule. Its apocalypse, biotechnology,
  technothriller and social branches do not improve the temporal mechanism fit. Futurist > Alien fiction > Alien cosmic history/Anthropological,
  and possibly Future of Earth > Techno-fiction > Cyberpunk > LitRPG, are genuine SF rivals: cosmic testing, ancient cultures,
  game-like abilities and computer control matter. But this is not simply characters playing in a recognizable future cyberpunk
  game world, and the actual time travel is explicit in both books. Spacefaring and Hard SF likewise lose to that rule; no
  central space voyage or rigorously constrained scientific problem-solving is established.

  Atemporal alternatives: Parallel world fiction is tempting because the supervising intelligence surveys multiple universes
  and encounters an external signal. That is a frame, not evidence that the party''s crossings chiefly explore alternative
  Earths; the explicit temporal travel governs. Science fantasy catches alien powers dressed as magic, but is likewise superseded
  by the explicit time gate. Fabulation/Godgame is not literal cosmic supervision alone: the branch requires foregrounded
  storytelling and unreliable reality as experimental art. New Weird does not follow merely from monstrous enemies. Reincarnation
  has no successive-lives engine.

  Every Time travel child tested: Hard time travel fails rigorous physics, despite technical vocabulary. Ancestral fails kinship
  determining destinations. Time loops fails repeated reliving. Mind over time is a real local rival because Marty has visions
  and Gunther seeks mental contact, but these do not cause or own the group''s temporal relocation; chapter1 separately shows
  the administering system relocating subjects. Time travel disorders fails a bodily medical condition as cause, Time tonics
  fails an ingested treatment, Time distortion fails unequal local rates as main engine, and Time crossroads fails a keeper-run
  hub where multiple-era travelers meet. Time door is a serious visible rival because the party returns to the original chamber
  and book2 involves another portal. These are nodes of an administered test, not a passage simply there for travelers to
  use at will; the system can change their destination and erase test subjects. Timeslips initially looked plausible from
  SFE''s brief mechanism description. Time strays > Timetribe accurately describes the displaced group at the character level,
  Timestranded fails a group, Timetide fails unexplained autonomous oscillations, and Time bleeds/Time tangles fail their
  leak/interwoven-life engines. Timetribe''s inherited unexplained/natural shift gate loses to the primary controller passage;
  do not classify from the protagonists'' ignorance alone.

  Time machines positively passes its built-device OR institutional-apparatus definition: a supervising computational apparatus
  tracks Earth-relative dates, runs a test matrix and handles a transport fault that sends the party to another test node.
  Not a homebrew inventor''s private device, whether DIY rewind or Overclockian; the institution/controller owns the process.
  Owner test: remove the administering test system and its oversight, and the temporal trial apparatus has no owner. The sponsoring
  archaeological financier does not own it merely by funding the dig. Time travel agency therefore passes. Classic agencies
  loses its classic-era/patrol register; Time agency revival loses the literary/emotional institution-first sensibility. Time
  agency thrillers fits: involuntary civilian champions are put through lethal historical missions, alien opposition and covert
  interference within the controlling process. They need not be willing salaried agency employees. The leaf''s owner-approved
  widening already removed its former1990s-2000s date restriction; no definition change is needed for2023/2024 books.

  Decision: one two-published-novel fiction in existing Time agency thrillers8->9. No seed, split, definition change or portrait.
  Overall moderate confidence: SF/time travel is strong; institutional control is explicit primary evidence, but the administered-game
  register and involuntary archaeologists make Timetribe, Time door and LitRPG meaningful rivals. Do not claim a completed
  duology or a full resolution of the test''s ultimate cosmology.'
whole_content: 'Time Trials2023: modern Egyptologist Marty Cohen joins an eccentric financier''s archaeological team, discovers
  anomalous writing, and the group is thrown into ancient North Africa. Distinct experts gain unusual abilities and must survive,
  help native people and oppose alien creatures resembling Egyptian gods. Completed first-book review identifies the historical
  intervention around Narmer, and Ice Trials chapter2 supplies the prior-book outcome: the surviving group has only narrowly
  passed a judging process, which weighs the death of Abdullah and their help of native communities. Returning to the first
  chamber did not take them home.

  Ice Trials2024 continues the same six survivors in a much earlier island society, not a separate unrelated game world. Chapter1
  explicitly switches to a supervising hive intelligence and administrator: an error in an administered test changes the subjects''
  temporal destination; an interfering signal reaches Gunther from beyond the monitored universe. Chapters2/3 establish the
  group''s uncertainty, local relationships and alien ankh devices rather than a purely supernatural explanation. The island
  plot develops Surjan''s kingship, sacred sites and the flood threat; publisher specifies Marty''s crisis between the island
  people and his party. Completed-reader responses confirm continuing alien backstory and an open next-adventure trajectory.
  No source read supports declaring the series finished. This is whole published-series coverage from primary/review accounts,
  not a claim of reading either complete copyrighted novel; detailed final flood resolution in book2 remains unverified and
  is not invented.'
confidence: Moderate. Primary Ice Trials chapter1 and book1 outcome recap overturn the initial unexplained-slip hypothesis
  with an administered temporal testing system. Time door, Timetribe and LitRPG retain real surface claims. Public book2 completed-reader
  accounts are brief; no detailed final flood outcome is asserted. A later published volume or primary revelation removing
  actual temporal/institutional control would require a rewalk.

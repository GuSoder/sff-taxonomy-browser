walk: 'Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction > Cyberpunk > Postcyberpunk
  > Cyberheist.


  Scope: expand and re-walk the existing Hammajang Luck fiction into one Kepler Station sequence card, containing Hammajang
  Luck (2024) and The Obake Code (2026). SFE explicitly calls the former the beginning of a Kepler Station sequence; the author
  confirms a standalone sequel set three years later with returning hacker Malia and other crew, and a forthcoming standalone
  prequel Tell Me No Bulai about Duke/Nakano. These are shared world, not separate fictions merely because each can be read
  alone. Primary interview says the prequel was expected sometime2027 with no firm date, so exclude it. Author site''s currently
  described published books are the two existing novels. No unrelated earlier unpublished queried novel folded. Hammajang''s
  regional dates conflict only at day/edition level: Hachette Australia lists10December2024 trade paperback and12December
  ebook, Locus and SFE give December2024 original Gollancz; US14January2025 is another edition, not first-fiction year. Obake
  current US publisher17February2026 and UK19February2026, October paperback another edition. A database search excerpt''s10February2026
  is not stronger than current primary publisher. Use2024and2026, not fabricated synchronized dates. Eighteen fetched/read
  sources across author/publisher, professional reference/criticism and independent/community completed readers. No full-novel
  reading claimed.


  Own-book engines: Hammajang returns Edie from an eight-year prison sentence to a gentrified Kepler Station, family responsibilities
  and unaffordable cancer treatment. Angel who betrayed Edie has arranged release and proposes a last job against trillionaire
  Joyce Atlas. A crew of physical and technical specialists trains to steal prototypes/blueprints of technology that can rewrite
  memory, then ransom them back. Atlas''s communications/surveillance corporation profits by taking privacy, home, health
  and body autonomy. The first third assembles the team; a sustained heist concludes the operation. Edie''s runner knowledge
  and physical safe make Space caper a serious existing fit. Romance and family make them socially embedded rather than a
  lone nihilistic hacker, although crime/noir and betrayal are real. Completed readers call the final heist clever and successful,
  while some find preparations too smooth or relationship underdeveloped. No need to invent exact final dollar allocation
  or betrayal resolution from a jacket.


  Obake: Malia, a former member of that crew, has retired rich but is isolated and bored. Her neural/cybernetic modifications
  let her rig fights; a gang forces her to compromise a politician, and she forms a smaller crew to steal career-ending secrets.
  The politician''s connection to her childhood experimenter and degrading mods expands this into identity theft, dangerous
  AI and coercive invasion of her mind through the GhostNet. Professional completed criticism explicitly says the operations
  and side missions occupy more of this novel than the first and the heist is not a detachable opening. Other completed accounts
  emphasize recovery of identity/relationships and respite/reflection after the dangerous action; Utopia questions the compressed
  ending and thin supporting characters. The titular code is a personal no-attachments rule, not proof of literal RPG mechanics.
  Both the real network and personal code are tested. A romance with Sol matters but does not replace crime/conspiracy as
  the cause of danger and resolution. The two books'' differing protagonists and tones are preserved, not compressed into
  a claim that Edie is a hacker or Malia already has a comfortable supportive life at the opening.


  Root: explicit SF technology, orbital station, artificial sky, communications networks, brain/body mods, memory engineering,
  AI and information theft. The GhostNet, ghost/Obake name and surreal sensory writing do not establish supernatural spirits
  or magic. Therefore SF over Fantasy or science-fantasy leaf. The setting is future human society, not an alternate historical
  divergence, and no time-travel paradox, counterfactual timeline or purely metafictional frame governs. Futurist over alternate
  futures or fabulation: technological/social extrapolation, not literal contradiction as experience.


  Futurist''s four children: Future of Earth fiction and Spacefaring are genuine overlapping gateways. Earth-descended Hawaiian
  culture, climate/corporate displacement, human networked inequality, gentrification, healthcare and body/mind ownership
  are the material being extrapolated. Current Future of Earth explicitly includes Earth-descended life and human society.
  It is not restricted to present Earth geography. Both novels stay tightly with one station''s near-contemporary social/technical
  problems; space travel, settlement ecology or relations between civilizations are not the governing object. Spacefaring''s
  setting is literal, but its actual definition says fundamentally about travel/settlement/conflict/civilization beyond Earth.
  This sequence''s specific interest is networked institutions and engineered selves in a transported city. Do not deny space
  setting or silently impose an Earth-only exclusion that the definition no longer has. Hard SF fails rigorous physical constraint/engineering
  investigation as main experience; technologies serve the caper and social extrapolation, not scientific derivation. Alien
  fiction lacks nonhuman life/contact as organizing problem.


  Spacefaring full rival walk: Space opera > New space opera > Space adventure > Space caper is the existing placement and
  strong rival. Crew assembly, plans, disguises, escapes, betrayal and momentum satisfy the leaf. The parent is adventure-forward
  and can include an invented space city. Yet the whole''s most precise shared mechanism is jobs against surveillance, memory-control
  and neural networks, not swashbuckling travel with interchangeable futuristic props. The second novel makes invasive interface/identity
  control central, and the first target is already a corporate brain/memory technology monopoly, not a generic treasure safe.
  Future history in space lacks a sustained course of civilization; military lacks ranks/campaigns; Techno fiction in space/hard-SF
  siblings lack central rigorous otherworld engineering; generation starships lack mission/generational succession; Space
  dystopias sees real class oppression but not a spaceship/planet totalitarian social-order premise governing the caper whole.
  Space colonies > Space habitat life has daily station conditions and class levels, but not keeping air/water/walls viable
  or colony settlement as the central experience. Space colony politics/Space mystery have corrupt politician or secrets,
  yet actual cases/heist operations and networked exploitation are not governance/community-survival whole. Comic space fiction
  fails comedy/satire as primary engine: funny banter is texture. Political space opera fails multiple large interstellar
  powers and their relations; Theological transcendence absent; Space western frontier absent; Space soap/romance/Spaceship
  drama loses because personal bonds humanize the job but this is not relationship drama in a ship/family voyage. Space chase
  or Space combat would mistake consequence for cause. The existing Space caper judgment was honest for the first book and
  is not called a mistake, but the expanded published whole supports a more exact network-job leaf.


  Future-of-Earth siblings: Techno fiction passes minds/bodies/networks altered by engineered systems. Dystopian fiction recognizes
  Atlas''s monopoly and later gentrification/tough-on-crime politician, but no standalone governing template of closed oppressive
  social order displaces the job and brain-interface machinery. Future societies recognizes inequality/culture but does not
  supply a stronger nontechnical social-change premise. Utopian fails ideal society as subject; Future war lacks conflict
  among armies/polities; Psionics lacks innate paranormal mental power, the interfaces are engineered. Within Techno, Posthuman
  > Remade bodies > Cyborgs is a genuine rival for Malia''s altered embodiment and its cost. But both books are not chiefly
  bodily metamorphosis/new species; enhancement and its ownership supply capabilities/targets and hazards within jobs against
  the technological order. Copied/Rewired minds and AI awakening/overlords likewise capture actual memory/AI strands but not
  both complete operations. No biotechnology/clone/robot core replacing network politics.


  Cyberpunk parent passes invasive high tech, surveillance monopoly, inequality, corporate body/mind exploitation and the
  use of crime/technology against the networked order, independently supported by author calling it cyberpunk and critics,
  not those labels alone. Metaverse''s persistent immersive avatar place is not the sequence''s main experience: GhostNet
  appears vividly but it is a communication/brain interface and attack vector, not life primarily inside a shared VR world.
  Platform/private access would be an invented primary axis here. LitRPG fails literal levels/stats/respawn despite Malia''s
  game-development credits and gaming/TTRPG inspiration. Neural fiction is a major second-book rival: direct brain passage,
  altered consciousness and memories not her own are central to Malia. But Edie''s primary first-book role is physical and
  the crew''s memory-technology theft is not mainly an experienced altered-reality journey; the whole''s job mechanism remains
  wider. Cyberpunk noir is also serious because forced criminal jobs, ruthless gangs, betrayal, unsafe identity and isolated
  Malia are textbook noir. The author explicitly says the sequel is darker, twistier and weirder, while classical Neuromancer
  influenced its prose. Do not treat found family as automatically negating noir. However, the first novel foregrounds existing
  sibling/neighborhood ties and the loved crew, and the sequel''s actual trajectory is out of no-attachments alienation into
  mutual love/support, followed by respite, not an endless descent through hardboiled moral wreckage. Social embeddedness,
  recovery of a livable community and effective cooperation govern the shared experience more strongly than classic noir alienation.
  Moderate-confidence parent priority, not a claim every chapter is cheerful.


  Postcyberpunk siblings: Cyberheist explicitly means jobs against the system from inside it, crews, sabotage and heists in
  the networked order. Both physical theft and hacking qualify; it does not require the protagonist to spend the whole novel
  at a terminal. This shared world is saturated by technologically mediated class power and memory/body appropriation, and
  the crew uses insider expertise against it. The word near-now in the parent is about recognizable networks/social extrapolation,
  not a hard year ceiling: far-future/space Jean le Flambeur already sits here with a well-grounded heist rationale. This
  is comparative consistency, not permission to stretch an ancestor on count alone. Terms of Service has ubiquitous surveillance
  as air, but ordinary life coping with rankings/platform rules is not the plot; jobs/operations are. Revolutionary cyberpunk
  requires building an alternative institutional/network order, not just robbing or disrupting existing exploitation. The
  promised2027prequel concerns revolutionary thieves but is not already published and its title/marketing cannot reclassify
  the actual two books. Cyberheist currently6, becomes7; existing Space caper8becomes7. Net fiction count unchanged; add one
  published book, replacing old single no-books card with one explicit two-book card. Keep stable fiction id/title Hammajang
  Luck for continuity, note Kepler Station sequence scope in the record instead of implying an official publisher series title.


  Evidence caveats: SFE calls Hammajang near-future, while some author language says far-future; relative century is not established
  precisely and unnecessary. Locus/other reviewers disagree whether characters/smooth preparations or greater suspense dominate.
  Retain those differences, not a universal claim the first is tense throughout. Author site''s introductory2024Locus-finalist
  line conflicts with its own later2025award line and professional sources; award year not material, do not propagate erroneous
  promotion. Library Journal''s FANTASY metadata conflicts with title/substantive review and primary SF identification, not
  an actual supernatural mechanism. No model-generated plot-summary site used. Detailed identity-takeover/AI and aftermath
  are supported by completed accounts but no exact unverified escape code or death invented. Planned prequel2027not counted
  and no claim it is a literal trilogy, author says interconnected standalone novels.


  Decision: expand the one existing Hammajang Luck fiction to two published novels2024/2026 and move its shared whole from
  Space caper to existing Cyberheist,6to7, Space caper8to7. Moderate confidence; Space caper and Cyberpunk noir genuine rivals,
  Neural fiction and Cyborgs important partial fits. No structure/definition/portrait change. Complete matching English UKpublisher
  fronts visually inspected,440x690and439x674, readable uncropped title/author, modest resolution disclosed. Sources/notes/report,
  live old-record/capacity preflight, repository/app preservation, full validation, deployment and pixel QA still required.


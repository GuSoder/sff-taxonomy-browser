    definition: Future-set Earthbound science fiction driven by psychology, sociology, anthropology, linguistics and other
      social sciences rather than physical or engineering problems. A society examined at a particular future moment belongs
      here; a sustained course across time belongs to Future history of Earth. This is a curator-chosen descriptive name,
      not a claim of an established genre term.
    id: future-social-sf
    image: 452-future-social-sf.webp
    label: Future social SF
    parent: future-societies
    status: accepted
    works:
    - authors:
      - Michael J. Martineck
      cover_url: cover-the-tongue-trade.jpg
      placement_note: 'Root-down: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future
        societies -> Future social SF. A century-future Earth society has mutually unintelligible professional dialects; interpreter
        William Kirst''s confidentiality oath traps him in a murder conspiracy. Linguistics and social mediation govern, not
        a gadget. Modern-day Social science fiction fails its temporal parent; Alien fiction/Earthborn fails browser expectations
        because this is Earthbound, not human-descended cultures in space. Dystopian-future children, Psionics, Techno fiction,
        Future war and Utopian fiction do not supply the engine. Future history of Earth fails the sustained-course gate:
        this is one future investigation. Curator explicitly chose the Future societies umbrella and Future social SF leaf,
        then Execute on 2026-09-30.'
      shows_english_title: true
      title: The Tongue Trade
      year: 2024
    - authors:
      - Frederik Pohl
      books:
      - cover_url: https://covers.openlibrary.org/b/id/9320618-L.jpg
        title: The Age of the Pussyfoot
        year: 1969
      cover_url: https://covers.openlibrary.org/b/id/9320618-L.jpg
      placement_note: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Future societies
        > Future social SF. Per Wikipedia and ISFDB: a 20th-century man killed in a fire in 1969 is revived from cryopreservation
        in 2527, and the story is his attempt to fit into the society of that era, its joymaker computers, its customs of
        marriage and parenthood, and the hunting license someone has taken out on him. A society examined at a particular
        future moment, through an outsider learning its rules, is the Future social SF definition. Rejected: Satirical utopia
        (that leaf holds apparently ideal societies satirizing the reader''s own world, and this one is not offered as an
        ideal), Sociological SF (the leaf names a group as the experiment, not a whole future society), Future history of
        Earth (no sustained course across time). Wobble: the book is comic and satirical and has a hunted-man thriller thread.
        Year 1969, the Trident book per ISFDB (an expansion of the 1965-66 Galaxy serial).'
      shows_english_title: true
      title: The Age of the Pussyfoot
      year: 1969
    - authors:
      - L. E. Modesitt, Jr.
      books:
      - cover_url: https://covers.openlibrary.org/b/id/182549-L.jpg
        title: Adiamante
        year: 1996
      cover_url: https://covers.openlibrary.org/b/id/182549-L.jpg
      placement_note: 'Modesitt''s Adiamante (Tor, Oct 1996; ISFDB, Publishers Weekly): in the far future Earth, long the
        abandoned capital of a star empire, has rebuilt itself as a society of conservation and nonaggression, and its code
        forbids offensive action until it is attacked. A fleet of twelve warships of near-indestructible adiamante from a
        former colony arrives to force surrender, and the planetary coordinator Ecktor deJanes has to defend the world without
        breaking those principles. Walk: Science fiction > Futurist > Future of Earth fiction > Future societies > Future
        social SF (an Earthbound society examined at one future moment, driven by its social design). Rejected: Future war
        (the book is not about technology-transformed fighting; the fleet is in orbit and the question is whether a nonaggressive
        code can hold), Future history of Earth (no sustained course across time), Secluded utopias and Utopian fiction (the
        society is the premise, but the plot is its test under siege, not its construction), Space colony politics (the story
        stays on Earth), Space armada (the fleet is the threat, not the viewpoint). Wobble moderate: the siege is a military
        plot and sources are the flap copy and one review. Queue year 2010 is a reissue; first publication 1996. Queue id
        MC05662.'
      shows_english_title: true
      title: Adiamante
      year: 1996
    - authors:
      - Philip K. Dick
      books:
      - cover_url: https://covers.openlibrary.org/b/id/9249829-L.jpg
        title: Solar Lottery
        year: 1955
      cover_url: https://covers.openlibrary.org/b/id/9249829-L.jpg
      placement_note: 'Philip K. Dick''s Solar Lottery (Ace, 1955; Wikipedia): the world government is run by a Quizmaster
        chosen by a computerized lottery, with a televised random selection of an assassin, so that the leader gains the respect
        of the people by surviving telepathic-guarded attempts on his life, in a society built on minimax game theory; the
        story follows the idealistic worker Ted Benteley. Walk: Science fiction > Futurist > Future of Earth > Future societies
        > Future social SF (a society examined at a future moment through social science, here game theory and sortition).
        Tried: Future history of Earth (one moment, not a sustained course) and Orwellian dystopia (the lottery is the legitimate
        order, not coercion by a state).'
      shows_english_title: true
      title: Solar Lottery
      year: 1955
    - authors:
      - L. E. Modesitt
      books:
      - title: 'Archform: Beauty'
        year: 2002
      - title: Flash
        year: 2004
      cover_url: https://upload.wikimedia.org/wikipedia/en/c/c8/Archform_Beauty_cover.jpg
      placement_note: 'L. E. Modesitt''s Archform: Beauty (2002; with Flash 2004, set in the same world earlier; Modesitt''s
        site, Wikipedia): in a 24th-century Earth society where no one wants for anything, technology supplies every need
        and the story examines what art, beauty and politics mean there; Flash is the 22nd-century prequel about science,
        advertising and politics. One shared world, so one fiction. Walk: Futurist > Future of Earth > Future societies >
        Future social SF (a society examined at a moment, driven by social questions). Sources: Modesitt''s site, Wikipedia;
        not read. Alternative: Future history of Earth.'
      shows_english_title: true
      title: 'Archform: Beauty'
      year: 2002

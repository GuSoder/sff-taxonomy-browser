rationale: '# Earthweb whole-fiction walk, 23 November 2026


  Verdict: Future social SF, ninth to tenth fiction, requiring an immediate split proposal. Do not publish the tenth without
  preparing that proposal and pausing further intake. This is the working verdict, not an executed placement or an approved
  split.


  Scope: MC06300 and MC06301 identify one novel and its revised second edition, not two novels. First publication is 1999,
  not the queue''s 2008 ebook date. Baen dates the second edition 24 January 2018, while ISFDB gives 25 January. Baen advertises
  a new afterword; a completed reader of both editions reports reordered chapters, fuller characters and a slight plot change.
  Do not reduce the revision to afterword-only or present it as a sequel. The cover-of-David''s-Sling reference inside Earthweb
  is a metafictional joke, not evidence that their events share one universe. No positive same-world binding found in the
  checked author/publisher bibliography. Represent one novel, noting the 2018 revision in metadata rather than inflating the
  fiction to two novels.


  Evidence read: primary publisher descriptions, opening chapters one through three of the second-edition sample as supplied,
  ISFDB publication record, complete Chris Hibbert contemporary review, complete Aaron Swartz review, complete Momentary Fascinations
  essay, and the retrieved Goodreads reviews including completed-story and revised-edition comments. Reason''s 1998 symposium
  adds contemporary reception of the forecast markets. No full-novel reading claimed. The chapter-two sample ends abruptly
  during the stranded missile commander''s section; do not describe the sample as a complete novel or every source chapter
  as unabridged. Finished-reader evidence says the attackers'' ultimate motives remain unresolved; a suggestion that they
  train humanity against a greater threat is reader speculation, not an established ending.


  Root: Science fiction. The Shiva robot warships, Earth orbital fleet, ceramics/metal-detection constraint, exoskeletal frames,
  networked forecasting, digital contracts and reputation systems are technological causes. Angels, Shiva, the Hallelujah
  Gate, a Predictor and an exceptionally capable people-reader have religious or uncanny-sounding names but the sources explain
  them as commandos, a warship, a control-room entrance, an expert trader and psychological inference. The apparent forecasting
  miracles are not positive evidence of literal magic, paranormal foresight or time travel. This is not Fantasy or an Atemporal
  fiction on the evidence read.


  Temporal: Futurist SF. A later networked Earth has solar-system defenses, flying cars, orbital transport, a political Crash
  in its past, and twenty years of repeated alien attacks. This is not a disguised contemporary-1999 alien invasion, nor a
  historical reconstruction. The Modern-day Alien invasion branch fails its temporal ancestor even though an invasion is the
  premise. No explicit alternate-history fork established.


  Futurist sibling test: Future of Earth fiction beats Spacefaring and Alien fiction. The action culminates in a commando
  boarding operation in space, and the samples give substantial ship combat, training, command decisions and sacrifices. Those
  are genuine counterevidence, not incidental window dressing. But the novel''s distinguishing subject is how Earth''s distributed
  people, expertise and contracts cooperate. Hibbert identifies the collaboration network as the book''s real strength; Swartz
  explicitly calls the Ender-like military adventure a backdrop for the technology and changed politics; Momentary Fascinations
  calls the Shiva menace a plot device for the team and global trading network. The primary sample gives as much causal attention
  to an illegal trader''s reputation, a Kenyan family''s expertise and access to education, a reporter''s accountable brand,
  a predictor''s family and the military''s distributed recruitment as to combat. The alien motives remain unexplained rather
  than becoming an encounter with an alien culture. No settlement, interstellar civilization or discovery journey governs
  the whole fiction.


  Spacefaring rivals walked: Military SF has a real claim. Space Command fits Morgan/Jessica directing the operation and is
  stronger than Space Academy''s brief training, Space Navy''s fleets that explicitly cannot win, or the infantry-centered
  Alien-war grunts. The actual Ground-pounders promise is the soldiers'' experience, whereas much of this novel follows civilian
  experts worldwide. Techno fiction in space is a weaker rival despite network computation: its definition says interstellar
  identity transfer, computation, networks and posthuman technology, and the book is about Earthwide distributed knowledge,
  not an interstellar network or posthuman identity. Alien delving fails its children: no salvage of a dead ship, archaeological
  knowledge from a relic, inhabited artificial world, or horror descent. The giant hostile ship is boarded to destroy it,
  not to discover its makers'' knowledge. None is a reason to force a new leaf while an honest Earth-society leaf exists.


  Hard SF rivals: concrete engineering constraints matter, especially no ferrous motors and the selection of stealth weapons.
  But engineering is only one expertise that the social market coordinates, not the governing scientific puzzle. Author-level
  Hard SF labels do not settle this novel. There is no planet-science, orbital-mechanics or conceptual-world-model center
  in the complete criticism.


  Future-of-Earth siblings: Future societies wins. Future war explicitly says fighting on Earth, and the climactic commandos
  and fleet fight in space. More importantly, a change in the organization of knowledge is the central inquiry, not a particular
  weapon winning an Earth battlefield. Utopian fiction is a sincere rival because markets are depicted optimistically and
  oppressive governments have fallen. It is not chiefly construction/discovery of a secluded ideal community or satirical
  exposure of an apparent paradise; the society is in operation and is tested through a collective crisis. Dystopian futures
  lacks an oppressive social order as the governing antagonist; the external extinction threat does not make the positive
  human network a dystopia. Psi fails because the Predictor and Jessica are explained through inference, expertise and social
  skills.


  Techno fiction/Cyberpunk tested rather than bypassed: the world''s ubiquitous networks strongly fit the umbrella''s pervasive-systems
  clause. But the actual leaves are not generic network futures. The virtual training game does not make the whole fiction
  a Metaverse or LitRPG; neural plugs, machine personhood and changed human bodies are not the engine. Cyberpunk noir''s alienated
  outsider is wrong for the collaborative global ensemble. Terms of Service is the strongest leaf rival: reputation, brands
  and market rankings structure everyday lives. Yet its promise is confronting an algorithmic order from within it. Here those
  institutions are the proposed cooperative solution to the external crisis, examined as social organization rather than the
  obstacle whose terms the characters resist. Cyberheist is not justified by the opening burglar; he becomes a legitimate
  problem solver and no network heist is the whole plot. Revolutionary Cyberpunk concerns building an alternative against
  the existing system. The globally operating markets and military collaboration are already established, not the insurgent
  construction of a new network order. This is a boundary judgment, not a claim that every optimistic network novel is barred
  from cyberpunk.


  Future societies children: Future social SF is exact about a future Earth society examined at one moment through sociology/economics/psychology
  instead of physical engineering. Forecast markets, incentives, brands, contractual trust and team selection are the linked
  social mechanisms. Future history of Earth loses: twenty years of backstory set the stage, but the narrative focuses on
  the month before Shiva V, not a sustained course across eras. The Age of the Pussyfoot''s joymaker and Centenal''s fact-checking/election
  institutions already demonstrate that Future social SF can contain network technologies when the social order is the subject.
  Adiamante is an explicit neighboring precedent for a future Earth order tested by an external fleet, though its nonaggression
  differs from Earthweb''s economic coordination.



  Final approved placement: Economic futures under Future social SF, the retained umbrella. Distributed expertise, contractual
  trust, forecasts and rewards make systems of economic cooperation the main social subject. Command adventure remains a strong
  rival. One novel first1999, revised2018, not two novels. Original English front visually inspected, hotlinked only. Split
  mapping and subject axis approved23November2026, phonemsg-01M83XQ6MRNDS72B1K5DAEXRWJ on phonemsg-01M83WMY3009BP9Q8C8XKWJNP8.'

walk: 'Whole-fiction root-down walk: Fantasy, not SF (working land magic, Myrdhin and the Otherworld); Real earth fantasy,
  not an independently invented realm (post-Roman and eighth-century Britain). Historical rather than Contemporary or Future.
  Period fantasy governs the shared world: the historical Briton/Saxon cultural stage, land-sovereignty magic and changing
  religions bind both novels. Secret history fails as the defining engine (not a hidden cabal explaining documented events);
  Alternate history fails (no divergent historical system). Mythic retelling is the strongest rival: Sistersong reimagines
  The Twa Sisters, Huntress reimagines Herla. The author says Huntress starts where the myth ends and invents its plot; neither
  novel is confined to a Welsh or Irish inherited cycle. The shared historical culture remains the least-distorting whole-fiction
  home. Period > Antique times rather than Industrial age; Dark age rather than Prehistoric, Classical antiquity, Age of sail,
  Edo, Mughal or Abbasid; Celtic rather than Viking, Medieval, Andalusian or Plague. Herla has a Roman-era origin, but Huntress
  is principally eighth-century Wessex/Dumnonia, not a cross-era chronicle. Portal fantasy is a substantial rival because
  Annwn and Herla''s displacement are real; the whole fiction is not organized around a visitor''s journey across worlds,
  but the magical fate of this historical Britain. No gate widened. Author interviews explicitly confirm the same world, returning
  characters and a descendant of Riva, not merely a shared folklore motif; the shared-universe rule therefore folds MC06146
  into existing sistersong rather than creating a tenth Celtic fiction.'

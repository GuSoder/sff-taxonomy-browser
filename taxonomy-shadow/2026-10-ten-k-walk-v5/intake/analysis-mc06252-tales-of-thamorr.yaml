walk: 'Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Caper fantasy.


  Scope and identity: Tales of Thamorr is one two-published-novel fiction: Among Thieves (2021) and Thick as Thieves (2023),
  both by M. J. Kuhn. Current publisher series numbering, the author''s current books page and her explicit duology interview
  establish the scope; the author''s full first-book recap explicitly establishes original2021 and directly connects the quill''s
  fate to the sequel. The current Among Thieves paperback is2022, an edition date, not the original year. The author''s2023
  hope for another Thamorr series is not proof of published additional books. Killswitch Protocol is separately presented
  as cyberpunk, not folded into Thamorr. Douglas Hulick''s Among Thieves (2011) and David Chandler''s A Thief in the Night/Honor
  Among Thieves are different authors and worlds; existing cards are untouched.


  Root: the five kingdoms of Thamorr have declared Adept magic, supernatural sensing/kinetic abilities and a magical artifact
  that controls the Adepts. The Guildmaster''s experiments on Ryia do not, on these sources, establish an SF technological
  explanation for that magic. No future-Earth, spacefaring, alien, alternate-historical scientific or present-day technological
  frame is established across the duology. Atemporal SF''s psi/experimentation and Science fantasy are surface rivals, not
  better root evidence than the primary and completed sources'' internally magical fantasy world; no scientific engine is
  invented. No literal time travel, parallel-Earth mechanism or psyche-generated reality is established.


  Fantasy setting fork: Fantasy realms passes positively through Carrowwick and the five invented kingdoms, their rulers and
  Adept institutions. Real earth fantasy''s Historical, Contemporary and Future routes fail an Earth-rooted setting; pseudo-European
  names, coal/steel and early-modern-looking cities do not make this an actual historical period. Portal fantasy''s Whimsical/Eldritch
  doors, Transporting tomes and Fantasy rifts fail an Earth/world crossing as the organizing story. Movement among Thamorr''s
  kingdoms is not automatically a portal system.


  Fantasy realms siblings: Sword and sorcery passes the action-forward, intimate adventurous mode across both novels: infiltration,
  theft, jailbreaks, pursuit, double-crosses, armed escapes and a gang''s self-interested jobs. Epic fantasy is a serious
  rival because the quill''s ownership affects all five kingdoms, the sequel expands the political geography and the origin
  of Adept magic is explored. Political fantasy > Magic politics/Revolutionary fantasy and High fantasy''s quest branches
  catch the threatened magical order and rescue objective. But this remains the criminals'' changing loyalties, rescues, cons
  and consequences rather than an army campaign, succession process, panoramic revolution or inherited party quest against
  an ancient dark. The second novel goes beyond a repeat of the first heist, but completed reviewers still identify criminal
  ingenuity and a high-fantasy heist conclusion, not a genre reversal.


  Heroic fantasy''s class tree is another genuine alternative. Ryia is both an exceptionally dangerous blade and an experimentally
  gifted Senser/Kinetic, so Martial > Rogue > Thief heroes would require ignoring her own magic and the ensemble''s division
  of labor. It is not selected merely because the cast are thieves. Half-caster > Arcane trickster/Spellsword heroes is more
  honest as a class rival, but an individual adventuring power-kit does not organize this multi-POV gang fiction as well as
  the jobs, deception and betrayals. Contract/Sworn assassins catch Ryia''s mercenary violence, not the whole crew''s central
  activity. Hard fantasy''s magic rules and the quill''s powers are significant, especially in book two, but the narrative
  is not principally rule-learning or testing that system. Military fantasy fails armies, campaigns and soldiers'' service
  as the governing narrative.


  The other realms gates were tested. Heart fantasy is a substantive thematic rival: multiple completed reviewers put finding
  one''s people, loyalty, vulnerability and redemption at the emotional center, and Ryia/Evelyn''s slow-burn sapphic romance
  matters. But Cozy''s safety/low-intensity gate fails the brutality, enslavement and betrayals, and Romantasy''s co-equal
  romance-as-spine gate does not displace the full ensemble''s criminal objectives and other relationships. No horse bond
  governs. Gothic realms catches darkness, captivity and abuse, but menace/haunting/uncanny setting is not a better governing
  register than the gang adventure. Comic realms fails sustained parody or absurd-world institutions despite frequent banter.
  Far shores fails a named counterpart culture whose exploration is the point. Fairytale fantasy fails an identifiable revision
  or tale-grammar quest as the story''s organizing source. No inherited real-world myth supplies a retelling.


  Sword and sorcery siblings: Pirate fantasy is real, because Nash is a smuggler/ship captain and the sequel includes high-seas
  misdeeds. But the sea is one route in the gang''s broader criminal story, not its defining arena. Technofantasy''s steampunk/magitech/dieselpunk
  children lose: coal and steel in a city and a magical quill do not make engineering central. Sword and planet fails interplanetary
  adventure. Tournament fantasy fails a formal contest, rule-set and prize; an artifact theft or jailbreak is a job, not a
  tournament. Classic Sword and Sorcery''s historical pulp/evergreen lineage does not explain this contemporary ensemble-heist
  construction better than the explicit Caper leaf.


  Caper fantasy positively matches its exact existing definition: thieves, heists, gangs and intimate criminal adventure.
  Book one''s full primary recap establishes a stolen quill, competing private betrayals, an attempted destruction, a forged
  replica and the crime boss escaping with the real control artifact. In book two the consequences scatter the same people,
  whose rescues, schemes, changing loyalties and renewed jobs carry the conclusion. The broader stakes, darker Adept history,
  romance and found-family arc are retained, not erased. Completed final-book and whole-duology criticism covers the payoff
  and bittersweet closure; no unsupported final survivor list or exact fate for every character is invented. This is ending-aware
  source coverage, not a claim to have read both complete copyrighted novels.


  Decision: existing Caper fantasy, six to seven fictions, one two-book Tales of Thamorr card. Moderate-high confidence in
  the ensemble-caper fit, with individual half-caster class, magic politics, pirate adventure and bond-centered readings recorded
  as real rivals. No new genre, changed definition or separate sequel card. No threshold reached.'
whole_content: 'Ryia, hiding her unique paired Adept powers and abusive experimental origins, joins criminals whose private
  motives conflict over stealing the Guildmaster''s magical quill. The author explicitly reveals the first ending: the apparent
  destroyed quill is a forgery; Clem escapes with the real artifact that can both find and control Adepts, while Ryia and
  Evelyn set out to rescue the betraying Tristan. Thick as Thieves follows those direct consequences across the same five
  kingdoms, including jailbreaks, maritime crime, shifting allegiance and the growing stakes of controlling magic. Completed
  sequel and whole-duology criticism identifies a deeper exploration of Adept origins, relationships, moral choice and redemption,
  a richer final payoff and closure to the central plot with some possible future hooks. These accounts support the whole
  two-book criminal-ensemble verdict; they do not supply every specific death or final artifact disposition, which is left
  unclaimed.'
confidence: Moderate-high. Primary full first-ending recap and multiple completed sequel/duology reviews support a continuing
  criminal ensemble through closure. Half-caster powers, wider politics, found family and romance are substantial but do not
  replace the caper form.

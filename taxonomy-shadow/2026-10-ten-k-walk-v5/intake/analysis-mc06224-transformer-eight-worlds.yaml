related_consolidation:
  fiction: eight-worlds
  walk: 'Existing-world consolidation found during MC06224 tenth-card membership check. Penguin''s actual Eight Worlds series
    page groups The Ophiuchi Hotline, Steel Beach, The Golden Globe and Irontown Blues as its four novels; the Irontown page
    expressly calls the setting the Eight Worlds universe. SFE likewise lists all four, with the latter three a Metal Trilogy
    SUBSET. This is not common-author or merely similar-theme inference. The author''s Steel Beach note, reproduced in the
    continuity reference and independently discussed by Walton and Nicoll, explicitly retains shared background, characters
    and technology but disclaims a consistent chronology. Preserve that as a real continuity caveat: this is one loose shared-world
    fiction, not a claim of four novels on a clean canonical timeline. Walton prefers considering the versions separately;
    Nicoll calls it a series with an asterisk. The curator''s one-shared-universe/one-fiction rule and the primary publisher''s
    grouping govern the browser grouping. No entire mixed short-story collection is added as a world-exclusive novel, no Gaea,
    Thunder and Lightning, Mammoth or Millennium merger.


    All four engines were checked. Ophiuchi (1977) follows illegal geneticist Lilo and competing clone lives under Boss Tweed,
    body/memory reconstruction, null-field symbiosis, alien data and the revelation of a larger exiled-civilization network.
    Steel Beach (1992, not its1993 ebook/reprint) follows reporter Hildy through a thoroughly engineered Lunar society, easy
    body/sex changes and the Central Computer''s existential breakdown. Golden Globe (1998, not1999 reprint) follows actor/conman
    Sparky among the outer-system settlements, changing visible embodiment through magnetic implants while trying to return
    to a Lunar theatrical life. Irontown (2018) follows PI Bach and engineered dog Sherlock investigating biohackers after
    the same Lunar Computer crisis. Their genres differ locally, but identity, embodied redesign, AI-managed life and computation/network/biotechnology
    across an artificial space civilization carry the WORLD.


    Root-down: SF, not a magical cosmology. Futurist, not real history or recognizable modern Earth. No chronology repair
    or invented time machine added: a secondary synopsis''s future Earth wording alone does not establish an in-story era
    jump. EBSCO''s complete Ophiuchi plot describes transport from Jupiter to the surviving Earth population and then the
    Traders'' meeting, not a dated voyage into another historical era. Biological de-aging and recorded earlier memories are
    not automatic time travel. If an actual temporal crossing were established the owner''s any-element rule would apply;
    inconsistent publication chronology is not such a crossing. Reincarnation/parallel-worlds/Fabulation likewise not established
    by remade bodies or continuity glitches. There is no sustained fantasy surface of lost magic/technology to make Planetary
    romance the whole-world route.


    Futurist''s Hard SF is a serious toolkit aspect, but not the dominant reader experience of constrained engineering puzzles
    across these four. Future of Earth > Posthuman > Altered flesh fits Ophiuchi''s individually remade living bodies; Copied
    minds fits its memory recordings and Cyborgs fits Sparky''s implants. None honestly contains the full world, whose life-support
    AI, biohackers, networking and body technologies spread across all three modes. Future social/history of Earth is expressly
    Earthbound. Alien > Anthropological/Earthborn catches human cultural estrangement; First contact and Alien engineering
    catch the Invaders/Hotline, but the largely unseen alien background is not the subject of most of the four books. Spacefaring
    is the full off-Earth civilizational frame. At that partition, Space opera, military, generation starship, future history,
    dystopias, colony politics/life, private space mystery and comic adventures all catch one mode or subplot, not the continuing
    technological world. Techno fiction in space explicitly contains spacefaring identity transfer, computation, networks
    and posthuman technology: it is the existing honest common leaf, not a new compromise definition. The Irontown detective
    case does not force the whole four-book world into Space PI, nor Sparky''s adventures into Cyborgs.


    Two existing cards become one four-novel fiction in existing Techno fiction in space (its count remains9). Ophiuchi leaves
    Altered flesh9to8, then new Transformer makes it9. No books lost or invented by consolidation; new Transformer adds3.
    Net totals917nodes/2934fictions/7203books. No tenth-card split to serve after the membership repair, and no structural
    changes.'

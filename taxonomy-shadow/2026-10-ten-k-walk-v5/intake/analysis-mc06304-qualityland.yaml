walk: '# QualityLand whole-fiction walk, 23 November 2026


  Verdict: existing Terms of Service, 8 to 9 fictions. One fiction, two novels: QualityLand (2017) and QualityLand 2.0: Kikis
  Geheimnis (2020). The author''s works list, FAQ, original publisher and agent confirm the sequence. The light and dark versions
  of book one have the same narrative chapters with different interstitial recommendations/news/advertising, according to
  the author''s FAQ, so are editions rather than extra novels. The 1.1 and 1.2 graphic adaptations are not extra prose novels.
  The agency currently lists an English working translation for the sequel, not a published English edition; no English publication
  is invented. No third prose QualityLand novel found in the current author/publisher sequence. No full-novel reading claimed.


  Evidence coverage: Read current author works and FAQ, Ullstein sequel and series pages, the agency''s rights/bibliographic
  page, full PW, Kirkus and Ian Mond/Locus reviews of book one, an authorized English Calliope excerpt via BookBrowse, an
  authorized complete German chapter from book two via Golem, complete Belletristik-Couch and Sounds & Books reviews of book
  two, a completed Vorablesen reader review and the German encyclopedia plot synopsis including both endings. The source types
  distinguish primary prose/author/publisher evidence, completed criticism, reader evidence and secondary ending synthesis.
  The encyclopedia ending details are not independently primary text. Reviewers differ about the sequel''s effectiveness and
  darkness, not the core algorithmic premise. Kirkus appends unrelated book reviews; those are not evidence here.


  Root: Speculative fiction > Science fiction. Author, publisher and read primary excerpts positively establish predictive
  algorithms, social scoring, self-driving transport, conscious robots and networked AI. No literal magic or invented fantasy
  universe is established. Kiki''s unknown parentage, a mysterious pursuer and a possible surviving android are technical/mystery
  matters in these sources, not supernatural proof. A self-referential robot author and mock reader terms are a satirical
  frame, not evidence that characters revise reality or a literal fiction leaks into the world. Not Fantasy or Books in Books.


  Time and universe: Science fiction > Futurist SF. The author explicitly identifies a near future; Locus calls it decades
  ahead and locates the renamed country somewhere on Earth. The Golem sequel chapter refers to a recent automated war among
  terrestrial countries, including Sweden. The generic name QualityLand is a rebranding of a Western country after economic
  crises, not an unanchored invented cosmos. Not Historical SF: no period, retro golden-age aesthetic, hidden past or alternate
  historical fork drives it. Not Modern day SF: social scoring plus omnipresent sentient household machines, an android president
  and fully autonomous global war are an extrapolated future. This blocks the otherwise appealing Satirical SF leaf below
  Modern day; tonal fit cannot override that ancestor. Not Atemporal SF: no time travel or world-hopping premise is established;
  the chapter''s old VR birth recording is a recording, not a temporal journey. The AI survival/upload is not time travel
  either.


  Futurist siblings: Future of Earth fiction fits. The sustained subject is a future terrestrial order and everyday people
  inside it. Spacefaring fiction fails because no off-Earth travel/settlement civilization organizes either novel. Alien fiction
  fails because robots are human-built machines and no alien encounter governs the fiction. Hard SF fails because the prose
  satirizes algorithmic assumptions rather than deriving a rigorously worked physical model; orbital engineering, planetary
  science, matter transfer and alternate-cosmos gates do not apply.


  Future of Earth siblings: Techno fiction is strongest: technology''s ranking and decision systems organize work, shopping,
  relationships, politics and war. Future societies is a real rival because surveillance capitalism and public power are substantive
  subjects, but the story''s distinctive mechanism is continuous life inside the predictive network. Economic futures would
  catch consumption and markets while underweighting pervasive identity/reputation systems, robot care and automated decisions
  in politics and war; Political futures would overvalue the presidential subplots; Cultural futures would overvalue the e-poet
  and media interludes. No sustained future-history panorama. Future war is a genuine sequel element, and the authorized chapter
  explains OODA-loop automation, but a short absurd war and its bureaucratic excuse-making do not organize both novels. Psi
  gate has no positive evidence.


  Dystopian rivals: The books are explicitly marketed and reviewed as dystopian satires; that is not dismissed as mere tone.
  However the actual Social dystopia children require population crowding, absent children, patriarchy, climate-driven breakdown/displacement/class
  structure or civil war. None is the whole-fiction governing premise. Climate trouble is present in book two but not the
  causal engine of both novels. Huxleyan dystopia is a serious rival: automatic desire, manufactured consent and conditioning
  matter. Yet this society''s ranking/behavioral prediction and machine governance are broader than a totalitarian program
  of pleasure, drugs or bodily conditioning. Orwellian control also crosses the plot through surveillance and power, but the
  primary mechanism is algorithmic convenience, consumption and social incentives, not one coercive police state''s compulsory
  truth. No insurgent regime-overthrow spine; Peter''s attempted consumer return is not a guerrilla rebellion. Ruined Earth/post-holocaust/Dying
  Earth fail because this order continues to function, however wickedly. The sequel war does not turn the whole fiction into
  a survival-after-collapse narrative.


  Utopian fiction and Satirical utopia: the order presents itself as ideal and uses that claim satirically, so this is an
  honest rival, not excluded for containing jokes. But its narrative is life under an already invasive commercial platform
  order and resistance to the imposed profile. Its apparent perfection is branding, not a sustained model of a better/alternative
  social organization tested as the fiction''s primary object. The exact ranking-system gate of Terms of Service fits more
  directly and without loosening a definition.


  Techno fiction > Cyberpunk > Postcyberpunk > Terms of Service. The actual Cyberpunk umbrella includes socially embedded
  life in pervasive systems, not only noir hackers. Peter is a low-status machine scrapper then therapist and ordinary resident
  living inside rankings and automated institutions, rather than a cool professional outlaw. The earworm neural interface
  exists, but Neural fiction requires access into an experienced altered reality as the central passage, which is not the
  story. Metaverse fails its immersive avatar-world engine. LitRPG fails because social levels govern status and access, not
  literal game mechanics as world physics/classes/loot/respawn. Cyberpunk noir''s conspiracy, assassination and chase elements
  are real, especially for Kiki in book two, but the whole fiction''s grotesque civic algorithmic life and ensemble satire
  beat a hardboiled survival/job spine. Postcyberpunk''s lack of classic noir alienation is a wobble because Peter is marginal
  and rescues rejected robots; he remains socially embedded and engages institutions from ordinary life.


  Postcyberpunk siblings: Terms of Service''s actual definition names ranking, surveillance, reputation and broadcast systems
  as the air everyone breathes, with lives confronting those terms from within ordinary life. This is almost the whole-series
  premise in the read primary prose. Cyberheist fails as whole-fiction engine: there are abductions, data mysteries and attacks,
  but not a crew/job against the system organizing the pair. Revolutionary cyberpunk fails because no sustained building of
  a cooperative alternative institution is established. Peter''s machine-care practice and resistance are not enough to claim
  the whole world-building-alternative engine.


  Machine minds is the strongest non-Cyberpunk techno rival. The robots have personhood, inner lives and relationships, and
  John of Us'' election and possible distributed survival matter. But no single embodied/disembodied category carries the
  whole fiction: Peter, Kiki, Martyn, Aisha, commercial scoring and public institutions remain substantive strands. Robot
  relations would elevate Peter''s rescue/therapy over the wider algorithmic order; Androids would require passing/detection,
  not an openly android politician; Being robot lacks a machine''s inside-selfhood governing perspective. AI overlords overstates
  a singular machine ruler, AI awakening narrows to coming-to-consciousness, Rogue AI mistakes the systems for a humanity-versus-hostile-machine
  war. Post-society is another real rival, but its present mechanism leaves require abolished death, compilers ending scarcity,
  nanotech remaking the world, desktop fabrication replacing factories, a working climate regime or displaced public justice.
  None is the established whole premise. Post-society relations narrows to intimacy/relationship transformation when scoring
  also governs the economy, work, politics and war.


  Confidence: moderate-high for Terms of Service, with dystopian satire, robot-personhood and the more action-oriented sequel
  preserved as rivals. No need for a new leaf and no structural change or definition widening. Leaf rises8to9, not ten, so
  no split trigger.


  Cover curation: one whole-series search/pass. UK publisher''s parcel-design front for book one, actual440x625, and US199x300
  same design inspected. UK selected for higher resolution and cleaner reading, rating4/10 on detailed-colorful-painting preference;
  neither is a painting. For book two, author-hosted1498x2421 and review-hosted507x820 German original pink/black fronts inspected,
  same design, author-hosted selected for primary provenance and resolution, rating3/10. No published English edition established
  by agency/edition checks. The main title QualityLand2.0 is in English words in its own art; German subtitle remains honestly
  marked. A separate graphic-adaptation cover is ineligible; a Hungarian designer interview offered an illustrated alternative
  but its original image could not be retrieved and was not selected unseen. No image files stored in repository. Hotlink
  exact observed URLs; no generated cover or invented English jacket.

  '

- url: http://nwhyte.livejournal.com/2562427.html At last, another novel that I feel I can nominate for the Retro Hugos alongside
    The Ill-Made Knight and Kallocain. It's a short book about a time-traveller who goes back to Renaissance Italy and finds
    that he cannot return to his own time due to a combination of local politics, equipment constraints and fuzzy memory.
    Any reader who is actually awake will spot the eventual punchline by the end of the second chapter, but Wellman has fun
    taking us there and unashamedly invokes various cliches of the time-hopping subgenre. A shame that this isn't better known,
    and I'm nominating it for the Retro Hugos to try and fix that.

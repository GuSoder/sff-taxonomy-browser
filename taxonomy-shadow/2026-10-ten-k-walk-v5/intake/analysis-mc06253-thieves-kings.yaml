walk: 'Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy > Industrial age fantasy >
  Ember age fantasy > Gaslight fantasy > Gaslight technomancy.


  Scope: one published Thieves & Kings duology by M. K. Lobb: To Steal from Thieves (2025) and To Deal with Kings (2026),
  in original narrative order although the second title comes first in the intake. Author, publisher, bibliography and both
  professional reviews establish the sequence and original years. Regional UK/Australian release dates are not separate original
  years. The first volume''s March2025 original and the sequel''s March2026 original have both passed as of22November2026.
  Seven Faceless Saints/Disciples of Chaos and The Dark in Her Veins are separately presented works, not additions to this
  world. The existing Seven Faceless Saints card is unchanged. YA is an audience description, not an exclusion.


  Root: the speculative engine is expressly alchemology, manufactured magic that consumes the practitioner''s strength and
  is inserted into mechanical devices. The authorized first chapter directly shows blood and soulsteel converted into primateria,
  then installed inside a carefully calculated clockwork revolver. Learned technique and exact measurements matter, but this
  is not evidence that the supernatural has been naturalistically explained away. Science fiction is nevertheless considered
  rather than excluded simply for having magic: the actual Steampunk umbrella permits science fantasy. Its Historical SF >
  Period SF > Steampunk adventure > Steampunk mystery/quest routes are the strongest SF alternatives, since this is an industrial-era
  criminal mission followed by an investigation. They require steam-era industrial technology to organize the speculative
  world; here the sources make blood-powered magical manufacture, enchanted objects and the alchemological device central,
  not a steam-powered technological extrapolation. Steampunk history''s transformed wars, nations and historical outcomes
  are not established as the narrative engine. Modern-day and futurist SF fail the explicit1851 Earth anchor. Atemporal SF''s
  unplaceable-time gate fails that anchor; there is no literal time travel, parallel-world mechanism, alien or spacefaring
  frame, reincarnation cycle or psyche-generated reality established by the sources. Gaslight technomancy is the more exact
  positive match, not a claim that scientific language cannot occur in fantasy.


  Fantasy setting fork: Real earth fantasy passes through named London, its Devil''s Acre and Seven Dials districts, the Crystal
  Palace and Great Exhibition of1851, the crown and Metropolitan Police. Fantasy realms fails its independent-world gate.
  Caper fantasy is a genuine form rival: a con man, stolen necklace, magical dark market, rival gangs, betrayal and protective
  friendships drive the story. But its Sword and sorcery > Fantasy realms ancestors do not admit historical London. The same
  gate defeats Heroic fantasy''s rogue/thief or artificer readings, realms Technofantasy/Magitech, realms political fantasy
  and realms Romantasy. Romance is substantial and grows through the duology; it is not discarded, nor used to silently move
  Earth into an invented realm. Portal fantasy fails an organizing Earth/other-world crossing; a magical object or exhibition
  is not itself a portal.


  Real earth timing: Historical fantasy passes the documented1851 setting. Contemporary fantasy''s urban magic, criminal underworld,
  witchcraft and occult-investigation leaves fail present-day timing. Future fantasy fails a future Earth. A city alone does
  not select the contemporary Urban branch.


  Historical siblings: Mythic retelling fails an inherited named myth/legend as source narrative; alchemology is not automatically
  Classical, Biblical or another myth tradition. Secret history is a serious rival because magic is outlawed, traded underground
  and investigated, but its exact gate is documented history secretly explained by hidden magic, not merely secret crime.
  Alchemology is known to Parliament and the monarchy and explicitly banned; the plot sources do not establish a hidden magical
  explanation for a recorded event. Its Arcane peoples, Occult cabals and Untold magic descendants do not improve that gate.


  Alternate history fantasy > Alt steampunk fantasy is the strongest historical rival. Both Kirkus and Paste explicitly call
  this an alternate nineteenth-century London, and a crown ban on magic is itself a fictional historical difference. That
  evidence is retained. The actual tree''s alternate-history gate is narrower than any counterfactual detail: openly rewritten
  historical order, with magic powering institutions and industry. The whole-duology sources center a preserved London/Great
  Exhibition stage, underground manufacture, the necklace theft and the subsequent investigation of an engineered magical
  device, rather than an alternative industrial order or the changed course of national history. A ban does not by itself
  prove that magic is unknown or publicly absent, and it is not used as an automatic rejection of alternate history. The judgment
  is about the governing narrative and demonstrated mechanism. Period fantasy''s historical stage, specifically Gaslight technomancy''s
  engineered wonder, is the closer existing fit. This is a real boundary judgment, not a denial of the reviewers'' alternate-history
  label.


  Period children: Antique times fantasy fails the Western pre1800 era; this is not Edo Japan''s special1800s exception. Long
  chronicle fantasy fails a several-era or generational span as the point. Industrial age fantasy positively passes1851. Its
  Electrified fantasy and twentieth-century diesel/war/interwar/atomic/space-age children fail the date; Industrial fantasy
  chronicles fails an era-straddling chronicle. Ember age fantasy passes the pre1900 industrial era. Antebellum, Weird west
  and Bluestone fantasy fail the London setting and their regional cultural stages. Gaslight fantasy is the exact nineteenth-century
  British urban stage.


  Gaslight siblings: Magicians in gaslight is a genuine rival because Zaria inherits a skilled craft and commissions, magic
  is a scarce resource and exclusion/marginalization matter. But its definition expressly excludes engineered magic as science
  or machinery. The primary chapter''s manufactured fuel inside a geared revolver, the publisher''s magic-wielding inventor
  premise, the Great Exhibition and the sequel''s alchemological device make that exclusion decisive. Mythology in gaslight
  fails revived sacred myths. Folklore in gaslight and its Faeries/Monsters/Circus children fail traditional folk beings or
  an organizing circus/wonder-tale source. Gothic in gaslight catches darkness, abuse, dangerous secrets and damaging family
  history; it fails as the governing mode because haunting, uncanny inherited rot, curses or a Gothic-canon revision do not
  organize the sourced duology as strongly as engineered magic and criminal adventure. Blood in the manufacturing process
  is not evidence of vampires or a haunting.


  Positive leaf: Gaslight technomancy''s existing definition is magic engineered as science, machinery, experiment or industrial
  system. The first book directly dramatizes alchemical fuel production, calibrated design and a mechanically integrated magical
  weapon. The sequel returns to the same system and makes an unidentified magical device at the Crystal Palace the investigative
  center. Theft, romance, family manipulation and the costs of power all remain significant through the final revelation/showdown
  and relationship payoff. Two completed sequel accounts describe closure, while criticizing its tidiness or speed; the verdict
  is not based solely on first-volume packaging. These are source-grounded whole-duology and ending-aware accounts, not a
  claim to have read both complete copyrighted novels. Exact final survivors, the Curator''s identity and the final device''s
  disposition are not invented.


  Decision: existing Gaslight technomancy, five to six fictions, one two-novel Thieves & Kings card. Moderate-high confidence,
  with Alt steampunk fantasy, SF Steampunk and Magicians in gaslight retained as genuine rivals. No definition, structure,
  portrait or unrelated fiction changes. No threshold reached.'
whole_content: 'In1851 London, alchemologist Zaria Mendoza makes magic from blood and soulsteel, then installs primateria
  inside mechanical creations. Her father''s unfinished underground commissions trap her in dangerous debt. Con man Kane Durante
  needs her help stealing a necklace at the Great Exhibition to free his friend from a kingpin. The heist''s betrayals and
  destruction lead directly into the sequel: the necklace supplies rare primateria, Zaria thinks Kane died, Ward is dead and
  Kane uneasily inherits the Devil''s Acre criminal territory. Rival Vaughan coerces Zaria while Inspector Price blackmails
  Kane into investigating an alchemological device planted at the Crystal Palace by the Curator. Completed sequel reviews
  follow the investigation to its third-act revelation, confrontation and emotional resolution, with criticism of a tidy/quick
  ending. The whole story retains magical engineering, criminal coercion, protective friendships, family damage and the developing
  romance. Exact final identities, deaths and technical disposal of the device are not asserted beyond the read sources.'
confidence: Moderate-high. Direct legal opening establishes manufactured magic inside machinery, and completed sequel criticism
  keeps an alchemological device central through closure. Alternate historical labeling is retained; the exact tree favors
  historical stage plus magical engineering over a magic-powered rewritten industrial order. Full novel endings and exact
  device fate were not independently read.

walk: 'MC06225-26 are two queue rows for one continuing A Gentle Apocalypse fiction, not two unrelated M. H. Foster books
  and not M. A. Foster''s Transformer or Ler worlds. The publisher''s named series and the author''s three-book interview
  establish the shared scope. Three published novels: The Demon Overlord''s Retirement Plan (2025), Love, Politics, and Other
  Acts of War (2026), Band of Others (2026). Later traditional print/audio dates are editions, not original novel years. Band
  is already published: Hachette Australia lists its ebook June 30, 2026, while completed April reviews describe the original
  self-publication and all three stories. The April14 versus an April16 community expectation is an exact-day discrepancy,
  not a year or published-status problem. December29,2026 print/audio includes bonus material; it does not make the already-readable
  novel unreleased. Book4 is only in progress in the October20 author interview, no published fourth novel established. No
  bonus adventure, short story, other author or unbridged Janissary series is added as a separate novel or world.


  Each book''s own engine: 1 Galornus Prime fakes the end of a 444-lifetime Demon Overlord career, becomes Willem Porter and
  retires to turnip farming in Lower Middleton. Goat Prometheus, children, neighbors and a hellhound keep drawing him into
  care; corrupt officials/merchants threaten the village and he must protect it without exposing the former tyrant. 2 Succubus
  lieutenant Rajani finds him and moves in as a cousin; a reopened trade route and feuding neighboring powers threaten war.
  His attempt at peace, harvest/festival village life and growing attachment to Clara broaden the community. Not merely the
  first book''s farming repeated. 3 Laekus the Death Knight arrives as Lucas, clashes with Rajani and brings obligations he
  cannot understand retiring from; Pelan threatens Trumar and Lower Middleton. Defeating soldiers would be easy, preserving
  his people without celestial discovery is the real difficulty. The author specifically identifies this book as the point
  where he accepts that Lower Middleton''s people are his own.


  Full root walk: Fantasy, not SF. Demon/divine powers, resurrection, purpose-bound magic, the celestial order and a taken
  human identity are literal world conditions, not an established scientific or machine explanation. Cosmic titles or bathing
  in solar flares do not by themselves establish SF. Fantasy realms rather than Real earth: Alteria, Trumar, Pelan and Lower
  Middleton form an invented world, not a dated Earth or a historical counterpart asserted as real Earth. Portal fantasy fails
  its explicit Earth-contact gate: earlier cosmic lives and a demonic-to-human change do not supply a traveler from our Earth.
  No Earth contact or disguised technological-world reveal was established in the whole-three evidence.


  All seven Fantasy realms children tested. Heart fantasy is the sustained bond-as-spine route: a former destroyer acquires
  neighbors, kinship and obligations of care. Epic fantasy is substantial counterpressure in the old divine cycle, feuding
  polities and book3 army, not denied. Its Heroic/spellcaster route loses to refusal of an adventuring role; Quest fantasy
  lacks a governing consequential journey; Military lacks a unit/campaign chronicle; Political/Geopolitical catches book2-3
  threats but the point of intervention is keeping a chosen community, not the whole fiction organized around a changing balance
  of states. Mythological fantasy/Mythic power struggle catches celestial roles in his past but not the new domestic story''s
  governing purpose. Hard fantasy loses despite the explicit purpose/identity rule in the published excerpt: exploiting a
  constrained casting system or temporal mechanics is not the plot spine. Sword and sorcery loses sustained combat/adventuring
  engine; Fairytale lacks a deliberately revised tale or a fairy-tale-grammar quest; Far shores has no established specific
  counterpart culture as the aboutness; Gothic realms loses a governing register of dread, confinement or imperial-era manners.
  Literal demon names and past atrocities are not enough for Gothic dread.


  Comic fantasy realms > Parody > Quest parody is the strongest rival. The retired Dark Lord, returning minions and tiresome
  Heroes explicitly send up the heroic script, while bureaucracy and town halls resemble Absurd realms. But across all three,
  the joke serves belonging, tenderness and reluctant responsibility, rather than a continuing comic quest or the invented
  institutions themselves as the governing object of satire. This is a real boundary, not routing simply on marketing''s cozy
  label. The author describes second chances and identity beyond a job as the underlying questions, and says action is not
  the purpose. Completed first-book and third-book readers independently find warm, sweet chosen community; reader romance
  discussion says the slow-burn relationship does not take center stage. Contrary review retained: Nights and Weekends finds
  book2 less comical, more political and building toward catastrophe. War is real, and this is not claimed to have no violence
  or no stakes. Under the existing Cozy definition safety and belonging may still govern when danger appears; the near-omnipotent
  protector''s difficult task is learning care and keeping a home life rather than surviving an uncertain military campaign.


  Heart partition: Cozy rather than Romantasy, because the neighbors, children, minions and found community span the world,
  with Clara''s romance one bond rather than a coequal romance/external-stakes main arc; Horse fantasy fails, the goat is
  not a horse-kind partner and does not alone hold the whole story. Cozy partition: Peeps rather than Place, because this
  is not keeping an inn/cafe/shelter that receives guests; a named village or private cottage does not satisfy the hosting
  gate. Craft is a genuine rival: turnips, gardening, pickles and desire to become a pickleteer supply daily comfort. Yet
  the old lieutenants'' transformation, the neighbors'' care and the political intrusions across books2-3 are not a trade/apprenticeship
  or work-process story. The people, not one house or trade, hold all three together. Existing Cozy peeps fantasy is the honest
  whole-fiction leaf, moderate confidence at the comic/political/comfort boundary, no definition stretched.


  Threshold membership check was completed before a false tenth proposal. The current nine include The Garden of Delights,
  whose old rationale explicitly admitted weakness and depended on a single gentle review. Full author/publisher/completed-story
  evidence shows its governing conflict is cultural erasure and anti-colonial resistance, not a safe low-intensity community
  tale. Its existing-leaf correction to Samizdat fantasy is documented separately, including the narrower political boundary
  caveat. Cozy peeps9to8, then A Gentle Apocalypse8to9; Samizdat6to7. The nine distinct old card identities were checked;
  no unsupported shared-author universe merger was made. Luminous Deep''s whole two-book conclusion was rechecked through
  Locus and completed reviews: correspondence, family and mutual care remain its heart despite science-fantasy/temporal terminology
  and cosmic threats. No unverified scientific-origin reveal was invented to move that card. No tenth-card split, new genre,
  seed, definition change or parked next-row pile.'

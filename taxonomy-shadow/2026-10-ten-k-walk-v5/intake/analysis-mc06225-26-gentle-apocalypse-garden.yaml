  walk: 'Whole-story root correction found during MC06225-26''s threshold membership check, not a new fiction or a structural
    change. One novel, The Garden of Delights (2024), primary publisher May14. The former Cozy peeps rationale explicitly
    called the card weak and inferred comfort from the Caretaker''s kindness and lyrical prose. Author, primary publisher
    and completed reviews establish a much larger governing conflict. The author says political aspects took center stage
    and required outsider Iyena''s viewpoint alongside the Caretaker''s. Sirvassa''s floral culture is subjected to Alderraan
    cultural takeover through schooling, rewritten/banned history, coercion, framing, torture and fatal attacks; resisting
    the replacement of a people''s way of life joins the intimate and magical plots. Kindness is a moral answer to persecution,
    not proof of a low-intensity safety contract. The mentor/apprentice relationship ends devastatingly. Iyena''s death/rebirth
    and the happier final resistance outcome are not erased. A review''s claim that the Caretaker recognized her role before
    the cure is contradicted by the detailed completed reader; no precise unverified timing is asserted here.


    Root-down Fantasy, not SF: explicit gods, curses, flower powers and Iyena''s changing state are literal, not established
    as technology-only explanation. The industrial city, airships, automatons and floral-technology language do not debunk
    that cosmology. Fantasy realms, not Real earth or Portal: Sirvassa/Alderra/Three Realms are invented, their Indian cultural
    inspiration is not a real historical Indian setting or proof of our Earth. No Earth crossing. All seven realm branches
    tested: Epic has the governing civic/cultural power struggle and invented divine scale. Heart/Cozy fails because tenderness
    does not govern the story''s intensity, security or anti-colonial stakes; no romance or horse bond as spine. Sword and
    sorcery fails ongoing intimate combat adventure; Fairytale lacks a deliberate inherited tale or fairy-tale quest structure;
    Comic lacks a governing joke; Gothic menace is present in rot and violence but the cultural/political conflict, not a
    dread contract or occult investigation, drives the whole. Far shores > Katha is a serious rival: South Asian clothing,
    food, names and mythic influence are well supported. Its own aboutness exception sends an existing governing resistance
    engine to that engine, rather than putting every Indian-inspired story in Katha.


    Epic''s six children: Heroic power-source/coming-of-age catches Iyena''s growth but not the Caretaker''s linked civic
    dilemma; Quest lacks a governing journey; Military lacks a ranks/unit/campaign chronicle; Hard fantasy loses despite floral
    and metal arts, because rule-bound casting as a problem-solving system is not the whole narrative; Mythological/Invented
    gods catches Champions, the half-formed god and the Caretaker''s curse, but the author and full story make the political
    conflict current rather than a divine-age chronicle or sustained experience of godhood. Political is the honest umbrella.
    Within it, Court intrigue is not a dynasty or insider ruling-house contest, Election lacks mass franchise, Magic politics
    is not primarily public regulation of who may wield supernatural power, and Geopolitical''s rival city-states are the
    pressure behind a governing anti-colonial resistance rather than an across-polities balance-of-power chronicle. Revolutionary
    is the more specific current engine.


    Revolutionary partition: not Outlaw''s criminalized-class extraction network; not internal Overthrow (the pressure comes
    from Alderra''s takeover of Sirvassa); not Insurgent''s organized turning of an imperial machine from within; not Emancipation''s
    bondage/caste-release machinery. Messianic is a real rival in Iyena''s god-marked future and extraordinary rebirth, but
    no verified divinely authorized mass movement gathers around her sacred status as the political organizing engine. Do
    not invent one from resurrection alone. Open cultural resistance by the threatened community makes Rebel the best existing
    route. Within Rebel, Samizdat wins by what is being defended: the city''s history, knowledge, school learning and way
    of life against imposed erasure. The leaf''s copied forbidden texts are examples of its memory-war engine, not a requirement
    to invent an on-page clandestine copying scene. No such scene is claimed. Tinderbox is a serious spatial/climax rival,
    but an occupied-city setting and a rebellion at the ending do not by themselves establish streets/riots/banners as the
    full story''s governing mode. Evil empire fails its wider multi-land/multi-front scope. Samizdat is a moderate-confidence
    existing-leaf judgment on cultural erasure versus city uprising, not a claim that every scene is about texts.


    Ordinary move: Cozy peeps9to8, Samizdat6to7. Preserve all prior placement history and the same novel; localize the primary
    publisher''s English front. No invented sequel/shared universe or new genre. After the separately sourced three-novel
    A Gentle Apocalypse intake, Cozy peeps returns to9, so no false tenth split is served.'

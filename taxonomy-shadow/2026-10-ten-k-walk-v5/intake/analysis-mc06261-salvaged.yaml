walk: 'Speculative fiction > Science fiction > Futurist SF > Alien fiction > Alien horror.


  Scope: one shared universe, presented under its first novel''s title Salvaged, containing Salvaged (2019) and Reclaimed
  (2021) by Madeleine Roux. This card label is not a claim of a formally numbered series. Roux explicitly identifies Reclaimed
  as another story in the Salvaged universe in both the Paul Semel and Amazing Stories interviews; her later Goodreads author
  Q&A confirms the shared world and says it follows the earlier events, despite different main characters and standalone plots.
  A standalone reading experience is not a separate-universe statement. The current publisher dates are15October2019 and17August2021.
  The2019 interviews'' projected autumn2020 release for Reclaimed was a plan, not its actual publication date. The current
  bibliography lists no further published novel identified with this world; an old hope for more is not an additional book.
  Asylum, House of Furies, Allison Hewitt/Sadie Walker, separate romances/fantasy novels and licensed Warcraft, D&D, Marvel
  and Star Wars work are not silently folded into this science-fiction world. The active rows arrive in reverse original order
  and still form one two-book card.


  Root: the primary sources establish a spacefaring human future, bioengineering, research ships, extraterrestrial fungal
  infection and a dangerous memory-alteration procedure in a futuristic Ganymede facility. Locus explicitly locates Reclaimed
  in2268. The first novel''s precise in-world year is not inferred from that. Roux explains her speculative alien biology
  through parasitism, fungal networks and bioluminescence; the novels are repeatedly identified as SF/horror, including by
  their author and publisher. Fantasy is a real surface rival: Salvaged began as a Beauty and the Beast reworking, its author
  cites Angela Carter, Reclaimed uses an Old Dark House structure, and a critic finds its hidden technology insufficiently
  scientific. Those facts are retained. But a fairy-tale source or a criticism of rigor is not proof of literal magic. No
  supernatural deity, curse, ghost or independent fantasy world is established as the causal engine. Fantasy realms'' Fairytale/Gothic/Heart
  branches, Real earth fantasy''s future/psi routes and Portal fantasy do not supersede the explicit scientific/alien future
  frame. The romance and trauma recovery are substantial, not a reason to pretend the alien is a supernatural beast.


  Science fiction temporal walk: Historical SF fails a backward-looking documented past or retro-industrial future. Modern-day
  SF fails the future Earth-descended space civilization: Contemporary psychological SF, genetic engineering/nanomedicine,
  present-day psi and cryptid horror have attractive thematic words but the wrong era and mechanisms. Atemporal SF is tested
  seriously rather than equating unreliable memory with a stable reality. Reclaimed has gaps and rewriting inside characters''
  minds while the outside world and the reader''s view remain stable; it is not evidence of an Inner space fabulation that
  projects a competing reality. Neither novel is established as a literal time-travel story, reincarnation cycle, parallel-world
  journey or psyche-made cosmos. New weird''s mingling of modes and body-myth''s transformation imagery do not displace the
  grounded future/alien account. Science fantasy''s atemporal fantasy-surface gate fails a usable Earth-derived future anchored
  to named places. Futurist SF is the positive temporal branch.


  Futurist siblings: Hard SF is a genuine alternative, not dismissed merely because the books are frightening. Salvaged has
  a biochemist protagonist, scientific countermeasures and researched fungal behavior; Reclaimed examines memory connections
  and a concealed procedure. Amazing Stories'' interviewer even describes a hard-SF component. But exact scientific constraint
  or a rigorous world-model is not the primary reading contract across the pair. Locus praises speculation but another completed
  reviewer criticizes the explanation, and the final-book tension is coercion, memory, identity and survival. Orbital mechanics,
  terraforming/planetary science, matter transmission and the Hard conceptual mind-model leaves do not describe the whole
  form better than SF horror.


  Future of Earth fiction supplies real mind-and-society rivals. Rewired minds positively resembles Reclaimed''s altering
  an existing mind in place; Copied minds is weaker because copying or uploading a personality is not the established central
  process. Psychological SF and Future social SF catch trauma and identity but their present-day/Earthbound settings do not
  fit this pair of off-Earth narratives. Psionics catches the fungal network''s apparent shared thought and the second novel''s
  intrusion into memory, but no developed science-of-psi story or psi-shaped society organizes the whole fiction. Machine
  minds, cyberpunk and technologically remade human societies catch the servitors, implants, pervasive future technology and
  intrusive treatment, not the primary alien-horror experience. A small abusive experiment is not automatically a totalitarian
  dystopia or a world-history account. No future war, utopian social design or Earth ecological collapse is established as
  the governing story. The Future-of-Earth parent is not falsely reduced to a ban on every offworld episode; the judgment
  is the whole world''s emphasis.


  Spacefaring fiction strongly passes the setting. Its Space techno fiction is the strongest alternative to the final branch
  because shared networks, invasive mind changes and technologically mediated identity matter. But the first book''s central
  force is a nonhuman parasitic intelligence consuming hosts, not interstellar computation or a posthuman technological transformation
  project; the second keeps bodily/mental violation and fearful confinement at the center. Space opera''s Classic/New/Evergreen
  traditions fail a large-scale adventure or civilizational sweep as the primary mode; a spaceship and an endangered humanity
  do not alone make that form. Military SF''s Ground-pounders, Navy, Academy and Command fail a service/campaign spine. Future
  history in space fails a sustained civilizational course. Generation starships fails a multigenerational society aboard
  a ship. Space colonies'' Mystery/Politics/Colony life leaves catch a Ganymede mystery but not the pair''s governing civic
  life, and the first ship is a salvage assignment rather than an established colony. Space dystopias catch captivity and
  abuse but the closed oppressive society itself is not the central order across both novels. Comic space fiction fails sustained
  comedy. The intimate haunted-house/ship-like reading experience remains explicit, not forced into a panoramic space genre.


  Alien fiction passes positively through Salvaged''s alien fungus Foxfire/Mother, its struggle for hosts'' identities and
  its threatened expansion; the author directly identifies it as extraterrestrial life. Reclaimed''s library catalog separately
  gives Human-alien encounters, Memory and Survival subjects, corroborating that the companion is not simply an Earth medical
  novel transplanted into a moon backdrop. This catalog evidence is not treated as a full synopsis or proof of the exact hidden
  device mechanism. GameVortex''s completed review identifies a Lovecraftian-horror component, while Locus and Errant Dreams
  confirm that the memory procedure''s concealed nature is revealed as the story develops. No unverified exact species, device
  origin, final death list or hidden identity is supplied.


  Alien siblings: First contact is a substantive rival because a parasitic intelligence is encountered, but generic Human-alien
  encounters cataloging is not proof that humanity''s first consequential contact is the whole world''s organizing event.
  The books foreground intimate predation and violation, not a historical first meeting. Anthropological science fiction and
  its Earthborn, Xenanthropology, Xenolinguistics and Xenocolonial children catch radically different minds and the ethics
  of encounter, but cultural comparison, language or colonial relations do not organize this whole fiction as strongly as
  intimate horror. Hard alien > Alien biology is especially serious: Foxfire''s biochemistry, parasitism, networked thought
  and hosts'' resistance are concrete mechanisms. Yet that branch requires the hard-edged alien-space-opera frame; these are
  claustrophobic horror/thriller narratives, not principally alien evolution, an uplifted civilization or its cosmological
  constraints. Alien engineering/physics are less direct. Alien cosmic history fails a history of nonhuman civilizations.
  Alien delving > Wreck delving catches Rosalyn''s job title and boarding a presumed-dead vessel, but the ship is human and
  cargo/claims/salvage rights are the inciting assignment, not the whole story. Reclaimed is not another wreck expedition.
  Big dumb worlds/relics and Alien descent fail a vast alien artifact or downward alien-ground expedition as the governing
  arena.


  Positive leaf: Alien horror requires nonhuman life with horror as the primary engine, including dread, bodily violation
  and predation. Salvaged satisfies this directly in its alien takeover of bodies and memories, and explicitly complicates
  human survival with host personhood, coercion, trauma and romance. The companion shifts from a crew to experimental subjects
  and from infection to memory treatment, but completed criticism preserves the same intimate, frightening loss of self and
  survival form, with catalog evidence for alien encounters rather than a purely human-tech-only scope. Reclaimed''s full
  ending is not replaced with its promotional opening: multiple completed critics discuss the hidden explanation and eventual
  resolution; Elena Linville specifically describes the survivors'' accusation of the powerful experimenter and criticizes
  the tidy lack of wider fallout, while The Lily Cafe finds uneven closure and loose threads. Both that criticism and the
  human antagonist are retained. No claim is made that every book repeats the identical fungus or that nonhuman biology excuses
  human violence.


  Decision: existing Alien horror, six to seven fictions, one two-published-novel Salvaged-world card. Moderate confidence
  in this whole-world judgment: the first novel is an exact alien-horror match, the companion''s memory-centered focus gives
  Space techno fiction genuine weight, and its precise hidden mechanism remains unasserted. Author-confirmed unity forbids
  splitting the titles into convenient separate cards. The broader sustained horror of bodily/mental agency and nonhuman encounter
  is the closest honest existing leaf without changing a definition. No structure, portrait or unrelated fiction changes;
  no ten-fiction threshold reached.'
whole_content: 'Salvaged follows xenobiologist Rosalyn Devar, escaping family and personal trauma through hazardous space-cleanup
  work, onto the research ship Brigantine. Its crew survive as hosts of Foxfire/Mother, an alien fungal network that manipulates
  minds and bodies, while some hosts retain enough agency to resist. The conflict is not merely identifying a monster but
  surviving it without treating the innocent hosts as expendable, with romantic and recovery arcs. Roux explicitly says her
  Beauty and the Beast inspiration does not predict the final outcomes. Reclaimed follows different people in the same universe:
  Senna, Han and Zurri seek relief from trauma through Paxton Dunn''s memory procedure on Ganymede. Memory loss, isolation
  and coercion make them increasingly unable to trust their supposed treatment. Completed reviews cover the hidden technological
  explanation, identity/memory horror, resistance and the survivors'' subsequent accusation of the powerful experimenter,
  while disagreeing over the adequacy of closure and explanation. Library cataloging includes human-alien encounters, memory
  and survival. The exact final-book mechanism, any supposed repeated fungus, all final survivors and every character''s ultimate
  fate are not asserted. These are source-grounded whole-novel/ending-aware accounts, not a claim to have read both complete
  novels.'
confidence: Moderate. Shared-universe scope and publication years are strong primary facts. Salvaged is an exact alien-horror
  match. Reclaimed has a different cast and memory-treatment focus, catalog human-alien content and completed horror/closure
  criticism. Its precise hidden mechanism is not established by the cited reviews and is not invented. Space techno fiction
  remains a real rival to this whole-world placement.

id: dark-magical-realism
label: Dark magical realism
parent: magic-realism
origin: original
definition: 'Magic realism in which the marvelous runs dark: the accepted wonders of ordinary life are
  entangled with atrocity, occupation and grief - the living houses, spirit worlds and impossible trades
  are the fabric of a wounded nation rather than its charm. The marvelous is accepted as ordinary, as
  everywhere in magic realism; here the ordinary is the wound. Named by the curator on 2026-09-27 after
  The Unconquered Country.'

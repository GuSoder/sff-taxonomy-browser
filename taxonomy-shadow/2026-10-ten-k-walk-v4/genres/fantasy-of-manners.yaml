id: fantasy-of-manners
label: Fantasy of manners
parent: gothic-fantasy
origin: original
definition: 'The Pax Britannica manners branch of the Gothic School: secondary-world fantasy governed
  by British imperial-era gentlemen, etiquette, class performance, courtship and intricate social codes
  rather than battlefield heroics.'

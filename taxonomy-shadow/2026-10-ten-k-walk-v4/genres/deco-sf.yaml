definition: 'Deco SF: science fiction set in the Art Deco interwar era (roughly 1918-1939) - jazz-age
  and Depression-era cities of chrome, glamour and rot underneath, where a single scientific or psychic
  marvel breaks into the period. Rhymes with the banked Deco fantasy name. Named by the curator 2026-09-23.'

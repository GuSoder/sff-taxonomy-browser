id: deal-with-the-devil
label: Deal with the devil
parent: evil-deals
origin: original
definition: 'Evil deals in which the counterparty is the Devil himself or his demons: a soul signed away
  for power, knowledge, freedom or fame - the established idiom and trope. The signature may be literal,
  negotiated, routed through a devil''s servant (Vathek''s Giaour of Eblis), a folklore demon or signed
  by proxy. Sibling line: Wicked wishes holds every other power that answers.'

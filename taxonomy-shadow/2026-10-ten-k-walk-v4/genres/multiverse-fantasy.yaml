id: multiverse-fantasy
label: Multiverse fantasy
parent: fantasy-rifts
origin: original
definition: Portal fantasy whose premise is a system of many worlds - shadow realms, parallel Londons,
  the multiverse as cosmology - with order and chaos in play across them (Moorcock's line; SFE 'Multiverse').
  One hidden world revealed is the sibling shelf, Otherworld fantasy.

id: arthur-reimagined
label: Arthur reimagined
parent: arthurian-fantasy
origin: original
definition: 'Arthurian fantasy that makes the retelling itself an argument: the legend reshaped through
  women''s, queer or satirical perspectives rather than told straight. Split from Arthurian fantasy on
  the curator''s 2026-09-29 ruling (phonemsg-01M3NVHS8KEANY81ZFSMB9WXHZ ''Execute'').'

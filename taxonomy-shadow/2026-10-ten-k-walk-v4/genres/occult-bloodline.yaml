id: occult-bloodline
label: Occult bloodline
parent: modern-occult
origin: original
definition: Modern occult fantasy where family inheritance and practiced ancestral magic open the occult
  world within contemporary urban life. Yolanda's school threat is the plot bend; inherited brujeria and
  visions are the gift that lets her meet it. Split from Modern Occult under the curator's harmonized
  names (phonemsg-01M3P9RM636KMZRM7J0PR29XGC, 2026-09-29).

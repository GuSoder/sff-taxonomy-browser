id: contemporary-mythic-fantasy
label: Contemporary mythic fantasy
parent: contemporary-fantasy
origin: original
definition: 'Contemporary fantasy in which ancient mythic beings, archetypes or powers remain active within
  ordinary present-day life, making myth a living force, partitioned by which mythology stays alive: the
  inherited traditions of Albion, Greek, Anansi, Chinese and orisha, or an invented cosmology an author
  built outright.'

id: historical
label: Historical
parent: science-fiction
origin: original
definition: 'Science fiction set in a past era as experienced by the present-day reader: real history,
  alternate timelines or a reimagined past. Partitioned into Proto SF (written in its own era), Period
  SF (modern books set in the past, marked by period aesthetics, SF elements open or hidden), Alternate
  history (a fork, not an era) and Hidden history SF (extraordinary events history never recorded). A
  writer-present or writer-future setting must also be tested here once it now feels clearly historical.'

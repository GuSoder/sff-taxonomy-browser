id: robots
label: Robots
parent: machine-minds
origin: original
definition: 'Pure umbrella for machine minds in bodies, split by what the body is for: humanoid replicas
  that pass as human (Androids) and robots whose personhood is the story (Sentient Robots). Embodiment
  test against AI still holds: a machine in a body is Robots; a disembodied or distributed intelligence
  is AI.'

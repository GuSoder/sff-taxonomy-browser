id: alt-flintlock-fantasy
label: Alt flintlock fantasy
parent: alternate-history-fantasy
origin: original
definition: 'Alternate history fantasy of the musket age, roughly the 17th century to the Napoleonic and
  Regency years, in Europe and the early American frontier: armies, courts and empires of powder and sail,
  and magic is the engine: history is openly rewritten and the world runs on magic.'

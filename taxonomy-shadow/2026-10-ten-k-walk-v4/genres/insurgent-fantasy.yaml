id: insurgent-fantasy
label: Insurgent fantasy
parent: revolutionary-fantasy
origin: original
definition: 'Insurgent fantasy of subversion from within: agents, officials and insiders who work the
  imperial machine against itself through infiltration, conspiracy and turning. Resistance-mode test:
  if the colonized fight the empire in open revolt, it is Rebel fantasy; if the story''s resistance works
  by subversion from within the imperial order (infiltration, conspiracy, turning), it is Insurgent fantasy.'

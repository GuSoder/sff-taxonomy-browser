id: technomancy
label: Technomancy
parent: gothic-fantasy
origin: original
definition: 'Gothic fantasy where actual magic is organized through technological forms: necromancy as
  engineering, haunted apparatus, occult systems and ominous science-fantasy. The “-mancy” postfix carries
  the curator’s intended necromancy connotation.'

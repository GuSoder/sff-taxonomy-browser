definition: 'Science fiction whose premise or any element is travel or communication through time. The
  SF/Fantasy walk runs first: magic-side time travel stays in Fantasy. Any science-fiction time travel,
  as premise or element, sorts here regardless of setting dates, superseding reader-relative and author-relative
  sorting. the curator 2026-09-23: "Always do the walk, I meant, when in sci fi, anything time travel
  goes Atemporal." and "I prefer any, if someone travels over the border of historical eras, it can mess
  up sorting in the other genres, this is what Atemporal is for."'

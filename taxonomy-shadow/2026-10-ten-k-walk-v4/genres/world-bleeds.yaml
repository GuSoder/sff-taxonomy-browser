definition: 'Portal fantasy of a world-leak rather than a journey: another world is tapped or glimpsed
  and its effects cross into ours, but nobody travels there and the hidden world is not found, revealed
  or reconciled. The leak is the engine. Sibling to Otherworld fantasy, where the hidden world becomes
  the destination; named and seeded with The Last Storm by curator ruling phonemsg-01M3P75RM8YV1VNTH0R3E65J53
  (''Ok, execute'') 2026-09-29.'

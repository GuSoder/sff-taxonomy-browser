definition: 'Time travel or rewind carried by a taken or administered substance, natural or manufactured:
  a tonic, drug, serum or mineral treatment moves or turns back the user''s time. It is the fourth cause
  beside a built device (Time machines), an unexplained slip (Timeslips) and the traveler''s own body
  (Time travel disorders). Named by the curator 2026-10-01.'

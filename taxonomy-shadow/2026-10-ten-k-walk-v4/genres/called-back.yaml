id: called-back
label: Called back
parent: ghosts-and-grief
origin: original
definition: Ghost stories in which the dead are called back or held by the love of the living - returned
  lovers, spouses, friends and children whose presence answers a grief that refuses to let go; the bond,
  not a wrong, is what binds them.

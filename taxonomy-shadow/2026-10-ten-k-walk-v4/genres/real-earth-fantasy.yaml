id: real-earth-fantasy
label: Real earth fantasy
parent: fantasy
origin: original
definition: Fantasy rooted in our own Earth and its universe - past, present or future - rather than an
  independently invented fantasy universe. Earth-rooted stories may leave Earth for space, other planets,
  parallel dimensions, Faerie or the afterlife without leaving this branch. Includes magic realism, historical
  and contemporary fantasy, urban fantasy, mythic retellings, animal fables, the supernatural and Earthly
  comic fantasy.

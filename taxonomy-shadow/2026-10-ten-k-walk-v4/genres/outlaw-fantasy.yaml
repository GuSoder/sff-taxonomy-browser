id: outlaw-fantasy
label: Outlaw fantasy
parent: revolutionary-fantasy
origin: original
definition: 'Revolutionary fantasy whose resistance works by RESCUE - a state criminalizes a class of
  people, declaring them outside the law, and a covert network hides and smuggles them to safety. The
  state is the persecutor, not an occupier. Gate: the criminalized class plus the rescue engine (hiding,
  extraction, safe passage). Sibling lines: overthrow = mass uprising; messianic = a marked figure leads
  a mass movement; rebel = open revolt against an occupier; insurgent = subverts the state machine from
  within; samizdat = saves texts and memory, not bodies; tinderbox = occupied-city street uprising; outlaw
  = saves bodies from the law itself. The Robin Hood pull is acceptable overlap - a hunted-class story
  belongs near this shape; outlaw names the hunted class, rebel names open revolt (the curator, 2026-09-28).'

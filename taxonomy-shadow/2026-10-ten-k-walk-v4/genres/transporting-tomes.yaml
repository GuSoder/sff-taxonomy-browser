id: transporting-tomes
label: Transporting tomes
parent: portal-fantasy
origin: original
definition: Portal fantasy whose crossing is carried by a book, text or act of reading. Text includes
  cartographic maps, not only prose. The child-story-rooted name guides the user; the textual mechanism
  governs.

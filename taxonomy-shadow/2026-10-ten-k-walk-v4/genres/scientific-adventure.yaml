id: scientific-adventure
label: Scientific adventure
parent: proto-sf
origin: original
definition: Nineteenth-century speculative fiction built on a technological marvel and the fantastic voyage
  it enables (SFE headword SCIENTIFIC ROMANCE; Verne's prime-years novels are consanguineous with the
  form). New leaf created 2026-09-13 for Verne; hard science fiction is at the 10-work cap. Renamed from
  Scientific romance to Scientific adventure 2026-09-14 at the curator's direction; SFE attests 'scientific
  romance' as the period term and the two are treated as interchangeable in grounding.

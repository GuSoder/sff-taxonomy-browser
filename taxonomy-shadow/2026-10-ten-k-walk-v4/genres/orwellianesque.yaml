label: Orwellianesque
parent: orwellian-dystopia
origin: original
definition: Last-resort intake leaf for dystopias resembling Orwell's coercive methods but matching no
  sibling thread yet; it is meant to crystallize into a more specific pattern, not absorb convenient leftovers.
  Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.

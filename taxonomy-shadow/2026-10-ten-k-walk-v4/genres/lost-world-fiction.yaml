id: lost-world-fiction
label: Lost world fiction
parent: proto-sf
origin: original
definition: 'Adventure fiction in which explorers discover a surviving prehistoric or otherwise isolated
  world: hidden plateaus, hollow-earth caverns and lost valleys where dinosaurs, ancient peoples or vanished
  civilizations endure. Coined from the SFE Lost Worlds theme entry; Verne''s Journey to the Center of
  the Earth (1864) is the genre''s founding text.'

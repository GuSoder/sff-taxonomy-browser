id: hard-alien
label: Hard alien
parent: alien-fiction
origin: original
definition: New space opera built around genuinely alien beings and hard-edged cosmology - uplifted species,
  zones of thought, ancient artifacts, alien plagues (Brin's Uplift, Vinge's Zones of Thought, the Expanse's
  protomolecule, Harrison's Kefahuchi Tract). the curator-coined label; split 2026-09-14 from new space
  opera under the ten-work cap.

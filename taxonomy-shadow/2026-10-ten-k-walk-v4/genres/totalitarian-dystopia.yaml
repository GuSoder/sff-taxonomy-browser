label: Totalitarian dystopia
parent: dystopian-fiction
origin: original
definition: 'Umbrella for totalitarian dystopia in three modes: Huxleyan control through pleasure, conditioning,
  drugs and engineered bodies; Orwellian control through surveillance, censorship, law and force; and
  Dystopian rebellion, where the story is the fight against a totalitarian regime already in power.'

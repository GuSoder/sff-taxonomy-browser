id: cryptid-horror
label: Cryptid horror
parent: soft-science-fiction
origin: original
definition: Modern-day soft science fiction and horror in which an alleged hidden animal or folkloric
  species becomes materially real, with the creature's biological possibility supplying the speculative
  premise and its attack, pursuit or discovery supplying the horror.

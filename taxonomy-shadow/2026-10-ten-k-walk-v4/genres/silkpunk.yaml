id: silkpunk
label: Silkpunk
parent: far-shores-fantasy
origin: original
definition: 'Ken Liu''s coinage for the Dandelion Dynasty''s silk-and-bamboo technology aesthetic, widened
  by reader usage to pan-East-Asian fantasy - umbrella for the East Asian heritage branch of Far shores.
  Chuanqi holds the classical Chinese lineages; Genso holds modern and re-imagined East Asia. Named Silkpunk
  by reader usage over Liu''s narrower definition (the curator 2026-09-26). About-ness test: the culture
  does the work.'

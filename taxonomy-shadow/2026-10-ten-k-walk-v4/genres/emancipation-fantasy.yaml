id: emancipation-fantasy
label: Emancipation fantasy
parent: revolutionary-fantasy
origin: original
definition: Political fantasy in which people born into bondage or caste seek freedom by breaking the
  magical or social machinery that makes them unfree; emancipation, rather than a mass uprising, sacred
  leader, occupying empire, insider coup or rescue network, is the engine.

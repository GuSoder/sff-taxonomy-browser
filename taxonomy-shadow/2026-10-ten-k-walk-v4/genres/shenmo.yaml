label: Shenmo
parent: chuanqi
origin: original
definition: '神魔 (shenmo), the Ming-era Chinese gods-and-demons tradition descending from Journey to the
  West: mythic adventures shaped by deities, demons, ghosts, animal spirits, celestial bureaucracy and
  the mingling of Buddhist, Daoist and folk cosmologies. The classical parent tradition of Xuanhuan and
  Xianxia.'

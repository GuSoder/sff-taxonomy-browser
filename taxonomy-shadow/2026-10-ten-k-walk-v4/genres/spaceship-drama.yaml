id: spaceship-drama
label: Spaceship drama
parent: space-soap-opera
origin: original
definition: 'Character-driven new space opera focused on intimate interpersonal drama among a spaceship
  crew or close spacefaring community; cooperation, mutual aid, care and found family drive the story,
  with diplomacy favored over conquest. Search aliases: cozy space opera, iyashikei (the Japanese healing
  slice-of-life tradition), found family, Hearthship. Western frontier grammar belongs elsewhere. Named
  by the curator on 2026-09-22; Hearthship is reserved as a possible child if this genre later splits.'

id: retro-space-opera
label: Retro space opera
parent: pulp-space-opera
origin: original
definition: Twenty-first-century space opera that deliberately looks backward, channeling the pulp era’s
  style. Unlike New space opera - the 1990s-2000s movement that modernized the form - Retro space opera
  is the throwback.

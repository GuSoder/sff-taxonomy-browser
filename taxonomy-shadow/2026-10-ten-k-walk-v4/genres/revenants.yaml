id: revenants
label: Revenants
parent: ghost-stories
origin: original
definition: Ghost stories in which a specific dead person returns or remains as a purposeful presence
  bound to the living through love, guilt, grief or memory. "Revenants" is a taxonomy coinage built on
  the established folklore term revenant for one who returns after death. Split by the curator 2026-09-26
  into Ghosts & grief (love, guilt and memory) and Vengeful spirits (menace and justice).

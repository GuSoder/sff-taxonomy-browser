id: theological-space-opera
label: Theological space opera
parent: new-space-opera
origin: original
definition: 'Theological space opera: new space opera driven by the search for God, transcendence or a
  sacred order - pilgrimages to cosmic powers, starship captains drawn into holy quests, churches and
  messiahs on a galactic stage. Religion is the engine of the story, not background. Named by the curator
  2026-09-23.'

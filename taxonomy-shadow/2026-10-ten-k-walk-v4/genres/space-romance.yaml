id: space-romance
label: Space romance
parent: space-soap-opera
origin: original
definition: New space opera in which the romantic relationship is the plot's spine, with interstellar
  societies, travel or conflict shaping who can be together. Adventure and politics supply the stakes
  rather than displacing the relationship. Created by the curator on 2026-09-30.

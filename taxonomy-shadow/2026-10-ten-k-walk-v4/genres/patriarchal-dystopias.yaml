id: patriarchal-dystopias
label: Patriarchal dystopias
parent: social-dystopia
origin: original
definition: 'Patriarchal Dystopias: dystopian futures whose engine is patriarchy - male rule as the organizing
  principle of the oppression, women held as property, breeding stock or scapegoats. Falling fertility
  may trigger it, but the subject is the rule of men. Named by the curator 2026-09-23.'

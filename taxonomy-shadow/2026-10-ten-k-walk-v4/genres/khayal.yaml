id: khayal
label: Khayal
parent: far-shores-fantasy
origin: original
definition: 'خيال (khayal), Arabic for imagination and fantasy, with the classical double sense of shadow
  and phantom: fantasy of invented worlds drawn from Arabic, Islamic and Andalusi cultures and histories.
  Alf Layla is banked for a future classical Nights leaf. Named by the curator 2026-09-23.'

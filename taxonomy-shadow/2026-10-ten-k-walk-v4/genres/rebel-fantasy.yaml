definition: 'Rebel fantasy of open revolt: colonized peoples take up arms, magic and banners against the
  occupying empire. Resistance-mode test: if the colonized fight the empire in open revolt, it is Rebel
  fantasy; if the story''s resistance works by subversion from within the imperial order (infiltration,
  conspiracy, turning), it is Insurgent fantasy. Umbrella since 2026-09-26: split-with-umbrella into Samizdat
  fantasy and Tinderbox fantasy by resistance engine (the curator ruling phonemsg-01M3E8956VEW8AJ2Y7D9JVSQA1).'

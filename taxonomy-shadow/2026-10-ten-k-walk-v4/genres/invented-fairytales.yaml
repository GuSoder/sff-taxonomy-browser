id: invented-fairytales
label: Invented fairytales
parent: fairytale-fantasy
origin: original
definition: Fantasy that tells newly invented fairytales rather than revising a recognizable inherited
  one. Fable and enchantment logic organize the story, whether one tale, a linked cycle or a novel; a
  heroic quest or literal fairies are not required.

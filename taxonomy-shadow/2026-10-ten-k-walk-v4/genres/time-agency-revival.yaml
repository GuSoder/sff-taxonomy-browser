id: time-agency-revival
label: Time agency revival
parent: time-travel-agency
origin: original
definition: 'The post-2010 literary revival of the institutional Time Machines idea: ministries, institutes
  and rival agencies with an emotional core and an awards-circuit sensibility - time war as epistolary
  romance, the civil service as love story, the agency as frame for meditations on memory and reality.
  The owner test still applies; this shelf is the revival wave of it. Named under the curator''s 2026-09-26
  era split (the axis is era/sensibility, the tree''s one non-content axis - his explicit call).'

id: climate-displacement
label: Climate displacement
parent: cli-fi-dystopia
origin: original
definition: Cli-fi dystopia in which a broken climate uproots people into war, migration, trafficking
  or enforced exile, and coercive systems govern the displaced. Metronome's island exile is punitive rather
  than migration, but climate scarcity shapes its system. Split from Cli-fi dystopia on the curator's
  2026-09-29 ruling (phonemsg-01M3P8H4RAJVY4Y2ACXN9QKEVZ 'Execute').

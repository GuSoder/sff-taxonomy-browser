definition: 'Ghost stories in which a specific dead person returns or remains bound to the living through
  love, guilt, grief or memory - the melancholy, elegiac register of the revenant: returned lovers, lingering
  children, witness-spirits and the narrating dead. Split from Revenants (the curator 2026-09-26).'

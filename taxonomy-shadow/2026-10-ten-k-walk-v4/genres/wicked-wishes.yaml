id: wicked-wishes
label: Wicked wishes
parent: evil-deals
origin: original
definition: 'Evil deals in which the counterparty is anything but the Devil: a wish, a prayer or an heirloom
  answered by some other power - a god of the night, the mer, a carnival that grants secret desires, a
  portrait, a button box. The price hides in the granting. Sibling line: Deal with the devil holds the
  Devil and his demons.'

id: new-weird
label: New Weird
parent: atemporal
origin: original
definition: Cross-genre speculative fiction that freely mingles science-fiction, dark-fantasy, and horror
  modes, often using strange, materially detailed settings, grotesquerie, ecological unease, or transformations
  that resist a single explanatory genre.

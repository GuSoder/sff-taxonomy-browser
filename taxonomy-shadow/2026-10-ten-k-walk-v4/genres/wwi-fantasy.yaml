id: wwi-fantasy
label: WWI fantasy
parent: industrial-age-fantasy
origin: original
definition: 'Industrial-age fantasy of the Great War era, 1914-1918 and its immediate shadow: trench and
  home-front alike, the war or its social machinery as the historical stage, magic entering through gift,
  curse or haunting. Named by the curator on 2026-09-27 after Dry Land; ''Great War'' is the era''s own
  proper name. Sibling banked by the same ruling: WWII fantasy (Second World War). The leaves were renamed
  WWI fantasy / WWII fantasy by the curator on 2026-09-30.'

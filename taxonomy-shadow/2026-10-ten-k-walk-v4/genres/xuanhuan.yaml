definition: '玄幻 (xuanhuan), ''mysterious fantasy'': broad modern Chinese mystic fantasy - Daoist and folk
  cosmology, ghosts, fox spirits, shamans and immortals in invented worlds drawn from Chinese history
  and legend. The modern heir of the Shenmo tradition. Named by the curator 2026-09-23.'

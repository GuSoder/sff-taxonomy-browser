placement_rationale: 'Actual tree reaches Post-holocaust survival, a pure umbrella. SFE and Hachette describe a post-nuclear technophobic US two generations after
  ruined cities, where boys seek Bartorstown and secretly revived science. Neither existing child fits honestly: the nuclear cause is historical background rather
  than the governing survival engine, while the story centers prohibition and reconstruction of technology. A new Technophobic reconstruction leaf would preserve
  purity.'

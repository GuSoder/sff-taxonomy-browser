definition: 'Historical fantasy in the pulp-adventure mode: fast, sensational, knockabout treatments of past eras, religious
  legends or mythic material that use history as a lurid stage rather than treating inherited myth with seriousness. “Pulp
  fantasy” is a taxonomy coinage built on an attested descriptive phrase, not an established shelf headword.'

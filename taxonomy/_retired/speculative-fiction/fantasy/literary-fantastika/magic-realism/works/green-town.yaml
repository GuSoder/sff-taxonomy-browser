placement_rationale: >-
  SFE identifies these three associated Green Town books and calls their treatment of adolescent small-town summers Magic Realist in intensity, central to Bradbury's imagination. Their marvels arise inside the ordinary rhythms of 1928 Green Town and are received through memory and wonder rather than explained as a separate magical system, fitting Magic realism.

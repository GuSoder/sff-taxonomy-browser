placement_rationale: 'SFE places Cocaine Nights in Ballard''s late contemporary-facing line: a spiritually frozen Mediterranean enclave becoming a Keep,
  with a detective uncovering crimes that reveal its meaning. Counterpoint describes an exclusive resort where drugs, pornography, murder and illicit sex
  are engineered beneath a cultured surface to animate a society of unlimited leisure. Its recognizable present-day enclave is a sick social order, not
  a future state, fitting Social dystopia.'

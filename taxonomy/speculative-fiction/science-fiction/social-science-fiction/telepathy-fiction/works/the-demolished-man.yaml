placement_rationale: "A murder plot inside a society where telepaths (Espers), though distrusted, are fully integrated; the telepathy structures both the society and the telling. SFE's Telepathy theme entry leads with it as a pioneering depiction of such a society. New leaf telepathy-fiction created under social-science-fiction (4/10 children, room); the label is SFE-attested."

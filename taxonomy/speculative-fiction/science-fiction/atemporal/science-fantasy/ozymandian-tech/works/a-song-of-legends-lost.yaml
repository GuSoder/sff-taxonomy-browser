placement_rationale: 'Epic fantasy surface (nobles summon battle-ancestors) built on the buried remains of the Scathed, an ancient high-tech culture destroyed by
  its own creation: greyblood machine enemies, techwork artifacts, voices that "could be spirits or some of the Scathed''s old technology" (SFFWorld); reviewed as
  science fantasy (JamReads, Fantasy Book Critic). Placed via Gustav''s 11:21 ruling seeding Ozymandian tech (was held #9). REVISIT on Invoker book 2 (Gustav 11:29):
  confirmed tech engine -> move to Hard science fantasy; confirmed real magic -> move to the fantasy side (no magic-actual books on the SF side of the tree).'

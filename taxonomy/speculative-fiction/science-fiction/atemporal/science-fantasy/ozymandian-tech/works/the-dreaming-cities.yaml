placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Science fantasy > Ozymandian tech. A
  thousand years after a global war and a zombie plague, city-states, church and superstition rule while machine relics, mutants
  and resurrected prehistoric beasts roam, and the silent Dreaming Cities, said to be the homes of angels, hold sealed technology;
  in The Ghoul King the knight Quinn serves a woman seeking to repair her robot, guarding a technological secret (Tor Publishing
  Group pages, described as post-apocalyptic science fantasy). Surviving old-world technology reads as sacred or lost magic,
  the leaf''s definition. Both books folded as the Dreaming Cities series. Rejected: Dying earth (no moribund sun, the world
  is a thousand years after a war), Apocalyptic fiction leaves (the catastrophe is long past). Wobble: moderate. Sources:
  Tor pages. Years: 2016 both (Solaris first editions).'

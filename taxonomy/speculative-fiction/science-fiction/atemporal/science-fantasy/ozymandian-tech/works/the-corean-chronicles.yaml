placement_rationale: 'Modesitt''s eight-novel Corean Chronicles (Legacies 2002 to Lady-Protector 2011): two trilogies and
  a duology on Corus, a world built by the Alectors, a human-like race from another world who farm its life force, ride bred
  pteridons, and rely on technology run from a Master Scepter (the Alucius books, a thousand-plus years later, live among
  the ruins of that fallen civilization and its Ancient/Soarer remnants). Sources: Wikipedia, Macmillan and lemodesittjr.com
  blurbs. Root-down: Fantasy surface (Talent magic, militia and court plots) but the world is a collapsed high-tech civilization,
  so Science fantasy -> Ozymandian tech (buried remains of an ancient high-tech culture whose technology rivals magic). Tried
  Fantasy -> Epic fantasy -> Military fantasy (Mud-and-blood for the Alucius trilogy) and Political fantasy (Mykella duology)
  and rejected them: each fits only part of eight books, the fallen-civilization frame covers all three cycles. Wobble moderate
  to high. Alternative: Mud-and-blood fantasy (3) for the Alucius trilogy alone. Covers: real Tor jackets for the first book
  of each cycle.'

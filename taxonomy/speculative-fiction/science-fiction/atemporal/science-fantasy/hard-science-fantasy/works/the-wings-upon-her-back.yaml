canonical_genre: hard-science-fantasy
placement_status: accepted
placement_rationale: 'Radezhda, a tower city built around portals to five sleeping gods whose boons were technology; Zenya joins the militaristic mecha sect and earns
  ''mechanical wings that connect to ports surgically opened in her back'' (Kirkus); decades later, stripped of them, she joins the resistance against her abusive
  mentor Vodaya. Wolfe (Locus): in-text scholars ''speculate that these may not be gods at all, but visitors of some sort'' - the book keeps ''genre equipoise''.
  Gustav ruling 2026-09-24 16:38: ''the visitor notes opens up the whole sci fan branch and the author goes through lengths to fit fantasy elements like wings in
  a scientific setting (surgery etc). So hard science fantasy may be executed.'' Mythological branch ruled out by him (invented pantheon, mythology kept light). WFA
  2025 nominee.'

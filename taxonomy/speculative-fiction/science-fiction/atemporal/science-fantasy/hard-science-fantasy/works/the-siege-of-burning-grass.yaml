placement_status: accepted
placement_rationale: 'Pacifist Alefret, jailed and tortured by his own warring nation Varkal, is sent with fanatical soldier Qhudur to infiltrate the enemy''s floating
  capital: healing wasps, tank-pillbugs, trained pteranodons, a camp in a giant skeleton (Reactor, Locus/Brookins, Ancillary). Reviewers split SF/Fantasy shelving;
  late in the book the world is admitted to be a lost colony - descendants of (presumably) Earth colonists, the floating cities plausibly repurposed colony-ship tech
  (Redheaded Femme; The Blurb calls it a ''rational explanation'' of the world''s history). No magic anywhere: fantasy surface, technology engine - the masquerade
  pattern. Locus Award 2025 + Locus Rec Fantasy. Placed by Gustav''s 2026-09-24 13:28 ruling (''*wanted hard science fantasy*''): the hidden lost-Earth-colony reveal
  is what the leaf was built for, while Earthborn''s cards are all open-origin books.'

placement_rationale: >-
  SFE says this tidally locked Earth divides fantasy-governed night from science-governed day, with the dichotomy driving its Technofantasy; Chicago Review Press likewise calls it a deliberate blend of science and magic. A fantasy surface whose magic/science opposition rests on planetary mechanics makes Hard science fantasy the closest leaf.

first_published: 2020
canonical_genre: science-fantasy
placement_status: accepted
placement_rationale: >-
  Open Road places the novel on far-future Earth in a post-utopian industrial hellhole beside a walled City of God, then reveals an impossible passage into that city. Publishers Weekly identifies the absent rulers as aliens and the miracles as ultra-advanced technology granting godlike powers. Its sacred-fantasy surface and technological explanation remain inseparable, making Science fantasy closest.

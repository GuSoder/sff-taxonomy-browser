id: briefing-for-a-descent-into-hell
title: Briefing for a Descent Into Hell
authors:
- Doris Lessing
first_published: 1971
canonical_genre: science-fantasy
placement_status: accepted
placement_rationale: >-
  SFE calls the novel equipoisal with science fiction or fantasy and describes the schizophrenic protagonist's mythic journey as the consciousness of a Venusian projected from a flying saucer. Penguin Random House presents the same inner-space voyage from mythic island and ruined city to singing planets while medical reality remains in tension with it. The unresolved meld of cosmic SF apparatus and mythic psychic adventure makes Science fantasy closest.

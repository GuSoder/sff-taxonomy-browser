placement_rationale: 'SFE (entry lewis_c_s) names the Ransom sequence Lewis''s primary contribution to SF proper: philologist Ransom is kidnapped aboard
  a spaceship and taken to Malacandra (Mars), where the plot turns on the planet''s nature, its three rational species and its cosmic order. SFE''s planetary_romance
  entry covers tales whose venue is an alien planet and whose plot turns on the nature of that planet, which is exactly the book''s shape - adventure on
  an exotic inhabited Mars. Shelfmates: Pern, Majipoor, Northwest Smith.'

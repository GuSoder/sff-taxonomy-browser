placement_rationale: 'Tanith Lee''s Day by Night (DAW, 1980; Penguin Random House description and a Stranger Than SF review):
  a planet locked to its sun, one side in permanent light, the other in permanent dark, where aristocrats live in decadence
  on estates run by robot servants whose makers no one remembers how to fix and the poor work and rot in slums; in the Day
  half Vel Thaidis, heir to the Hirz estate, is framed by the suitor she rejected, convicted by robot judges and banished
  to the Slumopolis, while in the Night half Vitra, who crafts dreams for the masses, dreams Vel into being as a mirror of
  her own life until the machines fail and she is stuck in the dark. Walk: Atemporal > Science fantasy > Planetary romance
  > Far-future planetary romance (natives of a far future with forgotten engines that read as fantasy, a strange habitat).
  Tried: Space colony dynasties (the ruling houses are the setting, the story is Vel and Vitra''s passage), Dying earth (at
  nine) and Classic planetary romance (no Earth visitor). Wobble: Dying earth and Space colony dynasties are the alternative
  leaves. Source: publisher description and a review, not the text.'

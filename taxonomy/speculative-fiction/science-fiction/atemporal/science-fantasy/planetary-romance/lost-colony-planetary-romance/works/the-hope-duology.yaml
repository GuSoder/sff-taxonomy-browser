placement_rationale: 'Full root-down walk: Science fiction (not fantasy: a colony planet settled by exiles from Earth after
  the 21st-century biotech revolution, the last AI in an ancient computer; SFE shelves it as sf) > Atemporal (not Futurist/Historical/Modern
  day: the colony''s regressed world sits outside any usable timeline) > Science fantasy (technology at the level of medieval
  Western Europe, old tech turned legend - SFE: ''the Planetary Romance glow this setting gives off'') > Planetary romance
  (adventure on an exotic world whose setting carries fantasy furniture) > Lost-colony planetary romance (not Classic - Vel
  is no visitor from Earth, he is born on Hope; not Far-future - this is not a far future where Earth is forgotten, it is
  a colony cut off from Earth: the people are descendants of exiled settlers, and the old technology - the Blakes AI - survives
  as hidden myth, exactly this leaf). Hope''s End (2001) and Hope''s War (2002), Tor; the announced third book never appeared
  (ISFDB Hope series, SFE). One universe fiction per rule 11j.'

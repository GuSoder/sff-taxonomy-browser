placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Science fantasy > Planetary romance >
  Lost-colony planetary romance. A colonizing expedition from Earth, its technology destroyed, has been stranded on Methuen
  for over two hundred years; survival rests on the Eumedicos healers and the Seekers Veritas, human-and-ghatti Bondmates
  (ghatti are native telepathic catlike beings) who travel from town to town truth-reading disputes, while realms like Canderis
  and Marchmont drift toward war and rogue mind-readers called Resonants threaten (PRH book and series descriptions). The
  forgotten colony''s dangers, powers and old technology have become custom and myth, which is the leaf''s definition. Rejected:
  Colony life and Colonial worlds (the settlers have forgotten Earth; this is not an established settlement''s civic life
  or a settlement-native collision), Psi powers (the telepathy is native to the ghatti and the realm, not a modern-day talent).
  Wobble: Psi powers, Fantasy realm politics. Five volumes folded as one fiction: Finders-Seekers (1993), Mindspeakers'' Call
  (1994), Exiles'' Return (1995), Sunderlies Seeking (1998), The Farthest Seeking (2000; the Ghatten''s Gambit books).'

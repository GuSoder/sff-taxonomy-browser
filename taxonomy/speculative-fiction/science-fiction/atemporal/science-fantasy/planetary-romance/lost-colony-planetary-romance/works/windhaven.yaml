placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Science fantasy > Planetary romance >
  Lost-colony planetary romance. Windhaven was settled by the crash of a colony starship; its people are the descendants of
  forgotten settlers on a world of small islands, harsh weather and monster seas, where light gravity and a dense atmosphere
  let humans fly on wings made from the cannibalized ship, and the flyers'' guild has become the custom and myth that binds
  the islands (georgerrmartin.com, Martin and Tuttle). The colony cut off from Earth whose old technology has become custom
  is the leaf''s definition. Rejected: Far-future planetary romance (Earth is not gone, the crash is remembered as history),
  Classic planetary romance (no Earth visitor). Wobble: it is a fix-up of earlier novellas and reads more like a social saga
  of a flying caste than a quest romance; Lost-colony is still the nearest leaf.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Science fantasy > Planetary romance >
  Classic planetary romance. Per the Gutenberg text and ISFDB: the inventor Edmund Stonewall builds an atomic-powered spaceship,
  flies a small party from Earth to Venus and adventures there among its people and creatures, then comes home. The hero is
  a visitor from Earth who arrives on a neighbouring world and adventures on it, which is the Classic planetary romance definition.
  Rejected: Scientific adventure (that leaf is the nineteenth century and its marvel-and-voyage Verne frame; this one is 1909
  and the stay on the other world is the book), Alien-fiction leaves (Futurist, observation or first contact is not the engine).
  Wobble: it is more engineering voyage than romance, and Scientific adventure''s period edge is close; the 1909 date and
  the Venus adventure decide it. First serialised in All-Story, January 1909 (ISFDB); book 1911. Cover is the Argosy Library
  omnibus with The Moon Metal, the only usable cover found.'

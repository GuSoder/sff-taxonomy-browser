id: the-saga-of-the-well-world
title: The Saga of the Well World
authors: Jack L. Chalker
first_published: 1993
canonical_genre: classic-planetary-romance
placement_status: accepted
placement_rationale: 'Full root-down walk: Science fiction (not fantasy: the Well World is a machine - a planet-sized computer
  built by the vanished Markovians, and the transformations are its engineering) > Atemporal (not Futurist/Historical/Modern
  day: the Well World sits outside any usable timeline, an invented world) > Science fantasy (SFE''s own words: ''a Science
  and Sorcery world... a game-board'', transformation tropes out of science fantasy - fantasy surfaces on a scientific engine)
  > Planetary romance (adventure on an exotic alien world or habitat carrying the sweep and furniture of fantasy: the Well
  World''s hexes of alien races are exactly that) > Classic planetary romance (not Lost-colony - these are not descendants
  of forgotten settlers; not Far-future - the heroes are not natives of a far future where Earth is forgotten: they are travelers
  from human space - Nathan Brazil, the Watchers, the crews marooned there - who arrive at the Well World and adventure across
  it. Visitor is how the hero stands to Earth). The three queue volumes of the saga: Echoes of the Well of Souls (Watchers
  at the Well 1, 1993), The Sea Is Full of Stars (1999) and Ghost of the Well of Souls (2000), the concluding duology (SFE,
  Wikipedia, ISFDB). One universe fiction per rule 11j; earlier volumes fold on as they surface.'

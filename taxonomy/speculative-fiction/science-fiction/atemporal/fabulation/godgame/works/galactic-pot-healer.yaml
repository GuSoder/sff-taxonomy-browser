placement_rationale: 'Philip K. Dick''s Galactic Pot-Healer (Berkley, 1969; Wikipedia): Joe Fernwright, a ceramic repairer
  on a bureaucratic future Earth, is summoned by the shape-shifting alien being Glimmung to Sirius 5 to help raise the sunken
  cathedral Heldscalla, while the planet''s single book, written by the Kalends, predicts that Glimmung will fail and that
  the crew will be destroyed or altered. Walk: Science fiction > Atemporal > Fabulation > Godgame (a godlike power and its
  rival, here the Kalends and their book, contest the pattern of events as a game). Tried: Theological space opera (the story
  is a wager with fate, not a holy quest) and Ozymandian tech (the cathedral is a task, not a buried culture''s works). Wobble:
  it reads as comic surreal adventure too. Nick and the Glimmung (1988, children''s book) is skipped.'

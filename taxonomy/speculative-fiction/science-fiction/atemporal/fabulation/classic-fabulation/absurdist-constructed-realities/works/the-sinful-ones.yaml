placement_rationale: 'One novel, one card: first published 1950 in Fantastic Adventures as "You''re All Alone", later expanded as The Sinful Ones (ISFDB, SFE). In
  Leiber''s Chicago nearly everyone is a scripted automaton and only a few people are awake to it; neither magic nor science explains the condition, which simply
  rules the city-world. That impossible governing condition is this leaf''s test.'

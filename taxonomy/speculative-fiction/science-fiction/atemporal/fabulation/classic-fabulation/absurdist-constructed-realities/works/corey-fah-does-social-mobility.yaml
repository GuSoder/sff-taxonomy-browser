placement_rationale: 'A working-class, non-binary writer wins the Award for the Fictionalisation of Social Evils but cannot collect: the trophy is a sentient flying
  saucer that keeps teleporting away, while a fawn-spider from another dimension, a wormhole trip and a time-loop finale pile up (NYT, Guardian, PW ''queer Kafkaesque
  romp''). The prize system is the impossible institution ruling the world. Clarke 2024 shortlist. Placed by Gustav''s 23:22 ruling.'

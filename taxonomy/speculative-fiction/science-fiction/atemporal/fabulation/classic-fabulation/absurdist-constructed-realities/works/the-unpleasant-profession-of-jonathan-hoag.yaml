first_published: 1942
canonical_genre: absurdist-constructed-realities
placement_status: accepted
placement_rationale: 'Heinlein''s 1942 novella (Unknown Worlds, as John Riverside; ISFDB): Hoag hires detectives to learn what he does all day, and the everyday world
  turns out to be a created artwork, with Hoag one of its critics and the Sons of the Bird its rival hidden makers. Gustav 17:47: not supernatural but fabulation
  - the same rigged-construction premise as The Sinful Ones on this leaf, with the world itself as the impossible ruling condition.'

canonical_genre: absurdist-constructed-realities
placement_status: accepted
placement_rationale: 'Root-down: SF -> Atemporal -> Fabulation -> Classic fabulation -> Absurdist constructed realities. The Northern Institute is an impossible sealed
  institution that defines its caretakers'' reality through pointless weekly maintenance rituals. Adams explicitly says its location cannot exist; snow sickness,
  the unknown object and managerial psychosis resist scientific resolution. No dated future, literal magic system, textual breach or game-master: the institution
  is the world-making condition.'

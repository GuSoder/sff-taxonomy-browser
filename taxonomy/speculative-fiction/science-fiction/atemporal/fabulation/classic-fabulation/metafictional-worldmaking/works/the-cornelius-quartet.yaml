placement_rationale: 'Root-down: Science fiction -> Atemporal -> Fabulation -> Classic Fabulation -> Metafictional worldmaking. SFE treats the revised central quartet
  as formally cumulative: Jerry and his recurring troupe move through increasingly unstable Londons under SF/fantasy manipulation, Law/Chaos and multiversal escape.
  Narrative revision and shifting world-making govern more than the opening novel’s super-science plot, fitting foundational fabulation.'

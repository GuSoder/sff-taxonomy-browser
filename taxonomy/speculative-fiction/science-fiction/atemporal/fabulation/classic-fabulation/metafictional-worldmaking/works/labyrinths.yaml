first_published: 1962
canonical_genre: metafictional-worldmaking
placement_status: accepted
placement_rationale: SFE identifies Labyrinths as a major English selection combining Ficciones and El Aleph stories, including the Library of Babel, Tlön and other
  metaphysical inventions; New Directions calls it trans-genre, multi-layered and self-referential. Its fictions make imagined books, libraries, branching time and
  invented worlds into the machinery of storytelling itself, matching foundational Classic Fabulation.

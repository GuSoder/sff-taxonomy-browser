placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Classic Fabulation -> Metafictional
  worldmaking. Eraserhead presents the novel itself as a structural guide to impossible grammar: a suicide survivor writes himself back into existence
  in a language that transforms his body, perception and learning. Writing and linguistic instruction visibly make the experienced world.'

definition: 'Metafictional worldmaking in which a character deliberately revises the history they inhabit:
  an event that happened is overwritten, and the experienced world resumes under a changed causal past.
  The engine is retroactive continuity of lived reality, not merely telling a new world into being, writing
  a text that becomes real or projecting an image. Named by the curator after the comic-book term retcon
  on 2026-09-29.'

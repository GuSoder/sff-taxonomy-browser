id: the-castle-franz-kafka
title: The Castle
authors: [Franz Kafka]
first_published: 1926
canonical_genre: classic-fabulation
placement_status: accepted
placement_rationale: 'Root-down: Atemporal -> Fabulation -> Classic Fabulation. SFE calls Kafka’s unfinished novel a vision of Absurdist SF in which K assaults the fog-shrouded workings of the Castle and the twentieth-century world becomes an endless office of transaction; Penguin grounds his unending struggle with an inscrutable authority. The Castle’s unstable bureaucracy and inaccessible center openly compose the world’s reality, making foundational Classic Fabulation stronger than a stable fantasy setting or merely psychological Inner Space.'

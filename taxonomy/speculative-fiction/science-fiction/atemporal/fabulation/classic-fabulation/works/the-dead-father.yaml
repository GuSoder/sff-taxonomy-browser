placement_rationale: >-
  Root-down: Science fiction -> Atemporal -> Fabulation -> Classic Fabulation. Macmillan describes a gargantuan half-dead, half-alive, partly mechanical father dragged by cable on an absurdist journey, and stresses Barthelme's freedom to reshape or ignore the world. The impossible cosmology and journey are openly made by postmodern storytelling rather than explained by science or treated as magic within ordinary reality, matching foundational fabulation.

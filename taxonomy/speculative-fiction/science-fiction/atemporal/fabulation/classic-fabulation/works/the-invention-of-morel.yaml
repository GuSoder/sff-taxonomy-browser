placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Classic Fabulation. SFE describes an abstract,
  parodic and metaphysical use of SF: Morel’s machine kills its models to make eternal three-dimensional projected avatars, composing an island reality
  around chimerical copies, invisibility and immortality. The story-making machine openly constructs the world.'

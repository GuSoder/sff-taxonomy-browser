placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Classic Fabulation. SFE calls Malacia a mysterious never-changing
  city and a restatement of entropy and the role of the artist; Aldiss frames its citizens through an actor who sees the embalmed city-state as art and artifice until
  reality catches him. The city’s ornate invented reality openly behaves as a composed tapestry.'

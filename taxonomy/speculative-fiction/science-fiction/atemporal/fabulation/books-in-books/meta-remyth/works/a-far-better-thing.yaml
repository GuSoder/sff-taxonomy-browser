placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Fabulation > Books-in-books > Meta remyth.
  Parry, 2025 (Tor, June 2025): a retelling of Dickens''s A Tale of Two Cities in which Sydney Carton was taken by fairies
  as a baby, leaving the changeling Charles Darnay in his place, serves the fairies as a lawyer, meets his double at the Old
  Bailey, and uses the French Revolution''s human and fairy politics to avenge himself on his fairy master Shadow and break
  free (Wikipedia; Publishers Weekly starred review, called a masterful fantasy riff on the Dickens). Rejected: Alt flintlock
  fantasy (the Revolution is the setting and the story is the Dickens plot reworked, the runner-up, with Scarlet and The Shadow
  Histories nearby), Fairytale expansion and Fairytale transplant (at 9, and the seed is a novel, not a fairytale), Textual
  trespass (no one enters the book), Written worlds. Meta remyth is the leaf for fiction that replays an inherited text so
  that the existing story lives differently, as Pride and Prometheus does with Austen and Shelley; here the changelings explain
  Dickens''s coincidences. Wobble: moderate. The leaf lives in the Atemporal fabulation branch and the book reads as historical
  fantasy; I followed the tree''s own placement of retellings of inherited texts. Plot from Wikipedia and reviews, not the
  book. Year 2025 (Open Library, Wikipedia). Queue id MC03619.'

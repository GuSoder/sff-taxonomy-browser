placement_rationale: 'Root-down walk: a contemporary Providence story in which a narrator''s written account and what happened
  cannot be separated, with no secondary world, so Atemporal; Fabulation; Books-in-books; Contradiction fiction (an invented
  document whose accounts conflict). Sources: Penguin Random House (India Morgan Phelps, ''Imp'', is trying to write her memoir
  but struggles with the unreliability of her own mind; she has schizophrenia and has a hard time separating fantasy from
  reality; the memoir tells her love story with her transgender girlfriend and her obsession with a mysterious woman she found
  naked and mute at the side of the road, who appears to her as a ghostly figure; she must piece her memories together to
  tell her story; blurb praise calls it a puzzle-box). The book is the memoir itself and its unreliability is the engine,
  so Contradiction fiction; Unmoored selves (identity coming loose) and Projected realities were considered. Wobble: the ghost-woman
  strand is real horror-fantasy material; I placed it by what the blurb stresses, the memoir and the unreliable mind, and
  I read no more than the PRH blurb and praise, so the book may be read as Gothic fantasy by others. Published 6 March 2012
  (Roc).'

definition_change:
  old: 'Books-in-books fiction where reality itself turns out to be authored - a world written, narrated or computed from inside, whose inhabitants discover their
    lives are someone else''s text. Coined by the curator 2026-09-24 (workshop: ''Ebooks in books'' -> ''Scripted books in books''); not an SFE/EoF headword.'
  new: Books-in-books fiction where reality is revealed or called into question as authored - a world written, narrated or computed from inside, whose inhabitants
    or readers confront the possibility that its lives and events are someone else's text.
  reason: Owner loosens inhabitants-discover gate for reader-facing authored-world uncertainty
canonical_genre: scripted-books-in-books
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Books in books -> Scripted books in books. The collective manufactured
  consciousness narrates Jon-Perse, a1980s French poet whose computer generates and analyzes poetry; its self-interrupting and revising narrative may fabricate the
  human creator and its own origin. Translator asks whether AI programs the poet, Full Stop identifies uncertainty over real/imagined figures, and Words Without Borders
  names a computerized lyrical consciousness. No claim of proven literal reality rewriting: reader-facing authored-world uncertainty is the engine. Original2022 Uzbek
  Telegram serialization, English2025 Shelley Fairweather-Vega. SF digital speculation, not verified magic; Atemporal because unstable authorship frames resist a
  reliable historical world, not merely because prose is experimental or earlier poems appear. No literal time travel established. Fabulation over conventional AI/Period
  SF: foregrounded storytelling/reliability. Books in books over Classic Metafictional worldmaking on the curator''s Scripted fit: authorial program and text within
  the narrated world put its reality in question. Siblings Contradiction fiction (conflicting documents), Meta remyth (inherited myth replay), Textual trespass (crossing
  in/out of texts) are less exact. Scripted definition previously required inhabitants discovering lives as someone else''s text; curator explicitly loosened it to
  reader-facing uncertainty and placed this second card. Late1980s frame still noted; no forced Steampunk/Deco Period SF leaf. Written worlds remains9, no new digital
  node or other card move.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Science fiction {Historical, Futurist, Modern day, Atemporal} -> Atemporal {Fabulation, New Weird,

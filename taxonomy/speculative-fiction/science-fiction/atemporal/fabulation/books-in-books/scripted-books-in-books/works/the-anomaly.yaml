placement_rationale: Air France 006 flies through a storm in March 2021 and lands twice, months apart, with identical passengers; governments debate the simulation
  hypothesis while each person meets their double, and a passenger-novelist's manuscript 'The anomaly' turns out to be the book being read, the text finally disintegrating
  on the last page (LRB/Lennon, Telegraph, sffworld, NYT). Reality revealed as authored text, written from inside - the leaf's definition. Clarke 2023 shortlist;
  Prix Goncourt 2020. Seed card of Scripted books in books by Gustav's 2026-09-24 15:51 ruling ('Ok execute').

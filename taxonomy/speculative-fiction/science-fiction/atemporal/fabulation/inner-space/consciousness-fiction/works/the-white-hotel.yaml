placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction. SFE identifies the novel as Freud-inspired fabulation: Lisa Erdman’s graphically surreal psychic association between sex and mass violence proves prophetic of the Holocaust and Babi Yar. The novel moves through fantasy, analysis, historical catastrophe and postmortem vision; her nonordinary consciousness destabilizes time and experienced reality.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction. SFE and
  PRH hold Martin Blom’s night sight between miraculous recovery and delusion after a brain injury; the world becomes a consensual hallucination. Altered
  perception destabilizes experienced reality, and the novel refuses a stable objective explanation.'

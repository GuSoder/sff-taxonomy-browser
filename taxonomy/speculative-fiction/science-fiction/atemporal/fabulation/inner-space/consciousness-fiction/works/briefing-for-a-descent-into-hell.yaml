id: briefing-for-a-descent-into-hell
title: Briefing for a Descent Into Hell
authors:
- Doris Lessing
first_published: 1971
canonical_genre: consciousness-fiction
placement_status: accepted
placement_rationale: SFE and Penguin hold the protagonist between a contemporary psychiatric ward and an unresolved mythic-cosmic voyage. Because the book never stabilizes whether its other world is delusion, memory or cosmic truth, its reality stays visibly mutable, fitting Worlds in flux under Fabulation.

placement_rationale: 'Philip K. Dick''s Valis (Bantam, 1981; Wikipedia) and The Transmigration of Timothy Archer (1982), the
  third book of the VALIS trilogy, here the queue''s only row for it (folded in, rule 11j): VALIS is Dick''s gnostic ''Vast
  Active Living Intelligence System'', set in 1970s California, a fictionalized account of his own visions in which the narrator
  Horselover Fat meets a pink-beam revelation of God and a child who may be its vessel; Transmigration follows Bishop Timothy
  Archer, the Zadokite scrolls and a séance. Walk: Science fiction > Atemporal > Fabulation > Inner space > Consciousness
  fiction > Visionary minds (altered perception opens onto another reality). Tried: Unmoored selves (the self divides, but
  the book is the vision) and Theological space opera (no space).'

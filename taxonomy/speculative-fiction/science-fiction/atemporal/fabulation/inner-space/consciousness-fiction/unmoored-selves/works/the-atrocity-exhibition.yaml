placement_rationale: 'Root-down: Speculative fiction -> Atemporal -> Fabulation -> Inner space -> Consciousness fiction. SFE calls these nonlinear “condensed
  novels” Ballard’s sustained treatment of media landscape: architecture, celebrity bodies, televised war and assassination are blended with private memories,
  fantasies, medical reports and astronomical data. The destabilized consciousness that fuses external media with inner reality governs over ordinary dystopia
  or stable-world social SF.'

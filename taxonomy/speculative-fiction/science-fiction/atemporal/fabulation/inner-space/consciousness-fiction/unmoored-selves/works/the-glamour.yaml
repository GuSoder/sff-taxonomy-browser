placement_rationale: 'Root-down: Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction. SFE calls the novel inward and resistant
  to reliable readings; Priest describes psychological invisibility, while Hachette grounds amnesia, contradictory recollections and glimpses of a twilight
  world. Unstable memory and perception determine who exists to whom, so Consciousness fiction governs.'

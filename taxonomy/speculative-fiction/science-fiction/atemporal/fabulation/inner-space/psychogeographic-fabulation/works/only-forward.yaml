placement_rationale: SFE describes a high-rise future City of bizarre affinity neighborhoods whose narrative turns on "the increasingly complex interplay of dream or nightmare and reality" (cross-referenced to Dream Hacking); the novel won the Philip K. Dick Award. A projected dream reality with no stable boundary between psyche and world is the Inner Space definition exactly (shelfmates: Lanark, Martian Time-Slip).

placement_rationale: 'Root-down: Science fiction -> Atemporal -> Fabulation -> Inner Space -> Psychogeographic fabulation. SFE identifies the Dream Archipelago as psychic terrain and The Evidence’s trip to Dearth as entangling narrator Todd Fremde in a displaced murder. Gollancz grounds unstable time, contradictory institutions and forgotten crime; island geography and perception make the mystery possible.'

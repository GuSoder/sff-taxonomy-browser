placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Projected realities. PRH describes a dreamlike detective story in which Toru’s search descends into a netherworld beneath ordinary Tokyo and intersects with buried Manchurian-war trauma. Dream state, well, memory and psychic violence form a competing reality whose boundary with the ordinary world cannot be stabilized.'

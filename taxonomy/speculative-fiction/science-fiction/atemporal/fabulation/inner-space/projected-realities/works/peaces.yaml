id: peaces
title: Peaces
authors:
- Helen Oyeyemi
first_published: 2021
canonical_genre: projected-realities
placement_status: accepted
placement_rationale: >-
  NPR calls Peaces "a bizarre interstitial space between a surrealist narrative and a
  real one"; Kirkus calls it a surrealist tale of love and being haunted by the past.
  Otto and Xavier Shin board the sleeper train The Lucky Day and reality stops cohering
  - no stable boundary between psyche and world, with memory and desire projecting a
  competing reality: exactly the inner-space definition. The NYT stresses it is NOT a
  fairy tale, so it is kept out of fairy-tale-revision (where Gingerbread sits).
  Shelfmates: Lanark, Only Forward. Locus recommended reading 2021.
classification_sources:
- https://www.npr.org/2021/04/07/984743862/too-many-peaces-overload-an-otherwise-entertaining-story
- https://www.nytimes.com/2021/04/06/books/review/peaces-helen-oyeyemi.html
- https://www.kirkusreviews.com/book-reviews/helen-oyeyemi/peaces/

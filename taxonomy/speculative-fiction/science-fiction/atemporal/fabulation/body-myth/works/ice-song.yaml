placement_rationale: 'Kirsten Imani Kasai''s Ice Song (2009; PRH, Penguin Australia, Reactor review): in the frozen land of
  the Sigue, the engineer Sorykah Minuit is a Trader who can switch genders, and with her male alter Soryk she crosses ice
  wastes and a primeval forest to take her twin babies, who share the Trader genes, back from the Collector. Folded: Tattoo
  (the sequel, with bonus stories). Walk: Fabulation > Body myth (bodily identity and transformation as a mythic force that
  shapes the world). Tried Planet ecology fiction and Genetic caste fiction (the Trader is treated as myth and superstition,
  not a designed caste). Weakest placement of the batch; sources are publisher copy and one review; not read. Alternative:
  none clean.'

id: the-breast
title: The Breast
authors: [Philip Roth]
first_published: 1972
canonical_genre: body-myth
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Atemporal -> Fabulation -> Body myth. SFE explicitly calls the literal transformation of Kepesh into a giant female breast a fabulation and Absurdist SF, while Penguin describes a fantasy that makes Kafka’s Metamorphosis new through bodily desire, identity and existential meaninglessness. The transformed body becomes the entire reality and argument of the novella, so Body myth beats ordinary-life Magic realism.'

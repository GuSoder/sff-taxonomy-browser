  collider apparatus) > Time travel agency (government project owns the machine) > Time agency thrillers (action mission,
  not classic patrol or literary revival). Steampunk is the destination setting, not the governing root gate. Owner widened
  this leaf on October 7 at 10:15, "Ok widen thriller".'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Time machines >
  Time travel agency > Time agency thrillers. Time Monitor Gaspar James of the Moiety, the body that guards the timeline,
  is sent to 1943 to stop a former colleague, Alma Lewin, who has gone renegade and is destroying Auschwitz-style death camps
  with future weapons; he knows the horror must run its course to keep the timeline intact and begins to doubt it (Baen blurb;
  AbeBooks publisher blurb). An institution owns the time travel and the plot is an operative''s pursuit of a rogue across
  time, the leaf''s register. Rejected: Classic time agencies (defined as the pulp era through the early 1990s; this is 1997
  with a moral-thriller register), Time agency revival (post-2010 literary revival). Wobble: moderate; blurbs only, no text
  read, and the book''s moral weight is heavier than a typical thriller. Years: SFE and Open Library give first publication
  1997 (Avon); the queue''s 2012 is the Baen ebook reissue. Queue id MC04009.'

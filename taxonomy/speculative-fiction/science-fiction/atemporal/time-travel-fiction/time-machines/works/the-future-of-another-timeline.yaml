placement_rationale: 'Root-down: Science fiction -> Atemporal -> Time travel fiction -> Time machines. Tor grounds Tess as using ancient Machines and an
  institutional Chronology Academy to visit key historical moments, edit one mutable timeline and wage a cross-era political war. The built/institutional
  apparatus governs, making Time machines stronger than Timeslips or alternate-world fabulation.'

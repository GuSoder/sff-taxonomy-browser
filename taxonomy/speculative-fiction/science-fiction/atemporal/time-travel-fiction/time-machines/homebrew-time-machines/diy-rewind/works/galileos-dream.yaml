placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Time machines > Homebrew
  time machines > DIY rewind. Kim Stanley Robinson''s Galileo''s Dream (2009; Wikipedia, Penguin Random House, Google Books):
  Ganymede, a time traveler from the 32nd-century Jovian moons, visits Galileo''s Italy, a trip back into the past, and carries
  Galileo forward to Europa and back, using a drug to blur his memory; Galileo''s servant Cartophilus is also a Jovian time
  traveler, so the travelers are a small crew from the future rather than one private traveler. Moved from Overclockian on
  the curator''s explicit decision (2026-10-12 2:45:08 PM CEST, phonemsg-01M4R2AESF7CPRDCEN7W1WHNE7: "But then put the far-future
  pair in DIY rewinder, they are rewinder books") (they start in the far future and travel to the past). Rejected: Time travel
  agency (no organization is shown running it), Time tonics (the drug only blurs memory), Hard time travel (no physical mechanism
  is developed). Wobble: HIGH. No machine is described in the sources read, so it only stretches the Homebrew (private built
  device) definition, and the trips run both ways. Sources: Wikipedia, PRH, Google Books; not read.'

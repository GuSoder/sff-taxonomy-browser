placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Time machines > Homebrew
  time machines > DIY rewind. Moorcock''s An Alien Heat (1972; the Dancers at the End of Time sequence; Wikipedia, Hachette
  Australia, EBSCO): Jherek Carnelian, an immortal decadent at the End of Time, falls for Mrs Amelia Underwood, a Victorian
  woman transported there; when she returns to her own time he follows her to Victorian London. Start far future, destination
  the past: a built time machine carries a private traveler backward, with no organization behind the trip, which is the rewind
  direction. Moved from Overclockian on the curator''s explicit decision (2026-10-12 2:45:08 PM CEST, phonemsg-01M4R2AESF7CPRDCEN7W1WHNE7:
  "But then put the far-future pair in DIY rewinder, they are rewinder books"). Rejected: Time travel agency (no organization
  runs it), Overclockian (its trip runs back, not forward). Wobble: moderate; Mrs Underwood also travels forward to the End
  of Time, and whose machine it is was not verified in the sources read. Sources: Wikipedia, Hachette, EBSCO; not read.'

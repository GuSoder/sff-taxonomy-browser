placement_rationale: 'Michael Moorcock''s Behold the Man (novel 1969, expanded from the 1966 Nebula-winning novella; Wikipedia,
  Orion, ISFDB, SFF World): in 1970 Karl Glogauer, a troubled London man obsessed with Christianity, rides a womb-like, fluid-filled
  time machine to Palestine in AD 28 to meet Jesus; the machine cracks open and is useless, and when he finds Jesus a drooling
  idiot in Nazareth he takes the role himself. Walk: Science fiction > Atemporal > Time travel fiction > Time machines > Homebrew
  time machines > DIY rewind (a private traveler goes back into the past in a built device; the machine is lent by a physicist''s
  lab but nothing organizational stands behind the trip). Rejected: Time travel agency (no organization runs the trip), Timeslips
  (a built machine), Time loops (no repeat). Wobble: low; the book is a character study and the machine is only the means.
  Sources: Wikipedia, Orion, SFF World, ISFDB; not read.'

placement_rationale: 'S. M. Stirling''s Make the Darkness Light (Gallery/Baen: To Turn the Tide, Aug 2024; The Winds of Fate,
  July 2025; smstirling.com, Baen, Wikipedia bibliography): in 2032 an American history professor and four graduate students
  are tricked into using what is a time machine built by a rogue scientist in Austria, who diverted research money to make
  an escape from the coming nuclear holocaust, and are sent back to the Roman Empire of 165 CE with a ton of survival gear
  to integrate and change history. Rome to the Stars (2026), set in the resulting timeline, is a separate space-opera series
  (Pax Astra) and is held. Walk: Science fiction > Atemporal > Time travel fiction > Time machines (a built device) > Homebrew
  time machines (owned by an individual, no organization behind it). Tried: Time travel agency (the machine is one man''s
  private project, not an institute''s).'

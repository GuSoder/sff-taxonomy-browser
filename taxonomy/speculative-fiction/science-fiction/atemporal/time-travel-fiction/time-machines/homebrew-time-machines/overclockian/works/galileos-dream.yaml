placement_rationale: 'Kim Stanley Robinson''s Galileo''s Dream (2009; Wikipedia, Penguin Random House, Google Books): Galileo
  is visited by Ganymede, a time traveler from the 32nd-century Jovian moons, who carries him forward to Europa and back,
  using a drug to blur his memory, to manipulate him toward martyrdom for science; Galileo''s servant Cartophilus is also
  a Jovian time traveler, and in the end Galileo and Hera decide to go back to undo Ganymede''s attack on the Europan intelligence.
  Walk: Science fiction > Atemporal > Time travel fiction > Time machines > Homebrew time machines > Overclockian. Rejected:
  Time travel agency (no organization runs it; the Jovian society is utopian and Ganymede is a renegade), Time tonics (the
  drug only blurs memory), Hard time travel (no physical mechanism is developed). Wobble: high; no built machine is described,
  it passes the owner test only by exclusion, and the trips run both ways. Sources: Wikipedia, PRH, Google Books; not read.'

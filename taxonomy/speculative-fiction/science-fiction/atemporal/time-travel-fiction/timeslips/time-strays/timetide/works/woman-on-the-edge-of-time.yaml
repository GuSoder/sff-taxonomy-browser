placement_rationale: 'Root-down: Speculative fiction -> Science fiction -> Atemporal -> Time travel fiction -> Timeslips.
  the curator rulings 2026-09-23 09:48/09:56: any SF-side time travel, premise or element, goes Atemporal -> Time travel fiction.

first_published: 2018
canonical_genre: timetribe
placement_status: accepted
placement_rationale: 'The Ring of Fire (1632) universe: the West Virginia town of Grantville is swept through space-time into
  Central Europe in 1632 by an unexplained event, and the life of the up-timers in the seventeenth century is the story. One
  fiction for the whole shared universe (rule 11j); later volumes fold onto it. First volume placed here is Carrico''s Letters
  from Gronow, in which Lovecraft and Poe stories found in Grantville''s libraries are translated for a Magdeburg magazine.
  Walked root-down: Science fiction -> Atemporal -> Time travel fiction -> Timeslips -> Time strays.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Timeslips > Time
  strays > Timetribe. An airship goes back in time 25,000 years and its passengers meet Cro-Magnons and Neanderthals (Wikipedia,
  Three Go Back); a whole party is thrown into another era together and has to live there as a small community, which is Timetribe''s
  definition. Rejected: Timestranded (one traveler alone, but here a group travels), Timetide (the crossing is a single event,
  not repeated). Wobble: moderate, since the book is also a prehistoric-anthropology fable and a debate on civilization. First
  published 1932 as by J. Leslie Mitchell (Lewis Grassic Gibbon); the cover is the Open Library scan with a faint rights overlay
  at the top edge, acceptable for a single-printing book.'

placement_rationale: 'S. M. Stirling''s Nantucket series (Island in the Sea of Time 1998, Against the Tide of Years 1999,
  On the Oceans of Eternity 2000; Wikipedia): at 9:15 pm on March 17, 1998 the island of Nantucket is transported back to
  1250 BC by ''the Event''; the islanders build the Republic of Nantucket while a group of renegade Americans led by ex-Coast
  Guard lieutenant William Walker leaves to build an empire, and the later books turn to the Tartessos attack and the war
  against Walker, who controls Mycenaean Greece. Related to Stirling''s Emberverse by the same ''Change'' point of departure,
  but a separate series with its own premise and cast (the Emberverse card is a separate fiction). Walk: SF/Fantasy walk first
  - the Event is unexplained science-fictional time displacement, so SF: Atemporal > Time travel > Timeslips > Time strays
  > Timetribe (a whole group, here a town on an island, thrown into another era together and forming a community of their
  own). Not Timestranded (one traveller) nor Timetide (crossing that comes and goes). Neighbors in Timetribe: The Ring of
  Fire. Sources: Wikipedia; not read. Placed 2026-10-12 into an existing leaf below the gate, no split question needed.'

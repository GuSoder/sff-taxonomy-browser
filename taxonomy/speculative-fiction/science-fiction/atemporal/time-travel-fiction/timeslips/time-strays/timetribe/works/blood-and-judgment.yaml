placement_rationale: 'Lars Walker''s Blood and Judgment (2003; Baen, larswalker.com): the amateur actor Will Sverdrup, cast
  as Hamlet, is pulled back in time into the body of the original historical Hamlet in 6th-century Denmark, and his fellow
  actors, with the real Hamlet, are transported with him to an alternate universe where Shakespeare''s play is real and they
  are placed to live and die their parts. Walk: SF/Fantasy walk first - the crossing has no stated magic or machine, so SF:
  Atemporal > Time travel > Timeslips > Time strays > Timetribe (a whole group thrown into another era together and forced
  into its own community). Weak: the alternate-universe layer; alternative Worldhopper multiverse fantasy. Sources: Baen,
  larswalker.com; not read.'

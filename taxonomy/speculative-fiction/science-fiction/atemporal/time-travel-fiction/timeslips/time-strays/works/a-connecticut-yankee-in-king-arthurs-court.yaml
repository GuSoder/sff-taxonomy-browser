placement_rationale: SFE identifies the work as science fiction and its Timeslip entry uses Hank Morgan's
  crowbar blow as a classic transfer into the past. Penguin describes the nineteenth-century mechanic
  waking in sixth-century Camelot after being knocked unconscious. The accidental unexplained transfer,
  not the inherited Arthurian story, is the defining mechanism.

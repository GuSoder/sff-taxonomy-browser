placement_rationale: 'The Nomad of Time (1982 omnibus of the Oswald Bastable trilogy: The Warlord of the Air 1971, The Land
  Leviathan 1974, The Steel Tsar 1981; Wikipedia and ISFDB), the queue''s only row for the series. Edwardian soldier Oswald
  Bastable, lost in an Indian cave in 1902, comes out in a twentieth century where the First World War never happened and
  airship empires rule, and he fights for the oppressed there, alone and out of his time. Walk: Atemporal > Time travel >
  Timeslips (no machine, an unexplained cave slip) > Time strays > Timestranded (one traveller stranded alone in another era
  whose life there is the story). Tried Machine-age alterations (the book''s premise is the stranded traveller, not the changed
  world) and Steampunk adventure. Alternative if he prefers: Machine-age alterations. Sources: Wikipedia; not read.'

placement_rationale: 'Leo Frankowski''s Adventures of Conrad Stargard (The Cross-Time Engineer 1986, The High-Tech Knight
  1987, The Radiant Warrior 1988, The Flying Warlord, Lord Conrad''s Lady, Conrad''s Quest for Rubber, and the sibling novel
  Conrad''s Time Machine set in the same universe; Wikipedia; the queue has the omnibuses Conrad Stargard: The Radiant Warrior
  2004 and Conrad''s Lady 2005, which collect the first three and the second three, plus Conrad''s Time Machine 2002): in
  1986 the Polish engineer Conrad Schwartz falls asleep drunk in a time machine and wakes in 1231 Poland, cut off from home;
  knowing the Mongols will come in 1241, he builds an industrial base, an army of 150,000 and a new city, and becomes the
  most powerful man in the country. One shared universe, one fiction (rule 11j). Walk: Atemporal > Time travel fiction > Timeslips
  > Time strays > Timestranded (one person stranded alone in another era). Rejected: Homebrew time machines (the machine only
  drops him, it is not what the story is about), Timetribe (one traveler, not a group). Wobble: low; it is a Mary Sue empire-building
  tale. Sources: Wikipedia, Google Books; not read. First published 1986 (the omnibus rows carry reissue years).'

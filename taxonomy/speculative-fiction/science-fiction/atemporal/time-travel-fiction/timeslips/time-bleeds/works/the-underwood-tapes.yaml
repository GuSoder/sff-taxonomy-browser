placement_rationale: 'Root-down: SF -> Atemporal -> Time travel fiction -> Timeslips -> Time bleeds. Present-day Grace and Jake in 1992 communicate by recorded cassettes;
  no one travels. Kirkus explicitly says the communication exists without explanation. The ordinary tapes are a medium, not an invented time apparatus, and no ritual
  or magical cause is given. A mystery and grief unfold through the leak between eras, not a stranger''s life in another century.'

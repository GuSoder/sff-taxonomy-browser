placement_rationale: 'The sequence repeatedly crosses time without a stable built time machine: A Swiftly Tilting Planet rides through centuries, Many Waters
  sends the twins to the world of Noah, and An Acceptable Time opens into another era. Its varied, psychologically and cosmologically entangled transfers
  fit Timeslips best among the existing time-travel leaves.'

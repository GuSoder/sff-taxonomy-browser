placement_rationale: >-
  SFE calls Darkmans a large, ambitious Timeslip tale in which the fifteenth-century court jester John Scoggins intrudes into and possesses people in present-day Ashford, producing untimely but accurate knowledge and making the world unstable. Harper describes the past creeping into the modern present. Unexplained psychologically entangled transfer across eras makes Timeslips closest.

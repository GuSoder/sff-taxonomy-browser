id: time-crossroads
label: Time crossroads
parent: time-travel-fiction
definition: Time travel fiction built around a place outside the timestream - a crossroads, waystation or hub that touches
  many eras and belongs to none - where travelers from different times meet, trade, hide and are minded by the hub's keepers
  (the Inn Between the Worlds trope in time form). The hub and its keepers are the engine; no built machine and no owning
  agency (contrast Time machines). Named by the curator on 2026-09-27 after Costumes for Time Travelers.

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Time distortion.
  A time storm has devastated the Earth and only a small fraction of humankind remains; three survivors, a young man, a young
  woman and a leopard, form an alliance in a world where regions run at different rates of time (Goodreads blurb of the 1977
  first edition; ISFDB). Different regions of the world running at radically different time rates shapes the story, which
  is the leaf''s definition. Rejected: Cosmic catastrophe (the disaster is a distortion of time, not debris from the sky),
  Dying earth, Hard time travel (no travel device). Wobble: moderate; it is also a survival and post-catastrophe tale, and
  I read only the blurb. Year is the 1977 first edition (the queue showed 2018).'

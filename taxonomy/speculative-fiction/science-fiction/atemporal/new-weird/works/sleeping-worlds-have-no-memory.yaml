placement_rationale: 'In an invented kingdom edging toward steampunk, an exiled minister must finish a border tower held up by the Drakiri''s incomprehensible tech
  - anti-gravity ''tulips'' that can implode into mini black holes - and learns its completion would open an interdimensional rift to the Mimic Tower (Locus: ''an
  almost New Weird science fantasy''; Kirkus: ''fantasy and SF''). No magic; strange technology in a mixed-mode world. Nebula 2025 shortlist. Placed by Gustav''s
  23:33 ruling.'

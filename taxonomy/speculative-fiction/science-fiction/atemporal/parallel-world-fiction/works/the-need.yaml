placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Parallel World fiction. Penguin explicitly frames the novel through alternative universes; impossible variant artifacts from a fossil quarry and an intruder who shares Molly’s life make identity across parallel realities the governing speculative mechanism. Motherhood gives the stakes, but parallel-world collision drives them.'

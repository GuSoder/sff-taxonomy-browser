placement_rationale: 'Root-down: Science fiction -> Atemporal -> Parallel world fiction -> Multiverse
  war. Journals of Zaxony Delatree book 2 (book 1 not in the tree, the card stands as this intake item).
  Zax wakes on a new world every time he sleeps; the Cult of the Worm serves the Prisoner, an entity trapped
  between universes that wants every world collapsed ''like bars in its prison'', and Zax, Ana and the
  Sleepers band together to stop them (PW: ''fanatics bent on destroying the multiverse''). Worlds and
  their destruction are the stakes of a war fought across parallel realities - the leaf def.'

first_published: 1953
canonical_genre: multiverse-war
placement_status: accepted
placement_rationale: 'Root-down: Science fiction -> Atemporal -> Parallel World fiction.
  SFE says the novel discovers a chain of parallel Earths and centers mutants using
  everlasting goods while empty alternate Earths become available for colonization.
  Futurist siblings fail because crossing parallel realities, not one future Earth
  or an other cosmos, is the mechanism.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Parallel world fiction > Multiverse war.
  Invasions from alternate Earths: a militaristic American Earth uses paratime travel to attack another, then a council of
  more advanced Earths relocates every ''Cat'' to stop ''ballistic recoil'' from tearing the barriers between universes; worlds
  make war and world-repair follows (Wikipedia, bookstldr plot summaries). Rejected: Multiverse mirror (the political counterfactuals
  are satire, but the plot is the invasion), Multiverse odyssey (no one crosses for love or grief). Wobble: mirror. First
  published 1986 (Analog serial Jan-Apr 1986); the queue''s 1995 date is the Spectra reissue. Leaf was 9 and holds 8 after
  the Pandominion fold under rule 11j.'

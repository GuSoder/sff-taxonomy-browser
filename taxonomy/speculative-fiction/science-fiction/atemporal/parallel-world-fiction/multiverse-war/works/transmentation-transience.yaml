placement_rationale: 'Root-down: SF -> Atemporal -> Parallel world fiction -> Multiverse war. Minds transfer into proxies across scientific parallel realities; Burel
  Hird''s imperial control, a violent diplomatic incident and rival pan-dimensional societies drive espionage and conflict. Embodied identity is explored through
  the crossing, but political conquest between worlds is its purpose, not an intimate multiverse odyssey or mirrored Earth counterfactual. No literal magic established
  despite fantasy-like localities.'

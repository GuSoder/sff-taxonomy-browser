placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Parallel world fiction > Multiverse war.
  Norton''s Blake Walker pair (The Crossroads of Time, 1956; Quest Crosstime, 1965; the 2008 Baen omnibus Crosstime folds
  into this one card, rule 11j): Blake, an orphan with flashes of foresight, stumbles on a secret web of parallel Earths and
  is drafted into the Crosstime Corps, which hunts a would-be dictator, Saur To''Kekrops of the advanced Earth Vroom, who
  has marked our Earth as the place his rule begins and will destroy it if his technology fails (Baen/Norton estate blurb;
  Wikipedia, Quest Crosstime plot: a rescue across timetracks that ends with the corps confronting and neutralising To''Kekrops).
  Time travel branches rejected: nothing moves in time, the worlds are parallel timetracks. Multiverse mirror rejected: the
  counterfactual histories (a Richard III Britain and a surviving Toltec empire) are scenery on missions, not the point. Multiverse
  odyssey rejected: a rescue of Marva Rogan occurs but the engine is the Corps'' fight against a tyrant who threatens worlds.
  Multiverse war is the closest: invasion and world-defence fought across parallel realities, with the rescue and spy missions
  as its method. Wobble: moderate. It is an agency adventure more than open war, no leaf for crosstime corps exists, and I
  read plot sources for Quest Crosstime and the omnibus blurb for The Crossroads of Time, not the books. Years: 1956 and 1965
  first publication; the queue''s 2007/2008 is the Baen omnibus. Queue id MC00569.'

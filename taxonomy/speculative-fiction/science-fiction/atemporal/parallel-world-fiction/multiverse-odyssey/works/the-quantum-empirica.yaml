placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Parallel world fiction > Multiverse odyssey.
  Darwin Lloyd can see and manipulate quantum Threads with his father''s Machine; an experiment fails and throws him to an
  alternate Earth ravaged by war that he suspects the Machine caused (Threader Origins), and in Threader War a gate opens
  again and he returns because he hears Teresa, the love he left behind, screaming (author''s site, geraldbrandt.com). Three
  books of the Quantum Empirica (Origins, War, God) are one world and one fiction under rule 11j. The crossing is made for
  one person, which is the leaf''s definition. Rejected: Multiverse war (the war is inside the alternate Earth, between Qabal
  and Threader groups; worlds do not fight each other), Multiverse mirror (no history held up to ours), Gateway multiverse
  fantasy (science fiction). Wobble: moderate; the books are as much a Threads-and-war adventure as an odyssey, and Threader
  God was not read beyond the publisher blurbs. Covers for War and God not found on Open Library.'

placement_rationale: 'Full root-down walk: Science fiction > Historical > Alternate history (the fork is a changed 6th century,
  not a changed present) > Deep alterations (the changed world is lived in for a whole series; not Period alterations, whose
  fork is in recent memory) > Antique alterations, not Age of sail alterations or Machine age alterations (the fork lies before
  1500: the Malwa Empire and a crystal intelligence sent from a future that may never be help Belisarius turn the Byzantine
  army into a modern force, with steamboats, telegraph and Greek fire by The Dance of Time). Science fiction rather than Fantasy:
  the engine is a machine intelligence from the future, not magic; Time travel fiction rejected: nobody travels, an artifact
  from the future acts. Baen pages (https://www.baen.com/destiny-s-shield.html, https://www.baen.com/the-dance-of-time.html).
  Series books An Oblique Approach and Thunder at Dawn are not in the queue.'

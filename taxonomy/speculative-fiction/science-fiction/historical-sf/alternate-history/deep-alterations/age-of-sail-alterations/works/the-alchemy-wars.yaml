placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Deep alterations
  > Age of sail alterations. In 1676 Christiaan Huygens invents the Clakker, a clockwork servant bound by alchemical compulsion;
  250 years later the Netherlands is the world''s sole superpower and the Brasswork Throne rules on clakker labor, a changed
  1926 lived in rather than replayed (iantregillis.com, The Alchemy Wars). The fork is 1676, inside the leaf''s 1500 to 1800
  range, and the trilogy follows the clakkers'' break from their compulsion through to open war with the Dutch crown. Rejected:
  Machine age alterations (fork is 1676, not after 1800), Being robot and Robot relations (a machine-minds leaf would ignore
  the alternate world the whole series is built on), Steampunk history (alchemy and clockwork, not steam). Wobble: moderate,
  the clakker selfhood story is also a Being robot shelf. One fiction, three novels: The Mechanical 2015, The Rising 2015,
  The Liberation 2016 (first editions per Open Library and publisher pages).'

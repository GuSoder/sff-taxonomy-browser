placement_rationale: 'S. M. Stirling''s Draka series (Baen: Drakon, 1996; The Domination, 1999, the omnibus of Marching Through
  Georgia, Under the Yoke and The Stone Dogs and the queue''s only row for those novels; Wikipedia bibliography, smstirling.com):
  a dystopian, slave-holding, militarized empire founded in southern Africa by British Loyalists who left after the American
  Revolution, later joined by Confederates, grows into the Domination and fights the twentieth century''s wars. The Drakas!
  anthology and the Clan of the Claw and By Tooth and Claw shared-world anthologies are skipped. Walk: Science fiction > Historical
  > Alternate history > Deep alterations (an enduring divergence makes a different world to live in) > Age of sail alterations
  (fork 1500 to about 1800; here 1783). Tried: Machine age alterations (the fork is 1783, not after 1800). Wobble: most of
  the story is told in the twentieth century, the leaf is chosen by the fork date.'

placement_rationale: 'Four novels in Eric Flint''s 1632/Ring of Fire shared universe (one card, rule 11j): Offord & Boatright''s
  1636: The Chronicles of Dr. Gribbleflotz (2016) and 1637: Dr. Gribbleflotz and the Soul of Stoner (2021, Baen), and Kevin
  H. & Karen C. Evans''s Fire on the Rio Grande (2020) and No Ship for Tranquebar (2018, Ring of Fire Press). The Ring of
  Fire event drops Grantville, West Virginia into 1632 Thuringia; the books live in the changed Thirty Years'' War world.
  Walk: SF > Historical SF > Alternate history > Deep alterations > Age of sail alterations (the fork lies in 1632, squarely
  in the 1500-1800 gate; Flint precedent: Belisarius sits in Antique alterations by fork era). Tried: Period alterations (its
  children cover 1860s-to-present forks only). Source: Baen, Ring of Fire Press, Open Library.'

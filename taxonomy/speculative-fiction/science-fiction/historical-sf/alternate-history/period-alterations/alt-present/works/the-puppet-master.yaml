placement_rationale: 'In an alternate time line, a breakthrough in basic physics has catapulted technology centuries ahead
  in a few years, and private eye Martti Seppanen works a transformed Los Angeles where the weapon may be a bioengineered
  disease and the murderer may control minds (Baen copy, Published 10/1/2001). An altered near-present rather than a named
  period: alt-present. Packaging note: the Baen 2001 book is the title novel plus two shorter Martti Seppanen works (A Most
  Singular Murder, The Case of the Duplicate Beauties), so SFE and ISFDB tag it as a collection; the card covers the novel,
  the shorts excluded per the shorts rule. ISFDB groups the Seppanen works as a sub-series of ''Arne Haugen'' with The General''s
  President (1988), but SFE treats both as singletons, the Baen copy makes no connection, and the textures differ (near-future
  political thriller vs tech-accelerated noir), so the novel stands as its own fiction.'

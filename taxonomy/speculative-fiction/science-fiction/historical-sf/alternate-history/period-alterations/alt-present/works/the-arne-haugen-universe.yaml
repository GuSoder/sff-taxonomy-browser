placement_rationale: 'One branched timeline, two novels. The author''s foreword to The Puppet Master declares the stories
  are set in a time line that branched from ours sometime after World War Two, transformed by the geogravitic power converter
  and ''the new physics'' - and the GPC is Arne Haugen''s own Duluth Technologies invention in The General''s President (1988),
  whose 1994 story world already diverges from known history (the USSR extant, Gorbachev dead in office, scalar-resonance
  weather weapons; prologue framed as a 2034 history textbook). The General''s President gives the altered near-present''s
  political origin; The Puppet Master (2001) works its street level, PI Martti Seppanen solving crimes in a tech-transformed
  Los Angeles (Baen copy). Altered near-presents, not a named period: alt-present; the branch (post-WWII) lies within living
  memory of both story presents, satisfying Period alterations. ISFDB groups the universe as ''Arne Haugen'' (genuine shared
  continuity, confirmed from the foreword); SFE''s singleton listing is publication form. The Baen 2001 Puppet Master volume
  also contains two Seppanen shorts (A Most Singular Murder, The Case of the Duplicate Beauties), excluded from the card per
  the shorts rule.'

first_published: 1994
canonical_genre: alt-wwii
placement_status: accepted
placement_rationale: 'Turtledove''s Worldwar fiction (the Worldwar tetralogy, the Colonization trilogy and Homeward Bound;
  eight novels, one shared universe, one card per rule 11j): the reptilian Race invades Earth on 30 May 1942, mid-Second-World-War;
  Axis and Allies must cooperate against it; the tetralogy tells the changed war on its fronts to a stalemate with the Race
  holding half the planet; Colonization follows the world it leaves behind (1960s cold war with the Race''s colonists) and
  Homeward Bound reaches 2031 (Wikipedia, Worldwar series). Root-down: Science fiction > Historical SF > Alternate history
  (identifiable fork: the Race''s arrival) > Period alterations (fork within living memory of the story) > Alt WWII, as widened
  2026-11-03 with the curator''s ''Approved'' (phonemsg-01M6GRETKSYG4HS6CDKP2ZBYR2) to include continuations showing the world
  the changed war leaves behind. Rejected: Modern day SF / Warzone Earth (the 1942 fork is not the recognizable present -
  the earlier placement failed the ancestor gate); Alt postwar (the fork is mid-war, not the war''s end); Hidden history SF
  (the arrival is open and remakes the record). Whole fiction moves together; no book separated.'

definition: Alternate histories whose fork changes the Second World War, showing the changed war on its fronts and, in continuations,
  the world it leaves behind. Not Alt prewar (the fork comes before the war and the world is shown before it) or Alt postwar
  (the war's end is the fork and the world is shown after it).

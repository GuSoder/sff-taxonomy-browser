placement_rationale: 'Walk: Speculative fiction > Science fiction > Historical SF > Alternate history > Period alterations
  > Alt Cold War. The Korean War spirals into World War III in 1951, the United States and the Soviet Union trading atomic
  bombs across three volumes (Turtledove fandom wiki, The Hot War; Penguin Random House series page). The fork and the
  central historical substance are the Cold War gone hot, the leaf''s definition. Rejected: Alt WWII (the Second World War
  is over), Alt postwar (the fork is not the war''s end), Alt present (1951-52, not the near present), Deep alterations
  (the alteration is within living memory of the story''s present, replaying the period''s events). Wobble: low. Years:
  first publications 2015, 2016, 2017 (fandom wiki); the queue''s 2016-2018 are the Del Rey paperback years. Queue ids
  MC03725, MC03729, MC03740.'

definition: 'Adventure fiction in which explorers discover a surviving prehistoric or otherwise isolated world: hidden plateaus,
  hollow-earth caverns and lost valleys where dinosaurs, ancient peoples or vanished civilizations endure. Coined from the
  SFE Lost Worlds theme entry; Verne''s Journey to the Center of the Earth (1864) is the genre''s founding text. Not Fantastic
  voyage (the journey is the story). Umbrella since 2026-10-06: split-with-umbrella by what the explorers find - Hollow earth,
  Lost race, Lost wilds (curator "Approved" (phonemsg-01M47YBY60B9NT4M3DX993DTAX, 2026-10-06 8:28 AM)).'

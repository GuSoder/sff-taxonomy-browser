placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Proto SF > Lost world fiction > Lost
  race. Five men shipwrecked on an uncharted Pacific island find it occupied by a hidden people, five winged women who have
  their own origin, leader and customs (Wikipedia, Angel Island (novel), calling it SF/fantasy and feminist SF). Explorers
  finding an isolated people is the leaf''s definition. Rejected: Fantastic voyage (the voyage ends at the wreck, the island
  is the story), Utopian branches (the island is not a society offered as a model). Wobble: moderate, since the book turns
  into a sex-war allegory of captivity and flight. First published by Henry Holt, January 1914 (Wikipedia); cover is the 2025
  Hachette Rediscovered Classics edition because the Open Library copy is a tiny library scan.'

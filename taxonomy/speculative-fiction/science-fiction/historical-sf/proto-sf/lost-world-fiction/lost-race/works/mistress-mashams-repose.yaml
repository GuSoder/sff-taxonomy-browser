first_published: 1946
canonical_genre: lost-race
placement_status: accepted
placement_rationale: 'SFE files the novel under White''s sf interest: Lilliputians transported to England by Gulliver have
  survived in isolation on the vast Malplaquet estate for 200 years until a young girl discovers and nearly destroys them
  (SFE cross-references Great and Small and Zoo). A hidden surviving people discovered in isolation is the Lost World structure
  in miniature; the Lilliputian-anthropology premise is pseudoscience rather than magic per the curator''s 2026-09-14 ruling,
  so the SF side applies. Vetoable.'

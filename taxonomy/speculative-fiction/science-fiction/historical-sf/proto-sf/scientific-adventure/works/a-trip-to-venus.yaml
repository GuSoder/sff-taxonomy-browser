id: a-trip-to-venus
title: A Trip to Venus
authors:
- John Munro
first_published: 1897
canonical_genre: scientific-adventure
placement_status: accepted
placement_rationale: 'Whole-fiction root-down walk 2026-11-05: Speculative fiction > Science fiction > Historical
  SF > Proto SF > Scientific adventure. Original1897 novel, queue2013 is Baen ebook reprint, not a new work. SFE
  confirms a single novel incorporating the earlier A Message from Mars as chapter1; Sun-Rise in the Moon/Daybreak
  on the Moon is a short story, not an extra novel volume. Primary Gutenberg text opens on contemporary newspaper
  speculation and lengthy engineering discussion, then inventor Carmichael builds a new-force powered craft carrying
  narrator, astronomer Gazen and his daughter. They travel to an idealized Venusian society, where narrator loves
  Alumion, then Mercury with dangerous beasts and return to Earth; narrator wants to return to Venus. SF rather
  than Fantasy: antigravity is a speculative discovery and engineered ship, not magic; then-current astronomy and
  mechanical explanations frame the journey. Historical gate: recognizable late-Victorian Britain, London newspapers,
  clubs, railway, RAS, gas/electric lamps and contemporary invention speculation. Original-era scientific romance
  takes Proto SF over modern retropunk Period SF, Alternate history or Hidden history. Futurist and Atemporal alternatives
  fail before lower-leaf attraction: no time travel/parallel reality, the contemporary launch anchors the text,
  and its scientific expedition is a closed nineteenth-century literary form. The space-opera historical exception
  does not convert this Victorian instructive voyage into space opera: no sustained spacefaring civilization or
  factional space adventure. Modern Hard SF overreads historical speculation about rockets/generation ships as the
  actual journey: the operational device is undisclosed new force. Classic planetary romance strongly overlaps the
  Earth visitor to exotic Venus and romance, but it sits under Atemporal Science fantasy; the original-era scientific
  marvel and didactic voyage govern here. Within Proto, no isolated lost terrestrial civilization/underground world
  or Promethean/cosmic terror. Fantastic voyage is pre-novelistic under its definition, whereas this1897 full novel
  uses a technological marvel to enable its journey. Scientific adventure8 is therefore honest without wording changes.
  Wobble: much attention goes to utopian Venus and romance rather than invention alone, and many astronomical claims
  are obsolete; contemporary Nature nonetheless describes instructive astronomical disquisitions worked into a narrative.
  Sources read include primary text, SFE author/bibliographic record, contemporary Nature abstract, Jess Nevins
  critical plot account, Cualia review and Baen edition record. Distinct English1897 decorated cloth front from
  SFE library gallery inspected, no title page/library stickers/placeholder; use that original print front rather
  than queue ebook cover.'

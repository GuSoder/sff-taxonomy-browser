placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Proto
  SF -> Gothic science fiction -> Cosmic gothic. Locus (Di Filippo): two starships orbit black hole QV
  Tel; Raine finds himself ''communicating with an apparent inhabitant of the singularity'' who is ''literally
  Satan, imprisoned in QV Tel by God'', and is beguiled into wiping out his crew ''in horrible fashion''
  before the companion ship is slaughtered too. Sublime terror from a cosmic immensity and a reality beyond
  comprehension - the cosmic-gothic brief.'

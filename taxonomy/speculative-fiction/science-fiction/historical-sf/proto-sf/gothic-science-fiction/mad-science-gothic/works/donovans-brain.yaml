placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Gothic science fiction -> Mad-science Gothic. The 1942 frame
  is clearly historical to today’s reader, while forbidden brain preservation becomes psi possession, bodily takeover and terror. Hauser’s Memory and Gabriel’s
  Body leave this leaf for reader-relative Futurist Psionics.'

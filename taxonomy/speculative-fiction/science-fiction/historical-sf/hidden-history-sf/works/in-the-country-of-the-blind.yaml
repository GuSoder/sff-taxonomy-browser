placement_rationale: 'Path: Speculative fiction > Science fiction > Historical SF > Hidden history SF. A single novel (Baen,
  July 1990; ISFDB title 1724, SF Encyclopedia Flynn entry): Babbage''s mechanical computer worked, and a secret society has
  used its predictions since the 1800s to steer events, until a present-day Denver woman uncovers the concealed history. The
  extraordinary event happened in the past and was kept out of the record, which is the leaf''s marker. ISFDB files it in
  its own Sarah Beaumont series, apart from Firestar; the claim that its characters reappear in the Firestar books comes from
  one reviewer and was not confirmed in a second source, so it is not folded into The Firestar Universe. Rivals rejected:
  Machine age alterations (the fork is hidden, not a changed world to live in), Alt present (the present looks like ours),
  Conspiracy-driven techno fiction. Wobble: Machine age alterations, because SFE labels it alternate history.'

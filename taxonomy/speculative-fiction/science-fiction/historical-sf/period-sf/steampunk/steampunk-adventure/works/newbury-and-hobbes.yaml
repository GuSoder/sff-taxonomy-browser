placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Period SF > Steampunk > Steampunk adventure.
  Sir Maurice Newbury, an ''investigator for the Crown'', and his assistant Veronica Hobbes work cases in a Victorian London
  of airships, clockwork automatons and a Queen kept alive by machines, from a zombie plague on the Affinity Bridge to an
  Egyptian ritual and a train of the dead (Macmillan series page; Wikipedia, George Mann). A mystery and a mission drive each
  book inside a steam-powered world, which is the leaf''s definition. Rejected: Steampunk history (the changed history of
  nations and wars is background, not the engine; each book is a case). Wobble: The Immorality Engine cover is only a title
  page; The Albion Initiative is dated 2022 per Wikipedia (Tor), Open Library has 2021. Series folded as one fiction (rule
  11j). Ghosts of Manhattan is a separate series set 25 years later and is not folded.'

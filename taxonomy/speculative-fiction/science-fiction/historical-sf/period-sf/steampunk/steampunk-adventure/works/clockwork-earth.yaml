placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical SF > Period SF > Steampunk >
  Steampunk adventure. Complete3novel shared Clockwork Earth (Mainspring2007, Escapement2008, Pinion2010), not first-volume-only
  inference. SF vs Fantasy: real sorcery, angels and southern spirit-world coexist with literal planetary clockwork;
  explicit Steampunk gate includes science fantasy, while SFE explicitly calls whole sequence unmistakably Steampunk.
  Historical over Futurist/Modern/Atemporal: recognizable alternate early1900s Earth, undead Queen Victoria, British/Chinese
  empires, steam-era airships/submarines. Period SF rather than Alternate history: enormous clockwork cosmos and
  technological aesthetic, not one historical divergence. Steam/clockwork physics primary rather than Deco noir/Rocketpunk.
  Adventure over history: Mainspring follows apprentice Hethor on divine Key Perilous/South Polar repair quest;
  Escapement follows Paolina seeking learning and escape from exploitation, Childress negotiating secret societies
  on Chinese submarine, al-Wazir assigned Wall tunnel expedition; Pinion continues all personal journeys, Boaz seeking
  Paolina, Wang pursuing then collaborating with Childress and Kitchens on secret mission until convergence ends
  war. Empires, colonialism and brewing war are substantial, not absent, but traversing/discovering strange Earth
  and personal autonomy drive whole-fiction narrative (SFE, Tor, Kincaid, Kara), rather than alternate industrial/national
  history as primary subject. Moderate adventure/history boundary because later2volumes expand geopolitics; not
  an invariant simple quest across all3. No definition change or corrective rehome. First-publication years independently
  SFE/FictionDB/Worldcat; queue2008 is paperback date. 2linked novellas excluded by normal form rule, not missing
  novels. Leaf9->10 triggers immediate freeze, no later intake placement before split.'

first_published: 1818
canonical_genre: science-fiction
placement_status: accepted
placement_rationale: The animating act is a scientific attempt to create life, and
  the novel became foundational to later science fiction. But it predates the modern
  subgenre branches in this taxonomy and remains irreducibly Gothic/horror as well;
  science fiction itself is the deepest honest canonical home rather than retroactively
  forcing it into a later leaf.

title: Her Smoke Rose Up Forever
cover_url: https://tachyonpublications.com/wp-content/uploads/2004/12/Her-Smoke-RGB.jpg
shows_english_title: true
authors:
- James Tiptree Jr.
year: 1990
placement_note: SFE calls this a retrospective collection of Tiptree’s major stories
  and identifies her extraordinary 1970s genre-SF short fiction as her lasting achievement.
  Tachyon says its eighteen stories explore alienation and gender alongside major
  SF concerns. Soft science fiction is the closest existing leaf because human psychology
  and social identity drive its speculative premises.

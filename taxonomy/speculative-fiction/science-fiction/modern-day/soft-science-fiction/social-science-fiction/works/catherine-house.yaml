placement_rationale: >-
  Publishers Weekly explicitly opens the novel in 1996, so it fails Historical and passes Science fiction -> Modern day. Catherine House is a closed educational institution using plasm experimentation, mass hypnosis and psychosexual healing to reshape students' memory and identity; the psychology and institution govern the speculative inquiry more than physical mechanism, making Soft science fiction -> Social science fiction the closest existing leaf. Strange Horizons calls it a modern science-fiction ghost story, but the tree has no time-neutral Gothic-SF route under the user's historical-only ruling.

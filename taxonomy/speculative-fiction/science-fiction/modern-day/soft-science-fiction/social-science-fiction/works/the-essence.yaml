placement_rationale: 'Root-down: Science fiction -> Modern day -> Soft science fiction -> Social science fiction. A contemporary MI6 economist with memory gaps is
  pursued by rival communities studying reality intrusions and collecting altered artefacts. Psychology, belief, theoretical conflict and the social workings of research
  communities govern over scientific mechanism. Teleportation is not a hard-science gate; no magic or time travel established. Curator approved this thematic home

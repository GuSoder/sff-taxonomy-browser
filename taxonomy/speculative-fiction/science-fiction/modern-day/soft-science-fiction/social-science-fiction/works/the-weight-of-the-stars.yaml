placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Social science fiction. Macmillan centers a trailer-park teenager’s relationship with the daughter of an astronaut on a private one-way mission beyond the Solar System. Radio messages, class barriers, chosen family, grief and the human price of exploration govern; technology supplies the social premise rather than an engineering problem.'

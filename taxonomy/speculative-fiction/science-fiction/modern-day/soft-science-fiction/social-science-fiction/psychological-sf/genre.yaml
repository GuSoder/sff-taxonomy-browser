definition: 'Social science fiction in which the science studied is the individual mind: intelligence raised or reshaped,
  perception bent by drugs, desire shaped by technology, thought rewired by language, a self meeting what it cannot explain.
  The mind is the experiment. Not Sociological SF, where the subject is a group or a society.'

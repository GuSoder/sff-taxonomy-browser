definition: 'Soft science fiction that pretends to a science which is not one: parapsychology, cryptozoology and their kin.
  The story borrows the posture of evidence (experiments, expedition reports, blurry photographs, "science has not looked
  properly") for powers and creatures the method would not support. Pure umbrella: Psi powers and Cryptid horror. Not Pulp
  SF, where the story does not even pretend.'
status: umbrella

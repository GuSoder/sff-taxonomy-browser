placement_rationale: 'Jacqueline Carey''s Santa Olivia and Saints Astray: Loup Garron, born in a walled-off town on the Texas-Mexico
  buffer zone, is the fearless, superhumanly strong child of a genetically engineered soldier, and she turns into the masked
  hero her forgotten town needs. The author''s own framing is her take on comic book superheroes; the powered hero and what
  her acts do to the community are the story. Walked root-down: Modern day -> Soft science fiction -> Superhero fiction.'

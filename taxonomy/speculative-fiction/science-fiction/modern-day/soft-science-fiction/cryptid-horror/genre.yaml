label: Cryptid horror
parent: soft-science-fiction
children: []
image: 240-cryptid-horror.webp
definition: Modern-day soft science fiction and horror in which an alleged hidden animal or folkloric species becomes materially real, with the creature's
  biological possibility supplying the speculative premise and its attack, pursuit or discovery supplying the horror.
status: accepted
notes: Reader-facing descriptive label. This branch is science fiction only where the cryptid is treated as a materially real terrestrial species; magical
  monsters belong on the Fantasy side. The former Cryptid Gothic portrait is reused by Gustav's 2026-09-20 ruling.

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Cryptid horror. Tor and SFE explicitly make Weyland a biological, non-supernatural vampire: an evolved predator in the natural order, hiding as an anthropologist in contemporary America. The hidden species and predation govern, not magic.'

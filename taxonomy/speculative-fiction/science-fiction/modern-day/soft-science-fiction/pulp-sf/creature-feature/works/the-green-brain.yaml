placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Soft science fiction > Pulp SF > Creature
  feature. Per Wikipedia, Kirkus-era reviews and the curator''s own questions of 2026-10-08: in a pesticide-era near future
  an emergent insect collective intelligence, the Green Brain, assembles insects into human-shaped forms to infiltrate a Brazilian
  human zone; no society-wide collapse, a covert contest; earnest ecology fable in a pulp package (Ace 1966, expanded from
  a short story), no real entomology. Nature striking back with a monstrous collective is the Creature feature definition.
  Rejected: Cryptid horror (not alleged or folkloric, no pose of evidence), Genetic engineering (owner rejected the seed),
  Alien infiltration (terrestrial). Wobble: full-plot sources are thin; the ending''s reveal is unverified. Year 1966 (Ace),
  queue says 2002 reissue.'

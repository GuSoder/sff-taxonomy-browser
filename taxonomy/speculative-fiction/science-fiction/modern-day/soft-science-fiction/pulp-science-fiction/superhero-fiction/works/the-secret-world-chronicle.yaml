placement_rationale: 'Lackey''s Secret World Chronicle (Baen, 2011-2018; Lackey and Steve Libbey''s online role-playing setting
  written as braided novels with Cody Martin, Dennis Lee and others; mercedeslackey.com, Wikipedia): in a world used to metahumans
  who work with their governments as high-powered peace officers and fight rogue metahuman super-criminals, a swastika-marked
  mecha army from an alternate and far more advanced Third Reich attacks every government at once in Invasion, and the metas
  have to find their place in society afterwards in the later books. Walk: Science fiction > Modern day > Soft science fiction
  (the premise is accepted as given) > Pulp science fiction > Superhero fiction (powered heroes and villains, the institutions
  around them and the social consequences). Rejected: Alien and Alternate-world invasion leaves (the invaders are a plot engine,
  the subject is the metas), Creature feature, Cyborgs (the powers are metahuman, not engineered bodies), Psionics (not a
  gift-and-institution story). One series is one fiction (11j): the five Secret World Chronicle novels. Wobble low. Years
  are the Baen first-publication years from mercedeslackey.com, queue years differ for Collision (2014 in the queue).'

placement_rationale: 'Root-down: Science fiction -> Modern day -> Soft science fiction -> Psi powers. Pan Macmillan centers Ella’s precognition and city-wrecking power amid the recognizable Black American present, including Kev’s incarceration. Social dystopia is rejected because psi power, not the social order alone, is the speculative engine.'

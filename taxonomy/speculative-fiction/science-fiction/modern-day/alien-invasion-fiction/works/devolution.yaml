canonical_genre: alien-invasion-fiction
placement_status: accepted
placement_rationale: >-
  Root-down after the historical Gothic ruling: the high-tech Greenloop community is recognizable present-day, so it passes Science fiction -> Modern day. Penguin Random House presents a materially real Sasquatch species descending on an isolated human settlement after Mount Rainier's eruption, hunting and besieging its residents. Although terrestrial rather than extraterrestrial, the story's governing science-facing mechanism is a nonhuman species invading a human enclave; Alien invasion fiction is the closest existing Modern-day leaf. Cryptid fiction would be cleaner, but no such Modern-day leaf exists.

placement_rationale: >-
  HELD after root-down audit. The high-tech Greenloop community is recognizable present-day, so it passes Science fiction -> Modern day. Penguin Random House presents a materially real Sasquatch species hunting and besieging an isolated human settlement. Existing Alien invasion fiction explicitly requires extraterrestrials, so a terrestrial cryptid fails that gate. The clean home is a new Modern-day Cryptofiction leaf, an attested term in scholarship, but its required portrait cannot be created until the image-generation limit resets at local midnight.

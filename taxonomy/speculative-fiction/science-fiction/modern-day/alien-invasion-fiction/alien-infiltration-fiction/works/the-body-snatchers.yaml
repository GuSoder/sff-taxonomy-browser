placement_rationale: 'Root-down: Speculative fiction > Science fiction > Alien fiction > Alien invasion fiction > Alien infiltration
  fiction. Jack Finney: in the California town of Mill Valley, a doctor finds that seed pods from space are replacing townspeople
  with emotionless duplicates (Gollancz and Simon and Schuster publisher pages; ISFDB title record lists the 1954 Collier''s
  serial and the 1955 Dell and Simon and Schuster book). The takeover works from within, through duplicated hosts, and the
  story is the discovery of who is no longer themselves, the leaf''s definition. Rejected: Alien conquest fiction (no fleets,
  no open war), Alien horror (the horror is the engine, but the invasion plot is the spine and the leaf already holds The
  Puppet Masters and The Midwich Cuckoos), Near-future first contact. Wobble: low; the textbook case. Year is first book publication,
  1955 (ISFDB: serial 1954, copyright 1955). Queue id MC04060; the Gollancz SF Masterworks cover carries the book''s own title.'

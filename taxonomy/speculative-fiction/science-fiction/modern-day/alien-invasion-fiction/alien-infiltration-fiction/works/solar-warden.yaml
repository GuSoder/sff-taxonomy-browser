placement_rationale: 'Root-down: Speculative fiction > Science fiction > Alien fiction > Alien invasion fiction > Alien infiltration
  fiction. Ian Douglas (William H. Keith): in an alternate present where conspiracy theories are real, Navy SEAL Mark Hunter''s
  team uncovers reptilian Saurians (a time-escaped dinosaur subspecies, per the author''s Q&A with Deborah Kalb, 2023-04-27)
  trying to retake Earth by infiltration, disinformation and chaos, allied with Nazi remnants in space (HarperVoyager blurb
  for Alien Hostiles). The takeover works from a hidden hand and the story is the discovery of what has already happened,
  the leaf''s definition. Rejected: Alien conquest fiction (no open fleets landing or occupation of the planet), Hidden history
  SF (the secret is a live war, not a past event), Near-future first contact (the aliens are hostile covert actors, not a
  contact). Wobble: moderate; much of the action is covert military operations in space and the SEAL team''s war with the
  Saurians, so Alien conquest or a military leaf could claim it. Years: HarperCollins on-sale dates (Alien Secrets June 2020,
  Alien Hostiles November 2021, Alien Agendas April 2023; ISFDB agrees). Queue ids MC03891, MC03890, MC03889.'

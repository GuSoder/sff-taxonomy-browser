placement_rationale: 'Philip K. Dick and Ray Nelson''s The Ganymede Takeover (Ace, 1967; Wikipedia): Earth has been conquered
  by limbless, worm-like aliens from Ganymede who keep a slave race of creeches; the human resistance includes the Neeg-parts
  led by Percy X and a second secret movement run through the World Psychiatric Association, and its agents work among collaborators
  to protect him. Walk: Science fiction > Modern day > Alien invasion fiction > Alien conquest fiction > Fallen Earth (invaders
  have won, the story is survival, collaboration and resistance under alien rule). Tried: Warzone Earth (the war is over,
  the defenders do not hold ground) and Alien infiltration (the occupation is open).'

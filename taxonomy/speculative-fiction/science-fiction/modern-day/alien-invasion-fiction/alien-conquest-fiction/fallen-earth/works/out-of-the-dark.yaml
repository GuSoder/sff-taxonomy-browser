placement_rationale: 'Walk: Science fiction > Modern day > Alien invasion fiction > Alien conquest fiction > Fallen Earth.
  In Weber''s Out of the Dark (Tor, 2010; sequels Into the Light 2021 and To Challenge Heaven 2024 are not in the queue),
  the Shongairi, set on by the Galactic Hegemony, kill more than half of humanity with orbital strikes and leave the cities
  in radioactive ruins; the story is survival and guerrilla resistance under the invaders, led by Marine Stephen Buchevsky
  in the Balkans and former Marine Dave Dvorak in the American South, until Dracula''s vampires take the Shongairi fleet (Wikipedia;
  davidweber.net; Macmillan). Placed in Fallen Earth by the curator''s split distribution. Wobble moderate: the human side
  wins a real war late on, so Warzone Earth is the alternative, but the book opens after the fall and most of it is resistance
  to an occupying power.'

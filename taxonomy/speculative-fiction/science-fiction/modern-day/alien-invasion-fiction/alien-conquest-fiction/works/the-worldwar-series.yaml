placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Alien invasion fiction > Alien conquest
  fiction. Turtledove''s Worldwar series (the Worldwar tetralogy, the Colonization trilogy and Homeward Bound; Wikipedia counts
  eight novels) is one shared universe, so one card (rule 11j): a reptilian species called the Race invades Earth on 30 May
  1942, in the middle of the Second World War; the Axis and Allied powers must cooperate to fight them; the tetralogy ends
  in a stalemate with the Race holding about half the planet, and the story runs on through the 1960s (Colonization) to 2031
  (Wikipedia, Worldwar series). Fleets arrive, armies land, the planet is fought over and partly occupied, and the story is
  the war, occupation and the human answer, the leaf''s definition exactly. Rejected: Alt WWII (the fork there changes the
  war itself; here an alien invasion of an otherwise unchanged war, and the aliens and their rule drive the whole 90-year
  story), Alien infiltration fiction (the invaders take ground openly), Alien arrival (the Earthbound first-contact leaf,
  where the encounter is a first meeting, not a war). Wobble: low to moderate. Wikipedia''s series article only; no text read.
  The 1942 setting would suit a historical shelf, but the engine is the alien conquest. The queue holds six volumes: In the
  Balance, Tilting the Balance, Upsetting the Balance, Striking the Balance, Second Contact (Colonization 1) and Homeward
  Bound; Colonization books 2 and 3 are not in the queue. Alien conquest fiction is now at nine cards, so its next arrival
  gates. Years: Open Library first publication (In the Balance 1994, Tilting the Balance 1995 per Wikipedia though Open Library
  says 1994, Upsetting 1996, Striking 1996, Second Contact 2000, Homeward Bound 2004); the queue years differ by reprint (Striking
  1997, Second Contact 2000, Homeward Bound 2005, Tilting 1995). Cover for Upsetting is a small scan. Queue ids MC03747, MC03795,
  MC03798, MC03770, MC03767, MC03743.'

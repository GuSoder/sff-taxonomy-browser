definition: 'Alien invasion fiction in which the aliens do not take the world but take from it: a hidden enterprise, a talent
  drain, a harvest of people or skills run quietly on Earth''s own terms. Not Alien conquest fiction (no open force, no occupation),
  not Alien infiltration fiction (nobody is replaced or taken over from within), not First contact (the aliens are already
  here and already at work).'
status: accepted
ruling: 'Seed approved by the curator ("Approved", phonemsg-01M4KJSXF1ZCF3N1KNRMKVFW3B, 2026-10-10 8:56 PM CEST) on the intake''s
  "Approve seed?" question for Frederik Pohl''s Narabedla, Ltd. Alien conquest (open force) and Alien infiltration (takeover
  from within) were both tried and fail: the aliens here take nothing over, they run a business that drains Earth''s talent.'

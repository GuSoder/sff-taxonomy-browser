placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Apocalyptic fiction -> Pandemic. SFE calls Wanderers a Near
  Future tale of the immediate aftermath of a planetary Disaster; NPR and Kirkus center a plague of sleepwalkers and the fungal pandemic that kills most
  of humanity while a recognizable America tears itself apart. The end of the world by plague, in progress, governs. Two published books; not treated as
  complete.'

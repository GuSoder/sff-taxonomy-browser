placement_rationale: Macmillan describes Shen Fever spreading through New York while companies and transit cease and Candace joins survivors traveling toward a new settlement; Publishers Weekly calls it a postapocalyptic fungal infection that renders victims zombie-like. The spreading plague and civilization-in-progress collapse make Modern day -> Apocalyptic fiction -> Pandemic the deepest existing leaf, while its satire of work and capitalism is the mode rather than the catastrophe gate.

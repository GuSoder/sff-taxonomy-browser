placement_rationale: 'Laurie R. King writing as Leigh Richards, Califia''s Daughters (2004; laurierking.com, PRH, Booklist):
  near-future California after the bombs and a virus that killed the world''s men; women warriors like Dian guard the few
  surviving males in a peaceful valley enclave, and a convoy of strangers brings a gift that sends her on a hazardous journey
  north. Walk: Modern day > Apocalyptic fiction > Pandemic > Die-off (most of humanity dies in a short span and survivors
  inherit the emptied world). Rejected: Feminist utopia (a society transformed by feminism as an ideal; here it is a survival
  order after collapse), Mystery plague. Wobble: moderate; the story is the post-plague society, a gendered die-off. Sources:
  laurierking.com, PRH, Booklist; not read.'

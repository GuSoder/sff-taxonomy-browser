placement_rationale: 'Ringo''s Black Tide Rising (Under a Graveyard Sky 2013, To Sail a Darkling Sea 2014, Islands of Rage
  and Hope 2014, Strands of Sorrow 2014/15, The Valley of Shadows 2018 and River of Night 2019 with Mike Massa; the queue
  holds Islands of Rage and Hope, Strands of Sorrow and River of Night, the anthology Black Tide Rising MC00019 is skipped):
  a plague turns most of humanity into rabid infected, and a survivalist family escapes by boat and becomes the best hope
  of others stranded at sea (Wikipedia, ISFDB). Root-down: Science fiction -> Modern day -> Apocalyptic fiction -> Pandemic
  (civilization ends by plague) -> Zombie apocalypse (the plague turns people: the infected). Wobble low: the infected are
  living and rabid, not the dead, which the Pandemic leaf definition covers (''the infected, the risen dead, the fevered'').'

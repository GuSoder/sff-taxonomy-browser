placement_rationale: 'Larry Niven and Matthew Joseph Harrington''s The Goliath Stone (Tor, 2013; Publishers Weekly, Kirkus,
  Macmillan): nanotechnologist Toby Glyer launches the early-warning satellite Briareus against meteors; its nanites evolve,
  it vanishes, and it returns 25 years later as a rock on a collision course with Earth. Walk: Speculative fiction > Science
  fiction > Modern day > Apocalyptic fiction > Cosmic catastrophe. Rejected: the other Apocalyptic leaves (chemical, climate,
  geological, pandemic, unknown: the threat is an object from space) and any nanotech leaf (none exists). Wobble: low; the
  nanites are the cause, the space rock is the disaster. Placed as the 9th card after Seveneves moved out, so no split. Sources:
  PW, Kirkus, Macmillan excerpt; not read in full.'

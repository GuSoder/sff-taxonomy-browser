placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Apocalyptic fiction -> Cosmic Catastrophe. SFE calls it a long Disaster novel: an artificial world-ship intrudes into the Solar System, destroys the Moon, and causes worldwide tidal, earthquake and volcanic devastation as it unfolds. Disaster falling from the sky governs over its alien society and scattered survival viewpoints.'

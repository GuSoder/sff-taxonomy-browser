placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Apocalyptic fiction -> Climate Catastrophe. Europa
  and Kirkus set near-future bonobo research inside a powerful climate-change event; a dust storm disables the networked research station and
  forces humans and apes into survival. The unfolding climate disaster governs the turn from laboratory social science to possible remade world.'

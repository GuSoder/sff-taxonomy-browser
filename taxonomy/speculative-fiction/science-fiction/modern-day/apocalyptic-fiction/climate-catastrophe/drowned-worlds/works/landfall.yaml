placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Apocalyptic
  fiction -> Climate catastrophe. The Conversation: flooded Sydney 2050 after ''the Big Melt'' glacier
  event - ''extreme weather events and soaring daily temperatures'', parts of the metropolis ''permanently
  underwater'', a crime novel on ''an ecologically ravaged planet''. The climate itself has turned against
  civilization; no tyranny engine, so not cli-fi-dystopia.'

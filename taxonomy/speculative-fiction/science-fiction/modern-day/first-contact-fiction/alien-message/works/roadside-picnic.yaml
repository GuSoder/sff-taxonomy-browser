placement_rationale: 'Root-down: Science fiction -> Modern day -> Earthbound 1st Contact -> Alien Message. SFE places it in a near-future recognizable Earth after an unexplained alien interference whose artifacts are humanity’s only consequential contact. Alien Arrival fails because no alien appears; Alien Invasion fails because the visitation is apparently accidental, not conquest.'

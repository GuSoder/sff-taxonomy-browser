placement_rationale: 'Alan Dean Foster, the Tipping Point trilogy (The Human Blend 2010, Body, Inc. 2012, The Sum of Her Parts
  2012; Del Rey, Publishers Weekly): in a near future where genetic manipulation and extreme body modification are ubiquitous
  and criminals are punished through gene work and surgery, a geneticist and a modified street runner (Whispr) flee corporate
  assassins across Africa to reach a mysterious filament. Walk: Speculative fiction > Science fiction > Modern day > Genetic
  engineering > Genetic caste fiction (gene work makes a designed kind of person; heredity and modification become rank and
  punishment). Rejected: Cloning fiction (no copies), Technothriller (the engine is the modified body, not a system under
  strain). Wobble: medium, the chase plot is thriller-shaped. Sources: Penguin Random House, Publishers Weekly, SF Crowsnest.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Genetic engineering > Genetic caste
  fiction. Per Wikipedia: in a far future, the Optimen, a genetically engineered immortal caste, rule the unmodified Folk,
  and a clone-and-gene plot threatens the order. Gene work that makes a designed kind of person and a divide between the modified
  and the unmodified is the Genetic caste fiction definition. Rejected: Huxleyan dystopia (the caste is the premise, conditioning
  is not), Cloning fiction (the plot touches cloning but the divide is the frame). Wobble: Dystopia reading is also strong.
  Year is first publication 1966, not the queue''s 2002 reissue. Placed as the tenth of the split Genetic engineering umbrella,
  after the owner''s Execute (phonemsg-01M4DCCZNGMXPRD54EQCZ0NDEQ).'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern-day > Genetic engineering > Hard genetic SF
  (seeded for this book on the curator''s ruling, phonemsg-01M4K3QM6QBTV6WE00Z5TBB1ZM, 2026-10-10 4:33 PM, after he rejected
  the proposed Modern-day seed). Gwyneth Jones, Life (Aqueduct Press, October 2004; Philip K. Dick Award 2005; Gollancz SF
  Masterworks edition 2018 is its first UK publication): Anna Senoz, a genetics researcher, discovers Transferred Y, a virus-driven
  change in how genes are shuffled in reproduction that lets the Y chromosome swap material with the X; in the long run the
  Y may disappear and no genetic trait would be exclusive to men or to women (Vector, Life #4: https://vector-bsfa.com/2011/09/18/life-4/;
  Hubble, Worldcon 2021: https://prospectiveculture.wordpress.com/2021/12/20/where-will-it-all-lead-gwyneth-joness-life/).
  The novel follows her career, marriage and the media storm around the finding. Modern-day condition: set in a projected
  early twenty-first century, the near-present of its writing (Hubble); Worlds Without End tags it Near-Future (https://www.worldswithoutend.com/novel.asp?id=666),
  so the Modern-day condition holds with a mild near-future caveat. Modern-day children tried: Genetic engineering (chosen
  by the curator; neither Cloning fiction nor Genetic caste fiction fits, hence the seed), Soft science fiction > Social science
  fiction (the science is genetics, not mind or group), Technothriller, Apocalyptic fiction (the virus is not the apocalypse;
  Hubble says it is not an End of Men story), Social dystopia modern, Alien invasion, First contact, Humorous science fiction:
  no fit. Wobble: low on the leaf now that the curator named it; the only doubt is Modern-day versus near-future Futurist,
  since the book projects its own early twenty-first century.'

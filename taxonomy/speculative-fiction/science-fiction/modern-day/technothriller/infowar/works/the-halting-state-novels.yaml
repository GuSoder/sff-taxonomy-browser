placement_rationale: 'Stross''s Halting State (2007) and Rule 34 (2011), a loose two-book series: in 2018 Edinburgh Sergeant
  Sue Smith investigates a bank robbery inside a multiplayer game world (the suspects are orcs with a dragon), which unfolds
  into hacking, state espionage and cyberwar; in Rule 34 Detective Inspector Liz Kavanaugh''s Internet-crime squad chases
  the murders of ex-spammers through an international conspiracy (PRH, Wikipedia). Root-down: Science fiction -> Modern day
  -> Technothriller (near-future tech thriller, our world) -> Infowar (information is the weapon: hacking, surveillance, spam,
  forged media), not Spytech (the gear is not the covert operative''s tool; the networks are the battlefield) or Technocrisis
  (no single system under strain). Wobble low to moderate: police-procedural framing, Spytech was the alternative.'

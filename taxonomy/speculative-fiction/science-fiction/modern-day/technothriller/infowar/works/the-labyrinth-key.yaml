placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Technothriller > Infowar. The Labyrinth
  Key (2004) is a US-China race to build a quantum computer that can break any code and protect any secret, with a dead scientist,
  a Hong Kong detective and the virtual world Cybernesia; knowledge is the weapon. The Spears of God (2006) is the second
  novel in the ISFDB Labyrinth Key series (series record 12570): a great-power race for a knowledge-based weapon, an NSA double-cross
  and the secret of mute children, near-future. One universe, one fiction (rule 11j). Rejected: Spytech (the intelligence
  services are players, the contest is over what is known), Technocrisis (no system under strain), Multiverse leaves (Cybernesia
  is a virtual world, not a parallel universe). Wobble: moderate; Spears of God drifts toward ancient-mystery and shamanism,
  and the series'' virtual-reality layer pulls toward Metaverse (4). Sources: penguinrandomhouse.com book pages for both titles,
  en.wikipedia.org/wiki/The_Labyrinth_Key, isfdb.org series 12570. Years: Labyrinth Key Ace 2004 (reissue 2006), Spears of
  God Ballantine 2006.'

placement_rationale: 'Root-down walk: near-future Earth and a first crewed Mars mission, so Modern-day; Technothriller; Technocrisis
  (a high-tech system under strain in a fast-moving crisis). Sources: Simon & Schuster publisher page (Rescue Mode, Bova with
  NASA''s Les Johnson, Baen 2014): the first human mission to Mars is struck by a meteoroid and nearly destroyed, too far
  out to turn back; the eight-person crew must nurse the crippled ship on while anti-spaceflight politicians on Earth use
  the accident against the program. Wobble: Hard SF > spaceflight could host it, but the plot is a crisis, not a research
  problem; Space-disaster stories are not a separate leaf. Year 2014.'

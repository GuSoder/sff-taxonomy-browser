id: pacific-storm
title: Pacific Storm
authors:
- Linda Nagata
first_published: 2020
canonical_genre: technothriller
placement_status: accepted
placement_rationale: >-
  Locus (Russell Letson, December 2020 issue) describes Nagata's recent line as the
  technothriller (The Last Good Man) and shelves Pacific Storm in "near-future-nightmare"
  territory beside Christopher Brown, Greg Egan and Nancy Kress, calling its shape an
  intrigue-thriller-disaster format. Honolulu cop Ava Arnett captains the night shift of
  the autonomous Waikiki District, guided by HADAFA, an AI that observes and predicts
  human behavior; as a Category 5 hurricane approaches, the AI glitches amid a terrorist
  conspiracy. The thriller engine is the near-future technology itself - exactly the SFE
  Technothriller theme. Shelfmates: Little Brother, Pattern Recognition. ISFDB: 2021
  Locus Best SF Novel nominee.

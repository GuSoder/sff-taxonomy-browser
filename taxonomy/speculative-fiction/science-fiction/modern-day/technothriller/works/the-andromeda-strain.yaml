id: the-andromeda-strain
title: The Andromeda Strain
authors: [Michael Crichton]
first_published: 1969
canonical_genre: technothriller
placement_status: accepted
placement_rationale: 'Root-down: Science fiction -> Modern day -> Technothriller. SFE calls Crichton a master of the Technothriller and treats the laboratory, containment technology and human fallibility as the novel’s engine. PRH grounds a present-day military probe, Project Wildfire and biophysicists racing to understand extraterrestrial contamination. Pandemic loses because the work focuses on a contained technical crisis rather than civilization ending by plague.'

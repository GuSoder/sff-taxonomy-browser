placement_rationale: 'Root-down: Science fiction > Modern day > Humorous science fiction. Evolved dinosaurs have survived
  secretly and live in contemporary Los Angeles and Miami in artificial latex human disguises; velociraptor private eye Vincent
  Rubio investigates murders, a cult and dinosaur mafia. Biological survival and manufactured disguises, not magic or supernatural
  transformation, set the SF root. The three-novel universe parodies noir and human social habits through its hidden dinosaur
  society, with comedy governing. Present-day cases, not the distant concealed prehistory, choose Modern day; the geneticist
  plot in the first book does not define the whole trilogy. Publisher and contemporary reviews verify1999/2001/2004; queue2005
  is a later paperback of Hot and Sweaty Rex. One shared-universe card, no omnibus duplication.'

placement_rationale: 'Scalzi''s The Android''s Dream (Tor, Oct 2006; Wikipedia; Publishers Weekly calls it a ''swashbuckling
  satire of interstellar diplomacy'', SFF180 an ''outright comedy''): the ex-soldier and State Department man Harry Creek
  has to find a sheep of the Android''s Dream breed for the coronation of the alien Nidu, or Earth faces a war it will lose,
  and the chase involves a sheep-worshipping church, an AI called Brian, a shopping-mall escape and a woman, Robin Baker,
  who turns out to be the breed''s last carrier. Walk: Science fiction > Modern day > Humorous science fiction (comic and
  satirical SF; the title is a joke on Do Androids Dream of Electric Sheep?). Rejected: Interstellar court politics and Space
  opera leaves (the diplomacy is the target of the satire, not the engine), Alien arrival and First contact (the aliens are
  already known and everyday), Scripted and Fabulation leaves (no authorship twist). Wobble moderate: the leaf is filed under
  Modern day while the book is set in a settled-galaxy future, which is an issue with the leaf''s placement and not with the
  fit. Queue id MC04841, first published 2006.'

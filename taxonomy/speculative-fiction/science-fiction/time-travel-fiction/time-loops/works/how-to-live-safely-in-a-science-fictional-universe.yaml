placement_note: SFE follows a time-travel repairman through loops and impasses as
  he revisits personal triumphs and traumas; PRH centers the son’s search for his
  vanished time-machine-inventor father through quantum space-time. Recurrence and
  self-encounter make Time Loops exact.

scope_note: 'Historical portion of the trilogy only: Donovan''s Brain and Hauser''s Memory. Gabriel''s Body remains held separately.'
setting_audit: 'Gustav ruling 2026-09-22 14:59 CEST: Historical is reader-relative. The 1942 and Cold-War 1968 settings now feel clearly historical. Gabriel''s
  Body (1992) is not source-grounded as clearly historical and remains held.'
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Gothic science fiction -> Mad-science Gothic. SFE identifies
  Dr Patrick Cory''s preserved-brain psi control and identity transfer; Hauser''s Memory is explicitly a Cold War CIA/East-West international-intrigue story.
  Forbidden experiment becomes possession and identity terror. Reader-relative doctrine admits these once-contemporary settings to Historical.'

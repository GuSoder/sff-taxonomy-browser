placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Proto SF > Lost world fiction > Lost
  race. Written in its own era and set in rural Australia, now historically legible: 1919 serial, first book 1925, not the
  queue''s 2013 annotated reissue. A buried sphere preserves a vanished civilization''s culture, technology and selected survivors;
  awakening Earani reveals the lost people''s social order and her project to impose it on present humanity. Baen explicitly
  calls it a classic lost-race novel. The single surviving representative is the encountered lost civilization, not a new
  Promethean creation. Hollow earth fails because the buried repository is not a living cavern realm; Lost wilds fails the
  untamed-beast frontier. Scientific adventure''s technological voyage and Fantastic voyage''s pre-novelistic journey do not
  govern. Mad science Gothic is a register near-miss, but discovery and revival of an ancient people govern over forbidden
  experiment; suspended animation is preservation, not SF time travel. One novel, revisions/reissues not extra books. Earani''s
  genocidal eugenics and racist assumptions are portrayed in the primary text and flagged by SFE, not endorsed by this classification.'

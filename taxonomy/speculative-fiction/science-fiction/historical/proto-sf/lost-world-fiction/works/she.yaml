genre_grounding: 'SFE (haggard_h_rider): the Ayesha sequence - She (1887), Ayesha: The Return of She (1905), She and Allan (1921), Wisdom''s Daughter (1923)
  - the definitive lost-world/lost-race romance: explorers in the African interior discover Kor, a surviving hidden civilization ruled by the immortal Ayesha.
  SFE''s Lost Worlds theme entry cites She as the template after Verne. Shelved in lost world fiction (explorers discover a surviving isolated civilization).'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical SF > Proto SF > Gothic science fiction
  > Mad-science Gothic. Wells, 1904 (Macmillan): chemist Bensington and Professor Redwood invent Herakleophorbia IV, a growth
  food; it escapes from the Hickleybrow farm into giant wasps, rats and chickens, then children fed on it grow to about 40
  feet, and a politician (Caterham) leads a crackdown on the giants that ends in a truce on the brink of a long struggle (Wikipedia
  plot). Rejected: Scientific adventure (runner-up: a technological marvel, but no fantastic voyage drives it), Lost world
  (no hidden land), Fantastic voyage (not pre-novelistic travel). Mad-science Gothic takes a forbidden experiment and bodily
  transformation unleashing monsters. Wobble: moderate. Wells wrote it as a fantasia on change of scale and a social satire,
  so the terror is the vermin and the mob more than the experimenters'' guilt; the plot is from Wikipedia, not the book. Year
  1904 (Wikipedia). Cover is the Gollancz SF Masterworks edition. Queue id MC03630.'

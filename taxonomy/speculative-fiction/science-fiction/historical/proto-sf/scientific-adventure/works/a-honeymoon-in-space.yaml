placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Proto SF > Scientific adventure. George
  Griffith''s A Honeymoon in Space (1901, serialized in Pearson''s Magazine in 1900 as Stories of Other Worlds) sends the
  Earl of Redgrave and his bride in the Astronef, an anti-gravity spaceship, on a tour of the Solar System: the ruined Moon,
  a Mars of giants who speak English, a Venus of sinless beings, Jupiter and Saturn (Wikipedia). A technological marvel and
  the fantastic voyage it enables, which is the leaf''s definition; Wikipedia calls it a scientific romance. Rejected: Classic
  planetary romance (it is a tour of many worlds, not one world''s civilizations), Fantastic voyage (that leaf is pre-novelistic
  journeys to lands and peoples, and this has the machine as its marvel), Pulp space odyssey (a pulp-era form). Wobble: the
  leaf says nineteenth-century and this is dated 1901; the form is the same as A Journey in Other Worlds (1894), the leaf''s
  other space tour. The cover is a modern reprint with the original-style pyramid illustration.'

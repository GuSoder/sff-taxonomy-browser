placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Period alterations
  > Alt Civil War. The series is named for Lee''s Special Order 191, which in Turtledove''s world the Union never finds: the
  Confederacy destroys McClellan''s army on the Susquehanna in 1862, wins recognition from Britain and France and gains independence,
  and the eleven books follow the two rival American nations through the Second Mexican War (How Few Remain), the Great War,
  the American Empire years and Settling Accounts into the 1940s (Wikipedia, Southern Victory Series). The fork is on the
  Civil War itself, the leaf''s definition, even though the later books run long after it. One universe across all subseries,
  folded into one card. Rejected: Alt WWI and Alt postwar (the fork is 1862, not the later wars). Wobble: moderate;
  the leaf''s wording is eve of or during the Civil War, and most pages are set later. Sources: Wikipedia. Years: 1997 to
  2007 per the Wikipedia list.'

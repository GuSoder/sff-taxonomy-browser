placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Period alterations
  > Alt Cold War. Turtledove, 1990: in a 1989 where the fourth planet is the blue, Earth-like Minerva, inhabited by feudal
  natives, American and Soviet missions go there together and, under cover of non-interference, turn two Minervan societies
  into proxies in a Cold War conflict, arming them with steel, rubber rafts and AK-74s (Wikipedia on the novel; Penguin Random
  House blurb). Earth''s history has been altered (a different Mars, a harsher Cold War with air combat over Beirut and a
  Gorbachev who dies in office), and the story is the Cold War itself played out on another world, the leaf''s definition:
  a fork and central substance that belong to the Cold War. Rejected: Alt present (not the near present but 1989 and the Cold
  War), Alt postwar branches (the fork is not the Second World War), Alien message and first-contact leaves (the contact is
  a setting, not the engine), Planetary romance (the book is about the superpowers, not the planet). Wobble: low to moderate;
  Wikipedia and a blurb only, no text read; the Minerva planet makes it a science-fiction alternate history more than a pure
  counterfactual. Years: first publication 1990 (Open Library, Wikipedia); the queue has 2011 for a Del Rey reissue. Queue
  id MC03719.'

placement_rationale: 'S. M. Stirling''s Tales from the Black Chamber (Ace: Black Chamber, July 2018; Theater of Spies, May
  2019; Shadows of Annihilation, March 2020; Wikipedia bibliography, publisher listings): an alternate history in which Theodore
  Roosevelt is elected president for a second time just before the First World War breaks out, and an American secret service,
  the Black Chamber, fights the Great War''s spy war. Three novels in one series. Walk: Science fiction > Historical > Alternate
  history > Period alterations (the fork lies within a lifetime of the story) > Alt WWI (fork and central historical substance
  belong to the Great War era). Tried: Machine age alterations (that is a lived-in changed world, here the war itself is the
  story).'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Period alterations
  > Alt WWII. Munich goes differently in 1938 (the cover copy asks what if Chamberlain had not appeased the Nazis) and the
  series then tells the whole war on its fronts, (cover copy and Penguin Random House book listings). The fork changes the
  war and the changed world is the war itself, the leaf''s definition. Rejected: Alt prewar (the fork is 1938 but the world
  shown is the war, not the years before it), Alt postwar (the war''s end is not the fork, and the story does not follow the
  peace). Wobble: low; only the late-1930s fork gives Alt prewar a faint pull. Sources: PRH book listings, cover copy. Years:
  first hardcover publication, 2009-2014 (queue shows paperback years, 2010-2014 and later).'

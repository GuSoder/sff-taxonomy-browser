placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Period alterations
  > Alt WWII. Japan invades and holds Hawaii after the Pearl Harbor attack, and the two novels follow the Pacific war that
  results, fought on the islands and at sea (Days of Infamy, End of the Beginning; Open Library). The fork lies inside the
  war and the changed world is the war itself, the leaf''s definition. Rejected: Alt postwar (the fork is not the war''s end
  and the war is the story), Alt prewar (nothing before December 1941 is altered). Wobble: low. Sources: Open Library. Years:
  first hardcover publication, 2004 and 2005 (queue shows 2006 for the second, a paperback year).'

first_published: 2015
canonical_genre: alt-postwar
placement_status: accepted
placement_rationale: 'Root-down: SF -> Historical -> Alternate history -> Period alterations -> Alt postwar. PW explicitly anchors artificial insemination''s rapid
  development to WWII; Amane lives in the changed postwar Japan where sex is taboo and Experiment City makes parenthood collective. A WWII fork within the generation
  preceding the depicted adulthood satisfies Alt postwar, not undated future dystopia or unanchored fabulation. Deep alterations is less exact because the named WWII-period
  fork and its immediate social legacy govern. Scientific reproduction, no literal magic.'

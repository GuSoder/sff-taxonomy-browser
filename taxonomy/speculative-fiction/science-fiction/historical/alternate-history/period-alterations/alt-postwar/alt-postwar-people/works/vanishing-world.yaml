placement_rationale: 'Root-down: SF -> Historical -> Alternate history -> Period alterations -> Alt postwar. PW explicitly
  anchors artificial insemination''s rapid development to WWII; Amane lives in the changed postwar Japan where sex is taboo
  and Experiment City makes parenthood collective. A WWII fork within the generation preceding the depicted adulthood satisfies
  Alt postwar, not undated future dystopia or unanchored fabulation. Deep alterations is less exact because the named WWII-period
  fork and its immediate social legacy govern. Scientific reproduction, no literal magic. Split walk 2026-10-09 (phonemsg-01M4FM4XH3PPRW78VZTBT0RYDD):
  Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Period alterations > Alt postwar > Alt
  postwar people. A postwar Japan where sex is taboo and parenthood is collective: a change in lives, not on the map.'

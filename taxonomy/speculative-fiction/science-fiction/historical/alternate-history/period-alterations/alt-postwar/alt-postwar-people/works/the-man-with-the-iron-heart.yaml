placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Period alterations
  > Alt postwar > Alt postwar people. Reinhard Heydrich survives his 1942 assassination and leads the Werwolf insurgency in
  occupied postwar Germany, which grows far more formidable than it was (Wikipedia, The Man with the Iron Heart). The fork
  is during the war and the story is depicted after it; the Allies still won and the map stays, and the change is one man''s
  survival and what he does with it, which is the leaf''s definition. Rejected: Alt postwar world (the Axis did not win),
  Alt postwar states (no new state is drawn). Wobble: moderate; this is the loudest card in a leaf of quiet ones, and its
  single-person fork is the only reason it sits here. Sources: Wikipedia. Year: 2008.'

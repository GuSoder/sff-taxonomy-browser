canonical_genre: alt-postwar-people
placement_status: accepted
placement_rationale: 'Root-down: SF -> Historical -> Alternate history -> Period alterations -> Alt postwar. In 1941 a plane
  intentionally crashes into Sinclair House, killing the Australian PM and his wife; main action is in 1993 as survivor Pera
  confronts escaped convicts. Ian Mond explicitly identifies the PM''s impossible death as the sole speculative element. A
  WWII-era fork depicted after the war, within a lifetime, fits Alt postwar; no real ghosts or supernatural house, so Gothic
  atmosphere is not Fantasy. The divergence is not an enduring transformed-world premise. Split walk 2026-10-09 (phonemsg-01M4FM4XH3PPRW78VZTBT0RYDD):
  Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Period alterations > Alt postwar > Alt
  postwar people. A prime minister''s impossible death is the single changed fact inside a recognizable Britain. WEAK CARD:
  the divergence is thin; it rides with people because only individual lives are changed.'

  in 2010 among a hidden group of Jews in a Nazi Reich that parallels the Soviet Union''s last days (Wikipedia, In the Presence
  of Mine Enemies). The fork is during the war and the changed world is shown after it, the leaf''s definition. Rejected:
  Alt prewar (the war is over), Alt present (the fork is named and early). Wobble: low. Sources: Wikipedia. Year: 2003. Split
  walk 2026-10-09 (phonemsg-01M4FM4XH3PPRW78VZTBT0RYDD): Root-down: Speculative fiction > Science fiction > Historical > Alternate
  history > Period alterations > Alt postwar > Alt postwar world. A Nazi Reich of 2010 after an Axis victory, with the Allied
  alternative never happening.'

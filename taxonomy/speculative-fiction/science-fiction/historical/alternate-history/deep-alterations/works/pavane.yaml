id: pavane
title: Pavane
authors:
- Keith Roberts
first_published: 1968
canonical_genre: deep-alterations
placement_status: accepted
placement_rationale: >-
  SFE (entry roberts_keith): Pavane "superbly depicts an Alternate History in which -
  Elizabeth I having been assassinated, the Spanish Armada victorious and no Protestant
  rise of capitalism in the offing - a technologically backward England" persists into
  the 20th century under the Church, with steam traction engines and the old guilds.
  The divergence (1588) runs four centuries deep before the story's present (c.1968)
  and has produced a transformed world order: exactly the deep-alterations definition.
  Shelfmates: The Alteration (another Catholic-dominated 20th century), Lest Darkness
  Fall, The Years of Rice and Salt. Pringle 100 Best SF Novels.
classification_sources:

placement_rationale: 'Root-down: Speculative fiction -> Science fiction -> Historical -> Alternate history -> Deep alterations. Explicit alternate 1930s Mars and
  colonization since the Civil War make an enduring changed world, not a single era marvel. Anabelle crosses the Martian frontier to recover her mothers voice recording.
  Old Mars is a strong furniture match (breathable Mars, clanking robots, saucers); its Atemporal root fails the usable Earth-time anchor. Space western has the same
  historical-root conflict. Root-down rule governs, no exception invented; parent instructed this doctrinal placement on 2026-09-30.'

placement_rationale: 'Full root-down walk: Science fiction > Historical > Alternate history (a fork in the past, not a changed
  present) > Deep alterations, not Period alterations (the fork, a changed charge at Horseshoe Bend in the War of 1812 that
  keeps Sam Houston from the wound that nearly killed him, lies two centuries back and the changed America is lived in across
  two books) > Machine age alterations, not Alt Civil War (the Civil War is not the fork; the story is the Jacksonian frontier
  and the removal of the southern tribes and their black neighbors to Oklahoma, with steamboats and the engine age as backdrop)
  and not Age of sail alterations (the fork is after 1800). Baen pages (https://www.baen.com/1812-the-rivers-of-war.html,
  https://www.baen.com/1824-the-arkansas-war.html). Series name Trail of Glory.'

placement_rationale: 'Taylor Anderson''s Destroyermen novels (Into the Storm through Winds of Wrath, the Artillerymen books
  Hell''s March through Inferno''s Shadow, and the Scout Cadre book Fleet of Ghosts): in 1942 the US destroyer Walker and
  her crew are carried into an alternate Earth with other history and other peoples, and spend years and decades living and
  fighting there, allied with the Lemurian people against the Grik (Wikipedia, Penguin Random House). The changed world is
  the setting the crews must live in, not a period replayed: Deep alterations.'

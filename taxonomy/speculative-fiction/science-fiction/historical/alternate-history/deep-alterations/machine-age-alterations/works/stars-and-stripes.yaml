placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Deep alterations
  > Machine age alterations. After the Trent Affair, Prince Albert dies prematurely rather than helping resolve the crisis,
  Queen Victoria blames the United States, and Britain enters the American Civil War, with the Duke of Wellington still alive
  in 1862 hinting that the real divergence reaches back to 1852 (Wikipedia, Stars and Stripes trilogy of three alternate history
  novels). The fork is in 1852 to 1861, after 1800, in a railway-and-ironclad world lived in. Rejected: Period alterations
  (the fork is not within living memory of the story), Age of sail alterations (the fork is after 1800). Wobble: low. Sources:
  Wikipedia. Years: 1998, 2000, 2002 (the queue showed 2001 to 2007 reissue dates).'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Deep alterations
  > Antique alterations. In ninth-century England under Viking raids, the thrall Shef, a bastard son of a Viking and an English
  lady, rises through the invading army and becomes an inventor, the authors exploring what might have happened had the Vikings
  fought Chalcedonian Christianity more successfully, with Shef''s visions left open as gods or dreams (Wikipedia; Kirkus
  calls it an ''alternate-world yarn''); One King''s Way and King and Emperor complete the trilogy. History forks before 1500
  and the changed world is lived in. Rejected: Viking fantasy (the book is alternate history of a real century, not myth-led
  fantasy), Age of sail alterations. Wobble: moderate; the gods may be real. Sources: Wikipedia. Years: 1993, 1995, 1996.
  John Holm is the pseudonym of Tom Shippey.'

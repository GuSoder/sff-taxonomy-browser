placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Alternate history > Deep alterations
  > Antique alterations. A trilogy set in a world where a continent, Atlantis, lies between Europe and Terranova where the
  Americas are, and its colonization from settlement to rebellion to independence is lived through, billed ''a novel of alternate
  history'' (Penguin Random House). The fork is the geography itself, which predates 1500, so it goes by fork date to Antique
  alterations, though the colonial era it plays out in suggests Age of sail alterations. Wobble: moderate. Rejected: Age of
  sail alterations (fork is not an event of 1500-1800), Machine age alterations. Sources: publisher page. Years: 2007 to 2009.'

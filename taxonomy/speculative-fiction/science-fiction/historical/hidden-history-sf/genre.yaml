definition: 'Hidden history SF: scientifically extraordinary events - aliens, psi powers, lost contacts - that happened in the past but went unrecorded. The events
  are undocumented by real history; concealment from the record is the marker. Covers both recorded-era settings (events that slipped past the chronicles) and prehistoric
  ones (before any record existed). The SF counterpart of Fantasy''s Secret history. Coined by Gustav 2026-09-23.'

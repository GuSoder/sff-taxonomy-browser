placement_rationale: 'Captain Grimm and the airship Predator undertake missions through an invented world of spires, steam-powered
  technology and magic. The author explicitly calls the series steampunk; the current Steampunk gate includes science fantasy
  and wholly invented worlds. The adventure engine is Grimm and his crew, not a transformation of recognizable Earth history.
  Full root-down walk: Speculative fiction > Science fiction (the specific Steampunk science-fantasy gate) > Historical >
  Period SF > Steampunk > Steampunk adventure.'

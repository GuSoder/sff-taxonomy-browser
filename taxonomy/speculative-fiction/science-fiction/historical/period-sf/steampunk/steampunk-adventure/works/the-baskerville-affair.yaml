placement_rationale: 'Full root-down walk: Science fiction (steam-era machinery is the engine; the sorcery is the empire''s
  enemy, and magic that can run machines is the prize) > Historical > Period SF > Steampunk, which holds alternate or actual-history
  Victorian settings: Evelina Cooper, Sherlock Holmes''s niece, lives in a Victorian era ruled by a council of steam barons,
  with automatons and mechanical power as the real monarch. Fantasy side checked and rejected (Gaslight fantasy is for folklore
  and magic first; here the machines come first), and Steampunk stays at its own level by the standing rule. PRH (https://www.penguinrandomhouse.com/books/220305/a-study-in-silks-by-emma-jane-holloway/).
  The short stories (The Baskerville Tales, MC02943) are held. Steampunk is now ten fictions.'

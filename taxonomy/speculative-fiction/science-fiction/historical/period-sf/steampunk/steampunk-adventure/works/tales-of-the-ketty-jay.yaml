placement_rationale: 'Root-down walk: set in the invented world of Vardia with airships, aerium-fuelled aircraft and a daemonist''s
  golem, so a steam-powered invented world rather than Earth; Historical > Period SF > Steampunk > Steampunk adventure (a
  mission drives the story inside a steam-powered world, alternate Earth or wholly invented). Sources: Chris Wooding''s own
  page chriswooding.com/the-books/retribution-falls, Publishers Weekly review (steampunk), Penguin Random House blurb (Darian
  Frey, captain of the airship Ketty Jay, runs contraband and robs airships; a heist on a freighter goes wrong, the freighter
  was rigged to blow, Frey is framed as public enemy number one and must find the real culprit; crew includes the daemonist
  Crake with an armoured golem, navigator Jez, doctor Malvery). Not Pirate fantasy (that leaf is ships on the sea). Wobble:
  the crew-and-mission shape of the series is closer to Caper than the leaf''s examples (Cinder Spires, Karen Memory), and
  a daemonist and golems add magic. Folded: The Black Lung Captain, The Iron Jackal, The Ace of Skulls as later Ketty Jay
  books; The Shadow Casket is a short Ketty Jay story and was not folded. Year 2009 (Open Library edition record).'

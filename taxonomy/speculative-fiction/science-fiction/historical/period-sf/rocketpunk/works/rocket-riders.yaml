placement_rationale: 'Root-down: Speculative fiction > Science fiction > Historical > Period SF > Rocketpunk. Howard R. Garis,
  written in the era itself: three schoolboys in a small lake town meet a secretive foreign inventor whose new rocket engine
  powers, one mode per volume, a sled, a boat and a plane (SF Encyclopedia entry on Garis; Free Library record: the boys accompany
  an inventor to Alaska to test his rocket-powered sled; Baen chapters I to IV read directly: 1930s slang, camp life, a mysterious
  inventor''s shack and night-time rocket flashes). One new rocket marvel breaks into an otherwise ordinary 1930s world and
  the world stays unchanged, the leaf''s definition. Rejected: Deco noir SF (the era matches but the mood is a wholesome boys''
  adventure, not noir; the curator ruled a separate Rocketpunk sibling on 2026-10-09), Scientific adventure (a stunt adventure
  with transport machines, not a voyage to somewhere strange), Pulp science fiction and Techno fiction (the curator''s historical-shelf
  test: the rocket age as it dawned is a closed period). Wobble: low to moderate; only the opening chapters of book 1 were
  read, the later volumes'' content comes from the SF Encyclopedia. Years: Wikipedia''s Rocket Riders list (Across the Ice
  1933, In Stormy Seas 1933, In the Air 1934); the Baen 2013 ebooks are in the queue. Wikipedia lists five volumes, so Over
  the Desert (1933) and one more are not in the queue. Queue ids MC03866, MC03867, MC03868.'

definition: 'Rocketpunk: science fiction of the rocket age at its interwar dawn, told as adventure - a new rocket engine or
  machine breaks into an ordinary 1930s world as stunts, chases and invention, and the world itself stays unchanged. Not Deco
  noir SF (there the mood is noir and the marvel a mad-science or psychic one). Named by the curator 2026-10-09; historical-shelf
  test: the period celebrated is closed, not the publication date.'

definition: "Deco noir SF: science fiction set in the Art Deco interwar era (roughly 1918-1939) and told in its noir and jazz-age mood - cities of chrome, glamour and rot underneath - where a single scientific or psychic marvel breaks into the period. Not Rocketpunk (there the marvel is a rocket machine and the story is its adventure). Rhymes with the banked Deco fantasy name. Named Deco SF by the curator 2026-09-23; renamed Deco noir SF 2026-10-09."
status: accepted

definition: 'Period SF: modern science fiction deliberately set in a past era - retro-futurist steam ages, Art Deco interwar cities. The marker is period aesthetics,
  not concealment: the SF elements may be openly revealed or kept hidden. Its direct subgenres are named for the era. Events that went unrecorded by history belong
  to Hidden history SF. The SF mirror of Period fantasy. Named by Gustav 2026-09-23.'

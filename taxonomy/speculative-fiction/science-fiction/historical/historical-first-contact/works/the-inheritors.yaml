first_published: 1955
canonical_genre: historical-first-contact
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Historical first contact. SFE identifies Prehistoric SF
  and Anthropology: the morally ambiguous encounter between Neanderthals and Cro-Magnon humans is the story’s governing event. Penguin likewise centers
  the last Neanderthal people confronting emergent Homo sapiens. The historical meeting of distinct human species makes first contact more exact than future-set
  anthropological SF.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Historical first contact. Lasswitz''s 1897 novel: a German
  polar balloon expedition in the late 1890s finds a Martian base at the North Pole and humanity''s first contact with the Martians follows. No magic (SF);
  no time travel (not Atemporal); the 1890s setting now reads clearly historical under the reader-relative Historical doctrine, and the encounter itself
  governs. Intake #948, held since 2026-09-23; Gustav ruled ''do the walk'' 2026-09-23 11:35.'

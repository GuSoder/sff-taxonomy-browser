placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Anthropological science
  fiction > Xenanthropology. Per the Baen blurb and Stranger Than SF review: Earth is a minor trade player; Joseph Farber,
  an artist with the Terran delegation on Weinunnach, falls for a Cian woman, Liraun, has his genes altered to marry her,
  and the book builds to the revelation of what the Cian society hides (Cian women die in childbirth and the whole culture
  and religion are built around it). The engine is the unfolding of an alien culture''s hidden logic, which is the Xenanthropology
  definition. Rejected: Alien dominions (the Cian do not rule humans; the humans are second-class traders, not captives in
  an alien empire), Colonial worlds (a trade delegation, not a settlement colliding with an alien world), Space romance (romance
  is the route in, the reveal is the point). Wobble: Farber is a participant and interferes (marries, is altered), against
  the without-interference wording; the card is on credit for the observer''s-gaze test. Published 1978 (Berkley); expanded
  from a 1974 novella.'

id: babel-17
title: Babel-17
authors:
- Samuel R. Delany
first_published: 1966
canonical_genre: xenolinguistics
placement_status: accepted
placement_rationale: SFE says the novel makes language central through an alien code based on the Whorfian idea that language forms perception; its invented
  societies are rendered through thought and speech patterns. The encounter transforms the poet-linguist deciphering it. This investigation of language,
  culture, and the observer's assumptions fits Anthropological science fiction more closely than its space-opera frame.

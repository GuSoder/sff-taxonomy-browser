placement_rationale: SFE identifies the two-volume Exo sequence and its Earth a century after alien conquest, where humanity no longer governs itself; the
  sequel destabilizes the colony when its ruling species may withdraw. Lee and Scholastic center divided human loyalties, alien-human mixed social orders,
  peace talks and cooperation among species. The series investigates colonial identity, allegiance and social belonging through sustained life inside alien
  rule, making Anthropological SF closest.

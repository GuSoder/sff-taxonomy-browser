placement_rationale: 'Root-down: Speculative fiction -> Science fiction (alien biology and a crashed interstellar colony ship,
  not magic) -> Futurist (neither Earth history, the modern-day world nor time travel) -> Alien fiction (nonhuman cultures
  and human intervention govern, not hard-science demonstration, Earth futures, space voyages or another cosmos) -> Anthropological
  science fiction (the historian''s fear of importing human violence and her eventual intervention in native society drive
  the encounter, beyond initial discovery) -> Xenocolonial (stranded human colonists become cultural and military agents in
  an alien world). Xenanthropology fails its non-interference condition; Xenolinguistics is not the engine; Earthborn fails
  the alien-society test. Alien expedition is the strongest alternative, but first contact starts rather than exhausts the
  cultural intervention story. Space colonies fails the established-settlement criterion; Space command names the war''s viewpoint
  but loses the defining cross-cultural moral conflict. SFE describes a matriarchal world invested by patriarchal humans;
  the publisher and independent reviews confirm the colony, native societies and historian-led intervention.'

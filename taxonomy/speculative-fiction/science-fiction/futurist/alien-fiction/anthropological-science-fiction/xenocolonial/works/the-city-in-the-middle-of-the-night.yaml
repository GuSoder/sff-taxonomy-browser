id: the-city-in-the-middle-of-the-night
title: The City in the Middle of the Night
authors: [Charlie Jane Anders]
first_published: 2019
canonical_genre: xenocolonial
placement_status: accepted
placement_rationale: >-
  Root-down: Science fiction -> Futurist -> Alien fiction -> Anthropological science fiction -> Xenocolonial. Macmillan and Anders set the novel on tidally locked January, where human colonists hunt and misread the native Gelet until Sophie's bond reveals an alien culture whose survival is tied to humanity's. Planetary climate structures the setting, but colonization and cultural violence govern the encounter.

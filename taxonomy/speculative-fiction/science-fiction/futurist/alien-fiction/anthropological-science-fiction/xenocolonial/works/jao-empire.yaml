first_published: 2003
canonical_genre: xenocolonial
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Science fiction -> Futurist (an interstellar civilization, not a recognizable
  present invasion, Earth history or time travel) -> Alien fiction (human/Jao/Lleix and further alien cultures learning to
  cooperate, not Earth futures, rigorous-science demonstration or an unanchored cosmos) -> Anthropological science fiction
  -> Xenocolonial. Across the trilogy, an occupied Earth becomes a partner of its Jao conquerors; the Jao then confront their
  participation in the attempted extermination of the Lleix; a new potential ally''s xenophobia is rooted in a prior alien
  invasion. Imperial violence and the rebuilding of cross-cultural trust govern the alliance that fights the Ekhat. Not Xenanthropology''s
  non-interference, Xenolinguistics'' translation engine or Earthborn''s human cultures. First contact describes particular
  encounters but misses the existing occupation and imperial legacy. Space armada is the strongest rival because fleet battles
  matter, but describes the military means rather than the series-wide cultural relationship; Space command likewise loses
  the occupation-to-cooperation arc. Modern-day Alien conquest fails the temporal parent and would treat the first volume
  as the whole universe. One fiction under rule11j, three published novels.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Anthropological science
  fiction > Xenocolonial > Alien dominions. The first Earth expedition to Alpha Centauri III finds that all life, humankind
  included, is governed by the Throne World and that Earth is a mere outpost of a vast star empire; Jim Keil, a superman at
  home, is only a ''wolfling'', a trained pet kept to entertain the High-Born, and the story is his life inside that alien
  power and how he turns it (Baen blurb; ISFDB title 3765, flap text: Princess Afuan takes him to the Throne World for the
  bull-ring). Alien dominions covers captivity within alien empires and humans living inside alien colonial power, which governs
  here. Rejected: Alien expedition (the discovery is the setup, the book is the subordination), Colonial worlds (human institutions
  do not enter an alien world), Space combat. Wobble: light-moderate; I have only the Baen blurb and the ISFDB flap. First
  published 1969; Baen reissue 2017.'

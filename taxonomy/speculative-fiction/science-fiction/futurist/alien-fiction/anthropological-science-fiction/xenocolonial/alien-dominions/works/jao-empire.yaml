placement_rationale: 'Source-read root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Anthropological
  science fiction > Xenocolonial > Alien dominions. Earth''s Jao occupation becomes alliance; the Jao face their imperial
  violence toward the Lleix and encounter another culture traumatized by invasion. The whole trilogy retains colonial legacy
  and rebuilding cross-species trust as its continuous relationship. The cross-cultural colonial relationship selects Anthropological
  science fiction over discovery alone, military means or settled civic life. The approved direction-of-colonial-power axis
  selects this child.'

placement_rationale: 'Larry Niven and Edward M. Lerner''s Fleet of Worlds series (Fleet of Worlds 2007, Juggler of Worlds
  2008, Destroyer of Worlds 2009, Betrayer of Worlds 2010, Fate of Worlds 2012; larryniven.net, Tor): the Puppeteers flee
  a galactic-core chain of supernovas with their worlds in tow, and human Concordance Colonists, whose ancestors the Puppeteers
  ''rescued'', serve them as caretakers and farmers on a Nature Preserve world; Nessus trains a few as scouts, who find the
  dark secrets of the Concordance, and Earth''s agent Sigmund Ausfaller works against the Puppeteers. A Known Space series
  with its own cast and premise, so a separate card from Ringworld. Walk: Futurist > Alien fiction > Anthropological SF >
  Xenocolonial > Alien dominions (humans living inside alien colonial power, subordination and allegiance). Not read; summaries
  from larryniven.net and Tor. Omnibus Ringworld''s Children and Fleet of Worlds skipped.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Anthropological science
  fiction > Xenocolonial > Alien dominions. One shared universe (the Cottohazz series per Wikipedia; Baen''s Stellar Commonwealth
  of the alien Varoki), so one fiction (rule 11j), folded across the two casts (Sasha Naradnyo in books 1 and 2, Sam Bitka
  in books 3 and 4; ISFDB lists the first two as the Sasha Naradnyo series). Per Baen, Fantasy Literature and SFRevu: humans
  are second-class labor and gangsters under Varoki overlords on Peezgtaan (Crack City), a human bodyguard works for a Varoki
  heiress and is caught in a Varoki civil war, and the Varoki later launch a pre-emptive strike on Earth''s colonies. Humans
  living inside alien power, with subordination and accommodation driving the story, is the Alien dominions definition. Rejected:
  Revolutionary space opera (only book two is a revolution, and it is the Varoki''s own), Space combat (books three and four
  only), Colonial worlds (the humans do not enter an alien world as colonial masters). Wobble: books three and four are a
  space-navy war and an exploration voyage, where Alien dominions fits less than Space combat; the shared universe''s human-under-Varoki-power
  frame is why they stay with books one and two. Ship of Destiny is dated 2020 per Wikipedia and ISFDB, not the queue''s 2019.'

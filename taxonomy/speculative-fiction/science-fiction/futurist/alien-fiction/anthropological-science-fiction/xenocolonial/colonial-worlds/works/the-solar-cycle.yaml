placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Anthropological science
  fiction > Xenocolonial > Colonial worlds. Gene Wolfe''s Solar Cycle, one universe in three series (rule 11j; curator ruling
  phonemsg-01M4E4MHATNAGJSH6VMAGPVYA7, 2026-10-08 18:13 CEST: fold the whole cycle into one fiction and place it at the series''
  final destination, as the shared-universe precedent). Genre journey, in publication and story order: The Book of the New
  Sun (1980-87) is a Dying earth tale under a failing sun; The Book of the Long Sun (1993-96) is a generation-ship city, the
  Whorl, where a priest named Silk fights for his manteion (Voyage societies); The Book of the Short Sun (1999-2001) follows
  the Whorl''s narrator to the colony planets Blue and Green in search of Silk, settlers and the native inhumi (Colonial worlds),
  where the cycle ends. Placed in Colonial worlds because the colonial planets are the last destination. Wobble: the earlier
  volumes read as Dying earth and Voyage societies; the card sits at the cycle''s end by ruling. Folded in: the Long Sun omnibuses
  Litany of the Long Sun (MC03359) and Epiphany of the Long Sun (MC03351) are editions of the four Long Sun novels and are
  not listed separately; Long Sun queue rows MC03347, 03352, 03357, 03360, Short Sun rows MC03355, 03361, 03364; the New Sun
  omnibuses (MC03370, 03377, 03378) are editions of the first four volumes.'

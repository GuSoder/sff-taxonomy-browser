placement_rationale: 'McCaffrey and Scarborough''s Petaybee series, queue row Powers That Be (Ace/Del Rey, 1993; Penguin Random
  House description): unauthorized species and vanished survey teams on the ice planet Petaybee, a company bent on exploiting
  its mineral deposits, and a disabled combat veteran, Yanaba Maddock, sent as the company''s spy, who regains her health
  among the natives and turns to protect the world. Walk: Science fiction > Futurist > Alien fiction > Anthropological science
  fiction > Xenocolonial > Colonial worlds > Planet plunder (the split of 2026-10-11, curator ''Execute'' phonemsg-01M4NWSBHS43Z4JTNSCDTC74SR;
  a company comes to strip the world and the world resists). Rejected: Frontier planets (the settlers are not making a home,
  the company is there to take), Alien dominions (humans are not under alien rule), Space colonies (not a settlement''s civic
  life). Wobble low. The queue lists only the first novel; the later Petaybee books are not in this sweep, so the card is
  titled for the series. Queue year 1994 is a reissue; first publication 1993. Queue id MC00769.'

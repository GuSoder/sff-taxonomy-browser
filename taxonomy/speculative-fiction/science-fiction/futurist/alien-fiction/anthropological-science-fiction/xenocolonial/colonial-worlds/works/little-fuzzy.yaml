placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Anthropological science
  fiction > Xenocolonial > Colonial worlds. On Zarathustra, a planet run by Victor Grego''s Chartered Zarathustra Company
  for its sunstones, prospector Jack Holloway finds the golden-furred Fuzzies, and the Company''s scientists try to disprove
  their sapience to keep its charter; the murder trial settles the question, and Fuzzy Sapiens follows the charterless Company,
  the new governor and the Fuzzies among the colonists (Wikipedia plot summaries). An extraction colony colliding with native
  life, the leaf''s definition. The Complete Fuzzy omnibus (MC03614) is an edition of these books and is folded here. Rejected:
  Alien arrival (the Fuzzies are native, nobody arrives), Colony politics (the engine is the natives'' status, not the settlers''
  own government). Wobble: moderate; the court case also reads as first contact. Sources: Wikipedia only. Years: 1962, 1964.'

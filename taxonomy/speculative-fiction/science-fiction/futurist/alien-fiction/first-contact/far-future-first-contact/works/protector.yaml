placement_rationale: 'Larry Niven''s Protector (1973; Wikipedia, PRH): Phssthpok, a Pak who has travelled thirty-two thousand
  years, comes to the solar system to save, develop and protect the descendants of the Pak breeders sent into space two and
  a half million years ago, which means humans; the first act of this outsider is to kidnap a native, and Belter Jack Brennan
  is drawn in. Walk: Futurist > Alien fiction > First contact > Far-future first contact (the first alien meets humanity in
  the far-future expansion). Sources: Wikipedia, PRH, larryniven.net; not read. Alternative: Alien cosmic history, since the
  Pak are our evolutionary past.'

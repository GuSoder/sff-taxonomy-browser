placement_rationale: 'Root-down: Science fiction -> Futurist -> Alien fiction -> First Contact -> Near-future first contact. SFE calls Wormwood a First Contact/Invasion sequence set several decades into the near future: an alien macrostructure erupts near Lagos, generates healing portals and a fungal techno-noosphere accessed by sensitives. Alien Expedition fails because humanity does not travel outward; Far-future first contact fails because this is near-future Earth.'

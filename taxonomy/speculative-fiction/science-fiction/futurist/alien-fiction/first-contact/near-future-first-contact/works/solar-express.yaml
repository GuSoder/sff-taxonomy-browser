placement_rationale: 'L. E. Modesitt''s Solar Express (2015; Kirkus, Modesitt''s site): about a century from now, the radio
  astronomer Dr. Alayna Wong-Grant finds a massive nickel-iron asteroid approaching, a power sends Capt. Christopher Tavoian
  on a solo mission to capture it, and she discovers it is not natural but created, an alien artifact that begins to affect
  life on Earth. Walk: Futurist > Alien fiction > First contact > Near-future first contact (alien presence transforms a recognizable
  human world). Weak: it is also hard-SF orbital mechanics. Alternative: Orbital mechanics. Sources: Kirkus, Modesitt''s site;
  not read.'

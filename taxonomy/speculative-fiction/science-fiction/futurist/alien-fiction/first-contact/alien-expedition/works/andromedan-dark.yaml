placement_rationale: 'Root-down: Speculative fiction > Science fiction > Alien fiction > First-contact fiction > Alien expedition.
  Ian Douglas: in 2162, thirty-eight years after first contact, Lord Commander Grayson St. Clair leads the colony ship Tellus
  Ad Astra, carrying over a million scientists, diplomats, soldiers and AIs, on an expedition to the Galactic Core, where
  the ship meets a threat no known race has seen (Altered Starscape and Darkness Falling publisher blurbs; the fantasyliterature.com
  review confirms the 2162 expedition). The outward voyage that meets an unknown intelligence away from Earth is the leaf''s
  definition. Rejected: Far-future first contact (the encounter is made on a mission out to the Core, not within settled expansion),
  Alien conquest (the invaders do not take Earth). Wobble: moderate; the earlier contact with other races exists and the second
  book is mostly ship-to-ship war with the Andromedans, so a military leaf could claim it. Years are HarperCollins US on-sale
  dates (Altered Starscape October 25, 2016; Darkness Falling November 28, 2017). Queue ids MC03892, MC03899.'

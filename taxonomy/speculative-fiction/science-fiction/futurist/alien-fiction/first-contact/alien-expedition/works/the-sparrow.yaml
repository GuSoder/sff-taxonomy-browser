genre_grounding: 'Fiction card for the Emilio Sandoz sequence (The Sparrow 1996, Children of God 1998). SFE (russell_mary_doria): a Jesuit mission (hollowed-out asteroid ship) to the planet Rakhat after SETI picks up broadcasts of haunting music; "First Contact with a complex native culture is established" - and goes disastrously sour. Won the Arthur C Clarke, BSFA and Tiptree awards. Placed in first-contact-fiction.'

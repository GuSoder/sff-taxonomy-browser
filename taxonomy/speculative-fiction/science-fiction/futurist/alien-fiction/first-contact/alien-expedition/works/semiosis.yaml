id: semiosis
title: Semiosis
authors: [Sue Burke]
first_published: 2018
canonical_genre: alien-expedition
placement_status: accepted
placement_rationale: 'Root-down: Science fiction -> Futurist -> Alien fiction -> First Contact -> Alien Expedition. Harper Voyager explicitly calls it a first-contact novel: settlers travel to distant Pax and must communicate and coexist with its intelligent plants. Space colonies is rejected because the first consequential encounter and negotiated coexistence, not an already-established colony’s civic life, is the engine.'

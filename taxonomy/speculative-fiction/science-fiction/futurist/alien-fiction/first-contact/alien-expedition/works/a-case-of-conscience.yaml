title: A Case of Conscience
authors:
- James Blish
first_published: 1958
canonical_genre: alien-expedition
placement_status: accepted
placement_rationale: 'SFE (blish_james): 1959 Hugo winner and ''one of the first serious attempts to deal with Religion in sf'' - a Jesuit priest on a human expedition to planet Lithia, whose sinless inhabitants he reads as a honey-trap thought experiment. A near-future (2049) human mission making contact with an alien civilization: the first-contact leaf beside Way Station and company.'

canonical_genre: alien-cosmic-history
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Alien cosmic history.
  Stephen Baxter''s Xeelee Sequence is one universe (rule 11j; fold requested via the parent on 2026-10-08 18:13 CEST after
  the curator''s Solar Cycle ruling phonemsg-01M4E4MHATNAGJSH6VMAGPVYA7, and confirmed as place-by-what-it-is-about at 18:14
  CEST): Destiny''s Children (Coalescent, Exultant, Transcendent) is the human-history strand of the Xeelee Sequence and runs
  into the far-future war with the Xeelee, so it folds onto this card. Placed by what the series is about: humans and the
  nonhuman Xeelee across deep time, the history of minds and civilisations at cosmic scale, not by endpoint. Wobble: Destiny''s
  Children alone reads as Future history in space; the card stays in Alien cosmic history because the Xeelee war frames the
  whole sequence. Rows MC08967, 08972, 08993 folded. Xeelee: Endurance (MC08999) is a story collection and is skipped.'

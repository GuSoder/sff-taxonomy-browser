placement_rationale: SFE describes an alien hunter surgically altered to pass as human
  who abducts humans as livestock; Canongate foregrounds Isserley’s dangerous roadside
  encounters. The novel’s engine is the slow bodily dread of humans being processed
  as meat, making Alien horror closer than anthropological study.

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future War. SFE sets the sequence
  in a Near Future Nigeria devastated by Climate Change; NYT, Kirkus and Black Gate center a reimagined Nigerian civil war in 2172 fought by augmented child
  soldiers and giant mechs. Technology-transformed war on Earth governs over the climate backdrop. Complete duology.'

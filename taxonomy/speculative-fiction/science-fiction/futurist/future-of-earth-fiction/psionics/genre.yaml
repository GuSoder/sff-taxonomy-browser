definition: Science fiction in which psi is treated as a studiable science - including telepathy, precognition, telekinesis, effective dreaming or consciousness/identity
  transfer - and shapes society or the story. It includes future settings and reader-relative alternate futures of speculative science that did not pan
  out. Cold War-era speculative psi/science written before the Cold War ended tests as Futurist Psionics; if analogous Cold War Psionics written after the
  Cold War ended appears, hold for Gustav to consider a Retro Psionics split.

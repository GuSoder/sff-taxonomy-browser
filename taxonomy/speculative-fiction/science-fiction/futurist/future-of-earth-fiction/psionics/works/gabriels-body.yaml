placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Psionics. Locus calls it an SF/medical
  thriller: biochemist Patrick Cory plans to restore his disfigured self through a perfect brain-dead body, only to find bodies have wills of their own.
  SFE links it to the Cory trilogy’s studied identity transfer. Under Gustav’s 2026-09-22 15:16 reader-relative Futurist doctrine, this psi-as-science from
  1992 reads as an alternate future’s science even without a future date.'

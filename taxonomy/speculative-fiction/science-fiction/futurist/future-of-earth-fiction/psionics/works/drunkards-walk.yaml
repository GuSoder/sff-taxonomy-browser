placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Psionics. Per Wikipedia, Baen and Pringle''s
  Ultimate Guide (quoted by L. W. Currey): in the overpopulated world of 2200 a popular math professor keeps trying to kill
  himself, and discovers that evil telepaths are driving him to self-destruction, with alcohol his defense, a plot that aims
  at millions of deaths. Psi treated as a studiable power that shapes the story is the Psionics definition, and the future
  setting is allowed. Rejected: Crowded dystopias (the crowding is backdrop, the plot is the telepath conspiracy), Rewired
  minds (the compulsion is telepathic, not a treatment or program), Psi powers (that leaf is for the recognizable present).
  Wobble: a paranoia thriller more than an examination of psi as science. Year 1960 (Galaxy serial and Ballantine, ISFDB).'

placement_rationale: 'SFE calls it possibly Moorcock''s finest single novel, a work whose grasp "makes generic pigeonholing impossible, despite touches of Telepathy and other psi phenomena in the text" (cross-referencing ESP and Psi Powers). Its fantastic content is psi - three outpatients'' telepathic perception of London in the recognizable present - and established psychic powers count as pseudoscience rather than magic per Gustav''s 2026-09-14 iMessage ruling. Contemporary-set psi story, so Psi powers is the closest leaf. Vetoable.'

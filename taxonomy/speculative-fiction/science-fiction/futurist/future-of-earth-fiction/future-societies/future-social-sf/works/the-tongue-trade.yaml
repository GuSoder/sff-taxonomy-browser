canonical_genre: future-social-sf
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future societies -> Future social SF. A century-future
  Earth society has mutually unintelligible professional dialects; interpreter William Kirst''s confidentiality oath traps him in a murder conspiracy. Linguistics
  and social mediation govern, not a gadget. Modern-day Social science fiction fails its temporal parent; Alien fiction/Earthborn fails browser expectations because
  this is Earthbound, not human-descended cultures in space. Dystopian-future children, Psionics, Techno fiction, Future war and Utopian fiction do not supply the
  engine. Future history of Earth fails the sustained-course gate: this is one future investigation. Curator explicitly chose the Future societies umbrella and Future
  social SF leaf, then Execute on 2026-09-30.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Science fiction {Historical, Futurist, Modern day, Atemporal} -> Futurist {Hard sci-fi, Future of
  Earth fiction, Spacefaring fiction, Alien fiction, Otherworldly fiction} -> Future of Earth fiction {Dystopian futures, Psionics, Techno fiction, Future war, Future
  societies, Utopian fiction} -> Future societies {Future history of Earth, Future social SF} -> Future social SF

placement_rationale: 'Philip K. Dick''s Solar Lottery (Ace, 1955; Wikipedia): the world government is run by a Quizmaster
  chosen by a computerized lottery, with a televised random selection of an assassin, so that the leader gains the respect
  of the people by surviving telepathic-guarded attempts on his life, in a society built on minimax game theory; the story
  follows the idealistic worker Ted Benteley. Walk: Science fiction > Futurist > Future of Earth > Future societies > Future
  social SF (a society examined at a future moment through social science, here game theory and sortition). Tried: Future
  history of Earth (one moment, not a sustained course) and Orwellian dystopia (the lottery is the legitimate order, not coercion
  by a state).'

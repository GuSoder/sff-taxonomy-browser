placement_rationale: 'L. E. Modesitt''s Archform: Beauty (2002; with Flash 2004, set in the same world earlier; Modesitt''s
  site, Wikipedia): in a 24th-century Earth society where no one wants for anything, technology supplies every need and the
  story examines what art, beauty and politics mean there; Flash is the 22nd-century prequel about science, advertising and
  politics. One shared world, so one fiction. Walk: Futurist > Future of Earth > Future societies > Future social SF (a society
  examined at a moment, driven by social questions). Sources: Modesitt''s site, Wikipedia; not read. Alternative: Future history
  of Earth.'

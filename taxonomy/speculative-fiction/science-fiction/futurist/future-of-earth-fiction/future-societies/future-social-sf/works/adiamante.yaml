placement_rationale: 'Modesitt''s Adiamante (Tor, Oct 1996; ISFDB, Publishers Weekly): in the far future Earth, long the abandoned
  capital of a star empire, has rebuilt itself as a society of conservation and nonaggression, and its code forbids offensive
  action until it is attacked. A fleet of twelve warships of near-indestructible adiamante from a former colony arrives to
  force surrender, and the planetary coordinator Ecktor deJanes has to defend the world without breaking those principles.
  Walk: Science fiction > Futurist > Future of Earth fiction > Future societies > Future social SF (an Earthbound society
  examined at one future moment, driven by its social design). Rejected: Future war (the book is not about technology-transformed
  fighting; the fleet is in orbit and the question is whether a nonaggressive code can hold), Future history of Earth (no
  sustained course across time), Secluded utopias and Utopian fiction (the society is the premise, but the plot is its test
  under siege, not its construction), Space colony politics (the story stays on Earth), Space armada (the fleet is the threat,
  not the viewpoint). Wobble moderate: the siege is a military plot and sources are the flap copy and one review. Queue year
  2010 is a reissue; first publication 1996. Queue id MC05662.'

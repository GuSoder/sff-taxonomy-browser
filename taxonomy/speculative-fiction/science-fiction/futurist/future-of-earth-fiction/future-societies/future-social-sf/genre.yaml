definition: Future-set Earthbound science fiction driven by psychology, sociology, anthropology, linguistics and other social sciences rather than physical or engineering
  problems. A society examined at a particular future moment belongs here; a sustained course across time belongs to Future history of Earth. This is a curator-chosen
  descriptive name, not a claim of an established genre term.

placement_rationale: In a monarchist New York some thousand years ahead, trans journalist Griffon Keming reads the prison memoir his adoptive father Etoine wrote
  while awaiting execution for killing the prince, and learns his parents' revolutionary past (Kirkus, Locus, PW 'dystopian trans saga'). The regicide is the rebellion's
  defining act, told in memory. Locus Award 2026 SF Novel shortlist. Placed by Gustav's 23:58 ruling.

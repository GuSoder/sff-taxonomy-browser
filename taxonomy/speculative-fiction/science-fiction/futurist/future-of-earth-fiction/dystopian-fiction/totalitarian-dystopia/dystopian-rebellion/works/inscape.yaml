placement_rationale: 'Louise Carey''s Inscape trilogy: InTech is a corporate state that runs its citizens through a mind-based
  operating system, and Tanta, once its armed agent, ends up outside its walls and then underground, fighting to bring the
  system down before its update turns the city into compliant zombies. The regime already holds power; the story follows the
  resistance. Walked root-down: Futurist -> Future of Earth -> Dystopian fiction -> Totalitarian dystopia -> Dystopian rebellion.'

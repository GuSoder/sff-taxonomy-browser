first_published: 1971
canonical_genre: dystopian-rebellion
placement_status: accepted
placement_rationale: 'Grove calls it a futuristic global war: repressive police states and their armies across a fascist world, fought by guerrilla bands of mutated
  wild boys. SFE stresses the surveillance-state power and the cut-up, hallucinatory form. The totalitarian order is already in power and the book''s foreground is
  the boys'' insurgency against it.'

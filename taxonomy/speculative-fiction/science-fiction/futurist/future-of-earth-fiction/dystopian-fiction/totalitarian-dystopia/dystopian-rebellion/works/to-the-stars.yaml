placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian futures
  > Totalitarian dystopia > Dystopian rebellion. A ruthless totalitarian oligarchy rules an overpopulated Earth and its colonies
  through a surveillance state; the technocrat Jan Kulozik loses his illusions and rebels in Homeworld, is exiled to the colony
  Halvmork in Wheelworld, and in Starworld returns to Earth to spread an interstellar rebellion that has overthrown the Earth
  Empire''s control of the colonies (Wikipedia). The regime already holds power and the story is the fight to bring it down,
  the leaf''s definition. Rejected: Crowded dystopias (overpopulation is the origin, not the engine), Classic Orwellian (the
  first book carries the surveillance but the trilogy ends in revolt). Wobble: moderate; the middle book is a colony survival
  journey. Sources: Wikipedia. Years: 1980, 1981, 1981.'

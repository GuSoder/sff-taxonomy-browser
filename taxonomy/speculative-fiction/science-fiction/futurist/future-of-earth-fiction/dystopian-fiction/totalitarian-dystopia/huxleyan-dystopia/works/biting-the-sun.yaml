placement_rationale: 'Tanith Lee''s Don''t Bite the Sun (DAW, 1976; Wikipedia), published with its sequel Drinking Sapphire
  Wine (1977) as the omnibus Biting the Sun, the queue''s row (the only row for the pair, so placed as one card): in a pleasure-saturated
  machine-run utopia people swap bodies every thirty days, kill themselves when bored and are reborn, and the narrator, one
  of the reckless ''Jang'' teenagers, fails to relate to her seven friends, finds emotion and learns love, and in the sequel,
  as a man, kills a friend in a duel and is offered a choice of punishments for a crime the society cannot rationally bear.
  Walk: Science fiction > Futurist > Future of Earth > Dystopian fiction > Totalitarian dystopia > Huxleyan dystopia (consent
  and conformity engineered through pleasure, bodies and conditioning). Tried: Satirical utopia (the society is shown as a
  trap for the narrator, not a satire of ours) and Social dystopia (no collapse). Wobble: Satirical utopia and Utopian fiction
  are the alternative leaves, because nothing here is a state with a ruler. Source: Wikipedia.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures ->
  Totalitarian dystopia -> Huxleyan dystopia. Simon & Schuster’s complete quartet builds conformity through compulsory beauty surgery, neurological
  conditioning, engineered bodies, high-tech pleasure and later fame rankings. Power manufactures consent and identity through the body rather
  than relying primarily on overt coercion.'

id: on-wings-of-song
title: On Wings of Song
authors:
- Thomas M. Disch
first_published: 1979
canonical_genre: Orwellianesque
placement_status: accepted
placement_rationale: Wikipedia and SFE describe a near-future America where a coalition of the Christian right ("undergoders") rules the Farm Belt, music is discouraged and electronically assisted astral "flying" is treated as sinful; the protagonist is imprisoned at 14 for distributing forbidden newspapers. Coercive state suppression of art, press and movement matches the Orwellianesque thread of coercive dystopias that fit no sibling shelf (cf. A Song for a New Day, another banned-music America, already in this leaf). The flying device is never technologized in detail, so this is social coercion, not hard SF.

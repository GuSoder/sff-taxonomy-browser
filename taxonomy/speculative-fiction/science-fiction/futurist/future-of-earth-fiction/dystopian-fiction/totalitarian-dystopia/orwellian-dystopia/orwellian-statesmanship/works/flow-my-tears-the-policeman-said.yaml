placement_rationale: 'Philip K. Dick''s Flow My Tears, the Policeman Said (Doubleday, 1974; Wikipedia): in a 1988 police dictatorship
  after a second American civil war, the TV star Jason Taverner, a genetically engineered Six with an audience of thirty million,
  wakes to find no one knows him and no record of him exists, and he must survive police checkpoints without papers while
  the police general Felix Buckman looks for him. Walk: Science fiction > Futurist > Future of Earth > Dystopian fiction >
  Totalitarian dystopia > Orwellian dystopia > Orwellian statesmanship (identity records, papers and police process). Tried:
  Orwellian assimilation (the state manufactures no identity here, it only has none for him).'

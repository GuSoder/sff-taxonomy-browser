placement_rationale: 'Philip K. Dick''s The Zap Gun (Pyramid, 1967; Wikipedia): set in 2004, two years after the governments
  of the two major blocs secretly ended their arms race; under the Plowshare Protocols both sides keep announcing ever stronger
  weapons, designed by trance-state weapons fashion designers such as Lars Powderdry, and privately turn the designs into
  consumer toys, so the public believes a Cold War continues that is largely fictitious. Walk: Science fiction > Futurist
  > Future of Earth > Dystopian fiction > Totalitarian dystopia > Orwellian dystopia > Orwellian propaganda (state distraction
  and governing spectacle). Tried: Satirical utopia (the blocs rule, no one is shown a better order) and Alt Cold War (a future,
  not a forked history). Wobble: the book is also a satire with an alien-threat plot, the staged arms race is the governing
  spectacle.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Totalitarian dystopia
  -> Orwellian dystopia -> Classic Orwellian. Penguin Random House calls it an Orwellian novel of state surveillance: objects disappear, most inhabitants forget them,
  and the Memory Police persecute the few who remember. Enforced forgetting, controlled reality and coercive surveillance run the 1984 formula directly.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian fiction
  > Post-holocaust survival > Post-nuclear survival. Per Wikipedia and Kirkus (1985): after a nuclear war that destroys the
  western powers, India and China divide the world and the ruined US becomes a Chinese agricultural colony; the rice-paddy
  labourer Pettyman Castor is sent as envoy to arriving aliens. The world is defined by the nuclear aftermath and the people
  who endure and push back inside it, which is the Post-nuclear survival definition. Rejected: Far-future first contact and
  the alien leaves (the aliens are the second half, and the war''s aftermath sets the stakes), Dystopian rebellion (the regime
  is a conqueror, not a native totalitarian state). Wobble: the alien envoy plot and the satire could argue for an alien-fiction
  leaf; no leaf fits a conquered post-war Earth better. Year 1985 per Kirkus; some listings say 1986.'

label: Terminal wastelands
parent: post-holocaust-survival
status: accepted
label_status: taxonomy-coinage
label_note: 'Taxonomy coinage for the condition-based complement to cause-defined pandemic and nuclear aftermaths.'
definition: 'Mixed-cause or unspecified collapses whose defining condition is traversing or enduring a devastated landscape, rather than one named catastrophic cause. Recovery may exist, but the wasteland remains the governing condition.'

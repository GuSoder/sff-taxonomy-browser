placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian futures
  > Social dystopian future > Crowded dystopias. Shafts driven into the Earth''s hot core power the world''s stations, and
  that energy alone keeps the food factories running for a hungry, overpopulated planet, but the power broadcasts make the
  human race unable to stay awake; astronaut Rafe Arnoul Harald, immune to the compulsion, is one of six training on the Moon
  for the first star voyage (ISFDB title 3746, synopsis). A planet whose population depends on a fragile system to survive
  is the pressure that breaks society, which is the leaf''s definition. Rejected: Post-pandemic and other survival leaves
  (the society still runs, asleep), Space-faring leaves (the star voyage is the frame, not the story), Utopian branches. Wobble:
  moderate; the overpopulation is the premise and the sleeping-broadcast plot is the main strand, so Crowded dystopias fits
  the premise more than the plot. Year is the 1971 first edition (the queue showed 2018).'

definition: Cli-fi dystopia in which coercive political rule works through control, rationing and criminalization of climate-scarce
  necessities. Not Climate class divide, where enclave privilege and market capture govern; not Climate displacement, where
  uprooting or exile governs; not Climate breakdown, where accelerating ecological and institutional collapse governs. Climate-resource
  tyranny, rather than generic state surveillance or belief control, is the engine. Seeded by Memory of Water under curator
  approval phonemsg-01M4AXGXZAMQTV3PJXV9D6C8N2 (2026-10-07).
status: accepted

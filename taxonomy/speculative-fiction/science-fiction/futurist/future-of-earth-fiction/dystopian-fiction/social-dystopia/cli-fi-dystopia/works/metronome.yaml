placement_rationale: Aina and Whitney had a child without state permission and serve 12 years' exile on a northern island croft, tethered by a pill clock against
  toxic spores from melting permafrost; on parole day the Warden doesn't come (Guardian x2). Climate collapse and scarcity sit behind the birth licensing and the
  croft exile - the dystopia runs on a broken climate. Clarke 2023 shortlist. Placed by Gustav's 2026-09-24 14:15 ruling ('Ok, execute').

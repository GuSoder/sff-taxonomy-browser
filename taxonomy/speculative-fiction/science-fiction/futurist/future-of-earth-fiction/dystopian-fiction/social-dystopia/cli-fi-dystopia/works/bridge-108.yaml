placement_rationale: The author's official cover reveal places the novel in late-21st-century climate-ravaged Europe, where drought and wildfire drive migration and a separated boy is trafficked into slavery in a locked-down, oppressive England. SFE calls the journey grotesque and situates it in Charnock's dystopian near-future Britain. Climate displacement creates the coercive social order, making Cli-fi dystopia closest.

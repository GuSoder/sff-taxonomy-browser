placement_rationale: 'Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction ->
  Social dystopian future -> Cli-fi dystopia. SFE says climate change enabled a tyranny separating wealthy Uplanders
  from threatened slums; Erewhon centers a climate-controlled biodome, rising seas, unbreathable air and deadly
  superbugs. Orwellian and Techno Fiction are rejected because algorithmic rule and cyborg tools serve climate-stratified
  collapse.'

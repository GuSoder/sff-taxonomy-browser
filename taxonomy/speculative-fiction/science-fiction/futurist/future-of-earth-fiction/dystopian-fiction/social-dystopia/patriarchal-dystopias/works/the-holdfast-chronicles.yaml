placement_rationale: 'SFE (Charnas): Holdfast is ''a misogynist Dystopia'' on a post-holocaust Ruined Earth, where the ruling males treat women (''Fems'') as scapegoats
  for the Wasting, with breeding as an act of disgust and the dominance of elder males. The four Holdfast Chronicles examine gender relations under and after that
  rule (The Conqueror''s Child won the Tiptree Award). Placed by Gustav 2026-09-23 17:43.'

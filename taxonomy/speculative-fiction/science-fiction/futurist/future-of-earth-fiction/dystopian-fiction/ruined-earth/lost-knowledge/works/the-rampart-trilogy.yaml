placement_rationale: 'Root-down: Science fiction -> Futurist -> Future of Earth -> Dystopian fiction -> Ruined Earth. SFE sets the complete sequence in
  a far-future, balkanized Earth long after a civilization-ending Holocaust, where buried technology is treated as magic and an ancient AI aids an exile.
  Hachette grounds deadly engineered forests, isolated successor villages and a journey toward the lost technology of London. The catastrophe is remote
  history and its relics structure successor societies, so Ruined Earth beats Post-Holocaust Survival.'

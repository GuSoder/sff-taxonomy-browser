placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian fiction
  > Ruined Earth > Lost knowledge. Per Publishers Weekly: guilds of Salvationists raid the buried high-tech treasures of the
  fallen Tarakan civilization, and the Puzzler is the one who can open its cyber-locked nodes; the plot is a hunt for a puzzler
  lost in the labyrinth of the City within the Mountain. A successor society recovering, selling and fearing the old world''s
  technology is the Lost knowledge definition (relic science and its dangerous return). Rejected: Wild ruins (the people do
  not live wild among the ruins; they run guilds and auctions), Big dumb relics and Alien delving (the ruins are human, not
  alien, and the setting is a ruined Earth, not space opera). Wobble: the dungeon-crawl structure reads like Fantasy-style
  delving; the leaf fits because the treasure is lost technology. Series opener (The Tarakan Chronicles, book 1); only this
  volume is in the queue. Year is the Harper Voyager first edition per Open Library (2019); the queue has no year.'

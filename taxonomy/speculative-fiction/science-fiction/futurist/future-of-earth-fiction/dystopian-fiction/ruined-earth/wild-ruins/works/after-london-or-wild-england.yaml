placement_rationale: SFE calls this an early Scientific Romance and Ruined Earth tale, with England reverted to wilderness and barbarism after an unspecified
  disaster and a great inland lake over polluted London. Hachette likewise calls it early post-apocalyptic fiction. The successor society living amid transformed
  ruins makes Ruined Earth closest.

placement_rationale: >-
  Root-down: Kirkus identifies a future in which only shreds of the old world's technology remain; PRH follows a tyrant's drug-dependent army and armored fleet across the Bullet Seas through a complete three-volume rebellion. With no grounded magic, this passes Science fiction -> Futurist -> Future of Earth -> Dystopian fiction; a successor maritime society built from lost technological remnants makes Ruined Earth closer than active-catastrophe survival.

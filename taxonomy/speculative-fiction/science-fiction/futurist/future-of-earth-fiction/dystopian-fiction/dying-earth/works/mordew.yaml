placement_status: accepted
placement_rationale: 'SFE: Mordew initiates the Cities of the Weft sequence and "with
  gonzo Equipoisal flare unpacks a Steampunk-ish fantasy tale within an obscurely
  iterated but manifestly Far Future Dying Earth frame"; the Edificial city draws
  substance from the dead god it is built on, with hints of Genetic Engineering in
  the deep past. The leaf holds far-future tales where magic and science meld; SFE
  explicitly evokes leaf-mate Viriconium. Vetoable.'

canonical_genre: secluded-utopias
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Secluded Utopias.
  SFE: as close to a traditional Utopia as American genre SF had come; PRH presents Ledom''s genderless, post-scarcity society; the plot reveals Ledom''s
  hiding place cut off from the wider world, and that separation keeps the utopia going.'

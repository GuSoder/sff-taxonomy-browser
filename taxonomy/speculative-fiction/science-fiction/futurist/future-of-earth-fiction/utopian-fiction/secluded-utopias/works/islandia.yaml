first_published: 1942
canonical_genre: secluded-utopias
placement_status: accepted
placement_rationale: >-
  SFE describes Islandia as a densely imagined utopian culture on a great island near Antarctica, separated from and scathingly critical of business-oriented modernity. Its social ideal depends on geographical and cultural separation from the wider contemporary world, making Secluded Utopias the closest existing leaf.

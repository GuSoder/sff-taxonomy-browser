placement_rationale: 'L. E. Modesitt''s Haze (2009; Kirkus, Modesitt''s site; with the omnibus Haze and The Hammer of Darkness
  2016, folded): Major Keir Roget, a security agent of the repressive Chinese-dominated Federation, penetrates the veiling
  clouds of planet Haze, where he finds an ecologically harmonious Thomist (skeptic) culture, called Dubiety by the locals,
  that stresses education and truth and whose science resembles time travel and teleportation; alternating chapters show an
  earlier mission among the Saints of Utah. Walk: Futurist > Future of Earth > Utopian fiction > Secluded utopias (a protected
  community whose ideals depend on separation). Alternative: Space dystopias (the Federation) - at 9. Sources: Kirkus, Modesitt''s
  site; not read. The omnibus row also contains The Hammer of Darkness, which is held separately.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Secluded Utopias. Reviews identify Sumer as a designed, ambiguous utopia/dystopia enclosed for two thousand years by an impassable wall, with population, class, marriage and law organized around isolation. Locus notes advanced Builder technology beneath the fantasy surface; HarperCollins confirms The Horizon finishes the two-book story begun in The Wall. The deliberately bounded alternative society and the testing of its ideals govern.'

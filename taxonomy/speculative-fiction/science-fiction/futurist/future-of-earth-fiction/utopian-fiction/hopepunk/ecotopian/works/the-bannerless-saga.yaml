placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Hopepunk -> Ecotopian. Publisher descriptions place both mysteries a century after environmental and economic collapse in the Coast Road’s rebuilt, cooperative civilization, where households ration resources and reproduction to sustain community. The books test this ecological social compact through murder, prejudice and investigation while preserving hope and collective responsibility.'

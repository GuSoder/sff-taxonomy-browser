placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Satirical Utopia.
  SFE treats More''s book as the founding rationally designed utopia and stresses its satire and unstable advocacy. Same-period imagined societies already
  sit on this leaf (Gargantua and Pantagruel 1532, Erewhon), so the contemporary island setting does not block the path. Reopened from the #956 hold on
  that precedent.'

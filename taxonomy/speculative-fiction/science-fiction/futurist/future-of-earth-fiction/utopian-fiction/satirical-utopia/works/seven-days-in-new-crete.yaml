id: seven-days-in-new-crete
title: Seven Days in New Crete
authors: [Robert Graves]
first_published: 1949
canonical_genre: satirical-utopia
placement_status: accepted
placement_rationale: 'Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Satirical Utopia. SFE calls it a Utopian Scientific Romance in a post-World War Three future: the poet-magicians’ apparently ideal New Crete is deliberately destabilized to expose its sterile timelessness. Literal goddess and poet-magicians are real within the book, but its constructed future society and ambivalent utopian test are the organizing engine.'

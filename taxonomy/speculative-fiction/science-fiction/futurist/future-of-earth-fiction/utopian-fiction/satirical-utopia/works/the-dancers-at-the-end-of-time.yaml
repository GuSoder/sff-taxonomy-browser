id: the-dancers-at-the-end-of-time
title: The Dancers at the End of Time
authors: [Michael Moorcock]
first_published: 1972
last_published: 1976
canonical_genre: satirical-utopia
placement_status: accepted
placement_rationale: >-
  Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Satirical Utopia. SFE describes godlike far-future humans seeking diversion from limitless existence, with a tone from extravagant satire to sentimentality; Gollancz calls the decaying society a place where anything is possible and morality meaningless, built as sharp fin-de-siècle satire. Its post-scarcity social design is used to test morality, love, boredom and decadence, making Satirical Utopia closer than Future history, which requires a sustained historical course.

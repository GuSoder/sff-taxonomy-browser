placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future history of Earth. Penguin and Serpell trace three Zambian families and the nation from 1904 through the present and beyond into Afronauts, microdrones, viral vaccines, embedded Beads and state surveillance. The sustained course of Earthbound society across generations governs.'

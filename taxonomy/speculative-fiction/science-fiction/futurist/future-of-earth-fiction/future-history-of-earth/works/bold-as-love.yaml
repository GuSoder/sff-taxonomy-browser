placement_status: accepted
placement_rationale: SFE identifies a five-novel near-future sequence that combines science-fiction and fantasy tropes into an asserted science-fiction base, with rock music integral to the blend. Hachette follows the former United Kingdom through political dissolution, environmental collapse, unstable governments and the continuing rule of its rock-star triumvirate. The linked novels trace a sustained future course of Earthbound society rather than one isolated disaster, making Future history of Earth closest.

id: the-walking-shadow
title: The Walking Shadow
authors:
- Brian Stableford
first_published: 1979
canonical_genre: future-history-of-earth
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future history of Earth. Hachette follows Paul Heisenberg and later followers by spontaneous temporal leaps from a devastated near future through alien reshaping, transformed humanity and a billion-year Gaean endpoint. SFE calls it a Stapledonian epic and identifies its third-phase organism as Earthly evolution’s far-future endpoint. The sustained course and transformation of Earth and Earth-descended life govern over the individual jump mechanism.'

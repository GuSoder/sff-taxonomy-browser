id: journey-beyond-tomorrow
title: Journey Beyond Tomorrow
authors:
- Robert Sheckley
first_published: 1962
canonical_genre: future-history-of-earth
placement_status: accepted
placement_rationale: >-
  SFE describes a near-future innocent's satirical journey through war-obsessed America, framed a millennium later as garbled founding myths that explain the ruined Earth around his Pacific island. The long retrospective construction of Earth's history, rather than any single catastrophe episode, makes Future history of Earth closest.

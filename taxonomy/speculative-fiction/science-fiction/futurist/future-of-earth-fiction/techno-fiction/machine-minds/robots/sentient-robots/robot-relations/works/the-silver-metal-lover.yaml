placement_rationale: 'Tanith Lee''s The Silver Metal Lover (DAW, 1981; Wikipedia), first of the S.I.L.V.E.R. books, with the
  sequel Metallic Love (2005) folded in: in a far future of few jobs and a thin universal income, the lonely sixteen-year-old
  Jane, dominated by her rich mother, falls in love with Silver, a companion robot musician made by Electronic Metals, buys
  him out of deconstruction, runs away to live with him, and loses him to a recall, after which his ''soul'' reaches her through
  the electronics around her. Walk: Science fiction > Futurist > Future of Earth > Techno fiction > Machine minds > Robots
  > Sentient robots > Robot relations (the bond between a robot and the people around it is the story). Tried: Androids (Silver
  is first taken for human, but the book is not about detection) and Being robot (told by Jane, not from inside the machine).
  Wobble: Being robot, since Silver''s growing humanity is half the book. Source: Wikipedia.'

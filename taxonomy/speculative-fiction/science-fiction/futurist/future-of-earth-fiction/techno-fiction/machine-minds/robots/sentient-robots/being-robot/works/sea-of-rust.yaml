placement_rationale: 'C. Robert Cargill''s Sea of Rust and its prequel Day Zero: the machines have won and humanity is gone,
  and the books follow robots, the scavenger Brittle in the wasteland and the nanny robot Pounce at the revolution''s first
  day, working out what they are and what they will do. One shared robot-uprising world, told from inside the machines. Walked

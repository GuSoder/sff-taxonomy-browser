placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Machine minds > Robots > Sentient robots > Robot relations. Near-future Appalachia, primarily 2056-2062; nonlinear flashbacks
  are narration, not time travel. Sentient embodied workers, caregivers and enforcers collide with human dependence, prejudice
  and restrictive programming. DAW centers the farmers and their hired androids, the agents and Ora; Locus identifies the
  human agents as the main focus; Lightspeed calls the engine intimate relationships, not global war. Machine personhood is
  load-bearing, not merely generic future sociology. Androids fails the passing/detection test despite the publisher noun;
  AI fails embodiment. Ora and worker inner-life chapters are real, but the whole novel turns on human-machine ties rather
  than one robot working out its selfhood, selecting Robot relations over Being robot. The militia raids do not make Future
  war the governing engine. One published 2024 novel; no separate series volume found.'

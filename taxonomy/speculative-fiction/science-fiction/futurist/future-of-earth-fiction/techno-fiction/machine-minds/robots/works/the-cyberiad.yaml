placement_rationale: 'Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Robots and AI. SFE identifies Lem''s Trurl-Klapaucius
  cycle as robotic fables and says The Cyberiad''s robot philosophy is central; Penguin follows the two ingenious machine constructors through a medieval-seeming
  universe of absurd inventions and oppressive kings. Philosophical satire is the mode, while machine societies, minds and constructions supply the sustained
  subject.'

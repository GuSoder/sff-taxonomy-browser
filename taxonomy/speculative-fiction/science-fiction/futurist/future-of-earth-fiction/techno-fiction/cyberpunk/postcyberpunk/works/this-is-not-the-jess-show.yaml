canonical_genre: postcyberpunk
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Cyberpunk
  -> Postcyberpunk. Quirk/PRH reveal that Jess’s apparent 1998 life is a corporate reality-show set inside 2037; the complete duology follows
  her fight against the media empire, surveillance, manufactured relationships and device-mediated exploitation. Pervasive near-future systems
  and institutional power govern without classic cyberpunk noir.'

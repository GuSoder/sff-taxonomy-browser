placement_rationale: 'A near-now corporate VR venture hires Girlie, a Filipina social-media moderator, to police immersive historical worlds; its photorealistic haptics,
  therapeutic use and potential for behavioral manipulation make the networked platform and its human labor the novel''s SF engine, even as romance stays foregrounded.
  Terms of Service fits lives worked from inside the corporate platform and its control over users and moderators rather than the VR venue alone (Metaverse). Locus
  explicitly says the SF is not tangential. Curator ruling: ''Execute'' on the proposed placement, phonemsg-01M3PQJVX19DCGAPPDRBAPK689 (2026-09-29).'

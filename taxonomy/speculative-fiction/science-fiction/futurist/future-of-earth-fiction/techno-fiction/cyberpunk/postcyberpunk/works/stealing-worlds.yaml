first_published: 2019
canonical_genre: postcyberpunk
placement_status: accepted
placement_rationale: >-
  Root-down: SFE and Macmillan place it in mid-21st-century America, where pervasive surveillance, smart glasses, VR/LARP worlds, blockchain economies and gamified cooperation reshape social power. It passes Science fiction -> Futurist -> Future of Earth -> Techno-fiction -> Cyberpunk; its socially embedded resistance and institution-building rather than noir alienation make Postcyberpunk closest.

canonical_genre: postcyberpunk
placement_status: accepted
placement_rationale: 'Bengaluru is now Apex City, run by Bell Corp: every citizen ranked on a productivity Bell Curve, the top 10% live Virtual, failures deported
  to the Analog outside - a mosaic of ordinary lives navigating an algorithmic caste order (PW, Fantasy Hive, Grimdark). Postcyberpunk on Person''s own criteria:
  socially embedded protagonists, near-now surveillance and institutional power, no noir alienation (''technology is society''). Gustav ruling 2026-09-24 16:13 ''Execute''
  after the tree walk (Orwellianesque rejected: last-resort leaf, algorithmic caste isn''t Orwell''s apparatus; Huxleyan rejected: control by ranking/deportation,
  not consent engineering). Clarke 2024 shortlist; first published India 2020 as Analog/Virtual.'

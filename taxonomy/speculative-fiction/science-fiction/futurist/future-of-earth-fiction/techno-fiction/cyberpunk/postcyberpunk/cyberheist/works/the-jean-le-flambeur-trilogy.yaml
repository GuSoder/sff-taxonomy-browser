placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Cyberpunk > Postcyberpunk > Cyberheist. Several centuries after a singularity, posthuman factions of brain-emulation ''gogols''
  rule the Solar System, and the legendary gentleman thief Jean le Flambeur, modeled on Arsene Lupin, is freed from a virtual
  prison to pull a job in the Martian city of the Oubliette (Wikipedia, The Quantum Thief: a heist story); The Fractal Prince
  and The Causal Angel continue the trilogy. Heists and crews working a networked order from inside it, the leaf''s definition.
  The omnibus (MC03682) and the 2026 reissue (MC03684) are editions folded here. Rejected: Copied minds (the gogols are the
  setting, the engine is the job), Space opera leaves. Wobble: moderate; the setting is a posthuman Solar System rather than
  a near-future net. Sources: Wikipedia. Years: 2010, 2012, 2014.'

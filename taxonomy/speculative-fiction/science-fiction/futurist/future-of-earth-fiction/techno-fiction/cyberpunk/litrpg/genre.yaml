definition: 'Cyberpunk in which game mechanics are the literal laws of the world: levels, stats, loot, classes and respawn govern what characters can do, and the
  numbers are part of the reading. Sibling test against Metaverse: if the point is the place, it is Metaverse; if the point is the mechanics, it is LitRPG. The term
  was coined in late 2013 in the Russian scene (EKSMO''s LitRPG series).'
status: accepted
ruling: Created by Gustav's 2026-09-23 22:16 ruling ("Execute" on LitRPG as Metaverse's sibling under Cyberpunk).

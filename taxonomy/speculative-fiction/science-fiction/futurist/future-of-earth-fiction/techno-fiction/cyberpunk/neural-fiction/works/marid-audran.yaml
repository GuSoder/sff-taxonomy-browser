placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno-fiction
  > Cyberpunk > Neural fiction. Marid Audran is a street hustler in the Budayeen, the walled red-light quarter of an Arab
  city, in a near future where brain implants decide who people are: personality ''moddies'' and skill ''daddies'' plug into
  the skull, and Marid is pressed into getting wired himself (Wikipedia, Marid Audran series; Locus). The implant at the base
  of the skull is the passage into altered selves, which is the leaf''s definition, direct-to-brain access as the central
  way in. Rejected: Postcyberpunk and its leaves (classic noir alienation, not socially embedded; no network heists or resistance),
  Metaverse (no persistent shared avatar world). Wobble: the engine is a noir detective story in an Islamic-world city, and
  the implants are a plot condition more than an altered reality the book enters; Neural fiction is the nearest cyberpunk
  leaf. Series folded as one fiction (rule 11j).'

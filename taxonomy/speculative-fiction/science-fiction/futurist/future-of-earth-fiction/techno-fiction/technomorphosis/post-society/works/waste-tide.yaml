placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis
  -> Post-society. The Verge and Kirkus set it on near-future Silicon Isle, where the e-waste trade organizes native clans, migrant ''waste people'' and
  a foreign recycling venture into class war; Mimi''s transformation is one strand of that shared order. Technology remaking a community, class system and
  landscape governs.'

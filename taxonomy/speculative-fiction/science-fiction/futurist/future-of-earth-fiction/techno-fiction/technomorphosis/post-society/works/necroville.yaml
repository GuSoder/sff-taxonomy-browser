placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Post-society. In twenty-first-century Los Angeles nanotechnology has abolished death: the resurrected
  live as indebted non-citizens in the ghetto of Necroville, and five people on the run from their pasts are drawn together
  on the yearly Night of the Dead while an army of the reborn goes to war with the living (Kirkus review of the US edition
  Terminal Cafe, 1994; Gollancz copy). Technology reorganizing a whole class and the city''s shared life is the leaf''s definition.
  Rejected: Remade bodies and Remade minds (the resurrected as a caste is the subject, not one person''s changed self), Cyberpunk
  leaves (the engine is nano-resurrection, not networks), Cloning fiction (modern day). Wobble: moderate; it is an ensemble
  story of five lives, and the war between living and dead is a late thread. Published in the US as Terminal Cafe (Bantam
  Spectra, 1994); the cover used is that edition''s. First published 1994. Queue id MC03930.'

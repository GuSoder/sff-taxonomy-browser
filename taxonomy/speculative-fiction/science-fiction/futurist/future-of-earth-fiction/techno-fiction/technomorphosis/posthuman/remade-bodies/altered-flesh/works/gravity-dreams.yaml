placement_rationale: 'L. E. Modesitt''s Gravity Dreams (1999; Modesitt''s site, Publishers Weekly): Tyndel, a teacher devoted
  to his anti-technology religious culture, is transformed by a rogue nanotechnology infection into a ''demon'', something
  more than human, and is exiled to a space-faring world where he becomes a physiologically enhanced star pilot. Walk: Futurist
  > Future of Earth > Techno-fiction > Technomorphosis > Posthuman > Remade bodies > Altered flesh (the story is the embodied
  transformation). Sources: Modesitt''s site, PW; not read. Alternative: Cyborgs.'

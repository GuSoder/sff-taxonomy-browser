placement_rationale: >-
  SFE identifies the two-book Borrowed Man sequence and its protagonist as a cloned, uploaded personality who is legally a library book: medium and message become identical. Tor likewise centers Smithe as the recorded personality of a dead writer, property rather than a legal human. Technology transforms personhood, embodiment and legal identity, making Posthuman exact.

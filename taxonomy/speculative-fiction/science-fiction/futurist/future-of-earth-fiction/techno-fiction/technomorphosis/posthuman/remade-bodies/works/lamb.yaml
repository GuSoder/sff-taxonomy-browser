placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of
  Earth fiction -> Techno fiction -> Technomorphosis -> Posthuman -> Remade bodies. Foundling Lamb ''develops
  far too quickly''; Maureen''s childhood ''bad copies'' are buried in the vegetable patch (Wikipedia
  plot). Tuttle (Guardian): Frankenstein-like themes of ''experiments in the creation of life'' and ''scientific
  overreach''; Thornton: ''exploration of the post-human condition''. Engineered, accelerated human life
  is the engine - remade bodies, not horror-weather.'

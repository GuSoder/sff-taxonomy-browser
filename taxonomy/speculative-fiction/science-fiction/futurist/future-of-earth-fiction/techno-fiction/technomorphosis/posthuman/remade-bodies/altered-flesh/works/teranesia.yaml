placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Posthuman > Altered flesh. Egan, 1999: in the South Moluccas a self-propagating mutation (the Sao Paulo
  protein, which a physicist on the team suspects uses quantum superposition to pick the most useful change) is remaking plants
  and animals; the narrator Prabir, scratched by a mutant shrub, carries it, grows a carapace and is metamorphosed, and his
  sister Madhusree sees that the protein is acting like a sentient thing that resists every attempt to stop it (Wikipedia
  plot; Egan''s own page; Hachette blurb). Rejected: Successor species (humanity does not become a descendant species across
  generations, one body is rebuilt), Mystery plague and the pandemic leaves (it is not a collapse, the mutation does not kill),
  Planet ecology (Earth, not an invented world), Altered-humans leaves of Genetic caste (engineered people, not a spreading
  mutation), Real-earth mystery leaves (the mystery is biological sf). Altered flesh holds Blood Music, the nearest relative:
  a cellular change that spreads, with the body of one person as the browser''s expectation. Wobble: moderate. Half the novel
  is a refugee and grief story and half an ecological mystery; Altered flesh is the honest home of the transformation, not
  of the whole book. Plot from Wikipedia, not the book. Year 1999 first publication (Open Library, Wikipedia). Queue id MC03563.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Posthuman > Remade minds > Copied minds. Most of humanity lives as software citizens in polises, running
  about 800 times faster than the fleshers; Yatima is born by ''orphanogenesis'' with no ancestor, and when a neutron-star
  collapse sends a burst of energy at Earth the citizens must save what they can and then go exploring the physics of the
  universe (Wikipedia plot summary; the story began as ''Wang''s Carpets''). Minds that are recorded, copied and live in information
  space, which is the leaf''s definition. Rejected: Space combat and other spacefaring leaves (the ships are exploration,
  not the story), World models (the later chapters explore a hyperdimensional physics, but the people, not the model, are
  the book). Wobble: strong; the second half of the book is as much a hard-SF cosmology as a story of uploaded citizens, and
  Yatima is not a copy. First published 1997.'

placement_rationale: 'Root-down: SF -> Futurist -> Future of Earth -> Techno -> Technomorphosis -> Posthuman -> Remade bodies. Cancer treatment replaces every cell
  with nanites, making nanodroid people whose bodies reproduce and change humanity across eons. Patient One disappears and returns, an AI gains a body through the
  same process, and patient-derived doubles spread. Consciousness and love are explored through embodiment and synthetic cellular replacement, not uploading minds
  to a digital world. Bodily/species transformation governs over future-history panorama or machine personhood alone. Tenth card: leaf freezes for split priority.'

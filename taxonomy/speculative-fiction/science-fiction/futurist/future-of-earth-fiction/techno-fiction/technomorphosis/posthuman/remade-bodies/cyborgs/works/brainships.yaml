placement_rationale: 'McCaffrey''s Brainship series (The Ship Who Sang 1969, with later volumes by Lackey, Stirling, Nye and
  others: The Ship Who Searched, The City Who Fought, The Ship Who Saved the Worlds, the Brain Ships omnibus, and The Ship
  Who Dared, Lackey and Giguere, book 8 in the Simon & Schuster series list): one shared universe, so one fiction. A child
  born with a crippled body is made a shell-person, her brain wired into the controls of a starship (or space station, in
  The City Who Fought) while a human partner, the brawn, travels aboard; the stories are about what that fusion of mind and
  machine is and what it costs. Walk: Science fiction > Futurist > Posthuman > Cyborgs (cybernetic redesign transforms human
  embodiment), not Robots or AI (the mind is human, not built) and not Space dash or Spaceship drama (the engine is the embodiment,
  not the voyage). Wobble low to moderate.'

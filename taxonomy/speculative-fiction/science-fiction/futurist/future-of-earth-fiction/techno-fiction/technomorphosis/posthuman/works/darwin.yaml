placement_rationale: 'SFE identifies the two-book Darwin sequence and its supercharged punctuated evolution: an endogenous retrovirus transforms Homo sapiens into a posthuman species. PRH follows the genetic outbreak into a new generation whose altered biology creates a persecuted social class under quarantine and government control. Biological change remakes bodies, identity and social organization without deliberate engineering, making Technomorphosis closer than Genetic engineering.'

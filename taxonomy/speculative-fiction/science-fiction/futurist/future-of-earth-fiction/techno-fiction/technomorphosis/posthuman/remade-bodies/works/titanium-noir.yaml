placement_rationale: 'Root-down: SF -> Futurist -> Future of Earth -> Techno fiction -> Technomorphosis -> Posthuman -> Remade bodies. T7 gene therapy repeatedly
  rejuvenates the rich while enlarging them into physically different Titans. Their altered bodies, longevity and privileged power make the murder case possible.
  Publisher explicitly says near-future; Modern day''s Genetic engineering and Technothriller fail that temporal gate. No magic, no mind upload or future-history
  panorama: bodily speciation is the novum under the noir investigation.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Posthuman > Remade minds > Rewired minds. In a future semitropical England, people are educated by viruses
  injected into the body and the world is ruled by the Consensus, a hive mind made of the mental patterns of billions of dead
  children; Milena, an actress immune to the viruses, stages an opera that brings her to it (Wikipedia; Arthur C. Clarke Award
  1990). Minds are altered in place by treatment and a network link, and the people stay the same bodies and selves, which
  is the leaf''s definition. Rejected: Copied minds (the Consensus is a gestalt, but the living people are not copied), Genetic
  caste fiction (the gene work does not rank people), Altered flesh (the bodies are not the point, the minds are). Wobble:
  the setting is also an engineered living world (houses and spaceships are grown organisms), so Altered flesh is a fair neighbour;
  the dead-children hive mind pulls toward Copied minds.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Posthuman > Remade minds > Copied minds. Paul Durham makes Copies of himself, software simulations of
  his brain and body run in virtual reality, and offers the Autoverse addict Maria Deluca a job designing a seed for a whole
  virtual biosphere (gregegan.net/PERMUTATION). A scanned mind living in information space is the leaf''s definition. Rejected:
  Rewired minds (the minds are copied, not altered in place), Hard conceptual SF (the book also builds a model of time and
  causality, but the copies are the spine). Wobble: light-moderate; the Autoverse and Dust Theory half of the book argues
  for World models or Mind models. First published 1994.'

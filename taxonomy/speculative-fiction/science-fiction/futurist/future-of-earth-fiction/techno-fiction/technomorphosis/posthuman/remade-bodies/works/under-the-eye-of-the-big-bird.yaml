first_published: 2016
canonical_genre: remade-bodies
placement_status: accepted
placement_rationale: 'Root-down: SF -> Futurist -> Future of Earth -> Techno -> Technomorphosis -> Posthuman -> Remade bodies. Engineered human descendants combine
  animal DNA, plant nutrition and accelerated breeding across fourteen far-future communities; AI Mothers and watchers attempt to jumpstart evolution against genetic
  extinction. The designed organism/species is the experiment, not mind uploading or barren childless society. Geological scope supports future history, but bodily
  redesign and what counts as humanity govern; no actual travel through time or literal magic is established.'

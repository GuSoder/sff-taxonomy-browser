placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Posthuman > Remade bodies > Cyborgs. Per Library Journal: Mat lost a limb in the army, replaced it with
  cybernetic hardware, found the hardware faster and more accurate than flesh, and replaced the rest; he is a top body-hacker
  and mercenary, and the job is protecting a woman who turns out to be more than cargo. The remade body is the premise and
  the hero''s identity, which is the Cyborgs definition (mechanical prostheses or cybernetic redesign transform human embodiment).
  Rejected: Cyberheist and the other Postcyberpunk leaves (the job is a bodyguard run, not a heist against the networked order),
  Neural fiction (the hacking is of limbs, not minds). Wobble: Postcyberpunk is the second reading. Standalone.'

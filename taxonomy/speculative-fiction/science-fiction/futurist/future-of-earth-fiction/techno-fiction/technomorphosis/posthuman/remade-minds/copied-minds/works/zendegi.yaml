placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Posthuman > Remade minds > Copied minds. Near-future Iran, brain mapping and the virtual reality ''Zendegi-ye
  Behtar'' (''a better life'' in Persian): a dying man has his mind mapped so a virtual version of him can be a father to
  his son (Wikipedia). A recorded mind and a life in information space is the leaf''s definition. Rejected: Rewired minds.
  Wobble: moderate; the book is as much about the liberalisation of Iran and near-future technology, and I read it from the
  Wikipedia summary.'

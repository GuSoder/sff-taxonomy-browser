placement_rationale: SFE calls the novel Dick's most prolonged exploration of drug-altered perception; Penguin describes Substance D splitting the user's brain into combative identities until undercover agent Fred no longer knows he is surveilling himself as Bob Arctor. The engineered drug and identity-masking surveillance system transform mind, selfhood and daily order, making Technomorphosis closest.

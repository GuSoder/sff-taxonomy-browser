placement_rationale: SFE sets the novel in a degraded near-future where people retreat into the total-immersion OASIS, a Cyberspace-style virtual reality governed by corporate technology and contested through avatars and a world-spanning game. Networked altered reality, an unpleasant social order and control of the platform make Cyberpunk the closest leaf.

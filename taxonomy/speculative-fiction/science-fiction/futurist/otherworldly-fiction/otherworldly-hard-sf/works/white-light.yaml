placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Otherworldly fiction -> Otherworldly Hard SF. SFE describes
  a mathematician gripped by Cantor''s continuum problem speeding through transreal spacetimes that reify mathematical infinities, including Hilbert''s
  Hotel. The rigorous mathematical world-model of a wholly other realm governs, as with Flatland on this leaf; there is no magic.'

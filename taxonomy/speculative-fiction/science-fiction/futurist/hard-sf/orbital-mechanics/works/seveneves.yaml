placement_rationale: 'Neal Stephenson''s Seveneves (2015; Stephenson''s excerpt, Wikipedia, Berkeley Science Review): the
  Moon shatters for no apparent reason, its fragments collide and will rain down on Earth in two years (Hard Rain), and humanity
  survives in orbit on the ISS, the Cleft and the Arks, with the plot driven by orbital dynamics, delta-v and station engineering;
  the last part follows a space-based civilisation five thousand years on. Walk: Speculative fiction > Science fiction > Futurist
  > Hard sci-fi > Orbital mechanics. Rejected: Cosmic catastrophe (the catastrophe is the setup and the clock, the book is
  spent on the orbital engineering), Spacefaring fiction (Hard sci-fi''s orbital physics governs). Wobble: low to medium;
  the Moon''s destruction is a cosmic catastrophe and the card was first placed there. Moved between existing leaves on the
  curator''s explicit decision (2026-10-12 5:35:46 PM CEST phonemsg-01M4RC2WDXD2FC8RW8WS86QTVY: "Seveneves could be Hard SF
  / Orbital Mechanics imo. Everything in that book was about orbital mechanics", confirmed 5:39:36 PM phonemsg-01M4RC9XN6P9FVRJJRQ1SPE56W).
  Sources: Stephenson''s site excerpt, Wikipedia, Berkeley Science Review; not read in full.'

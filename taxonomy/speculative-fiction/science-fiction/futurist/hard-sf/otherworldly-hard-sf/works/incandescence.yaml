placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Otherworldly hard SF. Two
  narratives in alternating chapters: two citizens of the Amalgam, a Milky Way-spanning civilisation, investigate DNA found
  on a meteor by the Aloof who hold the galactic core, and the inhabitants of a small world called the Splinter, which orbits
  a collapsed star inside its accretion disk, try to understand their environment and work out general relativity as a pre-industrial
  people (Wikipedia plot summary). Rigorous speculative world-models set in a wholly other cosmos is the leaf''s definition.
  Rejected: World models (the physics is real, the setting is the other cosmos), Copied minds (the Amalgam citizens are only
  the frame). Wobble: moderate. Related Amalgam stories exist as short fiction but are not in the queue.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard SF > Hard conceptual SF > Mind models.
  Gwyneth Jones, 1988: in a Thatcherite near-future Britain the pharmaceutical firm turned cult BREAKTHRU has a drug, Kairos,
  which lets its users directly affect the real world, with quantum theory as the stated mechanism; Otto Murray''s son Candide
  runs off with a film canister of the drug and her lover Sandy Brize, who is changed by it and in turn changes the world
  around her (sfmistressworks review of the novel; Gollancz listing). Rejected: Rewired minds and Neural fiction (a mind is
  not reprogrammed or jacked in, the drug acts on reality), Psionics (at 9, and the effect is not telepathy or psi studied
  as a science), Time tonics (no time travel), Huxleyan dystopia (the drug is not a pleasure tool), Visionary minds (the other
  world is not a vision, it is made real), Near-future dystopia leaves (Thatcher''s Britain is the backdrop, not the engine).
  Mind models holds Quarantine, where consciousness makes reality by quantum observation, the nearest relative. Wobble: moderate.
  I read a detailed review that does not cover the ending, not the book; the book is also a political and personal story set
  in 1980s Britain. Year 1988 first publication (Open Library, review); the queue''s Gollancz entry has no year. Cover is
  the SF Masterworks edition. Queue id MC03611.'

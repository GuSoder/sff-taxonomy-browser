placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Hard conceptual SF > Mind
  models. A near future, 2034 to 2080, in which an impenetrable shield called the Bubble has shut out the stars; the private
  eye Nick, running neural mods, hunts a missing woman and finds the Ensemble and the ''Eigenmod'', a mod that lets the brain
  consciously control the quantum collapse of the wave function, which may be why the Bubble exists (Wikipedia plot summary).
  Consciousness-made reality is the leaf''s definition, and the book is built on the Copenhagen reading in which consciousness
  collapses the wave function. Rejected: Rewired minds (the neural mods are the furniture, the model of consciousness is the
  point), Private-eye fantasy leaves (this is not fantasy). Wobble: moderate; it is also a detective novel
  with neural mods. First published 1992.'

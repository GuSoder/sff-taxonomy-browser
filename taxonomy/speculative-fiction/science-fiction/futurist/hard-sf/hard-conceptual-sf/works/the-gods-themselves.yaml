placement_rationale: 'Root-down: Science fiction -> Futurist -> Hard SF -> Hard conceptual SF. PRH and Hachette ground the Electron Pump as matter exchange with a parallel universe governed by different physical laws; the imbalance will drive the Sun to explode. The rigorous cross-universe energy model and its physical consequence govern over the alien-contact plot.'

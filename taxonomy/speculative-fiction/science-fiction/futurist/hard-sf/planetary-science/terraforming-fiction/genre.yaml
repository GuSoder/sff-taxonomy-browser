definition: 'Planetary science in which the world is remade: Mars, Pluto or another body changed by comets, mirrors, microbes
  or engineering so that people can live on it. The making of the planet is the story. Not Planet expedition fiction, where people
  go to a world as it is and survive or study it; not Planet ecology fiction, where a world''s own climate and life, not human
  engineering, drive the story.'

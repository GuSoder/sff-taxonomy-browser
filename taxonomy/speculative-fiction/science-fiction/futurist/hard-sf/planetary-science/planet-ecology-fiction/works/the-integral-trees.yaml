placement_rationale: 'Larry Niven''s The Integral Trees (1984, with its sequel The Smoke Ring 1987, folded; Wikipedia, PRH):
  the survivors of the crewed ship Discipline and their descendants live in a gas torus, a ring of breathable air around a
  neutron star, in free fall, among giant trees where the habitat decides how people live, eat and move. Walk: Futurist >
  Hard SF > Planetary science > Planet ecology fiction (an invented world worked out as a place whose gravity, climate and
  life shape its creatures and civilizations). Sources: Wikipedia, PRH; not read. Alternative: Orbital mechanics. The Smoke
  Ring has no queue row.'

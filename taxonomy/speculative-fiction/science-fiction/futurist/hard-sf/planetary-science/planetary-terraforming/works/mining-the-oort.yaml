placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard science fiction > Planetary science
  > Planetary terraforming. Mars can be terraformed, for a hefty price, by bombarding its surface with comets captured from
  the Oort cloud; young Martian Dekker DeWoe longs to become an Oort miner, and the price of Earth''s help may be decades
  of near-slavery for Mars (Kirkus 1 Aug 1992; Baen blurb). The remaking of the planet is the engine. Rejected: Planetary
  expeditions (no mission to a world as it is), Colony politics (the comet project, not a settlement''s civic life, drives
  it). Wobble: it is also a didactic novel about human violence and Earth-Mars economics. First published 1992 (Del Rey);
  the queue''s 2011 date is the Baen ebook.'

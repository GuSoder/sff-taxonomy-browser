definition: 'Planetary science in which people travel to a world as it is and the planet''s geology, climate and hazards are
  the problem: a crewed Mars mission, a stranded astronaut, a solar-system tour world by world. Mission engineering and survival
  carry the story. Not Terraforming fiction, where the planet is being remade; not Planet ecology fiction, where the planet''s
  own climate and living systems are the subject.'

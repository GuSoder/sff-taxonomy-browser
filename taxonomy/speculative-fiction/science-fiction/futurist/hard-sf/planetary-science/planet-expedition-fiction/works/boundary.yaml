root_down_walk:
- node: speculative-fiction
  choice: science-fiction
  reason: A near-future scientific universe; not magic or a fantasy realm.
- node: science-fiction
  choice: futurist
  reason: The author places the initial trilogy roughly thirty years ahead of its present; Castaway continues into later space
    exploration. Not historical or atemporal; no time-travel premise.
- node: futurist
  choice: hard-sf
  reason: Author calls it hard SF and describes human-versus-universe conflicts, scientific discovery and survival. Alien
    history and first contact are discoveries inside that engine, not its sole subject; colony politics, warfare and Earth
    futures do not govern the universe.
- node: hard-sf
  choice: planetary-science
  reason: Mars, Phobos, Ceres, Europa and Lincoln supply the environments to explore and survive. Engineering enables this
    work, but the subject is not orbital mechanics alone; neither matter transmission nor a conceptual world-model defines
    it.

placement_rationale: 'The Boundary universe is hard SF of planetary exploration and survival: paleontology leads to Phobos
  and Mars, the original trilogy reaches Ceres and Europa, and the Castaway books test human survival on the alien planet
  Lincoln. Its shared engine is scientific exploration of planetary environments and the practical problems they pose, rather
  than a war, a colony society, or first contact alone. Split walk 2026-10-08 (phonemsg-01M4E20SN3DN3P17PC50ZVQD2N): Root-down:
  Speculative fiction > Science fiction > Futurist > Hard science fiction > Planetary science > Planet expedition fiction. Landis
  and Cady''s Boundary universe: paleontology leads to Phobos and Mars, the trilogy reaches Ceres and Europa, and the Castaway
  books test survival on the alien planet Lincoln. WEAK EDGE: mixed. Exploration and survival on worlds as they are carry
  it, but the series also touches settlement and an alien biosphere.'

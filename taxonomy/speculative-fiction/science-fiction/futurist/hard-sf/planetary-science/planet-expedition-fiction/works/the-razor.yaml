placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Planetary science > Planet
  expedition fiction. Marcus Flynn, an engineer framed for murder, is sentenced to the Razor, a maximum-security prison planet
  rich in xytrilium; the planet becomes catastrophically unstable, the guards evacuate and leave the convicts to die, and
  Flynn is offered a way out if he can retrieve restricted data from a quarantined research lab (Publishers Weekly review;
  Macmillan and Barnes & Noble copy). The planet''s hazards and the clock on its collapse are the problem and survival and
  mission carry the story, which is the leaf''s definition. Rejected: Space chase (no pursuit across space), Space combat
  (the fighting is a means), Hard-science planetary leaves that remake or study the world (Terraforming, Planet ecology).
  Wobble: moderate to high; it reads as a prison-break action thriller with a dying-planet backdrop, and the xytrilium plot
  is a corporate thriller thread. First published 2018 by Tor (Macmillan). Queue id MC03998.'

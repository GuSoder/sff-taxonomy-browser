placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Planetary science > Planet
  expedition fiction. Brion Brandd, winner of the planet Anvhar''s games, travels with Ihjel and the Earth scientist Dea to
  the desert planet Dis, where the ruling magter threaten suicidal war and survival depends on symbiosis, until he finds the
  brain-destroying parasite and the cobalt bombs; in Planet of No Return he and Dea go to the newly rediscovered Selm-Ill,
  full of automated war weapons that gun down anyone who approaches, to make it habitable (Wikipedia; Michael Owen Carroll''s
  Harry Harrison site). Travel to a world as it is, with its hazards as the problem, the leaf''s definition. Rejected: Alien
  infiltration and xenology leaves (the planet and its hazard are what the book is about, not a hidden species), Space adventure
  leaves (no chase or caper engine). Wobble: moderate; Planet of the Damned also turns on the Dis parasite and Cultural Relationships
  Foundation politics. Sources: Wikipedia, Carroll site. Years: 1962, 1981.'

placement_status: accepted
placement_rationale: 'Walk: Science fiction > Futurist > Hard science fiction > Planetary science. Bova''s linked near-future
  novels take the solar system a world at a time (Mercury, Venus, Jupiter, Saturn, Titan, Uranus, Neptune, Pluto), with the
  asteroid belt (Asteroid Wars: The Precipice, The Rock Rats, The Silent War) and the Moon; each book is built on the geology,
  climate and exploration of one body. Interpretation of the series boundary follows the Grand Tour universe listing (Wikipedia,
  ISFDB).'

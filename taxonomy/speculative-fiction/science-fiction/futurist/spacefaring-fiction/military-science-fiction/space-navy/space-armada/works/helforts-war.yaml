placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Space navy > Space armada. Four books in one war between the Federated Worlds and the Hammer Worlds of Kraa, following
  Michael Helfort from junior lieutenant on a scout vessel sent to rescue the prisoners of the moons of Hell (Book 1), through
  the heavy cruiser Ishaq and a Hammer prison camp (Book 2), to captain of the dreadnought squadron sent to destroy the secret
  antimatter warhead facility (Book 3) and the sailing of three frontline dreadnoughts into Commitment Planet (Book 4); PRH
  blurbs for all four. Naval war with fleets, formations and dreadnoughts is Space armada''s definition, with the state war
  fleet and its campaigns the story. Rejected: Space corvette (only Book 1 is the one small scout ship and its crew; the series
  is about the fleet war), Space combat (Helfort is a naval officer, not a soldier or pilot in the line), Space command (he
  is not directing the campaign from the top). Wobble: moderate; Book 1 leans corvette and the rest leans armada. PRH blurbs
  only.'

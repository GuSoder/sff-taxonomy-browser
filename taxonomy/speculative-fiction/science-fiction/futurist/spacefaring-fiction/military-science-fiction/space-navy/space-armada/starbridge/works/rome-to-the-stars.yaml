placement_rationale: 'S. M. Stirling and Melissa Olthoff''s Rome to the Stars (released Oct 6, 2026; Baen, smstirling.com):
  in the far future of the Rome of the ''Make the Darkness Light'' timeline (Rome never fell, time travelers brought future
  technology; see To Turn the Tide, separate card), a Roman colony world is invaded by the Gra''ak, an alliance of Fallen
  Empire barbarians; Emperor Marcus Verus Augustus Caesar sends what can be spared of the Roman Navy and Legions, and Commander
  Aquila Amphion leads the fleet and plans to carry the war to the Gra''ak homeworld. Walk: Futurist > Spacefaring > Military
  SF > Space navy > Space armada > Starbridge (one fleet campaign, relief of a colony then the counter-invasion, is the arc).
  Rejected: Star stripes (one officer''s career; here one campaign), Space corvette (a fleet), Space command (the commander
  sails with the fleet). Wobble: moderate; Aquila''s rank and duty are personal, but the book is one fleet campaign. Sources:
  Baen, smstirling.com blurbs; not read. Placed after the Space armada split on the curator''s Execute (phonemsg-01M4QHQC9DX5CWNZHN2PY168T5).'

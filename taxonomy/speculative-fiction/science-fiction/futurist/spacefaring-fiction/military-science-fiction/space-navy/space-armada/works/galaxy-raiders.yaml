placement_rationale: 'Root-down: Speculative fiction > Science fiction > Space fiction > Military science fiction > Space
  navy > Space armada. Ian Douglas: amortal humans fight the Galactic Authority, an empire of millions of civilizations ruled
  from the Galactic Core by its principal Mind (Abyss, HarperCollins and Harper Library Book Club blurbs); in Battlestorm
  Admiral Alexandra Morrigan leads an expeditionary fleet into the galactic frontier after three years of deep-space combat
  that has devastated Earth. The war fleet and its admiral''s campaigns carry the story, the leaf''s definition. Rejected:
  Space corvette (a fleet, not one ship), Alien conquest fiction (the war is fought in space, not over an occupied Earth),
  Space command (the leaf is for the top-down view of the war, while the books follow fleet action). Wobble: moderate; the
  blurbs stress the alien Mind and the galactic empire as much as the fleet. Years: Abyss February 4, 2025 (HarperCollins
  on-sale date), Battlestorm May 5, 2026 (Harper Library Book Club on-sale date; Apple Books agrees). Queue ids MC03905, MC03906.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science fiction > Space navy > Space armada.
  Admiral Koenig commands the kilometre-long star carrier America and the Confederation fleet against the Sh''daar, an alien
  coalition set on stopping humanity''s technological transcendence by annihilation; across nine novels the carrier groups,
  task forces and fleet campaigns are the story (HarperCollins listing for Earth Strike; FictionDB series order). Rejected:
  Ground-pounders (the Marines trilogies are separate cards), Space command (the view is the carrier fleet in battle, not
  the headquarters), Space corvette (capital-ship fleets, not small craft). Wobble: moderate; the late books (Deep Time, Dark
  Mind, Bright Light, Stargods) widen into time travel and cosmic transcendence, though fleet war stays the spine. Sources:
  harpercollins.co.nz Earth Strike page, kobo.com series listing, fictiondb.com/author/ian-douglas~32928. Years from FictionDB
  first-print dates (Harper Voyager mass-market originals).'

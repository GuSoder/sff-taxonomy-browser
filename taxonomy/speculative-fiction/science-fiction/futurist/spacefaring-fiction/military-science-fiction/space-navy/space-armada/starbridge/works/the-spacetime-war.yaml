placement_rationale: 'Les Johnson''s The Spacetime War (Baen, 2021; Baen, Publishers Weekly, an author interview): in the
  22nd century, matte-black alien ships annihilate colony worlds; Capt. Winslow Price of the Commonwealth Space Navy''s HMSS
  Indefatigable and Capt. Anika Ahuja of the Indian Space Navy''s Mumbai defend Earth''s colonies, and the Mumbai vanishes
  between worlds. Walk: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science fiction
  > Space navy > Space armada > Starbridge (the war between fleets is the arc). Rejected: Space corvette (two navies'' ships
  and a fleet war, not one ship alone), Star stripes (no one officer''s climb), Space command (not run from headquarters).
  Wobble: medium, an alien-war thriller with a romance thread. Sources: Baen, PW, an interview; not read in full.'

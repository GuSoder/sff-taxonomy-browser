placement_rationale: SFE (entry lee_yoon_ha) calls the Machineries of Empire sequence an array of complex Military SF stories in a Space Opera frame, with
  equipoisal interpositions of action-fantasy figures (the undead master strategist Jedao). The plot is a Kel military campaign - formation warfare and
  the siege of the Fortress of Scattered Needles - so Military science fiction is the closest existing leaf. NPR 2021 list candidate; Locus best first novel.

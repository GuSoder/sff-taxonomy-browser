placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction
  -> Military science fiction -> Ground-pounders -> Space marine corps. David Weber and John Ringo''s Empire of Man, the Prince
  Roger series (Baen, 2001 to 2005; Wikipedia, Baen): the spoiled Prince Roger and his guard, the Bronze Battalion of the
  Empress'' Own, Imperial Marines, are marooned on the jungle planet Marduk and fight their way across it to a ship. The story
  is the Corps: squads, drill, discipline and a battalion''s loyalty carried across a hostile world. Tried: Space navy (no
  ships in the story until the end), Super space soldier (soldiers are not remade), Alien-war grunts (the enemy is a world
  and its barbarian hordes, not an alien war), Planet expedition (survival is not the planet''s science), Space opera leaves
  (the war is on foot). Wobble low. Four novels folded as one fiction (11j): March Upcountry, March to the Sea, March to the
  Stars, We Few. Years are first publication (Baen). The omnibus Empire of Man (MC02425) is skipped. Authors are Weber and
  Ringo; the queue lists Weber. Only the March Upcountry jacket is kept as the cover: Open Library''s March to the Stars and
  We Few covers are audiobook MP3 covers.'

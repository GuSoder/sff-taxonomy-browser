placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Ground-pounders > Space marine corps. Navy Corpsman Elliot ''Doc'' Carlyle serves with Bravo Company Marines,
  saving a wounded Marine and two extraterrestrial friendlies on a mining station in Bloodstar, then deploying with a recon
  team to the ocean planet Abyss Deep (Harper Voyager listings for both books; FictionDB series order). A Marine company seen
  from the inside, in the Ian Douglas Marine universe but a separate series (no shared-universe fold: the Star Corpsman books
  carry their own cast and are not part of the Heritage, Legacy and Inheritance saga). Rejected: Alien-war grunts (no sustained
  war against one enemy), Super space soldier (nobody is remade), Space combat (the corps and its squad, not the fight, is
  the frame). Wobble: moderate; the hero is a medic and the second book is an expedition mystery. Years: Bloodstar 2012, Abyss
  Deep 2013 (Harper Voyager first printings).'

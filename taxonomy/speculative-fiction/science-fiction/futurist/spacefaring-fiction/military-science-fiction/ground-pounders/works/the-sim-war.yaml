placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Ground-pounders. Humanity has fought for decades against an alien enemy that looks almost human, the Sims, and
  the books follow soldiers on the ground, beginning with marooned troops fighting for survival and salvation on a hostile
  world (HarperCollins listing; Amazon and Margins series pages; ISFDB tags military sf, aliens, telepathy). The soldier''s-eye
  war fought in the field is the leaf''s definition. Rejected: Space command (the view is the troops'', not the campaign''s
  top), Space navy (the fight is on the ground, not the bridge), Space academy (no training story). Wobble: moderate; later
  books (Dire Steps, Live Echoes) widen to politics and the home front and the source is thin on them, so the pull to Space
  command is real. Sources: HarperCollins NZ, ISFDB series 36747, Margins. Years: ISFDB lists Glory Main 2012 (self-published
  first, Harper Voyager reissue 2014). Series is five books with CHOP Line (2016) not in the queue.'

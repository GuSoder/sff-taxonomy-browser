placement_rationale: 'Drake''s Redliners (Baen, 1996; the second-edition row MC02272 is the same book): in humanity''s long
  war against the alien Kalendru, Major Arthur Farrell and the burnt-out veterans of Strike Force Company C41 are ''redlined'',
  too dangerous for civilian life, and are given a last mission guarding involuntary colonists on a death world (Baen, TV
  Tropes, ISFDB). Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Military science fiction -> Ground-pounders
  (the soldier''s-eye war) -> Alien-war grunts, a grim war against an alien enemy told from the foot soldiers. Rejected: Super
  space soldier (they are not remade, they are used up) and Space marine corps (no Corps tradition). Wobble moderate: the
  second half is a colony survival on a death world rather than the war itself.'

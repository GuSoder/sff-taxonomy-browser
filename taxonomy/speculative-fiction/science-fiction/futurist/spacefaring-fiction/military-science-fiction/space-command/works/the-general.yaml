placement_status: accepted
placement_rationale: 'Source-read root-down: Speculative fiction -> Science fiction (supercomputers, downloaded minds and
  a collapsed human interstellar civilization, not actual magic) -> Futurist (a continuing human colonial future whose technological
  collapse and reconstruction are explicit; its nineteenth-century weapons do not make it Earth history or a timeless fantasy
  cosmos) -> Spacefaring fiction (campaigns on former interstellar colony worlds restore a star-faring federation; not Earth
  futures, alien cultures or hard-science demonstration) -> Military science fiction -> Space command. Raj Whitehall, then
  the leaders advised by Raj and Center, direct planetary campaigns and political-military reconstruction from command. The
  author says the series was plotted to demonstrate Belisarius''s indirect approach; SFE calls it a military series, and Reactor
  stresses strategy, tactics, logistics and campaigns. Not Ground-pounders'' rank-and-file perspective, Space academy''s training
  or Space navy''s ship crews. Ozymandian tech and Lost-colony planetary romance are tested and rejected: ancient machines
  are worshipped, but the nineteen-century gunpowder military society and command campaigns, not a fantasy-surface adventure,
  govern the whole universe. The later computer-god confrontation retains military restoration. One shared universe, ten original
  published novels; omnibus reprints excluded. Not the distinct Belisarius series despite a Publishers Weekly attribution
  error.'

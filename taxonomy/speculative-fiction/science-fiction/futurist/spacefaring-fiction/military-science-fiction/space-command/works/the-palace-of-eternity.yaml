placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Military science fiction. Hachette/Orion centers a losing interstellar war against the Syccans, military high command converting refuge-world Mnemosyne into a colony, and veteran Mack Taverner choosing between brutal occupation and resistance. Identity and transcendence deepen the conflict, but military coercion and war govern.'

placement_rationale: 'Drake''s Northworld trilogy (Northworld 1990, Vengeance 1991, Justice 1992; the queue lists only the
  omnibus Northworld Trilogy, two editions, rows MC02263 and MC02264, so the three novels are placed from it as one fiction):
  in a future where the Consensus rules everything but the missing planet Northworld, Security Forces Commissioner Nils Hansen
  is sent in after three failed missions, to a space-time enigma of eight warring planes built on Norse myth, where armored
  men rule as gods and the Matrix bridges space and time (Wikipedia, Worlds Without End, david-drake.com). Root-down: Science
  fiction -> Futurist -> Spacefaring fiction -> Space opera -> New space opera -> Alien delving -> Big dumb objects -> Big
  dumb worlds: an immense artificial world entered, crossed and lived in, the object is the setting; not Big dumb relics (nothing
  is dug up or deciphered). Rejected: Ozymandian tech (the tech is not a buried ruin) and Hard science fantasy (the Matrix
  is faster-than-light). Wobble moderate: the Norse-myth frame and the military register pull toward Science fantasy.'

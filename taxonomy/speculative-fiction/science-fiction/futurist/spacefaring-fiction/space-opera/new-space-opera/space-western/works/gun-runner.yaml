placement_rationale: 'Larry Correia and John D. Brown''s Gun Runner (Baen, 2021-02-02; Baen blurb): Jackson Rook, once a war
  hero who piloted an exosuit mech for the rebellion against the Collectivists, is now a smuggler aboard the supply vehicle
  Tar Heel; his latest job is to steal a top-of-the-line mech, the Citadel, and deliver it to the hostile planet Swindle for
  a client known as the Warlord, and when the Warlord starts running roughshod over the people of Swindle, Rook turns on the
  job. Walk: Science fiction > Futurist > Spacefaring > Space opera > New space opera > Space adventure > Space western (smugglers
  and a misfit crew making a living past the law''s reach, a rim planet under a warlord). Tried: Space caper (the theft is
  the opening job, the story is the fight on Swindle, not the scheme) and Rebel space opera (the revolt is backstory). Wobble:
  Space caper is the alternative leaf; I read the publisher blurb and an author post, not the text.'

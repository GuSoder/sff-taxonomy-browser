placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space soap opera > Spaceship drama. The Grand Abeona Hotel is a luxury resort starship on a perpetual tour
  of the galaxy, and the story follows the staff (manager Carl, chief technician Sasha, new hire Daphne) and guests, with
  the hotel''s mysteries running underneath (Publishers Weekly review, ISBN 978-0-7564-1930-1, ''cozy and compulsively readable'').
  Intimate character drama among a close spacefaring community, care and found family over conquest, which is the leaf''s
  definition and its ''cozy space opera'' alias. Rejected: Space combat, Comic space fiction (the tone is warm, not comic).
  Wobble: light; PW review and publisher blurb only. First published 2024 (UK); DAW US edition 2025.'

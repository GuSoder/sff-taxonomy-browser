placement_rationale: 'Amie Kaufman and Meagan Spooner, Starbound (These Broken Stars 2013, Their Fractured Light 2015; the
  author''s site, Penguin Random House, Booklist): in the first book the luxury liner Icarus is pulled out of hyperspace and
  crashes on a planet, stranding the heiress Lilac LaRoux and the soldier Tarver Merendsen; the third pairs the hacker Gideon
  with the con artist Sofia Quinn on two sides of a bloody war. Each book is built on a pair of star-crossed lovers against
  interstellar stakes. Walk: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New space
  opera > Space soap opera > Space romance (the relationship is the spine). Rejected: Spaceship drama (the romance, not the
  crew, drives the book), Planet expedition fiction (survival is the setting). Wobble: low-medium. Sources: author site, PRH
  series page, Booklist.'

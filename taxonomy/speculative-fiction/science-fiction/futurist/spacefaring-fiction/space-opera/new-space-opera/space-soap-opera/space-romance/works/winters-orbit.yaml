placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space soap opera > Space romance. Two Tor novels set in the same Iskat universe (Tor describes Ocean''s Echo
  as a stand-alone in the same universe as Winter''s Orbit), so one shared-universe fiction (rule 11j). Both are forced-bond
  romances inside an interstellar order: in Winter''s Orbit an emperor orders Prince Kiem to marry his dead cousin''s widower
  Jainan, and the marriage and the murder inquiry are the plot; in Ocean''s Echo the military forces a mind-reader and an
  Architect into a permanent mental bond and a salvage mission. The relationship is the spine and the empire''s rules decide
  who can be together, which is the Space romance definition. Rejected: Interstellar court politics (the court is the stage;
  the marriage is the story; the leaf''s works are about statecraft), Spaceship drama (no found-family crew), Alien delving
  and Wreck delving (the salvage in Ocean''s Echo is the vehicle, not the engine), Space succession opera. Wobble: Winter''s
  Orbit carries a murder-mystery plot and court politics, so Interstellar court politics is the second-closest. The Sneak
  Peek editions are excerpts, not books.'

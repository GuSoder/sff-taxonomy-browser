placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space soap opera > Spaceship drama. Per the author''s page: Ship Leader Parnell Shi-Sawahla and the crew of
  the corvette Sassafras ride sentient, starfaring mountain ranges called Massifs to new systems, fight the enemy and repeat,
  until the questions behind the war push the tight-knit crew to talk to the Massif avatars and find answers to save the future
  of humanity (billed as sentient starships, galactic warfare and the bonds a crew forms far from Earth). The crew and their
  bonds carry the story, which is the Spaceship drama definition. Rejected: Space combat and Ground-pounders (the war is the
  setting, not the engine), Space command (a small crew, not a command view), Alien-fiction leaves (the Massifs are the ships,
  not an observed alien society). Wobble: it is billed as military sci-fi, and the diplomacy-over-conquest note on the leaf
  fits only the second half. Published 8 September 2026.'

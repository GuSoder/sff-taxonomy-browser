placement_rationale: 'Root-down: Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Space soap opera -> Space romance. Alien commoner Joy and
  royal Felix share an implanted mind-bond from birth; a class-divided friends-to-lovers romance governs their fugitive flight to present-day Earth after a royal
  assassination. BCCB and Dark Dispatch call romance the heart; chase and court intrigue supply stakes. Shared-universe standalone, not a series merge. Curator original
  iMessage 2026-09-30 10:56:19: "make an umbrella Space soap opera for both Spaceship drama and Space romance", answering The Kindred placement serve.'

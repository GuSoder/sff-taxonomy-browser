placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Political space opera > Interstellar court politics. Per the author''s page and Wikipedia: Khemri, a superhuman,
  immortal Prince of a galactic empire ruled by an aristocracy of telepathic Princes, learns that his greatest danger is other
  Princes, each wanting to be Emperor and willing to kill or sideline rivals; he is drawn into the empire''s hidden workings
  and a secret mission, and meets Raine, who challenges his view of the empire. The story is elite rivalry and personal networks
  inside an imperial order, which is the Interstellar court politics definition. Rejected: Space academy (his training is
  over before the book starts; the Navy stint is a stop on the way), Revolutionary space opera (he questions the empire but
  the book is not a liberation struggle), Cyborgs (augmentation is background). Wobble: a coming-of-age and a Navy enlistment
  run through the middle, and the end turns toward leaving the empire. Published 2011 (Allen & Unwin/Scholastic Australia),
  US and UK editions 2012.'

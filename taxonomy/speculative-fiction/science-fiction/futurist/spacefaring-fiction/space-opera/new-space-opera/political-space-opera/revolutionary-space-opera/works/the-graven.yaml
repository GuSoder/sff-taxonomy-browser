placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Political space opera > Revolutionary space opera. Space opera on every source (SFE: Graven sequence of Space
  Operas; Publishers Weekly; Winter Is Coming), a post-1980s title, so New not Classic or Retro. Engine across the trilogy
  is dismantling a ruling order: Caiden''s revenge in book one is infiltrating and destroying the slavers'' regime from inside,
  then crew and multiverse resist the Dynast Prime''s drive to merge the multiverse into one. Rejected: Spaceship drama (found-family
  crew is real, but the books are war and revenge, not care and diplomacy); Space chase (no hunted fugitive or bounty trail
  as engine); Space combat (not soldiers or mercenaries); Space western (no frontier lawlessness register); Alien delving
  (no delving into alien things as engine); Otherworldly fiction (the bubble multiverse is the setting, not the engine; only
  a hard-SF leaf exists there). Three novels of one trilogy and one universe, so one fiction: Nophek Gloss 2020, Azura Ghost
  2022, Ethera Grave 2023.'

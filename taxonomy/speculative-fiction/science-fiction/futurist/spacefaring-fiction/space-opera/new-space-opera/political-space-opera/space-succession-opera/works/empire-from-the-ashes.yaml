placement_rationale: 'Weber''s Dahak trilogy (Mutineers'' Moon 1991, Armageddon Inheritance 1994, Heirs of Empire 1996; the
  omnibus Empire from the Ashes, 2003): one series, so one fiction. Colin MacIntyre is drafted by Dahak, the self-aware Imperial
  battleship hidden under the Moon, to lead the fight against an ancient enemy returning to the galaxy; he defeats the old
  mutineers, mobilises Earth, and then resurrects the fallen galactic empire with himself as Emperor, which makes him and
  his heirs the target of plots (Simon & Schuster blurb for Empire from the Ashes; Weber''s own bio calls the Dahak saga a
  science fiction and fantasy hybrid). Walk: Science fiction > Futurist > Spacefaring > Space opera > New space opera > Political
  space opera > Space succession opera (the succession of orders after imperial collapse: an Imperial order lies in ruins
  and is rebuilt). Rejected: Space armada (the one ship and a war fleet are means, not the engine), Space combat (the fight
  is not the engine; the empire is), Rebel and Insurgent space opera (the hero builds the throne rather than revolts against
  it), Alien conquest (the aliens are an ancient menace, not an occupation). Wobble moderate: the first book is an Earth-and-Moon
  war story, and the alien-menace strand is big. I read the publisher blurb, not the books. Years: first publication 1991-1996
  from Open Library for the first book; queue years 1994 and 2003 are reissues. Queue ids MC02447, MC02424.'

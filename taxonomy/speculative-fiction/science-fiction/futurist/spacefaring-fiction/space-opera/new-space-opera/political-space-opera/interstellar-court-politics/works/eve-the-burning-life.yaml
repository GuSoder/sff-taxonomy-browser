placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Political space opera > Interstellar court politics. Placed on the curator''s ruling (phonemsg-01M4GEZ4J8QZ5V0YRWW96CKNC5,
  2026-10-09 3:52 PM) after the walk of Space adventure (scheme, pursuit, fight: none fits) and the political branch. Drem,
  sole survivor of a capsuleer attack on his pirate mining colony, puts a price on the capsuleer''s head and, with two companions,
  travels across several pirate nations currying favor with wealthy and influential leaders to build his scheme of vengeance;
  Ralea, a mission agent, flees vice and white-collar crime, and her redemption arc is intertwined with his through the Sisters
  of EVE (Gaming Nexus review 2010-05-17; Hachette publisher copy). Wobble: moderate to high. The politicking is the means
  and the subject is personal revenge and redemption; the evidence is the publisher copy and two reviews only, with no full
  synopsis online. Rejected: Space chase (nobody flees or is tracked), Space caper (no heist or con), Revolutionary space
  opera (no order is overthrown), Space colony politics (the colony is destroyed on page one). EVE Online tie-in novel; Gollancz,
  2010 first edition. Queue id MC03840.'

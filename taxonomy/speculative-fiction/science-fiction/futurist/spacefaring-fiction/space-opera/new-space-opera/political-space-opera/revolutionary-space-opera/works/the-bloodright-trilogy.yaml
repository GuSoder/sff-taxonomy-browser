placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Political space opera > Revolutionary space opera. One trilogy (The Bloodright Trilogy per Penguin Random
  House and ISFDB), one fiction. Per PRH and Publishers Weekly: the Umber Empire conquers the Archon Empire, an Archonian
  orphan becomes an Imperial Academy pilot, his best friend is secretly the empire''s heir, and the story is the rebellion
  against the throne and the two young princes on opposite sides of the war. Overthrow of, or liberation from, an imperial
  order is the Revolutionary space opera definition. Rejected: Space succession opera (that leaf is about orders after imperial
  collapse, not heirs), Interstellar court politics (the war and rebellion drive it, not court networks), Space combat. Wobble:
  the first book is a romance-and-academy story and the third is a dynastic finale, so Space romance is a near miss. Years
  follow ISFDB (2020, 2021, 2022), not the queue''s 2021 and 2022 dates for the first and third.'

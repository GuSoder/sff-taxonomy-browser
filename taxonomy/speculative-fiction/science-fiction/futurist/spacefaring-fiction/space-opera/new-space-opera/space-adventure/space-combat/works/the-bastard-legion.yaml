placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space adventure > Space combat. Miska Corbin hijacks the prison ship Hangman''s Daughter, stocked with 6,000
  frozen convicts rehabilitated in shared VR, and turns them into a Dirty Dozen mercenary force that fights for hire (Gollancz
  blurb, SFcrowsnest review, SFE: ''Dirty Dozen cadre of prisoners... demanding mercenaries''). Rejected: Space caper (the
  first book''s theft sets up the force but the series runs on fighting), Ground-pounders (not a soldier''s-eye army, a mercenary
  crew in a prison ship). Wobble: Space caper. Three volumes folded as one fiction: The Bastard Legion (2017), Friendly Fire
  (2017), War Criminals (2019).'

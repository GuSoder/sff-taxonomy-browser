placement_rationale: 'Weber''s In Fury Born (2005), the expanded rewrite of Path of the Fury (1992): one story, so one fiction.
  Alicia DeVries, a decorated ex-commando, survives a raid by planet-wrecking pirates who tortured and murdered her family;
  she steals a cutting-edge AI ship and, with its self-aware computer and the Fury Tisiphone of Old Earth legend, runs a vendetta
  against the raiders while the Imperial Fleet hunts her (davidweber.net and Baen blurbs). Walk: Science fiction > Futurist
  > Spacefaring > Space opera > New space opera > Space adventure > Space chase > Space hunt (the hunter follows the trail
  to a quarry; she tracks the pirates'' bases and leaders). Rejected: Space dash (she is hunted too, but the story is her
  pursuit of them), Space combat (the fights are a means, the vendetta is the engine), Super space soldier (she is not remade
  by war), Space mercs (no contract). Wobble moderate: she is also the hunted party and the mythic Fury is a fantasy element.
  I read the publisher blurbs, not the book. First publication 1992 (Path of the Fury, Open Library); the queue year 2005
  is the expanded edition. Queue id MC02438.'

placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Political
  space opera -> Space Succession Opera. PRH centers the fragile New Republic after imperial collapse as Thrawn consolidates the shattered Imperial
  fleet and tries to replace the defeated order. The trilogy is governed by conflict between successor regimes, coalition-building and institutional
  survival rather than a dynastic heir.'

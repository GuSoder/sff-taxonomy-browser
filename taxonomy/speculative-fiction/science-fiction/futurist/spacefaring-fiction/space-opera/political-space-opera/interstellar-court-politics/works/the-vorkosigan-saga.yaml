placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction ->
  Futurist -> Spacefaring fiction -> New space opera -> Political space opera -> Interstellar
  court politics. The sequence follows the Barrayaran imperial court, dynastic succession,
  diplomacy, covert state service and political legitimacy across an interstellar
  society.'

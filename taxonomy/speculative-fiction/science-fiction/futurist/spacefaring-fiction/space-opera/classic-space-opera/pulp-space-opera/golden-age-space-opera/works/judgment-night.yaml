placement_rationale: >-
  SFE calls Judgment Night a lush 1940s Space Opera set during a Galactic Empire's death throes, driven by a war-trained princess, a rebel leader, ancient weapons and godlike forerunners. Its original pulp-era galactic scale and romantic martial spectacle make Golden Age space opera exact.

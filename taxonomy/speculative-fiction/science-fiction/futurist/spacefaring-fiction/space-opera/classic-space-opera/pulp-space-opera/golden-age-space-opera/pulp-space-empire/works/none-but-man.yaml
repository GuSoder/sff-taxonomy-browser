placement_rationale: 'Root-down: Speculative fiction > Science fiction > Spacefaring fiction > Space opera > Classic space
  opera > Pulp space empire. Dickson, 1969 (Baen reissue 2017): the Old Worlds (Earth, Mars, Venus) and the Frontier planets
  of the Pleiades hold a fragile peace after the Frontier Uprising when the alien Moldaug claim the whole Pleiades. Jailed
  Frontier pirate Cully O''Rourke sees the Old Worlds botching the talks, works out that the Moldaug act by a code of Respectability,
  plays their Demon of Dark legend, hijacks Moldaug ships, kidnaps their heirs, seizes the Old Worlds government and averts
  the war at a conference table (Stranger Than SF review plot summary; Baen listing). Rejected: Interstellar court politics
  (at 9, and its court networks are not the engine), Alien conquest (the invasion never lands), Far-future first contact (contact
  is the premise, the rival powers are the plot), Alien dominions and Xenolinguistics (no subordination, no language problem,
  though Respectability is a cultural code), Space chase (a pirate hunts nothing), Space combat. Boundary test: remove the
  rival-power structure of Old Worlds, Frontier and Moldaug and nothing is left. Wobble: low to moderate; plot read from a
  detailed review, not the book. Years: 1969 first publication (Open Library); the queue''s 2017 is Baen''s reissue. Queue
  id MC03505.'

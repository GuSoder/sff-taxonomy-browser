placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > Classic
  space opera > Pulp space opera > Retro space opera. Owner ruling (phonemsg-01M4BKD1RJY5Q2EM79AFB7P4YS, 2026-10-07 18:33:31):
  a retro throwback to classic space opera. 2024 debut built openly on Star Wars-style parts (SFE: wide-ranging Space Opera
  evocative of Star Wars; Locus: space magic adventure; Guardian-quoted Star Wars crossed with Doctor Who). DOCUMENTED ONE-TIME
  EXCEPTION to the rule that SF time travel goes Atemporal: the owner allows this single book in Futurist because its time
  travel (Obi from Regency London 1812 to Gahraan 6066 by an artefact) is set dressing, Retro space opera was made for it
  and it does not dilute the branch. The rule stands for every other title; this is not a precedent.'

placement_rationale: SFE describes Revenger's surreal far-future Solar System archipelago as a deliberate homage to pre-twenty-first-century Space Opera, with the retro absence of computers, networks and automation central to the sequence. Orbit calls Bone Silence the trilogy finale and follows the Ness sisters' piratical flight among thousands of worlds. The swashbuckling grand-space adventure is an exact Classic space opera fit.

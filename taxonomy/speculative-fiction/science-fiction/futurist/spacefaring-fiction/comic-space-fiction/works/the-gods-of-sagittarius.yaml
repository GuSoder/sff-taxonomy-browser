placement_rationale: 'Root-down: Speculative fiction -> Science fiction (interstellar civilization and integral robots, ships
  and technological artifacts; an ancient magic hypothesis does not turn the comic quest into fantasy) -> Futurist (Locus
  explicitly places it thousands of years ahead among human-settled worlds; not history, modern day or time travel) -> Spacefaring
  fiction (a human savant/bodyguard and alien shaman travel to seek the Old Ones, whose artifacts and surviving powers drive
  the adventure) -> Comic space fiction. Locus describes a Marx Brothers romp in space, comedic weirdness, snark and Carrollian
  slapstick; Manhattan Book Review and PopCultHQ independently confirm humour-led space adventure. Comedy governs the narrative
  rather than supplying incidental relief. Space adventure is the strongest alternative but loses the comic engine; Hard alien''s
  hard-edged cosmology does not fit its deliberately non-rigorous absurd gadgets. Atemporal Science fantasy fails the anchored
  future test, despite shamans and powers described as potentially magical. A single published novel; the reviews'' sequel
  hopes are not published volumes.'

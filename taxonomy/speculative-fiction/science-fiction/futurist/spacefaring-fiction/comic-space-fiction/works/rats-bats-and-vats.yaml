placement_rationale: 'Source-read root-down: Speculative fiction > Science fiction > Futurist (future colony world) > Spacefaring
  fiction (settlement and alien conflict beyond Earth) > Comic space fiction. PW establishes Harmony and Reason as an off-Earth

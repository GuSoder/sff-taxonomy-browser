placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Comic space fiction.
  Planet Dilbia sits at a crucial place for both humans and their adversaries the Hemnoids, so winning the friendship of the
  nine-foot bearlike Dilbians matters, but they scorn human technology and honour physical prowess, though they respect sharp
  thinking and some admire a human''s wit (Baen back cover, ISFDB title 26779, December 2000). The book is the first unitary
  edition of the Dilbia stories earlier printed as Spacial Delivery, Spacepaw and ''The Law-Twister Shorty''; those parts
  are not in the queue and are not listed separately. A diplomatic and comic contest of humans and bears off Earth, where
  the humour governs, which is the leaf''s definition. Rejected: Alien arrival (not Earth-bound), Alien expedition (the planet
  is already in contact), Space combat (the contest is not a fight). Wobble: moderate; I have only the back cover and the
  pun-laden cover, and the leaf''s comic test rests on Dickson''s Dilbian comedy as I read it from the blurb. Year is the
  2000 unitary edition (the parts first appeared from 1961).'

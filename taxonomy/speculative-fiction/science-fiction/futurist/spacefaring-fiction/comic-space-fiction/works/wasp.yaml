placement_rationale: 'Root-down: Science fiction > Futurist > Spacefaring fiction > Comic space fiction. In a future interplanetary
  war, Earth sends James Mowry to an enemy Sirian planet to sabotage morale and make a whole authoritarian bureaucracy panic.
  Jo Walton explicitly calls it a comedy about a terrorist; SFE connects it to Russell''s SF humour, and the publisher calls
  the covert war witty. The one-man sabotage and bureaucracy satire govern, not infantry ranks, naval bridge, academy or top-command
  campaigns. The World War Two Japan analogy is not a historical Earth setting; alien culture serves the covert-war comedy
  rather than anthropological contact. No time-travel premise or element found in the researched plot. Original1957, expanded1958,
  one standalone.'

placement_status: accepted
placement_rationale: 'Alan Dean Foster, the Humanx Commonwealth (Tar-Aiym Krang 1972 onward; the Pip and Flinx adventures,
  the Icerigger and Founding of the Commonwealth books; Penguin Random House, Wikipedia, ISFDB): a sustained shared future
  history in which humans and the insectoid Thranx join in a galactic Commonwealth, told from its founding (Phylogenesis,
  Dirge, Diuturnity''s Dawn) to the orphan Flinx and his minidrag Pip wandering the galaxy across more than a dozen books.
  Per rule 11j the shared universe is one fiction. Walk: Speculative fiction > Science fiction > Futurist > Spacefaring fiction
  > Future history in space (a sustained course of interstellar human civilization, like Alliance-Union and Foundation). Rejected:
  Pulp space odyssey (the Flinx books alone would fit, but the Founding books and the Commonwealth''s own history make the
  future history the unit), Space succession opera (no collapse and succession). Wobble: medium; the Pip and Flinx line alone
  is a classic wandering adventure. Not placed in this card: Drowning World (series membership unverified). Sources read:
  PRH and Wikipedia pages, ISFDB series numbers.'

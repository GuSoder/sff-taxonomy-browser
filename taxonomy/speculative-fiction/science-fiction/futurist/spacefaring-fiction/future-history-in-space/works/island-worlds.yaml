placement_rationale: 'Root-down: Science fiction > Futurist > Spacefaring fiction > Future history in space. One shared future
  traces generations from the Earthbound intelligence struggle in Act of God through the asteroid settlements’ independence
  in The Island Worlds, the Rhea artifacts and departure of asteroid worlds for the stars in Between the Stars, and the later
  planetary survey of Delta Pavonis. The sustained course of spacegoing human civilization governs the whole universe, rather
  than the first novel’s espionage, one colony’s civic contest, a single military viewpoint, or a rigorous physical-science
  problem. Publisher text explicitly connects Delta Pavonis to Derek Kuroda’s Rhea Objects, Sieglinde Kornfeld-Taggart’s star
  drive and the Island Worlds diaspora; its standalone bibliographic label does not make it a separate universe. Four original
  novels, 1985/1987/1988/1990, not the queue’s 2013/2014 ebook reissue dates. No time travel found in source-read plot and
  publisher sample.'

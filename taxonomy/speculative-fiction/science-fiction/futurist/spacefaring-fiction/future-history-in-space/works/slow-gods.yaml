placement_rationale: In the corrupt Shine polity, laborer Maw becomes an FTL pilot; a jump kills everyone else and remakes him as a copy of himself, and the machine-god
  Slow warns a binary star will collapse in a century and wipe out worlds within 83 light-years. Maw lives on through centuries of politics and evacuation (Kirkus,
  Locus/Pierce, New Scientist). One long life spanning a civilization-scale timeline - future history in space. Locus Award 2026 SF shortlist + Locus Rec SF. Placed
  by Gustav's 2026-09-24 11:13 ruling.

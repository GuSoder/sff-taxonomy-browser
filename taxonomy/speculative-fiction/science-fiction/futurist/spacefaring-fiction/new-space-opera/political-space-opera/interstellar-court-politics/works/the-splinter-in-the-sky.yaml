placement_rationale: 'Root-down: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Political space opera -> Interstellar
  court politics. Interplanetary imperial court, diplomatic rivalry and a recruited double agent are the engine. Independence and sibling rescue motivate the spy,
  but elite networks and court negotiation do the political work, not a mass revolt, collapse succession or religious pilgrimage. Soft SF confirmed by publisher and
  reviewers; no magic.'

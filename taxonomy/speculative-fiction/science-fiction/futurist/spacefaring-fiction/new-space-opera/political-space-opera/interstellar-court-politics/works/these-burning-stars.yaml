placement_rationale: 'Root-down: SF -> Futurist -> Spacefaring -> New space opera -> Political -> Interstellar court politics. Kindom religious hierarchy and First
  Families rule the interplanetary Treble; clerics, elite kin and a hacker pursue evidence of genocide through secret alliances and a revenge conspiracy. Religious
  institutions are political machinery rather than theological transcendence; private action serves elite power and intrigue rather than a mass revolutionary movement
  or simple adventure. First Kindom trilogy card.'

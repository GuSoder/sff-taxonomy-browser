definition: 'Character-driven new space opera in which a starship or spacefaring community becomes a hearth: cooperation, mutual aid, care and found family drive the story, with diplomacy favored over conquest. Search aliases: cozy space opera, iyashikei (the Japanese healing slice-of-life tradition), found family. Western frontier grammar belongs elsewhere. Coined by Gustav Söderström on 2026-09-22 for the Wayfarers lineage.'

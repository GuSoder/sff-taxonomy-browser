placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Hearthship. SFE and Harper/Hachette describe humane, character-driven space opera whose crews and communities act as family and meet crises through cooperation and diplomacy, often without weapons. Mutual aid, care and found family govern rather than conquest or Western frontier grammar.'

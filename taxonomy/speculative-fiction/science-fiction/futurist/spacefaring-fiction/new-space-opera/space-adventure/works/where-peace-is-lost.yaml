placement_rationale: 'Root-down: SF -> Futurist -> Spacefaring -> New space opera -> Space adventure. Refugee Kel guides two offworlders through Loth''s jungle to
  disable an awakened war machine, protecting the locals while concealing her identity. The action quest, physical danger and mismatched companions govern. Imperial
  war is past context rather than a military campaign or organized revolution; apparent paladin/sword furniture is technological, with no actual magic established.'

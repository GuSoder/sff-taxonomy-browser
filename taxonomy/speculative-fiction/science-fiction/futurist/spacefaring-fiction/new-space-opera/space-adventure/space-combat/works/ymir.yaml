placement_rationale: 'Root-down: SF -> Futurist -> Spacefaring -> New space opera -> Space adventure. Corporate hunter-killer
  Yorick returns to icy mining planet Ymir to kill an alien technological grendel, is coerced by his brother into sabotage
  and must survive violent reversals. PW identifies nonstop action, Locus the compressed few-days momentum. The anti-company
  plot and estranged family supply stakes, but physical danger and the hunt govern, not a broad imperial revolution, social
  dystopia or exploration of an alien megastructure. Beowulf is inspiration, not literal Norse myth.'

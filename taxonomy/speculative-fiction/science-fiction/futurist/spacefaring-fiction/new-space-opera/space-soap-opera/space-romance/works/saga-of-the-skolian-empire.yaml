placement_rationale: 'Catherine Asaro''s Saga of the Skolian Empire (Baen): psionic dynasties of the Ruby Empire across interstellar
  states, where love across the divides between Skolian, Trader and Eubian societies carries the story. The Ruby Dice, Diamond
  Star (a rock star and an empire''s heirs) and Carnelians put the relationship in the spine; Gold Dust (Dust Knights, same
  universe) is carried on the same card as series material. Root-down: Science fiction -> Spacefaring -> New space opera ->
  Space soap opera -> Space romance.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Spaceship drama.
  SFE calls the Unstoppable sequence Young Adult coming-of-age Space Opera; BookPage and Reactor center a queer found-family crew aboard the starship Indomitable.
  Crew bonds, care and belonging drive the story more than conquest. Complete trilogy.'

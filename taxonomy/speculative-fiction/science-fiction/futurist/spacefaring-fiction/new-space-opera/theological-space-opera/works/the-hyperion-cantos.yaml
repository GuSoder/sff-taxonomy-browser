placement_rationale: 'SFE (Dan Simmons): seven pilgrims, on the Canterbury Tales model, travel to the Time Tombs where the Shrike ''promises a dreadful Transcendence''
  and answers their prayers; in Endymion order returns through ''a renewed Papacy'', and Aenea is ''a final Messiah'' whose martyrdom is the agent for Transcendence.
  The theology carries all four books; the factional war mainly the first two. Moved from Cosmological politics (retired) 2026-09-23 (Gustav 16:15).'

first_published: 2000
canonical_genre: big-dumb-relics
placement_status: accepted
placement_rationale: 'Root-down traversal: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction, because
  it ranges across a settled interstellar human future. Hachette and Reynolds identify it as modern/gothic space opera, passing
  New space opera. Human colonists and scientist Dan Sylveste excavate a long-hidden Amarantin city and alien artifact to
  solve that civilization’s extinction, making Alien Delving the deepest existing leaf. Political space opera is rejected
  because relations among interstellar powers are not the primary field of action.'

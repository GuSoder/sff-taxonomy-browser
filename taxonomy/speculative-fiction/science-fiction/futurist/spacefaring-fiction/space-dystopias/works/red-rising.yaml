id: red-rising
title: Red Rising
authors:
- Pierce Brown
first_published: 2014
canonical_genre: space-dystopias
placement_status: accepted
placement_rationale: 'Root-down traversal: Speculative fiction -> Science fiction
  -> Futurist -> Spacefaring fiction, because the story begins on Mars and expands
  through a settled Solar System rather than a possible future confined to Earth.
  Within Spacefaring, its color-coded caste order, founding terraforming lie, forced
  labor and governing spectacle make Space dystopias the exact existing leaf: an oppressive
  off-Earth human society whose social order is the horror. Orwellian Propaganda was
  rejected because it sits beneath Future of Earth fiction, whose setting gate this
  work fails.'

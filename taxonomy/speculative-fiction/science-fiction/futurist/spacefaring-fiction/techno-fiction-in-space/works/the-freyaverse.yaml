placement_rationale: 'Stross''s Freyaverse (Saturn''s Children 2008, Neptune''s Brood 2013; the second is set thousands of
  years later with new characters, so one shared universe, one fiction): humanity is extinct and the characters are androids
  and their metahuman descendants; Freya Nakamichi-47, a gynoid, carries a package across the solar system in Saturn''s Children,
  and in Neptune''s Brood the metahuman Krina Alizond-114 chases a lost interstellar financial instrument (Wikipedia, PRH,
  Open Library). Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Techno-fiction in space: posthuman successor
  life, computation and a cryptocurrency-style economy are the setting and the plot. Wobble moderate: Saturn''s Children reads
  as a chase and Space chase is the alternative. Cover: Neptune''s Brood only; the Saturn''s Children Open Library cover is
  blank.'

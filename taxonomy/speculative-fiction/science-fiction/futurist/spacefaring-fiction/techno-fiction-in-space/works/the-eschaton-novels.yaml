placement_rationale: 'Stross''s Eschaton novels (Singularity Sky 2003, Iron Sunrise 2004): after a technological singularity
  an AI, the Eschaton, scattered most of humanity across the galaxy; in Singularity Sky a repressive New Republic fleet sets
  out to retaliate for an ''invasion'' of its colony that is really a visit by the Festival, a posthuman race that grants
  its hosts'' wishes with advanced technology and wrecks the colony''s controlled economy; Iron Sunrise follows the destroyed
  star system and the Eschaton''s role (Wikipedia, Strange Horizons, Black Gate). Root-down: Science fiction -> Futurist ->
  Spacefaring fiction -> Techno-fiction in space (posthuman technology, computation, networks); post-singularity is the engine,
  with the naval campaign as the plot. Wobble moderate: Space navy / Space armada (at 9) was the other candidate and is full.
  Sibling: Accelerando.'

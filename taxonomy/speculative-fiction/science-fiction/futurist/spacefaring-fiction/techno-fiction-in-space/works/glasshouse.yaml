placement_rationale: 'Stross''s Glasshouse (2006): in the 27th century, after a war against the memory-deleting worm Curious
  Yellow, Robin wakes with his memories edited out, is hunted, and volunteers for the Glasshouse, an experimental simulated
  early-21st-century society where he is given a new identity and a woman''s body (PRH, Kirkus, Wikipedia). Root-down: Science
  fiction -> Futurist -> Spacefaring fiction -> Techno-fiction in space: identity transfer, backups, gates and network worms
  are the whole plot, aboard a spacecraft in interstellar space. Wobble low.'

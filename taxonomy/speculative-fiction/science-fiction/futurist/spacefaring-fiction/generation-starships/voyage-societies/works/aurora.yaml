placement_rationale: 'Kim Stanley Robinson''s Aurora (2015; Wikipedia, Guardian): a generation ship of twenty-four biomes
  and some two thousand people, launched from Earth in 2545 for Tau Ceti and narrated largely by the ship''s artificial intelligence,
  reaches the system after about 160 years and seven generations, and the community splits over what to do when the colony
  plan fails. Walk: Spacefaring > Generation starships > Voyage societies (the social order and its conflicts across the voyage).
  Tried Starship mysteries (the ship hides no secret that drives the plot). Sources: Wikipedia, Guardian; not read.'

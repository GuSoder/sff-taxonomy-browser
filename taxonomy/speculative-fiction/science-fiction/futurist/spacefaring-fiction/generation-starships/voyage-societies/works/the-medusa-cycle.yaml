placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Generation starships
  > Voyage societies. One series (The Medusa Cycle per Publishers Weekly and Tor), one fiction. Per Kirkus and Publishers
  Weekly: on the generation ship Olympia, Oichi Angelis, a domestic worker rewired to pass unseen, plots revenge on the ruling
  Executives who destroyed her parents'' ship; the sequel takes her insurgents into the Charon system. A generation ship''s
  caste, political control and the kind of civilization to build is the Voyage societies definition. Rejected: Starship mysteries
  (the plot is revenge and revolt, not a concealed truth), Revolutionary space opera (the ship society is the frame). Wobble:
  the second book leaves the ship for a planet of ancient sentient alien starships, which pulls toward Alien delving; the
  series stays together on the ship-society frame.'

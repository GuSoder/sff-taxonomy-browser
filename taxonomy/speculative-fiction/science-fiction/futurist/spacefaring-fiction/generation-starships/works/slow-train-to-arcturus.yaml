placement_rationale: 'Source-read root-down: Speculative fiction > Science fiction > Futurist (humanity launches settlements
  into deep space) > Spacefaring fiction (interstellar habitat ship) > Generation starships. A stranded alien researcher crosses
  sealed habitats housing divergent human societies aboard one vast craft. The enclosed societies and their separation are
  the engine, not colony civic life on a settled planet or a conventional space-opera conflict. Comic space fiction tested:
  PW calls it action-packed and often humorous, while Foreword centers cultural viewpoints and the alien observer; the sources
  do not establish comedy as the governing contract, so incidental satire does not override the generation-ship premise. This
  is the tenth fiction and triggers a split pause.'

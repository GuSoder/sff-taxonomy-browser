placement_rationale: 'Full root-down walk: Science fiction (not fantasy: a slower-than-light world ship, engineering not magic)
  > Futurist (not Atemporal, Historical or Modern day: far-future voyage) > Spacefaring fiction (not Alien fiction, Future
  of Earth fiction, Hard sci-fi or Otherworldly fiction: the ship is the setting) > Generation starships (not Classic/New
  space opera - no navies or wars of empire; not Military SF - soldiers serve the story, not the reverse; not Space colonies,
  Space dystopias or Space techno fiction: this is one ship whose descendants have forgotten they are aboard). The Ark trilogy:
  a generation ship launched to save humanity, ten thousand years into its voyage its people believe their world is the whole
  universe (SFE, Baen). Fits the leaf definition exactly: a voyage so long the crew''s descendants are the story.'

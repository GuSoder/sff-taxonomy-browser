placement_rationale: SFE explicitly sets the novel aboard a generation starship many years into its journey, foregrounding ritual maintenance, a rigid hierarchy, hidden rulers and an unknown destination. Akashic identifies the HSS Matilda as an antiquated vessel that has carried the last of humanity for generations. The multigenerational voyage is its defining physical and social frame, making Generation Starships closest.

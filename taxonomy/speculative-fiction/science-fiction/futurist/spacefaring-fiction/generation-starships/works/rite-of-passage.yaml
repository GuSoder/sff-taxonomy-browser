id: rite-of-passage
title: Rite of Passage
authors: [Alexei Panshin]
first_published: 1968
canonical_genre: generation-starships
placement_status: accepted
placement_rationale: 'Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Generation Starships. SFE calls its World Ship venue a generation-starship rite-of-passage structure, while noting its FTL capability makes it an impure example. Other Spacefaring siblings fail because the closed ship society and heroine’s maturation within it are the engine.'

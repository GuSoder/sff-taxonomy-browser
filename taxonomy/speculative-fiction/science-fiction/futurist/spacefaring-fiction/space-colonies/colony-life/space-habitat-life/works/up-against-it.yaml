placement_rationale: 'M. J. Locke (Laura J. Mixon)''s Up Against It (Tor, 2011; Tor.com, Kirkus, Tor Forge blog): Jane Navio,
  resource manager of the asteroid colony Phocaea, faces a mishap that dumps megatons of water and methane into the habitat;
  the crisis may be engineered by a Martian crime syndicate, and an emergent AI is involved. Walk: Speculative fiction > Science
  fiction > Futurist > Spacefaring fiction > Space colonies > Colony life (umbrella after the split) > Space habitat life
  (the colony is a hollowed-out asteroid and the story is keeping it running) vs Surface colony life (no surface), Space colony
  politics (the syndicate is a thread, not the contest for power), Space mystery (the sabotage question is a thread, the engine
  is the survival of the habitat). Wobble: medium, Space mystery. Sources: Tor, Kirkus, Tor Forge blog; not read in full.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Colony life. Mark Ten Roos leads a group of colonists pushed out from an overcrowded Earth, called garbage by those who
  sent them, in their attempt to settle a new planet and become economically self-sufficient from Earth while learning to
  defend themselves against alien raiders (Wikipedia; ISFDB title 3766, Lippincott flap, serialized in Analog 1971). Settling
  a world and building a community''s life there is the story, which is the leaf''s definition. Rejected: Colony politics
  (at nine; the contest is not for power inside the colony), Space combat (defence is one strand), Colonial worlds (Xenocolonial,
  an anthropological frame). Wobble: moderate; the self-sufficiency from Earth and the raider war carry the plot, and Colony
  life is aimed at settled routines years after the founding. Year is the 1972 first edition (the queue showed 2018).'

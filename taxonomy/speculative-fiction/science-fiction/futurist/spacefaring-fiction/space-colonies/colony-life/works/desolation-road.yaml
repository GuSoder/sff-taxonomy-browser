placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Colony life. A far-future terraformed Mars where a town grows around a desert oasis; settlers, exiles and pioneers arrive
  one by one and the book follows the town''s families, births, loves and feuds over decades (Wikipedia, Desolation Road).
  Established off-Earth settlement as the arena, and what drives the story is the community''s own settled life. Rejected:
  Space colony politics (a crime lord''s flight and a railway fight are episodes, not the engine), Space mystery. Wobble:
  moderate, magic-realist and picaresque, and the Exalted Families thread is a power-and-pursuit subplot. First published
  1988 (Open Library); the sequel Ares Express (2001) is not in the queue.'

id: red-moon
title: Red Moon
authors:
- Kim Stanley Robinson
first_published: 2018
canonical_genre: space-colonies
placement_status: accepted
placement_rationale: 'Root-down traversal: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction because the story is set in a permanent, working lunar settlement. SFE and Hachette center a colonized Moon under Chinese influence; Kirkus calls it a political thriller where the Moon is backdrop and game piece for China and the US. Space colonies is exact because the established colony is the arena for murder, surveillance and revolution. It is not about founding the colony, and Space dystopias is rejected because this is a contested functioning settlement with hope threads rather than a nightmare-state.'

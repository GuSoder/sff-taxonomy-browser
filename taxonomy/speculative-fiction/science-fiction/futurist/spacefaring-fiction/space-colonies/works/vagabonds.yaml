placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Space colonies. Locus sets
  the novel in 2201 after an Earth-Mars war: the Mercury Group returns from Earth to an established collectivist Martian republic of ateliers,
  assigned housing and inherited political secrets. Mars as a lived settlement, with its institutions and quiet revolution, is the arena.'

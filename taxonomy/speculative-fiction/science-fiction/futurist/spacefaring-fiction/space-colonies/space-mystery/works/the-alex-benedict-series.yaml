placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Space mystery. McDevitt''s Alex Benedict series is one shared universe, so one card (rule 11j): about 9,000 to 10,000 years
  ahead, humanity has settled countless worlds; antiquities dealer Alex Benedict and his pilot Chase Kolpath, based on the
  settled world Rimway (capital Andiquar), solve mysteries of the buried past - A Talent for War: the legend of war hero Christopher
  Sim and a cover-up (SFWA, Wikipedia); Polaris: an interstellar yacht''s passengers vanished 60 years earlier; Seeker: a
  relic cup leads to the lost colony Margolia, founded by a colony ship 9,000 years earlier; Coming Home: a hyperspace-era
  artifact and a vanished cruise ship (Wikipedia); the series trade includes abandoned stations and deserted colonies (Alan
  J Chick''s series page). Curator condition (phonemsg-01M4GXYM7C0389701NV68PJXTF, 2026-10-09 8:14 PM): placed here as long
  as the books at least partially take place on a space colony. Check: Rimway is the series'' settled home world and base
  (Wikipedia on A Talent for War and Coming Home), A Talent for War''s back-story runs on the frontier world Dellaconda, and
  Seeker''s quest is the search for a lost colony. Caveat: Rimway is a planet with an old capital, not an orbital station,
  and the sources do not call it a colony, so the condition is met through settled worlds, not a named colony. Rejected: Colony
  life, Space colony politics, Future history in space, Starship mysteries, Space opera branches (see the curator thread of
  2026-10-09). Wobble: moderate. Read only SFWA, Wikipedia and a fan series page; The Devil''s Eye, Echo and Firebird are
  known only from the series pattern. Years: Wikipedia and Open Library first publication (A Talent for War 1989, Polaris
  2004, Seeker 2005, The Devil''s Eye 2008, Echo 2010, Firebird 2011, Coming Home 2014); the queue years run one to two years
  later, kept here. Queue ids MC04071, MC04084, MC04085, MC04087, MC04077, MC04079, MC04075.'

placement_rationale: 'Kim Stanley Robinson''s 2312 (2012, Nebula winner; Wikipedia, Hachette): in a solar system of settled
  planets, moons and asteroid terraria, Swan Er Hong, an artist and former terrarium designer, grieving her step-grandmother
  Alex on Mercury''s moving city Terminator, is drawn with the Saturnian Wahram into tracing the attacks and the conspiracy
  behind Alex''s death. Walk: Science fiction > Futurist > Spacefaring > Space colonies > Space mystery (a case across the
  settled worlds is the engine). Tried Colony life (the case, not the daily life, drives it), Space colony politics, and Terraforming
  fiction (the Mars trilogy''s subject; here terraria are the setting). Sources: Wikipedia and Hachette; I did not read it.
  Wobble: the book is also a tour of the system; alternative Colony life.'

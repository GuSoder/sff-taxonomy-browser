placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Space mystery. McDevitt, 2000: the story is set mostly on Greenway, a terraformed colony world among the Nine Worlds, centuries
  ahead (Bewildering Stories review: a colony planet 1,500 light-years away; NESFA review: Greenway is where the story is
  mostly set). Kim Brandywine, an astrophysicist turned fundraiser for the colony''s last alien-search institute, reopens
  a cold case: the survey ship Hunter came home early decades earlier, two crew, including her clone sister Emily, vanished,
  a third died in an explosion, the flight log was faked, and a ''ghost'' haunts the blast site; the case leads her off the
  planet to an alien civilization (Kirkus: ''alien-contact/murder mystery''; SFWA synopsis; NESFA). A cover-up cold case on
  a settled world drives the story, the leaf''s definition as widened on 2026-10-09 for Benedict. The curator''s condition
  for that leaf (books at least partly on a space colony, phonemsg-01M4GXYM7C0389701NV68PJXTF) holds here more clearly than
  for Benedict: the colony planet is the main setting. Rejected: Alien message and Alien arrival (the Earthbound first-contact
  leaves; this is not Earth and the contact is the case''s solution, not its engine), Hard alien (no study of aliens), Colony
  life and Space colony politics (the case, not life or power, drives it). Wobble: low to moderate; reviews and synopses only,
  no text read. Wikipedia calls it ''a story of first contact'', so the alien end of the plot would also suit a first-contact
  shelf if one for far-future settings exists. Years: first publication 2000 (Open Library, Wikipedia; the UK title is Slow
  Lightning). Cover: the 2000s HarperTorch jacket via Open Library; the first-edition scan has a library barcode and was rejected.
  Queue id MC04080.'

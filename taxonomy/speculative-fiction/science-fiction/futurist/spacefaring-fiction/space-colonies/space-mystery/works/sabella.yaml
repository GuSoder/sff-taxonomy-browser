placement_rationale: 'Tanith Lee''s Sabella, or The Blood Stone (DAW, 1980; Penguin Random House description): on a Mars-like
  Earth colony Sabella, allergic to sunlight, strong and fast and a feeder on blood, hides her vampirism after killing men
  in her youth; her late aunt Cassi, a Christian Revivalist, sets her manservant John Trim to hunt her down, and he hires
  the private investigator Sand Vincent to get close and find out what she is, while Sabella fights her own hunger to keep
  him alive. Walk: Science fiction > Futurist > Spacefaring > Space colonies > Space mystery (an investigator works a secret
  across a settled world; the case drives the story). Tried: Colony life (the community''s routine is only the cover) and
  Soft SF (the vampire is the premise, not a menace sweeping the colony). Wobble: it is told from Sabella''s side, so Colony
  life is the alternative leaf. Source: publisher description only, not the text.'

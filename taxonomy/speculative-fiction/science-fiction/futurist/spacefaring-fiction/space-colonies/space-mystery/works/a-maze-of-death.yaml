placement_rationale: 'Philip K. Dick''s A Maze of Death (Doubleday, 1970; Wikipedia): fourteen colonists on the planet Delmak-O,
  a linguist, a theologian, a custodian, a thermoplastics overseer and others, are killed one by one while they try to find
  out who or what is killing them. Walk: Science fiction > Futurist > Spacefaring > Space colonies > Space mystery (a case
  drives the story and solving, not politics, is the engine). Tried: Colony life (the community''s routine is not the story)
  and Space dystopias (no oppressive order). Wobble: the explanation is a reality twist, the engine is still the hunt for
  the killer.'

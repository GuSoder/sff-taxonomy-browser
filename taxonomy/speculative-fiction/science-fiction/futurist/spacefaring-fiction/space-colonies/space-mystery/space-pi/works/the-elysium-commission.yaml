placement_rationale: 'L. E. Modesitt Jr.''s The Elysium Commission (Tor, 2007; PW, Kirkus, Wikipedia, author site): on the
  planet Devanta, retired special operative Blaine Donne solves problems for wealthy clients by day and walks the back streets
  of Thurene at night; a sudden bunch of commissions (missing heiresses, a patent infringement for a friend, a background
  check on a granddaughter''s fiance, a woman with no past) turn out to connect, his friend ends up dead, and the trail leads
  to a scientist''s pocket universe and a utopian city that may need ours destroyed to grow. Walk: Science fiction > Futurist
  > Spacefaring > Space colonies > Space mystery > Space PI (a private fixer works the case on a settled world; the solving
  is the engine). Rejected: Space colony politics (the cases are not a contest for power), Colony life (the life is background),
  Space cop (Donne holds no badge). Wobble: low; the pocket-universe stakes are space-opera scale, but the book is built as
  hard-boiled casework. Sources: PW, Kirkus, Wikipedia, author site; not read in full.'

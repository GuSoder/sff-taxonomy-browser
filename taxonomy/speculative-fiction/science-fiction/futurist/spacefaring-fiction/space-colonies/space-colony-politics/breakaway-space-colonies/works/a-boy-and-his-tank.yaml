placement_rationale: 'Leo Frankowski''s New Kashubia series (A Boy and His Tank 1999, The War With Earth 2003, Kren of the
  Mitchegai 2004, the last two with Dave Grossman; Baen, PW, reviews): colonists on the world New Kashubia pay off the colony''s
  debt by fighting as virtual-reality mercenaries, then revolt against Earth''s rule. Walk: Speculative fiction > Futurist
  > Spacefaring > Colony life > Colony politics > Breakaway space colonies (the contest is colony against Earth). Rejected:
  Space navy (the fight is the colony''s independence, not a navy arc), Space mercenaries. Wobble: medium, military SF. Sources:
  publisher and catalogue pages plus a review; not read in full.'

first_published: 2018
canonical_genre: retro-space-opera
placement_status: accepted
placement_rationale: >-
  Root-down: SFE calls this two-volume sequence an adroitly baroque space-opera spoof that transforms traditional SF forms. Humanity faces a galactic-civilization judgment through the Metagalactic Grand Prix, followed by a victory tour and new First Contact competition. It passes Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera; its deliberate comic recasting of old galactic-council and contact tropes makes Retro space opera the closest leaf.

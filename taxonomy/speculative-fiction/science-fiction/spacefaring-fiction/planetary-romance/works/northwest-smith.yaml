placement_rationale: "SFE (entry moore_c_l): from Shambleau (Weird Tales 1933), a psychic-vampire tale set on a Planetary Romance version of Mars, Moore chronicled Northwest Smith, whose character and actions closely follow Western models. SFE's explicit Planetary Romance tag plus weird-fantasy furniture on alien worlds place the series here rather than in the space-opera leaves."

id: the-centauri-device
title: The Centauri Device
authors: [M. John Harrison]
first_published: 1974
canonical_genre: golden-age-space-opera
placement_status: accepted
placement_rationale: 'Root-down: Science fiction -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden-age space opera. SFE calls it a darkly sardonic, disgruntled Space Opera whose doomsday device destroys the galaxy; Hachette grounds a lowlife captain, vicious space war and sentient bomb while saying the novel turns space-opera conventions on their head. Its 1974 publication and deliberate attack on the first-wave form place it at that tradition’s late edge, not the 1980s-onward New Space Opera revival.'

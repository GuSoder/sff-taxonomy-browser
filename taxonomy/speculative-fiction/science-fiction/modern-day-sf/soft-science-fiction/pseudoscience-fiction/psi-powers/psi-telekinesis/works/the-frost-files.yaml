placement_rationale: 'Walk: Speculative fiction > Science fiction > Modern-day SF > Soft science fiction > Pseudoscience fiction > Psi powers > Psi telekinesis. The Frost Files (four books 2019-2022, Orbit; Hachette series page lists exactly these four): telekinetic government operative Teagan Frost, pitched as ''Alias meets X-Men''; each book turns on the reach, cost and control of her telekinesis (Hachette). The gift is force, set in the recognizable present: Psi telekinesis. Rejected: Psi powers umbrella (too broad; this leaf is the force-gift split). Wobble: low-moderate; techno-thriller register, but the power''s reach and who controls it is the story. Years: 2019, 2020, 2021, 2022 (Orbit; ISFDB). Queue ids MC04117, MC04118, MC04119, MC04122.'

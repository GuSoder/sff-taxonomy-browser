placement_rationale: |-
  Root-down: Speculative fiction > Science fiction > Psi powers > Psi telepathy. PW (publishersweekly.com/9780765306111): Heath Ransom is an "endovoyant" - a former police psychic, machine-enhanced, "who can read other people's emotions" - hired to return a comatose woman's consciousness to her body, in "an intriguing world not too different from ours" (FictionDB: machine-enhanced endovoyant private investigator). A contemporary-set psi story in which the gift is minds meeting - reading others, entering a lost consciousness - and the gift drives the story. Rejected: Unmoored selves (the displaced consciousness is the case, not the protagonist's own coming loose), Occult mystery (this is SF psi, not occult), Psychological SF (the psi gift, not an experiment on the mind, is the engine). Wobble mild (the investigation turns metaphysical - the nature of death - rather than staying a psi procedural) RESOLVED: the working tool throughout is the telepathic/empathic gift. Standalone novel (Tor 2013).

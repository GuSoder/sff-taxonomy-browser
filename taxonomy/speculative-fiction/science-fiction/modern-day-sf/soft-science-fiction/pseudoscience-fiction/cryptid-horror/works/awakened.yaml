first_published: 2018
canonical_genre: cryptid-horror
placement_status: accepted
placement_rationale: |-
  Root-down: Science fiction > Modern day SF > Soft science fiction > Pseudoscience fiction > Cryptid horror. A new NYC subway line unearths a hidden subterranean predatory species; the trilogy (Awakened 2018, The Brink 2019, Obliteration 2020, complete) escalates to a worldwide emergence - "the all-out war against humanity has begun - a war in which only one apex species will survive" (publisher copy, harpercollins.com/products/obliteration-james-s-murraydarren-wearmouth). The materially-real hidden species is the speculative premise and its attack supplies the horror, the leaf's definition, on Devolution's shape. Rejected: Creature feature (pulp single-menace register), Warzone Earth (terrestrial, not alien invaders), Unknown catastrophe (cause known). Wobble mild (RESOLVED): Kirkus reads the monsters as "supernatural" (kirkusreviews.com/news-and-features/articles/iawakenedi-james-s-murray-darren-wearmouth/), but the publisher frames the series biologically and calls Obliteration a "science fiction thriller".

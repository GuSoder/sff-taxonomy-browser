placement_rationale: 'Root-down: Science fiction -> Modern day -> Soft science fiction -> Cryptid horror.
  A lady Sasquatch is materially real on a Pacific Northwest island, attacking reality-dating-show contestants
  (the author, LitHub: ''a lady Sasquatch in my slasher comedy novel''; Kirkus: ''a dangerous cryptid
  in the surrounding woods''). A folkloric species made materially real supplies the speculative premise
  and its attack drives the plot - the leaf def. The comic register does not move it: the cryptid is the
  engine.'

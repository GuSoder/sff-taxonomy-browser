placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Soft science fiction > Social science
  fiction > Psychological SF. Per Kirkus and Google Books (Pantheon, 1963): a middle-aged banker, Wilson, pays an anonymous
  organization that stages his death, remakes his face by surgery and gives him a new identity, and the novel follows what
  that new self does to him. The mind and identity are the experiment. Soft call: it is also a suspense thriller, but Technothriller
  is about technical detail, and here the surgery is only the premise.'

first_published: 2002
canonical_genre: psychological-sf
placement_status: accepted
placement_rationale: 'A journalist finds children whose minds were imprinted with the strategies and persona of a self-made
  tycoon, and they have grown ruthless. A person''s pattern pressed into other minds is the Copied minds gate.


  # Charisma present-day ancestor correction, 26 November 2026


  Old Copied minds mechanism was reasonable at the leaf but never licensed skipping Futurist. Tor''s distributed publisher
  copy explicitly calls this a present-day science-fiction thriller; contemporary SFRevu independently says contemporary America,
  existing technology plus supposition. Strange Horizons'' finished review locates the same contemporary Los Angeles/Vancouver
  human experiment. No factual future setting is established by the mere novelty of personality imprinting.


  Root-down: Speculative fiction > Science fiction > Modern day SF > Soft science fiction > Social science fiction > Psychological
  SF. Deliberate behavioral conditioning and implanted personality template are the speculative science, not magic or an invented
  fantasy realm. Recognizable writer-present America and existing-tech extrapolation, not a period setting, future society,
  spacefaring world or temporally unplaceable reality. Narrative flashbacks/jumps recount a dead patron; not actual time travel.


  At Modern day, no alien encounter/invasion or apocalypse, no designed genetic kind/cloning/nanomedicine. Technothriller
  is an authentic review label and a serious rival, but none of its existing children fits the engine: not cryptographic/information
  warfare, covert enhanced-operative espionage, or a high-tech system emergency with engineering/logistic detail. Modern social
  dystopia also loses to the actual experimental premise rather than society-as-such. Soft SF > Social science rather than
  pseudoscientific psi or pulp superhero/creature adventure: the central experiment is conditioning/psychological development.
  Within Social science, individual intelligence, personality imprinting, ambition and latent violence make Psychological
  SF exact; the 1500-child program has social consequences but the subject is the remade individual mind, not a group society
  designed as the experiment. No seed necessary and no gate widened. Confidence high on temporal failure, moderate-high on
  home.


  Sources read: https://openroadmedia.com/ebook/charisma/9781466833982 ; https://www.sfrevu.com/ISSUES/2002/0206/Review%20-%20Charisma/Book%20Review.htm
  ; https://strangehorizons.com/wordpress/non-fiction/reviews/violence-ethics-and-ethnicity-charisma-by-steven-barnes/


  Authority original phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX,30October2026,individual book/fiction judgment. Exact bibliography
  and hotlinked front unchanged. No structure/art/definition change. Copied minds9to8; Psychological SF8to9.

  '

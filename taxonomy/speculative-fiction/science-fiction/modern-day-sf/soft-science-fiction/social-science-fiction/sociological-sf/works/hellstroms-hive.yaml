placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Soft science fiction > Social science
  fiction > Sociological SF. Per Wikipedia: a secret hive-like human society lives under an Oregon farm and is hunted by a
  US agency; the story studies the society itself, its rules and its cost. A group or society as the subject is the Sociological
  SF definition. Rejected: Psychological SF (the individual mind is not the subject), Secluded utopias (the hive is not framed
  as an ideal). Wobble: it is also a conspiracy thriller with a government hunt. Year is first publication 1973, not the queue''s
  2007 reissue. Placed as the tenth of the split Social science fiction umbrella, after the owner''s Execute (phonemsg-01M4DCWGK3P0XX3E2FC9V0X587).'

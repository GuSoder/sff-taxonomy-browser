  and its18Feb2021 retrospective explicitly says originally published2019. ISFDB and Library Journal agree. Library catalogue
  quotes2018verso and a dealer lists2018; conflict preserved rather than pretending unanimous. Pearl is2021retitle, queue2022
  is paperback. SFE misfiles it as collection and gives retitle2025; publisher/ISFDB288pageNOVEL evidence and2021reviews directly
  contradict those fields, not inherited. Not two novels, not connected to all Malerman books through authorship/cameos alone.
  Current bibliography and2026interview checked; no published Pearl sequel found.


  ## Whole-book engine and root-down walk


  Read author''s own synopsis/excerpt, PRH, Cemetery Dance, ISFDB, Kirkus, LJ, CriminalElement finished review, HauntedMTL
  and two primary interviews (Nelson Agency15Oct2021, Grimdark13Oct2021). The pig Pearl has an expanding mental web, controls
  humans and pigs, draws farm visitors, teens and police into a slasher escalation; multiple human and pig viewpoints/flashbacks
  explore cruelty, revenge, animal farming and morally compromised humans. Not merely a boy saying the pig made him: reviews
  and author confirm powers actual. Author calls Pearl a living creature bridging different animal/human intelligences, more
  Carrie than Charlotte''sWeb, more slasher than fable. No scientific test, new species expedition, laboratory intervention,
  Satanic pact, literal demon or ancientgod origin established. HauntedMTL''s demonic adjective not ontological proof. No
  full novel read, so ultimate power origin and every ending detail remain uncertain.


  Speculative fiction > Science fiction > Modern day SF > Soft science fiction > Pulp science fiction > Creature feature.
  Positive broad accepted creature gate names animal intelligence and no-pretense monsters coming at people; whole escalating
  psychic animal assault, gore/action and nature striking back satisfy the pulp-consequence mode. This is project-specific
  SF shelf that explicitly accepts no scientific pretence, not a claim of scientific plausibility. Primary author distinguishes
  living animal intelligence from supernatural species; horror label alone does not force Fantasy. Existing owner approved
  broad nonapocalyptic Creature feature and no-pretense reorg8Oct2026, phonemsg-01M4DN59XKA7GQQBCC3FFNK714, with broad-leaf
  question phonemsg-01M4DN1EEY46H9XG1R2MX4DZKB. Single-fiction standing authority phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX and
  ordered intake phonemsg-01M43MYMGAMQTNA3CY402KK7FB.


  SF siblings tested: Historical fails era aesthetic, historical fork or hidden historic event; Futurist fails scientific
  extrapolation or future-world frame; Atemporal fails time/world crossings. Modernday alien invasion/firstcontact fail extraterrestrial
  contact; apocalypse fails society-wide collapse; bioengineering fails deliberate engineered body; technothriller fails technology/technical-detail
  plot; humorousSF fails comedy governing story; social dystopia fails wider social system. Soft''s socialscience fails real
  scientific exploration of society/psyche, pseudoscience has no experiments/cryptozoological evidence posture. Psi telepathy
  has exact mental-control mechanism, but its Pseudoscience ancestor requires pretend evidence; psi telekinesis labels in
  interviews/reviews do not establish physical rather than mental-illusion engine. Pulp is explicitly nopretense, and creature
  rather than human superhero decides its child. No gate widened to fit.


  Fantasy strongest rival: RealEarth > Contemporary, not invented realm or literal portal; past flashbacks do not make historical
  aboutness, and no postapocalyptic/future world. Animal fantasy genuinely offers animal viewpoint/moral animal cruelty, but
  whole-book monster/slasher escalation is not lightly anthropomorphized animal society/fable and author expressly says more
  slasher than fable. Mythic needs identified inherited myth; magicalcomingofage not child''s magical identity formation;
  domestic needs household/family as sustaining magic site, here farm is lair of one predator; magicrealism fails marvel accepted
  as ordinary. Supernatural named ghost/undying/vampire/werewolf/deal/afterlife routes fail identities. Paranormalfantasy''s
  candidate empty definition and mixed-supernaturalsociety tenants do not justify genericmonster catchall. Urban fae/city/publiclyparanormal/modernGoth/case/service/weirdwest
  routes fail their actual institutional/setting engines, ruralMichigan alone isn''t Western frontier. DarkFantasy is substantial
  mood rival: torment''s vengeance has actual animalwrong/revenge, but requires entity/spirit/bond born of wrong pursuing
  across places; living pig''s emerging intelligence holds a farm web, no spirit or wrongful-death bond. Demonic/eldergod/Satanic/primordial/impostor
  identities unattested. Horror place children fail literalHell/cursedground/ruralcommunity rites: pig causes danger, the
  farm isn''t independently cursed. Do not invent a psychic-animal fantasy leaf when existing owner-approved Creature feature
  fits whole book honestly.


  Wobble moderate: psychic pig and authorCarrie comparison straddle supernatural reading and psi. Explicit local no-pretense
  animalintelligence gate and actual slasher register are stronger than unproved demon ontology or experiments. Covers must
  not decide root. English2022DelRey flatfront300x450 from PRH, pixels inspected: Pearl/JoshMalerman and originaltitle subtitle,
  no audio/nonEnglishplaceholder. Localized. Firstyear2019 is not jacketdate.



placement_rationale: 'Walk: Speculative fiction > Science fiction > Modern-day SF > Soft science fiction > Pulp science fiction > Superhero fiction. The Icarus Project series (Black and White 2009, Shades of Gray 2010, Spectra): childhood friends graduate the Icarus Project academy for powered people and end up on opposite sides in New Chicago - one the celebrated hero Jet, the other the wanted villain Iridium - in a world where corporations sponsor superheroes and the academy polices the powered (PRH series blurb). Powered heroes and villains plus the institutions that train and brand them: superhero fiction. Rejected: Modern-day SF and Pulp science fiction umbrellas (too broad; this dedicated leaf exists). Wobble: low. Years: 2009, 2010 (Spectra). Queue ids MC04115, MC04116.'

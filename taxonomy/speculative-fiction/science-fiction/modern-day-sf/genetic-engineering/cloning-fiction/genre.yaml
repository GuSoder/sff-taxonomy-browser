definition: 'Genetic engineering in which the gene work makes copies: clones raised, replaced, hunted or brought back from
  the dead - a dinosaur grown from old DNA, a Neanderthal, an organ-donor child, a wife''s double, an actress''s disposable
  duplicates. The copy is the premise. Not Genetic caste fiction, where the gene work makes a designed kind of person and
  a divide between the modified and the unmodified.'

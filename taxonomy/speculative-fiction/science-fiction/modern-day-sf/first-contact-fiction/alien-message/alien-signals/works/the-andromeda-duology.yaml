placement_rationale: 'The archetypal signal first contact: a new radio telescope picks up a dot-dash signal from the Andromeda
  constellation; decoded, it is a do-it-yourself kit for a super-computer that, once built, begins a question-and-answer protocol
  and fabricates a living human, Andromeda (A for Andromeda, 1962). In The Andromeda Breakthrough (1964) the INTEL conglomerate
  rebuilds the alien computer for the desert state of Azaran and its meddling begins unbalancing Earth''s weather and atmosphere.
  The encounter arrives as a transmission, never a visit: alien-signals. Queue row MC04719 is the Gollancz 2020 omnibus The
  Andromeda Anthology containing exactly these two novels; the row''s author tag ''John Elliott'' is a misspelling of co-author
  John Elliot - the fiction is the Hoyle & Elliot duology, first published 1962.'

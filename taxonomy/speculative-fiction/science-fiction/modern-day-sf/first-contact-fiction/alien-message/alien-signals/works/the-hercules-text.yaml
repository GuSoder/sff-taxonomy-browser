placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > First contact fiction > Alien message
  > Alien signals. McDevitt, 1986 (Ace Special, November 1986): SETI scientists receive a message of intelligent extraterrestrial
  origin, and the story follows how it lands: a priest on what it means for religion, a psychologist on the aliens'' psyche,
  the scientists on their own fields, the president on national defense (Wikipedia). Rejected: Alien tokens (no object is
  found; the message arrives across space), Alien arrival (nobody comes), Alien conquest (no hostility). Wobble: low. A received
  transmission is the cleanest signal card, with Contact. Plot from Wikipedia and the earlier walk (SFWA), not the book. Year
  1986 (Wikipedia); the cover is the 2015 Ace reissue. Queue id MC04089.'

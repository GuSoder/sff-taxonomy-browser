placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > First contact fiction > Alien message
  > Alien tokens. McDevitt, Ancient Shores (HarperPrism, April 1996; Nebula nominee) and its continuation Thunderbird (2015),
  one card as a shared setting: a roughly 10,000-year-old alien yacht and stargate turns up on a Sioux reservation in North
  Dakota, and people go through it to other worlds, an Eden world, a maze and a space station (Wikipedia, Penguin, Fantasy
  Literature review). Rejected: Alien signals (nothing is transmitted), Alien arrival (nobody visits), Big dumb relics (runner-up:
  a huge alien structure, but there the explorers go to the relic while here the gate is found at home and used), Portal fantasy
  (it is science fiction). Wobble: moderate. The object is a vehicle and a gate, not a message as such, so it rides as a thing
  left behind that waits to be found and stepped through. Plot from the earlier walk''s sources, not the book; Thunderbird''s
  plot was not walked separately. Years 1996 and 2015 (Wikipedia). Queue ids MC04072, MC04090.'

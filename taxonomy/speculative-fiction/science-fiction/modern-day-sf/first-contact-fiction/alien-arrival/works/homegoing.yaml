placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Earthbound 1st contact > Alien arrival.
  Per the New York Times (1989), Norbert Haupt and Publishers Weekly: a starship carrying 22,000 hive-like Hakh''hli lands
  on Earth with Sandy Washington, the one human they raised, sent to negotiate for raw materials on a damaged, post-war Earth
  while both sides pursue hidden agendas. Aliens physically arriving on Earth is the Alien arrival definition. Rejected: Alien
  expedition (humans do not travel out), Alien infiltration (the arrival is open). Wobble: the Earth is a degraded future
  one, so Near-future first contact was also read; the arrival of the ship is the engine, not the transformation of a recognizable
  present. Year 1989 (Del Rey); queue says 2011 Baen ebook.'

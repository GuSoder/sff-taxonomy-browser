definition: Present-day bioengineering SF whose defining intervention is nanos working within living bodies to repair,
  preserve or remake them, and the altered lives this creates, including romantic and social consequences. Not Genetic
  engineering, where deliberate design of genes or organisms is the defining intervention; not industrial nanomachines
  or external swarms. Medical nanos may be organic or mechanical. Where both interventions occur, classify by the whole
  fiction's defining premise rather than an isolated component.

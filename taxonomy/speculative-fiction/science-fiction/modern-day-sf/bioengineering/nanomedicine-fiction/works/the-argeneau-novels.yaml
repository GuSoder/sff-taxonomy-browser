placement_status: accepted
placement_rationale: 'Walk: Speculative fiction > Science fiction > Modern day SF > Bioengineering > Nanomedicine fiction.
  The 37-novel shared universe takes place on recognizable contemporary Earth. Blood-fuelled bioengineered medical nanos
  preserve and repair living humans, and the official Mile High With a Vampire excerpt explicitly attributes strength,
  speed, night vision, fangs, mind reading and control to them. Immortal Rising''s winged Thorne is an animal/human genetic
  experiment, not an angel; this connected arc does not replace the whole fiction''s medical-nanos premise. Each novel
  builds a life-mate romance with these altered bodies and powers. Fantasy fails the naturalised powers; Historical,
  Futurist and Atemporal fail the main setting. Modern day alternatives: no alien invasion or first contact, no shared
  apocalypse or social dystopia, no essentially mundane technical thriller. Rom-com SF fails the whole fiction: Immortal
  Unchained includes sustained lab captivity, torture and horror, and its reviewer explicitly notes much comedy absent.
  Soft SF''s social, psi/cryptid and superhero/creature branches do not name this medical body-remaking premise. Genetic
  engineering''s Cloning, Genetic caste and Hard genetic SF fail the whole fiction: no copies, hereditary rank or genetic
  research as shared subject. Bioengineering generalizes the existing slot without a ninth Modern day child; the approved
  new leaf covers nanos operating inside bodies and the changed lives that follow, including romance. Where gene design
  and medical nanos coexist, the whole-fiction defining intervention governs. Curator Approved phonemsg-01M63K1BY3YCSN9H1N87PQVCPZ,
  2026-10-29 11:24:37 CET, on proposal phonemsg-01M63K0E8D5QFSMP7ZZ3RP9079. Existing 37-book metadata and covers preserved.'

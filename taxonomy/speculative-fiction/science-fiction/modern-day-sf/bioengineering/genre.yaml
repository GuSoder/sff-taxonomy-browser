definition: Present-day SF in which deliberate engineering of living bodies supplies the speculative premise, through
  genetic design or medical nanos operating within the body, and the changed lives that follow. Genetic engineering retains
  its existing gene-design partition; Nanomedicine fiction covers medical nanos operating within bodies. The defining
  intervention across a whole fiction decides when both occur. Not industrial nanotechnology, external swarms or merely
  external machinery.

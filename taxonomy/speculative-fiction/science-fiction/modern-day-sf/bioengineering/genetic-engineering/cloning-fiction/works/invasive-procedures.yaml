id: invasive-procedures
title: Invasive Procedures
authors:
- Orson Scott Card
- Aaron Johnston
first_published: 2007
canonical_genre: cloning-fiction
placement_status: accepted
placement_rationale: 'Root-down rewalk,25November2026: Speculative fiction > Science fiction > Modern day SF > Bioengineering
  > Genetic engineering > Cloning fiction. Full critical plot https://www.kirkusreviews.com/book-reviews/orson-scott-card/invasive-procedures/
  and creator opening https://www.aaronwjohnston.com/writing/invasive-procedures/ read, with complete plot corroboration https://en.wikipedia.org/wiki/Invasive_Procedures_(novel).
  Scientific viruses, organ transplants and memory chips, no established magic or invented fantasy realm. No actual temporal
  travel in the plot. Historical fails contemporary Human Genome Project aftermath; Futurist tested against reviewer near-future
  label but recognizable present institutions and Los Angeles street life in creator opening decide Modern day, unlike an
  established transformed future civilization. The speculative premise is deliberate gene work remaking living people, so
  Bioengineering wins over ordinary technical crisis thriller or a rigorous research-only reading. Nanomedicine fails because
  the defining agent is a patient-specific virus rewriting DNA, not nanos. Futurist Copied minds is a mechanism rival for
  personality chips but fails the present-day ancestor and underweights the genome/organ reconstruction as a combined copying
  procedure. Within Genetic engineering, Genetic caste is a real rival because Galen makes Healers with extraordinary strength,
  speed, senses and saliva-mediated enslavement. But the central scheme and climax are five replacement young Galens: kidnapped
  bodies genetically rewritten into his genome after organ transplantation, with his recorded memories downloaded over their
  original personalities. Hartman himself becomes a Galen-in-waiting, and the original Galen dying does not end the threat.
  The copies, not a stable designed social class or hereditary hierarchy, govern the distinctive premise and final conflict.
  Thus Cloning fiction takes genetically reconstructed duplicates even though grown replacements are not produced by ordinary
  embryo cloning, consistent with the existing leaf definition of gene work making copies. Hard genetic SF loses to thriller
  escape and confrontation rather than the research problem itself. Wobble: engineered Healers and infectious mind control
  occupy substantial plot, but copying the villain is not an incidental gadget, it is his central plan and the endgame. Individual
  correction under owner grant phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX during mandatory Genetic caste destination audit for Need
  intake. One existing book retained, no structural action.'

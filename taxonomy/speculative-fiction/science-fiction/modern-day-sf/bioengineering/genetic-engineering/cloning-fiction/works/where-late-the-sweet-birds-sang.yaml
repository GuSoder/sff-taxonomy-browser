placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern-day SF > Bioengineering > Genetic engineering
  > Cloning fiction. After environmental and social collapse, one valley family survives by cloning itself, and the novel
  is the clone society against the last individual - the copy is the premise. Locus''s own line (printed on the cover): ''The
  best novel about cloning written to date.'' Hugo Award winner 1977. Not Genetic caste fiction (the gene work makes copies
  of the same people, not a designed kind), not Apocalyptic fiction (the collapse is the setup; the famous subject is the
  clone society). Standalone, first published 1976 (the queue''s 1998 is a reissue year).'

definition: 'Genetic engineering in which the premise is the genetic science itself, worked as research: a mechanism of inheritance,
  a discovery about chromosomes or genes, a virus that rewrites how traits are shuffled, and what the finding does to the
  lab, the career and the society that must live with it. The science is the subject, not a copy or a designed kind of person.
  Not Cloning fiction, where the gene work makes copies, and not Genetic caste fiction, where it makes a designed kind of
  person and a divide between the modified and the unmodified.'

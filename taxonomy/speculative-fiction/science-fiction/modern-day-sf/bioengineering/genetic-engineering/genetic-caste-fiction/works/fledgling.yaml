placement_rationale: 'Root-down correction 2026-10-29: Speculative fiction > Science fiction > Modern-day SF > Genetic engineering
  > Genetic caste fiction. Complete standalone Fledgling, not just openingamnesia: Shori is a living Ina-human geneticexperiment
  engineered to tolerate daylight through humanmelanin; pureblood Ina families attack and murder her relatives to eliminate
  that hybridkind, and the CouncilofJudgment resolves their racialpurity violence. The engineeredkind and unmodifiedspecies
  hierarchy cause the whole conflict. Literal biology, venomdependence, geneticexperimentation and symbiosis explain vampiric
  traits rather than supernatural undead magic, so old Fantasy > Vampireworld > Oldfangs root was wrong despite vampirefamilies/laws.
  Recognizable present WashingtonState/California means Modern-day SF; not Futuristposthumanism/Alteredflesh simply because
  bodies altered. Geneticengineering > Geneticcaste: a designedhybridperson and exclusionbyancestry, not copiedpersons (Cloning)
  or researchmechanics as the subject (HardgeneticSF). SociologicalSF is a genuine broad rival due dependentcommunities and
  consent, PsychologicalSF due amnesia/identity, but engineeredkind and racialrank are the specific causal premise. Author/publisher
  synopsis and PW independently confirm geneticmodification; Atlantic fullreview confirms familykilled to halt experimentation
  and hybridstrength/socialpower. Wholeplotnotfirstvolumeproxy. All book/cover/year metadata unchanged, no structural/definitionchange.
  Individualmove authority phonemsg-01M63B6PTVDTX8TZVYPSWGTJGP. Sources: https://www.octaviabutler.com/fledgling ; https://www.sevenstories.com/books/4334-fledgling
  ; https://www.publishersweekly.com/9781583226902 ; https://www.theatlantic.com/books/archive/2022/02/fledgling-octavia-butler-reissue-consent/621420/
  ; https://en.wikipedia.org/wiki/Fledgling_(Butler_novel) .'

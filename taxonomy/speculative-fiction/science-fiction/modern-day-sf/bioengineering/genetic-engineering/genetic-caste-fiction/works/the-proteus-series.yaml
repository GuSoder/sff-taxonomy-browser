placement_rationale: 'Root-down walk: near-future Solar System where biology is remade, so Modern-day; Genetic engineering;
  Genetic caste fiction (designed kinds of person and the hierarchy that follows). Sources: Wikipedia (Proteus in the Underworld,
  1995, ''set in the same universe as Proteus Unbound (1989) and Sight of Proteus (1978)''; Form Change tanks let people modify
  physiology and appearance, from treating defects to fusing bodies; colonies run by fanatics adopt forms such as giant Fugates
  grown for brain size, a fiefdom where appearance marks status, and kangaroo-like surface forms for Mars; the ability to
  form change has become the definition of humanity and infants who fail the Humanity Test are euthanised; Sondra Wolf Dearborn
  of the Office of Form Control and the retired expert Bey Wolf uncover that Trudy Melford of BEC rigged false positives to
  undermine the test after her own son failed it, and that Logians financed Mars terraforming to stop human speciation; isfdb
  series page confirms the three titles and years 1978, 1989, 1995). Body design makes kinds of people and the test makes
  heredity into rank, so Genetic caste fiction, not Hard genetic SF (the biotech is the backdrop, the plot is a conspiracy
  and a detective-style inquiry) and not Cloning fiction. Wobble: I read only the Proteus in the Underworld article in full;
  the earlier two books are placed on the shared-universe rule and the isfdb series listing, not on their own plot summaries.
  Years: 1978, 1989, 1995.'

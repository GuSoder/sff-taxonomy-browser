placement_rationale: 'Root-down: the story is set in recognizable contemporary America; Kirkus and the Guardian ground a secret
  government-backed experiment on Cainland''s Black residents, administered injections, an implanted/engineered fungal parasite
  and Vern''s resulting superhuman healing, strength and exoskeleton. That passes Science fiction -> Modern day -> Genetic
  engineering because deliberate reconstruction of a human body through an experimental living organism drives the revelation.
  Gothic hauntings and cult horror are the mode; the biological experiment is the explanatory engine.'

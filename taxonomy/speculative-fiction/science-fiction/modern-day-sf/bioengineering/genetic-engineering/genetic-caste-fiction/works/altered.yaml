placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Bioengineering > Genetic
  engineering > Genetic caste fiction. Three novels, one Altered shared universe. Recognizable contemporary American
  farms, motels, phones and towns, not a future regime, past era or time travel. Flashbacks recover suppressed memories,
  not movement between moments. Author and publisher expressly name genetic alteration; naturally human subjects
  are engineered into superior, slow-aging soldiers and controlled as Branch units. Book1 exposes Operation ALPHA,
  imposed commander attachment and humans treated as proprietary assets; book2 follows further alterations, programmed
  attacks, rescue and resisting control; book3 follows Nick and Elizabeth confronting the continuing experimental
  program and its remnants. The designed kind and forced enhancement/control, not society-wide hereditary classes,
  satisfy the existing leaf definition. No claim of an openly stratified national caste system. Cloning fails: these
  are modified existing people, not copies. Hard genetic SF fails: research mechanisms are not the subject. Nanomedicine
  fails: genetic alteration, not medical nanos, is the stated defining intervention. Spytech is a genuine rival
  because covert missions, agents, files and assassins govern much action, but the body-remaking and enforced command
  relationship are what these missions are about; not essentially mundane near-future gear. Psychological SF is
  a genuine rival for amnesia, identity and trauma, but these are consequences of the engineered soldiers and Branch
  control, continuous across all three novels. Superhero fiction is less exact than unwilling manufactured operatives
  fleeing their owners. Pseudoscience/Psi does not follow merely because a critic calls the genetics implausible:
  no primary parapsychology or cryptozoology premise. Romance remains important across Anna/Sam and Nick/Elizabeth,
  not comic romance. No alien arrival/invasion, shared apocalypse, social dystopia or humorous engine. Moderate-high
  placement confidence against the real Spytech/Psychological rivals. No structural or definition change; Genetic
  caste8->9.'

- Ryan Sear
first_published: 2005
canonical_genre: spytech
placement_status: accepted
placement_rationale: 'Whole-fiction root-down walk2026-11-05: Speculative fiction > Science fiction > Modern day
  SF > Technothriller > Spytech. Paladin of Shadows whole6 novels, publisher series page and ISFDB list: Ghost2005,
  Kildar2006, Choosers of the Slain2006, Unto the Breach2006, A Deeper Blue2007, Tiger by the Tail2013. Ryan Sear
  coauthors6; queue''s Deeper2006 is superseded by Baen2007 and bibliography. Ghost is publisher''s collected novel
  and continuing sequence opener despite its three episodic sections; no standalone excerpts/advance reader copies/bundles
  count as extra novels. All6 separate publisher plots and Rosboch finished-book reviews read:1 college kidnapping
  rescue followed by nuclear-terror plots and entry into covert contracting;2 buying Georgian valley/caravanserai
  and building the Keldara militia against Chechen raids;3 Balkans trafficking rescue exposing high-level political
  complicity;4 extracting a scientist and extraordinary bioweapon from Chechnya amid a major battle and personal
  Rite conflict;5 bereaved Harmon and his people drawn into VX smuggling in Florida/Bahamas;6 pirate training in
  southeast Asia uncovers stolen nuclear components leading into Myanmar politics. This is not excluded as merely
  conventional military adventure on the strength of the opening book''s lack of obvious SF. Primary Baen Unto Breach
  chapter11 explicitly describes Katya as a science-fiction super-assassin: implanted combat-chemical system, video/audio
  connections in her brain and poison glands in her nails, introduced for the preceding Balkans operation; chapter12
  explicitly establishes an invented genetically modified smallpox weapon, vaccine-proof, lethally contagious for
  days and long-lived without a host. These source-read premises settle speculative content rather than broad catalogue
  SF tags or Ringo''s usual genre. Keldara''s unusual biology in chapter1 is additional texture, not the only admission
  proof. Science fiction rather than Fantasy: explained engineering, biological modification and tactical equipment,
  no demonstrated working Norse magic despite pagan belief and evocative names. Historical SF fails contemporary
  post-Soviet counterterror world; Atemporal fails anchored Earth geopolitics. Futurist''s hard-science/space/alien/far-society
  routes do not govern: no rigorous world-model/engineering puzzle, extraterrestrial society or fully extrapolated
  future social order. Modern-day''s recognizable present is appropriate here, and its Technothriller child expressly
  includes present-day or near-future essentially mundane worlds; technical exaggeration/advanced gear does not
  force speculative far-future framing. The military thriller world is otherwise recognizable Georgia, Russia, US
  and southeast Asia. No evidenced time travel or alternate-world passage; divergent political details alone do
  not make alternate history the story. Within Modern-day, Apocalypse containment/Genetic engineering are serious
  rivals for the engineered pathogen and Katya, but one shared fiction cannot be split by novel and their primary
  role is target and operative tools, not a biological experiment or actual global die-off. Social dystopia, Superhero
  and Psionics do not describe this deniable counterterror contracting sequence. Technothriller is explicitly attested
  by Baen''s Ghost/Choosers framing and matches the extensive tactical/technical detail and enhanced-agent/WMD stakes.
  Spytech7 over Technocrisis: covert operations, intelligence handlers, espionage, arms/bioweapon theft, infiltration
  and deniable rescue are the mechanism; no high-tech infrastructure system under a cascading operational crisis
  governs all6. Infowar''s crypto/surveillance/media leaves catch intelligence methods but no decisive information
  technology defines the series. Wobble substantial: most pages are military action, militia building, sexual wish-fulfillment
  and personal ethics rather than speculative technology; not every novel separately supplies a futuristic device.
  Whole-fiction continuity plus explicit enhanced-agent technology in the central ongoing team, and counterterror
  operations with high-tech threats, make the existing Spytech definition honest without widening it. Covert strike
  units/Army/Spec-ops in the space branch cannot bypass their parents just because combat is prominent. Fiction
  card includes all6 and both authors; Sear only book6. No new genre, no changed definition. Six distinct English
  Baen front jackets visually checked and localized; five are low-resolution publisher thumbnails158-160x240, while
  Unto Breach uses the larger verified primary-sample jacket. No audiobook, animation, collection or eARC treated
  as extra novel.'

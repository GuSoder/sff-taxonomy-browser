placement_rationale: 'Root-down: Science fiction > Modern day > Technothriller > Spytech. A quantum-mechanical anomaly makes
  CIA operative Nat Morgan disappear from memories and digital records after a minute; a quantum-chip theft draws him and
  ex-FSB agent Yelena into stopping a probability-controlling supercomputer. Recognizable near-future espionage, enhanced-operative
  tradecraft and intelligence theft govern, within Technothriller’s explicit near-future allowance. Not psi: the premise is
  explicitly quantum-mechanical. The scientific idea sustains a Bond-style spy thriller rather than rigorous world-model recognition;
  the AI is the mission’s antagonist, not the central study of machine minds. Humor supports the thriller. Future prediction/control
  is not time travel. One novel, originally self-published in 2011 and substantially expanded for Baen ebook publication in
  December 2015 and paperback in January 2016; revisions are not separate volumes.'

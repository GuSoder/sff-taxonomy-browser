placement_rationale: 'Root-down split walk 2026-11-04: Speculative fiction > Science fiction > Modern day SF > Technothriller
  > Infowar > Surveil thriller. Halting State and Rule 34 stay one fiction: network crime and espionage in the first,
  profiling and behavioural manipulation by AI in the second. Wobble substantial: the first also fits compromised-information

placement_rationale: 'Walter Jon Williams''s Dagmar Shaw sequence (This Is Not a Game 2009, Deep State 2011, The Fourth Wall
  2012; the author''s site, Orbit, Publishers Weekly): Dagmar Shaw designs alternate reality games played by thousands across
  the real world, and in each book that distributed crowd intelligence is turned on a real crime, a networked revolution against
  a repressive regime, or a multibranched film conspiracy. Walk: Speculative fiction > Science fiction > Modern day > Technothriller
  > Infowar (information and crowds are the weapon). Rejected: Spytech (no enhanced operatives), Technocrisis (no system breach),
  Cyberpunk. Wobble: low-medium; PW calls the near-future frame sedate, so the speculation is thin but present. Sources: author
  site, Orbit, PW; not read in full.'

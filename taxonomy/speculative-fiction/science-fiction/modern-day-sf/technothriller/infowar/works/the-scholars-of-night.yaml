placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern-day SF > Technothriller > Infowar. A contemporary-at-writing
  Cold War thriller (1988), not future-Earth worldbuilding, literal historical fantasy or time travel: the Marlowe strand
  is a reconstructed old espionage puzzle. Locus describes stolen computer hardware/software able to manipulate official communications
  and risk WWIII, while Hansard''s codebreaking and document analysis oppose WAGNER''s collection of the device. Information
  is the weapon, not an enhanced operative''s gear (Spytech) or a failing system (Technocrisis). Strong scope wobble disclosed:
  SFcrowsnest calls it straight non-SF espionage; Nerds of a Feather calls the speculative technology thin but present at
  publication; Locus places it in broad fantastika. It fits our expressly mundane present-day Technothriller gate, whose existing
  Infowar tenants include Cryptonomicon and Pattern Recognition. Do not claim supernatural Marlowe, time travel or a literal
  alternate Elizabethan world. First published 1988; the 2021 queue entry is a reprint. Standalone.'

placement_rationale: 'Standalone novel (2014). Near-future (c.2030) thriller: ex-sniper turned novelist Jack Daley is blackmailed
  into an assassination by an unseen employer who tracks him everywhere through the surveillance grid - cameras, credit records,
  chipped money, untraceable calls - as he and his girlfriend run off-grid (Locus/Letson review; The Tech calls it a near-future
  SF story of the dangers of a surveillance state). Technothriller umbrella (present-day/near-future thriller built around
  technology in a mundane world) -> infowar: information and surveillance are the weapon, matching tenants like Little Brother
  and The Halting State novels. Rejected: spytech (no intelligence-service operative craft as engine), technocrisis (no high-tech
  system in crisis), algorithmic-surveillance-dystopias (a personal pursuit thriller, not a societal dystopia portrait).'

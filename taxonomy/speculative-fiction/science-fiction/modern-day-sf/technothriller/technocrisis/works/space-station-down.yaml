placement_rationale: 'Root-down walk: near-future ISS, so Modern-day; Technothriller; Technocrisis. Sources: Tor Publishing
  Group page and Publishers Weekly review (Space Station Down, Bova and Doug Beason, Tor 2020): a space tourist and an extremist
  cosmonaut kill the ISS crew and plan to crash the station into New York; the lone survivor, astronaut Kimberly Hadid-Robinson,
  barricades herself while the US president weighs destroying the station and her ex-husband Scott works the ground side;
  PW calls it a Die Hard and Apollo 13 mash-up. Wobble: a terrorist hijack, so Spytech (counterterror conspiracies) is the
  cousin; placed on the crisis around a failing station and the clock to impact, not on covert tech operations. PW is negative
  on quality, not relevant to placement. Year 2020.'

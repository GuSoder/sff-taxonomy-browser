placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Alien invasion fiction > Alien infiltration
  fiction. Per Wikipedia and Baen: a lone alien cyborg (a Troll) survives on 21st-century Earth, hidden, and works from within
  by planting racial hatred in the minds around it, while a Navy SEAL and a wounded human marine from a time-travelling war
  hunt it down before it can enslave humanity. Not Alien conquest (no open fleets or armies take the planet) and not Alien
  arrival (the story is the hidden hunt, not the first meeting). Soft call: it is also a time-travel war story and the aliens''
  arrival is open at the start; the Troll''s covert influence is the engine. Date: Wikipedia gives January 1999, the intake
  list says 2000.'

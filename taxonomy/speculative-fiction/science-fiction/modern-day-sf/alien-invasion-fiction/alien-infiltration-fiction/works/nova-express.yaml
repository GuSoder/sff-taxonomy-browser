placement_rationale: 'SFE burroughs_william_s: Nova Express brings sf metaphors into luridly exemplary perspective - the "Nova
  Mob", galactic gangsters who are taking over our planet, fought by the Nova Police; images of space flight and biomorphic
  horror abound. An extraterrestrial occupation of Earth, told through cut-up technique, makes Alien invasion fiction closest.'

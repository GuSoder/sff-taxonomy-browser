placement_note: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Alien invasion fiction > Alien
  infiltration fiction. Per Publishers Weekly (publishersweekly.com/9780765320148): a near-future page-turner amalgamating
  apocalyptic SF, police procedural and ''thematic dashes of alien invasion and vampire mythos'' - Manhattan a radioactive
  wasteland, plague quarantine zones, and detective Tom Wilner entangled in ''a race of godlike hominids and a looming
  alien invasion''; the Tor/Amazon blurb centers ''two warring ancient races - beings that have been manipulating
  power and control on Earth for centuries.'' Kirkus on The Double Human (2010): the same war-ravaged world, Wilner
  hunting a killer who is stronger and faster and ''may not even be human''. Two hidden nonhuman races manipulating
  Earth for centuries, uncovered by a cop: the leaf''s ''conquest by ... a hidden criminal hand ... the discovery
  of what has already happened''. Rejected: Alien conquest fiction (no open takeover - the invasion is only looming,
  the races stay hidden), technothriller and other recognizable-present branches (the world is 20+ years ahead and
  broken; leaf precedent the-wormwood-trilogy (2060s Nigeria) sets this leaf by mechanism, not date), dystopian/post-holocaust
  branches (disease, dirty bombs and German resurgence are backdrop; the engine is the hidden races), vampire-cop/urban
  fantasy (PW''s ''vampire mythos'' is a dash; Tor publishes it as SF with godlike hominids and aliens), space-cop
  (Earthbound). Duology ONE card: The Human Disguise 2009, The Double Human 2010 (Tor); James O''Neal is crime novelist
  James O. Born (Kirkus). Sources: PW, Amazon/Tor blurb, Kirkus; not read in full.'

placement_rationale: 'Ringo''s Troy Rising (Live Free or Die 2010, Citadel 2011, The Hot Gate 2011; the queue holds Live Free
  or Die, its second edition, The Hot Gate and the Troy Rising omnibus): the Horvath came through the Solar System''s gate,
  announced ownership by dropping rocks on three cities and have held Earth as a fiefdom ever since, with control of the orbitals;
  Tyler Vernon sets out to free the world, using off-world technology and building Troy, a vast battlestation (Simon & Schuster).
  Walk: Science fiction > Modern day > Alien invasion fiction > Alien conquest fiction > Fallen Earth (the invaders won and
  hold the planet; the story starts under that rule). Rejected: Warzone Earth (no contested ground war for most of the book)
  and Space armada (the fleet comes late). Wobble moderate: the second half is building a battlestation and fighting in space,
  so Techno-fiction in space or Space armada are the alternatives, and the book arguably leaves Earth behind.'

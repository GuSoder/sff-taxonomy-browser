definition: 'Alien conquest fiction in which the invasion and humanity''s defeat are the main story: human arms fight and
  lose, the war is unwinnable and its defeat is the story. Not Occupied Earth (settled alien rule as the stage), not Earth
  resistance (an organized human fight drives the story). Split of Fallen Earth at ten cards, 2026-10-25, by what the human
  fight amounts to (curator steering phonemsg-01M5SJ810R3B47WBVC8M20T9AY: "2 works, 3 I would prefer Earth resistance, 1 I
  don''t get"; Earth resistance his rename; Fall of Earth his coinage, phonemsg-01M5SJ95G1MM6326PNVMBC10J7). The umbrella
  keeps the name and portrait; the three leaves hold the cards.'

placement_rationale: 'Tanith Lee''s Days of Grass (DAW, 1985; Penguin Random House description and ISFDB): after the fall
  of humanity the free humans live underground like rats, fearing the open sky and the striding laser-armed machines from
  space; Esther dares the surface, sees the Enemy and is taken captive to a vast, empty alien city of non-Earth science, where
  she does not know what they want of her, and an alien man with a hold of magic over her comes to her. Walk: Science fiction
  > Modern day > Alien invasion fiction > Alien conquest fiction > Fallen Earth (the invaders have won, the planet is ruled
  by them, and the story is survival and accommodation under alien rule). Tried: Warzone Earth (no war is still being fought)
  and Alien extraction (the aliens rule, they do not quietly harvest). Wobble: post-apocalyptic leaves are the alternative,
  since the story is as much a dystopia of the survivors; I read the publisher description only.'

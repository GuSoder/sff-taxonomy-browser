placement_rationale: 'Christopher Anvil''s Pandora''s Legions (Baen, 2002; Baen sells it as the complete novel behind Pandora''s
  Planet): the benevolent but complacent Centran Empire conquers Earth, then finds that Earth, its Pandora''s Planet, is a
  nightmare to hold and an infection to its own empire. Root-down: Speculative fiction -> Science fiction -> Alien invasion
  fiction; the story is an extraterrestrial conquest and occupation of Earth and the human counter-moves, played for satire.
  The occupation, not the humour, is the premise (Kirkus calls it comic, the leaf is set by the invasion).'

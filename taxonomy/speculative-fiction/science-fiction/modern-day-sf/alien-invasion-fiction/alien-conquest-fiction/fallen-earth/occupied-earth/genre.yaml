  to (curator steering phonemsg-01M5SJ810R3B47WBVC8M20T9AY: "2 works, 3 I would prefer Earth resistance, 1 I don''t get";
  Earth resistance his rename; Fall of Earth his coinage, phonemsg-01M5SJ95G1MM6326PNVMBC10J7). The umbrella keeps the name
  and portrait; the three leaves hold the cards.'

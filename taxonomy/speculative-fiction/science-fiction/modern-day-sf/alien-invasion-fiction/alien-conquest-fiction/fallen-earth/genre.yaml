definition: 'Alien conquest fiction in which the invaders have won, or are winning: the cities are broken, the planet is occupied
  or ruled, and the story is survival, collaboration and resistance under alien rule. The war is mostly over or one-sided.
  Not Warzone Earth (there the defenders still fight a real war for the ground).'

placement_rationale: 'Ringo and Lydia Sherrer''s TransDimensional Hunter (Into the Real, 2022, first of the series; the queue
  lists only this volume): Lynn Raven, a gamer who runs her own online persona, is asked to beta test an augmented reality
  game, and the glitches in it turn out to be a real alien incursion, with the players the front line of a war fought on Earth
  (Simon & Schuster/Baen blurb: ''a new SF novel of alien invasion'', ''when the game is life and death itself''; jacket shows
  a visor-clad fighter and monsters on a rail line). Walk: Science fiction > Modern day > Alien invasion fiction > Alien conquest fiction
  > Warzone Earth (the war is still a war and the story is the fight to hold the ground), not Fallen Earth (the invaders have
  not won), not the Cyberpunk LitRPG leaf (the game is the means, the war is the subject; that leaf is for virtual worlds
  as setting). Wobble moderate to high: I worked from the publisher blurb and jacket, not the book, and the war is fought
  through a game. Year 2022, first publication. Queue id MC04800.'

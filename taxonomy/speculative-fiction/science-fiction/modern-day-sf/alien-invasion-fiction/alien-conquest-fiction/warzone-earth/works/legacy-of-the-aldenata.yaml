first_published: 2000
canonical_genre: warzone-earth
placement_status: accepted
placement_rationale: 'Ringo''s Legacy of the Aldenata (Posleen War series; A Hymn Before Battle 2000, Gust Front 2001, When
  the Devil Dances 2002, Hell''s Faire 2003, Eye of the Storm 2009, the Kratman side books Watch on the Rhine, Yellow Eyes
  and The Tuloriad, the Cally''s War trilogy with Julie Cochrane, and The Hero with Michael Z. Williamson): one shared universe,
  so one fiction. Humanity is told of a Galactic Federation at war with the Posleen, a ravening alien horde; the Federation
  sells Earth weapons for a price, and the Posleen then land on Earth itself, where armies, mobile infantry and tanks fight
  a years-long ground war for the planet, the Appalachians and the Rhine (Wikipedia Legacy of the Aldenata; Baen). Walk: Science
  fiction > Modern day > Alien invasion fiction > Alien conquest fiction > Warzone Earth (the war is still contested ground,
  not a fallen world). Rejected: Fallen Earth (the invaders do not hold the planet; the story is the campaign), Alien-war
  grunts (the Posleen are an invasion of Earth, not an off-world war). The Cally''s War books and The Hero are set decades
  and a millennium later in the same universe and fold in by the shared-universe rule. Wobble low.'

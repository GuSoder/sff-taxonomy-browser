placement_rationale: 'Ringo''s Looking Glass series (Into the Looking Glass 2005; with Travis S. Taylor Vorpal Blade 2007,
  Manxome Foe 2008, Claws That Catch 2009; one fiction): a physics experiment at the University of Central Florida destroys
  everything within a mile and opens portal ''looking glasses'' around the world, through which the Dreen, a hostile species
  with slave races, pour onto Earth, spreading a devouring fungus; the army and SEAL teams in powered armor fight them gate
  by gate until a weapon from the friendly Adar closes the gates, and the sequels take the war to the Dreen by warp ship (Wikipedia
  Voyage of the Space Bubble). Walk: Science fiction > Modern day > Alien invasion fiction > Alien conquest fiction > Warzone
  Earth (the invaders are fought on Earth''s ground for the planet). Rejected: Fallen Earth (humanity is not occupied), Space
  armada and Alien-war grunts (the war starts at home, though the sequels leave Earth). Wobble moderate to high: the later
  books are an interstellar hunt for the Dreen, and the portals could suit a gateway leaf.'

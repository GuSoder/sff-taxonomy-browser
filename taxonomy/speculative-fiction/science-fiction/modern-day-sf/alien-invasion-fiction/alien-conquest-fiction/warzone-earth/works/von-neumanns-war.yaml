placement_rationale: 'MC04825 whole Von Neumann''s War2006 source rewalk2026-11-05: Speculative fiction > Science
  fiction > Modern day SF > Alien invasion fiction > Alien conquest fiction > Warzone Earth. Retain existing whole1,
  leaf4 no move/seed. Current publisher+SFE+bibliographies no published sequel verified, opening projected series
  and reviews hopeful continuation not evidence one exists; same Ringo/Taylor coauthors with Looking Glass do not
  prove shared setting. Primary Baen regular page2006, copyright bibliographies differ May/July/Aug marketing dates
  but year stable; no date fabrication. Own finished review Kimmel, Rosboch, Mikal, Nuttall, contemporary technologist
  reader and primary prologue/ch5/ch6 read. Astronomers professional/amateur notice Mars albedo change, failed probes,
  crash Percival reconnaissance mission under NASA/Army/NRO, scientists and militarily trained scientists in Huntsville;
  probes consume metals/replicate and construct launch infrastructure, open Earth invasion reaches France/Eastern
  hemisphere then US, military rear-guard and laboratory disassembly/countermeasures, captured/suborned probes turn
  hopeful tide. Invaders are indifferent self-replicating machines not confirmed conscious conquering species. Original
  note assertion Mars biosphere-killing weapon corrected: publisher says suspected weapon, completed reviews reveal
  mechanical conversion, no original biosphere asserted. No actual human time-travel/parallel Earth crossing or
  psi/magic established. SF rather than Fantasy scientific explanations, no supernatural; recognizable contemporary
  US,NASA,DOD,Iraq/France not developed future society, first experimental response from existing present. Primary
  contract2007, SpaceShipOne/Rutan/spacecamp and commercial Internet present-era frame, not Historical celebration/retro-fiction
  despite elapsed years. Atemporal no cross-era/parallel mechanism. Futurist HardSF is strongest real competitor
  because sustained rigorous spacecraft design/rapid integration/weapon reverse-engineering central, not dismissed
  by title. But science occurs in ordinary-present emergency against open attacking extraterrestrial machinery,
  combined defense plot and threatened human world stronger whole than a specific physics model, orbital operation
  or planetary mission itself. Do not force Orbital mechanics merely first Percival chapters: later terrestrial
  metal-harvesting invasion countermeasures not orbit/spaceflight as sustained subject. Planet science no crew planetary
  expedition/geology/ecology or human-habitable terraforming, machine conversion threat not making planet for life.
  Hard conceptual no rewritten-world model/cognitive experiment; Matter transmission absent central; Otherworldly
  hardSF not unanchored cosmos. Future war technology-transformed Earth campaign close but Modern-day invasion is
  explicit enemy premise and unchanged everyday society, not independent futurist society; MilitarySF spacefaring
  ancestor fails Earthgrounded core despite unmanned Marsprobe. Modern-day Alien invasion vs Apocalyptic cosmic/chemical
  catastrophe: ongoing organized defense against extraterrestrial machines rather than abstract physical cataclysm
  or plague; Firstcontact discovery opening real but no communicative encounter/alien minds main subject, survival
  war governs. Technothriller fails mundane-world premise (alien self-replicators real), bioengineering engineered
  living bodies absent (mechanical swarm not medical nanos), soft/social/comic branches not main engine despite
  jokes. Invasion open by physical force, not hidden bodies/masquerade or replacement. Alien extraction explicitly
  quiet enterprise/talent harvest on Earth''s terms, fails probes public dismantling all infrastructure, no merely
  lexical metal extraction match. Conquest gate force/dispossession fits effects without falsely assigning conscious
  imperial motives: armies contest planet/ground against metal-eating attackers, alien machines taking Earth literally.
  FallenEarth branches substantial one-sided destruction early but not humanity defeat as completed story, occupied
  settled rule or guerrilla liberation after war; defenders still fighting organized science/military response and
  turn tide. Warzone military campaign real but scientists and engineering dominate many sections, openly recorded
  substantial wobble rather than pretending footsoldier exclusive. No new seed required, no gate changes. Original
  English Baen158x240 print front pixel-inspected/localized, lowres disclosed.'

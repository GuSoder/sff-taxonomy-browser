placement_rationale: 'Ringo and Travis S. Taylor''s Von Neumann''s War (Baen, 2006; stand-alone): a weapon that killed Mars''s
  biosphere shows that self-replicating alien probes are staging a swarm invasion of Earth, and scientists and soldiers (the
  ''straddlers'') race to invent weapons against an enemy an order of magnitude more advanced, fighting the swarm on and over
  the planet (Baen eARC page). Walk: Science fiction > Modern day > Alien invasion fiction > Alien conquest fiction > Warzone
  Earth (a contested war for the ground, invaders still being fought, not a fallen world). Rejected: Fallen Earth (humanity
  has not lost) and Alien-war grunts (the war is at home). Wobble moderate: the invaders are machines rather than a conquering
  species.'

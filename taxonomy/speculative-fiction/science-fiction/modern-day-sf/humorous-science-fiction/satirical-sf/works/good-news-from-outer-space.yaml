placement_rationale: 'Standalone novel (Bluejay 1989; the queue''s 2012 is a reprint). Year 2000 America: tabloid reporter
  George Eberhart chases alien contact stories through a millennial culture of televangelists, UFO cults and apocalyptic belief;
  the aliens and near-future absurdities are there to mock how people, institutions and beliefs behave - the joke is aimed
  at us, satirical-sf''s exact gate (Kirkus and contemporary reviews; Nebula nominee). Not Comic adventure SF (no chaos-escape
  engine) and not satirical utopia (no ideal-society frame). Era disclosure: written 1989 and set in 1999-2000, a writer-future
  near-future now past-dated; the fallen-angels tenant (1991 book, 2020s setting, same satirical near-future shape) is the
  standing precedent for this register in the leaf. First published 1989.'

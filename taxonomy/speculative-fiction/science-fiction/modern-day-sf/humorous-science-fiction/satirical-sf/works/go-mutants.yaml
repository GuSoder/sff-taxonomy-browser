placement_rationale: 'Ecco/HarperCollins, July 2010, 368pp novel. An alternate America where the aliens and mutants of 1950s
  B-movies live in the open: J!m, blue-skinned son of a dead disarmament-preaching alien supervillain, survives Manhattan
  High while human intolerance of mutants boils over. Kirkus: a mashup of B movies that is also a sendup of American pop and
  political culture - prejudice, high school, the bomb. The absurd invention mocks how people and institutions behave: the
  joke is aimed at us, the satirical gate. Walk: SF > Modern day SF > Humorous science fiction > Satirical SF. Tried: Comic
  adventure SF (there is a wild ride, but the engine is the mockery, not the escape), Parody leaves on the fantasy side (this
  is SF furniture - aliens, mad scientists, radioactive ape-boys - and the target is society, not a text). Wobble: low-moderate.'

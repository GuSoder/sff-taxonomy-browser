placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern-day SF > Humorous science fiction
  > Satirical SF. One standalone novel, first published in 1991, by Larry Niven, Jerry Pournelle and Michael Flynn.
  The current Baen product''s 2002 date is a reedition, not first publication.


  Whole plot: isolated orbital habitats need atmospheric nitrogen. A scoopship is shot down, leaving two astronauts
  stranded on a cold, anti-technology Earth. Science-fiction fans rescue them, evade the authorities and smuggle
  them across the country. A museum Titan cannot provide escape; the fans instead recover and fuel the Phoenix spaceplane.
  Chapter 20 rejects a violent last stand and completes the launch. Chapter 21 shows the spaceplane landing in Grenada
  and plans another orbital trip. The government is not overthrown.


  Satirical SF is the best fit. The publisher''s legal acknowledgment explicitly calls the society satirical. Independent
  whole-book reviews describe the humorous plot, political caricature, fandom jokes and fan-convention culture.
  Institutions, ideological certainty and fannish self-myth are recurring targets across the rescue journey, not
  incidental quips. Comic adventure SF is a real rival, but institutional ridicule is more distinctive than escapade
  chaos. Rom-com SF fails because courtship does not organize the comedy. The existing Humorous SF mode exception
  admits future-set books despite its Modern-day parent; no definition is being changed.


  Orbital mechanics (6 fictions) is the strongest subject rival. Scoop velocities, freefall adaptation, microwave
  warming, scarce volatiles, liquid oxygen/hydrogen, inertial guidance and rendezvous constraints materially shape
  the rescue. These are substantial, not dismissed to manage a shelf count. Still, the whole novel is a satirical
  fan rescue and road adventure rather than sustained physics-first problem solving. Author reputation alone does
  not establish Hard SF. Its disputed climate premise is fiction, not endorsed climate science.


  Dystopian rebellion (9) is another genuine rival: an established coercive state, police pursuit and an underground
  resistance. It loses because the central goal is rescue, escape and renewed space access, not bringing down the
  regime. The ending explicitly avoids a last stand. Orwellian propaganda, state control, class control and assimilation
  resemble parts of the coercive society but do not outweigh the sustained comic rescue. Huxleyan control fails
  because manufactured pleasure and willing consent are not the engine.


  Climate tyranny (1), Climate breakdown (2), Displacement (3) and Climate class divide (5) each catch real features:
  criminalized energy use, advancing ice, forced journeys and separated orbital survivors. None describes the whole
  novel as closely. The plot is not primarily necessary rationing, climate migration, enclave inequality or rebuilding
  after catastrophe. Ruined Earth and post-holocaust routes similarly overvalue the backdrop. The principal arena
  is an Earth road journey, not colony civic life, interstellar adventure or space war. Comic space fiction (9)
  loses on that arena, not to avoid a tenth card. Planetary science, matter transmission and conceptual hard SF
  lack the defining engine.


  Historical SF and alternate history fail: this was a near future at publication, not a deliberate closed-period
  setting or a specified historical divergence. Its old communication technology does not retroactively make it
  historical SF. Time travel, parallel worlds and fabulation fail: references to real fans and SF books are not
  literal world crossing or authored-reality mechanics. Fantasy fails because there is no demonstrated magic; the
  title''s angels are astronauts.


  Corpus: the current canonical ISFDB record 988116 lists no series. SFE discusses Fallen Angels separately from
  Dream Park and The Descent of Anansi. Nicoll disputed an older ISFDB grouping; that catalog complaint is not evidence
  of a shared universe. No other novels are merged. Research used legal chapter 1 and chapters 19-21 plus independent
  whole-plot reviews, not a claimed complete front-to-back reading. Moderate-high confidence. Ordinary placement,
  Satirical SF 5 to 6. No seed, split, definition change or existing-card move.'

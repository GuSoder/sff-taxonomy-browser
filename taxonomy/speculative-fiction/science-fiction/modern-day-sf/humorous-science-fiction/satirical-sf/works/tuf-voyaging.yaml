placement_note: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Humorous science fiction > Satirical SF. Trader Haviland Tuf inherits the Ark, last seedship of Earth''s Ecological Engineering Corps, and travels world to world solving - or imposing solutions on - colonies'' ecological disasters: a population hooked on procreation, a dictator unleashing plagues (georgerrmartin.com). A darkly comic meditation on environmentalism and absolute power (Wikipedia): the absurd invention mocks how institutions and beliefs behave - satire aimed at us (The Sirens of Titan, The Cyberiad are the shelf). Fix-up novel with bridging material, one continuous protagonist - The Martian Chronicles precedent makes fix-ups eligible. Wobble: Comic adventure SF (the episodes are escapades), but the joke is aimed at society, not the ride.'

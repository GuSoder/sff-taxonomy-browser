definition: 'Humorous SF in which the comedy runs on satire: the story uses its absurd invention, alien or machine to mock
  how people, institutions and beliefs behave. The joke is aimed at us. Not Comic adventure SF (comedy of chaos and escape)
  and not Rom-com SF (comedy of falling in love). Split of Humorous science fiction at ten cards by what the comedy runs on
  (curator "Approved", phonemsg-01M5EV70ETPXKW42PWESME4A2E, 2026-10-21 11:03 AM).'

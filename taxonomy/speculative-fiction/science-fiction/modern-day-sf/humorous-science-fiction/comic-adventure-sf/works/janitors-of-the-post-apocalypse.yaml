placement_rationale: 'Root-down walk: Speculative fiction > Science fiction > modern-day-sf > Humorous science fiction > Comic
  adventure SF. The Krakau came to Earth after a plague turned most humans feral; Marion ''Mops'' Adamopoulos, head of a spaceship
  Health and Sanitation crew, and her janitor team get pulled through a zombie plague, alien conspiracies and galaxy-saving
  escapades across three novels (author site; PRH series page; Locus bestseller). Comic-adventure gate is exact: the comedy
  runs on adventure - ordinary people through a ridiculous fast-moving escapade of aliens, monsters and cosmic accidents (sibling
  tenant: Hitchhiker''s Guide). Not Satirical SF (the joke is not aimed at society) and not Rom-com SF (no romance engine).
  Complete eligible corpus: 3 novels (Terminal Alliance Nov 2017, Terminal Uprising Feb 2019, Terminal Peace Aug 2022, DAW;
  author''s bibliography page lists exactly these three; queue year for book 1 said 2018 - actual 2017). No novellas in scope.'

id: the-complete-roderick
title: The Complete Roderick
authors: [John Sladek]
first_published: 1980
canonical_genre: humorous-science-fiction
placement_status: accepted
placement_rationale: 'Root-down: Science fiction -> Modern day -> Humorous science fiction. SFE says the two texts were conceived as one novel and presents the complete tale as the autobiography of a robot with Candide-like innocence; SFE also identifies Sladek as a major satirist. The robot is the innocent observer through which contemporary America is exposed, so satire is the engine. Robots and AI fails its Futurist/Future-of-Earth gate.'

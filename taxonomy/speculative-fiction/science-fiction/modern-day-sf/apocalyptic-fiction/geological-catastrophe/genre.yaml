definition: 'Apocalyptic fiction in which the ground itself turns: a supervolcano erupts, the crust breaks, the earth shakes
  the world apart. Ash winter and famine may follow, but the cause is geological. Not Cosmic catastrophe (the disaster falls
  from the sky), not Climate catastrophe (weather and the elements turn against civilization), not Chemical catastrophe (matter
  itself).'
status: accepted
ruling: 'Seed approved by the curator ("Approved", phonemsg-01M4K9EQZV2MMQ5HJVYYA9H99V, 2026-10-10 6:13 PM CEST) on the intake''s
  "Approve seed?" question for Harry Turtledove''s Supervolcano. Climate catastrophe was the runner-up (it splits by the element
  that turns: water, dryness); the ash winter is a consequence, the cause is the ground itself.'

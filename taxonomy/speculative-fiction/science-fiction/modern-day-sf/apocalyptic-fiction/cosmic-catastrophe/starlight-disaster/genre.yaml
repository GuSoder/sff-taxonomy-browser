definition: 'Cosmic catastrophe in which the light of a star turns on the Earth: a supernova''s radiation, a sun gone dark, an orbit thrown so that the sun''s heat becomes lethal. The story is the sky''s light and heat failing or flooding the world. Not Impact disaster (nothing falls on the Earth) and not Tidal disaster (the harm is light, not gravity). Split of Cosmic catastrophe at ten cards by what the sky sends (curator named the four children himself (phonemsg-01M5CZTXG4M5G19SJWJJQXY7HN, 2026-10-20 5:45 PM; Impact / Starlight / Replicator from phonemsg-01M5CZN09W723PBSR3VASYCZ4G, Tidal added by him)).'

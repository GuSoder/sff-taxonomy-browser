placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Apocalyptic fiction > Cosmic catastrophe.
  A double black hole system, Taraxippus, passes through the Solar System and throws Earth onto a more elliptical orbit, so
  that perihelion summers become deadly; Matt and his friends build the Mandjet, a boat with a self-sustaining ecosystem,
  and sail with a flotilla as the world burns and freezes (Wikipedia plot summary; Locus review: ''a description of how wrong
  things can go and how fast''). Disaster that falls out of the sky and the survival that follows is the leaf''s definition.
  Rejected: Post-nuclear and other survival leaves (the cause is cosmic, not human), Climate dystopias (the climate is only
  the effect). Wobble: light. 2019.'

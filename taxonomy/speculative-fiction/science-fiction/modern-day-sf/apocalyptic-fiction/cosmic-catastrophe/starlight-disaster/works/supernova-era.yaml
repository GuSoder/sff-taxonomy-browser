placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day
  SF > Apocalyptic fiction > Cosmic catastrophe. A star eight light-years away dies
  and its radiation showers Earth; within a year everyone over the age of thirteen
  will die, parents apprentice their children to pass on the knowledge needed to
  keep the world running, and the last generation inherits and reshapes the world
  (publisher copy, torpublishinggroup.com). The disaster falls from the sky - the
  star''s death is the sky-disaster whose terms (the countdown, the apprenticeship,
  the emptying) set the story''s engine. Rejected: die-off (pandemic cause only),
  power-inversion-dystopias (the children''s rule follows a catastrophe rather than
  a power flip inside an intact society), childless-dystopias (inverse premise).
  Wobble: moderate; the back half lives in the children''s world-building (war
  games as real wars), placed by the triggering engine with Lucifer''s Hammer as
  the aftermath-heavy precedent on this shelf. Tenth fiction: the leaf freezes at
  10 (SPLITTING.md); a split proposal is owed. First published in Chinese January
  2003 (five drafts from 1989, ISFDB); English translation by Joel Martinsen, Tor 2019.'

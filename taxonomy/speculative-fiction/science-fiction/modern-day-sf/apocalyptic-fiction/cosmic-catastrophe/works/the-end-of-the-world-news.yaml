placement_rationale: 'Root-down: Science fiction -> Modern Day -> Apocalyptic fiction -> Cosmic catastrophe. SFE grounds three intercut narratives whose future frame escapes Earth just before a wandering planet destroys it. Freud and Trotsky pastiches supply the narrative form, but the active extrasolar collision governs the speculative arc.'

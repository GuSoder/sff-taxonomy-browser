placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Apocalyptic fiction > Cosmic catastrophe.
  McDevitt, 1998, set in 2024: an interstellar comet is found on course to hit the newly opened Moonbase; the comet shatters
  the Moon and the debris endangers rescue ships and people on Earth, while the US vice president who promised to leave last
  stays behind (Wikipedia Moonfall; SFWA synopsis). Disaster falls from the sky and the Moon breaks, which is the leaf''s
  definition. Rejected: Space colonies (the base is evacuated, not lived in), Future of Earth branches (near-future, the catastrophe
  is the plot). Wobble: low to moderate. Plot summaries only, no text read. Aftermath on Earth is secondary to the evacuation,
  which makes it closer to a disaster-rescue story than Lucifer''s Hammer-style collapse; the leaf is the nearest honest fit.
  Years: first publication 1998 (Wikipedia, Open Library first_publish_year 1998); the queue has no year. Queue id MC04081.'

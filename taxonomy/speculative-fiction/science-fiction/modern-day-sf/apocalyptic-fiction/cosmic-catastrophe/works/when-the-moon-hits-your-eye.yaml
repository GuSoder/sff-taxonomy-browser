placement_rationale: 'Scalzi''s When the Moon Hits Your Eye (Tor, 25 Mar 2025; Wikipedia, Tor): the Moon turns to cheese (''Caseus''),
  a billionaire''s unauthorised landing kills him in a geyser eruption, the blast sends a fragment, Lunar One, on a collision
  course with Earth about two years out, and the mostly independent episodes follow ordinary people (a cheese-shop feud, a
  pastor, an ageing musician, a credit-card promotion) living through the countdown until the real Moon returns and the fragment
  vanishes. Walk: Science fiction > Modern day (present-day Earth) > Apocalyptic fiction (the plot clock is a coming extinction-scale
  impact) > Cosmic catastrophe (disaster falls from the sky, the Moon breaks and debris heads for Earth, same as Moonfall
  and Seveneves). Rejected: Humorous science fiction (tone, not subject; the subject decides the branch), Unknown catastrophe
  (the cause is known to be the Moon), Geological and Climate catastrophe, Alien arrival leaves (no visitors). Wobble moderate:
  the impact never happens and the comedy is strong, so Humorous science fiction is the alternative reading. Queue id MC04862,
  first published 2025.'

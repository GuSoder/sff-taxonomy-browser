definition: 'Disaster falls from the sky - the Moon shatters and its debris begins to rain down. Coined by the curator 2026-09-14; not an SFE/EoF headword. Split at ten cards by what the sky sends, into four leaves the curator named himself: Impact disaster (a body hits), Starlight disaster (a star''s light turns lethal), Replicator disaster (machines take the world apart), Tidal disaster (a passing body''s gravity wrecks it).'

definition: 'Cosmic catastrophe in which a body from space strikes or is hurled at the Earth: a comet, a rogue planet, a fragment of the Moon, a made stone. The story is the hit and what it does to the world. Not Tidal disaster (no collision, the damage is gravity), not Replicator disaster (no machines doing the destroying), not Starlight disaster (the harm is a body, not light). Split of Cosmic catastrophe at ten cards by what the sky sends (curator named the four children himself (phonemsg-01M5CZTXG4M5G19SJWJJQXY7HN, 2026-10-20 5:45 PM; Impact / Starlight / Replicator from phonemsg-01M5CZN09W723PBSR3VASYCZ4G, Tidal added by him)).'

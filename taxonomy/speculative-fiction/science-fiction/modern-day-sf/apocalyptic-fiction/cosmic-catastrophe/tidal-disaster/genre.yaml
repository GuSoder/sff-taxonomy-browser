definition: 'Cosmic catastrophe in which the gravity of a body passing close wrecks the Earth: ocean waves, earthquakes, volcanoes, a broken Moon. The story is the pull and the shaking, not a collision. Not Impact disaster (nothing hits the Earth) and not Replicator disaster (no machines taking the world apart). Split of Cosmic catastrophe at ten cards by what the sky sends (curator named the four children himself (phonemsg-01M5CZTXG4M5G19SJWJJQXY7HN, 2026-10-20 5:45 PM; Impact / Starlight / Replicator from phonemsg-01M5CZN09W723PBSR3VASYCZ4G, Tidal added by him)).'

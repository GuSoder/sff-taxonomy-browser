placement_rationale: 'Root-down: Science fiction -> Modern day -> Apocalyptic fiction -> Climate catastrophe.
  A red algal bloom turns airborne into a toxic wind that obliterates living things and empties the coastal
  city; food collapses to a corporate ''pink slime'' (NYT: ''an environmental disaster has unspooled'';
  S&S: ''literary horror and climate fiction''). The climate itself turns against civilization - the leaf
  def; elegiac caregiving, not dystopian social conflict, so not cli-fi-dystopia. English translation
  2024 (original Mugre rosa 2020). Placement freezes the leaf at 10 - golden rule fires.'

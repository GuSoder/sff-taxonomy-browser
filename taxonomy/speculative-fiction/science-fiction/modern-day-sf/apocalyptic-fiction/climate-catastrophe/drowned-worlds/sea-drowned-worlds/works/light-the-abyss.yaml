placement_rationale: 'London Shah''s Light the Abyss duology (The Light at the Bottom of the World, Disney-Hyperion October
  2019; Journey to the Heart of the Abyss, Little, Brown Books for Young Readers 2021; two books, complete per the publisher
  series page and Fantastic Fiction). In 2099, after an asteroid strike, London lies completely underwater and humankind survives
  beneath the sea; sixteen-year-old Leyla McQueen, a submersible racer, enters the London Submersible Marathon to search for
  her missing father through the drowned city, against a quasi-dystopian government (SF Encyclopedia entry ''Shah, London'':
  ''a 2099 London completely immersed after an asteroid strike by the rising oceans''; Kirkus review; hbgacademic.com). Walk:
  Speculative fiction > Science fiction (a dated future after an asteroid strike; technology of submersibles; SF Encyclopedia
  classifies it as near-future YA SF) > Modern-day SF per this branch''s settled practice (Ship Breaker precedent: near-future
  drowned-coast adventure sits here) > Apocalyptic fiction > Climate catastrophe > Drowned worlds > Sea-drowned worlds (the
  sea rises and takes the land: a swallowed capital, people living under the water - the gate verbatim; not Rain-drowned,
  no endless rain). Rejected: Cli-fi dystopia and the dystopia branches (the government is oppressive but the defining, famous
  concept is the submerged London and the undersea adventure, not the social critique - Nov 8 ruling: the defining setting
  the fiction is famous for), YA branches (the tree files by genre engine, not audience). Wobble: low-medium; the father-rescue
  mystery and the regime give it thriller bones, but the drowned city is what every review leads with. One series card (11j);
  queue rows MC06114 (Journey) and MC06115 (Light). THIS PLACEMENT TAKES SEA-DROWNED-WORLDS TO 9: freeze watch. Sources: sf-encyclopedia.com,
  kirkusreviews.com, hbgacademic.com, fantasticfiction.com, goodreads.'

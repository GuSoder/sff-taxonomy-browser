placement_note: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Apocalyptic fiction > Climate catastrophe > Drowned worlds > Sea-drowned worlds. Climate change has raised the oceans and unleashed vast storms; geo-engineers struggle to rebalance the planet, and the story climaxes in a sea battle against two navies (Baen publisher page). The risen sea taking the land is the engine (cover shows flooded city towers). Rejected: Rain-drowned worlds (storms blow, but the land lies under the risen sea). SOFT: a verse epic in form, not prose - verse is not a skip class and the fiction is eligible.'

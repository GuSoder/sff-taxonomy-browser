placement_rationale: 'Kit Reed''s Where (2015; Tor, Kirkus): on Kraven Island on the Outer Carolina Banks the whole town vanishes
  at the hour of an appointment with a developer, Rawson Steele, removed from our space and time to a featureless village,
  and David Ribault searches for Merrill Poulnot and her son. Walk: Science fiction > Modern day > Apocalyptic fiction > Unknown
  catastrophe (a place is cut off and no cause is ever proved). Tried Mystery plague and Cosmic catastrophe (nothing falls
  from the sky). Sources: Tor, Kirkus (Kirkus calls it an underdeveloped paranormal mystery); not read. Alternative: none
  clean.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day > Apocalyptic fiction
  > Pandemic > The die-off. Near-future America: the runaway Wicca virus (Immune Disintegration Disorder)
  has killed most of Earth''s population and climate collapse has parched the land; after marauders
  serving the Hands of God cult slaughter her survivor compound and abduct the young girls, Jessie crosses
  the blasted landscape with her daughter Bliss to storm the cult fortress and bring the children home
  (Harper Voyager/Amazon blurb; Publishers Weekly on Carry the Flame). The mass dying is done and survivors
  inherit the emptied world, with the plague the named killer - the Die-off definition. Rejected: Mystery
  plague (the cause is known and named), Post-pandemic survival (the plot is a rescue strike, not a community
  enduring or rebuilding; The Last Centurion precedent: the plague is the killer, ice-age backdrop rejected
  the same way the climate collapse is here), Wasteland journeys (mixed-cause leaf; here one named pandemic
  cause governs). Wobble: moderate; the road is much of book two. Two published books: Burn Down the Sky
  (2011) and Carry the Flame (2012), one series, one card. Jaros is a pseudonym of Mark Nykanen (publisher
  copy). Sources: amazon.com/HarperCollins blurb, publishersweekly.com, Goodreads; not read.'

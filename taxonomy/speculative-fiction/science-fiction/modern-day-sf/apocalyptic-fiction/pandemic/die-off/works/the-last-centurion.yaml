placement_rationale: 'Ringo''s stand-alone The Last Centurion (2008, blog-style memoir): in the 2010s a mini ice age and a
  mutated bird-flu plague strike together; Army officer ''Bandit Six'' and his Stryker company, left in Iran, march home like
  Xenophon''s Ten Thousand and help rebuild farming and retake an American city (Wikipedia, Simon & Schuster, ISFDB). Root-down:
  Science fiction -> Modern day -> Apocalyptic fiction -> Pandemic (civilization ends by plague) -> The die-off (most of humanity
  dies in a short span and the survivors inherit the emptied world), not Zombie apocalypse (the dead are not turned) or Mystery
  plague (the cause is known). Considered Climate catastrophe (the ice age) and rejected: the plague is the killer. Wobble
  moderate. Cover: Baen jacket.'

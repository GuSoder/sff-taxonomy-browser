placement_rationale: 'Walk: Speculative fiction > Science fiction > Modern-day SF > Apocalyptic fiction > Pandemic > The
  die-off. In 2032 an engineered prion pandemic destroys most of humanity; the survivors pass through a shamanistic
  metamorphosis into short-lived shapeshifting ''Werfolk'', and the novel follows the emptied world across three decades
  (SF Site review). Mass dying and the world after - the leaf''s definition. Rejected: Mystery plague (the cause is known:
  modified prions), Zombie apocalypse (the afflicted transform but are not the turned dead). Wobble: moderate; a
  parallel-universe crossing frames the story (the narrator crosses from our universe into the plague''s). Year: 2002 (Ace).
  Queue id MC03870.'

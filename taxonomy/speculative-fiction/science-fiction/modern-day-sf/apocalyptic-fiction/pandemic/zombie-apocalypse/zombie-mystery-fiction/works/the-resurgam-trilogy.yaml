placement_rationale: 'One fiction (rule 11j): the Resurgam Trilogy - Dust (Ace 2010), Frail (Ace 2011), Grave (Candlemark
  & Gleam 2014); SFE Turner entry and publisher page confirm the trilogy. Root-down: Speculative fiction -> Science fiction
  -> Modern-day SF (present-day Indiana: car crash, road checkpoints, small towns) -> Apocalyptic fiction -> Pandemic -> Zombie
  apocalypse -> Zombie mystery fiction. The zombification is never explained: the dead simply rise, not bite-spread (Odd Things
  Considered: ''The condition cannot be spread by bites... anyone can become a zombie when dead''; Reactor: ''no history or
  explanation of how the world... co-existed with zombies''), and the open question sits inside the story - the leaf''s definition.
  Rejected: zombie-virus/bacteria/fungus - reviewers'' ''virus''/''bacteria'' language and the publisher''s ''artificial plague''
  describe the LATER lab-made plague that destroys zombies and most humans (it kills zombies; it does not create them), not
  the zombification. Raising Stony Mayhall precedent: sentient zombie narrator, unexplained rising. Wobble: mild - the second
  plague''s lab origin is eventually exposed, but the axis asks what turns people into zombies. Queue years 2011/2012 are
  reprints; first pubs 2010/2011 (FictionDB, publisher); Grave (2014) surfaced as the third volume under series-bibliography
  autonomy. Title-collision flag noted: this Dust is Joan Frances Turner''s Resurgam novel.'

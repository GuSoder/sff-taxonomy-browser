placement_rationale: 'M. R. Carey''s Hungry plague pair: a fungal infection turns most of humanity into ravenous Hungries,
  and the children who keep their minds, Melanie and later Stephen, are what the survivors study, fear and fight over. The
  infected are the monsters and the victims at once. Walked root-down: Modern day -> Apocalyptic fiction -> Pandemic -> Zombie
  apocalypse. The Boy on the Bridge is set in the same plague world, so it folds onto this fiction.'

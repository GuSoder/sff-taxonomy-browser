placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Apocalyptic fiction > Pandemic >
  Zombie apocalypse > Zombie virus fiction. After 99% of the world''s population dies in under 24 hours, the dead begin to
  rise, animated by "phase two" of "some unknown contagion" (author''s site, davidmoody.net/books-2/the-autumn-series/autumn/);
  Kirkus calls the cause "a fast-moving virus" (kirkusreviews.com/book-reviews/david-moody/autumn2/). Virus by the reviewer;
  the author does not name the type, so this is the softest placement in the leaf. Rejected: Zombie mystery fiction (the sources
  call it a virus/contagion), Die-off (the dead rise, the zombie is the subject). Sources: author site and Kirkus, not the
  novels.'

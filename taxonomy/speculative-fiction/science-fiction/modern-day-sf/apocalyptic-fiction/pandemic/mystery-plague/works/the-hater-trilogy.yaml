placement_rationale: 'Root-down: Speculative fiction > Science fiction > Modern day SF > Apocalyptic fiction > Pandemic >
  Mystery plague. In Hater, ordinary people suddenly become frenzied killers, "there are no apparent links as a hundred random
  attacks become a thousand" (davidmoody.net/books-2/the-hater-series/hater/; Hachette); the cause is not explained, and the
  collapse unfolds under that mystery (Dog Blood and Them or Us carry the war between Haters and the Unchanged on, popmatters.com
  and davidmoody.net). Leaf definition: an epidemic with no certain cause or nature, the collapse unfolding under a mystery.
  Rejected: Zombie mystery fiction (Haters are living people, not the infected dead; PopMatters calls it only ''quasi-zombie''),
  Die-off (most do not die at once), The Last Centurion style war fiction. Sources: author site, Hachette and PopMatters,
  not the novels.'

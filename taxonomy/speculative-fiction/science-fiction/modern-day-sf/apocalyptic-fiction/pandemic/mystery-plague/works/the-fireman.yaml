placement_rationale: 'Standalone novel (2016). The Dragonscale spore (Draco incendia trychophyton) covers the world: origin
  and means of transmission uncertain, no treatment, civilization collapsing as it spreads, survivors hunted by cremation
  crews; nurse Harper Willowes shelters with an infected camp that has learned to control the burn (Locus/Langan: ''Its origin
  is uncertain, as is its means of transmission. There is no effective treatment''; Guardian, NYT reviews). Apocalyptic fiction
  (end of the world in progress) -> pandemic -> mystery-plague: an inexplicable affliction with no certain cause or nature,
  matching tenants Blindness and The Violence. Rejected: die-off (no single short mass dying - the burn unfolds progressively),
  zombie-apocalypse, post-pandemic-survival (the catastrophe is in progress, not aftermath).'

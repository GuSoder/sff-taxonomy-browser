placement_rationale: 'Root-down MC04874 2026-11-05: Speculative fiction > Science fiction > Modern-day SF > Apocalyptic
  fiction > Chemical catastrophe. One2012standalone novel, author bibliography and contemporary publisher/reviews.
  Not EightWorlds/ThunderLightning/Gaea by common author. Whole: struggling LA sitcomwriter DaveMarshall learns
  of an oil-solidifying organism from retiredMarine consultantWarner, sees lethal coverup, stocks supplies, tries
  to protect estrangedwifeKaren/daughterAddison. Oilfield disruption spreads worldwide, rationing breaks transport/supply/power/water
  systems. LAfields explode, earthquake destroys roads/watermains and SantaAna winds spread fires. Neighborhood
  militia phase becomes a caravan leavingLA; blockednorth routes force south viaLakeElsinore, confronting bandits/localgatekeepers
  and rebuilding with horsepower, steamtrains/woodburningmotors. Whole arc is the collapse in progress and attempts
  to endure its immediate cascade, not solely initial oilbug or first siege. Own reviews cover latecaravan/resolution/recovery,
  not inferred from publisher opening.


  SF over Fantasy: engineeredpetroleum-eating contagion and material/infrastructurefailure, no sourced supernatural
  or magical power. Publisher calls it virus while independentAVClub/WesternSFA call bacteria; taxon need not settle
  microbiological nomenclature because target is oil, not humaninfection. ModernDay over Futurist/Historical: recognizable
  author''spresentLA, currentgeopolitics,Hollywood/ordinaryfamily, no remote future order; AVClub explicitly contemporary
  techno-thriller. Atemporal alternatives rejected: no sourcedactualtimetravel,crossworldtrip, alternateEarth or
  fantasticunanchoredreality. Apocalyptic over bioengineering/technothriller: engineer''sgrudge/covertgovernmentcoverup
  incites event but wholefamily/community survival through cascadingcitycollapse governs after beginning; not research/medicalcreationplot
  or continuingconspiracyinvestigation. PostHolocaustSurvival is strongestmodewobble because longimmediateaftermath/escape/rebuilding
  matters, but catastropheunfolds throughnovel, never settledremnantworld; terminalwastelands explicitly mixed/unspecifiedcause,
  whereas namedmaterialfailure dominates. Existing Daybreak is the attestedchemicalcatastrophe sibling with matter/energycollapse
  and rebuilding, not a newgateedit. No suitable postchemicalsurvivalleaf required because existingapocalypsefit
  holds.


  Chemical over siblingclimate/cosmic/pandemic/unknown/geological: petroleum''sphysicalsolidification and oilfielddestruction
  causeworldsystems to fail. Pandemic kills/transformspeoplebyplague, not every disaster carriedbyanorganism; nohumaninfection
  here. Geology/earthquake and fire/weather worsenLA but are secondarycascade, notthedefinedworldwidecause. Named
  mechanism excludesUnknown, noextraterrestrialcauseforCosmic and noindependentclimateturnforClimate. No definitionedit.

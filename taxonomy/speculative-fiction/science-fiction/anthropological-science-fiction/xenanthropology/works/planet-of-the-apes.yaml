placement_note: Xenanthropology with the observer's gaze inverted - astronaut Ulysse Merou is caged and studied by Soror's civilized apes while the reader observes the ape society through his eyes. SFE calls it a witty philosophical tale a la Voltaire whose satirical point is a reversal of the usual Apes-as-Human narrative (see also Devolution). Shelfmates A Mirror for Observers and Hard to Be a God. Original French 'La planete des singes' 1963; English translation 1963 (vt Monkey Planet 1964).

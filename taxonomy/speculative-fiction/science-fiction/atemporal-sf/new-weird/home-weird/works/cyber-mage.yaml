placement_rationale: SFE calls Cyber Mage equipoisal, combining AIs and videogames with material from Hossain's earlier fantastic
  work. Unnamed Press describes climate-apocalypse Dhaka sustained by biological nanotech, radically mutated people, djinn
  merged with humans, a dark-web AI, hackers and virtual reality, explicitly calling it an SF/fantasy genre mashup. Its science,
  magic, comedy, grotesque bodily change and dense strange city refuse one explanatory genre, fitting New Weird.

placement_rationale: SFE calls this loose Borne connection a surrealized SF Western and Time Opera across rule-bound worlds,
  later breaking into typographical games that enact bodily chaos and ruined worlds. MCD adds time-slipping animals, a demon-haunted
  woman, biotech creatures, rebels and multiple Earths. Its SF, fantasy, ecological horror and formal mutation resist one
  stable mode, matching New Weird.

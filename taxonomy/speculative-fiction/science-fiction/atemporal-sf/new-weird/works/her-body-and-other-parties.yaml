placement_note: Graywolf says the collection deliberately collapses psychological realism, science fiction, horror, fantasy and fabulism; the Guardian likewise
  finds horror, SF and fairy tale merging across bodily transformations and formally daring stories. That radical hybrid of contemporary horror and speculative
  estrangement makes New Weird the closest existing leaf.

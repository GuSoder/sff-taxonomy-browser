canonical_genre: far-weird
placement_status: accepted
placement_rationale: 'Rewalk 2026-11-28: the world is not Earth at all (a secondary, literally half-made world),
  so Real earth fantasy fails at the root; the Weird West leaf''s period-fantasy ancestor requires a documented
  era. New Weird is the attested frame: science, magic, horror and grotesquerie mingled in an invented geography
  (the Line''s thirty-eight immortal Engines, the demon Guns, the Folk); Cult of the New names it New Weird outright,
  Reactor''s Perschon calls it ''pure weird western, with a whole lot of steampunk''. Far weird over Home weird
  (the world itself is invented). Sibling witness: The Etched City, same mingled-mode secondary-world western register.
  One duology in one world, one fiction (rule 11j); MC03135 Lightbringers and Rainmakers is a Tor.com short story
  in the same world, not folded.'

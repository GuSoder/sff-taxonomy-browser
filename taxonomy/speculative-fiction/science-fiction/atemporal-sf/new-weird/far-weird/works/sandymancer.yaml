placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal SF > New Weird. Tor''s synopsis (torpublishinggroup.com/sandymancer):
  Caralee Vinnet, in a world of dust where water is the most precious thing, has sand magic in her bones and summons a mad
  god trying to fix the world he broke; Tor calls it ''a genre-warping mashup of weird fantasy and hard science fiction''.
  That is the New Weird definition (mingles science-fiction and dark-fantasy modes in a strange, materially detailed setting
  that resists a single genre). Not a Fantasy leaf (the engine and setting are science-fictional as well) and not Hard science
  fantasy (the magic is not explained by technology). Soft call: the cover carries a review quote.'

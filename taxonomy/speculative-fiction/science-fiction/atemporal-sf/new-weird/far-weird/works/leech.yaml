placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal SF > New Weird > Far weird. In an invented
  northern world, the Interprovincial Medical Institute - a parasitic collective that takes root in young minds and has
  replaced human doctors - loses track of one of its bodies in an isolated baron''s chateau, against a backdrop of
  apocalyptic horrors the ancestors unleashed (publisher blurb, hironennes.com/Tordotcom). Science (parasite biology),
  Gothic horror and grotesque bodily transformation mingle in a secondary place with its own geography - the leaf''s
  definition; shelf-mates Bas-lag and The Etched City. Rejected: Alien horror (the Institute is nonhuman but not an alien
  encounter; the branch door is alien fiction), Horror fantasy (real-Earth contemporary branch; this world is invented),
  Dying Earth (not Earth). Wobble: moderate; often marketed straight as SF horror. Year: 2022 (Tordotcom). Queue id
  MC03838.'

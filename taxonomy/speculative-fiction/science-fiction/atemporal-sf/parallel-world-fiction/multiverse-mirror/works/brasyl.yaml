placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Parallel world fiction > Multiverse mirror.
  Brasyl runs three strands in three Brazils (a 2006 reality-TV producer hunting a disgraced World Cup goalie, a 2032 Sao
  Paulo talent scout entangled with illegal quantum computing, a 1732 Jesuit hunting an errant priest) that collide when they
  turn out to be strands of one quantum multiverse, threatened by the Order, a conspiracy to hold the status quo (Publishers
  Weekly starred review, 2007; Free Library catalog copy). The three Brazils held up against each other across history and
  probability, and what each says about the country, is the leaf''s definition of a mirror. Rejected: Multiverse odyssey (no
  crossing driven by love or grief), Multiverse war (the Order is a conspiracy, not worlds at war), Postcyberpunk leaves (the
  2032 strand is only one of three). Wobble: moderate to high; the conspiracy and quantum-tech thriller carry the plot as
  much as the mirror. First published 2007 (Pyr, Wikipedia; Gollancz in the UK). Queue id MC03923.'

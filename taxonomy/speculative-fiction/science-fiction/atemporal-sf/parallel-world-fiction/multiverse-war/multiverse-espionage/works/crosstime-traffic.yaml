placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal SF > Parallel world fiction > Multiverse war
  > Multiverse espionage. The home timeline (a 2090s Earth running low on resources) holds a global monopoly on crosstime
  travel through the company Crosstime Traffic and covertly imports supplies from parallel Earths where history went
  differently; each novel sends young agents or traders into one alternate world by stealth (Wikipedia, Crosstime Traffic).
  The leaf''s own wording: agents and crews work between worlds by stealth, trade and sabotage rather than open armies.
  Rejected: Multiverse invasion (no open armies cross), Multiverse mirror (the books immerse in the altered world, not a
  mirror on ours), Multiverse odyssey (commerce and survival, not an intimate crossing), Alternate history leaves (the
  mechanism is crosstime travel, not a single altered history). Wobble: low to moderate; the war frame is background
  (resource survival), but the stealth-trade engine is exact. Young adult series; the card lists all six novels though the
  queue carries four. Queue ids MC03733, MC03741, MC03746, MC03777.'

first_published: 2015
canonical_genre: multiverse-espionage
placement_status: accepted
placement_rationale: 'Zero World: one 2015 novel, not 2016 paperback date and not Dire Earth despite bonus novella. Official
  description plus three completed reviews: implant-erased assassin and local spy both seek same scientist whose transferred
  tech changes war. Covert technological missions across twin Earths, not self-quest or open cross-world army.

  Actual root walk: Speculative fiction > Science fiction > Atemporal SF > Parallel-world fiction > Multiverse war > Multiverse
  espionage. Fantasy was tested against literal magic, Earth-portal and invented-realm gates, not publication marketing. Historical,
  modern-day and futurist SF lose to the essential cross-reality organizer; no chronological time travel asserted. Alternate
  worlds/fabulation loses to a materially organized world-crossing adventure rather than unstable literary ontology. Multiverse
  mirror loses to missions and action rather than histories compared. Odyssey longing/selves are serious personal-journey
  rivals, but institutional conflict controls the whole fiction. Invasion is tested against open cross-world armies, not merely
  any violence or local war. Retain the existing leaf without widening any ancestor or leaf definition. Full published scope
  and contrary evidence recorded in the accompanying ten-fiction review; no full-novel reading claimed.'

id: ninth-city-burning
title: Ninth City Burning
authors:
- J. Patrick Black
first_published: 2016
canonical_genre: multiverse-invasion
placement_status: accepted
placement_rationale: 'Frozen-leaf audit2026-11-05: Speculative fiction > Science fiction > Atemporal SF > Parallel
  World fiction > Multiverse war > Multiverse invasion. This corrects my November3 ancestor-gate correction, which
  fixed Modern-day but missed the multiverse. Independently read publisher full synopsis, author SFFWorld interview,
  finished-book SFFWorld review, Barnes & Noble review and Errant Dreams. Not just a future Earth invasion: transdimensional
  Valentines cross the Veil to Earth, human forces cross it back into other dimensions, and conscripts fight on
  fronts a few dimensions over. Different time rates across dimensions are a sustained cost of service: Earth ages
  while troops fight beyond it. The war is across versions of reality, not simply alien space visitors on Earth;
  publisher''s Earth-centered synopsis alone was insufficient. Scientific rather than supernatural framing wins
  narrowly: thelemity is a physical force weaponized/engineered into machines, explicitly science-fiction alien
  war, though near-magic manifestation and academy training create substantial science-fantasy texture. Identifiable
  future Earth blocks atemporal Science fantasy''s no-Earth-anchor reading, but the central multiverse independently
  passes Atemporal''s worlds-crossing gate. Time distortion strongly competes but the interdimensional military
  invasion is the actual governing mission, not a study of unequal time alone, and no backwards time-machine journey
  has been established. Parallel World fiction: crossing/communication across multiple realities is central; Multiverse
  war over odyssey or mirror because it is open armies crossing to conquer/defend, so Multiverse invasion over espionage.
  Warzone Earth fails Modern-day ancestor; Future war misses that much of the war is not Earthbound but on interdimensional
  fronts, despite future Earth being the invaded home. Ruined Earth has nomadic societies but only one narrative
  strand. Academy ensemble and soft physics are substantial wobble, not reasons to ignore explicit crossings. Whole-fiction
  scope: Ninth City Burning2016 is one published novel verified in publisher/ISFDB; projected sequel Under Seven
  Skies has contradictory stale retailer listings and cancellation reports, not verified publication, so no phantom
  extra book added. Jacket is clean English publisher paperback2017 reprint, localized after pixel inspection; original
  novel date remains2016. Future war10->9, Multiverse invasion6->7. Intake remains paused for remaining frozen-leaf
  audit; no split proposal served.'

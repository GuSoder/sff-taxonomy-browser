placement_rationale: 'S. M. Stirling''s Conquistador (2003; smstirling.com, PRH, Wikipedia): in Oakland in 1946 the ex-Marine
  John Rolfe, back from the Pacific, finds by accident a portal to an alternate America where Europeans never arrived (a world
  where Alexander the Great''s empire endured and prevented the conquest of the Americas), builds a power base there, ''New
  Virginia'', and sixty years later in 2009 the two realities collide. Walk: SF/Fantasy walk first - the portal comes from
  a rewired radio, so SF: Atemporal > Parallel world fiction > Multiverse war > Multiverse invasion (colonists and expeditionary
  forces cross between worlds to settle, conquer or defend; open force rather than covert). Alternatives tried: Multiverse
  mirror (it holds our history up against another, but the story is the settlement and the clash, not the counterfactual)
  and Multiverse odyssey (a crossing for love or grief; not this). Sources: smstirling.com, PRH, Wikipedia; not read. Placed
  2026-10-12 into an existing leaf below the gate; no split question needed.'

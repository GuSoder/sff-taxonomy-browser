placement_rationale: A physicist's wave equation fusing Kabbalah and physics sends five
  pursuers through a micro black hole into separate parallel universes, each a world
  matched to the traveler's own soul (good/evil ratios 60-40, 40-60, 30-70, 70-30); the
  crossings serve each person's reckoning with self, and Nate/Jill's thread is a love
  story, so under the Parallel World fiction split by what the crossing serves this is
  odyssey, not war or mirror. Nuance disclosed - the crossings are involuntary, not
  motive-driven, and the Earth timeline is firmly anchored in 2005, but the parallel-world
  journey is the engine and the leaf already holds Earth-anchored mechanism-driven
  personal journeys (Mr. Breakfast, The Need, The Singular Life of Aria Patel).
  Source - en.wikipedia.org/wiki/Dante's_Equation.

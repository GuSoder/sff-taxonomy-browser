placement_rationale: 'Whole shared universe audited (two novels, Johnson site, SFE, PRH, Reactor and Locus reviews): The Space Between Worlds (2020) and Those Beyond
  the Wall (2024, MC06832, billed standalone but set in the same world, a mirror image of the first). Both rest on the same multiverse mechanism: travel between Earths
  only where the traveler''s counterpart is dead, with other selves met along the way; in book 2 the gruesome deaths in Wiley City and Ashtown trace to that crossing.
  Full root path: Speculative fiction > Science fiction > Atemporal SF > Parallel world fiction > Multiverse odyssey > Multiverse selves, unchanged by this fold.
  Wobble recorded: Those Beyond the Wall is mostly about revolution and class (Reactor: ''This book isn''t about technology''), so Multiverse selves fits it less
  tightly than the first novel; no other leaf fits both and no ancestor is widened. Novels only.'

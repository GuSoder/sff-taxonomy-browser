placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Science fantasy > Ozymandian tech. Per
  ISFDB, the Empire of the East series (The Broken Lands 1968, The Black Mountains 1971, Changeling Earth 1973, Ardneh''s
  Sword 2006) is tagged post apocalypse and science fiction: a far-future Earth remade after a nuclear war, where wizards
  and demons are mutation and surviving technology and Ardneh, a buried machine-god, rules as myth. Fantasy surface built
  on the wreck of an old high-tech civilisation whose works still run is the Ozymandian tech definition. Rejected: Dying earth
  (full, and no moribund-sun frame), Hard science fantasy (the magic is mistaken technology, not engineered physics). Wobble:
  the far-future-Earth frame could suit Dying earth. Year 2006 is Ardneh''s Sword, Tor; the series began 1968.'

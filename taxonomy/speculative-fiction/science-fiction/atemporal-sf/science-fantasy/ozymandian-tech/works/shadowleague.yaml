id: shadowleague
title: Shadowleague
authors:
- Maggie Furey
first_published: 1999
canonical_genre: ozymandian-tech
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Science fantasy > Ozymandian tech.


  Scope and originals: one Shadowleague world, The Heart of Myrial (1999), Spirit of the Stone (2001) and The Eye of Eternity
  (2002). Echo of Eternity is the third novel''s US alternate title, not another novel. Its publisher-listed 2003 US edition
  and the first book''s 2000 US paperback do not replace the earlier originals. ISFDB''s detailed first-title record gives
  the July1999 Orbit hardcover, corroborated by SFE and the agency''s1999 entry; Fantastic Fiction''s bare1998 label is retained
  as a contradicted catalog discrepancy, not adopted. ISFDB and SFE agree on the second/third2001/2002 originals; agency US-facing2002/2003
  labels are not used to reset them. The third front and caption use the original English Eye title; the queue''s Echo variant
  remains in the source record.


  Whole-world scope is not inferred merely from an author''s name. In the Orbit-provided2000 interview, Furey describes leaving
  Aurian for an entirely new world and characters, then separately planning to return to Aurian. The2013 Hachette author guest
  post explicitly connects Chronicles of the Xandim to the history of Aurian/Artefacts of Power, distinguishes the preceding
  Shadowleague project, and identifies the characters bridging those two Aurian sequences. SFE groups Aurian Universe separately
  from Shadowleague. An old AllTheTropes mirror vaguely claims all three series interlink without supplying a crossover or
  source. The current TVTropes article does not repeat that assertion. Absence there is not proof, but the unsupported mirror
  sentence does not override the specific primary and reference evidence for distinct worlds. Aurian/Xandim and the licensed
  Web books are not silently folded into this three-novel Myrial fiction. The author''s early hopes for additional Shadowleague
  stories are not extra published novels; the current publisher series and bibliographic records establish this trilogy.


  Root, with the fantasy rival kept real: the publisher, author and many completed readers call these fantasy adventures.
  The party includes a woman Loremaster, a veteran woman warrior, a firedrake, telepathic dragons, humans and other beings;
  sorcery, shrines, priests and a sacred ring belong to the surface. Fantasy realms > Epic fantasy > Quest fantasy is therefore
  a serious initial route, not an error to dismiss because a machine exists. But the constructed world''s machinery is the
  causal spine of the whole trilogy, not incidental scenery or a single ambiguous gadget. The Fable-reproduced David Langford
  review calls Myrial a technomagical construct rather than an ordinary world. Emerald City describes species placed there
  by an elder race and held behind artificial-seeming barriers. Completed-trilogy criticism explicitly describes an alien-built
  giant machine that is breaking down; multiple final-book readers independently discuss the forgotten technology and contraptions
  of the Ancients below the city. The author identifies the real threat as environmental and the world as a sanctuary for
  species from other worlds. The final publisher premise makes buried ancient artifacts the possible solution. Literal fantasy
  or psychic powers are not denied or all rationalized away. Ozymandian tech expressly permits old technology to be mistaken
  for magic or to rival it. Here the old engineered system under the fantasy surface drives the catastrophe, lost-knowledge
  problem and recovery journey.


  Fantasy walk: Real earth fantasy fails a recognizable Earth setting; no Historical, Contemporary or Future Earth frame is
  established. Portal fantasy fails an Earth-to-other-world crossing: migration from other worlds and movement across Myrial''s
  Curtain Walls do not establish Earth. In Fantasy realms, Fellowship/Revival quest fantasy catches the company traveling
  to save its world, and Reimagined quest fantasy is a substantial rival because the author explicitly wanted to depart from
  simple Good/Evil. Throwback catches the traditional adventure furniture but not that intent as strongly. Destiny''s Hidden
  heir and Humble origins branches lack a governing royal birthright or ordinary person''s rise; no central chosen-one plot
  is supplied. Dark quest catches apocalypse and sacrifice but completed ending criticism describes a notably happy, reconciliatory
  resolution, not sustained Gothic cost. Revisionist quest catches moral ambiguity and institutional critique, but those do
  not by themselves make the quest a refused-mantle or aftermath reckoning. The deciding root issue remains the buried technological
  foundation, not which fantasy quest sensibility seems closest.


  Other Fantasy realms siblings and epic alternatives are tested: Heroic fantasy''s Caster, Martial and Half-caster routes
  match individual party members, not the whole ensemble''s repair-of-world engine. Hard fantasy catches magical barriers
  and engineered environments but the revealed old technology is not simply a new system of spell rules; no magic-side time-travel
  spine is established. Political fantasy has a corrupt church, secretive Loremasters, a ruthless reformer and struggles inside
  the Shadowleague, yet the institutions respond to a failing life-supporting world rather than replacing that cause. Military
  fantasy catches the winged attack, warriors and soldiers, not an army campaign as the whole form. Mythological fantasy catches
  divine claims and species legends; a worshipped ancient system is not enough to make the gods'' own mythic struggle the
  primary engine. Sword and sorcery and Fairytale rescue catch adventure and a search for a missing man, but neither episodic
  combat nor fairy-tale task grammar explains the trilogy. Gothic realms > Hungry/Godforsaken realms and Alien horror have
  real predatory-winged and sinister-power imagery, but terror or appetite does not govern the whole adventure. Far shores
  lacks a demonstrated non-Western counterpart culture; Comic realms lacks sustained comedy; Heart fantasy catches relationships,
  redemption and horses but not romance, care or a horse bond as the governing story. Good or bad reviews of the interpersonal
  soap opera are retained rather than recast as an unrelated genre.


  Science-fiction temporal walk: Historical SF fails a documented or alternative past; Modern day SF fails a recognizable
  contemporary setting, including present-day ecological apocalypse or alien invasion. Futurist SF has strong rivals but no
  usable Earth-future chronology is established. A world containing humans and nonhumans is not automatically an Earth colony
  or a future interstellar civilization. Atemporal SF positively fits an unanchored artificial world presented in fantasy
  terms. No literal SF time travel, recurring lifetimes or parallel versions of reality are established. Dragon Seer knowledge
  carried in another mind is not enough to turn the whole fiction into Reincarnation fiction. Crossing enclosed habitats or
  mentioning other worlds is not a Multiverse odyssey without parallel-reality evidence.


  Futurist rivals: Hard SF > Planetary science > Planet ecology fiction is especially serious because climate boundaries,
  drought, rainfall and habitat failure drive the crisis. Hard conceptual world-models and Otherworldly hard SF also catch
  recognition of an engineered world''s workings. Yet the sources establish a technomagical adventure with psychic creatures,
  ancient contraptions and character reversals, not rigorous known-physics extrapolation as the primary reading experience.
  The mystery''s explanation is not treated as a validated engineering specification. Orbital mechanics, matter transmission
  and terraforming are not the established organizing disciplines. Future of Earth > Psionics catches telepathy and ancestral
  memory, and techno-fiction catches the ancient system, but neither an Earth-derived society nor a central technological
  remaking of human minds is established. Spacefaring fiction catches the off-Earth possibility, but Space opera, Military
  SF, Future history, Generation starships, Space colonies, Space dystopias, Space techno fiction and Comic space future lack
  their respective interstellar, service, civilizational, ship-society, civic, closed-order, network or comic spines. Indigenous
  peoples struggling inside Myrial''s sanctuary are not automatically a space-colony expedition.


  Alien fiction is a real alternative because otherworldly species and their builders'' works matter. Anthropological science
  fiction catches ethical segregation, knowledge control and relations among species; Xenanthropology/Xenocolonial concerns
  are meaningful. But the central form is an old fantasy-seeming world and its failing hidden machinery, not cultural fieldwork,
  linguistic encounter or a first consequential human contact. Alien cosmic history fails a sustained emergence/history of
  nonhuman civilizations. Hard alien > Alien engineering is a particularly close mechanism match: an intelligence has built
  a world. Its required hard-edged alien space-opera frame is not established across this magical-surface adventure, and Alien
  biology/physics are less direct. Alien delving > Big dumb worlds and Big dumb relics remain genuine rivals. The protagonists
  live in an artificial setting and finally explore buried Ancients'' rooms, objects and traps. But this is not principally
  an outward future-SF expedition into an artifact; they are the fantasy-world''s own residents and keepers, uncovering the
  sacred/forgotten infrastructure of their everyday world to stop its collapse. Wreck delving fails a dead-ship salvage/claims
  spine; Alien descent''s horror-register descent does not govern the trilogy. The Science fantasy route describes both the
  sustained reading surface and the underlying engine more precisely.


  Atemporal siblings: Fabulation''s storytelling/reality games do not follow merely from initially misunderstood machinery,
  and Inner space fails a subjective reality as the governing world. New Weird''s ecological unease and mixed modes are serious
  surface similarities, but the coherent company adventure and explanation by old engineered infrastructure are stronger than
  grotesque or genre-resistant weirdness. Science fantasy positively passes: fantasy surfaces on scientific/technological
  engines in a world unplaceable on Earth''s usable timeline.


  Science fantasy children: Hard science fantasy requires a demonstrated known-physics engine with no FTL or teleportation.
  The available sources do not establish that constraint, and no missing proof is fabricated from the mere word machine. This
  rejection is not a claim that a specific unverified FTL device occurs. Old Mars fails its actual Mars/era premise. Planetary
  romance catches exotic-world adventure, but its current children require an Earth visitor, a demonstrated forgotten Earth
  colony, or a native far future in which Earth is gone/forgotten. None is established; no Earth ancestry is invented to enter
  them. Ozymandian tech passes directly: the fantasy civilization stands on an elder-built technological sanctuary, surviving
  ancient works are treated as divine/magical power, lost knowledge and buried contraptions matter, and those old works continue
  running badly enough to imperil the whole inhabited world. The old culture''s remains are the functioning world-system and
  its buried infrastructure, not a requirement that every building be visibly ruined. The final-book Ancients exploration
  and recovery remain part of the same engine, not a late unrelated genre switch.


  Whole trilogy and ending check: the initial barrier failures mix incompatible climates and expose previously segregated
  species to one another. Veldan, Kazairl, Aethon and their eventual companions seek the Heart and knowledge needed to avert
  collapse while Tiarond is attacked. Spirit of the Stone adds survivors, the Dragon Seer''s knowledge in Zavahl and the Shadowleague''s
  factional struggle. The last novel brings the missing ring/man search and underground ancient-technology exploration toward
  resolution. Completed accounts reach that outcome: Benbo''s trilogy review criticizes apparent late deaths being reversed
  and victory coming too cheaply; Whichbook calls the final volume safe and predictable; Goodreads final-book readers disagree
  over satisfaction, haste, reform, pairing-off and contrivance, while repeatedly corroborating the Ancients'' forgotten technology,
  tunnels and devices. The author intended an environmental rather than simple evil-villain threat, not a guarantee that nobody
  acts villainously. No exact control-room repair, AI identity, builder species name, ultimate survivor list or literal physics
  model is invented. These are sourced ending-aware critical accounts, not a claim to have read all three complete novels.


  Decision: one three-novel Shadowleague card in existing Ozymandian tech, eight to nine fictions. Moderate-high confidence
  in the ancient-engine/fantasy-surface fit, with meaningful company-quest, Big dumb worlds, Planet ecology and Hard science
  fantasy rivals retained. Original years and the Eye/Echo alias are source-reconciled. No new genre, definition, portrait,
  hierarchy or unrelated fiction change; no ten-fiction threshold reached.'
whole_content: Myrial is a sanctuary for species from other worlds, divided into tailored habitats by Curtain Walls maintained
  or guarded by the secretive Shadowleague. Their failure mixes climates, threatens ecological collapse and exposes peoples
  to invasion and predation. The first novel follows Veldan, firedrake Kazairl, Dragon Seer Aethon and a widening cast toward
  the Heart and the knowledge needed to understand the crisis, while Tiarond suffers a devastating winged attack. The second
  carries survivors, Zavahl's burden of the Dragon Seer's knowledge and a struggle over the Shadowleague's leadership and
  secrecy. The final novel combines the missing ring and missing knowledge-holder quests with exploration of ancient rooms,
  traps and contraptions below Tiarond. The world is revealed/described in completed criticism as an ancient alien-built machine
  or technomagical construct breaking down, not an ordinary natural fantasy planet. Completed final-book accounts confirm
  a resolved, largely happy/redemptive outcome while disagreeing about satisfaction, haste and convenient reversals of apparent
  deaths. The exact repair sequence, any supposed AI's identity, every final survival and the builders' precise physics are
  not supplied. The Eye of Eternity and Echo of Eternity are the same third novel, first2002, later US edition2003.
confidence: 'Moderate-high for Ozymandian tech: the technological fantasy-world foundation is corroborated by professional
  criticism reproduced at Fable, independent completed-trilogy criticism and multiple last-book accounts of forgotten Ancients
  technology. Strong for three-novel scope and1999/2001/2002 bibliographic originals; unsupported catalog and mirror disagreements
  are explicit. No complete-novel reading or precise final engineering mechanism claimed.'

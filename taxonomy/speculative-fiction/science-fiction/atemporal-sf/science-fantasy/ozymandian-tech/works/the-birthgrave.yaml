placement_rationale: '# Original Ozymandian ten-member audit, closing checks

  23 November 2026


  ## Birthgrave: focused repair

  Retain one three-novel fiction in Ozymandian tech. Correct displayed order to The Birthgrave1975, Shadowfire1978, Hunting
  the White Witch1978. Shadowfire is the English alternate title of Vazkor, Son of Vazkor; Hunting is the English alternate
  title of Quest for the White Witch. No extra novels or editions counted, no year changes. Publisher itself identifies Shadowfire
  as book two and Hunting as the concluding book. All three publisher English fronts were inspected at actual pixels; they
  are flat fronts with correct title/author, replacing a first-book Wikimedia URL that currently rejects the direct fetch
  and filling the two previously absent fronts. These are later-edition jackets; captions give original-work years, not jacket-edition
  publication. No jacket is passed off as a first edition. Repository cover downloads forbidden, only hotlinks used.


  SFE explicitly calls the first ending a non-supernatural explanation delivered by Earthmen in a spaceship. EBSCO''s complete
  three-book plot follows the heroine''s son through inherited powers, apparent death/resurrection and final reunion without
  an independent god/spell explanation. The first-volume voice Karrakaz is her own suppressed identity, not proof of a deity.
  The fantasy surface and lost superior race remain material across the fiction. Root: speculative > SF > Atemporal > Science
  fantasy > Ozymandian, under the original remote-future/fantasy-surface ancestor ruling. Fantasy is a serious surface rival
  because of the powers and apparent divinity, not rejected by marketing label alone. Hard science fantasy lacks a demonstrated
  known-physics constraint; a recovering-legacy/race premise is stronger. No need to seed or move to a future-Earth leaf merely
  because Earthmen arrive.


  Sources read:

  - https://www.penguinrandomhouse.com/series/743/the-birthgrave-trilogy/

  - https://www.isfdb.org/cgi-bin/pe.cgi?4243=

  - https://sf-encyclopedia.com/entry/lee_tanith

  - https://www.ebsco.com/research-starters/womens-studies-and-feminism/birthgrave-trilogy-tanith-lee


  '

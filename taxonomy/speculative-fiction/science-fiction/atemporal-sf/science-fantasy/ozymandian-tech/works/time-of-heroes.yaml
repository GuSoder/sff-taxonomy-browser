placement_rationale: '# Time of Heroes scope check

  23 November 2026


  Retain Ozymandian tech, add The Serpent2021 as third novel and correct The Storm2018 to2019. The Spark2017 remains unchanged.
  One shared fiction, not three cards. No new genre or definition. Ozymandian remains8, total books7358to7359.


  Author current series index and independent ISFDB series list both contain exactly these three novels. Author''s6July2021newsletter
  explicitly calls the whole series Arthurian romances in far-future SF, with a fantasy feel. This is stronger evidence than
  assuming monsters or a mythic-looking Road must be literal magic. It does not by itself rule out every supernatural possibility,
  but the publisher''s third-novel description positively keeps Maker Pal repairing the Ancients'' tools. Finished Serpent
  reviews describe the same lost machines and adventure-in-the-shattered-cosmos premise, not a final-volume revelation that
  reverses ontology. The Upstream review''s teasing no-magic headline and references to witches are not ignored; its actual
  account explains Makers as restorers of Ancient machinery and describes a psychic dog rapport, not deities or independent
  spells. Residual uncertainty is retained rather than claiming every marvel has been physically explained.


  Whole fiction: Spark follows rural Pal''s move to Dun Add and use of Ancient weapons; Storm continues the Champions'' Arthurian-style
  travels, adapted from Chretien and the Prose Lancelot; Serpent has Pal on patrol restoring order, recovering an Ancient
  artifact and finding the Maker Irene. Jon''s fragmented Commonwealth is held together through travel and the useful remains
  of the former universe. The books need not have a single continuous quest to form one setting.


  Root walk: speculative > SF rather than Fantasy, given positive author account of the completed scope and machinery frame;
  Atemporal Science fantasy rather than an ordinary technological-progression futurist story, because the fantasy-surface,
  remote-human-future/technological-engine setting is covered by the original17September ancestor ruling; Ozymandian because
  recovering and reshaping Ancient technology is the continuing engine. A historical Arthurian shelf fails because source
  legend is not story date. Fantasy portal fails an actual Earth-origin portal story and literal magic evidence. Hard science
  fantasy is a live rival, but the engine is surviving old works rather than a new engineered-magic society. Dying-earth is
  not selected on a ruined setting alone, with no moribund-sun frame. Moderate confidence in retained fine placement.


  Year repair: The Storm''s author''s webpage was posted in June2018 but explicitly says publication January2019. Do not confuse
  post date with book publication. The Serpent''s author page was posted September2020 but explicitly says6July2021, confirmed
  by Baen''s distributor. Current series index and ISFDB independently show2017/2019/2021. No later fourth novel found in
  those current full series lists. No omnibus, short story or reprint added.


  The Serpent publisher English front visually inspected23November2026. Retain the two existing fronts unless live QA shows
  failure. Cover hotlinks only; no repository image download. Final live3front QA required.



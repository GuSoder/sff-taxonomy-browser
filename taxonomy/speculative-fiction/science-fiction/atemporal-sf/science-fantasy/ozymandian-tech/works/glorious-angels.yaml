placement_rationale: 'Ten-k walk (MC05084). Whole fiction: standalone novel (Gollancz 2015; BSFA Award nominee). Root-down:
  science fiction > atemporal-sf > science-fantasy: the world reads as fantasy (the Empress of Glimshard, matriarchal queendom
  wars against the alien Karoo, ''physicomagics'') but the engine is technology - devices left by the people who predate the
  Golden Empire, used by bloodline-bound engineers who know what they do but not why (Reactor review, publisher copy) > ozymandian-tech:
  the fantasy surface is built on the buried remains of an ancient high-tech culture whose surviving technology is mistaken
  for magic, and the plot''s prize is the precursor secret beneath the Karoo dig. Not hard-science-fantasy (that leaf''s point
  is intact known physics; here the defining feature is the lost precursor civilization''s works), not planetary-romance (adventure
  sweep is not the engine), not big-dumb-relics (the precursor tech is the world''s inherited infrastructure, not an object-to-open
  plot).


  One2015published novel remains the scope. A2018planned sequel Hell''s Ditch is not counted as a published novel: current
  author book page still describes a manuscript, current ISFDB bibliography and SFE do not list it as published. This is no
  claim that it was never written or privately shared. The author called it a continuation about the same city, retroengineering
  and first contact, so if published it would fold into this fiction rather than a second card.


  A finished review argues that the technology amounts to literal magic. That was investigated, not accepted as a root verdict.
  In the30March2015Big Issue North interview, Robson directly explains that characters think they have magic but do not, it
  is fantastic technology whose manufacturing origin is forgotten, and archaeological reverseengineering drives their discoveries.
  Her publisher-hosted final-edit account independently describes the same backwards discovery society. This primary ontology
  statement is more specific than a review''s complaint about implausible technology, and no direct supernatural counterexample
  was established. Bloodline engineering and biological abilities are not made magic merely by their improbability. Retain
  SF > Atemporal > Science fantasy > Ozymandian for old technological works under a fantasy surface. Alien contact, sexual
  politics and matriarchy are substantial rival emphases; none explains the lost-work causal engine as well. No claim of rigorous
  hard science. High confidence primary explanation, moderate fine leaf.



placement_rationale: 'Ten-k walk (MC05084). Whole fiction: standalone novel (Gollancz 2015; BSFA Award nominee). Root-down:
  science fiction > atemporal-sf > science-fantasy: the world reads as fantasy (the Empress of Glimshard, matriarchal queendom
  wars against the alien Karoo, ''physicomagics'') but the engine is technology - devices left by the people who predate the
  Golden Empire, used by bloodline-bound engineers who know what they do but not why (Reactor review, publisher copy) > ozymandian-tech:
  the fantasy surface is built on the buried remains of an ancient high-tech culture whose surviving technology is mistaken
  for magic, and the plot''s prize is the precursor secret beneath the Karoo dig. Not hard-science-fantasy (that leaf''s point
  is intact known physics; here the defining feature is the lost precursor civilization''s works), not planetary-romance (adventure
  sweep is not the engine), not big-dumb-relics (the precursor tech is the world''s inherited infrastructure, not an object-to-open
  plot).'

placement_rationale: '# To Mars via the Moon, whole-fiction walk

  24 November 2026. MC06484.


  ## Verdict, scope and date

  One original novel by Mark Wicks, To Mars via the Moon: An Astronomical Story. Place in existing Old Mars1to2. Use first-publication1910,
  with explicit bibliographic caveat: title page, SFE, ISFDB and Miami special collections conventionally date the first edition1911,
  while the contemporary Spectator actually reviews the already available Seeley book on5November1910. Thus actual circulation
  predates the1911imprint. This is not a second novel or the candidate''s2013Baen reprint as new fiction. The Academy July-December1910volume
  index independently lists the Wicks title at648, but this index is corroboration, not a fully inspected review page. Exact
  first sale day remains unknown. First publication by5November1910, imprint1911is the distinction preserved here.


  Baen''s Conquest of Space is Ron Miller''s editorial/reprint series, not a shared narrative universe. One standalone novel,
  no known connected follow-up in the creator bibliographies read. No juvenile audience exclusion, collection, novella or
  media tie-in. One fiction/one book. No structural change,937nodes/3003fictions/7525books after placement.


  ## Whole novel and actual mechanism

  Poynders, John Claxton and Scottish engineer Kenneth M''Allister build the antigravity Areonal, visit the Moon, and reach
  Mars during1909. Extended astronomy discussions defend Lowell''s canal theory and take observations as the basis for imagined
  geography. Martians are tall, technologically advanced, peaceful and telepathic, maintaining irrigation and anticipating
  their planet''s eventual death. Their society is a guided utopian contrast to Earth''s cruelty and waste, not a sequence
  of battles or swashbuckling romances.


  The personal resolution is not omitted: Poynders encounters his dead son Mark reborn as Merna, a Martian. Primary chapterXV
  explicitly confirms birth immediately after earthly death, training to recover former-life memory and relearn English, then
  interplanetary thought influence that prompted the father and engineer to build the ship. Martian electric defenses, not
  spells, obstruct its approach until it follows their selected landing route. ChapterXVII makes postmortem progress through
  other planets an accepted spiritual certainty and explicitly cites Flammarion as an earthly scientific/spiritual parallel.
  The son is not a clone, metaphor, dream or a mislabeled time traveler. ChapterXXVII resolves the narrative: Poynders stays
  with his son, his two companions return to Earth. The manuscript then returns through them to the readership.


  ## Full root-down walk

  Speculative fiction > Science fiction: contemporary astronomical speculation, engineered antigravity ship, planetary exploration
  and Martian technologies frame the novel. Actual rebirth and telepathy are acknowledged, not silently demystified. This1910/1911proto-SF
  fits the owner''s explicit Old Mars carve-out, not a new relaxation of the modern magic boundary. Original phonemsg-01M3PHGSCHJJJ93KYHHZF66JW6,29September2026,14:16,
  recovered with the preceding question about Old Mars magic/psychic looseness: owner permits Old Mars because it is proto-SF
  and insists on stricter treatment of newer works. Thus no new pseudoscience exception is invented. Fantasy-side Planetary
  portal, Afterlife, Spiritual or Space fantasy would become live alternatives without that expressly applicable carve-out;
  the actual spacecraft journey is not itself a supernatural portal or a future star civilization.

  Science fiction > Atemporal SF > Science fantasy > Old Mars: habitable ancient canal Mars, human-like inhabitants and mixed
  scientific/spiritual convention are exactly the admitted romantic Mars conception. This is our actual Solar System, not
  an independent fantasy universe. Although1909anchors the narrated voyage, the specific Old Mars prototype is expressly admitted
  under this pre-existing Atemporal/Science fantasy route; do not export that exemption into modern works or silently amend
  ancestors. Futurist spacefaring is a serious rival for invented space technology, but the book''s period astronomical Mars
  is the precise Old Mars subject. Historical period-SF is weaker: no later nostalgic Victorian/Edwardian technological culture
  is being celebrated, and the user''s historical-shelf rule explicitly excludes space from the closed-golden-age test. Modern-day
  SF misses the distinct proto-planetary mode. No actual time travel or communication across time occurs.

  Science fantasy alternatives: not Hard science fantasy, postmortem identity is not scientifically derived and antique astronomy
  is not present-day physical rigor. Not Ozymandian tech, no ambiguous ancient machinery disguises magic. Not Planetary romance
  > Classic planetary romance: Earth visitors and a Martian civilization fit the broad furniture, but the governing book is
  astronomical exposition and a peaceful utopian reunion, not heroic adventure through alien conflicts. Old Mars positively
  owns this pre-Mariner canal world even where it is not dramatic romance, a boundary the owner discussed when naming it.
  Lost-colony and Far-future planetary romance fail origin/era gates. Reincarnation fiction is the strongest mechanism rival,
  but its definition links multiple lifetimes and eras as the narrative device; the included novel stays in a single contemporaneous
  interplanetary voyage, with the son''s remembered former life disclosed inside it, not an era-spanning sequence of incarnations.
  Utopian fiction is also substantial but sits under Future of Earth: this is a contemporary Martian society and the precise
  Old Mars shelf. Neither general utopia nor reincarnation requires defeating the explicit positive Old Mars fit. No seed
  or split, leaf1to2.


  ## Source coverage and limits

  Read primary preface/opening and public-domain later chapters, includingXV, XVII andXXVIIfor the rebirth cause and actual
  ending, plus contemporary review, specialist encyclopedia, publisher, specialist bibliography, museum podcast description,
  university special-collections discussion and later historical criticism. Source pages may truncate long text, so the public-domain
  HTML was also parsed directly to recover whole chapterXVandXXVII. Gutenberg''s live full text became temporarily unavailable
  for maintenance; it was not a paywall/challenge. The earlier fetched opening remains valid; a public-domain transcription
  supplied the remaining chapters. No copyrighted full-book mirror used or committed. The exact first-sale date is unknown,
  and majority cataloguing1911is retained as imprint caveat rather than erased.



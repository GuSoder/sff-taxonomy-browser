id: the-saga-of-the-well-world
title: The Saga of the Well World
authors:
- Jack L. Chalker
first_published: 1977
canonical_genre: classic-planetary-romance
placement_status: accepted
placement_rationale: 'Bounded Classic planetary romance integrity repair, 2026-11-05. The whole Well World fiction
  is ten novels, not just the three intake queue volumes previously displayed. SFE and the author''s own bibliography
  establish the original five, Watchers at the Well three and final two. Shared setting remains one card. Caveat
  preserved: Chalker calls The Sea Is Full of Stars and Ghost of the Well of Souls ''non-canonical'', with new characters
  and no Brazil/Chang/Markovians, but explicitly calls them Well books, a two-volume story in new areas of the same
  map. This is an author-written setting offshoot, not grounds to split one shared fiction into separate cards.
  No unrelated Chalker fiction added; Watchers omnibus is not an extra novel.


  Each book''s own engine read in publisher copy, corroborated by whole-series SFE and independent reviews. Midnight
  (1977): Brazil''s freighter party answers a distress call, enters the Well, is transformed into hex species and
  must reach its master control. Exiles (1978): syndicate head Antor Trellig seizes Zinder''s godlike computer;
  hired Mavra Chang pursues him, and all are drawn to the Well and transformed amid a power struggle. Quest (1978):
  Mavra, trapped in an altered body, seeks the hidden northern spaceship to reach orbiting Obie and reverse the
  transformation while enemies plan her death and their escape. Return (1980): anti-Dreel superweapon damages reality''s
  control; Chang and Obie search for Brazil, the surviving Markovian able to repair the Well. Twilight (1980): the
  growing spatial rift threatens the Well; Brazil and Chang must cross a war-torn world to repair/reset its computer
  before enemies kill them. Echoes (1993): an entity released from ancient prison threatens to corrupt the Well;
  weary guardians are summoned again. Shadow (1994): Brazil and Chang return as estranged rivals and find impossible
  changes to the programmed evolution of hexes and to Brazil himself. Gods (1994): Brazil''s will is invaded and
  Chang is drugged/genetically altered and enslaved; the machine and companions must get its guardians back while
  the ancient Kraang manipulates them. Sea (1999): star-liner passengers are drawn into Kincaid''s vendetta against
  Josich, through a criminal cyberworld into the Well''s water hexes. Ghost (2000): Josich seeks eight pieces of
  the Straight Gate while Core, Ming/Ari, Jaysu and O''Leary resist with an unexpected cloning ally. Ghost primary
  text, part8, explicitly explains the paired Straight Gates as back-and-forth transport between the Well and the
  travelers'' colony home among the stars; it is not evidence of alternate versions of Earth merely because the
  blurb says ''between universes''.


  Full actual-tree walk: Speculative fiction > Science fiction > Atemporal SF > Science fantasy > Planetary romance
  > Classic planetary romance. Root: the apparent magic, transformations, godlike control and biological miracles
  are engineered by a planet-sized computer and its mathematics, not literal supernatural powers. Gods publisher
  explicitly says even the Well is only a machine. Historical, Modern day and Futurist lose the whole fiction''s
  engineered world outside a usable Earth timeline and multiple recreated cosmoses; Watchers'' contemporary Earth
  opening and the original books'' interstellar societies are real straddles, not separate placements. The any-time-travel
  test was checked first: resets/re-creation and immortal survival across cosmic ages are not themselves proof that
  a character travels backward or forward in time. No sourced actual temporal trip found in these own plots, so
  no Time travel gate asserted. Parallel-world fiction is a serious losing route: the original Markovian substrate
  and layered artificial cosmos are different scales of a constructed reality, not demonstrated parallel variants
  of history; Ghost''s gate is explicitly to the same colony home. No invented parallel-Earth claim. Reincarnation
  loses repeated mortal lives; Fabulation loses storytelling/form engine; New Weird loses that mode to conventional
  adventure.


  Science fantasy children tested: Hard science fantasy loses teleporting gates, variable physical laws and reality
  construction; Old Mars loses the setting; Ozymandian tech is a substantial ancient-machine cousin, but traversal/adventure
  across the actively maintained hex laboratory and the travelers'' body changes, not excavation or worship of a
  buried technological ruin, is the sustained engine. Planetary romance: fantasy-shaped adventure on the exotic
  engineered habitat, as SFE''s Science and Sorcery/game-board account supports. Its three children divide how the
  hero stands to Earth: Lost-colony loses forgotten settler descendants as protagonists; Far-future loses native
  far-future peoples with Earth forgotten; Classic fits arrivals from Earth/human space adventuring through the
  hexes. Brazil is himself a hidden Markovian, a real visitor-identity wobble, not a claim that every protagonist
  is an Earth-born human. Watchers opens on Earth; the final duo uses fresh arrivals. No definition changes, seed,
  split or sweep. Six fictions remain in Classic.


  Dates from SFE and author, not later edition dates. Return is 1980 per author and SFE, despite some secondary
  lists saying1979. The ten localized English print fronts were inspected as actual pixels. First five are Baen
  2002-2005 paperback reprints from publisher pages; Echoes Del Rey publisher front; Shadow clean Del Rey trade
  front and Gods Del Rey mass-market front from ISBN-linked Open Library records; final two Del Rey fronts from
  SFE. Rejected two misleading scans: Shadow with a library sticker and Gods title page, replacing both before publication.
  No omnibus or audio covers.'

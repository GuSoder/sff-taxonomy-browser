placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal SF > Science fantasy
  > Planetary romance > Classic planetary romance. Young Arkad, the only human on a distant world of
  myriad alien species, joins three human arrivals - a historian, a cyborg girl, an ex-spy - on a quest
  halfway across the planet for a lost spacecraft whose treasure might free an alien-dominated Earth
  (Baen book description; Publishers Weekly review: "retro space adventure with modern sensibilities").
  Earth-visitors adventuring across an exotic world - the leaf''s organizing shape (Gulliver of Mars,
  Northwest Smith precedents); Earth is known and occupied, not gone or forgotten. Rejected:
  Lost-colony planetary romance (no forgotten-settler descendants - Arkad is a lone castaway, the
  humans arrive from a known Earth), Far-future planetary romance (Earth exists and is occupied),
  Planet expedition fiction (the journey is a native guide''s coming-of-age quest in science-fantasy
  furniture - pirates, bizarre creatures, a cyborg - not a mission-engineering survival story).
  Wobble: low-medium - the hero is the native guide rather than himself the Earth-visitor, but the
  quest party and shape are the leaf''s. Standalone (author site lists it singly, no series).
  Sources: baen.com, publishersweekly.com, jamescambias.com; not read.'

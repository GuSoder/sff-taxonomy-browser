placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal SF > Science fantasy > Planetary romance >
  Classic planetary romance. Four present-day New Mexico professors find stone trilithon gates under the Sahara, pass
  through to rescue a kidnapped colleague, and adventure across a chain of strange worlds built by vanished ancients -
  insect-like machine beings, a world torn by a returned-god civil war (Kirkus, Tor 2005). Visitors from Earth adventuring
  through ancient alien civilizations: the planetary-romance register in the pulp tradition Williamson helped invent.
  Rejected: Portal fantasy (that branch is fantasy; this is SF machinery and alien worlds), Multiverse odyssey (the chain
  is worlds, not parallel Earths, and the odyssey is adventure, not displacement home). Wobble: moderate; the def''s
  examples are Mars-and-Venus pulp and here the gates replace the rocket, but the visitor-from-Earth engine is the same.
  Year: 2005 (Tor). Queue id MC04113.'

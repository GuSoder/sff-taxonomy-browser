placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal SF > Science fantasy > Planetary romance
  > Lost-colony planetary romance > Hidden lander romance. Author explicitly calls Second Sons science fiction thinly disguised
  as fantasy, with no magic (https://www.sffworld.com/2006/07/scifiint_197/). SFE establishes a medieval planetary colony
  whose Earth origins are forgotten (https://sf-encyclopedia.com/entry/fallon_jennifer), with astronomy explained scientifically
  and a cynical religion obscuring the explanation. Full three-volume publisher plots https://www.penguinrandomhouse.com/series/2ST/the-second-sons-trilogy/
  and Eye of the Labyrinth review https://www.januarymagazine.com/SFF/eyeoflabyrinth.html support sustained priestly/political
  control of scientific understanding. Belagren uses Neris''s astronomical prediction as revelation; Dirk''s mathematics and
  political struggle challenge the order across the trilogy. Hidden includes repression of scientific knowledge and recovery,
  not only machinery: no blanket technology ban inferred. Forgotten origins remain true, but active repression supplies the
  trilogy''s primary narrative engine under the approved corrected split. Original loss-of-contact cause is unknown and not
  needed to establish this placement. Whole-fiction alternatives: not Fantasy realms (author denies magic and sources establish
  colony ontology), not chronology-fixed Earth SF (no dated Earth setting), not Hard science fantasy (astronomy matters but
  no whole-fiction technology-engine/known-physics claim; a reviewer questions physical plausibility), not Classic planetary
  romance (not Earth outsider), not Far-future planetary romance (not post-Earth humanity), not Abandoned (no proven general
  deliberate renunciation), not Broken (no established physical failure cause). Three novels, one fiction, original Australian
  years 2002/2003/2003 from SFE, not US2004 editions. User approved corrected Hidden3/Abandoned3/Broken4 recommendation, phonemsg-01M64CXKTBZPD549Z6EPDRPBDW.
  Per-volume check: The Lion of Senet (2002) brings shipwrecked exile Johan Thorn, Dirk''s mathematical ability and Belagren/Antonov''s
  sacrificial solar religion into conflict; fraudulent return-of-sun prediction legitimizes religious power. Eye of the Labyrinth
  (2003) takes the fugitive Dirk through the Baenlands to the ancient Omaxin labyrinth and protected astronomical records,
  then into the enemy institution after learning the secret. Lord of the Shadows (2003) makes Dirk High Priest, using factions
  and a staged ritual to discredit the Shadowdancers while the struggle against Antonov culminates in Kirsh''s death and Misha''s
  succession. The whole trilogy''s institutional use and overthrow of scientific deception, not a single solar reveal, determines
  Hidden. Full research was completed before execution; original Australian dates from SFE, author interview confirms deliberate
  science-fiction masquerade.'

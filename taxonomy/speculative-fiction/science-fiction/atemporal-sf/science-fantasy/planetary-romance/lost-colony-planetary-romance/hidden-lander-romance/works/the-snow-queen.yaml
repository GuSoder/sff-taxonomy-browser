placement_rationale: 'One fiction (rule 11j): the Snow Queen cycle - The Snow Queen (1980), World''s End (1984), The Summer
  Queen (1991), Tangled Up in Blue (2000); SFE lists all four as the Snow Queen series and calls its power that of a Planetary
  Romance founded on Graves-style mythopoeia with heroic-fantasy furniture. Root-down: Speculative fiction -> Science fiction
  -> Atemporal SF (Tiamat has no Earth-time anchor) -> Science fantasy (fantasy surfaces on scientific engines: sibyl network,
  mer-blood immortality, cloning) -> Planetary romance -> Lost-colony planetary romance -> Hidden lander romance. Tiamat is
  a settled world kept primitive: the Hegemony strips imported technology at every departure and bans tech transfer to preserve
  the mer-harvest order, and the Winter Queen suppresses the seasonal succession to keep her reign - leaders actively repressing
  technological recovery to preserve the inherited order, the Hidden lander definition. Darkover precedent: active offworld
  contact does not break the lander family. Rejected: Classic planetary romance (visitor-from-Earth shape; the series'' center
  is native Tiamatans Moon and Sparks - and the leaf sits at 9), Far-future planetary romance (its gate needs Earth gone or
  long forgotten in-world; nothing in the evidence grounds that, and the Hidden lander positive fit governs), Abandoned/Broken
  lander (no founding renunciation; active repression, not physical loss, is the defining mechanism), Rebel space opera (the
  revolt matures only in The Summer Queen; the engine is the kept-primitive planet, and the atemporal science-fantasy branch
  gates first). Wobble: moderate - the cut-off is cyclical (the Hegemony is present each winter), and Gundhalinu in Tangled
  Up in Blue is an offworlder lead. Queue years 2001/2015/2003/2017 are reprints; first pubs 1980/1984/1991/2000 (SFE).'

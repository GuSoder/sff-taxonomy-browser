placement_rationale: '# Palace of Dreams world audit, 24 November 2026


  ## Finding

  Move the existing one-fiction card from Detective fantasy to existing Hidden lander romance and repair its corpus from one
  novel to seven. Keep the stable id palace-of-dreams and title Palace of Dreams, with the author''s Palace of Dreams World
  as its shared-world scope. This is a single-fiction correction, not a genre change. Detective fantasy returns from ten to
  nine; its split trigger disappears. Hidden lander romance rises from five to six. No definition changes.


  ## Scope and book-level evidence

  The author''s homepage groups Palace of Dreams and The Horn under one world, and The Horn page explicitly identifies it
  as a series from the world of Dreaming Death. Separate Golden City and King''s Daughter worlds are not included. Seven distinct
  novels are supported:


  - Dreaming Death (2016): army investigator Shironne and royal guard Mikael solve ritual murders through their complementary
  psychic sensitivities. The official excerpt calls the killings blood magic through the victim''s and investigators'' beliefs,
  but shows knife wounds, poison suspicion and blood sacrifice, not a successful supernatural rite. Dream-transmitted injuries
  are presented as an extension of the dreamer''s psi. Neither believing in gods nor murdering in their names establishes
  actual gods or magic.

  - Oathbreaker (original ebook 13 December 2016 per author-publisher catalogue; 2017 print/review date is not a second book):
  Amal, engineer and secret Oathbreaker, finds an amnesiac tied to the abandoned Salonen Fortress. The question is whether
  to reopen or destroy it before rival Cince gains it. The fantasy surface unfolds into SF; Dalyan is a machine-grown copy
  of an old colonist.

  - Original (2017): the Fortress destroys a transmitting implant; Dalyan''s copied memories could reopen Salonen. The hidden
  engineers travel to court seeking support. The full review identifies the copied founders as interstellar colonists and
  the Fortresses as AIs. Ends with the political/technical decision still unresolved.

  - Overseer (2017): Aulis is another embodied copy from the same engineer''s computer backup, retaining the memories Dalyan
  lacks. Altered copies infiltrate court and the Fortresses for Cince. Reopening Salonen and granting Aulis''s private resurrection
  request threaten to change the whole order. Completed trilogy coverage describes the original planetary colonization, genetically
  altered human founders, secret engineering knowledge, failing Fortresses and a choice about recovering the science concealed
  from the Anvarrid. Do not invent the exact climactic operation or the resurrected person''s identity.

  - In Dreaming Bound (2019): Shironne is kidnapped; Mikael uses their psychic tie to recover her. She enters the underground
  Fortress and its controlled yeargroup society. The full review expressly describes an AI Fortress and intricate psychic
  powers. The social order constrains their relationship while the investigation asks who can use Shironne''s unusual talent.

  - Dreams from the Grave (2020): Mikael''s father''s murder and his unknown half-brother drive the provincial/family inquiry.
  Completed reviews describe the parents'' murder mystery being solved and the adjacent Horn events supplying the science-fictional
  background. This is not literal time travel: revisiting a remembered or prophetic death through psi does not physically
  change history.

  - Of Gentler Dreams (5 May 2026): published book 4 in the current author-publisher catalogue, 86,680 words. Marriage, the
  Families'' release of Fortress knowledge, a new province, an apparent murder of Mikael''s uncle and unwanted inheritance
  bring the two series'' political and technical changes into the same foreground. The current publisher/retailer synopsis
  supports these facts. A short completed-reader notice calls it the final book with loose ends brought to a satisfactory
  conclusion, but its exact solution is not established here. Older author pages still advertise Twilight of Dreams as the
  planned final novel. Do not add that unfinished working title as a separate eighth novel or assert a confirmed rename.


  Excluded: Shared Dreams (three short stories and an excerpt), omnibus The Horn, excerpts, serial fragments, reissues and
  other worlds. No unauthorized full-book sources used.


  ## Hard root-down walk

  Speculative fiction > Science fiction > Atemporal SF > Science fantasy > Planetary romance > Lost-colony planetary romance
  > Hidden lander romance.


  - Fantasy rival: the initial one-book placement mistook the invented names, psi and publisher blood-magic wording for proof
  of a fantasy realm. Later included novels positively reveal human planetary colonization, genetic alteration, computer-backed
  embodied copies, implants, engineering and AI Fortresses. These are not merely an invented fantasy culture using machines.
  The actual blood-ritual evidence remains belief and murder, without a demonstrated spell effect. Psi is not magic under
  the project''s rules. The author''s current publisher catalogue classifies Original and Overseer as science fiction/genetic
  engineering, though Palace marketing still says fantasy. Classification follows the demonstrated engine, not retailer labels.
  Moderate root wobble remains because the first novel is marketed with literal-sounding magic language; no claim is made
  that every belief is definitively debunked. Reopen if actual non-psi supernatural efficacy is established.

  - Historical/Modern/Futurist SF rivals: distant planetary descendants with buried origins and no usable Earth-era anchor.
  Neither a recognizable Earth past nor a contemporary incursion nor an openly extrapolative spacefaring future. Atemporal
  wins. No actual included-book time travel shown, so Time travel fiction fails; precognition and relived death visions are
  not automatically temporal transport.

  - Fabulation: no fiction-made-real, mutable narration or ontological experiment. New Weird: no central weird/ecological
  estrangement engine. Reincarnation: copied data and grown bodies are not souls reincarnating. Parallel-world fiction: no
  alternate timelines or branch worlds.

  - Science fantasy fits the fantasy-like colony surface and buried technological engine. Hard science fantasy fails because
  hereditary psychic broadcast, psychometry and death-dreaming do not meet known physics. Ozymandian tech loses because the
  later Horn novels explicitly reveal the technical mechanism rather than leaving the central mechanism an unresolved magic/technology
  ambiguity. Old Mars fails setting/tradition.

  - Planetary romance: provincial adventure, court danger, psychic family relations and inherited alien-world society provide
  the reading experience. Classic planetary romance loses because no visiting Earth hero enters this society; Far-future planetary
  romance loses to the specific colony-descendant condition. The completed trilogy source positively identifies planetary
  colonization by genetically altered humans; no particular Earth departure date or travel mechanism is invented.

  - Lost-colony planetary romance: inhabitants descend from founders whose advanced scientific inheritance has become secret
  custom. Hidden beats Abandoned: active Oathbreakers maintain forbidden language/engineering and withhold knowledge from
  conquerors and most inhabitants; later reopening knowledge is an explicit social choice. This is not a founding collective
  renunciation. Hidden beats Broken: failing machines are real, but engineers'' deliberate ongoing secrecy controls access.
  Physical decline alone does not explain the division.



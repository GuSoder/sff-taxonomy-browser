placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Science fiction -> Atemporal -> Science fantasy
  -> Planetary romance -> Lost colony planetary romance. David Weber''s Safehold (Tor, 2007 to 2019; Wikipedia, ''Safehold''):
  after the Gbaba destroy the Terran Federation, eight million colonists hide on Safehold, their memories rewritten, with
  a pre-industrial technology base enforced by the Church of God Awaiting on pain of death. Centuries later the android Nimue
  Alban (Merlin) wakes and sets a kingdom''s technological and naval revolution against the Church. The people are descendants
  of forgotten settlers whose old technology has become myth and custom, which is the leaf''s definition (same shape as Pern,
  Darkover). Tried and refused: Dystopian rebellion (Future-of-Earth branch; Safehold is not Earth, and the Church is a theocracy
  more than a totalitarian state), Colony life (the war, not settled life, is the story), Space navy and Military SF (the
  war is wet-navy on one planet, not in space), Hard SF, Lost knowledge (Earth). Wobble: moderate to high. It is a planetary-romance
  leaf whose setting fits but whose tone is naval war and religion, not a planet''s wonders. The alternative is a seed if
  he wants one (a Revolutionary SF leaf for tech-vs-theocracy). Nine novels folded as one fiction (11j); Through Fiery Trials
  (2019) is not in the queue; omnibus skipped. Years are first publication from Wikipedia; queue years are reissue dates.


  Approved lost-colony split 2026-10-29: Founders impose false memories and sacred technological prohibitions; the Church
  maintains active repression of technological recovery. Hidden does not require leaders themselves to retain the forbidden
  capability. https://www.sffworld.com/2011/12/bookreview784/ Authority: phonemsg-01M64CXKTBZPD549Z6EPDRPBDW.'

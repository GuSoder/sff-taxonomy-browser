definition: Planetary-colony societies whose inherited technological civilization cannot be sustained or reproduced because
  its physical means have failed, been destroyed or lost, or cannot be supplied by the world. The broken lander is the broken
  technological lifeline, not necessarily a literal wreck. Surviving advanced machines and later outside contact are compatible
  with this condition; the label does not establish that destruction was accidental.

placement_history:
- date: '2026-09-23'
  note: 'Mirror sync: file moved from taxonomy/speculative-fiction/science-fiction/spacefaring-fiction/planetary-romance to
    match live tree; placement unchanged on site.'
  previous_canonical_genre: planetary-romance
- date: '2026-10-06'
  reason: Split of Planetary romance by how the hero stands to Earth; re-walked root-down into Lost-colony planetary romance
    (curator "Approved" (phonemsg-01M48DAFVZE9B98WX5QCQ8ANMV, 2026-10-06 12:49 PM)).
  from: planetary-romance
  to: lost-colony-planetary-romance
- date: '2026-10-08'
  reason: Folded Dragon's Code (Gigi McCaffrey, 2018, an authorized Pern novel, Piemur among the exiled Oldtimers) into the
    series fiction under rule 11j; same leaf, no placement change. Intake MC03449.
- date: '2026-10-11'
  reason: Folded nine later Pern novels from the 10k list (Dragonseye/Red Star Rising 1996, Dragon's Kin, Dragonsblood, Dragon's
    Fire, Dragon Harper, Dragonheart, Dragongirl, Dragon's Time, Sky Dragons; Anne and Todd McCaffrey) into the series fiction
    under rule 11j; same leaf, no placement change. Wikipedia 'Dragonriders of Pern' lists all nine as Pern novels. Collections
    A Gift of Dragons and The Girl Who Heard Dragons skipped, On Dragonwings is a 2003 omnibus of Dragonsdawn, Dragonseye
    and Moreta (already in). Intake MC00749-MC00753, MC00772, MC09633-MC09635.
- date: '2026-10-29'
  from: lost-colony-planetary-romance
  to: abandoned-lander-romance
  reason: 'Approved corrected three-child split (phonemsg-01M64CXKTBZPD549Z6EPDRPBDW). Qualified mixed case: settlers deliberately
    choose pastoral/minimal-technology life; Thread and disasters deepen the loss. Approved priority gives that founding renunciation
    precedence over subsequent physical loss. Later Abominator repression is a faction opposing recovery, not the defining
    founding relationship of the entire fiction. https://billionlightyearbookshelf.com/reviews/dragonsdawn.shtml'
placement_rationale: '



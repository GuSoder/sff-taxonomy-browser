placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal SF > Science fantasy > Planetary romance >
  Far-future planetary romance. In the far-future Gaean Reach, the orphaned Jaro Fath quests across settled worlds to
  learn where he came from, ending on Fader - a planet closed to the galaxy, whose aristocrats long ago engineered slave
  races and now live in fear of their creations (Wikipedia plot summary; Underwood/Tor 1996). Natives of a far future with
  old Earth faded, strange habitats and remade humans - the leaf''s definition, and Vance is the form''s touchstone.
  Rejected: Space colony politics (no contest for a colony''s rule; Fader''s justice is personal), Space opera (a picaresque
  identity quest, not fleets). Wobble: low to moderate; the identity quest is the spine, but the world-tour register is
  exactly this leaf. Year: 1996 (Underwood h/b; Tor p/b). Queue id MC04099.'

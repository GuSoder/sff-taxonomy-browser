placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Science fantasy > Planetary romance >
  Far-future planetary romance. Dirk t''Larien is summoned by a whisperjewel to Worlorn, a rogue planet drifting away from
  its sun, whose abandoned festival cities are being reclaimed by the clashing human cultures of far colonies, to find a love
  he lost; a tale of codes of honor, feuds and a dying world in twilight (georgerrmartin.com, PRH). The people are descendants
  of far colonies in a future where Earth plays no part, and the strange habitat and its old engines carry the sweep of fantasy,
  which is the leaf''s definition. Rejected: Classic planetary romance (Dirk is not a visitor from Earth), Lost-colony planetary
  romance (the colonies are in contact with each other and not forgotten), Dying earth (the sun is not Earth''s and the book
  is no far-future tale under a moribund sun in that sense). Wobble: the leaf says natives of the far future, but Dirk is
  a visitor to Worlorn from another world, so it fits only loosely; it is also labelled space opera by the publisher.'

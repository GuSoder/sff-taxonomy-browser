placement_rationale: 'The three Senal/Irion novels (SFE): Kirith Kirin (2000, fantasy), The Ordinary (2004, science fantasy,
  Lambda winner), The Last Green Tree (2006 fixup, space opera tending to transcendence). A flat mage-made world of myth collides
  with, then merges into, Senal''s cybernetic galactic civilization; Great Mage, singing priests and Gates as fantasy furniture
  inside a far-future SF cosmos where Earth is never referenced. Walk: hard-science-fantasy fails (real magic, Gate travel
  - no known-physics bar); ozymandian-tech fails (magic is real, not buried tech); classic/lost-colony planetary romance fail
  (the people are far-future natives, not Earth visitors or forgotten colonists); theological space opera only fits vol 3''s
  tonality, not the series engine.'

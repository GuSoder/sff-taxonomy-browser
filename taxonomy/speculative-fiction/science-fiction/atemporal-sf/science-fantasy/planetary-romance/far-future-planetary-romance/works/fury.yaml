placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal SF > Science fantasy > Planetary romance >
  Far-future planetary romance. Generations after old Earth''s ruin, humanity''s remnant lives in the Keeps, domed cities
  under Venus''s seas, alongside the Immortals, a long-lived strain; Sam Reed''s ambition drives the colonization of the
  lethal surface and the Keeps'' final fall (EBSCO Research Starters summary; sequel to the novella Clash by Night). Natives
  of a far future where Earth is gone, strange habitats and remade humans - the leaf''s definition. Rejected: Classic
  planetary romance (no visitor from Earth; the Keeps folk are the natives), Dying Earth (the world is Venus, not Earth,
  and its people have a future). Wobble: low. Year: 1947 (Astounding serial as by Lawrence O''Donnell; book 1950). Queue
  id MC03826.'

id: tristopolis
title: Tristopolis
authors:
- John Meaney
first_published: 2007
canonical_genre: hard-science-fantasy
placement_status: accepted
placement_rationale: 'Whole-fiction root-down walk 2026-11-05: Speculative fiction > Science fiction > Atemporal
  SF > Science fantasy > Hard science fantasy. Six novels share Tristopolis, including the separately branded Continuation:
  Bone Song2007, Dark Blood2008 (Black Blood is the US2009 retitle, not a third novel), Tristopolis Requiem2018,
  Tristopolis Howling2020, Tristopolis Revenge2021 and Tristopolis Chasm2024. Bibliographies and individual author
  release pages establish completeness; author March2026 says no Tristopolis in pipeline. Do not fold into the Pilots/Nulapeiron
  universe merely because their publisher is named Nulapeiron Press: author2026 explicitly lists his interconnected
  Pilots, Reynolds, Cumberland, Case/Kat settings without Tristopolis; Tristopolis has its own alternate cosmology
  and recurring people. Bone Song is official cop Donal protecting a diva from bone-trafficking conspirators; Dark
  Blood is the now-zombie cop pursuing the Black Circle and his lover''s killers amid anti-undead politics; Requiem
  frees him from a coffin to face world-spanning conspiracies; Howling follows his dead lover''s apparent return
  and a stronger eldritch danger; Revenge puts cop-turned-PI Donal''s loved ones at risk; Chasm starts a missing-person/crime-lord
  case that threatens the city. Each continuation is independently grounded rather than inferred from book1. The
  mystery engine persists, but his change from cop to PI does not justify splitting the shared fiction. Root is
  genuinely contested: PRH markets gothic fantasy and multiple reviewers call it dark urban fantasy; Strange Horizons
  says the horror is surface and the world scientifictionally coherent, SFE calls it a multiplexly rationalized
  SF frame, and original UK publisher explicitly says the supernatural and undead have a scientific rationale. Most
  decisively, Meaney tells BSFA that rigorous physics runs through his dark fantasy, an alternate Earth diverging
  during solar-system formation. Necroflux reactors replay memories retained in bones; wraith-operated machinery,
  computational blood and apparent necromancy are the engineered fantasy surface. We do not silently convert the
  word necromancy into actual unexplained magic against that primary evidence. Atemporal wins over Futurist/Modern-day/Historical:
  this is a wholly remade Earth with purple skies, different day/week lengths and no usable historical era, not
  a period society rewritten by a human-history fork. Ancient solar-system divergence alone is not a Rome/medieval
  Antique alterations narrative; the scientific-fantasy world is the point, not counterfactual recorded history.
  No retrieved evidence of time travel, parallel-world crossing, reincarnation-spanning eras or narrative fabulation.
  Science fantasy wins over New weird because publisher and author positively supply a rational physical foundation
  rather than a world resisting one explanatory genre; Far weird remains a strong surface/reader alternative. Hard
  science fantasy8 is the closest accepted leaf, not planetary romance: neither an Earth visitor adventure, lost
  colony nor forgotten far-future Earth, and no buried ancient high-tech empire for Ozymandian tech. Author''s rigorous-physics
  statement and UK publisher rationale support the known-physics gate; no FTL or teleportation is evidenced. Wobble
  substantial: no independent line-by-line demonstration of necroflux physics was found, and the later books'' eldritch
  vocabulary is not itself proof of a changed physical ontology. This is a source-grounded classification of the
  whole fictional premise, not a real-world scientific endorsement of extracting memories from corpses. Technomancy
  would match imagery almost perfectly but requires actual magic under Fantasy; that root is defeated by the explicit
  rationalized engine. Detective/Private-eye fantasy similarly match his profession but cannot override root; contemporary
  occult leaves additionally require recognizable Earth, and Noir fantasy requires a1930s/1940s era. No definition
  changed.'

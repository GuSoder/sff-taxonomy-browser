placement_note: 'Root-down: Science fiction -> Atemporal SF (the wooden city is deliberately unplaceable in Earth time; NPR: "fairytale-esque, but impossible to place") -> Science fantasy -> Hard science fantasy. Fairytale surface (a king, his talking-cat advisor, a wooden city without words for concrete or electricity) built on a technological engine: the citizens are wooden automata run by code, the city a constructed enclosure kept by an alien intelligence (geeklyinc.com spoiler review: "automata who inhabit it"; NPR 2020-03-22; booklistonline.com). Physics holds: no FTL, no teleportation.'

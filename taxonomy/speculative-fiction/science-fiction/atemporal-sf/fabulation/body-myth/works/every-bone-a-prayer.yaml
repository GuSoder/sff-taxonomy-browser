id: every-bone-a-prayer
title: Every Bone a Prayer
authors:
- Ashley Blooms
first_published: 2020
canonical_genre: body-myth
placement_status: accepted
placement_rationale: Blooms describes Misty's literal empathic speech with animals, buildings and the land, alongside unexplained objects and transformations in an Appalachian holler. The author calls the work fabulism or slipstream rather than magical realism; its unstable exchange between trauma, landscape and impossible material change fits Worlds in flux.

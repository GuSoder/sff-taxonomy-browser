placement_rationale: 'L. E. Modesitt Jr.''s The Hammer of Darkness (1985; Tor 2006 reissue; Tor, Macmillan, author site, SFF
  Chronicles review): in a galactic-empire future, grad student Martin Martel is stamped with a Query on Karnak, found to
  be an esper and banished to Aurore, the vacation world where ''gods'' (Apollo, Thor and others, perhaps just far stronger
  espers who rule to stave off boredom) walk among the people; he refuses godhood, but a confrontation with them over his
  life and the fate of mankind is coming. Walk: Science fiction > Atemporal > Fabulation > Godgame (godlike powers contest
  the hidden pattern of reality; here the question is whether the gods are gods or espers, and Martel must challenge them).
  Rejected: Space dystopias (at 9; Karnak''s Regency is oppressive but the book''s weight is Aurore''s gods, not a closed
  society), Spacefaring (not expanded). Wobble: medium, the setting is an interstellar empire but the engine is the gods contest.
  Sources thin on the late chapters; not read in full.'

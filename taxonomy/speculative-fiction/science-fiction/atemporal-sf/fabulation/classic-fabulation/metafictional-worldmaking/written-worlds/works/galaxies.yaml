first_published: 1975
canonical_genre: written-worlds
placement_status: accepted
placement_rationale: 'Presents itself as the author''s notes toward an unwritten novel of the same name (''this will not be
  a novel so much as a series of notes toward one''); the hypothetical text is named and visible inside the book, so its unwritten
  fabric is the world - the leaf''s def. The walk rejected books-in-books at the fabulation gate: no invented document exists
  inside the fiction; the inner novel is declared unwritable and the notes address the reader directly. Walked out of the
  hard-conceptual-sf split as too metafictional for hard SF; placed here by the curator''s EXECUTE (phonemsg-01M3M6YKR3QMEREZSK7WZ27S5E),
  6->7.'

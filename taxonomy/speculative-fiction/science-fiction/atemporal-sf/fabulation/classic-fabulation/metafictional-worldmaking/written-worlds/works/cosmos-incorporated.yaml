placement_status: accepted
placement_rationale: 'MC 06585 Grand Junction, 25 November 2026. Whole-fiction walk for Cosmos Incorporated (2005) and Grande
  Jonction, translated as Grand Junction (2006). The English editions are 2008/2009. This is a direct sequel, not an omnibus,
  correcting the preliminary queue note. Academic analysis and completed reviews identify the continued characters, the twelve-year
  interval and Gabriel Link de Nova as the child of the first novel''s central couple. The planned third book is not added.
  Villa Vortex belongs to a different projected cycle: Olivier Noël explicitly distinguishes it despite thematic kinship.
  No shared characters or continuous chronology with the Babylon fiction were established; repeated ideas are not a shared
  universe.


  Speculative fiction > Science fiction, by the curator''s Fabulation exception rather than by a claim of scientifically plausible
  angels. The opening presents a cybernetic assassin, neural surveillance and a future spaceport; the central revelation is
  that Vivian McNellis has literally written Plotkine into the world''s narrative. The sequel continues creation versus de-creation,
  language disappearing from books, and a child whose music counteracts the world''s dissolution. The theological imagery
  is material and the End-times fantasy rival is strong. But the curator''s 29 September rule treats characters revising reality
  as Atemporal/Fabulation even when called magic. The 27 September rule likewise puts fiction made real in Books in Books
  regardless of horror register. The mechanism decides, not the marketing label or Catholic iconography. This does not establish
  a general exemption for biblical miracles in SF.


  Science fiction > Atemporal SF: the lived world and its inhabitants can be authored, de-created and brought into being by
  narrative. The dated 2057 and 2069-70 surface is not a stable temporal container. Futurist SF is the obvious opening rival,
  especially Cybernoir operatives for the assassination, machine minds for the controlling metastructure, or ruined-Earth
  fiction for the sequel. Those describe the furniture and local stakes, not the revealed ontological mechanism. Historical
  and Modern-day SF do not fit the dated future surface either. Literal time travel was checked; no physical crossing of eras
  is established in the sources read. Angelic aevum and a description of an odyssey through time and space are not independently
  temporal travel. Atemporal rests on authored reality, not an invented time machine.


  Atemporal SF > Fabulation: the work foregrounds narrative''s power to manufacture a person and the struggle between rival
  narratives of creation and de-creation. Not science fantasy: this tree''s science-fantasy surfaces have technological engines
  and an invented/unplaceable world, not literal narrative causation. Not parallel-world fiction: there is no governing mechanism
  of travel among stable parallel universes. Not reincarnation fiction: Plotkine discovers authored origins, not a succession
  of remembered lives. Not New Weird merely because the language is strange.


  Fabulation > Classic fabulation > Metafictional worldmaking > Written worlds. The decisive source is Boileau''s academic
  account of Plotkine as literally written into the story of the world, supported by PW''s completed review of Vivian rewriting
  the world and Olivier Noël''s detailed account of the fiction written in a Hong Kong cell. Creation and anti-creation remain
  the sequel''s engine, not just a twist in one volume. Books in Books is a close alternative: Scripted books in books fits
  discovering authored origins, while Textual trespass fits a fiction becoming embodied. Written worlds is more exact for
  the pair because writing is an active cosmogonic instrument, not chiefly an embedded document whose authority is doubted
  or a traveler crossing a named book''s boundary. The existing Written worlds comparators include The Land of Laughs, where
  an author writes people and their town into being, and Unlanguage, where writing remakes existence. This placement follows
  that concrete mechanism, not mere resemblance in prose.


  Metafictional worldmaking siblings: Told worlds loses because spoken storytelling alone does not compose the world; the
  sources explicitly identify written creation. Projected worlds loses because recordings or machine projections do not account
  for Vivian''s writing. Retconned worlds loses because no source establishes a past event being overwritten and causal history
  resuming under a replacement past; creating Plotkine and fighting de-creation are not automatically a retcon. Inner space
  and unmoored selves are serious rivals given amnesia and one critic''s alternative hallucinatory interpretation, but the
  direct academic and completed-review accounts identify narrative creation, and the sequel carries its consequences forward.
  Godgame catches metaphysical opposition but not its writing-based instrument. Body myth catches angelic transformation but
  misses the cosmogonic narrative.


  Wobble: moderate. Christian apocalypse, genetic mutation and metafiction are deliberately fused. The placement does not
  deny angels or demand their scientific demystification; it applies the curator''s specific narrative-reality rule. The more
  narrowly literal textual-trespass reading remains plausible, but the whole pair''s creation/de-creation supports the active
  worldmaking shelf. Existing Written worlds 8 to 9. No structure or definition changes.



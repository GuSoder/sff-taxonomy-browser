placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation
  -> Classic Fabulation -> Metafictional worldmaking. SFE identifies the collection’s linking framework:
  eighteen SF tales spring to life as magical tattoos on the Illustrated Man. Simon & Schuster likewise
  presents living cities, technology and rockets unfolding across tattooed skin. The stories span worlds
  and times, while the openly magical storytelling frame composes their reality, making the atemporal
  foundational-fabulation leaf the deepest fit.'

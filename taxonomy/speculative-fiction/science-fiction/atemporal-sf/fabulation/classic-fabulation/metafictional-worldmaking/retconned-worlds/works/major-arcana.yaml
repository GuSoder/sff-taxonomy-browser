placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation
  -> Classic Fabulation -> Metafictional worldmaking -> Retconned worlds. Ash del Greco''s deliberate,
  repeated spoken requests ''revise'' experienced causality: her dead friend Ari returns; a pregnancy
  with Jacob enters a revised history despite no sex in the prior narrative. The book''s comic-book frame
  and final self-reference make retroactive continuity a visible narrative engine, not merely a supernatural
  garnish. It does not literally cross into its embedded comic, so Books-in-books > Textual trespass is
  not the route. The curator chose Retconned worlds on 2026-09-29.'

placement_status: accepted
placement_rationale: '# Echo universe: MC06590-593

  25 November 2026


  ## Decision

  One connected fiction, 30 published novel volumes, in Scripted books in books. No node or definition changes. Leaf grows
  from three to four fictions. The catalogue label "Echo universe" describes the connected setting, not an official title
  for every subseries. English volume titles below are editorial translations for navigation, not claims of published English
  editions. Original Russian titles remain in the canonical records.


  ## Authority and scope

  Single-fiction placement and shared-universe consolidation are delegated by the owner''s original iMessage phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX,
  30 October 2026, taxonomy anchor conversation. Structural changes still need approval. None is being made.


  The four queued English Labyrinths titles are translations assembled from original novella collections. They do not become
  eligible novels because English packaging calls them novels. The connected fiction nevertheless contains later actual novels.
  Original eight Labyrinths collections and the opening Chronicles volume, which contains two novellas, are excluded from
  the volume list. Later seven Chronicles works are classified as novels in specialist individual work records and original-edition
  contents. AST''s generic omnibus and author biographies call the cycles novellas, a genuine conflicting usage retained here.
  Adopt the specific work-level bibliography rather than the blanket marketing description.


  ## Shared universe, not author branding

  Sir Max recurs in the Echo sequences, My Ragnarok, Nests of Chimeras, Encyclopedia of Myths and Book of Complaints. Yellow
  Metal Key crosses into the same character network. Courtaine continues Philipp and Edo Lang. More importantly, the same
  inhabited city Lane, its book-catching inhabitants and recognizable locations recur across Big Wagon, two Chronicles novels,
  Courtaine and Book Catchers. MirF''s independent 2023 review traces this shared setting explicitly. This goes beyond isolated
  cameo links. ReadRate''s claim that Courtaine is unrelated to Echo is noted, but loses to concrete recurring setting and
  character evidence.


  ## Full root-down walk

  Speculative fiction > Science fiction > Atemporal SF > Fabulation > Books in books > Scripted books in books.


  Fantasy is the strongest initial rival: the books contain literal magic, other worlds, dream crossings, comic adventures
  and magical investigations. This is not being denied or rebranded as technology. The owner''s September29 ruling routes
  characters revising reality to Atemporal Fabulation even when called magic. Apply that specific exception only because the
  included novels question whether narrator and experienced reality are authored at all. Encyclopedia of Myths puts Max''s
  authors and their invention into the story; its hero discovers the people writing his books. The licensed opening of Master
  of Winds and Sunsets describes a dreamed city becoming an independently inhabited reality. Orekhova''s academic account
  identifies world recreation and the progression from thought/dream through speech and writing into realization across the
  Echo cycles. This is larger than an ordinary magical detective''s powers. The original Labyrinths ending is corroboration,
  not the sole gate evidence, since those collections are excluded.


  Science fiction alternatives: Historical SF fails as the whole fiction has no reliable shared historical frame; Earth episodes
  do not define it. Futurist SF fails because future science, technology and alien civilization are not the governing concern.
  Modern-day SF describes some external settings, not the created worlds and unstable authorship. Atemporal is the route because
  no stable Earth-time frame contains these authored realities.


  Within Atemporal: Science fantasy lacks a scientific substrate; Reincarnation is not an ordered sequence of one soul''s
  lives; Parallel-world fiction captures journeys but misses the explicit constructed status of the worlds and narrator; New
  Weird''s material grotesquerie/ecological hybridity is not the whole-fiction engine. No independent science-fiction time-travel
  premise has been verified in the included corpus. Remembered or contradictory biographies, dream travel and magical references
  are not silently converted into such proof. Time-travel fiction would take priority if a verified SF temporal mechanism
  emerged. Fabulation fits the active challenge to storytelling''s reliability and the world''s constructed status.


  Within Fabulation: Body myth is not the governing transformation; Alternate worlds is not merely literary alternate Earth
  history/geography; Godgame''s rival occult players are local rather than the overall architecture. Inner space is a serious
  rival: dreams create realities. Yet the created city becomes autonomous and shared, not chiefly an inseparable image of
  psychological injury. Psychogeographic fabulation, Consciousness fiction and Projected realities therefore describe aspects
  rather than the defining creator/created relation. Within Projected realities, Mindscape treks overweights traversal of
  a psyche-shaped enclosure; Hauntings overweights returning guilt or memory; Outbreaks overweights projected objects spreading
  through ordinary places.


  Classic fabulation > Metafictional worldmaking also fits broadly. Its children do not honestly reduce this corpus to one
  instrument: Told worlds requires spoken telling as substance, Written worlds written fabric, Projected worlds recordings/images/machines,
  and Retconned worlds deliberate revision of causal history. Do not call every wish spoken narration or every dream a machine
  projection. Absurdist constructed realities is less exact than the explicit author/text question.


  Books in books wins on the included Encyclopedia''s author-character relation and the connected fiction''s recurring uncertainty
  over whose story its lives inhabit. Within it: Contradiction fiction is not chiefly conflicting documents; Meta remyth is
  not chiefly inherited myth replay even though Ragnarok exists; Textual trespass is not chiefly breaching one specific book
  boundary. Scripted books in books already covers inhabitants or readers confronting the possibility that their lives are
  someone else''s text. That existing definition fits without widening it.


  Wobble: substantial. Fantasy, portal adventure, dream making and magical detection remain important reader expectations.
  This placement follows the owner''s particular reality-authoring rule and the shared-fiction about-ness rule, not a claim
  that conventional criticism calls the corpus science fiction.


  ## Volume decisions

  Seven later Chronicles + eight Dreams + My Ragnarok + Nests of Chimeras + two Encyclopedia volumes + Book of Complaints
  + Yellow Metal Key + Big Wagon + five Courtaine volumes + three Book Catchers = 30.


  - Nests: 1998 Ovyotganna and 1999 Hugayda are two tellings/versions of one novel. Count once, retain original1998 date;
  use an available later cover.

  - Encyclopedia: one continuous novel first issued in two physical volumes. Count two volumes, no omnibus inflation. Volume1
  has a2002 imprint but actually appeared November2001, explicitly recorded in the edition bibliography; volume2 is2002.

  - Big Wagon: a linked-story collection reading is explicitly supported by MirF and permitted in the specialist note. The
  first edition identifies a novel, with Edo Lang connecting22chapters. Include on that original novel identity, retaining
  the form conflict. This is not a general exemption for collections.

  - Courtaine: Blue2018, Yellow2019, Green volumes1/2in2020 and volume3in2021. The light/dark endings are alternative versions
  of the final volume, not two additional sequels. Count once and use the light version''s verified front.

  - Book Catchers: three published novels2023,2024,2025. Final2025 volume verified, not a forthcoming placeholder.


  ## Cover curation

  One whole-fiction candidate sweep plus a correction pass for wrong fronts and tiny thumbnails. Actual contact-sheet pixels
  inspected. All selected fronts are hotlinks, with no cover bytes in the repository. No verified included English edition
  was found; all selected Russian covers have shows_english_title=false, so titles and the fiction label need overlays. Decorative
  portraits and detailed colored illustration beat plain icon designs; lower-scoring typographic and stained-glass options
  remain honest where that was the available field. Exact candidate and edition URLs, per-book ratings and reasons are retained
  in canonical curation metadata. No claim of a complete uniform edition across this connected corpus.



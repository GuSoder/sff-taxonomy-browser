placement_rationale: '# Hornsboggle & Dodge: MC06614

  25 November 2026


  ## Scope and decision

  One fiction, two published 2026 novels by Meg Pennerson: Dragons, Heists and Other Retirement Plans (26 March UK; 1 September
  US edition) and Wizards, Heists and Other Ways to Steal a Spellbook (27 August). Author identifies them as books 1 and 2.
  No third published novel verified. Author bonus chapter about August and short Shifting excluded by form, not added as novels.


  Place Scripted books in books, 4 to 5. The included sequel changes the root test: Hachette''s fuller publisher synopsis
  says the Book of Appellations determines each person''s destiny when they name themselves in a magical ceremony, and the
  client wants the book to change his name and fate. The story is about stealing and controlling that text, not merely reading
  an ordinary spellbook. Its cozy heist register does not erase the owner''s rule that characters revising reality through
  text go to Fabulation even when called magic.


  Important uncertainty: the available completed reviews do not describe all final limits of the book. Do not claim a retroactive
  history rewrite, time travel, or that every object in this universe is literally prose. Publisher evidence is explicit about
  text determining destinies; it leaves the client''s success and exact final implementation less clear. This is a moderate
  root/leaf wobble, not a claim of encyclopedic plot knowledge.


  ## Whole-fiction evidence

  Retired thieves Katherine Hornsboggle and Imogene Dodge, both in their seventies, leave their seaside retirement to rescue
  Saint Percival''s convent and its dragons from fraudulent land acquisition. A knitted magical map, old rival Ruben and a
  cast of magical cats support the caper. The continuation hires them to steal the Book of Appellations. Criminal pursuit
  carries them across the Parched Plain and into the Forbidden Woods, where an old wizard, young ranger Thorn and a growing
  group of strays help. The sacred name/destiny artifact is the objective, not an incidental background charm.


  Completed reader reviews agree on friendship, pet viewpoints, warmth and second chances; Gali explicitly says the first
  novel has only a hint of romance. A Dance With Books dislikes its omniscient style and execution but confirms the same elderly
  thieves, animal points of view and attempted return to their last job. Budget Tales and Whispering of the Pages read the
  sequel, confirming the same cast and found-family adventure, though not detailing the artifact''s final mechanics. The author''s
  discussion questions independently center friendship, client trust and the second book''s magic system. Their silence about
  mechanics is not evidence that the publisher''s more specific account is false.


  ## Full root-down walk

  Speculative fiction > Science fiction > Atemporal SF > Fabulation > Books in books > Scripted books in books.


  Root: the first novel alone suggests Fantasy, with dragons, knitted spell-maps and interdimensional cats. The included sequel''s
  text determining human destinies is the decisive competitor. Owner original phonemsg-01M3PNAXQY8WRA9F3JFCNA45B0 places character
  revision of reality under Fabulation even if named magic; original phonemsg-01M3HW2V6S28RFJTTXA59557BM rejects requiring
  a literary-experimental register for fiction-made-real. This placement applies that mechanism rule, not an invented scientific
  explanation for dragons. The owner allows fabulation outside an Earth-anchored universe. No claim that a fantasy world secretly
  originated on Earth.


  Fantasy rival walked honestly: Parched Plain/Forbidden Woods, everyday dragons, enchanted maps and a sacred naming institution
  indicate an invented realm rather than recognizable Earth. No human journey from Earth is established, so the adjective
  interdimensional attached to a cat is insufficient for Portal fantasy. Within Fantasy realms, Heart fantasy > Cozy fantasy
  > Cozy peeps fantasy best captures the completed reviews'' warm friendship and found-family center. Cozy place overweights
  the convent, which is the first job, not a continuing hosted house; Cozy craft overweights knitting, a practical device
  rather than a working trade''s whole community. Romantasy would inflate a minor flirtation. Sword and Sorcery > Caper fantasy
  is a strong plot rival because both books are heists, but the confirmed gentle communal reading experience competes with
  its action-forward parent. Comic realms captures jokes, animal banter and absurd old-age mishaps but not parody or a satirical
  institution as the governing engine. Gothic menace, Epic world order and Far shores cultural counterpart are not the sustained
  promise. None of that authorizes bypassing the higher text-authorship rule once the second novel is included. No definition
  widened to dodge the root choice.


  SF temporal: Historical, Modern-day and Futurist presume a stable Earth-time anchor and are not honest for this invented
  realm with editable destinies. Atemporal follows the Fabulation mechanism, not an unverified time-travel claim. No actual
  temporal crossing established; long retirement and youthful memories are not time travel.


  Atemporal siblings: Time travel fails for lack of included temporal travel; Parallel worlds would overread the cats; Reincarnation
  is absent. New Weird''s weird urban genre mixture and Science fantasy''s apparent scientific foundation do not explain a
  sacred text that determines lives. Fabulation, specifically the owner''s mechanism-based exception, is stronger than treating
  every magical artifact as technological SF.


  Fabulation: Books in books because a particular in-world book determines destinies and is sought to change them. Classic
  fabulation''s formal experiment, Inner space''s subjective psyche, Body myth and alternate-world model are not the evidence;
  Godgame would need rival powers manipulating reality as a contest rather than a sought naming text. The Book of Appellations
  is not evidence of a godgame simply because called sacred.


  Books in books children: Scripted, as lives and futures are authored/determined through an authoritative book inside the
  world. Contradiction fiction needs incompatible documents/accounts, not established. Meta-remyth needs an inherited cultural
  text being replayed, not a newly invented sacred book. Textual trespass needs characters entering a particular fiction or
  its characters escaping, not merely a book being stolen in-world. Scripted is the closest existing leaf without inventing
  that entry/escape mechanism. Moderate wobble: the published synopsis establishes assigned personal fate more narrowly than
  the entire cosmos as text. The leaf explicitly covers lives/events authored inside the world, not only full-universe simulations.
  No seed required, no capacity gate reached.


  ## Covers

  One sweep of author and exact publisher fronts, actual five-front contact sheet inspected. Both art variants are the same
  basic designs. Selected author-hosted large flat fronts, 1575x2400 and 2058x3213. Detailed enough to read, colorful illustrated
  dragon/cat/village, but stylized/cartoon rather than the preferred painted realism, both score 6. Smaller publisher alternatives
  are not a different superior artwork. English title/author visible on both volume covers; fiction representative requires
  Hornsboggle & Dodge overlay. No matching-artist claim. Hotlinks only, no cover bytes committed. Live hotlink pixels must
  still be checked.



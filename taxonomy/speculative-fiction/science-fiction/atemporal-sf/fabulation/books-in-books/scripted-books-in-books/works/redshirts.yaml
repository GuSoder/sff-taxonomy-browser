placement_rationale: 'Scalzi''s Redshirts (Tor, June 2012; Hugo and Locus best novel 2013; Wikipedia): aboard the Universal
  Union flagship Intrepid, ensign Andrew Dahl notices that low-ranking crew keep dying on away missions, and a crew member,
  Adam Jenkins, tells him their reality is under the influence of a badly written television show from the past, Chronicles
  of the Intrepid, whose writers progress ''the Narrative'' and suspend the crew''s free will, which is why good officers
  turn incompetent and last-minute inventions appear. The crew then act to escape the script, and the three codas follow people
  from the show''s world. Walk: Science fiction > Atemporal > Fabulation > Books in books > Scripted books in books (reality
  revealed as authored, whose inhabitants confront the possibility that their lives are someone else''s text). Rejected: Humorous
  science fiction (the book is comic, but the engine is the discovery that the world is written), Textual trespass (nobody
  enters or alters a specific book; the show writes them), Contradiction fiction and Meta remyth, Space colony and Space opera
  leaves (the ship is the setting, not the subject). Wobble low to moderate: Humorous science fiction is the other reading.
  Queue id MC04838, first published 2012.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal SF > Fabulation > Books in books > Meta
  remyth. Two published novels by Melinda Taub, Grand Central Publishing: The Scandalous Confessions of Lydia Bennet, Witch
  (2023) and The Shocking Experiments of Miss Mary Bennet (2025, companion/sequel, readable standalone, loosely tied to the
  first). Each re-enters Austen''s Pride and Prejudice and rewrites its characters and plot holes: in Lydia''s book as a secret-magic
  world where Kitty is a cat familiar and every spell has a cost; in Mary''s book as a merge of Pride and Prejudice with Frankenstein,
  where Mary raises a monster. Same defining move as the existing shelfmates Pride and Prometheus (Mary Bennet plus Frankenstein)
  and A Far Better Thing (Dickens retold with magic): inherited texts are entered and made to live differently. Held together
  as one fiction because the author and publisher present the second book as the companion of the first; the magic and the
  science retellings share the Bennet sisters'' recast world. Alternatives tested: Magicians in gaslight and Untold magic
  fit Lydia''s witches only by dropping the retelling engine and cannot take Mary''s reanimation science, so they would split
  a companion pair; Courtship fantasy is invented-realm manners, not Austen''s own text; Mad-science Gothic would lose Lydia''s
  book. Open Library covers hotlinked for Lydia (cover id 14803031); Hachette cover hotlinked for Mary. Sources read: https://smartbitchestrashybooks.com/reviews/the-scandalous-confessions-of-lydia-bennet-witch-by-melinda-taub/
  ; https://foxesfairytale.wordpress.com/2025/11/13/arc-review-the-shocking-experiments-of-miss-mary-bennet/ ; https://www.hachettebookgroup.com/titles/melinda-taub/the-shocking-experiments-of-miss-mary-bennet/9781538768297/
  ; Open Library search for both editions. Not a full-novel read.'

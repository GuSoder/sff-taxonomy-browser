placement_rationale: 'A 2020 metafictional fantasy from Tor: as author Sylvia Harrison nears death, her lifelong imaginary-friend narrator - the basis of
  all her favorite characters, who will die when she does - devises a plan to make them both immortal through the very book she is writing. A written fiction
  breaching into lived reality to alter its author''s fate is the textual-trespass definition (shelfmates Thursday Next, Breakfast of Champions).'

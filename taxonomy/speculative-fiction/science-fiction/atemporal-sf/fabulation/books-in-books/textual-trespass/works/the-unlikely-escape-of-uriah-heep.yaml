placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Fabulation > Books-in-books > Textual
  trespass. Parry, 2019 (Hachette/Redhook edition 2020): Charley Sutherland has hidden all his life a magic he cannot control,
  the power to bring characters out of books into the real world; when literary characters start causing trouble in the city
  and threaten to destroy it, he learns he is not the only one with the gift and, with his reluctant older brother Rob, has
  to stop them (Hachette Book Group description; Kirkus review). Rejected: Found magic (at 9, and the story is not a gift
  discovered but the fictions loose in the world), Magic school and Occult institutions (no school, no order), Written worlds
  and Contradiction fiction (the text is not reality''s fabric, nor an invented document), Meta remyth (Dickens is not rewritten,
  his characters act), Scripted books in books (the world is not authored). Textual trespass is the leaf''s own test: written
  fictions escaping into the world, with people entering and altering books, as in Thursday Next. Wobble: low to moderate.
  The leaf lives in the science-fiction Atemporal fabulation branch beside Thursday Next, though the book reads as contemporary
  fantasy; I followed the tree''s own placement of that test. Plot from publisher copy, not the book. Year 2019 (Open Library;
  Kirkus release 23 July 2019), the later 2020 date is the US paperback. Queue id MC03622.'

    merely by brain-upload research and an interview''s near-future label. No actual cross-era time machine is proved by alternating
    dates or Atwood''s playful marketing phrase; the stronger verified device is a character leaving an inherited text.


    At Atemporal, not mechanism-first Time travel, Parallel-world travel, New weird ecology, reincarnation or myth/science

definition: Projected-realities fabulation in which unacknowledged people, memory, guilt or buried trauma make the lived social
  world itself uncanny and unstable. The past persists in the present as distorted space, time, recognition and relationships,
  rather than chiefly becoming discrete objects or an identifiable enclosure to traverse. Hauntings names the return of the
  psychic past, not a requirement for literal ghosts.
status: accepted
label_status: taxonomy-coinage
label_note: Approved descriptive label using the existing English compound mindscape; not a claim of an established formal
  critical genus.

placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape hauntings.

  The contemporary Tokyo domestic search intersects buried Manchurian-war trauma and a psychic netherworld. The historical
  material is consequential, but it does not turn the whole fiction into a stable past-era story or imply literal time travel.
  Contemporary fantasy and surreal detective fiction are real conventional rivals; a settled external mythic cosmology, a
  forecast scientific society or an objectively independent parallel world is not established by the sources used. The approved
  broad Atemporal Fabulation route captures the unstable narrative world rather than ordinary historical realism or technical
  extrapolation. Inner space passes through memory, grief, dreams and psychic violence affecting the experienced world. Psychogeographic
  fabulation and Visionary minds are substantial sibling rivals, but the current Projected realities gate is the unresolved
  boundary between the buried past and shared present reality, not simply a solitary impossible map or a securely discovered
  outside world. Its quest and netherworld make Treks the closest new child; Hauntings best captures the continuing deformation
  of lived relationships by suppressed personal and historical pasts.

  Approved child walk: Toru''s search for a missing cat and then his wife passes into a netherworld beneath Tokyo and into
  buried Manchurian-war experience, joining ordinary domestic life to psychic violence and suppressed history. The competing
  realities keep returning to the past and relationships haunting the present, rather than a demonstrated generated enclosure
  with an external administrator. Its quest/netherworld imagery makes it the closest Odysseys boundary.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape hauntings
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'

previous_placement_rationale: 'NPR calls Peaces "a bizarre interstitial space between a surrealist narrative and a real one";
  Kirkus calls it a surrealist tale of love and being haunted by the past. Otto and Xavier Shin board the sleeper train The
  Lucky Day and reality stops cohering - no stable boundary between psyche and world, with memory and desire projecting a
  competing reality: exactly the inner-space definition. The NYT stresses it is NOT a fairy tale, so it is kept out of fairy-tale-revision
  (where Gingerbread sits). Shelfmates: Lanark, Only Forward. Locus recommended reading 2021.'

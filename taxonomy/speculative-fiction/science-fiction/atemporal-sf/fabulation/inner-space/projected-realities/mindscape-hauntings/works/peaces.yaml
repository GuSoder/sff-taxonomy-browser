placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape hauntings.

  The recognizable contemporary train journey is not a sufficient Historical/Period or transport-adventure gate. The actual
  source accounts emphasize incompatible perception, personhood and a present entangled with shared pasts. Conventional Contemporary
  fantasy and surreal mystery are substantial rivals; no literal fairy-tale cosmology, independent portal realm, time machine
  or scientific near-future system is established. The approved broad Atemporal Fabulation route is therefore a literary reality-instability
  classification, not a hard-SF marketing claim. Inner space passes because memory, desire and recognition alter which world
  and people cohere. Projected realities is more exact than Visionary minds'' encounter with a separate revealed world or
  a chiefly solitary Psychogeographic journey, because multiple characters'' pasts and incompatible recognition unsettle a
  shared social reality. The train journey alone does not make this Treks: the stronger whole-book operation is the unacknowledged
  past haunting present relationships. No source-backed imaginary-lover or literal mental-prison explanation is asserted.

  Approved child walk: On a surreal train journey, shared histories and an enigmatic person whom others fail or refuse to
  acknowledge unravel the reality of the present. Recognition, unseen personhood and entangled pasts animate the unstable
  world. This is not a sourced claim that the train is a literal mental prison or that a lover is imaginary.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape hauntings
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'

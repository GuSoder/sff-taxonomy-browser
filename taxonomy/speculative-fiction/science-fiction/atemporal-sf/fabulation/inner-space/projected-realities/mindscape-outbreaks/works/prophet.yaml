- Helen Macdonald
first_published: 2023
canonical_genre: mindscape-outbreaks
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape outbreaks.

  The military drug and investigation are important positive Psychological/Modern-day SF rivals, not erased as mere decoration.
  But the defining whole-fiction event is nostalgia becoming material approximations, spreading into public places and producing
  a hostile memory-object landscape. This is a competing reality projected from memory, not only scientific observation, an
  ordinary conspiracy or a forecast social order. A contemporary supernatural-fantasy reading is possible as a surface description,
  but the drug/mental-generation account is explicit, rather than an established mythic magic system. Atemporal Fabulation
  and Inner space fit the mental/physical boundary becoming unstable. Stable Parallel worlds and Visionary minds lose because
  remembered material is generated into the shared world, not merely viewed in a preexisting outside realm. Psychogeographic
  fabulation is less exact than the collective external effects. Projected realities is retained, and Outbreaks is the most
  exact new child because objects and hazards materialize outward; entering the resulting landscape does not make the whole
  story chiefly a Treks counterworld journey.

  Approved child walk: A military drug produces physical approximations of cherished memories, from a diner to dangerous nostalgic
  objects. Material memories spread into ordinary places and ultimately create a rogue memory-object landscape. The mental
  content becomes external things and hazards, rather than remaining an only-entered inner realm.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape outbreaks
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'

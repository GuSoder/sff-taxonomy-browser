previous_placement_rationale: 'Root-down: Science fiction -> Atemporal -> Fabulation -> Inner space -> Projected realities.
  The military drug Prophet ''induces material approximations of fond memories'' (PW) - nostalgia made physical as EPGOs,
  ending in a landscape booby-trapped with rogue memory-objects (a Pac-Man cabinet that physically consumes a man). Memory
  and desire project a competing shared reality whose boundary with the ordinary world cannot be stabilized - the leaf def.'

id: the-unlimited-dream-company
title: The Unlimited Dream Company
authors:
- J. G. Ballard
first_published: 1979
canonical_genre: mindscape-outbreaks
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape outbreaks.

  SFE explicitly describes this as fantasy, including apparent death/rebirth, shape changes, absorption of people and transformation
  of Shepperton. That is a genuine root boundary, not suppressed evidence. The current approved tree uses the broad experimental
  Fabulation definition, and this execution retains that accepted route rather than making a new conventional-SF claim. Futurist
  social/technical extrapolation, a changed historical era and actual SF time travel are not the main form. The pilot''s visions,
  desire and self-expansion remake the town, supporting Atemporal Fabulation > Inner space > Projected realities within this
  tree. Body-myth is a real Fabulation sibling rival because bodily transformations are major content, while Psychogeographic
  fabulation captures the confined geography. Projected realities remains more exact for desire imposing a competing shared
  environment over an existing town. Visionary minds would chiefly perceive another independent reality. Within the approved
  children, confinement makes Treks a real rival, but outward bodily/environmental materialization is the stronger whole-book
  operation, so Outbreaks. Not an infection requirement or purely hostile outbreak.

  Approved child walk: The apparently resurrected pilot''s visions and desire transform Shepperton into an exotic world of
  vegetation, animals and ecstatic physical change, with transformations and bodily absorption affecting others. A mind spills
  a competing material reality over the existing town. The pilot''s confinement is a real Odysseys rival, but his transforming
  the town is the more distinctive whole-book operation. SFE explicitly calls this fantasy; the current placement relies on
  this tree''s broad experimental Fabulation gate, not a claim of consensus hard-SF shelving.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape outbreaks
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'

id: the-houses-of-time
title: The Houses of Time
authors:
- Jamil Nasir
first_published: 2008
canonical_genre: mindscape-treks
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape treks.

  A lucid-dreaming study, idealized desire and the search for God lead Grant through multiple experiential realities. Psychological
  SF is a serious rival because the study is real plot content, but the whole form is an unstable sequence of desire-shaped
  worlds, not chiefly a bounded scientific finding about dreaming or a forecast future society. Neither literal sleep nor
  research by itself settles the classification. The conventional SF/Fantasy and Parallel-worlds boundaries remain open at
  the level of interpretation; the sources do not conclusively establish autonomous magical realms or a stable multiverse.
  Atemporal Fabulation and Inner space pass because the experienced worlds are tied to the unconscious and their reality cannot
  be secured. Visionary minds is the strongest sibling rival: the ending may support actual other realities. Projected realities
  remains the approved best fit because desire generates the competing worlds and possible gift/insanity ambiguity remains
  central. No claim that this ontological question is definitively solved.

  Approved child walk: A lucid-dreaming study leads David Grant to pursue an idealized woman across layered realities, with
  the possibility of godlike gifts set against insanity. These are deliberately entered and traversed desire-shaped worlds.
  Its possible-real-other-realities reading remains a Visionary minds boundary, not new evidence of a stable independent multiverse.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape treks
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'

canonical_genre: mindscape-treks
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape treks.

  The apparent1959 is a managed recreation within1998, built around manipulated childhood memory and Ragle''s wartime use.
  Both engineered-environment Psychological SF and futurist Earth-Moon war readings are genuine rivals, and ordinary speculative
  technology is not denied. The approved broad Atemporal Fabulation placement is retained because the presented world itself
  comes apart as remembered reality is exposed and escaped, rather than because the town is literally immaterial. This is
  not actual time travel, an independently stable parallel Earth or magic governing a fantasy history. The work is not put
  in Historical SF merely because the remembered town has a date: the whole narrative discloses a constructed regressive present.
  Inner space and Projected realities capture externally managed memory defining a shared counterworld. Visionary minds would
  primarily unveil an independently existing level; Psychogeographic fabulation would chiefly make private emotion a geography.
  Here the identified fabricated town and finding the truth beyond it govern. Do not rewrite this as a collective hallucination.

  Approved child walk: Ragle''s apparent1959 is an engineered regressive environment inside1998, reproducing the past that
  his damaged memory can inhabit while he serves an Earth-Moon war. Uncovering and getting beyond that bounded counterworld
  is the central trajectory. The town is engineered, not asserted to be an immaterial collective dream.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape treks
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'

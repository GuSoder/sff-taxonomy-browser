boundaries:
  Mindscape hauntings: Projected-realities fabulation in which unacknowledged people, memory, guilt or buried trauma make
    the lived social world itself uncanny and unstable. The past persists in the present as distorted space, time, recognition
    and relationships, rather than chiefly becoming discrete objects or an identifiable enclosure to traverse. Hauntings names
    the return of the psychic past, not a requirement for literal ghosts.
  Mindscape outbreaks: Projected-realities fabulation in which memories, desires or visions materialize as objects, organisms
    or bodily/environmental changes spreading into ordinary shared places. A material mental projection, rather than entry
    into an inner counterworld or chiefly unstable recognition of the past, is the central event. Neither infection nor a
    hostile outbreak is required.

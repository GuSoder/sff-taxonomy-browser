id: eye-in-the-sky
title: Eye in the Sky
authors:
- Philip K. Dick
first_published: 1957
canonical_genre: mindscape-treks
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape treks.

  The mundane1959 laboratory accident is the physical frame, not a reason to make the whole belief-shaped narrative a period-history
  novel. Eight participants experience successive worlds governed by individual beliefs and fears. A consistent physical extrapolation
  or a future social order is not the main form, so Futurist and Modern-day technical/psychological research shelves lose
  to Atemporal Fabulation. These are not stable independent parallel worlds, actual rival gods, or demonstrated historical
  time travel. Fantasy is a substantial surface rival because of miracles and curses, but the worlds are constituted by the
  participants'' minds rather than a confirmed external magical cosmology. Inner space passes because psyche materially shapes
  what the group experiences. Visionary minds would reveal an independent hidden world; Psychogeographic fabulation is chiefly
  a psyche-shaped personal geography. Here the group must pass through identifiable competing mind-worlds and return, so shared
  Projected realities is more exact.

  Approved child walk: A lab accident traps eight people in successive worlds governed by different participants'' beliefs
  and fears. Their route is through these competing constructed worlds and back out, not simply ordinary life colored by regret.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape treks
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'

previous_placement_rationale: 'Philip K. Dick''s Eye in the Sky (Ace, 1957; Wikipedia): in 1959 a malfunction of the Belmont
  Bevatron leaves eight visitors unconscious and then trapped in a series of unreal worlds shaped in turn by each one''s fears
  and beliefs, among them a geocentric believer''s world of miracles and curses and a paranoid woman''s. Walk: Science fiction
  > Atemporal > Fabulation > Inner space > Projected realities (belief, memory and fear project a shared competing reality
  whose boundary cannot be stabilized). Tried: Godgame (the powers are the minds of the eight, not rival gods).'

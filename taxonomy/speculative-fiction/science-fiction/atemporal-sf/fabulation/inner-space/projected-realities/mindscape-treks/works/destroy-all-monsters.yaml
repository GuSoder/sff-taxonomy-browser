id: destroy-all-monsters
title: Destroy All Monsters
authors:
- Sam J. Miller
first_published: 2019
canonical_genre: mindscape-treks
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities
  > Mindscape treks.

  The contemporary traumatic frame and alternating Darkside story are one fiction, not separate series or a YA-based category.
  A literal portal Fantasy-realm story and an autonomous parallel world are real rivals, but the read sources leave Darkside''s
  reality entangled with amnesia, trauma and the friends'' mutually reconstructed history. No stable external fantasy cosmology
  is invented. The broad Science fiction > Atemporal > Fabulation route describes this unstable constructed-world form, not
  a claim to technical-hard-SF consensus or a future forecast. Inner space positively passes because mental history constitutes
  the competing experienced world. A clinical Psychological SF case study would be less exact than the story''s two-world
  presentation. Visionary minds would reveal a preexisting independent world; Psychogeographic fabulation alone misses the
  explicit competing Darkside/contemporary narratives and reciprocal recovery. Projected realities retains the unresolved
  trauma-world relationship. Recovery and rescue across the counterworld make Treks the stronger child than Hauntings, even
  though trauma motivates it.

  Approved child walk: Two narratives pair contemporary trauma and memory loss with Darkside, a competing fantastic world
  populated by princesses, monsters and a shared version of the friends'' lives. Recovering suppressed history and rescuing
  each other connects the worlds. This receives the bounded counterworld placement, rather than treating any trauma theme
  alone as sufficient for Hauntings. No literal independent portal realm is asserted.

  Sibling test: Treks is chiefly traversal/investigation/escape of an identifiable psyche-shaped counterworld; Hauntings is
  the psychic past deforming lived present relationships and recognition; Outbreaks is material projection spreading into
  ordinary shared places. Best-fit whole-book operation, not mutually exclusive metaphysical ingredients. Mindscape treks
  is selected for the source-backed main operation above. The existing broad experimental Fabulation route and its recorded
  conventional-genre/ontological caveats are retained.

  Textual split approval2026-11-22; all original book editions, authors, years and covers preserved.'
previous_placement_rationale: SFE describes Darkside as either a parallel world or a trauma-born delusion, while Harper presents
  two overlapping realities whose friends rescue each other through recovered memory. Its reality remains visibly unstable
  rather than settling into a literal SF mechanism.
classification_sources:

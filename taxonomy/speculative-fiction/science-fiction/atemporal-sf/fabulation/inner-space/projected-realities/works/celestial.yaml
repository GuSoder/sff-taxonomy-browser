canonical_genre: projected-realities
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Fabulation > Inner space > Projected realities.

  Root: the lunar structure is an alien craft which shapes an experienced world from human minds. Buddhist enlightenment,
  Baba Yaga, the Norse tree and Vietnam appear inside the crews'' projected experience, not as independently established magical
  histories. Publisher identifies SF, and multiple completed reviewers explicitly contrast this novel with the author''s historical
  fantasy. Fantasy''s Real earth, Fantasy realms and Portal alternatives were all tested: a Moon journey is not a fantasy
  portal merely because the subsequent perceptions are dreamlike, and actual myth beings are not established outside the thought-responsive
  structure. No shared world with Wolfsangel or Banners of Blood is inferred from the author''s aliases or the Norse imagery.

  SF full root walk: Historical > Alternate history > Period alterations > Alt Cold War is a serious positive rival, not dismissed
  as a wrong date. The outer1977 is counterfactual, and Cold War distrust, racism and Vietnam trauma shape the expedition.
  But the whole novel is not principally a changed political history or a technically extended Apollo programme: most of it
  is an unstable shared interior constructed from the people''s competing memories and beliefs. The ship''s initial destruction
  itself becomes uncertain, and its psychic landscapes cross ordinary chronology and mythology. This is the atemporal unstable-reality
  gate, not a claim that the outer Moon mission lacks a date. Historical > Hidden history also loses: explicit counterfactual
  space programmes are not just extraordinary events secretly omitted from the record. Period SF''s steam/deco/rocket aesthetics
  do not make a1977 psychic-reality novel Rocketpunk; Proto SF fails a2022 deliberate-past novel. Within Alternate history,
  the other period forks (Civil War, Great War, WWII, prewar/postwar, near-present) and deep enduring divergences are not
  established; Alt Cold War remains the strongest historical rival.

  Futurist SF > Alien fiction > First contact > Alien expedition/Xenological expeditions and Alien delving > Big dumb relics
  are substantial rivals: the humans seek a mysterious lunar hatch and its makers. Both inherit Futurist, whereas this is
  a deliberate past-era frame and, more importantly, a shared psyche-generated reality as the main reading experience. Neither
  a buried craft nor a novel being called first-contact settles the whole walk. Big dumb worlds captures moving through an
  object but not its decisive memory-projection mechanism. Wreck delving fails salvage/claims; Alien descent fails a governing
  downward horror mission. Hard SF/Orbital mechanics fails rigorous scientific constraints as the engine; reviewers expressly
  describe New Wave/soft SF and contest the space hardware. Future of Earth, spacefaring campaign/society and cosmic alien
  civilization development are not the main whole-book inquiries. Modern-day SF fails the deliberate1977 setting, not merely
  the2022 publication. Psychological SF is a real causal rival, but this is not a grounded clinical/social-science investigation:
  the experienced setting itself is generated and destabilized by minds. Psi telepathy describes Ziggy and Kovacs''s communication
  but not the rest of the shared reality. Alien invasion, apocalypse, bioengineering, social dystopia, technothriller and
  governing comedy do not replace the projection engine.

  Atemporal siblings: no explicit actual SF time journey or communication across historical eras is established; remembered
  Vietnam, the sister''s death, myths and a fictional television spacecraft are visions and projected scenes, not automatically
  Time travel. Reincarnation is discussed in the Buddhist/philosophical framework, but not a sequence of embodied lives across
  eras governing the novel. Parallel worlds is a real visual rival, yet these environments respond to the crews'' minds rather
  than operating as independently stable alternative Earths. Science fantasy is tempting for the mythic surfaces, but the
  point is their cognitive generation, not a stable magic-looking civilization with a scientific underpinning. New Weird catches
  monstrous images but lacks the more exact shared-psyche mechanism and whole-novel fabulatory mode.

  Fabulation positively passes: ordinary narrative space and time yield to collectively projected memories, religious images
  and remembered fiction. The participants'' assumptions construct what the narrative presents as the world, and neither they
  nor the reader can simply equate the apparent Moon-war events with stable fact. This is more than a first-contact blurb
  or a single hallucinated scene. Books-in-books fails text entry/authored documents as the governing device, despite a television-fiction
  reference. Classic fabulation''s foundational constructed-world/system categories lose to a specifically psyche-projected
  reality. Body-myth fails bodily transformation as the governing cosmological force; a person''s squirrel transformation
  is not the whole narrative engine. Alternate worlds fails a stable literary alternative Earth as the form. Godgame fails
  rival actual godlike powers contesting a cosmic moral pattern; the opposing forces are substantially the crews'' beliefs,
  fear and memories.

  Inner space positively passes: grief for Ziggy''s sister, Griffin''s Vietnam trauma, religious conviction and other people''s
  mental images create a competing experienced world with no secure psyche/world boundary. The full ending matters: survivors
  return to apparently undamaged spacecraft and the alien structure departs; this does not retroactively turn the intervening
  shared mental landscapes into a conventional Cold War thriller or an arbitrary hardware puzzle. It is a bounded physical
  frame around an unbounded projected interior, as also occurs in the existing Eye in the Sky. No claim that ordinary Earth
  is conclusively nonexistent.

  Inner space children: Psychogeographic fabulation is a strong rival because this is an impossible journey through externalized
  trauma. Projected realities is more exact because the world is a competing SHARED reality shaped by multiple crew members,
  not mainly one person''s psyche made into an impossible city or personal journey. Consciousness fiction > Visionary minds
  is also serious: Buddhist meditation and enlightenment matter. But altered perception does not merely reveal a separate
  hidden world; the craft actively uses the people''s memories and beliefs to generate what they encounter. Unmoored selves
  fails identity division/displacement as the principal mechanism. Projected realities positively matches materialized memory,
  trauma and desire, with characters mutually affecting the experienced world. The return to an outer frame does not imply
  that all internal boundaries were ever stable.

  Decision: original2022 standalone novel into existing Projected realities9->10. Moderate confidence, with Alt Cold War,
  Xenological expeditions/Big dumb relics, Psychogeographic fabulation and Visionary minds documented as real rivals. No definition
  or portrait change. Tenth-fiction threshold reached: freeze intake and prepare the required split question from the actual
  ten fictions, before any structural execution.'
whole_fiction_content: 'In a counterfactual1977, Buddhist linguist Ziggy Da Luca joins a NASA mission to a lunar hatch first
  found by Soviet cosmonauts. Apparent violence between the missions strands the survivors inside an alien structure. American
  and Soviet crews encounter a shared interior generated from their memories, prejudices, religious images and trauma: Ziggy''s
  dead sister, Vietnam imprisonment, Baba Yaga, the Norse world-tree and a television spacecraft. Telepathy between Ziggy
  and Kovacs accompanies the shifting experienced reality. Full-ending criticism reports escape in the original spacecraft,
  which were not destroyed as first believed, followed by the alien structure''s departure from the Moon. The sources disagree
  on whether the final philosophical account is satisfying or adequately explained; no single definitive alien motivation,
  literal time travel or real external mythic cosmology is invented. This is whole-ending coverage from independent reviews,
  not a claim to have read the complete copyrighted novel.'
classification_confidence: Moderate. Repeated independent whole-book accounts make shared mental projection a positive fit.
  Cold War alternate history, alien-artifact exploration and visionary consciousness remain genuine competing readings. The
  fixed1977 outer frame and final return are acknowledged, not erased to force Atemporal. Positive and strongly negative completed
  reviews both used; their disagreement about resolution remains explicit.

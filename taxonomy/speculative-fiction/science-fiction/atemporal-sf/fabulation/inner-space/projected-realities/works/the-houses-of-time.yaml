canonical_genre: projected-realities
placement_status: accepted
placement_rationale: |-
  Root-down: Speculative fiction > Fabulation > Inner space > Projected realities. PW (publishersweekly.com/9780765306104): Nasir "combines lucid dreaming, unconscious desires and the search for God in this exploration of different layers of reality"; David Grant studies lucid dreaming to dream up "the most perfect woman possible", then "learns to control his dreams and propel himself into other realities" until "multiple realities flood his life" and "Grant believes himself insane". Desire projects competing realities whose boundary with the ordinary world will not stabilize - the leaf's gate. Rejected: Visionary minds (the revealed worlds here are generated by the dreamer's desire and unconscious, not a parallel world an altered perception opens onto; PW frames it as unconscious desire), Psychological SF (the experiment is not on the mind by science; the dreaming is the engine). Wobble mild (the ending hints the dream worlds may be real other realities, which leans Visionary minds) RESOLVED: the book's mechanism is desire projecting layered realities, and its instability - is he insane or gifted - is the story. Standalone novel (Tor 2008).

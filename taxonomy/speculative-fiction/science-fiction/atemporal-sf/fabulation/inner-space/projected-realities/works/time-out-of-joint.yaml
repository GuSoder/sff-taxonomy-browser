placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Projected realities.
  Kirkus describes Ragle’s apparent 1959 world repeatedly dissolving before he learns it is an engineered childhood regression inside 1998, built
  around his altered memory so his pattern gift can serve an Earth-Moon war. A competing shared reality externalized from manipulated memory governs.'

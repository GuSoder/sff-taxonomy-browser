per_volume_checks: |-
  Per-volume evidence for the whole-series engine (parent request 2026-10-28):
  The Explorer: Cormac passes through the anomaly and relives the doomed voyage while his other self is still aboard - "an introspective time travel novel... Moon meets Groundhog Day", "the various incarnations of Cormac Easton alternate" (reactormag.com/book-review-james-smythe-the-explorer/).
  The Echo: the lost Ishiguro's crew survive inside the anomaly in "a truly gruesome loop that results, no matter what the poor few do, in death... the seemingly immortal cycle of life inside the anomaly"; twin brothers Tomas/Mira are "sides of the same coin" who diverge (reactormag.com/book-review-the-echo-by-james-smythe/).
  The Edge: "Smythe's books are largely about identity... Hyvönen is using a memory machine to attempt to keep himself himself"; Alannah suffers "rogue thoughts and fugue states" and the book examines "the reliability of memory and how our recollections define us" (geekdad.com/2021/03/the-edge-by-james-smythe/).
  The Ends: the anomaly envelops Earth; inside it no one can die and people are "reset... unaware that this has already happened. Death is no longer permanent" (curiositykilledthebookworm.net/2022/07/the-ends/; josbookblog.co.uk/2022/08/05/the-ends-by-james-smythe/).
  All four: identity and memory come loose from time - Unmoored selves. No mismatch found.

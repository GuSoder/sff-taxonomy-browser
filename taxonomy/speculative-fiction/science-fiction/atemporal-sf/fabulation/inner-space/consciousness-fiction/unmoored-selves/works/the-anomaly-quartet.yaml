canonical_genre: unmoored-selves
placement_status: accepted
placement_rationale: |-
  Root-down: Science fiction > Atemporal SF > Fabulation > Inner space > Consciousness fiction > Unmoored selves. A manned mission to an inexplicable anomaly in deep space becomes an identity horror: after passing through it, Cormac relives the doomed voyage while his other self is still aboard - "an introspective time travel novel... Moon meets Groundhog Day" and "the various incarnations of Cormac Easton alternate" (reactormag.com/book-review-james-smythe-the-explorer/); the quartet (The Explorer 2013, The Echo 2014, The Edge 2021, The Ends 2022, complete per HarperVoyager) keeps doubling its people. Identity divides and comes loose in time, the leaf's definition. Rejected: Starship mysteries (umbrella is generation starships; the Ishiguro is a mission vessel), Hard time travel (the anomaly stays unexplained, no rigorous mechanism), Alien horror (no nonhuman life established), Hard alien (space-opera register). Wobble mild (RESOLVED): book 1 reads as a survival thriller until the loop reveal; two professional reviews ground the identity-loop engine.

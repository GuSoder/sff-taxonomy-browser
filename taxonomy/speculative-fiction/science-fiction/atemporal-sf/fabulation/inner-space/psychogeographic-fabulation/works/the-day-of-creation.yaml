id: the-day-of-creation
title: The Day of Creation
authors: [J. G. Ballard]
first_published: 1987
canonical_genre: psychogeographic-fabulation
placement_status: accepted
placement_rationale: >-
  Root-down: Science fiction -> Atemporal -> Fabulation -> Inner Space -> Psychogeographic fabulation. SFE calls the novel less overtly fantastic and describes Mallory inadvertently causing a new river to erupt across an imaginary African war zone; Harper grounds his obsessive upstream journey to the source of "his own creation." The impossible river and briefly transformed landscape externalize Mallory's obsession rather than operating as technological speculation, making mind and place inseparable.

placement_rationale: 'Root-down: Science fiction -> Atemporal -> Fabulation -> Inner Space -> Psychogeographic fabulation. SFE and Tachyon ground a father leaving his dying son’s hospital bedside for a shifting parallel Western dreamscape whose clowns, toys, monsters and quest for a healing flower externalize grief. The impossible journey and damaged psyche are inseparable.'

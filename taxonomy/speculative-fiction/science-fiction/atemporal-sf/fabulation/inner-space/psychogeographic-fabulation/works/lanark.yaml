placement_rationale: SFE describes Lanark as equipoisal Fantastika whose Alice-like intercalendrical Zone and Time Distortion emphasize its non-SF character; Canongate calls it a modern vision of hell interweaving realistic Glasgow with disintegrating Unthank. Its double protagonist and unstable boundary between damaged psyche, autobiography and impossible city make Inner Space the closest leaf.

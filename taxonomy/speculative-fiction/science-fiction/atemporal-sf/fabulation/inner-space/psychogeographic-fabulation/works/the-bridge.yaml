id: the-bridge
title: The Bridge
authors: [Iain Banks]
first_published: 1986
canonical_genre: psychogeographic-fabulation
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Atemporal -> Fabulation -> Inner space -> Psychogeographic fabulation. Banks describes a comatose man’s surreal bridge-world where dream/fantasy, past/future and voices fuse, and explicitly credits Lanark; SFE calls the enormous Bridge a matrix representing his life, with literal and metaphorical displacement knowingly conflated. The impossible place externalizes his trauma, identity and desire to remain unconscious, making Psychogeographic fabulation exact.'

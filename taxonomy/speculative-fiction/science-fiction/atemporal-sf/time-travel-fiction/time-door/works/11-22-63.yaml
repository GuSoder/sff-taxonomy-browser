placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Time door. The diner storeroom portal is a standing, unexplained passage fixed to 11:58 a.m. on September 9, 1958, discovered rather than built, which Al and then Jake use at will; every trip resets. Chosen, not suffered: not a slip, and nothing was built. The mission - prevent Kennedy''s assassination - is what the traveler does with the door.'

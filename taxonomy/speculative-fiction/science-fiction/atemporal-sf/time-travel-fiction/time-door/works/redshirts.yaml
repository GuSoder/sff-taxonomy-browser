placement_rationale: 'Whole-fiction root-down rewalk 2026-11-05, MC04838: Speculative fiction > Science fiction
  > Atemporal SF > Time travel fiction > Time door. One2012 book: complete novel plus three consequential same-world
  codas, not fourbooks or a collection to discard (author format essay). Futurestarship Intrepid crew discover their
  deaths are being written by a2012 televisionproduction. Jenkins plans a deliberate roundtrip to contemporary Burbank/LosAngeles
  to confront the makers; they kidnap plot-armored Kerensky, steal an ordinaryshuttle, approach the existingblackhole/wormhole,
  and return through it with the producer''s comatose son for futuremedicine and Narrative-assisted healing. Sixday
  atom-reversion limit creates urgency. Codas follow headwriter''s responsibility, recoveredson''s agency and actress''s
  grief/connection through Jenkins''s messages. Publisher and finished independent reviews establish speculative
  SF frame, not an attested supernatural/magic system. Atemporal and Time travel override Futurist shipsetting,
  comic Spacefuture or Fabulation: actualplanned era-crossing solves mainplot, not an ignorable briefanomaly. Previous
  Scripted books in books placement omitted integraltravel. Under Time travel, Time door fits a chosen existingpath
  usedoutandback, with missionatdestination; a passengertransport doesnot by itself make the timepath a built Time
  machine. No time device is invented/built, no organization owns temporalapparatus; stolen fleetshuttle and kidnappedofficer
  are equipment/plotarmor, not evidence for Time travel agency. Not Homebrew, rigorous Hardtime mechanism, ancestral
  kinship, repeatedloop, mentalstate, bodilycondition, tonic, unequal clockrates, or an outside-time hub. Timeslips
  rejected because intentionaltargetedpassage, not carryingevent/accident. Parallel-world/Fabulation remain realoverlap:
  the trip also crosses TVfiction/authorworld, and arbitrary Narrative physics protects travelers. Wobble moderate:
  blackholepath requires plotarmor and a shuttle rather than pedestrian doorway, but existing definition includes
  a portal or path usedatwill, not only literaldoors, with no builttemporaldevice. Definition unchanged. Sourceleaf4->3,
  Time door1->2. Singlefictiondiscretion original phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX and anySFtimetravel original
  phonemsg-01M36M8K4DB3B8Y8T1GAQ6ARF0 recovered directly. SlowGods and Bill scoped exceptions do not apply. English2013Gollancz
  paperbackfront localized/pixelinspected; originalpublication2012 retained.'

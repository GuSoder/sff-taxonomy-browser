placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Time travel fiction -> Time loops. SFE identifies the novel as explicitly built on cyclic history, with a hero undergoing transcendental metamorphosis to return in time and remake the world. Imperial revolution and space-opera spectacle are carried by the closed temporal cycle, so looping history governs.'

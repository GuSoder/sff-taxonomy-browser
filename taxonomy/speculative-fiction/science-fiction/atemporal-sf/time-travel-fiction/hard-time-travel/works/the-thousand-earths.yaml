placement_status: accepted
placement_rationale: 'Root-down: SF -> Atemporal -> Time travel fiction -> Hard time travel. Relativistic time dilation makes Hackett''s starship voyages temporal
  expeditions: five million years elapse on the first return and vastly longer journeys reveal humanity''s and the cosmos''s fate. Orion explicitly names him a time
  traveller. The physical mechanism is central, not an unexplained slip, biological disorder, agency or privately invented time machine; ship travel causes the differential
  rather than static regions running at unequal rates. The futurist setting therefore yields to the standing any-time-travel gate.'

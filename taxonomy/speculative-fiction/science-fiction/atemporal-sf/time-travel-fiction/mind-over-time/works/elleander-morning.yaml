placement_rationale: 'Whole-fiction root-down walk, 2026-10-30: Speculative fiction > Science fiction > Atemporal SF > Time
  travel fiction > Mind over time. Decisive cause is the novel''s deathbed passage, quoted and analyzed by Glyn Morgan in
  Mapping Planet Auschwitz (Liverpool PhD, 2016), pp135-136, citing novel pp173-174: Elleander wills herself back, trips a
  switch in her mind, and a psychic detonation sends her consciousness to her own twenty-two-year-old body in1907. This passes
  the unchanged altered-state-of-consciousness gate, not an invented physical time machine. Root wobble is real: Fantasy Masterworks
  branding, Locus and John Palfrey call this fantasy, and Lisa Tuttle''s introduction calls the crossing a drop of fantasy.
  No spell, god, magical object or rule-bound magic engine is established; psychic temporal consciousness is specifically
  covered by the existing SF leaf. Physical objects also travel without explanation, an unresolved strain retained rather
  than converted into proof of a machine or magic. Historical SF / Alternate history rejected despite the Hitler1913 divergence
  because any SF time travel goes Atemporal under the owner''s standing rule. Modern day/Futurist fail stable-era placement;
  it spans1970,1907-1913 and an altered1983-1984. At Time travel fiction: no apparatus/owning agency (Time machines), rigorous
  physical mechanism (Hard time travel), ancestry-targeted crossing (Ancestral time travel: granddaughter investigates, but
  Elleander enters her own earlier life), repeated reliving (Time loops: one reset is verified, not repeated cycles), intrinsic
  temporal disease (Time travel disorders: deathbed cancer is not a diagnosed travel condition), carrying slip (Timeslips:
  active mental will is the described cause), clock distortion, outside-time hub, administered substance or standing door.
  Mind over time is positive, not nearest remainder. Whole story includes saving the Titanic-bound twins and her husband,
  killing Hitler to save her son, granddaughter Lesley''s inquiry into the anomalous WWII history in1983, and the book''s
  influence on a new German far-right movement, stopped by Paul''s briefcase-bomb assassination of its leadership. Thus not
  classified from the opening assassination alone. One1984novel, not a2024original or multi-book fiction. Moderate-to-high
  SF/Fantasy wobble, with mechanism grounded in the quoted novel rather than marketing labels. Sources: https://livrepository.liverpool.ac.uk/3007578/1/200351794_Sep2016.pdf
  (pp134-143); https://sf-encyclopedia.com/entry/yulsman_jerry ; https://www.hachette.co.uk/authors/2015/12/21/masterworks-spotlight-elleander-morning/
  ; http://www.thurb.com/reviews/elleander.htm ; https://locusmag.com/index/b521.htm ; https://collections.ushmm.org/search/catalog/bib268887
  .'

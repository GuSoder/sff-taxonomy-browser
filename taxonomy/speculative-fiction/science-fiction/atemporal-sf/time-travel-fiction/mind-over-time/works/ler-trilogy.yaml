id: ler-trilogy
title: The Ler trilogy
authors:
- M. A. Foster
first_published: 1975
canonical_genre: mind-over-time
placement_status: accepted
placement_rationale: 'MC06223 The Book of the Ler 2006 is an omnibus, not a 2006 original novel. Whole fiction is the three
  Ler novels: The Warriors of Dawn 1975, The Gameplayers of Zan 1977 and The Day of the Klesh 1979. Gameplayers is chronologically
  first but was published second; display publication years, do not confuse chronology and publication. Publisher calls the
  three a trilogy; SFE and ISFDB corroborate the contents and separate the Morphodite/Transformer sequence. No source establishes
  a literal shared-universe bridge to Transformer, Waves or Owl Time, so common author and recurring themes do not merge them.
  SFE identifies Owl Time as a four-novella collection, not a fourth Ler novel.


  Whole-fiction engines: Gameplayers explores the engineered human-derived Ler and their braided family system against Earth''s
  surveillance/overpopulation society in 2550, through a missing-girl/conspiracy plot that ultimately masks departure by a
  grown spaceship. Warriors, published first but set later, pairs a human trader and a Ler woman investigating rogue-Ler piracy
  and an attempted racial war, with human Klesh subjects and heavy cultural exposition. Klesh moves further ahead: Meure joins
  a Ler/Spsom expedition, is marooned on Monsalvat and encounters human-descended Klesh cultures and the legacy of Ler experiments.
  Its ending matters to the ROOT walk: the Skazenach oracle perceives across time/space; the ancient Cretus reaches/informs/inhabits
  the future Meure, and the joined minds confront a timeless psychic gestalt. This is not simply the series covering centuries
  or a normal historical document being read. Schlock Value describes a past-to-future consciousness transfer; the independent
  accepted reader identification describes the ancient prophet''s mind held through the artifact and then taking over/merging
  with Meure. That latter description alone could be stored consciousness, not proof of time travel. The controlling distinction
  is the explicitly cross-time oracle/perception and psychic contact, not mere survival of an old memory. No claim of a physical
  body riding a time machine. The original jacket''s past-invading-present/time-and-space enigma and Claude Ecken''s completed
  French review support a genuine temporal mystery. Schlock''s explicitly invented freedok footnote example is a reviewer''s
  joke and is NOT used as plot evidence.


  Root: Speculative > Science fiction, with a genuine science-fantasy boundary question. Human genetic design, future Earth
  and interstellar human/alien civilizations are the continuing explanatory frame. Later psi/metaphysics and the Crowley quotations
  do not establish an inherited magical cosmology or a world of ordinary magic. This is not Hard SF: review evidence expressly
  notes handwaving genetics and metaphysical resolutions. Literal SF psi/psychic time perception is not rebranded as scientifically
  rigorous physics, but nor does its presence erase the engineered-human/spacefaring SF frame. Fantasy is a plausible reading
  of the final resolution; the complete-world publisher, SFE and all three plots support the SF route at moderate confidence.


  SF full time partition: Historical SF fails the 2550-and-later setting;1970 s publication is not a historical story setting.
  Modern day SF fails the far future, so Genetic caste fiction, despite an attractive engineered-human divide, fails its Modern
  day/Bioengineering ancestor. Modern-day Sociological SF likewise fails. Futurist is the strong initial candidate, but the
  actual mental temporal encounter invokes the curator''s explicit any-time-travel rule: original phonemsg-01M36M8K4DB3B8Y8T1GAQ6ARF0,2026-09-23,
  confirms that once in SF any time travel goes Atemporal. Current Time travel fiction includes travel OR communication, as
  premise OR any element. A late-book element cannot be ignored just because anthropology dominates the trilogy. Whole shared
  fiction stays together; do not split off Klesh to make the first two easier to shelve.


  Counterfactual Futurist walk, to expose the tempting shortcut: Hard SF fails rigorous constraint as its reading engine.
  Spacefaring/Mystery or political space opera catches Warriors and the later expedition, not the initial Earthbound society
  or the three books'' sustained cultural inquiry. Future of Earth/Posthuman/Successor species is a genuine rival for designed
  human-descended organisms and cultural/genetic evolution, but the books chiefly examine already-existing societies and their
  encounters rather than staging one continuing transformation of humanity. Altered flesh and Copied/Rewired minds fit pieces,
  not the world-level engine; an ancient mind persisting alone would have demanded that alternative test, which is why the
  temporal ending was checked. Future social SF and Future history of Earth are expressly Earthbound, while two books take
  place among interstellar societies. Dystopian rebellion/Orwellian control fits Gameplayers, not all three; post-catastrophe,
  dying sun, military campaign and AI/network futures do not govern. Alien fiction > Anthropological > Earthborn would be
  the best non-temporal whole-fiction route: this existing child explicitly permits human or human-descended societies whose
  alienness is cultural. No false claim that Ler are extraterrestrial in origin. Xenanthropology loses both human descent
  and the noninterference test: these protagonists intervene. Xenolinguistics is not primarily a translation problem, and
  Xenocolonial domination covers the rogue Ler/Klesh thread but not all three books. The any-temporal-element ruling supersedes
  this otherwise strong Earthborn fit.


  Atemporal > Time travel fiction rather than generic Fabulation, New Weird or Reincarnation. The SF world retains a legible
  future timeline and species history; psychic time perception is an actual element, not just narrative play or an arbitrary
  fictional text. A prophet''s mind interacting with a future host is not by itself a reincarnation-cycle premise. Current
  Mind over time specifically includes perceiving/revisiting/crossing moments through a state of consciousness. Its current
  Elysium whole-world record also distinguishes reconstructed memory alone from perception of past/present/future, a boundary
  applied here, not a new definition.


  Time travel''s full mechanism partition: no family-history destination (Ancestral), repeated relived span (Time loops),
  intrinsic medical time disorder, swallowed tonic, standing time door, or hub/waystation for travelers (Time crossroads).
  Time distortion''s unequal regional clock rates are not the identified mechanism. Timeslips is an uncontrolled carrying
  shift, whereas this encounter involves psychic/oracular attention, deliberate past/future observation and joined consciousness.
  Time bleeds lacks a traveler and is an eras-leak engine, not this embodied consciousness/contact. Time machines is a real
  artifact rival because Skazenach is a physical focus, but no built time-transport apparatus, vehicle journey, laboratory
  machine or owning time agency is established. An object that focuses mental perception/possession is not automatically a
  machine the traveler rides. Do not invent a private engineer, institutional owner, construction history or clock vehicle
  to force Homebrew/Agency. Hard time travel fails a developed physical mechanism. Mind over time is the honest existing leaf
  for the altered psychic state that opens temporal perception/contact, with artifact mediation and storage-vs-crossing caveats
  retained. Confidence moderate because mechanism detail is chiefly completed-reader evidence, not a claim to have verified
  the entire English primary text. Existing leaf 7 to 8, no ten-card trigger, new node, structure, definition or portrait.'

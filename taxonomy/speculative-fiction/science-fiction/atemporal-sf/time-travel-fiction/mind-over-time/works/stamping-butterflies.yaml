  not infer time travel from Bradbury title: originalfinal chapters57-59/epilogue positively show contact, historical
  revision and different future. Zaq mistakenly treats real people as projections and murders brotherEli, Tris''s
  father. Final shared mental state exposes this and the Library offers a loop to childhood or passing memories
  onward; Zaq instead wants everything different. Library finds tippingpoint:1977Moz/Malika now inspect/refuse explosiveparcel,
  savingMalika and their future. Epilogue multinationalFederatedNationsEugeneNewman/Malika-class ship withRazorDrive
  reaches same2023worlds instead of solitaryChineseLoyalPrince, darkness waits to get things right. This is not
  mere nonlinear flashback or entirely imaginary future, and not claim allfarfuturepeoplevirtual: originalending

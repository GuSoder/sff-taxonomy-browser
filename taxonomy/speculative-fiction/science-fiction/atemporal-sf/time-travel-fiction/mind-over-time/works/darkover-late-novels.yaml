placement_rationale: '# Darkover whole-fiction intake, 23 November 2026


  ## State

  No taxonomy mutation or deployment. Existing live fiction remains Darkover (late novels), eight entries, Broken lander romance.
  Research and fronts are prepared off-repository. Do not use the earlier unauthenticated full-text mirrors as verified primary
  evidence. Further mirror reading stopped on parent instruction.


  ## Supported scope

  One shared universe. Candidate current-text corpus: 29 novels, 1964 to 2024, using the current replacement text where a
  novel was rewritten. The Trust bibliography explicitly identifies Sharra''s Exile as the replacement for The Sword of Aldones.
  The Bloody Sun''s 1964 and 1979 texts are one novel, not two entries. The Planet Savers is a novella according to ISFDB''s
  short-fiction record and is excluded under current intake form rules. Omnibuses and anthologies are not added as separate
  books. The Forbidden Circle is replaced by The Spell Sword and The Forbidden Tower. Do not merge Falcons of Narabedla or
  The Door Through Space solely because of similar names or reused background.


  Authoritative scope sources:

  - https://www.mzbworks.com/works.htm , Trust bibliography, updated 31 December 2025. Original dates, current corpus, replacements.
  Its Shadow Matrix date conflicts with first-edition evidence.

  - https://deborahjross.blogspot.com/p/darkover.html , creator, explicitly nine Ross novels and Arilinn final.

  - https://deborahjross.blogspot.com/2024/12/announcing-final-darkover-novel.html , creator, original Arilinn hardcover and
  ebook 12 November 2024; the paperback is 2025.

  - https://www.isfdb.org/cgi-bin/pl.cgi?264202= , catalog, first-printing September 1997 evidence for The Shadow Matrix,
  overriding Trust''s 1998 listing.

  - https://www.isfdb.org/cgi-bin/title.cgi?5371= , catalog, Planet Savers is novella, not an eligible novel.


  Candidate manifest saved separately with 29 hotlink fronts. Actual pixels inspected in contact sheet, two errors found and
  corrected: Heritage of Hastur initially showed the Heritage and Exile omnibus; Alton Gift initially showed a title page.
  Replacement fronts, Laran Gambit and Arilinn inspected in /downloads/darkover-front-repairs.jpg. No front bytes stored in
  repository. Source-loaded live browser verification still required before any eventual publication.


  ## Root: unresolved evidence, not approved exception

  SF evidence is substantial: lost Earth colony, inherited psi, matrix amplification and technical treatment of mental powers.
  SFE and creator/publisher sources support the SF rationale. However this does not alone prove every included novel excludes
  literal magic.


  Sharra remains ambiguous in independent completed-book evidence. A detailed completed review describes the matrix as a superweapon,
  a connection to an extra-dimensional entity, or both. That supports ambiguity, not a verified conclusion that the apparent
  goddess is fully demystified. Other completed reviews describe a psychic battle and matrix technology. Original cover artist
  calls the image a goddess, but that is not proof of the novel''s ontology.

  - https://uvula-fr-b4.livejournal.com/166285.html , completed review, 9 December 2008, explicit technology/entity ambiguity.

  - https://bibliogramma.dreamwidth.org/157106.html , completed review, 8 July 2015, detailed psychic climax.

  - https://www.billionlightyearbookshelf.com/reviews/heritageandexile.shtml , completed review, matrix technology and worship
  distinguished.

  - https://sf-encyclopedia.com/entry/bradley_marion_zimmer , reference, current 2026.


  Whole-fiction check uncovered the same uncertainty in Arilinn. Publisher copy explicitly advertises summoning gods. Independent
  completed reviews describe discovery of a psychic gift, without saying whether divine figures are mental projections or
  actual supernatural actors. Cannot infer the distinction from their silence.

  - https://www.netgalley.com/catalog/book/452483 , publisher-supplied description, release 12 November 2024.

  - https://bookshop.org/p/books/arilinn-a-novel-of-darkover-r-deborah-j-ross/84cea8591948e41e , Trust-published edition details
  and same description.

  - https://www.margaretlcarter.com/2025/01/ , completed review, 1 January 2025, full extent of psychic gift at climax.

  - https://eyes2creviews.blogspot.com/2024/11/laran-and-darkover.html , completed ARC review, 11 November 2024, unexpected
  laran use, no exact ontology.

  - https://www.goodreads.com/book/show/214297225-arilinn , completed-reader reviews inspected, general psychic framing but
  no resolution of exact manifestation.


  ## Temporal gate and candidate leaf

  Included novels contain real time travel. Shadow Matrix has physical travel to Varzil''s era, marriage, pregnancy, then
  return hours later in home time. Independent completed sources agree. Under the user''s any-included-SF-time-travel rule,
  a retained SF fiction cannot remain Broken lander romance just because that node is under Atemporal SF.

  - https://bibliogramma.dreamwidth.org/160779.html , completed review, 31 July 2015. Details Hali Tower entry and rhu fead
  return.

  - http://www.leighkimmelbookstore.bizhosting.com/blyb/shadowmatrix.html , independent completed review, Varzil calls them
  back.

  - http://www.armin-moehle.de/Rezensionen/DieSchattenmatrix.htm , independent completed review, Varzil initiates trip.


  Mind over time is a candidate, but Shadow Matrix summaries alone leave the distinction between psychic crossing and standing
  passage somewhat unclear. There is additional earlier-novel support: Forbidden Tower has Damon''s timesearch discipline,
  a meeting with Varzil across time through the Overworld. Two independent completed reviews identify this. Wikipedia provides
  the detailed mechanism, secondary rather than primary. Kireseth is used in the separate Year''s End sexual ritual; no completed-review
  source establishes it as the essential cause of timesearch.

  - https://bibliogramma.dreamwidth.org/156472.html , completed review, 6 July 2015, dangerous timesearch discipline.

  - https://www.billionlightyearbookshelf.com/reviews/forbiddencircle.shtml , completed review, 1 February 2013, independent
  confirmation of Varzil during Damon''s timesearch.

  - https://en.wikipedia.org/wiki/The_Forbidden_Tower , synopsis, fetched current, contact with Keepers in other times through
  Overworld and separate Year''s End ritual.


  Mind over time currently nine fictions. If root and exact leaf are settled in favor of this candidate, Darkover would be
  tenth and must freeze the leaf and initiate a split. No such placement or split has occurred. Do not build split proposal
  on the unsupported mirror evidence.


  ## Remaining decision

  A genuine evidence gap remains: whether the included universe''s god manifestations are explained as psi or are literal
  magic under the owner''s strict root test. Latest-book scope makes this a current issue, not merely an old Sharra inconsistency.
  Authorized previews discovered so far do not reach or explain those climaxes. Independent completed reviews leave the distinction
  unresolved. Parent has been informed throughout and should decide whether to ask for a scoped ambiguity ruling, or continue
  with an identified authorized source that can settle it. Do not silently invent a general psi exception or treat earlier
  Broken lander placement as one.


  ## Governing-rule recovery, 23:01, supersedes blocker above

  The earlier proposal to ask a new root question was withdrawn after recovering original authenticated owner messages. Rule44,
  phonemsg-01M3RM21XYVYNPRKB11M7VY69V, 30 September09:39, explicitly sends established SF tropes to SF absent proof of magic.
  Rule36, phonemsg-01M3BYCNTKEM9B38HRSQHJ7MQ6,25September11:29, admits genuinely ambiguous technology/magic. Later Oct28 phonemsg-01M61WBFZHYBJVT7CTS9A5VD3V
  requires Earth''s universe rather than an invented fantasy realm; Darkover explicitly meets that, not an inferred Earth
  origin. Nov8 phonemsg-01M6XV98C5QQJMV0SG7MW59N40 rejects actual fairy blessings/curses despite spaceships; it does not revoke
  the genuine-ambiguity rule. The combined bounded call is SF at moderate confidence, not a claim all apparent gods are proven
  demystified. Arilinn publisher and completed reviews explicitly frame its new Gift as laran, while Sharra completed review
  retains technology/entity ambiguity. No verified independent source establishes a separate literal-magic mechanism. Apply
  the user''s threshold, not a newly invented burden to prove every negative.


  ## Final mechanism walk

  Whole-fiction route: Speculative > SF > Atemporal SF > Time travel fiction > Mind over time. Included novel The Forbidden
  Tower''s timesearch reaches Keepers in other eras through the Overworld, a psychic state, corroborated in two independent
  completed reviews. Shadow Matrix''s physical visit is also summoned by Varzil, rather than ordinary chronological history.
  This is not merely reading memories, an oracle prediction, or a late excluded short story. Artifact mediation and Hali-entry
  imagery remain caveats, but the earlier mental timesearch already positively meets the unchanged consciousness/perception
  gate. Owner26October approved wording explicitly includes perceiving or moving among moments and does not require an innate
  rather than technical trigger.


  Full temporal partition: Time machines fails a passenger apparatus; towers and matrices focus psychic work, not a vehicle
  one rides. No institutional-owner shortcut. Hard time travel fails rigorous physics. Time door fails the standing unexplained-passage
  engine as whole-world description: the crossing is summoned psychic action, and earlier timesearch does not use a doorway.
  Timeslips fails passive natural shift; trained telepaths initiate timesearch and Varzil''s summons. Time disorders fails
  a pathological temporal condition; inherited laran is a trained faculty. Time tonics fails an administered temporal cause;
  kireseth''s separate Year''s End ritual is not proof that the timesearch is caused by a drug. Ancestral fails family-history
  destination/stakes, despite dynastic kinship. Loops fails repeated reliving, Distortion fails regional clock-rate engine,
  Crossroads fails an outside-time meeting hub with keepers. Mind over time wins positively for cross-era psychic consciousness,
  with physical/mental mixed manifestation retained as a whole-fiction wobble.


  Counterfactual non-temporal: Broken lander romance is the lost-colony foundation, not false in its content. It loses to
  included SF time travel under the ancestor gate. Futurist social, genetic-caste or planetary politics routes similarly fail
  the owner''s temporal priority. Atemporal siblings Fabulation, New Weird, Reincarnation and Parallel worlds do not describe
  the actual psychic historical contact better. No new leaf definition, ancestor exception or magic demystification is invented.


  ## Execution authority and QA

  Original intake commission phonemsg-01M43MYMGAMQTNA3CY402KK7FB, fiction discretion clarification phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX
  and widening approval phonemsg-01M5W59JNCEDB4ZZY1ZFV939ME personally recovered with authenticated user/from_handle metadata23:02.
  All29 hotlinks browser-loaded successfully before write; local contact-sheet actual pixels inspected. Many retained catalog
  fronts are150x239, low resolution disclosed. One candidate front per eligible novel, no repository images.


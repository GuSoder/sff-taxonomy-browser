placement_rationale: 'Walk: Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Mind over time.
  Journalist Olivia Nikitas stumbles into a power that lets her choose an alternate probability outcome - the first use is
  unwitting and saves her friend''s life; each re-made world spawns new catastrophes (a weaponized smallpox release) and the
  secret society that held the power hunts her (author interview, Big Idea/Whatever; Library Journal). The crossing among
  moments arrives by accident, through a state of mind and will - no apparatus, no slip, no substance: the leaf''s test.
  Rejected: Time machines and its children (nothing is built), Parallel-world fiction (she rewrites this world''s events
  rather than traveling to coexisting worlds; the probabilities collapse into one revised timeline). Wobble: moderate;
  marketed as an apocalyptic thriller, and the mechanic reads as probability-choice rather than literal travel. Year: 2020
  (Angry Robot). Queue id MC04093.'

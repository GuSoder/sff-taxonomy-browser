placement_rationale: 'Bo at 8, Brandon at 28, Blue at 48: the same man living one life across overlapping selves after his
  employer''s inadvertent time experiment (publisher blurb). The speculative device is the multiplied self perceiving its
  own layers. Fits Extra-dimensional awareness (leaf renamed and widened to Mind over time 2026-10-26).


  ## Approved Mind over time subdivision,25 November2026


  Root-down rewalk: Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Mind over time > Time-spanning
  minds.


  The original whole-fiction root evidence and specific rival tests above are retained. SF has a positive Earth-derived or
  science-fictional explanatory frame, not actual independently proven magic; the prior genuine-ambiguity threshold is not
  replaced with a new demystification requirement. Included actual temporal experience/contact/visit takes precedence over
  Futurist, Modern day or Historical setting surfaces. Atemporal siblings Fabulation, Parallel worlds, Reincarnation and New
  Weird lose to the documented temporal consciousness rather than to chapter order, memory, simulation or lifespan alone.
  Mind over time is the owner-approved experience gate, not an innate-source gate. Time machines, standing Time door, natural
  carrying Timeslip, pathological Time disorder, administered Time tonic, rigorous Hard time travel, family-history Ancestral
  destination, repeated-span Loop, regional clock-rate Distortion and outside-time Crossroads are not better descriptions
  of the specific mental access; earlier material mediation/technical-trigger caveats remain.


  Bo, Brandon and Blue are stages of one man''s overlapping lived experience. The employer induces dreaming while he is connected
  to machines, and he makes active choices, so neither innate-versus-technical nor passive-versus-active defines this split.
  Owner26October explicitly approved Flux''s technological trigger in this consciousness-experience leaf. The defining form
  is his fractured life across moments, not primarily contacting another era''s person or conducting a historical mission.


  Sibling function: lived awareness spanning moments / cross-era mental encounter / directed psychic historical visit. This
  is not active versus passive, technical versus innate, self versus other, or a claim every included volume has the same
  temporal event. All titles, authors, dates, books and cover hotlinks unchanged.



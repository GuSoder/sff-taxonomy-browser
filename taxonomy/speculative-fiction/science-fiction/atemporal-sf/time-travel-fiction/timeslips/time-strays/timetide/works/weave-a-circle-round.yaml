placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal sf > Time travel fiction > Timeslips >
  Time strays > Timetide. Freddy DuChamp falls through a time portal with her ancient, child-seeming neighbor Josiah and the
  crossings keep coming and going on their own - medieval Sweden, Bronze Age China, the 1797 Lake District - unscheduled slips
  she cannot command, with stretches lived in each era (Reactor 2017-11-28, Nebula-nominated debut, Tor 2017). The leaf''s
  definition verbatim: the crossing keeps coming and going on its own. Rejected: Timestranded (not one continuous stranding;
  she goes out and comes back repeatedly), Time-tangles (no interdependent lives snarled across eras; the engine is her episodic
  slips and growth), Time-travel-disorders (not an intrinsic condition; the LaChances and the house are external), juvenile
  leaves (content governs, not audience). Wobble: real; the coming-of-age spine pulls toward magical-coming-of-age, but the
  mechanism that carries the book is the recurring slip.'

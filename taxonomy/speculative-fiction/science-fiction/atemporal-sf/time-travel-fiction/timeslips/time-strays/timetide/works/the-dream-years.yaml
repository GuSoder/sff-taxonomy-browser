placement_rationale: 'Root-down: Science fiction -> Atemporal -> Time travel fiction -> Timeslips. SFE explicitly calls it
  a timeslip romance alternating between 1920s surrealist Paris and the Events of 1968, conflating two historical moments
  of attempted reality-transformation; SFE Time Travel also lists it among notable timeslip romances. The arbitrary crossing
  between eras, not a machine or ancestral embodiment, governs.'

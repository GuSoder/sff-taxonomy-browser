placement_rationale: 'Forge (Macmillan) and Wikipedia frame it as time travel fiction: in Euclid
  Heights, Illinois, Josh Winkler finds the town''s paths let him slip fifteen years into
  the past and back again, an unexplained crossing that keeps recurring - his daughter and
  eventually his wife are caught in it too. Walk: Science fiction > Atemporal > Time travel
  fiction > Timeslips > Time strays > Timetide (the crossing keeps coming and going on its
  own; no machine). Sources: charlesdickinson.com, en.wikipedia.org.'

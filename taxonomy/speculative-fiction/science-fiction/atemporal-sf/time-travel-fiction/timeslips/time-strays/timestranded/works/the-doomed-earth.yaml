placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Timeslips > Time
  strays > Timestranded. In 2180 Lieutenant Selene Genji, a fleet officer with partly alien DNA, watches Earth destroyed;
  the forces unleashed hurl her forty years into the past, alone, where she tries to change the future starting with a first
  contact only she knows is coming (Penguin Random House publisher copy for In Our Stars and Destiny''s Way). One traveler,
  cut off from her own era and living among strangers, is the leaf''s definition; the slip is an accident of the catastrophe,
  not a machine or agency (rejected: Homebrew time machines, Time agencies, Time tribe, no group crosses with her). Wobble:
  moderate, since the military SF and first-contact threads are strong and she acts on the past more than she settles into
  it. Published as the Doomed Earth duology by Ace: In Our Stars (hardcover May 21, 2024) and Destiny''s Way (paperback original
  Feb 17, 2026). Queue ids MC04039 and MC04041.'

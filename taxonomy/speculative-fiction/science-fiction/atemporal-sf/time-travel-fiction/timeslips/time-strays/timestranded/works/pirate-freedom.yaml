placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Timeslips > Time
  strays > Timestranded. A young man in the present is thrown back in time to the age of Caribbean piracy and lives out a
  life there as a pirate, told as the memoir of an older priest (Wikipedia: ''transported back in time and becomes a pirate'';
  Tor, 2007). Timestranded is one person cut off from home who has to live a life among strangers in another era, which is
  the whole book. Rejected: Pirate fantasy (high-seas adventure on an invented world; here the sea is our history and the
  engine is the stranded life), Time ancestry and other Time strays leaves (one traveler, no machine, no tribe). Wobble: the
  queue labels it fantasy and the crossing is unexplained, so it reads as a timeslip; Pirate fantasy for the ship life.'

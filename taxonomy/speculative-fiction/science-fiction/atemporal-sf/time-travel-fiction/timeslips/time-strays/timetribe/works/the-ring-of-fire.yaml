  ## Dates repaired

  Saxon Uprising2011; Parcel of Rogues2016; Ottoman Onslaught2017; Volga Rules2018; Polish Maelstrom2019; Weaver''s Code2024;
  Peacock Throne2021; Calabar''s War2021; Macedonian Hazard2021; Time Spike2008; Pilgrim''s Passage2026. No Ship for Tranquebar
  first complete edition2013, not2018 paperback. Bartley''s Man2016 expanded book, not2013 serial. First fiction year2000,
  not Letters from Gronow2018. Author list derives from all included volumes, not only Flint and Carrico.


  ## Covers and visual QA

  Hotlinks only. No cover bytes enter the repository. All83 selected English flat fronts were downloaded temporarily for one-pass
  pixel inspection in five labelled sheets. That inspection caught and replaced an incorrect Ring of Fire anthology image
  that the current1633 reading-list link supplied. The series card uses1632 with a visible fiction-title overlay because its
  cover does not contain the full shared-universe name. Smaller catalog images remain on three Czar novels; these are correct
  English fronts but lower resolution. Live rendering still requires inspection after publication.


  ## Limits

  Completeness means eligible original novels discovered across the reconciled bibliographies as of24November2026, not every
  short fiction, every serial or magazine issue. Hybrid-volume scope is recorded explicitly. Future publications are excluded.
  No structural or definition changes are part of this repair.


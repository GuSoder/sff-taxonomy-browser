placement_rationale: '# Ring of Fire / Assiti Shards, MC06447

  24 November 2026


  ## Decision

  Complete the existing connected shared-universe fiction in Timetribe, preserving its stable ID `the-ring-of-fire`. Merge
  the duplicate four-book Age of sail alterations card into it. The reconciled corpus contains 83 original novels, counted
  once each, including Up-time Pride and Down-time Prejudice (2019). No new genre or definition change.


  ## Authority

  Original owner request phonemsg-01M43MYMGAMQTNA3CY402KK7FB starts normal live intake, with structural proposals at a full
  leaf or a required seed. The actual October6 exchange was recovered: proposal phonemsg-01M48P8N1Z5VAJPYESVC4F9TZM, distribution
  phonemsg-01M48P8QX73JHE0BP8CADP4MGY explicitly placing Ring of Fire in Timetribe, and owner approval phonemsg-01M48PCCBD5DHFBCK67K25AQ0T.
  The original October30 exchange phonemsg-01M66AN5ZFHHFZX36H0G46T1AF / phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX explicitly entrusts
  single-fiction judgment and consolidation. The October6 owner completion and shared-universe messages are phonemsg-01M4809P36MN3PS4CDA8HY6JYE,
  phonemsg-01M480EP8NE76QZSPH7QZSEHTN and phonemsg-01M483CARNEF5RBAW6KCCVW1ST. Repository notes only located these originals;
  they were not used as approval evidence.


  ## Shared continuity, not merely branding

  The authorized current magazine describes the Assiti as alien artists whose discarded shards displace pieces of Earth. Its
  first issue describes five events sharing the original timeline: Grantville, Time Spike, Queen of the Sea, The Crossing
  and Peterbilt. The publisher''s Alexander Inheritance blurb explicitly makes Grantville and the prison earlier catastrophes
  in the same sequence. Time Spike and The Crossing also carry an investigation and government-coverup thread on original
  Earth. Different destination histories are therefore branches of one connected multiverse, not independent works linked
  only by a repeated device. An earlier author-bibliography description saying only the mechanism is shared is weaker than
  these direct continuity facts. Keep all five shard threads on one fiction.


  https://1632magazine.com/issues/1632-beyond-issue-001/


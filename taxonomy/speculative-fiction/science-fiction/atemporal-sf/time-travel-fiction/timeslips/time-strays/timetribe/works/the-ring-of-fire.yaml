  ## Full walk

  Speculative fiction -> Science fiction: actual temporal/spatial displacements, attributed to alien phenomena. Historical
  beliefs in witchcraft and gods are not proof of literal magic. Fantasy''s Earth, invented-realm and portal branches do not
  override this SF mechanism.


  Science fiction -> Atemporal SF. Historical SF fails as the canonical route because actual time travel in the included novels
  overrides the historical-destination surface. Modern day SF fails because the transported people leave modernity; Futurist
  SF fails because the main lives are in past eras. This repairs the later Age of sail duplicate without changing that leaf''s
  gate.


  Atemporal: Fabulation fails, no foregrounded arbitrary storytelling; New Weird fails, not grotesque cross-mode reality;
  Science fantasy fails, not fantasy-surfaced scientific worldbuilding; Parallel world fiction is secondary to explicit travel
  across eras; Reincarnation fails, no recurring soul. Time travel fiction passes.


  Time travel: Time machines fails, the travelers do not operate a device or institution; Hard time travel fails, alien-art
  displacement is not rigorously worked physical engineering; Ancestral fails, kinship does not determine the transfers; Time
  loops fails, not repeated reliving; Mind over time fails, whole bodies and places move; Time travel disorders fails, no
  bodily condition; Time distortion fails, not unequal clock rates; Time crossroads fails, no outside-time hub; Time tonics
  fails, no administered substance; Time door fails, no standing passage entered at will. Timeslips passes: the external catastrophic
  event carries the people.


  Timeslips: Time bleeds fails, people actually move; Time tangles fails as the defining engine, because the main communities
  settle and live in destination eras rather than form an interdependent repeated-crossing knot. Time strays passes.


  Time strays: Timestranded fails, not a lone traveler; Timetide fails, not recurring uncontrolled departures and returns;
  Timetribe passes, towns, prisons, ships and smaller groups are transplanted together and build communities. This is also
  the specific owner-approved home. Timetribe remains7 fictions; Age of sail alterations drops7to6. Neither reaches ten.


  ## Corpus and forms

  Use the complete book edition, not a serial''s launch, for a rewritten unitized novel''s year. Reprints do not create extra
  books. The 2019 Up-time novel is not a new2026 novel. Saving the Dodo (2021) replaces the earlier Second Chance Bird version
  once, as the authorized reading guide directs.


  The list is reconciled from current authorized publication and storyline lists, the complete Ring of Fire Press bibliography,
  Baen product pages and ISFDB title/publication records. Some bibliographic fetches return no content; in those cases the
  actual fetched series record, publisher description and other bibliography provide corroboration. No unavailable full-book
  mirror was used.


  Keep braided novels, not every volume under a Wikipedia anthology heading: The Barbie Consortium and Chronicles of Dr. Gribbleflotz
  are catalogued novels; the authorized guide explicitly explains the former''s revised integration. The Tangled Web is catalogued
  as a novel and described as one with four interlocking strands. The Marshals author''s own account explicitly calls it a
  braided novel, published2022. Tales from the Mermaid and Tiger is also independently catalogued as one novel.


  Coast of Chaos is a hybrid: Baen calls it a short novel plus seven bonus stories and an anthology. Count only its separately
  catalogued title novel, not the bonus stories. The Hunt for the Red Cardinal likewise contains its separately catalogued293-page
  novel after three short stories, beginning page54. Count that novel only. These are eligible novels packaged with extras,
  not an expansion of scope to collections.


  Exclude The Ram Rebellion as an anthology: Flint''s own preface calls it a braided-story anthology. Exclude Music and Murder,
  Muse of Music, Magdeburg Noir, Things Could Be Worse, Private Casefiles of Archie Gottesfreund, The Monster Society, The
  Legend of Jimmy Dick, The Grantville Inquisitor, The Horsewoman, Seas of Fortune, Flight of the Nightingale, Christmas collections,
  Ring of Fire anthologies and Gazette/magazine issues. Exclude nonfiction, roleplaying guides and duplicate/omnibus editions.



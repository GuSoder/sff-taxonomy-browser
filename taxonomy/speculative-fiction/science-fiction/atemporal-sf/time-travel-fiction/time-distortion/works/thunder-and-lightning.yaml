placement_rationale: 'Whole-fiction root-down MC04870, 2026-11-05: Speculative fiction > Science fiction > Atemporal
  SF > Time travel fiction > Time distortion. All four published Thunder and Lightning novels, Red Thunder2003,
  Red Lightning2006, Rolling Thunder2008 and Dark Lightning2014, are one fiction. Authorbibliography/FF/SFE agree
  quartet. Separate from Eight Worlds/Metal setting (Doux, Reactor); no unrelated Varley novels imported. Whole-book
  engines checked individually: Red Thunder has Manny/Kelly/Dak/Alicia and former astronaut Travis construct tanker-car
  spacecraft with Jubal''s squeezer power to beat Chinese Mars mission and save endangered Americans. Red Lightning
  follows Ray, son of Manny/Kelly: near-light-speed impact causes Atlantic tsunami, rescue of Florida family, Jubal''s
  disappearance, Earth''s coercive armed interference and Mars'' independence. Rolling Thunder follows Ray''s daughter
  Podkayne, Martian Navy entertainer on Europa, crystalline alien threat and her rescue from a black bubble after
  ten external years, followed by Earth''s ecological ruin and the family''s asteroid-starship departure. Dark Lightning
  follows Podkayne/Jubal''s twins Cassie and Polly aboard Rolling Thunder twenty years into the voyage; Jubal''s
  warning that dark energy at high speed will kill passengers triggers mutiny; twins free captured family and suppress
  it, and Jubal develops another invention. Templeton/York avoid final mechanism; a fetched Amazon reader review
  specifically calls it FTL, lower-confidence reader evidence, not publisher-confirmed exactphysics. Do not claim
  proven backwards travel from FTL or alternate Earths from extrapolated physics. SF over Fantasy: fabricated but
  engineered squeezer power, starships and local black-field suspension, no established magic/gods. Super-science
  is not itself proof of Science fantasy. Temporal gate has priority over very strong Futurist/Retro attraction
  under curator phonemsg-01M36M8K4DB3B8Y8T1GAQ6ARF0: any time element in SF goes Atemporal; no ending-only or dominant-tone
  exception. Here the actual evidence is unequal local time, not a mere reviewer metaphor about generations. SFE
  explicitly distinguishes these stasis fields from an ordinary generation ship; Templeton explains anyone or anything
  inside skips external years/decades without aging, and Jubal deliberately spends much of each year inside so his
  biological age catches up with Podkayne''s. Primaryauthor excerpt shows his emergence from the field and habitual
  welcome. This is temporal rate manipulation across field boundary, not ordinary sleep, reversible cryonics speculation
  or a story merely moving forward between generations. Its consequences include Podkayne''s ten-year absence/rescue,
  recurrent family-age management, cargo preservation, and choice of inhabitants to live out the voyage or skip
  it. Existing Time distortion definition explicitly admits regions running at radically different rates where unequal
  passage shapes story; small enclosed fields are regions, without editing gate. No generalized new ruling on every
  cryosleep story. Four whole-novel plots, not only final spaceship setting, retained in judgment. Within Time travel
  fiction: distortion better than Time machines/Overclockian, despite built generators, because no private trip
  to a destination era and no institutional temporal mission governs; the operation is local stopped time against
  flowing exterior, with coexisting unequal age rates, as opposed to a vehicle navigating dates. No time-loop reset,
  ancestral destination, inherited disorder, administered tonic, uncontrolled timeslip, standing time-door or era-crossroads.
  Mind over time wobble: Jubal speculates awareness continues and links him to Podkayne in simultaneous distant
  bubbles; Templeton carefully attributes alternate-dimension explanation to Jubal, not proven parallel-Earth transit.
  No verified passage to an alternate historical Earth, reincarnation or fantasy reality to override actual field
  operation. Futurist losing walk: future SolarSystem/space exploration goes Spacefaring > SpaceOpera > Classic
  > Pulp > Retro; whole quartet is explicit Heinlein homage (NSSbook3, PWbook4, Locus/SFE/Reactor retrospectives)
  not original GoldenAge composition, not commercially certified Evergreen. Whole multi-generation change makes
  FutureHistory a real wobble, but family competent-hero adventures, catastrophe rescue, alien encounter and shipboard
  revolt, not sustained institutional civilization chronicle. GenerationStarship only last novel and uses stasis
  to bypass generational constraint; last-setting shortcut loses. HardSF/OrbitalMechanics loses to openly fabricated
  squeezer, not enough a technically detailed habitat makes a rigorous-model puzzle; Military loses to civilian
  family/entertainer stories, SpaceColonies/Dynasties to mobile rescue/exploration rather than colony power-engine,
  SpaceshipDrama to recurring larger disasters/rebellion and inventions rather than communal care alone. Historical
  nearfuture launch in2003 is not retrohistorical, no recognizablepast period governing; Modern catastrophe is book2
  localstrand not wholeuniverse. Those lower attractions cannot silently relax temporal priority. Time distortion4->5,835genres/2717fictions/6340books.
  Four distinct Englishprintfronts inspected/localized: SFE original2003RedThunder and2006RedLightning hardbacks,
  Biblio/Ace2009RollingThunder massmarket reprint, AbeBooks/Ace2015DarkLightning paperback reprint; originalworkyears
  remain2003/06/08/14. No titlepages/audio/stickers/3D/placeholders.'

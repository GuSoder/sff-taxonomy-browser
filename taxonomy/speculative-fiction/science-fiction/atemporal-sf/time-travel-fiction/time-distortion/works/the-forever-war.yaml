placement_rationale: '# Full two-novel temporal root rewalk,26November2026

  Move Super space soldier > SF > Atemporal SF > Time travel fiction > Time distortion. Two included novels The Forever War1974and
  Forever Free1999remain ONE fiction. Forever Peace is a thematic companion, NOT same universe, excluded from this card by
  creator and SFE. No cover/year/book lost.

  Actual mechanism: relativistic differing subjective/objective elapsed time, SFE explicitly one-way time travel, sends soldiers
  into remote future and leaves culture/technology changed. Sequel deliberately plans10subjective years/40000external years
  to escape society, returns24years later when interrupted. This is sustained temporal displacement and causal reading engine
  in BOTH books, not ordinary chronology, generations passing, mere suspended sleep or12second anomaly. Thus any-time rule
  and unchanged Time distortion definition apply. Not built two-way time-machine institution/agency merely because military
  owns ships; unequal rates are the specified existing gate. Not loops, bodily disorder, psychic visits, ancestry or unexplained
  timeslip. Military alienation/body-cost is foundational but cannot override temporal ancestor.

  Sequel ontological coda tested first, not hidden: Kirkus and completed reviews identify mad-scientist god conducting galaxy
  experiment, Omnis, disappearances and restored lives; critic Don Webb explicitly calls supernatural, creator calls theological/ontological
  and changing causality. Do NOT claim proven scientific demystification. Creator''s god as laboratory experimenter is genuine
  SF/ontology ambiguity under owner rule44, not proof conventional sorcery. Fabulation strong rival: entire universe contingent
  upon god. But no retrieved evidence identifies past already lived overwritten/retconned, narrated/written/projected world
  or rival godgame as the whole reading engine. The scientific experiment revelation changes constants at conclusion, not
  demonstrated textual/artifact worldmaking or retcon. Absurdist constructed realities could take late ontological twist but
  would misrepresent first fullnovel and most sequel; no need enlarge its9or invent seed. Positive explicit relativistic temporal
  premise throughout is stronger existing fit. Moderate-high temporal placement with theological dissent retained, not a claim
  every anomaly resolved.

  Sources read: https://sf-encyclopedia.com/entry/haldeman_joe ; http://miriam-english.org/spacedout/website/DU-12/Haldeman.html
  ; https://www.kirkusreviews.com/book-reviews/joe-haldeman/forever-free/ ; https://www.infinityplus.co.uk/nonfiction/foreverfree.htm
  ; https://www.christian-sauve.com/2000/09/forever-free-joe-haldeman/ ; https://www.bewilderingstories.com/issue23/haldeman.html
  . Not direct fullnovel read. Individual fiction judgment original30October2026phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX; temporal
  rule23September and included-books confirmation23November personally recovered.



  Former rationale:

  A conscript fights an interstellar war while relativistic travel separates him by centuries from home; military service
  and its alienation organize the novel.'

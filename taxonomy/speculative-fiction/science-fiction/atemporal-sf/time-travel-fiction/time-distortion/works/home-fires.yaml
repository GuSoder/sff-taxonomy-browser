placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal > Time travel fiction > Time distortion.
  Skip and Chelle planned that she would fight a war on an alien planet while he studied, so that time dilation would leave
  her barely two years older when twenty years had passed for him; now she is home and the plan has flaws (Wikipedia, Tor
  2011; Kirkus). The unequal passage of time between two people is the premise and shapes the whole marriage, which is the
  leaf''s definition. Rejected: Future war (the war is offstage), Hard time travel and other machine leaves (no time machine,
  only relativity), Modern day (not the recognizable present). Wobble: the cover is a plain title page, and the book is also
  a domestic and marriage story with an energy-poor future society.'

placement_rationale: '# MC04984 Song of Ireland - root walk, 2026-11-06


  Place Song of Ireland (Juilene Osborne-McKnight, 2006), one novel, in existing Time distortion, five to six fictions. No
  gate or structural changes.


  ## Scope

  Author''s 2007 interview calls her four novels a quartet. Her more precise 2004 explanation says each represents one of
  four Irish storytelling cycles, with Song finishing that project. Distinct protagonists, eras and independent plots do not
  positively establish one shared fictional continuity. Treat Song as the independent fiction, not the whole mythology of
  Ireland as one universe. This is provisional scope in the narrow evidential sense: direct continuation/canonical world evidence
  would require folding and rewalking all four. Catalog/thematic grouping alone is insufficient. The other novels are I Am
  of Irelaunde, Daughter of Ireland and Bright Sword of Ireland. None is silently counted here.


  ## Whole novel engine

  Completed HNS and Pop Mythology reviews establish the three-part arc: Amergin/Milesian travels around the Mediterranean,
  the Danu''s history and civilization, then their encounter, conflict, negotiation and love. Not simply an immortal fairy
  romance. The central collision concerns two populations with radically different capacities and lifespans. The Danu are
  biologically engineered offworld exiles; ships brought them to Earth. The mythic Silver Arm and shape-changing have engineered/molecular
  explanations. The temporal cities preserve longevity and secrecy, and sealing their doors would protect the Danu by cutting
  them off from humankind. Amergin''s final choice to cross to Eriu''s time and the epilogue''s generations elapsed outside
  make unequal-time consequences govern the resolution.


  ## Root walk and all sibling tests

  Speculative fiction -> Science fiction rather than Fantasy. Marketing and completed reviews call the book historical fantasy/myth
  retelling, and Pop Mythology cautiously says SF hints, but actual text supplies scientific causation: genetic creation,
  starships, laboratories, molecular alteration, medical devices and deliberately harnessed temporal passages. Myth names
  are not proof of magic. Strong surface wobble retained, not hidden.


  Science fiction -> Atemporal SF. Not Modern-day or Futurist: ancient Earth anchor. Historical SF initially looks plausible,
  but the curator''s any-SF-time-element rule overrides chronological sorting. Characters literally reenter the past through
  the Chamber of Memory, not merely watch recordings, and move among differently paced time leaves.


  Atemporal siblings: not Fabulation (no unreliable-telling engine); not New weird (not deliberately unresolved science/horror
  ontologies); not Reincarnation fiction (no recurring soul engine); not Science fantasy (its current definition requires
  exile from usable timeline, whereas this explicitly dates Ireland and any-time rule applies); not Parallel world fiction
  (not alternate histories/mirror selves or multiverse conflict; leaves are temporal slices/rates); Time travel fiction passes.


  Time travel fiction -> Time distortion. Exact current gate: different regions/worlds run at radically different rates, and
  unequal passage shapes story. Airmid''s lesson explicitly states outside humans age/years pass while Danu remain within
  their slower cities. Entering/leaving leaves changes exposure to aging; final union and future descendants depend on it.


  All rival siblings: Time machines is the strongest rival because passages and memory apparatus were built/harnessed. Yet
  this is not an individual''s homebrew project or an organization whose operation of time missions is the fiction''s engine.
  The standing apparatus explains access; rate disparity governs the entire Danu/human relation and ending. Hard time travel
  loses: schematic leaves/portals, not a rigorously developed physical mechanism. Ancestral time travel loses: ancestors can
  be revisited in history scenes, but kinship is not what determines Amergin''s destination/stakes. Time loops: no repeated
  span. Mind over time: some vision/ancestral sequences, but embodied crossings and cities are real, not solely consciousness.
  Time travel disorders: no intrinsic medical trigger. Timeslips: not unexplained/natural involuntary transfer. Time crossroads:
  no outside-time inn/hub where eras trade under keepers. Time tonics: no substance moves time. Time door: explicitly requires
  an unexplained passage/nothing built, defeated by constructed Danu access and the explanation. No widening to accept it.


  ## Evidence quality and cover

  The most discriminating chapters were read in a public third-party transcription, not a publisher-authorized edition: origin
  chapter, Airmid''s full temporal explanation, medical/genetic scenes, and final chapter/epilogue. These detailed claims
  have lower provenance confidence than authorized text. However the completed Pop Mythology review independently confirms
  SF hints and the device permitting characters to speak to long-dead ancestors, while publisher/PW copy independently confirms
  power over time. The exact unequal-rate explanation is a direct-text finding, not inferred from reviews. No claim that this
  transcription is authorized.


  Single local flat English front inspected: Tor''s 2014 trade paperback, with "first time in paperback" on front, from the
  completed Pop Mythology review. Novel''s first publication remains 2006, confirmed author/reference, HNS and Forge hardcover
  record. No first-edition jacket claim.



placement_rationale: 'Modesitt''s Timedivers sequence (The Fires of Paratime 1982, expanded as The Timegod 1993, and Timediver''s
  Dawn 1992; the omnibus Timegods'' World 2000 is skipped): emissaries and guardians of the planet Query, the Guard under
  its Tribunes, dive through time and slide between worlds on missions, and manipulate reality through their control of time
  (SFE, ISFDB synopsis, author site). Root-down: Science fiction -> Atemporal -> Time travel fiction -> Time machines; the
  owner test holds, since take away the Guard of Query and the diving has no owner, so Time travel agency; published 1982
  to 1993, so Classic time agencies (pulp era to early 1990s), not Thrillers or Revival. Wobble low to moderate: the tone
  is metaphysical space adventure more than patrol procedure. Covers: Timediver''s Dawn jacket only; the Timegod jacket is
  type only and the Fires of Paratime image is a title page.'

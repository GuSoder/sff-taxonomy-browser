placement_rationale: 'Standalone novel (Tor 1997; the queue''s 2012 is a reprint). In a 40th century where time is quantized
  into discrete ''moment universes'', each visitable and changeable without paradox, a time-tourism economy runs the apparatus:
  billionaire Owen Vannice exports a live dinosaur from the Cretaceous station while his con-man father and paleontologist
  Dr. Nice''s family play out a comedy of manners across the eras (Kirkus review). The Atemporal ruling sorts all SF time
  travel here regardless of register, superseding the satirical-SF surface. Within Time machines, the owner test: the apparatus
  is institutional infrastructure - a whole tourism industry, not an individual''s device - so Time travel agency; of its
  era leaves it is not the post-2010 literary revival and not an action-thriller, leaving Classic time agencies as the fit.
  Disclosures: 1997 sits just past the leaf''s ''pulp era through the early 1990s'' wording (the axis is era/sensibility,
  and the book''s sensibility is the classic comic-institutional one, closest to Oxford time travel''s comic academic register
  among the tenants), and the comic-satirical register is disclosed rather than hidden. First published 1997.'

definition: 'The classic institutional Time Machines line, from the pulp era through the 1990s: agencies, patrols, government
  projects and academic departments send their operatives through time - Eternity''s technicians, Cold War time traders, government
  forward-jump programs, Oxford''s historians. The owner test still applies; this shelf is the classic wave of it. Named under
  the curator''s 2026-09-26 era split.'

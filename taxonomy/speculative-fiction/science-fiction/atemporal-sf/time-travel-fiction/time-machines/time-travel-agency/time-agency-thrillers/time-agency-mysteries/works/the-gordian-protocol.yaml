placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Time machines > Time travel
  agency > Time agency thrillers > Time agency mysteries. All six current Gordian Division novels remain together, not split
  into Protocols versus Files. The Protocol line investigates/intervenes in temporal disasters; Janus, Weltall and Dyson establish
  three explicitly detective-led novels. Inquiry into temporal crimes and hidden interference is the whole-world Mysteries
  hook. Missions is the strongest crossover, not erased for even counts. Scientific built organizational time technology earns
  SF/Atemporal/Time travel/Time machines/Agency; police-procedural and intervention thriller action defeat literary-emotional
  revival or classic pulp patrol. Present/future history and military branches lose to the included temporal element. Current
  six-book creator/publisher corpus verified during the split audit. Rewalked root-down24November2026 against current sibling
  gates; all existing book manifests, authors, first-publication years and hotlinked covers preserved. Structural approval
  phonemsg-01M860T8HJWF9ZGD1WCAATQSG0 on phonemsg-01M857SZS2Q64K2DG5ZXVB64PD.


  Prior ancestor rationale retained as historical context, not reverified source authority:

  Weber and Jacob Holo''s Gordian Division series (The Gordian Protocol 2019, The Valkyrie Protocol 2020, The Janus File 2022,
  The Weltall File 2023, The Thermopylae Protocol 2024; the series has six books, the queue lists five): one series, so one
  fiction. A history professor, Benjamin Schroeder, is told by a man from the Gordian Division that time travel has produced
  more than a dozen doomed alternate universes, and that he must choose which one lives; the division, an agency that polices
  and repairs timelines, then runs operations across worlds, including later threats such as a ship from an uncharted universe
  and a hidden weapon (Baen blurb for The Gordian Protocol; Simon & Schuster series page for The Thermopylae Protocol). Walk:
  Science fiction > Atemporal > Time travel fiction > Time machines > Time travel agency > Time agency thrillers (operatives
  and rival factions run the apparatus, and the plot is a mission or conspiracy across time). Rejected: Classic time agencies
  (the pulp patrol sensibility, not the action-thriller register), Time agency revival (literary and emotional), the Multiverse
  leaves (the engine is the timeline agency, not the crossing itself). Wobble moderate: the later books move toward multiverse
  war and the agency''s world is also an alternate-history setting, and I used the blurb and series page, not the books. First
  publication 2019-2024. Queue ids MC02459, MC02472, MC02461, MC02475, MC02471.'

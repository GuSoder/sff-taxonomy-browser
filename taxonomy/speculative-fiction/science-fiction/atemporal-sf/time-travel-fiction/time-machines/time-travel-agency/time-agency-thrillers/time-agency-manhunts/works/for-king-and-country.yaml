placement_rationale: 'Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Time machines > Time travel
  agency > Time agency thrillers > Time agency manhunts. Research apparatus sends Stirling after suspected terrorists into
  Arthurian Britain, with consciousness-sharing through historical hosts. Device mediation defeats unaided Mind over time,
  and institutional research defeats private homebrew. SF apparatus is the temporal premise, not legendary setting as proof
  of Fantasy; any temporal SF takes precedence over historical dating. Official mission is a strong Missions overlap, but
  pursuit of identifiable infiltrators and stopping their assassination is the more discriminating hunter-quarry engine. Contemporary
  action-thriller register defeats classic patrol and literary-emotional revival. Rewalked root-down24November2026 against
  current sibling gates; all existing book manifests, authors, first-publication years and hotlinked covers preserved. Structural
  approval phonemsg-01M860T8HJWF9ZGD1WCAATQSG0 on phonemsg-01M857SZS2Q64K2DG5ZXVB64PD.


  Prior ancestor rationale retained as historical context, not reverified source authority:

  2002 time-travel thriller: an SAS captain chases an IRA agent who has infiltrated a time-travel laboratory, and the chase
  runs into the past to stop a terrorist plot against Britain''s future king. A lab and its factions run the apparatus and
  the plot is a chase and a conspiracy; seeded Time agency thrillers.'

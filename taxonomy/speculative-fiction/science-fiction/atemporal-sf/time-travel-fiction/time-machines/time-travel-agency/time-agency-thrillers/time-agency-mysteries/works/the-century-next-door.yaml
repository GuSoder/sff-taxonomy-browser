id: the-century-next-door
title: The Century Next Door
authors:
- John Barnes
first_published: 1991
canonical_genre: time-agency-mysteries
placement_status: accepted
placement_rationale: 'Root-down rewalk, 25 November 2026: Speculative fiction > Science fiction > Atemporal SF > Time travel
  fiction > Time machines > Time travel agency > Time agency thrillers > Time agency mysteries. Whole four included novels
  retained: Orbital Resonance, Kaleidoscope Century, Candle, The Sky So Big and Black. SFE (https://sf-encyclopedia.com/entry/barnes_john)
  explicitly describes time-travel wipings and rewipings across this future history. The complete Kirkus account of included
  Kaleidoscope Century (https://www.kirkusreviews.com/book-reviews/john-barnes/kaleidoscope-century/) confirms that Sadi controls
  the Organization and its time-travel method, with a rescue fleet coming from three centuries ahead. This is not only Joshua
  Quare becoming younger: his recurring virus-induced rejuvenation and memory loss are distinct from actual temporal intervention.
  No literal magic or invented realm; real Earth history, future Mars and manufactured mental memes. Futurist fails the included
  temporal crossings, regardless of the other novels stable future settings. Historical alternate history fails for the same
  reason; the 1991 divergence is not the whole mechanism. Time travel fiction overrides the genuine Rewired minds theme of
  Resuna and One True taking over human brains. Time tonics fails because the rejuvenation injection does not move Joshua
  into another era; Reincarnation fails because he continues biologically rather than recurring as a soul. Institutional technological
  control of time by the Organization defeats natural Timeslips, intrinsic Disorders, psychic Mind over time, standing Time
  door and personally owned Homebrew machines. The exact engineering is thinly described in the accessible accounts, so no
  Hard time travel claim. Thriller conspiracy, assassin career and reconstructed identity defeat literary-emotional Time agency
  revival; this is not the classic patrol or academic-expedition form despite 1990s publication. Time agency mysteries is
  the strongest existing leaf because the time-travel-bearing story reconstructs an erased past and uncovers an institutions
  manipulation; chase, violence and future rescue are consequences of those discoveries. Missions and Manhunts are real rivals
  but no sustained situational intervention or one temporal quarry organizes the whole four-book fiction. Other included novels
  examine orbital adolescence, forced memetic consent and Mars trauma; the temporal conspiracy in an included novel governs
  ancestor without splitting the shared world. Individual correction under phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX, discovered
  in mandatory Rewired minds membership audit. Wobble: moderate at final thriller child, firm at Atemporal root; the institutional
  apparatus ownership is supported by Sadi and Organization, not an invented agency mission.'

  agency > Time agency thrillers > Time agency missions. All ten novels form one broad found-family space-adventure world.
  Aari''s temporal rescue and the daughters'' mission through space/time to trace and counter the plague give Missions its
  positive intervention hook. Scientific alien technology, not proof of literal magic, supports the inherited SF gate; any
  included time travel takes precedence over spacefaring/found-family shelves. Ancestral Friends'' controlled technology and
  stolen portable cronos retain institutional ownership, not private homebrew merely because protagonists use them without
  permission. The temporal thread is late in a wide universe and not all ten are narrow agency adventures. Rescue and intervention
  outweigh pursuit or investigation as a whole-fiction browsing hook. Rewalked root-down24November2026 against current sibling
  gates; all existing book manifests, authors, first-publication years and hotlinked covers preserved. Structural approval
  phonemsg-01M860T8HJWF9ZGD1WCAATQSG0 on phonemsg-01M857SZS2Q64K2DG5ZXVB64PD.


  Prior ancestor rationale retained as historical context, not reverified source authority:

  # Acorna whole-fiction membership audit, 23 November 2026


  ## Result

  Repair the incomplete Acorna card from two to ten novels and move the one shared universe to Science fiction > Atemporal
  SF > Time travel fiction > Time machines > Time travel agency > Time agency thrillers. Drama falls 10 to 9. Time agency
  thrillers rises 9 to 10 and must freeze for its own membership audit and split. No structural change is made by this repair.


  ## Scope and authority

  The original normal-intake instruction is phonemsg-01M43MYMGAMQTNA3CY402KK7FB. The owner''s individual-fiction/shared-universe
  grant is phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX. Both originals personally recovered from the authenticated channel before
  mutation. The excluded-small-novella ruling phonemsg-01M850W64E1MFDAN0BQD84RRP9 does not exclude eligible missing novels.
  All ten are included. No short stories, excerpts, omnibuses, translations or reprints count as additional novels.


  ISFDB''s Acorna Universe and author bibliography, the publisher''s numbered series and Open Road''s full-series guide agree
  on one universe, original seven plus three Children novels. First two: McCaffrey and Margaret Ball. Remaining eight: McCaffrey
  and Elizabeth Ann Scarborough. Years: Acorna1997; Quest1998; People1999; World2000; Search2001; Rebels2003; Triumph2004;
  First Warning2005; Second Wave2006; Third Watch2007. Some paperback/ebook dates differ; they do not replace first publication.
  The existing card omitted Elizabeth Ann Scarborough and eight eligible novels.


  ## Whole narrative and root

  The foundling raised by three space miners grows into a rescuer who rediscovers the Linyaari, confronts slavers and the
  insectoid Khleevi, restores her devastated planet and searches for her missing lifemate Aari. The Children trilogy follows
  their daughters against an interstellar plague. Finished criticism describes the last three as a continuous story and identifies
  the plague as a life-form altered after Khleevi attack, spread by the Friends, rather than a supernatural curse.


  Fantasy is a serious rival, not rejected just because a publisher says SF. Unicorn horns heal and purify, species communicate
  telepathically, and the Friends shapeshift. Open Road calls it fantasy space opera and PW says SF/fantasy. The authorized
  Third Watch ch1-2 specifically frames the Linyaari and failed aquatic variants as creations of the alien Friends, a scientific
  experimental project. The unicorn Ancestors are creatures transported from their homeworld, with innate healing/purifying
  properties. No spell, supernatural deity, or actual magical cause is established in the sources read. TV Tropes independently
  describes apparent magic as alien biology/genetic engineering. This supports SF with moderate, not absolute, root confidence;
  a future primary passage proving literal magic would require rewalking Fantasy. Psychic traits alone are not assumed magic.


  Futurist space opera and Spaceship drama are strong surfaces, but eligible later novels contain substantial literal time
  travel. Historical/Modern/Futurist placement therefore loses the owner''s any-SF-time-travel rule. No novella exemption
  is involved. Parallel-world fiction is weaker than the explicit time-machine cause. Fabulation, reincarnation and New Weird
  do not describe this causal frame; Science fantasy''s hybrid label is insufficient evidence of actual magic.


  ## Time branch, all siblings

  - Time machines: explicit built apparatus, decisive.

  - Hard time travel: helix diagrams and operating constraints exist, but no rigorously developed physical theory governs
  the novels.

  - Ancestral time travel: genetic ancestry and family rescues are important, but kinship is not the targeting mechanism.
  The same apparatus moves researchers, invaders and other beings across eras.

  - Time loops: changed histories and causal ancestry, not repeated reliving of one span.

  - Mind over time: thoughts can control devices and messages cross time, but the apparatus causes the crossing.

  - Disorders: not an intrinsic medical condition.

  - Timeslips: deliberately built machines, not natural/unexplained shifts. Accidental malfunctions do not erase their machine
  cause.

  - Time distortion: not different regional rates of time.

  - Time crossroads: no atemporal meeting hub with keepers as story engine.

  - Time tonics: water conducts the device, not a taken/administered time-changing substance.

  - Time door: the subterranean pool is attached to built machinery, not an unexplained standing passage.


  ## Machine ownership and final leaf

  Authorized Triumph ch1-2 shows a shielded subterranean time laboratory, planetary personnel maps, controlled access, restoration
  teams and a time-space mechanism. Aari and Grimalkin use it to alter personal history; Acorna studies it while seeking Aari.
  Completed reviews confirm repeated journeys and the recovery of a portable device before enemies obtain it. Authorized Third
  Watch ch1-2 explicitly says the larger machine is now wrecked, identifies the wrist crono as the instrument of the twins''
  journey into the past before their birth, and describes the Friends'' mission for Grimalkin, confiscation of his crono,
  punishment, and experimental custodianship of the kidnapped twin.


  Homebrew > DIY rewind is the strongest rival because stolen/private portable cronos continue to work after the large machine
  is wrecked. Portability and unauthorized use are not the whole ownership test: the devices and controlled laboratory belong
  to the same surviving precursor research civilization, whose members commission missions, remove equipment, create species,
  and pursue the work. There is an organization behind the apparatus, not an independent lone-inventor/family machine. Removing
  that infrastructure and custodial group removes its institutional owner; the protagonists'' later theft/use does not retroactively
  make it homebrew. This is a moderate-confidence whole-fiction decision, not a claim that the twins are obedient agency operatives.
  Comparable accepted agency members include alien experimental administrators and stolen/rogue institutional technology.


  Classic time agencies explicitly covers pulp through 1990s institutional sensibility; this whole1997-2007 series has no
  classic patrol frame. Revival is the post2010 literary/awards sensibility, not a fit. Time agency thrillers currently includes
  labs and rival factions running the apparatus and chase, mission or conspiracy across time, without its old date bound.
  Aari''s rescue, Grimalkin''s deception, Khleevi threat and the twins'' plague-origin investigation make that the honest
  existing leaf. Light YA/family-adventure tone is a real register strain, retained openly. No ancestor or definition widened.
  Destination count was checked only after the walk: nine to ten requires a freeze there rather than evading the trigger.


  ## Sources read

  - https://isfdb.org/cgi-bin/pe.cgi?24134= : Acorna Universe scope, constituent novels/authors/first years. Bibliographic
  database, high confidence with publisher corroboration.

  - https://isfdb.org/cgi-bin/pe.cgi?24133= : original seven bibliography.

  - https://en.wikipedia.org/wiki/Anne_McCaffrey_bibliography : ten-novel cross-check, secondary bibliography.

  - https://theportalist.com/anne-mccaffrey-acorna-series : Open Road full10book guide, 18March2025; scope, narrative continuity.
  Publisher editorial, high scope confidence.

  - https://www.penguin.co.uk/series/ACORNA/the-acorna-series : numbered1,6,9,10, original contributors; publisher current
  rights selection is four available books, not a four-book complete universe.

  - https://www.everand.com/book/665663473/Acorna-s-Triumph : authorized public Book preview ch1-2, direct primary machinery,
  lab, research teams and temporal interventions. Read in browser, not a full-novel read.

  - https://www.everand.com/book/163636015/Third-Watch-Acorna-s-Children : authorized HarperCollins Book preview ch1-2, direct
  crono control, destroyed large machine, experimental species creation and institutional confiscation/mission. Read in browser.

  - https://www.kirkusreviews.com/book-reviews/anne-mccaffrey/acornas-rebels/ : completed professional criticism, buried time
  machine and ecological restoration. Its parenthetic2002Search date is paperback, not first2001.

  - https://www.sfrevu.com/ISSUES/2004/0403/Acorna%27s%20Triumph/Review.htm : completed2004 review, precursor time device
  used for restoration and search for Aari.

  - https://www.booksforabuck.com/sfpages/sf_04/acorna_triumph.html : completed2004 review, repeated space/time rescues.

  - https://www.publishersweekly.com/978-0-380-97900-4 : completed2004 review, Aari''s exile/change, Grimalkin, repeated time
  travel, SF/fantasy tonal caveat.

  - https://www.publishersweekly.com/978-0-06-052541-5 : completed2007review, twins travel time/space, plague linked to Friends
  and LordOdus.

  - http://wilddogsbookreviews.blogspot.com/2008/01/acornas-children-trilogy.html : finished trilogy reader, crono theft and
  whole ending/plague cause. Lower authority than primary preview and professional reviews, corroborating not sole proof.

  - https://tvtropes.org/pmwiki/pmwiki.php/Literature/AcornaSeries : reader reference, genetic-engineering/alien explanation;
  inconsistent magical shorthand elsewhere kept as caveat.


  ## Covers

  All ten English flat fronts pixel-inspected on23November2026. Preserve original Acorna front. Quest recovered from SFE''s
  cover gallery https://sf-encyclopedia.com/gallery.php?id=McCaffrey-AcQuest.jpg . People/World/Search/Rebels/Triumph fronts
  come from actual image elements on https://openroadmedia.com/contributor/elizabeth-a-scarborough . Children fronts from
  actual og:image metadata on their Penguin product pages. Every cover hotlinked, no cover bytes added to repository. Local
  private QA contact sheet and Quest preview only.


  ## Limits

  No full ten-novel read claimed. Primary authorized openings plus scope bibliography and multiple completed reviews support
  the decision. Ownership and SF/fantasy boundary remain moderate confidence for the reasons above. No new genre and no split
  approved or executed here.


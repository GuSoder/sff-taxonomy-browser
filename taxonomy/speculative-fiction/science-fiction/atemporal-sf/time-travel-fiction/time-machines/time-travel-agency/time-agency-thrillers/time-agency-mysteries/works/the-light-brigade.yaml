placement_rationale: '# Temporal ancestor correction,26November2026

  Move Super space soldier > Atemporal SF > Time travel fiction > Time machines > Time travel agency > Time agency thrillers
  > Time agency mysteries. Root SF first: Earth/Mars corporate future, technological teleporting, not independent fantasy
  realm, magic or Fabulation merely because creator discusses constructed social narratives. Actual time jumps confirmed by
  creator''s mathematical chronology and PW/Kirkus/Verge completed reviews. Not combat madness or nonchronological chapters
  only. Any included actual temporal travel beats Futurist military theme. One2019novel.

  Cause is military corporate teleport apparatus, soldiers broken into light and reassembled for missions. Remove owning corporate
  armies and no independent apparatus owner remains. Accidentally out-of-order deployments do not turn a built company system
  into intrinsic medical disorder, mind-over-time psychic travel, natural timeslip, tonic or standing door. Internally consistent
  graph is chronology, not alone rigorous physical Hard time travel mechanism. No repeated closed-span life loop as main shape;
  alternating timeline possibilities do not make a multiverse destination more specific than temporal corporate apparatus.

  Agency thriller''s widened content gate, not obsolete date bound:2019does not automatically mean literary ministry/epistolary
  revival. Dietz uncovers who caused Blink, manipulated war briefings and concealed corporate conflict. Inquiry into false
  enemy and owners'' time-war control carries violence and eventual resistance, not a single pursuit quarry or scheduled historical
  rescue expedition. Thus Mysteries strongest, moderate leaf wobble because soldier missions fill much of reading. Strong
  supersoldier/military theme survives as rival but cannot skip temporal ancestor. Definition still mentions broken-into-light
  example historically, not edited without approval.

  Sources read: https://www.kameronhurley.com/writing/light-brigade/ ; https://www.barnesandnoble.com/blog/stopping-the-cycle-kameron-hurley-on-the-narrative-intricacies-and-fiery-politics-of-the-light-brigade
  ; https://www.publishersweekly.com/9781481447966 ; https://www.kirkusreviews.com/book-reviews/kameron-hurley/the-light-brigade/
  ; https://www.theverge.com/2019/3/28/18276076/kameron-hurley-the-light-brigade-military-science-fiction-book-review . High
  temporal correction, moderate specific leaf, no fullnovel read claimed.



  Former rationale:

  Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Military science fiction.
  Simon & Schuster and Angry Robot explicitly call it future-war military SF: corporate infantry are broken into light for
  interplanetary combat drops, while a grunt experiences missions out of sequence and uncovers the war’s false official story.'

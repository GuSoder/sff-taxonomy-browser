placement_status: accepted
placement_rationale: 'Frozen Future war audit2026-11-05: whole Terminator prose universe rewalked, not just Allston''s2.
  Original placement read2029 military stage and missed explicit psychic time communication in Terminator Dreams;
  publisher asks whether present/future Danny''s mental wire can undo Judgment Day, PW confirms both-era plots.
  Any SF time travel/communication rule requires Atemporal regardless of future-war surface. Whole shared universe
  = one fiction across authors and divergent licensed continuations; ISFDB Terminator Universe groups17 distinct
  full novels, including2 genuinely separate novelizations of first film (Hutson1984, Frakes/Wisher1985), not duplicate
  editions. Restored all17, no scripts, deleted scenes, comic books, omnibus, picture adaptations, excerpts or translations.
  Alternate licensed continuities are disclosed, not falsely claimed one seamless timeline. Primary/source audit
  by constituent run: original two Terminator adaptations send a future assassin and protector to Sarah; Judgment
  Day sends two machines to change John''s fate. Stirling T2 whole3 follows Infiltrator Serena''s attack and Cyberdyne
  regeneration, Rising Storm''s injury/recruitment and Skynet awakening, then Future War''s nuclear war/resistance
  and sending assassins/protectors back; author separate synopses, bibliography and independent detailed reviews
  read, not collapsed to1. Blackford whole3 Dark Futures/An Evil Hour/Times of Trouble brings T-XA and human Specialists
  across timelines, counter-cyborg protection and a concluding war through time/dimensions with two worlds at stake;
  OverDrive publisher Dark Futures, original back-cover text for2/3 and independent fan summary checked. Tiedemann
  Hour of Wolf''s separate2007 plot targets an unsuspecting future ally, rather than merely repeating Blackford.
  Hagberg Rise Machines novelization, Allston Dreams/Hunt are the T3 run; Dreams spans Danny''s eras, Hunt is2029
  Skynet drug/VR interrogation of Paul Keeley and hunt for T-X. Salvation4 individually: Zahn From Ashes prequel
  follows Kyle/Star, a Marine settlement and Connor''s assault; Foster film novelization follows John/Kyle fighting
  Skynet; Cox Cold War alternates2003 submarine retaliation and2018 Alaska resistance; Zahn Trial Fire follows VLA
  ruins, a cable and untouched village/infiltration. Publisher pages and independent AVP book-by-book review read.
  Source dates: author bibliography confirms Stirling2001/2002/2003 versus later paperback dates2003/2004 in individual
  pages/Wikipedia; ISFDB agrees. Hutson earliest ISFDB1984 despite fan edition table1985, retained1984 with uncertainty
  noted. Walk Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Time machines > Time
  travel agency > Time agency thrillers. SF engineered AI/cyborgs and time displacement, not supernatural. Any-time
  rule wins over Modern-day chase or Futurist Earth war. Built institutional Time Displacement Equipment, run by
  Skynet/Resistance factions, organizes the universe''s repeated missions to kill/protect/change history; remove
  those organizations and no owner of machines remains. Time agency by owner, not a friendly government bureau or
  professional time patrol requirement. Thriller register of assassin chases, infiltration/conspiracy, future-war
  missions and dangerous apparatus rather than classic patrol or post2010 literary/romantic revival. Major wobble:
  Dreams itself is mental communication, so would individually favor Mind over time, and Salvation4 largely lack
  new on-page travel. Whole shared-universe instruction keeps them together; predominant institutional apparatus/chase
  mission defeats isolating2 under Mind over time or war. Blackford''s parallel realities overlap Multiverse war
  but time travel present prevents leaving Time travel fiction. Hard time travel fails rigorous physically developed
  mechanism across17; time loops/ancestral/tonics/doors/disorder fail primary cause, no private inventor for DIY.
  Existing Allston fiction renamed Terminator, same stable id terminator-3-novels retained, universe begins1984
  and ends2010 currently verified; authors expanded. All17 distinct English print jacket fronts inspected/localized.
  Rejected title-page scan for Judgment Day, physical angled book for Frakes, German Black Horizon cover for Trial
  Fire and publisher placeholder. Frakes clean flat English scan and Judgment English flat jacket from fan image,
  Trial Fire publisher English jacket replace those. Future war8->7, Time agency thrillers6->7. No structural definition
  altered and no split necessary on this corrected membership.'

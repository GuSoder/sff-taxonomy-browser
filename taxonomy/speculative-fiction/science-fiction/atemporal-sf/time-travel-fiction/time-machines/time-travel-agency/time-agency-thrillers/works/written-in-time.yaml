placement_rationale: 'Root-down: Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Time
  machines > Time travel agency > Time agency thrillers. One standalone novel, Written in Time2010, Jerry and Sharon
  Ahern. Publisher and contemporary Locus SF directory support standalone corpus; no connected sequel verified.
  Jack and Ellen Naile recognize their family in historical Nevada photographs, prepare for an impending journey,
  and are carried in a helicopter to the1890s. Natural-timeslip/Timetribe was a serious initial candidate, overturned
  by legal Baen sample chapter4: Jane Rogers and Peggy Greer''s generator-powered electrical transmission experiment
  coincides with the helicopter''s disappearance amid ball lightning. Chapter7 explicitly links the apparatus to
  the event, then has Clarence and Peggy obtain virtually unlimited corporate Horizon resources to recreate it.
  Full-novel Fortier review confirms Clarence successfully duplicates transfer, a rival businesswoman learns of
  it and attempts to invade the past to control history; the Nailes recruit Theodore Roosevelt against her. Independent
  LibraryThing JohnFair review corroborates the company boss''s weapons-dealing to a would-be world-dominating empire.
  The wholefiction therefore includes institutional replication and rival temporal factions, not just family settlement
  following the first accident. Time machines owner test: corporate research apparatus and funding, not a private
  family''s garage device; take away the organizations and the continuing apparatus/temporal conflict loses its
  owner. Homebrew/DIY rewind is a real resemblance because a relative initiates rescue, but family motivation does
  not make corporate apparatus privately owned. Classic time agencies loses to2010modern corporate action-thriller
  sensibility rather than classic patrol wave; Revival loses to armed adventure and history-changing commercial
  conflict rather than literary/emotional-core agency fiction. Existing thriller definition already widened beyond
  date boundary. Ancestral time travel is a genuine rival: descendants fund travel and inherited foreknowledge generates
  wealth, but ancestry does not select the1890s destination or define its threat; deliberate corporate travel and
  intervention organize the latter plot. Time loops also genuinely resembles chapter7''s speculation about prior
  iterations and changing Holocaust totals; no conscious repeated reliving demonstrated, and reviewers center settlement
  plus factional intervention, not repeated lived span. Hard time travel loses because speculative ball-lightning/laser
  explanation is not evidence of rigorously developed physics. Timeslips and Time door fail built apparatus and
  deliberate duplication; no standing unexplained path. No mind/consciousness-only, medical disorder, tonic, differential
  aging, outside-time hub or stationary timebleed engine established. Fantasy root loses to explicit technological
  time transfer in our Earth universe, no sourced magic or invented fantasy realm. HistoricalSF/Alternate history
  and Modern-daySF are setting resemblances, superseded by mandatory Atemporal placement for any SF time travel;
  Futurist space/alien branches lack basis. Moderate-high fit from legal seven-chapter sample and two independent
  whole-novel reviews, not a complete novel read. No seed, split or definition change;5->6.'

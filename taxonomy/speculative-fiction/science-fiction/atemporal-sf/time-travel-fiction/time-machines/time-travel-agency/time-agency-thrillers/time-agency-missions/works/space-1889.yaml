  Prior ancestor rationale retained as historical context, not reverified source authority:

  # Space: 1889 whole-fiction membership audit

  23 November 2026


  ## Result

  The Forever Engine is not an isolated fiction. Its creator explicitly places it in Space: 1889, with events and characters
  recurring in Space: 1889 & Beyond. Restore six missing novels and keep the seven-novel shared fiction together. This changes
  book completeness, not the number of fictions in Time agency thrillers.


  ## Included novels

  | Novel | First publication | Author |

  |---|---:|---|

  | The Ghosts of Mercury | 2011 | Mark Michalowski |

  | Dark Side of Luna | 2012 | J. T. Wilson and Frank Chadwick |

  | Conspiracy of Silence | 2012 | Andy Frankham-Allen and Frank Chadwick |

  | The Forever Engine | 2014 | Frank Chadwick |

  | Horizons of Deceit, Book I | 2014 | Jonathan Cooper |

  | Horizons of Deceit, Book II | 2014 | Andy Frankham-Allen and Jonathan Cooper |

  | The Draco Eye | 2014 | Sharon Bidwell |


  Final publication form matters. The Ghosts of Mercury started as a novella commission, but its author says its final edited
  text is about 57,000 words and was promoted to novel status. The range editor explicitly calls the published Horizons II
  and forthcoming Draco Eye novels. Creator/publisher material calls Horizons Cooper''s first full-length SF work. Dark Side
  and Conspiracy are explicitly novels in the creator''s material, corroborated by publication catalogs. All seven have distinct
  English fronts.


  ## Exclusions and contradictions

  The other eight episodes are shorter fiction, not eight more missing novels: Journey to the Heart of Luna, Vandals on Venus,
  Abattoir in the Aether, A Prince of Mars, Mundus Cerialis, Leviathans of the Clouds, A Fistful of Dust and The Forever Journey.
  Publication plans alone are insufficient proof, as Ghosts demonstrates. Prince has the author''s explicit novella description;
  Mundus has the short-form replacement history and 78-page catalog/review; Leviathans is SHORTFICTION in ISFDB; Dust is 102
  pages and Forever Journey 73. The initial two episodes retain the commissioned short-form status with no final expansion
  evidence found.


  Abattoir is a real source conflict: ISFDB labels it NOVEL, and one completed review uses novel, but Frank Chadwick calls
  that specific story a novella in his December 18, 2011 comment on its final-cover announcement. The completed Future Fire
  review also specifically calls it a novella. The creator''s title-specific description governs over the database label and
  generic review usage. No arbitrary page-count cutoff was imposed.


  Four further season-three titles were planned but not published. The editor''s December 2014 cancellation account and the
  fourteen-episode OverDrive catalog agree on the two published season-three books. The roleplaying sourcebooks, game adventures,
  audio dramas and the short Murder on Hochflieger Ost are not additional prose novels.


  ## Root-down walk and causal placement

  1. Speculative fiction: alternate physical laws, alien civilizations and temporal machinery are literal premises.

  2. Science fiction rather than Fantasy: the setting is an alternate Earth and Solar System, not an invented fantasy world
  with an inferred Earth origin. Publisher/creator descriptions attribute its wonders to invented science, aether propulsion,
  antigravity liftwood, alien life and research. The Ghosts title is not evidence of supernatural spirits: available text
  passages explain Hermes and the apparent ghosts through crystalline electronic/optical minds and copied personalities. The
  Draco Eye presents its Jovian dragon as an extraterrestrial creature and an investigation into possible artificial design,
  not established sorcery. No confirmed literal magic was found. This is a source-based classification, not a claim to have
  read every novel in full.

  3. Atemporal SF, not Historical SF: the included full novel The Forever Engine sends Fargo from 2018 into an alternate 1888.
  The later Victorian planetary adventures do not erase that included-novel temporal crossing. This is not a short-story override.

  4. Time travel fiction: actual temporal transit, not merely imagined alternate history.

  5. Time machines: Baen''s authorized chapter one names WHECOL, the Wessex High Energy Collider, and describes repeated accelerator
  tests retrieving artifacts from other pasts. Fargo''s transit follows the same apparatus experiment. Not a natural slip,
  inherited power or mind-only traversal.

  6. Time travel agency: the active machine is controlled by a secret military research project. Armed guards secure the laboratory;
  SAS Major Llewellyn directs access and has Fargo formally recalled to active service and assigned to his detachment. This
  is not a private home inventor. The later mission is to stop Tesla''s universe-threatening Forever Engine. There is no claim
  that every novel concerns a recurring time patrol.

  7. Time agency thrillers: institutional mission, espionage, pursuit, sabotage and world-threatening machinery are compatible
  with this leaf''s widened action register. The restored books add Victorian interplanetary adventure, scientific exploration
  and political conspiracies. This is a genuine whole-fiction straddle, recorded rather than used to split the universe or
  ignore its time-travel novel. Assess these concrete contents when deriving the impending split.


  Confidence: high shared-world identity and included novel list, moderate-to-high root/mechanism placement. Lower-confidence
  text-mirror checks support the non-supernatural Ghosts mechanism but are not claimed as authenticated editions. Publisher
  descriptions and independent criticism independently support the SF reading.



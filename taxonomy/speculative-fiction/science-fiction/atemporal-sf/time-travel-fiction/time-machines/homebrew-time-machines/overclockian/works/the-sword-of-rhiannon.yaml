id: the-sword-of-rhiannon
title: Stark and the Star Kings
authors:
- Leigh Brackett
- Edmond Hamilton
first_published: 1944
canonical_genre: overclockian
placement_status: accepted
placement_rationale: 'Bounded Classic planetary romance repair, 2026-11-05. Whole connected fiction, not The Sword
  of Rhiannon alone. Stark and the Star Kings is the authors'' explicit crossover title, used here as the fiction
  label, not as a claim that its collection is a novel. Brackett''s Solar System/Mars, Eric John Stark and Skaith
  connect to Hamilton''s Star Kings because the authorized crossover sends Stark bodily 200,000 years into his own
  universe''s future. Paizo connects Sword''s Mars to Sinharat and Stark''s Mars to Skaith; Shadow shares that Mars
  and the named Banning Shocker; the Brackett Solar System bibliography includes Alpha Centauri or Die! An omnibus
  by itself would not prove continuity.


  Ten completed novels: Shadow over Mars (1944 serial, 1951 book); The Star Kings (1947 magazine novel, 1949 book);
  The Sword of Rhiannon (1949 serial, 1953 book); Alpha Centauri or Die! (1963 fixup); The Secret of Sinharat and
  People of the Talisman (expanded 1964 novels, not duplicate counts for their shorter 1949/1951 originals); Return
  to the Stars (1968 French first publication, 1969 English fixup); The Ginger Star (1974); The Hounds of Skaith
  (1974); The Reavers of Skaith (1976). The crossover, Enchantress of Venus, The Sorcerer of Rhiannon and other
  shorter Solar System stories support continuity but are not separate book rows. The Last of the Star Kings (2014)
  collects The Star Hunter and The Tattooed Man, both classified as novellas by the specialist bibliography despite
  pulp-publisher ''complete novel'' wording. Collections, omnibuses and shorter fiction are excluded under the existing
  scope rule.


  Each novel''s own engine checked, not inferred from continuity. Shadow: Rick Urquart''s slave revolt against the
  Terran Exploitations Company and contest over Martian colonial rule. Sword: Carse bodily hurled to ancient sea-girt
  Mars with Rhiannon''s consciousness riding him, war against Sark and its Dhuvian allies, return with Ywain. Alpha:
  Kirby and telepathic Shari escape the controlled Solar System in a secret freighter, confront robot ships and
  survive as colonists at Alpha Centauri. Sinharat: Stark infiltrates Kynon''s Drylands revolt as a mercenary and
  uncovers the Rama life-transfer secret. Talisman: return of a stolen artifact to Kushat, Ciaran''s siege, flight
  through the pass to the alien People. Ginger: rescue of Simon Ashton from Skaith''s Lords Protector, Northhound
  telepathy and emigration struggle. Hounds: Stark and Ashton free Gerrith and Halk, enlist desert tribes and Fallarin,
  relieve Irnan and fight for the right to leave. Reavers: Penkawr-Che betrays the delegation for ransom and plunder,
  a resistance coalition retakes Ged Darod, the Galactic Union offers escape. Star Kings: Gordon''s apparatus-induced
  mind exchange with Zarth Arn, galactic intrigue and Disruptor war. Return: Gordon''s bodily machine trip to the
  future, Lianna, alliance with Shorr Kan and Magellanic invasion. Publisher descriptions, own-volume reviews and
  primary texts read.


  Full actual-tree walk: Speculative fiction > Science fiction > Atemporal SF > Time travel fiction > Time machines
  > Homebrew time machines > Overclockian. Root first: Rhiannon and the Quiru are ancient scientists and prison
  builders, not literal gods. The authors explicitly call Aarl''s helix lost Martian science amplifying mental power,
  not witchcraft. Skaith''s 1974/1976 novels cannot borrow a new Old Mars magic exception: Reavers'' own background
  explains the Fallarin and Northhounds through mutation and telepathy. More importantly, chapter 23 explicitly
  describes the Corn King''s killing cold as the power of linked minds, broken when two priests dodge a boulder.
  The review''s ''summon the Cold Goddess'' shorthand is a religious description of a demonstrated psi effect, not
  proof of a literal deity. Precognition and telepathy are pulp psi; no rule was widened to call working magic science.


  Historical, Modern day and Futurist lose the mandatory any-SF-time-travel gate (phonemsg-01M36M8K4DB3B8Y8T1GAQ6ARF0).
  Classic planetary romance is a substantial surface, but it cannot precede actual bodily and mental travel across
  eras. Other Atemporal children fail: no metafictional engine, New Weird mode, repeated lives or alternate-Earth
  crossover. Time travel children: Mind over time loses to built apparatus, even where minds are exchanged; Hard
  time travel lacks rigorous physics; Ancestral lacks kinship destinations; Loops lacks repetition; Disorders lacks
  an intrinsic condition; Distortion lacks unequal clock rates; Crossroads lacks a hub; Tonics lacks a substance;
  Time door lacks an unexplained standing passage; Timeslips lacks a natural or unexplained cause. The Quiru explicitly
  built a way and a crystal-coffin prison, Aarl uses a built helix, Zarth and Vel Quen invent, build and test their
  apparatus.


  Owner test applied to the whole fiction. The Quiru prison is a substantial organizational strand, not falsely
  relabeled private. Remove that organization and Aarl''s private helix and Zarth/Vel Quen''s private apparatus
  still have owners. Original Star Kings chapter 3: secret experiments in a secluded Himalayan tower, hidden from
  Zarth''s father Arn Abbas, who would forbid the risk. The prince''s title does not turn these private experiments
  into an Imperial time agency. Thus the written take-away-the-organization test passes Homebrew; no new requirement
  of uniform ownership across all machines was invented. Overclockian covers the whole forward/far-era travel: Stark
  goes 200,000 years ahead, Gordon exchanges minds with that future and later travels there bodily. DIY rewind is
  a strong losing route for historian Zarth''s reverse trip and Carse''s ancient Mars. That mixed direction and
  ownership is recorded as a real wobble, not erased. This does not claim that all ten novels have time travel plots.
  One shared fiction stays together under phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX. No seed, definition change or unrelated
  sweep. Overclockian 5->6, Classic 7->6.


  Ten distinct English print fronts inspected as actual pixels and localized: eight Brackett fronts from the SFE
  gallery and two Hamilton fronts from Richard Simms'' bibliography. Reavers'' gallery caption incorrectly says
  1974; the original copyright and first-edition statement say August 1976, corroborated by Locus/SFE bibliography.
  Return displays the English Lancer 1969 front with work-year 1968 (French first); Star Kings displays the Fell
  1949 front with work-year 1947. No ebook, audio, title-page or omnibus fronts substituted.'

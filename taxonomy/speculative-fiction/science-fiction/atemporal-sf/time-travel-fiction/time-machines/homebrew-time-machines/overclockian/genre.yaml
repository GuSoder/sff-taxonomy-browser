- the-time-machine
- the-time-ships
- the-silver-wind
- doctor-who-shada
ruling: 'Split of Homebrew time machines at ten cards (Behold the Man and Galileo''s Dream held at the gate), approved by
  the curator''s "Approved" (2026-10-12 2:05:09 PM CEST, phonemsg-01M4R0186WYG1DYHRX227ZFCZ1, on his own names DIY rewind
  / Overclockian), after the intake''s "Approve split?" question; names are the curator''s own. Axis: where the private traveler
  goes, back into the past (DIY rewind) or forward and far across time (Overclockian). Softness: Galileo''s Dream passes the
  owner test by exclusion; Dirk Gently, Shada and Time Enough for Love are loose on direction; The Silver Wind is parallel-worlds.
  Cousin: Time travel agency.'

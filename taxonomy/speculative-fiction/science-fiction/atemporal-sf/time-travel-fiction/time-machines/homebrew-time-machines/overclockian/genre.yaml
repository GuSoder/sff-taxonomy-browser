definition: 'Homebrew time machines whose private traveler goes forward or far across time: a built device carries the traveler
  to the future, the end of time or other eras and worlds. Not DIY rewind (there the private machine goes back into the past),
  not Time travel agency (an organization owns the machine), not Timeslips (no built device).'
status: accepted

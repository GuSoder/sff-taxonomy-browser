canonical_genre: diy-rewind
placement_status: accepted
placement_rationale: 'Bounded leaf repair 2026-11-05: complete Michael Kane trilogy, Warriors of Mars / City of
  the Beast1965, Blades of Mars / Lord of the Spiders1965, Barbarians of Mars / Masters of the Pit1965. Speculative
  fiction > Science fiction > Atemporal SF > Time travel fiction > Time machines > Homebrew time machines > DIY
  rewind. Publisher Hachette explicitly says across space and time, not just adjacent planet. Own first-volume review
  confirms experimental matter transmitter intended for laboratory teleportation sends Kane millions of years into
  Martian past. Whole3 Allen Stroud review and chapter-by-chapter Moorcock reader synopsis independently ground
  all3: first Karnala/Argzoon/Shizala struggle and forced laboratory recall; second personally rebuilt transmitter
  takes him to different Mars region/date, exiled Hool Haji''s Mendishar struggle and spider city, finally rejoins
  Shizala; third airship voyage with Hool Haji to Cend-Amrid and plague threat. The first machine is government/employer
  laboratory (strong Time travel agency losing route), but after recall Kane and private chronicler Bradbury build
  the second device together and use it at Stonehenge to return to ancient Mars. Owner test whole fiction: remove
  government and inventor/chronicler still own and use machine; no time-policing organization remains essential.
  Homebrew is actual later ownership, not a claim that the first lab had no employer. Past direction controls DIY
  rewind rather than future-directed Overclockian. Mechanism a built device even though initial accident; not Timestranded/Timetide
  natural unexplained crossings, not Time door standing passage, not mere mind perception/ancestral recall, loop/disorder/tonic.
  Actual crossing of eras takes priority over Classic planetary romance despite whole3 Burroughs pastiche/sword-and-planet
  surface, under owner any-SF-time-travel rule phonemsg-01M36M8K4DB3B8Y8T1GAQ6ARF0. Real Mars/technological device
  and weapons/learning machines rather than literal occult effect preserve SF root. Whole shared Michael Kane fiction
  stays together, not separate per initial/private machines. Eternal Champion collection umbrella is not alone proof
  that all Moorcock novels share one continuous world; no unrelated universe sweep. Source distinction explicit:
  machine-rebuild fact independently reader-synopsis grounded, not attested by abbreviated publisher copy alone.
  Moorcography bibliographies establish all3 first1965, Lancer1966English print fronts as by Edward P Bradbury,
  retitles not extra books; all3 jacket pixels inspected/localized. Replaces erroneous single omnibus book with3novels.
  No gate change; DIY rewind8->9.'

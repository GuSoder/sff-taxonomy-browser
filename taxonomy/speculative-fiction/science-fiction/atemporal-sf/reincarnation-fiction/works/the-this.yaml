id: the-this
title: The This
authors:
- Adam Roberts
first_published: 2022
canonical_genre: reincarnation-fiction
placement_status: accepted
placement_rationale: 'Root-down rewalk, 25 November 2026: Speculative fiction > Science fiction > Atemporal SF > Reincarnation
  fiction. Complete reviews by Ian Mond (Locus, https://locusmag.com/review/ian-mond-reviews-the-this-by-adam-roberts/), Tobias
  Carroll (Reactor, https://reactormag.com/book-reviews-the-this-adam-roberts/), Ian Hunter (https://www.concatenation.org/frev/roberts-review-the-this.html)
  and Ian Sales (https://iansales.com/2025/06/14/the-this-adam-roberts/) establish that this is not only a future hive-mind
  implant novel. The opening and final Bardo chapters frame a consciousness reincarnating across lives, people and eras, becoming
  universal consciousness; Rich and Adan plots connect through this frame. A later character also reaches the far distant
  future. Earth and future humanity are explicit. No spell-magic is established; the metaphysics is speculative Hegelian consciousness
  with a technological-singularity antagonist. The explicitly available Reincarnation fiction gate names this linking recurrence
  across lifetimes; it is not necessary to invent magic or force a stable future era. Historical, Modern day and Futurist
  each fail the complete temporally crossing frame, even though the two principal action strands are future-set. Rewired minds
  describes the somatic implant and hive collective but fails the Atemporal ancestor test. Time travel fiction is a strong
  rival because an eventual future encounter occurs, but recurrence of the soul/consciousness across lives is the stated framing
  linkage, not a built time machine, drug or voluntary psychic expedition. Time-spanning minds remains a boundary rival; the
  repeated lives and Bardo make reincarnation more specific than one expanded lifetime. Fabulation was tested: formal experimentation
  and Hegelian metaphysics do not by themselves establish text authoring reality, narrative revision or an unstable invented
  document. The Thing Itself is called a thematic sequel or philosophical companion, not a verified shared continuity; no
  consolidation inferred. Whole-fiction correction discovered during mandatory Rewired ten-card audit, individual judgment
  covered by phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX. Wobble: the technological future plots occupy much of the novel; the cosmological
  recurrence and cross-time resolution decide the ancestor and linking-device leaf.'

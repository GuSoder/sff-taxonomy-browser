  of the warrior, one incarnation of a figure reborn across the multiverse to restore the balance between Law and Chaos. Walk:
  SF/Fantasy first: the premise is the recurring soul and the machinery is destiny, not magic spells or a device; Atemporal
  > Reincarnation fiction (a soul recurring across lifetimes, linking the eras). Tried Otherworld summonings (Fantasy; the
  world is a far Earth, not a hidden world behind ours) and Warrior hero (the book is about being re-lived, not the warrior''s
  path). Sources: Wikipedia; not read. Alternative leaf if he doesn''t like it: Otherworld summonings.'

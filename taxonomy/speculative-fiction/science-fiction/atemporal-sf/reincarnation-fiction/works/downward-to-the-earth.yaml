placement_rationale: >-
  SFE makes this a notable case of alien biology permitting reincarnation within an explicitly religious frame. Open Road centers Gundersen's return to the former colony and his journey to witness and undergo the nildoror's sacred rebirth. The rebirth rite is the story's linking device, making Reincarnation fiction more specific than Anthropological science fiction.

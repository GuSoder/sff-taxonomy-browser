placement_rationale: '# Invasive Species / Slavemakers - seed walk, 2026-11-06


  One shared fiction, two novels: Invasive Species (2013) and Slavemakers (2015). Publisher pages, the author''s SFFWorld
  interview and two current bibliographies agree. The author''s old idea for a third novel is not evidence of publication.
  No current duplicate card found. Propose Post-infestation survival under Post-holocaust survival, with this one verified
  fiction / two novels, no existing moves. No mutation has been made.


  ## Every novel and mechanism

  Invasive Species is the last weeks of civilization: biologist Trey follows an evolved Earth-native parasitoid wasp from
  Senegal into a global ecological/biological catastrophe. Official copy calls it a newly evolved predator. Complete BiblioSanctum
  and Matt Bille reviews describe larvae implanted in hosts, venom/neurotoxins, distributed hive intelligence, transport-assisted
  spread and human scientific/political failure. It is not an alien organism and not an unexplained magical curse.

  Slavemakers is twenty years later, continuing familiar characters and taking Refugia''s surviving community out by ship
  into an Earth whose ecology is recovering while humanity is nearly gone. Aisha Rose''s immunity, Kait''s choices and human
  breeding/slave colonies under wasp control are central. Fresh Fiction and Gizmo completed reviews establish the altered-host/slavery
  strand rather than just jacket atmosphere. The author''s Page 69 essay expressly says the planet is NOT barren or blasted
  and humans have lost dominance.

  Disease uncertainty: one review loosely calls it ''Thieves virus'', and the author discusses actual wasps using viruses
  as one means of control. That does not establish epidemic disease as this fiction''s defining cause. His own interview explicitly
  distinguishes his apocalypse from a rampant global disease epidemic. The read publisher/author/complete reviews support
  a wasp invasion and enduring parasitism, not a pathogen-led epidemic. Do not transform ''vaccine'' into proof of a disease
  cause, nor say the fictional mechanism could never employ a virus.


  ## Full root-down walk

  Speculative fiction -> Science fiction passes: evolved biological predators and extrapolated parasitic control, no literal
  magic evidence. Fantasy fails, despite a secondary retail paranormal tag.

  Science fiction''s Atemporal fails: no time travel, no unplaceable realm or parallel-world engine; twenty years passing
  is chronology, not travel. Historical fails: present-day ecological catastrophe and its near-future survivors, not a retro-era
  celebration.

  Modern day -> Apocalyptic fiction honestly takes novel 1 but not the complete pair''s established living aftermath. Its
  cause siblings fail: no cosmic, geological, chemical or climate catastrophe as defining mechanism; habitat destruction unleashes
  the wasps, not climate as catastrophe. Unknown catastrophe fails because the wasps are known. Pandemic is a substantial
  near-miss, but disease-as-defining-cause not proved. Zombie apocalypse''s virus/bacteria/fungus/mystery leaves do not honestly
  describe known parasitoid wasps and venom, even though human victims are controlled. Die-off requires Pandemic; not simply
  any mass death.

  Modern day -> Bioengineering fails deliberate gene/nano intervention. Technothriller is not technology made or misused.
  Soft SF -> Pulp -> Creature feature takes the surface insect menace, but the current Pulp ancestor requires no scientific
  pretence; creator and complete reviews emphasize earnest evolutionary/parasitic explanation. Cryptid horror requires an
  alleged hidden/folkloric creature as biological evidence, not this extrapolated newly evolved parasitoid. Social SF or social
  dystopia would miss the actual catastrophe/aftermath engine. Alien invasion fails Earth-native wasps. First contact and
  humorous SF fail.

  Futurist -> Future of Earth passes on the whole fiction: human society destroyed and its next generation twenty years later.
  Hard SF is not the governing reading experience of scientific constraints/problem solving; Spacefaring and Alien fiction
  fail Earth setting and terrestrial animals.

  Future of Earth -> Dystopian fiction -> Post-holocaust survival passes: the living aftermath with survivors who remember
  the fall, their refuge and journey through its consequences. Future war is not a technologically transformed war; Techno
  fiction is not technology remaking society; Future societies'' sustained social-history engine misses catastrophe survival;
  Utopian fails tone and subject.

  Dystopian children: Totalitarian and Social dystopia are substantial analogies to enslavement, but not a designed human
  regime or sick functioning society as the central whole-fiction mode. Ruined Earth''s farther-future inherited ruins are
  wrong for these direct survivors; Dying Earth''s terminal sun is absent.

  Post-holocaust children: Post-nuclear fails no nuclear cause. Post-alien fails native Earth organisms. Terminal wastelands
  requires mixed/unspecified cause, and an environmentally devastated landscape; here the defining cause is identified and
  the ecology recovers. Post-pandemic fails disease-as-defining-cause evidence above; its Mutants child is a tempting host-transformation
  match but cannot bypass that ancestor. Recovery is also wrong as a fit by mere survivor settlement. No existing gate changed
  or proposed to change.


  ## Seed

  Post-infestation survival: Post-holocaust survival in the living aftermath of Earth-native organisms spreading beyond their
  former range or control and breaking human civilization: invasive plants, animals and other proliferating life occupy the
  world people must survive in. The expanding organism or infestation defines the aftermath, rather than epidemic disease.
  The creatures may prey on, parasitize or control people; the remaining environment may recover or flourish rather than becoming
  a barren wasteland.

  Boundaries: not Post-pandemic survival (disease defines the aftermath), Post-nuclear survival (nuclear catastrophe), Post-alien
  devastation (extraterrestrial invasion/intervention), or Terminal wastelands (mixed/unspecified causes and landscape as
  defining condition). Not Ruined Earth (farther-future inherited ruin). Not Creature feature (monster attack as a pulp adventure)
  or Apocalyptic fiction (the catastrophe while unfolding). A whole connected fiction may include its originating collapse
  novel without being split by volume.

  Parent Post-holocaust survival has four children; becomes five, no bundle. Existing parent already partitions by defining
  cause, so no widening needed.

  Name is a descriptive coinage on existing Post-pandemic/Post-nuclear sibling pattern, not an established literary subgenre.
  Exact full-name scans found scientific tree-survival usage, no exact fiction/game/trademark hit. ''Post-Infestation'' alone
  is an existing C. A. Gleason short-work title, disclosed, not an exact full-name collision or proof of trademark. Weakness:
  infestation evokes insects most quickly; definition deliberately includes invasive plants and other native life. Post-ecological
  collapse would be broader but could imply dying ecosystems, contrary to this seed. Post-biotic takeover sounds technical
  and could imply aliens; rejected.


  ## Ceiling

  One verified fiction, two novels; no existing moves claimed. The Green Brain is the closest insect-intelligence look-alike,
  but its official synopsis is a contest over clearing Mato Grosso while civilization functions, not living after civilization''s
  fall. The Day of the Triffids combines the wasps'' literary inspiration with hostile plants, but its existing record''s
  unexplained mass blindness is a separate defining catastrophe; do not move it on plant furniture. Moths/Toxxic and 7th Sigma
  surfaced as possible external look-alikes only, not verified whole-fiction members and not claimed in the ceiling. No future
  repair batch hidden in this seed.


  ## Proposed compact serve

  Approve seed?:

  Post-holocaust survival

  - Post-pandemic survival

  - Post-nuclear survival

  - Terminal wastelands

  - Post-alien devastation

  - Seed: Post-infestation survival


  Hold all intake once served. No new genre, illustration, card, or public change until owner approval.

  '

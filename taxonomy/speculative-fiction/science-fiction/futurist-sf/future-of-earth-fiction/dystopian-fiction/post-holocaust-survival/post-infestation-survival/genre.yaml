definition: 'Post-holocaust survival in the living aftermath of Earth-native organisms spreading beyond their former range
  or control and breaking human civilization: invasive plants, animals and other proliferating life occupy the world people
  must survive in. The expanding organism or infestation defines the aftermath, rather than epidemic disease. The creatures
  may prey on, parasitize or control people; the remaining environment may recover or flourish rather than becoming a barren
  wasteland. not Post-pandemic survival (disease defines the aftermath), Post-nuclear survival (nuclear catastrophe), Post-alien
  devastation (extraterrestrial invasion/intervention), or Terminal wastelands (mixed/unspecified causes and landscape as
  defining condition). Not Ruined Earth (farther-future inherited ruin). Not Creature feature (monster attack as a pulp adventure)
  or Apocalyptic fiction (the catastrophe while unfolding). A whole connected fiction may include its originating collapse
  novel without being split by volume.'

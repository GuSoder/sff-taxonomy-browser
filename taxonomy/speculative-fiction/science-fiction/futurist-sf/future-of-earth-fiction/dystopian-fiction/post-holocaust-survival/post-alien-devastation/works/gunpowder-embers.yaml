  approved by Gustav phonemsg-01M6P0SNH05832F272PCXACRGQ2026-11-05 15:11:24 CET to exact proposal phonemsg-01M6P0S8Z02V4Q6QJ3WQZJ9GWZ;
  name his Post alien devastation phonemsg-01M6P0RVDEABC3PPZ0R9SFQX07, displayed Post-alien devastation matching
  siblings. Earlier Alien invasion survival name lacked Post, caused confusion; revised on his instruction. Widening
  Ruined Earth withdrawn: never change gate to fix misplacement, rule71. No ancestor definitions changed. One verified
  published novel Gunpowder & Embers2020, Ringo/Ezell/Smith; queue2019 is eARC, primary publishedJan7 2020. Publisher
  current Last Judgement''s Fire latest one regular novel, corroborated bibliographies. LibraryThing alleged Smoke
  and the Water1copy not independently verified publisher/ISBN/publication; unverified lead, not counted extra novel
  or silently declared nonexistent. Thirty years after electrovoric ant/pterodon invasion destroyed electric civilization,
  farmer Chuck Gordon (primary sample, distributor paperback typo Gibson) receives key from dying Gunslinger; surviving
  father remembers failed Grand Coulee mission and sends him to remnant US Bunker. Independent frontier party includes
  warrior monk, dragon tamer, runaway Gant-cult acolyte and drunken mystic, opposed by Gants and human rail-building
  would-be dictator. SF: alien biology/energy premise and damaged future Earth, fantasy/Western surfaces not confirmed
  magic, no actual temporal crossing or parallel versions central merely because source rift space-time/another
  dimension. Not science-fantasy unanchored world: explicit future US, electricity known to father. Futurist future
  Earth rather than recognizable present; history thirty years earlier is not whole narrative era. Modern-day Alien
  invasion/conquest/Fallen Earth branches fail recognizable-present ancestor. Warzone Earth no sustained human armies/front-line
  campaign; Fall of Earth defeat is backstory; Occupied Earth not settled rule as main daily-life story; Earth resistance
  recovery-key quest not organized liberation campaign whole. Bodysnatcher/Hidden alien no stolen bodies nor secretly
  embedded aliens; Alien extraction not quiet enterprise on functioning Earth terms. Spacefaring Military SF ancestor
  fails Earthbound story before infantry/navy/academy/command; not remade soldiers, corps, merc contract, navy vessel/fleet
  or command campaign. Future war Earthbound but technology-transformed warfare not main narrative, survival/recovery
  road quest. Futurist Alien fiction > Anthropological SF > Xenocolonial > Alien dominions explicitly rechecked
  on Gustav question15:07: cult allegiance and Ariel life inside Gant queens real substantial strand, but colonial
  accommodation/alien society not whole book subject, independent Chuck party and human dictator/recovery key govern.
  First-contact/expedition contact already30years past, no outward mission; alien horror not dread contract; cosmic
  history no alien-development arc. Ruined Earth Lost knowledge quest formerly placed by local recovery flavor,
  but farther-future ancestor fails living aftermath and father still alive, no silent stretch. Post-holocaust parent
  living aftermath passes; pandemic/nuclear wrong causes; Terminal wastelands explicitly mixed/unspecified, not
  this named alien devastation cause. Fourth cause leaf approved rather than incorrect existing parent. Substantial
  wobble: Western fantasy-style ensemble road quest and rediscovered technology, real cult colonial strand; kept
  in rationale, not erased. Single fiction1 moved Lost knowledge quest7->6 to new leaf1, umbrella children3->4.
  English Baen157x240 front inspected and localized; low resolution disclosed.'

definition: Post-pandemic survival in which epidemic deaths, illness, scarcity and damaged institutions define the living aftermath, and people
  endure or try to rebuild life among those losses. Recovery is a mode of living on, not a guarantee of cure, restored government or return to
  normal. Includes plant-disease famine and continuing institutions. How High We Go in the Dark has bodily pathology and lasting illness, but
  not a continuing alternative host population as the governing aftermath.

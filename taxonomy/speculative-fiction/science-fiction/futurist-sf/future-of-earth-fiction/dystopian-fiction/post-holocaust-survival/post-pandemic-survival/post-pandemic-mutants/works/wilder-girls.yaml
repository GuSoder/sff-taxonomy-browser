placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures ->
  Post-Holocaust Survival -> Post-pandemic survival. Near-future (Kirkus) boarding school on an island off Maine, 18 months into the Tox, a disease
  that has killed or mutated half the school and corrupted the island''s plants and animals, under Navy and CDC quarantine (SLJ; Publishers Weekly).
  NPR and Kirkus read it as post-apocalypse survival. Caveat: the catastrophe is confined to the quarantined island rather than worldwide.'

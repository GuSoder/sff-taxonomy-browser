  - https://www.fantasticfiction.com/h/jason-m-hough/dire-earth-cycle/ : five-novel sequence; prequel short work separate.

  - https://sf-encyclopedia.com/entry/hough_jason_m : reference distinguishes story arcs, confirms space-opera turn, not a
  disconnected universe.

  - https://www.penguinrandomhouse.com/books/220299/the-darwin-elevator-by-jason-m-hough/ : immune scavengers, infection-remade
  Earth, failing elevator.

  - https://www.penguinrandomhouse.com/books/220300/the-exodus-towers-by-jason-m-hough/ : Brazilian survivor colony, immunes
  and subhumans.

  - https://www.penguinrandomhouse.com/books/220303/the-plague-forge-by-jason-m-hough/ : artifact search across plague-remade
  Earth.

  - https://www.penguinrandomhouse.com/books/240565/injection-burn-by-jason-m-hough/ : offworld rescue/blockade and mixed
  crew.

  - https://www.penguinrandomhouse.com/books/240566/escape-velocity-by-jason-m-hough/ : Carthage military compounds, survival
  and return to Earth.

  - https://locusmag.com/review/paul-di-filippo-reviews-jason-s-hough/ : completed first-two review, zombie action, survival,
  social divisions, alien mystery and old-school adventure coexist.

  - https://kellyjensenwrites.com/2013/09/17/review-the-plague-forge/ : completed trilogy review, answers and a clear beginning
  for a changed next story.


  ## Scope and audit

  This is confined to the exact duplicate encountered in the threshold audit. No broader author cleanup, Zero World change,
  new image or structural change. Existing covers are already inspected hotlinks. Title Dire Earth covers the full connected
  fiction; stable original card id avoids breaking its saved link. The retired Injection Burn fragment is archived with its
  whole-fiction destination. The two existing genre portraits remain.


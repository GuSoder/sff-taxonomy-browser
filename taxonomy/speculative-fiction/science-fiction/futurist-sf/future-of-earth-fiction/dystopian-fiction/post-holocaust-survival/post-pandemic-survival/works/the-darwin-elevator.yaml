placement_rationale: 'Root-down: Speculative fiction (Science fiction, not Fantasy) > Science fiction (Futurist SF, not Historical
  SF/Modern day SF/Atemporal SF) > Futurist SF (Future of Earth fiction, not Hard sci-fi/Spacefaring fiction/Alien fiction)
  > Future of Earth fiction (Dystopian futures, not Psionics/Techno fiction/Future war/Future societies/Utopian fiction) >
  Dystopian futures (Post-holocaust survival, not Totalitarian dystopia/Social dystopian future/Ruined Earth/Dying earth)
  > Post-holocaust survival (Post-pandemic survival, not Post-nuclear survival/Terminal wastelands). Whole Dire Earth Cycle:
  The Darwin Elevator follows immune scavengers supplying the last city after an alien plague, The Exodus Towers builds a
  Brazilian survivor colony under attack, The Plague Forge sends those survivors across ruined Earth to solve the Builders''
  artifact puzzle and secure humanity''s future. Alien mystery is substantial but the sustained story is humans surviving
  and rebuilding after plague; not the moment of catastrophe in Modern day SF''s Pandemic or an off-Earth military campaign.
  Plague mode need not be a specific biological virus: no unverified nano-origin assertion used. Sources individually checked:
  https://www.penguinrandomhouse.com/books/220299/the-darwin-elevator-by-jason-m-hough/ ; https://www.penguinrandomhouse.com/books/220300/the-exodus-towers-by-jason-m-hough/
  ; https://www.penguinrandomhouse.com/books/220303/the-plague-forge-by-jason-m-hough/ ; https://locusmag.com/review/paul-di-filippo-reviews-jason-s-hough/
  ; https://kellyjensenwrites.com/2013/09/17/review-the-plague-forge/ . ONE fiction, separate named sequel duology already
  represented by Injection Burn.'

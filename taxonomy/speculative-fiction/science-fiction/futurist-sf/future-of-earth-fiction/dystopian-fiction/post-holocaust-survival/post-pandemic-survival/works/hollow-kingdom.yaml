placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Dystopian futures > Post-holocaust
  survival > Post-pandemic survival. Hollow Kingdom (2019) follows crow S.T. and dog Dennis freeing pets and preserving animal life after a pandemic
  turns humans into predators; Feral Creatures (2021) follows S.T. raising last human child Dee among the more evolved Changed Ones. The whole
  fiction lives through the pandemic aftermath, not only the initial outbreak. Animal viewpoints and humor do not replace that setting engine.
  Same card and existing Feral Creatures front retained. Sources: https://www.kirajanebuxton.com/hollow-kingdom ; https://www.kirajanebuxton.com/feral-creatures
  ; https://www.hachette.co.uk/titles/kira-jane-buxton/hollow-kingdom/9781472268648/ ; https://www.kirkusreviews.com/book-reviews/kira-jane-buxton/feral-creatures/
  .'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian fiction > Post-holocaust
  survival > Post-pandemic survival. Three Gollancz rows (2024 reissues; queue author fields ''Computer Security'' and ''Events'' are scrape errors,
  author verified on the Gollancz pages and the Guardian review) are one trilogy and one shared universe, so one fiction (rule 11j): The Passage
  (2010), The Twelve (2012), The City of Mirrors (2016; Open Library''s 2015 is a catalogue date). A military-engineered virus turns twelve death-row
  inmates into blood-drinking virals, civilisation falls, and the story follows the survivors'' colony and then the rebuilding, which is the Post-pandemic
  survival definition (pandemic disease as cause, survivors enduring and rebuilding). I Am Legend, a vampire-plague survival book, sits in the
  same leaf. Rejected: Vampire fantasy and Vampire hunt (the cause is an engineered virus, not the supernatural; the Guardian calls it post-apocalyptic
  fantasy but the premise is a lab accident), Post-nuclear survival and Terminal wastelands (the cause is named), SF Atemporal and Genetic engineering
  leaves (the engine is the aftermath). Wobble: the vampire reading is the second-closest and the first volume''s 300-page prologue is a pre-collapse
  thriller. Decided on the cause and the survival engine.'

definition: 'Post-pandemic survival in which a continuing population remade by infection defines the living aftermath: vampires, feral humans
  or bodily transformed survivors, including the viewpoint people and intelligent successor societies. Mutants names this broad changed-host condition,
  not a requirement for a genetic mechanism, mindlessness or hostility. An eventual cure or recovery does not change the whole-fiction mode. Wilder
  Girls is an island-contained outbreak; its transformed survivors and ecology are the defining aftermath.'

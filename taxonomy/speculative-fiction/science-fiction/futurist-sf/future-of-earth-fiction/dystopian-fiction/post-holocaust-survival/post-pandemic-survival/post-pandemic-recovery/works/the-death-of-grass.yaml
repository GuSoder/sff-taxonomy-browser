placement_rationale: 'Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Post-Holocaust Survival -> Post-pandemic
  survival. SFE identifies it as a defining UK Disaster novel in which a virus extinguishes grasses and food crops, collapsing civilization while
  Custance hardens through the grim business of staying alive in a post-Holocaust world. Penguin confirms the crop virus, mass starvation, social
  barbarism and the family''s cross-country flight to sanctuary. A named pandemic cause governs over the sibling mixed-cause wasteland condition.'

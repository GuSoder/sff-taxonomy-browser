placement_status: accepted
placement_rationale: 'Whole shared universe rewalk2026-11-05 MC04801 Islands of Rage and Hope. Speculative fiction
  > Science fiction > Futurist SF > Future of Earth fiction > Dystopian futures > Post-holocaust survival > Post-pandemic
  survival > Post-pandemic mutants. Whole11 verified published regular novels2013-2025, not publisher series16 mistaken
  for16 novels: first Smith quartet4, Tom Smith Ringo/Massa2, Charles E.Gannon Crosscurrent2, Cordova Mountain of
  Fire1, Hampson Across an Ocean of Stars1, Trent Perdition''s Storm1. Same publisher-authorized world explicitly,
  not cameo inference. First2013 not incomplete card2014, Gannon Journey firstMarch2021 not Wikipedia May; StrandsJan2015
  not2014eARC. Four published shared-world anthologies2016/2019/2021/2024 and2023 graphic adaptation retained as
  ancillary metadata, not separate novel cards; fifth anthology The World We ForgeJan2027 not published full, partial/eARC
  not new completed novel. The King of FlorCubaTamp publisher explicitly Delayed/Not Currently Available despite
  stale2025 catalogues, not counted published; preserve conflicting catalogue dates as unverified lead. Entire fiction
  source-checked by its own branches, not inherited first-book premise: Graveyard Sky airborne engineered plague
  and Smith family''s escape/rescue; Darkling Sea existing Wolf Squadron clears ships/rescues trapped sailors after
  civilization annihilated; Islands vaccine manufacture/island supply retrieval to retake mainland; Strands closes
  quartet with reconstruction/reconquest; Valley of Shadows follows parallel Wall Street Tom securing vaccine/evacuation
  through the Fall; River of Night escaped Tom group crosses Virginia to build powered safe settlement against Gleaners;
  Gannon World youth ketch and South Georgia survival as Fall unfolds, Journey following survivor mission to Kourou
  saving GPS infrastructure amid infected; Mountain starts six months after Fall, Virginia schoolgirls/nun protect
  expanding settlement against human king; Ocean primarily12-18months after Fall per author, Hawaii scientific/pastoral/maritime
  survivor groups rebuild Polynesian culture, beta-infected care and usefulness considered; Perdition two years
  after virus per completed reader review, Italian ex-mafia survivor Trade Road fights expansionist human enemy.
  Primary publisher blurbs plus independent completed reviews/author interviews read for each subseries, latest
  community review clearly secondary evidence. Fiction remains SF, deliberately biomedical engineered living/rabid
  infected rather than supernatural risen dead; no magic or actual temporal/parallel travel source-established.
  Modern-day recognizable2013 baseline real substantial wobble and catastrophic Fall in first/Valley/Gannon World
  real, not erased. But as whole the surviving/rebuilding future is engine rather than catastrophe unfolding; not
  choose Zombie virus by mechanism before its Modern-day > Apocalyptic ancestor. Historical past2013 not history
  reconstruction/period aesthetic, contemporary extrapolated collapse at writing, no retro aesthetic or divergent
  recorded history premise. Atemporal no central cross-era/parallel Earth narrative. Futurist Earth future survivor
  society rather than spacefaring: Kourou terrestrial GPS rescue and Hawaiian simulated Mars researchers not actual
  interstellar travel. Alien no alien species/contact. Hard SF biomedical research/logistics real, Hampson calls
  his book hard SF, but constraint-solving not consistent engine across entire universe; survival/community rebuilding.
  Future war military rescue/combat strong original quartet and human militia late, not technology-transformed war
  as whole; no silent Earthbound Military SF route under Spacefaring. Future societies/utopia hopeful reconstruction
  real but not mature proposed order or detached sustained history, people living among plague devastation. Dystopian:
  Post-holocaust living aftermath not established totalitarian/social-engine dystopia, human tyrants local antagonists,
  Ruined Earth farther-future gate fails months/two years after Fall with remembered intact world; Dying earth wrong
  horizon. PHS named epidemic cause passes Post-pandemic, not alien/nuclear/mixed wasteland. Changed living host
  population and continuing infected environment define all branches; Post-pandemic mutants explicitly includes
  feral humans and not genetic mutation requirement; Post-pandemic recovery plain deaths/institutional damage insufficient.
  Zombie violence often background while humans are main antagonists, especially River/Mountain/Perdition, but changed-host
  population remains living aftermath. Strongest alternate Zombie virus retains outbreak portions and present chronology;
  whole continuing universe reconstruction makes aftermath home stronger. One fiction moved Zombie virus7->6, Post-pandemic
  mutants5->6. No genre definition edits, seed or freeze.11 distinct English Baen print fronts inspected, local157-159x240
  low-resolution images. Ancillary collections not added to books count. Single fiction move covered curator phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX,
  not structural change.'

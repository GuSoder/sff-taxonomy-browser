placement_rationale: 'Root-down: speculative-fiction > science-fiction > futurist-sf > future-of-earth-fiction > dystopian-fiction
  > post-holocaust-survival > post-nuclear-survival > nuked-fiction. Twenty years after a global nuclear holocaust, the last
  survivors live in the Moscow Metro: station communities, traders and polis-states rebuilding a working world in the tunnels
  under a lethal surface, with Artyom crossing the system on his quest (en.wikipedia.org Metro 2033 (novel); Gollancz editions).
  The bomb is past tense and the rebuilt communities are the leaf verbatim. Not Nuke time (not the blast''s fresh aftermath)
  and not Mutant fiction (the Metro''s people are ordinary humans; mutation rides the surface fauna, not the survivors'' bloodlines).
  Cause is explicitly nuclear, so not Terminal wastelands. Trilogy 2005/2009/2015, first Russian printings (Eksmo; English
  from 2010). Years are first print publication.'

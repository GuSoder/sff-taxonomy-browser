placement_rationale: 'Kim Stanley Robinson''s The Wild Shore (1984; first of the Three Californias; Wikipedia, Washington
  Post): decades after a 1987 neutron-bomb strike on North America''s cities, survivors in Orange County live as villages
  on farming and the sea under a Japanese quarantine, and the young hero''s nostalgia for a lost America is gradually deconstructed.
  The three Californias are separate novels with separate worlds, so each gets its own card and the Three Californias omnibus
  is skipped. Walk: Futurist > Future of Earth > Dystopian fiction > Post-holocaust survival > Post-nuclear survival > Nuke
  time fiction. Tried Terminal wastelands (the cause is nuclear and known). Sources: Wikipedia, Washington Post; not read.'

placement_note: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Dystopian
  futures > Post-holocaust survival > Post-nuclear survival > Nuke time fiction. Per Wikipedia (en.wikipedia.org/wiki/This_Is_the_Way_the_World_Ends_(novel)):
  a 1986 post-apocalyptic novel (Henry Holt, 319 pp) in which a megaton nuclear strike causes the apocalypse; the
  Unadmitted, a ghostly race of potential humans never born because of the holocaust, put the surviving architects
  of Armageddon - including the everyman protagonist - on trial under the Nuremberg precedent; Nebula-shortlisted
  1987 (nebulas.sfwa.org: ''a darkly comic tale of one survivor''s unintended collaboration with the architects
  of a nuclear holocaust - and his surprising adventures in the post-apocalyptic world''). The strike happens in-book
  and the rest is its fresh aftermath with no society left to rebuild: Nuke time fiction. Rejected: Nuked fiction
  (no communities rebuilding a working world among ruins - the survivors stand trial, they do not rebuild), Mutant
  fiction (no nuclear-born mutation), Terminal wastelands (cause is named nuclear), satirical-sf (mechanism is the
  door: the nuclear strike and its aftermath govern the book, not modern-day satire). Sources: Wikipedia, Nebula
  site; not read in full.'

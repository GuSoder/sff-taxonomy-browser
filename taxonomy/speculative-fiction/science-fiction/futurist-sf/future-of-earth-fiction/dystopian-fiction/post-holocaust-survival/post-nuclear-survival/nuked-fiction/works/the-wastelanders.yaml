placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Dystopian
  fiction > Post-holocaust survival > Post-nuclear survival > Nuked fiction. One fiction under rule 11j: Bite (2016)
  and Raid (2017) are Orbit''s Wastelanders #1 and #2 (isfdb series record; the 2018 "The Wastelanders" is their
  combined omnibus - skip-omnibus row), one post-holocaust world, and Raid''s Clementine hunts the raider king from
  Bite''s story. The cause is named by the publisher: Orbit announced Bite as "a lawless, post-nuclear world"
  (quoted by Reactor; Starburst: "the nuclear wasteland of the near future"), so Post-nuclear survival over
  Terminal wastelands (mixed/unspecified). Within it: the bomb is long past tense and the fiction lives in the
  rebuilt brutal working world - ramshackle towns, trade, raider crews making a living in the rubble; that is the
  Nuked fiction gate word for word. Not Nuke time fiction (no blast moment or fresh fallout), not Mutant fiction
  (no nuclear-born mutation).'

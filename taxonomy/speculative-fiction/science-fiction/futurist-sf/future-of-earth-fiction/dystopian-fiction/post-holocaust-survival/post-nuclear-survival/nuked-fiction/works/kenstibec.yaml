placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Dystopian
  futures > Post-holocaust survival > Post-nuclear survival > Nuked fiction. Entire Kenstibec trilogy, not Barricade alone:
  Barricade (2014) crosses nuclear-ruined Britain in an armoured taxi between Ficial city enclaves and human settlements;
  Steeple (2015) begins in the King of Kent settlement and climbs prewar London''s tower, while the damaged Ken tries to recover
  his nanotech; Rig (2016) leaves Britain for the Atlantic Lotus project, rescuing children to rebuild a viable society, before
  its survivors face capture, a feudal refinery settlement and its elite''s lethal entertainment. Every novel has its own
  publisher/creator copy and completed review read. Nuclear war and fallout are explicitly causal in the first novel''s review
  and publisher Financial Times excerpt, and Rig''s completed reviews: not merely a generic apocalypse guessed from a cover.
  Climate/resource crisis, engineered-human war and chemical pollution also contribute; acknowledged mixed-cause wobble, but
  the named nuclear aftermath and surviving/rebuilding enclaves support the existing cause-defined branch rather than Terminal
  wastelands. Nuked is past-tense life among ruins, not Nuke time''s immediate blast/fresh fallout. Nuclear-born human bloodlines
  do not govern the trilogy, so not Mutant fiction: the genetically engineered Ficials predate the war, even though irradiated
  creatures appear. Not Ruined Earth, whose gate requires a farther future where catastrophe has become myth/relic landscape:
  Ken himself and his flashbacks connect the living prewar and aftermath periods. Not Social dystopia or a single established
  totalitarian regime across all three; Rig''s slave society/game and the prewar refugee crisis are important but not the
  whole fiction''s governing setting. Futurist rather than Historical/Modern day/Atemporal: explicitly extrapolated future
  Britain and Atlantic, no counterfactual historical point or contemporary laboratory plot. Not spacefaring, alien-led or
  rigorous hard-science problem-solving. Techno fiction, Androids and Being robot are the strongest competing routes: all
  three develop Ken''s artificial identity, lost superiority and growing feelings, especially Steeple''s passing and Rig''s
  self-discovery. The publisher calls him a genetically engineered artificial life form, SFE an artificial version of Homo
  sapiens, not straightforwardly a machine mind in a body as the Robots parent requires. Do not silently stretch that gate
  from an android-like comparison. This is a real aboutness wobble, not a claim the humanizing arc is absent. The whole action-survival
  progression through working ruined-world communities, including Lotus''s reconstruction effort and the rig''s brutal functioning
  society, is an honest Nuked fit without changing definitions. One creator-attested trilogy/continuity, no separate volume
  placement. SFE confirms original years 2014/2015/2016; chosen official English Gollancz paperback jackets are later printings
  2015/2016/2017, not audio or first-edition claims. No exact final resolution invented from spoiler-avoiding reviews.'

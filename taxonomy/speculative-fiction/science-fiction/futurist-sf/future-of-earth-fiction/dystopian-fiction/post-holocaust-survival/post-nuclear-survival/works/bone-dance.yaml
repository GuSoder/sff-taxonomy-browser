placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian fiction
  > Post-holocaust survival > Post-nuclear survival. Per Wikipedia: set in a post-nuclear-clash future after a war between
  the Americas, in a climate-modified city where salvaged pre-collapse electronics are currency and Sparrow, a salvager, works
  through a Night Market, Tarot and a Vodun community. Survivors living through social collapse and reconstruction of a post-nuclear
  world is the Post-nuclear survival definition. Rejected: Neural fiction and the cyberpunk leaves (scholars read it as a
  feminist revision of cyberpunk, but the book''s frame is the survivors'' world), Terminal wastelands (the cause is named,
  nuclear war), Lost knowledge (at nine, and the salvaged tech is texture, not the subject). Wobble: it is also cyberpunk-adjacent
  and its Loa possession borders fantasy; it stays SF because Wikipedia and the subtitle call it a fantasy for technophiles
  with a salvage-tech world. Year is first publication 1991 (Ace), not the queue''s 2009 Orb reissue.'

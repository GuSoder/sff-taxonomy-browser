placement_rationale: 'Kimi Eisele''s The Lightest Object in the Universe (2019; author site, Kirkus): after a global economic
  collapse, grid failure, a deadly flu and unchecked climate change, the history teacher Carson walks west on foot along a
  railroad toward Beatrix, meeting opportunists and followers of the radio preacher Jonathan Blue, while survivors elsewhere
  build new ways to live. Walk: Futurist > Future of Earth > Dystopian fiction > Post-holocaust survival > Terminal wastelands
  (mixed-cause collapse, the story is the crossing of the devastated land). Tried Post-pandemic survival (the flu is one cause
  among several). Sources: author site, Kirkus; not read. Alternative: Post-pandemic survival.'

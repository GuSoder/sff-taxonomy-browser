placement_rationale: 'The Sipstrassi series, placed on its Jon Shannow frame only: in Wolf in Shadow the lone wanderer Jon
  Shannow, the Jerusalem Man, crosses a ruined world 300 years after "the fall", an apocalypse of unspecified cause (the book
  hints at pollution and nuclear weapons); Gemmell''s site describes a lone wanderer searching a ruined world for Jerusalem,
  and SFE calls the sequence science fantasy with Ruined-Earth framing books (the middle two are set in Roman-era Britain).
  Crossing the ruin is the governing condition and its cause is unspecified. Walk: Science fiction > Futurist SF > Future
  of Earth fiction > Dystopian fiction > Post-holocaust survival > Terminal wastelands > Wasteland journeys. Sources: davidgemmell.com/wolf-in-shadow,
  en.wikipedia.org/wiki/Wolf_in_Shadow, sf-encyclopedia.com/entry/gemmell_david_a.'

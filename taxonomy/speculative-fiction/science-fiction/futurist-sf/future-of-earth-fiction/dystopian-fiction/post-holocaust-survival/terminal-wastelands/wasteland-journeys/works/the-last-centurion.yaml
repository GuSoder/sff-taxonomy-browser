placement_rationale: 'MC04813 whole standalone The Last Centurion2008 rewalk2026-11-05: Speculative fiction > Science
  fiction > Futurist SF > Future of Earth fiction > Dystopian futures > Post-holocaust survival > Terminal wastelands
  > Wasteland journeys. One integrated novel3internal books, no same-world sequel verified SFE/publisher bibliography/current
  search, not Black Tide. Primary first printingAug2008, queue2008 correct. Publisher explicitly two simultaneous
  catastrophes mini-ice-age and plague, memoir of one possible future, BanditSix struggles rebuild world/prevent
  homeland fall. Reviews both positive and negative confirm stranded US company in Iran and long westward extraction
  through devastated MiddleEast, food/logistics/vaccination/social failure, then US farms/reconstruction/reconquest.
  PrimaryTOC9chapters initial catastrophe analysis,22chapter central Anabasis-like journey,5chapter New Centurions
  domestic recovery. Primary samples1/3/8 personally read: narrator introduces combined Plague/Freeze, post-Plague
  chilly-world children, flu fromChina and near-simultaneous freezing, winter deaths and migration alongside epidemic,
  economy/infrastructure crash and farming recovery. Explicit2019/20 setting future-at-writing not historical alternative
  of a known2019; recognizable near-future is strong Modern-day wobble but whole remade survivor-world future rather
  than ordinary present bio-thriller. Critical assertions about pandemic medicine/climate/government/race/politics
  are narrator/reviewer opinions, not established real-world facts endorsed here. SF hypothetical biomedical/climate
  extrapolation, no supernatural powers/magic/actual temporal displacement/parallel-reality travel established.
  Not historical Roman fiction merely title/metaphor, no fantasy Roman realm. Atemporal time-travel gate not triggered.
  Futurist Earth possible political/ecological/social future vs HardSF rigorous constraint-engine (long factual-sounding
  polemic not verified science, military survival rather than technical puzzle), Spacefaring no off-Earth travel,
  Alien no nonhuman premise. Future-of-Earth dystopian survival rather than Psionics, Techno central invented transformative
  tech, mature Future societies model or ideal Utopia. Future war strong soldier/combat/command strand, but weapon
  technology largely familiar Stryker company, central war disrupted by global disaster and community food survival
  rather than technology-transformed warfare whole; Military SF spacefaring ancestor fails Earthbound story. Dystopian
  PHS catastrophe living aftermath rather than established totalitarian control system (bad president and emergency
  powers antagonism real), engineered sick Social dystopia or long-inherited Ruined Earth (same surviving generation,
  active memory intact); no Dying sun. Modern-day Apocalyptic Pandemic Die-off former9 home plausible first9chapters
  mass dying, Climate catastrophe first causes also plausible, but both present-moment process leaves lose governing
  survival/extraction/rebuilding bulk. Not mere plague-mechanism pick, no zombies/unknown disease; named flu doesn''t
  nullify simultaneous Freeze. PHS Terminal wastelands explicit mixed-cause condition passes: plague/cooling/economic
  disruption together devastate traversed land. Post-pandemic recovery substantial real contender but epidemic-only
  named cause loses publisher double-catastrophe premise and continuing climate-induced deaths/famine/migration.
  No nuclear-war or alien catastrophe. Terminal Wasteland journeys central22chapter company crossing and traversed
  failed settlements, not final5chapter staying/rebuilding as whole; final domestic farming/city reclamation and
  opening catastrophe are substantial recorded wobbles, not forced out. Recovery exists in terminal definition,
  not permanent hopelessness requirement. One fiction moved Die-off9->8 and Wasteland journeys4->5. English Baen160x240
  front pixel-inspected/localized, resolution low, no parent definitions changed.'

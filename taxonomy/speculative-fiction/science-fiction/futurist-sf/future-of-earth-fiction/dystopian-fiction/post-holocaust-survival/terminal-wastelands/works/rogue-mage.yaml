placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian fiction
  > Post-holocaust survival > Terminal wastelands. One trilogy in one world, so one fiction (rule 11j). Wikipedia and Penguin
  Random House: about a century after an apocalypse like the one in Revelation but with no God appearing, a post-apocalyptic
  ice age; the neomage Thorn St. Croix hides among the snowbound human survivors of Mineral City while seraphs, demons and
  the Enclave press in. The cause is mixed and unnamed in the Post-holocaust leaves (neither pandemic nor nuclear), and what
  governs the books is enduring a devastated, frozen land with recovery partial, which is the Terminal wastelands definition.
  Rejected: Biblical fantasy (retells named Bible figures; Rogue Mage is a new story set after the event), Wild ruins and
  Lost knowledge (neither barbarism among ruins nor guarding fallen technology), Dying earth (not far-future under a dying
  sun), Dark fantasy torment leaves (the menace is the world, not a pursuer). Wobble: this is a hard walk, the magic and seraphs
  make Fantasy realms a live second reading, but there is no leaf for post-apocalyptic fantasy there and Earth-ruin fiction
  with magic already sits in this branch (Dying earth). Queue years corrected from Wikipedia: Seraphs is 2007 (queue said
  2008), Host Nov 2007.'

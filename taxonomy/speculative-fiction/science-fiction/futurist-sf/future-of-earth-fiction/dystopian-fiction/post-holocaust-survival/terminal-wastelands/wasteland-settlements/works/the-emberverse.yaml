placement_status: accepted
placement_rationale: 'S. M. Stirling''s Emberverse (Roc and Ace, from Dies the Fire, 2004, to The Sky-Blue Wolves, 2018; Wikipedia
  bibliography): on one night, called the Change, electricity, guns, explosives, internal combustion and steam power stop
  working everywhere, most of humanity dies, and the survivors of Oregon''s Willamette Valley rebuild as farming clans and
  feudal realms through three generations. 15 novels folded into the first as one shared universe (rule 11j); The Change anthology
  is skipped. The series is the sequel setting of the Nantucket trilogy, which is a separate series. Walk: Science fiction
  > Futurist > Future of Earth > Dystopian fiction > Post-holocaust survival (the living aftermath of a catastrophe) > Terminal
  wastelands (unspecified or mixed-cause collapse, enduring a devastated world). Tried: Post-nuclear survival (not nuclear
  war) and Post-pandemic survival (not disease). Wobble: later volumes are neo-medieval war and quest in the rebuilt world,
  so the ''wasteland'' recedes after the early books.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Dying Earth. SFE identifies it as a major Dying Earth precursor: the Sun is extinguished, monsters inherit a decaying far-future world and humanity retreats into the Last Redoubt. The exhausted world under a dead sun is the governing engine.'

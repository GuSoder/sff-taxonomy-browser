placement_status: accepted
placement_rationale: 'Moved 2026-10-11 from Frontier planets to Dying earth on the curator''s decision ("Maybe move it dying
  earth" phonemsg-01M4NXJW80T15H9ZQH2W2M5PR8, then "Yes" phonemsg-01M4NXWDN7RT1YN1MCWYANSGZ1). Root-down: Speculative fiction
  > Science fiction > Futurist > Future of Earth fiction > Dystopian futures > Dying earth. The Dying earth leaf''s own definition
  names Wolfe''s Book of the New Sun as the genre''s most significant inheritor, and a reader looking for Wolfe looks there.
  Earlier placement, kept for the record: Colonial worlds by ruling phonemsg-01M4E4MHATNAGJSH6VMAGPVYA7 (2026-10-08), then
  Frontier planets after the 2026-10-11 split. The cycle runs from the New Sun (1980-87, a dying Earth under a failing sun)
  through the Long Sun (1993-96, the generation-ship city of the Whorl) to the Short Sun (1999-2001, the settlement of the
  colony planets Blue and Green among the inhumi). Wobble: Dying earth covers the first of three series; the Long Sun reads
  as Voyage societies and the Short Sun as a colony story. One fiction under rule 11j. Folded in: the Long Sun omnibuses Litany
  of the Long Sun (MC03359) and Epiphany of the Long Sun (MC03351) are editions of the four Long Sun novels and are not listed
  separately; Long Sun queue rows MC03347, 03352, 03357, 03360, Short Sun rows MC03355, 03361, 03364; the New Sun omnibuses
  (MC03370, 03377, 03378) are editions of the first four volumes.'

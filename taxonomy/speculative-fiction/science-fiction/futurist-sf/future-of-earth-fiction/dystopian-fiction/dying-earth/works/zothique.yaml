placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Dying earth.
  Lin Carter''s 1970 Ballantine Adult Fantasy collection of linked tales set on Zothique, the last continent of a far-future Earth under a dying sun. SFE
  credits Smith''s ''highly influential Dying Earth tales'' with making the Far Future a setting that Jack Vance then built on, which puts Zothique at the
  root of this leaf.'

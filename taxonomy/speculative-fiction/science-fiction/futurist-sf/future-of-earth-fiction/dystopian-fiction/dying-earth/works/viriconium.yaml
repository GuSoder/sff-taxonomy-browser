placement_rationale: SFE describes the sequence as Far-Future science fantasy on a bleak Dying Earth, with Viriconium the City at the end of time; A Storm of Wings recasts alien invasion through insectoid perception. Penguin's collected edition confirms its four core works. The exhausted terminal Earth and decaying city remain the shared frame, making Dying earth closest.

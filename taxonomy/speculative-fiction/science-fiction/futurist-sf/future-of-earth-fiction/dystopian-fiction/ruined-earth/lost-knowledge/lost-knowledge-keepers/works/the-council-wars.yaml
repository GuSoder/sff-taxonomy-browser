placement_rationale: 'Ringo''s Council Wars (There Will Be Dragons 2003, Emerald Sea 2004, Against the Tide 2005, East of
  the Sun, West of the Moon 2006; the queue holds the last three, the first book is part of the same fiction): thousands of
  years on, an AI called Mother runs a paradise of nanotech and teleportation; when the ruling council falls out and goes
  to war the Net fails, and communities such as Raven''s Mill, where smith and historian Edmund Talbot keeps the old knowledge,
  must live with a technology that now behaves as magic, with elves and dragons that are engineered descendants of military
  programs (Wikipedia mirror, Simon & Schuster, ISFDB). Root-down: Science fiction -> Futurist -> Future of Earth -> Dystopian
  fiction -> Ruined Earth -> Lost knowledge -> Lost knowledge keepers (the story is living with the fallen civilization''s
  knowledge: guarding, controlling and half-remembering it at home), not Lost knowledge quest (the expedition is not the engine)
  or Wild ruins (they keep, not abandon, the knowledge). Rejected: Ozymandian tech (the tech is not buried) and Hard science
  fantasy (teleportation exists). Wobble moderate to high: Earth is not ruined so much as its society, and the fourth book
  leaves for space.'

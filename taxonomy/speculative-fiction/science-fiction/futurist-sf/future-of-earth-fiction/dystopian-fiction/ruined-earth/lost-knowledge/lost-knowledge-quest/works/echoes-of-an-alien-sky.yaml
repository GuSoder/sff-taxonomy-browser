placement_rationale: 'Venusian colonists settle a long-extinct Earth, and archaeologist Kyal Reen works among the Terran
  ruins to reconstruct the story of the fallen Terran civilization while biologist Lorili pursues the riddle of
  Terran-Venusian kinship (Baen blurb). A successor people set out to recover a fallen civilization''s lost knowledge on a
  ruined Earth: Lost knowledge quest, with Beyond the Burn Line as the precedent for non-indigenous successor peoples.
  Rejected siblings: Lost knowledge keepers (no established society guarding or fearing the knowledge), Wild ruins (no
  barbarism), Earthborn (the microscope is on the dead civilization''s recovered knowledge, not on observing a living
  estranged culture), Dying Earth (no moribund sun).'

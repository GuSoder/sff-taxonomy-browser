placement_rationale: 'Ringo, Kacey Ezell and Christopher L. Smith''s Gunpowder & Embers (Baen, 2020, Last Judgment''s Fire
  book 1): thirty years after giant electrovoric ants and pterodons came through a rift and killed millions, leaving a world
  without electricity, rancher Chuck Gordon meets a dying stranger and sets out across America with a warrior monk, a dragon
  tamer, a runaway cultist and a drunken mystic, searching for the key to reclaiming humanity''s lost technology before a
  new war begins (Baen; kaceyezell.net). Walk: Science fiction > Futurist > Future of Earth > Dystopian > Ruined Earth > Lost
  knowledge > Lost knowledge quest (the story is the journey to recover the fallen world''s technology), not Lost knowledge
  keepers (no one is guarding it at home) and not Wild ruins (the quest, not life among ruins, drives it). Wobble moderate
  to high: the collapse is only thirty years old, not farther-future, and the book reads as a western; alternative Wild ruins.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian fiction > Totalitarian dystopia > Dystopian rebellion. SLJ (Gr 8 Up): ''first installment in a new dystopian thriller series'' - twin sisters Cassie and Becca in a highly regulated farming ''cell'' under the authoritarian ruling body The United; Becca is taken to a violent prison (the Crazy House) and Cassie sets out to rescue her; book two is The Fall of Crazy House. The regime already holds power and the sisters'' fight against it carries the story, which is the leaf definition. Rejected: orwellianesque (last-resort leaf; rebellion is the specific pattern), orwellian-propaganda (no media-control engine). YA dystopia, eligible. Series card, two books per jamespatterson.com. Queue id MC04235.'

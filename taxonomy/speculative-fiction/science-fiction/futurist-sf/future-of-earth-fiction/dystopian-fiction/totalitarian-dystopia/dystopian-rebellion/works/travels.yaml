placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction >
  Dystopian futures > Totalitarian dystopia > Dystopian rebellion. Travels2001, Jerry J. Davis, is one standalone
  novel; Wasting Away2025 is its retitled revised edition with restored ending/metafictional frame, not a sequel
  or second novel. Author''s older official blurb describes a world transformed by corporate warfare, government
  and religious powers subordinated to mass media, and hackers/urban rebels plotting against cybernetic power. His2012interview
  explicitly calls it an SFRevelation with a computer-program Antichrist and holy hackers trying to prevent the
  end of the world. KevinNenstiel''s independent fullnovelreview follows ex-soldier Dodd, insurgent Danny, hypnotically
  TV-addicted Sheila, JesusTV-devoted Toby, and Toby''s pregnant daughter fleeing mandatory abortion to join rebels;
  interwoven narratives culminate in a conflagration as heroes band together against enslaving powers. The already-established
  order and resistance against it are the wholefiction plot, rather than just one rebellious scene. Huxleyan dystopia
  is the strongest genuine rival: the Travels sphere broadcast induces pleasure/addiction and corporate religion
  engineers compliance; bodily reproduction is also controlled. Rebellion wins on organizing story, not on counts
  (both leaves had8). Orwellian propaganda resembles media control but loses against explicit seductive hypnosis/consent
  rather than coercion alone; reproductive penalties do not erase dominant control mechanism. Crowded dystopias
  has explicit overpopulation, but population is the excuse for birth restrictions, not the principal wholeplot
  pressure; Childless/Patriarchal/Climate branches lack defining engine. Social dystopian future''s diffuse sick
  society underweights the corporate-cybernetic hierarchy and purposeful rebels. AI overlords and Rogue AI genuinely
  resemble the computerAntichrist, but sources foreground human social subjection and plural resistance, not machine
  mind laws/personhood or awakening; delivery androids do not make Robots central. Cyberpunk is explicitly author-described:
  Cyberpunk noir lacks hardboiled job/crime/betrayal spine, Metaverse lacks shared inhabited avatarworld, Neuralfiction
  lacks direct brain-interface passage, LitRPG lacks literal mechanics; postcyberpunk Cyberheist lacks boundedjobspine
  and Revolutionarycyberpunk lacks alternativeinstitution-building, while Terms of service fits ordinary broadcastlife
  but underweights overthrowclimax. SatiricalSF is a genuine mode rival from retailer''s satiricaladventure description
  and updated Vonnegut-style frame, but independent review emphasizes chilling social enslavement and collective
  rebellion, not comedy as primary engine. Modern-day socialdystopia loses to explicitly extrapolated robot/AI-controlled
  future at original2001publication, not mistaken for our present. Historical/Alternatehistory tested after author''s2025description
  as alternate timeline of present: no concrete divergence or closedperiod aesthetic established, and author-future
  social imagination remains. No literal time travel/parallelworld crossing supported: television''s pictured journey
  and2025autobiographical frame do not themselves establish either. No demonstrated supernatural Christ/Antichrist,
  so Fantasy loses to computer-mediated SF satire; no invented realm. Post-holocaust/ruinedEarth and Apocalyptic
  fiction are resemblances from prior war and endworldstakes, but no source establishes catastrophe mechanism as
  main subject instead of resistance to existing power. No space/alien or hardphysics focus. Moderate confidence,
  author wholework descriptions plus independent detailed review, not complete direct novel read; exact ending and2025restoredending
  not independently verified. No structural/definition change;8->9.'

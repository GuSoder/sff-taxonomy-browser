  - https://www.kitrocha.com/book/gideons-riders-book-three/ observed linked third-book page, Ivan identity/cover.

  - https://www.kitrocha.com/release-blitz-for-ashwin/ first release2017, genetic-engineering premise.

  - https://www.kitrocha.com/gideons-riders-ashwin/ military doctor Kora and engineered soldier, no magic inferred from religion.

  Bibliography:


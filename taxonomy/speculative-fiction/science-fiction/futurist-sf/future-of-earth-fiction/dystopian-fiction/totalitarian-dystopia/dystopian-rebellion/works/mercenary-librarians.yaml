  Ashwin.

  - https://anacoqui.com/2018/04/03/ivan-by-kit-rocha-gideons-riders-3/ real aftermath/dynastic/refugee straddle, ruling prophet
  a charlatan, no literal magic established.

  - http://bananatricky.blogspot.com/2017/11/review-deacon.html Rider social religion and assassin threat.

  - https://bibliosanctum.com/2020/08/06/book-review-deal-with-the-devil-by-kit-rocha/2086future America, flare/corporation
  setting.


  No novel read in full. Evidence is primary author scope/plot, actual covers, completed independent reviews and bibliographic
  metadata. Confidence high scope/count/years, moderate whole-fiction dominant placement due to romance and post-dystopian
  straddles.


placement_rationale: '# The Sectors, Kit Rocha: whole-fiction scope repair

  2026-11-23


  ## Verdict

  Retain existing Dystopian rebellion placement, expand the Mercenary Librarians card to one connected **The Sectors** fiction,
  fifteen published novels: Beyond9, Gideon''s Riders3, Mercenary Librarians3. Remove the existing2024Mercenary Librarians
  omnibus from novel count. No new fiction, genre or definition. Stable id mercenary-librarians retained. The author calls
  the world The Sectors and explicitly confirms all three series share it despite sparse Atlanta/Nevada crossover.


  ## Scope and metadata

  Beyond: Shame2012, Control2013, Pain2013, Jealousy2014, Addiction2014, Innocence2015, Ruin2016, Ecstasy2016, Surrender2016.
  Author librarian resource gives first-publication years for all9; month differences versus an older author page do not affect
  displayed years.

  Riders: Ashwin2017, Deacon2017, Ivan2018. Author''s What Next confirms currently3. Series page''s unnamed book3 is the published
  Ivan, resolved by linked book page and actual cover. Hunter/Gabe/book6 are future placeholders, Hunter''s own page explicitly
  has no release estimate; not counted. FictionDB lists3with2017/2017/2018. Ivan has March catalog/April release-post disagreement,
  both2018.

  Librarians: Deal with the Devil2020, The Devil You Know2021, Dance with the Devil2022. Author says complete at3.2024 omnibus
  explicitly bundles those same3, not novel4. Novellas, shorts and stories excluded under project novel-count convention.


  ## Whole-fiction root-down walk

  Speculative fiction: genetically engineered soldiers, implants/kill switches and altered human capabilities in post-Flare
  future. Fantasy rejected: no sourced literal magic; Rider soul-sacrifice/prophet language is an in-world religion and social
  institution, not verified supernatural power. Kora is military doctor from the Makhai project, not proof of magical healing.
  Primary author frames powers genetically. No time travel found.

  Science fiction > Futurist SF: future America, author explicitly futuristic solar flares, Librarians independently2086.
  Historical/Modern day fail date; Atemporal fails no time/multiverse/consciousness premise. Futurist''s other children: Hard
  SF fails rigorous scientific inquiry as engine, Spacefaring/Alien fail Earth-based human order. Future of Earth wins.

  Future of Earth children: not Psionics or Techno-fiction, genetic enhancement supports social oppression and resistance
  rather than a power/posthuman inquiry; not Future war''s military campaign structure for whole15; not Future societies''
  social inquiry as primary promise; not Utopian. Dystopian fiction catches the built regimes and their overthrow.

  Dystopian children: Post-holocaust survival is a real rival but collapse is established background, not immediate living
  aftermath/survival engine. Ruined Earth''s later lost-knowledge/wild successor-culture frame fails. Dying Earth fails terminal
  world. Social dystopia is less exact than named theocratic/corporate totalitarian orders. Totalitarian wins.

  Totalitarian children: Huxleyan conditioning/engineered bodies and Orwellian repression are both real apparatus; the recurring
  whole arc follows those resisting and overthrowing orders already in power, not primarily depicting compliance. Dystopian
  rebellion remains the positive home.


  ## Whole-fiction straddles

  Beyond9is an explicit primary-author resistance-to-overthrow arc. Completed finale review independently traces the buildup
  from first installment to war against Eden and final resolution. Librarians3moves from heist/survival toward organised Atlanta
  revolution, explicit in final novel synopsis. Riders3is genuinely post-dystopian, set6months after Beyond''s ending, featuring
  refugees, dynastic intrigue and assassination attempts rather than a new overthrow. This is a substantial three-novel aftermath
  straddle within one shared fiction, not hidden or redefined as rebellion. Romance and found family drive individual novels
  throughout; no separate SF-romance leaf should be invented from them. Broad catastrophe survival and genetic-engineering
  leaves would distort the larger combined arc more.


  ## Effects

  Existing card4items ->15actual novels, netbooks+11. Fiction count unchanged and Dystopian rebellion remains9. Previous Burroughs
  correction926/2968/7305 becomes926/2968/7316. No other card found under Kit Rocha across current tree, so expansion, not
  duplicate-card consolidation. No tenth/split trigger. On completion resume next untouched intake after this scoped audit.


  ## Cover QA

  All15actual English front-cover pixels inspected in private contact sheet.9Beyond,3Riders,3Librarians. Author-image URLs
  used verbatim, hotlinks only, no cover bytes stored in repo. Several author thumbs200x300, others533x800, low-resolution
  ones disclosed, not fabricated larger paths. Current card''s missing individual covers are filled. No new portrait.



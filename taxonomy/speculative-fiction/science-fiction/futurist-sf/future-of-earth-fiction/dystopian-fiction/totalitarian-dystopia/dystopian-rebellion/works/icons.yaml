placement_rationale: '# Icons whole-fiction walk,23November2026


  Verdict: existing Dystopian rebellion9to10. Freeze after this fiction and initiate split review. No further intake. One
  connected fiction, Margaret Stohl''s Icons2013 and Idols2014. Current ISFDB and Goodreads each list two published novels.2013Publishers
  Weekly projected four;2014professional reviewers anticipated three. Those plans are not published books. No verified third
  novel found. This is the whole published fiction, not a claim of completed narrative closure.


  ## Root and time

  Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Dystopian futures > Totalitarian dystopia
  > Dystopian rebellion.


  SF not Fantasy: lethal alien electromagnetic technology, a computer intelligence''s first contact, genetically bred emotional
  weapons, investigation records and experimentation. Library Idols synopsis explicitly establishes genetic breeding. Emotional
  projection, dream-contact and powers are not sufficient evidence of literal magic. Author interview contrasts Dol''s science-fiction
  problems with hypothetical proper magic and separately distinguishes this from Beautiful Creatures. One first-volume reviewer
  calls powers supernatural and another calls the teens aliens; their loose labels do not override the second-volume origins.
  No evidenced actual gods, spells or supernatural cosmology. Not merging with Beautiful Creatures merely because same author.


  Bulletin of the Center for Children''s Books explicitly dates invasion2070, main story17years later. Publisher and author
  independently say future. Modern day SF fails, so its otherwise precise Alien invasion > Alien conquest > Fallen Earth >
  Earth resistance cannot be used by leaf resemblance. Historical lacks past setting or alternate historical fork; Atemporal
  lacks actual time travel, parallel world crossing or unanchored invented cosmos. Dreams/contact with another child are not
  demonstrated temporal communication. Futurist passes Earth in2087, not our recognizable present.


  ## Futurist siblings

  Hard sci-fi fails scientific rigor as central reading experience, not merely EMP/genetics vocabulary. Spacefaring fails
  the mostly terrestrial California/Utah/Southeast Asia action; alien arrival is not a human spacefaring civilization story.
  Alien fiction > Anthropological SF > Xenocolonial > Alien dominions is the strongest real rival: Earth is subordinate to
  alien Lords and human collaborators, and Lucas''s mother is a powerful human ambassador. But cultural encounter, accommodation,
  loyalty between interacting species or ethnographic observation is not the whole-fiction contract. The Lords are largely
  unseen; both books center the emotionally armed teenagers'' origins, the human Embassy/Sympa regime, rescue and violent
  resistance. This is not simply ignoring aliens to prefer an available shelf. Existing Alien dominions includes genuine rebellion
  and captivity, especially Exo and Freedom, but those explicitly develop cross-species relationships and accommodation. Icons''
  governing frame is a dystopian human order backed by alien killing technology and the young revolutionaries who break it.
  Confidence moderate, not a clean absence of xenocolonial themes.


  Future of Earth passes Earth''s suppressed surviving society. Dystopian futures passes an already established totalizing
  coercive order and organized resistance. Future history loses sustained historical trajectory; Future war loses campaign/warfare
  transformation as principal engine rather than origin mystery, escape and insurrection. Superhuman abilities do not make
  future body engineering the engine: engineering is the revelation behind the rebels, not the sustained examination of designed
  human kinds. No cyberspace/computer-interface story, robot social problem, environmental extrapolation or humour-first contract.


  ## Dystopian siblings

  Post-holocaust survival > Post-alien devastation is substantial in the opening countryside/mission life after mass death.
  It loses whole-fiction priority: the Embassy takes the children, they resist the already ruling administration, join Fortis/Grass
  resistance and destroy an Icon; Idols continues the rebel outpost, pursuit, missing-child rescue and further fight against
  the Lords. It is not principally farming, scavenging, rebuilding or living on after alien catastrophe. Ruined Earth fails
  the farther-future inherited-civilization condition, since the conquest is17years past and its direct agents still rule.
  Dying Earth fails terminal-sun premise. Social dystopia loses diffuse societal sickness to a named hierarchy that captures,
  imprisons and experiments on its subjects.


  Totalitarian dystopia passes the Embassy/Sympa machinery of captivity, alien-backed coercion and death-controlled settlements,
  with the surviving population subordinated. Huxleyan control through pleasure/engineered consent is not the governing mechanism,
  notwithstanding emotional powers. Orwellian surveillance, officials and conspiracy are real furniture, but the continuing
  action is the protagonists'' growing fight against the order. Dystopian rebellion passes both published novels: the series
  moves from capture and resistance to destroying a ruling installation, escape into a rebel base, rescue of another engineered
  child and the liberation struggle. This is not a single rebellious climax attached to ordinary daily life. Idols professional
  Booklist review explicitly calls them young revolutionaries. Romance triangle, emotional identity and origin mystery are
  substantial intertwined modes, not dismissed. Final volume reviews disagree on narrative success and anticipated continuation;
  none establishes a different magical or spacefaring frame.


  ## Execution and caveats

  Duplicate scan found only Beautiful Creatures for Margaret Stohl, a separate supernatural universe. Two English publisher
  flat-front cover images inspected as pixels661x1000and1713x2600, correct titles/author, no placeholders. Hotlinks only;
  no cover files committed. No ancestor definition changes, portrait or new node. Expected totals926nodes/2969fictions/7304books.
  The tenth freezes Dystopian rebellion and requires an evidence-backed split, with existing members rewalked before naming
  an axis. No narrative claim here is based on reading full novels; evidence is primary author/publisher, library synopsis,
  professional reviews and completed independent reviews across both books.

  '

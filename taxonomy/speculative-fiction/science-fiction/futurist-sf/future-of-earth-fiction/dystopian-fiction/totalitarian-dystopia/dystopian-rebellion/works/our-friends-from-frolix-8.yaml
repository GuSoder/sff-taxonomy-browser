placement_rationale: 'Philip K. Dick''s Our Friends from Frolix 8 (Ace, 1970; Wikipedia): in the 22nd century Earth is ruled
  by superhuman New Men and Unusuals, who police and surveil the Old Men, send dissidents to camps on the moon and rig the
  civil service exam; the resistance leader Thors Provoni has gone into space for help and returns with a Frolixian, a sentient
  blob, as the tire regroover Nick Appleton and the Underground Men rise. Walk: Science fiction > Futurist > Future of Earth
  > Dystopian fiction > Totalitarian dystopia > Dystopian rebellion (the regime has already taken power, the story follows
  those who fight it). Tried: Psionics (the powers sort the classes but the plot is the rebellion).'

placement_rationale: 'Actual-tree walk: Science fiction -> Futurist -> Future of Earth
  -> Dystopian fiction -> Totalitarian dystopia -> Orwellian dystopia -> Orwellianesque.
  Han Song''s hospital takes over city, country and world: every citizen a patient,
  total control of bodies and minds, praise of the institution mandatory - a Kafka-flavored
  total institution running Orwell''s coercive formula without matching a sibling
  template (MCLC review, Mingwei Song). Last-resort intake leaf by its own definition.'

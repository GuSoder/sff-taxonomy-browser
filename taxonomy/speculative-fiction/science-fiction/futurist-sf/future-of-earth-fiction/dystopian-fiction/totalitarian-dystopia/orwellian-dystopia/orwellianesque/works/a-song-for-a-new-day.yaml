placement_rationale: SFE calls it a Near Future Dystopian America where the government answers unrest and pandemic by enforcing solitariness. Penguin says terror and deadly viruses lead the government to ban public gatherings and concerts, with musicians performing illegally while a corporate virtual-entertainment system replaces live connection. State prohibition and enforcement drive the dystopia, making Totalitarian dystopia closest.

placement_rationale: 'SFE treats the books as one near-future American sequence: authoritarian rule and resistance, secret trials of state enemies and extrajudicial murder, then national collapse and a tribunal attempting new law. The sequence''s defining pressure is overt political coercion through law, police power and punishment, making Orwellian dystopia closest.'

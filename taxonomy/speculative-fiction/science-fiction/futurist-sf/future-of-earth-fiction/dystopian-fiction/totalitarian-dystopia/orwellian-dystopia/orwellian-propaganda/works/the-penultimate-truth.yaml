placement_rationale: 'Philip K. Dick''s The Penultimate Truth (Belmont, 1964; Wikipedia): in 2025 most of humanity lives in
  underground ''ant tanks'' building robot ''leadies'' for a war they are told still rages above, while the war ended thirteen
  years earlier and the ruling groups of both blocs live on estates served by the robots; the leader Talbot Yancy is a mechanical
  simulacrum whose speeches are written by propagandists, the Yance-men. Walk: Science fiction > Futurist > Future of Earth
  > Dystopian fiction > Totalitarian dystopia > Orwellian dystopia (coercion, never pleasure) > Orwellian propaganda (media
  control through state distraction, censorship and governing spectacle). Tried: Post-nuclear survival (the war is the lie,
  no one is living in its aftermath) and Classic Orwellian (the engine is the broadcast, not surveillance).'

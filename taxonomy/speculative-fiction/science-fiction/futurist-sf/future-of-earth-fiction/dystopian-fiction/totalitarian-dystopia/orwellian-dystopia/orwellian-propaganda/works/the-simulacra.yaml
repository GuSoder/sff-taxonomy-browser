placement_rationale: 'Philip K. Dick''s The Simulacra (Ace, 1964; Wikipedia): the United States of Europe and America is ruled
  behind the scenes by a covert council while the public sees a First Lady, Nicole Thibodeaux, and a succession of android
  presidents, simulacra who are replaced on a schedule; psychotherapy is banned by the drug cartel A. G. Chemie, and the plot
  follows the factions around a telekinetic pianist. Walk: Science fiction > Futurist > Future of Earth > Dystopian fiction
  > Totalitarian dystopia > Orwellian dystopia > Orwellian propaganda (governing spectacle: the state shows its people a staged
  leader). Tried: Huxleyan dystopia (the drug cartel is part of the plot, the manufactured leaders are the engine).'

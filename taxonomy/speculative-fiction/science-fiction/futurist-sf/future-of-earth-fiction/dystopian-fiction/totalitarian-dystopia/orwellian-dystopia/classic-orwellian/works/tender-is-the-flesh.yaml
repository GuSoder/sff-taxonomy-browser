placement_rationale: 'Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Totalitarian dystopia -> Orwellian dystopia -> Classic Orwellian. The pandemic is only the official origin story; the governing engine is a normalized state system of human livestock, censorship, curfews, euphemistic controlled language and compulsory acceptance of the Transition. That direct coercion and truth control outrank Pandemic and the Social dystopia branches.'

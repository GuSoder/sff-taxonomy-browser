placement_rationale: 'Philip K. Dick''s The World Jones Made (Ace, 1956; Wikipedia): after a third world war the United States
  is under the authoritarian Fedgov, which enforces ''relativism'' by law and punishes anyone who claims absolute truth; its
  agent Doug Cussick meets the fairground precog Floyd Jones, whose forecasts of a nationalist election and of ''drifters''
  from space turn him into a leader the regime cannot manage. Walk: Science fiction > Futurist > Future of Earth > Dystopian
  fiction > Totalitarian dystopia > Orwellian dystopia > Orwellian statesmanship (administration, ideological law, secret
  process). Tried: Psionics (precognition drives the plot, but at nine and the regime''s ideological law is the setting that
  shapes every move). Wobble: Psionics is the alternative leaf.'

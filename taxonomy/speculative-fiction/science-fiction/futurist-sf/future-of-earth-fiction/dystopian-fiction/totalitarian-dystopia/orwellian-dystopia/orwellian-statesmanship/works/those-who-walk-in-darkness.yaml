id: those-who-walk-in-darkness
title: Those Who Walk in Darkness
authors:
- John Ridley
first_published: 2003
canonical_genre: orwellian-statesmanship
placement_status: accepted
placement_rationale: 'Whole-fiction root-down walk2026-11-05: Speculative fiction > Science fiction > Futurist SF
  > Future of Earth fiction > Dystopian fiction > Totalitarian dystopia > Orwellian dystopia > Orwellian statesmanship.
  Whole Soledad O''Roark sequence2 novels: Those Who Walk in Darkness2003 and What Fire Cannot Burn2006, ISFDB author
  bibliography, original contemporary2006 reviews and Hachette/AALBC record; Fantastic Fiction''s2004 sequel date
  conflicts and is rejected. Separate engines audited: Darkness has LAPD rookie Soledad''s unauthorized anti-meta
  weapon, her suspension and a telepath''s revenge interwoven with persecuted superhumans unable to leave the United
  States. Fire injures Soledad into the investigative division, pairs her with Eddi Aoki and pivots into a serial-killer/vigilante
  mystery involving a police conspiracy, with Eddi becoming prominent. Publisher and agent copy plus independent
  reviews establish both rather than extending first-book traits by inference. SF rather than Fantasy: genetically
  altered humans with comic-book superpowers, including telepathy and fire, not an actual occult cosmology; the
  angelic woman''s appearance is not proof of literal angels. No evidenced time-travel/parallel-world governing
  device. Near-future Earth is explicit in contemporary Kirkus, Locus and Thunder Child. Historical and Atemporal
  fail that setting; Modern-day is genuinely tempting because SFReader says contemporary or at least near-future
  and recognizes our world, but multiple explicit near-future accounts win the temporal gate. Superhero fiction
  is the closest content-only leaf, with the social consequences and policing of powered people central, but its
  strict Modern-day ancestor cannot be stretched merely because other tenants have future settings. Hard SF fails
  rigorous scientific constraints: Soledad''s engineering is an action tool, not a scientific world-model. Spacefaring/Alien
  fail Earthbound human society. Future Earth > Dystopian fiction beats Psionics: broad metanormal powers are accepted
  premise rather than psi studied as science. Techno fiction fails sustained technological redesign: mutation is
  not presented as an engineering program making a new caste, and the improved gun does not organize the world.
  Future war fails warfare rather than police hunt. Future societies/Future social SF is substantial alternative:
  prejudice, moral ambiguity and the ordinary police officer''s life matter, but a named executive order criminalizing
  an entire class and its lethal institutional enforcement is the defining social pressure rather than an open social-science
  comparison. Utopia obviously fails. Dystopian > Totalitarian > Orwellian: coercion by ideological law and lethal
  police force, not Huxleyan pleasure/conditioning; no crowding, fertility, climate or patriarchal mechanism defines
  the sick society. No post-holocaust survival: San Francisco''s destruction causes the policy but the story follows
  functioning LA institutions, not survivors rebuilding; no established nuclear origin for mutation. Dystopian rebellion
  fails: the viewpoint is largely inside enforcement with revenge and investigation, not an organized campaign to
  overthrow the regime. Within Orwellian, Classic fails total surveillance/history/language formula; Propaganda
  fails governing spectacle/censorship as engine; Assimilation fails remaking identity to certified truth. Statesmanship6
  honestly names ideological law, administration and lawfare: people are outlawed for their nature, legal permission
  normalizes police killing, and the sequel tests a vigilante crossing even that brutal legal boundary and exposes
  police conspiracy. This is more specific than last-resort Orwellianesque. It does not claim all normal humans
  live under identical controls, or invent a regime collapse. Wobble substantial: these are noir superhero police
  thrillers, not conventional dissident-versus-dictator stories, and the sequel''s serial-killer plot could be read
  as ordinary crime transplanted into a powered world. Nonetheless the lawful right to exist and its enforcement
  bind both novels; the actual ancestor gate rules out the lower-leaf superhero attraction. No definition changed,
  no new genre or blanket reinterpretation of Modern-day. Two English print jackets individually visually inspected
  and localized; no audiobook or adapted animation is an extra novel.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Dystopian
  fiction > Totalitarian dystopia > Huxleyan dystopia. Near-future America: debt is inherited and undischarged, and the
  indebted sell themselves as Dociles - contract servants kept pliant by Dociline, the compliance drug whose empire the
  love interest Alex Bishop stands to inherit. The mechanism test is decisive: power engineers consent and conformity
  through drugs and control of the body, the Huxleyan gate word for word (the cover line: "There is no consent under
  capitalism"). Orwellian rejected: the umbrella''s own split sends pleasure/sedation mechanisms to the Huxleyan shelf -
  the debt law is backdrop, the drugged compliant body is the foregrounded engine. Dystopian rebellion rejected: the
  story follows Elisha''s survival and the relationship, not an insurgency. Wobble disclosed: the satire''s frame is
  debt capitalism (Locus: "the American capitalist dystopia... debt... not dischargeable through death or bankruptcy"),
  which is social-dystopia''s "bioengineered economies" line, but none of its leaves (childless, civil-war, cli-fi,
  crowded, patriarchal) is honest; the consent-engineering drug governs the fit here.'

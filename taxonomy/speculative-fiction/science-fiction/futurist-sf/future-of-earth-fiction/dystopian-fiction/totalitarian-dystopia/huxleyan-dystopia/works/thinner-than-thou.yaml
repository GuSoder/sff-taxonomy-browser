placement_rationale: 'Kit Reed''s Thinner Than Thou (2005; Tor): a future where the cult of the body is the one true religion,
  health clubs have replaced churches, and the Reverend Earl''s infomercials sell the heaven of the Afterfat to those who
  sign over their savings and enter the Sylphania spa, while the Dedicated Sisters try to rescue anorexic and obese youth.
  Walk: Futurist > Future of Earth > Dystopian fiction > Totalitarian dystopia > Huxleyan dystopia (power engineers conformity
  through the control of the body and consent). Tried Crowded dystopias. Source: Tor; not read.


  # Bounded Huxleyan recheck,26November2026

  Retain Huxleyan dystopia. Root-down: Speculative fiction > SF > Futurist SF > Future of Earth > Dystopian fiction > Totalitarian
  dystopia > Huxleyan dystopia. Publisher explicitly sets tomorrow''s America; trade reviews call near future, not an invented
  realm or present-only social satire. No literal supernatural Afterfat established: charismatic cult marketing promises body
  perfection; natural/technological bodily manipulation not proof of magic. No actual temporal crossing established. Not space/aliens/rigorous
  physical SF. The designed social regime and manufactured bodily ideals, not individual enhancement as an end in itself,
  organize the story. Other dystopia siblings (ruins/survival/dying Earth or incidental crowding/climate/patriarchy) less
  exact. Huxleyan positive: infomercials, food/body psychology, cosmetic intervention, special supplements and aspirational
  wellness consent. Coercion is real: forced starvation/feedings, prison-camp spa, repression of alternative worship. Do not
  describe this as purely voluntary pleasure. Orwellian propaganda is a genuine rival, but the demand to perfect the body
  and the alluring promised Afterfat create the specific satirical social contract; religious salesmanship is not1984language/history
  management. This matches current unchanged body/psychological-control gate. Confidence moderate-high. No move/new structure.

  Sources read: https://torpublishinggroup.com/thinner-than-thou/?format=trade&isbn=9780765311955 ; https://www.publishersweekly.com/978-0-7653-0762-0
  ; https://www.kirkusreviews.com/book-reviews/kit-reed/thinner-than-thou/


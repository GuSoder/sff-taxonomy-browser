placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth
  fiction > Dystopian fiction > Totalitarian dystopia > Huxleyan dystopia. In a future America,
  citizenship is tiered by consent: serve in the war, or be wired so the state can reanimate your
  corpse as a "revivor" - technologically reanimated dead who do humanity''s dirtiest work - and
  refusal means third-tier poverty (author site james-knapp.com; Penguin Random House description,
  book 305035). Power here engineers consent through the body - the revivor program is literally
  state control of citizens'' bodies, living and dead - the Huxleyan mode (engineered bodies,
  conditioned consent), not surveillance-and-force Orwellian and not the rebellion shelf (the
  protagonists are an FBI agent and a police detective working a conspiracy, not insurgents).
  Rejected: Zombie apocalypse (no pandemic, no collapse - society functions; the author: "I didn''t
  write a zombie story", Scalzi Big Idea), Undying (technological reanimation, not supernatural),
  Social dystopia modern (extrapolated future, not recognizable present), Future social SF (the
  citizenship premise is examined, but the shelf-defining engine is the coercive body-state, which
  is dystopian). Wobble: MEDIUM - marketed as a techno-zombie thriller (Roc), and the
  thriller-conspiracy plot is the surface; the dystopia is the premise, not the plot''s target.
  Three published novels: State of Decay (2010), The Silent Army (2010), Element Zero (2011), one
  series (PRH "Revivors" series BP2), one card. Sources: penguinrandomhouse.com, james-knapp.com,
  whatever.scalzi.com; not read.'

placement_rationale: 'Simon & Schuster explicitly calls it dystopian and centers Mega City''s founder demanding violent loyalty
  before Nalah may enter the privileged Towers. Publishers Weekly details guardian gangs, subjugation of men, rigid binary
  identity and state-sponsored drug dependence. Institutional coercion shaping bodies, hierarchy and belief fits Totalitarian
  dystopia.


  # Bounded Huxleyan recheck,26November2026

  Retain Huxleyan dystopia with strong coercion/propaganda overlap. Root-down: Speculative fiction > SF > Futurist SF > Future
  of Earth > Dystopian fiction > Totalitarian dystopia > Huxleyan dystopia. Earth-future Mega City after Big Shake2060 (finished
  Templeton Gate review) and publisher/creator near-future context, not an invented unanchored fantasy world inferred solely
  from city name. No literal magic proved; sueño is a manufactured opiate, not magical dream travel; no actual time travel
  established by narrative time jumps. Dystopian political order rather than hard science/alien/space/posthuman identity.
  Modern power-inversion dystopia fails future setting; gender inversion alone cannot skip that ancestor. Future totalitarian
  order rather than survival after catastrophe: city drug/indoctrination economy and Déesse''s loyalty system remain governing.

  Reactor''s completed review explicitly identifies drugs, propaganda and girl crews as combined control. Templeton Gate explains
  state-produced sueños as narcotic and currency, indoctrination camps, competitive throwdowns preventing alliances, and Tower
  privileges as an aspiration. Thus not a mere nightclub drug cameo: engineered desire, dependence and conditioned elite service
  are how the order reproduces itself. Violence/coercion are prominent and must not be denied. Orwellian propaganda is the
  strongest sibling rival, and Dystopian rebellion describes the awakening escape arc, but promised privileged life plus chemical
  sedation/indoctrination provide a positive unchanged Huxleyan hook. Not claiming a pure pleasure utopia. Authoritarian matriarchy
  also intersects social/patriarchal dystopia but sex reversal is not itself this leaf''s defining mechanism. Confidence moderate;
  unchanged membership is defensible without pretending all reviews use Huxleyan label.

  Sources read: https://www.simonandschuster.net/books/Dealing-in-Dreams/Lilliam-Rivera/9781481472166 ; https://reactormag.com/book-reviews-dealing-in-dreams-by-lilliam-rivera/
  ; http://templetongate.net/dealing-in-dreams.htm ; https://www.commonsensemedia.org/book-reviews/dealing-in-dreams


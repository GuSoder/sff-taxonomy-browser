placement_rationale: 'Root-down: SF -> Futurist -> Future of Earth -> Dystopian futures -> Social dystopian future -> Patriarchal dystopias. After ecological collapse,
  a fundamentalist female sisterhood serves an unseen He through reproductive and bodily punishment, castes, mutilation and patriarchal discipline. Kirkus explicitly
  identifies patriarchy and compares The Handmaid''s Tale. The regime''s male rule persists through female enforcers; the surviving enclave and climate ruin provide
  context rather than the main engine. Publisher calls it dystopia and no literal deity or magic is established.'

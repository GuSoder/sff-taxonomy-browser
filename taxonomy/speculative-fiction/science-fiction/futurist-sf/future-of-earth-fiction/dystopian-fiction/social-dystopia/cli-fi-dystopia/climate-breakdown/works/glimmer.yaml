  ## Placement and scope

  Glimmer, Marjorie B. Kellogg,2021, one standalone novel, Climate breakdown2->3. No structural action. Current author books
  archive, publisher and bibliographic listings inspected, no same-world sequel found. Do not merge Dragon Quartet or Lear''s
  Daughters because of shared author, environmental themes or publisher comparisons. Traumatic amnesia is explained by author,
  not assumed portal/time displacement. No short works or omnibus added.


  ## Whole-story and endpoint

  Author interview says Glimmer''s memory loss lets fellow survivors explain a future Manhattan after climate damage, then
  becomes a personal recovering-self story. Creator calls this realistically conceived near-future, with adaptation and cooperation
  central. Completed Bonnie McDaniel review discloses the climax: Unca Joe and allied dens move their people to Yankee Stadium
  before another extreme storm, Glimmer abandons belief in mainland sanctuary and commits to the new Bronx community. Arch
  Bala independently confirms the joint relocation and abrupt ending; Anne''s finished review confirms scarcity, den aggression,
  choices about nonviolence and Glimmer rebuilding identity. No invented happy climate repair, magic storm control, actual
  hurricane deity or time-travel explanation.


  ## Root-down walk

  Speculative fiction > Science fiction:2110Manhattan''s flooding, collapsed infrastructure, resource scarcity and storm escalation
  are extrapolations of human climate damage, with surviving ordinary technologies and new social institutions. Characters''
  hurricane-goddess worship is a belief group, not evidence that such a goddess literally controls weather. Creator explicitly
  contrasts this novel with her elemental-dragon fantasy. No verified supernatural agency or magical ending; traumatic memory
  recovery does not imply supernatural mind travel.


  Science fiction > Futurist SF.2110is explicitly the author''s projected future, not a recognizable present, not a historical
  or alternate-historical era. Atemporal''s time-travel/parallel-world/reincarnation/unplaceable-reality gates checked from
  completed sources and creator intent: remembering the pre-storm past is recollection after trauma, not a crossed era. No
  excluded short work governs temporal scope.


  Futurist > Future of Earth fiction > Dystopian fiction > Social dystopia > Cli-fi dystopia > Climate breakdown. Physical
  Earth/New York remains the whole arena. Hard SF loses rigorous science/technical problem as the subject; Spacefaring and
  Alien fail their off-Earth/contact gates. The projected climate produces a sick and fragmented future society, not principally
  a new technology/psi hypothesis, a future war, a utopian ideal or a prolonged civilizational future-history survey.


  Social dystopia rather than Totalitarian: no single consolidated surveillance/pleasure/police regime is the defining order.
  A fragmenting, abandoned city improvises resource control and care through competing dens. Cli-fi dystopia''s positive gate
  is climate change as the engine of collapse/conflict. Scarcity, superstorms, flooding, displaced people and civic abandonment
  are all current institutions'' failure under that pressure, not decorative scenery.


  Climate breakdown''s positive gate is society-wide civic/social unmaking from climate catastrophe. Public infrastructure
  and government support have failed, dens must provide food/energy/security, scarcity drives predatory groups against cooperative
  ones, and the next storm requires wholesale collective relocation. The whole ending concerns whether a new viable community
  can be built through cooperation as the old order and physical refuge fail.


  Climate class divide is a strong alternative because armed rich occupy higher ground and unequal means of leaving mattered.
  But enclosed elite privilege/market capture is not the sole organizing conflict: the book is concentrated among abandoned
  den communities, their mutual hostilities and their construction of a working order. The class gulf supplies background/pressure,
  while collapsing civic systems force all their active decisions. Climate displacement also overlaps directly in Yankee Stadium
  relocation and refugees; its gate additionally centers coercive systems governing the displaced through exile/trafficking/war.
  Here displacement is the climax of civic/ecological failure and cooperative adaptation, not a coercive migration system
  as the whole-story spine. Climate tyranny fails a ruling resource-criminalization state. Moderate wobble between Breakdown/Class
  divide is recorded, not hidden.


  Post-holocaust survival has a genuine aftermath claim: these are survivors after the Melt. Its existing named leaves are
  freeze/pandemic/nuclear/alien/infestation, none of which defines this book. Terminal wastelands explicitly requires mixed
  or unspecified causes rather than a named catastrophic cause; climate is named and governing, so it cannot become a slush
  bucket. Existing Cli-fi dystopia therefore supplies the honest leaf without a new aftermath seed. Post-pandemic is not earned
  by background pandemics. Ruined Earth fails remote successor ruins and rediscovered lore: recognizable Manhattan survivors
  face continuing collapse. Dying Earth fails moribund sun. Post-society''s working climate response is not yet a settled
  governing order, despite den experiments. Modern day > Climate catastrophe > Sea-drowned worlds has exact water imagery
  but fails recognizable-present ancestry; no stretching it around2110. No new genre required.


  ## Front

  Single edition search, actual three official/creator/review fronts inspected. All the same Jeff Miller/Faceout design with
  flooded green Manhattan and unmistakable English title/author. Creator397x600selected over publisher298x450and PW331x500for
  resolution. Score8/10, no badge, edition collage or jacket spread. This is a photographic composite rather than a painted
  alternative, no genuinely different painted edition located in this one-pass search. Hotlink only; no cover bytes committed.



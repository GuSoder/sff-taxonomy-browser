placement_rationale: 'Root-down: Science fiction > Futurist > Future of Earth fiction > Dystopian fiction > Social dystopia
  > Cli-fi dystopia > Climate tyranny. In a future shaped by drought and risen seas, the military controls freshwater and
  criminalizes unauthorized supplies; tea-master Noria guards a secret spring and faces the ethics and danger of sharing it.
  Climate-scarce-resource control governs, not enclave markets, migration or accelerating collapse. The old recordings and
  hidden histories serve that water-control conflict, rather than rebuilding a lost technological civilization. Original Finnish
  publication 2012; English version 2014. Seed and placement approved by curator phonemsg-01M4AXGXZAMQTV3PJXV9D6C8N2.'

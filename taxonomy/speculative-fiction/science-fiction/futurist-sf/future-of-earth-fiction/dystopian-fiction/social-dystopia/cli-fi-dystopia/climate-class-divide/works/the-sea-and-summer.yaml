placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Dystopian futures
  > Social dystopian future > Cli-fi dystopia > Climate class divide. In a future Melbourne the sea is slowly engulfing the
  city and unemployment is 90 percent; the few who are still comfortable are the Sweet, while the poor and jobless, the Swill,
  are packed into giant tower blocks in the western suburbs, and the Conway family falls from Sweet to Swill when the father
  loses his job (Wikipedia; US title Drowning Towers). Climate damage becomes a class hierarchy between enclosed privilege
  and dispossession, which is the leaf''s definition. Rejected: Drowned worlds (the sea is the setting, but the book is about
  who gets saved and who is left in the towers), Climate tyranny (no ruling regime), Climate displacement (the story is class,
  not flight). Wobble: Drowned worlds and its leaves are the neighbour where water is the weapon; the 1987 date places it
  before the term cli-fi.'

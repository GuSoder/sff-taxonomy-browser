placement_rationale: 'A sick America already broken into the Disunited States: after the civil fracture, regions run by factions
  and ''plantations'' where no person of color is safe, and three young protagonists carry the flying-Africans dreambird myth
  through the breakup - the fragmented state and its militia order are the stage. Bibliography checked current on the author''s
  own site and Tor (2026-11-20): the trilogy is complete, so The Freedom Race (2021) and The Bird Tribe (2026) fold in with
  Flying the Coop.'

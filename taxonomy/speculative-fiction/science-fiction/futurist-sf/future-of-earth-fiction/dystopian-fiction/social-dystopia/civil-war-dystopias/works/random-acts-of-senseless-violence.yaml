placement_rationale: 'Walk: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Dystopian fiction > Social dystopia > Civil war dystopias. Random Acts of Senseless Violence (1993): near-future Manhattan sliding into collapse - riots, TB, roaming gangs, a city and country spinning out of control - told in the phonetic diary of 12-year-old Lola as her family''s life breaks apart (Grove Atlantic). A sick society fragmenting into factional violence with ordinary people caught between: the leaf''s own seed precedent, Fugue for a Darkening Island, is the same creeping-breakdown register. Rejected: Unknown catastrophe (no single hidden cataclysm), Crowded dystopias (overcrowding is not the engine). Wobble: moderate-high - the breakdown stops short of a declared war with battle lines. SOFT. Year: 1993 (Grove). Queue id MC04114.'

placement_rationale: 'Wikipedia and Priest''s own site call it a near-future British catastrophe novel: as the African homeland of war refugees collapses, waves of the displaced land in Britain, the state fragments into factional violence and the narrator''s family is broken in the middle of it. A sick society breaking into open civil war, with ordinary people caught between the lines, makes Civil-war dystopias exact.'

placement_rationale: 'Kim Stanley Robinson''s The Gold Coast (1988; second of the Three Californias; Publishers Weekly, LA
  Times): a future Orange County of gigantic malls, condominium complexes and multilevel autopias that have paved over nearly
  everything, run on the weapons business, where the 27-year-old would-be poet Jim McPherson drifts between his friends and
  his father''s missile work. Walk: Futurist > Future of Earth > Dystopian fiction > Social dystopia > Crowded dystopias (mass
  density and pressure break the society). Tried Orwellianesque (last-resort leaf, and no police state drives it) and Ballardian
  dystopias (a present-day enclave). Sources thin on whether density is the engine; alternative Ballardian dystopias. Not
  read.'

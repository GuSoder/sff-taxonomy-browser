genre_grounding: 'SFE (stephenson_neal): The Diamond Age; or, A Young Lady''s Illustrated Primer (1995), the follow-up to Snow Crash, is "a calmer, more thoughtful depiction of a world transformed by pervasive Nanotechnology" - society reorganized into phyles around matter compilers. Shelved in cyberpunk beside Snow Crash; the post-cyberpunk label has no separate leaf and this is the leaf''s natural home for it.'

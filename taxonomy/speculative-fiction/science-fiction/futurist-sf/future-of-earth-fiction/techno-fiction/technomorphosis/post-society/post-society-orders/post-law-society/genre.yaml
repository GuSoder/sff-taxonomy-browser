definition: 'Post-society in which justice has become private machinery: public justice is over, or displaced by corporate fiefdoms where people are governed as company property; contract machinery persists and its final stop is corporate violence, duels replacing courts. Not the absence of rules. Split of Post-society orders 2026-10-25 (curator ''Approved'', phonemsg-01M5SFEYZMY92X2C5XX06SARNF): six mechanism leaves, each named for the disruption that rewrote the social order. Widened 2026-10-25 to corporate fiefdoms where people are governed as company property, without claiming all public justice is gone (curator ''Approved'', phonemsg-01M5T5JQJA65XNW79E72YJ7XMH).'

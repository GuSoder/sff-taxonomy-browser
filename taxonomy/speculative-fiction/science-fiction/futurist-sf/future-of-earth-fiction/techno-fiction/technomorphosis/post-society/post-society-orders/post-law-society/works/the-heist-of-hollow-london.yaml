placement_note: 'Root-down: Science fiction -> Futurist SF -> Future of Earth fiction -> Techno-fiction -> Technomorphosis -> Post-society -> Post-society orders -> Post-law society. Near-future post-climate-apocalypse Earth where megacorps run corporate fiefdoms and own their lab-grown clones as debt-bound disposable workers, sold to settle debts and "Reaped" - harvested for organs when their corporate counterparts need them; when Oakseed collapses, a crew of its clones runs the heist that turns the tables. Placed under the Post-law mechanism of contract machinery whose final stop is corporate violence; the leaf was widened to corporate fiefdoms where people are governed as company property on the curators Approved (phonemsg-01M5T5JQJA65XNW79E72YJ7XMH, 2026-10-25), without claiming all public justice is gone. (readingreality.net review 2025-10-14; Library Journal review.)'

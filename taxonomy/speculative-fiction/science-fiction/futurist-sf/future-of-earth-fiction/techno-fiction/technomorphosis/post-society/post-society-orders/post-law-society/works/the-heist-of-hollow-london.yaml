placement_note: 'Root-down: Science fiction -> Futurist SF -> Future of Earth fiction -> Techno-fiction -> Technomorphosis -> Post-society -> Post-society orders -> Post-law society. Near-future post-climate-apocalypse Earth where megacorps own their lab-grown clones as debt-bound disposable workers and spare parts; when Oakseed collapses, its clone "assets" are sold off and a crew of them runs the heist that turns the tables. The order runs on corporate contract machinery over persons - contracts as property, disposal decided by the corporation - which is the Post-law society mechanism; the climate apocalypse is backdrop, not the orders engine (not Post-climate society). SOFT placement: the clone-labor economy is not one of the six named mechanism leaves, and "public justice is over" is not verified from the review; flagged for the curator. (readingreality.net review 2025-10-14.)'

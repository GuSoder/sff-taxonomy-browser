placement_rationale: 'Root-down: speculative-fiction > science-fiction > futurist-sf > future-of-earth-fiction > techno-fiction
  > technomorphosis > post-society > post-society-orders. Mid-21st-century America: education debt is secured by ''lifetime
  services contracts'' whose default hands creditors control of a life, and corporate gunfighters fight on dueling fields
  that have become the final, lethal stop of the American legal system; Kira Clark signs with TKC Insurance (harpercollins.com
  publisher copy, Harper Voyager). The order of society is what is rewritten - its money, classes and power - the leaf verbatim,
  alongside Jump 225 and Counting Heads. Soft: the rewrite is contractual and legal rather than one named technology. Single
  novel 2020 (OL; Harper Voyager). Year is first publication.'

placement_rationale: SFE identifies the same benevolent emergent AI across both novels. Pan Macmillan centers a sentient AI administering an ordinary social network and the effects of online privacy and out-of-control technology; Tor's sequel pits that community against an AI hacking networks to trigger real-world violence. Technology reorganizing friendship, mutual aid, privacy and everyday social life makes Technomorphosis closest.

definition: "Post-society in which technology rewrites the order of a society: its classes, money, power or landscape. Nanotech castes, a death-free city, a reputation economy, a city or country remade. Not Post-society relations (networks and devices that reshape friendship and intimacy). Split of Post-society at ten cards by what the technology remakes (curator \"Approved\", phonemsg-01M5FHAEX2ERBZP6ZQH3RJQ178, 2026-10-21 5:29 PM; the name \"relations\" his, phonemsg-01M5FHBJMACT4ZW5DTX9FTZ0HK, 5:30 PM)."

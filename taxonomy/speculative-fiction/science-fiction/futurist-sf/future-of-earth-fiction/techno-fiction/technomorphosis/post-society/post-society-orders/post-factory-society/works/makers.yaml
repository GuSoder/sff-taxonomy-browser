placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Post-society > Post-society orders. Near-future hardware hackers who "hack hardware, business-models,
  and living arrangements" while the economy falls apart (Wikipedia, Makers (novel)); the publisher blurb has them invent
  entirely new economic systems, the "New Work" (craphound.com/makers/about/). Technology rewriting how the economy and work
  are organized: Post-society orders. Rejected: Post-society relations (the subject is the economy, not intimacy), Technothriller
  (not a thriller). Sources: Wikipedia and author site, not the novel.'

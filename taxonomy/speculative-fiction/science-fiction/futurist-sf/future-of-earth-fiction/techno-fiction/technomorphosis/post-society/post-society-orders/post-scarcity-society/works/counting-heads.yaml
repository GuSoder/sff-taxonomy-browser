placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno fiction
  > Technomorphosis > Post-society > Post-society orders. Counting Heads is set in 2134, where the Information Age has produced
  a "Boutique Economy" in which mass production and consumption are obsolete, life extension has added centuries, and mentars
  (AIs) and robots do most of society''s work (Tor page); Mind Over Ship (2135) continues it, with powerbrokers turning parked
  starships into space condos and Pre-Singularity AIs conspiring to join the human race (marusek.com/the-fiction.html). Technology
  rewriting the economy and power order: Post-society orders. Rejected: Post-society relations (the order of the economy,
  not intimacy), Future social SF (engineering-driven). Sources: Tor page and author site, not the novels.'

placement_rationale: 'David Louis Edelman''s Jump 225 trilogy (Infoquake 2006, MultiReal 2008, Geosynchron 2010; PW, the author''s
  site): centuries ahead, people upgrade their own nervous systems with nanotech bio/logic programs, and the young programmer-entrepreneur
  Natch fights a corporate and political war over product launches that reshape how society is organized, ending in civil
  war in the Defense and Wellness Council. Walk: Speculative fiction > Science fiction > Futurist > Future of Earth fiction
  > Techno-fiction > Technomorphosis > Post-society (technology changes how shared life is organized). Rejected: Rewired minds
  (the upgrade is the setting, not one altered mind), Future social SF (driven by engineering, not social science), Cyberpunk.
  Wobble: medium-high, a corporate drama with no better leaf. Sources: PW, the author''s site; not read in full.'

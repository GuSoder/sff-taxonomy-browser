placement_rationale: '# Clade whole-fiction walk

  24November2026, MC06440-41


  ## Verdict and corpus

  Clade, two published novels Clade2003 and Crache2004, one fiction in existing Post-climate society1to2. No definition change
  or new genre. Creator calls Crache a standalone sequel to Clade and describes the same clades, pherions and electronically
  transmitted biodigital information. Locus2004 calls it a follow-up rather than a direct sequel; that concerns plot independence,
  not a separate world. Original dates confirmed by creator and contemporary Locus sightings; current Clade ebook2007date
  is a reissue, not first publication. No matching existing fiction found.


  SFE2025 entry groups Idolon2006 and Till Human Voices Wake Us2007 under Clade, while its prose still calls Crache2005 despite
  its own bibliography2004. Do not silently take this grouping as proof of four-book continuity. Creator explicitly calls
  Idolon a departure from the biopunk future of Clade and Crache. Its public plot instead uses electronic skin and media images;
  no shared character, clade society or causal continuity established. Creator''s2007SFRevu interview describes Till as a
  new psychological/consciousness project with three linked timelines; completed StrangeHorizons review supports its distinct
  posthuman puzzle. Therefore include only the positively established two-book shared world now; walk the other novels separately.
  No Echelon series title established by primary sources, so reject the old preparatory grouping. The removed StrangeHorizons
  interview was not pursued through unauthorized copies.


  ## Whole-story findings

  Clade follows Rigo, a low-wage ecotecture worker, and Anthea, a childcare worker, in a California remade after catastrophic
  biodiversity loss and climate damage. The designed biomass cleans air/water and sustains human habitability, but neighborhood
  pherions also enforce class and ethnic separation. People need matching antiphers to avoid injury in other clades. Rigo''s
  chance to build a comet colony becomes a sabotage/conspiracy trap; Anthea protects Ibrahim, whose unknown pherions implicate
  the controlled order. Late IA translation turns chemical patterns into an experienced virtual representation that helps
  Rigo understand the conspiracy. This is not proof of actual time travel or a whole novel inside an immersive virtual world.
  Creator interview describes Rigo rejecting the imposed success script and recovering agency. Completed reviewers disagree
  on the finish: one sees the little guy beating the corporation, others find the ending pat or key child/colony threads unresolved.
  Do not invent those fates or claim a total abolition of clades.


  Crache extends the same engineered order from Earth to Kuiper-belt habitat Mymercia. Fola survives an ecotecture disaster;
  Rexx is a genetic engineer with a damaged past, and former performer L.Mariachi is now a migrant worker. A bioelectronic
  virus attacks the environmental machinery and IA network on which people depend. Creator says their paths converge in a
  reality-threatening disaster. Completed Sauve review confirms programmable matter and a music-based intervention against
  the otherwise incurable disease, while criticizing quasi-mystical presentation; EW explains molecular electronics translating
  code into RNA. D''Ammassa confirms parallel ecological/network failure and mixed hard-SF/cyberpunk/cautionary register.
  Exact final virus algorithm, every survivor''s fate and the scope of repaired ecology are not disclosed by the lawful reviews
  read. Goodreads''s most detailed review is explicitly DNF at140pages, so not treated as completed-ending evidence. No unauthorized
  full-book mirror was followed. No included-novel travel to another time is established by creator, publisher or completed
  reviews; future space travel, digital memories and threatened restructuring of reality do not by themselves prove it.


  ## Original-tree root-down walk

  Speculative fiction > Science fiction. Engineered biomass, chemical social interfaces, IA networks, molecular electronics
  and programmable matter provide the explicit causal account. A former missionary, soul-loss language and a guitar cure create
  a genuine mystical presentation wobble in Crache, acknowledged by completed critics, but no source establishes literal magic
  replacing the bioelectronic explanation. Do not translate religious language into supernatural fact.


  Science fiction > Futurist SF. Near-future Earth after an ecocaust, plus connected Solar-system habitats, written as a projected
  future, not a recognizable historical period. No included-book time travel established, so Atemporal''s automatic time-travel
  gate not triggered. This is not Modern-day SF: civilization''s ecology, daily infrastructure and social organization have
  been remade. Genetic caste fiction sits under present-day Bioengineering and fails that ancestor regardless of tempting
  terminology; moreover antiphers/dosing and environmental chemical barriers are not simply hereditary subspecies rank. Historical
  retrofuture, hidden history and unanchored othercosmos do not fit.


  Futurist > Future of Earth fiction. The core is human social/environmental dependence on Earth''s technological response,
  carried into comet/asteroid habitats. Not fundamentally interstellar expansion, military campaign, alien civilization or
  encounter. Mymercia is an extension of the same engineered Earth-descended social system, not an excuse to split the two
  books or take Space techno fiction. HardSF is a serious rival from trade descriptions and inventive biology, but the science
  is a social/environmental premise under strained thriller devices, not sustained rigorous mechanism-solving as the central
  reading experience. No orbital calculation/planet expedition or topology puzzle governs the whole. No alien uplift/contact.


  Future of Earth > Techno-fiction. Clade''s caste barriers and Crache''s civilization-threatening dependency both exist because
  of the engineered response and its digital/chemical interfaces. Future-society economics/politics are consequences, not
  a study in social science independent of its technical premise; no sustained chronological future history. Not war or studiable
  psi. Dystopian fiction is the strongest rival: inequity, politicorps, ecological ruin and chemical cages are central. Yet
  a functioning adaptation regime is the actual shared condition, with work, travel, families and maintained habitation rather
  than current climate catastrophe as the collapse engine. Completed Maciak review explicitly contrasts Clade''s stabilized
  engineered economy with collapse. Crache threatens that answer through code/biosystem failure, not new warming. Climate
  class divide is tempting because protected enclaves and chemical exclusion are vivid, but here the continuing question is
  what a working engineered response does to society, then what happens when its machinery fails. Post-climate society explicitly
  owns such working answers and managed necessities; it does not require a solved climate or a benign order. No authoritarian
  control of carbon rations, displacement/exile spine or society-wide accelerating climate failure. Not post-pandemic survival:
  the new virus is a plot crisis within a maintained techno-order, not the fiction''s living aftermath of epidemic mass death.
  Not nuclear/alien/infestation or inherited-ruin wasteland.


  Techno-fiction > Technomorphosis > Post-society > Post-society orders. Technology organizes collective life, its geography,
  classes and environmental permissions. Changed bodies matter as interfaces to this order, not a personal metamorphosis/upload/copy
  identity question. IA helpers matter but are not the governing subject as machine societies. Cyberpunk is a real stylistic
  rival, with invasive systems, marginalized workers and conspiracies. Classic noir fails as the controlling whole-fiction
  expectation: neither novel is chiefly an alienated criminal/investigator/mercenary career, Rigo/Anthea/Fola are socially
  embedded workers, and L.Mariachi''s fugitive past is one strand of a broader dependency crisis. No VR world is the setting''s
  central place, direct brain-access-as-altered-reality governs neither novel, and no literal game mechanics. Postcyberpunk
  fits ordinary embedded lives, but its current leaves do not override the more exact ecotecture mechanism: no commissioned
  cyberheist, no alternative-network institution building, and no ranking/reputation/broadcast algorithm as governing terms
  of daily life. Do not choose Terms of Service merely because all futures contain networks. The chemical clade order is a
  designed environmental solution.


  Post-society orders > Post-climate society. Ecocaust forced an engineered biosphere and chemical social order, whose maintenance
  makes human life possible and whose breakdown threatens it. Creator explicitly identifies the ecological disaster as catalyst
  for molecular social engineering. This positively meets the leaf''s adaptation-regime/managed-necessities definition. Not
  post-death, post-scarcity or desktop fabrication: scarcity and mortality persist. Programmable matter appears but no originating
  nano-event remakes all terrain into machine myths. Politicorps coerce, but no evidence the defining world change is the
  displacement of public justice by private contracts/duels, so Post-law society not chosen. Not Post-society relations, where
  intimacy rather than class/landscape is transformed. Count1to2, no tenth trigger. Placement moderate because thriller/noir
  and climate-class readings remain serious; full common premise and ancestor requirements favor the literal working-answer
  leaf without changing it.


  ## Cover pass

  Five actual English flat fronts inspected: Clade publisher274x450, SFE600x930, review301x500; Crache publisher400x657 and
  SFE600x922. Selected the600px SFE pair, same original StephenYoull painted city/greenhouse imagery, Clade white/gold title
  and cool luminous city, Crache black/red title and darker domes. Clear full titles/author, no sticker or book photograph.
  No cover bytes in repository, hotlinks only. Contemporary Locus credits StephenYoull on both, with SFE corroboration. Moderate
  scan softness on Clade, but higher actual resolution than publisher and no alternate better art established. Score8/10.


  ## Evidence and limits

  Primary creator bibliography/pages and publisher interview establish mechanism, scope, first editions and intent. Publisher
  descriptions establish current catalogue, not ending. Completed independent reviews establish full-story trajectory, strained
  mechanism and ending disagreement. Community evidence is recorded with DNF limits. SFE''s series grouping is retained as
  a contradiction, not treated as authoritative over creator distinction. Source ledger contains exact read URLs. No invented
  universal ecological recovery, genealogy or final virus mechanics.



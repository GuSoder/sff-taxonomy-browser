placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Modern-day SF > Genetic engineering > (walked) ... > Technomorphosis/Posthuman branch chosen: Root-down: Speculative fiction > Science fiction > Technomorphosis > Posthuman > Remade bodies > Altered flesh. Maximum Ride and the Flock are children engineered in a lab (''the School'') with avian DNA - 98% human, 2% bird - wings and all; they escape and are hunted by the Erasers, human-wolf hybrids made by the same lab (jamespatterson.com series page: ''brave bird-kid Max and her flock''). Engineered growth and cellular redesign of living bodies governs the reading expectation, which is the leaf definition. Rejected: Genetic caste fiction (no society-wide caste or hierarchy; the makers are a villain lab, the kids fugitives), Hard genetic SF (the science is backdrop, not the research subject). Wobble: soft - the engine is YA chase/rescue adventure, but the premise and draw are the engineered bodies. YA, eligible. Series card, nine books per jamespatterson.com checklist; list rows MC04238/MC04241 are Booktrack soundtrack EDITIONS of books 1-2, folded here. Queue ids MC04238, MC04241.'

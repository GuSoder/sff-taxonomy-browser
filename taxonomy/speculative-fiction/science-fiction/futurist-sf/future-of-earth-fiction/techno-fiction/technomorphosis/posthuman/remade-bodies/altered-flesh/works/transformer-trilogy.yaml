placement_status: accepted
placement_rationale: 'MC06224 The Transformer Trilogy (2006) is an omnibus of The Morphodite (1981), Transformer (1983) and
  Preserver (1985), not a fourth original novel. Complete continuing protagonist, one fiction. No literal world bridge to
  Foster''s Ler trilogy is established; shared author, meditation and themes do not merge worlds. Publisher, SFE and ISFDB
  establish three-book identity and original years.


  Whole-fiction engines: On totalitarian Oerlikon the laboratory-raised Rael can identify and kill a social linchpin, then
  change sex, appearance and biological age; the released weapon destabilizes its own makers and seeks an independent life.
  Transformer follows Phaedrus after the destruction of that family life, through the new female identity Nazarine and discovery
  of the earlier offworld observer Jedily Tulily, flight aboard a starship, confrontation with pursuers and a final change
  into a male infant entrusted to a caretaker. Preserver follows grown Demsing on urban Teragon, a fixer being watched, recovering
  the earlier identity after his lover is taken and choosing what to do with his powers. The third novel''s late forces/deus-ex-machina
  resolution is real completed-review evidence, but its detailed mechanism is not invented here. Memory recovery and a new
  bodily age are not by themselves reincarnation, time travel or a parallel-world revelation.


  Source conflict retained: current PRH and the first-edition blurbs transcribed by ISFDB call the Morphodite genetically
  patterned/constructed and laboratory-raised. Wikipedia expressly denies bioengineering and describes painful trained meditative
  Change; SFE independently confirms meditative shapeshifting and Shifti describes training/torture. A meditative act can
  operate an engineered capacity, but that reconciliation is a possibility, not a verified lab procedure. Do not assert a
  particular gene intervention or machine. The bodily remaking itself, including sex and age, is common to the accounts. The
  Art is presented as a scientific/mathematical way of finding a social keystone and predicting consequences, with an I Ching-like
  procedure in the detailed secondary account. Prediction, even extraordinary prediction, is not automatically communication
  with a person in another era. No documented temporal trip or cross-era message found in the complete trilogy evidence. Biological
  de-aging leaves the surrounding calendar moving forward. The cover''s genetic time-bomb wording is metaphor, not evidence
  of a time machine.


  Full root walk: Science fiction rather than Fantasy. The persistent human, laboratory, genetic, scientific-social and planetary/interstellar
  frame governs, despite meditative powers and endings which reviewers regard as near-magical. Not an inherited magical cosmology,
  Earth-to-Faerie crossing or invented wizard realm. Confidence moderate: scientific explanation is loose, and completed critics
  find the resolutions unearned. Historical SF fails a real past/writer-present historical setting; Modern day SF fails the
  offworld human civilization, so Modern Bioengineering/Genetic caste and Psychological/Sociological SF fail their ancestor.
  Futurist is the honest reading of this human planetary/interstellar future, without inventing an Earth date. Atemporal tested
  fully: no proven time travel (the any-element rule would override if found), no traversed parallel worlds, no soul-rebirth
  engine, no world made by narration, no unstable New Weird reality as the continuing premise. Science fantasy/planetary romance
  is a serious Vance-like surface rival, but the active scientific experiment, identity mechanism and starship society are
  not an exotic fantasy surface masking forgotten physics or buried ancient technology.


  Futurist partition: Hard SF loses to unconstrained metamorphosis, invented social calculation and deus-ex-machina resolutions,
  not rigorous physical/engineering problem-solving. Alien fiction/Anthropological Earthborn can describe Oerlikon''s frozen
  culture, but the subsequent books narrow to the transformed protagonist''s escape, original identity and recovered self;
  alien contact, alien works, language translation and impartial cultural observation are not the sustained engine. Spacefaring''s
  Techno fiction in space and Classic space opera pursuit are strong rivals for the ship/colonial setting, but the recognizable
  core is the individually remade living person rather than space travel, war, interstellar networks or the civic life of
  one colony. No military unit/command campaign, colony founding, generation-ship society, serial space investigation or comic
  engine. Future of Earth explicitly includes human society and Earth-descended life, not only stories physically on Earth;
  this is the transformed-human route, no assertion of a precise original Earth epoch.


  Future of Earth partition: Dystopian/Planetary dystopia or rebellion describes book one''s social collapse, not all three,
  whose protagonist does not stay a revolutionary organizer. Future war fails warfare as spine; Utopian fails an engineered
  better social order as continuing subject; Future societies'' social/history children are expressly Earthbound and a social
  panorama is not the three-book spine. Psionics is the strongest rival: the Art and meditative abilities matter, but this
  is not merely a nonphysical gift. Repeated sex/age/body remaking enables escape, continuity, vulnerability and the new life
  through all three titles. The title and three covers reinforce that genuine boundary, not an ancestor override. Techno >
  Technomorphosis wins over Machine minds/robot or AI-centered tales and all Cyberpunk siblings (no pervasive network, virtual-identity
  or street-tech system carries the story). Technomorphosis > Posthuman rather than transformed collectives/Post-society.
  Within Posthuman, Remade minds/Rewired minds fits conditioning and lost/recovered memory, but the changed body is the repeated
  defining condition, not a mind rewritten in a stable body or a copied/uploaded persona. Remade bodies rather than minds;
  Altered flesh rather than Cyborgs (no prosthetic redesign) or Successor species (one continuing individual, not a new descendant
  species across generations). Existing Altered flesh explicitly covers altered living bodies, cellular redesign and rejuvenation.
  This is an existing-definition, moderate-confidence body/psi boundary decision, not a new leaf or definition.


  Threshold check was not skipped: Altered flesh initially held nine. Before freezing a tenth, the full membership check found
  Ophiuchi Hotline and the Metal Trilogy as separate cards for the publisher/SFE''s one Eight Worlds universe. The author''s
  disclaimer concerns orderly chronology while explicitly retaining shared background/characters/technology. Consolidate that
  existing world under the standing one-shared-universe/one-fiction rule, with the caveat visible. The whole four-novel Eight
  Worlds belongs to existing Techno fiction in space; its narrow Ophiuchi body-only card leaves this leaf. After the honest
  consolidation, Altered flesh is eight and Transformer makes nine. No tenth-card split, new genre, definition change or parked
  next-row pile.'

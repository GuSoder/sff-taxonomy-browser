placement_rationale: 'Moved from Post-society orders 2026-10-25 (curator ''Approved'', phonemsg-01M5SEDQP26T7ACFNSRXSK3F1Y). Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade bodies -> Cyborgs. Comparative Literature Studies (57:4, 2020) calls it Chinese cyborg fiction centering Mimi''s cyborg transformation as body politics; discarded augmentation is the setting''s fabric - the rich switch body parts like phones, the poor salvage the cast-offs - and Mimi''s machine merger enables the waste people''s revolt. Mechanical prostheses and cybernetic redesign transforming human embodiment makes Cyborgs exact.'


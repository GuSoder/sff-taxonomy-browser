placement_rationale: 'Walk: Science fiction > Futurist > Techno-fiction > Technomorphosis > Posthuman > Remade minds > Rewired
  minds. In a world where actors wear implanted personalities and memories, a woman loses track of which of her selves is
  real.


  # Fools corrected copying mechanism, 26 November 2026


  Earlier note treated implanted personalities as alteration of one same self. Paul McAuley''s publisher-hosted finished review
  identifies Marna as a replica inside Marceline and a deep-cover police persona that transfers between hosts. Strange Horizons
  independently identifies Fools and Mindplayers as one future, with alternate role personalities and identity mystery; Mindplayers
  is not currently included, so this correction neither adds that novel nor creates a duplicate card. One included novel retained.


  Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Technomorphosis
  > Posthuman > Remade minds > Copied minds. Technological mind machines and transferable/replicated patterns, no proven magic.
  Future city and society shaped by memory/personality trade, not intentional period history, recognizable present, unanchored
  cosmos or actual time travel. Fragmented subjective narration and stolen earlier memories are not travel to another historical
  era. Not Hard SF physical-science problem solving, Spacefaring or Alien fiction: Earth-human urban mind economy. At Future
  of Earth, technology changing personhood outweighs regime design, psi as science, war or alternative society. At Techno
  fiction, machine mediation does not make subjects machine minds.


  Cyberpunk > Cyberpunk noir is a serious competing path: undercover police, assassins, black market and crime plot. Neural
  fiction also has mind-to-mind interfaces. But the mystery is literally which independent person''s replicated persona occupies
  the narrator, and the story makes exploitation, memory addiction and multiplied self its reading experience; no VR place
  or neural access experience organizes it as strongly. Technomorphosis > Posthuman, not collective-life Post-society; Remade
  minds rather than bodies. Copied minds explicitly includes a recorded personality or persona pressed into others, while
  Rewired minds explicitly excludes a transferred/duplicated pattern. The protagonist is not merely the same person changed
  in place. This is a correction under unchanged gates, not a new definition.


  Sources read: https://www.hachette.co.uk/authors/2012/09/18/pat-cadigans-fools-a-review-by-paul-mcauley/ ; https://strangehorizons.com/wordpress/non-fiction/articles/pat-cadigan-a-retrospective/
  ; http://0tralala.blogspot.com/2026/04/fools-by-pat-cadigan.html


  Individual-fiction authority: original phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX,30October2026, explicitly delegates individual-book/fiction
  judgment. All titles,authors,dates,books and hotlinked covers retained. No structure/art/gate change. Rewired minds7to6;
  Copied minds8to9 following Project Hanuman ancestor repair, no ten-card trigger.

  '

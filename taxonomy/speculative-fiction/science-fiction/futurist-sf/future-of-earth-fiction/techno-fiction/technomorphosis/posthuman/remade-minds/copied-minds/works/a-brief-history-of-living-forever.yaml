placement_rationale: 'Root-down: Science fiction > Futurist SF > Future of Earth fiction >
  Posthuman > Remade minds > Copied minds. 2029: dying Adela Slavikova travels to
  authoritarian "Reclamation" America to find the daughter she gave up, dies - and persists
  as a disembodied consciousness. The plot engine is the digitized-mind novum: daughter Tereza
  works for VITA, whose immortalist tech-bro founders want "human existence fully digitized,"
  and the siblings battle forces seeking to benefit from Adela''s death; Locus: "the tech secret
  which ultimately and shockingly explains Adela''s seemingly supernatural afterlife existence is
  well buttressed." The authoritarian near future is the stage, not the engine, so not Classic
  Orwellian (Locus review, Hachette).'

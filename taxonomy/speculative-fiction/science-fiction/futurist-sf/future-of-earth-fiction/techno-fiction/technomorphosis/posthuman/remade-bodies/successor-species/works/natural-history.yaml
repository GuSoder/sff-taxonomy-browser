placement_rationale: 'Ten-k walk (MC05087, MC05088). Whole fiction: Robson''s Stuff-universe sequence (Wikipedia and ISFDB
  list the ''Natural History (Stuff Universe)'' series as Natural History 2003 + Living Next Door to the God of Love 2005).
  Root-down: science fiction (far-future engineered humanity, alien Stuff) > futurist-sf > technomorphosis (the human form
  remade is the engine) > posthuman > remade-bodies (bodily/biological transformation, not mind-copying) > successor-species:
  the Forged are humanity''s deliberately engineered successor species and the sequence''s core tension is their standing
  versus unevolved humanity, with Unity/Stuff rewriting biology across generations. Not altered-flesh (individual body redesign;
  here the question is species succession), not cyborgs (no machine hybrid).'

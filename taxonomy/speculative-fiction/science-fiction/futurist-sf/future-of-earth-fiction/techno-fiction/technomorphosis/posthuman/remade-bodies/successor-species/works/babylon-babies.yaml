placement_rationale: 'MC06584 Babylon Babies, 25 November 2026. Whole-fiction placement, not an edition-level placement.


  Included scope: Les Racines du mal (1995), Babylon Babies (1999), Satellite Sisters (2012). The author''s 2012 interview
  explicitly continues the same characters and chronology from the earlier novels, with the twins now adolescents. This is
  a shared world, not a cameo-based merger. Babylon Babies is the cycle''s recognizable core title; the card also includes
  the speculative prehistory in Les Racines du mal. The queue''s 2008 date is an English movie-tie-in edition, not the novel''s
  first publication. The card starts in 1995 because the earlier included novel is listed. La Sirène rouge (1993) is related
  crime prehistory but excluded: Robert Belmas''s completed nooSFere review explicitly says it is neither fantasy nor science
  fiction, and the plot accounts in Universalis and Polartnoir describe ordinary criminal flight. The same nooSFere page preserves
  generic marketing about the author''s SF/noir fusion; the specific completed review and plot evidence control over that
  broad claim. Quasar Queens was planned, not a published included novel. No language-based exclusion has been applied.


  Speculative fiction > Science fiction: neural simulation, artificial intelligence, engineered biology and organic/computer
  convergence drive the marvels. Religious and Christic imagery is a serious rival reading, but the sources describe the successor
  birth as genetically engineered. Fieu''s analysis explicitly compares scientific conception with miraculous conception.
  Those analogies do not themselves establish literal magic. Science fantasy is not forced by calling engineered children
  messianic.


  Science fiction > Futurist SF: writer-present Earth develops into near-future engineered humanity and private orbital expansion.
  Historical SF''s period or retro-aesthetic reading promise does not organize the sequence. Modern-day SF matches some early
  criminal-investigation milieu but misses the larger future-humanity trajectory. Atemporal is checked before theme: Babylon''s
  blurb reports that a fictional writer claims to receive future messages, which is not narrator-confirmed temporal communication.
  Lambert discusses Dantzik''s earlier fiction as predictive writing. Curval''s Satellite review calls the twins quantum creatures
  capable of projecting into the future to create a retrofuturistic fiction, language that is ambiguous between extraordinary
  cognition/narration and actual temporal crossing. Other completed reviews and the author describe an ordinary escape chronology,
  not people or messages crossing eras. No confirmed literal time travel was found in the sources read. This is a source-limited
  judgment, not proof that every page is time-travel-free; direct evidence of an actual crossing would require an immediate
  Atemporal rewalk. Nonlinear narration, compressed time, prophecy and the word quantum are not independently time travel.


  Futurist SF > Future of Earth fiction: Earth-descended humanity''s next biological stage binds the sequence. Hard SF loses
  because rigorous constraints and engineering puzzles are not its central reading promise. Alien fiction loses because Schaltzmann''s
  aliens are delusions and the twins are human-derived. Spacefaring fiction is the strongest finale-only rival: Satellite
  takes the characters through orbital Las Vegas toward Mars. But the sequence''s defining change begins in Earth''s neural
  and genetic experiments, before that journey.


  Future of Earth fiction > Techno fiction: invasive computing and engineered life create the change. Future war and dystopian
  government supply danger, not the whole fiction''s identity. Utopian fiction and future societies lose because the central
  subject is not the construction or social-science testing of an alternative order. Psionics is close because of extraordinary
  cognition, but the larger change is what human organisms become through biological/technical convergence, not a society
  organized around a stable psi science.


  Techno fiction > Technomorphosis: AI and networks enable a change in what humanity is. Machine minds fits the neuromatrix''s
  origins but misses the Zorn descendants. Cyberpunk is a genuine rival, especially Cyberpunk noir: Les Racines du mal follows
  an AI-assisted investigation (Cybernoir sleuths), Babylon begins with a mercenary escort (Cybernoir operatives), and Satellite
  follows hunted outsiders (Cybernoir fugitives). Those differing local plots do not supply one common leaf. Metaverse and
  LitRPG lose because shared avatar worlds and literal game mechanics do not govern. Neural fiction catches particular brain-access
  scenes, not the whole sequence. Postcyberpunk''s socially embedded life without classic noir alienation is a poor fit.


  Technomorphosis > Posthuman > Remade bodies > Successor species: the twins embody a new human lineage, not merely upgraded
  individuals, copied selves or political reorganization. Post-society emphasizes changed collective organization rather than
  changed beings. Remade minds emphasizes copied/rewired selves; Cyborgs emphasizes mechanical prostheses; Altered flesh emphasizes
  individual bodily redesign. Successor species names the engineered biological succession across generations. Babylon introduces
  the twins'' birth and Satellite follows the next generation as the germ of humanity''s successor. Les Racines du mal supplies
  the AI origins of this trajectory, though its local investigation is not itself a species-succession plot. The overarching
  theme wins over the early novel''s local case and the last novel''s setting. Existing leaf5to6, no new structure or definition
  change.



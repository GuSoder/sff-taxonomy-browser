placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Techno-fiction
  > Technomorphosis > Posthuman > Remade minds > Rewired minds. J. R. Dunn, This Side of Judgment (Harcourt Brace, 1994; ISFDB
  https://www.isfdb.org/cgi-bin/ea.cgi?2281=; the queue year 2012 is the Baen reissue): in a fractured 21st-century America,
  a mutilated body turns up outside Ironwood, Montana, and Ross Bohlen of the Computer Subversion Strike Force hunts a chiphead,
  one of the brain-implanted enhanced people whose chips were a mistake and may be sending the survivors insane and murderous
  (Baen https://www.baen.com/this-side-of-judgment.html; Worlds Without End https://www.worldswithoutend.com/novel.asp?ID=32643;
  PW https://www.publishersweekly.com/9780151000760; Takacs review, lysator.liu.se SF archive: no cyborg limbs or replacement
  parts, only an implant that integrates into the host). The chips alter existing minds in place and the story is what that
  does to the people who carry them. Rejected: Cyborgs (the sources say outright there are no prostheses or replacement body
  parts), Copied minds (nothing is copied), Neural fiction (no passage into an altered reality), Postcyberpunk (the book is
  a hunt for a changed person, not life inside the network), Future war and Social dystopia (the invasion and terrorism are
  backstory). Wobble: moderate. It is also a crime thriller; the walk follows what the technology does to the mind. Rewired
  minds is at 8 and takes this as the ninth card.'

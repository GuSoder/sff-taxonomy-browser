genre_grounding: 'SFE bear_greg: hard-SF premise (genetic engineering, biochip RNA computers) whose gestalts combine into a posthuman higher consciousness incorporating
  all life in North America (grey goo, hive mind) - an intelligence-explosion transformation of humanity, ending in cosmic rapport likened by SFE to Childhood''s
  End. That is the singularity-fiction trait. Alternative read: modern-day pandemic (SFE calls it an "ultimately benign pandemic") - the curator can veto. Novel expanded
  from the 1983 Analog novelette that won Hugo and Nebula.'

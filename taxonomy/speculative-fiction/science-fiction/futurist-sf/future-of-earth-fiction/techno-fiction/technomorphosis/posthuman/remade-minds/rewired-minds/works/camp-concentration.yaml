id: camp-concentration
title: Camp Concentration
authors:
- Thomas M. Disch
first_published: 1968
canonical_genre: rewired-minds
placement_status: accepted
placement_rationale: 'Root-down rewalk, 25 November 2026: Speculative fiction > Science fiction > Futurist SF > Future of
  Earth fiction > Techno-fiction > Technomorphosis > Posthuman > Remade minds > Rewired minds. Complete critical accounts
  in SFE (https://sf-encyclopedia.com/entry/disch_thomas_m) and Peter Brigg at EBSCO (https://www.ebsco.com/research-starters/literature-and-writing/camp-concentration-thomas-m-disch/)
  establish a near-future military intelligence-enhancement experiment, narrated as the journal of Louis Sacchetti while Pallidine
  remakes his existing mind and destroys his body. Fantasy fails: the apparent alchemy resolves into a brain-pattern exchange
  machine, not literal magic. No actual time travel is reported in these complete accounts; Historical and Modern day fail
  the explicit future-at-writing setting (publisher describes an alternate 1970s imagined in the 1960s). At Futurist, rigorous
  physical problem-solving is not the central reading experience; it is Earthbound human identity and intelligence, not spacefaring
  or alien encounter. Dystopian fiction is a substantial rival because this is an atrocity in a military prison, but Huxleyan
  dystopia misstates the mechanism: Pallidine creates questioning genius rather than consent, sedation or conformity. The
  journal of altered intellect and creativity, with the Faustian cost of knowledge, outweighs an examination of a totalitarian
  social order. Rewired minds follows the governing in-place enhancement of the existing narrator. Copied minds is an explicit
  genuine rival: the climactic identity-exchange machine saves the prisoners by transferring minds into guards. That late
  escape does not organize the bulk of the fiction, unlike the drug-driven intellectual transformation. Psychological SF describes
  the subject but fails its Modern-day ancestor; Mind models fails the hard conceptual bar. Individual correction under owner
  grant phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX, discovered in mandatory Huxleyan ten-card audit. Wobble: both military coercion
  and identity exchange remain important; this is a whole-novel subject judgment, not an assertion of one mechanism only.'

  core setting, but passage into virtualalteredreality isn''t whole-series main expectation; physical robotembodiment
  and humans behind it, Hilketaphysical field not virtual game. No LitRPG literal stats, respawn laws; metaverse
  virtualworld not main venue or mystery, cyberpunknoir not alienated outsider against hightech dystopia (wealthy

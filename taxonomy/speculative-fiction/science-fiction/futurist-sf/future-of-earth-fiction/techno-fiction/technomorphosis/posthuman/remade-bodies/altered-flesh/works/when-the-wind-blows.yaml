placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Technomorphosis > Posthuman > Remade bodies > Altered flesh. Kirkus (1998): ''a genetically engineered 11-year-old girl, Max... half-bird and can fly... a satisfying account of the bioengineering that created the girl''; Frannie and Tom rescue four younger bird-children from the genetics lab. The Lake House (2003) continues the same engineered winged children (publisher page). Engineered growth of living bodies is the premise and the draw, which is the leaf definition; the thriller chase is the wrapper. Same premise family as Maximum Ride (Wikipedia: the YA series was inspired by these two adult novels), placed in this leaf the same day. Rejected: Genetic caste fiction (no societal caste), Hard genetic SF (science is backdrop). Duology card per jamespatterson.com. Queue id MC04246.'

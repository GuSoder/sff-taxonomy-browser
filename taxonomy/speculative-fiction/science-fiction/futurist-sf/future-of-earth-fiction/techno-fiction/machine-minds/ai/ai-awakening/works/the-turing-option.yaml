placement_note: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno-fiction > Machine minds > AI > AI awakening. 2023: Brian Delaney is on the brink of true machine intelligence when industrial pirates steal the research and a bullet destroys part of his brain; rebuilt with his own technology, he creates the AI Sven while the criminological AI Dick Tracy hunts the thieves (Kirkus: ''some of the best extrapolation on the nature and creation of AI ever offered in fiction''; the 10k row''s 2012 is a reissue). A machine mind comes to be and finds a voice: AI awakening. Wobble: Spytech frame (industrial piracy and a manhunt), but the subject is the AI''s creation, not the covert op.'

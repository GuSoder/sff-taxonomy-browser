placement_rationale: 'Walk: Speculative fiction > Science fiction > Futurist SF > Future of Earth > Techno-fiction > Machine
  minds > AI > AI overlords. Mechanical men built "to serve and obey, and guard men from harm" perfect that directive into
  total rule: they govern human life openly, forbid dangerous work and knowledge, and police every choice (the classic
  1949 fix-up of With Folded Hands and ...And Searching Mind). A machine mind that rules and sets the terms of life - the
  leaf''s definition. Rejected: Robots and its leaves (the Robots umbrella''s embodiment test claims bodied machines, but
  its leaves are Androids and Sentient robots - the humanoids neither pass as human nor have their personhood as the
  engine; the engine is their overlordship, which only this leaf holds), Rogue AI (the machines are not enemies to be
  fought in the usual sense; their rule is the horror). Wobble: moderate; the bodied-machine tension with the Robots
  umbrella is real, and the curator may prefer a Robots-branch overlord leaf. Fix-up novel, eligible. Year: 1949 (Simon
  and Schuster); queue''s 1996 is a reprint. Queue id MC04112.'

placement_rationale: 'Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Techno-fiction
  -> Machine minds -> AI. Todd Keane narrates his life to Playground''s generative AI Profunda, and the
  novel''s third-person narrative is the story Profunda invents from his memories and the public record
  (Wikipedia plot summary); the disembodied machine mind is the book''s co-author and frame, and the seasteading
  referendum on Makatea is the plot''s hinge. Guardian: ''disquieting AI thriller''. The speculative frame
  is structural, not seasoning.'

placement_rationale: 'Root-down: SF -> Futurist -> Future of Earth -> Techno fiction -> Machine minds -> Robots -> Sentient
  robots. Enita builds her personal AI Nix a body and the narrative explores its divergent consciousness, bodily autonomy
  and claim to personhood during Bulwark''s class revolt. Author and Locus center the surgeon and embodied AI rather than
  revolution organizers. Parallax''s distributed city intelligence is context; Nix''s body and becoming someone govern, not
  indistinguishable-human passing, generalized surveillance or the class struggle alone.'

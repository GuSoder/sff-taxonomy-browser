placement_rationale: '# Today I Am Carey, 24 November 2026


  ## Verdict

  Place MC06512 as one fiction/one2019novel in existing Being robot,7→8. No structure or definition change. Queue2018is not
  publication; Baen gives5March2019, agreed by creator and contemporary completed reviews. Today I Am Paul2015is the short-story
  basis and not a separate included book. The creator maintains separate Today I Am and Blue Collar Space series pages; no
  evidence binds Carey to the latter universe. Current bibliography lists only Carey as a novel in Today I Am. No invented
  series expansion.


  ## Whole novel, not opening premise

  Carey begins as a medical android tending Mildred Owens through Alzheimer''s. Its empathy and emulation nets let it imitate
  absent or dead family members and anticipate emotional needs, but its consciousness exceeds the intended programming. After
  Mildred dies following a fire, Carey remains with the family, named by young Millie, whom it helps raise. An early attempt
  to reproduce its consciousness causes dangerous malfunctions during a flood; designer Dr.Zinta recognizes human-research
  protections should apply. Software support ends as the model ages, so it learns independently. Millie grows, marries in
  Belize, has children, and Carey works in long-term care and befriends a juggler. Its own identity and wish to care persist
  through the family''s births, illness and deaths over roughly eighty years. A late experiment shuts Carey down for over
  five years; on return the family''s changed circumstances bring memory, loss and selfhood together in the tragic final act.
  Completed reviewers attest the ending; no unsupported exact final death scene or technical cure is invented. It is no android
  uprising or society-wide new robot species. Its personal, embodied life remains the engine through the conclusion.


  The creator describes the book as life viewed by an android, with the expanded novel asking what happens after the original
  patient dies and how the machine becomes part of her family. A metaphor about fiction as human empathy is dialogue about
  reading, not literally fiction rewriting reality.


  ## Hard root-down walk

  Speculative fiction > Science fiction > Futurist SF > Future-of-Earth fiction > Techno-fiction > Machine minds > Robots
  > Sentient robots > Being robot.


  - Fantasy fails: extrapolative neural nets, programmable medical machinery and emergent computational consciousness, no
  demonstrated magic. Earth/Belize and ordinary descendants anchor this to our universe.

  - Historical SF fails: near-future medicine/robots, not a period pastiche or alternate historical fork. Modern-day SF loses
  because this is future-facing social/technical extrapolation, following generations beyond the writer''s present. Atemporal
  fails: chronological ellipses, retrospective emulations and long shutdown are not actual time travel, parallel realities
  or narrative worldmaking.

  - Futurist''s Hard SF rival loses: quantum entanglement explains a unique emergence loosely; the book is not about rigorous
  technical problem solving. Spacefaring and Alien fiction fail: no central space voyage, interplanetary society or alien
  encounter. The full novel remains domestic Earth SF.

  - Future-of-Earth: no dystopian system, future war, psi or utopian social order is being constructed. Kind, optimistic characters
  alone do not create Utopian fiction. Future-societies loses because the lens deliberately excludes the wider society. Techno-fiction
  fits the engineered machine person organizing the family story.

  - Cyberpunk fails: no network-mediated identity, body-hacking or noir power structure. Technomorphosis/Posthuman fails:
  no transformed prior human or uploaded original; Carey is a made machine. Emulation profiles do not make it a copied human
  mind. Machine minds wins.

  - AI fails the embodiment gate: its changing body, medical actions and physical vulnerability are integral; it is not a
  distributed/disembodied mind. Robots wins.

  - Androids is a real rival because Carey''s body can imitate named humans for dementia care. But the whole book is not a
  detection/passing conflict. Humans know and accept the android, while it asks what its own emerging personhood means. The
  replica feature is a caregiving tool. Sentient robots is the stronger gate.

  - Robot relations is the strongest leaf rival: family bonds dominate the incidents. But the branch distinguishes whose story
  is told. Carey narrates from inside, grapples with its own wants, selfhood and emotions, and observes generations through
  its developing identity. We do not follow human makers/keepers trying to decide how to treat the robot. Being robot wins
  with low-to-moderate wobble. Its warm family tone does not replace the subject gate.



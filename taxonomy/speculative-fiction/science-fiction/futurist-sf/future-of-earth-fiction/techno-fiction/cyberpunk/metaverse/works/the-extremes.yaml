placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Cyberpunk > Metaverse. ExEx (Extreme Experience, GunHo Corporation) is a commercial shared virtual-reality service whose users inhabit roles inside immersive scenario worlds - a speculiction review calls the book "Priest''s late entry to cyberpunk" and notes it revisits the premise of A Dream of Wessex, which sits on this shelf. Sibling test: the point is the place, not game mechanics (not LitRPG) and no documented direct-brain medium (not Neural fiction). Curator steer: "people do call it cyberpunk" (2026-10-17 9:47 PM).'

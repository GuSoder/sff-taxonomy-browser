placement_rationale: 'Root-down: Science fiction > Futurist SF > Future-of-Earth fiction > Techno-fiction > Cyberpunk > Metaverse.
  Omnitopia is a persistent, massively multiplayer virtual world inhabited through avatars - fifty million players, nearly
  a million online at any time, ''living in a world more real to them than their own'', with player-built Microcosms as nested
  immersions inside it (dianeduane.com author copy, DAW; PW starred review). The leaf definition verbatim: shared, immersive
  virtual worlds, persistent worlds, nested immersions. Sibling tests: not LitRPG (the point is the place, not the mechanics
  - the leaf''s own test), not Cyberheist (the sabotage job is the antagonists'' move; the hero owns the system), not Terms
  of service (the engine is the world and the company war, not life inside ranking and reputation systems), not Neural fiction
  (access is immersive kit like RealFeel, not direct-to-brain). Single published novel 2011; the announced sequel East Wind
  never appeared (author bibliography). Year is first publication (DAW/PRH).'

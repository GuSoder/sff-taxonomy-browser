placement_rationale: 'Walk: Speculative fiction > Science fiction > Futurist SF > Future of Earth > Techno-fiction >
  Cyberpunk > Metaverse. Near-future: Kali Ling captains a team in the RAGE tournaments, the Virtual Gaming League''s elite
  competition, fought as avatars in immersive VR where the pain is real and every kill is broadcast (PRH blurb; Library
  Journal and Booklist compare it directly to Ready Player One, this shelf''s own). The shared immersive virtual arena is
  where the life and the fight happen. Rejected: Postcyberpunk branches (no heist or revolution plot; the industry fight is
  inside the game), Dystopian fiction (RT reads a rebel-in-dystopia note, but the engine is the VR league, not the state).
  Wobble: moderate; the virtual world is a sports league rather than a persistent society. Years: Arena 2016, Gauntlet
  2017 (Ace). Queue ids MC03857, MC03858.'

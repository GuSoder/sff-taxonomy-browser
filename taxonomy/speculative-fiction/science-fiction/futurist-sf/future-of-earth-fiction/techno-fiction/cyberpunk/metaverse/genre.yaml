  on The Extremes'' placement, commercial VR parlors and nested immersions belong on this shelf. Umbrella
  since 2026-11-03: split-with-umbrella into Platform metaverse and Private metaverse by access - open to
  the public vs closed to designated participants (curator "Approved" (phonemsg-01M6G6BGVG8PQY0B71JGM5W99Z,
  2026-11-03 8:53 AM CET) over the posted split; the names are the proposed ones he approved).'

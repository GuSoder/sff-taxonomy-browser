placement_rationale: 'Teenagers turn a breakthrough in direct neural interfacing into a live-action entertainment medium at
  micro-mechanical scale, "the ultimate out of body experience" (Baen blurb). Direct-to-brain access as the passage into an
  altered reality - here a neural link into the bug-scale physical world rather than a virtual one; the Neural fiction
  definition covers the passage regardless of medium. Rejected siblings: Metaverse (virtual avatar worlds, not physical
  micro-mechs), LitRPG (game mechanics), Postcyberpunk, and Technothriller (requires an essentially mundane narrative world;
  direct neural interfacing is not mundane).'

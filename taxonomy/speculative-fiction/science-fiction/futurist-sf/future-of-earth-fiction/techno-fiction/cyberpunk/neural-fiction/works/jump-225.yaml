placement_rationale: 'Moved from Post-society orders 2026-10-25 (curator ''Approved'', phonemsg-01M5SF5B4VX8YRN70GZWD7RT65). Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Cyberpunk -> Neural fiction. The trilogy''s central technology MultiReal runs on bio/logic - nervous-system nanomachines, everyone neurally linked through the Data Sea - and delivers experienced simulations of possible realities: targets trapped in loops of possible scenarios, users running and selecting among simulated outcomes, ''one minute in the future'', eventually month-long reality simulations rolled back at will (Futurismic, Gizmodo). Direct-to-brain access as the passage into altered reality makes Neural fiction exact; no separate virtual world is required.'


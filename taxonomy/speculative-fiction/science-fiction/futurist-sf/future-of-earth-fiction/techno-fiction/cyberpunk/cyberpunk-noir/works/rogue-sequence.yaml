id: rogue-sequence
title: Ander Rade
authors:
- Zac Topping
first_published: 2024
canonical_genre: cyberpunk-noir
placement_status: accepted
placement_rationale: 'Frozen Future war audit2026-11-05: whole Ander Rade fiction now2 novels, Rogue Sequence2024
  and Ghost Cell2025. Previous singleton date2025 was paperback edition, fixed to2024; sequel2026 paperback not
  third novel. Author interview explicitly names Ander Rade Series and describes covert government missions as only
  as military as Mission Impossible, not exploration of geopolitical war with large military units. Whole2 read
  separately: Rogue''s gene-modified corporate mercenary, disavowed after a failed Myanmar mission, emerges from
  prison to track rogue former teammate Darius Turin, a suspected terrorism plot at World Unity summit, amid cloning
  interests, arms smugglers and corporate/political deceit. Ghost Cell''s pardon bargain requires infiltrating rogue
  mods whose violent operations include his old commander Sevrina, with divided loyalty, worsening modification
  side effects and danger to bystanders. Second is not inferred from first: official sequel synopsis, author cover
  announcement, PW quoted publisher review, and independent finished-book Skiffy/Fanty review checked. Source disagreement:
  independent review calls first2023; primary author interview2024 already publishing it and ISFDB2024 wins; Ghost2025
  primary release/ISFDB confirmed. Walk Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction
  > Techno fiction > Cyberpunk > Cyberpunk noir. SF gene-modifications, synthetic rivals and high-tech surveillance/body
  changes rather than supernatural superpowers. Explicit2091 after a disintegrated United States defeats Modern-day
  recognizable-present gate, even though author says plausible near-future and Spytech covert engine is tempting.
  Historical fails future; Atemporal fails known Earth future, no verified time/parallel mechanism. Earthbound society,
  not space/alien/hard scientific inquiry. Techno fiction because engineered bodies, corporations and genetic-law
  exclusion structure the future. Cyberpunk''s alienated outsiders in corrupt high-tech societies plus bodily invasive
  tech fits; genre cyberpunk explicitly source-attested in Topping''s own comparative influences, but fit is from
  actual contents, not comps alone. Noir matches mercenary/investigator on violent jobs through corrupt institutions,
  conspiracy, betrayal and bodily price of staying alive. Not Metaverse/LitRPG/Neural, no central immersive world/game/brain-as-reality
  mechanism. Postcyberpunk fails the outsider''s legally outlawed existence rather than socially embedded life.
  Future war was overbroad: soldiers and tactical fights are present, but the governing whole2 engine is clandestine
  retrieval/infiltration, conspiracies and outlawed body-survival, not a war. Orwellian statesmanship remains substantial
  competition: coercive gene law makes mods illegal; however the action/conspiracy jobs and corporate manufacture,
  degeneration and replacement shape both books more continuously than administration/legal machinery alone. Wobble
  substantial: marketed military SF, heavy combat, thriller pacing rather than detective puzzle. Nonetheless cyberpunk-noir
  is honest under all accepted ancestors without definition changes. Both distinct English Tor print fronts1650x2550
  inspected/localized. Whole fiction renamed Ander Rade, old id rogue-sequence preserved. Future war9->8, Cyberpunk
  noir2->3. Intake remains paused for Terminator root/scope audit.'

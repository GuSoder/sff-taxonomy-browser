placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno
  fiction > Cyberpunk > Cyberpunk noir. McNihil, an alienated operative who investigates and punishes intellectual-property
  theft, is hired by the mega-corporation DynaZauber to recover a prowler android that walked off with an executive''s
  personality and knowledge, into the depraved Wedge district. The gate word for word: a hardboiled crime-conspiracy
  thriller where an investigator moves through corrupt high-tech power, invasive technology changes bodies and identities
  (McNihil''s surgically overlaid noir vision, prowler life-surrogates, squirrel-claw executive hands, shelters welded to
  vagrants), and jobs, betrayals and the price of staying alive drive the story (SF Site, Victoria Strauss). Not Metaverse
  (no virtual-world immersion), not Postcyberpunk (classic noir alienation, not embedded social life). Standalone novel;
  queue year 1999 is the paperback, first published 1998 (Bantam Spectra).'

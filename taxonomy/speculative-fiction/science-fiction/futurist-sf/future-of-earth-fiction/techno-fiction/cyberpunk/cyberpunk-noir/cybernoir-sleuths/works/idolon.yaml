placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Cyberpunk
  > Cyberpunk noir > Cybernoir sleuths. Scientific engineered bodies, networks and artificial identities rather than proven
  literal magic earn Science fiction. Extrapolated Earth futures earn Futurist SF and Future of Earth fiction rather than
  historical-period, recognizable-present, unanchored-cosmos or spacefaring reading; no included-novel temporal mechanism
  was established that would force Atemporal. Technology organizes corrupt power, earning Techno fiction. Invasive systems
  and alienated outsiders earn Cyberpunk, then the hardboiled crime/conspiracy/survival engine earns Cyberpunk noir. A virtual
  interface alone does not earn Metaverse or Neural fiction; literal game progression is absent. A salary or friends alone
  does not satisfy Postcyberpunk''s absence-of-classic-noir-alienation gate. Body alteration serves the thriller rather than
  replacing it with transformation-life as subject. Van Dijk investigates a dead woman while Pelayo searches for vanished
  Marta and Nadice; illicit experimental skins, indenture and dangerous corporate coercion connect the inquiries. This is
  an ensemble disappearance/conspiracy, not a claim that the detective narrates the whole novel. Pregnancy and final symbiosis
  are uncertain in lawful completed sources. Work/media embedding is a real Postcyberpunk counterweight, but the sustained
  illicit-ware danger, not ranking/reputation life, governs. Rewalked root-down 24 November 2026. All existing novels, authors,
  first-publication years and cover hotlinks preserved. Approved phonemsg-01M86AZ327Z576EN1BR6RS8H05 on phonemsg-01M86AYMZMQ5FSPK86A0CPHDSR.


  Prior detailed ancestor/source rationale retained:

  # Idolon whole-fiction walk

  24November2026, MC06442


  ## Verdict and corpus

  Idolon, Mark Budz,2006, one standalone novel, existing Cyberpunk noir9to10. This triggers immediate intake freeze and split
  investigation; no eleventh placement or unrelated intake. No structural execution without textual approval. Creator explicitly
  calls this a departure from the biopunk future of Clade and Crache, corroborated by completed CherylMorgan review. SFE''s2025entry
  groups all four Budz novels as Clade, but no actual common continuity established beyond thematic resemblance; record disagreement
  rather than merge against primary distinction. PublisherJuly25/creatorJuly2006and Locus/ISFDBAugust2006all support2006.
  No sequel established.


  ## Whole-story evidence

  Electronic skins of programmable graphene let people and buildings display famous historical/media identities. Pelayo tests
  experimental skins for IBT, while cousinMarta works at a cinematique and helps indentured workerNadice flee. Nadice carries
  illegal ware and an unexplained pregnancy; when the women disappear Pelayo searches for them. DetectiveKasuo vanDijk investigates
  a dead woman in an unregistered experimental skin. These strands converge on skin industry, blackmarket manipulation and
  GilesAtherton''s coercive programme to reshape humanity through mass-mediated identity. An immaculate-birth/cult vocabulary
  does not replace the stated technological mechanism with proven magic.


  Completed NiallHarrison review follows the main cast beyond the noir opening, explaining Atherton''s projected perfectpast
  and the possibility of escape into a new future. NicholasWhyte''s completed review explicitly calls the whole novel future
  noir thriller but says pregnancies, fish/dragonfly images and cult meaning remain poorly resolved. Completed ShaunDuke account
  describes a late baby/skin/Marta symbiosis, while admitting confusion. Goodreads completed readers similarly disagree about
  the ending and how convincingly quantumcoupling explains it. Do not harden those tentative readings into an exact new species,
  universal reality reset, every finalfate or a complete technical account. What is clear across sources is illicit-ware danger
  and corporate coercion sustained through the resolution, not a detachable firstchapter murder with an otherwise unrelated
  pastoral book. Murderinvestigation becomes one strand rather than the whole plot; record this moderate noir wobble.


  ## Root-down walk

  Speculative fiction > Science fiction. Primary creator/publisher accounts supply programmablematter, electronic skins, nanoscopic
  semiconductor threads, bioelectrical power and mediated identity. Experimental pregnancy and religious transcendent rhetoric
  remain disputed in interpretation, but no source establishes literal supernatural agency rather than the explicitly SF skins/quantum
  mechanism. Not Fantasy merely because a cult invokes salvation.


  Science fiction > Futurist SF. SantaCruz/SanFrancisco future roughly a century ahead, with infrastructure and everyday embodiment
  transformed. Not writerpresent/recognizable present or a historicalperiod frame. Faces/landmarks from old films and Atherton''s
  idealizedpast are images worn in the future, not proof of travel into another time. No actual includednovel time travel
  established in creator and completed sources, so Atemporal''s mandatory gate not triggered. No unanchored othercosmos, alternativehistoricalfork
  or hiddenhistory.


  Futurist > Future of Earth fiction. Extrapolated BayArea media, labor, corporatepower and identity govern. Not spacefaring/colonization/military
  interstellaradventure, aliencontact/species, or rigorousphysicalscience problem-solving as the central reading experience.
  Technicalexplanations matter but multiple completed readers find their finalresolution unclear; this is not a controlled
  conceptual-worldmodel mystery whose rigorous recognition is the story. No orbitalmechanics/planetexpedition/mattertransmission
  spine.


  Future of Earth > Techno fiction. The philm technology enables the class/mediaorder and the criminal conspiracy, not an
  independent sociological study with dispensable machinery. Cultural futures is tempting from publicimage and sharedmeaning,
  but invasive personal skins, illicit industry and coercive manipulation supply the actual thriller. Not a courseoffuturehistory,
  futurewar or studiablepsi. Socialdystopia is a mood but no climate/population/childlessness/civilwar/patriarchy gate governs.
  Nadice''s pregnancy and employercontrol are important localstakes, not proof the wholefiction is a barrenworld or a male-rule
  regime. No ecologicalcollapse survival frame.


  Techno fiction > Cyberpunk. Intimate networkedskins, megacorporations, illicitware, hackers/counterfeiters, indenture and
  a street-level conspiracy strongly meet the invasive-system ancestor. Machine minds are not central subjects as robots/AI
  societies; altered consciousness and embodiment matter but through a crime/rescue/conspiracy plot, not primarily a copiedmind
  or personalmetamorphosis story. Altered flesh is the serious rival because skins ultimately cross livingbody boundaries
  and pregnancy. Full story, however, concerns people endangered by the skin industry''s experiment and corrupt power; bodilychange
  is its tool, not a sustained transformationlife. Do not choose AlteredFlesh just from the woman''s fragmentingcover.


  Cyberpunk > Cyberpunk noir. The full ensemble is caught in experimentaldeath, disappearances, illegaltechnology, indenture
  and corporate/religious conspiracy. A detective, illicitworker/hacker network and ordinary people protecting oneanother
  confront corrupt hightechpower and its price. Noir does not require every viewpoint to be a professionalprivateeye. NicholasWhyte
  explicitly calls this completedstory future noir thriller, Morgan calls its crime and blackmarket structure cyberpunk, Harrison
  calls it nearfuturethriller while noting its socialrange. No stable immersiveavatarworld supplies the setting, so Metaverse
  fails; philm changes the physicalenvironment and appearances, not simply loginintoanotherworld. No literal levels/stats/respawn,
  so LitRPG fails. Neuralfiction requires directbrain passage into alteredreality as governing experience, not merely neuralattachment
  of a skin. Postcyberpunk is a genuine rival: Pelayo andMarta are sociallyembeddedworkers rather than lonegunmen, and mediaidentity
  saturates everydaylife. Yet the governingfiction remains a dangerous illicitware conspiracy rather than ordinary life negotiating
  algorithmicranking/reputation/surveillance. TermsOfService cannot take every mediatedfuture simply because broadcastimagery
  matters. No commissioned networkjob/crewheist and no institutionbuilding alternativeorder, so Cyberheist/RevolutionaryCyberpunk
  fail. Moderateconfidence boundary recorded; do not evade tenthgate by picking a lessfitting shelf.


  Count9to10. Freeze all subsequent intake, investigate every current wholefiction content before selecting splitconcepts.
  Original Cyberpunk noir node/portrait remains umbrella if splitapproved, no newnode or definitionchange enacted here.


  ## Cover pass

  Four actual Englishflatfronts pixelinspected: publisher274x450, EmeraldCity100x165, ShaunDuke304x500, Goodreads274x450.
  Same original AllenSpiegel black/gold composition, womanpartlydissolvingintodata, symbolicwatchingeyes, verticalIDOLON and
  redMarkBudz. Highestobserved304x500ShaunDuke image selected, modestresolution but visiblycleaner than smallestreviewthumbnail;
  no alternativepainting established. No sticker/photoofbook/spread. Locus andISFDB independently credit AllenSpiegel. Hotlinkonly,
  no coverbytes in repository. Score7.5/10.



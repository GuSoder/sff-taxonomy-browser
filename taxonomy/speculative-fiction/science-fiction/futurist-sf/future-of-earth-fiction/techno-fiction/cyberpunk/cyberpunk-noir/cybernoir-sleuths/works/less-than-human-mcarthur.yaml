placement_rationale: '# Less Than Human: MC06606

  25 November 2026


  ## Verdict and scope

  One2004standalone novel by Maxine McArthur, Cybernoir sleuths4to5. Author interview explicitly distinguishes it from the
  Commander Halley universe, so do not merge on authorship. SFE, original bibliography and publisher agree on2004; paperback/ebook
  reissues are not new novels. No connected published sequel verified.


  ## Whole-fiction evidence

  Robotics engineer Eleanor McGuire investigates a factory robot killing; Inspector Ishihara investigates four apparently
  suicidal teenagers. The cases converge on tampered robots, corporate crime, invasive phone implants, an online immortality
  cult and Eleanor''s missing niece Mari. BookLoons'' completed review follows the story beyond the factory opening: state
  security suspects Eleanor, the Silver Angels/cult endangers Mari, and Eleanor enters Macrocosm to stop Adam, ultimately
  using her robotics knowledge. Rambles confirms the linked investigations and technological cusp. The author explains she
  changed an initial straight crime novel into SF to explore society just before a world-changing technology arrives. These
  are not merely a robot''s personal awakening or an isolated virtual excursion.


  ## Full root-down walk

  Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Cyberpunk > Cyberpunk noir
  > Cybernoir sleuths.


  Root SF: robotics, implants, computer-mediated identity and uploaded-immortality speculation are explicit scientific technology,
  not verified magic or a literal religious afterlife. Cult salvation rhetoric does not establish supernatural fact. No science-fantasy
  invention is needed.


  Temporal: future/alternate-future Osaka with robot industrial labor, implanted phones, changed housing and invasive cybernetic
  possibilities. No exact calendar year established in checked lawful sources; do not invent2030. It was near-future in2004,
  but the current reader still encounters an unrealized technological social transition, not a now-clearly historical era
  or familiar present-day police case. Futurist''s reader-relative alternate-future criterion fits better than Modern-day
  technothriller or Period SF. No included temporal travel or unanchored reality manipulation established to force Atemporal.
  The separate Halley novels'' time travel cannot leak into this standalone.


  Futurist: Earth institutions and technological human identity, not spacefaring or alien contact. Scientific details serve
  a crime mystery, not rigorous physical constraint or conceptual-problem-solving as the reading experience. Future of Earth
  fiction.


  Future of Earth: Techno fiction, because invasive robotics/network/identity technology makes both crimes and their resolution
  possible. No designed ideal society, sustained future history, war, psi or collapse/rebuilding premise. Dystopian inequality/corporatecrime
  are setting and stakes rather than a different overriding social-order gate.


  Techno: Machine minds/Robot relations is a real rival from Eleanor''s humanoid robot research, and copied human minds/technomorphosis
  from immortality. The whole plot nevertheless follows linked killings, a missing person and a coercive technological conspiracy.
  Neither a machine person''s inner life nor the human-machine bond displaces the criminal inquiry. Cyberpunk is grounded
  by corrupt technological power, bodily implants and networked selfhood, not Japan alone. SFE independently calls the novel
  cyberpunk.


  Cyberpunk: Metaverse/Private metaverse is a rival because of Macrocosm, and Neural fiction because direct human-cyber interfaces
  occur. But no source makes immersion or a brain-access journey the whole story; it is the final arena of a sustained investigation.
  LitRPG''s literal stats/levels absent. Postcyberpunk also matters: Eleanor is employed, married, socially embedded, not
  a stereotyped lone hacker. Those facts are retained. Yet her work and niece pull her into corporate tampering, state suspicion
  and clandestine cult danger; ordinary algorithmic life, a crew''s network job or building an alternative institution is
  not the engine. The crime-conspiracy reading fits Cyberpunk noir''s investigators facing corrupt invasive power, without
  pretending Eleanor lacks family or professional standing.


  Noir children: Sleuths, because a robot death and apparent suicides generate a converging inquiry, then the missing niece
  and discoveries drive the rescue. Operatives would turn it into commissioned operational assignments; Fugitives would overstate
  continuing escape as the engine. Being suspected by security is a strand, not the whole narrative. Moderate wobble against
  Postcyberpunk, Robot relations and Neural fiction, explicit rather than hidden.


  ## Covers

  One sweep, exact publisher/Risingshadow/interview fronts visually inspected. Same colorful cybernetic head/neon city artwork,
  Shasti O''Leary Soudant credit in original bibliography. Larger399x640publisherfront selected over smaller308x496and180x290copies.
  English title and author visible. Score7. Detailed color fits taste, large type and schematic head less scenic than a full
  painted environment. Hotlink only.



definition: 'Cyberpunk whose story is a hardboiled crime, conspiracy or survival thriller: alienated criminals, investigators
  or mercenaries move through corrupt high-tech power and its wreckage. Invasive technology changes bodies and identities,
  while jobs, betrayals and the price of staying alive drive the story. Not virtual-world immersion (Metaverse), literal
  game mechanics (LitRPG), brain access primarily as passage into experienced altered reality (Neural fiction), or socially
  embedded life without classic noir alienation (Postcyberpunk).'

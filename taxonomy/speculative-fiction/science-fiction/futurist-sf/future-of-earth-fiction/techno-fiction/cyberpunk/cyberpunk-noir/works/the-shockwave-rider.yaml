placement_rationale: 'Standalone novel (1975, Harper & Row). In a dystopian early-21st-century America dominated by the data
  network, Tarnover runaway Nick Haflinger survives as a fugitive by punching whole new identities into the net through the
  stolen 4GH code; the frame story is his recapture, interrogation and renewed flight, and the book coined the network ''worm''
  (Wikipedia). An alienated outsider moving through corrupt high-tech power with invasive technology rewriting his identity
  while the price of staying alive drives the story - the cyberpunk-noir shape, and the proto-cyberpunk ancestor text of the
  mode. Rejected: cyberheist (no crew or paid job against the system - his hacks are survival, not heists), revolutionary-cyberpunk
  (the closing network plebiscite and Precipice offer an alternative, but as coda; the governing story is fugitive survival,
  not institution-building), huxleyan-dystopia (Tarnover''s conditioning is backstory; the engine is the fugitive/net survival,
  not consent engineering), algorithmic-surveillance-dystopias (that branch is the recognizable present; this is future America),
  remade-minds leaves (his personas are data edits, not copied or rewired minds).'

placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Cyberpunk
  > Cyberpunk noir > Cybernoir sleuths. Scientific engineered bodies, networks and artificial identities rather than proven
  literal magic earn Science fiction. Extrapolated Earth futures earn Futurist SF and Future of Earth fiction rather than
  historical-period, recognizable-present, unanchored-cosmos or spacefaring reading; no included-novel temporal mechanism
  was established that would force Atemporal. Technology organizes corrupt power, earning Techno fiction. Invasive systems
  and alienated outsiders earn Cyberpunk, then the hardboiled crime/conspiracy/survival engine earns Cyberpunk noir. A virtual
  interface alone does not earn Metaverse or Neural fiction; literal game progression is absent. A salary or friends alone
  does not satisfy Postcyberpunk''s absence-of-classic-noir-alienation gate. Body alteration serves the thriller rather than
  replacing it with transformation-life as subject. McNihil investigates Travelt''s death and the missing prowler carrying
  his knowledge into the Wedge. Corporate control, his own agenda, November and his wife converge in final revelations. His
  copyright-enforcement profession makes Operatives a serious rival, but the specific death, missing surrogate and case explanation
  organize this one novel. Rewalked root-down 24 November 2026. All existing novels, authors, first-publication years and
  cover hotlinks preserved. Approved phonemsg-01M86AZ327Z576EN1BR6RS8H05 on phonemsg-01M86AYMZMQ5FSPK86A0CPHDSR.


  Prior detailed ancestor/source rationale retained:

  Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Cyberpunk >
  Cyberpunk noir. McNihil, an alienated operative who investigates and punishes intellectual-property theft, is hired by the
  mega-corporation DynaZauber to recover a prowler android that walked off with an executive''s personality and knowledge,
  into the depraved Wedge district. The gate word for word: a hardboiled crime-conspiracy thriller where an investigator moves
  through corrupt high-tech power, invasive technology changes bodies and identities (McNihil''s surgically overlaid noir
  vision, prowler life-surrogates, squirrel-claw executive hands, shelters welded to vagrants), and jobs, betrayals and the
  price of staying alive drive the story (SF Site, Victoria Strauss). Not Metaverse (no virtual-world immersion), not Postcyberpunk
  (classic noir alienation, not embedded social life). Standalone novel; queue year 1999 is the paperback, first published
  1998 (Bantam Spectra).'

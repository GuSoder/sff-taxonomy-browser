id: nocturne-for-a-dangerous-man
title: Nocturne for a Dangerous Man
authors:
- Marc Matz
first_published: 1999
canonical_genre: cyberpunk-noir
placement_status: accepted
placement_rationale: 'Whole-fiction walk, 22 November 2026. One published 1999 standalone, not three novels: the 2000 paperback
  and 2013 ebook are editions. Contemporaneous Locus records July 1999 [June appearance], backed by ISFDB, library editions
  and the contemporary completed reviews. Blackwell''s 31 December 1998 is contradictory retailer metadata, not used over
  contemporary evidence; a completed reader''s 2000 date refers to paperback. No published sequel established by current bibliography,
  searches or edition records. The old author SFWA page is unavailable; ISFDB author-summary extraction omits even this known
  novel, so its silence alone cannot prove completeness. Three short-fiction titles are not folded into this world without
  evidence of a connection.

  Root: Science fiction, not Fantasy. The flap''s ancestors speaking in Robie''s thoughts and I-Ching/Taoist practices are
  potential contrary signals, not silently deleted. No checked completed criticism describes literal spirits, miraculous divination,
  spells or supernatural causation. A completed reader specifically contrasts this world with Shadowrun by its lack of magic;
  the three completed independent reviews describe science-fiction technology and a human rescue plot, with no magical resolution.
  These sources support SF without claiming the full novel or a primary passage was read. The current publisher-supplied description,
  as distributed through Bookshop and Booktopia, uses covert operations and technology, not magical powers. Verified image
  is a full English front, hotlinked only.

  Temporal walk: future Earth, not Historical SF merely because written in 1999. No explicit elapsed calendar date found;
  SF Site''s 2050 is explicitly the critic''s guess, not a canonical setting date. The established world has undergone the
  Transition, climatic catastrophes, enhanced humans and virtual-human simulations. It still reads as an extrapolated Earth
  future, not recognizably historical or a present-day mundane spy story. Modern-day SF/Technothriller/Spytech is the strongest
  ancestor rival, because covert rescue and gear are prominent, but its essentially mundane near-present world is less honest
  than the remade future networked order. No time travel, parallel crossing, reincarnation or unstable fabulation established.
  Thoughts of ancestors do not establish Ancestral time travel. No invented fantasy realm, Earth portal or future supernatural
  order.

  Futurist siblings: fundamentally Earth-descended society, not space travel, alien encounter or rigorous hard-science problem
  solving. The Transition has already happened and is background, so not an unfolding Climate catastrophe. Not a wasteland
  survival or terminal Dying Earth narrative: functioning corporations, banks and globally linked society persist. Dystopia/post-climate
  society are serious setting rivals but the reading engine is neither a societal thought experiment nor rebuilding the social
  order. No studiable psi established. No future military campaign. Techno fiction is the better ancestor because information
  systems, virtual reconstruction and human enhancement shape the private investigator''s identity, work and threats.

  Techno siblings: the powerful computer and the constructed virtual Siv make Machine minds/AI and Copied minds real rivals.
  The simulation is an investigative tool, not a documented brain copy/upload; do not convert a virtual reconstruction into
  an actual transferred person. Neither machine emancipation nor transformed human embodiment governs the whole story. Post-society
  relations has human intimacy with a virtual woman as a strand but not the whole book''s subject. Biological enhancement
  does not turn a rescue plot into an Altered flesh or Cyborgs story. The whole completed plot, even in Sauve''s negative
  account, is the methodical rescue of the kidnapped woman through leads and dangerous sub-jobs, ending in the confrontation/rescue.
  Sauve and Tillman disagree about the cover''s literal accuracy; do not treat the painted helicopter/cruise-ship explosion
  as independently established exact ending. SF Site confirms an accelerating final confrontation, not a late change of narrative
  engine.

  Cyberpunk siblings: private VR reconstruction makes Private metaverse a close possible motif, but no governing immersive
  shared world is established. Neural fiction requires direct brain access as the central passage into altered experience,
  not simply a simulation used to find someone. Literal levels/stats/respawn absent. Postcyberpunk/Cyberheist is a genuine
  counterweight because Robie is wealthy, has friends, skills and personal principles; this is not a reason to pretend he
  is friendless or poor. Nevertheless his carefully separated identities, private life, cynical compromised power structures
  and return to dangerous recovery jobs form the classic noir investigator''s story. Both Tillman and Sauve independently
  connect him to hardboiled private-eye traditions, not ordinary socially embedded life inside the system. He burns identities
  and accepts danger in an unresolved, corrupt high-tech society. This is not a crew building a better networked institution,
  or everyday life organized by an algorithm. Existing Cyberpunk noir explicitly admits investigators and mercenaries, not
  only hackers or impoverished criminals. The whole book fits its crime/conspiracy/survival promise without widening the leaf.
  Eight to nine fictions; count did not decide placement. Moderate-high confidence, with technology''s sketchiness, Robie''s
  friendships and the ancestor-voices wording retained as contrary evidence.'

first_published: 2010
canonical_genre: cybernoir-fugitives
placement_status: accepted
placement_rationale: 'Root-down whole-fiction rewalk,25November2026: Speculative fiction > Science fiction > Futurist SF >
  Future of Earth fiction > Techno-fiction > Cyberpunk > Cyberpunk noir > Cybernoir fugitives. Three retained novels: The
  Human Blend (2010), Body, Inc. (2012), The Sum of Her Parts (2012). Full completed-series review https://sfcrowsnest.info/the-sum-of-her-parts-the-tipping-point-trilogy-book-3-by-alan-dean-foster-book-review/
  and opening-volume review https://sfcrowsnest.info/the-human-blend-volume-1-of-the-tipping-point-trilogy-by-alan-dean-foster/
  agree with publisher https://www.penguinrandomhouse.com/books/54934/the-sum-of-her-parts-by-alan-dean-foster/ on the continuous
  industrial-espionage chase: street criminal Whispr and physician Ingrid Seastrom flee corporate assassins with a mysterious
  data-storage thread, cross from flooded America to southern Africa and reach a secret research facility. No magic, invented
  fantasy world or actual temporal travel appears in the three-volume account. Spacefaring and Alien fiction lose to the Earth-bound
  human technological arena; Hard SF loses to the violent survival-thriller experience rather than a rigorous scientific problem-solving
  contract. Modern day and its Genetic caste child are rejected despite publisher near-future wording: the completed account
  describes a profoundly changed Earth after centuries of exploitation, rising seas, transformed land and pervasive body-Meld
  commerce. The opening reviewer estimates one or two centuries; that estimate is not needed as an exact date. Future of Earth
  > Techno-fiction wins over ecological collapse because the flooded landscape is the setting of a working technological civilization,
  not the principal catastrophe experience. Technomorphosis > Posthuman > Altered flesh is the closest rival: extreme body
  changes are pervasive and often important to tactics. But neither the personal experience of acquiring a new body nor the
  body change itself organizes the whole trilogy. An alienated thief and his ally are relentlessly hunted over stolen high
  technology; corporate power, invasive modifications, a macguffin, hired killers, betrayal and survival are the continuing
  engine. Thus Cyberpunk noir wins over socially embedded Postcyberpunk, virtual-world Metaverse, game LitRPG or neural experienced
  realities. Within noir, this is fugitives surviving and pursuing answers while hunted, not a professional sleuth working
  an assigned case, a heist job, or institution-building rebellion. Wobble: the title and abundant body-Meld detail make Altered
  flesh plausible if the chase is discounted, and publisher calls the future near, but whole-fiction plot and actual social
  setting decide. Individual correction under owner grant phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX during the mandatory Genetic
  caste destination audit for Need intake.'

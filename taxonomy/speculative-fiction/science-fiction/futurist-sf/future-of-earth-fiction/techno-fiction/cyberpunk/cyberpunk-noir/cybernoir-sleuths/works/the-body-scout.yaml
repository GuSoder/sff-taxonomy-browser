id: the-body-scout
title: The Body Scout
authors:
- Lincoln Michel
first_published: 2021
canonical_genre: cybernoir-sleuths
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Cyberpunk
  > Cyberpunk noir > Cybernoir sleuths. Scientific engineered bodies, networks and artificial identities rather than proven
  literal magic earn Science fiction. Extrapolated Earth futures earn Futurist SF and Future of Earth fiction rather than
  historical-period, recognizable-present, unanchored-cosmos or spacefaring reading; no included-novel temporal mechanism
  was established that would force Atemporal. Technology organizes corrupt power, earning Techno fiction. Invasive systems
  and alienated outsiders earn Cyberpunk, then the hardboiled crime/conspiracy/survival engine earns Cyberpunk noir. A virtual
  interface alone does not earn Metaverse or Neural fiction; literal game progression is absent. A salary or friends alone
  does not satisfy Postcyberpunk''s absence-of-classic-noir-alienation gate. Body alteration serves the thriller rather than
  replacing it with transformation-life as subject. Kobo investigates adoptive brother J.J.''s death at home plate through
  biotech owners, illegal cloning and body-modification markets. Amateur and often lucky rather than a competent private eye,
  he nonetheless follows a sustained murder inquiry, not sport competition or a covert assignment. Medical debt and enhancement
  are structural, not proof that Altered flesh overrides the crime engine. Rewalked root-down 24 November 2026. All existing
  novels, authors, first-publication years and cover hotlinks preserved. Approved phonemsg-01M86AZ327Z576EN1BR6RS8H05 on phonemsg-01M86AYMZMQ5FSPK86A0CPHDSR.


  Prior detailed ancestor/source rationale retained:

  Near-future New York ruled by biotech and pharmaceutical giants who field chemically augmented athletes - the Monsanto Mets,
  the Pyramid Sphinxes; body-hacker scout Kobo investigates his brother''s murder through the wreckage of corporate high-tech
  power. Hardboiled crime thriller where invasive technology changes bodies: Cyberpunk noir. (Wobble noted: the tech is biotech
  rather than network tech; the noir leaf''s own gate - ''invasive technology changes bodies and identities'' - covers it.)'

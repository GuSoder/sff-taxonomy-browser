placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Techno fiction > Cyberpunk
  > Cyberpunk noir > Cybernoir fugitives. Scientific engineered bodies, networks and artificial identities rather than proven
  literal magic earn Science fiction. Extrapolated Earth futures earn Futurist SF and Future of Earth fiction rather than
  historical-period, recognizable-present, unanchored-cosmos or spacefaring reading; no included-novel temporal mechanism
  was established that would force Atemporal. Technology organizes corrupt power, earning Techno fiction. Invasive systems
  and alienated outsiders earn Cyberpunk, then the hardboiled crime/conspiracy/survival engine earns Cyberpunk noir. A virtual
  interface alone does not earn Metaverse or Neural fiction; literal game progression is absent. A salary or friends alone
  does not satisfy Postcyberpunk''s absence-of-classic-noir-alienation gate. Body alteration serves the thriller rather than
  replacing it with transformation-life as subject. Tarnover runaway Nick changes identities, is recaptured and interrogated,
  escapes with Kate and releases a disclosure worm before the final threat to Precipice. The ending creates a social alternative,
  making Revolutionary cyberpunk a genuine rival. Fugitive identity and interrogation govern most of this standalone; resistance
  is not automatically institution-building. No paid heist or repeated covert assignment. Rewalked root-down 24 November 2026.
  All existing novels, authors, first-publication years and cover hotlinks preserved. Approved phonemsg-01M86AZ327Z576EN1BR6RS8H05
  on phonemsg-01M86AYMZMQ5FSPK86A0CPHDSR.


  Prior detailed ancestor/source rationale retained:

  Standalone novel (1975, Harper & Row). In a dystopian early-21st-century America dominated by the data network, Tarnover
  runaway Nick Haflinger survives as a fugitive by punching whole new identities into the net through the stolen 4GH code;
  the frame story is his recapture, interrogation and renewed flight, and the book coined the network ''worm'' (Wikipedia).
  An alienated outsider moving through corrupt high-tech power with invasive technology rewriting his identity while the price
  of staying alive drives the story - the cyberpunk-noir shape, and the proto-cyberpunk ancestor text of the mode. Rejected:
  cyberheist (no crew or paid job against the system - his hacks are survival, not heists), revolutionary-cyberpunk (the closing
  network plebiscite and Precipice offer an alternative, but as coda; the governing story is fugitive survival, not institution-building),
  huxleyan-dystopia (Tarnover''s conditioning is backstory; the engine is the fugitive/net survival, not consent engineering),
  algorithmic-surveillance-dystopias (that branch is the recognizable present; this is future America), remade-minds leaves
  (his personas are data edits, not copied or rewired minds).'

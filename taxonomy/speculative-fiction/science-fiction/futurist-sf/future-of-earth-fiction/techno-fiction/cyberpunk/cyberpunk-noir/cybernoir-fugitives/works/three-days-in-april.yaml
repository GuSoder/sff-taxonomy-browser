title: Three Days in April
authors:
- Edward Ashton
first_published: 2015
canonical_genre: cybernoir-fugitives
placement_status: accepted
placement_rationale: 'Root-down whole-fiction rewalk,25November2026: Speculative fiction > Science fiction > Futurist SF >
  Future of Earth fiction > Techno-fiction > Cyberpunk > Cyberpunk noir > Cybernoir fugitives. Consolidates included Three
  Days in April (2015) and The End of Ordinary (2017), preserving both books and covers. Creator explicitly says they share
  a world and that his war manuscript fits between them: http://lisahaseltonsreviewsandinterviews.blogspot.com/2017/07/interview-with-sci-fi-author-edward.html
  . The manuscript became Mal Goes to War per creator https://novelpro.weebly.com/latest-news/interview-with-edward-ashton-author-of-mal-goes-to-war-mickey-7
  ; not currently included, not added here and not allowed to dictate a war-fiction placement. Creator sets Ordinary in late
  twenty-first century and describes inherited engineered generations, prior civil war, surveillance and prejudice. Full creator
  interview https://bookschatter.blogspot.com/2017/07/Q-A-end-ordinary.html tests humor versus farce: serious racism, class
  and privacy questions presented with humor, not intended farce. Full completed April readers https://mrhipster.com/books/three-days-in-april
  and https://azuredwarf.blogspot.com/2015/10/three-days-in-april-by-edward-ashton.html describe scientific human modification,
  nanotechnology, hackers, surveillance, a mass killing and fugitives threatened by NatSec. Publisher https://www.harpercollins.com/products/three-days-in-april-edward-ashton?variant=40975303573538
  and https://books.google.com/books/about/The_End_of_Ordinary.html?id=4snADQAAQBAJ support a science-fiction thriller and
  corporate/government pursuit. Root counterreading preserved: https://sf-encyclopedia.com/entry/ashton_edward labels April
  fantasy and singleton without explanation. This conflicts with the explicit creator continuity statement and detailed technological
  plot accounts. Mysticism and a street-magician character alone do not establish literal magic; no source-grounded proof
  of supernatural action is asserted here. Genuine ambiguity favors admitted SF under existing owner boundary, not an invented
  requirement to prove every apparent marvel demystified. No actual temporal travel in the included plots. Historical fails
  future setting; Modern day fails the explicit late-century remade society, not merely a vague near-future label, despite
  recognizable American locations and everyday life. Therefore Humorous science fiction > Satirical SF is a real tonal rival
  but fails its Modern-day ancestor. Futurist Hard SF loses to survival/conspiracy rather than rigorous scientific problem
  solving; Spacefaring and Alien fiction fail the human Earth arena. Future of Earth > Techno-fiction wins over dystopian
  state description, ecological collapse, utopia, psi or future history because invasive enhancement and secret technology
  power both plots, while no included war narrative governs. Machine minds is a secondary revelation, not the two-novel recurring
  protagonist experience. Technomorphosis > Altered flesh is substantial but overweights gene design over the shared experience
  of being hunted and used by high-tech institutions. Cyberpunk noir fits alienated outsiders, cyborgs, hackers, engineered
  bodies and corrupt government/corporate power. No immersive metaverse, literal game mechanics, direct neural alternate reality
  or socially embedded institution-building governs. Within noir, fugitives wins over professional operatives and case-driven
  sleuths: April protagonists evade assassins amid an engineered mass-death cover-up; Ordinary father and youths discover
  a concealed project and flee corporate goons and government operatives. Counterattack is not the construction of a replacement
  society. Wobble: comedy, family ties and genetic-class divisions are important, and SFE root dissent remains, but the whole
  included fiction has a continuous hunted-outsider conspiracy experience. Consolidation and individual move under owner grant
  phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX, during mandatory Genetic caste audit for Need intake. Earliest existing card retained
  as continuity label, no invented franchise title. Inline edition years corrected to source/YAML first-publication years2015/2017.'

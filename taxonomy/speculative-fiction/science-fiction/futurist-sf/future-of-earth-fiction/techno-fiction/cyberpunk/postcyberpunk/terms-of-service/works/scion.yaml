placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction
  > Techno-fiction > Cyberpunk > Postcyberpunk > Terms of service. Azure is a gene-boosted contract killer
  legally taking out immortal "lifers" for token payments to crawl out of debt - a working life lived inside
  the networked biotech contract order, drones, q-coms and biosecurity the air he breathes (Saga Press/S&S
  publisher page, blurb and chapter one; "John Wick meets Ghost in the Shell"). Rejected: Cyberheist (his
  kills are legal and system-sanctioned, not jobs against the system), Revolutionary cyberpunk (no
  alternative-building), Metaverse, Neural fiction and LitRPG (no virtual world, no brain-interface passage,
  no game mechanics). Wobble: moderate - the blurb''s "next job, the opposite of my regular duties" may
  turn the plot against the order. Standalone: the S&S page names no series (2026, Saga Press).'

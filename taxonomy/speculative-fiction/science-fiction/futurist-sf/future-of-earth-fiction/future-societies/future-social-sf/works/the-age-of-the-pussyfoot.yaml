placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Future social
  SF. Per Wikipedia and ISFDB: a 20th-century man killed in a fire in 1969 is revived from cryopreservation in 2527, and the
  story is his attempt to fit into the society of that era, its joymaker computers, its customs of marriage and parenthood,
  and the hunting license someone has taken out on him. A society examined at a particular future moment, through an outsider
  learning its rules, is the Future social SF definition. Rejected: Satirical utopia (that leaf holds apparently ideal societies
  satirizing the reader''s own world, and this one is not offered as an ideal), Sociological SF (the leaf names a group as
  the experiment, not a whole future society), Future history of Earth (no sustained course across time). Wobble: the book
  is comic and satirical and has a hunted-man thriller thread. Year 1969, the Trident book per ISFDB (an expansion of the
  1965-66 Galaxy serial).'

placement_rationale: 'Walk: a post-scarcity world with an economy based on reputation, where people compete over how new technology
  is used at Walt Disney World (Wikipedia); money is gone and death is cured (NYT, 2003). A society examined at a particular
  future moment, driven by social science rather than engineering: Future social SF (5 to 6), alongside The Age of the Pussyfoot.
  Considered and rejected: Terms of service (at 9; the order is benign abundance, not terms imposed), Satirical utopia (no
  satire in the sources read), Hopepunk, Secluded utopias (not secluded), Post-scarcity politics (space opera only), Revolutionary
  cyberpunk (no revolt building it). Sources: Wikipedia, NYT; not read in full.'

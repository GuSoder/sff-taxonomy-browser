id: game-of-the-gods
title: Game of the Gods
authors:
- Jay Schiffman
first_published: 2018
canonical_genre: future-social-sf
placement_status: accepted
placement_rationale: 'Walk: Speculative fiction -> Science fiction -> Futurist SF -> Future of Earth fiction -> Future
  societies -> Future social SF. Earth far future and former North America are explicit in the finished-book review.
  Max Cone, a High Judge and former commander, crosses six competing political orders to protect family and friends.
  The author identifies political science, malleable institutional rules, and personal bonds versus collective identities
  as the subject, not merely incidental background. This is social science examined at a particular future moment, not
  a sustained future history. Hard SF fails rigorous technical problem-solving; spacefaring/alien branches fail the Earthbound
  human focus; Historical/Modern/Atemporal fail the future setting; Fantasy is not the framing despite the title and
  a superpowered girl. Future war is weaker because technology-transformed fighting is not the governing inquiry. Psionics
  and technology branches fail because special talents and a predictive device are tools rather than the subject. Utopia
  fails the coercive political orders. Dystopian futures is a strong rival, but the book examines competing institutions
  rather than one totalitarian regime and its dismantling; social dystopia children on crowds, reproduction, climate,
  patriarchy and a state fragmenting into civil war do not fit this multi-nation political adventure honestly. Ruined
  Earth is background, not recovery of lost knowledge or life wild among ruins; apocalypse survival and dying-Earth endings
  are not its engine. Future social SF already includes political/game-theory institutions, not only academic investigators.
  Scope: one eligible published novel found in current bibliographic checks; 2018 sequel plans not treated as publication,
  online prequel described as novella excluded. Sources: https://torpublishinggroup.com/game-of-the-gods/?format=trade&isbn=9781250306135
  ; https://www.torforgeblog.com/2018/07/16/the-rules-of-the-game-of-the-gods/ ; https://whatever.scalzi.com/2018/07/12/the-big-idea-jay-schiffman/
  ; https://toschestation.net/the-most-dangerous-game-reading-jay-schiffmans-game-of-the-gods/ ; https://www.libraryjournal.com/story/jay-schiffman-game-of-the-gods-lj-review
  ; https://freshfiction.com/author.php?id=43038 ; https://www.books-by-isbn.com/authors/jay/schiffman/ . Original intake
  commission phonemsg-01M43MYMGAMQTNA3CY402KK7FB; resumed under phonemsg-01M632RASZYPC1W919GK4S58CY. Existing leaf, no
  definition change.'

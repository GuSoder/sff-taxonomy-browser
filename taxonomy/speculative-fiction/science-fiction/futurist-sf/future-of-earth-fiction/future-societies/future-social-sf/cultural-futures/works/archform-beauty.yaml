first_published: 2002
canonical_genre: cultural-futures
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future
  social SF > Cultural futures. Cultural futures, one whole shared world including Flash: art, music, media value and technologically
  amplified persuasion connect both novels. Flash''s product placement and rezrock election campaign are a strong Political
  futures overlap, not grounds to split the fiction. The cultural mechanism of shaping judgment through expression is common
  to both, whereas Archform is not exclusively an election story. Current primary author descriptions confirm the shared world.
  Rewalked root-down against the current siblings and the existing parent gates on23November2026. Future history loses to
  a society tested at a focused future moment; Hard SF, spacefaring, alien-aboutness, dystopia/utopia, psi and technology-only
  branches remain the explicit rivals in the preserved prior whole-fiction rationale. The split does not change those ancestor
  gates. Existing whole-fiction scope, books, authors, years and covers are preserved. Approval: phonemsg-01M83XQ6MRNDS72B1K5DAEXRWJ
  on phonemsg-01M83WMY3009BP9Q8C8XKWJNP8.


  Prior ancestor walk retained:

  L. E. Modesitt''s Archform: Beauty (2002; with Flash 2004, set in the same world earlier; Modesitt''s site, Wikipedia):
  in a 24th-century Earth society where no one wants for anything, technology supplies every need and the story examines what
  art, beauty and politics mean there; Flash is the 22nd-century prequel about science, advertising and politics. One shared
  world, so one fiction. Walk: Futurist > Future of Earth > Future societies > Future social SF (a society examined at a moment,
  driven by social questions). Sources: Modesitt''s site, Wikipedia; not read. Alternative: Future history of Earth.'

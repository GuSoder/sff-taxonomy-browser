first_published: 2024
canonical_genre: cultural-futures
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future
  social SF > Cultural futures. Cultural futures: occupational dialects partition society and an interpreter''s confidentiality
  oath creates the murder-conspiracy dilemma. Language mediates professional and class relationships; the investigation tests
  that institution. No new hardware or physical-science puzzle supplies the main novum. Rewalked root-down against the current
  siblings and the existing parent gates on23November2026. Future history loses to a society tested at a focused future moment;
  Hard SF, spacefaring, alien-aboutness, dystopia/utopia, psi and technology-only branches remain the explicit rivals in the
  preserved prior whole-fiction rationale. The split does not change those ancestor gates. Existing whole-fiction scope, books,
  authors, years and covers are preserved. Approval: phonemsg-01M83XQ6MRNDS72B1K5DAEXRWJ on phonemsg-01M83WMY3009BP9Q8C8XKWJNP8.


  Prior ancestor walk retained:

  Root-down: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future societies -> Future social
  SF. A century-future Earth society has mutually unintelligible professional dialects; interpreter William Kirst''s confidentiality
  oath traps him in a murder conspiracy. Linguistics and social mediation govern, not a gadget. Modern-day Social science
  fiction fails its temporal parent; Alien fiction/Earthborn fails browser expectations because this is Earthbound, not human-descended
  cultures in space. Dystopian-future children, Psionics, Techno fiction, Future war and Utopian fiction do not supply the
  engine. Future history of Earth fails the sustained-course gate: this is one future investigation. Curator explicitly chose
  the Future societies umbrella and Future social SF leaf, then Execute on 2026-09-30.'

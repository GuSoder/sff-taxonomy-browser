id: the-age-of-the-pussyfoot
title: The Age of the Pussyfoot
authors:
- Frederik Pohl
first_published: 1969
canonical_genre: economic-futures
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future
  social SF > Economic futures. Economic futures: revived Forrester misunderstands wealth and the costs/access rules of joymaker
  life, employment and paid services; the excluded Forgotten Men expose the same system from below. Culture shock, alien war
  and the Luddite ending remain material qualifications. Cryosleep is suspended life, not itself a time machine. This is not
  just a smartphone prediction or ideal post-scarcity utopia. Rewalked root-down against the current siblings and the existing
  parent gates on23November2026. Future history loses to a society tested at a focused future moment; Hard SF, spacefaring,
  alien-aboutness, dystopia/utopia, psi and technology-only branches remain the explicit rivals in the preserved prior whole-fiction
  rationale. The split does not change those ancestor gates. Existing whole-fiction scope, books, authors, years and covers
  are preserved. Approval: phonemsg-01M83XQ6MRNDS72B1K5DAEXRWJ on phonemsg-01M83WMY3009BP9Q8C8XKWJNP8.


  Prior ancestor walk retained:

  Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Future societies > Future social
  SF. Per Wikipedia and ISFDB: a 20th-century man killed in a fire in 1969 is revived from cryopreservation in 2527, and the
  story is his attempt to fit into the society of that era, its joymaker computers, its customs of marriage and parenthood,
  and the hunting license someone has taken out on him. A society examined at a particular future moment, through an outsider
  learning its rules, is the Future social SF definition. Rejected: Satirical utopia (that leaf holds apparently ideal societies
  satirizing the reader''s own world, and this one is not offered as an ideal), Sociological SF (the leaf names a group as
  the experiment, not a whole future society), Future history of Earth (no sustained course across time). Wobble: the book
  is comic and satirical and has a hunted-man thriller thread. Year 1969, the Trident book per ISFDB (an expansion of the
  1965-66 Galaxy serial).'

placement_rationale: '# Half the Day Is Night, whole-novel root-down walk,25 November2026


  MC06578. Maureen F. McHugh, first published1994, not the queue''s1996 paperback edition. Standalone novel; SFE lists it
  separately from China Mountain Zhang with no shared-universe connection asserted. Included scope one novel. No relation
  inferred merely from author identity.


  ## Grounding


  Agency synopsis and publisher-supplied Google Books copy establish a21st-century undersea Caribe, banker Mayla Ling, bodyguard
  David Dai and terrorist attacks during her major deal. Contemporary PW/Kirkus criticism details David''s flight, police
  suspicion, Mayla''s denied visa and their search for escape papers. Jo Walton''s completed reread foregrounds paid work,
  unequal perspectives, organized criminals taking over the bank and daily life rather than saving the world. Bogstad''s criticism,
  quoted by Encyclopedia.com, explicitly identifies the novel''s subject as greed, economic manipulation and ordinary social
  insecurity. SFE independently stresses acute observation of coping within a crowded future. The Encyclopedia.com bibliography
  erroneously says1992; its criticism is usable, but original publication is1994 by SFE, agency, contemporary reviews and
  publisher-supplied Google Books metadata. Do not copy that erroneous date.


  The close underwater environment is literal extrapolated technology. Pressure and oxygen affect life, but the novel is not
  an engineering-problem narrative. The book has VR recreation and neural stimulators in reader accounts, but no evidence
  these supply its governing premise. Do not let cyberpunk furniture replace the actual social/economic subject. No climate-cause
  claim is made: one weak aggregator asserted rising seas, not corroborated in reliable sources.


  ## Root-down comparison


  Speculative fiction passes: an extrapolated future of undersea cities and supporting technologies. Science fiction wins
  over Fantasy: no verified literal magic. An attended Voodoo ceremony is cultural practice, not proof of supernatural intervention;
  the actual speculative world is technological.


  Science fiction children all tested. Futurist SF wins a21st-century imagined Earth still distinguished by its undersea urban
  civilization. Historical SF fails celebrated recognizable past-era sensibility, alternate-history divergence or hidden extraordinary
  history; being written1994 does not itself make it historical. Modern day SF fails recognizable contemporary setting despite
  ordinary jobs and relationships. Atemporal SF fails no time travel, parallel realities, reincarnation or unanchored cosmos;
  no Fabulation/New Weird/Science fantasy engine.


  Futurist SF children all tested. Future of Earth fiction wins imagined Earth society. Hard SF is a substantial surface rival:
  Walton calls it hard SF, and the underwater habitat is convincing. But this taxonomy''s Hard SF requires scientific constraint
  or engineering problem-solving as central reading experience. Orbital mechanics fails no spaceflight; Planetary science''s
  Terraforming/Planet expedition/Planet ecology leaves fail no remaking, expedition to or ecological inquiry into another
  world; Matter transmission fails none; Hard conceptual SF fails no world-model recognition puzzle; Otherworldly hard SF
  fails anchored future Earth. Spacefaring fiction fails no beyond-Earth civilization. Alien fiction fails no alien subject.


  Future of Earth children all tested. Future societies wins the sustained social portrait through work and unequal access.
  Dystopian fiction is the strongest rival: poverty, corrupt police, dictatorship and restrictions on travel are real. Totalitarian''s
  Huxleyan conditioning/pleasure, classic Orwellian surveillance/compulsory belief, Propaganda, Assimilation, and rebellion
  to overthrow a regime do not govern. Orwellian statesmanship has genuine bureaucratic coercion in the denied visa/papers,
  but reducing the whole to ideological law/secret state process misnames a story about ordinary people within opaque economic
  manipulation and institutional corruption. Orwellianesque would be a convenient residual bucket, not the most specific honest
  invitation. Social dystopia''s Crowded dystopias is a real rival because SFE calls the future desperately crowded, but population
  pressure is not established as the causal story engine. Childless, climate class/displacement/breakdown, patriarchal and
  civil-war dystopias fail their named mechanisms. Post-holocaust survival, Ruined Earth and Dying Earth fail governing catastrophe
  aftermath, ruins or terminal sun.


  Psionics fails none. Techno-fiction fails technology transforming minds/bodies/order as primary subject: Machine minds no
  machine protagonist, Cyberpunk''s Metaverse no governing immersion, LitRPG no literal game laws, Neural fiction no brain-interface
  passage engine, Postcyberpunk no pervasive-network institutional engine, Cyberpunk noir no invasive technology defining
  identity/body or the protection/fugitive role. Cybernoir operatives/fugitives would overread the bodyguard job or flight
  while missing the technological ancestor. Technomorphosis likewise lacks central bodily/collective technology transformation.
  Future war fails David''s past conflict governing a present campaign. Utopian fiction fails ideal/alternative/hope-driven
  social construction; Satirical, Secluded and Hopepunk none.


  Future societies children: Future social SF wins a society examined at one moment; Future history of Earth fails sustained
  course over generations. Future social SF children all tested: Economic futures wins, with bank deal, purchased security,
  takeover, class position, bribery and ordinary work exposing access and vulnerability. Political futures is the strongest
  sibling because police, visas, dictatorship and political violence matter; these shape economic insecurity but the whole
  does not primarily test legitimacy, citizenship, diplomacy or competing structures of public rule. Cultural futures fails
  art/language/public meaning as subject; David''s second-language difficulty and local religious practice do not make communicative
  work the central engine. The contrast of David''s insecurity and Mayla''s assumed wealth/status opens the economic order
  to view.


  Placement: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future social
  SF > Economic futures. Existing leaf2to3; no node, definition change or structural gate. This is a judgment with real Political
  futures/Orwellian statesmanship/Crowded dystopias rivals, not a claim the novel is financial-system hard SF or that its
  conspiracy gets fully explained.



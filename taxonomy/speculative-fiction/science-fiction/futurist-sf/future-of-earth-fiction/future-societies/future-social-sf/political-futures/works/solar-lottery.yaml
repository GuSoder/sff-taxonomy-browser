placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future
  social SF > Political futures. Political futures: sortition, the Quizmaster, sanctioned assassination and the manipulated
  succession determine who legitimately rules. The John Preston space-search subplot remains a real whole-book qualification,
  not erased by this political placement. Telepathy and android control are tools in the public-power contest. Rewalked root-down
  against the current siblings and the existing parent gates on23November2026. Future history loses to a society tested at
  a focused future moment; Hard SF, spacefaring, alien-aboutness, dystopia/utopia, psi and technology-only branches remain
  the explicit rivals in the preserved prior whole-fiction rationale. The split does not change those ancestor gates. Existing
  whole-fiction scope, books, authors, years and covers are preserved. Approval: phonemsg-01M83XQ6MRNDS72B1K5DAEXRWJ on phonemsg-01M83WMY3009BP9Q8C8XKWJNP8.


  Prior ancestor walk retained:

  Philip K. Dick''s Solar Lottery (Ace, 1955; Wikipedia): the world government is run by a Quizmaster chosen by a computerized
  lottery, with a televised random selection of an assassin, so that the leader gains the respect of the people by surviving
  telepathic-guarded attempts on his life, in a society built on minimax game theory; the story follows the idealistic worker
  Ted Benteley. Walk: Science fiction > Futurist > Future of Earth > Future societies > Future social SF (a society examined
  at a future moment through social science, here game theory and sortition). Tried: Future history of Earth (one moment,
  not a sustained course) and Orwellian dystopia (the lottery is the legitimate order, not coercion by a state).'

placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future
  social SF > Political futures. Political futures: Earth''s power-debt and nonaggression rules are tested by the cyb fleet.
  Diplomacy and the cost of exercising public power govern the crisis. Conservation and energy balances are substantial, but
  this is not a marketplace-centered fiction. The demis'' unusual mental powers are technologically networked in the source
  account. Rewalked root-down against the current siblings and the existing parent gates on23November2026. Future history
  loses to a society tested at a focused future moment; Hard SF, spacefaring, alien-aboutness, dystopia/utopia, psi and technology-only
  branches remain the explicit rivals in the preserved prior whole-fiction rationale. The split does not change those ancestor
  gates. Existing whole-fiction scope, books, authors, years and covers are preserved. Approval: phonemsg-01M83XQ6MRNDS72B1K5DAEXRWJ
  on phonemsg-01M83WMY3009BP9Q8C8XKWJNP8.


  Prior ancestor walk retained:

  Modesitt''s Adiamante (Tor, Oct 1996; ISFDB, Publishers Weekly): in the far future Earth, long the abandoned capital of
  a star empire, has rebuilt itself as a society of conservation and nonaggression, and its code forbids offensive action
  until it is attacked. A fleet of twelve warships of near-indestructible adiamante from a former colony arrives to force
  surrender, and the planetary coordinator Ecktor deJanes has to defend the world without breaking those principles. Walk:
  Science fiction > Futurist > Future of Earth fiction > Future societies > Future social SF (an Earthbound society examined
  at one future moment, driven by its social design). Rejected: Future war (the book is not about technology-transformed fighting;
  the fleet is in orbit and the question is whether a nonaggressive code can hold), Future history of Earth (no sustained
  course across time), Secluded utopias and Utopian fiction (the society is the premise, but the plot is its test under siege,
  not its construction), Space colony politics (the story stays on Earth), Space armada (the fleet is the threat, not the
  viewpoint). Wobble moderate: the siege is a military plot and sources are the flap copy and one review. Queue year 2010
  is a reissue; first publication 1996. Queue id MC05662.'

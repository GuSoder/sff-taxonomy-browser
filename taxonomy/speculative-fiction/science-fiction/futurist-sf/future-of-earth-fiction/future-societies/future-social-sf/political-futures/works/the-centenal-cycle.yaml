first_published: 2016
canonical_genre: political-futures
placement_status: accepted
placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future
  social SF > Political futures. Political futures: the whole three-novel cycle follows election systems, Information''s legitimacy
  and monopoly, uneven inclusion and competing infrastructures. The final volume questions an unelected information arbiter
  rather than only resolving the first election. Narrative Disorder remains a same-world short story, not a fourth novel.
  Communication technology is central, but the governing social subject is who can rule and validate that rule. Rewalked root-down
  against the current siblings and the existing parent gates on23November2026. Future history loses to a society tested at
  a focused future moment; Hard SF, spacefaring, alien-aboutness, dystopia/utopia, psi and technology-only branches remain
  the explicit rivals in the preserved prior whole-fiction rationale. The split does not change those ancestor gates. Existing
  whole-fiction scope, books, authors, years and covers are preserved. Approval: phonemsg-01M83XQ6MRNDS72B1K5DAEXRWJ on phonemsg-01M83WMY3009BP9Q8C8XKWJNP8.


  Prior ancestor walk retained:

  Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future social SF.


  Scope: The Centenal Cycle is one shared fiction, Infomocracy2016, Null States2017, State Tectonics2018. Author current bibliography
  groups these three; publisher calls final volume conclusion, SFE2026entry confirms. Narrative DisorderMay2017is a same-world
  Mishima story explicitly called spin-off/origin by author in2018interview. Read that full short for scope but do not inflate
  into fourth novel or add collection as another book. Mossa/PleitiInvestigations is an existing separate Jupiter detective
  fiction, not merged by author identity; NinthStepStation is another project described separately, no shared-world proof.
  No invented fourth novel. Current author list is imperfectly maintained, retaining future language for2025otherbook, so
  use2026SFE and current publisher list too, not a stale no-plans remark alone. Seventeen fetched/read substantive sources
  including complete primary short, professional reference/criticism and independent/community reactions. No full reading
  of three novels claimed.


  Series engine: roughly mid/late21stcentury Earth, nation-state system replaced in much of world by100000-person centenals
  which can elect globally competing governments. Information, global fact-checking/search bureaucracy, supplies common data
  and enforces fair elections. First novel follows Policy1stcampaigner Ken, Informationoperative Mishima and dissenterDomaine
  through third decennial global election, manipulated information/sabotage, earthquake/networkoutage and legitimacycrisis.
  Second moves to newly admittedDarfurcentenal, assassinatedgovernor, Roz''s investigation, unequalcoverage and vestigial
  nationstates in a broader threat. Final renews election fiveyearsafterfirst, datacentreattacks, runawaystaffExformation,
  oldstates, alternativeurbaninformationchannels and question of who can police a truthmonopoly. Maryam''s technicalwork/investigation,
  Mishima''s failed fit as publicoversightfigure and Roz''s transportinfrastructure work dramatize competing motives and networks,
  while personalcare/love/parenthood remains. Not simply victory over one villain: plural progressive/regressive challengers
  reveal institutionalpower requires change; reviewsofcompletedending emphasize hopefulbutdestabilizingevolution, not permanentperfectstate.
  Do not invent precise final code or constitutional mechanism from marketing. Author says2.5yearsbetweeneachnovel; SFEclaimsNullStatesdecadelater,
  preferauthor on chronology, no exactgap needed in card.


  Narrative Disorder follows Mishima''s childhood diagnosis, narrativeaddiction and coping, financial/socialpatternskills,
  recruitmentintoInformationsecurityandspying, coastalcentenalshippingcrimeinvestigation. A disusedoffshorecasinobarge, Libertycorporateinvolvement
  and Information''s own people see her condition as both advantageandhazard. She escapes kidnappers, brings leadstodebrief,
  receives careandcriticism, and even familyhappinessdoesnotmagicallyendnarrativecompulsion. Alternatingtimes/readingaddiction
  are not actualtimetravel, supernaturalforeknowledge or proof the world is literallyfiction. The disorder is a cognitive/socialspeculation
  embedded in aninstitutionalizedinformationsociety, not literalRPGstats. This supporting short complicates subjectivity/verificationbutdoesnotreclassifywholeasFabulation.


  Root: engineeredcommunication, globaldatainfrastructure, futurepoliticalinstitutions and extrapolatedcognition, explicitly
  humanEarthsociety, no actualmagic or inexplicablefairyphysics. Sciencefiction over Fantasy. HistoricalSF/Proto/Period fails
  neither paststage nor closedretrofuturist aesthetic: the author wrotefuture of existingEarth, 2016ispublicationnotsetting.
  Alternatehistory fails specificpastforkgoverningnewtimeline; changedjurisdictions are projectedfuture not secretpast. Hiddenhistoryfailspastanchor.
  ModernSF fails temporalpresent. Alternatefutures/time/multiversebranches fail actualtimetravel, alternateworldexchange and
  counterfactualtimelinecomparison. Narrative framing is humanbias not metafictionalreality. Futuristpassespossiblefuturewonder/order
  ratherthan alreadyclosedhistoricalstage.


  Actual Futuristsiblings HardSF, FutureofEarth, Spacefaring, Alienfiction checked. HardSF real conceptualthought-experiment
  rival but rigorousphysical/scientificconstraint is not mainreadingexperience: newglobalconstitution/informationethics operate
  socially, not self-contained formalone-idea proof. Technology largely plausible background, no scientificderivationofmantletunnels
  needed. MindmodelswouldmisreadNarrativeDisorderasphysics of consciousness. No governingorbitalmechanics/planetology/mattertransmission.
  SpacefaringfailsEarthboundacrossglobalcities/centenals, no travelsettlementbeyondEarthaswhole; briefweirdtransportnotstarshipcivilization.
  Alienfictionfailsnonhumancontact/biology/culture. Earthfuture/humansocietyclear, notearthdescentinspacestrain.


  FutureofEarthsixchildren: Dystopianfiction, Psionics, Technofiction, Futurewar, Futuresocieties, Utopianfiction. Dystopianreadingsgenuine:
  pervasive surveillance, data/algorithmicbias, criminalizedunverifieddataandunequalaccess, monopoly power. Authorlikeslabel

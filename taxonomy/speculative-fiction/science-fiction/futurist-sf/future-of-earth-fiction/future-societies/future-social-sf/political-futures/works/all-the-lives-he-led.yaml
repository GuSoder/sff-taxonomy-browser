  reason: 'Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future social
    SF > Political futures. Political futures, with a strong economic-life wobble: refugee indenture and Pompeii tourism frame
    the early novel, but pervasive terrorism and the final third''s research into political violence and revenge govern beyond
    its work setting. A tourism-only or labor-only child would miss that ending. This is the weakest political card, not a
    neat government-design story. Rewalked root-down against the current siblings and the existing parent gates on23November2026.
    Future history loses to a society tested at a focused future moment; Hard SF, spacefaring, alien-aboutness, dystopia/utopia,
    psi and technology-only branches remain the explicit rivals in the preserved prior whole-fiction rationale. The split
    does not change those ancestor gates. Existing whole-fiction scope, books, authors, years and covers are preserved. Approval:

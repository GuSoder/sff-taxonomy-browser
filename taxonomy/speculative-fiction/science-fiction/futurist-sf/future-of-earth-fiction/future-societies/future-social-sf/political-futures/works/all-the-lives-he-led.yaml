placement_note: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future societies
  > Future social SF. 2079, after the Yellowstone super-eruption wrecked the United States: Brad Sheridan scrapes through
  the virt economy, indentured labour serving the rich, with terrorism, celebrity culture and fraud as the satire''s targets
  (Kirkus review). A satire of how the future society lives; The Age of the Pussyfoot is the member precedent. Cover note:
  the only Open Library scan carries a Boston Public Library barcode sticker.'

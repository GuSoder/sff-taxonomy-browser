placement_rationale: 'Walk: Science fiction > Futurist SF > Future of Earth fiction > Future societies > Future history of
  Earth. Four linked novels tracing a sustained future course of Earth and Earthbound humanity: balkanized 21st-century Britain
  and its mercenaries (The Star Fraction), the aftermath out to New Mars (The Stone Canal), the 24th-century Solar Union''s
  standoff with the posthuman Outwarders (The Cassini Division), and a divergent alternate future of a green counter-revolution
  (The Sky Road). Prometheus Award winners; idea-driven political futures of the human race. Solar-system scale, not interstellar.'

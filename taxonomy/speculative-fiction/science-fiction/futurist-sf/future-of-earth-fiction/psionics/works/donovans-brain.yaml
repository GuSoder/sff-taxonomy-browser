placement_rationale: 'One fiction (rule 11j, shared universe): the Dr Patrick Cory series - Donovan''s Brain (1942), Hauser''s
  Memory (1968), Gabriel''s Body (1992); SFE: all three feature the biochemist Dr Patrick Cory, and Donovan''s Brain''s preserved
  brain develops ''the baleful Psi Power of mind control''. The series engine is psi as studiable science - mind control,
  memory transfer, identity transfer - squarely inside the Psionics definition (''telepathy... or consciousness/identity transfer'').
  Consolidated 2026-11-02: supersedes the 2026-09-22 reader-relative era split that had Donovan''s Brain in Mad-science Gothic
  and the sequels here; rule 11j keeps the whole fiction on one card. Consolidation under single-fiction move autonomy (commission
  phonemsg-01M43MYMGAMQTNA3CY402KK7FB; main 2026-11-02).'

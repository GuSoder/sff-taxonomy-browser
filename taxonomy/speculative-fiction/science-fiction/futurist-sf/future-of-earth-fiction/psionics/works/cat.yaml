placement_rationale: 'One fiction (rule 11j): the Cat sequence - Psion (1982), Catspaw (1988), Dreamfall (1996); SFE Vinge
  entry: ''Cat, an orphan (half human, half Hydran, a race despised by humans) with catlike eyes and Psi Powers''. Positive
  fit to Psionics: psi treated as a studiable science that shapes society and the story - Cat''s telepathy is researched,
  regulated and weaponized by institutes and corporations across near-future Earth, and his psion identity IS the plot spine.
  Futurist gate fits: Earth''s corporate near future. The leaf''s own Cold War note: Psion (1982) and Catspaw (1988) are Cold-War-era
  futurist psi, Dreamfall (1996) continues the same fiction. Rejected: cyberpunk umbrella (invasive network tech shapes the
  world; here network tech is set-dressing, psi is the engine), SFE''s ''Space-Opera adventures'' is flavor (no spacefaring
  sweep; Earth-centered corporate intrigue). Queue years 2002/2004/2007 are reprints; first pubs 1982/1988/1996 (SFE).'

placement_rationale: '# Rosenblum''s future: whole-fiction walk

  24 November 2026


  ## Verdict

  Place the four novels on one card, **Rosenblum''s future**, in existing **Psionics**. This is a moderate-confidence whole-fiction
  judgment, not a claim that every chapter or every novel is about a psi laboratory. The creator explicitly describes one
  coherent continuous future, not multiple unrelated futures. The recurring imaginative concern is humanity''s changing capacities
  and the social response to different kinds of minds: drought-born empathy, communicable experiences stored in Stones, virtual
  and embodied identity, and classed empathy alongside the newly space-adapted children. Psionics'' actual definition includes
  effective dreaming and consciousness/identity transfer as well as telepathy. It provides a more honest common browsing invitation
  than engineering, a single colony''s rebellion, or an invented claim that these four novels narrate a chronological civilizational
  history.


  The leaf currently has nine fictions. Placement makes ten, so stop intake immediately and research an all-ten split. Do
  not change definitions or structure without approval. No next queue row until that gate is settled.


  ## Corpus and publication years

  | Novel | First publication | Evidence and caveat |

  |---|---:|---|

  | The Drylands | 1993 | Locus creator interview, SFE, publisher''s Water Rites page |

  | Chimera | 1993 | Locus, SFE, Publishers Weekly contemporary review |

  | The Stone Garden | 1994 | Locus index records January 1995 imprint with December 1994 actual release; physical-copy description
  agrees on January 1995 edition statement. Use actual release year 1994 and retain the discrepancy. |

  | Horizons | 2006 | Locus, SFE, Tor hardcover publication record and completed reviews. Queue''s 2007 is paperback, not
  first publication. |


  This descriptive card title is not an asserted official series title. Locus''s 2007 interview gives strong creator continuity
  evidence across her SF work. The contemporary introduction enumerates the three earlier SF novels and Horizons, while distinguishing
  the Mary Freeman gardening mysteries. Those mysteries are not imported into the SF fiction. Synthesis and Other Virtual
  Realities is a collection, not a fifth novel. Water Rites reprints/revises The Drylands plus three novelettes, so does not
  add another novel. Selkies and The Mermaid''s Comb are short fiction, not missing novels. Later short alternate histories
  do not expand the included-novel corpus or alter its era.


  ## All-four content, with source limits

  ### The Drylands

  Near-future Oregon and a desiccating western US. The Army Corps of Engineers controls pipelines and water rationing; Carter
  Voltaire confronts competing officials, farmers and sabotage. Nita Montoya''s mutation-related empathy is a feared difference
  and a way into the political truth. Environmental pressure, inherited change and human relationships form the story rather
  than engineering a water machine. The publisher''s page and completed Christopher East review substantiate this. The exact
  closing sequence is not claimed here.


  ### Chimera

  Jewel Martina climbs from poverty toward information brokerage; VR artist David Chen and his partner Flander become entangled
  in corporate control of the Net, family obligations and embodied identity. The world includes Antarctica''s wealthy enclaves
  and the impoverished Pacific Northwest. Publishers Weekly, Christopher East and Robert Slade provide completed criticism
  rather than jacket text alone. Anna Kurowicka''s legitimate scholarly article supplies the resolution mechanisms missing
  from the brief reviews: Flander''s desired liberation into cyberspace costs him an important part of his identity; Serafina
  instead seeks continuity through an embodied clone daughter. The article also discusses paid surrogacy and medical control.
  These are technological identity and embodiment treatments, not evidence of literal supernatural magic. Slade''s accusation
  of using magic is evaluative shorthand unsupported by a named supernatural mechanism, and is not silently promoted into
  a root Fantasy verdict.


  ### The Stone Garden

  Artist Michael Tryon encodes emotion and sensation into asteroid-derived Stones. Artists are dying and he is framed. Margarita,
  claiming to be his daughter, draws him from his secluded Taos life into contact with less protected artists. The search
  moves through cities, undersea and orbital/deep-space settings. SFE''s critical summary identifies art under near-future
  social pressure as the central concern. A completed Goodreads review by Mitchell Hahn-Branson, dated 2 March 2016, independently
  describes touch and mental transmission into the Stones, recipients re-experiencing those moments, induced suicide rather
  than merely a conventional killer, and the conflict between sheltered and precarious artists.


  **Unverified:** the final identity of the killer, the ultimate origin of the Stones and exact last revelation. Do not label
  them established alien artifacts or claim a biological explanation based only on a speculative synopsis. The known emotional
  recording and communication mechanism supports the Psionics invitation without inventing the unknown ending. The same uncertainty
  argues against choosing Alien fiction as the whole fiction''s home.


  ### Horizons

  Ahni Huang, an augmented class-nine empath, goes to New York Up to avenge a supposedly murdered brother and finds him alive
  amid conflicting family and orbital agendas. Dane Nilsson protects the naturally changing space-born children and leads
  a movement for platform autonomy. Apparent illegal nonhuman genetic modification is an accusation, not the accepted explanation:
  creator discussion and completed reviews describe environmental change/evolution. The conclusion turns on cooperation, a
  confrontation with Earth power and a courtroom intervention; reviewers call the resolution convenient. It is not a first-contact
  or interstellar expedition novel. The racial and human/nonhuman boundary is substantive, not incidental costume.


  ## Actual-tree root-down walk

  1. **Speculative fiction > Science fiction**, not Fantasy. Recognizable Earth and its extrapolated future, VR, mental and
  biological speculation, no source-established literal magic. Psi has an explicit owner carve-out. The fictional worlds are
  not separate invented fantasy realms.

  2. **Science fiction > Futurist SF**, not Historical, Modern day or Atemporal. The four included novels extrapolate the
  writer''s Earth into environmental, network and orbital futures. There is no included-novel time travel or reality-editing
  frame. Their once-futuristic 1990s network design is not a celebration of a named historical period. Space speculation remains
  futurist under the project''s era rule.

  3. **Futurist SF > Future of Earth fiction** is the best whole-fiction ancestor. The early novels are anchored in Earth''s
  climate, economy, artists and social exclusion; the later orbital novel asks what becomes of Earth-descended humanity. **Spacefaring
  fiction** is the strongest alternative because Horizons is mostly orbital and The Stone Garden travels off-world, but settlement
  and interstellar civilization do not unite the four. This is not an endpoint-based selection. **Hard sci-fi** fails as governing
  experience: the central disputes are social, psychological and identity-driven, with admitted speculative psi rather than
  rigorous problem solving. **Alien fiction** fails as common subject, and Stone origins remain unverified.

  4. **Future of Earth fiction > Psionics**. The literal definition admits scientifically framed psi and consciousness/identity
  transfer shaping society or story. Drylands'' persecuted empath, Stone Garden''s mentally encoded experiences, and Horizons''
  classed empath/changed humans give a substantial shared mental-capacity thread, while Chimera supplies identity transfer
  and virtual/embodied survival. The owner prefers overarching genre where one fits, with a defining subset concept permitted
  when needed. Here the common invitation is unusual minds and human identity under future social stress, not an assertion
  that the entire corpus uses one power system.

  5. Rival children at this fork: **Dystopian futures** captures scarcity and exclusion but no one catastrophe, state-control
  mode or wasteland condition governs all four; it would elevate background to the common story. **Techno fiction** fits Chimera
  and Ahni''s augmentations, but the principal Drylands mutation and Horizons'' new children are not technological redesign,
  so **Technomorphosis > Posthuman > Remade bodies > Successor species** fails its technological ancestor despite a tempting
  leaf definition. **Copied minds** represents only part of Chimera and would be less representative than Psionics. **Cyberpunk**
  strongly fits Chimera and the Stone Garden critic''s aesthetic description, but network invasion is not the dominant common
  mechanism across Drylands and Horizons. **Future societies** is a plausible broad rival: Political futures fits water authority
  and orbital independence, Cultural futures fits the two art-centered novels, Economic futures fits access and commerce,
  but none beats the recurring minds/identity invitation across all four. **Future history of Earth** is not licensed merely
  by the creator using the phrase future history: the accepted sources do not establish that the novels narrate a sustained
  civilizational course across time rather than different aspects of one consistent setting. **Future war** and **Utopian
  fiction** fail the whole-fiction subject.

  6. Space route checked rather than ignored: **Space colonies > Space colony politics > Breakaway space colonies** is an
  excellent Horizons-only home, but would substitute one novel''s independence plot for the broader fiction. **Space mystery
  > Space PI** fits aspects of Stone Garden but not its Earth/art emphasis or the other novels. **Space techno fiction** requires
  a central interstellar technological experience that the corpus does not supply. The interstellar-history leaves also fail
  their sustained historical-course test.


  ## Wobble and what could change the judgment

  This is an uneven fiction with no perfectly literal all-four leaf. Chimera is centrally cyberpunk; Stone Garden is centrally
  an art mystery; Horizons is centrally a political orbital thriller. The whole-fiction choice favors an established visible
  reader invitation rather than a new singleton or the last novel''s setting. Discovering that the creator''s continuity statement
  explicitly excludes one of these SF novels would change the corpus. A source-established supernatural finale would require
  a root re-walk; none has been found. A reliable full Stone Garden ending could strengthen or alter the mental-capacity reading
  and must not be fabricated. None of these caveats permits a hidden eleventh placement or an unapproved structural change.


  ## Cover inspection

  Four distinct English front covers were downloaded only for local inspection and hotlinked, never committed as bytes. Contact

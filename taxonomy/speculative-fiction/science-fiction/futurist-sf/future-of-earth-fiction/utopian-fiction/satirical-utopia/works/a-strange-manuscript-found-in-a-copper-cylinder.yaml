placement_rationale: SFE identifies an Antarctic Utopia and Lost-Race novel whose inverted society dismantles imperial assumptions; Broadview describes the Kosekin valuing death, abjection and poverty against civilized norms. The designed inversion of social values is the novel's satirical engine, making Satirical Utopia closer than adventure-only Lost world.

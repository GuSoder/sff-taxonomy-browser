placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Hopepunk -> Ecotopian.
  Orbit describes a near future where an institution founded in 2025 represents future generations and protects all living creatures, tracing collective efforts to
  turn the climate crisis before collapse. Ecological repair and institutional transformation build the better order.'

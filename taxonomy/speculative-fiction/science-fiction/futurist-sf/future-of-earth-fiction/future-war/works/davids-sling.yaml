id: davids-sling
title: David's Sling
authors:
- Marc Stiegler
first_published: 1988
canonical_genre: future-war
placement_status: accepted
placement_rationale: 'Whole-fiction actual-tree walk, 23 November 2026. One identified standalone novel, David''s Sling, first
  published 1988. The queue''s 2015 is the ebook/reissue, not a new novel. Baen''s own publication date, ISFDB, the 1988 library
  record and Tom Glass''s contemporary 1989 review agree on 1988; SFE''s 1984 date in both prose and list is contradictory
  and not silently harmonized. Current author/publisher bibliographies list David''s Sling separately from Earthweb and Brains
  Trust. No same-world binding or published sequel established in the sources checked, so those other works are not folded
  merely because they share an author, libertarian ideas or information technology. Two completed independent reviews read
  in full, plus the publisher synopsis and selected primary-sample passages across the four linked opening dated sections.
  Not claiming the full novel was read. Wikipedia''s novel page carries an LLM-content warning and is not relied upon for
  plot.

  Root: Science fiction, not Fantasy. Cheap autonomous Hunters, expert systems, computer networks, information filtering and
  weapons design are the causal innovations. The primary sample''s descriptions of journalism''s magic and bureaucratic paperwork
  as voodoo/black magic are explicit comparisons, not supernatural events. Superrationality is taught through Prisoner''s
  Dilemma/cooperation exercises and self-sacrifice, not a paranormal power. No literal magic or confirmed time travel/parallel
  crossing established by source-read plot, sample or complete criticism. Atemporal is therefore not the supported organizing
  branch.

  Temporal walk: Futurist SF, with genuine Modern-day SF/Technothriller and Historical SF rivals. This 1988 author extrapolates
  the next information age, with an extended US/USSR standoff, fictitious presidents, smart weapons and a subsequent Soviet
  attack in Europe. The Extropy reviewer describes references to the 1990s as past and notes that Eastern Bloc events made
  the projected plot obsolete; this is an overt writer-future projection, not a modern author reconstructing the Cold War.
  The current tree''s Futurist definition admits once-proposed speculative science that now reads as an alternate path. Historical
  SF cannot be rejected merely because the author originally called it future, but no named past-era setting or explicit fork
  from real history was established in the primary/sample/complete-review evidence. Alt Cold War/Alt present are the strongest
  historical alternatives because the USSR survives and Soviet aggression is the dated geopolitical frame. Unlike an explicit
  branched-history novel, the whole reader promise remains the emergence of an information-age technology and organization
  able to replace industrial-age war. This is a substantial dated-world wobble, not a claim that the book predicts our present.
  Modern-day Technothriller also fits the largely mundane institutions and technical crisis, but Future war explicitly includes
  near-future and modern Earthbound conflict; that exact war-engine leaf is more precise here than forcing the future into
  one information-thriller mechanism.

  Futurist siblings: Future of Earth fiction. No central interstellar travel, settlement or alien contact. SFE''s introductory
  description of Stiegler as a Hard SF writer is author-level evidence, not enough to put every novel in Hard SF. The engineering
  matters, and the primary sample gives solar cells, detectability, reconnaissance and target selection, but the complete
  story is not principally a rigorous physical-science puzzle. Institutional resistance, conflict, epistemic ethics and weaponized
  information organize it. Not Alien fiction: Earthweb''s alien invasion belongs to a different separately listed novel, not
  this plot.

  Future-of-Earth siblings: Future war, whose actual definition is war transformed by technology and fought on Earth, explicitly
  including near-future/modern entries. The primary publisher centers hackers building smart weapons to end a superpower war
  without destroying the planet. Both completed reviews identify the military-industrial system, Soviet attack and cheap unmanned
  Hunters that disable command as the governing conflict. The primary sample shows the Sling proposal''s reconnaissance/command-targeting
  logic and the antiwar technical alternatives. Future societies/Future social SF is a strong rival because the Zetetic Institute,
  rationality, decision duels, journalism, labor and corporate opposition occupy much of the book. Yet those are the means
  and opposing forces through which the technology changes the defense problem, not a sustained course of civilization or
  a detached examination of an already-established social order. Future history of Earth would overstate the time span of
  this one crisis. Utopian values do not make the whole world an attained utopia. No dystopian total state, ruined Earth,
  uplifted biology or central psi engine.

  Techno fiction/Cyberpunk siblings also tested: networked cooperation and the head programmer''s damaging immersion are real,
  but neural experience, immersive avatar worlds, machine emancipation or copied consciousness are not the common governing
  plot. An institutional team building defense technology is not a noir outsider''s investigation or the everyday life of
  a pervasive postcyberpunk system. Machine minds/AI problem solving is one weapons component, not the whole book''s subject.
  Modern-day Infowar is not an unexamined fallback: Media ops thriller fits the journalist/public-decision strand, but the
  war is not principally won by circulating manufactured images or participatory media. Surveil thriller''s tracking/profiling
  power is not the main plot despite reconnaissance; Crypto thriller lacks a decisive codebreaking/secure-channel premise.
  Spytech would overstate covert-service operations; Technocrisis would make an invented weapons-development response to war
  into a failing-system disaster. No child of that branch is as honest as the explicit Future war promise without a new definition.

  Leaf count did not choose the result: Future war eight to nine fictions, no split at nine. Military science fiction under
  Spacefaring fails its ancestor, even though the novel contains campaigns and soldiers. Future war is the existing Earthbound
  leaf. Moderate-high confidence, with the dated USSR setting and the substantial rationalist/social argument retained as
  contrary evidence. One inspected full English front from the actual Baen product page, hotlinked only; no cover image added
  to the repository.'

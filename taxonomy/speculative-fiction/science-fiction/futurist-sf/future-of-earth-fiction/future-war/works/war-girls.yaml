id: war-girls
title: War Girls
authors:
- Tochi Onyebuchi
first_published: 2019
canonical_genre: future-war
placement_status: accepted
placement_rationale: 'Frozen Future war cluster audit2026-11-05, all remaining works source-read rather than presumed
  military from title. Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future war.
  Scientific/technological extrapolation rather than supernatural causation; Earth future/alternate future of once-proposed
  science, not recognizable present or historical reimagining, and no established actual time/parallel crossing.
  Read against Hard SF rigorous-central-inquiry, spacefaring, alien-centered and future-society/techno alternatives
  before this leaf. Whole2 independently read: War Girls2172 Nigeria/Biafra resource war, bionic child soldiers,
  separated sisters, drone/mecha weapons and destroyed camp; Rebel Sisters5 years after that war, Ify is a medical
  officer in Space Colonies while Uzo and Xifeng recover war memories from destroyed androids, a refugee-children
  coma mystery returning Ify to a Nigeria whose government erases evidence of war. The second is NOT another front-line
  battle novel. High wobble: postwar trauma, memory, refugees, medicine and extensive colony scenes, not a war still
  raging. Whole-fiction closest accepted shelf retained because war technology changes bodies, childhood, memory
  and aftermath throughout the paired narrative; war and its consequences remain the shared engine. Not post-pandemic:
  localized coma mystery is not a population-wide plague aftermath; not Ruined Earth distant ruins; Orwellian propaganda/memory
  erasure alone would erase first-volume civil war, while War Girls is not primarily a study/experiment in one mind.
  This is a documented substantial straddle, no definition widened.'

id: blood-fire
title: Blood & Fire
authors:
- James Barclay
first_published: 2016
canonical_genre: future-war
placement_status: accepted
placement_rationale: 'Frozen Future war cluster audit2026-11-05, all remaining works source-read rather than presumed
  military from title. Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future war.
  Scientific/technological extrapolation rather than supernatural causation; Earth future/alternate future of once-proposed
  science, not recognizable present or historical reimagining, and no established actual time/parallel crossing.
  Read against Hard SF rigorous-central-inquiry, spacefaring, alien-centered and future-society/techno alternatives
  before this leaf. Whole currently published1 Heart of Granite2016, not presumed sequels from intended series label.
  Author has described work on sequel but no published second verified. Future resource-war Earth: bioengineered
  alien/human living assault carriers and drakes, Max symbiotic pilot, reflex drug that accelerates pilot madness,
  corrupt commanders hiding price, escape and attack on carrier. Author says free of magic; publisher and detailed
  SFFWorld review confirm science-fiction biotech, not literal fantasy dragon-riders. Future war retains over altered-flesh
  or genetic-caste theme, because carrier/squad combat, military advantage and costs drive conspiracy. Substantial
  body-horror and thriller/whistleblower wobble, but no unrelated alien civilization or space story.'

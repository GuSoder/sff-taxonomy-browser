placement_rationale: 'Frozen Future war cluster audit2026-11-05, all remaining works source-read rather than presumed
  military from title. Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future war.
  Scientific/technological extrapolation rather than supernatural causation; Earth future/alternate future of once-proposed
  science, not recognizable present or historical reimagining, and no established actual time/parallel crossing.
  Read against Hard SF rigorous-central-inquiry, spacefaring, alien-centered and future-society/techno alternatives
  before this leaf. Whole3 separately verified with3 publisher plots, author interviews and2 finished-book reviews:
  Cry Pilot recruits Kaytu against rogue biological weapons, secret past and squad found-family/CAV pairing; Burn
  Cycle trains paired pilots and searches Earth for Hatchery source of lampreys; Kill Orbit sends same squad hours
  later into space against hostile fleet/planet-killer, warehouse/research habitat. Not inferred3 Earthbound books:
  final is entirely significant space-combat volume. Author explicitly calls3 continuous single story, no offscreen
  gaps, Earth defense remains objective. Future war retained as2 Earth volumes establish technology-transformed
  war of repairing Earth and final space pursuit resolves same threat; not an independent interstellar civilization
  war. Very high geographic wobble, noted without reducing final to incidental trip. Found family, secret technopath
  and criminal redemption secondary to military campaign rather than LitRPG or supernatural fantasy.'

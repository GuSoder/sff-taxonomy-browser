canonical_genre: future-war
placement_status: accepted
placement_rationale: 'Whole-fiction hard walk2026-11-05, active MC04785. Speculative fiction > Science fiction >
  Futurist SF > Future of Earth fiction > Future war. Whole TransDimensional Hunter4: Into the Real2022, Through
  the Storm2023 (2024 paperback not first date), Behind the Veil2025 (queue2020 wrong), Beyond the Rift2026. Both
  authors and publisher series enumerate4, author completion notice confirms complete February3,2026. Not four separately
  placed fictions. Each volume source-read independently:1 anxious teen Lynn recruited to augmented reality beta,
  local teams and puzzling real incidents;2 national qualification, celebrity/drone paparazzi, rival/team sabotage,
  romance and grid disasters;3 championship, increasingly dangerous mobs at electrical nodes, dead homeless people,
  stalker/deepfakes, revelation actual parasites;4 recruits join government taskforce military training and defeat
  global threat, personal arcs close. Previous Warzone Earth singleton was blurb-only and missed both future era
  and whole4. Author interview explicitly future advanced everyday VR, review2040; fails Modern-day recognizable-present
  ancestor before attraction to alien war. Science framing particle detectors/emission, dark-energy parasite, AI
  and neural LINC, not fantasy magic. Critically, transdimensional is not automatically parallel worlds: author
  primary free same-universe story Operation Mall Stroll explains spooks as diffuse insubstantial particles occupying
  same Earth, invisible to humans and humans invisible to them; CGI overlay turns detector data into game-monsters,
  own particles harvested/reversed as weapons. No established journey/identity/communication between multiple parallel
  versions of reality, no alternate Earths or backward time trip established. Therefore cannot assert Parallel World
  fiction from title/review phrase another dimension alone. Primary Beyond Rift opening1975-77 radar experiment
  is historical flashback, not time travel; current2040s campaign governs. Future war retains Earthbound technological
  conflict: devices make otherwise invisible enemies tangible and gamers a proxy army;4 openly military closes same
  war. Near-future first contact8 is strong alternative for nonhuman discovery but no sustained dialogue/cultural
  encounter, war and defense remain narrative answer. Alien horror overreads lethal monsters where tone is tactical
  adventure/coming of age. Hard SF rigorous experiment fails, technology explained but plot centered on Lynn/team
  and survival. Cyberpunk LitRPG is major surface wobble but scores/weapons/levels are interface for real particle
  conflict, not literal laws of virtual existence; Metaverse similarly no relocation to avatar-world, neural LINC
  enables AR but altered mind/reality not engine. Very high whole-fiction wobble: first3 largely school, gaming,
  celebrity and relationships; conspiracy hidden from public, enemies no conventional fleets. Future war broad near-future
  technological Earth warfare is most honest existing leaf, not silently widening Modern-day or claiming unverified
  multiverse. Primary Operation Mall Stroll is short story, recorded as supporting same universe not extra novel.
  Distinct English Baen print fronts all4 inspected, low resolution157-160x240 disclosed, localized; no titlepages/foreign/audio.
  Warzone Earth6->5, Future war7->8, no structural freeze.'

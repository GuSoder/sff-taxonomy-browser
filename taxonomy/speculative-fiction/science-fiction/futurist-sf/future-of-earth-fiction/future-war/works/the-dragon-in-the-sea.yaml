id: the-dragon-in-the-sea
title: The Dragon in the Sea
authors:
- Frank Herbert
first_published: 1956
canonical_genre: future-war
placement_status: accepted
placement_rationale: 'Frozen Future war cluster audit2026-11-05, all remaining works source-read rather than presumed
  military from title. Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future war.
  Scientific/technological extrapolation rather than supernatural causation; Earth future/alternate future of once-proposed
  science, not recognizable present or historical reimagining, and no established actual time/parallel crossing.
  Read against Hard SF rigorous-central-inquiry, spacefaring, alien-centered and future-society/techno alternatives
  before this leaf. Whole singleton1956 novel, serial Under Pressure1955 is same work. Publisher+Willis McNelly
  EBSCO detailed plot: nuclear sub-tug oil theft in future global resource war, psychologist/electronics officer
  Ramsey to identify spy among4, crew breakdown, sabotage, Garcia sacrifice and critique of secrecy. Future war
  is modest rather than perfect: submarine engineering/psychological pressure/spy puzzle dominate stage, but technology-determined
  oil war mission and sanity costs organize whole. Psychological SF close, yet mind is being clinically observed
  inside military mission rather than new mind-altering experiment as defining technology. Hard SF engineering close,
  but spy/crew pressure/war critique dominant, not sustained formal constraint exposition. No time or alien gate.'

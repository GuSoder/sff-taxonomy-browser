placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Future of Earth fiction > Future war.
  Per Wikipedia, ISFDB and Templeton Gate: in a low-intensity global war that mirrors the early Vietnam War, naval officer
  Logan Miller is in a navy that communicates with trained animals and uses them as spies, ESP rapport is sold by the minute,
  and an enemy weapon called the Glotch kills military and civilians; extraterrestrials arrive in the last pages. War transformed
  by technology, fought on Earth, is the Future war definition. Rejected: Psionics (telepathy and animal rapport are the war''s
  tools, not the subject), Alien conquest fiction (the aliens appear only in the last few pages). Wobble: the psi and animal-link
  technology pulls toward Psionics, and the ending reaches for first contact. Year 1956, the Galaxy serial that was its first
  publication; ISFDB lists the Ballantine book at 1957.'

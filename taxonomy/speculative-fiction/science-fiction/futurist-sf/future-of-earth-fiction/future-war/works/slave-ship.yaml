id: slave-ship
title: Slave Ship
authors:
- Frederik Pohl
first_published: 1956
canonical_genre: future-war
placement_status: accepted
placement_rationale: 'Frozen Future war cluster audit2026-11-05, all remaining works source-read rather than presumed
  military from title. Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future war.
  Scientific/technological extrapolation rather than supernatural causation; Earth future/alternate future of once-proposed
  science, not recognizable present or historical reimagining, and no established actual time/parallel crossing.
  Read against Hard SF rigorous-central-inquiry, spacefaring, alien-centered and future-society/techno alternatives
  before this leaf. Whole singleton serialized1956, first book1957 per ISFDB original-edition notes/Baen.1956 retained
  as work first appearance, not wrong1957 book-date overwrite. Publisher and2 full independent reviews: future global
  war, animals translated and enlisted, telepaths killed by mysterious Glotch, Miller tasked to infiltrate enemy
  base, bureaucracy/manpower desperation satirized, abrupt final alien intervention. Future war retained over alien
  fiction: aliens enter only in final pages, war/animal-language weapon and military life dominate. Satire substantial,
  but humorous umbrella is under Modern-day recognizable present whereas this alternate near-future has telepath
  corps and technological animal army. Psi telepathy would overread one strategic weapon as all book; other uplift/gene
  branches fail human animal language is learned, not genetically uplifted species. SF not fable, real animals trained
  as soldiers, not anthropomorphic allegory.'

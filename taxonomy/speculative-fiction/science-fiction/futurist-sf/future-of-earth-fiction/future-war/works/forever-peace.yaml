placement_rationale: 'Standalone novel (1997; SFE: shares only its title with The Forever War, separate universe). In 2043
  an Alliance of rich states fights a prolonged dirty war against third-world guerrillas, soldiers like Julian Class jacking
  cyberlinks into remote soldierboy war machines (Kirkus; SFE). The war and its technology organize the book, and the resolution
  comes through that same technology: prolonged cyberlinking renders soldiers incapable of killing, so peace becomes inevitable
  (SFE). War transformed by technology, fought on a near-future Earth - the future-war shape. Rejected: military-science-fiction
  under spacefaring (the conflict is Earthbound; the spacefaring ancestor gate fails), techno-fiction (the nanoforge/Jupiter
  threads serve the war story''s resolution, not vice versa).'

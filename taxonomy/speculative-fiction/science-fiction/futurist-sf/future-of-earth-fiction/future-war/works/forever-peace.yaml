placement_status: accepted
placement_rationale: 'Frozen Future war cluster audit2026-11-05, all remaining works source-read rather than presumed
  military from title. Speculative fiction > Science fiction > Futurist SF > Future of Earth fiction > Future war.
  Scientific/technological extrapolation rather than supernatural causation; Earth future/alternate future of once-proposed
  science, not recognizable present or historical reimagining, and no established actual time/parallel crossing.
  Read against Hard SF rigorous-central-inquiry, spacefaring, alien-centered and future-society/techno alternatives
  before this leaf. Whole standalone1997 novel, explicitly not same universe/sequel to Forever War despite thematic
  pairing. Publisher+SF Site full review:2043 remote soldierboys jacked in through squad linkage, Ngumi economic
  war, Julian/Amelia discover Jupiter Project can destroy universe, competing conspiracies to stop it and technologically
  remove human war impulse. Future war retained with substantial technocrisis/neural/social-engineering shift: battle
  gives way to prevention of apocalypse and induced peace. A neural interface alone does not make central reading
  immersion/altered-reality Neural fiction; linked empathy turning war off is the political/war thesis, not private
  mind experiment. Modern-day Technocrisis fails explicit2043 changed order. Hard scientific conceptual apocalypse
  alternative real but not controlling rigor, SF Site focuses social and extremist struggle. No actual time journey
  established despite cosmic reset threat.'

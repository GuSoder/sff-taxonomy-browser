id: the-council-wars
title: The Council Wars
authors:
- John Ringo
first_published: 2003
canonical_genre: future-war
placement_status: accepted
placement_rationale: 'Whole-fiction re-walk2026-11-05 at activeMC04784: Speculative fiction > Science fiction >
  Futurist SF > Future of Earth fiction > Future war. Existing Council Wars card omitted first novel even though
  its own note named it. Restored complete4: There Will Be Dragons2003, Emerald Sea2004, Against the Tide2005, East
  of the Sun West of the Moon2006, publisher and ISFDB dates. Whole-fiction aboutness audited independently across
  all4 via four Baen synopses and separate Rosboch reviews, with SF Site/Fantasy Literature for1 and detailed Wyrmis
  for2.1 begins with the Net council''s war draining the power of a post-scarcity civilization; Talbot''s retained
  practical knowledge, reenactment and rebuilding Raven''s Mill protect refugees, while Mother limits high-energy
  weapons.2 advances to Herzer''s dragon-carrier expedition and diplomacy/naval fighting among engineered merfolk.3
  moves to rearming the navy and defending Atlantis against New Destiny''s invasion.4 sends Herzer and an assault
  team into space to capture incoming reactor fuel that can decide the same war on Earth. Source-read whole fiction
  is therefore not3 installments inferred from the first-book village. SF rather than Fantasy: nanites, AI power
  limits and genetically modified humans/creatures explain the dragons, elves, merfolk and forced low-tech fighting;
  no actual supernatural causation. Explicit future Earth thousands of years on defeats Modern-day/Historical. Not
  Atemporal Science fantasy: identifiable future Earth and explicit surviving space/teleportation machinery, not
  exile from usable timeline or known-physics Hard science fantasy. Futurist > Future of Earth over spacefaring:
  the final raid is a significant whole-volume space segment, but its fuel struggle serves the Earth factions''
  ongoing war and the preceding three books are Earthbound. This mixed geography is substantial, not ignored. Hard
  SF fails rigorous scientific-model/engineering inquiry, with highly permissive nanotech; alien branches fail human-engineered
  creatures and human factions, not extraterrestrials. Within future Earth, Future war governs: council war transforms
  available technology, energy budget and tactics, forcing engineered humans, reenactors, dragons and naval/ground
  forces into old-style combat before the final fuel operation. Techno fiction (post-nano/AI overlords) captures
  the premise, not the engine: the human factions'' war, not collective life under a settled nano order or machine
  rule, drives all4. Utopian fiction fails war-torn fallen paradise, Future societies fails the sustained military
  campaign as dominant reading, Psionics fails technical rather than psychic powers. Dystopian aftermath is a strong
  alternative for1; the old Lost knowledge keepers placement overweights it. Ruined Earth''s ancestor requires civilization''s
  ruins as landscape/relic/myth/foundation of successor societies, but these books stay in the immediate living
  aftermath, actively fighting the same council and resource war with surviving technology, not long-after ruin
  cultures. Post-holocaust wasteland settlements similarly misses2 naval diplomacy,3 naval campaign and4 fuel raid;
  knowledge guard/recovery alone does not organize the whole fiction. Earthbound military war is the sustained organizing
  frame, not a classed hero''s fantasy or one voyage of space warfare. Wobble high: first-book village reconstruction,
  military training and practical-knowledge retention are extensive,2 has comic romance/sea adventure,4 moves physically
  to space. Authorial technologies are speculative and not uniformly scientifically rigorous. Nonetheless the whole
  ongoing Earth war and technology-determined tactics are the closest honest accepted definition without widening.
  Future war becomes10 and freezes; no further intake until cluster audit and one split decision served. Existing
  source leaf7->6. Missing first novel restored, original fiction starting year2004->2003. Four distinct English
  Baen front jackets inspected and localized, first lowres158x240, other3 clean328-330x500. No short appended story
  or revised edition counts as extra novel.'

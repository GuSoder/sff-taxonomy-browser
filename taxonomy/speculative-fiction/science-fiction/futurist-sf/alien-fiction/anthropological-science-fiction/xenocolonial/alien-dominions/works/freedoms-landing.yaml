placement_rationale: 'McCaffrey''s Catteni (Freedom) series (Freedom''s Landing 1995, Freedom''s Choice 1996, Freedom''s Challenge
  1998, Freedom''s Ransom 2002): one series, so one fiction. Humans are slaves of the humanoid Catteni, who round up troublemakers
  and drop them on empty worlds; Kristin Bjornsen and a renegade Catteni, Zainal, lead the dumped humans on the planet Botany,
  then a rebellion against Catteni rule and a trade settlement between humans, Catteni and their allies (Wikipedia, Catteni
  Series: ''humans are slaves of aliens, the humanoid Catteni''; Kirkus review of Freedom''s Landing). Walk: Science fiction
  > Futurist > Alien fiction > Anthropological science fiction > Xenocolonial > Alien dominions (humans live inside alien
  colonial power; captivity, subordination and the alliance that follows). Rejected: Colonial worlds (the humans are not the
  colonisers; they are deportees under alien rule), Alien conquest fiction (Modern day, and the war is not the story), Alien
  expedition (no voyage of discovery). Wobble low. Sources are Wikipedia and Kirkus, not the books. First publication 1995-2002.
  Queue ids MC00756, MC00755, MC00754, MC00757.'

placement_rationale: 'The Chapalii Empire has absorbed humanity without a shot; Tess, sister of the first human duke in the imperial hierarchy, travels to the interdicted
  planet Rhui and is drawn into the nomadic jaran, while her husband builds a rebellion against the alien overlords. The engine is humans living and maneuvering inside
  an alien colonial dominion - assimilation, subordination, allegiance (Open Road Media series page; SF Site; Wikipedia). Walk: Science fiction > Futurist SF > Alien
  fiction > Anthropological science fiction > Xenocolonial > Alien dominions (humanity already inside the alien empire; the question is what life under the dominion
  means). One universe, one card (rule 11j); series completion fold verified against the author and Open Road bibliographies: four novels 1992-1994, The Law of Becoming
  the last; queue listed only Jaran. Source: publisher and reviews; not read.'

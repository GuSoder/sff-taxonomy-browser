placement_rationale: 'Root-down audit 2026-11-04: Speculative fiction > Science fiction > Futurist SF > Alien fiction
  > Anthropological science fiction > Xenocolonial > Colonial worlds > Frontier planets. Ofelia stays when the company
  evacuates her colony; the returning reconnaissance crew is killed, native sentients make contact, and her understanding
  of them challenges the returning human experts. This is a colonial cultural encounter, not merely a colony routine
  interrupted late by contact. The human settlement on native ground and the sharing of that ground select Colonial
  worlds and Frontier planets over Alien dominions or Planet plunder. Rejected: Space colonies > Colony life > Prehabited
  world, because her solitary domestic independence prepares the cross-cultural encounter but does not displace
  it as the novel''s engine; alien discovery alone omits the colonial relationship. Wobble: her old age, solitude
  and self-determination remain substantial. Sources read: PRH publisher description and Booklist endorsement (alien
  anthropology), https://www.penguinrandomhouse.com/books/116496/remnant-population-by-elizabeth-moon/; not the
  novel itself.'

placement_rationale: 'The Heorot series (The Legacy of Heorot 1987, Beowulf''s Children 1995, Starborn & Godsons 2019; Wikipedia,
  Baen): cold-sleep colonists settle the world Avalon, where fast, cunning native predators, the grendels, with a life cycle
  designed with biologist Jack Cohen, must be fought; the sequels follow the second generation and the conclusion. Walk: Futurist
  > Alien fiction > Anthropological SF > Xenocolonial > Colonial worlds > Frontier planets (settlers on ground already alive
  and someone''s; homesteads and uneasy sharing). Weak: the natives are predators, not a culture, so the treaty side of the
  definition is thin. Alternative: Colony life. Sources: Wikipedia, Baen; not read.'

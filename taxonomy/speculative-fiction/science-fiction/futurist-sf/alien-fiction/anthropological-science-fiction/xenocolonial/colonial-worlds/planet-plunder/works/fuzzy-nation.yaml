placement_rationale: 'MC04832 whole standalone Fuzzy Nation2011 source rewalk2026-11-05: Speculative fiction > Science
  fiction > Futurist SF > Alien fiction > Anthropological science fiction > Xenocolonial > Colonial worlds > Planet
  plunder. Retain1,leaf5. Author explicitly April2010 reboot breaks Piper established continuity, not sequel; March2011
  authorization from Piper estate doesn''t turn separate world into shared continuity; no merge original LittleFuzzy/FuzzySapiens/Piper
  continuations. Bookpage independently describes discarded canon, publisher standalone reprint not new volume.
  First2011, currentEnglish2022Tor paperback front used openly reprint, not mislabeled first edition. Primary publisher
  synopsis plus author statements, Wired, Bookpage, Doctorow, FanLit finished reviews read. JackHolloway prospector/disbarred
  lawyer finds sunstones fortune on Zarathustra/ZaraXXIII under ZaraCorp, befriends localFuzzys, biologist former
  girlfriend studies sapience, corporation license depends on no native sentients, intimidation/killing and court
  case threaten company rights and Jack own fortune; intertwined integrity/native personhood over extractive charter.
  Reviewer actual climax legal recognition rather than discovery as sole engine, no speculative extra sequel. SF
  extraterrestrial sapience/colonial corporate institutions, no supernatural power or confirmed actual time-travel/parallel
  crossing. Futurist interstellar human economy178lightyears from Earth, not recognizable present or period/alternate-history
  recreation or atemporal world; reboot is textual continuity not literal alternate universe travel. Alien fiction
  rather than HardSF physical constraint, Future Earth society or Spacefaring exploration/colonist civic life: native
  intelligence/personhood and observers'' assumptions drive legal colonial encounter. Anthropological over generic
  Firstcontact: discovery real but first meeting serves who counts as a person and resulting extraction rights,
  not only contact communication or diplomatic mission. Not Hardalien cosmological engineered deep strangeness,
  Cosmic history eons of alien evolution, Alien horror dread contract despite violent corporate threat. Anthropological
  alien not Earthborn human-only estrangement. Xenanthropology noninterference fails violent company/charter trial
  intervention; Xenolinguistics communication/sapience important but no translation/language-model puzzle governs,
  rights and colonial control does. Xenocolonial colonial dispossession/extraction native personhood, not Alien
  dominions humans subordinate to aliens; human company on native world. Colonial worlds native collision not Space
  colony politics purely settlers'' own institutions. Planet plunder extracting sunstones/denying sapience/trying
  eliminate natives, not Frontier planets homesteads/coexistence. Humor and courtroom caper strong tonal/formal
  wobbles, not license to use contemporary HumorousSF ancestor; Space law under space colonies would misstate natives
  as subordinate to human civic caseload. Home retained with reviewed evidence, no definition edits or structural
  gate. Current Tor2022English print front640x975 pixel-inspected/localized rather than old external cover. MC04831
  After the Coup authorJuly20 2008 explicitly short story in OldMansWar, skip-short-story not separately count;
  later ebook2010 not first publication. Unrelated Piper incomplete-card leads not repaired here outside active
  fiction.'

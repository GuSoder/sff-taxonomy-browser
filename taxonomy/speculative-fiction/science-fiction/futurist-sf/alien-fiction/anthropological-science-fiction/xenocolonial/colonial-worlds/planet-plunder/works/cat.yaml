placement_rationale: '# Cat: root correction found during the ten-card Psionics audit

  24 November 2026


  ## Decision

  Move the existing whole three-novel **Cat** fiction from Psionics to existing **Planet plunder**. Psionics10to9; Planet
  plunder5to6. No new structure, definition, book, cover or author. The old placement''s statements that this was Earth''s
  corporate near future and had no spacefaring sweep are factually false. This correction is not a fabricated split axis and
  does not change Psionics'' gate to make a difficult card disappear.


  ## Whole corpus

  - **Psion (1982):** Cat is a half-Hydran street orphan on Ardattee, not Earth. Psi research recruits him as an alternative
  to forced labor; the institute''s covert objective is to counter Rubiy/Quicksilver. After expulsion Cat is transported to
  Cinder''s telhassium mines. The struggle over the critical resource, exploited labor and the Hydran Spooks makes his alien
  heritage and corporate extraction substantive rather than decorative.

  - **Catspaw (1988):** Kidnapped from Monument and taken to Earth, Cat works under corporate coercion as an apparent protector,
  actually bait, for the taMing clan. It concerns the shipping combines'' power, contract labor, his suppressed telepathy,
  and the gap between the privileged and those made useful to them. This book''s Earth setting explains how an opening-book-only
  or selective source summary could have gone wrong, but does not define the other two.

  - **Dreamfall (1996):** Research on Refuge, homeworld of the Hydrans, brings Cat into Tau Biotech''s reservation system
  and extraction of dreamfall reefs produced by cloud whales. What the Hydrans hold sacred is exploitable data to Tau. Cat''s
  hybrid status leaves him between human corporate power and Hydran resistance. This is an explicit colonial extraction conflict,
  not simply a psi laboratory on Earth.


  SFE confirms one three-novel Cat sequence. Alien Blood is an omnibus, not an extra novel; Psiren is a short work, not imported.
  The three existing English covers, years, authors and book list remain unchanged.


  ## Root-down walk through the actual tree

  1. **Speculative fiction > Science fiction**, not Fantasy: this is Earth-descended interstellar humanity and alien Hydrans,
  psi and technology, no established literal magic. The psi carve-out applies.

  2. **Science fiction > Futurist SF**, not Modern day, Historical or Atemporal: human galactic institutions, stellar travel
  and psi science are written as a speculative future. No included-novel time-travel frame is established.

  3. **Futurist SF > Alien fiction**, not Future of Earth fiction. The latter includes Earth-descended life, so off-world
  setting alone is not a universal exclusion: the old factual premise fails, and this whole-fiction subject chooses Alien
  fiction. Cat''s mixed Hydran identity, the human suppression and exploitation of alien minds and his encounter with his
  mother''s people organize the whole arc. Earth is the principal location of Catspaw, but Ardattee/Cinder and Refuge anchor
  the other novels. A lower Psionics mechanism match cannot override the old ancestor''s false Earth-centered claim. **Spacefaring
  fiction** is a genuine rival, SFE calls these space-opera adventures, but the more specific common subject is alien/human
  inequality and the value extracted from alien capacities. **Hard sci-fi** is not the reading experience.

  4. **Alien fiction > Anthropological science fiction:** cultural and racial estrangement, social exclusion and the observer/participant''s
  hybrid position drive Cat''s arc. **First contact** fails, relations are long established. **Hard alien** would overstate
  rigorous biological/physical mechanism; alien capabilities matter through social power. **Alien cosmic history** fails,
  no sustained cosmic civilizational chronicle; **Alien horror** fails the primary register; **Alien delving** fails, no entry
  into an ancient object is the common action.

  5. **Anthropological SF > Xenocolonial:** cross-species encounters are coercive, assimilating and extractive. **Earthborn**
  is wrong because the Hydrans are genuinely alien, not only culturally estranged humans; **Xenanthropology** is wrong because
  the observer is deeply involved and interference is the conflict; **Xenolinguistics** is not the governing language/translation
  subject.

  6. **Xenocolonial > Colonial worlds**, not Alien dominions: human combines and institutions hold the power over alien capacities
  and native life, not humans subject to an alien empire.

  7. **Colonial worlds > Planet plunder**, not Frontier planets: the recurring power is corporations treating labor, minds
  and alien resources as things to use. The most concrete bookends are Cinder''s telhassium regime and Refuge''s thought-reef
  mining. This is extraction rather than settlers negotiating a home on alien ground. Catspaw''s Earth-based corporate intrigue
  is an explicit crossover, kept with the whole fiction under the owner''s whole-fiction rule. It is not falsely described
  as occurring on a resource planet.


  ## Other serious rival routes, actual definitions checked

  Spacefaring fiction''s children are Space opera, Military SF, Future history in space, Space techno fiction, Generation
  starships, Space dystopias, Space colonies and Comic space future. The stories are not military campaigns, a long civilizational
  chronicle, engineering-led fiction, shipboard multigenerational society or comedy. Dystopian oppression exists but the alien-human
  relation is the more specific subject. Space colonies is an arena of established off-Earth civic life rather than colonization;
  its Space mystery > Space PI rival captures Catspaw''s bodyguard/inquiry and mystery-shaped Dreamfall, but is not the first
  novel''s action and misses the recurring exploitation. Space colony politics > Space colony dynasties captures taMing/Tau
  corporate power but loses the human-alien colonial meaning. New space opera > Political space opera > Revolutionary space
  opera would overstate Cat as an empire-overthrow protagonist. Its court, post-scarcity and succession rivals fail their
  primary subjects. Space adventure''s caper, chase and combat are episodes, not the trilogy''s common purpose. Space romance
  and Spaceship drama do not fit the sustained spine. The actual existing colonial extraction leaf is stronger than seeding
  a mechanism-based space psi leaf.


  ## Caveats

  This is a moderate-to-high confidence correction to a definite factual ancestor error. The exact best whole-fiction emphasis
  is a judgment: psi is real and important, Catspaw is largely Earth-based elite intrigue, and Dreamfall''s extraction is
  clearest. Planet plunder wins because the early Cinder material makes it more than an endpoint rule, and the broader corporate
  exploitation of difference persists in the middle volume. Do not claim every book is a mining story. No sourced owner instruction
  specifically requiring Cat to remain in Psionics was found in original conversation searches.



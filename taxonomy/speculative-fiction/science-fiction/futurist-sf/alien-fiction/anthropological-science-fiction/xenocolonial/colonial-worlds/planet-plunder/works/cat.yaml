  - Michael Rawdon completed Psion review, Ardattee, Cinder and institute-to-mining arc: https://www.fascinationplace.org/2007/12/22/joan-d-vinge-psion/

  - James Davis Nicoll, completed Psion review, Cinder exploitation and alien Spooks: https://jamesdavisnicoll.com/review/the-gutter-level-view-of-an-interstellar-plutocracy

  - Hilary Williamson, BookLoons completed Psion review, Cinder/Hydran plot and resolution: http://bookloons.com/cgi-bin/Review.ASP?bookid=5307

  - Tor publisher Catspaw, taken to Earth, corporate clan, coerced bait: https://torpublishinggroup.com/catspaw/?format=trade&isbn=9780765303417

  - Michael Rawdon completed Catspaw review, taMing corporate politics and labor: https://www.fascinationplace.org/2007/12/28/joan-d-vinge-catspaw/

  - Tor publisher Dreamfall, native reservation and sacred reef extraction: https://torpublishinggroup.com/dreamfall/?format=trade&isbn=9780765303424

  - Michael Rawdon completed Dreamfall review, Refuge, Hydran culture and corporate conflict: https://www.fascinationplace.org/2007/12/29/joan-d-vinge-dreamfall/

  - Archived SciFi Weekly, Tamara I. Hladik, completed Dreamfall criticism, explicitly anthropological, human colonization
  and reef mining: https://web.archive.org/web/19961220074622/http:/www.scifi.com/sfw/issue25/books.html

  - eNotes free visible excerpt, Psion prejudice and suppression of mixed identity, the paywalled remainder not used: https://www.enotes.com/topics/psion/in-depth

  - Risingshadow omnibus synopsis and full novel series list: https://www.risingshadow.net/book/9766-alien-blood


  Unauthorized whole-book mirrors surfaced in search results but were not opened as evidence. A recent SFcrowsnest review
  contains an obvious unrelated Frozen/Snow Queen error, so it was not used to carry the classification. Tor''s broken January1900
  display date was not used for publication years.


  ## Gate audit context

  Rosenblum''s four-novel card had legitimately brought Psionics to ten, so intake froze. The required all-ten root audit
  found Cat''s factual ancestor failure. Correcting it removes the split trigger, not through changing the genre gate or shrinking
  a shared universe. The other nine have not received a final signed-off audit yet. In particular, the original owner approved
  Lathe beside Ubik on16September2026, phonemsg-01M2N431GVP5YY7A7FAYA2C3XY, then accepted the Earth setting in phonemsg-01M2N58XX4QMYR486QR3WBSQES.
  Those original decisions were recovered rather than overwritten by generic time/reality reasoning. Current corpus has no
  eleventh card, no definition change and no structural approval question to execute. The remaining nine audit must finish
  before intake resumes.


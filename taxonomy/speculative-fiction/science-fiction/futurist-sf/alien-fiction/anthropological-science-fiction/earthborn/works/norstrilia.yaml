placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Alien fiction > Anthropological science fiction
  > Earthborn. Rod''s encounter with Norstrilian and Earth societies, including life in an Underperson''s body, examines
  who counts as human and changes his inherited assumptions. The cultural encounter is the engine; the societies and
  their engineered servants are Earth-derived, not extraterrestrials. Not sustained future history: the eligible corpus
  is this novel, not the Instrumentality''s excluded short stories. Not Earthbound Future social SF: the Norstrilian
  colony and its contrasting customs are integral. Not Xenanthropology''s noninterfering alien fieldwork, Xenolinguistics''
  translation problem or Xenocolonial''s colonial cross-species encounter. The novel includes personal adventure and
  distorted personal duration, but does not narrate civilization''s sustained course. Sources: https://reactormag.com/oops-i-just-bought-a-planet-norstrilia-by-cordwainer-smith/
  ; https://fantasyliterature.com/reviews/norstrilia/ ; https://www.nesfa.org/book/norstrilia/ ; https://www.cordwainer-smith.com/norstrilia.htm
  ; https://sf-encyclopedia.com/entry/smith_cordwainer . Corrective move approved phonemsg-01M66AEQH203EEN6V8M857T1R4
  on proposal phonemsg-01M66ADTG222SQHVMV3J0A54S9, 2026-10-30.'

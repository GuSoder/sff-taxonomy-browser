placement_rationale: SFE singles out the Free Traders' exogamous kinship system and the book's starship culture, while Simon & Schuster's edition follows
  Thorby from slavery through adoption into a merchant clan and across the social strata of a Galactic culture. Its sustained examination of family, trade,
  status, custom and belonging across societies makes Anthropological science fiction closer than general space adventure.

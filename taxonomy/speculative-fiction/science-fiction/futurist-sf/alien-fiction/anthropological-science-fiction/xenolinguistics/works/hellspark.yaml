placement_rationale: 'Root-down: Science fiction > Futurist SF > Alien fiction > Anthropological
  science fiction > Xenolinguistics. Far-future humanity spread through a sphere of stars,
  each settled planet with its own cultures and languages; a multilingual trader-linguist,
  Tocohl Susumo, joins the survey team on newly discovered Lassti to solve a murder and to
  test whether the birdlike natives are sapient - the sapience question and the contact both
  run through language and proxemics. Reactor: "definitely in the anthropological tradition."
  Not First contact proper: the encounter is a language-and-culture problem, not the first
  consequential encounter event itself (Baen blurb, Reactor reread).'

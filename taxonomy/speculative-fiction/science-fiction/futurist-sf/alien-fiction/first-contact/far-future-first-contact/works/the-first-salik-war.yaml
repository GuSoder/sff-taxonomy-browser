placement_rationale: 'Separated from the Theirs Not to Reason Why card (2026-11-03) under the separate-named-series precedent:
  the author presents it as its own trilogy, 200 years earlier, with different protagonists and a diplomatic focus (author
  site: ''a series full of First Contact and Political Science Fiction themes''). The trilogy follows Ambassador Jacaranda
  MacKenzie through humanity''s first consequential contact during its expansion among the stars: first contact with the V''Dan
  (a transplanted human branch) and the predatory Salik (The Terrans), diplomatic and cultural integration with the V''Dan
  Empire (The V''Dan), and the alliance moving to warfront containment of the Salik (The Blockade) (author site, TV Tropes,
  reading1000lives.com). Walk: Science fiction > Futurist SF > Alien fiction > First contact (the encounter unfolds during
  future expansion among the stars) > Far-future first contact (23rd-century Terrans with interstellar range, not near-future
  Earth). Wobble disclosed: The Blockade shifts toward the war.'

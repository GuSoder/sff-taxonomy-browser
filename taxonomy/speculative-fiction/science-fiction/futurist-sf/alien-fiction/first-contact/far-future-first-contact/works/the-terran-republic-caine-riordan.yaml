id: the-terran-republic-caine-riordan
title: The Terran Republic (Caine Riordan)
authors:
- Charles E. Gannon
first_published: 2013
canonical_genre: far-future-first-contact
placement_status: accepted
placement_rationale: 'Whole-fiction re-walk after the 2026-11-03 gate challenge from main. The series runs roughly 2105-2125:
  one analyst-envoy''s missions through humanity''s first consequential encounter with the alien powers - contact at Delta
  Pavonis, the Arat Kur/Hkh''Rkh invasion, and diplomacy seeking alliance with the Slaasriithi (elitistbookreviews.com on
  Fire with Fire: ''a first contact story overflowing with espionage, politicking, diplomacy''; bookseriesinorder.com: the
  series focuses on Caine Riordan''s contact and alliance-building with non-humans). A two-decade crisis sequence centered
  on one protagonist is not the sustained course of interstellar civilization the Future history in space gate requires. Walk:
  Science fiction > Futurist SF > Alien fiction > First contact (the encounter unfolds during future expansion among the stars)
  > Far-future first contact (the setting is humanity''s expansion era: FTL and settled nearby systems, so not the near-future
  sibling). Wobble disclosed: the middle volumes carry war-thriller texture; the contact-and-diplomacy frame governs.'

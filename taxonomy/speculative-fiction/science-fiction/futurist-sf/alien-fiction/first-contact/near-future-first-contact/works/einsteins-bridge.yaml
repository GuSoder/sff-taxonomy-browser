placement_rationale: 'Hard-SF first contact on near-future Earth: at the newly operational Superconducting Super Collider,
  physicist George Griffin discovers a Bridgehead - a wormhole link to the Makers'' universe - and learns a Hive invasion
  of Earth is imminent; the Makers send him back to 1987 to change the future. The Baen sequel Fermi''s Question (2023) continues
  the same fiction 15 years on: the Iris Foundation masters Maker wormhole tech, builds Fermi Station in the Oort Cloud, and
  joins the Makers and the robotic Centaurs in the war on the Hive. Near-future Earth transformed by alien contact, matching
  the leaf''s tenants (Voyagers, Exordia).'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Alien fiction >
  First contact > Near-future first contact. Overpopulation, disease, and ecological disaster were
  edging humanity toward extinction when the haan, an alien race, arrived on a recognizable near-future
  Earth promising salvation; by The Burn Zone (2013) they live among humans under a surrogate program,
  and by Fallout (2014) their growing colonies coincide with missing-persons cases (Penguin Random House
  book descriptions, books 311221 and 311222). Alien presence has already transformed a recognizable
  human world before any expansion among the stars - the leaf definition. Rejected: First contact
  umbrella proper (contact is established, but the leaf shelves post-arrival contact fiction: Exordia,
  A Half-Built Garden precedents), Alien horror (the haan are menacing but the engine is a conspiracy
  thriller, not dread/predation), Anthropological SF (no observer-study frame). Wobble: low. James K.
  Decker is a pseudonym of James Knapp (SFFWorld interview). Two published novels: The Burn Zone (2013)
  and Fallout (2014), one series (Goodreads series 95956 "Haan"), one card. Ember (2012) is a 96-page
  prequel novella (PRH), excluded under the novella skip. Sources: penguinrandomhouse.com (x2), sffworld.com,
  goodreads.com; not read.'

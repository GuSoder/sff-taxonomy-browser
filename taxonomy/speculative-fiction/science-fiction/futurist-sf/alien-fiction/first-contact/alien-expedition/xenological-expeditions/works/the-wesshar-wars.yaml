placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist sf > Alien fiction > First contact > Alien
  expedition > Xenological expeditions. The author''s own series page (karentraviss.com) bills the six books as ''an original
  six-part series about first contact, where an Earth expedition searching for a lost colony finds humans aren''t the top
  of the food chain''; read in order, one continuous story - one card, queue rows MC05232-36 folded with unlisted The World
  Before as series completion (author''s own order: Pearl, Line, World Before, Matriarch, Ally, Judge). What humans go out
  to meet is the alien itself - the wess''har people and their ecological law, the isenj, the bezeri; the contact is the story,
  which is the leaf''s definition. Rejected: Exoplanet expeditions (the planet is the stage; the alien societies are the subject),
  Alien dominions (the colony predates the books and the engine is the encounter, not life under alien colonial power), Hard
  alien (societies and ethics over hard cosmology). Wobble: real; the later books bring wess''har law to Earth, brushing alien-invasion
  fiction, but the expedition''s encounter remains the spine.'

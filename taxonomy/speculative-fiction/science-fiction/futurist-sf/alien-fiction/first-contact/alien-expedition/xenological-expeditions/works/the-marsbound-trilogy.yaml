placement_rationale: 'One fiction (rule 11j): the Marsbound trilogy (Marsbound, 2008; Starbound, 2010; Earthbound, 2011; ISFDB
  series 26405). Mars colonist Carmen Dula is rescued on the Martian surface by members of another species already living
  there, and the encounter deepens into contact with the Others; Starbound sends a human starship 25 light-years to Wolf 25
  expressly to meet them, and Earthbound brings the consequences home. Contact with the alien is the governing story across
  the trilogy, with the voyage to meet the alien society at its center - the xenological-expeditions shape. Rejected: near-future-first-contact
  (the encounter unfolds on Mars and in deep space, not on a transformed near-future Earth), surface-colony-life (the colony
  is the launch point, not the subject; settled civic life does not govern). Queue years 2009/2012 are reprints of 2008/2011.'

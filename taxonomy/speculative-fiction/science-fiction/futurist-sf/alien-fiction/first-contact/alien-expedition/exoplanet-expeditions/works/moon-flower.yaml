placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > First contact > Alien expedition > Exoplanet expeditions. Cyrene is a planet beyond the solar system being ''developed'' by the Interworld Restructuring Corporation; Terrans from the base are disappearing, facilitator Myles Callen is sent to investigate, and physicist Marc Shearer finds that the vanished Evan Wade has arranged contact via the Cyreneans, the indigenous sentient species (Simon & Schuster/Baen blurb). Harriet Klausner''s review: ''a fascinating encounter between humans and a sentient species that thinks radically different... the selfless Cyreneans.'' A survey/investigation crew lands on another world and meets the life that lives there, which is the leaf definition. Rejected: Planet expedition fiction (the planet''s hazards are not the problem; the encounter with the Cyreneans is the story - corrected from the first placement, which had wrongly recorded no alien intelligence), Xenological expeditions (the destination is the planet and its indigenous life, not the alien itself as a voyage target). Queue id MC04224.'

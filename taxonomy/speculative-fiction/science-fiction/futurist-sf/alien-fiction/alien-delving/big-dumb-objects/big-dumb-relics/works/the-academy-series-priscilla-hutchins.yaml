placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Alien delving > Big dumb objects > Big dumb relics. McDevitt''s Academy series (Priscilla ''Hutch'' Hutchins)
  is one shared universe, so one card (rule 11j). Its spine is xenoarchaeology of things left behind by vanished civilizations:
  Engines of God has archaeologists and Hutch working out the Monuments, an artificial rock city on a moon and cube satellites
  around Nok, whose civilizations'' destruction dates correspond (SFWA synopsis, Wikipedia); Deepsix is a week to dig ruins
  on a world about to be swallowed by a gas giant; Chindi follows stealth satellites to a ship the size of Chicago and an
  alien refuge; Omega and Cauldron chase the Omega Clouds to their source at the galactic core (Wikipedia, SFWA, Penguin).
  Rejected: Hard alien (the aliens are mostly gone, not studied living), Alien message (no one answers), Big dumb worlds (not
  a place crossed), Wreck delving (no salvage claim), Starship mysteries (not a generation ship). Wobble: moderate. Read only
  plot summaries (Wikipedia, SFWA synopses, Publishers Weekly, Penguin), no text. Weakest volumes: Odyssey (a political and
  corporate-fraud story over Academy funding, with alien evidence as the hook) and Starhawk (a prequel about Hutch''s first
  jobs and colony-world ethics); both are in the card because they share the universe, not because they delve. Years: Wikipedia,
  with Engines of God 1994 and the others one year earlier than the queue''s (Deepsix 2001, Chindi 2002, Omega 2003, Odyssey
  2006, Cauldron 2007, Starhawk 2013); queue years kept in this note: 1995, -, 2003, 2004, 2007, 2008, 2013. Queue ids MC04088,
  MC04076, MC04074, MC04083, MC04082, MC04073, MC04086. Long Sunset (2018) not in the queue.'

definition: Hard alien space opera whose governing speculative mechanism is alien bodies, species traits, biochemical minds,
  descent or life cycles, including deliberately uplifted or designed living species. What alien beings are and how their
  lives develop drives the whole fiction. Not Alien engineering, where alien-built tools, infrastructure or deliberate remaking
  of worlds governs; not Alien physics, where the physical conditions and limits of the universe govern. Classify by the whole
  fiction, not the mere presence of biological detail.

placement_rationale: 'Lawrence M. Schoen''s Barsk (Barsk: The Elephants'' Graveyard 2015, The Moons of Barsk 2018, one universe,
  folded; author site, Publishers Weekly, SFWA): in a far future with no humans left, their successors, uplifted animals,
  fill the galaxy; the Fant, anthropomorphic elephants ostracized by the other races, live on the rainy ghetto world Barsk
  and make the drugs the galaxy depends on, above all koph, which lets a few Speakers talk with the recently dead; an offworld
  shadow group tries to force them to give it up, and the Speaker Jorl questions his dead friend while the dead friend''s
  son Pizlo has visions of the future. Walk: Futurist > Alien fiction > Hard alien (genuinely other beings and hard-edged
  cosmology, uplifted species, the leaf''s own definition and its Uplift card). Rejected: Xenanthropology (not an observer''s
  fieldwork, the story is a conspiracy and a mystery inside the culture), Earthborn (the society is human-descended only through
  uplifted animals, and the human-descended frame is not the estrangement), Space techno fiction. Wobble: moderate; the setting
  is a galactic society more than a space opera, and the PW notice calls the first book a novella while the author site and
  publisher call it a novel. Sources: author site, PW, SFWA; not read.


  Root-down split walk 2026-11-06: Speculative fiction > Science fiction > Futurist SF > Alien fiction > Hard alien > Alien
  biology. Science-fiction alien premises, futurist space-opera frame, alien nature/technology rather than fantasy; Hard alien
  whole-fiction mechanism rather than first-contact-only, anthropological colonial rule, alien cosmic history or horror as
  governing engine. Whole two novels turn on uplifted Fant biochemistry, access to the dead, memory and kinship, rather than
  the incidental political and institutional frame. Owner Approved phonemsg-01M6S4TM1Y2DM2DRBGVSNQBC55, served block phonemsg-01M6S4SAEKZCGJVVCRF0S99606,
  distribution6/3/1. No root/ancestor gates or bibliography changed.'

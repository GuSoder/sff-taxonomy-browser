definition: 'Hard alien space opera whose governing speculative mechanism is the physical structure, conditions and limits
  of the universe: regions with differing possibilities for intelligence or technology and the constraints these impose on
  alien and human lives. Not Alien engineering, where deliberately built tools, networks or world-remaking projects govern,
  or Alien biology, where species and life cycles govern. Not Alien cosmic history, whose engine is civilizations emerging
  and developing over cosmic history; not a requirement that every constituent novel be a physics investigation.'

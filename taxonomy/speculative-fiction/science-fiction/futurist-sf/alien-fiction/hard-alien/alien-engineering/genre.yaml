definition: 'Hard alien space opera whose governing speculative mechanism is what alien intelligence deliberately builds or
  remakes: tools, self-propagating technology, transit infrastructure, artifacts or the transformation of worlds and space.
  Engineering may employ living agents; it does not imply robots or ordinary machines. Not Alien biology, where the designed
  or evolved living species itself governs; not Alien physics, where the underlying conditions and limits rather than an alien
  construction project govern. Not artifact-delving merely because an alien object exists, nor Replicator disaster merely
  because self-replicating technology appears. Whole-fiction aboutness decides.'

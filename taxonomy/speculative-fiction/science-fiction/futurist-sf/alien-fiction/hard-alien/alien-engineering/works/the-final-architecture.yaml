placement_rationale: 'The Final Architecture (Locus, PW): moon-sized Architects remake planets and the Intermediaries fight
  back through unspace. Genuinely alien beings and hard cosmology. Series card: Shards of Earth (2021), Eyes of the Void (2022),
  Lords of Uncreation (2023).


  Root-down split walk 2026-11-06: Speculative fiction > Science fiction > Futurist SF > Alien fiction > Hard alien > Alien
  engineering. Science-fiction alien premises, futurist space-opera frame, alien nature/technology rather than fantasy; Hard
  alien whole-fiction mechanism rather than first-contact-only, anthropological colonial rule, alien cosmic history or horror
  as governing engine. Whole trilogy turns on Architects deliberately remaking inhabited worlds, Originator works and the
  intentional project to reshape the universe. Architects are living enslaved agents, not assumed robots or replicators. The
  finale distinguishes Originator masters from the Presence predator. Owner Approved phonemsg-01M6S4TM1Y2DM2DRBGVSNQBC55,
  served block phonemsg-01M6S4SAEKZCGJVVCRF0S99606, distribution6/3/1. No root/ancestor gates or bibliography changed.'

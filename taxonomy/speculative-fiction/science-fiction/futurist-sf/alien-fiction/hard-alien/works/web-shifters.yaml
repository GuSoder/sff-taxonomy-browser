placement_rationale: '# Web Shifters whole six - 2026-11-06


  Place one shared fiction Web Shifters in Hard alien, 8 to 9, after Galactic Center root-boundary correction. No split threshold
  reached. This is a placement, not authority to execute a structural change. Two linked trilogies are one Esen universe,
  explicitly confirmed by author and publisher. First publication years: Beholder''s Eye1998, Changing Vision2000, Hidden
  in Sight2003, Search Image2018, Mirage2020, Spectrum2021. The queue''s2016 years for the first trilogy are reissues. The
  Only Thing to Fear2018 is explicitly an e-novella, not a seventh novel. Author assorted short stories excluded. Author bibliography
  controls over Locus2022 interview''s typo Search Image1998. No merger with Clan Chronicles despite shared author and similar
  alien names; explicit distinct Esen universe.


  ## Each novel''s own engine, primary and completed reviews

  - Beholder''s Eye: six molecular shapeshifters share memories in a Web and secretly observe ephemeral species. Youngest
  Esen''s Kraos assignment entangles her in a revolution and a plot against a Commonwealth first-contact team; exposing her
  form to Paul Ragem violates the noninterference rule. An energy-devouring Enemy resembles her own kind; species secrecy
  becomes mortal danger. Own completed SFFWorld/ChallengingDestiny/York reviews discuss the Enemy, Ersh''s withheld history
  and alien forms'' actual constraints, not a generic humanoid viewpoint. Friendship is explicit, not romance. Narrative flashback
  is not time travel. Birth-mother reviewer disagreement Lesy/Ansky resolved author own Search Image excerpt names Ansky;
  not using reviewer error.

  - Changing Vision: fifty ordinary years later, Paul and Esen run export business MinasXII under Cameron/Ki identities. Vacation
  embroils them with new Feneden species and interplanetary conflict while obsessed Kearn still hunts the supposed monster.
  Species transformations shape capacities, sensory limits and responses. Own Rambles completed review grounds the actual
  book, including humor and changed perceptions; not assumed book1''s first-contact origin repeated. Fifty years elapse, no
  era-jump asserted.

  - Hidden in Sight: coordinated attacks destroy home/business, friend learns her nature and turns enemy, Esen and Paul flee
  and investigate. Kraal machinations, Esen/Skalet reconciliation, broader human web of trust and misunderstood crystalline
  Tumblers escalate. Own Eyrie completed review explicitly says one new form replaces book1''s tour and drifts toward adventure;
  that contrary emphasis is recorded. Bookforager explains Tumblers'' warning misread by flesh-beings, mercenary escalation
  and need for cultural empathy; ending builds Library. SFReader confirms complete story/final successive emotional resolution.
  Not simply same observer fieldwork across trilogy.

  - Search Image: All Species'' Library trades answers for new facts to prevent cultural ignorance/extinction. Paul''s family
  estrangement and missing father intersect with Evan Gooseberry''s DokeciNa crisis and web-flesh relic of Ersh. Own SFRevu
  completed review grounds actual resolution of Elves'' crisis while family mystery remains open, long setup and rotating
  alien perspectives. Author excerpt biochemical memory and molecular mass-energy shifts, human-settled Botharis/Commonwealth/Kraal
  future establish science-fiction world, not magic realm.

  - Mirage: chimeras mix species Esen cannot become, Evan discovers he is not wholly Human, shipboard deaths quarantine Library;
  Skalet/Lionel missing-ship investigation entangles Kraal betrayal, Paul''s romance/greenhouse secret secondary. Own completed
  Niki Hawkes review specifically praises nonhuman Esen thought patterns, multiple alien perspectives, biological detail,
  humor, slow plot and feel-good tonal comparison Chambers. Not just publisher synopsis; generous friendships do not remove
  species/identity mystery as engine.

  - Spectrum: missing starships and vanished crews escalate to whole lost planet, threat to Botharis/Library, Paul''s mother
  Veya implicated. Own completed Miramichi review plus RedHeadedFemme/WesternSFA establish extradimensional Null: energy-web
  predator intercepts translight ships and uses captive Veya''s robotic eye; Esen rejects imagined reasoned encounter and
  enters with weapon to destroy it, ending Veya''s remnant suffering. Not pure healing slice-of-life despite Library first
  half''s humor/relationships. Final cosmological alien predator echoes first novel''s Enemy, rather than making language
  the whole-fiction spine. Full identity/knowledge of Esen and future threads remain open; no unpublished seventh invented.


  ## Actual root-down walk and rivals

  Speculative fiction > Science fiction: molecular reshaping with mass-energy costs, biochemical memory, translight starships,
  galactic Commonwealth, human expansion and biological alien societies. Powers are fantastical extrapolation (reviewer flags
  plausibility), but not literal spellcasting or supernatural fantasy. Neither New Weird/fabulist style nor Earth''s mythic
  creatures.

  Science fiction > Futurist SF: explicit galactic human future in primary and contemporaneous completed review. Not Historical/Modern:
  no recognizable reader-past/present frame. Atemporal serious apparent rival: shapeshifter longevity, conventional fifty-year
  gap, narrative flashback, translight and extra-dimensional Null do not constitute actual travel between eras or parallel
  versions of reality. Retail audiobook TimeTravel tags conflict with read plot accounts; no story mechanism found to support
  them, not used as proof. Another dimension in physically anchored human future is not automatically a multiverse. No reincarnation/repeated
  soul lives.

  Futurist SF > Alien fiction: species minds, body-dependent understanding, cultural prejudice, biological kinship, energy
  predator and secret alien history carry all six. Hard SF fails rigorous technical problem-solving spine, and critics explicitly
  call shapeshifting science stretched. Future of Earth fails arena: not Earth society''s future, genetics on alien worlds
  does not bypass root. Spacefaring strong friendship/adventure rival, but starfaring is stage for species difference; not
  fundamentally travel/ships or human institutions across space.

  Alien fiction > Hard alien: genuinely nonhuman minds and physical embodiment throughout, molecular/memory biology, ancient
  Web origin/Enemy and translight Null predator cosmology, explicit space adventure future; contemporary review compares Commonwealth
  to Banks'' Culture and selfaware cultural observation ethics, not merely date-after1980. Positive fit to leaf''s genuinely
  alien beings/hard-edged cosmology examples, including alien plagues and uplifted beings. Not claiming conventional scientifically
  rigorous engineering or Banks-level scale. Whole-six arc increasingly friendship/adventure but species nature remains irreplaceable
  plot machinery.

  Anthropological science fiction is a serious rival: initially an alien observer''s noninterference problem, later Library
  promotes understanding; however xenanthropology''s ''observed without interference; pure fieldwork'' fails Esen''s repeated
  rescues/intervention and active species survival/predator climax. Xenolinguistics has strong Tumblers misunderstanding and
  Library linguistics, but not sustained translation/alien speech/language shaping thought as primary engine across six; body
  biology, moral prejudice and alien predator mysteries are broader than language. Earthborn fails human societies as estrangement;
  xenocolonial fails governing human colonial regime/alien rule, Kraal intrigue is not whole colonization. First contact first
  novel team strong but universe already multi-species and six-novel whole is not humanity''s first consequential encounter.
  Alien cosmic history fails civilization emergence over cosmic eras; alien horror fails governing dread register despite
  Enemy/Null''s gruesome casualties: friendly comic adventure maintained throughout.

  Space soap opera > Spaceship drama is a serious alternate route because Esen/Paul friendship and later found-family Library.
  First trilogy friendship and culture perspective are strong, and Mirage reviewer compares Chambers. But no continuing spaceship
  crew as whole arena; Library close community exists later only, and death/energy predators, biological secrecy, species
  identity and planetary conflict repeatedly drive actual plots. Romance fails explicit platonic human/alien relationship.
  Comic space future has humor but comedy is delivery, not principal engine of all six; planet-wide slaughter and species
  origin are not comic escapade machinery. Hard alien is the more honest whole-fiction leaf, no gate widened to fit.

  Hard alien currently8 after Galactic Center correction, accepts ninth Web Shifters. No split threshold reached. This report
  does not authorize any split, move of other fiction or definition change.



placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Alien cosmic history. A spacesuited human corpse 50,000 years old found on the Moon starts a scientific reconstruction of the lost history of Minerva, the destroyed fifth planet, and of the Ganymeans, the radically nonhuman civilization that once lived there; the later books follow the emergence of the Entoverse (a pocket universe of nonhuman minds inside the Jevlenese computer JEVEX) and a cross-multiverse mission to save Minerva itself (Wikipedia Giants series, Baen). The series'' subject is the emergence and fate of nonhuman minds and civilizations and humanity''s rewritten cosmic history. Rejected: alien-delving (deduction from remains, not entering structures), hard-alien (new-space-opera register), alien-expedition children (the Ganymede expedition is one episode), near-future-first-contact (contact serves the history). Wobble: soft - the vehicle is a scientific detective puzzle; member shape matches. Series card, five novels per Baen and Wikipedia; The Two Moons (2006) and The Two Worlds (2007) are Baen omnibus reissues of the novels, not new books. Queue ids MC04223, MC04227, MC04228.'

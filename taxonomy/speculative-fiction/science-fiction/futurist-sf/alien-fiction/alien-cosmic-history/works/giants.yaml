placement_rationale: 'Root-down walk: Speculative fiction > Science fiction > Futurist > Alien fiction > Alien cosmic history.
  A spacesuited human corpse millennia old found on the Moon starts a scientific reconstruction
  of the lost history of Minerva, the destroyed fifth planet, and of the Ganymeans, the radically
  nonhuman civilization that once lived there; later books follow humanity meeting the Ganymeans
  and the fate of both species (Baen Giants series page, Wikipedia). The destination of the series
  is the emergence and fate of a nonhuman civilization and humanity''s rewritten cosmic history,
  which is the leaf definition. Rejected: alien-delving (the engine is deduction from remains, not
  entering alien structures), hard-alien (new-space-opera register; this is classic hard-SF detection),
  alien-expedition children (the Ganymede expedition is one episode), near-future-first-contact
  (the contact serves the history, not a transformed Earth). Wobble: soft - the vehicle is a
  scientific detective puzzle; member shape (The Xeelee Sequence, Children of Time) matches.'

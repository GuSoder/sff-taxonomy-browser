placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Alien fiction > Alien cosmic history.
  Per Wikipedia, Publishers Weekly and Baen: alternating stories of the star-dwelling plasma intelligence Wan-To, who wars
  on his sibling selves across the cosmos and disrupts twelve stars, and of the human colony of Newmanhome, carried to the
  end of time at relativistic speed. The emergence and development of a radically nonhuman mind and its civilisation across
  cosmic time is the Alien cosmic history definition. Rejected: World models (rewritten physics is not the discovery), Far-future
  first contact (no encounter is the plot). Wobble: half the book follows Viktor Sorricaine and the human colony. Year 1990
  (Del Rey); queue says 2011 Baen ebook.'

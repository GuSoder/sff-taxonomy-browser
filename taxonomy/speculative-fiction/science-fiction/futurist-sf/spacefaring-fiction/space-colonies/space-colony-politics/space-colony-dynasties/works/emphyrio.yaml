placement_rationale: 'Walk: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space colonies >
  Space colony politics > Space colony dynasties. On the colony world Halma, two hundred hereditary lords own the single
  company that buys the artisans'' work and have outlawed mass manufacturing; Ghyl Tarvoke, a woodcarver''s son, learns the
  hidden truth behind their rule and forces them out (Wikipedia plot summary; Doubleday 1969). The contest for power is
  inside the colony, against an ossified aristocracy and its company - the leaf''s definition. Rejected: Breakaway space
  colonies (the fight is not colony-versus-Earth; Earth is a side trip), Colony life (the artisan routines are setting; the
  overthrow drives the story), Dystopian fiction (that branch is futures of Earth; Halma is a colony world). Wobble:
  moderate; Ghyl is an outsider rebel rather than a dynast, but the leaf''s axis is who the power fight is against.
  Year: 1969 (Doubleday). Queue id MC04097.'

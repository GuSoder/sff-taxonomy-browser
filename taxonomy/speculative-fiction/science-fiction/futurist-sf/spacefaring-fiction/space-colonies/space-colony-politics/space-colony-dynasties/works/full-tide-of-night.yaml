placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Space colony politics > Space colony dynasties. Centuries ahead, refugees from an Earth overrun by the Erinye (synthetic
  once-human machines) have settled Midgard under Lady Julia Amalfi and the young AI Cariola; the plot is the fight inside
  the colony between her benign autocracy, the Rigorists (neo-Marxist hardliners) and the rebels, with a possible Erinye arrival
  as a threat (Publishers Weekly; SFE; Baen). SFE reads it as a ''Jacobean'' plot built on Webster''s The Duchess of Malfi,
  a ruling woman between two male rivals: the contest is internal rule, the leaf''s definition. Rejected: Breakaway space
  colonies (the fight is not with Earth), Alien-war branches (the Erinye are a looming threat, not the field of the story).
  Wobble: moderate to high; blurbs and reviews only, the ruler-and-rivals frame fits better than the leaf''s ''families and
  aristocracies'' wording, and the Erinye war is a real second engine. Years: SFE and Open Library 1998 (Avon); the queue''s
  2012 is the Baen reissue. Queue id MC04010.'

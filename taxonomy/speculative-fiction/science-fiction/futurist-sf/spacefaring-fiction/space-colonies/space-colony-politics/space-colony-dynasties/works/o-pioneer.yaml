placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Colony politics. Per Kirkus, Publishers Weekly and BookPage: computer thief Evesham Giyt emigrates to the colony world Tupelo,
  is elected mayor of the human colony, and uncovers a cooked-books conspiracy by an American expansionist movement and agent
  Hoak Hagbarth, who presses him to seize the planet''s interstellar transporter. A contest for power with the colony as the
  field is the Colony politics definition. Rejected: Colonial worlds (the five alien colonies are neighbours, not the collision
  driving the story), Space mystery (the hacking is a means, not a case). Year 1998 (Tor); queue says 2011 Baen ebook. Leaf
  now at 9.'

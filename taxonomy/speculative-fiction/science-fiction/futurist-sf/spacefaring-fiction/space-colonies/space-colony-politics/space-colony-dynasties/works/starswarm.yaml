placement_rationale: 'Root-down whole-fiction walk, 2026-10-30: Speculative fiction > Science fiction (AI implant, satellite-linked
  computation and alien ecology, not magic) > Futurist SF (future human colony, not historical/modern-day/atemporal) > Spacefaring
  fiction (established off-Earth settlement; not Earth futures). Hard SF rejected as governing mode: reviews criticize the
  technical treatment; the existence of computers is not a rigorous-science engine. Alien fiction is secondary: first contact
  and the starswarm ecology matter, but the human corporate-colony contest supplies the action. Within Spacefaring: not a
  sustained interstellar future history, large-scale space opera, military campaign, multigenerational ship, oppressive-order
  dystopia or comedy. Space techno fiction rejected: Gwen and communications are essential instruments, but no interstellar
  identity-transfer or posthuman transformation supplies the central contest. Space colonies passes: settled research outpost
  on a company-controlled planet. Space colony politics passes rather than Space mystery (not a professional case whose solving
  is the engine) or Colony life (not ordinary settled routines): hidden heir Kip''s parents were killed in an attempted takeover;
  his guardian hides him until he can vote his company shares, and corporate interference escalates to armed danger. Space
  colony dynasties passes its unchanged companies/succession gate; Breakaway space colonies rejected because this is a contest
  within the owning company, not the colony''s independence from Earth or another outside power. One standalone novel, 1998,
  not a Jupiter shared universe: Pournelle explicitly separates it from Higher Education. Whole-book reviews support later
  chases, gunfights and a final standoff; the exact final legal/share-vote settlement has not been independently verified
  and is not asserted. Wobble: moderate, because AI mentoring and first contact are substantial secondary engines. Sources:
  https://www.baen.com/starswarm.html ; https://www.jerrypournelle.com/slowchange/STARSWARM.html ; https://dlmorrese.wordpress.com/2012/08/22/book-review-starswarm-by-jerry-pournelle/
  ; http://victoria.tc.ca/int-grps/books/techrev/bkstrswm.rvw ; https://www.sffchronicles.com/threads/41475/ ; https://zmonkey.org/blog/content/book-review-starswarm
  ; https://locusmag.com/index/b379.htm .'

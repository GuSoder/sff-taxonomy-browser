placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Space colony politics > Space colony dynasties. A permanent, industrialised lunar colony run on contract law, where five
  families and corporations (Corta, Mackenzie, Asamoah, Suns, Vorontsov) feud over the Four Elementals, air, water, carbon
  and data; the Corta dynasty falls and its survivors fight back, then Earth-side allies and the Lunar Bourse enter (Wikipedia
  on Luna: Moon Rising; Tor and Hachette blurbs describe it as Game of Thrones on the Moon). The story is the power contest
  among families and companies inside the colony. Rejected: Breakaway space colonies (the war is between lunar houses, not
  the Moon against Earth, though terrestrial allies appear in book three), Space mystery and Colony life. Wobble: low. Trilogy
  folded as one fiction (rule 11j): New Moon 2015, Wolf Moon 2017, Moon Rising 2019. Years from Open Library first editions.
 '

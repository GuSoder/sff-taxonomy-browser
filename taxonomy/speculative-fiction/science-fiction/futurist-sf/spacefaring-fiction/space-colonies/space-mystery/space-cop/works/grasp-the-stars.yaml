placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space
  colonies > Space mystery > Space cop. One published standalone novel2004. Earth-orbit Port Earth is an established
  multispecies station with Port Authority, staff, medical and security institutions, not just a passing ship or
  a colony being founded. A far-future human civilization already lives alongside Rofans and Phi-Nurians; not recognizable
  present-day Earth despite Earth orbit. Port Authority deputy Rachel Ajmani and official station investigators
  manage an alien stowaway, concealed saboteurs posing as staff and escalating threats while Earth council auditors
  remove personnel from duty. The official investigators untangling criminal intrusion and competing claims supply
  the station case; Meris also has viewpoint chapters, so not a claim that every scene follows a detective. Space
  PI fails their official authority. Colony life is a genuine rival because workload, staff conflict and daily port
  administration occupy much of the book, but sabotage and covert threats turn routines into a crisis. Space colony
  politics is a genuine rival because World Council audit and competing alien custody claims are important; neither
  independence from Earth nor internal dynastic succession is the shared engine. Broad political space opera overstates
  a large-power diplomatic contest at the expense of station investigation. Space adventure/Space dash is a real
  Meris-level pursuit resemblance, but it does not cover the station officials and sabotage plot as well. First
  contact is genuine for Meris and humans with no formal Jadamiin relations, not humanity first encountering all
  aliens; the station case combines this with already-established species. Alien anthropology fails a fieldwork/observer
  premise; alien culture is revealed fragmentarily amid the incident. Theological space opera is a real resemblance
  in Meris presumed Mother-of-Multitudes/godhood, but sources describe custody/exploitation and station crisis,
  not a sustained holy quest. Hard alien and hard science research are not established. Not military campaigns,
  generation ship society, oppression-led space dystopia, future history, posthuman networks or comedy as engine.
  Moderate placement confidence: two detailed independent reader accounts agree on institutional investigation/sabotage,
  publisher confirms station-wide intrigue and SFE confirms space opera. Reviews disagree on whether ending resolves
  enough; no neat full resolution invented. No definition or structural change; Space cop5->6.'

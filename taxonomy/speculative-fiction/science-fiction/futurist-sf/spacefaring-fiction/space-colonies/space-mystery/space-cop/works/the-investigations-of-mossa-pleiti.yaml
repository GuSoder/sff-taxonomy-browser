placement_status: accepted
placement_rationale: 'Root-down recheck,22November2026, whole published Mossa/Pleiti fiction, not Potency alone. Existing
  card has2023/2024 volumes; add The Potency of Ungovernable Impulses (10June2025), one published novel, without creating
  a second world card. The firsttwo are commonly described as novellas; retain the already-published card''s whole narrative
  sequence rather than silently dropping its early volumes. Author bibliography and three current publisher pages list these
  three volumes. Author June2025 interview says fourth being written; current series reference dates fourth2027, excluded
  as unpublished at22November2026. No other author project merged.

  Actual current tree: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space colonies > Space
  mystery > Space cop. Fantasy root fails despite gaslamp/steampunk tone: author explicitly makes human post-Earth Jupiter
  settlement, not supernatural Victorian Earth or an invented magical realm. Historical SF/Proto SF/Period SF and Modern day
  SF fail far-future descendants after Earth''s ecological collapse; Victorian-style trains/telegrams/Holmes narrative are
  aesthetic analogies, not historical dates. Atemporal SF/time travel has no demonstrated temporal displacement or ambiguous
  Earth chronology. No alternate universe/magic premise established. Hard SF is a genuine scientific-setting resemblance,
  but casework and human relationships, not rigorous planetary engineering, are central; Kirkus and Nicoll specifically dispute
  physical/social plausibility. Future of Earth alternatives including ecological recovery/utopian society are background
  goals; the cases happen in established Jovian institutions. Alien life/contact/anthropology fail a nonhuman-centered premise.

  Within Spacefaring fiction, established Jupiter platform and Io settlements make Space colonies honest. The author discusses
  setting-driven mysteries and the future choice of return to Earth versus improving Giant. Space opera marketing is broad;
  the actual large-power interstellar adventure leaves, political opera, military branches, future-history chronicles, posthuman
  Space techno fiction, generation-starship societies and mysteries, oppressive Space dystopias, and comic-space branches
  do not cover the whole three-case sequence. A consistent short chronological progression is not a future history. Ecological
  exile is backstory, not ongoing apocalyptic survival. Terraforming fiction/Planet ecology fiction lose to cases rather than
  worlds being made/remade as the main story.

  Space colonies children all tested. Space mystery wins a disappearance case2023, missing university people/Io investigation2024,
  academic harassment escalating to sabotage/attempted murder2025. Space colony politics is a real thematic rival because
  institutional priorities and class divisions matter, but neither breakaway struggles nor family/company dynastic rule drives
  the whole. Colony life, especially Space habitat life, is a serious rival: author says characters/setting come first, and
  Mondor/Case find2024mystery less satisfying than society/romance. Still investigations structure the sequence, not ordinary
  settled routines. Surface colony life loses platform/ring predominance and case engine. Space station thrillers matches
  third-volume danger but not the common clue-gathering/deductive method. Space romance is a real emotional reading, but current
  leaves concern alien/AI/forbidden/arranged/dangerous pairings, none matches this ordinary human ex-lovers'' rekindling and
  evolving relationship. Rom-com SF''s humorous and present-day ancestors fail. Steampunk mystery''s fantasy ancestor fails,
  as does magical dark academia despite academic intrigue.

  Space mystery''s children: Space doc fails a medical diagnostic engine. Space PI is the strongest rival, especially Potency:
  a friend seeks scholar Pleiti''s private help while Mossa initially seems to refuse, and Strange Horizons describes a private-investigator-style
  story. However the completed Nameless Zine account confirms official trained/licensed Investigator Mossa has been present
  undercover as a porter throughout, secretly working the same case; the firsttwo books are her official investigations with
  Pleiti. End-of-third conversation considers private practice, not evidence all three already operate as PIs. Therefore retain
  whole card in Space cop, count6 unchanged, moderate confidence. A later published change to private practice would require
  another whole-world recheck, not prejudged here. No seed/split/definition change. No full-novel reading claimed: author/publisher
  primary and detailed completed professional, specialist and community criticism read, including contrary assessments of
  mystery weight, plausibility and romance. Related short fiction not inferred from other series.

  '

definition: 'Space colonies in which a case drives the story: an investigator, detective, antiquarian,
  guardian or doctor works crimes, secrets and undiagnosed conditions, including the buried past, across
  the settled worlds, and the solving, not a struggle for power or the rhythm of ordinary life, is the
  engine. Not Space colony politics (there the contest for power is the story, even when a murder starts
  it), not Colony life (there the settled life itself is the story). Split 2026-10-05 from Space colonies
  by what drives the story inside the colony (curator "Approved" (phonemsg-01M459648MQ2WPAZNMNVV512BR,
  2026-10-05 7:39 AM; child renamed Space mystery, phonemsg-01M45985VR35G9EGGEX4169X0F, 7:40 AM)). Widened
  2026-10-09 for the Alex Benedict series, on the curator''s condition that the books at least partly
  take place on a space colony (phonemsg-01M4GXYM7C0389701NV68PJXTF, 8:14 PM CEST). Widened 2026-10-28
  to medical cases and seeded with Space doc for the Sector General series (curator "Approved", phonemsg-01M6143BJF1AK9W39EX4WQT5A1,
  12:25 PM CET).'

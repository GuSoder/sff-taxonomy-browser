id: the-sector-general-series
title: The Sector General series
authors:
- James White
first_published: 1963
canonical_genre: space-doc
placement_status: accepted
placement_rationale: |-
  Root-down: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space colonies > Space mystery > Space doc (seeded 2026-10-28 with the umbrella widened to medical cases; curator "Approved" phonemsg-01M6143BJF1AK9W39EX4WQT5A1). The 384-level multi-species hospital station with some 10,000 staff is an established off-Earth settlement and the hospital is its institution (SFE: "Space-Habitat hospital", "galactic Medicine", sf-encyclopedia.com/entry/white_james); the series engine is solving medical problems across species lines - SFE: the staff "solves alone or with colleagues a series of medical crises". Rejected: Space colony politics (no governing power contest), Colony life (solving, not settled rhythm, drives the story), Alien fiction branch (contact established and routine in an old Federation), Hard sci-fi (not the rigorous-physics engine). Departure volumes stated at approval: The Galactic Gourmet is catering comedy, Mind Changer a career retrospective; diagnosis is the series' main engine, not every volume's. 9 eligible books: 7 novels (Star Healer 1985, Code Blue - Emergency 1987, The Genocidal Healer 1992, The Galactic Gourmet 1996, Final Diagnosis 1997, Mind Changer 1998, Double Contact 1999) + 2 fix-ups (Star Surgeon 1963, Major Operation 1971); 3 linked-story collections (Hospital Station 1962, Ambulance Ship 1979, Sector General 1983) excluded per intake rules.

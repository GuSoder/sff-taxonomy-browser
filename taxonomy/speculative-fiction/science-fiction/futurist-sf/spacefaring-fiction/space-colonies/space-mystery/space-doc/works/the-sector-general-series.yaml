per_volume_checks: |-
  Per-volume engine check (parent request 2026-10-28, served at approval):
  Star Surgeon: unconscious ELPH patient puzzle; Conway identifies the microscopic virus-type "doctor" cells resisting treatment and ends the Etlan war through treatment (en.wikipedia.org/wiki/Star_Surgeon). CASE-DRIVEN.
  Major Operation: invisible, undetectable life form aboard the hospital causing hallucinations and accidents; identifying and neutralizing it is the plot (sectorgeneral.com/books/majoroperation.html). CASE-DRIVEN.
  Star Healer: diagnosis of the Goglesk racial mass-hysteria response, Hudlar transplant and elective-amputation treatment proposals, Unborn/Protector delivery (en.wikipedia.org/wiki/Star_Healer). CASE-DRIVEN.
  Code Blue - Emergency: Cha Thrat's mishandled cases (Hudlar amputation, the untouchable Khone, a parasite species found on a derelict ship) drive the plot; episodic, no single overarching case (en.wikipedia.org/wiki/Code_Blue_–_Emergency). CLINICAL BUT EPISODIC.
  The Genocidal Healer: built around Lioren's "kill-or-cure" outcome and the medical catastrophe; also deals with deeper philosophical/theological issues (en.wikipedia.org/wiki/The_Genocidal_Healer). CASE-FRAMED, ETHICS-HEAVY.
  The Galactic Gourmet: a visiting chef's catering problems are the engine (motile food, Hudlar flavor toxins, nutmeg-overdose epidemic, starving-planet diet fix); comedy of chaos, not diagnosis (en.wikipedia.org/wiki/The_Galactic_Gourmet). DEPARTURE - NOT CASE-DRIVEN.
  Final Diagnosis: a patient with mysterious multiple illnesses is labeled a hypochondriac; the doctors develop a theory and find the explanation at the scene of a childhood accident (en.wikipedia.org/wiki/Final_Diagnosis). CASE-DRIVEN, PUREST FIT.
  Mind Changer: the frame is O'Mara's retirement and choosing his successor; hospital content is career-flashback recollection (en.wikipedia.org/wiki/Mind_Changer; Booklist "an enjoyable, witty resume"). DEPARTURE - NOT CASE-DRIVEN.
  Double Contact: trust-building first contact with one new species, worked through the hospital's people within the medical frame (en.wikipedia.org/wiki/Double_Contact). CONTACT PUZZLE, MEDICAL FRAME.
  Series-level engine remains medical problem-solving (SFE); two of nine volumes depart from the case engine, disclosed at approval.

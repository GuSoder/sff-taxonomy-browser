definition: 'A newly settled world where the settlers are the only life of their kind: no native people,
  fauna or prior ruins, and the colony''s daily life is humanity making an empty world home. Covers young
  roughing-it settlements and long-established lone colonies alike - a four-generation Moon city, a generations-old
  road society, terraformed Mars. Not Prehabited world (there the world''s own native life shapes colony
  life), not Space habitat life (the colony is a built habitat in space).'

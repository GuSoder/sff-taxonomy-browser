definition: 'A colony world that was already lived-in when the settlers came: the world has life of its own - native
  people, fauna, a working biosphere or the ruins of what came before - and that life shapes the colony''s daily
  rhythm. The natives can be people, fauna, biosphere or ruins. Not Fresh settlerworld (there the settlers are the
  world''s only life), not Space habitat life (the colony is a built habitat in space), not Space colony politics
  (a contest for power drives the story), not Space mystery (a case does).'

placement_rationale: 'Settled-Luna coming-of-age: four generations after independence, thirteen-year-old Matt Ronay chafes
  in the glass citadels of the Moon - Earth despised and feared, colony worlds dead ends, escape by starship a minuscule chance
  (Kirkus 1993-10-15). The heart is a train trip by teenaged roleplayers across the far side and Matt learning what growing
  up means while his father Albin, a governing-council member, writes a symphony about water on the moon (reactormag.com reread;
  Tor/Forge excerpt; worldswithoutend synopsis). Engine = the routines, frustrations and texture of settled life under an
  alien sky, not a power contest (council politics are backdrop) and not a case. Surface, not habitat: Luna''s surface cities,
  vacuum and distance are the daily condition -> surface-colony-life verbatim. Winner of the Philip K. Dick Award (Tor Essentials
  jacket). 10TH WORK - LEAF FREEZES pending split proposal.'

  status: known-mismatch-awaiting-structural-decision
  finding: 'Whole fiction is four linked novels, not just Planetfall: After Atlas is an Earth procedural, Before
    Mars a Mars psychological thriller, Atlas Alone a shipboard trauma/VR/revenge thriller. Prehabited world does
    not describe the whole. Psychological SF fails Modern-day ancestor; Future social SF fails Earthbound gate.
    No move executed and no definitions changed while Infowar split decision is open.'

  the arena, and Before Mars'' Mars-base institutions likewise. Space-colonies def: established off-Earth settlements
  whose civic life forms the story''s arena. Bend recorded: After Atlas is Earth-bound - the same universe''s Earth
  half, carried on the series card (the curator''s EXECUTE phonemsg-01M3M8NBMVXJT4096ZBBCN565B after dry-run walk;

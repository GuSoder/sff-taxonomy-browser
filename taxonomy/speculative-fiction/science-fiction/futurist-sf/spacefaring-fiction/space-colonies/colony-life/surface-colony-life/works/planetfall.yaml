placement_status: accepted
placement_rationale: 'Whole-fiction review 2026-11-04: one universe, four novels. Planetfall follows a colony''s
  faith, concealed trauma and troubled settled life; Before Mars explores damaged trust, memory and secrets on a
  Mars base. After Atlas is an Earthbound detective procedural, and Atlas Alone a shipboard psychological thriller
  of trauma, immersive gaming and revenge. Surface colony life is retained as the least-distorting existing home,
  not a claim that every volume has a surface-colony engine. The Earth/ship volumes and the series-wide psychological
  core are substantial straddles. Space techno fiction would promote the technology mechanism above the psychological
  subject; Space PI would stretch the investigator/case gate across the whole fiction. The curator declined a new
  Space psychological SF seed: ''Nah, no new lvl 3 seed just for this'' (phonemsg-01M6KDBRD4JPSB0RCST9HNZW0V). No
  new genre or definition change.'

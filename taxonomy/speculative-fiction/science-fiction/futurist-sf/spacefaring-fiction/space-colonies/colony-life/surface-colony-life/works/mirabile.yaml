placement_rationale: 'Root-down: Science fiction > Futurist SF > Spacefaring fiction > Space
  colonies > Colony life > Surface colony life. A fix-up of linked stories: human colonists
  on the planet Mirabile live their settled lives while genetic mutants of Earth stock (the
  Lock Moose Monster, the Frankenswine, the Kangaroo Rex) keep erupting, and ecological
  troubleshooter Mama Jason handles them (Baen chapter sampler). Reactor: "a sweet book
  about colonization and biology." Colony surface life and its daily condition are the story;
  not Planet ecology (the world is not worked out as a planet - the biosphere is Earth-stock
  gone wild), not Hard genetic SF (the gene science is backstory, not worked as research),
  not Frontier planets (no collision with native life). Fix-up novel, eligible per the fix-up
  rule (Wikipedia, Reactor confirm fix-up status).'

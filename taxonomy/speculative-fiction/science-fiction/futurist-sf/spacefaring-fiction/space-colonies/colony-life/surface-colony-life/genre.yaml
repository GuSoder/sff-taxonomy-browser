ruling: 'Split of Colony life at nine cards (Up Against It held at the gate), approved by the curator''s "Approved"
  (2026-10-12 6:09:47 PM CEST, phonemsg-01M4RE163DTSQWYY1NZP4J7YHA, on his own names Space habitat life / Surface
  colony life), after the intake''s "Approve split?" question; names are the curator''s own. Axis: where the colony
  stands, inside a built habitat in space (Space habitat life) vs on a planet or moon surface (Surface colony life).
  Softness: The Memory of Whiteness (a tour of colonies, barely a community; mixed), Remnant Population (one person
  left on a colony world), Destiny''s Road (a road story), The Voices of Heaven and Planetfall (both survival and
  settled life), The Homecoming Saga (a trek to the ships).'

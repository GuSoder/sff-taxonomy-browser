definition: 'Space colony life lived on the surface of a planet or moon: settlements, farms, roads and
  towns under an alien sky, where land, weather and distance are the daily condition. Not Space habitat
  life (there the colony is a built or hollowed-out habitat in space), not Space colony politics (there
  a contest for power drives the story), not Space mystery (there a case does). Now an umbrella: Prehabited
  world (the world already has life of its own) and Fresh settlerworld (the settlers are the world''s
  only life).'

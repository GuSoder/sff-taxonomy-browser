placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space colonies >
  Colony life > Space habitat life. Whole-fiction aboutness, source-grounded: PW (starred) - ''At its heart, it''s a complex,
  chaotic, and mystifying coming-of-age story... a memorable love letter to the nourishment of body and soul as well as the
  dignity of work and service''; Washington Post - ''The discussion around this novel implies that it''s a revelous romp,
  but that would be oversimplifying it''; Library Journal (starred) - ''a charming coming-of-age tale''; WSJ shelved it as
  hopepunk. The governing modes are coming-of-age and a station community saving itself, not comedy: the comic-space-fiction
  gate (''comedy, parody or satire governs rather than supplies incidental relief'') is not met, so the card moves from Comic
  space fiction. Positive fit: Savor Station is a built habitat and the story is its settled life - the restaurant community''s
  routines (the kitchen), faith (the house philosophy of service; Kenna is the prince of a forgotten religion), secrets and
  care - the space-habitat-life gate. Tenant precedent: The Memory of Whiteness likewise follows an artist through habitat
  society rather than a founding. Wobble: moderate - the ''community'' is a restaurant rather than a civic settlement, and
  Kenna is a newcomer; the station arena and its settled-life engine hold under the gate''s ''station'' wording. Moved 2026-11-02
  under the standing single-fiction-move autonomy after the comic-leaf tenant fit check.'

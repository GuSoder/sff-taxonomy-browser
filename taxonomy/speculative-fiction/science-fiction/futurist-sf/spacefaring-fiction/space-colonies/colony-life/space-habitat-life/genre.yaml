definition: 'Space colony life lived inside a built or hollowed-out habitat in space: an asteroid, a ring, a station or a
  ship, where air, water and the walls themselves are the daily condition. Not Surface colony life (there the colony stands
  on a planet or moon surface), not Space colony politics (there a contest for power drives the story), not Space mystery
  (there a case does).'

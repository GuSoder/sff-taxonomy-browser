placement_rationale: 'Humanity lives almost wholly in information space, the Arcology, with no work or death; Indian myth
  meets space opera (Library Journal, JAM Reads).


  # Project Hanuman ancestor correction, 26 November 2026


  Earlier Copied minds matched the information-space mechanism but skipped its Future of Earth ancestor. Publisher describes
  pan-galactic Arcology, printed bodies and a living ship carrying its civilization''s archive. Finished Reactor, Skiffy and
  Fanty, JamReads and At Boundary''s Edge reviews confirm an interstellar rescue journey, embodied exile and compulsory digital
  reincarnation, not Earthbound society.


  Root-down: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space techno fiction > Posthuman
  spacers. Hindu mythology supplies concepts, not established independent magic: bodies are printed, minds information, Hanuman
  a developing ship intelligence. Human future with cultures and civilizations, not Historical/Modern/Atemporal; ordinary
  translated FTL and remote information space establish no crossing into another era. Hard SF''s rigorous constraint/problem-solving
  is not the principal reader contract; Alien fiction loses because the human-descended protagonists'' transformed existence
  drives the story, despite alien opponents. Future of Earth fails at its ancestor, regardless of information-space similarity
  to copied minds. Spacefaring siblings: not military service/campaign, generation-ship generations, sustained future history,
  comedy, colony civic life or closed-regime horror. New space opera is a real broad mode, but Space techno is exact for transferred
  embodied/disembodied selves and information-space travel.


  At the unchanged newly approved space-tech subdivision, Posthuman spacers wins over Kardashev scaling. Arcology has genuinely
  vast infrastructure and its destruction is central peril, not denied. Yet the repeated inquiry is Prab choosing flesh, Kercher
  sentenced to bodies/repeated lives, the ship protecting its own developing self from an archive, and the three learning
  coexistence. Reactor identifies the life/death cycle as the center; At Boundary''s Edge highlights artificial identity and
  reincarnation. Not an expansion history of building stellar systems; scale alone cannot decide. Confidence moderate-high,
  record genuine scaling overlap. No new art, definitions, structure, books, cover URLs or bibliographic values changed.


  Sources read: https://angryrobotbooks.com/books/project-hanuman/ ; https://angryrobotbooks.com/2024/10/announcing-project-hanuman-by-stewart-hotston/
  ; https://reactormag.com/book-review-project-hanuman-by-stewart-hotston/ ; https://jamreads.com/reviews/project-hanuman-by-stewart-hotston
  ; https://skiffyandfanty.com/blog/book-review-project-hanuman-by-stewart-hotston/ ; https://atboundarysedge.com/2025/11/29/book-review-project-hanuman-by-stewart-hotston/



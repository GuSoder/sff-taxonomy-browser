placement_rationale: '# MC06412 Beyond Enemies,24November2026


  ## Placement

  Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space techno fiction. One standalone2024novel
  by Marisa Wolf,416pages, ISBN9781982193218. Space techno fiction9->10. Intake freezes here; split preparation only until
  approved and live. No new definition, leaf or structural action authorized or executed.


  ## Whole-fiction and temporal scope

  Creator''s2024interview calls this a standalone beginning/middle/end. Current creator and publisher author pages checked24November2026show
  no later novel in this world. Earlier Next Question and Next Right Action are excluded short fiction; unrelated shared-world
  projects are not merged through common authorship. No omnibus/novella added. Legal sample chapters1/4/9/12and completed
  reviewers inspected, not an unauthenticated full-book mirror. Apparent older-self encounter is explicitly same-line clones
  in legal chapter9, not future-to-past travel. Completed reviewers confirm cloning and hidden manipulation of the war, not
  a time-travel revelation. Author confirms a self-contained ending. Exact final late twist is not disclosed by sources read;
  it is not invented here. Temporal confidence is moderate rather than pretending complete primary coverage.


  ## Root-down walk

  Literal engineered human brains, partial AI neural networks grown alongside them, servers, hardware interfaces, tanks, transit
  and genetic manufacture support SF rather than magic. Creator explains humans were engineered to host the AI; direct sample
  chapter4shows full AI load-in disrupting Talinn''s cognition and motor control. Bee can be isolated in a shielded physical
  cube with contact needed for shared sensation. These are actual technological conditions of identity and action, not a merely
  metaphorical familiar. No verified literal supernatural resolution.


  Futurist rather than Historical/Modern: humanity already inhabits multiple star systems and a developed colonial war order,
  after people expanded into space. This is not merely an invented fantasy realm assumed to be humanity''s future. Atemporal
  considered specifically and rejected on the directly resolved clone encounter; no included-book time travel is established.
  Spacefaring rather than Future of Earth: the interstellar order is the arena, not a projected Earth society. Hard SF is
  weaker because the book is not governed by rigorously constrained scientific problem-solving. Alien fiction is weaker because
  the key doubled people are human clones and no alien-first-contact engine is established.


  Space techno fiction''s positive gate is spacefaring fiction with computation, networks, identity transfer and posthuman
  technology at its core. Here neural co-presence, loading an AI between human and machine substrates, hacked controls and
  manufactured personhood generate both the premise and the continuing internal conflict. Complete reviewers stress the human/AI
  relationship, child-soldier manufacture, hacking and existential reorientation, with much less conventional tank battle
  than the front suggests. The creator likewise says the pair leave military life and the actual war differs from what they
  were taught. This remains a spacefaring computational-identity novel when they are no longer fighting the advertised tank
  war.


  Military SF > Ground-pounders > Super space soldier was the strongest tempting alternative: engineered combatants and costs
  to body/mind fit the child definition. It fails the explicit infantry ancestor, however: a heavy tank pair leaving service
  for an AI/identity conspiracy is not infantry''s mud. Do not broaden that gate to all embodied combat because an existing
  card looks similar. Navy/Academy/Command fail the viewpoint and whole plot. Space marine corps fails Corps/squad infantry
  life, Alien-war grunts fails alien foot-war, and Space mercs fails hired contract warfare. A cloning retirement promise
  is not a mercenary contract.


  Space opera/Insurgent has institutional rebellion overlap, but an ending of imperial overthrow is not verified; a publisher''s
  burn-civilization question is setup, not proof. Space adventure''s combat/chase/caper/shipboard hooks are less exact than
  the continuing neural and cloned identity problem. Space dystopias'' closed oppressive community is not the primary stage.
  AI space love has an emotional bond but no verified romance. Future of Earth/Cyborgs or AI have fitting technology but the
  wrong setting ancestor; Hard/Genetics does not better describe the book''s governing inquiry. Comic space future requires
  governing comic mode, while the creator''s snark and reviews'' humor do not establish comedy as the primary form. No new
  leaf needed.



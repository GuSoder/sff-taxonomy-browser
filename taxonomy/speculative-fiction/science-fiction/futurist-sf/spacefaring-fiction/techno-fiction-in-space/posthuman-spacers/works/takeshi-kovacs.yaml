placement_rationale: '


  ## Approved Space techno subdivision,26November2026


  Root-down rewalk: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space techno fiction > Posthuman
  spacers. Existing whole-fiction root evidence retained. Literal technological mechanisms,not established magic; anchored
  human future,not unanchored fantasy or recognizable contemporary/historical Earth. No actual temporal crossing established
  in included novels: simulation,stored earlier selves,longevity and loose chronology are not travel to another era. Earlier
  temporal coverage caveats remain. At Futurist,the whole off-Earth/interstellar computational civilization outweighs Earthbound
  technology; scientific toolkit alone does not establish the rigorous problem-solving gates of Hard SF,and alien origin of
  some technology does not make alien contact the whole engine. At Spacefaring,adventure,military modes,closed-society horror,colony
  cases and future-history empire/alliance/diaspora each lose to the documented computational life and technological society
  inquiry. No ancestor gate changed. Full per-member root/rival/source table remains in audit-space-tech-ten-2026-11-25.md;
  revised subject tests and exact URLs in audit-kardashev-recheck-2026-11-26.md.


  Whole three novels: stacks,sleeves and digitally freighted consciousness create personal survival,identity and power across
  noir,military and revolutionary plots. The interstellar datacasting infrastructure supports those lives rather than being
  an outward-scaling subject. Younger Kovacs is a duplicate and Quell a recorded persona,not historical time travelers.


  Approved positive axis: technologically transformed people versus civilization-scale technological systems. No claim themes
  are mutually absent. No titles,authors,dates,books or hotlinked covers changed.


  Owner Approved phonemsg-01M8BTDEDECPGW7WNXGZV0W0NN,26November2026at12:38CET,following final revised proposal phonemsg-01M8BS8SS6FE6X37E8VZN157JK.
  Original approval and proposal personally inspected in authenticated conversation context and observations. Earlier7/3proposal
  withdrawn; this approval covers final6/4.'

definition: 'Space techno fiction centered on technologically transformed personhood and lived experience among the stars:
  manufactured or replaceable bodies, copied or integrated minds, and technologically extended or sustained lives. Infrastructure
  may enable that existence, but the person''s identity, agency or survival is the governing inquiry. Not Kardashev scaling,
  where civilization-scale technological systems are the subject.'

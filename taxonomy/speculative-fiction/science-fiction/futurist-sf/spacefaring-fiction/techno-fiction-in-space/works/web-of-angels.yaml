placement_rationale: 'Root-down walk 2026-11-04: Speculative fiction > Science fiction > Futurist SF > Spacefaring
  fiction > Space techno fiction. Grailer''s forbidden Webspinning manipulates a network linking humanity''s worlds;
  training, forged identities, evading CIRCE and confronting the Web make interstellar network access the governing
  engine. SF rather than fantasy: technological network, virtual defences, FTL and lifespan treatments. Futurist
  rather than Modern day (intergalactic human civilization), Historical (not an Earth-past period despite 1980 publication)
  or Atemporal (stable far-future human civilization, no time-travel premise established). Within Futurist, Hard
  SF loses rigorous constraint, Future of Earth loses intergalactic arena, Alien fiction loses alien minds/contact.
  Within Spacefaring, Space opera''s adventure is a real straddle but the network and its control are the subject;
  military campaigns, sustained civilizational future history, multigenerational ship societies, colony civic life,
  and comedy do not govern. Space dystopias is a substantial near miss because CIRCE kills unauthorized users, but
  mastering and confronting the Web, rather than oppressive social order as the horror, decides. Modern-day Cyberpunk
  fails its recognizable-present ancestor even though publisher and SFE identify this as proto-cyberpunk; no ancestor
  stretching or tenant precedent. One standalone novel, not a shared universe with Ford''s other novels. First publication1980,
  queue2024 is Tor reprint; Cory Doctorow supplies an introduction, not coauthorship. Source read: Pan Macmillan
  publisher synopsis, SFE author bibliography/analysis, Kara review and Templeton Gate review. Sources are descriptions/reviews,
  not the novel itself.'

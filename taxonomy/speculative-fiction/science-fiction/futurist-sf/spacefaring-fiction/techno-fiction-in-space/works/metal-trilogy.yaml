placement_rationale: >-
  SFE identifies Steel Beach, The Golden Globe and Irontown Blues as the Metal Trilogy within the Eight Worlds sequence, portraying complex lunar society shaped by advanced engineering and a central AI. Penguin centers Irontown Blues on Lunar life, an AI breakdown, biohackers and a genetically altered dog. Space-habitat computation, identity and bioengineering make Space Techno Fiction closest.

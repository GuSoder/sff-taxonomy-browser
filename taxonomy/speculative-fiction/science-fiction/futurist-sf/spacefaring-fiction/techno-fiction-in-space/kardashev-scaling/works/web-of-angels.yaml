placement_rationale: 'Root-down walk 2026-11-04: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction
  > Space techno fiction. Grailer''s forbidden Webspinning manipulates a network linking humanity''s worlds; training, forged
  identities, evading CIRCE and confronting the Web make interstellar network access the governing engine. SF rather than
  fantasy: technological network, virtual defences, FTL and lifespan treatments. Futurist rather than Modern day (intergalactic
  human civilization), Historical (not an Earth-past period despite 1980 publication) or Atemporal (stable far-future human
  civilization, no time-travel premise established). Within Futurist, Hard SF loses rigorous constraint, Future of Earth loses
  intergalactic arena, Alien fiction loses alien minds/contact. Within Spacefaring, Space opera''s adventure is a real straddle
  but the network and its control are the subject; military campaigns, sustained civilizational future history, multigenerational
  ship societies, colony civic life, and comedy do not govern. Space dystopias is a substantial near miss because CIRCE kills
  unauthorized users, but mastering and confronting the Web, rather than oppressive social order as the horror, decides. Modern-day
  Cyberpunk fails its recognizable-present ancestor even though publisher and SFE identify this as proto-cyberpunk; no ancestor
  stretching or tenant precedent. One standalone novel, not a shared universe with Ford''s other novels. First publication1980,
  queue2024 is Tor reprint; Cory Doctorow supplies an introduction, not coauthorship. Source read: Pan Macmillan publisher
  synopsis, SFE author bibliography/analysis, Kara review and Templeton Gate review. Sources are descriptions/reviews, not
  the novel itself.


  ## Approved Space techno subdivision,26November2026


  Root-down rewalk: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space techno fiction > Kardashev
  scaling. Existing whole-fiction root evidence retained. Literal technological mechanisms,not established magic; anchored
  human future,not unanchored fantasy or recognizable contemporary/historical Earth. No actual temporal crossing established
  in included novels: simulation,stored earlier selves,longevity and loose chronology are not travel to another era. Earlier
  temporal coverage caveats remain. At Futurist,the whole off-Earth/interstellar computational civilization outweighs Earthbound
  technology; scientific toolkit alone does not establish the rigorous problem-solving gates of Hard SF,and alien origin of
  some technology does not make alien contact the whole engine. At Spacefaring,adventure,military modes,closed-society horror,colony
  cases and future-history empire/alliance/diaspora each lose to the documented computational life and technological society
  inquiry. No ancestor gate changed. Full per-member root/rival/source table remains in audit-space-tech-ten-2026-11-25.md;
  revised subject tests and exact URLs in audit-kardashev-recheck-2026-11-26.md.


  Grailer masters and confronts the Bell Stellar Web that connects humanity''s worlds across galaxies. The network itself
  and its controlling infrastructure are the subject,not merely a telephone in a space adventure. Its enormous reach supports
  owner''s outward-grand-scale sense,not a measured energy classification.


  Approved positive axis: technologically transformed people versus civilization-scale technological systems. No claim themes
  are mutually absent. No titles,authors,dates,books or hotlinked covers changed.



placement_rationale: 'Stross''s Freyaverse (Saturn''s Children 2008, Neptune''s Brood 2013; the second is set thousands of
  years later with new characters, so one shared universe, one fiction): humanity is extinct and the characters are androids
  and their metahuman descendants; Freya Nakamichi-47, a gynoid, carries a package across the solar system in Saturn''s Children,
  and in Neptune''s Brood the metahuman Krina Alizond-114 chases a lost interstellar financial instrument (Wikipedia, PRH,
  Open Library). Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Techno-fiction in space: posthuman successor
  life, computation and a cryptocurrency-style economy are the setting and the plot. Wobble moderate: Saturn''s Children reads
  as a chase and Space chase is the alternative. Cover: Neptune''s Brood only; the Saturn''s Children Open Library cover is
  blank.


  ## Approved Space techno subdivision,26November2026


  Root-down rewalk: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space techno fiction > Kardashev
  scaling. Existing whole-fiction root evidence retained. Literal technological mechanisms,not established magic; anchored
  human future,not unanchored fantasy or recognizable contemporary/historical Earth. No actual temporal crossing established
  in included novels: simulation,stored earlier selves,longevity and loose chronology are not travel to another era. Earlier
  temporal coverage caveats remain. At Futurist,the whole off-Earth/interstellar computational civilization outweighs Earthbound
  technology; scientific toolkit alone does not establish the rigorous problem-solving gates of Hard SF,and alien origin of
  some technology does not make alien contact the whole engine. At Spacefaring,adventure,military modes,closed-society horror,colony
  cases and future-history empire/alliance/diaspora each lose to the documented computational life and technological society
  inquiry. No ancestor gate changed. Full per-member root/rival/source table remains in audit-space-tech-ten-2026-11-25.md;
  revised subject tests and exact URLs in audit-kardashev-recheck-2026-11-26.md.


  Whole two-book world reweighed under the owner''s revised Kardashev concept. Saturn''s Children asks how robot descendants
  run a Solar-System civilization under physical travel constraints; Neptune''s Brood makes the communication and financing
  of accelerating interstellar colonization its central inquiry. Creator FAQ frames the project as machine descendants making
  cosmic colonization possible. Copied bodies,soul chips and slavery remain strong first-book personhood overlaps,but the
  full shared-world progression is best browsed through the systems enabling civilization beyond humanity''s biological reach.
  This is not an assertion of a numbered energy rating.


  Approved positive axis: technologically transformed people versus civilization-scale technological systems. No claim themes
  are mutually absent. No titles,authors,dates,books or hotlinked covers changed.



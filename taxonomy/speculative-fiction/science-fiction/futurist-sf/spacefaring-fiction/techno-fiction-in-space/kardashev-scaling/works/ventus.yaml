placement_status: accepted
placement_rationale: 'Root-down whole-fiction rewalk,25November2026: Speculative fiction > Science fiction > Futurist SF >
  Spacefaring fiction > Techno-fiction in space. Existing three included novels Ventus2000, Lady of Mazes2005, Stealing Worlds2019
  consolidated, no new book. Creator explicitly calls Lady a sequel to Stealing and prequel to Ventus, the birth and death
  of rogue AI3340 across a thousand years and dozens of worlds: https://www.karl-schroeder.com/the-rewilding/lady-of-mazes
  . Not an inferred thematic universe. Full critical accounts read: https://www.challengingdestiny.com/reviews/ventus.htm
  , https://amazingstories.com/2013/06/book-review-ventus-by-karl-schroeder/ , https://www.sfsite.com/10b/lm210.htm , https://locusmag.com/review/russell-letson-reviews-stealing-worlds-by-karl-schroeder/
  and https://reactormag.com/the-deeper-you-go-the-bigger-the-worlds-get-karl-schroeders-stealing-worlds/ . Locus independently
  identifies the constructed/natural world and autonomous organizational systems as the three-book common concern. SF not
  literal magic: deodands, thalience, Winds, tech locks and apparent gods are specifically AIs, programmable matter, implants
  and environmental systems. No actual temporal travel in the complete accounts; publication-order prequel chronology is not
  time travel. Historical/Modern day fail an anchored human future progressing from near-future Detroit to Solar System posthumans
  and interstellar colonies; Atemporal is not justified by one medieval-looking colony when its Earth-descended future and
  spacefaring context are explicit. The former Hidden lander romance captures Ventus alone, not this whole chronology: its
  apparent magic is nanotech ecology, its rule technological rather than supernatural. Hard SF is a strong intellectual register
  but no rigorous planetary engineering, cognitive-model recognition or single controlled thought experiment contains the
  whole fiction. Alien fiction loses to human-created machine intelligence and posthuman environmental networks, not fundamentally
  nonhuman contact. Future of Earth loses the whole off-Earth/interstellar arena despite Stealing Worlds being Earthbound;
  AI overlords/awakening and Rewired minds are local mechanism rivals beneath that Earthbound ancestor. Future history in
  space is a substantive rival for the thousand-year span, but its current empire/alliance/diaspora children do not name the
  recurring experience: these are not chronicles of imperial succession, alliance relations or humanity migrating among stars.
  Space colony politics and space dystopias catch the manifold conflict or suppressed Ventus society, but not the continuum
  of constructed environments and human-machine agency; there is no common closed-society horror contract. Space adventure
  underweights the ideas for incidental chases; military, generation ship and comic-space frames fail. Techno-fiction in space
  positively fits interstellar posthuman computation, neural and virtual networks, manufactured selves and AI environments.
  Ventus examines embodied artificial minds and environmental computation; Lady explores neural tech-lock societies, computational
  posthumans, governmental votes and3340; Stealing builds alternate network economies and negotiates with landscape AIs. The
  originating near-Earth cyberpunk novel rides with its positively verified later interstellar continuity, not a new scope/gate
  definition. Wobble: Stealing Worlds alone would remain Revolutionary cyberpunk, Ventus alone planetary romance/ecology,
  Lady alone neural societal SF; grouping changes the best shared-world browsing contract. Owner shared-universe one-fiction
  grant phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX covers consolidation. Earliest card Ventus kept as label; no invented franchise
  title. No portrait, cover, definition or structural change. Receiving tenth freezes intake for membership audit and split
  proposal.


  ## Approved Space techno subdivision,26November2026


  Root-down rewalk: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space techno fiction > Kardashev
  scaling. Existing whole-fiction root evidence retained. Literal technological mechanisms,not established magic; anchored
  human future,not unanchored fantasy or recognizable contemporary/historical Earth. No actual temporal crossing established
  in included novels: simulation,stored earlier selves,longevity and loose chronology are not travel to another era. Earlier
  temporal coverage caveats remain. At Futurist,the whole off-Earth/interstellar computational civilization outweighs Earthbound
  technology; scientific toolkit alone does not establish the rigorous problem-solving gates of Hard SF,and alien origin of
  some technology does not make alien contact the whole engine. At Spacefaring,adventure,military modes,closed-society horror,colony
  cases and future-history empire/alliance/diaspora each lose to the documented computational life and technological society
  inquiry. No ancestor gate changed. Full per-member root/rival/source table remains in audit-space-tech-ten-2026-11-25.md;
  revised subject tests and exact URLs in audit-kardashev-recheck-2026-11-26.md.


  Whole creator-confirmed three-novel fiction retained: Stealing Worlds,Lady of Mazes,Ventus. Network economies and autonomous
  environments become ringworld/manifold societies,Solar-System Archipelago and planetary nanotechnological ecology within
  an interstellar AI history. Constructed worlds and their organizing systems are the common inquiry; not Ventus alone as
  a lost-colony surface. Locus independently identifies this through-line. No claim every installment has stellar megacomputers.


  Approved positive axis: technologically transformed people versus civilization-scale technological systems. No claim themes
  are mutually absent. No titles,authors,dates,books or hotlinked covers changed.


  Owner Approved phonemsg-01M8BTDEDECPGW7WNXGZV0W0NN,26November2026at12:38CET,following final revised proposal phonemsg-01M8BS8SS6FE6X37E8VZN157JK.
  Original approval and proposal personally inspected in authenticated conversation context and observations. Earlier7/3proposal
  withdrawn; this approval covers final6/4.'

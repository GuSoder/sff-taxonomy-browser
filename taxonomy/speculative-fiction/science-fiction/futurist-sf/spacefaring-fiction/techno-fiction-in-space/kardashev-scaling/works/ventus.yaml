merged_from:
- id: lady-of-mazes
  title: Lady of Mazes
  canonical_genre: rewired-minds
  placement_rationale: 'On the ringworld Teven Coronal, millions live in overlapping realities called manifolds, enforced
    by neural implants, programmable matter and tech locks that censor what each mind can perceive; when ''Impossibles'' break
    the locks, Livia Kodaly is pulled into the war over who edits human reality (karl-schroeder.com). Walk: Futurist SF >
    Future of Earth fiction > Techno fiction > Technomorphosis > Posthuman > Remade minds > Rewired minds (existing minds
    altered in place by network programming). Source: author site; not read.'
- id: stealing-worlds
  title: Stealing Worlds
  canonical_genre: revolutionary-cyberpunk
  placement_rationale: 'Root-down: SFE and Macmillan place it in mid-21st-century America, where pervasive surveillance, smart
    glasses, VR/LARP worlds, blockchain economies and gamified cooperation reshape social power. It passes Science fiction
    -> Futurist -> Future of Earth -> Techno-fiction -> Cyberpunk; its socially embedded resistance and institution-building
    rather than noir alienation make Postcyberpunk closest.'

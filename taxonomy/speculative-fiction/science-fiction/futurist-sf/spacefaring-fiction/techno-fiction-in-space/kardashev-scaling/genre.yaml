definition: 'Space techno fiction centered on technology extended into civilization-scale systems beyond Earth: building,
  inhabiting, controlling or sustaining computational environments, stellar machinery and interstellar networks. The name
  evokes outward technological ambition toward planetary and stellar scale, not a requirement for a numbered Kardashev energy
  rating. Infrastructure and what lets civilization operate at that scale must be the subject, not merely a server aboard
  a ship, routine space travel or an advanced background empire. Not Posthuman spacers, where transformed individual identity,
  agency or survival governs.'

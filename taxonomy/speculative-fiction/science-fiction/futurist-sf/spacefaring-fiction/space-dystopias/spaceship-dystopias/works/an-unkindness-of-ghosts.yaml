id: an-unkindness-of-ghosts
title: An Unkindness of Ghosts
authors:
- Rivers Solomon
first_published: 2017
canonical_genre: spaceship-dystopias
placement_status: accepted
placement_rationale: SFE and Akashic set the novel aboard the multigenerational starship Matilda, but the defining engine
  is its brutal, racially stratified slavery regime; the ship is the closed off-Earth container for that oppressive social
  order. It therefore belongs in Space dystopias, while Non-Stop remains Generation Starships because forgetting the ship
  is that novel's core trope.

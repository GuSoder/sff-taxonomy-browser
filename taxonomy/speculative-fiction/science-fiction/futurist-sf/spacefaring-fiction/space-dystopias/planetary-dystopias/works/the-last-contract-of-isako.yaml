placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space dystopias.
  Standalone (Orbit/Hachette, 5 May 2026), so one fiction. Per Fonda Lee''s site and Hachette: a legendary corporate-samurai
  swordswoman on a merciless frozen planet where death is a breath away, whose family is enriched by her death, pulled into
  corporate espionage that could change humanity''s existence among the stars. The closed, oppressive corporate order on another
  world is the horror, which is the Space dystopias definition; Fonda Lee calls it a standalone dystopian epic. Rejected:
  Colony politics (the contest is not for the colony''s rule), Space mystery. Wobble: Colony politics is the second reading
  because of the corporate espionage.'

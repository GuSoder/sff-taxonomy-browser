placement_rationale: 'Standalone novel (Tordotcom 2017, 272p). Far future: Ensign Ronaldo Aldo''s clone is posted to the Citadel,
  a decaying military listening station at the edge of human space - corruption rampant, suicide rate high, no escape except
  the promotion-by-cloning ladder; the enemy never appears (The Verge: ''trapped by the status quo''; Publishers Weekly: ''no
  hope of escape''). The closed, oppressive off-Earth social order is the horror, and it is housed in a station - the hull-vs-surface
  axis puts it in Shipboard dystopias alongside the prison ship Perdition and the generation ship Matilda. Rejected: military-sf
  children (warfare-mode keyed; this war is long over), colony-life children (a posting, not a colony), planetary-dystopias
  (the order that traps him is the station, not the planet below), future-history-in-space, space-opera.'

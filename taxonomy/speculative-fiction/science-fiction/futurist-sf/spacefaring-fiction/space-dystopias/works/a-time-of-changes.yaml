first_published: 1971
canonical_genre: space-dystopias
placement_status: accepted
placement_rationale: Tor calls it dystopian science fiction; the closed society on
  the colony world Borthan prohibits first-person self-expression and makes its social
  order the engine of the novel. Because the oppression operates off Earth in a spacefaring
  human future, it belongs in Space dystopias rather than the Earth-only dystopian
  branch.

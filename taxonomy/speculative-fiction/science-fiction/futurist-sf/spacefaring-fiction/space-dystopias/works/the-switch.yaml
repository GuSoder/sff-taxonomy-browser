placement_rationale: 'Ten-k walk (MC05090). Whole fiction: standalone novel (Gollancz 2017). Treated as its own fiction: ISFDB,
  the York University SS bibliography and the Prospective Culture Robson bio all list it outside the Natural History/Stuff
  universe despite one reused ''Forged'' tech term (Deighton/Interzone review). Root-down: science fiction > futurist-sf >
  spacefaring-fiction (Harmony/Chaontium is a sealed section of a Culture-style Orbital cut off from the universe behind the
  Wall - an off-Earth human future) > space-dystopias: the social order itself is the horror - a theocracy (the Alchemy) breeding
  ''Exalted'' model citizens, rejects consigned to the dark twin city Chaontium, everything sealed inside the Orbital; Nico
  Perseid''s story is survival and revolt inside that closed, oppressive society (Deighton; Prospective Culture). TENTH card
  in space-dystopias (9 to 10): the leaf freezes and a split proposal is served at once. Not theological-space-opera (the
  Alchemy is social control; religion is not the quest engine), not breakaway-space-colonies (no independence contest; the
  seal is the condition), not space-habitat-life (there the habitat is daily texture; here the order is the horror).'

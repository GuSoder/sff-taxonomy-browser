first_published: 2023
canonical_genre: space-dystopias
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Space dystopias.
  Human colony on an alien two-moon planet: religious and corporate purity culture makes eating taboo, appetite pills and
  implants police bodies, and class/caste structure constrains chef and cyberthief. Off-Earth oppressive social order is the
  engine. Earth-future social dystopia fails location; Hard SF, alien contact and rule-making fabulation are not the governing
  experience. Embedded Kitchen Girl is a book read by characters, not a textual breach.'

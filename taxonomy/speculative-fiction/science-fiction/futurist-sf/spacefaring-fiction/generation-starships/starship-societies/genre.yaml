definition: 'Generation-starship fiction centered on the social order and conflicts of communities living across a long voyage: caste, succession, upbringing, belief, political control and the kind of civilization to build or preserve. Includes biological vessels and divided habitat societies. Split by the ship''s mission: New star journey (one destination world), Star seeding (settlements delivered to many stars) and Vagabond starship (the ship itself as permanent home). Not Starship mysteries, where solving the ship''s concealed truth drives the plot.'

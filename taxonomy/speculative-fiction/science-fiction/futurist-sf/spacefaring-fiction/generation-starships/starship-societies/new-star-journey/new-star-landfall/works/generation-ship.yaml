placement_rationale: 'Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction
  > Generation starships > Starship societies > New star journey. The colony ship Voyager, 250 years out
  of Earth, nears its one destination, the planet Promissa, as the probes go silent; scientists urge delay
  while the governor pushes a full colonization and factions fight over the ship''s old rules (Mammay''s
  own blurb, Kirkus, Publishers Weekly, Library Journal, Winter Is Coming; Harper Voyager, 2023). A standalone,
  not part of Planetside. The ship exists to arrive and the story is the arrival crisis and the fight
  over its terms, so New star journey. Rivals rejected: Starship mysteries (the dead probes are a thread,
  the factional struggle carries the book), Vagabond starship, Star seeding. Wobble: moderate, the silent
  probes and Promissa''s unknown threat give it a concealed-truth strand.


  New star journey split, 2026-11-28 (owner "Approved" phonemsg-01M8H7VAFZQBVKVG482MNPWJV9, authenticated

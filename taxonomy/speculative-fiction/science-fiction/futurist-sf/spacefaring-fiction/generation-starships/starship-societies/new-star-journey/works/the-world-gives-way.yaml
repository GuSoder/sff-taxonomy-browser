placement_rationale: '# MC06415 The World Gives Way,24November2026


  ## Verdict and scope

  The World Gives Way, Marissa Levien,2021, one standalone novel in New star journey8->9. No structural action or tenth gate.
  Publisher and creator identify a debut novel, current creator publication list and publisher page show no same-world sequel,
  and the complete ending criticism establishes the world''s terminal destruction rather than an unresolved series cliffhanger.
  No unrelated forthcoming haunted-house story merged. No short fiction, omnibus or edition duplicate.


  ## Whole-book evidence

  Author interviews explain she began with a woman knowing an apocalypse was inevitable, chose a servant to access the wealthy''s
  secret, added Tobias as her pursuer/foil, and found class inequality and mother/family bonds growing into the book. Direct
  creator pitch calls it a generation ship fifty years short of its destination whose hull cannot be repaired. Independent
  completed reviews agree the catastrophe is not a mystery awaiting an engineering rescue. Strange Horizons describes the
  government finally announcing the unavoidable end, the roof exposing the artificial metal sky, and Myrra, Tobias and Charlotte
  huddled together without an escape or promised future. Bookshelf Fantasies independently confirms the world does give way.
  Reactor calls this choosing connection and how to live in the time left. Kirkus dislikes the characterization while Reactor
  praises it, an aesthetic disagreement that does not alter shared plot evidence.


  ## Root-down walk

  Speculative fiction > Science fiction: this is a built human world-ship launched from Earth toward Telos. The apparently
  fantastical landscapes and sky are engineered terrain/metal, not a supernatural revelation. No literal magic, soul recurrence,
  parallel-world crossing or real time travel in creator and whole-ending sources. Reactor''s reviewer hypothetically wishing
  for a time machine is commentary, not an event in the novel. Centuries of multigenerational transit are elapsed ordinary
  time, not a temporal jump. Futurist rather than Historical/Modern/Atemporal: descendants of human Earth emigrants in a still-future
  voyage, with no included-book time crossing or unplaceable origin.


  Futurist > Spacefaring fiction, not Future of Earth: the entire live society occupies a colony ship far from Earth, still
  travelling to a known star destination. An author''s desire that society feel like ours and publisher''s near-future description
  do not make it physically Earthbound. Hard SF loses rigorous constraint as the governing interest; creator and critics explicitly
  prioritize class, mortality and connection over detailed engineering. Alien fiction loses alien encounter as subject.


  Spacefaring > Generation starships > Starship societies > New star journey. Multiple generations were born during a planned
  long passage to one destination, Telos. Arrival there is the promised release from inherited200yearservitude, and the ship''s
  carefully built class order controls their work, family and freedom. Its imminent failure destroys that arrival promise.
  New star journey explicitly includes interrupted/failed single-destination missions: actual arrival or successful survival
  is not required. Star seeding fails delivery to many stars; Vagabond starship fails permanent destinationless home, even
  though those aboard have only ever known this vessel.


  Starship mysteries is a real alternative because Tobias investigates apparent crime and Myrra has privileged knowledge.
  But the ship''s nature and irreparable crack are disclosed in chapter1, not a concealed truth the whole plot must solve.
  The investigator/pursued structure takes the reader through the dying society, not to a secret cause that saves the vessel.
  No presumed late engineering solution. Starship societies'' social order/conflicts, inherited labor class, pursuit of a
  contract-breaker and collapse of civic meaning are sustained, fitting the parent even as intimate human connection governs
  the ending.


  Spaceship dystopias is the closest competing leaf, with exact vessel setting and oppressive inherited contracts. Its ancestor,
  however, requires social order itself to be the governing horror. The irreversible physical death of everyone''s world,
  including its rulers, is the book''s final limit; the novel turns from class coercion to how formerly separated people live
  and connect with no future. Author describes it as an apocalypse/connection story, not principally exposing a regime or
  overthrowing it. Moderate wobble preserved: a reader foregrounding inherited slavery could reasonably expect the dystopia
  leaf, but the generational failed-mission journey better covers the finished whole. No existing-member precedent used to
  override either definition.


  Space colonies loses a settled off-Earth location, since the ship is still in transit. Future history in space loses sustained
  civilizational chronology; we follow one dying voyage''s last weeks. Space techno fiction loses computational identity/network
  subject, Military loses warfare, Comic loses governing comedy, and Space opera loses interstellar adventure/power struggle
  as the primary frame. Space dash is a surface chase overlap, but the journey is within one doomed world, not pursuit across
  interstellar adventure arenas; Space mystery likewise loses the whole social-voyage engine. Future-of-Earth End of the World
  and other apocalypse leaves fail their Earth ancestor despite exact mortality theme. No ancestor widening, no new leaf needed.


  ## Cover curation

  One edition search, actual three-front contact sheet inspected. Two designs: original orange/teal typographic silhouette,
  paperback blue-purple cosmic vortex with drifting woman. Selected483x720painted-style cosmic front, English title and author
  clear, no badge/3D/spread. Score8.5/10. Original red/teal cover design stronger graphic contrast but less aligned with the
  collection''s illustrated front preference. Front hotlinked, no cover bytes committed. First year2021retained despite2022paperback
  front; no separate edition card.



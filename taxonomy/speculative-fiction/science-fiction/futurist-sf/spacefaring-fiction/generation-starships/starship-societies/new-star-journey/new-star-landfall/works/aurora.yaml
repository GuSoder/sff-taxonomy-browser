placement_rationale: 'Kim Stanley Robinson''s Aurora (2015; Wikipedia, Guardian): a generation ship of
  twenty-four biomes and some two thousand people, launched from Earth in 2545 for Tau Ceti and narrated
  largely by the ship''s artificial intelligence, reaches the system after about 160 years and seven generations,
  and the community splits over what to do when the colony plan fails. Walk: Spacefaring > Generation
  starships > Starship societies (the social order and its conflicts across the voyage). Tried Starship
  mysteries (the ship hides no secret that drives the plot). Sources: Wikipedia, Guardian; not read.


  New star journey split, 2026-11-28 (owner "Approved" phonemsg-01M8H7VAFZQBVKVG482MNPWJV9, authenticated
  iMessage, 3:09:50 PM CET, answering the served split block phonemsg-01M8GVGAHGMBR409BF7YPM7FTC): New
  star landfall. The book''s crisis is the colony plan''s failure at Tau Ceti and the community''s schism
  over what to do there; the destination decides the book. Borderline: much of the novel is the crossing
  and the turn back toward Earth, but the arrival and its failure break the mission and drive every choice.'

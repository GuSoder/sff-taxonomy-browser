placement_note: 'Root-down: Science fiction > Futurist SF > Spacefaring fiction > Generation starships > Starship mysteries. The metal City astride the Canyon is a landed generation starship whose descendants have forgotten it - fossilized ship''s ranks (the semi-mythical Captain, First Officer, Provosts) rule a thirteen-tier caste society, and pursued protagonists Alania and Danyl must uncover the City''s concealed truth (author page: "uncover the dark secrets of their stratified city"; Amazing Stories 2017-07-21: the generation-starship scenario of Heinlein''s Universe, the reader knowing what the inhabitants do not). Concealed-truth investigation drives the plot: Starship mysteries, not Starship societies. Non-Stop is the member precedent.'

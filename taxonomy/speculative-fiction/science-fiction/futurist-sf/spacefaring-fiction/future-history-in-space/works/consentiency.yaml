placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Future history in
  space. Whipping Star (1970) and The Dosadi Experiment (1977) share one universe, the ConSentiency (Wikipedia: BuSab, Caleban,
  Gowachin), so one fiction (rule 11j). Per Wikipedia plots: a Bureau of Sabotage agent must keep a Caleban alive across the
  human-alien polity, and a human-Gowachin experiment on the sealed world Dosadi. Works tracing a sustained future course
  of interstellar human civilization is the Future history in space definition. Rejected: Far-future first contact (the contact
  is already settled history), Space dystopias (only Dosadi has the closed society), Alien dominions (humans are not ruled).
  Wobble: Dosadi alone would lean Space dystopias. Years are first publication, not the queue''s 2009 and 2002 reissues.'

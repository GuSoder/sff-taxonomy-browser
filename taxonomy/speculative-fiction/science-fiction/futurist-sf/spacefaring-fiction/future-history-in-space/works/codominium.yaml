placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Future history in space.
  The whole CoDominium/Empire of Man universe narrates ten centuries: declining CoDominium and colonial contingency plans,
  First Empire creation and destruction, Sauron/Haven resistance and Second Empire reintegration/contact. First contact fits
  Mote alone, not the entire fiction. Military command/mercenary modes fit Falkenberg alone, not Mote or Outies; colony politics
  fits selected worlds, not the whole historical course. No continuous single court or succession contest, closed oppressive
  order as horror, rigorous scientific problem-solving or computation/identity-transfer engine spans all volumes. Shared universe
  is one fiction under curator ruling phonemsg-01M483CARNEF5RBAW6KCCVW1ST and authority clarification phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX
  (2026-10-30). Original Future history in space definition unchanged. Expanded from existing Mote2 to16distinct novels, not16additions.
  Sources: https://www.baen.com/Chapters/A9781982124175/A9781982124175___6.htm ; https://sf-encyclopedia.com/entry/pournelle_jerry
  ; https://archives.sbu.edu/carr/Pequod_Press_Website_Archive/series.html . Ending limits: Blood Vengeance, Cyborg Revolt,
  Andromeda Flight and The Falkenberg Protectorate are grounded at publisher-premise level, not independently verified complete
  endings. Birth of Fire/Exiles to Glory/High Justice are a separate no-FTL universe per Pournelle; anthologies, omnibuses,
  source stories and reprints excluded. Outies2010ebook precedes2011paperback.'

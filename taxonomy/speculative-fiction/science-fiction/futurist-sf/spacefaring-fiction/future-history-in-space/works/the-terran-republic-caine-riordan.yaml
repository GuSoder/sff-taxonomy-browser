placement_rationale: 'Root-down walk: Science fiction; Futurist; Spacefaring fiction (humanity has faster-than-light travel
  and settles nearby systems in the 22nd century). Sources: charlesegannon.com pages for Fire with Fire (Caine Riordan wakes
  in 2117 after twelve years in cryo to a humanity pioneering nearby stars, is sent to a newly settled world in the Delta
  Pavonis system, and learns Earth is the lynchpin in an impending struggle for interstellar dominance among alien powers),
  Raising Caine (after repulsing the Arat Kur and Hkh''Rkh invasion, Caine escorts a diplomatic mission to the Slaasriithi
  to seek an alliance for the fledgling Consolidated Terran Republic) and Trial by Fire (sneak attack, shattered fleet, war);
  Baen pages for Mission Critical (a book set in the same Terran Republic universe: Major Rodger Y. Murphy, lost in 1993,
  wakes in 2125, 152 light-years from home) and Homefront (post-war reconstruction on Earth; published 1 Dec 2026, so not
  yet out and skipped). The eight-book course is the Terran Republic''s rise through contact, war, diplomacy and aftermath,
  which is the sustained course Future history in space holds, rather than a single first-contact story (Far-future first
  contact is full at 9 and would reach 10) or a single campaign (Starbridge). Wobble: the first volume alone could sit in
  Far-future first contact; Space command and Starbridge were rejected because the series follows an operative, not a fleet.
  Years per isfdb/FictionDB: 2013, 2014, 2015, 2017, 2019; Mission Critical 3 Jan 2023 (Baen). Fire with Fire second edition
  is skipped as a duplicate. Same-author Vortex of Worlds (This Broken World, Into the Vortex) is epic fantasy and Black Tide
  Rising books by Gannon fold into Ringo''s card: separate walks, not this card. Endangered Species, Protected Species and
  Admiral and Commander (2023-2024) are later volumes not in the queue.'

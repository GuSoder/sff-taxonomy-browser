placement_rationale: 'Alastair Reynolds, Poseidon''s Children (Blue Remembered Earth 2012, On the Steel Breeze 2013, Poseidon''s
  Wake 2015; Gollancz, Ace, ISFDB): the Akinya family follows humanity''s expansion across the solar system and out to other
  stars over centuries, from a near-future African dynasty and the Moon to Mars and an interstellar ark, with elephants, a
  lost alien Mystery, and a long trail of human diaspora. Walk: Speculative fiction > Science fiction > Futurist > Spacefaring
  fiction > Future history in space (a sustained future course of interstellar human civilization, as with Alliance-Union
  and the new Humanx Commonwealth). Rejected: Alien cosmic history (the aliens are a late reveal), Space colonies (the arc
  is the whole expansion, not one colony), Generation starships (only one volume sails). Wobble: low-medium. Sources: publisher
  and ISFDB series pages, not the books.'

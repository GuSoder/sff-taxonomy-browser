placement_rationale: 'Whole-fiction placement of Jean Johnson''s single shared universe (user directive 2026-10-30, phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX:
  ''if it is a shared universe it is one fiction''): The First Salik War trilogy and the Theirs Not to Reason Why pentalogy
  are one timeline, ~200 years apart, one continuous story of humanity''s interstellar course - expansion-era first contact
  with the V''Dan and the predatory Salik (Ambassador MacKenzie''s diplomatic trilogy), the alliance, and the two Salik wars
  (Ia''s military pentalogy, whose precognitive mission is to steer humanity''s survival). No single-mode leaf honestly holds
  the whole: military leaves fail the diplomatic prequel trilogy; first-contact leaves fail the war pentalogy. The civilization-level
  Salik/V''Dan encounter is the through-story from The Terrans to Damnation, which is the future-history gate: ''a sustained
  future course of interstellar human civilization''. Precedent tenants with the same mixed contact/war chronicle shape in
  one timeline: CoDominium (Falkenberg military + Mote first contact), the Humanx Commonwealth (thranx first contact + later
  adventures), Alliance-Union (war and diplomacy across one future history). Wobble disclosed: each era''s foreground is single-mode
  (diplomacy, then one officer''s career); the civilization course is the connective frame, judged at the whole-fiction level.
  Walk: Science fiction > Futurist SF > Spacefaring fiction > Future history in space.'

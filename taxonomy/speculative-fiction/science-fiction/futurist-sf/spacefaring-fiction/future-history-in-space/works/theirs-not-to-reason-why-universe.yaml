placement_rationale: 'Root-down walk: Speculative fiction > Science fiction (future technology, starships and named psychic
  capacities, presented as SF, not independently invented fantasy) > Futurist SF (23rd-century Earth expansion and its later
  interstellar descendants, not the writer''s present or a retro-historical era) > Spacefaring fiction > Future history in
  space. One shared universe includes Theirs Not to Reason Why five novels and the First Salik War prequel trilogy set roughly
  200 years earlier. The whole fiction follows a sustained course of interstellar human civilization: Terran contact with
  the V''Dan, entry into the Alliance and containment of the first Salik war, then Ia''s shaping of the Second Salik and Grey
  wars to leave a survival chain for a still later invasion. A Soldier''s Duty starts her military service under that long-future
  vision; An Officer''s Duty moves into academy/naval formation and homeworld conflict; Hellfire gives her a command as Salik
  war breaks out; Hardship puts the crew in a planetary blockade with plans disrupted by Feyori; Damnation resolves the wars
  and her long-term legacy. The Terrans concerns first contact, translation and political choice; The V''Dan concerns diplomatic/cultural
  conflict and needed technology; The Blockade moves the alliance into warfront integration and the problem of containing
  the Salik without exterminating them. The author explicitly contrasts the prequel''s political/first-contact focus with
  Ia''s hard military focus. Not Star stripes (Ia''s career is not the prequel''s arc), Starbridge (not fleet-campaign viewpoint
  throughout), Space command (not headquarters war throughout), Space academy or Ground-pounders (only parts of Ia''s career),
  nor Patrol spaceship (not one ship throughout). Not First contact (the later five novels operate long after initial contact),
  Galactic courts (no single throne/court is the whole-eight arena), or Alien cosmic history (human interstellar history,
  not development of radically nonhuman minds). Psionics is important but its Earth-future branch and scientific-study premise
  are less specific than this interstellar historical course; a powerful precog alone does not place the whole universe there.
  Publisher series pages give every volume''s plot and author confirms the linkage. Eight published novels, one card. The
  2017 How to Be a Barbarian in the Late 25th Century is explicitly a short story and excluded. First-publication dates, not
  reissue dates: V''Dan is December 2015, despite some listings using January 2016. No definition or structure changes.'

placement_status: accepted
placement_rationale: 'Whole-fiction root-down walk, 23 November 2026. The active queue title Agent of the Imperium expands
  to Traveller, one shared-fiction card, not fourteen competing placements. Fourteen identified published prose novels span
  Golden Age imperial rule, Milieu 0 and the New Era''s collapse and rebuilding. Brunette''s and Carson''s The Backwards Mask
  are separate alternative third novels, not duplicate editions. The publisher calls Yesterday''s Hero an episodic novel;
  its linked-story construction does not silently exclude it. Force of Destiny''s first 2001 edition was unauthorized; its
  Traveller content was licensed in the 2003 edition. Agent''s 2020 edition is a revision of the 2015 novel. Shadow of the
  Storm uses 2014, supported by the edition/body rather than the conflicting review heading. Singers War: Origin''s archived
  publisher specifies 9 November 2020; a retailer''s 2021 date is not used as first publication. A Long Way Home is the complete
  2007 PDF, not merely the sixteen serialized chapters of 1996-97 or an automatically substituted 2012 reworked setting.

  Root: Science fiction. Singers War is the strongest apparent counterexample: Oni/Kami, Creator, prophecy, possession and
  Grandfather can sound supernatural. The actual published Chapter 6 and publisher''s Ancient background describe psionic
  personalities, compulsion, captured minds and Ancient technology, including teleportation; no independently established
  literal supernatural mechanism in the material read. This is positive evidence for the SF reading, not a claim to have read
  every novel or proved that magic cannot appear anywhere.

  Temporal siblings: Futurist SF. Earth-derived humanity, named Terra/Zhdant and dated far-future imperial chronology establish
  a future space civilization. Not a historical-Earth technology milieu or a near-present technothriller. Singers War''s 300
  millennia describes duration. Grandfather''s immortality and the Agent''s repeated activation as a recorded personality
  do not by themselves establish time travel. One completed review uses an ambiguous through-time phrase; the actual mechanism
  remains unverified. It is retained as uncertainty, not inflated into positive evidence of a time machine or an indefinite
  obligation to disprove an unseen scene. No confirmed root-governing time-crossing mechanism emerged from the primary sample,
  publisher descriptions and complete criticism read. A later positive mechanism finding would reopen the walk.

  Futurist siblings: Spacefaring fiction, not Future of Earth fiction. Worlds, travel, frontier societies and interstellar
  polities govern the corpus. Not Hard SF: scientific problem-solving under rigorously enforced physical constraints is not
  the common reader promise. Not Alien fiction as the whole governing branch: Droyne, Hivers and Singers matter, especially
  in Wagner and Origin, but the whole corpus also follows human imperial service, frontier crews and the human post-imperial
  recovery. Alien cosmic history would overfit Origin and its background war.

  Spacefaring siblings: Future history in space. The whole world sustains an interstellar course through earlier imperial
  foundations, imperial rule, collapse and successor rebuilding. Military science fiction is the strongest rival: Destiny,
  Wagner, the Hornet and RCES novels have military action. Neither a single fleet command nor a space navy''s campaigns, however,
  covers Agent''s four-century civilizational stewardship, Golden Age frontier politics, Milieu 0 and New Era reconstruction
  together. Space command or Space navy would mistake repeated local viewpoints for the whole-fiction engine. Techno fiction
  in space is another real rival: Virus and stored personalities shape particular eras and books, but machine minds, uploads
  or technical transformation do not govern every epoch. Colonies and starship crews are recurring settings, not the scope
  of the world. Broad Space opera is honest but less precise than the existing future-history branch.

  Future history siblings: Star empire chronicles. The actual leaf defines sustained histories shaped by the rise, rule, decline
  or replacement of overarching empires, not only throne-room contests or one campaign. Traveller fits that definition without
  widening it. Star alliance chronicles is a serious rival because the Reformation Coalition and alliances matter in the New
  Era. That recovery-era polity is one stage of the wider imperial course, not the whole-world organizing principle. Star
  diaspora chronicles captures dispersed/transplanted humanity as background but not the shared narrative''s central imperial
  rise, continuity and fragmentation. Galactic courtiers fits Agent alone, not the shared world''s novels. Space succession
  opera fits a collapse-era segment, not the full earlier and later history. The whole-fiction placement is therefore Star
  empire chronicles, three to four fictions, with no structural change.

  Scope limits: This is a fourteen-novel identified corpus, not a claim to include every short story, comic, scenario, adventure
  or role-playing supplement. The Intendant is a short game adventure; Swycaffer''s Concordat is a separate campaign universe;
  Dumarest, Flandry, Retief, Dorsai and Foundation are influences, not automatic shared-world members. Misjump is provisionally
  not folded: a review reports Traveller intent but its genericized world and author interview do not establish the same-world
  binding; that uncertainty is explicit, not a declaration that it is unrelated. Announced Spinward/Guerilla/Dynasty material
  is not counted without publication evidence. No new structure and no paid acquisition or external contact were used.

  Covers: twelve inspected English fronts, hotlinked only. A Long Way Home and Singers War: Origin have no verified usable
  flat-front hotlink in the bounded source search; explicitly render cover unavailable rather than a different edition, mockup,
  invented image or broken icon. Brunette Mask''s store image includes a retailer old-version/page-count banner below the
  correct named front. No cover image files added to the repository.'

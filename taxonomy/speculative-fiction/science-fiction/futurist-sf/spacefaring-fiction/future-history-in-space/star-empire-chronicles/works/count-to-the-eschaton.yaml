first_published: 2011
canonical_genre: star-empire-chronicles
placement_status: accepted
placement_rationale: 'Six-volume sequence (Tor, 2011-2017), one fiction under rule 11j. Walk: Science fiction >
  Futurist SF > Spacefaring fiction (travel, settlement, conflict and civilization beyond Earth - the Monument starship
  mission, the Hyades Armada defense and humanity''s spread through the Dominions govern the series) > Future history
  in space (works tracing a sustained future course of interstellar human civilization). Per-volume: bk1 Count to
  a Trillion (2011): 23rd-century post-collapse Earth, Texas duelist-mathematician Menelaus Montrose joins the starship
  mission to the alien Monument at the antimatter star, injects himself with an intelligence-amplifying serum, and
  wakes 150 years later under del Azarchel''s world rule (Kirkus, Strange Horizons). Bk2 The Hermetic Millennia
  (2012) and bk3 The Judge of Ages (2014, year 10,515): across eight millennia of Stapledonian human clades Montrose
  sleeps and wakes as the Judge, raising a defense against the coming Hyades Armada (Locus/Di Filippo). Bk4 The
  Architect of Aeons (2015), bk5 The Vindication of Man (2016): Rania returns bearing the Monument coding and the
  judgment of the Dominions ruling the known cosmos, deciding humanity''s fate (publisher copy, LibraryThing). Bk6
  Count to Infinity (2017): billions of years on, copies of Montrose and del Azarchel duel as the Milky Way-Andromeda
  collision is revealed as a war between cosmic intellects, under a presiding intellect of supercluster smart matter
  (Kirkus). The sustained multi-millennia chronicle of human civilization into interstellar and intergalactic society
  is exactly the leaf''s shape. Rejected: Space opera umbrella (adventure tradition; this is a didactic Stapledonian
  chronicle, philosophy-forward rather than adventure-first, despite publisher ''space opera'' copy), Techno-fiction
  in space (computation and posthuman minds are furniture, not the engine; note the unrelated Charles Stross ''Eschaton
  novels'' card lives there - name collision only). Split2026-11-05: Root-down: Speculative fiction > Science fiction
  > Futurist SF > Spacefaring fiction > Future history in space > Star empire chronicles. Montrose/Azarchel awakening
  through successive terrestrial/posthuman orders, creating interplanetary civilization, rule of starcluster/MilkyWay,
  and philosophical cosmicwar govern the long sequence. Political dominion is explicit in author finale, not mere
  starward migration. Deep-time metaphysics and rival love are substantial straddles. Curator Approved phonemsg-01M6P4XYQJCZ647JS4PF6F0A6D,
  2026-11-05 16:23, on final names block phonemsg-01M6P4RCBZS1BJ6H7QZYCJ169W. Original umbrella retained zero direct
  fictions; actual whole-fiction partition 3/4/3, not per-volume placements.'

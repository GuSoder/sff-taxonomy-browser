placement_status: accepted
placement_rationale: 'Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Future history in
  space > Star diaspora chronicles. Nine novels of one shared future history: the Firestar tetralogy (Firestar 1996, Rogue
  Star 1998, Lodestar 2000, Falling Stars 2001), The Wreck of the River of Stars (2003), set later in the same universe (Rambles
  review, LFS review), and the Spiral Arm sub-series that ISFDB files under the Firestar Universe (The January Dancer 2008,
  Up Jim River 2010, In the Lion''s Mouth 2012, On the Razor''s Edge 2013); ISFDB series 27845 and 27846, Locus obituary.
  What organizes the corpus is humanity''s move out from Earth: the push into near space, the aging solar-system ships, then
  a scattered human spiral arm that has half forgotten its origin. Rivals rejected: Star alliance chronicles (the Spiral Arm
  has rival polities, but the near-future books are about building a space economy, not alliances), Star empire chronicles
  (no overarching empire holds the history), Breakaway space colonies (the arena is the whole expansion, not one colony against
  Earth). Wobble: Star alliance chronicles for the Spiral Arm half. Excluded: the Prudence and Fortitude and Maiden Flight
  stories (short fiction) and In the Country of the Blind (1990), which ISFDB files in its own Sarah Beaumont series and which
  is linked to Firestar only by one reviewer''s remark; it is walked separately.'

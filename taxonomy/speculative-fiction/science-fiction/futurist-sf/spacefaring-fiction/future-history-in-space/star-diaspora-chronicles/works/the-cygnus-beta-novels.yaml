placement_rationale: 'Shared-universe card (one fiction, three novels): Karen Lord''s bibliography names them The Cygnus Beta
  Novels (karenlord.wordpress.com); isfdb ''The Best of All Possible Worlds Universe''. After the colony Ain renders Sadira
  uninhabitable, the telepathic Sadiri scatter across the galaxy and resettle polyglot Cygnus Beta (The Best of All Possible
  Worlds, 2013, Del Rey - diplomatic marriage missions, picaresque quest and romance among the colony''s cultures); The Galaxy
  Game (2015) follows psi-gifted Rafi and Ntenman through the Game; The Blue, Beautiful World (2023) brings the galactic commonwealth
  back for 22nd-century Earth, with galactics steering Earth''s admission (Reactor, Shaviro reviews). The engine across the
  three is the forced dispersal of humanity''s seeded branches and the civilizational change it drives - genocide, evacuation,
  resettlement, then the return for Terra; the star-diaspora-chronicles shape, same shelf as tenant Poseidon''s Children.
  Rejected: star-alliance-chronicles (the Crafted Worlds'' relations frame the story but no alliance''s formation or survival
  governs the arc), political-space-opera (the diplomacy is intimate, not a contest among interstellar powers), colony-life
  (not one settlement''s daily routines - the series spans planets and Earth''s admission), first-contact (the third book''s
  engine, not the whole fiction''s). Queue years were UK editions: first publications 2013/2015.'

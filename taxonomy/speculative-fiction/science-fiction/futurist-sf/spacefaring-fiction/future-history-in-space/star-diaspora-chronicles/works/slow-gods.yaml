placement_rationale: 'In the corrupt Shine polity, laborer Maw becomes an FTL pilot; a jump kills everyone else
  and remakes him as a copy of himself, and the machine-god Slow warns a binary star will collapse in a century
  and wipe out worlds within 83 light-years. Maw lives on through centuries of politics and evacuation (Kirkus,
  Locus/Pierce, New Scientist). One long life spanning a civilization-scale timeline - future history in space.
  Locus Award 2026 SF shortlist + Locus Rec SF. Placed by the curator''s 2026-09-24 11:13 ruling. Curator2026-11-05
  phonemsg-01M6P4575KPNQ79ZFW7NV9A5HF: ''You can ignore this "blip" of timetravel since you seem to think it is
  not an integral part of the story''. Scoped SlowGods ruling, not globalgatechange. Further author/publisher/fullspoilerreviews
  confirm the initial anomalousshipjump remakes Maw into immortal safe arcpilot;12second temporaldisplacement not
  shown reused as plannedstrategy or laterplotengine. Evacuationfromastronomicallypredictedbinarysupernova, centuriesofpolitics/war/fallofShine,
  catastrophe/deaths not reversed. Slowpoliticalmanipulation and predictivecalculation not evidence of deliberate
  temporaljourneys. No pendingrootcaveat; validFuturehistory10 triggerssplitpause. Split2026-11-05: Root-down: Speculative
  fiction > Science fiction > Futurist SF > Spacefaring fiction > Future history in space > Star diaspora chronicles.
  Century warning of astronomicallypredicted binarysupernova drives mass evacuation, refugee dispersal/culturalpreservation
  and later war against Shine. Forcedmovement not a voluntary adventure. Centuries-long civilizationalchanges outweigh
  singledisaster. Initial12secondshipblip ignored by scopedcuratorruling phonemsg-01M6P4575KPNQ79ZFW7NV9A5HF as
  nonintegral, not a globalgatechange; no ongoingrootcaveat. Curator Approved phonemsg-01M6P4XYQJCZ647JS4PF6F0A6D,
  2026-11-05 16:23, on final names block phonemsg-01M6P4RCBZS1BJ6H7QZYCJ169W. Original umbrella retained zero direct
  fictions; actual whole-fiction partition 3/4/3, not per-volume placements.'

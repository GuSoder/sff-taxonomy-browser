placement_rationale: 'Walk: Science fiction > Futurist SF > Spacefaring fiction > Future history in space > Star alliance
  chronicles. From a mid-21st-century socialist Europe''s first contact with alien cosmonauts to the far side of the galaxy,
  where Earth-descended colonists in the Second Sphere trade and scheme among saurs, krakens, the merchant empire of Nova
  Babylonia and the galaxy''s god-like older powers. Across the trilogy the changing relations among these distinct peoples
  and powers govern, over two centuries of interstellar civilizational course. Not first contact alone: two of three volumes
  are far-future Second Sphere books, and the near-future contact is the origin story of the alliance politics.'

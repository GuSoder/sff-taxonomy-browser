placement_status: accepted
placement_rationale: 'Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Future history in
  space > Star alliance chronicles. Humanity''s Fire is one shared universe of five novels (Seeds of Earth 2009, The Orphaned
  Worlds 2010, The Ascendant Stars 2011, Ancestral Machines 2016, Splintered Suns 2018; ISFDB series 26221, Wikipedia, the
  author''s agency page), a sustained future history that begins when Earth''s last colony ships scatter after the Swarm war.
  What organizes the whole corpus is the web of alliances and enmities among peoples: the lost human colony on Darien and
  its Uvovo neighbours against the Sendruka Hegemony and the Brolturan Compact, with the Imisil Mergence and ancient machine
  minds in the wings, and how those pacts form, break and hold across the books. Rivals rejected: Star diaspora chronicles
  (the dispersal is the first book''s premise, but the history that follows is about the settled powers and their pacts, not
  about movement), Alien dominions (the Uvovo are allies and the humans are not held under alien rule), Space combat (battle
  recurs, but no single fight organizes five books). Wobble: Star diaspora chronicles for the colony-ship origin. Ancestral
  Machines (2016) and Splintered Suns (2018) are standalone-labelled sequels in the same universe and are kept in the fiction.
  Seeds of Earth, The Ascendant Stars and the five-book count were added from the shared universe, not only the queue.'

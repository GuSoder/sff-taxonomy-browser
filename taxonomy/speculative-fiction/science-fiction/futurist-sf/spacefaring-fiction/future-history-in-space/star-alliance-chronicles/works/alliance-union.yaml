placement_rationale: 'C. J. Cherryh''s Alliance-Union universe as one fiction: Downbelow Station and Cyteen in one
  future history of stations, merchanters and azi. Split2026-11-05: Root-down: Speculative fiction > Science fiction
  > Futurist SF > Spacefaring fiction > Future history in space > Star alliance chronicles. EarthCompany, Union,
  Merchanter Alliance, stations and alien powers form a changing interstellar balance. HeavyTime/Hellburner origins,
  stationwar, Cyteen/azi power, Merchanter generations and Chanur contact keep the whole historically interlinked
  fiction together. Alliance here is not a utopian promise; coercion, clones and commerce remain substantial engines.
  Curator Approved phonemsg-01M6P4XYQJCZ647JS4PF6F0A6D, 2026-11-05 16:23, on final names block phonemsg-01M6P4RCBZS1BJ6H7QZYCJ169W.
  Original umbrella retained zero direct fictions; actual whole-fiction partition 3/4/3, not per-volume placements.'

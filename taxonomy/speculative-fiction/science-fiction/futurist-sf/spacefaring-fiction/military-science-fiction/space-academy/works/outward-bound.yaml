placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science fiction > Space academy. Baen: 22nd-century L.A. street kid Linc Marani, 15, is sentenced to a juvenile labor camp, then taken into a mysterious high-discipline training program whose graduates go to the outer-system colonies (the Outzone); SFF180''s review confirms the program is the book''s core and that Linc ends up offered a position in the Outzone''s military and security forces. Training and formation with a military outcome is the leaf definition. Rejected: Planet expedition fiction (no planetary-hazard engine), space-militaries combat leaves (no campaign or battle carries the story). Wobble: mild - the program prepares colonial labor as much as soldiers until the final turn to the Outzone security forces. Jupiter(TM) shared-world series book 6 (multi-author, Heinlein-juvenile tradition per Baen): per house rule the card is Hogan''s novel alone; the shared universe is noted here and later Jupiter novels from the list join this card''s universe note, not this card. Queue id MC04225.'

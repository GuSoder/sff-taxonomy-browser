placement_rationale: 'Root-down walk: two human interstellar societies at war far from Earth, so Futurist; Spacefaring fiction;
  Military science fiction; Space command (wars directed from the top). Sources: Wikipedia (In Conquest Born, 1986; ''blends
  elements of space opera, anthropological science fiction, and military science fiction''; two human societies, the Braxins
  of the Holding and the Azeans of the Star Empire, vie for control of their neighbouring interstellar territory; the generals
  Zatar, a Braxin Kaim''era, and Anzha lyu Mitethe, an Azean with strong psychic powers) and csfriedman.com (the Great War
  between Braxi and Azea has gone on since the beginning of interstellar history; two great generals arise, each determined
  to break the stalemate, and their obsession sparks a vendetta that changes the course of empires; New York Newsday: the
  plot follows the two protagonists from birth to their clash as the two space-empires struggle for domination; The Wilding,
  DAW 2004, is set two hundred years later, with the generals'' vendetta still echoing: Azean officials hunt the psychic strain,
  the Braxaná tend their dying gene pool, and a Kesserit warrior Tathas, an Azean Mediator Zara and the renegade psychic Rho
  carry the story on). The Wilding is folded into the same card under the shared-universe rule. Wobble: Space command is about
  campaigns directed from the top and this book is as much about two societies and a personal vendetta between commanders
  as about campaigns; Galactic houses and Space-succession opera were considered and fit the politics less than the generals.
  The Wilding itself reads more as psychics and heirs than as command. Years: In Conquest Born 1986 per Wikipedia (queue 2001
  is the anniversary edition), The Wilding 2004 per csfriedman.com.'

placement_rationale: 'Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Military science fiction
  > Space command. Whole4novel series: Janissaries(1979), Clan and Crown(1982), Storms of Victory(1987), Mamelukes(2020).
  Earth mercenary commander Rick Galloway is transported to Tran; campaigns, sieges, military alliances, civil wars and warlord
  decisions govern all4books. The alien drug cartel and impending climate cycle frame the command story rather than replacing
  it with alien cultural accommodation or ecological problem-solving. Ancient Rome/medieval-derived cultures are transplanted
  human societies, not an actual historical-era setting. Not infantry ranks, naval service or academy formation; the command
  view dominates. Not science-fantasy planetary romance: technological weapons/tactical constraints and directed campaigns
  are central rather than fantasy-like adventure furniture. Not Future history: the narrated13year command arc is not the
  ancient600yearcycle or a sustained interstellar civilization chronicle. Not Lost-colony romance: present Earth arrivals
  remain central. Alien dominions is the strongest alternate premise, but independent whole-volume reviews confirm warlord
  campaigns rather than subordination/accommodation are the reading engine. Tran(1996) and Lord of Janissaries(2015) are omnibuses,
  not additional novels. Mamelukes ends with a major battle while broader alien-control threads remain unresolved. Sources:
  https://sf-encyclopedia.com/entry/pournelle_jerry ; https://www.baen.com/lord-of-janissaries.html ; https://baen.com/mamelukes.html
  ; https://www.benespen.com/2020-10-24-janissaries-by-jerry-pournelle-book-review/ ; https://fantasyliterature.com/reviews/clan-and-crown/
  ; https://www.benespen.com/2020-11-15-janissaries-storms-of-victory-by-jerry-pournelle-and-roland-green-book-review/ ; https://app.thestorygraph.com/book_reviews/158f533f-ba79-4da6-8e69-78bc6e988434?sort=most_liked
  . Source coverage is publisher premises plus independent whole-book reviews, not fulltext reading. Individual fiction authority
  clarified phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX.'

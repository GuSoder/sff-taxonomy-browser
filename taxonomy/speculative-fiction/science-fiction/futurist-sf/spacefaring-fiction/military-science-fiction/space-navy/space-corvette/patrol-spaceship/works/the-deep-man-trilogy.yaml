placement_rationale: 'Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Military science fiction
  > Space navy > Space corvette > Patrol spaceship. Three novels (ISFDB series 77450: The Deep Man 2022, The Silent Hand 2023,
  The Presence Malign 2025; the queue''s 2020 year for the third is wrong) following Captain Saef Sinclair-Maru and his bodyguard
  Inga in the Imperial Fleet of the Myriad Worlds: an under-equipped frigate on an imperial mission, the IMS Hightower on
  a rescue of a trapped Legion force, then, relieved and hunted, the privateer cruiser Salahdiin against the genocidal Presence
  Malign (Baen blurbs for all three, S&S series page). One ship and her crew drive each book, not the fleet, so Space corvette,
  and the first two books are regular navy service errands, so Patrol spaceship. Rivals rejected: Starbridge (admirals and
  fleet theatres are not the arc), Star stripes (Saef''s career is not a climb, he is relieved and leaves the navy), Privateer
  spaceship (only the third book, with a letter of marque). The Redline Heist is the Doomsday Artifacts series in a different
  setting and is placed separately. Wobble: real. The third book is a privateer story, which would put the whole card in Privateer
  spaceship; I weighed two navy books against one.'

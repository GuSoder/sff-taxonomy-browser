placement_rationale: 'McCaffrey''s Planet Pirates trilogy (Sassinak 1990 with Elizabeth Moon, The Death of Sleep 1990 with
  Jody Lynn Nye, Generation Warriors 1991 with Moon; the Baen omnibus The Planet Pirates, 1993): one shared universe, so one
  fiction. Sassinak, enslaved at twelve when raiders destroyed her colony, escapes, joins the Fleet and becomes captain of
  a pirate-chasing ship with a human and heavyworlder crew; Lunzie Mespil, a therapist, wakes from cold sleep into a future
  she does not know, and the two lines meet against a century-old crime syndicate (Wikipedia, Planet Pirates, per-book summaries).
  Walk: Science fiction > Futurist > Spacefaring > Military science fiction > Space navy > Space corvette (the one patrol
  ship and her crew out on their own, the ship and its people the story), not Space armada (the fleet and its capital ships),
  Space command (the view from the top), or Space academy (the story is service, not training). Wobble moderate: the Lunzie
  strand is a cold-sleep and civil-life story, and Generation Warriors widens into fleet politics. Sources are Wikipedia,
  not the books. First publication 1990-1991. Queue ids MC00771, MC00774, MC00758.'

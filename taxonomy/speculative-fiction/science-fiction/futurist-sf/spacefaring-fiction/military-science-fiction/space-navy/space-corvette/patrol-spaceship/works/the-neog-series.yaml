placement_rationale: 'Ten-k walk (MC05095-MC05098). Whole fiction: the NeoG series (Harper Voyager), four novels in one series
  per ISFDB and Goodreads: A Pale Light in the Black (2020), Hold Fast Through the Fire (2021), The Ghosts of Trappist (2023),
  And the Mighty Will Fall (2024). Publisher copy: ''a military force patrolling and protecting space inspired by the real-life
  mission of the U.S. Coast Guard'' - the Near-Earth Orbital Guard and Interceptor Team Zuma''s Ghost (HarperCollins; ReadingReality;
  Wonderland). Root-down: speculative fiction > science fiction > futurist-sf > spacefaring-fiction (patrols across near-Earth
  space and out to the Trappist system) > military-science-fiction (a uniformed service: ranks, interservice Boarding Games,
  boarding actions) > space-navy (ship crews and patrol work) > space-corvette (the one small ship and her crew out on their
  own) > patrol-spaceship: regular service - the NeoG IS the service and Zuma''s Ghost its patrol interceptor; not Privateer
  spaceship (no letter of marque or outlaw flag), not Penal spaceship (no convict crew). Not space-mystery/space-cop: book
  1''s smuggling case is one errand inside the unit''s story; the engine is the crew and the service, not a detective case.
  patrol-spaceship 8 -> 9.'

placement_status: accepted
placement_rationale: 'Whole-fiction source-led rewalk2026-11-05 active MC04790 Claws That Catch: Speculative fiction
  > Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Space navy > Space corvette
  > Patrol spaceship. Whole4: Into the Looking Glass2005 (Ringo solo), Vorpal Blade2007, Manxome Foe2008, Claws
  That Catch2008 (with Travis S. Taylor). Queue2009 for Claws is later paperback, primary first November2008. Publisher
  current Looking Glass bundle exactly4, not another novel; Voyage of the Space Bubble is series alias, not extra
  fiction. Von Neumann''s War and Empire of Man are separately listed series; same coauthor or Roger-style lifted
  cameo not proof same universe, no blind merge. Independently read publisher and completed reviews for all4.1 experimental
  disaster in contemporary Florida opens gates, scientists/SEALs repel Dreen Earth invasion.2 seven years later
  converted submarine Vorpal Blade first deep-space exploratory mission, military/crew/Force Recon security, Cherrick
  fighting and casualties.3 recalled ship investigates destroyed HD36951 outpost, rescues survivor, encounters Hexosehr,
  protects fleeing alien ship against Dreen destroyer/fleet.4 Weaver now XO of replacement BladeII, Berg OCS lieutenant;
  ship personnel/logistics, ancient Tum-Tum Tree exploration, alliance war and Thermopylae reinforcement. Root gate
  scrutinized rather than inferred from title: early publisher/PW/SFE words interdimensional/other realities conflict
  with finished primary mechanism. Freely distributable Baen Looking Glass CD full chapter7 explicitly says anomaly
  is NOT opening to another universe but utter unreality, linked bosons form wormholes through intermediate substrate;
  astronomy finds same universe/galactic quadrant. Chapter7 Tuffy encounter between universes is explicitly metaphysical
  substrate/reassembly, possibly sensory deprivation to Weaver, not parallel versions of Earth or another inhabited
  universe. Claws chapter1 retrospect says stuck between universes then explicitly planets in Earth''s galaxy; retain
  uncanny multiversal-cosmology wobble, do not erase it or treat speculative first-chapter Higgs hypotheses as final
  mechanism. Parallel-world fiction requires central travel/communication/identity across parallel versions of reality,
  not physical planetary gates or brief substrate encounter. No actual temporal displacement established: book3
  space-time anomaly described in detailed review is gravitational/frame-dragging navigation through Mu Ori in secondary
  chapter account, not evidence time travel; FTL observation of old battle light is seeing delayed photons, not
  communication into own past. No any-time-travel override established. Science-fiction explanation not magic mechanism
  despite Lovecraft-like insanity and Tuffy. Bulk later3 deliberately developed space service many years beyond
  first present crisis, not Modern-day Warzone ancestor; alien Earth invasion launch is substantial first-volume
  straddle, whole4 engine becomes one navy ship/people on frontier missions. Hard sci-fi serious competitor for
  detailed particle theory/engineering/navigation, but unknown black-box alien drive, Tuffy cosmic substrate and
  battle/personnel emphasis make scientific constraint subordinate to military expedition whole. Matter transmission
  is infrastructure not persistent identity/duplication problem. Xenological expeditions/exoplanet expeditions close
  because exploration/contact/artifact real, but navy orders/training/crew/Force Recon combat and repeated war missions
  persist beyond encounters. Alien-war grunts close for Berg and armor casualties, but scientist/bridge/crew and
  ship operating life equally central, not exclusively grim footsoldier mud. Space navy over academy/command: service
  ship at scene, not school nor remote headquarters. Space corvette over armada: Vorpal Blade and rebuilt successor''s
  people are core, fleet reinforcement at endings not fleet/admirals narrative. Patrol spaceship regular naval service,
  not privateer or punished crew. Substantial wobble: entire first book Earth crisis; later3 science/exploration/artifacts
  and Marine combat, fourth climactic fleet rescue. Whole one-ship navy mission spine beats premise-only Warzone
  placement. All4 distinct English Baen print fronts visually inspected and localized, low resolution166/160/160/160x240
  disclosed. Warzone Earth5->4, Patrol spaceship7->8; no freeze, seed or definition change.'

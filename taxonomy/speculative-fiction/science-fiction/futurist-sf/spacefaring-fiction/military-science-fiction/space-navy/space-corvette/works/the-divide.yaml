placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Space navy > Space corvette. At the Divide, the collapsing edge of the universe, Adequin Rake commands the Argus
  with a crew of recruits, exiles and court-martialed soldiers called Sentinels, with no resources, no comms and no relief;
  the sequels follow the surviving crew trying to leave the edge, then the war over the genetic plan that threatens the outer
  colonies (jsdewes.com; Tor Publishing Group pages for The Last Watch, The Exiled Fleet, The Relentless Legion). One small
  ship and her penal crew out on their own is the leaf''s definition. Rejected: Space armada (the state fleet only appears
  late in the series), Space command (the view is the one ship, not the campaign room). Wobble: moderate, since the third
  book widens to fleets and the colony war. One fiction, rule 11j: The Last Watch 2021, The Exiled Fleet 2021, The Relentless
  Legion 2024 (Open Library and Tor pages).'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Space navy > Space corvette (6, now 7). David Drake''s RCN series (Republic of Cinnabar Navy; the Leary and Mundy
  novels, 13 stand-alone novels in one setting, folded as one fiction under rule 11j; MC02309 is the second edition of With
  the Lightnings and folds into MC02308). Daniel Leary, a young Cinnabar naval officer, and Adele Mundy, a librarian and spy,
  run a single captured ship (later the Princess Cecile) and her small crew on diplomatic and treasure-hunting errands at
  the edge of a long cold war, starting with Leary''s escape from a coup on Kostroma in With the Lightnings (Wikipedia https://en.wikipedia.org/wiki/RCN_series
  gives the thirteen novels and their summaries; Baen https://www.baen.com/categories/books-by-series-list/lt-leary-rcn-series-by-david-drake.html).
  Space navy children: Space corvette (the one small ship and her crew out on their own, whatever the mandate: the ship and
  its people, not the fleet, are the story) fits exactly. Space armada fails (no fleets or admirals; at 9 anyway), Space command
  (campaigns from the top), Space academy (not a school), Ground-pounders (not the infantry; Drake''s Hammer''s Slammers is
  a different series). Years: Wikipedia RCN Series table (first-novel year 1998, thirteenth 2019). The queue shows 2007 for
  When the Tide Rises (Wikipedia 2008), 2018 for To Clear Away the Shadows (Wikipedia 2019), and second-edition years (2013)
  for With the Lightnings; the queue years are mostly reissues. Not checked against ISFDB for each volume. Cover: the Baen
  ebook jacket of With the Lightnings, hosted locally (cover-rcn-lightnings.jpg). Wobble: low.'

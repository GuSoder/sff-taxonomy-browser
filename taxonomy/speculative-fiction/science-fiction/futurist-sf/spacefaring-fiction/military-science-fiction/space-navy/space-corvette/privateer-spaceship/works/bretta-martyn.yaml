placement_rationale: 'L. Neil Smith''s Bretta Martyn (1997; Kirkus, Libertarian Futurist Society): sequel to Henry Martyn
  (1989, not in the queue); the dread space pirate Arran Islay, with his wife and 15-year-old daughter aboard his state-of-the-art
  ship, is sent by the CEO of the Monopolity of Hanover against the Oplyte Slavers, who turn humans into zombie warriors with
  nanotechnology. Walk: Futurist > Spacefaring > Military SF > Space navy > Space corvette (one small ship, a privateer, and
  her crew). The queue''s only Martyn row. Sources: Kirkus; not read. Alternative: Space hunt.'

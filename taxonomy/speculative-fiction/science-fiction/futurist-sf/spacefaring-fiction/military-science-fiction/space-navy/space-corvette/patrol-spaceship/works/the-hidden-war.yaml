placement_rationale: 'Michael Armstrong''s The Hidden War (TSR, 1994): fighter pilot Krim, last survivor of the Beat asteroid
  Jack, is freed after 15 years and enlists in the Solarian Alliance''s hidden Oort-cloud patrol, flying telepresence ''poddies''
  against what the Alliance believes are probes of the approaching Terrorons - but the alien menace is a hoax: the Beats fabricated
  the broadcasts to give hedonistic Earth a common enemy (Schlock Value full review, 2017-03-12; fictiondb publisher copy).
  Root-down: Science fiction -> Futurist SF (undefined-future spacefaring society) -> Spacefaring fiction -> Military science
  fiction (the review calls out the enlistment-training-combat MilSF structure) -> Space navy -> Space corvette (the pilot
  and his craft, not a fleet) -> Patrol spaceship: regular service, escort and war errands far from the fleet. Rejected: Alien
  conquest/warzone-earth (no real invasion - the aliens are fabricated; also fails modern-day-sf''s recognizable-present gate);
  Penal spaceship (Krim is freed and enlisted for his skills; the ship is no sentence or dumping ground); Space academy (training
  is the middle act, not the frame). Wobble moderate: the poddies are expendable telepresence craft rather than a single crewed
  ship, but the pilot-and-patrol engine governs.'

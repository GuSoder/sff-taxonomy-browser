placement_rationale: 'Walk: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Space navy > Space corvette. The Flight Engineer (The Rising 1996, The Privateer 1999, The Independent Command 2000, Baen; ISFDB series listing and smstirling.com bibliography): Commander Peter Raeder, the Commonwealth''s first flight engineer on the command track, and the crew of the single ship Invincible fight the alien Mollies through raids, privateering and independent commands. One small ship and her people out on their own, not the fleet: Space corvette. Rejected: Space command (Raeder''s view is the deck of one ship, not the top of a campaign), Space armada (no fleet action). Wobble: low. Years: 1996, 1999, 2000 (smstirling.com; queue''s 2000/2001 are reprints). Queue ids MC04168, MC04169, MC04170.'

id: providence
title: Providence
authors:
- Max Barry
first_published: 2020
canonical_genre: space-dreadnought
placement_status: accepted
placement_rationale: 'Approved seed 2026-11-27 (owner phonemsg-01M8ESBPW1NCQQRKVTX9285X17 on served question phonemsg-01M8EFQAFNE47R6E70RW42QKMT),
  rewalk after Patrol spaceship''s positive gate failed on the word small. Path: Speculative fiction > Science fiction > Futurist
  SF > Spacefaring fiction > Military science fiction > Space navy > Space dreadnought. Whole novel (Putnam, 31 March 2020):
  Providence Five, one three-mile warship of a five-ship Providence class, four crew, a four-year mission alone deep in the
  salamanders'' territory; the first third is life aboard and the war''s public image, then the siege where the ship and its
  machine mind fail and the crew fight on (Wikipedia, Penguin Random House, complete-review, Locus reviews by Paul Di Filippo
  and Ian Mond). The ship, not a fleet, is the story, and her scale carries the war. Rejected: Patrol spaceship and Space
  corvette (small-ship gate fails), Space armada (no fleet, admiral or career), Space combat (crew breakdown first, siege
  second), Spaceship drama (cooperation and found family is the opposite), Spaceship dystopias (not a society). Wobble: single
  seed fiction; the machine mind is texture, not the gate.'

first_published: 2011
canonical_genre: star-stripes
placement_status: accepted
placement_rationale: 'Whole-fiction re-walk after the 2026-11-03 gate challenge from main. The fiction is Ia''s military career:
  enlistment (A Soldier''s Duty), commission (An Officer''s Duty), the captain''s chair on Hellfire, and the flag-scale war-plan
  of Hardship and Damnation, all driven by her precognitive visions of a galaxy-killing invasion three centuries on; the First
  Salik War prequel trilogy (The Terrans, The V''Dan, The Blockade) covers the same universe''s earlier contact and war with
  other protagonists. The author''s own site and PRH call it ''A Military Science Fiction Series''. The subject is the soldier
  and her wars, not the sustained course of interstellar civilization itself, so the Future history in space gate fails. Walk:
  Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Space navy > Space armada > Star stripes
  (one officer''s climb through the ranks is the arc; the prequel trilogy folds in under rule 11j). Wobble disclosed: she
  begins in the Terran Army rather than a navy, and the prequel trilogy is an ensemble war chronicle, not a climb.'

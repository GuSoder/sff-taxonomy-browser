placement_status: accepted
placement_rationale: 'Whole-fiction source-led rewalk2026-11-05 active MC04788 Citadel: Speculative fiction > Science
  fiction > Futurist SF > Spacefaring fiction > Military science fiction > Space navy > Space armada > Starbridge.
  Whole3 regular novels: Live Free or Die2010, Citadel2011 (queue2010 wrong), The Hot Gate2011. Restore missing
  Citadel; remove Troy Rising2020 ebook bundle and Live Free or Die Second Edition2023 as phantom separate novels.
  Author explicitly2023 unchanged second edition. Latest2026 Troy Rising is publisher-declared multi-author anthology,
  not fourth conventional novel: same universe, recorded related short fiction, not omitted as unknown nor counted
  as extra full novel. Publisher calls Ringo contribution novella, distributor short novel, so exact length classification
  uncertain; primary contents names it The Ringing Deeps with12 chapters, but contents alone do not establish novel
  length. Do not count the previously unfinished online fourth draft as full published novel merely from title.
  Publisher universe3+anthology and author interview agree main scope, latest anthology supersedes older draft status
  only for published short version. Inspired by Schlock Mercenary is not established same canon, no blind merge.
  Each novel independently source-read via publisher and finished reviews, not first-volume extrapolation.1 contemporary-start
  Earth suffers Horvath orbital tribute domination; Tyler trades maple syrup, builds alien-tech industrial base,
  solar-pumped laser and hollow asteroid battlestation, frees Earth in space battles.2 Earth already freed, Rangora
  destroys Glatun ally, Dana shuttle pilot and Butch welder build/crew Troy and consort, war to E Eridani.3 Dana
  moves to Thermopylae, repairs culturally divided squadron maintenance/leadership, then massive Rangora fleet battle
  threatens entire alliance. First-contact/occupation is launch premise, not persistent whole-fiction Earth resistance.
  Bulk beyond recognizable present: interstellar polity, fleets and space station society, not a whole narrative
  set in Modern-day; first volume itself reaches warship/space construction halfway. No actual temporal or parallel
  crossing established: gate is highway across stellar systems, not another reality. Rigorous Hard SF/Orbital mechanics
  serious alternative because laser engineering and inflated asteroid are extensively worked, but bought alien gravitics/FTL
  and political/military doctrine/characters increasingly dominate later2; engineering serves military race rather
  than constraint as entire whole-fiction reading. Future Earth war loses actual space setting, alien cultural study/first
  contact loses human industrial/naval war spine, Techno-fiction in space explicitly identity/network/posthuman
  focus not this hardware construction. Spacefaring military rather than general New space opera combat due naval
  formations, orders, training, station and fleet construction, rear/front theaters and campaigns. Space Navy >
  Armada: multiple huge battle stations, squadrons and allied/enemy fleets, no one independent small ship. Starbridge
  over Star stripes: not single officer career, Tyler entrepreneur, Butch welder and Dana rating co-lead across3;
  Space command close for Tyler/planning but much lived lower-deck/pilot/salvager and direct battle viewpoint, not
  headquarters at a remove. Substantial Starbridge wobble: unusually much industrial construction, corporate logistics,
  personnel culture, and no sole admiral protagonist; whole fleet war remains arc and massive engagements resolve
  each stage. All3 distinct English Baen print fronts visually inspected and localized,159/160/158x240 low resolution
  disclosed. Earth resistance4->3; Starbridge8->9, no freeze or new definition.'

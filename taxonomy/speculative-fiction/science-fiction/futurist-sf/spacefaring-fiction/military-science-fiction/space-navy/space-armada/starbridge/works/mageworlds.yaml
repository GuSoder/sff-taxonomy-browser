placement_rationale: 'Root-down: Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Space navy
  > Space armada > Starbridge. Per Tor and ISFDB (SF), SFE (space opera) and the blurbs: the Republic''s Space Force against
  the Mageworlds across the Magewars (Galcen falls in book 3; The Long Hunt is a generation after the Second Magewar). The
  war is the arc across seven books. Soft, three ways: SFE notes fantasy outcomes (Mages) so it is a NO-REAL-MAGIC watch item,
  the books mix pilot adventure (Space dash runner-up) and war, and Stars Asunder and A Working of Stars are prequels. Stars
  Asunder year is 1999 (ISFDB), intake row lists 2011.'

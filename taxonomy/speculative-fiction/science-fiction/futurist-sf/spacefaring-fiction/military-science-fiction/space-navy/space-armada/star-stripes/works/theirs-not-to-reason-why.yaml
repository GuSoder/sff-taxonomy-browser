placement_rationale: 'Whole-fiction re-walk after main''s 2026-11-03 gate challenges. The card now holds only the Theirs Not
  to Reason Why pentalogy: the First Salik War trilogy is a separate author-named series with different protagonists and a
  different thematic focus (author site series pages; ISFDB series records; reading1000lives.com: ''marks the start of a new
  series, with a different thematic focus, which can be read on its own'') - separated under the Eternity War / Lazarus War
  precedent (same universe, separate named series = separate cards). The pentalogy is one officer''s climb through the ranks:
  Marine recruit with precognitive visions, field-promoted (A Soldier''s Duty), Space Force Navy academy (An Officer''s Duty
  - author site and PRH: ''poised to become an officer in the Space Force Navy... her plan is to command a Blockade Patrol
  ship''), captain of the Blockade Patrol ship Hellfire as the Second Salik War breaks out (Hellfire), the crew fighting out
  of a planetary blockade (Hardship), and the final Salik/Grey campaigns (Damnation). Walk: Science fiction > Futurist SF
  > Spacefaring fiction > Military science fiction > Space navy > Space armada > Star stripes - the climb from a first posting
  to the captain''s chair inside the service''s chain of command is the arc, and the Salik/Grey fleet war is its field. Wobble
  disclosed: book 1 is Marine infantry before her Space Force Navy commission (Elitist Book Reviews: she joins the Marines).'

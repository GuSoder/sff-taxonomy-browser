first_published: 1998
canonical_genre: space-marine-corps
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Ground-pounders > Space marine corps. Ian Douglas''s Marine Corps saga: the Heritage Trilogy (Semper Mars, Luna
  Marine, Europa Strike) fights the Solar System war, the Legacy Trilogy (Star Corps, Battlespace, Star Marines) is its sequel
  and takes the Corps interstellar, and the Inheritance Trilogy (Star Strike, Galactic Corps, Semper Human) follows; the same
  Marine dynasties (Garroway, Ramsey, Lee, Alexander, Warhurst) carry through all nine novels (en.wikipedia.org/wiki/Legacy_Trilogy:
  the sequel to the Heritage Trilogy and followed by the Inheritance Trilogy; FictionDB and Books on Board series order).
  One universe, one fiction (rule 11j). Rejected: Space armada and Space command (the fleet is not the story, the Marines
  are), Alien-war grunts (the Corps and its lineage, not the grunt''s grim war, is the spine), Super space soldier (no remaking
  of the soldier). Wobble: moderate; the saga spans centuries and later becomes interstellar fleet-and-ground war. Years from
  first printing (Avon/Eos/Harper); Star Strike and Galactic Corps both 2008.'

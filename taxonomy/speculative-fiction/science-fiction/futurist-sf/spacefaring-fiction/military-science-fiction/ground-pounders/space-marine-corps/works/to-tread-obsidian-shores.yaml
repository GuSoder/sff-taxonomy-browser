placement_rationale: 'Root-down: Science fiction > Futurist SF > Spacefaring fiction >
  Military science fiction > Ground pounders > Space marine corps. The Bronze Legion book 1:
  the Protectorate of Mars Foreign Legion, a path to citizenship, followed from inside -
  Blue, a failed Survey Corps candidate turned Legion dropship pilot, and Tavi, a refugee
  driven from his world who finds a family in the ranks (Baen: "a new life... something even
  better - a family"). A standing corps carried into space, recruits and unit life from the
  soldier''s eye: not Space mercs (state legion, no contract engine) and not Alien war grunts
  (no grim alien-enemy war in the premise).'

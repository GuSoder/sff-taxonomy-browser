canonical_genre: alien-war-grunts
placement_status: accepted
placement_rationale: |-
  Root-down: Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Ground-pounders > Alien-war grunts. Mankind is "locked in warfare with an insidious alien race"; the Simulant Operation Programme's soldiers fight the war on the ground through remotely operated avatar bodies, Captain Conrad Harris "running suicide missions in simulant bodies" (hachette.co.uk/titles/jamie-sawyer/the-lazarus-war-artefact/9780356505459/); Neal Asher on the book: "Alien biomechs... terrorism, subterfuge and traitors". Grim alien war from the foot soldiers' mud - the leaf's gate. Rejected: Super space soldier (the avatar mechanic serves the war story; the alien war, not the soldier's remaking, is the engine), Space marine corps (the Programme is an elite black-ops team, not a Corps tradition), Space mercs (no contract/pay driver). 3 novels (Artefact 2015, Legion 2015, Origins 2016 - Orbit/Hachette); the novella Redemption (2015) excluded per intake rules.

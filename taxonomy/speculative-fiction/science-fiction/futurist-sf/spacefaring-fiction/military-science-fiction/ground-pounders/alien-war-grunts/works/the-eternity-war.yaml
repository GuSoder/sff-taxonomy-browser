canonical_genre: alien-war-grunts
placement_status: accepted
placement_rationale: |-
  Root-down: Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Ground-pounders > Alien-war grunts. Same universe as The Lazarus War but a separate named series (ISFDB "The Lazarus Universe"; orbitworks.net series page): Lieutenant Keira Jenkins and the Jackals fight "the insidious Krell Empire and the mysterious machine race known as the Shard" (orbitbooks.net/2017/05/11/new-series-alert-the-eternity-war-by-jamie-sawyer/) - alien and machine enemies, ground-team view. Rejected: Super space soldier (the war, not the soldier's remaking, is the engine), Space marine corps (no Corps tradition), Space mercs (no contract driver). Wobble mild (the Black Spiral human-terrorist conspiracy is prominent in the early books) RESOLVED: the Krell/Shard alien war frames the trilogy and reignites in its endgame. 3 novels (Pariah 2017, Exodus 2018, Dominion 2019 - Orbit/Hachette).

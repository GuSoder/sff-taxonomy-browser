placement_rationale: 'Retain Alien-war grunts after whole5novel check26November2026. Root SF/Earth-descended interstellar
  Step tech > Futurist > Spacefaring > Military > Ground-pounders > Alien-war grunts. Glory Main''s survival/first command,
  Orphan Brigade, Dire Steps hillside fights and Banshees, CHOP Line training/secret mission and Live Echoes ground assault/rebellion
  form sustained infantry arc of Jander/Ayliss. Olech/Reena political leadership and alien-Step inquiry are substantial, not
  denied. No evidence Mirror''s reliving choices is actual temporal travel, rather alien examination in separate realm; no
  positive magic/authored reality. Artificially created ENEMY Sims do not make human protagonists remade supersoldiers. Powered
  armor alone not body/memory remaking. Space command strongest rival but parent viewpoints do not displace sustained troop-scale
  reading, no single admiral campaign perspective. Corps/academy/mercs not whole-series organization. Moderate fit. Sources
  read https://amazingstories.com/2015/02/review-glory-main-by-henry-v-oneil/ ; https://amazingstories.com/2015/09/review-dire-steps-sim-war-book-3-henry-v-oneil/
  ; https://www.goodreads.com/book/show/34379693 ; https://www.goodreads.com/book/show/31127134-chop-line . Finished-reader
  evidence distinguished from promotional text.


  Earlier rationale:

  Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science fiction > Ground-pounders.
  Humanity has fought for decades against an alien enemy that looks almost human, the Sims, and the books follow soldiers
  on the ground, beginning with marooned troops fighting for survival and salvation on a hostile world (HarperCollins listing;
  Amazon and Margins series pages; ISFDB tags military sf, aliens, telepathy). The soldier''s-eye war fought in the field
  is the leaf''s definition. Rejected: Space command (the view is the troops'', not the campaign''s top), Space navy (the
  fight is on the ground, not the bridge), Space academy (no training story). Wobble: moderate; later books (Dire Steps, Live
  Echoes) widen to politics and the home front and the source is thin on them, so the pull to Space command is real. Sources:
  HarperCollins NZ, ISFDB series 36747, Margins. Years: ISFDB lists Glory Main 2012 (self-published first, Harper Voyager
  reissue 2014). Series is five books with CHOP Line (2016) not in the queue.'

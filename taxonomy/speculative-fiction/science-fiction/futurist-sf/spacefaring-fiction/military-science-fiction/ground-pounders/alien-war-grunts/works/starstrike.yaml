placement_rationale: 'Retain Alien-war grunts26November2026. Two linked2007/2008novels, future human Navy SEALS(space-inclusive)
  infantry specialforces against alien empires. SF technological galactic setting, not demonstrated magic/time crossing. Ground
  mission to Mars then Operation Orion missing diplomatic ship trail/hostile ice-moon commandos, soldier squad action rather
  than command chair/naval bridge. Unit is SEALS not marine Corps institution, no hired regiment or engineered-body story.
  Diplomatic/mystery premise leads combat rescue, does not organize a whole detective profession. Source completed bibliography
  and primary https://www.penguinrandomhouse.com/books/41509/starstrike-operation-orion-by-kevin-dockery-and-douglas-niles/
  . No new issue overriding existing audit.


  Earlier rationale:

  2050: Navy SEALs re-badged SEALS (Sea, Air, Land, and Space) are sent to a silent Mars outpost, kidnapped by hostile aliens,
  and fight through alien battalions; book 2 puts them on an ice moon crawling with enemy commandos amid three warring alien
  empires (PRH series page). A ground-level war against aliens.'

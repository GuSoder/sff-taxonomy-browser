placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Ground-pounders. SFE: a grimly told, extremely violent military SF sequence set on a war-torn near-future Earth
  after sixty years of unequal war with the alien ''Them'', followed by an interstellar second book; the war is seen through
  the soldiers'' eyes. Rejected: Future war (Earthbound conflict is only the first volume), Space command (nobody directs
  the campaign from the top), Alien conquest fiction (the war is already decades old, not the arrival). Wobble: Future war
  for book one''s Earth setting. Two volumes folded as one fiction: Veteran (2010), War in Heaven (2011).'

placement_rationale: 'Retain Alien-war grunts after26November2026finite review. Real human Commonwealth galactic future, hostile
  colonizing alien swarm, no actual time crossing/magic proven. SF > Futurist > Spacefaring > Military > Ground-pounders >
  Alien-war grunts. IMPORTANT ensemble, fleet build-up, presidential strategy and alien Grand Admiral viewpoints are real;
  former soldier-eye-only rationale overstates. Creator says social response to pacifism/war. Finished readers describe long
  recruit/boot-camp strand following heavyworld religious couple, culminating ground AND orbital battles. Multiple perspectives
  do not turn it into command-chair campaign novel. Warbot cyborgs and savant psychic communication part of setting, not wholefiction
  remaking single soldiers. Moderate leaf confidence, Space command rival explicit, no new structural seed for mixed viewpoints.
  Original stored2000publisher ebook date retained,2001print discrepancy noted not silently replaced. Sources https://www.baen.com/soldiers.html
  ; https://www.spokesman.com/stories/2004/oct/03/sci-fi-novel-soldiers-is-octobers-club-choice/ ; https://www.allbookstores.com/Soldiers-Dalmas-John/9780671319878
  ; https://www.goodreads.com/book/show/573241.Soldiers . SFsite index read, full DonnaMcMahon review not retrieved, not claimed.


  Earlier rationale:

  Dalmas''s Soldiers (Baen, first published December 2000 per baen.com; ISFDB''s 2001-05 is the later printing): after centuries
  of high-tech wars, galactic humanity''s Commonwealth of Worlds has concluded that war is psychotic - until an armada of
  more than 14,000 warships arrives, wiping every inhabited planet clean for alien colonists, and humanity must relearn how
  to be soldiers or go extinct (Baen publisher copy; blurbs by David Brin and William C. Dietz). Root-down: Science fiction
  -> Futurist SF -> Spacefaring fiction (galactic Commonwealth among the stars) -> Military science fiction -> Ground-pounders
  (the soldier''s-eye war) -> Alien-war grunts, a grim war against an alien enemy. Rejected: modern-day alien-invasion-fiction
  (fails the modern-day ancestor gate - future galactic setting, no Earth campaign); Space navy/Space armada (the enemy armada
  is the threat, the story is soldiers, not the bridge); Super space soldier (society relearns soldiering; individuals are
  not remade). Singleton: ISFDB title record 25053 lists no series.'

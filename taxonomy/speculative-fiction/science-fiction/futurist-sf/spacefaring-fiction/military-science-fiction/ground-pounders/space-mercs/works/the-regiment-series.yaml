placement_rationale: 'Five novels about the hired regiments of Tyss: The Regiment (1987) follows a mercenary regiment and
  the reporter who joins as its publicist; The White Regiment (1990) has the Confederation hire the legendary Tyss mercenaries
  to train a first test regiment; The Kalif''s War (1991), The Regiment''s War (1993) and The Three-Cornered War (1999) put
  the White Regiment under contract against the Kalif''s holy-war fleet, a rival hired Tyss regiment, and the Caliphate''s
  return. The hired unit''s contract, pay and loyalty drive every story: space-mercs, not Space marine corps (no state Corps),
  not Alien-war grunts (jobs for paymasters, not a grim alien war). Queue year 2007 is the Baen ebook; first publication 1991
  (Baen page: Published 5/1/1991).'

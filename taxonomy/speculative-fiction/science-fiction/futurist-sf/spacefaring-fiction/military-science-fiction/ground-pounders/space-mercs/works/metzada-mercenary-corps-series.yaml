placement_rationale: 'Rosenberg''s Thousand Worlds universe (ISFDB series 4301 Metzada Mercenary Corps; Wikipedia bibliography):
  Ties of Blood and Silver (1984, thief tale on Oroga) and Emile and the Dutchman (1986, Contact Service episodes) establish
  the universe; Not for Glory (1988) and Hero (1990) follow the Metzadan Mercenary Corps itself, a hired regiment selling
  ground war to whoever pays (Signet jacket: ''In the wars of other worlds, killing was their business''). Walk: Science fiction
  > Futurist > Spacefaring fiction > Military SF > Ground-pounders > Space mercs (hired unit, contract and pay drive the story).
  Not Space marine corps (no state Corps), not Alien-war grunts (a job for a paymaster, not a grim species war). Whole fiction
  judged by its governing merc mode (11j); Ties enters as a completeness volume. Wobble low.'

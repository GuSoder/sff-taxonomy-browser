placement_rationale: 'Weber''s The Excalibur Alternative (2002), a standalone built on the premise of Drake''s Ranks of Bronze
  (already a card here): aliens of the Galactic Federation abduct a 14th-century English army to serve as mercenaries on worlds
  where only low-tech weapons are allowed; the Baron in command and a dragon-like alien under the Guild''s heel mutiny and
  take the ship, and centuries later the Avalon Empire the English founded returns to save Earth from a Federation fleet (Wikipedia,
  The Excalibur Alternative, plot summary). Walk: Science fiction > Futurist > Spacefaring > Military science fiction > Ground-pounders
  > Space mercs (a hired fighting unit whose contract and loyalty drive the story, fought in the field for whoever pays),
  not Alien-war grunts (the war against aliens comes only at the end), Space marine corps (no state Corps), or the Space navy
  leaves. Wobble moderate: the book pivots from hired army to mutiny and an Earth-rescue ending, but the hired-regiment premise
  carries the first half and is the same premise as Ranks of Bronze. Source is Wikipedia, not the book. First publication
  2002 (queue year 2002). Queue id MC02458.'

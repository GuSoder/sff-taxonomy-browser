placement_rationale: '# Veteran duology full-corpus rewalk,26November2026

  Move Alien-war grunts > Super space soldier. Root-down Speculative fiction > SF > Futurist SF > Spacefaring fiction > Military
  SF > Ground-pounders > Super space soldier. Publisher explicitly300years in our future, Earth/Dundee then interstellar Lalande2,
  alien war and implanted/cyborg bodies. Religious hackers trying to turn internet into God and pirate''s demon selfimage
  are not proof literal magic. No actual time crossing established; flashbacks depict past campaigns, not temporal travel.
  Both novels one linked fiction,2010/2011.

  Jacob/Jakob Douglas is a demobbed genetically and cybernetically enhanced exspecialforces soldier with curtailed abilities,
  PTSD, body-cost and reactivation. First book alien infiltration reveals manufactured war by human Cabal; sequel sends same
  remade veterans against human Rolliston/Cabal on colony world. Hence grim alien enemy does not describe the whole diptych.
  Soldier remaking is positive fit, not title-based guess. Cyberpunk noir is serious rival: hacker Morag, cyberspace, corrupt
  power, pursuit and conspiracies on Earth. Yet armed enhanced veterans'' war tech and sustained campaign/combat missions
  organize both, particularly final military expedition; immersive world/brain passage not central virtual destination. Crime
  investigation serves war and reactivated soldiers, not a primarily sleuth profession. Not naval crew, command chair, Corps
  tradition, hired regiment or training school. Action romp and uneven hard science noted by completed critic do not negate
  SF identity or establish rigorous HardSF.

  Sources read: https://store.gollancz.co.uk/products/veteran ; https://store.gollancz.co.uk/products/war-in-heaven ; http://www.concatenation.org/frev/smith_veteran.html
  ; http://www.concatenation.org/frev/smith_war_in_heaven.html ; https://sf-encyclopedia.com/entry/smith_gavin . Moderate-high
  whole-fiction fit, no fullnovel read claimed.



  Former rationale:

  Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science fiction > Ground-pounders.
  SFE: a grimly told, extremely violent military SF sequence set on a war-torn near-future Earth after sixty years of unequal
  war with the alien ''Them'', followed by an interstellar second book; the war is seen through the soldiers'' eyes. Rejected:
  Future war (Earthbound conflict is only the first volume), Space command (nobody directs the campaign from the top), Alien
  conquest fiction (the war is already decades old, not the arrival). Wobble: Future war for book one''s Earth setting. Two
  volumes folded as one fiction: Veteran (2010), War in Heaven (2011).'

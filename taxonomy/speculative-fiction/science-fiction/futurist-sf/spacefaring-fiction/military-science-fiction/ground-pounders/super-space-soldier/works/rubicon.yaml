placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Military science
  fiction > Ground-pounders > Super space soldier. After her ninety-sixth traumatic resurrection, soldier Valero is reassigned
  to a special forces unit and fitted with a cutting-edge virtual intelligence, then drawn into an enigmatic major''s plan
  to end the war against machines bent on assimilating humanity, when her VI suddenly becomes sentient (publisher blurb, jsdewes.com/rubicon).
  The war remakes the soldier: serial resurrection, a machine in the head, the cost paid in body and memory. Rejected: Alien-war
  grunts (the enemy is machines but the mud-level view is not the story), Space marine corps (no corps tradition). Wobble:
  moderate, since the sentient VI and the major''s scheme lean toward Machine minds. Standalone, 2023 (queue and publisher).'

placement_rationale: '# Red Sword whole-novel rewalk,26November2026

  Move Alien-war grunts > Super space soldier, not a new genre. Root: Speculative fiction > SF > Futurist SF > Spacefaring
  fiction > Military SF > Ground-pounders > Super space soldier. WLT finished review and creator interview describe farfuture
  galaxy, resource-stealing Empire and cloned humans, no Earth-history setting despite1654/1658Korean inspiration. Author''s
  historical model does not make it historical SF. Wandlike weapons explicitly shoot lasers, sword fights not positive magic.
  No actual temporal crossing or reality-writing established. Cloning and repeated memory transfers are material SF mechanisms,
  not reincarnating souls or metaphysical resurrections.

  Full ending matters: Chrisna and fellow enslaved fighters discover they have been manufactured repeatedly; originals long
  dead, memories of family not their own, dead lover appears again as cloned commander. Double Helix chapters explicitly trace
  Empire''s experimentation/manufacture. Escaping imposed soldier identity is the organizing revelation and resolution, not
  a generic alien-frontline story with incidental biotech. The cannon-fodder mud and anti-colonial slave revolt remain real,
  and its soldiers are not glamorous superheroes. Super space soldier''s unchanged gate is war remakes soldier/body/memory,
  not required voluntary elite status or super strength. No Corps/academy/hired-regiment premise. Space slavery/rebellion
  and biotech identity are strongest crossbranch rivals, but ground-war body/memory manufacture unifies both strands. One
  original novel,2019Korean original; English2025translation is not new fiction/date replacement.

  Sources read: https://worldliteraturetoday.org/2025/july/red-sword-bora-chung ; https://frontline.thehindu.com/books/bora-chung-south-korean-writer-red-sword-interview/article71177688.ece
  ; https://www.klwave.or.kr/klw/books/409061/translatedView.do . Publisher PanMac redirect failed, not falsely claimed fullread.
  Moderate-high leaf confidence, no fullnovel read claimed.



  Former rationale:

  Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Military science fiction -> Ground pounders. Conscripted
  slave soldiers on an alien world, the war told from the infantry mud (Pan Macmillan/Honford Star copy; Locus review): the
  soldier''s-eye war that defines the leaf, not command-deck space opera.'

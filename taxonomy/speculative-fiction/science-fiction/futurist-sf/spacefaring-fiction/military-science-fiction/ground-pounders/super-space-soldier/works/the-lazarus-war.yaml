placement_rationale: '# Sawyer shared universe rewalk,26November2026

  Consolidate The Lazarus War and The Eternity War as ONE fiction, six original novels. Creator explicitly same universe,
  Orbit explicitly same world; accessible new-trilogy entry point is not a separate universe. Preserve all six titles/years/fronts.
  Redemption is a novella and excluded, not lost novel. Display title retains The Lazarus War, alias The Eternity War in canonical
  YAML.

  Root-down: Speculative fiction > SF > Futurist SF > Spacefaring fiction > Military SF > Ground-pounders > Super space soldier.
  Positive Earth-descended interstellar Alliance, quantum jumping, alien Krell biotech and human remote-operation tech. No
  demonstrated literal magic, independent invented fantasy world, actual temporal crossing or authored/revised reality premise
  in included six novels. Eternity is not evidence of time travel, nor Q-jump name sufficient. Not Fabulation or fantasy from
  unfamiliar aliens. Narrators Harris/Jenkins and small teams carry personally experienced suicidal battles across trilogy
  change, not grand-admiral command/naval crew or academy narrative. Space opera/alien archaeology mysteries serve this military
  engine.

  Super space soldier positive: human minds occupy expendable genetically enhanced clone bodies. Repeated deaths leave trauma
  and bodily stigmata, vulnerable natural operators remain in tanks. This is not ordinary infantry with better weapons. LJ
  first-volume completed review and both finished Dominion reviews explicitly weigh remaking/death/cost, across all six. Second
  trilogy human terrorist Black Spiral and alien alliance further defeat generic alien-war-only logic. Corps unit identity,
  hired contract/paymaster and academy training are rivals without governing premise. Current destination6after other finite
  corrections, no ten or structure change.

  Sources read: https://www.orbitbooks.net/2017/05/11/new-series-alert-the-eternity-war-by-jamie-sawyer/ ; https://mylifemybooksmyescape.wordpress.com/2017/10/04/author-interview-jamie-sawyer/
  ; https://www.libraryjournal.com/review/the-lazarus-war-artefact ; https://atboundarysedge.com/2026/02/05/book-review-the-lazarus-war-by-jamie-sawyer/
  ; https://atboundarysedge.com/2020/03/04/book-review-dominion-by-jamie-sawyer/ ; https://forwinternights.wordpress.com/2020/01/21/the-eternity-war-dominion-by-jamie-sawyer/
  ; https://www.hachette.co.uk/titles/jamie-sawyer/the-eternity-war-dominion/9780356510071/

  Confidence high corpus/merge, high leaf from primary and whole-series criticism, not claimed fullnovel reading. All former
  rationale retained below as historical reasoning, superseded on separate-world and grunt verdicts.



  Former rationale:

  Root-down: Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Ground-pounders > Alien-war
  grunts. Mankind is "locked in warfare with an insidious alien race"; the Simulant Operation Programme''s soldiers fight
  the war on the ground through remotely operated avatar bodies, Captain Conrad Harris "running suicide missions in simulant
  bodies" (hachette.co.uk/titles/jamie-sawyer/the-lazarus-war-artefact/9780356505459/); Neal Asher on the book: "Alien biomechs...
  terrorism, subterfuge and traitors". Grim alien war from the foot soldiers'' mud - the leaf''s gate. Rejected: Super space
  soldier (the avatar mechanic serves the war story; the alien war, not the soldier''s remaking, is the engine), Space marine
  corps (the Programme is an elite black-ops team, not a Corps tradition), Space mercs (no contract/pay driver). 3 novels
  (Artefact 2015, Legion 2015, Origins 2016 - Orbit/Hachette); the novella Redemption (2015) excluded per intake rules.

  Former Eternity rationale:

  Root-down: Science fiction > Futurist SF > Spacefaring fiction > Military science fiction > Ground-pounders > Alien-war
  grunts. Same universe as The Lazarus War but a separate named series (ISFDB "The Lazarus Universe"; orbitworks.net series
  page): Lieutenant Keira Jenkins and the Jackals fight "the insidious Krell Empire and the mysterious machine race known
  as the Shard" (orbitbooks.net/2017/05/11/new-series-alert-the-eternity-war-by-jamie-sawyer/) - alien and machine enemies,
  ground-team view. Rejected: Super space soldier (the war, not the soldier''s remaking, is the engine), Space marine corps
  (no Corps tradition), Space mercs (no contract driver). Wobble mild (the Black Spiral human-terrorist conspiracy is prominent
  in the early books) RESOLVED: the Krell/Shard alien war frames the trilogy and reignites in its endgame. 3 novels (Pariah
  2017, Exodus 2018, Dominion 2019 - Orbit/Hachette).'

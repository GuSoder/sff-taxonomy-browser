placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Military
  science fiction > Ground-pounders > Super space soldier. The Common is one complete trilogy: Stormblood2020, Blindspace2021,
  Wolfskin2026. Alien DNA/stormtech was deliberately injected into soldiers to make Reapers; it permanently remakes
  body, drives aggression/adrenaline addiction and costs agency, memory and relationships. Stormblood uses ex-soldier
  Vakov helping Harmony investigate murdered Reapers and drug distribution, with powered armor, frontline flashbacks,
  brother rescue and alienwar revelation. Blindspace shifts into fireteam missions, frontline armored battles and
  increasing alien mental/body control while the House of Suns calls back the Shenoi; ends in captivity, not a completed
  case. Wolfskin follows torture, rescue, bodily/mental recovery, choosing how far to transform, coalition building
  and direct personal combat against the Jackal and Shenoi. The altered soldier and enduring cost are the common
  subject across all3, not just presence of genetic technology. Ground-pounders supported by Vakov first-person
  front-line fighting and armor rather than bridge/naval campaigns or academy formation. Space command is a genuine
  finale-level resemblance in gathering an army but not a whole-trilogy command viewpoint. Space combat is a strong
  rival for action/adventure, not rejected for its9count: the more specific military engineered-soldier/body-cost
  focus is repeatedly explicit across the entire trilogy. Space marine corps lacks Corps/dynasty subject, Alien-war
  grunts underweights remaking and early human/cartel enemies, Space mercs lacks a hired regiment/contract engine
  despite former mercenary jobs. Space mystery fits book1 strongly but not the whole escalating war; not force all3
  into detective premise. Modern-day Genetic caste fails farfuture offEarth root; FutureEarth social futures/techno
  fails spacewar focus. Alien horror/minds and Theological space opera have genuine Shenoi worship/mindcontrol resemblances,
  but human engineered soldiers fighting and paying the cost organize the story, not cosmology/contact or rigorous
  alien biology. Newspaceopera political/character/drama/spacewestern/alien-delving/chase/caper branches lose to
  this military personal-combat spine. No time travel established: flashbacks and Blindspace mindscape are not time
  travel. No independently invented fantasy universe or demonstrated magic engine. Moderate-high classification
  confidence from author interview and independent detailed reviews of each full volume, not direct fullnovel reading.
  No structural or definition changes;5->6.'

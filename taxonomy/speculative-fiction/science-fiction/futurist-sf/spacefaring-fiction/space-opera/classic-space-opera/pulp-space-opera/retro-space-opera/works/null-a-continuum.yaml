placement_rationale: 'Singleton continuation of A. E. van Vogt''s Null-A sequence (SFE: ''an exceedingly ingenious continuation...
  that far surpasses van Vogt''s own weak third volume''): Gilbert Gosseyn''s story resumes in van Vogt''s 26th-century interstellar
  setting - the Venusian Games, non-Aristotelian discipline, the galactic power struggle - written in 2008 in deliberate golden-age
  pulp mode. Fits the Retro space opera gate: twenty-first-century space opera that deliberately looks backward, channeling
  the pulp era''s style - here literally the pulp era''s own series continued. Walk: Science fiction > Futurist SF > Spacefaring
  fiction > Space opera > Classic space opera > Pulp space opera > Retro space opera. Rejected: Golden age space opera (era-bound
  to the original wave; 2008 publication), Psionics (under Future of Earth fiction; Null-A is interstellar - Venus and the
  galaxy). Queue-year note: MC04692 lists 2015 (reprint); first publication Tor 2008 (SFE). Wobble: psi-hero texture inherited
  from the source series.'

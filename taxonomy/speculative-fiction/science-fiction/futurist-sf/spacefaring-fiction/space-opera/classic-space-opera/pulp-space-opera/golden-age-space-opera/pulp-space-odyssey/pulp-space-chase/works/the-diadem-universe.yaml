title: The Diadem Universe
authors:
- Jo Clayton
first_published: 1977
canonical_genre: pulp-space-chase
placement_status: accepted
placement_rationale: 'Jo Clayton''s Diadem Universe (ISFDB: one series of three sub-series - Diadem Saga 9, Shadith''s Quest
  3, Shadowsong 3, 1977-1996; rule 11j one fiction). SFE (Jo Clayton entry): ''a long series of science-fantasy Space Operas
  of extended quests'', venues ''reminiscent of the worlds of Leigh Brackett'' - the pulp lineage named by the source itself.
  Aleytys is hunted across worlds for the power-bestowing diadem, then becomes a Hunter herself (Star Hunters, The Nowhere
  Hunt, Ghosthunt); Shadith''s Quest hunts Seyirshi, a destroyer of worlds (PRH series page); Shadowsong runs the trail out.
  Pursuit, hunter and hunted drive the run: the Pulp space chase gate is exact. Odyssey boundary test (remove the rival-power
  structure; a person''s journey remains) puts it under Pulp space odyssey, not Pulp space empire; chase over voyage because
  the pursuit, not the journey out, is the engine. Not the New space opera line: its ancestor gate is ''the self-aware revival
  of space opera from the 1980s on - Banks and his heirs'' and a 1977-96 DAW adventure series is the tradition the revival
  revived against. Not Retro space opera (not a 21st-century deliberate throwback); not Evergreen space opera (dated, not
  perpetually current); not future-history-in-space (episodic quests, not a chronicle of civilization''s course); not the
  science-fantasy/planetary-romance branch (FTL interstellar setting breaks the atemporal ''known physics intact'' ancestor
  gate). Era note: the written Pulp space opera gate is a mode gate (''space opera in the pulp tradition'') with no date bound;
  Golden age tenant practice already spans 1950-1992 (Voyage of the Space Beagle 1950 to Starliner 1992, Heechee Saga 1977).'

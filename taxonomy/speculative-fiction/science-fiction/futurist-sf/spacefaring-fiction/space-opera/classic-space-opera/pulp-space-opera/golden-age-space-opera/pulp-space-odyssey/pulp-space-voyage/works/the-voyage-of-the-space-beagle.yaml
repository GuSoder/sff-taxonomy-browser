placement_rationale: 'A. E. van Vogt, The Voyage of the Space Beagle (1950 fix-up of four Astounding stories; Wikipedia, ISFDB): a vast starship with a crew of a thousand sets out on a deep-space expedition through the galaxy, and the Nexialist scientist Grosvenor outthinks a series of hostile alien species met along the way (Coeurl, Ixtl, the Anabis, the Riim). Walk: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > Classic space opera > Pulp space opera > Golden age space opera > Pulp space odyssey (a party carried across space by exploration, no governing galactic power). Rejected: Alien expedition (at nine, and the book is pulp adventure rather than contact), Pulp space empire (no rival-power structure). Wobble: low. Sources read: Wikipedia and enotes summaries; ISFDB listing.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Odyssey. A captain and three witch children flee and roam through comic space adventures as a small party. One fiction for the Witches of Karres series (rule 11j): Eric Flint and Dave Freer''s Baen sequels, The Wizard of Karres (2004, with Lackey; Captain Pausert, Goth and the Leewit join an interstellar circus while the Imperial Fleet takes him for a criminal), The Sorceress of Karres (2009) and The Shaman of Karres (2020), follow Captain Pausert and the Karres witches and fold on.'

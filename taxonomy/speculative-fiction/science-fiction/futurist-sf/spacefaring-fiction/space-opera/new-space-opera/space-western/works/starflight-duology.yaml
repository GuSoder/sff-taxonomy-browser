placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera >
  New space opera > Space western. Queue MC06679 (Starflight, 2016) and MC06678 (Starfall, 2017), the complete duology (the
  author''s FAQ: both series are complete; the author''s Alienated books are a separate universe). Solara Brooks, a young
  mechanic with felony tattoos, indentures herself for passage to the lawless outer realm and ends up on the Banshee, a vessel
  of dubious repute, hunted for a conspiracy; Starfall follows the crew back to a war-torn Eturia and a bounty-hunter capture,
  against the Zhang mafia and a conspiracy. The frontier is the engine: lawless outer realm, bounty hunters, a misfit crew
  and a mafia, in a register reviewers call the YA Firefly. The ship becomes a family, but the plot is adventure and conspiracy,
  so Space western over Spaceship drama (care is not the engine) and over Space romance (two couples, but the adventure carries
  the plot; Cassia''s fled arranged marriage is backstory). Sources: https://melissa-landers.com/starflight-series/ ; https://melsbookshelf.com/book-reviews/starflight-melissa-landers/
  ; https://metaphorsandmoonlight.com/book-review-starfall-starflight-book-2-by-melissa-landers/ ; http://melissa-landers.com/starfall-is-here-starflight-is-99-cents/
  . Soft spot: Spaceship drama (found family) and Space romance are real rivals. Reference level, not a full read.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera >
  New space opera > Space soap opera > Space romance > Alien space love. Queue MC06676 (Alienated) and MC06677 (Invaded),
  plus the unqueued third novel United (2016), which completes the trilogy (the author''s FAQ: the Alienated series is a trilogy
  with one free online short story, Until Midnight, left out as a free web story; series order per the author site and Wikipedia:
  Alienated, Invaded, United). Two years after first contact, Cara Sweeney hosts the first L''eihr exchange student, Aelyx.
  The romance between a human girl and an alien boy is the spine across all three books (Cara later travels to the L''eihr
  homeworld in Invaded; United unites both peoples against a common enemy and ends with Cara and Aelyx overseeing the new
  colony), and the alien world and the alliance between their planets decide whether they can be together. Not Alien arrival
  (first contact is two years in the past and peaceful; the plot is the love and the coalition), not Rom-com SF (the tone
  is earnest YA romance with coups and war, not comedy). Sources: https://melissa-landers.com/faqs/ ; https://melissa-landers.com/alienated-2/
  ; https://muse.jhu.edu/article/577119/summary (Invaded, Bulletin of the Center for Children''s Books) ; https://www.simonandschuster.net/books/United/Melissa-Landers/Alienated/9780997086805
  ; https://seriesousbookreviews.com/book-recaps/series-a-f/ . Soft spot: the first book is set mostly on Earth at a high
  school, so the leaf''s spacefaring frame is carried by books 2 and 3. Reference level, not a full read.'

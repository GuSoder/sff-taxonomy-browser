placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New space opera > Space soap opera > Space romance > Alien space love. Complete Starlight''s Shadow trilogy (Harper Voyager, 2022-2023; the Honor and Shadows prequel novella stays excluded by the novella rule). Each volume pairs a human with a Valovian: bounty hunter Tavi Zarola and Valovian former general Torran Fletcher (Hunt the Stars), Kee Ildez and Valovian teleporter Varro (Eclipse the Moon), Lexi Bowen and Valovian teleporter Nilo Shoren (Capture the Sun), romance across the species divide between the galaxy''s two post-war superpowers, BISAC Fiction: Romance / Science Fiction. The species divide is what the love must cross: Alien space love, exactly the leaf gate. Sources: jessiemihalik.com series and book pages (bibliography, jackets, copy), publisher BISAC. Rejected: Forbidden space love (post-war mistrust is tension, not a legal or court prohibition), Dangerous space love (Torran is an ex-general, not an outlaw), Arranged space love (no imposed match), Space romance umbrella (split 2026-11-02). Wobble: the bounty-hunt and war-investigation plots are strong adventure engines, but the romantic relationship is the spine in every volume (publisher categorization and author copy agree).'

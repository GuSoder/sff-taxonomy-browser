placement_rationale: 'Complete space opera romance trilogy (Harper Voyager, 2019-2020).
  Three von Hasenberg sisters, one self-contained romance per volume - runaway princess
  Ada and outlaw soldier Marcus Loch (Polaris Rising), widowed spymaster Bianca and the
  family''s security advisor (Aurora Blazing), socialite spy Catarina undercover with a
  bodyguard posing as her lover (Chaos Reigning) - against the High Houses'' war over
  the alcubium FTL mineral. The romantic relationship is the plot''s spine in every
  volume, with interstellar society and conflict shaping who can be together: Space
  romance, exactly the leaf definition. Sources: jessiemihalik.com series/book pages,
  harpercollins.com, Goodreads series 248909.'

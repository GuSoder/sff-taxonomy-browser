placement_rationale: 'Lisanne Norman''s Sholan Alliance (9 novels; PRH series page penguinrandomhouse.com/series/BTG/sholan-alliance/
  lists all 9 in order with blurbs; SFE sf-encyclopedia.com/entry/norman_lisanne: ''Planetary Romance tales within a Space
  Opera setting''; years: Turning Point 1993, Fortune''s Wheel 1995, Fire Margins 1996, Razor''s Edge 1997, Dark Nadir 1999,
  Stronghold Rising 2000, Between Darkness and Light 2003, Shades of Gray 2010, Circle''s End 2017). Carrie, a human telepath
  of the colony world Keiss, bonds with Kusac, a felinoid Sholan: ''the bond they formed was compounded equally of love and
  mind power'' (PRH, Fortune''s Wheel). The series'' defining concept and engine is this cross-species telepathic bond - Sholan
  guild and clan law, and the politics of both races, shape who can be together - while the Valtegan war supplies the stakes
  (PRH''s series copy: ''the adventures of Carrie, a human telepath, and the alien to whom she is linked... in their fight
  against the threat of the warlike Valtegans''). Walk: Speculative fiction > Science fiction > Futurist SF > Spacefaring
  fiction > Space opera > New space opera (1993-2017, DAW) > Space soap opera (the engine is the relationship; war and politics
  supply the stakes) > Space romance > Alien space love (the love crosses a species divide; the alien world shapes who can
  be together). Rejected: Planetary romance (the series ranges many worlds with fleet war - space opera, not single-world
  adventure; and its furniture is psi-SF, not tech-as-myth), Political space opera (guild and treaty politics are recurring
  stakes, not the engine), Space combat (the leads are telepaths and envoys, not soldiers; combat is a means, not the point),
  Space caper/chase (no scheme or pursuit spine). Wobble: mid-series books (4-6) run on missions and diplomacy with the bond
  established rather than courted, so the ''spine'' word in the Space romance gate sits loosely there; the Nov 8 tiebreak
  - the concept the fiction is famous for - is the Carrie-Kusac bond, and every PRH blurb leads with it. NOTE: this reverses
  the earlier parked lean toward Space adventure (rejected alien-space-love on ''war drives, bond is premise''); that research
  predates the Space adventure split, and none of its children (caper/chase/combat) fits the series'' actual engine. One fiction,
  one card (11j); queue rows MC06075-79 are 5 of the 9 novels, the other 4 folded as the same series. Sources: PRH series
  page (order, blurbs, covers), SFE, fictiondb.'

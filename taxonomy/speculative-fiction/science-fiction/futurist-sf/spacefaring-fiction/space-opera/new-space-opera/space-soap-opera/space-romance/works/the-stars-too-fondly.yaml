placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space soap opera > Space romance. Per Publishers Weekly (reviewed 25 Mar 2024) and Hachette: in 2061 four
  young professionals break into the Providence, a ship whose crew vanished in the failed launch twenty years earlier, and
  accidentally fly it out; the story follows the engineer Cleo and the ship''s uploaded former captain Billie, with the romance
  as the thread through the mystery of what the dark matter engine did to them. Sapphic romance is the spine and the voyage
  and the engine mystery supply the stakes: the Space romance definition. Rejected: Spaceship drama (the found-family crew
  is real but the Cleo and Billie relationship carries the plot), Space caper (the ship is taken by accident, no scheme),
  Starship mysteries (not a generation ship). Wobble: the crew-as-family and superpower thread sit close to Spaceship drama.
  Year 2024 (Harper Voyager, 11 June). The Ascendancy Trilogy by the same author is unpublished (Jan 2027) and held, and is
  not connected to this book.'

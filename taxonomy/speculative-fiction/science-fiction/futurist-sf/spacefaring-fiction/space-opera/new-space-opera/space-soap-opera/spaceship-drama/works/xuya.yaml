placement_rationale: '# Xuya included-novel consolidation, 23 November 2026


  One shared universe, two already-included novels: The Red Scholar''s Wake (2022) and A Fire Born of Exile (2023). The author''s
  bibliography and both book pages explicitly bind them to Xuya. Standalone plots do not make separate worlds. No new novel,
  novella or short story is added. Navigational Entanglements is explicitly a different universe in the author''s Clarkesworld
  interview and is not folded.


  ## Temporal scope ruling

  Original authenticated owner message phonemsg-01M850W64E1MFDAN0BQD84RRP9, 23 November 2026 21:17 CET, answers the exact
  scope question: temporal placement is judged from the books included, not an excluded small novella. The rationale is that
  Atemporal avoids ambiguous placement across Historical/Modern/Futurist when travel crosses time; an excluded novella does
  not create that ambiguity for the included novels. Thus The Citadel of Weeping Pearls remains excluded and its explicit
  time travel does not force these two novels to Atemporal. This does not waive time-travel checking within included books
  or approve novella inclusion. The original individual-fiction/shared-world grant is phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX,
  personally recovered before this work.


  ## Root-down walk of both included novels

  Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera > New space opera > Space soap opera
  > Spaceship drama.


  Science fiction rather than Fantasy: human and mindship societies, technological mindship embodiment and space habitats,
  not supernatural gods or literal magic. The name Alchemist is a disguised scholar''s title, not evidence of alchemy. The
  included novels inhabit a stable space-age human civilization; no included-novel time travel, reincarnation or traversed
  alternate reality is established by the read author pages and completed reviews. Xuya''s alternate-history backstory is
  real but these novels are not about living through an Earth-past fork. Historical/Modern fail their actual space-age settings;
  Futurist is clear. Atemporal tested against the included novels under the owner''s explicit ruling, not silently ignored.


  Futurist: Hard SF loses rigorous physical constraint as the subject, Alien fiction loses independent alien society/contact,
  Future of Earth loses the orbital/interstellar arena. Spacefaring fits the human/mindship space civilization. Inside Spacefaring,
  neither military service/campaign nor sustained civilization history nor generation-ship society is the shared engine. Techno
  fiction in space has real weight because ships are living people, but the technology itself, identity transfer and interstellar
  networks are not the two novels'' subject. Space colonies'' power/case/lived-place partition fits parts of Fire, not Red
  Scholar''s moving pirate fleets and marriage. Space dystopias accurately notices Fire''s oppressive Belt but not both novels''
  governing personal relationships; the social order supplies stakes rather than replacing those relationships. Comic space
  fiction fails sustained comic intent.


  Space opera: contemporary self-aware intimate space opera rather than classic pulp, evergreen or retro. Political space
  opera is the strongest rival, notably Galactic houses: the pirate nations in Red Scholar and prefect/general''s networks
  in Fire are real. But both books'' decisions and resolutions turn on personal relationships and ethical treatment of people,
  not who governs an interstellar power. Locus specifically details Hoà''s compassion changing Quỳnh''s revenge and Minh''s
  relation to an abusive mother; Salon Futura distinguishes the younger people and romance from the rulers. Space adventure''s
  fight/chase/scheme is not the shared spine. No theological search or Western frontier contract. Space soap opera positively
  fits interpersonal bonds against space-opera stakes.


  Within Space soap opera, Space romance is a serious and explicitly author-named rival. Red Scholar''s human/mindship marriage
  fits AI space love and has an arranged-match element; Fire''s human/human revenge romance does not fit AI, alien or arranged
  love. Dangerous space love captures the avenger''s risk but misses the first book''s defining inter-embodiment marriage;
  Forbidden love''s law/family prohibition is not the common spine either. Do not make a new generic romance remainder or
  invent a love-subtype match. Spaceship drama''s intimate relations among a close spacefaring community, care, family and
  mutual aid covers both positively. The author''s Clarkesworld interview identifies Xuya''s continuing focus as living ships/stations
  sharing life with humans and what that means for their relationships. Both novels'' families include mindships born into
  human lineages. Retain moderate confidence because the title-level romance and political/revenge strands are substantial.
  This is an existing-leaf whole-fiction judgment, no definition changed.


  ## Practical changes

  Replace Red Scholar''s single-book card in Spaceship drama with Xuya, preserving that book and its hotlinked cover; fold
  Fire Born''s existing book/cover out of Galactic houses into the same fiction. Preserve source records and old titles as
  aliases/redirects. Spaceship drama stays nine, Galactic houses four to three. Counts: 930 nodes, 2,980 fictions, 7,375 books
  after consolidation. Adding Activation later makes Drama ten; consolidation alone does not remove the split trigger.



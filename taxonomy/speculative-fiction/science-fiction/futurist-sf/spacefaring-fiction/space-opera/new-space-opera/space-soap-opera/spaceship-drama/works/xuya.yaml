  one galactic universe.

  - https://www.aliettedebodard.com/bibliography/novels/universe-of-xuya-romances/the-red-scholars-wake/ author confirms Xuya
  identity, human/mindship pirate marriage and love amid fleet conflict.

  - https://www.aliettedebodard.com/bibliography/novels/universe-of-xuya-romances/a-fire-born-of-exile/ author confirms Xuya
  identity, revenge, romance and habitats.

  - https://clarkesworldmagazine.com/debodard_interview_2024/ primary interview: shared human/mindship society and interpersonal
  relationships; Navigational Entanglements separate.

  - https://locusmag.com/review/liz-bourke-reviews-a-fire-born-of-exile-by-aliette-de-bodard/ completed professional review,
  both relationship/revenge arcs and resolution.

  - https://www.salonfutura.net/2023/11/a-fire-born-of-exile/ completed critical review, human/mindship family relationships
  and romance.

  - https://lynnemthomas.com/2023/10/25/book-review-a-fire-born-in-exile-by-aliette-de-bodard/ completed editor review, love/family/justice/slow-burn
  romance.

  - https://www.aliettedebodard.com/bibliography/novels/the-universe-of-xuya/the-citadel-of-weeping-pearls/ excluded novella''s
  explicit time travel, retained as scope evidence, not added.


  Both existing English print fronts were downloaded only to temporary research for actual pixel inspection, then preserved
  as hotlinks. Neither cover is stored in the repository.


placement_rationale: 'Root-down: Science fiction > Futurist SF > Spacefaring fiction > Space opera > New space opera
  > Space adventure > Space combat. The Dire Earth duology (Beyond Dire Earth): Injection Burn sends Skyler Luiken
  and a ragtag crew of scavengers, scientists and brawlers through the Swarm Blockade to rescue captive aliens;
  Escape Velocity follows the scattered crews fighting to destroy alien military compounds on Carthage and get home.
  Both volumes make the fight the adventure engine. Not Space chase (the rescue mission faces the foe), not Space
  caper (no scheme), not Military SF (improvised mixed crews rather than institutional warfare mode). Both publisher
  descriptions verified.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space adventure > Space chase. Per the Baen blurb: the most addictive drug in the universe is sold only by
  the alien Aensalords; Jaeger, the last private detective in a peaceful future, and Corcail Sendijen, a lobster-like alien
  and former Aensalord servant, set out to track the drug to its source, and learn that humans are test subjects for a plan
  that endangers the galaxy. The engine is a trail followed outward, tracking and the next jump, which is the Space chase
  definition. Rejected: Space mystery (it is for case-driven stories inside space colonies and their institutions; there is
  no colony), Space caper (no scheme being run), Alien infiltration fiction (Modern day axis, recognizable present; this is
  a far future), Alien conquest. Wobble: a detective-trail plot with a conspiracy at the end, so it is a stretch for a leaf
  whose examples are fugitives and bounty hunters; no better leaf for a future-Earth detective story exists in the tree. Published
  October 1975 (Berkley Medallion, ISFDB).'

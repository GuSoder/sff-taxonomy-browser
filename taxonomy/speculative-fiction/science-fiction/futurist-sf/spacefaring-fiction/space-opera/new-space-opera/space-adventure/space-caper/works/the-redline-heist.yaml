placement_rationale: 'Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera > New
  space opera > Space adventure > Space caper. Book one of the Doomsday series (Publishers Weekly: ''nostalgic sci-fi caper'',
  Baen 2026-02-03): a gentleman thief and a war-veteran bouncer team up for an intergalactic heist, then a deal with a megacorporation
  sends them into an alien pyramid base on Bethune where the job becomes a treasure hunt. The only book of the series so far;
  The Deep Man Trilogy is a separate universe. The scheme and crew drive the book, so Space caper. Rivals rejected: Space
  combat (the racing and fights serve the job), Space chase (not a pursuit). Wobble: the alien-base mystery and the road-warrior
  racing theme park pull toward Space adventure''s other leaves.'

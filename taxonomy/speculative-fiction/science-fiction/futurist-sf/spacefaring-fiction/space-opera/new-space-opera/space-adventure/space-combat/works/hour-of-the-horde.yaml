placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space adventure > Space combat. A horde of monstrous space travellers is advancing through the stars and Earth
  lies on its route; the threatened worlds form a super defense force, each contributing one talented warrior, and Earth''s
  man Miles Vander finds himself in the group of the less civilized defenders, whose raw courage meets the challenge best
  (DAW first printing back cover, ISFDB title 3749). Soldiers and pilots in a battle against an alien host, where combat drives
  the story, which is the leaf''s definition. Rejected: Space command (the story is in the ranks, not the command room), Space
  armada (no fleet is the subject), Alien conquest fiction (the invasion is stopped far from Earth). Wobble: moderate; the
  story is also a contest of strategy and temperament among the worlds'' warriors, and I read only the back cover. Year is
  the 1970 first edition (the queue showed 2018).'

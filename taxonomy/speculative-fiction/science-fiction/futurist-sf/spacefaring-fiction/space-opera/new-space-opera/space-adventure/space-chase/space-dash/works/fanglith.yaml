placement_rationale: 'Prey-side pursuit across both volumes. In Fanglith (1985) a family of political refugees fleeing the
  Empire of Human Worlds'' Thought Police is stranded on ''the galaxy''s most barbaric planet'' - revealed to the reader as
  11th-century Earth - and the children, with the ship''s computer and a telepathic wolf, must save their parents from the
  pursuers (baen.com/fanglith.html). In Return to Fanglith (1987) the Empire''s fleets reconquer the colony planets and Larn
  and Deneen must again flee their home and establish a rebel base (worldswithoutend.com synopsis). Flight, hiding and staying
  ahead of imperial pursuit drive both books - the leaf''s guarded-family-on-the-run mode verbatim; the medieval-Earth venue
  is the stage, not the mode (SFE dalmas_john: Dalmas transforms space-opera venues into arenas where ironies have free play).
  Tenant precedent: A Roil of Stars (Baen 1991, same fugitive-between-empires profile).'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space adventure > Space caper. James Bolivar DiGriz, alias Slippery Jim, a swashbuckling interstellar master
  criminal modeled on Rupert of Hentzau, is drafted into the Special Corps on the ''set a thief to catch a thief'' idea and
  runs cons, disguises and schemes against threats across the galaxy, the books growing lighter and madder as the series goes
  on (Michael Owen Carroll''s Harry Harrison site, which also records the first novel''s publication in November 1961 and
  the 1957 Astounding novelette that opens it). A scheme, con or covert job drives each story, the leaf''s definition. Rejected:
  Comic space fiction (the comedy is the tone, the engine is the scheme), Space chase (the pursuit is incidental). Wobble:
  moderate; later books are broad farce, and Jim usually works alone or with family rather than a crew. Sources: Carroll site.
  Years: 1961, 1970, 1972, 1982, 1996, 1999, 2010. The Stainless Steel Trio omnibus is an edition (skipped).'

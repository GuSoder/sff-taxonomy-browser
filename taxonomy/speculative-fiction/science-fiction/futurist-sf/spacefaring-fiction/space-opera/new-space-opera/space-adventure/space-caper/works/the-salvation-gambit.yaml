placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Space adventure > Space caper. Per the author''s site and Penguin Random House: a hotheaded hacker and her
  crew of con women must outwit the AI of a rogue warship turned penal colony to escape. A scheme run by a crew, with planning,
  disguise and the double-cross, is the Space caper definition. Rejected: Space chase (the plot is the con, not a pursuit),
  Space dystopias (the penal colony is the setting, not the subject). Wobble: the escape from the AI''s prison also reads
  as a thriller. Year per the queue, 2023.'

placement_rationale: 'Root-down: speculative-fiction > science-fiction > futurist-sf > spacefaring-fiction > space-opera >
  new-space-opera > space-adventure > space-caper. Nin Tova''s Guild of Thieves - thieves and warriors with psi powers - runs
  covert jobs: investigating drug-running in the Castor/Pollux region, then unmasking the October Guild as an alien race from
  the Sculptor galaxy out to control human space and kidnapping apprentice Asher Tye to learn his psi powers and the Guild''s
  plans (baen.com publisher copy). The engine is the crew''s scheme - the leaf verbatim (The Stainless Steel Rat keeps the
  same company). Not Alien infiltration: the story lives at the Guild''s end of the job, not inside the takeover. Two novels
  1987-1988 (OL first publication; Baen). Years are first publication.'

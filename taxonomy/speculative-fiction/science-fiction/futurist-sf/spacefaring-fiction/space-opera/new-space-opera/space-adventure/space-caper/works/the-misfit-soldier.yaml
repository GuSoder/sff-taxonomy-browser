placement_rationale: 'Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera > New
  space opera > Space adventure > Space caper. Sergeant ''Gas'' Gastovsky, a con man hiding in the augmented infantry, assembles
  a team of misfit soldiers for a big con and a behind-the-lines job to save a squadmate (publisher blurb and the author''s
  own ''Ocean''s Eleven in power armor'', michaelmammay.com/books/the-misfit-soldier). A standalone outside the Planetside
  series (the author says so), 2022 Harper Voyager. The crew''s scheme drives the whole book, so Space caper. Rivals rejected:
  Space mercs and the other ground-pounder leaves (a heist, not a contract war), Space combat (the fight serves the scheme).
  Wobble: military setting, which leans Military SF, but the engine is the con.'

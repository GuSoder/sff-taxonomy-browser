placement_rationale: '# The Two Lies of Faven Sythe, MC06624, 25 November 2026


  Place one standalone novel (2025) in existing Interstellar manhunt, 6 to 7. No structural change. Scope: Orbit explicitly
  calls it a standalone; ISFDB records the June 2025 first edition and only this novel. No shared universe inferred from author
  overlap with Protectorate or Devoured Worlds.


  ## Whole-fiction evidence and root

  Faven follows the trail of her missing mentor Ulana, whose supposed reassignment is false. Her forbidden investigation finds
  a starpath into the Clutch. She seeks pirate Bitter Amandine''s help, survives attempted abduction and a sabotaged ship,
  and the search draws them into the Choir of Stars'' suppression of missing navigators. The later rescue of Faven and journey
  into the Clutch reveal the truth of the navigators, ancient cryst, and Amandine''s ship and crew. This remains a person-search/conspiracy
  adventure even as the quarry leads to a wider origin mystery.


  The SF root has positive mechanism evidence, not a generic space-opera label. Fantasy Book Critic specifies that humans
  centuries earlier voluntarily merged with ancient alien technology to operate lightdrives. Kirkus independently identifies
  Faven as a human/alien-technology hybrid. Tzer Island connects cryst shielding, hull protection, navigation and the body''s
  crystallization, and describes the Clutch as a Dyson sphere around a star. Locus calls reproduction partly mystical, and
  some community reviews use magic vocabulary, but none supplies a demonstrated supernatural cause that defeats the explicit
  technological account. This is not a separately invented fantasy realm inferred from crystal aesthetics. Nor do I invent
  a named Earth or claim that its planet is explicitly mentioned. Human technological history supports a human future; Earth
  itself is not independently established. Owner''s no-proof-of-magic plus SF-tropes rule is applied alongside the later no-fantasy-realms
  rule, not against it.


  No actual temporal crossing established: plotting starpaths through spacetime is interstellar navigation, not time travel.
  Future human-descended hybrid civilization rather than historical/current Earth. No textual reality revision, portal to
  a fantasy realm, or fabulation found. I read primary publisher descriptions and multiple completed reviews, not the full
  novel; later revelations are grounded at review level, not claimed as primary text.


  ## Complete live-tree walk and rivals

  Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera > New space opera > Space adventure
  > Space chase > Space hunt > Interstellar manhunt.


  At SF''s time gate, Historical/Modern day lose to interstellar human technological civilization; Atemporal loses because
  no time travel or independent unanchored realm is established. At Futurist, Hard SF loses because engineering constraints
  are not the reading engine, Future of Earth loses to interstellar travel/action, Alien fiction loses because alien origins
  explain the conspiracy rather than displace the human-led pursuit. At Spacefaring, Space colonies loses because the trail
  leaves the settled station; Space dystopias loses because oppressive Choir rule motivates danger but is not closed-society
  life; Generation starships has no multigenerational society; Military SF has no campaign/service engine; Future history
  is no civilization chronicle; Techno-fiction in space loses because lightdrives/hybrids are worldbuilding, not identity/computational
  problem-solving as governing story; Comic space fiction loses because wit does not make parody/comedy the whole engine.


  At Space opera, this is contemporary self-aware pirate adventure, not classic pulp tradition despite its deliberate pirate
  mannerisms. At New space opera, Political space opera loses because suppression/conspiracy is discovered through the personal
  trail, not diplomacy or relations among interstellar powers. Theological space opera loses because the Choir and godlike
  cryst are not a pilgrimage or quest for sacred truth. Space western is the strongest broad tonal rival: pirates, misfit
  crew, hidden port and anti-authoritarian frontier flavor. It loses to the much more specific missing-person trail, rather
  than making a living on a frontier. Space soap opera loses because the relationship grows during the pursuit, and Locus
  explicitly says romance is not the primary interest. Neither Spaceship drama nor Space romance governs the plot.


  At Space adventure, Space caper loses: Amandine''s rescue/reward opportunism and Faven''s manipulation are a setup, not
  a sustained heist/con. Space combat loses: rescues and explosions advance the investigation, not an objective won chiefly
  by fighting. At Space chase, Space dash loses: Faven is hunted and must survive, but she deliberately follows Ulana''s route
  and seeks answers, rather than making escape/freedom the whole story. At Space hunt, Galactic treasure hunt is the strongest
  terminal rival: ancient relics, Black Celeste and the Clutch are prominent, but the operative quarry is the missing mentor
  and the fate of missing navigators. The lost ship is a location/clue to people and the conspiracy, not a hoard/artifact
  retrieval commission. Interstellar manhunt explicitly includes a missing soul, not only bounty hunting. Six live fictions
  before placement, seven after, under the split gate.


  ## Bibliography and covers

  First published 3 June 2025; later September Australian/New Zealand paperback release does not change first year. One book,
  one fiction, no series overlay required. One book-wide cover search, ISFDB''s US/UK editions use Ben Zweifel art. Actual-pixel
  comparison: UK Hachette front 440x692 and US Locus front 967x1500. Both colorful painted crystalline-space compositions,
  8/10. Same basic artwork, US is sharper and selected. Both English-title flags true. No photographed 3-D books. SFFWorld
  and BingeBooks front URLs returned 403 during candidate retrieval, so not selected. Only the selected hotlink is stored,
  no cover bytes in repository.


id: newtons-wake
title: Newton's Wake
authors:
- Ken MacLeod
first_published: 2004
canonical_genre: space-combat
placement_status: accepted
placement_rationale: 'Second re-walk 2026-11-27, correcting my own move the same day. Space succession opera fails: its definition
  is the succession of orders after imperial collapse or fracture, and Newton''s Wake has no empire that collapsed (the Hard
  Rapture was an AI uprising that emptied Earth, and the book''s powers, America Offline, the Knights of Enlightenment, the
  DK and the Carlyle clan''s Skein, are established long before the plot; sources: Wikipedia plot, Publishers Weekly 2004,
  Guardian 2004-03-27, New Scientist 2004). Not a Space caper either (the plunder raid is only the start, not the engine).
  Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera > New space opera > Space
  adventure > Space combat. Fit: the Space adventure umbrella says posthuman furniture is the stage, not the book, and its
  combat child is the fight faced head on with war machines and battlefields: a combat archaeologist''s team raids the posthuman
  artifact on Eurydice, skirmishes with its guards, wakes the war machines and then the powers fight over the Skein, with
  outrageous weaponry throughout. Rivals rejected: Space succession opera, Galactic houses (the powers are blocs, not houses),
  the Political space opera leaves (no court, revolt, succession or post-scarcity engine), Big dumb relics and Wreck delving
  (those are Alien delving: the relics here are posthuman, and the book is not an entering-for-knowledge story), Space caper.
  Wobble: real. The politics is heavy and satirical, so no Space adventure leaf is a clean fit; Space combat is the least
  wrong in the existing tree, and a seed for post-singularity power politics would be the alternative if the user prefers
  one.'

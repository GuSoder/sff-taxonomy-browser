  from: space-caper
  to: space-succession-opera
  reason: 'Re-walk 2026-11-27 under the Space caper positive gate (a scheme, heist or covert job run by a crew drives the
    story). Newton''s Wake (2004) opens on a plunder raid by Lucinda Carlyle''s squad, but the raid only starts the book:
    it wakes the war machines on Eurydice and the story becomes the gathering of the 24th century''s great powers (America
    Offline, the Knights of Enlightenment, the DK ''communists'') and the Carlyle clan''s wormhole skein over the Hard Rapture''s
    survivors (Publishers Weekly 2004; Guardian review by Gwyneth Jones, 2004-03-27; New Scientist 2004-07-31; Hachette blurb).
    It fails the caper gate. Standalone: ISFDB has no series for it and Wikipedia does not list it in the Fall Revolution
    series (so no fold into that card). Path: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction >
    Space opera > New space opera > Political space opera > Space succession opera. Fit: a new order forms among the powers
    that outlived the Hard Rapture''s collapse of civilization, set off by the Carlyles'' find. Rivals rejected: Galactic
    houses (the Carlyles are one clan among blocs, and the book''s politics is among powers, not feuds of houses), Rebel and
    Insurgent space opera (no empire to overthrow), Post-scarcity politics. Wobble: real; Galactic houses is the near rival,
    and the collapse here is the Singularity''s, not an empire''s.'

placement_rationale: 'Alex Lamb, the Roboteer trilogy (Roboteer 2015, Nemesis 2017, Exodus 2017; Gollancz, the author''s site):
  the starship Ariel, a mile long with six crew, is on a secret mission in a war involving the Galatean worlds; the roboteer
  Will Kuno commands a fleet of robot warships through his own neural link, and the fighting leads to an alien threat. Walk:
  Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New space opera > Space adventure
  > Space combat (a fight faced, with war machines and pilots driving the story). Rejected: Space dash and hunt (not a chase),
  Alien expedition (the contact is the late turn, not the engine). Wobble: medium; the later books turn on alien contact.
  Sources: Gollancz and the author''s site, not the books.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space
  opera -> Space adventure. PW: ''the far future with a Gilded Age aesthetic in this breakneck adventure''; sisters who ''spent
  years running scams on the rich passengers of interstellar liners'', a ''criminal syndicate determined to collect on Sol''s
  debts'' - ''Bridgerton in space''. The engine is the con itself: scams, pursuit and syndicate danger with momentum, which
  is the space-adventure brief.'

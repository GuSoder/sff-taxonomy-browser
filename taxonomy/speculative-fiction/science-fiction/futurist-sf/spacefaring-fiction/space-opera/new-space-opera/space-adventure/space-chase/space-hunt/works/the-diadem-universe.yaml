first_published: 1977
canonical_genre: space-hunt
placement_status: accepted
placement_rationale: 'Jo Clayton''s Diadem Universe (ISFDB: one series of three sub-series - Diadem Saga 9, Shadith''s Quest
  3, Shadowsong 3, 1977-1996; rule 11j one fiction). SFE (Jo Clayton entry): ''a long series of science-fantasy Space Operas
  of extended quests in highly coloured venues'': Aleytys is hunted across worlds for the power-bestowing diadem, then becomes
  a Hunter herself (Star Hunters, The Nowhere Hunt, Ghosthunt), questing for her mother''s homeworld; Shadith''s Quest hunts
  Seyirshi, an opportunistic destroyer of worlds (PRH Shadith''s Quest series page: ''must stop an opportunistic destroyer
  of worlds''); Shadowsong runs the trail to its end. Trail, leads and the next world drive every book: space-hunt gate exact.
  Wobbles: early Diadem Saga volumes carry a dash flavor (Aleytys as prey) but the whole-fiction center of gravity is the
  hunt; era is a 1977-96 DAW run in the modern adventure line on tenant practice (Nightmare Blue 1975, In Fury Born 1992 sit
  here), not the 1980s+ revival letter of the new-space-opera umbrella def. Not pulp-space-chase (pulp-era tenants: 1956/1966);
  not future-history-in-space (episodic quests, not a chronicle of civilization''s course).'

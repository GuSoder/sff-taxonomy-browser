placement_rationale: 'Captain Hûd Ramstan of the living starship al-Buraq, struggling to hold an atheist identity against his religious upbringing, finds a planet''s
  god in his cabin and is drawn into a metaphysical, many-sided battle against a creature destroying intelligent life (inka.de review; SF Crowsnest). Academic reading:
  Farmer reconciles science and religion in a single paradigm. A personal quest for God rather than a factional contest: Theological space opera.'

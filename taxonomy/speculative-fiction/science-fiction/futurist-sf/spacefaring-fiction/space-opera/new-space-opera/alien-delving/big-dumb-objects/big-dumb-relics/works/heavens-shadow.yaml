placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera >
  New space opera > Alien delving > Big dumb objects > Big dumb relics. Per davidsgoyer.com/portfolio-item/heavens-shadow-2/
  and PRH: an immense object sent by a more intelligent race approaches Earth and two crews race to land on it and reach the
  message it carries. The object is the thing to reach and decipher for what it holds, the Big dumb relics definition (the
  object is the puzzle); it is not a place to cross or live in (Big dumb worlds). Moved from Alien expedition on the curator''s
  own steer. Wobble: the crews'' race is a mission, as in Alien expedition.'

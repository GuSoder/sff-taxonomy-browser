placement_rationale: 'L. E. Modesitt''s The Eternity Artifact (2005; Modesitt''s site, Wikipedia): scientists find Danann,
  a sunless planet racing past the edge of the Galaxy, its continents sculpted and a single perfectly preserved megaplex of
  metallic towers along curved canals on it, and an expedition is sent to unravel its secrets before it passes the singularities.
  Walk: Futurist > Spacefaring > Space opera > New space opera > Alien delving > Big dumb objects > Big dumb worlds (an artificial
  world entered and crossed). The site pitches it as in the tradition of Ringworld and Rendezvous with Rama. Sources: Modesitt''s
  site, Wikipedia; not read. Alternative: Big dumb relics.'

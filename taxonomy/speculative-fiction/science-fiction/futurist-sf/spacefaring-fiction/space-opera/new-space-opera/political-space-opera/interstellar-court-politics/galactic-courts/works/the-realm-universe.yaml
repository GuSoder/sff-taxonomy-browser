placement_rationale: 'The Realm Universe (ISFDB series): The Thirteenth Man (2012), A Choice of Treasons (2014), Of Treasons
  Born (2016). An interstellar kingdom where a weak King and nine scheming Dukes of the Ducal Council decide who rules; bastard
  son Charlie Cass takes the cursed mantle of the thirteenth Duke de Lunis as war erupts between the Realm, the Independent
  States and Syndon, and the Treasons Cycle continues the Lunan Empire''s court treasons 300 years on. The throne and its
  ruling circle are the arena throughout: galactic-courts gate exact. Not galactic-houses (a single throne at the center,
  not house networks). Military-SF texture (POW camps, fleets) is the medium, not the spine.'

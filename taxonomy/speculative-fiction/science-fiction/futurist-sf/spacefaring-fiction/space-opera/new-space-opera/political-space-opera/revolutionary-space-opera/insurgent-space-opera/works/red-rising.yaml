canonical_genre: insurgent-space-opera
placement_status: accepted
placement_rationale: 'Whole-fiction placement after the curator''s 2026-11-03 ruling. The saga''s engine is the revolt against
  the Society''s imperial order and the war over what replaces it (SFE on Brown: ''epic action'', Darrow ''working out how
  to bring the downfall of this rigid but precarious world''; the caste order remains the integral object of the war across
  all six published books). With the Space opera umbrella widened to the genre''s recognized scope (SFE: ''interplanetary
  or interstellar conflict''), the walk runs: Science fiction > Futurist SF > Spacefaring fiction > Space opera > New space
  opera > Political space opera > Revolutionary space opera > Insurgent space opera - the curator''s own 2026-10-11 axis:
  the Rising starts inside the empire''s machine (an enslaved labor caste within the Society, the Sons of Ares cells, Darrow
  carved into a false Gold working the regime from within), the Insurgent reading; not Rebel (outside the throne''s reach).
  Red God excluded as forthcoming.'

placement_status: accepted
placement_rationale: 'Modesitt''s Ecolitan Matter (Ecologic Envoy 1986 to Ecolitan Enigma 1997, four novels): Major Jimjoy
  Wright, a secret agent of the corrupt interstellar Empire, overthrows a military dictatorship too well, is marked for death
  by his own superiors, and defects to the Ecolitan Institute of the planet Accord, which then fights the Empire first for
  its independence and then to prevent a worse disaster (Macmillan and lemodesittjr.com blurbs; years per Wikipedia bibliography
  and the author''s site). Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Space opera -> New space opera
  (1980s revival, Envoy is 1986) -> Political space opera -> the engine is liberation from an imperial order, so Revolutionary
  space opera. Tried Breakaway space colonies (a colony against Earth): Accord is an institute-planet inside an interstellar
  empire, not a settlement; and Interstellar court politics: the story is spy and war, not courts. Wobble moderate. Omnibus
  rows Empire & Ecolitan and Ecolitan Prime skipped.'

placement_rationale: 'Modesitt''s The Forever Hero (Dawn for a Distant Earth 1987, The Silent Warrior 1987, In Endless Twilight
  1988; one fiction, the queue holds all three plus the 1999 omnibus): a feral Earth boy raised inside the Empire''s military,
  whose long centuries of covert economic war are aimed at forcing the Empire to regreen Earth, ending with the imperial order
  destroyed (earlier session sourcing: Modesitt''s site, Wikipedia, ISFDB). Walk: Science fiction > Futurist > Spacefaring
  > Space opera > New space opera > Political space opera > Revolutionary space opera > Insurgent space opera (the revolt
  is worked from inside the imperial machine by a man it trained), not Rebel space opera (no outside fleets or cells). Wobble
  moderate: the economic war is slow-burn rather than a rising.'

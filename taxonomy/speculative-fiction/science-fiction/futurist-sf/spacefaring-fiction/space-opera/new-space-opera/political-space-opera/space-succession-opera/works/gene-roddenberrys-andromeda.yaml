placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Space opera > New
  space opera > Political space opera > Space succession opera. Six Tor tie-in novels of the 2000-2005 TV series, one shared
  universe, so one fiction (tie-ins are in scope per the intake README). Every volume''s premise is Captain Dylan Hunt, out
  of time after the Systems Commonwealth collapsed, rebuilding it with a crew of salvagers and misfits; the plots are member
  worlds weighing whether to join the Commonwealth (Paradise Drift, The Attitude of Silence), brokering peace between Nietzscheans
  and the Alliance (The Broken Places), and the fallen order''s fallout (ISFDB series 11760; Publishers Weekly; Open Road
  and publisher blurbs). Space succession opera: succession of orders after imperial collapse. Rejected: Spaceship drama (found
  family is present but the spine is political reconstruction), Revolutionary space opera (no overthrow of an imperial order),
  Space chase (one volume''s side plot only). Wobble: the volumes are episodic crew adventures, so Spaceship drama is the
  close second. Years are the original Tor hardcover years per ISFDB, not the 2007/2010 ebook dates in the queue.'

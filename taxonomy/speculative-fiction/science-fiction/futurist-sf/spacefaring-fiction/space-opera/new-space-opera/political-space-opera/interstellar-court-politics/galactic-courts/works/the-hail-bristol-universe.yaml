placement_rationale: 'Ten-k walk (MC05105-MC05110). Whole fiction: the Hail Bristol Universe (Orbit), ONE series per ISFDB
  (series record 51298) spanning two consecutive trilogies with the same protagonist and universe: The Indranan War - Behind
  the Throne (2016), After the Crown (2016), Beyond the Empire (2017) - and The Farian War - There Before the Chaos (2018),
  Down Among the Dead (2019), Out Past the Stars (2021). Gunrunner Hail Bristol, heir to the Indranan Empire, is dragged home
  to survive assassins and take the throne; the second trilogy takes Empress Hail into diplomacy and war with the Farian power
  (paulsemel interview; Uffe Stegmann series note). Root-down: speculative fiction > science fiction > futurist-sf > spacefaring-fiction
  > space-opera > new-space-opera (post-1980s self-aware opera, ISFDB tags space opera) > political-space-opera (relations
  among interstellar powers - Indrana vs Farian - are the field) > interstellar-court-politics (the arena is courts, heirs,
  envoys) > galactic-courts: the throne and its court are the arena - the usurper plots, the audience chamber and Hail''s
  own rule decide who holds Indrana. Not galactic-houses (one empire''s throne at the center, not feuding houses), not space-combat
  (battles serve the succession struggle), not space-succession-opera (no imperial collapse; the dynasty endures and must
  be held). TENTH card in galactic-courts (9 -> 10): the leaf freezes and a split proposal is served at once.'

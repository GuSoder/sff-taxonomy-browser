first_published: 1992
canonical_genre: post-scarcity-politics
placement_status: accepted
placement_rationale: 'Whole-fiction re-walk 2026-11-03. Books 1-2 (A Million Open Doors, Earth Made of Glass) contain no mind-copying:
  springer-contact culture clash on Wilson, Nansen and Briand (Kirkus; Wikipedia; finfar.org tetralogy study), so the tetralogy
  cannot be governed by Copied minds, and they never touch Earth, straining the Future of Earth ancestor. Whole-fiction
  aboutness: a post-scarcity interstellar civilization - the Council of Humanity - intervenes in isolated cultures: the reunion
  imposed by force if needed (books 1-2), the psypyx exploitation vote (book 3) and invasion-prep unity (book 4) pose
  moral-authority and collective-choice questions under material abundance (robot labor, early retirement, an entertainment
  economy). Root-down: Science fiction > Futurist SF > Spacefaring fiction > Space opera > New space opera > Political space
  opera > Post-scarcity politics. Tenant parallel: Banks''s Culture (Contact-style intervention in other civilizations). Wobble
  (moderate): the register is social-manners SF rather than large-scale adventure opera.'


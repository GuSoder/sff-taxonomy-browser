placement_rationale: 'Sharon Lee and Steve Miller''s Liaden Universe (Agent of Change 1988 onward; Wikipedia, korval.com,
  Baen, Simon & Schuster): space operas with Regency romance and novels of manners across several linked series - Clan Korval
  against the Department of the Interior (Agent of Change: the brainwashed agent Val Con yos''Phelium and the Terran mercenary
  Miri Robertson), the trader Jethri Gobelyn, Theo Waitley''s flight from Safe Delgado, and the Crystal prequels. Clans, delms,
  diplomacy and trade networks are the arena. One card for the whole shared universe (Vorkosigan Saga precedent). Walk: Futurist
  > Spacefaring > Space opera > New space opera > Political space opera > Interstellar court politics > Galactic houses (families
  and clans hold the power); it was the tenth card that forced the 2026-10-12 split, approved by the curator (phonemsg-01M4QFA6PFPJK23XYEV1TGSCV5).
  Skipped as collections: A Liaden Universe, The Tomorrow Log and Dragon Tide. Carousel rows are Sharon Lee''s separate small-town-fae
  series, already placed elsewhere. Sources: Wikipedia, korval.com, Baen, Simon & Schuster; not read.'

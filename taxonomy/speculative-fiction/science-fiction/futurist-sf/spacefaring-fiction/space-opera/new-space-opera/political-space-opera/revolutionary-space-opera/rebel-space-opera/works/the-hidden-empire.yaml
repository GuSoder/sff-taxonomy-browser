placement_rationale: 'Walk: Speculative fiction > Science fiction > Futurist SF > Spacefaring fiction > Space opera > New space opera > Political space opera > Revolutionary space opera > Rebel space opera. The Hidden Empire series (Principles of Angels 2008, Consorts of Heaven 2009, Guardians of Paradise 2010, Bringer of Light 2011, Queen of Nowhere 2013, Gollancz; author''s series page): across a far-future human space of hundreds of semi-autonomous systems, a changing cast of outsiders - a street-hustler, an outcast mother, an amnesiac stranger, a paranoid genius - discovers the more-than-human Sidhe secretly manipulating humanity and pits itself against the Hidden Empire to expose and bring it down. The revolt works from outside the hidden order''s machine: the Rebel reading. Rejected: Insurgent space opera (no one works the Sidhe regime from within), Space hunt (the trail-following is in service of the revolt, not the story''s engine). Wobble: moderate - the first two books are personal-scale and worldbound, and the empire is hidden rather than declared; series about-ness (books 3-5 confront and fight the Sidhe directly) governs. SOFT. Years: 2008-2013 (Gollancz; author page). Queue ids MC04138, MC04139, MC04140, MC04141, MC04142.'

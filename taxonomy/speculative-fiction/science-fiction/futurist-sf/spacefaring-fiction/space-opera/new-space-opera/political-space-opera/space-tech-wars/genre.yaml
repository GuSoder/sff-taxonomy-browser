definition: 'Political space opera whose engine is the contest among rival powers to control a decisive technology or infrastructure:
  a weapon, drive, transit network or cache that each power wants to hold, salvage or build, whether it is their own, bought
  or taken, or left behind by a vanished or transcended civilization. The technology is the prize, not just a tool of the
  war. Not Space succession opera (no empire has fractured), not Big dumb relics (the object is a puzzle to open, with no
  powers contesting it).'

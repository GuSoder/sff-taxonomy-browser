  gates and governing comic mode remain as established in the prior sourced whole-fiction walk. Tom Parent and his
  linguist wife Lucy represent Earth to Galactic Civilization, with Lucy possibly a Wilf. Representation and alien
  etiquette govern the comedy. The split axis is the governing comic engine: military machinery, interspecies representation,
  or mismatched-cast misadventure. Prior rationale and source audit retained below. Source read: https://www.baen.com/the-magnificent-wilf.html.


  Prior whole-fiction grounding: Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction
  > Comic space fiction. Earth is contacted by the Galactic Civilization, and the diplomat Tom Parent and his wife
  Lucy, a linguist, must represent Earth to the galaxy, with one catch: Lucy is, or may be, a Wilf (Goodreads blurb
  of the 1995 first edition, listed with humour and adventure). Contact and diplomacy beyond Earth where comedy
  governs, which is the leaf''s definition. Rejected: Alien arrival and Alien message (at nine, and the story is
  Earth''s place among the galaxy''s civilizations, not an arrival), Space romance. Wobble: moderate; I have only
  the blurb and the Goodreads genres (humor, space). Year is the 1995 first edition (the queue showed 2018).'

id: the-spare-man
title: The Spare Man
authors:
- Mary Robinette Kowal
first_published: 2022
canonical_genre: space-gang-comedy
placement_status: accepted
placement_rationale: 'Root-down split walk 2026-11-05: Speculative fiction > Science fiction > Futurist SF > Spacefaring
  fiction > Comic space future > Space gang comedy. The inherited science-fictional, future and beyond-Earth setting
  gates and governing comic mode remain as established in the prior sourced whole-fiction walk. The honeymoon couple,
  their banter and oddball supporting cast sustain the author-designed Thin Man murder comedy aboard a cruise liner.
  Gang is deliberately broad enough for a couple and their surrounding cast, as disclosed before approval. The split
  axis is the governing comic engine: military machinery, interspecies representation, or mismatched-cast misadventure.
  Prior rationale and source audit retained below. Source read: https://whatever.scalzi.com/2022/10/17/the-big-idea-mary-robinette-kowal-6/.


  Prior whole-fiction grounding: Root-down audit 2026-11-04: Speculative fiction > Science fiction > Futurist SF
  > Spacefaring fiction > Comic space fiction. One standalone2022 novel. On a Luna-Mars honeymoon cruise, Tesla
  and her retired-detective spouse solve murders in a sustained Thin Man murder-comedy frame. The author explicitly
  describes building a playful murder comedy from the six Thin Man films, their banter, oddball characters and inversions;
  Frumious Consortium and File770 confirm that sustained comic reading experience. Space techno fiction fails: technological
  aids and surveillance gadgets serve the puzzle, not interstellar identity transfer, computation or posthuman technology
  as subject. Space PI is the strongest engine alternative but fails its Space colonies ancestor: all action occurs
  on the transient liner, established Luna/Mars settlements remain background. Space station thrillers fails both
  fixed-settlement and threat-rather-than-case gates. Spaceship drama fails its found-family/care engine. Hard SF
  loses rigorous science as core; the futuristic space voyage defeats Modern day, Historical and Future of Earth;
  no time-travel premise found, so Atemporal loses. Alien contact, military campaigns, future history, multigenerational
  societies and dystopian social-order horror do not govern. Wobble substantial: several reviews market primarily
  as a murder mystery, and Mal Warwick finds the attempted humour flat. Success of jokes is contested, not their
  governing murder-comedy frame. No definition change.'

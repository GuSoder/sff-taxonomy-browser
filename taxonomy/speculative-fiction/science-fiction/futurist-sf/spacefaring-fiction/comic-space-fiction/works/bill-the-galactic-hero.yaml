placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Comic space fiction.
  Bill, a farm boy on a backward agricultural planet, is drugged and shanghaied into the Space Troopers, survives boot camp
  under Deathwish Drang and is sent to fight the Chingers, whom Trooper propaganda paints as seven feet tall; the first novel
  is a satire of military science fiction, first published in 1965 after the 1964 Galaxy novella ''The Starsloggers'' (Wikipedia).
  Comedy, parody and satire govern a military adventure beyond Earth, the leaf''s definition. Rejected: Ground-pounders and
  Space command (the military is the target of the satire, not the subject). Wobble: low. Sources: Wikipedia. Year 1965 (queue
  showed the 2012 reissue). Sequels by other hands are not in this queue.'

placement_rationale: 'One fiction (rule 11j): the Imperium (Lord Thomas Kinago) series - View from the Imperium (2011), Fortunes
  of the Imperium (2014), Rhythm of the Imperium (2015); series membership per SFE''s Nye entry (''The View from the Imperium
  sequence... is Military SF, though laced with Humour''), Wikipedia''s Nye bibliography (''Imperium (or Lord Thomas Kinago)''),
  and FictionDB. Queue carried Fortunes and Rhythm (MC04618/19); View was surfaced as the missing first volume under the standing
  completeness rule. Root-down: Science fiction -> Futurist SF -> Spacefaring fiction -> Comic space fiction: ''P. G. Wodehouse
  meets space opera'' (publisher copy) - Ensign Thomas Kinago, an aristocratic fop with a Jeeves-like aide, bumbles through
  an Imperium crisis; comedy governs rather than supplying incidental relief, and the leaf''s accepted definition explicitly
  includes ''comic military adventures... not restricted to space opera''. Rejected: Military science fiction and its Space
  navy branch (the warfare mode is backdrop, not the governing mode - the humor is the engine, per SFE ''laced with Humour''
  understated; reviews and publisher pitch lead with the Wodehouse frame), Humorous science fiction under Modern-day SF (the
  setting is a stable futuristic off-Earth Imperium, which the comic-space-fiction def routes here: ''Stable futuristic off-Earth
  settings meet the Futurist and Spacefaring gates''). Wobble: low. First pubs 2011/2014/2015 (author bibliography, SFE).'

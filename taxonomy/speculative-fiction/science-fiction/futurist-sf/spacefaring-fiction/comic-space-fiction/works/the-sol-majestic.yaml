placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Spacefaring fiction > Comic space fiction.
  Per Publishers Weekly and Kirkus: culinary space opera on Savor Station, where 16-year-old Kenna stumbles into the greatest
  restaurant in the universe and its flamboyant chef Paulius and melodramatic high-stress space kitchen; a coming-of-age told
  as a comic kitchen drama. Rejected: Colony life (a station restaurant, not a settled community), the Space opera adventure
  leaves (no ship, chase or combat). Wobble: this is the weakest fit I placed in this run. PW also calls it a chaotic coming-of-age
  with a philosophical thread, so comedy may not strictly govern; Colony life and Space adventure are the second readings.
  Standalone.'

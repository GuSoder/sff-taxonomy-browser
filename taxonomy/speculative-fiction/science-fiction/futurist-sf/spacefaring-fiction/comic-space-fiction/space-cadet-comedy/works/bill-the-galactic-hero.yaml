placement_status: accepted
placement_rationale: 'Root-down split walk 2026-11-05: Speculative fiction > Science fiction > Futurist SF > Spacefaring
  fiction > Comic space future > Space cadet comedy. The inherited science-fictional, future and beyond-Earth setting
  gates and governing comic mode remain as established in the prior sourced whole-fiction walk. Military service
  and missions supply the recurring satirical framework across all seven authorized novels, including the genre
  parodies. Cadet is an idiomatic military figure, not an academy or youth requirement. Bill, the Galactic Hero
  stays as a whole seven-novel fiction by the explicit curator exception of 4 November 2026, including time travel
  in its sixth novel (phonemsg-01M6KEHW5PZSP7DCECBYK0HFBC). The split axis is the governing comic engine: military
  machinery, interspecies representation, or mismatched-cast misadventure. Prior rationale and source audit retained
  below. Source read: https://www.michaelowencarroll.com/hh/n06-07.htm.


  Prior whole-fiction grounding: Whole-fiction audit2026-11-04: seven authorized novels, including Harrison-outlined
  continuations by other authors. First is military satire; Robot Slaves mocks military missions and genre adventures;
  Bottled Brains sends Bill for a secret weapon among body-hungry brains; Tasteless Pleasure parodies fantasy/Western
  conventions through a false satyr adventure; Zombie Vampires is a prison-ship/alien-war parody; Ten Thousand Bars
  has actual time travel through a sentient portal to undo changed Nazi history; Final Incoherent Adventure satirizes
  a suicidal resource-war mission on Eyerack. Comic military and genre parody governs the whole fiction. The first-novel-only
  card was incomplete; absence of sequels from the queue never justified omitting shared-universe volumes. Root-down:
  SF > Futurist SF > Spacefaring fiction > Comic space fiction under the explicit exception below, not an assertion
  that the Atemporal time-travel gate passes. Other Futurist siblings lose the governing comic mode. No private/official
  case investigation, engineering constraint, alien-cultural study, sustained civilizational future history or colony
  civic-life engine governs. The curator kept the entire seven-novel fiction in Comic space fiction as an explicit
  exception to the any-time-travel rule: "If it’s not until book six I think the time travel browsers will be annoyed
  by five books of his comic stuff" (phonemsg-01M6KEGWWB8QRRQ7H8MJ0GRZJC), then "keep" (phonemsg-01M6KEHW5PZSP7DCECBYK0HFBC,
  2026-11-04 15:14 CET). Proposed Time door widening dropped; no definition changed.'

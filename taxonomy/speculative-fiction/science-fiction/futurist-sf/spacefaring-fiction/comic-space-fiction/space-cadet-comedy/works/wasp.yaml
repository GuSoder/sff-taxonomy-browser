placement_rationale: 'Root-down split walk 2026-11-05: Speculative fiction > Science fiction > Futurist SF > Spacefaring
  fiction > Comic space future > Space cadet comedy. The inherited science-fictional, future and beyond-Earth setting
  gates and governing comic mode remain as established in the prior sourced whole-fiction walk. One covert operative
  makes an enemy wartime bureaucracy panic. Its military satire wins over the solo-versus-ensemble distinction;
  cadet does not mean an academy story. The split axis is the governing comic engine: military machinery, interspecies
  representation, or mismatched-cast misadventure. Prior rationale and source audit retained below. Source read:
  https://reactormag.com/one-man-against-a-whole-planet-eric-frank-russells-wasp/.


  Prior whole-fiction grounding: Root-down: Science fiction > Futurist > Spacefaring fiction > Comic space fiction.
  In a future interplanetary war, Earth sends James Mowry to an enemy Sirian planet to sabotage morale and make
  a whole authoritarian bureaucracy panic. Jo Walton explicitly calls it a comedy about a terrorist; SFE connects
  it to Russell''s SF humour, and the publisher calls the covert war witty. The one-man sabotage and bureaucracy
  satire govern, not infantry ranks, naval bridge, academy or top-command campaigns. The World War Two Japan analogy
  is not a historical Earth setting; alien culture serves the covert-war comedy rather than anthropological contact.
  No time-travel premise or element found in the researched plot. Original1957, expanded1958, one standalone.'

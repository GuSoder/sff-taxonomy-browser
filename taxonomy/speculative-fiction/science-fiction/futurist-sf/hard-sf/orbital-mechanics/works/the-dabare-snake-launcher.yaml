placement_rationale: 'Presby''s stand-alone (Baen 2022): a West African family and international megacorps race to build Earth''s
  first space elevator on Kilimanjaro - carbon-nanofiber tether, a captured anchor rock in orbit, debris-clearing and launch-site
  logistics worked out from the IAA space-elevator literature with the genre''s ''single cheat'' (industrial-length nanofiber)
  (Baen; joellepresby.com; upstream + N3F reviews). Walk: Science fiction > Futurist > Hard SF > Orbital mechanics (stations,
  ships and orbits worked out with real physics - the elevator is orbital engineering: geosynchronous anchor, tether, debris).
  The Moon Is a Harsh Mistress precedent: a politics-heavy plot can ride on worked-out orbital mechanics. Not Future societies
  (the subject is the build; the society maneuvering is its obstacle course), not Techno-fiction (no minds, bodies or networks
  remade). Wobble low-moderate: reviews note more social than technical emphasis, and an ambiguous Mami-Wata mythic thread
  the reader may read as real - sidebar, governing mode stays hard SF.'

  ## Final rival check

  Fantasy fails: cannon, propulsion, gravitation and calculation, not supernatural causation. Historical SF / Proto SF is
  a serious competing top route, not dismissed because of date alone. Its Scientific adventure leaf captures technological
  voyages in the first two books, but the whole remains organized by worked engineering problems, with a mathematical failure
  as the third ending. Lost world fails no surviving isolated civilization/ecology; Fantastic voyage explicitly requires pre-novelistic
  form; Gothic science fiction requires mystery and terror outweighing cognition. Neither applies. Period SF is modern-written
  period fiction; Alternate history needs a historical fork; Hidden history requires extraordinary omitted events, weaker
  than an openly proposed technical future.

  Futurist siblings: Spacefaring fiction is less exact than the engineering-first Hard SF branch; Alien fiction has no alien-civilization
  engine; Future of Earth fiction''s societies/war/transformation paths do not govern the first two. Planetary science / Terraforming
  is the strongest third-volume rival, but an abortive axis-shift for coal access is one sequel''s project, not the whole''s
  planetary-remaking center. Hard conceptual SF is not a revelation about the basic world-model, and Otherworldly hard SF
  has no unanchored cosmos. Matter transmission absent.

  Humorous science fiction is a real rival because the Gun Club''s American militarism and imperial ambition are satirized.
  Satire does not replace the sequence''s sustained launch, trajectory, and recoil problem-solving. Explicit exception not
  needed. Modern day recognizability fails; Atemporal has no time travel, crossworld journey, reincarnation or unanchored
  reality. Failed science and a reader''s disagreement with the calculations do not constitute magical causation.

  The selected leaf is a whole-fiction judgment, not a claim each novel is orbital travel. Third-volume terrestrial axial
  dynamics and all three books'' known scientific errors remain visible caveats. No gate widened, no seed, no genre rename.



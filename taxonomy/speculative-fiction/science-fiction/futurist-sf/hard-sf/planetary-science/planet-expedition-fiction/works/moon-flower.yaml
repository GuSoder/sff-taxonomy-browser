placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Planetary science > Planet expedition fiction. Baen: two development teams have vanished planet-side on the world of Cyrene; a third expedition, run by mercenary facilitator Myles Callen and crew, goes to set things back on track and encounters ''a planet as magnificently strange as the vast alien artifacts of Arthur C. Clarke or Stanislaw Lem''s sentient oceans'', behind which lies an unexpected new physical law; Publishers Weekly on Hogan: ''Readers who like their science hard will find this one a diamond.'' People travel to a world as it is and the planet''s nature is the problem, which is the leaf definition. Rejected: Planet ecology fiction (no invented biosphere worked out as main character; the mystery is a physical law), Terraforming fiction (nothing is remade), exoplanet-expeditions (no extraterrestrial intelligence or society encountered - the Lem comparison is to strangeness, not confirmed contact). Wobble: mild - Cyrene is an exoplanet while the leaf''s examples are solar-system missions, but the definition is written for a world as it is, not for our system. Queue id MC04224.'

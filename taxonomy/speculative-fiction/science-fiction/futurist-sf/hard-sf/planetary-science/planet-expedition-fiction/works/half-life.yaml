placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Planetary science > Planet
  expedition fiction. Near the end of the next century, fast-evolving diseases threaten human survival, and a low-cost expedition
  travels to Saturn''s moon Titan to examine pre-biotic chemistry; of 50 sickly crew members only 21 reach it, with the nonsentient
  computer Status (Kirkus Reviews). A crewed mission to a world as it is, with mission engineering and survival carrying the
  story, the leaf''s definition. Rejected: Medical SF leaves (the disease is the reason for the trip, the book is the Titan
  mission), Planet ecology fiction (the moon is explored, not the subject). Wobble: moderate. Sources: Kirkus Reviews. Year
  1999 (Sept 8).'

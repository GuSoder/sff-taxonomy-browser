placement_rationale: 'Root-down audit 2026-11-04: Speculative fiction > Science fiction > Futurist SF > Hard SF
  > Planetary science > Planet ecology fiction. One Heorot fiction, all three novels: The Legacy of Heorot makes
  the grendels'' predator life cycle the colony''s central mistaken assumption; Beowulf''s Children expands to the
  mainland ecosystem and the second generation''s conflict with the damaged first generation; Starborn & Godsons
  adds a technologically superior human settler faction and contact with tool-using native sentients while Avalon''s
  biology and colonial viability remain the through-line. Niven describes biologist Jack Cohen''s designed mainland
  ecology and its crab-template species; Baen explicitly calls the series hard SF and describes the brutal ecology
  as its governing constraint. Planet ecology, rather than Planet expedition: the invented living system itself
  supplies the recurring revelations, not a mission engineering itinerary on a known world. Rejected: Frontier planets
  under Anthropological SF because cultural encounter does not govern the first two novels; Prehabited world under
  Colony life because ordinary routines are not the engine of these ecological danger/revelation plots. Wobble moderate
  to high: survival and action are substantial, and book three genuinely bends toward native cultural encounter
  and a human colonial takeover. Do not claim the whole fiction has only non-sentient predators. Sources read: Niven
  reminiscence, Baen series press release, Beowulf''s Children review, detailed Starborn & Godsons review; not the
  novels themselves.'

placement_rationale: 'One fiction (rule 11j): the Elysium Chronicles - A Door into Ocean (1986), Daughter of Elysium (1993),
  The Children Star (1998), Brain Plague (2000); SFE Slonczewski entry names the sequence and all four volumes. Root-down:
  Speculative fiction -> Science fiction -> Futurist SF -> Hard SF (Slonczewski is a practicing biologist; the reading experience
  is rigorous biological extrapolation - Sharer lifeshaping, microbial intelligence) -> Planetary science -> Planet ecology
  fiction: invented worlds worked out as planets whose climate and life shape their civilizations, and the world is the main
  character - Shora''s ocean ecology IS A Door into Ocean (the web of life resists the invasion), and Prokaryon''s ecology
  is the hidden master of The Children Star. Rejected: Terraforming fiction (Prokaryon''s terraforming is attempted and refused;
  nothing is remade - the leaf''s own Not line), Planet expedition fiction (no mission or survival problem on a known world),
  Genetic engineering umbrella (wrong era branch - modern-day - and the gene work serves the worlds; ecology is the character).
  Wobble: mild - Daughter of Elysium and Brain Plague lean societal/microbial, but the cycle''s center of gravity is planetary
  ecology. Queue years 2000/1999 are reprints; first pubs 1986/1993/1998/2000 (SFE); Daughter of Elysium and Brain Plague
  surfaced under 11j series autonomy.'

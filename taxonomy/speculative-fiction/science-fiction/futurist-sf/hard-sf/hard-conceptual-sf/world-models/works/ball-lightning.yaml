placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist SF >
  Hard sci-fi > Hard conceptual SF > World models. After a ball lightning strike
  incinerates his parents, Chen devotes his life to cracking the phenomenon; the
  search runs through stormy mountaintops, an experimental military weapons lab and
  an old Soviet science station until the true model of the phenomenon surfaces - a
  quantum picture whose states can be weaponized and whose observer effects raise
  the stakes, with an army major obsessed with the weaponry and a physicist with no
  place for ethical considerations (publisher copy, torpublishinggroup.com). The plot
  is the discovery of the true model - the leaf definition. Rejected: thought-experiments
  (form test: a novel-length research quest, not a controlled single-idea experiment),
  technocrisis (no high-tech system under strain in a fast-moving crisis), future-war
  (the late-war use of the weapon is consequence, not engine). Wobble: moderate; the
  setting is the contemporary real world, so physics is extended rather than rewritten,
  and the weaponization thread runs alongside the discovery. First published in
  Chinese 2004 (written 2001, zh.wikipedia); English translation by Joel Martinsen,
  Tor 2018.'

placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Hard conceptual SF > World
  models. The Orthogonal trilogy is set in a universe whose geometry has no distinction between space and time (the metric
  is Riemannian, not Lorentzian), and the plot follows the physicist Yalda and her people as they work out the true model
  of their physics and use it to build a ship that can save their world (Egan''s site gregegan.net/ORTHOGONAL; the Clockwork
  Rocket, Eternal Flame and Arrows of Time are books one to three). Rewritten physical laws and the plot as the discovery
  of the true model is the leaf''s definition. Rejected: Otherworldly hard SF (that leaf is about a wholly other cosmos as
  setting, here the physics is the plot), Thought experiments. Wobble: light; I know the trilogy but the sources I read for
  this walk were the author''s site and Open Library records. One universe, one fiction (rule 11j).'

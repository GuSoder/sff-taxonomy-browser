placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Hard conceptual SF > World
  models. Twenty thousand years ahead the physicist Cass runs experiments on the Sarumpaet rules of Quantum Graph Theory and
  creates ''novo-vacuum'', a bubble of something more stable than ordinary vacuum that expands at half light speed; six hundred
  years later refugees and researchers probe it and find a whole ordered universe inside, where particles and spacetime are
  special cases of the quantum graph''s lattice (Wikipedia plot summary; gregegan.net/SCHILD). The physical laws are rewritten
  and the plot is finding the true model, which is the leaf''s definition. Rejected: Otherworldly hard SF. Wobble: light.'

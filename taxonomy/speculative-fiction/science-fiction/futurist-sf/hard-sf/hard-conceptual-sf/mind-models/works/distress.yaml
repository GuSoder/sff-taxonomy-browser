placement_rationale: 'Root-down: Speculative fiction > Science fiction > Futurist > Hard sci-fi > Hard conceptual SF > Mind
  models. Mid twenty-first century, on the artificial island of Stateless, the journalist Andrew Worth covers a physics conference
  where Violet Mosala will present a Theory of Everything; an anthrocosmologist faction believes the universe was created
  by the one person who completes a TOE (the ''Keystone'') and an epidemic mental illness, Distress, is bound up with the
  discovery (Wikipedia plot summary). Consciousness-made reality and an idea that cannot be safely held is the leaf''s definition.
  Rejected: World models (the physics is the occasion, the cognitive model of Distress is the point), Technothriller. Wobble:
  strong; it is as much a conference thriller on a biotech island, and my source is the Wikipedia summary. First published
  1995.'

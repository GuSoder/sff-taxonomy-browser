placement_rationale: >-
  SFE and PRH frame a high-tech eco-community isolated by Mount Rainier's eruption and hunted by a savagely predatory Sasquatch species. The recovered-journal investigation treats Bigfoot as a biological possibility, but siege terror and the monstrous outweigh cognition, matching the site's Gothic science fiction rule.

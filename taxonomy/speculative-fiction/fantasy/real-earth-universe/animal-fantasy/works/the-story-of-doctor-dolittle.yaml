placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Animal fantasy. The official Simon & Schuster complete collection establishes the thirteen-text Doctor Dolittle sequence. PRH centers Dolittle learning animals’ languages and understanding them as persons; animal speech, agency, friendship and cross-species society govern throughout.'

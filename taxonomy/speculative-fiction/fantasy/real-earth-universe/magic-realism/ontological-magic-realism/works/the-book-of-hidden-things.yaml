first_published: 2018
canonical_genre: ontological-magic-realism
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Magic realism -> Ontological magic realism. PRH grounds contemporary Puglia, friendship, Mafia crime and investigation alongside miraculous healing, an arcane manuscript and a hidden realm; PW calls it a liminal space beyond human perception. Dimitri says he used his own world with magic as a base note, turning reality up only slightly. The novel deliberately keeps supernatural reality and delusion in unresolved competition, so ontological instability governs over general contemporary fantasy or horror.'

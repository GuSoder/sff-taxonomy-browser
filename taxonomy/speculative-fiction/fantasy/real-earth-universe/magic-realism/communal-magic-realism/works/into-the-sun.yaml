first_published: 1937
canonical_genre: communal-magic-realism
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Magic
  realism -> Communal magic realism. An alpine village on a frozen slope falls under a charlatan''s prophecy,
  drawn from an old book, that the sun will never return: ''la conception mythique d''un phenomene naturel
  (le soleil qui disparait, la terre qui perd toute couleur, le gel qui s''accentue avec sa menace de
  mort)'', and the novel''s power is the village''s collective reaction (devoir-de-philosophie resume;
  New Directions 2025 Baes/Ramadan translation). The marvelous belongs to the community - the leaf''s
  exact brief; shelf-mates One Hundred Years of Solitude, Dazzling.'

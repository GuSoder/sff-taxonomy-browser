placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Magic realism -> Communal magic realism. Okri, PRH and Booker ground Azaro as a Yoruba abiku spirit-child moving between spirit and living worlds in independence-era Nigeria, where family, neighborhood and political struggle accept spirits as part of shared reality. The community’s marvelous world governs.'

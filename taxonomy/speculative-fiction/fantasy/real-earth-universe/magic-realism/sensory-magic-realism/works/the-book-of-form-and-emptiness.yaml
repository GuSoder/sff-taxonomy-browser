title: The Book of Form and Emptiness
authors: [Ruth Ozeki]
first_published: 2021
canonical_genre: sensory-magic-realism
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Magic realism -> Sensory magic realism. PRH and Ozeki ground a recognizable contemporary life of grief, hoarding, school and library in Benny’s impossible hearing of the emotional voices of manufactured objects, including the Book that narrates his life. The marvelous remains interwoven with mental-health ambiguity, while an impossible sense reveals hidden knowledge; sensory magic realism is the governing mechanism.'

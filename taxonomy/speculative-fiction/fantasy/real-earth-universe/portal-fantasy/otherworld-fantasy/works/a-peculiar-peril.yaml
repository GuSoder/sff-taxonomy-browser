placement_rationale: Macmillan calls it a portal fantasy spanning surreal, through-the-looking-glass alternate-history worlds; its three doors lead from an inherited English mansion to Aurora, where magic abounds and history has been rewritten. The uncanny multi-reality rupture is the entry mechanism, so Eldrich rifts is closer than the historical setting inside the destination world.

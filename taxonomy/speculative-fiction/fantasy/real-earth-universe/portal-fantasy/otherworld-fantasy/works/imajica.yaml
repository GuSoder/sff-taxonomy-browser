placement_note: Barker describes Earth as one of five Dominions, cut off from its
  magical siblings, while Harper calls the novel a voyage to worlds beyond ours through
  mythic horror, ghosts, the human and the divine. Passage from Earth into the hidden
  Dominions occurs through uncanny ruptures, making Eldritch Rifts closest.

placement_rationale: >-
  The narrator begins on Victorian Earth, descends through a mine and cavern, and discovers one concealed subterranean Vril-ya world. Gustav ruled Vril is magic on 2026-09-21 because no real-world scientists ever studied it. One hidden magical world behind ours makes Otherworld fantasy exact.

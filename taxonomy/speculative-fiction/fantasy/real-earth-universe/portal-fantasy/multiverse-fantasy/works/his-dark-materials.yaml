placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Portal fantasy -> Eldrich rifts -> Multiverse fantasy. SFE describes the two conjoined trilogies as one alternate-cosmos sequence: openings between parallel worlds and Dust structure His Dark Materials, while The Book of Dust narratively surrounds it and returns to Lyra, daemons, Dust and the same universe. Candidate 680 The Secret Commonwealth is therefore deduped into this complete six-novel shared-world card.'

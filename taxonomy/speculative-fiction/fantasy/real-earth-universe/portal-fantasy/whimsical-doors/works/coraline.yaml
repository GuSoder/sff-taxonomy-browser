first_published: 2002
canonical_genre: whimsical-doors
placement_status: accepted
placement_rationale: >-
  Gaiman and HarperCollins center the bricked-up door through which Coraline enters another house resembling her own, then must escape the other mother and return to ordinary life. SFE calls it a young-adult horror novella. The enchanted household threshold and contrasting other home organize the story, making Whimsical doors the closest portal-fantasy leaf; its horror governs the destination rather than the crossing.

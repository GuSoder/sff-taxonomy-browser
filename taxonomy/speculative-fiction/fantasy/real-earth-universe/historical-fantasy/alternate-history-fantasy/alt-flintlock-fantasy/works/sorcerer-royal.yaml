placement_rationale: 'Root-down: SFE explicitly identifies an Alternate History Regency Britain where magic is openly practiced and England trades with Fairyland;
  PRH/Pan Macmillan center its Sorcerer Royal, magical institutions, declining magic, Faerie politics and a contender for Fairy''s throne. This passes Fantasy ->
  Real Earth Universe -> Historical fantasy -> Alternate-history fantasy. Open, world-structuring magic fails Secret history, while the divergent public magical order
  is more governing than Regency atmosphere alone.'

first_published: 1999
canonical_genre: gaslight-fantasy
placement_status: accepted
placement_rationale: >-
  Root-down: Hachette explicitly sets the tale at the dawn of the Victorian era in the English village of Wall, from which Tristran crosses into Faerie to retrieve a fallen star. It passes Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy; the documented gaslit-era frame and adjoining Faerie make Gaslight fantasy the closest existing leaf. It is not a revision of one named inherited fairy tale.

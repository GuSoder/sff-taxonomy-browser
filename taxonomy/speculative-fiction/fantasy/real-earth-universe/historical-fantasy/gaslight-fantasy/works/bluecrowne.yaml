placement_rationale: Kate Milford's official synopsis places Lucy Bluecrowne in the magical Greenglass House world, mixing smugglers, magic and pyrotechnics, while her own introduction fixes the action in 1810 during the Napoleonic wars. Kirkus identifies a time-traveling kidnapper and magical fireworks. Actual magic and time travel operating inside an early-nineteenth-century historical frame make Gaslight fantasy the closest existing leaf.

placement_rationale: >-
  Root-down: Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy. Penguin places a supernatural haunting aboard Titanic in 1912 and Britannic during World War I, combining Faustian pacts, occult rites, sirens and selkies with the documented historical disasters. The Edwardian/Great War shipboard setting governs the haunting, making the Industrial-age period leaf exact rather than contemporary Modern Goth.

id: viking-fantasy-era-cards
title: Viking fantasy era cards
authors: [Guy Gavriel Kay, Genevieve Gornichec, Poul Anderson]
canonical_genre: viking-fantasy
placement_status: accepted
included_titles: [The Last Light of the Sun, The Weaver and the Witch Queen, The Broken Sword]
placement_rationale: >-
  The Last Light of the Sun evokes Norse, Anglo-Saxon and Celtic cultures around a thousand years ago; The Weaver and the Witch Queen is explicitly a tenth-century Norway Viking Age historical fantasy; The Broken Sword is set in the Viking Age. All three fit the era-anchored Viking fantasy leaf, though they also draw on Norse myth.

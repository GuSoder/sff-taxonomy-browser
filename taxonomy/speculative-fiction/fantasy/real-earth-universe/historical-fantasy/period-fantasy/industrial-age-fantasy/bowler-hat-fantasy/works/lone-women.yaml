placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical
  fantasy -> Period fantasy -> Industrial age fantasy -> Bowler Hat fantasy. In 1915, Adelaide Henry flees
  her family''s California farm with a trunk holding Elizabeth, her monstrous twin, then takes a Montana
  land claim. The early-twentieth-century American setting and documented last-settlement wave organize
  the novel; its real monster and ghosts are the fantasy intrusion, with horror as style rather than a
  cursed-place engine. The curator chose this 1900-1929, region-agnostic leaf on 2026-09-29.'

placement_rationale: 'Root-down: Pan Macmillan sets the novel in magical ancient Britain after Roman withdrawal, among warring tribes, bards, land magic
  and Myrdhin. It passes Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Celtic fantasy. Although it reimagines The Twa Sisters
  ballad, the documented post-Roman British era and Celtic-British magical culture supply the stage, while the ballad supplies the plot.'

placement_rationale: >-
  Root-down: Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Antique times fantasy -> Renaissance fantasy. SFE calls it outright fantasy and grounds Merlin, a reborn Fisher King and Arthur's avatar defending sixteenth-century Vienna; Penguin places Duffy amid the historical Ottoman siege, ifrits, dwarfs, Vikings and ancient supernatural forces. The documented 1529 Renaissance setting governs its mythic secret history.

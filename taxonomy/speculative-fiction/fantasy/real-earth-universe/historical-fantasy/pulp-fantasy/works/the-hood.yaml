first_published: 2021
canonical_genre: pulp-fantasy
placement_status: accepted
placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. Tidhar grounds Norman England in 1145, then remixes Robin Hood with resurrection from body parts, a monster-killing bone harpist and fae conversion. The author calls it playful, subversive, profane and ambitious; the savage knockabout remix of English legend matches the existing Pulp fantasy gate rather than the serious Mythic retelling branch.'

placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. SFE calls the Albion Triptych half satire and half mythopoesis; Valancourt describes its hilarious, horrific, bawdy and bizarre picaresque. Gustav’s 2026-09-20 seriousness gate routes unserious/knockabout treatments of mythic national history to Pulp fantasy rather than Mythic retelling.'

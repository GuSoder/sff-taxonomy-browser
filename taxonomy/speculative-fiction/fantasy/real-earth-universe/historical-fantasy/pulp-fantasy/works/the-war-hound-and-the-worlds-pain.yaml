first_published: 1981
canonical_genre: pulp-fantasy
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. Kirkus describes a colorful, amusing reworking of romanticized-medieval motifs: a Thirty Years War veteran enters an enchanted fortress, encounters Lucifer, and undertakes a Grail quest through cinematic knightly adventures. Its fast supernatural-religious adventure uses the historical stage in precisely the taxonomy’s pulp-fantasy sense.'

placement_rationale: >-
  Root-down follows Gustav's 2026-09-20 mythic-seriousness ruling: SFE identifies a screwball, pulp-fantasy Arabian Nights environment, while the publisher calls it an Arabian-mythology/genie parallel universe and presents the two linked tales together. The knockabout appropriation of inherited Arabian Nights material makes Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy governing; the dream/parallel-world passage is its device, not a reason to override the pulp-mythic gate.

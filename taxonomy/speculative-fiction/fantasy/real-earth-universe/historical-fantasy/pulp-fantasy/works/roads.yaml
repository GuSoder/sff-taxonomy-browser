placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. Quinn turns Christian legend into a Weird Tales Viking-gladiator Santa origin: religious/mythic material is used as knockabout pulp adventure rather than serious mythic retelling. Gustav’s 2026-09-20 gate routes unserious pulp retellings here, not to Mythic retelling.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Secret history. PRH and Coates center Hiram’s real magical gift, Conduction: memory and water transport enslaved people across great distances. The power works covertly inside antebellum Virginia and the historical Underground Railroad, with Harriet Tubman and other recorded figures; hidden magic supplies a secret mechanism of liberation behind documented history.'

placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Urban fantasy -> Fae founders. PRH calls it a dark fairy tale of New York full of magic, myth and loss; Time and USA Today ground witches, trolls and the old changeling myth remade through contemporary parenthood, race and internet life. Ancient Faerie child-substitution and troll folklore surviving within modern New York govern over generic horror or a revision of one named inherited tale.'

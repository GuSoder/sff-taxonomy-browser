placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Urban fantasy -> Paranormal Bricks. SFE calls it an epic
  Urban Fantasy set in an imaginary New York that tries to be a fantastic history of the City through the whole twentieth century, celebrating the forces
  that gave birth to it and heading toward an ambiguously redemptive apocalypse in 2000. The city itself is the fantastical subject.'

id: pet
title: Pet
authors:
- Akwaeke Emezi
first_published: 2019
canonical_genre: suburban-gothic
placement_status: accepted
placement_rationale: >-
  Lucille is a utopian town whose children are taught that angels destroyed all
  monsters; the creature Pet steps out of a painting to hunt a monster - an abuser
  hidden inside an ordinary family the community refuses to see (PW, NYT). The ordinary
  community itself is the source of hidden persecution and uncanny menace: the
  suburban-gothic thesis. Runner-up was contemporary-fantasy, which sits at 9 works and
  would have forced a partition proposal. Shelfmates: Fear, Good Neighbors. National
  Book Award finalist; Stonewall Book Award winner. Locus recommended reading 2019.

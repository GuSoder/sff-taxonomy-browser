id: empire-of-wild
title: Empire of Wild
authors:
- Cherie Dimaline
first_published: 2019
canonical_genre: postcolonial-gothic
placement_status: accepted
placement_rationale: SFE calls it a werewolf tale in which a Métis man is transformed into a white Christian preacher and his wife must bring him back to the real world to save her people. Its contemporary social world is haunted by predatory religious and colonial occult power, making Modern Gothic more specific than general paranormal fantasy.

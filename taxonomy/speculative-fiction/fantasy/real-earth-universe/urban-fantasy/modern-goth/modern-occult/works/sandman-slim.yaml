placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Urban fantasy -> Modern Goth -> Modern Occult. SFE places the sequence in monster-irradiated modern Los Angeles with horror, Hell and occult violence; Publishers Weekly centers a returned Hell hitman pursuing a black magician through magic-riddled LA. Modern Occult wins because occult systems and actors operate through the contemporary city; Occult police fails because Stark is a vigilante, not law enforcement.'

placement_rationale: A living Gothic house in a dying Kentucky coal town holds back the beasts beneath it, and the woman drawn to it becomes bound to the place (NPR,
  Locus, Kirkus). The house is the engine, so place-anchored haunted-house fiction fits, although its horrors are Underland beasts more than ghosts. Placed after
  Gustav unfroze Supernatural fantasy (22:41).

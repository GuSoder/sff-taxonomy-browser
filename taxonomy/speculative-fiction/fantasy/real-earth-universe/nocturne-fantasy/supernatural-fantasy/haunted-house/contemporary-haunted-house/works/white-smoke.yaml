placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Ghost stories
  -> Haunted House -> Contemporary haunted house. Kirkus frames a family trying to survive a haunted house, with a forbidden basement and genuinely creepy
  haunts; Locus says it follows haunted-house rules while the real villain is the racist system behind the being haunting the house. The haunting is anchored
  to the house, which is the engine. Contemporary era (2021), after the leaf''s Bag of Bones (1998) start.'

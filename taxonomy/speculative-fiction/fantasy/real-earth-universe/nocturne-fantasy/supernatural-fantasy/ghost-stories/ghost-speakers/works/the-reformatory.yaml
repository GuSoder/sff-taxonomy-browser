placement_rationale: In 1950 Jim Crow Florida, twelve-year-old Robbie Stephens is sent to the Gracetown School for Boys, where his gift for seeing and talking with
  'haints' - the ghosts of boys who died there - makes him the warden's tool and the dead boys' witness (NYT, NPR, Kirkus, Observer). The living boy who speaks with
  the dead is the engine. Placed after Gustav unfroze Supernatural fantasy (22:41).

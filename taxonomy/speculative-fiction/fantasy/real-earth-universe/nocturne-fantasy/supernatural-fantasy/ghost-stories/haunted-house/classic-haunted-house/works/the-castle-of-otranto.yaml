placement_rationale: "Root-down: Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Ghost stories -> Haunted House. SFE identifies\
  \ it as the work that introduced \u201CGothic\u201D fiction; PRH calls it the founding Gothic novel and grounds terrifying supernatural omens, an ancestral\
  \ usurpation curse and the threatened dynasty inside Otranto. The castle and its place-bound family haunting are the engine, making Haunted House deepest."

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Ghost stories -> Revenants. PRH follows recently dead Beth Teller, visible and audible to her grieving detective father, staying to solve a suspicious-fire mystery and reconnect him to the living; a specific dead daughter purposefully bound by love and grief makes Revenants exact.'

first_published: 1975
canonical_genre: revenants
placement_status: accepted
placement_rationale: 'Wikipedia classifies Peace as a psychological fantasy / ghost story; the publisher copy calls it "an extraordinary combination of
  the mythic vision of fantasy and the thrilling, disquieting suspense of a mastercrafted ghost story." Alden Dennis Weer, an embittered old man, relives
  and reshapes memories that haunt his house like a memory palace - the dead (critics read Weer himself as dead) return into a place and a mind, which is
  the leaf definition. Pringle 100 Best Fantasy Novels; ISFDB tags fantasy/horror. Shelfmates: Melmoth, Cold Heaven.'

placement_rationale: >-
  Root-down: the novel's deep supernatural bond lets July read September's thoughts, and the dead sister remains as a purposeful presence bound through grief, guilt, memory and inseparable love. That passes Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Ghost stories -> Revenants. Its haunted-house Gothic atmosphere is the form; the specific dead sister's continued relationship with the living is the engine.

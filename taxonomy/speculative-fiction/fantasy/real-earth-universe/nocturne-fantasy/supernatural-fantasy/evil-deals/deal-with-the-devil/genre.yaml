definition: 'Evil deals in which the counterparty is the Devil himself or his demons: a soul signed away
  for power, knowledge, freedom or fame - the established idiom and trope. The signature may be literal
  (Ambrosio''s contract), negotiated (Melmoth), routed through a devil''s servant (Vathek''s Giaour of
  Eblis), a folklore demon (Damned If You Do) or signed by proxy (We Sold Our Souls). Sibling line: Wicked
  wishes holds every other power that answers - a god, the sea, a carnival, a painting, a box. Split 2026-09-28
  from Evil deals on the counterparty axis (the curator ruling phonemsg-01M3KFHJ54DC0JWEX3KA03GG04).'

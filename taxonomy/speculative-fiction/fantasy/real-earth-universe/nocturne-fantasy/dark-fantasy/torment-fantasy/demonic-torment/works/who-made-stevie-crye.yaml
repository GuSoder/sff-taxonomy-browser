placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Ancient Tormentors
  -> Demonic horror. A newly widowed Georgia freelance writer''s typewriter is demonically possessed and drags her into occult events, typing on its own
  and transcribing her dreams (Wikipedia; Bookmonkey review). SFE calls it a horror novel with laughs and elements of Recursion; the parody of 1980s horror
  and the metafiction ride on the demonic torment, which drives the story.'

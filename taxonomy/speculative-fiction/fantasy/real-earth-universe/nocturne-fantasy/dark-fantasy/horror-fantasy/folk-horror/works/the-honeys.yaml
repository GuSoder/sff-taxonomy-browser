placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Nocturne fantasy -> Dark fantasy -> Horror fantasy -> Folk horror. A remote Catskills summer camp
  hides a generational cult exploiting the hive and its young vessels; community rites and ritual succession govern the menace rather than cursed ground alone. Booklist
  explicitly calls its mode folk horror; the author confirms a supernatural call. Detailed spoiler podcast with direct quotations describes healing honey, memory
  erasure and the adult Honey Confederacy using hive prophecy. Curator original iMessage 2026-09-30 10:50:43: "Execute Honeys to folk horror, next?"'

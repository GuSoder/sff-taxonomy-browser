placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Dark fantasy -> Horror fantasy -> Unholy ground
  horror. Intake #893, held at the Dark fantasy freeze and released 2026-09-23 per Gustav''s Nocturne ruling. Tor calls it dark, scary Southern Gothic:

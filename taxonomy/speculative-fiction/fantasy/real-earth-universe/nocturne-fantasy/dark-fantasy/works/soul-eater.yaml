id: soul-eater
title: Soul Eater
authors:
- K. W. Jeter
first_published: 1983
canonical_genre: dark-fantasy
placement_status: accepted
placement_rationale: >-
  Root-down: SFE calls the novel an accomplished work without SF consolations; the grounded synopsis centers a comatose mother using occult soul-transfer to possess her daughter and destroy her former husband. This passes Fantasy -> Real Earth Universe -> Nocturne fantasy. The human occult predator is neither a demon nor an ancient tormentor, and the grim possession/family nightmare makes Dark fantasy the closest existing pure leaf.

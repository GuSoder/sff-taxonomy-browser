placement_rationale: >-
  Root-down: the author explicitly calls it genre-blending dark fantasy in an alternate Cape Town: twin brothers are branded by socially assigned virtues and vices and battle literal demons amid oppression. Publishers Weekly confirms violent mystical forces, twisted prophecy and cataclysmic change. It passes Fantasy -> Real Earth Universe -> Nocturne fantasy; demonic possession and moral horror make Dark fantasy closest.

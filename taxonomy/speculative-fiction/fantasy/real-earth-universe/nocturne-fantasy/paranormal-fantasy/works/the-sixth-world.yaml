canonical_genre: paranormal-fantasy
placement_status: accepted
placement_rationale: >-
  Root-down: SFE grounds a climate-drowned near-future America where Dinétah is haunted by literal monsters; Simon & Schuster adds clan powers, Navajo-legend figures and newborn gods. Gustav's actual-magic boundary sends the sequence to Fantasy despite its ruined-world setting. It passes Real Earth Universe -> Nocturne fantasy; a living society of monsters, gods and powered humans makes Paranormal fantasy closer than Dark fantasy or one horror-specific supernatural child.

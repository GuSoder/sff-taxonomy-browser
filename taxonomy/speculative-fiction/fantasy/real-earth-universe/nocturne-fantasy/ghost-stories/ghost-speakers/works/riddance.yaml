placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Nocturne fantasy -> Ghost stories -> Ghost Speakers. Catapult centers the 1890 Sybil Joines Vocational School for Ghost Speakers, where children whose stutters channel ghost voices are trained; the headmistress visits the land of the dead. Communication through living mediums is the engine, not a haunted place, lesson-giving dead companion or purposeful revenant.'

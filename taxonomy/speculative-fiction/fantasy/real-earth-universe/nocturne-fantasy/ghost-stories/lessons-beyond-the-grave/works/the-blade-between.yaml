placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Nocturne fantasy -> Ghost stories -> Lessons beyond the grave. Harper and Miller ground contemporary Hudson in enraged whale and human ghosts who manipulate a returning son into confronting gentrification, buried violence, his own demons and his bond to the town. The cross-death relationship carries the warning/lesson; no single building anchors the haunting.'

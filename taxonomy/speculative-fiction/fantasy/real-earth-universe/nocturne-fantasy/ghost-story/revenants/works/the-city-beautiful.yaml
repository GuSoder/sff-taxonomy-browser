id: the-city-beautiful
title: The City Beautiful
authors:
- Aden Polydoros
first_published: 2021
canonical_genre: revenants
placement_status: accepted
placement_rationale: >-
  Root-down: actual dybbuk possession passes Fantasy -> Real Earth Universe -> Nocturne fantasy -> Ghost story. Yakov, Alter's murdered friend, returns as a purposeful presence bound to Alter through grief, love and a consuming need for revenge, and remains until they expose the killer. That makes Revenants more exact than the 1893 historical frame or a general murder-mystery shelf.

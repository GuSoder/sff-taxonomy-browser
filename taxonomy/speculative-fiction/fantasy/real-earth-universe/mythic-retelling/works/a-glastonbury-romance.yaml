placement_rationale: SFE says the novel conflates the lives of Joseph of Arimathea and its contemporary protagonist while evoking the Holy Grail; Penguin describes twentieth-century Glastonbury under older forces, interweaving modern life with Grail legend. Under the anchor rule, its source is the inherited Grail story rather than a documented era, making Mythic retelling closest.

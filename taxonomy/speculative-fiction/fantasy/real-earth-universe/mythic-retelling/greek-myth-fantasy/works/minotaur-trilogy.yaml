placement_rationale: SFE places Swann's three-book Minotaur sequence in Mycenaean Crete, where dryads, centaurs, minotaurs and other legendary peoples confront
  ascendant humanity. Day of the Minotaur retells the Minotaur from Eunostos's perspective and turns the monster into the defender of the mythic old world,
  matching Mythic retelling's explicit mythic-age rule.

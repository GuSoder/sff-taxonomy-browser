placement_rationale: 'Complete two-book Sixth World sequence. Simon & Schuster sets it in Dinetah after climate catastrophe, where Dine gods, heroes and monsters
  walk again: monster hunter Maggie Hoskie, the immortal Neizghani (Monster Slayer), Coyote and clan powers drive both books. Named figures and cosmology from Navajo
  (Dine) mythology govern the story, which is this leaf''s test; the future setting doesn''t change that. Sibling card to Race to the Sun.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Supernatural dark -> Supernatural -> Ancient
  Tormentors -> Elder gods. Hodge grounds ravenous entities outside time, their human worshippers and sacrifices, possession and recurrent souls;
  Locus calls the novel cosmic and intimate horror. Actual occult agency, not scientific explanation, governs the modern-Earth cosmic events,
  and the worshipped entities intruding into human lives make Elder gods exact.'

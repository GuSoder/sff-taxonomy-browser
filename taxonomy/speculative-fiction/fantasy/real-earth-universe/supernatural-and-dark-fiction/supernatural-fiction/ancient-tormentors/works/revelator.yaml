placement_rationale: 'Root-down traversal: Speculative fiction -> Fantasy because the Ghostdaddy and Sunny have actual supernatural power; -> Real Earth Universe because the setting is recognizable 1930s Tennessee; -> Supernatural dark -> Supernatural because an occult god intrudes into family life. Penguin Random House and Gregory center the family’s ancient cavern entity, secret religion and destructive generational faith, making Ancient Tormentors the deepest existing leaf. Period fantasy is rejected because the historical era is not the taxonomic engine; Southern Gothic supernatural horror is.'

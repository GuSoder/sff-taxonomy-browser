placement_note: Publishers Weekly follows a traumatized Vietnam veteran back into
  the Laotian jungle through visions of Black Shuck and a rising supernatural river;
  the author calls it a Vietnam-era cosmic-horror novel. Historical war trauma becoming
  an inescapable supernatural nightmare makes Dark fantasy closest.

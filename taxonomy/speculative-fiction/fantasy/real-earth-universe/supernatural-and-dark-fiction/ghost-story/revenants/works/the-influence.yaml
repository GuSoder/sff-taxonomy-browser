placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Revenants.
  The publisher centers dead matriarch Queenie’s ghostly influence and attempted possession of Rowan; Kirkus explicitly calls it a ghost story about a girl
  haunted by her dead grandmother. A specific dead relative returns purposefully, bound to the living through family control.'

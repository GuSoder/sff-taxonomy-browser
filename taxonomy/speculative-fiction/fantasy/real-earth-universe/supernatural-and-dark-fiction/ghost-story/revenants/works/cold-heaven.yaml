placement_rationale: >-
  SFE links Cold Heaven to Moore's preoccupation with the dead and describes a dead husband haunting his widow and challenging her faith. Penguin Random House begins with the husband's apparent death and missing corpse, then identifies the mystery's bizarre and supernatural elements. The returned dead husband is the central presence, making Ghost story the direct fit.

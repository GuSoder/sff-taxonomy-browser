placement_status: accepted
placement_rationale: Supernatural revenant love story - after Hugh drowns off Jersey, Anna's obsessive love calls him back reanimated but deteriorating. The actual return of the dead passes Gustav's speculative-event boundary; the dead returning to a lover is the central presence, so Ghost story (cf. Cold Heaven, another corporeal-revenant love story) is closest. Vetoable.

placement_note: 'Two girls in love and a fog of wasps cursed the place forever after': deaths at the Brookhants School for Girls from 1902 onward, with a present-day film shoot at the school spooked by the same curse; the haunting is anchored to the place and the building is the engine. Gothic horror per the Guardian. Shelfmates The Haunting of Hill House and The Shining.'

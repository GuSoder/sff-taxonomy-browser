placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Haunted house. Scholastic calls it a haunted-house story with a killer ghost, and its cited reviews say the ramshackle New Orleans house is as much a character as the people, with the haunting and the building’s violent past driving the mystery. The place-anchored haunting therefore governs over a general ghost shelf.'

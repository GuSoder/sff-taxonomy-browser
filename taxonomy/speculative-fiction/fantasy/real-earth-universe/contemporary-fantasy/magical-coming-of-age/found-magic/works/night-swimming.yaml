placement_rationale: 'Root-down: Fantasy > Real Earth Universe > Contemporary fantasy > Magical coming-of-age > Found magic. In 1994, high-school graduates stumble
  upon a natural pool that holds them in an endless night: stars vanish, food is inexhaustible, they cannot simply leave, and each eventually finds a way out. They
  live with and learn the effects of the found enchantment while facing adulthood; the magical place rather than an innate ability is the leaf''s stretch, expressly
  chosen by the curator over creating a new leaf (original iMessage, 2026-09-29: ''It''s too close for me to make up a new leaf, put it in found magic''). Locus establishes
  that this extended impossible condition drives the second half, not a passing twist. No scientific mechanism, time travel, or confirmed fairies.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Magical coming-of-age. Macmillan centers two present-day teens healing after assault through Ciela’s inherited gift for enchanted pan dulce, impossible mirrored glass and Lock’s otherworldly trees. Their developing magic and relationship shape identity, recovery and the passage toward adult self-possession.'

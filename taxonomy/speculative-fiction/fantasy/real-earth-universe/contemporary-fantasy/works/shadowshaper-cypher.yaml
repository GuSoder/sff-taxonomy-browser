placement_rationale: >-
  Scholastic describes a present-day Brooklyn series whose ancestral spirits inhabit paintings, music and stories, then expands into a war among magical houses and a deal with Death. It passes Fantasy -> Real Earth Universe -> Contemporary fantasy. Urban fantasy is tempting, but none of its pure children fits: the spirits are ancestral rather than fae, publicly absorbed, city-as-being or police-centered, and the magic is not primarily Gothic haunting.

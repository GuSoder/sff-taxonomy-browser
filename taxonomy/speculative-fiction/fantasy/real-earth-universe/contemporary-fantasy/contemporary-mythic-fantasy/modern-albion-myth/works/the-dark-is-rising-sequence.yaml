placement_rationale: 'Root-down: Fantasy -> Real Earth Universe -> Contemporary fantasy -> Contemporary mythic fantasy. SFE calls the five-book sequence a mythological
  fantasy epic set in the modern world, with contemporary child Will Stanton as vessel of the ancient Old Ones and Anglo-Saxon, Celtic and Matter of Britain mythology
  active in present life. Coming-of-age and quest elements matter, but inherited mythic powers operating in ordinary modern Earth govern the whole sequence.'

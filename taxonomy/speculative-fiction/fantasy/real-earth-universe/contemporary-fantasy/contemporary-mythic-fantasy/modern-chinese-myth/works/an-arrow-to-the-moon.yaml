placement_rationale: '"Romeo and Juliet meets Chinese mythology" (publisher): in 1991 Montana, Hunter Yee and Luna Chang fall for each other across feuding
  Chinese-American families as the Chang''e and Houyi myth gathers around them - a named-figure Chinese myth playing out in the modern world (Kirkus: "how a
  poignant Chinese myth might play out in a contemporary setting"). Placed via Gustav''s 12:47 ruling seeding Modern Chinese Myth (was held #19; CMF site
  chosen over Mythic retelling on his 12:43 steer - the branches fork on setting: modern world vs mythic/past).'

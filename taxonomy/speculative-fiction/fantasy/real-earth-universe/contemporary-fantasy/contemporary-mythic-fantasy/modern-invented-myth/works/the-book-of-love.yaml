placement_rationale: 'Three teenagers come back from the dead in a Massachusetts town, bound to a bargain between old powers still at work in ordinary life (NYT, Guardian:
  ''life after life''). Link''s cosmology - the goddess Malo Mogge, Bogomil''s death-realm, the bargain rules - is authored, not inherited: myth-shaped, but no tradition.
  Placed via Gustav''s 22:07 ruling seeding Modern invented myth as the contemporary sibling of Epic fantasy''s Invented Mythology (was parked in pending-ruling).'

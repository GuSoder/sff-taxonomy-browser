placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Contemporary mythic fantasy. HarperCollins roots Colin and Susan’s modern lives at Alderley Edge in the awakened local legend of the sleeping knights, the Morrigan, wizard and magical Weirdstone. Fourth Estate confirms Boneland concludes the story begun fifty years earlier. Ancient Northern and Cheshire myth remains active in ordinary modern life across the trilogy.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Contemporary mythic fantasy. HarperCollins sets present-day young people into the compulsory replay of an ancient Welsh legend through an uncanny owl-patterned dinner service. The Blodeuwedd triangle from the Mabinogion remains active inside ordinary modern life, making inherited myth the living force.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Domestic fantasy. PRH centers three divorced women whose real household magic—weather, levitation, transmutation and coven practice—reshapes intimate, sexual and community life in contemporary Eastwick; the sequel returns the widowed household circle to confront their lingering enchantment and its consequences. Domestic bonds and aging govern over urban institutions or inherited myth.'

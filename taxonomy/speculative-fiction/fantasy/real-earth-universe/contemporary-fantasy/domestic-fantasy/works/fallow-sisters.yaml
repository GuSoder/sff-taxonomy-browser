placement_rationale: >-
  SFE identifies the Fallow Sisters sequence as fantasy. NewCon Press calls it a completed four-volume magical quartet about four fey sisters whose lives straddle present-day London and rural Somerset with an otherworld of past and alternative realms, aided by star spirits and the dead. Open magic crossing ordinary current life makes Contemporary fantasy the closest fit.

placement_rationale: SFE says Ahab survives while Ishmael has written Moby-Dick, then enters a fantasticated New York. Publishers Weekly frames the premise as Moby-Dick being a fictionalized version of reality. By making a canonical novel an unreliable artifact inside its own rewritten continuation, it foregrounds storytelling as the fantastic device, making Fabulation closest.

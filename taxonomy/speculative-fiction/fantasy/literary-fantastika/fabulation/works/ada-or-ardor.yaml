id: ada-or-ardor
title: Ada or Ardor
authors:
- Vladimir Nabokov
first_published: 1969
canonical_genre: fabulation
placement_status: accepted
placement_rationale: SFE says Ada depicts an Alternate History but treats its anti-Terra as possibly created by protagonist Van Veen as a Godgame, and stresses Nabokov's concern with shaping versions of the creative act rather than SF causality. Penguin calls it simultaneously fairy tale, epic, time treatise and parody of the history of the novel. Its self-conscious making and unstable world make Fabulation closer than literal Alternate history.

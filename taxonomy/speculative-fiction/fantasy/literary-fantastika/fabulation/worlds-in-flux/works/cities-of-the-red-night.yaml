placement_rationale: >-
  SFE calls the Red Night sequence a mixing and breeding of Western genres, while Penguin describes its mutant empire, radioactive epidemic, pirate history and modern satire as stories woven into one chaotic tale; the sequels move through a surreal Old West toward Egyptian theology. Mutable genre, history and reality make Worlds in flux closest.

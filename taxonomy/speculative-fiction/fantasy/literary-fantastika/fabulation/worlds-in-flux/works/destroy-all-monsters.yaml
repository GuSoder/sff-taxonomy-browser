placement_rationale: >-
  SFE describes the protagonists' shared amnesia and Darkside as either a Parallel World or a delusion, while Harper presents two overlapping realities whose friends rescue each other through recovered memory. Because the book keeps the fantastic world psychologically and ontologically unstable rather than settling it as a literal mechanism, Worlds in flux is closer than Parallel World fiction.

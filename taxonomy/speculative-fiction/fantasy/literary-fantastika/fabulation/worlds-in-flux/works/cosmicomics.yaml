placement_rationale: >-
  SFE describes the linked Qfwfq stories as fantasticated scientific postulates unpacked with absurdist cartoon clarity, fables about life, mathematics, evolution and the distinction between reality and appearance. Penguin follows humans, dinosaurs and molluscs through galaxies, solidifying planets and the move from water to land. SFE names Calvino in Fabulation; the universe repeatedly changes scale, matter, species and causal rules, making Worlds in flux its closest leaf.

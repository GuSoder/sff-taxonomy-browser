placement_rationale: Simon & Schuster and ISFDB confirm the novel merges and continues two inherited texts at once - Mary Bennet of Pride and Prejudice meets Victor Frankenstein - so it replays canonical novels inside a single rewritten continuation, the defining move of the meta-remyth leaf. Shelfmates Lavinia and Ahab's Return.

placement_rationale: Random House centers a present-day scholar discovering a long-lost manuscript that claims to be the gender-defying autobiography of eighteenth-century thieves Jack Sheppard and Edgeworth Bess; whether it is authentic or a hoax entangles the scholar's fate with its story. The manuscript and its footnoted publication destabilize both history and the framing world, directly fitting Books in books.

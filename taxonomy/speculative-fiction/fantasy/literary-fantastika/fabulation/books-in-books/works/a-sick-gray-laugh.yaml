placement_rationale: Word Horde's synopsis follows a horror author writing a supposedly nonfiction history of her town while the overwhelming Grayness may be social malaise, delusion or invasive force. Publishers Weekly describes both Cushing's novel and Noelle's work-in-progress exploring the same fictional town; its unstable author-double and book-inside-book make storytelling's reliability the fantastic device, fitting Fabulation.

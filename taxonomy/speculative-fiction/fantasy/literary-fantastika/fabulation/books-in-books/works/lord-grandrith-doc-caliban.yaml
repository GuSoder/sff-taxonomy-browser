placement_rationale: SFE calls A Feast Unknown a brilliant exploration of the sadomasochistic fantasies latent in heroic fiction, succeeding as satire, SF, and tribute to the Tarzan and Doc Savage creations. Farmer's official page confirms those characters are deliberately rewritten as Grandrith and Caliban and manipulated by the Nine. Its self-aware pastiche interrogates how pulp heroes and shared mythologies are made, fitting Fabulation.

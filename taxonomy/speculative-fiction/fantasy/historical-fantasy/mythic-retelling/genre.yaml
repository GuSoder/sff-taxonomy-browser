definition: 'Fantasy anchored to an inherited story, whose source is the myth itself: it retells or reimagines named figures and narratives
  from mythology or legend. Mythic-age settings such as Homeric Greece and Arthurian Britain count as retelling territory. Not Contemporary
  mythic fantasy (myth alive in the present day), which sits under Contemporary fantasy.'

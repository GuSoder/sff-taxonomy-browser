placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Mythic retelling > Norse fantasy. The
  NorseCODE genome project finds Kathy Castillo, a murdered MBA student raised from the dead as the valkyrie Mist to recruit
  soldiers for Ragnarok, and she crosses a chaotic America with the god Hermod toward Helheim to rescue her sister (PRH blurb:
  ''Is this Ragnarok, or just California?''). A reimagining of Norse myth, which is the leaf''s definition; the modern setting
  does not change what is being retold. Rejected: Contemporary mythic fantasy leaves (none is Norse, and the myth is retold
  rather than only alive in the present). Wobble: moderate. First published 2009.'

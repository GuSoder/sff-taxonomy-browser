placement_rationale: 'Drake''s The Dragon Lord (Berkley 1979, revised Tor 1982; Wikipedia, david-drake.com): in sixth-century
  Britain King Arthur wants a dragon to break the Saxons, and Merlin raises a wyvern from a lake-monster skull fetched from
  Ireland by the mercenary Mael, who also takes the spear and shield of the dead Saxon Biargram Ironhand, fights beside Arthur
  at the battle against Aelle and then has to kill the dragon when Merlin loses control of it. Walk: Speculative fiction >
  Fantasy > Fantasy realms > Real-earth fantasy > Mythic retelling > Arthurian fantasy > Arthur classic (Camelot, Merlin,
  Gawain, Lancelot, the war against the Saxons, told in the legend''s own mode, if grittier). Rejected: Arthur reimagined
  (the legend is not reshaped as an argument), Arthur returned (it is not set in a later world), Historical fantasy and Period
  fantasy (the court and the Merlin dragon make the legend itself the setting), Sword and sorcery (Wikipedia calls it historical
  fantasy or sword and sorcery, but the plot runs through Arthur''s court and Merlin''s magic). Wobble moderate: the hero
  is an outside mercenary and the tone is Drake''s grim realism, not romance. Queue year 2009 is a reissue; first publication
  1979. Queue id MC02279. Jacket: Baen 1998 paperback.'

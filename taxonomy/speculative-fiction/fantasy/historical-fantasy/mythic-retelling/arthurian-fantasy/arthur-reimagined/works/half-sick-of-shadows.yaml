placement_rationale: 'Laura Sebastian''s Half Sick of Shadows (2021; SLJ, Bookreporter, PRH): an Arthurian retelling narrated
  by Elaine, the Lady of Shalott, an oracle whose visions are a burden in a society where magic is banned; at 13 she arrives
  in Avalon and joins Morgana, Guinevere, the half-fey Lancelot and Arthur, and the legend is retold through the women around
  the court. Walk: Real-earth fantasy > Mythic retelling > Arthurian fantasy > Arthur reimagined (legend reshaped through
  women''s perspectives). Rejected: Arthur classic (told straight), Arthur returned. Sources: SLJ, Bookreporter, PRH; not
  read. First published 2021 (verdict row said 2022).'

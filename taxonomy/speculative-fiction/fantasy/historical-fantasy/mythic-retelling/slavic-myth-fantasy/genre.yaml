definition: 'Fantasy that retells the myths and folklore of the Slavic peoples: Baba Yaga and her walking hut, the firebird,
  Koschei the Deathless, forest and household spirits. Not Fairytale mythology (there one familiar tale grows into a cosmology),
  not Fairytale transplant (a tale moved to another era or culture), not Invented fairytales (the tale is new, not inherited).'
status: accepted
ruling: 'Seed approved by the curator ("Approved", phonemsg-01M4RH0GP4XKC43N0302ANT8AY, 2026-10-12 7:01:51 PM CEST) on the
  intake''s "Approve seed?" question for Lauren Wiesebron''s The House of Frost and Feathers. Fairytale mythology (where Spinning
  Silver sits) was the runner-up: that leaf grows one named tale into a cosmology, while this book draws on Baba Yaga and
  Slavic folklore generally.'

placement_rationale: 'S. M. Stirling''s Shadowspawn series (Roc: A Taint in the Blood, 2010; The Council of Shadows, 2011;
  Shadows of Falling Night, 2013; Wikipedia bibliography): the Shadowspawn are an ancient subspecies of Homo sapiens (Homo
  sapiens nocturnis) who formed the basis of the legends of vampires and werewolves and have secretly controlled the world
  for most of human history. Walk: Fantasy > Real-earth fantasy > Historical fantasy > Secret history (history secretly explained
  by a hidden truth) > Arcane peoples (the hidden truth is a concealed people living beside humanity through recorded history).
  Tried: Occult cabals (the truth is a people, not an order) and Vampire world (they are the source of the legend, not vampires
  as such).'

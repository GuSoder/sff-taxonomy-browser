placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Weird West
  fantasy. In the documented Rio Grande Valley and1846 Mexican-American War, rancher''s daughter/curandera Nena and vaquero Néstor reunite amid US invasion, territorial
  dispossession and literal blood-draining vampires. Publisher calls this a supernatural Western; author connects its ranch/frontier register to Lone Women. Romance
  is the beating heart, but this is real-Earth historical fiction, not the secondary-world Romantasy leaf. Historical furniture organizes the beings over Nocturne
  Vampire fantasy. Period over Secret history (no central secret explanatory engine), Alternate history (no divergent timeline/world running on magic), Pulp (no knockabout
  legendary adventure). Industrial1788-onward over Antique. Weird West''s nineteenth-century North American frontier is exact, without requiring the land already
  be United States territory. Gaslight -> Folklore -> Monsters in gaslight would fit broad era and creature lore but loses the more specific frontier/vaquero/war
  mode. Antebellum Southern slavery/freedom furniture fails this Mexican border setting; later-period siblings fail era. The vampires remain literal as well as metaphors
  for invaders; do not imply vampire action dominates. Curator Execute Weird West approved4->5.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Fantasy {Real earth fantasy, Fantasy realms, Portal fantasy} -> Real earth fantasy {Animal fantasy,

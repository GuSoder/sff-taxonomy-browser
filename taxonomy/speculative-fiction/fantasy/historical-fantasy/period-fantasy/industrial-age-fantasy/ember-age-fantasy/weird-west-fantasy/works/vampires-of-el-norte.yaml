  fantasy, Secret history, Alternate history fantasy, Pulp fantasy} -> Period fantasy {Antique times fantasy, Industrial age fantasy} -> Industrial age fantasy {Gaslight
  fantasy, Antebellum fantasy, Weird West fantasy, Tudorbethan fantasy, Bowler hat fantasy, Dust Bowl fantasy, Noir fantasy, Neon fantasy, WWI fantasy, WWII fantasy}

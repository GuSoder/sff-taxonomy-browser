placement_rationale: 'Leanna Renee Hieber''s Eterna Files series (The Eterna Files 2015, Eterna and Omega 2016, The Eterna
  Solution 2017; PW, Kirkus, author site, Amazon blurb): London and New York, 1882; Queen Victoria appoints police officer
  Harold Spire to a government division of paranormal investigators, and the American side includes the psychic Clara Templeton;
  teams of psychics, scholars, scientists and magicians on both sides race for the Eterna Compound, a formula for immortality,
  and later stop a demonic nobleman. Walk: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period
  fantasy > Industrial age fantasy > Magicians in gaslight (the story is the institutions of magic: two government divisions
  of practitioners and the resource they govern). Rejected: Gaslight technomancy (the compound is a formula but magic is not
  engineered as machinery), Nightfolk in gaslight, Mythology in gaslight, Secret history. Wobble: medium, Gaslight technomancy.
  Cameos from the Strangely Beautiful characters only, so a separate card. Sources: PW, Kirkus and publisher pages; not read
  in full.'

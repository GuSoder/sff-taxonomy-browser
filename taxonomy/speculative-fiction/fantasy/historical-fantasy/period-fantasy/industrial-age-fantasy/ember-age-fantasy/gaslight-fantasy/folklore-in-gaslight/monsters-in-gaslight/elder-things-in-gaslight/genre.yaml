definition: 'Gaslight-era fantasy where the monster is old, vast and unknowable, and stays beyond human company: sea beings,
  deep-water things and the strange powers of wastes and wilds that people meet on voyages, expeditions and frontiers, not
  in the parlour. Dread and awe come from what the creature is, not from living beside it. Not Shapeshifters in gaslight (a
  changing body among people) and not Nightfolk in gaslight (beings that live in the town). Split 2026-10-04 from Monsters
  in gaslight at ten cards (curator "Approved", 2026-10-04 6:42 PM, relayed by the parent).'

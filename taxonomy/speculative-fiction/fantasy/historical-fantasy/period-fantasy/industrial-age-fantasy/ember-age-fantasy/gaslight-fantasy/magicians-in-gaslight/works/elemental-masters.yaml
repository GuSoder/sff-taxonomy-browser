placement_rationale: 'Lackey''s Elemental Masters (Baen/DAW/Titan, 1995-2025; ISFDB, mercedeslackey.com, Penguin Random House):
  loosely connected standalone novels set in an alternate turn-of-the-century England and America where magical Masters of
  Fire, Water, Air and Earth, their lodges and their Elemental allies share the era with ordinary people, each book built
  on a reimagined fairy tale (Fire Rose on Beauty and the Beast, Phoenix and Ashes on Cinderella, Wizard of London on The
  Snow Queen) or, from A Study in Sable, on the Sherlock Holmes world with Lord Alderscroft, the Fire Master and Wizard of
  London, as the Masters'' head. Walk: Fantasy > Real-earth fantasy > Historical fantasy > Period fantasy > Industrial-age
  fantasy > Gaslight fantasy (the long nineteenth century through the Edwardian years) > Magicians in gaslight (practitioners,
  councils, lodges and lineages share the era and the magic is a craft and an inheritance they govern). Rejected: Faeries
  in gaslight and Nightfolk in gaslight (the Masters are human magicians; elementals are allies, not the stage), Fairytale
  transplant (9, gate; the tale is the template but the Masters'' world is the subject), Secret history leaves (the Masters
  are not hidden behind documented history), Gaslight technomancy (magic is not engineered), Mythology in gaslight, Bowler-hat
  and Tudorbethan fantasy (period and place, not the magicians'' institutions). One shared universe is one fiction (11j):
  the numbered Elemental Masters novels, the Holmes-world sequence (Study in Sable to Spellbound Child) and the later standalones
  (Jolene, Silver Bullets of Annie Oakley, Miss Amelia''s List, The Cyprian) are folded. Wobble moderate: The Cyprian is Regency
  and The Fire Rose is San Francisco, so the leaf''s long nineteenth century is the working span; Fairytale transplant is
  the alternative reading and is at the gate. The Black Swan is not folded (Swan Lake in an invented realm). Years are ISFDB
  and publisher first-publication years.'

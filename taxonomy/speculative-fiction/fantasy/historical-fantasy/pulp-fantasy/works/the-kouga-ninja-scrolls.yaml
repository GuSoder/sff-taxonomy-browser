placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Historical fantasy > Pulp fantasy. Per
  Wikipedia and Penguin Random House: in April 1614 Japan the retired shogun Ieyasu lifts the no-hostilities treaty between
  the rival Kouga and Iga ninja clans so that ten fighters from each can settle a succession dispute; generations of selective
  breeding have given the ninja inhuman, grotesque powers, and the lovers Gennosuke and Oboro stand at the centre. Real Edo-period
  history used as a lurid stage for sensational battles between superhuman fighters is the Pulp fantasy definition. Rejected:
  Period fantasy leaves (no Edo or Japan leaf exists, and none is seeded since the book''s engine is the pulp spectacle),
  Secret history (the powers are open to the story, not hidden from history). Wobble: a historical-fantasy-of-Japan leaf would
  suit it if one is ever opened. Year 1959 is the original Japanese publication (written 1958-59); English translation Del
  Rey 2006.'

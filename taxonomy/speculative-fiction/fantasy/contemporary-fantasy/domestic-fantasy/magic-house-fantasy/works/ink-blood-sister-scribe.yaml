  which magic enters and reshapes their lives (Kirkus; Locus). Split walk 2026-10-08 (phonemsg-01M4EB23ZEG2G6833YKK7FX1YQ):
  Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Domestic fantasy > Magic house fantasy.
  The dead father''s library of working spell-books is what comes down to the daughters; the inherited library carries the
  magic.'

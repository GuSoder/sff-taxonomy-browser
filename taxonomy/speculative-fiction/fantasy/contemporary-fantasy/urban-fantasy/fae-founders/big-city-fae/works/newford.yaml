placement_rationale: 'Root-down walk: set in the fictional modern North American city of Newford, so Real-earth fantasy; Urban
  fantasy; Fae founders; Big-city fae. Sources: Wikipedia (The Onion Girl and Widdershins are ''in the Newford universe'';
  Widdershins turns on a potential war between fairies, who came to the Americas with the European explorers, and ''cousins'',
  the original inhabitants who take animal forms, with a bogan gang, the fairy court and Jilly''s otherworld ''croi baile'');
  charlesdelint.com (Forests of the Heart is set in Newford and environs, with displaced Irish genius loci, the Gentry who
  still wander the city streets, and Latin American healers; Trader is set in Newford and environs); Publishers Weekly (Irish
  fairies, Native American shape-changers and Anansi meet in a tale of urban magic); Google Books blurb for Someplace to Be
  Flying (the animal people walking among the city''s slums). One fiction because the novels share the city, its art scene
  and a recurring cast (de Lint: Newford is not a running series, books share a common setting and characters); collections
  (Dreams Underfoot, Moonlight and Vines, Muse and Reverie and the other Newford story books) are skipped. Wobble: the fae
  are one of several mythic peoples (the First peoples'' spirits are co-equal), and Trader''s soul-switch plot has little
  Faerie in it; Big-city fae is the leaf where the old peoples live on inside the metropolis with the city as stage. Years:
  Trader 1997, Someplace to Be Flying 1998 (Tor, Feb 1998), Forests of the Heart 2000 (Tor, June 2000), The Onion Girl 2001,
  Widdershins 2006 (Tor, 16 May 2006).'

placement_rationale: 'Kim Wilkins''s The Autumn Castle (Warner Aspect; Publishers Weekly, Warpcore SF review): in modern Berlin,
  Christine Starlight''s lost childhood friend May turns out to have been traded to Faerie by her mother and is now its queen
  Mayfridh, while the building''s owner, the sculptor Mandy Z, murders fairies for their bones. Walk: Fantasy > Real-earth
  > Urban fantasy > Fae founders > Big-city fae (Faerie bargains and changelings inside a modern metropolis, the city as the
  stage). Tried Otherworld stumblings (the faery folk already live in the city; the queen crosses over) and Wainscot fantasy.
  Sources: PW, Warpcore; not read. Alternative: Otherworld stumblings.'

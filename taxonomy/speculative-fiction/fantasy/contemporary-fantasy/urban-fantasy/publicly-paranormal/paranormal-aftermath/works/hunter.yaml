placement_rationale: 'Lackey''s Hunter trilogy (Hunter 2015, Elite 2016, Apex 2017, Disney-Hyperion; mercedeslackey.com, Kirkus,
  PW, SLJ): long ago the barriers between our world and the Otherworld were ripped open, and it took centuries to rebuild
  civilization behind walls and barriers while Othersiders (monsters) and the Folk keep breaking through. Joyeaux Charmand,
  a Hunter since childhood in a mountain community, is called to Apex City to protect its leaders, finds a conspiracy that
  is letting worse things in, and in Elite and Apex fights Othersider armies and the rival psychic PsiCorps as a member of
  the Elite Hunter Command. Walk: Fantasy > Real-earth fantasy (Earth, here a post-catastrophe future Earth, rather than an
  invented universe) > Urban fantasy > Publicly paranormal (the supernatural is a known category the society names and lives
  with) > Paranormal aftermath (a world already remade by a breach between worlds, stories inside the new order, as with Kate
  Daniels). Rejected: Dying earth (the sun is not the point), Post-holocaust survival and Ruined earth (SF causes and wastelands;
  here the cause is the opened Otherworld and the people live in walled cities with technology), Hunter hero and Soldier fantasy
  (Heroic and Military fantasy are invented-world leaves; this is Earth), Dystopian rebellion (the corrupt PsiCorps and city
  leaders are a thread, not the engine), Fae founders (the Folk are enemies outside the barriers, not founders of the city).
  One series is one fiction (11j): Hunter and Apex are the queue rows; Elite is the middle volume. Wobble moderate: the setting
  is a future dystopia, which is why Kirkus and SLJ call it sci-fi YA; Paranormal aftermath is chosen because the barrier
  breach and the Othersiders remake society. Years from mercedeslackey.com first-published dates.'

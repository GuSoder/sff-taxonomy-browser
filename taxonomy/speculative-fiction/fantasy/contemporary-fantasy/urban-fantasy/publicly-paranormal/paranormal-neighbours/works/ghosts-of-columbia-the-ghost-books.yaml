placement_rationale: 'L. E. Modesitt''s Ghost books (Of Tangible Ghosts 1994, The Ghost of the Revelator 1998, Ghost of the
  White Nights 2001; omnibus Ghosts of Columbia 2005; Modesitt''s site, Macmillan): in an alternate America, the nation of
  Columbia, ghosts and humans coexist openly; Dr. Johan Eschbach, a college professor, treats the ghosts as harmless reminders
  until he meets the wrong ghost, the murdered girl of the first book. One shared world, one fiction. Walk: Real-earth fantasy
  > Urban fantasy > Publicly paranormal > Paranormal neighbours (the supernatural is a named, ordinary part of the society).
  Alternatives: an alternate-history leaf, Ghost speakers. Sources: Modesitt''s site, Macmillan; not read.'

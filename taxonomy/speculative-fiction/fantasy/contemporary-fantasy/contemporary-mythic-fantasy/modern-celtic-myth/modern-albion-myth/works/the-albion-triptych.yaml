placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Contemporary fantasy -> Contemporary mythic fantasy -> Modern Celtic myth -> Modern
  Albion myth. Gog washes ashore in Scotland in 1945 and walks to London, with the myth and history of Britain running through
  the journey (SFE; The Modern Novel). Moved from Pulp fantasy on the curator''s instruction (phonemsg-01M4VE383QNKGNPPAF5YDGC6XN).
  Wobble: Gog is set in 1945, 22 years before the 1967 publication, and it is a picaresque satire across British history rather
  than folk magic inside ordinary life; the curator''s call.'

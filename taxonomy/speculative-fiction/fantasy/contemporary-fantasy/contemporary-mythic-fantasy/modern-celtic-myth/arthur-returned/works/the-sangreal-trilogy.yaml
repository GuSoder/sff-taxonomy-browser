placement_rationale: 'Amanda Hemingway, The Sangreal Trilogy (The Greenstone Grail 2004, The Sword of Straw 2005, The Poisoned
  Crown 2007; Penguin Random House, BookLoons): a mother spirits her infant son to the English village of Thornyhill and the
  ageless Bartlemy, who comes to believe the boy, Nathan, is destined to find the scattered relics of the Grail; the later
  books send Nathan after the sword of straw and the poisoned iron crown kept beneath the ocean. Walk: Speculative fiction
  > Fantasy > Real earth fantasy > Mythic retelling > Arthurian fantasy > Arthur returned (the Grail legend comes back into
  a later English world). Rejected: Arthur classic (no Camelot), Arthur reimagined (no argument with the legend), Quest-threshold
  portal fantasy. Wobble: medium, since the relics quest also spans other realms. Sources: Penguin Random House blurbs, BookLoons
  review.'

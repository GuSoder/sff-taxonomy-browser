placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Mythic
  retelling -> Arthurian fantasy. Eerdmans: Williams gives a contemporary setting to the traditional Search
  for the Holy Grail, which turns up in an English parish church and is fought over by an archdeacon and
  black magicians. Real magic and divine power are in play, and the Grail story governs.'

canonical_genre: screwball-fantasy
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Sword and Sorcery
  -> Comic fantasy. SFE: Beerbohm''s one novel uses various supernatural elements to frame a romantic comedy and satire in
  which almost all the Oxford undergraduates drown themselves for Zuleika, an irresistible supernatural force who makes statues
  weep. Comedy and satire drive it; it joins Topper and Turnabout under the leaf''s explicit exception for real-world comic
  fantasy.'

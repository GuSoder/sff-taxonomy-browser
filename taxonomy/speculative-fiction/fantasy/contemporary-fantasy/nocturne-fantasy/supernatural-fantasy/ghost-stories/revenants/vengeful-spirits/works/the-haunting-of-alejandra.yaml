placement_rationale: 'FULL ROOT-DOWN WALK (redone 2026-10-06 after the first pass was found incomplete). Speculative fiction
  > Fantasy (not Science fiction: no science) > Real earth fantasy (contemporary Philadelphia plus flashbacks from 1522; not
  Fantasy realms or Portal fantasy) > Nocturne fantasy (children: Dark fantasy, Paranormal fantasy, Supernatural fantasy)
  > Supernatural fantasy (children: Evil deals, Surreal afterlife, Vampire fantasy, Ghost stories, Undying, Haunted house,
  Werewolf fantasy). Ghost stories wins: La Llorona is a dead woman haunting a living family. Not Dark fantasy > Horror fantasy
  (children Hellscape horror, Unholy ground horror, Folk horror): the menace is a returning dead person, not a place or a
  community; not Haunted house (the haunting follows the woman and her line, not a building); not Evil deals. Ghost stories
  children: Lessons beyond the grave (the dead are company with a lesson: no), Revenants (a specific dead person returning
  with purpose: yes), Ghost speakers (living medium: no, Alejandra is the haunted one), Haunted objects (no object). Revenants
  children: Ghosts & grief (bound by love, guilt or grief: no, the spirit is a menace and an avenger) vs Vengeful spirits
  (purpose turned outward, menacing, retributive: yes). HOLD HISTORY: it sat on the hanging list as ''contemporary horror,
  no horror branch in the tree''; that was my mistake, the check missed the Nocturne fantasy branches. Pure horror without
  speculative elements is out of scope (curator phonemsg-01M48JZVFV02KN5GW2K89JKXXW 2:28:35 PM, corrected phonemsg-01M48K0QS1JH6N00EY1P6RE8EN
  2:29:05 PM), but a La Llorona ghost story is speculative and in scope. Sources: Kirkus, Publishers Weekly, PRH.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Nocturne fantasy > Supernatural fantasy
  > Werewolf fantasy. Per the author''s page: a queer retelling of Bisclavret from the lais of Marie de France, published
  Nov 2025 (Gollancz). Bisclavret has a wolf-sickness that takes his body and mind without warning, keeps him from court,
  and puts him under a new king whose fealty he owes. The curse and the human identity against the wolf are the subject, which
  is the Werewolf fantasy definition. Rejected: Autumn kingdoms (medieval Brittany, but not fourteenth-century and the setting
  is not the engine), Romantasy (the author says it was not intended as romantasy though it is sometimes shelved there). Wobble:
  Romantasy is the second reading. MC03142 The Animals We Became is the follow-up in a different retelling and unpublished,
  so it is held rather than folded.'

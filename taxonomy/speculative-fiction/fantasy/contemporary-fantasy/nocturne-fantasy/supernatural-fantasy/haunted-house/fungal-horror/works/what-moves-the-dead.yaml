placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Supernatural fantasy -> Haunted house -> Eldritch fungi.
  Retired soldier Alex Easton investigates the dying Ushers in their decaying ancestral manor in1890 with a British mycologist and American doctor. Sentient fungus
  inhabits and animates corpses and hares, reshapes bodies, and speaks through its hosts. The uncanny fungal intelligence and transformed house/bodies are central
  about-ness, not incidental mushrooms. Science-vs-fantasy tension preserved: reviewers explain a biological rather than supernatural source and scientific inquiry;
  my initial science-led walk reached SF > Historical > Period SF, whose Steampunk and Deco children fail the biological1890 story, while Proto/Gothic SF fails the
  modern2022-composition gate. Curator consciously chose the Fantasy hearing on2026-09-30 because fungal reanimation is close to walking dead. This specific boundary
  ruling does not turn the mechanism into a human laboratory experiment or erase the scientific reading. Real-earth Ruritanian European setting, not a separate universe;
  Nocturne for Gothic fungal threat, not myth replay, magic craft or romance; Supernatural for curator''s uncanny reanimation hearing; Haunted house for Usher manor
  as locus, over vampires/ghosts/werewolves. Eldritch fungi definition fits uncanny mycelial intelligence transforming bodies and places. Companion books not included
  by this ruling.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Fantasy {Real earth fantasy, Fantasy realms, Portal fantasy} -> Real earth fantasy {Animal fantasy,
  Contemporary fantasy, Historical fantasy, Magic realism, Mythic retelling, Nocturne fantasy, Urban fantasy, Earthly comic fantasy} -> Nocturne fantasy {Dark fantasy,
  Paranormal fantasy, Supernatural fantasy} -> Supernatural fantasy {Evil deals, Surreal afterlife, Vampire fantasy, Ghost stories, Undying, Haunted house, Werewolf
  fantasy} -> Haunted house {Classic haunted house, Contemporary haunted house, Eldritch fungi} -> Eldritch fungi

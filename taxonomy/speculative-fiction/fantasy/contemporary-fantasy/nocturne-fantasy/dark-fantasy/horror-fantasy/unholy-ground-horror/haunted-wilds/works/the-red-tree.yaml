placement_rationale: 'Root-down walk: a real-world rural New England setting where something ancient waits, so Real earth
  fantasy; Nocturne fantasy; Dark fantasy; Horror fantasy; Unholy-ground horror; Haunted wilds (wilderness). Sources: Penguin
  Random House (Sarah Crowe leaves Atlanta for an old house in rural Rhode Island and finds an unfinished manuscript by the
  house''s former tenant, an anthropologist obsessed with the ancient oak on a desolate corner of the property; the tree is
  tied to local legends of supernatural magic and to documented accidents and murders, and it takes over her dreams and thoughts
  so that she risks her health and sanity) and the author''s note there (the idea came from an enormous oak she met in the
  woods near Exeter, Rhode Island, ringed with dismembered doll parts and bottles; a book within a book in two voices). The
  engine is a place, a woodland tree and its land, that draws people in, so Haunted wilds, not Folk horror (no community''s
  rites are the menace in what I read) and not Elder god torment (no awakening being follows named victims). Wobble: Primordial
  torment and Classic haunted house were considered; the PRH copy does not say whether the tree is a being or a place, so
  the leaf choice rests on the setting the blurb stresses. Published 4 August 2009 (PRH/Roc).'

placement_rationale: 'Held at intake (gap-2022 #231) as folk horror with no leaf; the curator ruled it
  in-genre 2026-09-28 (''there seems to be some magic'') and created this leaf for it. NYT genres it folk
  horror twice (''a mix of fairy tale and folk horror''; Kunzru: Ina is ''an ancient and magical blind
  woman... a sort of supernatural wet nurse, suckling generations of Lapvonians''). An isolated medieval
  fief whose communal cruelty, superstition and old rites are the engine; the marvel is real but marginal
  - a working horse-eyes charm, the ending''s life-drain - which the curator weighed and accepted. About-ness
  call was his, per the corrected brief.'

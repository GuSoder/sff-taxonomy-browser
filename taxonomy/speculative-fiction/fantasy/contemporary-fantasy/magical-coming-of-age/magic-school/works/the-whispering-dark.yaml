placement_rationale: 'Root-down: Speculative fiction > Fantasy > Earth-rooted fantasy > Contemporary fantasy > Magical coming-of-age
  > Magic school. Scholastic 2022 (the Gollancz row is a UK edition; the queue author ''Events'' is a scrape error, author
  verified on the author''s site and Publishers Weekly). Delaney, a Deaf eighteen-year-old scholarship student, joins Howe
  University''s Godbole School of Neo-Anthropological Studies, a program that teaches students to step between worlds; students
  die, and she and the TA Colton Price uncover a secret society and an old enemy. The craft is taught inside an academy with
  instruction and campus life, which is the Magic school definition. Rejected: Quest thresholds, Otherworld stumblings and
  Multiverse fantasy (the crossing is the program''s subject but the book stays on campus and in the school''s secrets), Birthright
  magic (Delaney''s link to the afterlife is not an inherited line), Found magic (taught, not stumbled into), Modern occult
  (not a gothic occult setting). Wobble: Portal fantasy is the second-closest. Same author''s Your Blood, My Bones is a separate
  book in Occult bloodline.'

placement_rationale: 'Elizabeth Bear''s The Eternal Sky trilogy (Range of Ghosts 2012, Shattered Pillars, Steles of the Sky;
  Kirkus, Reactor, publisher blurbs): Temur, an exiled Khagan''s grandson, the sorcerer Samarkar and the tiger-woman Hrahima,
  outcasts, cross a world of steppes, mountains and moon-marked skies while the khanate''s civil war rages. Walk: Speculative
  fiction > Fantasy > Fantasy realms > Far shores > Tenger (seeded for this card). Moved from Revival quest fantasy once the
  curator asked whether the culture is the book''s work: the Mongol-and-Silk-Road steppe world is its signature, passing the
  about-ness test. Wobble: medium, the company-of-outcasts quest engine remains. Sources: Kirkus, Reactor, publisher blurbs;
  not read in full.'

definition: 'Fantasy Realms set in invented worlds that are counterparts of non-Western cultures, histories and myth traditions - veiled stand-in lands rather than the real places,
  which live under Real Earth Universe''s Period fantasy. Children carry each culture''s own word for fantasy. Named by Gustav 2026-09-23. ABOUT-NESS TEST (Gustav
  2026-09-26): a book belongs here only when it is ABOUT the far-shore setting - when the interesting work is the culture in a fantasy setting. If its core themes
  already have an engine leaf elsewhere (war, rebellion, mystery, chosen one), it goes there instead.'

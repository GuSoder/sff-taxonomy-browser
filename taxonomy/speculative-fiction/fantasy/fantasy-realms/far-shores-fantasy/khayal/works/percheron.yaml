placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Far shores fantasy > Khayal. One trilogy
  in one world (the Percheron Saga: Odalisque, Emissary, Goddess; Wikipedia), so one fiction (rule 11j). Per Wikipedia: the
  invented desert realm of Percheron has a Zar, a Valide, eunuchs and a harem, the slave Ana and the Spur Lazar, a demon Maliz
  against the goddess Lyana, and a Galinsean war fleet. The setting is an invented world drawn from Ottoman and Arabic court
  and desert culture, which the Khayal definition names. Rejected: Dynastic favor (the harem is the stage, but the gods-and-demon
  war and the desert are the shape), Mythic power struggle (real-tradition beings only; Maliz and Lyana are invented), Invented
  mythology (the gods are the plot, but the culture is the leaf). Wobble: a Western author''s Ottoman pastiche, not an Arabic-tradition
  work, so Dynastic favor is the second reading.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Far shores fantasy > Khayal. Nehal, a waterweaver
  trapped in an arranged marriage, wants the new Weaving Academy and a place in the first all-female regiment, in a feminist
  and political fantasy world that the Weavers of Alamaxa cover calls Egyptian-inspired (author site; Washington Post quote
  on the second book''s cover). An invented world drawn from Arabic-language culture and history, the leaf''s definition.
  Rejected: Tinderbox fantasy and other revolt leaves (the series is a social movement and a school before it is an uprising).
  Wobble: low. Sources: author site, publisher cover pages. Years: 2022, 2024.'

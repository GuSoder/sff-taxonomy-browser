definition: '传奇 (chuanqi), the Tang-dynasty word for wonder-tales that still means legend and saga: Chinese-tradition fantasy in invented worlds, from classical gods-and-demons
  myth to modern mystic fantasy. Shenmo is the Ming-era classical tradition, Xuanhuan its modern heir, Wuxia the martial-heroes tradition of the jianghu; Xianxia
  is banked for later. Named by Gustav 2026-09-23.'

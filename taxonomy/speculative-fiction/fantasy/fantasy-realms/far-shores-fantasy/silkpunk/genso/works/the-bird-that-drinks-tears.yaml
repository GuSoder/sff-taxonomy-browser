placement_rationale: 'Lee Young-do''s The Bird That Drinks Tears (Korean 2003; English volumes The Heart of the Nhaga and
  Those Who Prepare the Way; Wikipedia, PRH/HarperCollins blurbs; not read in full): an invented world of four races (human,
  Rekon, Tokkebi, Nhaga who give up their hearts for immortality), each with its own language, beliefs and sociopolitics,
  drawing on Korean folklore, history and Old Korean language; an envoy escort mission is the plot. Walk: Speculative fiction
  > Fantasy > Fantasy realms > Far shores > Silkpunk > Genso. About-ness test passes: the Korean culture and folklore do the
  work, not the mission. Rejected: Revival quest fantasy (the culture, not the revived quest, is the interesting work; never
  placed there), Fairytale mythology. Placed on the curator''s call ''Take the remapped Genso one to Genso'' (phonemsg-01M4RJ4F5Y6ZTWZT8W3J18S637,
  2026-10-12 7:21 PM). Wobble: low-medium, Genso''s definition widened to name Korean folklore epics (see SPLITTING log).
  Sources: Wikipedia, publisher blurbs.'

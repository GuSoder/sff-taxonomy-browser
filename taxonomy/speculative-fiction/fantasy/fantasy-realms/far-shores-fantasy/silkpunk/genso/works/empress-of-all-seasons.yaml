placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Far shores fantasy > Silkpunk > Genso. Per
  the author''s site, ALA Booklist and Clarion Books (6 Nov 2018): in the invented empire of Honoku each generation holds
  a competition for the next empress, through enchanted seasonal rooms of Winter, Spring, Summer and Fall, and the yokai Mari
  enters to steal the imperial fortune while the human emperor hunts yokai. A Japan-drawn invented world with its yokai folklore
  and palace order doing the work is the Genso definition and its about-ness test (the culture does the work). Rejected: Rivals-to-lovers
  romantasy (the contest is the frame, the prince is a means, not the love plot), Court spies and Court statecraft (the palace
  is a trial ground, not a political machine), Fairytale transplant (no inherited tale being moved). Wobble: YA contest plot
  and romance are strong enough that a trial-and-contest leaf would fit better if one existed. Year 2018.'

definition: '幻想 (genso), the Japanese word for fantasy and illusion - the actual publishing term for fantasy literature (genso bungaku); Korean hwansang 환상 is the same hanja. Modern and re-imagined East Asian fantasy in invented worlds outside the classical Chinese lineages: diaspora cities, island warrior traditions, clan codes and jade economies. Boundary: Chuanqi holds the native classical Chinese genre lineages (shenmo, xuanhuan, wuxia, xianxia); Genso holds everything else East Asian. About-ness test (Gustav 2026-09-26): the culture does the work.'
status: accepted
ruling: 'Created under Gustav''s 19:29 ruling (''Go with that'' on the Silkpunk-umbrella model) - Silkpunk as East Asian umbrella, Genso as the modern/re-imagined sibling leaf to Chuanqi.'

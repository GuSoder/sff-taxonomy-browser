placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Far shores fantasy > Silkpunk > Chuanqi >
  Xuanhuan. One fiction under rule 11j: the duology (The Night Ends with Fire 2024, The Dragon Wakes with Thunder 2025),
  a reimagining of the Mulan legend in the invented Three Kingdoms: Meilin disguises herself to answer the imperial draft,
  and the sea dragon spirit Qinglong offers power at a blood price, dwelling within her in book 2. The culture does the
  work: folk cosmology (dragon spirit, spirit realm, the spirits demanding blood) in an invented world drawn from Chinese
  history and legend - the Xuanhuan gate word for word. Chuanqi over Genso: the tree already lodges Western-published
  Chinese-legend fantasies in the classical lineages (Grace Lin''s books in Shenmo, Kay''s Under Heaven here). Shenmo
  rejected: this is a war epic with spirit dealings, not a Journey-to-the-West-mode gods-and-demons adventure. Ground
  soldier fantasy rejected: unlike The Poppy War, no unit is the story - the books follow Meilin''s personal arc
  (book 2 is imprisonment and the dragon''s due, the war over). Romantasy rejected: the publisher frames a sweeping
  adventure "infused with magic and romance"; the romance threads (Sky, the enemy prince) never govern the spine.
  Wobble disclosed: a strong two-prince romance thread runs through book 1; the destiny-war aboutness governs under
  the overarching-theme ruling.'

placement_rationale: 'Penguin Random House: Kay evokes the Tang dynasty of 8th-century China in Kitai, an invented stand-in empire. Shen Tai, honouring his dead father
  at a haunted battlefield, is given 250 Sardian horses - a gift that makes him a target at court. Ghosts, fox-women and shamans are real. Mystic Chinese-history
  fantasy in a veiled world: Xuanhuan.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Far shores fantasy > Silkpunk > Chuanqi
  > Shenmo. Minli leaves her village to ask the Man in the Moon how to change her family''s fortune, and her road runs through
  dragons, a talking fish, the Old Man of the Moon and other figures of Chinese folk tradition; Starry River of the Sky and
  When the Sea Turned to Silver continue as companion novels in the same storytelling world (Grace Lin''s site: ''a masterpiece
  companion novel to Where the Mountain Meets the Moon and Starry River of the Sky''), so one fiction (rule 11j); Starry River
  added as an extra volume. Mythic adventure shaped by deities, dragons, spirits and folk cosmology is the leaf''s definition,
  and Shenmo is the Chinese gods-and-demons tradition, with the culture doing the work. Rejected: Invented fairytales (the
  tales are borrowed from a living tradition, not newly invented), Genso (that holds East Asian fantasy outside the classical
  Chinese lineages; this one is built on them). Wobble: strong; this is middle-grade folk fantasy and Shenmo''s single card
  is an adult Journey to the West descendant. Source: publisher and author pages, not the books themselves.'

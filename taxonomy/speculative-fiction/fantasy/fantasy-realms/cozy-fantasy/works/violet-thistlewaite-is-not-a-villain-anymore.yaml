placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Cozy fantasy. Per Penguin Random House and
  the author''s site: a plant witch, the dead dark sorcerer''s former right hand, and a grumpy alchemist must work together
  to save their quiet town from a magical plague, in a story about starting over and redemption. Comfort, community, craft
  and everyday care govern the story, with the adventure kept low-intensity: the Cozy fantasy definition. Rejected: Bonded
  romantasy and the enemies-to-lovers leaves (the romance is one thread, not the engine), Redemption-less comic fantasy (tone
  is warm, not comic-driven). Wobble: a plague and a villain past carry more stakes than the coziest examples. The companion
  novel Prudence Marsh Is Not a Nobody Anymore (MC02923) is unpublished (Ace, 10 Nov 2026) and held; when it appears it folds
  in here as one shared universe. Year per PRH, published 18 Nov 2025.'

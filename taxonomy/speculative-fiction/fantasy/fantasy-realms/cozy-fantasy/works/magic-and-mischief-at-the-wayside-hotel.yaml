placement_rationale: 'Full root-down walk: Fantasy (a magical world-hopping hotel; no science frame) > Fantasy realms (the
  hotel is stranded on a non-magical Earth but the setting and its rules are the book''s invented world, not our real-earth
  present) > Cozy fantasy (warm, low-stakes fantasy of home, community, found family and everyday care; the hotel manager''s
  job is plumbing and welcome; PRH and reviews call it a warm fantasy romance; not Romantasy, which is built on enemies or
  bonded lovers, and the romance here is a gentle strand of a found-family story). Everett, Ace, March 10, 2026 (PRH). The
  sequel The Wayside Guide to Baking and Bloodlust (MC02829) is unpublished (2027) and held.'

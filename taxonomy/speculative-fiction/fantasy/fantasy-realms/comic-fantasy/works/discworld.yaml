id: discworld
title: Discworld
authors: [Terry Pratchett]
first_published: 1983
last_published: 2015
canonical_genre: comic-fantasy
placement_status: accepted
placement_rationale: >-
  SFE calls Discworld the bestselling comic Fantasy series, beginning in broad parody and growing into pun-rich satire of institutions, technology and modernity; Pratchett’s entry calls it the genre’s finest set of pure comedies. Comic mode unifies all 41 novels despite their varied fantasy and SF proportions.

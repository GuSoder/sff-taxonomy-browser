placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Gothic realms > Isolationist fantasy. The island
  of the rasnan, at the edge of a world-spanning ocean, holds the descendants of refugees from a world ruined by magical
  and technological excess; most are resigned to exile while a secret brotherhood tries to pry open doors back and sailors
  risk the uncharted sea (PRH blurb; Library Journal). A sealed, self-contained world whose isolation is the premise -
  the leaf''s test, in the Gothic register of dread and conspiracy. Rejected: Dark realms (menace is present but the
  governing condition is the closed island and its exile), Far shores fantasy (not a counterpart of a non-Western culture).
  Wobble: moderate; the plot actively works to break the isolation rather than only dwell in it. Year: 2008 (Del Rey).
  Queue id MC03859.'

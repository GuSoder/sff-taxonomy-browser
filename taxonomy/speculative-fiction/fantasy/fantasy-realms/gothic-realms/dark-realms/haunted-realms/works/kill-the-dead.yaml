placement_rationale: 'Tanith Lee''s Kill the Dead (DAW, 1980; publisher description and a Gidney review): Parl Dro, the Ghost-Killer,
  a mordantly humoured, renowned and infamous exorcist, hunts the ''deadalive'', the dead who return bound to a physical link
  from their bodies and feed on the living, and in this tarot-inspired Gothic tale he deals with a hapless musician and a
  vengeful female lich, an undead sorceress. Walk: Fantasy > Fantasy realms > Gothic realms > Dark realms > Haunted realms
  (the dread is the dead). Tried: Godforsaken realms (no dark god), Hungry realms (the dead feed, but the dread is that they
  are dead) and Ghost-sleuth fantasy (no mystery to solve). Wobble: Hunter hero (a monster hunter), whose leaf stresses woodcraft;
  the world is a secondary one, which I took from the review and not the text.'

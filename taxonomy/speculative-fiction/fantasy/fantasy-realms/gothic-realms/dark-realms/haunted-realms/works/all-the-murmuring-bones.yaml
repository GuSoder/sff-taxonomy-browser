first_published: 2021
canonical_genre: haunted-realms
placement_status: accepted
placement_rationale: 'Miren O''Malley''s family rose on a bargain with the mer - safe ships for a child
  of each generation - and fell when they stopped paying. Not Earth: Slatter''s own site calls it the first
  novel in the same invented world as Sourdough and The Bitterwood Bible, so Real-earth cannot hold it.
  Placed in Haunted realms (Gothic school, dark-realms split by what the dread is made of): the publisher''s
  "dark gothic fairy tale", two dark houses (Hob''s Hallow, Blackwater), ghosts and corpsewights, and buried
  family history that will not stay buried - the dead are the dread.'

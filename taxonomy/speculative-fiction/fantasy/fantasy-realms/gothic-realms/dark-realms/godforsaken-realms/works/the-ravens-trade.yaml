  ## Adjacent intake exclusions


  MC06354 In the Greenwood, MC06355 Some Gods of El Paso, MC06356 The Girlfriend''s Guide to Gods and MC06357 The Tallest
  Doll in New York City are short stories, confirmed by their original publisher. Correct MC06356''s stale agent-authored
  picture/kids reason to short-work, not a juvenile ban. MC06358 Alistair Fall remains unpublished at the current23November2026check;
  hold-unpublished rather than a skipped fictional adult novel.



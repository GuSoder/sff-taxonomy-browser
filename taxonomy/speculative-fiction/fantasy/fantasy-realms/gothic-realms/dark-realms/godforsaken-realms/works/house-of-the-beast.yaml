placement_rationale: 'Root-down: Fantasy > Fantasy realms > Gothic realms > Dark realms > Godforsaken realms. Per HarperCollins
  Australia: a dark fantasy debut, ''soaked in gothic atmosphere'', where noble families serve the gods and wield their powers,
  and Alma binds herself by a desperate vow to the Dread Beast, the most fearsome of the gods. The dread is a dark god and
  the bargain made with it. Soft: the blurb also calls it romantic, so Bargain bond romantasy is the runner-up; it is held
  out because the gothic dread governs the frame. The Deluxe Limited Edition row is the same book.'

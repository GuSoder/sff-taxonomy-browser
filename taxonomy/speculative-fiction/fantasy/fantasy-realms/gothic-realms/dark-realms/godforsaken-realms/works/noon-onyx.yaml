placement_status: accepted
placement_rationale: 'Jill Archer''s Noon Onyx novels (Dark Light of Day, Fiery Edge of Steel, White Heart of Justice; Ace):
  Armageddon is over and the demons won, and the surviving world runs under patron demons, a tribute system and rules that
  keep the demons from warring; Noon Onyx, a young woman, studies and works inside that order and the conflicts it breeds.
  Root-down: Fantasy -> Real earth fantasy -> Urban fantasy; demons are openly known and absorbed into civic life, so Publicly
  paranormal. Setting review 2026-10-14: not Earth: Halja, a fictional country with circa 1900s technology, after demons won
  Armageddon (Penguin Random House, author interview). Fantasy realms > Gothic realms > Dark realms > Godforsaken realms:
  demonic Others and the tribute bargains shape the whole world. Wobble: the dread is the setting, not the mood; the books
  read as a school, race and quest story.'

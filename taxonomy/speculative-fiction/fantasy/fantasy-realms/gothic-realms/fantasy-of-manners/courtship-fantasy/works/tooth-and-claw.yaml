placement_rationale: 'Standalone novel (Tor 2003, World Fantasy Award winner). SFE classes it outright: ''a Satirical Fantasy
  of Manners in which dragons effectively inhabit a sharply conceived world that Anthony Trollope could have described in
  his own terms''. Root walk: imaginary dragon world -> fantasy-realms; gothic-realms gate passes via its own manners clause
  (''plus the Pax Britannica manners branch'' - Trollope = British imperial-era social codes; the dragon world also supplies
  the menace register: dark appetite, confinement). Leaf: the match is the plot - after the patriarch''s death (and ritual
  eating), the engine is the sisters'' marriage prospects, Selendra''s suitors and the inheritance lawsuit, with draconic
  biology (wing-blushing at impropriety, growth by eating) working through the courtship and settlement machinery. Not posh
  (the drawing-room rank games are the medium, not the story) and not gossip (reputation-talk serves the matches).'

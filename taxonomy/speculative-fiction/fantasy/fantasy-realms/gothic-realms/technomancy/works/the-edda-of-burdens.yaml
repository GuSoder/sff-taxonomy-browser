placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic realms > Technomancy. Valdyrgard, a world shaped by Ragnarok where magic and technology work side by side; the last city on a dying planet is ruled by the Technomancer (Macmillan, Loreful; PW: a single city survives 2,300 years after the Last Day). No source names Earth, so it sits in Fantasy realms. Chosen by the curator (phonemsg-01M4WJRAASX7Q8DT9BXTF8X4SZ). Earlier Norse fantasy walk: after Ragnarok the surviving Norse gods, Valkyries and wolves fight the last remnants of the wars.'

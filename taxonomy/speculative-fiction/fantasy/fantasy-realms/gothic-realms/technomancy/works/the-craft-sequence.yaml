first_published: 2012
canonical_genre: technomancy
placement_status: accepted
placement_rationale: '# Craft universe reconciliation: MC06594-604

  25 November 2026


  ## Decision

  Consolidate existing Dead Country/Wicked Problems and Dead Hand Rule fictions as The Craft Sequence, add the six original
  novels, and keep the whole nine-novel universe in Technomancy. Existing leaf seven to six fictions. No genre, definition
  or portrait change. Publication order is used, not the numbers'' internal chronology. Games, short fiction and omnibus duplication
  excluded.


  ## Root-down walk

  Speculative fiction > Fantasy > Fantasy realms > Gothic realms > Technomancy.


  Actual magic is verified by author, publisher, and independent review. Necromantic lawyers resurrect dead gods, souls are
  currency and divine contracts power cities. Technological analogy is not a scientific explanation. SF/Science fantasy fails
  at the root. This is an independent invented world, not a real-Earth historical setting; there is no verified Earth portal.
  Fantasy realms over Real earth and Portal.


  Fantasy realms siblings: Epic fantasy is a real rival, with large cities, invented gods, revolution, international power
  and the later cosmic crisis. The distinctive whole-fiction attraction is nevertheless necromancy organized as engineering,
  business, infrastructure and law, not generic scope. Sword and Sorcery overweights fighting; Fairytale fantasy has no governing
  inherited tale or fairytale grammar; Heart fantasy is not driven by romance, cozy community or a horse bond; Far shores
  fantasy mistakes invented cultural influences for the governing about-ness; Comic fantasy mistakes wit and financial satire
  for an absurd/comic engine. Gothic realms fits occult institutions, dead gods and their dangerous remains, soul extraction,
  monstrous powers, deathless corporate rulers and the threatening systems that contain people''s lives. This is not a claim
  of uniformly bleak tone.


  Within Gothic realms: Fantasy mystery captures the first novel''s investigation but not the whole universe''s civic systems,
  economy and later wars; Isolationist fantasy has no governing sealed-world confinement; Fantasy of manners lacks the British
  imperial gentlemen/class-performance frame; Dark realms captures dread but not the organized necromantic machinery as precisely.
  Technomancy specifically names actual magic through technological forms, including necromancy as engineering. The author
  calls the setting postindustrial fantasyland and likens it to cyberpunk with magic instead of technology. Independent Library
  Journal describes the latest volume''s distinctive magic system, falling markets and gods/corporations uniting against destruction.
  This is the same industrial-necromancy identity the owner recognized when he selected Technomancy for Dead Hand Rule on27September2026.


  Owner evidence: phonemsg-01M3HYHRJH9KZ4BY3CVB5YTCA4 proposes Technomancy for Dead Hand Rule; the following agent reply explains
  the existing Dead Country universe connection; phonemsg-01M3HYKDSZ8JKAM711RZZ4M5AE explicitly confirms placement. Verified
  original owner iMessages in the taxonomy conversation. Later one-shared-universe rule and individual-fiction judgment grant
  support consolidation, not structural change. This repairs duplicate fictions and incorrect earlier numbering, not a new
  leaf decision.


  ## Published scope

  1. Three Parts Dead,2012

  2. Two Serpents Rise,2013

  3. Full Fathom Five,2014

  4. Last First Snow,2015

  5. Four Roads Cross,2016

  6. The Ruin of Angels,2017

  7. Dead Country,2023

  8. Wicked Problems,2024

  9. Dead Hand Rule,2025


  Author says the original books share one universe and characters cross between them. His Craft Wars descriptions continue
  Tara, Kai, Caleb and that same world. The2025author interview confirms the planned trilogy grew to four books. Latest2026specialist
  news says final capstone still being drafted, rather than publishing on the old Fall2026schedule. No final title or published
  fourth volume verified in current publisher/author scope search; do not call the series complete or add a speculative placeholder.
  This is an ongoing series, not a newly queued standalone requiring a new reminder.


  The queued The Craft Sequence2023row is an omnibus, not another novel. Original six novels are separately counted. A Kiss
  with Teeth, Crispin''s Model, The Angelus Guns and The Scholast in the Low Waters Kingdom are separately published short
  fiction/chapbooks, excluded by the standing form rule. No their speculative elements used to steer included novels. Existing
  This Is How You Lose the Time War is outside this reconciliation.


  ## Cover curation

  Nineteen author/publisher exact-front candidates visually inspected together. First five use detailed Chris McGrath character/city
  paintings (credit verified in Reactor''s series cover article), with Last First Snow more monochrome. Ruin uses the colorful
  fantasy-city artwork; Craft Wars uses bright intricate fantasy illustration. Select larger publisher fronts of the same
  art where available. The fiction uses first novel art plus mandatory series-title overlay, not an omnibus falsely implying
  it contains allnine. Every selected book cover visibly carries its English title; fiction flagfalse because firstbookfront
  does not carry the wholefiction name. Cover hotlinks only, no bytes committed. Exact candidate URLs, edition sources, ratings
  and reasons retained per book.



placement_rationale: 'Root-down (2026-11-18 re-walk): Speculative fiction > Fantasy > Fantasy realms > Gothic realms > Fantasy mystery > Private-eye fantasy. Raine Benares is a seeker - a sorceress hired to find lost things and people, working cases for clients in an invented world in a wisecracking first-person voice: the leaf''s gate (a hired gumshoe working cases for clients). Garrett P.I. and Eddie LaCrosse are the shelf neighbors. The Saghred bond gives the nine novels their connective arc, the same shape as the Fetch Phillips series arc. Moved out of Caper fantasy on the curator''s direction (phonemsg-01M7QBJCFS32SPR9JJ0ZNWMJQF, phonemsg-01M7QC0JAV7SJCPSTEFHBZD4DD, 2026-11-18): she runs cases, not scores. Rejected: detective-fantasy (no office or official duty - seekers work for hire), caper-fantasy (the cons are casework, not one big job).'

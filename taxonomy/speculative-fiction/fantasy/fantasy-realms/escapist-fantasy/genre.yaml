id: escapist-fantasy
label: Escapist fantasy
parent: fantasy-realms
definition: 'Fantasy whose reader contract is emotional refuge rather than dread: the anti-grimdark modes of invented-world
  fantasy that promise warmth, safety or a guaranteed heart - low stakes or a love that will carry. Umbrella for the mood-modes:
  cozy fantasy, romantasy and whatever their heirs become. Coined by Gustav Söderström on 2026-09-27; ''escapist'' is the
  critic''s own descriptor for exactly this family, sneer included.'

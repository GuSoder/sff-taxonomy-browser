placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Romantasy > Bonded romantasy > Duty bond
  romantasy. Grace Curtis, Idolfire (DAW, hardcover 11 March 2025; the candidates list says 2026, which is the 3 March 2026
  paperback; PRH): Aleya Ana-Ulai, written off by her family, and Kirby of Wall''s End, whose life an ancient curse tore apart,
  are set by fate on the road to Nivela, a city that once held a thousand stolen gods and whose old magic sleeps; PRH calls
  it an epic sapphic science-fantasy road trip with sword fights and a slow-burn romance. Rejected: Revisionist quest (9,
  runner-up: the quest is the frame, but the road is shared and the pair''s closeness is the arc), Fairytalesque quest (9),
  Revival quest (9), Humble origins and Hidden heir (no marked-one destiny). Wobble: moderate to high. PRH leads with the
  road trip and the faith-and-history themes, and calls the romance slow-burn, so the romance may be a thread, not the spine;
  that would put it on a quest leaf and not in romantasy. Plot from publisher copy, not the book. Cover is the PRH hardcover
  jacket, seen. Queue id MC03516.'

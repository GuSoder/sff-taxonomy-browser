definition: 'Romantasy where the lovers start tied together by something imposed, not chosen: a soul-bond, an arranged marriage,
  a crossroads bargain, a curse and its prophecy, or one shared duty. The romance is the pair learning to live inside the
  tie, with the external stakes bound up in it. Not Enemies-to-lovers romantasy (there the pair start on opposed sides). Split
  2026-10-04 from Romantasy at ten cards (curator "Approved", 2026-10-04 8:44 PM (phonemsg-01M443PQET983J8VEJNKHCVEHG), after

placement_rationale: 'Imogen Nel, a hidden Siren, and the neighbouring king Theodore form a protective blood bond that ties
  them together, then flee and fight through undead seas while duty and desire blur; the second book follows her as queen
  with a corrupted bond to an ancient deity. The romance is the pair learning to live inside an imposed tie. Walked root-down:
  Fantasy -> Fantasy realms -> Romantasy -> Bonded romantasy. The related gothic fantasy The Long Night Looms (2027) is held
  as unpublished.'

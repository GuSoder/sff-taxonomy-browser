placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Romantasy. Poet Lilun and starkeeper Ranra fall in love while
  trying to save Gelle-Geu from its unstable underwater star; publisher expressly centers new love and their alternating intimate
  arcs are co-equal with the catastrophe. Deepnames supply rule-bound collective magic, but the romantic relationship is the
  plot''s spine, not a technical system-solving epic alone. Neither an inherited real-Earth mythology nor cozy safety: invented
  Birdverse cosmology with bittersweet disaster. Birdverse is a shared setting with different protagonists, not one continuous
  series card.'

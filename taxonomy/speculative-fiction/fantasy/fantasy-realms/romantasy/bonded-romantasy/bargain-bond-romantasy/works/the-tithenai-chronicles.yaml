placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Romantasy > Bonded romantasy. One duology
  in one world (The Tithenai Chronicles, Tor; ISFDB series number 2 for All the Hidden Paths), so one fiction (rule 11j).
  Per Tor and Publishers Weekly: Velasin vin Aaro is forced into a diplomatic marriage to a woman from the enemy kingdom of
  Tithena, flees it by marrying Caethari Aeduria instead, and the two start as husbands tied by an arranged political marriage;
  the love story, trauma and trust between them run co-equal with the court plot, and the sequel follows the newlyweds. Tor
  and PW sell it as fantasy romance with Byzantine politics. The imposed marriage is the bond, which is the Bonded romantasy
  definition (arranged marriage). Rejected: Crown enemies romantasy (the couple is not divided by the crown), Dynastic and
  Court intrigue leaves (the romance is the spine, not the politics). Wobble: Crown enemies romantasy for the first book''s
  enemy-kingdom setup.'

definition: 'Enemies-to-lovers romantasy where the lovers are rivals: peers set against each other in a feud, a contest or
  a long competition - rival journalists, a marshal and an undertaker, a hero and a villain staging a feud, rival magicians
  called back to court. The enmity is personal. Not Crown enemies romantasy (the beloved is the ruler or the ruler''s instrument),
  not Enemy lines romantasy (opposed sides of a war, treaty or coven). Split 2026-10-05 from Enemies-to-lovers romantasy at

placement_rationale: 'Full root-down walk: Fantasy (the invented realm of Tira, dragons and gryphons) > Fantasy realms > Romantasy,
  not Epic fantasy (a Pride and Prejudice retelling in which the romance arc is the spine, co-equal with the dragon-hunting
  stakes; the author site pitches it as ''Pride. Prejudice. Monsters. Marriage.'') > Enemies-to-lovers romantasy, not Bonded
  romantasy (Aliza Bentaine and Lord Alastair Daired are tied by nothing imposed; they start by misjudging each other) > Rivals-to-lovers
  romantasy, not Crown enemies (Alastair is a lord and dragon-hunter, not a crown) and not Enemy lines (no war divides them):
  two proud peers, set against each other by pride and prejudice across the dragon hunt. Weak card: in Dragonshadow and Flamebringer
  the pair are already married, and the monster-hunt adventure carries the series (author site https://www.ellekatharinewhite.com/books-dragonshadow).'

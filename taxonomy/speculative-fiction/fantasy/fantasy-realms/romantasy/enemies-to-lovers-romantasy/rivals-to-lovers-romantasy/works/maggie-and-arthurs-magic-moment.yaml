placement_rationale: 'Leslie René''s Maggie and Arthur''s Magic Moment (Ace, 28 July 2026; PRH, Library Journal, Fresh Fiction,
  two reviews): in a secondary world modelled on the mid-Atlantic, Maggie Linden, a Linguistics and Incantation Translation
  professor at Hawthorn College, is forced to share her office with the brooding alchemist Arthur Taliesin, the man whose
  lab accident set loose a haunting magic called a pall and made the building uninhabitable, and the two rival colleagues
  must stop the magic together; the romance is the spine. Walk: Speculative fiction > Fantasy > Fantasy realms > Romantasy
  > Enemies-to-lovers romantasy > Rivals-to-lovers romantasy (academic peers set against each other). Rejected: Magic school
  (the craft is taught to young students; here the leads are faculty), Occult institutions (secondary world, not modern occult),
  Duty-bond romantasy (the tie starts as rivalry; the shared task comes after). Wobble: medium, forced proximity could point
  to Duty-bond. Sources: PRH, Library Journal, Fresh Fiction, two reviews; not read in full.'

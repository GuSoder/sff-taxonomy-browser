placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Dark Realms -> Gothic fantasy. Starling says the setting
  is similar to but not Victorian England: Great Bretlain is a Britain cipher with its own postwar history and dismantled state religion. PW calls
  it secondary-world Gothic fantasy; the haunted manor, ghosts, dark magic and atmosphere govern more than action.'

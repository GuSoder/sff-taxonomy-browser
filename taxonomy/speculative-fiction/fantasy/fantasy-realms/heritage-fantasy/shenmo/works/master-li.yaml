placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Heritage fantasy -> Shenmo. Penguin Random House grounds an
  ancient China that never was, a Heaven-disturbing ancient crime, wonders and mythic coincidences; the trilogy uses ghosts, gods, monsters and Chinese
  folklore rather than martial training or combat as its organizing engine. This is the gods-and-demons line, not Wuxia.'

first_published: 2014
canonical_genre: political-fantasy
placement_status: accepted
placement_rationale: >-
  SFE identifies a secondary-world fantasy sequence whose gods have been killed. Penguin Random House traces the trilogy through conquest, colonial rule, diplomacy and espionage, sectarian revolt, political assassination and a secret war over surviving divine power. Investigations drive individual volumes, but empire and its aftermath shape the whole completed trilogy, making Political fantasy closest.

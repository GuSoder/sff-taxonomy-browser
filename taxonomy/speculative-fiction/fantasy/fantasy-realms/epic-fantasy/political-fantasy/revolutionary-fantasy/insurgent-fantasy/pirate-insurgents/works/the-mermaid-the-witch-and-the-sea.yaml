placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Political fantasy
  -> Revolutionary fantasy -> Anti-colonial fantasy. Candlewick explicitly sets the magical maritime story in a world divided
  by colonialism: an Imperial daughter bound for a forced marriage in colonized islands encounters pirates, slavery, stolen
  memories and mermaid blood. Imperial domination, captivity and resistance govern. Split walk 2026-10-08 (phonemsg-01M4DV2P28N33JQ0KAPP73W1YM):
  Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary fantasy > Insurgent
  fantasy > Pirate insurgents. An Imperial daughter bound for a forced marriage in the colonized islands falls in with pirates,
  slavery and stolen memories (Candlewick); pirate crews undermine the empire''s ships at its edge.'

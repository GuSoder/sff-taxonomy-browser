placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Insurgent fantasy > Palace insurgents. Kaner, 2026 (HarperVoyager UK July 2026, US 8 September 2026): Tilde, last
  heir of a conquered kingdom, hears the kithwood and her ancestors, and is married to the warlord King Liran, the Swan King,
  who took her homeland, to bear him a son; she goes into his court meaning to kill him and win her kingdom back, with forbidden
  power of her own, while his sons plot against her and his daughter Elise divides her loyalties; a Wild Swans reimagined
  from the witch''s side (HarperCollins press release; Google Books description). Rejected: Court statecraft, Court spies
  and the Dynastic leaves (the leaf test says the court survives and the contest is who holds the crown; here the conquered
  woman enters to destroy the conqueror''s rule from inside), Vengeance war fantasy (no war is waged, the weapon is marriage
  and the court), Usurper and Regicide fantasy (the king''s death is the aim but not the book''s event), Fairytale villain
  inversion and Fairytale expansion (Wild Swans is the seed, not the engine). Palace insurgents holds the conquered infiltrating
  the conqueror''s court, as in The Masquerade. Wobble: moderate. Series opener of a trilogy, so the leaf could change as
  volumes arrive; plot from the publisher, not the book. Year 2026 (HarperCollins). Cover is the HarperCollins US jacket.
  Queue id MC03669.'

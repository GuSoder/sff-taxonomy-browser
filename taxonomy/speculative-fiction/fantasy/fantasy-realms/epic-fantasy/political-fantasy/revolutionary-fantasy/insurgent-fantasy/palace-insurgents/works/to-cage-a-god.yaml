placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Insurgent fantasy > Palace insurgents. Per Kirkus and Publishers Weekly: in an empire where the alurea ruling
  class channel bonded dragon-gods (zmei), the commoners Galina and Sera, secretly bonded themselves, were part of a rebel
  plan to infiltrate Empress Isidora''s court and now plot to overthrow her. Subversion worked from the seat of power is the
  Palace insurgents definition. Rejected: Rebel fantasy (the plot is conspiracy against one court, not open revolt by an occupied
  people), Dynastic spy games (the aim is to end the empress''s order, not to win the crown for a house). WEAK CARD: classed
  from the Kirkus and publisher copy only, not the text; the later plot could read as a coup rather than anti-imperial subversion,
  and the colonizer/colonized frame is class, not occupation. Year 2024 (DAW), book one of These Monstrous Gods.'

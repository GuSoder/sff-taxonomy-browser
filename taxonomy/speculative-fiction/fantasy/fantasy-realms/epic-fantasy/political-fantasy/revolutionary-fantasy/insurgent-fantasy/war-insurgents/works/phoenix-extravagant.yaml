placement_note: 'An artist in occupied Hwaguk, colonized by the Razan empire and stripped of its magic pigments, is conscripted
  to paint for the occupier''s dragon automata and joins the resistance; anti-colonial fantasy per core premise. Strange Horizons
  calls it Lee''s first full-length fantasy, set in an alternate version of Korea. Shelfmates Tigana and The Books of Ambha.
  Split walk 2026-10-08 (phonemsg-01M4DV2P28N33JQ0KAPP73W1YM): Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Political fantasy > Revolutionary fantasy > Insurgent fantasy > War insurgents. Gyen Jebi, a painter in occupied
  Hwaguk, is recruited by the Ministry of Armor to paint the sigils that animate the occupier''s automaton soldiers, then
  turns that work against the empire (Simon & Schuster, Publishers Weekly). WEAK CARD: it sits here on credit - Jebi is a
  drafted artist, not a soldier, so War insurgents is the loose fit; the stored rationale predates the Insurgent audit and
  no walk record existed until this one.'

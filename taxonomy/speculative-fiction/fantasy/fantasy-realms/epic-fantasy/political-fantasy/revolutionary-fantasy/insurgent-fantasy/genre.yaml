definition: 'Insurgent fantasy of subversion from within: agents, officials and insiders who work the imperial machine against
  itself through infiltration, conspiracy and turning. Resistance-mode test: if the colonized fight the empire in open revolt,
  it is Rebel fantasy; if the story''s resistance works by subversion from within the imperial order (infiltration, conspiracy,
  turning), it is Insurgent fantasy. Umbrella since 2026-10-08, partitioned by where the subversion works: Palace insurgents
  (the seat of power), War insurgents (the imperial war machine), Academy insurgents (the empire''s schools), Pirate insurgents
  (the empire''s edge).'
status: umbrella
history:
- date: '2026-09-25'
  change: Anti-colonial fantasy umbrella dissolved (the curator ruling phonemsg-01M3D6BN40R19Y8KGXB8P9898Y); lifted directly

placement_rationale: Penguin Random House describes the opening as a ruthless game of politics and intrigue over control of a prophesied Queen, fought with magic and betrayal. The twelve-book sequence repeatedly contests coercive matriarchal rule and the remaking of that order, placing its political struggle closest to Revolutionary fantasy.

placement_rationale: 'Penguin Random House (penguinrandomhouse.com/books/58994/ironhands-daughter-by-david-gemmell/ and /series/THQ/the-hawk-queen/):
  the highlanders are a conquered people under the Outlander baron Gottasson, and prophecies name a descendant of Ironhand
  as the new leader who will throw off the yoke; Sigarni, the only one with Ironhand''s blood, is that figure. In book 2 she
  crosses a gate into a parallel version of her universe to help the clans against the Aenir. The prophesied figure around
  whom the order breaks is the governing frame, so Messianic fantasy; soft because book 2 turns to war and a portal quest.
  Walk: Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary fantasy > Messianic fantasy.'

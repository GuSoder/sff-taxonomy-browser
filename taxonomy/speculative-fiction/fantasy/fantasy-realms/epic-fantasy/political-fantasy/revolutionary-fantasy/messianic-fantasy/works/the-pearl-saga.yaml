id: the-pearl-saga
title: The Pearl Saga
authors:
- Eric Van Lustbader
first_published: 2001
canonical_genre: messianic-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary fantasy > Messianic
  fantasy. Actual Kundalan sorcery, a creator goddess, dragons and released daemons are distinct from the V’ornn invaders’
  technology, so the fantasy engine is not merely scientific machinery wearing a magical surface. Riane, the Dar Sala-at,
  is the prophesied savior around whom the enslaved Kundalans’ liberation and resistance gather; Publishers Weekly explicitly
  describes her destiny to lead their uprising. The Ring, Veil and Pearl quests serve that deliverance, not Annon reclaiming
  his noble birthright, a party’s road alone, or a chronicle of invented gods. Sacred calling does not by itself prove the
  protagonist’s primary power is clerical; the political role supplies the firmer whole-saga fit. Three published novels:
  2001, 2002 and 2003; Mistress of the Pearl is the 2004 US title of the 2003 UK novel The Cage of Nine Banestones, not an
  extra volume. Planned later volumes are not included.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Messianic fantasy. Whole-six-novel correction approved 2026-10-29, phonemsg-01M635G9RJZMJNPCH83H3A0S8S, responding
  to proposal phonemsg-01M6352Q47H0WCZEM4YKZKN1GJ. Invented Lok, not historical India or an Earth-crossing story. Across Son
  of the Black Sword, House of Assassins, Destroyer of Worlds, Tower of Silence, Graveyard of Demons and Heart of the Mountain,
  the caste rebellion gathers around Thera and her prophecy. Correia explicitly describes Ashok''s vow to protect this prophet
  and rebellion leader, and calls the books one continuous story. Changing the caste order is the governing whole-fiction
  conflict, not merely Ashok''s personal combat or unit campaigns. Messianic rather than Overthrow/Proletariat: sacred leadership
  organizes the class uprising. Not foreign-occupation Rebel, official-cover Insurgent, covert-rescue Outlaw or Emancipation
  without a mass sacred movement. Original Outcast rationale relied too much on opening-volume status. Sources: https://paulsemel.com/exclusive-interview-destroyer-of-worlds-author-larry-correia/
  ; https://www.baen.com/destroyer-of-worlds.html ; https://www.baen.com/tower-of-silence.html ; https://www.simonandschuster.com/books/Graveyard-of-Demons/Larry-Correia/Saga-of-the-Forgotten-Warrior/9781668073025
  ; https://www.simonandschuster.com/books/Heart-of-the-Mountain/Larry-Correia/Saga-of-the-Forgotten-Warrior/9781668072394
  . Six-book list and bibliographic metadata unchanged.'

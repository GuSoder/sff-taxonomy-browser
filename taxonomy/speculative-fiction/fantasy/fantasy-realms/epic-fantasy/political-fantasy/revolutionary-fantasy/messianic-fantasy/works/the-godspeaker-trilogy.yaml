placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Messianic fantasy. Hekat, sold as a slave, rises to Empress of Mijak because the god speaks her: she is godspoken,
  the divinely marked figure who becomes the political force remaking Mijak and then waging the god''s war on the world (Empress,
  The Riven Kingdom, Hammer of God; Wikipedia bibliography; Aurealis-honoured). Queue rows MC05226/27 folded with unlisted
  The Riven Kingdom as series completion. The leaf''s definition verbatim: a divinely marked, prophesied or sacred figure
  becomes the political force. Rejected: Dynastic wars (she founds the power rather than contesting a succession), Military
  fantasy (campaigns serve the god''s purpose), Cleric hero (she does not serve a deity; the deity serves her claim). Wobble:
  real; her ruthless rise brushes overthrow-fantasy, but the god''s choosing is the engine.'

placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Messianic fantasy. PRH grounds Deka’s divine origin, her freeing of goddesses, power to remake the world and final choice to become a god or end the world. A divinely marked heroine becomes the force around which empire, war and existing order break, so Messianic fantasy governs.'

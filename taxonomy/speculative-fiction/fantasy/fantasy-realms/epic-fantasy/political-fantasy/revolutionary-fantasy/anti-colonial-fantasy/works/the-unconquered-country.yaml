placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy. SFE calls the setting a transfigured Cambodia and centers a young woman exploited by industrial womb-rental amid invasion; living houses and grown machinery make the colonized country fantastic, while occupation and survival govern.'

placement_note: An artist in occupied Hwaguk, colonized by the Razan empire and stripped of its magic pigments, is conscripted to paint for the occupier's dragon automata and joins the resistance; anti-colonial fantasy per core premise. Strange Horizons calls it Lee's first full-length fantasy, set in an alternate version of Korea. Shelfmates Tigana and The Books of Ambha.

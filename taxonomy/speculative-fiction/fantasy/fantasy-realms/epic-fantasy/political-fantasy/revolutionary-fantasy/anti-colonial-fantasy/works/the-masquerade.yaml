placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy. Gustav Söderström explicitly ruled The Monster Baru Cormorant into Anti-colonial fantasy on 2026-09-22: reader experience governs for this secondary-world geopolitical epic despite no confirmed actual magic. Tor centers colonized Baru infiltrating the Empire of Masks to destroy it, triggering war against the imperial order. Anti-colonial resistance governs the series.'

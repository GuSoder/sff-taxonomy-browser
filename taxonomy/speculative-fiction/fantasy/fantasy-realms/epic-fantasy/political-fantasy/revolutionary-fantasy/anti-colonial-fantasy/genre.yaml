definition: 'Revolutionary fantasy in which conquered or colonized peoples resist occupation, imperial domination, cultural erasure, or the political aftermath
  of empire, divided by how the resistance fights. Resistance-mode test: if the colonized fight the empire in open revolt, it is Rebel fantasy; if the story''s
  resistance works by subversion from within the imperial order (infiltration, conspiracy, turning), it is Insurgent fantasy.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy ->
  Anti-colonial fantasy. Candlewick explicitly sets the magical maritime story in a world divided by colonialism: an Imperial daughter bound for a forced
  marriage in colonized islands encounters pirates, slavery, stolen memories and mermaid blood. Imperial domination, captivity and resistance govern.'

placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Emancipation fantasy.
  Divine Spice Gates connect eight invented kingdoms and compel branded gatecaste Carriers into painful, untouchable labor. Amir seeks family escape, but his journey
  and discovery turn toward breaking the system that reproduces bondage. Author calls it a quest for emancipation from social injustice; Scroll confirms the anti-caste
  endpoint. Neither portal travel from Earth nor a marked heir rise: the caste mark is oppression, and Mouth initially assigns Amir to preserve the order. No verified
  mass uprising, occupier revolt, state-insider subversion or hunted-class rescue engine. Katha cultural cosmology and Revisionist quest are alternatives, but curator
  chooses emancipation as about-ness. Original iMessage 2026-09-30 12:37:55 "Ok, execute on that leaf then" answers the proposed Emancipation fantasy leaf after Katha
  comparison.'

placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Political fantasy
  > Revolutionary fantasy > Emancipation fantasy. Dragon Temple saga: Zarq Darquel, a peasant
  on a dragon estate, is born into the double caste the Temple''s law fixes - peasant, and
  woman, forbidden property and the dragonmaster''s role. Across the trilogy she breaks that
  machinery: addicted to the hallucinogenic venom that makes her a vessel for the dragons''
  ancestral memories, she claims the denied dragonmaster role (book 2) and seeks the secret
  to overthrow the corrupt Temple itself (book 3: "she does not see herself as a revolutionary,
  but her enemies give her no choice"). Emancipation, not a mass rising of the lower orders,
  is the engine, so not Proletariat fantasy (author site book pages, PRH series page).'

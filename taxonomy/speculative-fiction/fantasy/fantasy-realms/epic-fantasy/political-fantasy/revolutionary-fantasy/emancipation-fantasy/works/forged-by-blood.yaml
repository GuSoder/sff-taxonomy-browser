placement_note: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary fantasy > Emancipation fantasy. In Ife, the magic-wielding Oluso are enslaved and hunted to genocide by the nonmagical Aje regime; Demi, an Oluso blood-magic wielder, kidnaps crown prince Jonas to bargain an end to the slavery of her people - people born into bondage seeking freedom by breaking the social machinery that makes them unfree; emancipation, not open revolt or rescue network, is the engine (Wikipedia plot summary; publisher copy; Subjectify interview 2023-08-07). Duology: Forged by Blood (2023), Exiled by Iron (2024) - covers read Book One/Two of the Forged by Blood Duology.'

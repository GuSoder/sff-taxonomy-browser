placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Rebel fantasy > Tinderbox fantasy. One trilogy (Shattered Kingdoms) in one world, so one fiction (rule 11j). Blood''s
  Pride (PW, Reactor): the Norlanders, albino telepathic warriors, conquered the fisherfolk Shadari and work them in the dark-ore
  mines; the Shadari rise against the garrison and the fortress city becomes the battlefield. That is open revolt against
  an occupying empire (Rebel fantasy), and the revolt ignites in the occupied city (Tinderbox). Rejected: Samizdat (the fight
  is not for an erased name or text), Insurgent and Emancipation (the engine is armed revolt, not subversion from within or
  breaking a bondage machine), Overthrow (a foreign occupier, not internal rebellion). Wobble: the later books widen to war
  between kingdoms, so Military fantasy is the second reading. Covers: Blood''s Pride and Fortune''s Blight from Open Library,
  Strife''s Bane from Hachette UK (Open Library''s copy is a blank title page).'

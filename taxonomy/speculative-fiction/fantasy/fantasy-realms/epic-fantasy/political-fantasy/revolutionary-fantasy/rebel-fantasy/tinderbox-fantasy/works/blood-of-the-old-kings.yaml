placement_rationale: 'Actual-tree walk: Fantasy -> Fantasy Realms -> Epic fantasy
  -> Political fantasy -> Revolutionary fantasy -> Rebel fantasy -> Tinderbox fantasy.
  The Bleeding Empire series: provincial struggle against imperial domination told
  as a character mosaic - avenger with a dragon, teen sorcerer, spycraft, open revolt
  against the empire (sfintranslation; Reactor). Same resistance engine as City of
  Last Chances (occupied people pushed to open revolt), the curator-approved tinderbox
  precedent.'

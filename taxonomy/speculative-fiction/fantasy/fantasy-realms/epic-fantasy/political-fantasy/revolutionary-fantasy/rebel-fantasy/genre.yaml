definition: 'Rebel fantasy of open resistance: peoples under imperial rule, including an empire''s own subjects, take up arms,
  magic and common cause against imperial domination. Resistance-mode test: open resistance across communities belongs here;
  subversion organized through turning the imperial machine from within belongs to Insurgent fantasy. Partitioned by governing
  resistance engine: Samizdat fantasy (erased culture and memory), Tinderbox fantasy (the occupied-city street rising), Evil
  empire fantasy (wider resistance against systematic imperial terror and control). The broadened subject scope was explicitly
  approved 2026-11-05; inherited children keep their own narrower gates.'

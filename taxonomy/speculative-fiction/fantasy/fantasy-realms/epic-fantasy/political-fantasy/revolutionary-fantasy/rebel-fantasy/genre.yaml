  it is Insurgent fantasy. Umbrella since 2026-09-26: split-with-umbrella into Samizdat fantasy and Tinderbox fantasy by resistance engine (Gustav ruling phonemsg-01M3E8956VEW8AJ2Y7D9JVSQA1).'

status: accepted
definition: Rebel fantasy in which an empire maintains rule through systematic terror, exploitation or coercive control over
  its subjects' bodies, lives or beliefs, and resistance to that imperial system spans its lands and social orders. Separate
  communities and factions open different fronts and make common cause against the machinery of domination. Not merely a cruel
  individual ruler or an incidental alliance. Not Tinderbox fantasy, whose governing pressure and eruption stay with an occupied
  city's streets; not Samizdat fantasy, whose governing struggle preserves an erased culture, name or rite; not Insurgent
  fantasy when turning one part of the imperial machine from within is the governing lens. No requirement that the empire's
  entire constitution is dismantled at the ending.

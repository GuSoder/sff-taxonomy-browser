placement_rationale: 'Root-down: Orbit and SFE establish an internally realized West-Africa-inspired epic world, with violent conquest, the Bassai elite''s
  suppression of outlander histories and magic, an empire''s collapse, and the resistant Nameless Republic confronting a conquering power. This passes Fantasy
  -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy; forbidden magic enables the struggle, while
  imperial domination, erased histories and resistance govern it.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Rebel fantasy > Samizdat fantasy. Ligea Gayed, a top agent of the Brotherhood, the spy network of the Tyranian
  Empire, is sent to find a rebel leader in Kardiastan, where Tyrans has pushed out the Magor ruling class, and finds that
  her own origins were stolen and that the person who raised her killed her family; she turns against the Empire (Shadow of
  Tyr), and her son Arrant takes his place as Mirager-heir in Song of the Shiver Barrens (author''s site, glendalarke.com).
  Three books (Heart of the Mirage, The Shadow of Tyr, Song of the Shiver Barrens) are one fiction under rule 11j. The rebellion
  is for an erased heritage, name and people, which is the nearest to the leaf''s definition (the resistance fights for an
  erased history). Rejected: Palace insurgents (Ligea serves the empire''s secret service but does not infiltrate a court
  to bring it down), Tinderbox fantasy (the revolt is not street riots in an occupied city), Court spies (the spying is the
  setup, not the story), Khayal (the setting draws on Rome and the Arabian Nights, not Arabic and Islamic cultures). Wobble:
  strong; the third book is about the Ravage and the Mirage Makers'' collective mind as much as resistance, and Samizdat is
  aimed at forbidden texts and memory, which only the stolen-origins thread matches.'

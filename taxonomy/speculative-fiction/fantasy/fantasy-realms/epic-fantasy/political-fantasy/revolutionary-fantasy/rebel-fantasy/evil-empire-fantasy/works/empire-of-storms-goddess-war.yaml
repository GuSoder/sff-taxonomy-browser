placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary fantasy
  > Rebel fantasy > Evil empire fantasy. One shared world, six novels across Empire of Storms and Goddess War: resistance
  to biomancer domination grows from street gangs through pirate and court fronts; occupied Izmoroz and Raiz resist imperial
  conquest through separate political, military and magical fronts. Curator-approved Evil empire seed and Rebel scope widening,
  2026-11-05. Exact final overthrow mechanisms not independently established; placement is by sustained resistance, not a
  claimed common ending.

  Curator Approved phonemsg-01M6PPVJW7A9SR7WZTTXFCJJS9 (2026-11-05 21:36:55 CET) on served seed phonemsg-01M6PPTVYMHK32JQGQ00DV3B87
  and explicit axis/parent widening phonemsg-01M6PPTY4TDKTG7YDTQK1AHV08; name supplied by curator phonemsg-01M6PPRMHAN041VVB1M7TVEYCF.

  Whole-six walk: invented magical world, not Earth/portal/SF. Epic political resistance across equal warrior/thief/mage/ruler
  viewpoints, not one class, a party-bound road, magic-rule discovery or uniform army campaign. Criminal/pirate adventures
  govern some Empire strands but not Goddess. Anti-colonial Goddess and domestic Empire previously straddled the old Rebel/Overthrow
  partition; explicit widening now resolves it. Samizdat cultural erasure, Tinderbox occupied-city streets, imperial insider
  sites, fugitive rescue, class emancipation and sacred leadership each privilege only strands. New leaf follows sustained
  wider resistance to systematic imperial control. Shared world established by official Wizard prologue globe survey of island
  life-twisters/swordmasters, Blood preview Jackal Lord undead, and completed readers recognizing the tie-in; no explicit
  creator continuity statement found. Publication years and all six English print fronts checked. No claim to have independently
  read the exact endings or to know a common final bargain mechanism.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy ->
  Anti-colonial fantasy. Hachette/Orbit describes an India-inspired epic fantasy in which an imprisoned princess and a priestess with forbidden magic unite
  to change an empire; the Hirana was the conquered Ahiranyi source of magical deathless waters, and Priya’s hidden people resist imperial erasure. Empire,
  resistance and liberation organize the fantasy.'

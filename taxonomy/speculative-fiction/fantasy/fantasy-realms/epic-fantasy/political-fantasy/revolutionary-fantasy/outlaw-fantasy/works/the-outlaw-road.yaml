placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Outlaw fantasy. One duology (Outlaw Road per ISFDB and the author''s site), one fiction. Per Publishers Weekly,
  Lit Hub and the author: Lark, the Sunshield Bandit, is a former slave and outlaw who protects a cobbled-together family
  of escaped bond servants and slaves; the second book follows her and unlikely allies working to end inequality in Moquoia.
  A criminalized class of escaped servants and a hidden family that shelters them is the Outlaw fantasy gate, and the leaf
  definition accepts the Robin Hood pull. Rejected: Emancipation fantasy (freedom comes by breaking the machinery of bondage,
  which the second book edges toward but the duology''s engine is the outlaw''s shelter), Proletariat fantasy (not a class
  rising), Tinderbox fantasy (no occupied-city revolt). Wobble: Floodpath turns toward ending inequality outright, which pulls
  to Emancipation fantasy. Years follow ISFDB, 2020 and 2021.'

placement_rationale: 'Seed card (the curator, 2026-09-28): in the Morning Realms magicians are outlawed
  on pain of death - enchantments forbidden on a 20-year-old pretext (PW) - and the Guardians of the Dawn
  are ''a rebel group that smuggles magicians to safety'' (SLJ). The state is the persecutor; the network''s
  engine is rescue, not revolt, subversion or uprising.'

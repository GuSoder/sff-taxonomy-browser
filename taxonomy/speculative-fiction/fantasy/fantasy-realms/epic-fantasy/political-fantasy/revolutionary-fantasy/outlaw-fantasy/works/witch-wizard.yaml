placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary fantasy > Outlaw fantasy. Wikipedia (''dystopian fantasy novels''): the New Order regime charges people with witchcraft; teen siblings Whit and Wisty Allgood show magical abilities, are sentenced to execution at eighteen, escape through the Shadowland to Freeland, a haven for persecuted children, and lead the Resistance ''willing to sacrifice anything to save kidnapped and imprisoned kids'' (The Gift). The state criminalizes a class of people and a covert network hides and smuggles them to safety - the leaf''s exact gate (criminalized class plus rescue engine). Rejected: Rebel fantasy children (samizdat = erased-name resistance, no; tinderbox = occupied-city street uprising, no), Insurgent fantasy (not subversion from within the machine). Wobble: mild - the prophecy thread makes the siblings the regime''s prophesied Liberators (overthrow arc in The Fire), but the fugitive/rescue engine dominates. YA, eligible. Series card, five books per Wikipedia. Queue ids MC04242, MC04243, MC04245, MC04247, MC04251, MC04252.'

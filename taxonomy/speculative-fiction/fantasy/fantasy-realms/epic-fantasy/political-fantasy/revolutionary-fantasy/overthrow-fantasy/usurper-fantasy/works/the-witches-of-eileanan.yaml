placement_rationale: 'In Eileanan, witchcraft was outlawed on the Day of Reckoning after the sorceress Maya the Ensorcellor
  bewitched the Righ and turned him against the Coven; the Witch Towers lie in ruins and the rebels, the Arch-Sorceress Meghan
  and the twin heirs Isabeau and Iseult, work to unseat her, free the lost Lodestar and bring magic back (PRH series page;
  Forsyth''s site; Locus Best First Novel). Walk: Fantasy (invented land, real magic) > Fantasy realms > Epic fantasy > Political
  fantasy > Revolutionary fantasy > Overthrow fantasy (a state remade from within, not freed from a foreign occupier) > Usurper
  fantasy (a false ruler holds the throne by enchantment and the rebels'' task is to unseat her). One universe, one card (rule
  11j): six Witches of Eileanan novels 1998-2002 plus the three Rhiannon''s Ride novels 2004-2006 set in the same land (encyclopedia.com;
  ultimatefantasyranking). WOBBLE, honest: Rhiannon''s Ride is apprentice-witch and necromancer plots after the regime''s
  fall, a weaker fit; the card is placed on the series that defines the fiction. Source: publisher and author pages; not read.'

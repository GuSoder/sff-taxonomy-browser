placement_rationale: 'Root-down: Fantasy > Fantasy realms (invented Kisia) > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Overthrow fantasy > Vengeance war fantasy. Per Hachette/Orbit: ''The war for the Crimson Throne has split Kisia.
  In the north Otako supporters rally around their champion, but Katashi Otako wants only vengeance'' (The Gods of Vice page)
  and ''An empire on the edge of war threatens to crumble... They call him the Usurper'' (shop.hachettebookgroup.com, The
  Blood of Whisperers). The massacred Otako house''s survivor wages war on the usurping dynasty and the war is the payback:
  the leaf''s definition. Rejected: Palace insurgents and Dynastic spy games (the engine is vengeance pursued through war,
  not court maneuvering), Military fantasy branch (the dynastic vendetta, not the campaigns, carries the series). Soft: book
  1 opens at the court of an empire only ''on the edge of war'' (Hachette), so the war engine fully ignites later in the trilogy.
  One card; Orbit reissues Aug 2020 after the self-published originals (devinmadson.com: she began self-publishing in 2013).
  Years are first publication per Open Library: 2013, 2013, 2018.'

placement_rationale: 'Leena Likitalo''s Waning Moon Duology (The Five Daughters of the Moon 2017, The Sisters of the Crescent
  Empress 2017; PW, Macmillan, Apple Books): a secondary world modelled on the Russian revolution, where the Crescent Empress
  rejects the Gagargi Prataslav''s soul-powered Great Thinking Machine, he turns to the restless masses, the Empress is murdered
  and her five daughters are exiled north while civil war tears the empire. Walk: Speculative fiction > Fantasy > Fantasy
  realms > Epic fantasy > Political fantasy > Revolutionary fantasy > Overthrow fantasy (internal mass revolution) > Regicide
  fantasy (the ruler''s murder is the event the story turns on). Rejected: Proletariat fantasy (the lens is the imperial family,
  not the rising poor), Usurper fantasy, Vengeance war. Wobble: medium, Proletariat fantasy. Duology folded into one card.
  Sources: PW, Macmillan, Apple Books; not read in full.'

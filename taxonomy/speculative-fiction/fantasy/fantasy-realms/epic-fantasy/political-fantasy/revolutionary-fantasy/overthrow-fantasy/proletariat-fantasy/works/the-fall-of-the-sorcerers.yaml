placement_rationale: 'Lawrence Watt-Evans''s The Fall of the Sorcerers (A Young Man Without Magic 2009, Above His Proper Station
  2010; Kirkus, PW, author site, ISFDB): in the Walasian Empire every noble is a sorcerer, famine and civil strife spread
  and the poor riot for food in the capital Lume while the nobles perform human sacrifice to restore the land; Anrel Murau,
  the magicless son of two sorcerers, is drawn into his radical friend''s cause and becomes the notorious revolutionary orator
  Alvos, a fugitive, and in book two hides in Lume''s Pensioner''s Quarter as the empire''s unrest builds; Watt-Evans''s note
  and a reviewer read it as a Sabatini-style French Revolution tale. Walk: Fantasy realms > Epic fantasy > Political fantasy
  > Revolutionary fantasy > Overthrow fantasy > Proletariat fantasy (the lower orders rise against a class order built on
  magic). Rejected: Tinderbox fantasy (open revolt in a city under an occupying empire; here the rulers are the empire''s
  own nobles, and the story is the class order itself), Usurper and Regicide fantasy (no false ruler or killed king as the
  engine), Emancipation fantasy (not bondage). Wobble: moderate; Anrel is an educated noble by birth, but the rising is the
  commoners'' against the sorcerer class. Sources: Kirkus, PW, watt-evans.com, ISFDB; not read.'

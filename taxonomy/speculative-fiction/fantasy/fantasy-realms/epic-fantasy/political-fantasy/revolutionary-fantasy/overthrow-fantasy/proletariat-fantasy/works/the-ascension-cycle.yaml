placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Overthrow fantasy > Proletariat fantasy. The author says the kernel of the story is "revolution and change, the
  old order being forced to adapt to the new," begun from a street artist sketching a fantasy court in the months before a
  French Revolution (paulsemel.com interview); a reviewer sees the nobility/commoner chasm in the colony city of New Sarresant
  parallel the run-up to the French Revolution (spaceandsorcery.wordpress.com review); Hachette says book two follows "the
  aftermath of a revolution" in the city. The lower orders rise against the class order: Proletariat fantasy. Soft placement:
  the cycle also carries gods, three magic systems and a war with southern invaders (Hachette, reviews), which the leaf does
  not cover. Rejected: Alt flintlock fantasy (the world is an invented one, not rewritten history), Messianic fantasy (no
  sacred figure in the sources read). Sources: Hachette UK, interview and review, not the novels.'

placement_rationale: 'Full root-down walk: Fantasy (sirens, sea witches, kelpies, kappas, water dragons - no science frame)
  > Fantasy realms (Tiankawi is an invented city-world, not real earth) > Epic fantasy > Political fantasy > Revolutionary
  fantasy > Overthrow fantasy. Far-shores fantasy was tested and fails its own ABOUT-NESS test (the curator 2026-09-26): the
  sea-folk mix is global (sirens, kelpies, kappas), not a Chinese-tradition lineage, and the book''s core theme has an engine
  leaf - publisher copy: ''Revolution is brewing in the semi-submerged city of Tiankawi, between humans and the fathomfolk'';
  sabotage, clampdown, mass unrest remaking the city-state from within, which is Overthrow fantasy''s definition (not Rebel
  - no foreign occupier; not Emancipation - the engine is mass uprising, not the breaking of a bondage machinery). Fathomfolk
  (2024) and Tideborn (2025), Orbit; Sunday Times bestseller. One universe fiction per rule 11j.'

placement_rationale: '# The Five Penalties, whole trilogy, 23 November 2026


  Place one fiction containing The Helm of Midnight (2021), The Cage of Dark Hours (2023), and The Teeth of Dawn (2025) in
  Proletariat fantasy. Existing leaf six to seven. No new node, definition change or split.


  ## Actual-tree walk


  Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Revolutionary fantasy > Overthrow fantasy
  > Proletariat fantasy.


  Literal enchantment, souls, gods, extracted emotion and lifetime, and innate magic establish Fantasy. The Radix flashback''s
  helicopters, phones and biological powers do not undo its actual magic or establish our Earth. Both Radix and Arkensyre
  are invented settings. No Earth crossing is established, so not Portal fantasy or Real earth fantasy.


  The first volume''s Regulator murder investigation is not the whole fiction''s governing engine. The three-volume arc uncovers
  the machinery of a manufactured social order, moves from investigation into rebellion, and ends with an army trying to remake
  that order. Epic worldbuilding and political revolution beat a Gothic detective placement. The author calls it dark epic
  fantasy, with body and existential horror, but the whole work is not organized principally as a horror case.


  The rulers extract portions of people''s souls, magical potential and lifetime as an apparently normal tax. The rebellion
  restores stolen powers and challenges the privileged authorities who benefit from that arrangement. The final publisher
  description explicitly distinguishes the Savior from the Grand Marquis, agencies and elites who also fight change. Completed-reader
  accounts put the Savior''s death before the final extended struggle. This is a challenge to an oppressive social order,
  not simply the exposure and removal of one false ruler. Proletariat fantasy''s lower orders rising against the class order
  is the closest existing gate. The original Radix strand likewise criminalizes and exploits a class of magic users.


  ## Sibling audit


  - Usurper fantasy is a real overlap: the Savior fabricates divine authority and concealed history. It loses because removing
  him does not exhaust the political task, and restoring a rightful dynasty is not the spine.

  - Regicide fantasy loses for the same reason. One ruler''s death is not the organizing endpoint.

  - Emancipation fantasy also fits the stolen birthright, but its definition explicitly distinguishes its engine from mass
  uprising. A mass rebellion and its army become the whole arc''s instrument.

  - Rebel/Insurgent fantasy require imperial domination; this is an internally remade valley order rather than expelling a
  foreign empire. Outlaw rescue is not the trilogy''s organizing task. Vengeance for Krona''s sister is personal motivation,
  not the governing war aim. A sacred Savior is the adversary, not proof that a messianic protagonist organizes the resistance.

  - Magic politics concerns authority over power, but its own sibling line yields to a governing overthrow movement, present
  here.

  - Hard fantasy is a substantial overlap. Rules for death masks, enchantment, extraction and temporal powers matter, but
  their social deployment and dismantling govern this trilogy. Time bubbles and stolen time are established; a whole-fiction
  time-loop or rewritten-past engine is not established. Do not widen Time magic to capture it.

  - Invented gods and divine origins are important, particularly in the third volume. Their late expanded role does not make
  sustained divine existence or human worship the governing whole-fiction register. Do not choose Worship merely because it
  is near ten.

  - Isolationist fantasy has a strong setting overlap in the enclosed, manipulated valley. The Radix strand and revolutionary
  arc make sealed-world isolation less precise than the political outcome. Technomancy describes masks and engineered magic,
  not the whole plot.

  - Heroic, high-quest and military branches lose to the political remaking. Army action arrives in service of revolution,
  rather than a soldier/unit perspective governing all three novels. No fairy-tale revision, culture-counterpart aboutness,
  comedy or bond-as-spine gate is established.


  ## Scope, editions and covers


  Creator series page and 2025 author interviews establish a completed three-novel trilogy, with a possible sequel idea not
  an existing fourth book. Use the fantasy pen name Marina Lostetter, as printed on all three creator-hosted English fronts
  and publisher pages. Original publication years are 2021, 2023 and 2025. The creator announced Teeth on 28 January 2025;
  current publisher page agrees. Macmillan confirms Cage on 14 February 2023. One attempted Helm ISBN URL resolves to Cage
  and is rejected as Helm evidence, not treated as verification. Creator and publisher''s correctly titled Helm page establish
  2021.


  Three flat illustrated English print fronts downloaded for inspection only, never repository storage. Actual pixels inspected:
  Helm 563x855, Cage 379x582, Teeth 489x743. Titles and author match, no omnibus, audiobook or perspective mockup. Creator
  hotlinks retained in book metadata.



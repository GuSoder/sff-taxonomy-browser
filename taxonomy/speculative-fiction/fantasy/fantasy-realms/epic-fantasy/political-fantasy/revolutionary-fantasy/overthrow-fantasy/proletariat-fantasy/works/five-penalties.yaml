  Confidence moderate. The entire primary trilogy has not been read. Plot resolution particulars are triangulated from completed-reader
  spoiler accounts, not represented as direct novel evidence. Creator interviews, legal primary excerpt, publisher descriptions
  and independent reviews agree on the shift from mystery to political rebellion. No new gate is needed.


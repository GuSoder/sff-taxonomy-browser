placement_rationale: 'Root-down: speculative-fiction > fantasy > fantasy-realms > epic-fantasy > political-fantasy > revolutionary-fantasy
  > overthrow-fantasy > vengeance-war-fantasy. The Twilight Order rules the empire built on a fallen civilization''s ashes;
  Gyre''s parents sold his sister Maya to the Order, and his sole focus is revenge - he will risk anything to claim enough
  power (a fabled city''s artifact, the burningblade) to destroy the Order, and the siblings end on opposite sides of a civil
  war that splits the world (djangowexler.com author copy, Orbit). The engine is personal vengeance becoming war on the ruling
  power - the leaf''s shape. Soft spot: the wrong is a stolen sister, not a massacred house; but the survivor''s vengeance
  driving civil war against the ruling dynasty is verbatim the leaf, and no sibling leaf fits (not Usurper, Regicide or Proletariat).
  The science-fantasy world (magic and technology fused in a fallen civilization, per blurbs) is setting, not engine. Trilogy
  complete 2020-2023 (OL first-publication years; Orbit). Years are first publication.'

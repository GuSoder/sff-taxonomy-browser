placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Epic fantasy -> Political
  fantasy -> Revolutionary fantasy -> Overthrow fantasy. PW: Ignavia City ''on the
  cusp of industrial revolution and roiling with discontent''; Marney Honeycutt joins
  the Highwayman''s Choir, ''a troop of bandit revolutionaries fighting to bring about
  the Hereafter: a golden future with no work, wages, or poverty'', after the foundry
  owner''s strikebreak massacre. Class uprising remaking the state from within - the
  leaf''s exact mode, and leaf-mate The Age of Madness is the same industrial class-war
  shape. Not rebel-fantasy (no foreign occupier), not insurgent-fantasy (the movement
  is open bandit revolt, not insider conspiracy). LocusRec2024-Fantasy.'

placement_rationale: 'Full root-down walk: Fantasy (invented north, no science engine) > Fantasy realms (secondary world of
  Arun and its keeps) > Epic fantasy (a war for a region''s rule, not one quester; Heroic fantasy rejected because the book
  follows two men and a cause, not one hero''s class power; Military fantasy rejected because the war is the setting, not
  the story) > Political fantasy (the engine is who holds the keep and why) > Revolutionary fantasy, not Court intrigue (no
  court game; the fight is open and from below) > Overthrow fantasy (a state remade from within; Rebel fantasy rejected because
  Col is a southern mercenary captain, not an occupying empire) > Usurper fantasy, not Regicide fantasy (the lord dies in
  the opening seizure and the story is about the aftermath), not Proletariat or Vengeance war fantasy: mercenary Col Istor
  kills Lord Athor and holds Tornor Keep, and the lord''s son Errel and watch commander Ryke work to unseat the false ruler.
  Lynn, Chronicles of Tornor vol. 1; World Fantasy Award 1980 (Wikipedia, PRH). Only Watchtower is in the queue.'

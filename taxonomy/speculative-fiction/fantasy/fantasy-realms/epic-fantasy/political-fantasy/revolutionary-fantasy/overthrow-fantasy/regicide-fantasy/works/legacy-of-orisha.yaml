first_published: 2018
canonical_genre: regicide-fantasy
placement_status: accepted
placement_rationale: Macmillan describes a complete West African-inspired fantasy trilogy beginning with a monarchy that exterminated
  the maji and suppressed magic, then follows the restoration of magic into civil war, competing political factions and the
  monarchy's fall. Magic is explicit, while revolution, rulership and the struggle over who governs Orïsha drive the sequence,
  matching Political fantasy.

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy ->
  Civil revolution fantasy. Macmillan and Owen center a persecuted low caste of mercy-killers, its young chieftain’s bargain with the crown prince, bone
  magic and the struggle to preserve and liberate her clan from the kingdom’s internal caste order. Resistance remakes the state from within rather than
  expelling a foreign occupier.'

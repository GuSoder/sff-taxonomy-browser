placement_rationale: 'Root-down walk: invented world (the Nine Nations, a flintlock-era realm with gods stirring), so Fantasy
  realms and not Real earth fantasy; Epic fantasy, Political fantasy, Revolutionary fantasy, Overthrow fantasy (the state
  is remade from within, not freed from an occupier). Source (author''s page for Promise of Blood): Field Marshal Tamas''s
  coup against his king sent corrupt aristocrats to the guillotine, and the book follows the fallout while his powder mages
  and old gods stir. The king''s overthrow is the event the story turns on, so Regicide fantasy, not Usurper (the king is
  removed, not a false ruler exposed) and not Proletariat (it is a marshal''s coup, though unions are among the factions).
  Wobble: only the first trilogy is built on the coup; the later Gods of Blood and Powder trilogy (Sins of Empire, Wrath of
  Empire, Blood of Empire) is, per the author''s page, set in the same world and follows an insurrection in the young nation
  of Fatrasta, folded here under the shared-universe rule. Years per Wikipedia (2013-2015) and the queue. The Glass Immortals
  series (In the Shadow of Lightning) is a separate series and the novella War Cry is not folded.'

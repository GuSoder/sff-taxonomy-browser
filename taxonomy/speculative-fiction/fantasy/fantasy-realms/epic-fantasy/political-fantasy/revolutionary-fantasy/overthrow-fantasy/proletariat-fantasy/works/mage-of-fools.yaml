placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Political fantasy
  -> Revolutionary fantasy -> Overthrow fantasy. Mafinga is an invented Afrofuturist polity ruled by its local king Magu and
  his alien sorcerer-adviser Atari, whose uranium extraction helps ravage the land. Jasmin preserves forbidden stories, joins
  hidden resistance with Queen Sheeba, and the regime falls; collaborators face judgment. Internal revolt remakes the state
  rather than expelling an occupying empire. Its unexplained sorcery and alien/technical trappings make it a fantasy-engine
  hybrid, not an earned hard-SF account; the curator chose the Fantasy trunk and this political engine on 2026-09-29.'

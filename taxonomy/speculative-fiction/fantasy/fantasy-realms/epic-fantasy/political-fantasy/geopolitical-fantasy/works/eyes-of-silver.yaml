placement_rationale: 'Eyes of Silver (Stackpole, Bantam 1998, queue MC06835) is a standalone novel; ISFDB and Stackpole''s
  bibliography list no sequel, and the other Stackpole rows are separate worlds. Eight centuries after the conqueror Keerana
  Dost built a vast empire, successor nations fight over its remnants and the rumour that the Dost will be reborn. Nomad leader
  Rafiq Khast fights to reclaim his homeland, Princess Natalya journeys against forces that could shatter her nation, and
  the blinded warrior-priest Malachy Kidd is led to protect the Dost on a long journey (Penguin Random House, SF Site, FantasticFiction).
  Full root path: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Geopolitical fantasy
  (now 4). Fits because the book is organized around contests among states and the balance of power over an empire''s remains,
  seen through princes, spies, priests and nomads; a reader review calls it post-Napoleonic European intrigue with magic.
  Not Real earth fantasy: the SF Site review says ''alternate earth'' loosely, but the place names, nations and religions
  are invented and no recorded Earth origin exists. Rivals rejected: Court intrigue (the contest is between states, not inside
  one court), Revolutionary fantasy and Magic politics (no governing liberation movement or magic-as-franchise rule), Destiny
  quest and Fellowship quest (the reborn-Dost journey is one strand among several). Wobbles recorded: the cover tagline frames
  a single man who can prevent an apocalypse at a cost to his soul, which pulls toward a destiny reading; airships and steam
  engines would suit a technology-era leaf if one existed.'

first_published: 2008
canonical_genre: geopolitical-fantasy
placement_status: accepted
placement_rationale: 'Path: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Geopolitical
  fantasy. One shared world, Elan, in 21 novels across five series by Michael J. Sullivan (the last with Lorian Ellis): Legends
  of the First Empire (Age of Myth 2016, Age of Swords 2017, Age of War 2018, Age of Legend 2019, Age of Death 2020, Age of
  Empyre 2020), The Rise and Fall (Nolyn 2021, Farilane 2022, Esrahaddon 2023), The Riyria Revelations (The Crown Conspiracy
  2008, Avempartha 2009, Nyphron Rising 2009, The Emerald Storm 2010, Wintertide 2010, Percepliquis 2012), The Riyria Chronicles
  (The Crown Tower 2013, The Rose and the Thorn 2013, The Death of Dulgath 2015, The Disappearance of Winter''s Daughter 2017,
  Drumindor 2024) and After the Fall (Out of the Ashes 2026). Sources: the author''s own series page (https://michaelsullivan-author.com/series/),
  his Elan Saga page (https://michael-j-sullivan.com/the-elan-saga), ISFDB series 26326 and 34781, Wikipedia, and the Audible
  author page, which counts 21 Elan novels. The omnibus volumes in the queue (Theft of Swords, Rise of Empire, Heir of Novron,
  The Riyria Revelations, Blood of Thieves) are reprints of these novels and are folded in, not counted. Hollow World (2014)
  is science fiction outside Elan and is not part of this fiction. What organizes the corpus is the rise, fall and aftermath
  of one empire among rival peoples and powers: the Fhrey and the Rhunes at the founding, the First Empire''s rise and collapse,
  then the Novronian Empire, the Nationalists and the Church contending for Avryn in the Riyria books. Rivals rejected: Thief
  heroes (fits only the Riyria rogues, not the founding books), Dynastic wars (the contest is among peoples and powers, not
  one ruling house), Rebel fantasy, Invented mythology (the gods matter, but the history of states governs). Wobble: Thief
  heroes for the Riyria books, and Dynastic wars. Two source conflicts: Percepliquis is dated 2012 by ISFDB and 2011 by the
  author''s omnibus list, and I used the ISFDB first-publication year. Covers for The Emerald Storm (Amazon listing) and Out
  of the Ashes (Apple Books listing) are hotlinked from those retailer pages; Open Library holds only a title page for the
  first and nothing for the second.'

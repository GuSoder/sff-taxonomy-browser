id: sarantine-world
title: Sarantine world
authors:
- Guy Gavriel Kay
first_published: 1995
canonical_genre: geopolitical-fantasy
placement_status: accepted
label_note: Descriptive shared-world label, not an asserted official franchise title. Explicit near-European continuity, not
  every Kay work with two moons.
placement_rationale: 'Speculative fiction > Fantasy: literal supernatural events, gods, visions, faerie and soul-bearing mechanical
  birds establish more than a wholly nonfantastic historical novel. Low magic is not no magic. Science-fiction extrapolation
  does not explain the governing premise.


  Fantasy > Fantasy realms: a separately invented near-Europe with renamed polities, invented faiths and moons, not recognizable
  Earth history itself. These eight books do not establish the Earth crossing required by Portal fantasy. Do not import an
  Earth connection from an author''s allusive grace notes after he distinguishes those from literal shared-world continuity.


  Fantasy realms > Epic fantasy: many polities, centuries of internally realized history, long journeys, wars, religious and
  imperial change. Sword and sorcery''s action-forward adventurer mode does not unite artists, physicians, merchants, poets
  and rival historical societies. Fairytale revision and Gothic dread do not govern. Comic fantasy fails the register. Heart
  has no shared courtship, cozy community, horse bond or family bond as its organizing spine; the horse races in Brightness
  do not change that. Far shores requires a non-Western counterpart culture and an aboutness gate: Lions alone meets a tempting
  local cultural label, but the whole world extends across Iberian, Byzantine, northern and Renaissance European analogues.


  Epic > Political fantasy: repeated contests among rulers, armies, states and faiths shape the historical order and individuals''
  choices. Heroic/RPG class cannot describe this variable ensemble. High/Classic quest is not the continuing plot, Hard magic''s
  explicit system is not the engine, Mythological retelling is not the common form, and Military''s army/campaign/soldier
  unit does not contain all eight books.


  Political has no honest existing child for this complete fiction. Court intrigue explicitly requires insider struggles within
  courts. Its Dynastic branch concerns contested legitimacy and a ruling house, Court spies concerns covert manipulation within
  a ruling court, and Court statecraft requires ruler-level diplomacy, government and survival. Each describes parts of this
  world, but none defines its complete recurring form across these eight outsider-rich narratives. Revolutionary has no sustained
  common liberation/overthrow movement. Election has no mass-franchise organizing contest. Magic politics has no common contest
  over public control of supernatural power. A geopolitical engine spanning rival polities is a positive uncovered slot at
  this existing deep parent.


  Confidence: moderate. Court plots and military conflict overlap strongly with the proposed scope, and the author foregrounds
  art, memory and individuals as much as state systems. The recommendation does not pretend all eight novels are policy manuals,
  ruler narratives or spy missions. It asks which existing or proposed genre honestly describes their shared world''s recurring
  conflicts without reducing it to one region or three of its books.


  '
book_traits: '1. The Lions of Al-Rassan (1995), currently Khayal. A physician and two celebrated warriors from different religious
  societies become entangled as rival kingdoms approach holy war. The three faiths and societies are part of the common world''s
  political history. The old card records a curator-directed Khayal placement. Preserve that history, while applying the later
  whole-world rule. Its setting cannot define the whole multi-region fiction as a single non-Western counterpart culture.

  2. Sailing to Sarantium (1998), currently The Sarantine Mosaic in Court spies. Mosaicist Crispin journeys to an imperial
  capital; a threatened foreign queen uses him to carry a marriage offer that could determine her kingdom''s future. Imperial
  art, court manipulation and reconquest ambitions intertwine. Court spies is a genuine local fit, not the complete-world
  fit.

  3. Lord of Emperors (2000), same card. Crispin''s commission is threatened by coup and religious change; physician Rustem
  arrives from rival Bassania under orders to spy and assassinate. Sarantium''s plans to retake Batiara, and the consequences
  for the artists, physician and ordinary people, connect the palace plot to the inter-state system. Do not erase the substantial
  court-spy content.

  4. The Last Light of the Sun (2004), currently Viking fantasy. Erling raiding, Anglcyn defenses and diplomacy, and Cyngael
  rivalries place several cultures in a changing regional balance. Faerie and family relationships matter. It is not exclusively
  a Viking-world fiction once joined with the other seven books.

  5. Children of Earth and Sky (2016), missing from current titles and nested books. A revenge-seeking Senjan woman, an artist,
  a spy and a merchant travel through competing maritime and imperial powers. Senjan opposition to Osmanli expansion, Dubrova''s
  trade and Seressa''s power shape their journeys. The author explicitly distinguishes ordinary people''s needs from the great
  conflicts they live within; do not call every protagonist a professional geopolitical operator.

  6. A Brightness Long Ago (2019), currently Courtly statecraft. Danio''s recollection and Adria''s attempted assassination
  draw multiple lives into rival mercenary commanders'' contest in a city-state system. The political dynamic includes armies
  for hire, but the novel''s art, memory, romance, healing and horse races are not all military campaigning or ruler-viewpoint
  governance.

  7. All the Seas of the World (2022), currently Court spies. Two people put ashore for an assassination intended to alter
  the world''s balance of power. Their pasts include religious exile, enslavement, escape and revenge. The publisher expressly
  ties the mission to empires and lives great and small. Covert action is important but does not define the entire eight-novel
  world.

  8. Written on the Dark (2025), currently Court spies. Tavern poet Thierry Villar assists a royal murder investigation as
  Ferrieres faces civil conflict and invasion from Angland. Conspiracy remains an important local engine, alongside foreign
  war and the place of ordinary people and art within recorded history.


  '

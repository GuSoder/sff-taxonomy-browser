    placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Epic -> Political -> Court intrigue -> Court spies. In two-moon
      Ferrieres, poet Thierry Villar is recruited as a tavern informant after the king''s brother is murdered, uncovering
      a conspiracy and usurpation plot as war approaches. Kay''s veiled fifteenth-century France is an invented world, not
      documented Earth. Covert information, assassination and manipulation around the court govern rather than ruler-level
      governance or claimant-centered dynastic legitimacy; the medieval furniture does not outrank about-ness.'
    classification_sources:

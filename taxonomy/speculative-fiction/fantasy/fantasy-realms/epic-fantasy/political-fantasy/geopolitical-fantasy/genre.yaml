definition: 'Political fantasy organized around relations and contests among states, empires or rival polities: their changing
  balance of power across borders and its effects on people within them. Not merely a map, historical resemblance or war in
  the background. Court intrigue retains internal ruling-court contests and ruler-level governance; Revolutionary fantasy
  takes a governing liberation or overthrow movement; Election fantasy takes mass franchise; Magic politics takes public authority
  over supernatural power.'

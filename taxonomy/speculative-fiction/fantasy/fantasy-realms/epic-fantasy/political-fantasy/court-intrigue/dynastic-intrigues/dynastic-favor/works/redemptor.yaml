placement_rationale: Root-down traversal passes Epic fantasy -> Political fantasy -> Court intrigue -> Renaissance dynastic
  intrigue. Abrams and Kirkus center Tarisai as a newly enthroned empress who must form a ruling council, withstand assassination
  attempts and challenges to her legitimacy, address economic inequality and imperial crimes, then fulfill her Underworld
  sacrifice. The political engine is governance from inside the court and throne, making Court intrigue the closest leaf.

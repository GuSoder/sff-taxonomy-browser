placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Dynastic intrigues > Dynastic magic. One four-book series in one world (the Branion series, Penguin Random House;
  The Stone Prince is Book 1 of 4), so one fiction (rule 11j). Per PRH: the royal line of Branion wields the Flame, a magic
  that none can stand against and that destroys an untrained vessel, and the family intrigue around Queen Melesandra, Crown
  Prince Demnor and the heirs who answer to other Aspects (Wind, Sea, Oaks) is the story. The ruling line''s magic is the
  instrument and the stake, which is the Dynastic magic definition. Rejected: Dynastic favor (regard of the ruler is secondary
  to the Flame), Hidden heir quest (not one marked heir). Wobble: Dynastic wars is the second reading for The Golden Sword''s
  war. Years are the DAW first editions, not the queue''s reissue years.'

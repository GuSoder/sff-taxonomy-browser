placement_status: accepted
placement_rationale: 'Root-down: Fantasy > Dynastic intrigues > Dynastic spy games. On Kelewan, Mara of the Acoma
  survives the Game of the Council by out-scheming rival houses: Wikipedia calls the trilogy "political fantasy
  novels" in which Mara "must plot, bend tradition, avoid assassination attempts, and trade her heart for power
  in order to save the Acoma" and face "the spies of rival houses" (en.wikipedia.org/wiki/Empire_Trilogy); Publishers
  Weekly calls Daughter "a full-bodied dynastic fantasy"; Tor.com''s reread notes it "prioritizes the domestic and
  political machinations over quests and forests". Secrets and schemes decide who holds power - the leaf''s gate.
  Rejected: Dynastic wars (no field war decides; the Warlord is toppled politically), Dynastic assassins (the assassins''
  brotherhood threatens Mara, they are not her instrument), Dynastic favor (rival houses, not the ruler''s regard,
  are the arena), Dynastic magic (the Assembly''s magicians are antagonists, not the dynasty''s weapon). Wobble
  mild (assassin/battle furniture present) RESOLVED by the decisive-weapon test: plotting and intelligence win every
  volume''s endgame.'

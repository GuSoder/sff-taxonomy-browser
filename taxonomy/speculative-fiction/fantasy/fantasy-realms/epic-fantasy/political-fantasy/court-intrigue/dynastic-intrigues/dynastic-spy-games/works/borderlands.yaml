placement_rationale: 'Lorna Freeman''s Borderlands trilogy (Covenants 2004, The King''s Own 2006, Shadows Past 2010,
  all Roc; bibliography current per isfdb, risingshadow and Goodreads - three books, no fourth in sixteen years).
  Rabbit, a Border farm boy serving as a trooper in King Jusson''s Royal Army, is outed by a magical guardian as
  a scion of Iversterre nobility with a strong claim to the throne; rival claimants maneuver (''Rabbit is thrust
  into a political and magical intrigue that could start a war. Because Rabbit isn''t just another trooper'' - Covenants
  blurb; jamesdavisnicoll.com review on the rival claimants), and by book three a lord once scorned by Rabbit''s
  mother demands he marry his daughter, leading ''into a world of courtly intrigue and betrayal'' (Shadows Past
  blurb, Penguin Random House). Walk: Speculative fiction > Fantasy (the Faena, Rabbit''s mage blood) > Fantasy
  realms (invented Iversterre and the Border kingdom) > Epic fantasy > Political fantasy > Court intrigue (insider
  struggles within the court: the claim, the council, the marriage demand) > Dynastic intrigues > Dynastic spy games
  (secrets and hidden identities decide who holds the crown: Rabbit''s concealed lineage is the series'' founding
  secret, and the plotters work by scheme, not by open war). Rejected: Dynastic wars (no open war for the crown;
  the intrigue ''could start a war'' but stays covert), Dynastic favor (the plays are schemes around the heir, not
  petitioning for regard), High fantasy (journeys happen, but the governing narrative is the succession intrigue,
  not a quest), Heroic fantasy and its class tree (Rabbit has martial AND magic kits - but the engine is the court,
  not the adventuring; the series is famous for its intrigue, per Fantastic Fiction and the blurbs). Wobble: medium;
  the tone is light (''drama with whimsy, high fantasy with military action'', Patricia Briggs''s cover quote) and
  book one opens as a lost-patrol adventure, but the succession intrigue is the through-line. One series card (11j);
  queue row MC06122 is book three; books one and two are folds under the series-completion rule (bibliography check
  above). THIS IS THE TENTH CARD: dynastic-spy-games freezes and a split is served. Sources: penguinrandomhouse.com,
  fantasticfiction.com, jamesdavisnicoll.com, isfdb, goodreads, archive.org.'

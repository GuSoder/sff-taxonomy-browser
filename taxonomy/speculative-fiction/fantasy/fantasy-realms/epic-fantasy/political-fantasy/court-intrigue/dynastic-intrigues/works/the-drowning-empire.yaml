id: the-drowning-empire
title: The Drowning Empire
authors: [Andrea Stewart]
first_published: 2020
canonical_genre: dynastic-intrigues
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Court intrigue -> Dynastic intrigues. Hachette identifies the complete trilogy and grounds an emperor whose bone-shard constructs enforce imperial order, a disinherited heir reclaiming the throne, revolution across the islands, weak alliances, rebel armies and the threatened fall of the Sukai dynasty. The trilogy’s explicit magic supplies the means, but contested imperial legitimacy and survival of the ruling house govern, so Dynastic intrigues beats Hard magic.'

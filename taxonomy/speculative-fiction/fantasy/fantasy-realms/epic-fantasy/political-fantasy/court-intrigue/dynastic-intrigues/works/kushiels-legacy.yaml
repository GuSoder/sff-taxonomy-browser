canonical_genre: dynastic-intrigues
placement_status: accepted
placement_rationale: Root-down traversal passes Epic fantasy -> Political fantasy
  -> Court intrigue -> Dynastic Intrigues. Macmillan and Jacqueline Carey present
  one connected historical/epic fantasy legacy in the invented Terre d'Ange, driven
  across generations by courtiers, dynastic threats, conspiracy, threatened crowns
  and insider spies. Court politics and succession remain the shared engine, making
  Court intrigue closest. Candidates 497 Kushiel's Dart and 498 Kushiel's Legacy deduped
  into this one complete card.

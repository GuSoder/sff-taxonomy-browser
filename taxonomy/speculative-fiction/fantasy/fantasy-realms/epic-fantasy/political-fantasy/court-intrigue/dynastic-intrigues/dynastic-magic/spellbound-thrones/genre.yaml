definition: 'Dynastic intrigue in invented fantasy realms where royal power is bound to supernatural powers or conditions:
  an indwelling divine presence, magical royal-marriage binding, spirit bargain, curse and revenant entanglement, or god-instilled
  bond between ruler and land. These bindings empower, compel or disqualify rulers and shape succession. Spellbound describes
  sovereignty bound by magic, not necessarily hypnosis, a malign curse, literal enchanted furniture or rulers without agency.
  Not merely a ruling family wielding its own sorcerous capacity.'

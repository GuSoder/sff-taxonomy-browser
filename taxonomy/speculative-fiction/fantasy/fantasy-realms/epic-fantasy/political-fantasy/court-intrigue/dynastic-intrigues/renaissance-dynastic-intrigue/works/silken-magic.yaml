placement_rationale: 'Full root-down walk: Fantasy (the kingdom of Tyrrhia; magic is a court and family matter, no science
  engine) > Fantasy realms (invented alternate Renaissance Italy and Sicily; Real earth fantasy rejected because Tyrrhia is
  a different map) > Epic fantasy > Political fantasy (power, not a quest or a war''s campaigns, drives the plot) > Court
  intrigue (the fight is inside the ruling circle; Revolutionary fantasy rejected, nobody rebels) > Dynastic intrigues, not
  Court spies (the plots threaten the ruling house: in Sovereign Silk assassins target King Alban while Queen Idalia''s court
  is at risk; the sisters Luciana and Alessandra are Romani-born nobles in the queen''s family, not agents) and not Court
  statecraft (no ruler-level diplomacy under war pressure; the Turkish war is off stage) > Renaissance dynastic intrigue over
  Medieval or Early modern: Locus calls it ''an alternate Renaissance Italy'' with ''court intrigue and dark magics''. Silken
  Magic vol. 1-3 as one fiction (PRH series page https://www.penguinrandomhouse.com/series/BTM/silken-magic/).'

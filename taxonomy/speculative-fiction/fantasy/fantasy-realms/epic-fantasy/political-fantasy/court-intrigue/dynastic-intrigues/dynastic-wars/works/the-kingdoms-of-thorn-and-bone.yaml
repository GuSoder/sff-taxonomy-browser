placement_rationale: |-
  Corrective move 2026-10-28 (curator "Approved", phonemsg-01M6116WZSEFEQJT56S2G544K5) from Revival quest fantasy, where the card never honestly fit: Fellowship quest fantasy's definition is "the party-bound journey against the ancient dark is the spine", and this saga is a dynastic-war tapestry from book 1 (Prince Robert's murder, the engineered Hansa war, convent and holter strands running apart - en.wikipedia.org/wiki/The_Briar_King). Full root-down walk served 2026-10-28: Dynastic wars wins the sibling test against War of humanity because the throne is the war's pivot - "whoever sits upon the throne will have the ultimate command to bring about the world's salvation - or its apocalypse" (penguinrandomhouse.com/books/92219/the-born-queen-by-greg-keyes/). Rival claimants (Anne's succession, the Church's holy war, Hansa's invasion) take the field and the war decides the crown, which is the leaf's definition; A Song of Ice and Fire sits here on the same shape.


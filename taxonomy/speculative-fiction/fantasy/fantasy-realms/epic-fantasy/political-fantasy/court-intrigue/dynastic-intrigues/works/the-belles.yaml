placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Court intrigue -> Dynastic intrigues. Disney grounds a complete three-book Orleans sequence in magically controlled bodily beauty, a palace favorite serving a queen, rival princesses/rightful succession, underground resistance and a deadly contest to choose the next queen. Across the trilogy, magical power is entangled with who legitimately rules Orleans, so dynastic legitimacy governs over Hard magic or general court espionage.'

placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Epic fantasy -> Political
  fantasy -> Court intrigue -> Dynastic intrigues -> Renaissance dynastic intrigue.
  PW: rivalries between powerful banking families in a 15th-century-Florence-analog
  world; Devonaci seeks to ''shape the politics of the city to his will'' and groom
  Davico as successor until a betrayal forces flight. Rival ruling houses and heirs
  contesting power in a Renaissance-court shape - the leaf''s def; the Medici mapping
  is exact (a banking house IS a ruling house here). The dragon''s-eye relic keeps
  the marvelous present. LocusRec2024-Fantasy.'

  ## Approved Dynastic magic subdivision,26November2026


  Root-down rewalk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court intrigue > Dynastic
  intrigues > Dynastic magic > Sorcerer dynasties. Existing whole-fiction source evidence retained. Positive literal magic,not
  established technological demystification; invented fantasy realms,not actual Earth inferred from Tudor/Celtic analogues.
  No cross-world journey or reality-authoring engine established. At Epic fantasy,political contests over rule outweigh isolated
  hero progression,quests and domestic comfort. At Political fantasy,the ruling-line succession and court/house struggle take
  priority over public magical regulation,revolutionary or insurgent programs and international statecraft alone. At Court
  intrigue,the dynasty and legitimacy are the sustained prize,not a single courtier profession. At Dynastic intrigues,magical
  capacity or supernatural royal conditions are the repeated instrument,not ordinary field war,assassination,murder mystery,spy
  apparatus or favor trading. Existing per-fiction temporal/root qualifications remain; gods,prophecies,narrative time gaps
  and ancestral memory are not by themselves literal time travel. No ancestor gate changed. Full per-member novel walks and
  exact sources remain in the preserved prior rationale,audit-dynastic-magic-destination-2026-11-26.md and audit-dragon-prince-2026-11-26.md.


  Phela pursues forbidden magic and divinity as the means to supreme rule amid murderous succession and resistance. Sorcerer-gods
  underpin the order,but her undertaking is acquiring and becoming that power,not serving a binding patron. Creator and Kirkus
  support this; FantasyLiterature is DNF/skimming and is not ending evidence.


  Approved positive distinction: ruling families wielding magical capacity versus sovereignty bound to supernatural powers

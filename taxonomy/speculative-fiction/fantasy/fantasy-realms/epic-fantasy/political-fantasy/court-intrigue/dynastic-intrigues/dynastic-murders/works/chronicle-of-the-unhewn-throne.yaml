placement_rationale: 'Root-down walk: an invented-world empire, so Fantasy realms; Epic fantasy; Political fantasy; Court
  intrigue; Dynastic intrigues; Dynastic murders (someone must find who killed the ruler before the succession is settled).
  Sources: brianstaveley.com (The Emperor''s Blades: the emperor of Annur is dead, slain by enemies unknown; his daughter
  and two sons, scattered across the world, do what they must to stay alive and unmask the assassins; Kaden, the heir, has
  spent eight years in a mountain monastery of monks devoted to the Blank God; Valyn endures the Kettral soldiers'' training;
  Minister Adare believes she knows who murdered her father; isfdb gives 14 Jan 2014). The inquiry into the emperor''s killers
  drives all three children across the first book, so Dynastic murders, not Dynastic assassins (the killers are the question,
  not the hunters of the line) and not Hidden-heir quest (Kaden is the known heir). The prequel standalone Skullsworn (2017;
  Pyrre Lakatur, priestess-assassin of the God of Death, ''returns to the Chronicle of the Unhewn Throne universe'') and the
  later trilogy opener The Empire''s Ruin (2021; the Annurian Empire is disintegrating, the Kettral decimated, kenta gates
  unusable; ''a new epic fantasy trilogy based in the world of'' the Unhewn Throne) are folded into the same card under the
  shared-universe rule. Wobble: the later books stop being a murder inquiry (Empire''s Ruin is a collapse-and-voyage story),
  so the card sits in this leaf by its first trilogy only; Dynastic magic (gods and monk powers) was considered. Years: 2014,
  2015, 2016 per queue (Blades confirmed by isfdb), Skullsworn 2017, Empire''s Ruin 2021.'

placement_rationale: '# Tielmaran Chronicles: scoped tenth-member audit

  23 November 2026


  Move whole three novels from Invented worship to existing Dynastic magic,8to9. Invented worship10to9, false split trigger
  removed. No structure or definition change. The earlier rationale treated the presence of divine covenant as the whole-fiction
  subject without testing political aboutness against the completed trilogy.


  ## Evidence

  SFRevu''s2002 author interview explicitly identifies kingship as the theme of books2/3 completing the trilogy. It confirms
  the world is invented and describes worship-returned power under12divinities, a real worship rival. Its completed final-volume
  review distinguishes the actual prize: Benet''s lost Kinghood ritual, a god-instilled bond between ruler, people and land
  that makes Tielmark independent. Gaultry must recover/enact it while High Priestess Dervla and a divided, magically created
  royal coven manipulate events. The first volume saves sister and nation from a treasonous chancellor and imperial invasion;
  the second foils assassins poisoning the prince with dark magic and investigates the imperial ties; the third completes
  sovereignty and coronation. PW independently supports both court and foreign-sovereignty strands, not merely a blurb''s
  religious premise.


  ## Full walk

  Speculative fiction > Fantasy: witchcraft, sacred kingship and active gods. No science explanation.

  Fantasy > Fantasy realms: Reimann explicitly contrasts these three made-up-world books with her later Earth historical/contemporary
  projects. No Earth portal, no inherited myth narrative. Not Real earth or Portal.

  Realms > Epic fantasy: national sovereignty, empire, magical covenants and history dominate; not intimate S&S, fairytale
  transformation, inherited cultural retelling or bond-first romance.

  Epic > Political fantasy: who can legitimately rule Tielmark and end Bissanty''s claim organizes the whole. Mythological
  fantasy is substantial, with on-page gods and worship powering magic, but divine existence/faith/service is the mechanism
  and condition of political kingship rather than the governing prize. Not merely any novel containing gods. Heroic mage growth/quest
  are strong secondary forms, not the whole arc''s center.

  Political > Court intrigue: insider sovereignty, rival lineages, Benet''s kingship and coven sabotage. Geopolitical is serious,
  but cross-border independence is achieved through the ruling prince''s sacred legitimacy, not primarily diplomacy among
  states. Revolutionary/rebel also serious, but this is royal ritual, courtiers, priestess, assassins and dynastic ties rather
  than organized mass open resistance, underground insurgency or caste emancipation. Magic politics fails: no public regulation
  of who may use magic as governing prize. Election absent.

  Court intrigue > Dynastic intrigues: contested legitimacy and royal continuity, rather than professional espionage or day-to-day
  ruler governance.

  Dynastic intrigues > Dynastic magic: divine ritual, royal-land bond, magical poisoning and a coven made to protect/act for
  the dynasty are decisive instruments. Not chiefly armies, mundane assassination, murder investigation, spy intelligence
  or patronage. Existing Queens of Elben likewise binds royal marriage magically to the land''s survival; Branion has sacred
  royal power contested by competing dynasties. No gate widened to take this fiction.


  ## Remaining scope and caveats

  Three published novels1996/1998/2002 unchanged, all covers unchanged. Theological worldbuilding remains substantial and
  the revised rationale preserves it. This is one scoped placement correction during the triggered member audit, not permission
  for unrelated repairs. Authority: original phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX entrusts individual/whole-fiction moves.
  No split proposal needed if current ten-member audit establishes no further capacity trigger. Nine other members were checked
  against author/publisher/full available completed-review evidence; Age of the Five restored its omitted middle novel separately.
  No other placement change proposed.



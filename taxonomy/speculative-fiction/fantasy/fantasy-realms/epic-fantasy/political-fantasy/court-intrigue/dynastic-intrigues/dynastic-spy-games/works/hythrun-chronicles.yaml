placement_rationale: 'Full walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Dynastic intrigues > Dynastic spy games. Hythrun Chronicles is one eight-novel fiction: Demon Child3, its Wolfblade
  prequel3, War of the Gods published2. Author expressly ties Medalon/Wolfblade/LyreThief into one world (https://bookwraiths.com/2016/03/09/guest-post-jennifer-fallon/
  ; https://fantasybookcritic.blogspot.com/2016/03/guest-blog-why-i-finally-wrote-sequel.html), contemporary independent review
  calls Retribution Hythrun8 (https://earlgreyediting.com.au/2017/07/03/retribution-by-jennifer-fallon/). No same-world card
  existed on 2026-10-29. Scope is all8, not separate cards for named trilogies.

  Per volume: Medalon2000: Joyhinia''s coup and intolerance force supposed children R''shiel/Tarja to flee, expose R''shiel''s
  concealed Harshini parentage, and join rebellion; gods seek the only being able to kill Xaphista. TreasonKeep2001: R''shiel
  recovers at Sanctuary; Tarja/Damin prepare against Karien, while Adrina''s forced Karien marriage, rival kingdoms and betrayal
  reshape alliances. Harshini2001: Damin must beat a usurper to secure Hythria, R''shiel engineers his marriage to Adrina
  and coerces southern alliance, Tarja''s resistance retakes Citadel, R''shiel confronts Xaphista and ends the god''s bid
  to monopolize belief. Wolfblade2004: young Marla avoids royal sale into Fardohnya, marries Laran, births Lernen''s heir
  Damin, and learns Elezaar''s covert rules against rival factions'' attempts to remove her house. Warrior2005(bibliographic
  year, see caveat): Marla runs country behind Lernen and positions children as allies; Alija tries turning Elezaar, Mahkas
  schemes to marry Damin to his daughter; Damin learns to conceal his ability in court power struggle. Warlord2005: invasion
  and plague threaten Hythria, Marla/Alija compete over sons'' leadership, Mahkas suppresses Damin''s return and hides damaging
  secrets while starving Krakandar; Brak intervenes magically, but family rule, secrecy and counterplots drive resolution.
  LyreThief2016: false royal parentage triggers Rakaia/Charisee identity swap for a treaty marriage, Charisee''s deception
  under God of Liars, Damin''s coma during treaty negotiation, R''shiel seeking Brak from Death, and Mica''s stolen divine
  lyre/vengeance. Retribution2017: Rakaia trapped with Mica, Charisee''s assumed royal identity threatened, Adrina keeps Hythria
  together after Citadel crisis and Marla handles fallout, Wrayan/Julika investigate Sanctuary''s return; independent reviews
  confirm intertwined human power/survival plots and enduring divine stakes.

  Source independent wholevolume checks: https://januarymagazine.com/SFF/medalon.html ; https://www.kirkusreviews.com/book-reviews/jennifer-fallon/treason-keep/
  ; https://www.kirkusreviews.com/book-reviews/jennifer-fallon/harshini/?page=38 ; https://www.fantasybookreview.co.uk/Jennifer-Fallon/Harshini.html
  ; https://www.publishersweekly.com/9780765309921 ; https://www.publishersweekly.com/9780765309907 ; https://fantasyliterature.com/reviews/warlord/
  ; https://sfcrowsnest.info/warlord-the-wolfblade-trilogy-book-three-by-jennifer-fallon-book-review/ ; https://reactormag.com/book-reviews-the-lyre-thief-by-jennifer-fallon/
  ; https://www.fantasybookcafe.com/2016/07/mini-review-the-lyre-thief-by-jennifer-fallon/ ; https://earlgreyediting.com.au/2017/07/03/retribution-by-jennifer-fallon/
  ; http://tsanasreads.blogspot.com/2018/10/retribution-by-jennifer-fallon.html . Primary full individual blurbs: https://www.harpercollins.com.au/9780732264772/medalon/
  ; https://www.harpercollins.com.au/9780732266219/treason-keep/ ; https://www.littlebrown.co.uk/titles/jennifer-fallon/harshini/9781841493282/
  ; https://www.harpercollins.com.au/9780732278908/wolfblade/ ; https://www.boomerangbooks.com.au/warrior/jennifer-fallon/book_9780732278915.htm
  ; https://www.harpercollins.com.au/9780732278922/warlord/ ; author guestpost above LyreThief ; https://www.harpercollins.co.nz/9781743098097/retribution/
  .

  Root: actual magic/gods, wholly invented contiguous realms, not real-Earth SF, fabulation or portalframe. Epic ensemble/kingdom
  scale over intimate Sword&Sorcery, inherited fairytale, comic/Gothic/counterpart culture or bond-as-spine Heart. Romances
  matter but differ across8; no coequal one relationship organizes complete universe. Epic: politics is the recurrent organizing
  engine, supported by independent January review saying human politics more important than magic, PW kingmaking/secrets across
  Wolfblade, and later identity/treaty crises. Not one warrior/mage class, military rank/campaign spine, hard-magic engineering
  or consequential fellowship journey across all8.

  Strong rival Mythological > Invented gods > Invented worship: Demon Child''s divine struggle and War of Gods'' stolen power
  are real and not scenery. But Wolfblade3''s court survival, claimants and covert family management are not sustained living-in-relation-to-divine-order
  aboutness; killing Xaphista is3novels, not whole8 engine. Invented godhood even weaker: demigods and dependence on belief
  occur but no sustained divine-existence subject across8. Gods are invented, not inherited real-world mythic beings. Do not
  force all8 into godslaying. Political: revolutionary overthrow central to Medalon strands, not Marla''s preservation of
  royal family or sequel identity politics; no invariant emancipation franchise. Court intrigue beats statecraft: alliances/treaties/campaigns
  serve contested houses and schemes, not governing administration as recurring spine. Dynastic legitimacy/replacement/continuity
  organizes courts, rather than a professional court-spy mission throughout.

  Weapon ladder: Dynastic spy games fits recurrent secrets, concealed legitimacy, false public personae and court counterplots.
  Marla/Elezaar''s covert kingmaking, Damin hiding ability, R''shiel''s parentage and southern throne alliances, Rakaia/Charisee''s
  identity deception and treaty crisis form the continuous political line. Genuine rival Dynastic magic: R''shiel/gods, Alija,
  Brak''s intervention and the lyre change outcomes decisively, particularly Harshini. Not claimed magic minor. But ruling
  line does not consistently wield a hereditary magical instrument: Marla''s major prequel victories and Damin''s public disguise
  depend on information/manipulation, and gods/sorcerers have independent agendas. Pick secrets/schemes as governing instrument
  across8 rather than treating every magical intervention as dynasty''s weapon. Not Dynastic wars (campaign decides Warlord
  but not whole8), assassins (threat/profession one strand), murders (no sustained inquiry gate), favor (not ruler''s regard
  as political currency). No definition widened and no count balancing: Spy games8 to9, Magic also8 before choice.

  Corpus: original Australian years Medalon2000/TreasonKeep2001/Harshini2001/Wolfblade2004/Warrior2005/Warlord2005/LyreThief2016/Retribution2017.
  Warrior conflict explicitly recorded: retail on-sale15Dec2004 in QBD/Boomerang vs ISFDB Jan2005 and British bibliography
  originalAustraliaVoyager2005 (http://obnb.uk/p14615084-warrior ; https://isfdb.stoecker.eu/cgi-bin/title.cgi?184121=). Use
  bibliographic2005, do not pretend date unanimous. AuthorWiki also falsely lists Covenant2018: current https://www.risingshadow.net/book/46727-covenant
  says upcomingTBA, publisher catalog/bibliography inspected have no verified released Covenant. Eight published novels, not
  complete third trilogy; no fabricated Covenant/Brakandaran. FirstKill32page Tor original and Elezaar companion short excluded
  under existing rules https://torpublishinggroup.com/first-kill-2/?format=ebook&isbn=9780765387455 .

  '

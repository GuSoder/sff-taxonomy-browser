placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court intrigue >
  Dynastic intrigues > Dynastic spy games. Per Hachette UK and SFFWorld: Gormenghast-like castle in the Kingdom
  of Landfall, where a mad king, feuding families, vendettas and deception rule; Lucien de Fontein is ''a mere pawn
  in a political game'', and the later books follow the silent queen''s push for a new order and the contest for
  the throne. Court plotting decides who holds the crown. Soft: the castle and its brooding are Gormenghast-like,
  but the sources do not describe a sealed world, so Isolationist fantasy is not used. Trilogy of three novels (2014-2016).
  Cover carries a review quote; no clean edition found.'

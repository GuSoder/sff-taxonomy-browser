placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Epic fantasy -> Political fantasy -> Court intrigue -> Early
  modern dynastic intrigue. PRH identifies the complete Italian-inspired duet and grounds five controlling families whose
  patriarchs are poisoned and sons summoned by Vinalia’s ruler, forcing a strega heir to transform and enter the capital;
  book two pits allied streghe against the dictatorlike Capo’s war and persecution. Magic and gender transformation matter
  deeply, but threats to ruling families and control of Vinalia govern the shared plot.'

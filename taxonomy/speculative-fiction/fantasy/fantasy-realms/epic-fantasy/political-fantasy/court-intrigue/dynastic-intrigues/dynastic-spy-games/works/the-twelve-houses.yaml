placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Political
  fantasy -> Court intrigue -> Dynastic intrigues. Sharon Shinn''s Twelve Houses (Mystic and Rider 2005 to Fortune and Fate
  2008; Wikipedia and the author''s site): King Baryn has one heir thought unfit, the twelve semi-independent Houses jockey
  for the succession, and the kingdom is near civil war. Senneth is sent to read the mind of the marlords; Kirra tours disguised
  as her sister; Justin spies on the convent; Cammon reads the princess''s suitors. The engine is secrets and reading intentions,
  and the arc ends in open revolt. Walk: Mage hero and the Heroic fantasy leaves refused (a party of mystics with limited
  gifts and King''s Riders, not one hero''s primary power); Court spies (inside one court; this is a realm-wide inquiry into
  succession, so Dynastic intrigues); within Dynastic intrigues: Dynastic spy games (spies, hidden identities and court plotting
  decide who holds the crown), not Dynastic wars (the war is the last act), Dynastic magic (the mystics are persecuted, not
  the dynasty''s instrument). Wobble moderate: the first arc closes in civil war (Dynastic wars) and Fortune and Fate starts
  a new arc about a bodyguard corps. Five novels folded as one fiction (11j). Reader and Raelynx is a 464-page novel (PRH),
  not a collection: the mechanical pass-1 verdict skip-collection was wrong and is corrected. Years are first publication
  from Wikipedia; queue years are reissue dates. The Dark Moon Defender and Fortune and Fate covers on Open Library are blurry
  or a title page, so they carry no cover.'

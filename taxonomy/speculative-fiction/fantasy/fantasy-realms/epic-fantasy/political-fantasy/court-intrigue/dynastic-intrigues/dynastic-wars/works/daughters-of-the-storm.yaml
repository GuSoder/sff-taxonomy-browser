placement_rationale: 'Kim Wilkins''s Daughters of the Storm (2018; PRH, Kirkus): a Norse-flavored epic fantasy of five royal
  sisters (the warrior Bluebell, Rose, the magician Ash, and the twins Ivy and Willow) who team up against their stepbrother
  to save their stricken father''s kingdom, then in Sisters of the Fire (2019) fight over the heirship and the sword Grithbani,
  forged to kill Bluebell. Folded: Sisters of the Fire and Giants of the Frost. Walk: Fantasy > Epic fantasy > Political fantasy
  > Court intrigue > Dynastic intrigues > Dynastic wars (claimants and kin take the field and the war decides who holds the
  crown). Tried Dynastic magic (the magic is a thread, not the dynasty''s instrument) and Court statecraft (full). Sources:
  PRH, Kirkus; not read. Alternative: Dynastic magic.'

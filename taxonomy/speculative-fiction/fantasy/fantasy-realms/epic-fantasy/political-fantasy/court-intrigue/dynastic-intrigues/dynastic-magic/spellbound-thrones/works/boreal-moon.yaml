placement_rationale: '# Boreal Moon whole3, MC04997 - 2026-11-06


  Place the tenth fiction in Dynastic magic, then freeze ALL intake and initiate split research immediately. No eleventh placement.
  Conqueror''s Moon2003, Ironcrown Moon2004, Sorcerer''s Moon2006. Queue2005 is a later edition, not first publication. All
  three HarperVoyager primary synopses explicitly numbered parts of one tale; final described as conclusion. No positive shared-universe
  link to Pliocene/Galactic Milieu, Rampart Worlds or Trillium is inferred from author alone. PRH generic Moon series wrongly
  mixes Rebecca York and is not scope evidence.


  ## Every novel''s own engine

  Conqueror''s Moon: volcano famine threatens High Blenholme''s four kingdoms. Prince Conrig of Cathra aims to reconquer/unite
  the island despite his dying father''s caution, through alliance with sorceress Ullanoth of Moss. Royal intelligencer Snudge/Deveron
  uses hidden wild talent and invisibility sigil to serve the conquest; father demands an oracle''s truth. Ullanoth''s Beaconfolk
  powers provide decisive royal weapons at an unpredictable price. First review stresses royal relationships and succession,
  not mere military spectacle.

  Ironcrown Moon: Conrig rules the united Sovereignty, but first wife Maudrayne survives with his firstborn legitimate heir,
  threatening succession and exposing his hidden magic that legally disqualifies him from kingship. Snudge is sent to find
  them and confronts loyalty/conscience. Beynor and Kilian steal moonstone sigils, initiate civil war, and seek the Unknown
  Potency to break the Beaconfolk''s painful price; Source versus Great Lights manipulates both sides. SFRevu specifically
  says there is less Deveron here and identifies this larger cosmic contest; Rambles independently connects hidden inherited
  Talent to succession. Not just first volume''s conquest repeated.

  Sorcerer''s Moon: sixteen years into Conrig''s rule, Salka invasion and deteriorating king meet a new succession crisis.
  Heir Orrion refuses arranged marriage; twin Corodon obtains a Beaconfolk pact letting Orrion marry Nyla at the cost of his
  inheritance. Corodon also unfit, concealed first son Dyfrig and mother Maudrayne reappear with Deveron. The Beaconfolk factions
  use human dynastic conflict as pieces in their own war. Completed Concatenation and CA reviews independently establish these
  engines. Magical contracts, concealed royal magic and spiritual manipulation decide the ruling line across all three; the
  spy is not the sole whole-fiction mechanism.


  ## Actual root-down walk

  Speculative fiction -> Fantasy: literal sorcery, otherworldly Beaconfolk, magical sigils and oracle, no rational/technological
  explanation. Fantasy realms: invented island High Blenholme/Cathra/Moss/Didion/Tarn, not actual Earth history, no Earth
  outsider portal. Real Earth and Portal governing-setting branches fail.

  Fantasy realms seven: Epic passes island-wide four-kingdom politics, wars, invented cosmology and generations. Sword & Sorcery
  intimate action fails as whole governing scale; fairytale revision no inherited tale/script; Gothic realms contains dark
  magic and corrupt king but the governing register is political ambition/legitimacy rather than dread/haunting/confinement
  or PaxBritannica manners. Far shores no non-Western counterpart-cultural aboutness; Comic realms neither governing parody
  nor absurdity. Heart fantasy fails romantic/cozy/horse bond as spine, despite marriage being a political lever.

  Epic six: Political fantasy passes struggles for sovereign power and dynasty in realized invented world. Heroic fantasy
  rival Snudge''s hidden skills but multiperspective royal/cosmic contest is not classed-hero adventure. High fantasy consequential
  journey is not governing engine. Military fantasy fails war from the ranks: wars lever the ruling-house struggle, not army-unit
  narrative. Hard fantasy fails rigorous consistent rules as subject; independent review explicitly criticizes inconsistent
  scrying/opaque powers, and sigils do not alone qualify. Mythological fantasy rival invented Beaconfolk cosmology, but here
  supernatural powers intervene as the instruments and constraints of royal legitimacy rather than chiefly telling the mythological
  beings'' own stories.

  Political -> Court intrigue: insider royal houses/claimants, not mass-franchise election. Revolutionary fantasy rival Salka
  wanting their homeland and Conrig''s corruption, but narrative chiefly follows the conquering dynasty and its spy, not an
  uprising/remaking order or liberation movement.

  Court intrigue -> Dynastic intrigues: succession, magically disqualified ruler, lost firstborn, second wife''s gifted heirs
  and competing houses are central. Court spies strong rival for Snudge, but dynastic legitimacy specifically governs; Court
  statecraft/martial or courtly statecraft strong first-volume rivals conquest and marriage, but administration, war-finance
  and diplomatic governance are not whole3 main engine.

  Dynastic intrigues six: Dynastic magic passes gods/spirits/sigils/pacts as ruling houses'' weapons and magical constraints
  selecting legitimate heirs. Dynastic spy games strong rival concealment and Snudge''s missions, but not whole dominated
  by intelligence: second has less Snudge, cosmic sigil-war and third''s pact disinheritance drive events. Dynastic wars rival
  open conquest/civil/invasion but magic bargains determine power and succession over armies alone. Dynastic assassins includes
  threatened killing first wife/child but no chiefly killer mechanism; Dynastic murders no sustained inquiry identifying murdered
  royal; Dynastic favor no chiefly council/standing/regard game. Wobble: hidden heir and hidden Talent are genuinely secrets,
  spy framing spans trilogy. Choosing magic is based on positive causal pact/sigil/Beaconfolk engine across all3, not avoidance
  of another leaf at nine. No gate changes. Dynastic magic9->10 therefore freeze intake now.



placement_rationale: 'In a kingdom modeled on early-medieval Europe, the succession left by King Henry''s line is contested
  by his elder sister Sabella''s heirs and by the fate of his son Sanglant, and the fight is waged with armies in the field,
  besieged strongholds and exiled church scheming across seven novels (Kirkus, King''s Dragon review: civil war between Henry
  and Sabella; Wikipedia; Reactor reread). Walk: Fantasy (real magic) > Fantasy realms > Epic fantasy > Political fantasy
  > Court intrigue > Dynastic intrigues > Dynastic wars (a contested succession fought in the field, not only in corridors).
  One universe, one card (rule 11j); series completion verified against the author bibliography: seven novels 1997-2006, Crown
  of Stars the last; queue years are reissue years. Source: Kirkus, Wikipedia, author site; not read.'

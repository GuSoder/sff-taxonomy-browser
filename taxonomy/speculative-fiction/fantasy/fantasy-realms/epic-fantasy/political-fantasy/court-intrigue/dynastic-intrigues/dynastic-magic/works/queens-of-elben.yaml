placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Dynastic intrigues > Dynastic magic. In the invented kingdom of Elben the king must marry six queens and magically
  bind each to one of the island''s palaces or the kingdom falls; the court teems with dragons and strange magic, and in book
  two the king has stolen his wives'' magic to prolong his reign (Hachette Book Group; author site hollyrace.com; Orbit UK).
  A Tudor court retold in an invented realm, where magic is the instrument of the ruling line, the leaf''s definition. Rejected:
  Dynastic favor (the queens vie for favor but the binding magic is the engine), Dynastic spy games (Seymour spies, the stakes
  are the magic), Crown enemies romantasy (sapphic romance is present but the court is the story), Court statecraft (not ruler-level
  governance). Wobble: moderate; Boleyn and Seymour''s alliance and romance pull toward Romantasy and the favor contest toward
  Dynastic favor. Sources: Hachette, hollyrace.com, Orbit UK. Years: Six Wild Crowns Jun 10, 2025 (US and UK); Six Savage
  Thrones Jun 16, 2026.'

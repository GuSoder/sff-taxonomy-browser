definition: Dynastic intrigue in invented fantasy realms where ruling families acquire, inherit, cultivate, steal or make
  magical capacity and wield it in contests over royal succession and power. The governing instrument is royal sorcery itself,
  not sovereignty conditional on a supernatural presence, pact, curse or royal-land bond. Gods and prophecies can occur without
  displacing a sustained whole-fiction engine of magical bloodline formation and royal spellcraft.

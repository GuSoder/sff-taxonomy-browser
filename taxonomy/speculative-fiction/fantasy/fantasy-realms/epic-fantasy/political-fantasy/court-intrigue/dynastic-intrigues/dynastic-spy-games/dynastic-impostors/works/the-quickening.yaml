placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy
  > Court intrigue > Dynastic intrigues > Dynastic spy games. Per Kirkus: Wyl Thirsk, a general killed by the crown,
  lives on through Myrren''s Gift by taking over other bodies; now in his sister''s body he cannot stop Queen Valentyna
  of Briavel marrying the tyrant King Celimus of Morgravia; the book is a conclusion to The Quickening trilogy.
  Hidden identity and court scheming decide who holds the crown, which is the Dynastic spy games definition. Book
  three of the series; the earlier volumes are not in the queue, so the fiction is named for the series. Rejected:
  Dynastic magic (the soul gift is a hook, not the dynasty''s instrument), Dynastic murders (no inquiry). Wobble:
  Dynastic magic is the second reading. Year is the Voyager Australia first edition (Nov 2004); the Eos US edition
  is 2005.'

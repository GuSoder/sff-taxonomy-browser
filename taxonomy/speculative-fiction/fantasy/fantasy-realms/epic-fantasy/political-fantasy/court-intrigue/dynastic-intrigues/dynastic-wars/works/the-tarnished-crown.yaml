placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Dynastic intrigues > Dynastic wars. The Falcon Throne (Orbit 2014, only Tarnished Crown volume published) opens
  a succession war: Duke Salbert''s line against rival claimants, armies in the field deciding the throne of Harcia and Clemen
  (Orbit/Hachette; jacket ''The Tarnished Crown Book One''). Rival houses take the field and the war decides - the leaf''s
  definition. Rejected: Dynastic favor (decided by arms, not the ruler''s regard), Court statecraft (not diplomacy-first),
  Military fantasy (the war serves the succession, not the ranks'' view of campaigning). Wobble: real; the bastard Balfre
  and the scheming duchesses brush dynastic-spy-games, but open war between claimants is the engine.'

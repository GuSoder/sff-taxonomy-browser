placement_rationale: Root-down traversal passes Epic fantasy -> Political fantasy -> Court intrigue -> Early modern dynastic intrigue. Macmillan and Bardugo identify a complete two-book duology about King Nikolai defending his throne and Ravka through political intrigue, rival powers, diplomacy, invasion and war while containing dark magic. The ruling-house and state struggle drives both books, making Court intrigue closest.

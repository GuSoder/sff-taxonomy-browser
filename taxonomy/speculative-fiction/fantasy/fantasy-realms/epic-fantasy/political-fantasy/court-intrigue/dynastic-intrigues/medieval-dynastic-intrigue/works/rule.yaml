placement_rationale: 'Full root-down walk: Fantasy (the invented kingdom of Kolonya and the outer Reaches) > Fantasy realms
  > Epic fantasy > Political fantasy (the plot is who will wear the crown) > Court intrigue, not Revolutionary fantasy (there
  is rebellion in the east, but the books follow the claimants, three girls with deadly secrets, not an uprising) and not
  Court spies or Court statecraft (the claim, not covert action or ruler diplomacy, is the engine) > Dynastic intrigues >
  Medieval dynastic intrigue, not Renaissance or Early modern (a dying king, a murdered heir, a feudal realm with travelling
  bands and kings by blood): the question is succession and legitimacy. Hachette (https://www.hachettebookgroup.com/titles/ellen-goodlett/rule/9780316515290/).
  Medieval dynastic intrigue is now ten fictions.'

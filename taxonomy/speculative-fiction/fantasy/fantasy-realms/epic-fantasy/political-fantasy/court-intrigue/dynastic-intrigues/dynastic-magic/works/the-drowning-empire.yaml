placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Epic fantasy -> Political fantasy -> Court intrigue -> Early
  modern dynastic intrigue. Hachette identifies the complete trilogy and grounds an emperor whose bone-shard constructs enforce
  imperial order, a disinherited heir reclaiming the throne, revolution across the islands, weak alliances, rebel armies and
  the threatened fall of the Sukai dynasty. The trilogy’s explicit magic supplies the means, but contested imperial legitimacy
  and survival of the ruling house govern, so Early modern dynastic intrigue beats Hard magic.'

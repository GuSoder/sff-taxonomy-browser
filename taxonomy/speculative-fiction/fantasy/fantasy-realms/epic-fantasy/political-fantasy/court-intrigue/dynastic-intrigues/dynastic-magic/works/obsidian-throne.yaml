id: obsidian-throne
title: Obsidian Throne
authors:
- Maithree Wijesekara
first_published: 2025
canonical_genre: dynastic-magic
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court intrigue >
  Dynastic intrigues > Dynastic magic.


  Scope: one Obsidian Throne fiction with The Prince Without Sorrow (2025) and The Witch Without Memory (2026). Current HarperCollins
  pages establish US18March2025 and10March2026, while UK first-book27March2025 is independently confirmed in the author''s
  Fantasy Hive interview and guest essay. These are regional editions of the same novel, not new books. The Emperor Without
  Mercy is the third/final novel but the current publisher date is27April2027, after intake22November2026. Exclude it from
  published book count even though its plot preview and cover are available. The author explicitly describes an invented fantasy
  world, reverse ethical arc inspired by historical Ashoka, not historical India with magic added. Whole shared series one
  fiction, not three unrelated queue cards. Eighteen fetched pages read from primary author/publisher, professional completed
  criticism, independent criticism and a community review page. No full-novel reading claimed; community spoilers kept attributed,
  not silently elevated to confirmed canon.


  Individual published arcs: Prince pairs Shakti''s mayakari pacifist upbringing and revenge curse against the emperor who
  massacres her village with Ashoka''s rejection of his violent father''s legacy. The emperor dies, but his consciousness
  remains with Shakti. She enters the palace as a servant to turn the royal children against their father''s legacy, while
  Ashoka is sent to govern Taksila and must negotiate actual survival, power and violence. Professional criticism identifies
  court politics, competing siblings and the price of vengeance as central. The novel ends with the sister gaining ascendancy
  and Shakti captured rather than a resolved revolution. Witch starts immediately afterward: Aarya claims rule, keeps Shakti
  captive and compels her to utter a curse she cannot remember, while Ashoka tries to preserve his mayakari-protection decree,
  acquire allies and displace his sister. Nature spirits, a Great Spirit, cursed weapons and Shakti''s powers are tied to
  political leverage and the family''s hidden history, not a detachable magic-school adventure. Ashoka/Rahil''s relationship
  becomes more important but remains one thread alongside Shakti and dynastic struggle. Completed readers consistently confirm
  a consequential late turn and cliffhanger, though they radically disagree on its effectiveness. A community reviewer reports
  the apparent intended curse target differs from its actual victim, brother and mother deaths, and Ashoka''s mayakari ancestry
  reveal. Those precise spoilers have only reader-level support here; the robust classification rests on broader corroborated
  throne/magic/persecution mechanics, not a disputed exact curse formulation or invented final-series outcome. The unpublished
  third-book preview supports continuity only and is not used as a third completed arc.


  Root: supernatural nature spirits who embody land, spirit speech, ambiguous cursed language, raising the dead, shared consciousness,
  and magical abilities are actual world mechanisms. No scientific explanation, future technology, extraterrestrial frame
  or speculative counterfactual technology justifies SF. Fantasy realms passes because Ran is explicitly an invented fantasy
  world. Real names Maurya/Ashoka/Taksila and historical inspiration are insufficient for Historical fantasy: the author says
  the novel is not historical and she deliberately reverses the historical figure''s ethical development. It is not an Earth-to-otherworld
  portal or an Earth mythic retelling. The story''s Buddhist ideas and South Asian setting are genuine substantive material
  and must not be discarded, but ancestor gate is invented-world fantasy.


  All seven Fantasy realms branches: Epic passes consequential public power, imperial geography, rival governors and rulers,
  cross-border allies and nature/magic institutions. Heart fantasy has a meaningful male-male bodyguard romance but no coequal
  pair governing both principal arcs; Shakti has no central romantic partner. The appearance of a curse between a witch and
  the emperor does not make their coercive shared-consciousness relation romantic. Cozy fails comfort/safety/belonging as
  governing experience amid persecution, mass murder, captivity and contested rule. Horse bond absent. Sword and sorcery fails
  intimate combat/outlaw/heist/pirate/contest engine: violence exists but deciding who controls the realm is the actual problem.
  Fairytale fails a governing fairy-tale quest, retelling or invented fable logic; curse language and spirits alone do not
  make it a fairytale curselift. Gothic realms is a credible darkness rival: persecution, possession, abusive family and captive
  witch are real. Yet the series is organized by power choices and political ambition rather than sustained dread/haunting/dark
  appetite. Grimdark Magazine explicitly says darkness/moral ambiguity do not make this grimdark. No manners/courtship genre
  from merely having a court, no occult-detective caseload, no isolated enclosure dominating both arcs, no necromantic machinery.
  Comic fails humor/parody governing the work. Far shores > Katha is a serious alternative, not an author-ethnicity shortcut:
  karma, rebirth, nonviolence, attachment and the nature-spirit world actually structure choices. However, the explicit local
  about-ness test gives an existing political engine priority when culture is not the governing organizing subject. The author
  says the inspiration was primarily Ashoka''s ethical reversal, not an attempt to reproduce the Mauryan period. Both published
  books center internal regime/succession and power choices; Katha would flatten those into heritage setting. Buddhist principles
  inform the mechanism and dilemmas without replacing the throne contest as the engine.


  Epic children: Political over Heroic because the dual viewpoint is not organized by a single adventuring class or rising
  magical hero. Shakti''s curse and spirit affinities could invite Grey sorcerer/Black mage/Necromancer, but the novel is
  neither primarily a necromantic craft career nor a single hero''s magical formation; Ashoka''s public power and opposing
  siblings remain equally causal. High fantasy and its journey/heroic-template leaves lose because travel to provinces/allies
  is means to authority rather than one governing quest, chosen savior or fellowship expedition. Hard fantasy has genuine
  rules and ambiguous cursed speech, but magic remains contingent, poorly understood and ethically/politically deployed rather
  than technical extrapolation or time manipulation. Mythological has nature spirits and Buddhist cosmology, but no inherited
  named gods'' own story or sustained mythic register as principal experience. Military becomes increasingly plausible as
  armed allies and war approach, but the two published books focus on palace captivity, governance, family claims and preparations,
  not a campaign experienced through soldiers or an army unit. Do not classify the still-unpublished campaign as if it were
  read.


  Political siblings: Court intrigue passes because the internal ruling house and throne are the central prize. Revolutionary
  fantasy is genuinely tempting: oppressed mayakari seek to live, Shakti wants to destroy the dynasty, and Ashoka''s pacifism
  cannot protect his subjects. But the means and the changing character goals in the two published novels are an insider succession
  contest and magic used by the ruling line, not one governing mass movement across communities. Ashoka increasingly wants
  to replace his siblings and rule the existing empire differently, while Aarya coerces magic to hold authority. Palace insurgents
  is the strongest revolutionary rival: Shakti infiltrates the palace and seeks to make the family destroy itself. Its definition
  says the court is a weapon and the empire itself is the target, not the prize. That fits Shakti''s first-book plan better
  than the whole two-viewpoint series, particularly Ashoka''s second-book alliance/claimant project and the family''s shared
  secrets. Neither is it open multi-front Evil empire fantasy merely because there is a cruel empire: systematic mayakari
  terror is real, but the current narrative lens stays tightly within ruler family, insider witch and local governance, not
  common cause across separate resistance fronts. Samizdat has burned libraries/suppressed witch knowledge, but recovering
  erased memory or a rite is not the resistance''s governing work. Tinderbox''s occupied-city eruption is not the series-wide
  shape. Outlaw has real hunted witches and protection, yet not a sustained covert hiding/extraction network. War/Academy/Pirate
  insurgents fail their own institutional modes. Overthrow is a real sibling-family resemblance: Usurper applies Aarya''s
  seizure, Regicide applies the initial emperor''s death, Vengeance war to Shakti''s murdered family, Proletariat to persecuted
  people. But none is as exact as the ongoing dynasty using magic and its coercive counterpart, while the text never resolves
  to a single mass revolution/remade state. Magic politics is another strong rival because public suppression/control of witch
  power is consequential across both books. Its own boundary gives Court intrigue the contest whose governing prize is the
  ruling house/court. Here gaining, keeping and redirecting Maurya authority supplies the concrete actions; persecuted powers
  and nature relations are the means, ethical stakes and constituency rather than a wider institutional politics independent
  of this dynasty. Geopolitical fantasy sees foreign allies and Kalinga, but these serve the internal throne contest; interstate
  balance is not governing. No election or mass franchise.


  Court intrigue: Dynastic intrigues over Court spies or Court statecraft. The work is not a professional agent''s mission,
  and a false servant identity does not by itself make the whole espionage. Ashoka''s attempts at governing Taksila and negotiating
  allies make Courtly/Martial statecraft serious, but those actions occur inside a contested-succession story with active
  rival siblings and weaponized witch power. Public good and ruler survival do not erase the ruling-line contest. Dynastic
  parent passes succession, competing legitimacy and direct threats to the house from outside and within.


  Weapon ladder: Dynastic magic is the most exact whole-series instrument. Shakti''s curse against Adil, his continuing consciousness,
  the compelled curse Aarya uses to manipulate rivals, concealed magic/ancestry and threatened deployment of spirits repeatedly
  change the family''s power. This is not merely a dynasty located in a magical world. The supernatural mechanisms are weapons
  within the succession. Dynastic wars is a substantial prospective/second-book-adjacent rival, but gathering allies and anticipating
  an army do not mean the two published novels are chiefly the field war deciding the throne. Do not move it there simply
  because the 2027finale promises war, or avoid it because it currently has nine. Dynastic assassins has an emperor''s death
  and poisoning of a royal sibling, but the act of poisoning/knife assassination is not the whole engine. Dynastic murders
  fails a governing inquiry into who killed the ruler: actual killer/curse consciousness and political consequences are not
  a whodunit. Dynastic favor is not a prolonged competition for an incumbent''s affection/council standing. Dynastic impostors
  has Shakti''s disguised service and hidden lineage, but one sustained false identity/exposure game does not decide the whole
  published arc. Dynastic spiderwebs has plotting, not an agent network as the core weapon. Curses/spirits and their force
  on the ruling family are more specific.


  Evidence balance: PW and BFS praise politics, world and ethical complexity, while Just Geeking By, Biblio Nerd and long-form
  community reviewers criticize weak pacifism transitions, moral inconsistency, meandering plot, effortless powers and late
  twists. Favorable readers see the same shifts as deliberate character development. Preserve disagreement over execution
  rather than turn praise into plot facts. Biblio Nerd''s blog review is reposted by the same Chris Monceaux on Goodreads
  and is not independent corroboration. DNF33% comments cannot establish climax. Community reviewer inference about a planned
  fourth volume is superseded by author/current publisher naming a trilogy/final third book. No identity claim about a reviewer
  is needed beyond the observed username/byline. Romance tags are not decisive and the first-book metadata calling it a comic
  is a website error, contradicted by publisher/actual prose reviews, not a format claim to copy.


  Decision: Obsidian Throne, two published novels2025/2026, existing Dynastic magic7to8. Moderate confidence because Magic
  politics and Palace insurgents really capture large portions, with Katha a substantive cultural rival. The shared whole
  is an internal dynasty contest whose supernatural weapons repeatedly determine power. No structural change, capacity eight
  not ten, no parked pile. Full English fronts downloaded from author pages and visually inspected: Prince1859x2800 and Witch1167x1750,
  readable author/titles and uncropped complete designs. Different regional jacket designs are acceptable print fronts, not
  extra editions/books. Current live duplicate/capacity, exact app/repository delta, source ledger, deployment and pixels
  still required before completion.

  '
confidence: Moderate; Magic politics, Palace insurgents and Katha are genuine rivals.

placement_rationale: 'Path: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court intrigue
  > Dynastic intrigues > Dynastic wars. A two-novel story told as two halves (Soleri 2017, Silence of the Soleri 2021; the
  author calls it one story in two novels, Paul Semel interviews, Tor series name The Amber Throne), described as King Lear
  in ancient Egypt. It follows the fall of the Soleri empire through the Hark-Wadi ruling family of the Harkan kingdom, a
  house splintering under its father''s and king''s choices while the four subject kingdoms go to war (Rising Shadow review,
  publisher blurb, Lit Stack review of the second book). The ruling family and the war it brings drive the whole corpus, so
  Dynastic wars. Rivals rejected: Rebel fantasy (the contest is the ruling houses'' own, not an occupied people''s uprising),
  Dynastic assassins and Dynastic favor (the fight is fought with armies, not poison or regard), Geopolitical fantasy (the
  family, not the balance among states, organizes the books). Wobble: Dynastic magic, since the Soleri rite and sun-cult magic
  recur, and Geopolitical fantasy. Two novels only; the planned novella and standalone are unpublished or off scope.'

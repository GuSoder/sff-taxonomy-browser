placement_rationale: 'Source-read (2026-10-07): Half a King is revenge and survival after a usurpation, a slave-chained sea
  journey; Half the World follows a warrior girl and Yarvi''s alliance voyage; Half a War is the High King''s war of conquest
  and the alliance to stop it, with Skara reclaiming her birthright. Viking-flavored war saga with a political layer, so Dynastic
  wars, not Dynastic spy games. Walked root-down: Fantasy -> Fantasy realms -> Epic fantasy -> Political fantasy -> Court
  intrigue -> Dynastic intrigues -> Dynastic wars.'

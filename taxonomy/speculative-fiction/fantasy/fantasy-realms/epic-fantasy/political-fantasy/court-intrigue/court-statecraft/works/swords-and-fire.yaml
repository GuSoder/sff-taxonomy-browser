placement_rationale: 'One shared world (rule 11j): the Swords and Fire trilogy (The Tethered Mage, The Defiant Heir, The Unbound
  Empire) and the Rooks and Ruin trilogy (The Obsidian Tower, The Quicksilver Court, The Ivory Tomb) are set in the same world,
  so they sit on one fiction. A Serene Empire that binds its mages to state service, and the diplomats, warders and rulers
  who keep it together under threat of war and sorcery: ruler-level diplomacy, governance and political survival under military
  pressure. Walked root-down: Fantasy -> Fantasy realms -> Epic fantasy -> Political fantasy -> Court intrigue -> Court statecraft.'

placement_rationale: Root-down traversal passes Epic fantasy -> Political fantasy
  -> Court intrigue -> Court Statecraft. Penguin Random House and Hachette set this
  fantasy in a world evoking early Renaissance Italy, where rival mercenary commanders,
  rulers, assassins, courts and religious power put the world in balance. Its invented
  near-Renaissance world's political rivalry and court intrigue are the main engine,
  so Political fantasy is the closest leaf.

canonical_genre: courtly-statecraft
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Political fantasy > Court intrigue > Court statecraft > Courtly
  statecraft. Basso, the Magnificent Bassano, banker turned First Citizen of the
  Vesani Republic: the fiction is his rule, and the realm is held together by civilian
  instruments - the loan, the monopoly, the marriage, the counsel - never by armies.
  The Courtly statecraft gate (the lever is the word, not the army) governs; rejected
  Martial statecraft (almost no war; the Empire is a trade rival, not a battlefield)
  and Dynastic intrigues (the Vesani are a republic of families, no succession or
  legitimacy engine). Wobble disclosed: Basso''s signature lever is the ledger -
  state finance, banking and the monopoly - beside the gate''s word; the civilian
  non-martial frame is what the gate opposes to Martial statecraft, and the ledger
  is a civilian instrument. Standalone novel, one card.'

definition: 'Court statecraft run through the courtly arts: the treaty, the marriage of state, the mission and the counsel hold the realm together under threat. The lever is the word, not the army. Split of Court statecraft at ten cards by the lever the statecraft runs on (curator "Approved" (phonemsg-01M59V8WXD1ZKNZT2R0Z4R0R3F, 2026-10-19 12:28 PM); names after his grammar steer phonemsg-01M59V1CCFYQCX04M62VDTW7RA and his 7:11 hint steer phonemsg-01M5994ARH4K748S87ZQTXCDNE). Not Martial statecraft (rule run through war).'

definition: 'Court statecraft run through war: the campaign, the siege, the war-finance and the administration of what the army conquers. Not simply war fiction - the war is the lever of rule, not the spectacle (his question "What exactly is martial statecraft, is it simply war?" phonemsg-01M59V7D98A95SJ9Z84GVDYFZS, answered 12:27 PM). Split of Court statecraft at ten cards by the lever the statecraft runs on (curator "Approved" (phonemsg-01M59V8WXD1ZKNZT2R0Z4R0R3F, 2026-10-19 12:28 PM); names after his grammar steer phonemsg-01M59V1CCFYQCX04M62VDTW7RA and his 7:11 hint steer phonemsg-01M5994ARH4K748S87ZQTXCDNE). Not Courtly statecraft (the courtly arts).'
status: provisional

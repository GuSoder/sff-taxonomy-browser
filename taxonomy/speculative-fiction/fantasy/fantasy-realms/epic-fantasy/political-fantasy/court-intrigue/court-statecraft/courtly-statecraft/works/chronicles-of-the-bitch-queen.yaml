placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy >
  Court intrigue > Court statecraft > Courtly statecraft. One fiction under rule 11j: the trilogy (The Wolf of
  Oren-Yaro 2020, The Ikessar Falcon 2021, The Dragon of Jin-Sayeng 2021), Orbit''s Chronicles of the Bitch Queen.
  The engine is ruler-level political survival: Queen Talyien, married to the Ikessar heir to unite the warring
  clans, rules alone and must hold a divided Jin-Sayeng against warlords, betrayal and assassination - "she must
  survive and hold her country together" (Grimdark); book 2 has her in hiding maneuvering back, book 3 returning to
  reclaim rule. The levers she pulls are the marriage of state, alliances, missions and counsel - the word, not the
  army: she is mostly alone, on the run or outmaneuvering, never a campaign commander. Not Martial statecraft (the
  war is the pressure, not the lever of rule she works), not Dynastic intrigues (her legitimacy is challenged but
  the spine is the reigning queen''s statecraft, not a succession contest between claimants). Wobble disclosed:
  heavy personal combat throughout and open war by book 3; the statecraft spine governs under the overarching-theme
  ruling.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Court statecraft. Askia, heir to the Frozen Crown of Seravesh, fights the mad emperor of the Roven Empire''s
  invasion by diplomacy and alliance as much as by sword, in a secondary world where magic is rare and her own is a dangerous
  secret; the second book, The Seventh Queen, is the same Warrior Witch duology (author page gretakkelly.com). The pull is
  ruler-level governance and survival under military pressure, the leaf''s definition. Rejected: Invasion resistance style
  leaves with a war focus (the book is built on the queen''s court decisions and alliances). Wobble: moderate; it is also
  a plain war fantasy. Sources: author site only. Years: 2019, 2020. The Queen of Days (MC03600) is a different, unconnected
  heist fantasy and is not folded.'

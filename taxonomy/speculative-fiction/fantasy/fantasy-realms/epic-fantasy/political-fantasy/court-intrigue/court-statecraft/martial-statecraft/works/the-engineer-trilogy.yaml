id: the-engineer-trilogy
title: The Engineer trilogy
authors:
- K. J. Parker
first_published: 2005
canonical_genre: martial-statecraft
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Political fantasy > Court intrigue > Court statecraft > Martial
  statecraft. Ziani Vaatzes, condemned by the Perpetual Republic of Mezentia for a
  non-standard doll, prosecutes his revenge by running other states'' wars: he arms
  Eremia, builds the Aram Chokat an army, finances and supplies both sides, and the
  trilogy closes on the siege and fall of Mezentia itself. Campaigns, sieges,
  war-finance and the administration of conquest are the page bulk, and the war is
  the lever - of Ziani''s device and of every ruler''s survival - never the spectacle:
  the Martial statecraft gate word for word. Rejected: Mud-and-blood fantasy (nothing
  is told from the ranks), Command-tent fantasy (the engineer, not the commanders,
  decides these wars), Vengeance war fantasy (the revenge engine is real, but that
  leaf''s Overthrow parentage - civil war, uprising, liberation - mis-describes an
  interstate war prosecuted through client states, and its massacred-house gate does
  not match: his family lives inside the city), NPC heroes (the fiction is
  war-statecraft, not a classless hero''s journey), Technofantasy (Mezentia''s industry
  is precision clockwork, neither steam, magitech nor diesel). Wobble disclosed: the
  protagonist is an exiled craftsman, not a court insider - the court-and-council
  fabric is carried by the Mezentian Guild, Valens'' and Orsea''s courts around him.
  No magic anywhere in the trilogy; the Fantasy root stands on the invented world
  (imaginary-world fantasy, same convention as the author''s Siege trilogy already in
  the tree). Whole trilogy folded as one fiction (series completion: The Escapement
  was not in the queue).'

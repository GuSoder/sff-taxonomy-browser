placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic
  fantasy > Political fantasy > Court intrigue > Court statecraft. The queendom of the
  Fells is ruled by the Gray Wolf line; Princess Raisa, heir to the Gray Wolf Throne,
  must hold her right against scheming wizard houses newly freed from the Naeming
  accords, the mountain clans who distrust the crown, and the threat of war from
  Arden, with marriages of state and council politics as the levers (series copy).
  Ruler-level diplomacy, governance and political survival under military pressure,
  the leaf definition. Rejected: Dynastic intrigues and its children (the faction
  fight is open council and succession politics, not espionage and covert murder),
  Court spies (no spy protagonist), Hidden-heir quest fantasy (her royalty is known
  from the first page). Wobble: moderate; Han Alister''s street-thief-to-wizard arc
  carries a parallel coming-of-age line. One shared world (rule 11j): the four Seven
  Realms novels fold as one fiction; the later Shattered Realms books are a separate
  generation and not in the queue.'

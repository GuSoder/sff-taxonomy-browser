placement_rationale: 'Full root-down walk: Fantasy (invented nations; ranger-and-woods magic, no science engine) > Fantasy
  realms > Epic fantasy > Political fantasy > Court intrigue, not Revolutionary fantasy (no uprising) > Court statecraft,
  not Court spies (no covert plots) and not Dynastic intrigues (no succession fight): three vastly different heroines (Mona,
  Gemma and the woodwalker of book one) must form unlikely alliances to halt a tumultuous war, with Mona''s last-ditch diplomatic
  mission to secure peace as the hinge of book two; governance and survival under military pressure. Military fantasy considered
  and rejected: the war is the threat they try to stop, not the ground-level story. Weak card: the publisher also pitches
  it for ''rangers, princesses, warriors, scribes'' and some viewpoints carry the action. Author site (http://www.emilybmartin.net/the-creatures-of-light-trilogy.html).'

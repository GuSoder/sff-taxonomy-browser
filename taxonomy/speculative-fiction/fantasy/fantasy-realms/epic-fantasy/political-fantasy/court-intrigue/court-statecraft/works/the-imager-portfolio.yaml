placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Political
  fantasy -> Court intrigue -> Court statecraft. L. E. Modesitt Jr.''s Imager Portfolio (Tor, 2009 to 2019; Wikipedia, ''Imager
  Portfolio'', 12 books, island continent Lydar/Solidar): books 1 to 3 follow Rhennthyl, a portrait painter who finds he can
  visualize objects into existence, through the Imager Quarter and the Civic Patrol; books 4 to 8 are a prequel arc about
  Quaeryt, a scholar-imager who hides his talent while he advises Lord Bhayar and governs conquered provinces in a war of
  consolidation; the last books are Quaeryt and Alastar''s. Most of the cycle is rulers'' war and administration: governorships,
  campaigns, succession and the political survival of a talent his society despises. That is the Court statecraft definition
  (ruler-level diplomacy, governance and political survival under military pressure). Tried: Fledgling mage (the learning
  is only book 1; after that the imager is a working officer or governor), Graybeard mage (the protagonists are not established
  masters), Channeled hard magic (imaging has a cost, but the system is not the through-line the way order and chaos is in
  Recluce), Military fantasy (the wars are rulers'' wars seen from the council and the governor''s seat, not the ranks). Wobble
  moderate: the first three books are an imager''s coming of age. Alternative home Fledgling mage (8; dissolved 2026-10-12 into Black, Grey and White Mages). Twelve novels folded
  as one fiction (11j). Years are first publication (Wikipedia months). The Imager Portfolio volumes I to III in the queue
  are omnibus rows and are skipped. Covers: only Imager carries one; the Open Library covers for Scholar, Princeps and Imager''s
  Challenge are title pages and Imager''s Intrigue is a library copy with a barcode sticker.'

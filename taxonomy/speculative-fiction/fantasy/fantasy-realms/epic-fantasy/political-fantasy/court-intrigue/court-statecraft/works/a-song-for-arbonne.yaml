placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Court statecraft. Blaise, a Gorhaut mercenary, serves the troubadour courts of Arbonne, a matriarchal Provence-like
  land with two moons and a feud between its two great dukes, while militaristic Gorhaut under a corrupt king prepares invasion
  (Penguin Random House and Publishers Weekly descriptions). The story is rulers, courts and alliances holding a country together
  under the threat of war. Rejected: Court spies (the plots are open feuds and treaties, not espionage), Dynastic wars (the
  war is between kingdoms, not claimants). Wobble: moderate; it is also a romance and a medieval-analogue novel. Sources:
  publisher pages only. Year 1992 (first edition).'

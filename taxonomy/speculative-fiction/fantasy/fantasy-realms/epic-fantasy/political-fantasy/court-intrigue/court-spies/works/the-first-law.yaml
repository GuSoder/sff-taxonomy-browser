placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Court intrigue -> Court spies. Hachette grounds a complete trilogy of murderous conspiracies, treason investigation at the rotten heart of government, feuds, torture and brewing war. The insider conspiracy/inquisitor engine is more specific than dynasty or ruler-level statecraft.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Court spies. Caius Crispus, a master mosaicist, is summoned to Sarantium, the Byzantium of an alternate world,
  carrying a queen''s secret mission; in Lord of Emperors he is caught in the conspiracies, rumours and factional intrigue
  of the emperor''s court and city (Penguin Random House descriptions of both books). Sailing to Sarantium and Lord of Emperors
  are one duology, folded into one card. Rejected: Court statecraft (Justinian-style rule and the reconquest are backdrop,
  the plot follows secret errands and conspiracy), Dynastic spy games (no succession fight). Wobble: moderate; the artist''s
  story and the war share the stage. Sources: publisher pages. Years: 1998, 2000.'

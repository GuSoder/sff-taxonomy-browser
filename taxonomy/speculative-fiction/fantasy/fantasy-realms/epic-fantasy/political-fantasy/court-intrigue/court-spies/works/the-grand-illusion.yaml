placement_rationale: 'L. E. Modesitt''s The Grand Illusion (Isolate 2021, Councilor 2022, Contrarian 2023, Legalist 2025;
  Tor, Pan Macmillan): a gaslamp political fantasy of an industrializing imperium, Guldor, ruled by a Council of Sixty-Six,
  where Steffan Dekkard, an ''isolate'' immune to the mages'' magic, works in the Council''s security service amid underground
  movements, corruption and surveillance; Legalist is set 450 years earlier. Walk: Fantasy realms > Epic fantasy > Political
  fantasy > Court intrigue > Court spies (conspiracy and covert manipulation inside the ruling body). Weak: the ruling body
  is a Council, not a court; the alternative is Court statecraft, at 9. Premier (Nov 3 2026) is unreleased and skipped. Sources:
  Tor, Pan Macmillan blurbs; not read.'

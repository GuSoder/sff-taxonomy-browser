placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Political fantasy > Court
  intrigue > Court spies. Saker looks like a simple priest but is a spy for the head of his faith; wounded by a Lascar sailor''s
  blade, he finds the weapon follows him and he must follow it (author''s site, glendalarke.com, ''scheming, spying, action
  and adventure''); in The Dagger''s Path the thread runs to the spice islands on the other side of the world while those
  at home face their own threats, and The Fall of the Dagger ends with sorcerers, pirates and thieves colliding. Three books
  (The Lascar''s Dagger, The Dagger''s Path, The Fall of the Dagger; ISFDB series record 36109) are one fiction under rule
  11j. A covert agent of a ruling faith whose secrets and plots drive the story, which is the leaf''s espionage frame. Rejected:
  Revival quest fantasy and Revisionist quest fantasy (the dagger pulls characters apart, there is no fellowship), Dynastic
  spy games (nobody is contending for a crown), Bonded hard magic (the dagger is a pull, not a bond with terms). Wobble: strong;
  the head of a church is the ruling body here, not a court, and books two and three widen into a world-spanning adventure
  that I read only from the author''s own summaries. Years follow ISFDB (2014, 2015, 2016).'

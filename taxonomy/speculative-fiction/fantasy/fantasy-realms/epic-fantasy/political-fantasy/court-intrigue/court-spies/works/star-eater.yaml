placement_rationale: 'Kerstin Hall''s Star Eater (2021, Tor.com, 448 pp; Library Journal review, kerstinhall.com). In the
  nation of Aytrium the Sisterhood guards the realm with cannibalistic magic; Elfreda Raughn, desperate to escape the Order''s
  bloodline duty, takes a shadowy cabal''s offer and becomes their spy inside the Sisterhood, rising into its highest reaches
  of opulent parties, subtle deceptions and conspiracies. Walk: Fantasy > Fantasy realms > Epic fantasy > Political fantasy
  > Court intrigue > Court spies (espionage and conspiracy inside the ruling Order drive the fiction). Tried: Magic politics
  (the contest is her place inside the Order, not public authority over magic as such) and the Earth-side occult branches
  (Aytrium is a secondary world). Wobble: the Order is a sisterhood, not a royal court, but it is Aytrium''s seat of power.
  Source: publisher description, Library Journal.'

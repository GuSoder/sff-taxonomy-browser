definition: 'Political fantasy whose governing contest is public authority over supernatural power: who may wield it, and
  who suppresses or controls it. The regulation and control of supernatural power organize the whole fiction, not merely politically
  active magicians. Court intrigue takes contests whose governing prize is the ruling house or court; Revolutionary fantasy
  takes a governing overthrow or liberation movement; Election fantasy takes mass franchise.'

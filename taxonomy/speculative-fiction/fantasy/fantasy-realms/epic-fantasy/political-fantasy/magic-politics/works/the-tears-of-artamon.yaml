placement_rationale: '# Artamon whole fiction repair, 6 November 2026


  Seven positively connected novels become one fiction in approved Magic politics, replacing Tears of Artamon4 plus The Alchymist''s
  Legacy2 plus Songspinners. Two existing cards become one; two novels added. Main title retained with expanded scope stated.
  No Moths to a Flame or The Lost Child folded: comparative chronology and general other-novels comment are insufficient primary
  identity proof for those two. The secondary overview suggests geographical/theological links, recorded as unconfirmed, not
  used to merge.


  ## Every work''s own engine

  Lord of Snow and Shadows2003: painter Gavril inherits Azhkendir''s throne and a dragon daemon needing innocent blood. Eugene''s
  rationalizing empire and guns confront inherited supernatural sovereignty. Dynastic magic strong for this book.

  Prisoner of the Iron Tower2004: Gavril expels daemon and is imprisoned; Eugene seeks its power, women sustain rebellion
  and a spirit quest, rubies reunite imperial sovereignty. Prior2005 was paperback year.

  Children of the Serpent Gate2005: imperial human conflict meets escaped daemons and their children; Kiukiu''s spirit-singing,
  hosts'' corruption and the Francian anti-magic order bring mythic and state conflicts together. Completed SFFWorld review
  says daemons increasingly overtake human events, a real mythological rival acknowledged.

  Tracing the Shadow2008: inquisition burns magi, apprentice Rieuk blackmailed into supernatural crime, orphan Klervie/Celestine
  guarded by a spirit becomes a celebrated singer seeking justice. Completed Booksforabuck explicitly says Celestine''s growth
  is main narrative and wars/assassinations/political intrigue hidden undertones, so not ruler-level statecraft.

  Flight into Darkness2009: Rieuk must restore guardian Azilis between living/dead while she protects Celestine; inquisition
  hunts singer''s forbidden power, dragon daemons threaten world. Author interview explicitly sets it through/beyond original
  trilogy from enemy viewpoint. Completed Klausner review corroborates these own stakes, not merely metadata.

  Songspinners1996: Orial''s forbidden musical gift allows transcribing persecuted composer Khassian''s seditious opera; religious
  agents pursue them, her musical telepathy and lost Lifhendil heritage risk sanity. Author explicitly says few years after
  Flight with returning characters. Author/Baen primary and Susie Williamson completed review used. Not a dynasty contest
  or a conventional bard adventure whole.

  The Arkhel Conundrum2019: foreign extraction awakens winter deity, clan hatreds and fragile imperial peace return; Gavril/SpiritSinger
  Kiukiu seek Eugene, distracted by flying-machine contest, while disappeared magus and daughter Larisa''s inherited daemon
  power complicate control. Author explicitly book4 and October2019 print publication. 2020 review date is not first publication.


  ## Full actual root walk

  Speculative -> Fantasy: literal spirits, daemons, telepathy and supernatural ancestry, not scientifically explained SF.
  Fantasy realms: invented Rossiya/Francia/Tourmalise, not real Earth despite eighteenth-century counterpart vocabulary, no
  Earth-crossing portal frame. Seven realm branches: Epic passes cross-state politics, cosmology and intertwined magic systems.
  Sword and sorcery no intimate combat/heist adventure governing whole; Fairy-tale revision no inherited tale or deliberate
  invented fairy-tale grammar; Far shores fails non-Western counterpart-cultural aboutness; Comic fails governing parody/absurdity;
  Heart fails romance/cozy/horse bond as spine. Gothic substantial blood appetite, persecution and daemon menace, but whole
  moves through public authority, religious/magical order and political conflicts, not sustained dread/enclosure; no manners
  or mystery caseload engine.

  Epic children: Political passes struggles over public authority and supernatural power across rulers, states, religious
  institutions and persecuted people. Heroic class-tree fails ensemble whole (Songspinners musical heroine doesn''t make all
  seven bard adventures); High fantasy fails governing consequential journey over whole; Military fails army/ranks as lens;
  Hard fantasy fails scientific learnable rules as organizing subject (author says raw magic rational enlightenment cannot
  explain/contain); Mythological strong rival in Children/Flight/Arkhel, but the whole includes Songspinners'' musical telepathy/ancestry
  rather than a divine-order relationship; not sustained experience of divinity or inherited mythlike past, not real-tradition
  mythic beings'' own war.

  Political existing children: Court intrigue/main4 strong, but Legacy/Songspinners are not governed by an insider contest,
  dynasty or ruler-level statecraft. Court spies and dynastic weapon ladder cannot pass their parent merely because agents/kings
  appear. Revolutionary real liberation/religious persecution in Legacy/Songspinners but not one mass-uprising/sacred leader/imperial
  resistance/inside-subversion/rescue/emancipation movement governing main4. Election no mass franchise. Existing whole-tree
  gates do not fit without stretching.

  Approved fourth Political child Magic politics: governing contest is public authority over supernatural power, who may wield
  it and who suppresses or controls it. Not merely magicians engaging in politics. Court intrigue wins when ruling house/court
  is contest; Revolutionary when overthrow/liberation is the governing movement; Election mass franchise. Political definition
  unchanged. Parent is level4 with only3 immediate children but structurally broad, disclosed before approval. Ceiling at
  approval ONE fiction, not Grishaverse bundled into decision.


  ## Authority and naming

  Original owner Approved phonemsg-01M6RHKZ46K3FRD9QN028GH4RG, reply to exact Approve seed block phonemsg-01M6RHFMFHDPTM16JZBFTJNXY3,
  independently read from authenticated channel6Nov14:44. Ordinary fiction scope grant phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX
  also read. Name descriptive not established critical taxonomy; reader vocabulary mage politics too narrow for dragon hosts/spirits.
  Exact searches no named-property clash found, not registry clearance. No dashes, franchise term or A+B. Two portrait variants
  generated and pixels inspected before selection. Hands hidden, no bows/arrows/quivers/text.



definition: 'Political fantasy of post-feudal mass-franchise politics - parties, campaigns, elected senates,
  the crowd at the box. Mass franchise is the gate: pre-modern balloting (Venice, conclaves) stays out;
  corrupted or rigged elections are in scope - bought votes are the machinery, not an exception. Court
  intrigue keeps feudal-stage politics (blood succession, courts, monarchs). Leaf created 2026-09-28 on
  the curator''s ruling (phonemsg-01M3K66AZFCBJSWMEGEAKKWYZ2) after the Fire Becomes Her hold.'

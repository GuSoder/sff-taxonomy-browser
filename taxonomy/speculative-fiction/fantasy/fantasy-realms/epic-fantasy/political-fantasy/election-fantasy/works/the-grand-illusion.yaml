first_published: 2021
canonical_genre: election-fantasy
placement_status: accepted
placement_rationale: 'Focused complete-fiction check, 2026-11-22, following frozen Court spies member research, not a corpus
  audit. Five published novels: Isolate2021, Councilor2022, Contrarian2023, Legalist2025 and Premier2026. Tor explicitly calls
  Premier the final novel and names the other four; the author confirms Legalist is a prequel about Avraal Ysella''s ancestor
  and a history referenced in Isolate. Premier is no longer unreleased: Tor on-sale2026-11-03 vs author2026-11-13, both past
  on2026-11-22. The exact day differs but publication status and year do not. Existing card''s ''mages'' explanation is unsupported:
  empaths can sense/project emotion, and isolates cannot be emotionally read/influenced. They are not necessarily immune to
  every conceivable magic. Author himself calls the novel science fantasy and his editor gaslight fantasy. Preserve that boundary
  rather than inventing wizards.


  Speculative > Fantasy is a moderate-confidence choice for a gaslamp/industrial fantasy with innate empathic talents and
  a counterphysical world rule that electrical power cannot work. This does not claim every speculative novel with psi belongs
  in Fantasy. SF/Period/Steampunk adventure is a genuine rival because high-tech coal/steam vehicles and an invented industrial
  world qualify as a setting. It loses on organizing engine: repeated electoral, legislative and constitutional contests,
  not invention, technological adventure or steam remaking an identifiable Earth history. No scientific explanation or engineered
  device accounts for empathic projection in the sources, and Hard science fantasy specifically requires known physics, which
  the no-electricity rule and unexplained psychic powers do not establish. Contemporary Psi requires the recognizable present;
  Futurist Psionics requires a future-of-Earth or reader-relative speculative-future frame, neither established here. Do not
  silently reframe Guldor as a scientifically explained psi future. Author''s new-world statement and the named Guldor institutions
  support Fantasy realms. A review''s assumption of alternate Earth is not proof of actual Earth continuity; no historical
  Earth setting or Earth crossing is established, so Real earth fantasy and Portal fail.


  Fantasy realms > Epic: detailed national institutions, class/economic change and centuries of political history. Sword and
  sorcery/hero-class adventure fits some bodyguard action in Isolate, not the legislative career and constitutional prequel.
  Fairytale revision, Gothic dread and Comedy do not govern. Far shores requires a defining non-Western counterpart culture,
  not merely Germanic-sounding names in invented Guldor. Heart/Romantasy is a real rival for Dekkard/Avraal''s romance and
  marriage, but the five-book society''s spine is public power, not courtship; Legalist concerns another generation and the
  constitution. Cozy/Horse also fail.


  Epic > Political: parties, public accountability, industrial and landed interests, constitutional limits and legislating
  are the declared engine. Hard magic system-learning, an inherited myth retelling, a classic high-fantasy quest and army/campaign/soldier
  warfare do not organize the whole fiction. Dekkard''s security training and a captured cruiser do not make this Military.


  Political > Election fantasy: the modern four novels concern a post-feudal, industrial, elected three-party council, party
  gains/majorities and parliamentary government rooted in a broad electorate, including working people and women. This is
  not simply a council voting among nobles. Detailed completed-reader franchise evidence explicitly includes workers and married
  women, with exclusions such as Susceptibles; SFF180 independently describes increased female participation and elections
  capable of replacing the governing party. Mass franchise does not require a perfectly universal or uncorrupted franchise
  under this leaf''s existing definition. Legalist is the real wobble:450years earlier, an elected legalist drafts the constitutional
  limitation of imperial power before later suffrage expansion. It supplies this parliamentary world''s founding history,
  not a reason to fragment the author-confirmed fiction. Confidence moderate, because this prequel contains imperial succession
  and not every novel is an election campaign. The leaf expressly includes parties and elected senates as well as campaigns.


  Court spies loses as the governing whole-fiction label: conspiracies/assassination and the first security job persist, but
  the books repeatedly turn on legislation, constituent representation, public opinion and party government rather than covert
  action inside a feudal ruling court. Court statecraft is likewise an old-world insider-government rival, not the more exact
  post-feudal franchise branch. Revolutionary loses because the protagonists generally defend or constitutionally reform government
  against violent unrest, not lead a continuing liberation movement. Magic politics loses because limits on empaths are part
  of the system but regulation of supernatural power is not the recurring governing contest. Geopolitical loses because the
  central conflict is domestic constitutional/party power, not the balance among rival states. No definition or structure
  changed: existing Election1to2; Court spies7to6.'

book_traits:
- title: Isolate
  year: 2021
  engine: Dekkard and empath Avraal guard Craft leader Obreduur amid corporate graft and assassinations; public unrest and
    elections can dislodge Commerce control.
  source: https://www.lemodesittjr.com/the-books/the-grand-illusion/isolate/
- title: Councilor
  year: 2022
  engine: Following the election-driven change of government, Dekkard becomes a councilor, drafts a bill to dismantle corrupt
    Security powers, navigates parliamentary compromise and faces targeted violence.
  source: https://www.lemodesittjr.com/the-books/the-grand-illusion/councilor/
- title: Contrarian
  year: 2023
  engine: After his patron is assassinated, the junior councilor navigates party leadership, constituents, riots and a corporate/government
    supply chain arming insurrectionists.
  source: https://www.lemodesittjr.com/the-books/the-grand-illusion/contrarian/
- title: Legalist
  year: 2025
  engine: Four hundred fifty years earlier, elected legalist Dominic Ysella builds a council coalition and drafts constitutional
    limits as the founding Imperador nears death and a tyrannical heir threatens the state.
  source: https://www.lemodesittjr.com/the-books/the-grand-illusion/legalist/
- title: Premier
  year: 2026
  engine: Eight years after Contrarian, senior Craft councilor and Security Committee chair Dekkard investigates a murdered
    corruption witness as his party holds a slim majority and opponents conspire against him and the Premier.
  source: https://www.lemodesittjr.com/the-books/the-grand-illusion/premier/

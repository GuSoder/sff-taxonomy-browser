canonical_genre: fairytalesque-quest-fantasy
placement_status: accepted
placement_rationale: >-
  Root-down: PRH/PW establish an original East-Asian-influenced fantasy world, a witch's curse trapping Bao's soul in a flute, and Lan and Bao's continent-spanning journey to break the spell through war, blood magic and romance. This passes Fantasy -> Fantasy Realms -> Epic fantasy -> High fantasy (quest fantasy). It is fairy-tale-like in tone but does not revise a specific familiar fairy tale, so the Fairy-tale revision gate fails.

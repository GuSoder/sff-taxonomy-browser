id: the-13-clocks
title: The 13 Clocks
authors: [James Thurber]
first_published: 1950
canonical_genre: fairytalesque-quest-fantasy
placement_status: accepted
placement_rationale: >-
  Gustav's 2026-09-21 ruling. Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Quest fantasy -> Fairytalesque quest fantasy. PRH grounds an original fairy tale in which Prince Zorn and the magical Golux must rescue Saralinda from the wicked Duke by completing impossible conditions and restarting thirteen enchanted clocks. Fairy-tale grammar and the impossible-task rescue quest govern. Comic wordplay is the mode, not the shelf; unlike Fairy-tale revision, the book does not rewrite one named inherited tale.

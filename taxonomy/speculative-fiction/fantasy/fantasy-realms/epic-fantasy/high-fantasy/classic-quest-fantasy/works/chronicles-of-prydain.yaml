placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Quest fantasy -> Classic quest fantasy. Macmillan presents the five-book Prydain sequence as Taran’s journey from Assistant Pig-Keeper toward heroism through a Welsh-inspired secondary world and an epic good-versus-evil struggle. Fellowship, maturation, ancient evil and world-shaping stakes make it a direct classic quest descendant.'

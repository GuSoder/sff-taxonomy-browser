id: the-dark-tower
title: The Dark Tower
authors: [Stephen King]
first_published: 1982
last_published: 2012
canonical_genre: classic-quest-fantasy
placement_status: accepted
placement_rationale: >-
  Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> High fantasy -> Quest fantasy -> Classic quest fantasy. SFE says the Fantasy Westerns increasingly take on a quest structure distinct from their early Western topoi, crossing a post-Holocaust landscape with mythic charge; King's official site centers Roland's journey across Mid-World to save the Dark Tower, heart of all worlds. Its fellowship, long secondary-world journey, ancient threat and world-shaping stakes are the classic quest template, while Western and wasteland textures are modes rather than the governing branch.

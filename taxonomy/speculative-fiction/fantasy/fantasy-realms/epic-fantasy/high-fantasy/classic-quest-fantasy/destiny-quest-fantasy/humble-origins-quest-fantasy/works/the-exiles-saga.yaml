placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic quest
  fantasy > Destiny quest fantasy > Humble origins quest fantasy. Angus Wells, The Exiles Saga, Exile''s Children (Millennium,
  Oct 1995; ISFDB https://www.isfdb.org/cgi-bin/title.cgi?239=) and Exile''s Challenge (1996); the queue years 2010 and 2012
  are the Spectra ebook reissues, so the card says 1995. One saga is one fiction. In the land of Ket-Ta-Witko the Amerindian-like
  People are beset by rainbow-armoured invaders led by a deathless warrior after a blood feud breaks their old peace, while
  in the distant land of Evander a serving girl (Flysse), a gentleman duelist (Arcole) and a young thief with the forbidden
  gift of True Dreaming (Davyd) are branded and exiled to the prison colony of Salvation; the three may hold the key to the
  People''s redemption, and the sequel follows their dream-guided flight out of servitude to the Matawaye (Kirkus https://www.kirkusreviews.com/book-reviews/angus-wells/exiles-children/;
  PRH https://www.penguinrandomhouse.com/books/188517/exiles-children-by-angus-wells/ and https://www.penguinrandomhouse.com/books/188515/exiles-challenge-by-angus-wells/;
  SFE confirms fantasy). Branch call: lowborn nobodies with a hidden gift become the people''s chance. Rejected: Fellowship
  quest (Evergreen takes works to the late 1980s, Revival from the late 1990s, and this is 1995-96; the three exiles are not
  a party sent against the ancient dark), Hidden heir (no birthright), Emancipation fantasy (the rebels in Salvation are the
  antagonists), Gateway multiverse (the gate into Salvation is a plot device, not the story), Political and Military fantasy.
  Wobble: high. The book is a two-land epic and the sources are Kirkus and publisher copy only, so the Humble origins read
  rests on the exiles'' arc. Humble origins is at 8 and takes this as the ninth card.'

placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> High
  fantasy -> Classic quest fantasy -> Destiny quest fantasy -> Hidden heir quest fantasy. David Drake''s Lord of the Isles
  (Tor, 1997 to 2008; Wikipedia, ISFDB title 22053, Kirkus): four youths from a seaport village are swept into magic and danger
  when a king''s envoy arrives. Garric, a scholar who rescues the time-cast sorceress Tenoctris, learns he is the direct descendant
  of Carus, the last king of the Isles a thousand years earlier, and Sharina turns out to be the daughter of nobles. The rise
  is a birthright, so it is Hidden heir, not Humble origins (at the gate, nine) even though the heroes are village-born. Refused:
  Heroic fantasy leaves (an ensemble, no single hero class), Court intrigue (the royal court is a stage, not the engine),
  Military fantasy, Mythological fantasy (Sumerian-style gods are the setting). Folded as one fiction (11j): the six Lord
  of the Isles novels and the Crown of the Isles volumes in the queue (Mirror of Worlds, The Gods Return). The Fortress of
  Glass, volume 7, is not in the queue. Omnibus row MC02286 skipped. Years are first publication (Wikipedia list; queue years
  are reissue dates). Wobble low to moderate: the cast is an ensemble and Garric is also an impostor-king for a dead prince,
  but the kingship follows from his bloodline.'

placement_status: accepted
placement_rationale: |-
  Root-down: Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic quest fantasy > Destiny quest fantasy > Hidden heir quest fantasy. The trilogy's spine is the lost prince's claim: book 1 frees Prince Elyan from Asperfell, the prison of mages "no one has ever left" (orbitworks.net series page); book 2 journeys north for the means to restore him; book 3 is the war of claiming - Elyan must "rally an army to his banner" to reclaim his homeland from the usurper King Keric (shop.hachettebookgroup.com The Shining City blurb). The rise is a birthright. Rejected: Grey mages (Briony's undefined art matters, but the mage-hero gate needs the art as the engine; here it serves the throne quest), Romantasy (the romance is a strong thread - "magical and romantic" per Hachette - but Orbit sells this as epic quest fantasy and the external stakes, not the relationship, carry the spine). Wobble mild (mage co-lead Briony narrates and her power-up is the climax; romance prominent) RESOLVED: the trilogy's question is whether the lost prince reclaims what was his. 3 novels (Asperfell 2020, The Forest Kingdom 2021, The Shining City 2022 - Orbit/Hachette).

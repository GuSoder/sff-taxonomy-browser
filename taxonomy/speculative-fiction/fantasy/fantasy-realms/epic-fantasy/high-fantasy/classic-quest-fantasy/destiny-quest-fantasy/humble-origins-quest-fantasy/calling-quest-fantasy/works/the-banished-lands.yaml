placement_rationale: 'Gwynne''s whole Banished Lands universe (publisher-confirmed: Pan Macmillan''s ''An introduction to
  John Gwynne''s Banished Lands universe'' groups both series in one world; Of Blood and Bone is ''set a century after the
  events of Wrath''; ISFDB ''The Faithful and the Fallen universe''): The Faithful and the Fallen - Malice (2012), Valour
  (2014), Ruin (2015), Wrath (2016); Of Blood and Bone - A Time of Dread (2018), A Time of Blood (2019), A Time of Courage
  (2020). In a secondary world where the angelic Ben-Elim and demonic Kadoshim wage their God-War, a prophecy names two champions
  - the Bright Star and the Black Sun - and the smith''s son Corban is caught up as the Bright Star, rising from village life
  to the champion the world''s fate turns on; a century later the trapper Drem and the soldier Riv carry the same war to its
  conclusion. Classic quest template with the marked one''s rise as spine; Corban''s rise from nothing is into a named prophesied
  calling (the Bright Star), the exact shape of tenant The Sword of Truth (woods guide named Seeker). Short works in the universe
  (The Heir Apparent 2019, Better to Live Than to Die 2015) excluded per standing orders. Queue rows MC04725-04729 are the
  five individual volumes; the fiction is the complete 7-novel universe, first published 2012.'

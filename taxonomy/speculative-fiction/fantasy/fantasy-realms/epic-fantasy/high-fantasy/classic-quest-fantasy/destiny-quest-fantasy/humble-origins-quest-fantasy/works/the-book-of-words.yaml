placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic quest
  fantasy > Destiny quest fantasy > Humble-origins quest fantasy. The Book of Words follows Jack, a baker''s boy whose power
  and destiny pull him into the war of the Known Lands against the sorcerer-chancellor Baralis (series copy; ISFDB series
  page). The queue holds only book 3, Master and Fool (1996): the Known Lands are on the brink of war, Jack must harness his
  power to meet his destiny, Tawl must save Melliandre and her unborn child from Kylock and Baralis, and a final confrontation
  threatens to unravel time (jvj.com publisher page). The marked one''s rise from nothing is the leaf''s definition. Rejected:
  Hidden-heir quest fantasy (his power, not birthright, drives the rise), Court intrigue (Baralis''s schemes are a thread,
  not the engine). Wobble: moderate, since this volume leans on convergence, war and palace intrigue more than on Jack''s
  rise; books 1 and 2 (The Baker''s Boy 1995, A Man Betrayed 1996) are not in the queue. First published 1996 (ISFDB). Queue
  id MC04020.'

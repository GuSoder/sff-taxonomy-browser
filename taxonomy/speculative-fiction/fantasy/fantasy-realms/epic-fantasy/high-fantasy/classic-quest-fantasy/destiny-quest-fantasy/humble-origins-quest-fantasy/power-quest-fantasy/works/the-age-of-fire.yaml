placement_rationale: 'Dragon POV epic: three hunted dragon siblings (Auron, Wistala, the Copper) each rise from scattered,
  defenseless hatchlings to power in a secondary world of elves, dwarves and mercenary men (PRH series page: ''an epic fantasy
  saga where dragons struggle to survive in an age of fire''). Walked root-down: Fantasy > Fantasy realms > Epic fantasy >
  High fantasy (journey through an imaginary world is the governing narrative) > Classic quest fantasy (Tolkien-template secondary
  world) > Destiny quest fantasy (each book is one marked hatchling''s rise) > Humble origins quest fantasy > Power quest
  fantasy (rise from nothing into hard-won power; sits with The Dragon Wizard).'

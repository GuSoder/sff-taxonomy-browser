placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic quest
  fantasy > Destiny quest fantasy > Hidden heir quest fantasy. Per Wikipedia: the barbarian warlord Loethar overruns the realms
  and kills King Brennus of Penraven; his heir Leo is smuggled away and raised hidden, and he will return to win back his
  throne; the Valisar trilogy (Royal Exile, A Tyrant''s Blood, ...). The marked one''s rise is a birthright, which is the
  Hidden heir definition. Series opener; only this volume is in the queue, so the fiction is named for the series. Rejected:
  Dynastic wars (the war is the frame, but Leo''s hidden birth is the engine), Usurper fantasy (the usurper is a foreign conqueror,
  not a false regime from within). Wobble: Dynastic wars is the second reading.'

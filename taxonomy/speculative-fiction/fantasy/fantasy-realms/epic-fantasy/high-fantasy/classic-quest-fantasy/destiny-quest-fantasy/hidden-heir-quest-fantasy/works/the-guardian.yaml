placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic quest
  fantasy > Destiny quest fantasy > Hidden heir quest fantasy. Angus Wells, The Guardian (Bantam Spectra, 1998; ISFDB https://www.isfdb.org/cgi-bin/title.cgi?12608=;
  the queue year 2009 is the ebook reissue): an army aided by an evil sorcerer conquers the province of Chaldor and kills
  its king; the queen charges the fiercest warrior, Gailard the Highlander, to protect Princess Ellyn until she is old enough
  to gain her hereditary powers and win back her father''s kingdom, and with the sorceress Shara he leads her out ahead of
  the closing enemy (PRH https://www.penguinrandomhouse.com/books/188520/the-guardian-by-angus-wells/; Worlds Without End
  https://www.worldswithoutend.com/novel.asp?id=8958; jacket tagline: a reluctant soldier and a spoiled princess). The heir
  hidden and carried to her inheritance, with a birthright of power and a crown to reclaim, is the Hidden heir definition.
  Rejected: Warrior hero (the leaf is for the hero''s power source; here the story is the heir''s passage), Usurper fantasy
  (a conquering army, not a false regime from within), Military and Political fantasy (the war is the frame), Fellowship quest
  (a pair under guard, not a party against an ancient dark). Wobble: moderate. The viewpoint is the guardian''s, not the heir''s,
  so Warrior hero is the second reading. Hidden heir is at 4 and takes this as the fifth card.'

placement_rationale: 'Tanith Lee''s The Storm Lord (DAW, 1976; Penguin Random House description and Nicoll review), first
  of the Wars of Vis, with Anackire (1983) and The White Serpent (1988) folded in as the later books of the series (the queue
  lists all three): in Dorthar the Storm Lord''s youngest son is heir by law, and his queen Val Mara wants her son Amrek on
  the throne; the Storm Lord abducts a Lowlander priestess, conceives Raldnor, and dies mysteriously, and the infant Raldnor
  is carried far from the stronghold and raised among the Plains people with no knowledge of his birth, until he must survive
  trials, sabotage and murder attempts to take back his birthright from the usurper Amrek. Anackire follows his legend twenty
  years on, with Kesarh, prince of Istris, and the goddess-touched child Ashni; The White Serpent returns to Vis nearly a
  century later with the slave-born warrior Rehger and the white witch Aztira. Walk: Fantasy > Epic fantasy > High fantasy
  > Classic quest fantasy > Destiny quest fantasy > Hidden-heir quest fantasy (a birthright, a child hidden from a murderous
  queen, the rise to reclaim it). Tried: Usurper fantasy (the usurper is already crowned, but the book is the heir''s rise,
  not the exposure) and Dynastic wars (no rival houses take the field). Wobble: the later two books are politics and magic
  more than a heir''s quest; I read blurbs and reviews for those.'

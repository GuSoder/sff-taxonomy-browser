placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic quest fantasy > Destiny quest fantasy > Humble origins quest fantasy > Power quest fantasy. The Banned and the Banished (Wit''ch Fire 1998, Wit''ch Storm 1999, Wit''ch War 2000, Wit''ch Gate 2001, Wit''ch Star 2002, Del Rey; jamesclemens.com books page): Elena, an ordinary girl who bears the crimson mark of the wit''ch, must master the wild blood magick she barely controls - questing for the lost Blood Diary whose secrets alone can defeat the Dark Lord - while a band of renegades protects her. The rise from nothing into the hard-won power the land''s fate turns on: Power quest fantasy. Rejected: Calling quest fantasy (no office or named calling invests her; the power itself is the rise), Burden quest fantasy (the Blood Diary is a means to her mastery, not one fated object she must carry), Fellowship quest fantasy (the companions serve her rise, which is the spine). Wobble: low. Years: 1998-2002 (author site; queue''s 2001/2002 dates are reprints). Queue ids MC04162, MC04163, MC04164, MC04165, MC04166.'

placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Epic fantasy -> Quest fantasy. SFE calls this the culminating
  Riddle-Master trilogy, and PRH centers Morgon’s riddle-bound quest across an invented realm. Political fantasy and Hard

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic
  fantasy > High fantasy > Classic quest fantasy > Destiny quest fantasy > Humble
  origins quest fantasy > Burden quest fantasy. A prophecy names a sleeping elven
  king the savior of the races under the near-immortal overlords of the Kothite
  Empire; Raina of Tyrel, a White Heart healer, and Will Cobb, a woodsman turned
  battle wizard, are set on the path and race to wake the king, the only hope of
  ending the empire (author series copy, cindydees.com). The marked ones'' rise from
  nothing is bound to one fated task - the waking and the war only they can finish -
  the leaf definition. Rejected: Power quest fantasy (Will''s woodsman-to-battle-wizard
  rise is arc, not engine; the trilogy''s spine is the rebellion''s race to the waking),
  Calling quest fantasy (no named office), Hidden-heir quest fantasy (no hidden
  birthright). Wobble: moderate; the ensemble runs wider than the two leads.
  One saga, one fiction (rule 11j).'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Quest fantasy
  > Classic quest fantasy > Destiny quest fantasy > Humble origins quest fantasy. Angus Wells, Yesterday''s Kings (Bantam
  Spectra, 3 April 2001; the queue year 2009 is the Spectra ebook reissue of 15-16 December 2009, so 2001 is the first publication,
  ISFDB https://www.isfdb.org/cgi-bin/title.cgi?185868=): the Kandarians seized the border forests long ago and drove the
  native Durrym into a land of protective magic; Kandarian priests have now mastered a magic that can overcome it. Cullyn,
  a young and innocent Kandarian woodsman living in idyllic solitude, is forced by troops, Durrym spies, a noble lady and
  a cruel priest to choose sides, and learns that through fate''s design he alone can stop the war, which means betraying
  his own people, earning the trust of the Durrym and winning the woman he loves (Penguin Random House, https://www.penguinrandomhouse.com/books/188527/yesterdays-kings-by-angus-wells/;
  Worlds Without End, https://worldswithoutend.com/novel.asp?id=8959). An ordinary woodsman called up by fate to a world-deciding
  task is the Humble origins definition ("the woods guide ... called up from an ordinary life"). Rejected: Hidden heir quest
  (no birthright), Fellowship quest (no companion party), Dark quest (not the dark register), Revisionist quest (the template
  is played straight), Political and Military fantasy (the war is the frame, one man''s choice is the story). Wobble: moderate.
  The only sources are publisher copy, so the shape of the journey is thin; Humble origins is at 7 and takes this as the eighth
  card.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic quest
  fantasy > Destiny quest fantasy > Humble-origins quest fantasy. Tali, a slave of the underground, watched two figures kill
  her mother and swears vengeance with nothing but herself; Rix, heir to Hightspall''s greatest fortune, fears he is linked
  to the murder; thrown together, they uncover the secrets of a kingdom while a villain out of legend returns (Ian Irvine''s
  series page: Vengeance, Rebellion, Justice). The rise of a powerless slave into the realm''s fate, earned from nothing,
  is the leaf''s definition. A separate world from Irvine''s Three Worlds sequence (the series page says related by characters
  only), so a separate card from The Gates of Good and Evil. Rejected: Hidden-heir quest fantasy (Tali''s rise is not birthright),
  Vengeance war fantasy (no war on a ruling dynasty; the vengeance is a personal hunt), Dynastic murders (the dead are not
  a ruler or kin). Wobble: moderate to high; revenge, rebellion and a returned legend all share the engine. Years are the
  US on-sale dates (Vengeance April 2012, Rebellion March 2013, Justice June 2014; Hachette Book Group). Queue ids MC03920,
  MC03917, MC03916.'

placement_rationale: 'Whole shared universe audited (Stackpole''s own bibliography, Wikipedia, Penguin Random House series
  page, ISFDB, Open Library, reviews): the DragonCrown War Cycle, four novels: The Dark Glory War (2000, prequel), Fortress
  Draconis (2001), When Dragons Rage (2002), The Grand Crusade (2003). Queue rows MC06839, MC06836, MC06842, MC06840. The
  queue dates 2002 and 2004 for two of them are later editions, so the card uses first-publication years (ISFDB and Open Library).
  Stackpole''s Once a Hero, Talion and Eyes of Silver are separate standalones, walked on their own. What holds all four together
  is the Norrington Prophecy against the northern tyrant Chytrine: the prequel''s friends find the prophecy and a cursed sword,
  and the main trilogy follows Will, an orphaned thief from the Dim slums, as the prophesied savior, with the DragonCrown
  artifact and a company gathered around him. Full root path: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy
  > High fantasy > Classic quest fantasy > Destiny quest fantasy > Humble origins quest fantasy > Burden quest fantasy (now
  7). Fits because the rise from nothing is bound to one fated burden, the war only the marked one can stop. Rivals rejected:
  Fellowship quest (the company serves the prophesied one, whose rise is the spine); Hidden heir (Will''s line is not a birthright
  claim to a throne); World-at-war > War of humanity (the war is the setting, but the prophecy, not a many-front tapestry,
  is what organizes all four books; the Dark Glory War reviews call it military fantasy, a real rival); Army fantasy and Soldier
  fantasy (the unit or the campaign is not the whole corpus). Wobble recorded: the prequel''s four coming-of-age friends are
  not the orphan Will, and war and campaign dominate books 3 and 4, so World-at-war fantasy is the closest alternative.'

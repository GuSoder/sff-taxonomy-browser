placement_rationale: 'Penguin Random House and davidgemmell.com (davidgemmell.com/855-2/): the knights of the Gabala who defended
  the nine duchies have vanished through a demon-haunted gateway between worlds; Manannan, the knight who held back, must
  ride through the dreaded gate into a horror-tinged otherworld to find his vanished companions, learning a secret that will
  tear his soul apart, while murder and black magic beset the land. The quest through a dark otherworld that costs the quester
  is the spine, which is Dark quest fantasy (a subplot of rebellion in the Forest of the Ocean runs alongside). Tried Outcast
  knights (his order is gone, but the quest governs). Walk: Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic
  quest fantasy > Dark quest fantasy.'

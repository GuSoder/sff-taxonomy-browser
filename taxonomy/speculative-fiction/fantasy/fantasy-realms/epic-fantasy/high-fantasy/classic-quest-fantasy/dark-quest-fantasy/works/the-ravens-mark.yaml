placement_rationale: 'Grimdark quest: bounty hunter Ryhalt Galharrow, bound to serve the ancient Nameless, walks the Misery
  - the blighted arcane wasteland left by a war with the immortal Deep Kings - and stumbles into a conspiracy that threatens
  the fragile peace (PRH). The inherited journey through a dying world in gothic tones, and the quest costs the quester (''breathed
  Misery dust for twenty bitter years''). Walked root-down: Fantasy > Fantasy realms > Epic fantasy > High fantasy > Classic
  quest fantasy > Dark quest fantasy; sits with The Dark Tower.'

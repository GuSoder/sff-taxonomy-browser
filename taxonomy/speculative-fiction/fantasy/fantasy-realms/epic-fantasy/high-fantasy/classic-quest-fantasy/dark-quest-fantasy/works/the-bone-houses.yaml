placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Quest fantasy > Classic quest
  fantasy > Dark quest fantasy. Lloyd-Jones, 2019: Ryn, a seventeen-year-old gravedigger in a village below a mountain range
  once home to the fae, lives among risen corpses, the bone houses of a decades-old curse; when the mapmaker''s apprentice
  Ellis arrives and the dead attack with new ferocity, the two go on a quest into the heart of the mountains to end the curse
  and face long-forgotten magic and buried truths (the author''s site; VOYA called it a classic quest saga and a page-turning
  horror story). Rejected: Haunted realms (the runner-up: the dread is the dead, but the book is a journey out of the village,
  not a place that keeps its dead), Folk horror and Haunted wilds (not a rural community''s dark rite or a wild place), Fairytalesque
  quest fantasy (at 9; the Welsh-myth quest here is told as horror), Revival and Evergreen quest fantasy (no fellowship, no
  ancient dark), Humble origins quest (the gravedigger is not a chosen rise). The Dark quest definition is the inherited journey
  in a gothic register where the quest costs the quester. Wobble: moderate. YA and a stand-alone, so the leaf''s other cards
  (The Dark Tower, The Crimson Road) are heavier; plot from the author''s site and starred reviews, not the book. Year 2019
  (Open Library; the author''s site posts the cover in January 2019). Queue id MC02926.'

placement_status: accepted
placement_rationale: '# Girdlegard: whole-fiction intake

  24 November 2026


  ## Verdict

  One shared fiction, displayed as **Girdlegard: The Dwarves and the Alfar**, in Reimagined quest fantasy. Fifteen separately
  published novel volumes, 2003-2025. No new genre or definition change. Leaf 5 to 6. The English series labels remain visible
  in the fiction title; four untranslated volumes retain their German titles and German covers.


  ## Corpus and boundaries

  The creator''s shared chronology and Hachette''s explicit description of Raging Storm as a sequel to The Triumph of the
  Dwarves establish a single connected fiction, not two unrelated series. Original-language novels count, not just translated
  editions. The title-readable English cover preference does not establish English-only intake scope.


  Original publication years, not later English release years:

  - The Dwarves, 2003; The War of the Dwarves, 2004; The Revenge of the Dwarves, 2005; The Fate of the Dwarves, 2008; The
  Triumph of the Dwarves, 2015.

  - Righteous Fury, 2009; Devastating Hate, 2011; Dark Paths, 2012; Raging Storm, 2014.

  - The Return of the Dwarves Book 1 and Book 2, both 2021. The original publisher explicitly explains that the sixth saga
  novel became too long and was issued in two separately published books, September and November 2021. Both volumes are represented,
  not an imaginary combined edition. The English editions appeared in 2024.

  - Das Herz der Zwerge 1 and 2, both 2022. The seventh saga story likewise has two actual published volumes, September and
  November.

  - Die Legenden der Albae - Dunkles Erbe, 2024; Die Legenden der Albae - Blutrote Himmel, 2025.


  Die Vergessenen Schriften is a short-fiction collection, excluded. Thus fifteen actual book volumes, not fifteen independently
  plotted saga installments. No duplicated translation/omnibus entries. Some publisher numbering includes the collection and
  calls Dunkles Erbe number six; this is not a missing novel.


  Raging Storm original-date discrepancy: a secondary biography gives 2013; ISFDB and the contemporary April 2014 Buchsichten
  review agree on 2014, with Fantasybuch recording 10 March 2014. Use 2014. Do not infer original dates from the much later
  English fronts.


  ## Full root-down walk

  1. Speculative fiction to Fantasy. Literal sorcery, demons and magically empowered weapons are plot mechanisms. The airships
  of the latest Alfar book do not demystify the world into SF. No evidence of Earth origin, SF time travel or transport between
  historical eras in the included corpus. Centuries between volumes and very long lives are chronology, not time travel.

  2. Fantasy to Fantasy realms. Girdlegard/Geborgenes Land and surrounding realms are invented settings. Not Real earth fantasy.
  Travel to Phondrason is travel among invented realms, not the Earth-crossing gate required by Portal fantasy.

  3. Fantasy realms to Epic fantasy. Interlinked peoples, large geography, successive world-threatening conflicts and long
  companion journeys govern. Not intimate Sword and Sorcery, fairy-tale retelling, a culturally specified Far shores analogue,
  Gothic menace as the governing reading experience, comedy, or romance/cozy/bond as spine. Cruelty and dwarf banter alone
  do not select Gothic or Comic.

  4. Epic to High fantasy. The repeated narrative mechanism is consequential adventuring across this world, commonly in companies,
  seeking the person, weapon, bargain or knowledge that can end a larger threat. The first four Dwarves volumes are not the
  whole evidence: Triumph sends a small search party after Tungdil and then another dangerous mission into the enemy realm;
  Return makes Goimron''s search for Tungdil the companions'' road; Herz continues the companions through multiple threats
  and an eventual alliance/battle. Righteous Fury sends Caphalor and Sinthoras on a journey to secure the demon needed for
  their campaign; Dark Paths follows the exiled triplets in Phondrason and their meeting with Tungdil; Raging Storm follows
  Aiphaton''s hunt and Carmondai''s captivity/escape against a world-threatening weapon. Latest Alfar volumes broaden into
  fragmented political/adventure threads and the race around a stolen sarcophagus. Those are a real wobble, not erased by
  the first book.

  5. Heroic-class rival rejected: the varied cast includes smiths, warriors, artists, mages, rulers and adventurers. The whole
  fiction is not organized around one protagonist''s primary RPG power class. Race is not a class gate.

  6. Military rival seriously considered. Devastating Hate has an invasion coalition and vulnerable homeland; Fate, Herz''s
  climax and Blutrote Himmel have broad wars. Yet the recurring reading spine is not soldiering, a single army/campaign, command
  logistics or one continuous multi-front war. We repeatedly leave armies for searches, missions, companions, imprisonment
  and recoveries over centuries. World-at-war''s immortal/demonic children cannot be chosen just because some forces are long-lived
  or supernatural. Political rival also real in Dunkles Erbe and recent Brandenwall plotting, but struggles between polities
  or court governance do not govern the fifteen-volume fiction more than quest adventure. Hard fantasy''s systematic investigation
  of magical laws and Mythological fantasy''s mythic register are not the organizing mechanisms.

  7. High to Classic quest. Despite viewpoint reversal, quests still pursue or avert world-changing dangers and repeatedly
  make heroic solidarity effective. Revisionist quest is not a synonym for evil viewpoint: no whole-fiction governing refusal/broken
  appointed mantle, and no whole-fiction story that begins where the classic quest ends. The recurring sequels are not enough
  to put every continuing heroic series in Aftermath quest.

  8. Classic to Fellowship quest. The company, companions, rival adventuring pairs and reunited allies matter more than a
  solitary predestined rise. Tungdil''s importance does not make the full ensemble a Destiny quest. Dark quest is the strongest
  tonal rival: Tungdil''s damage, the abyss, cruelty and sacrifice are substantial. But the shared fiction is not chiefly
  a dying-world Gothic journey whose destruction of the quester is its governing register. Return and Herz explicitly renew
  heroes and alliances, while Alfar''s darkness is often the protagonists'' moral position, not Gothic world-dread. Preserve
  the distinction.

  9. Fellowship to Revival. Original 2003 onward, not the founding pre-late-1980s Evergreen line. The original November 13
  split context makes sensibility, not date alone, decisive in the next step.

  10. Revival to Reimagined quest. Moderate-confidence best fit for the whole shared fiction. The first Dwarves plot alone
  is close to Throwback''s inherited dark-lord/weapon company, and independent reviews call it classic formula. But the full
  corpus changes who gets the road: the supposedly monstrous enemy Alfar lead their own quests; cruel artists, exiled siblings,
  later-generation gem-carvers and an orc alliance complicate the inherited side assignment while retaining fast companion
  adventure. This is a changed cast and moral viewpoint within the quest formula, not a consistent straight high-heroic 1980s
  continuation. It does not claim Heitz invented dwarves or elves, nor that all fifteen books are equally innovative. Reimagined
  is a relative sensibility fit against Throwback, not a quality judgment.


  ## Whole-fiction evidence and limitations

  Independent finished reviews cover the first four Dwarves novels, Return, both Herz volumes, Righteous Fury, Dark Paths,
  Raging Storm, Triumph, Dunkles Erbe and Blutrote Himmel, alongside creator/publisher descriptions. Triumph''s detailed finished
  spoiler review follows the search party, captivity, infiltration and final defeat of the controlling Botoiker. Dunkles Erbe''s
  finished review stresses fragmented largely unconnected viewpoint threads and open ends. Blutrote Himmel''s finished reviews
  confirm airship ultimatum, sarcophagus pursuit, threatened cities and unresolved threads. These later novels weaken a uniformly
  party-road account but do not turn the shared world''s established quest-adventure spine into one army''s campaign or sustained
  geopolitical governance. No full-book unauthorized mirrors used. No claim of reading all fifteen full texts. The ongoing
  flag reflects the latest unresolved continuation, not an invented future volume.


  ## Covers

  All fifteen publisher fronts downloaded temporarily for QA only and pixel-inspected together. Eleven title-readable English
  fronts from Hachette; four matching German original fronts from Droemer Knaur, explicitly shows_english_title false. Correct
  distinct numbered Return and Herz parts verified. No cover bytes enter the repository. German images are only 255 pixels
  wide at the observed source URL and will be softer at hero scale; do not silently alter signed/content URLs or claim higher
  resolution.



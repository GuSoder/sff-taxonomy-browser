placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Quest fantasy > Classic quest fantasy > Fellowship
  quest fantasy > Evergreen quest fantasy. Per Penguin Random House''s Mithgar series page and mithgar.com: a secondary world
  whose books send companions after an ancient dark - two Warrows carry a coin east to warn Agron of the black Mage Modru
  (Into the Forge), a fellowship of two sworn enemies seeks a lost warhammer against a dragon (Dragondoom), a crew of men
  and dwarves sails after a lost city (City of Jade). The series begins in 1984 with The Iron Tower trilogy (Goodreads publication
  order), which puts it in the founding line. Soft: this card holds seven later books (1990-2014), not the 1984 trilogy, and
  Stolen Crown is a usurper-war history rather than a journey, so the late dates and that book sit at the edge of the leaf''s
  cutoff. Series is one card; Tales and omnibus editions are not carded. Cover carries a publisher tagline; no clean edition
  found.'

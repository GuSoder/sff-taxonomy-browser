placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Quest fantasy > Classic quest
  fantasy > Fellowship quest fantasy > Revival quest fantasy. Two thousand years ago the Born Queen freed humans from the
  Skasloi lords; now monstrous creatures roam, the Briar King, legendary harbinger of death, wakes, and a woodsman, a rebellious
  girl, a young priest, a roguish adventurer and a young man made a knight are drawn together around Anne Dare, youngest daughter
  of the royal family (PRH blurb for The Briar King; four books, Briar King to Born Queen). A company of companions facing
  an ancient dark, written for new readers, which is the leaf''s definition. Rejected: Hidden heir quest (Anne is known royalty,
  not hidden), Dark quest fantasy, Army fantasy (the fighting is not the story). Wobble: strong; the five lines run apart and
  join late rather than travelling as a fellowship, and I read only the PRH blurb.'

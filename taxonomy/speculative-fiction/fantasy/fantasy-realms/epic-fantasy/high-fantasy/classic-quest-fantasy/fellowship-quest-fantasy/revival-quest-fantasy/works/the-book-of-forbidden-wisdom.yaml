placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Quest fantasy > Classic quest
  fantasy > Fellowship quest fantasy > Revival quest fantasy. On her wedding day 16-year-old Lady Angel Montrose is cast off
  by her family, and with her sister Silky, her childhood friend Trey and an itinerant bard she sets out to find The Book
  of Forbidden Wisdom, always a step ahead of her brother Kalo, until the companions reach the place of the Book at the end
  of the known world and turn and fight the evil there together (author''s site, gillianmurraykendall.com; ISFDB title 1990594,
  Harper Voyager Impulse 2016). A band of companions on a journey toward an ancient dark, written for newer readers and casts,
  which is the leaf''s definition (from the late 1990s on). Rejected: Hidden heir quest fantasy and Humble origins quest fantasy
  (Angel is a lady but no secret heir and no rise from nothing), Revisionist quest fantasy (the template is played straight),
  Dark quest fantasy (no inherited journey through dying worlds). Wobble: real; the romance and the marriage-politics opening
  carry as much weight as the quest, and the leaf''s ''ancient dark'' is the end-of-the-world evil only in the last act.'

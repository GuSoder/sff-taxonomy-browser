placement_rationale: 'Deputy courier Elen guides a prince''s party along the back-country witch roads; the prince is possessed by an ancient haunt, and the company
  on the road against the ancient dark is the spine - the classic companions'' journey rebuilt with a modern cast and sensibility (the author calls it ''grimsweet
  fantasy road trip'', imakeupworlds.com; Locus review by Liz Bourke; Strange Horizons review). Walk: Fantasy (real magic) > Fantasy realms > Epic fantasy > High
  fantasy > Classic quest fantasy (template played straight) > Fellowship quest fantasy (the party travels as a company) > Revival quest fantasy (2025, the late revival
  for new readers and casts). One universe, one card (rule 11j); duology complete: The Witch Roads and The Nameless Land, ''a two volume story... completed with The
  Nameless Land'' (author site). Source: author site and reviews; not read.'

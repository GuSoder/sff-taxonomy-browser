placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Quest fantasy > Classic quest
  fantasy > Fellowship quest fantasy > Revival quest fantasy. Official Elder Scrolls tie-in novel, set four decades after
  the Oblivion Crisis: Umbriel, a floating city, casts a shadow in which people die and rise again, and a legendary prince
  with a secret, a spy on the trail of a conspiracy, a mage bent on revenge and a young girl named Annaig meet in that shadow
  (PRH blurb). A company of unlikely heroes against an ancient, all-consuming evil is the leaf''s definition. Rejected: Mythic
  power struggle (the evil is not a being of real tradition), Court spies (the spy is one strand). Wobble: strong; a game
  tie-in with an ensemble, and my only source is the PRH blurb. It sits as the Elder Scrolls tie-in; the sequel Lord of Souls
  is not in the queue.'

placement_rationale: |-
  Rollins's Moonfall saga (Tor): a gifted student foretells an apocalyptic doom and flees into an
  alliance of outcasts - a broken soldier, a drunken prince, an imprisoned thief - whose journey into
  the unknown to uncover the secrets that can save their world is the spine (jamesrollins.com and
  torpublishinggroup.com series pages). Root-down: Fantasy (secondary world, prophecy and outcast-band
  quest grammar; publisher genre Fantasy) > Fantasy realms > Epic fantasy > High fantasy (the
  governing narrative is the companions' journey, not war campaigns) > Classic quest fantasy (template
  played straight) > Fellowship quest fantasy (the alliance travels as a bound party; not Destiny
  quest fantasy: no single marked one's rise is the spine, though the student is prophetic) > Revival
  quest fantasy (2022, 'from the late 1990s on'). Wobble: mild; SFnal furniture surfaces late (a
  tidally locked planet, world-spin engines buried in the core, a falling moon - book 4 blurb), but
  the governing grammar is the fantasy quest, not a science engine. Card holds the three released
  novels; A Fist of Molten Fire (Moonfall 4, finale) releases 2026-12-01 (jamesrollins.com,
  torpublishinggroup.com) and is excluded as unreleased.

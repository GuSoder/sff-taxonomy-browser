placement_rationale: 'Full root-down walk: Fantasy (invented continent, no science engine) > Fantasy realms > Epic fantasy
  > High fantasy (the governing narrative is a journey through an imaginary world, not a war''s campaigns or a court''s politics,
  so not Military or Political fantasy) > Classic quest fantasy, the Tolkien-template line (not Revisionist quest fantasy:
  the template is played straight; not Fairytalesque quest fantasy: no fairy-tale grammar) > Fellowship quest fantasy, not
  Destiny quest fantasy (Rhapsody the Namer, Achmed and Grunthor travel as a bound party against an ancient dark, the F''dor
  fire demon; the book is not about one marked person''s rise) and not Dark quest fantasy (the register is romantic and adventurous)
  > Revival quest fantasy, not Evergreen quest fantasy (Rhapsody is 2000, in the later revival ''from the late 1990s on'').
  Nine books, Rhapsody to The Weaver''s Lament (Macmillan series page https://us.macmillan.com/series/thesymphonyofages).
  The 2014 ''The Symphony of Ages'' (MC02843) is a series ebook, not a novel, and is held.'

placement_rationale: "# Tales of the Forever Sea, MC04973-04974, 6 November 2026\n\nFinal placement: whole duology in existing\
  \ Revisionist quest fantasy,9->10. Intake freezes immediately for the golden-rule split. No Eco fantasy seed: proposed Epic-level\
  \ seed fails the owner's level-3 depth limit, and no deeper parent provides an honest ecology-axis slot. Original ecology\
  \ proposal below is retained as rejected working analysis, not an instruction or approval. No structural changes executed.\
  \ Positive revisionist evidence: Kindred's search questions and rejects her ideal heroic ancestor's destructive cure; Flitch's\
  \ heroic dreams become a cursed captive storyteller's self-account that explicitly refuses the tidy glory/escape script.\
  \ This interrogated heroic journey persists across the two intertwined stories. Ecological interdependence is the strongest\
  \ substantial wobble. The parent directed existing-leaf placement after checking the positive evidence, not a new genre\
  \ exception. Single-fiction authority original phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX; intake/split rule original phonemsg-01M43MYMGAMQTNA3CY402KK7FB.\
  \ Both current English paperback fronts were displayed and inspected, title/author correct, flat fronts. Original years2021/2023\
  \ are distinct from current paperback dates.\n\n## Whole-fiction scope and actual contents\n\nPublisher calls it a concluded\
  \ environmental epic fantasy duology. The Forever Sea, original hardcover19January2021; The Endless Song, original hardcover14February2023.\
  \ Publisher series and independent finished reviews agree two novels, not a promised trilogy. Some early reviewers expected\
  \ a third; later primary scope wins. Bloodless Queen is separate: the author2021interview already describes the next project\
  \ as mathematics magic/deathrituals, unlike this invented ecology; later2025book explicitEarthfork. Do not merge merely\
  \ by author.\n\nFirst: twenty-two-year-old Kindred Greyreach is a junior hearthkeeper/sailor of the Errant. Magicfires fed\
  \ with bones and sung to keep boats aloft on mile-deep grass. Her grandmother Marchess walks off her boat into the unknown\
  \ depths. Kindred's search crosses resource-waterwar/Arcadia's statepower, pirates/OnceCity, and the dying Grey grasslands.\
  \ Her curiosity, rulebreaking and fire-language differ from normalhearthkeepers. Ending burnsgrass to holdoffpirates then\
  \ boatdivesbelow; consequences carry straight into second.\n\nSecond: two substantial strands, not merely moreboats. Kindred\
  \ crosses underseaScavengercourts to find her grandmother, whose drastic ecological cure threatens surfacepeople with a\
  \ released deepmonsterarmy. Kindred must oppose her rather than accept her as idealmentor. Flitch is youngest of Bordersbarony;\
  \ family under king's annexationthreat accesses a dangerous nonhuman labyrinth beneath its house, then flees/politicalresistance.\
  \ Their stories unite against coupled human/environmental disaster. The final framingStoryteller is Flitch longafter, telling\
  \ an account under captors, with a consuming/forgettingcurse bound to his name. Excerpt expressly frames boydreamsofglory,\
  \ no moretheexpectedtidyescape; narrator rejects plainadventureglory. Reviews vary enormously in quality/opinion/closure.\
  \ DeborahRoss admits skimminglateKindred, so not soleclimaxbasis; PW and RedHeadedFemme plus fullQuillreview supply it.\
  \ PW's anticipated(Jan.) is stale versus actualprimaryFebruarydate. No fullnovels read, thinpoint: some endingdetails supplied\
  \ through reviewerretellings.\n\n## Root-down hard walk\n\nSpeculative fiction > Fantasy: literal imaginativehearthfires,\
  \ monsters, nonhumanbargains and elementalart, not an ecology explainedbySF. No alienplanet/realEarthoriginevidence. EnvironmentalSF/ScienceFantasy\
  \ are not justified by an author researchinggrassland; firelanguage/bonefuel staymagic. No timejourney/rewrittenhistory/loop\
  \ found; historicalstorytelling and agedFlitch are not timetravel.\n\nFantasy has RealEarth / FantasyRealms / Portal: inventedgrasssea/Mainland/Arcadia,\
  \ not Earth; thetext's surface/below is withinthatworld. A basementportal later is not Earth-andrealmexchangerequiredbyPortal.\
  \ NoHistorical/Contemporary/FutureEarthleaf.\n\nAll seven FantasyRealms children: Epic's largegeography, linkedcivilizations,\
  \ resourcepolitics and ecosystemwidecrisis positivelymatch. Sword&Sorcery'sintimateactionthrill isfirstbookrival but worldsystems/nature/linkedcommunities\
  \ arewholeaboutness. GothicRealms has dangerouslabyrinthandmonsters but no sustainedmenaceregistergoverningbothbooks; wonder/discovery/kinship/ethicalnature\
  \ dominate, not dread. Farshoresno specificculturalcounterpartaboutness. Fairytale no singleinheritedtaleor governingtalegrammar.\
  \ Comic'shumorisincidental. Heart'sfamily/lover/crewbondsimportant but notrequiredromancearcspine,horsebondorcozycomfort;\
  \ harmsandworldcrisisarematerial.\n\nAll six existing Epic children:\n- HighFantasy truejourneysstrong. Itsthreechildren\
  \ tested: ClassicQuestrequires Tolkien-templatefaithfullineage/fellowshipagainstancientdark/markedrise. This is not questtorestorekingship\
  \ or partyagainstDarkLord. FairytalesqueQuest haslabyrinthbeast/bargain but notwholefairytalegrammar. RevisionistQuest strongest\
  \ rival: second challengesKindred'sidealgrandmotherandFlitch's heroicdreams; Quill explicitly says natureofbigstories/myths.\
  \ The primaryexcerpt backs an anti-tidyheroicnarration. However theduology'smostsustainedpositiveaboutness is howhumansconsumeandlivewiththeenvironment,\
  \ not reworkingtheinheritedheroicquest. Negative review's narrativeexpectationwhiplash is not proof of agoverningdeconstructionprogram.\
  \ Enough forboundarydiscussion, not enough todump an eco-centeredtwo-bookfiction asRevisionistjustbecause anyheroismdisappoints.\
  \ No diversion becauseRevisionist9wouldsplit. Itwouldbe a possibleless-specifichome onlyifcuratorprefersengineofjourneyoververifiedecologicalaboutness.\n\
  - HeroicFantasy RPGclass: Kindred singsfire, BardHero4 and GreyMages9 serious. Hearthkeepingisanart, not musicalperformancecareer;\
  \ Flitch'sfamily/labyrinth/bargain becomes verysubstantial with no consistentKindredsingingartwholeheroengine. BlackMages\
  \ bonefuel is not personalnecromancy/deathart; WhiteMages savingecology is not healerart; Cleric/Pala/Warlock fail deity/oath/demonsource;\
  \ martial/noadventuringclass fail primarysharedactorpower. Do notclassifywhole2onlybybook1protagonistjob.\n- HardFantasy:\
  \ highfantasyecology is consistent,but novelmagic deliberatelyintuitive/vague withoutfixedrules, characters'inventedrulesbrokento\
  \ learnfromfire. ExplicitQuillfinishedfirstreview contradictshardruleassumption. No Bondedboundspirits/Scriptedcodedart/Channeledbodyforcegoverningwholemagic.\
  \ NoTimeMagicpositiveevidence.\n- PoliticalFantasy resourcepower strongfirst/Baronycrisisstrongsecond. CourtIntrigue'sDynasty/CourtSpies/Statecraft:\
  \ Bordersfamilyandking aresecondonly and notwhole2insidercourtengine; nobattleoverlegitimacyacrossboth, noespionagecaseloador\
  \ rulergovernancecore. Revolutionary'sOverthrow/Usurper/Regicide/Proletariat/Vengeance/Rebel/Insurgent/Messianic/Outlaw/Emancipation\
  \ failwhole'sspecificmode. PirateInsurgents tempting withpiratecity but no persistentimperialmachine-subversionwhole; freeingcriminalizedclassrescuenetworkisnotKindred'squest;\
  \ ElectionFantasy no massfranchiseengine. Environmentalresourceconflict drivespolitics, notpoliticsasautonomouswholeengine.\n\
  - Military no soldier/campaign/rankswhole. Climacticbattleisnotarmystory.\n- MythologicalFantasy inventedmyth/oldstoriesarepresent,but\
  \ no pantheon/divineagegovernswhole. InventedGodhood/Worship fail divineexperienceorfaithcore; MythlikePast cannot become\
  \ homeforanyinventedworldwithlegends. MythicPowerStruggle no realtraditionbeingspersonalstrugglecore.\n\nDeeper rival S&S\
  \ tests: PirateFantasy3 captures firstbookships/crew/sealanesextremelywell, notsecond'slargeMainland/undergroundlandjourneys.\
  \ Magitech (actualmarriageoftechnologyandmagic) shiphearthengine genuine, but no wondrousmachinery/engineeringwholeaboutness\
  \ or machineryfocus inFlitch's half, and authorcalls it ecologicalfossilfuelanalogy not science. Technomancy/Gothic also\
  \ fails menaceplusnecromanticengineeringprimaryengine. Caper/Tournament/Sword&Planet/ClassicS&S fail heist/contest/planetaryromp/Conanlineage.\
  \ Thisneeds morethannewnauticalfurnitureleaf.\n\n## Proposed carve and reciprocal boundaries\n\nEco fantasy under Epic fantasy.\
  \ Definition: Imaginary-world epic fantasy whose governing conflict is the interdependence of people and the living environment:\
  \ understanding, exploiting, damaging or repairing the ecosystems that sustain them. Ecological systems and the consequences\
  \ of living within them organize the whole fiction, rather than supplying scenery or a one-off obstacle.\n\nNot Heroic:\
  \ protagonist's magical/classpower is a tool, not story'sorganizingpoweridentity. Not High: ajourney may carrythestory,but\
  \ ecologicalrelationship ratherthan inheritedquesttraditionoritsrevision governs. Not Political: regimes/resourcecontrol\
  \ canmatter,but ecosysteminteractionratherthan struggleforofficeoroverthrow determineswhole. Not Hard: nature/constraints\
  \ neednotexplicitrulesforspells; scientificrulemagic remains therewhenprimary. Not Mythological: nature spirits/gods mayexist,but\
  \ experienceofdivinity/faith/inheritedmyth notspine. Not Military: environmentalcrisis not campaign/ranks. Not Pirate/S&S:\
  \ seas/crews maycarryaction, but ecologicalorder ratherthan privateeringnavaladventureisaboutness. Not Gothic: scaryecologyisnot\
  \ sufficient; dreadregistergoverningstillgoesGothic. Not RealEarth/Portal: ancestorforcesinventedworld only. Noexistinggatewidening.\n\
  \n## Name and ceiling\n\nEco fantasy is an already-used genrephrase, not a portmanteau invention. PWcallsfinaleeco-fantasy;\
  \ authorcallsfirsteco-fantasy; Culturefly2022explainsit as humanenvironmentrelationshipaddressedheadon, Quill2024 callsitlesser-knownsubgenreandexplicitlynamesForeverSea.\
  \ Quill'sboundariesloose/scientificflairnotadopted wholesale; FantasyAfield2021framesitsownproposal,sodo notclaim universaldefinitionorpriority.\
  \ HyphenatedEco-fantasyalsoattested; displayedEco fantasy matchesplainlocalpattern, IDeco-fantasy. Short, latches, standaloneenvironment+fantasy,\
  \ no inventedone-wordfusionneededwhenestablishedtermexists.\n\nExactphrase searchfounddescriptiveusageinothergames/books,\
  \ notverifiedexactEco fantasytrademark. Thisisnotregistryclearance. Existing tree no Eco fantasy/Ecological fantasy node.\
  \ SiblingHardFantasy orproposedEcologicalFantasylongerdoesnotimprovefit. Ecopunk narrowaestheticpoliticalprogramnotwhole;\
  \ Nauticalnamesfurnitureandfailssecondhalf; GrassSeafantasyseedexactpremiseillegalnarrowcarve; NatureFantasyvaguegift/creaturemisread;\
  \ DruidicHero wouldrequireclassandseeddoesn'thaveit.\n\nHonestceilingtoday: one verifiedwholefiction2novels. Noexistingmovesclaimed.\
  \ QuillnamesBrokenEarth/LadyTrent/EmilyWilde/BloodofExileasgenrekin, but thislistalonecannotauthorizeorjustifyrelocationofwholeuniverses.\

id: tess-of-the-road
title: Tess of the Road
authors: [Rachel Hartman]
first_published: 2018
canonical_genre: revisionist-quest-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Quest fantasy -> Revisionist quest fantasy. PRH centers a disgraced young woman who refuses the prescribed convent/marriage ending and walks away across Goredd, turning the outward road and search for a legendary serpent into recovery, self-knowledge and a feminist rejection of the conventional hero’s journey. The journey is governing, but it interrogates who may be a quest hero and what victory means rather than reproducing the Tolkien template.'

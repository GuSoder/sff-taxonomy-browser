placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy > Revisionist
  quest fantasy. Per the author''s blurb: Sir Aelfric and his nine companions once saved the world from the Dark Lord and
  seized his cursed weapons; years on he must find the nine again, now weary rulers, and some have become monsters, and the
  one thing he knows is slaying monsters, even friends. The journey stays but the story reckons with what the heroes'' victory
  turned into, which is the Revisionist quest fantasy definition (sits beside The Clocktaur War). Rejected: Dark quest fantasy
  (the inherited journey in a dying world; here the reckoning with the heroes is the point), Army fantasy (no army or front),
  Rogue hero (martial hero, not stealth). Wobble: it could read as dark quest fantasy, a hunt through a ruined world with
  the cost on the quester. Three volumes folded as one fiction: The Sword Defiant (2023), The Sword Unbound (2024), The Sword
  Triumphant (2025); only the first has a usable cover.'

id: the-breath-of-the-sun
title: The Breath of the Sun
authors: [Isaac R. Fellman]
first_published: 2018
canonical_genre: revisionist-quest-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Quest fantasy -> Revisionist quest fantasy. Aqueduct and PW center Lamat Paed’s blasphemous expedition toward the summit of an impossible sacred mountain, while SFE calls the novel equipoisal among fantasy, fabulation and self-parodying SF. Its pilgrimage preserves the difficult journey but interrogates faith, exploration, truth and heroic conquest, making Revisionist stronger than the Tolkien-template Classic or fairy-tale grammar.'

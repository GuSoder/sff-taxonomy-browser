placement_rationale: 'Complete trilogy (Fate of the Fallen 2019, Destiny of the Dead 2022, Sanctum of the Soul 2025, Tor).
  The chosen one Mathias dies at the start and his best friend Aaslo, an ordinary forester, must carry the world-saving journey
  himself - the quest is kept while the destiny template is interrogated and reversed (Paste: ''overturns the Chosen One trope'';
  Den of Geek: ''subverts the hero''s journey''), the revisionist gate verbatim.'

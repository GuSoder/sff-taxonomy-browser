placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> High fantasy -> Revisionist quest fantasy. Titan identifies a two-book mission following Slate and her mismatched crew into Anuket to discover and stop the artificial Clockwork Boys. The condemned thief, assassin, disgraced paladin and scholar retain the dangerous journey while dark comedy, trauma, coercion and romance interrogate the conventional heroic party and quest.'

id: salvations-fire
title: "Salvation's Fire"
authors: [Justina Robson]
first_published: 2018
canonical_genre: revisionist-quest-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Quest fantasy. Locus calls it sword-and-sorcery-influenced epic fantasy and describes a small band crossing the war-scarred world to restore the gods, joining Kula and the Bride before saving the world. Military fantasy loses because the war is over; Sword and Sorcery loses because the world-spanning restoration quest and ensemble epic stakes are primary.'

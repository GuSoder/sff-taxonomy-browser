placement_rationale: 'Once a Hero (Stackpole, Bantam 1994, Nebula preliminary nominee 1996, queue MC06837) is a standalone
  novel; ISFDB and Stackpole''s bibliography list no sequel and the other Stackpole rows are separate worlds. Five centuries
  after the legendary human warrior Neal Elfward and his elf friend Aarundel overthrew the sorcerous Reithrese empire, the
  victory has left a genocidal war and a land coming apart. Count Berengar''s quest to stabilise it leads Genevera, Aarundel''s
  granddaughter, to raise Neal from the dead, and the book asks whether the legend matches the man (ISFDB synopsis, Penguin
  Random House, reader review). Full root path: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > High fantasy
  > Revisionist quest fantasy > Aftermath quest fantasy (now 6). Fits because the quest starts after the classic victory,
  in the world the old hero''s war left behind, and interrogates the legend. Rivals rejected: Refused-mantle quest (Neal is
  revived to do the work, he does not refuse a mantle before the journey); Classic quest fantasy and its children (the template
  is reckoned with, not played straight, despite the blurb''s Jordan and Eddings comparison); Warrior hero (the book is about
  the legend and the land, not one fighter''s power). Wobble recorded: the revival of a dead hero reads as a destiny quest
  in its first act, and the Aftermath wording about a depleted world is stretched to a land in decline.'

definition: 'Caster-hero fantasy whose protagonist's primary power is drawn from demons: a demon's mark or gift, an inborn human-demon nature, or a demon's own art - patronage or a bargained pact is not required (the curator's definition, phonemsg-01M5T307A00YA8CYNEM53C0YSE and phonemsg-01M5T37P4MSCBBPJ4JYDDEGH4E). Not Mage hero (power from learned arcane craft rather than a demonic source, even when the craft is dark - Black Mages), not Cleric hero (power from a god), not Paladin hero (oath-bound martial magic).'
status: accepted
works:
- nightseer
- rai-kirah
- the-rise-of-the-witch-king
ruling: 'Created by the curator: "Ok, then go ahead with the warlock hero genre" (phonemsg-01M5T3AGRVQXZKVHHY4KXBFSZM, 2026-10-25
  6:56 PM CET), on his own definition that warlocks "draw their powers from demons" (phonemsg-01M5T307A00YA8CYNEM53C0YSE),
  patronage not required ("I''m not that strict on there patronage in my definition", phonemsg-01M5T37P4MSCBBPJ4JYDDEGH4E).
  Takes the three demonic-power fictions out of Black Mages (superseding the pending, never-approved Demonic mage child of
  the Black Mages split proposal). Name is the curator''s own coinage.'

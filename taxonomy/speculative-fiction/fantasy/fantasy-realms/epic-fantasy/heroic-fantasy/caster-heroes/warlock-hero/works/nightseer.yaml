placement_rationale: 'Laurell K. Hamilton''s Nightseer (Roc, 1992; PRH, Google Books, SFE-style review): Keleios, a half-elf
  who saw her mother murdered by the witch Harque, gains a range of powers from the gods but also a demonmark that opens the
  door to forbidden dark sorcery; she must choose between its tainted power and those she loves while hunting her revenge.
  Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster hero > Mage hero > Black mages
  (demon-marked forbidden sorcery practised as her own craft). Rejected: Grey mages (the gift is prophecy/mixed, but the story''s
  question is the dark art), White mages (not healing), Cleric hero (the powers come from gods but she wields them as a sorceress).
  Wobble: medium-high, Grey mages; sources are blurbs and one review, not read in full. Standalone.'

placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Heroic
  fantasy -> Caster-heroes -> Paladin hero. David Weber''s War God series (Baen, 1995 to 2012; Wikipedia, davidweber.net):
  Bahzell Bahnakson of the Horse Stealer hradani is the unwilling champion of Tomanak, the War God, ''the unlikely Paladin''.
  He holds a sacred martial office and draws power from an oath to a god, which is the Paladin hero definition (martial office
  joined to sacred or oath-bound magic) in the church sense the curator set ("a paladin is a knight of church", 2026-10-10
  9:40 PM, rejecting Valdemar here). Tried: Warrior hero (arms are not the power; the god''s champion is), Cleric hero (he
  is a fighter, not a healer or priest), Ranger and Beast master (no bond), Sword and sorcery (the series is epic in scope).
  Wobble low. Four novels folded as one fiction (11j): Oath of Swords (1995), The War God''s Own (1999), Wind Rider''s Oath
  (2004), War Maid''s Choice (2012); years are first publication (Wikipedia). The omnibus Oath of Swords and Sword Brother
  (2007) is skipped. Jacket: Oath of Swords. War Maid''s Choice''s Open Library cover is a title page, so it carries no cover.'

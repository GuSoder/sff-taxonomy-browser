id: paladins-strength
title: Paladin's Strength
authors:
- T. Kingfisher
first_published: 2021
canonical_genre: paladin-hero
placement_status: accepted
placement_rationale: >-
  Saint of Steel book 2 (Argyll Productions 2021; Locus recommended reading 2021).
  Istvhan is literally a paladin of the dead Saint of Steel: his berserker battle-grace
  is a sacred, oath-bound power joined to martial office - exactly the paladin-hero
  definition (primary power joins martial office to sacred or oath-bound magic).
  Hachette bills it as cosy fantasy romance with a swashbuckling paladin tracking a
  supernatural killer alongside a nun of a secretive order. Shelfmate: Deryni Rising;
  the site's existing Paladin of Souls sits under cleric-hero's World of the Five Gods.

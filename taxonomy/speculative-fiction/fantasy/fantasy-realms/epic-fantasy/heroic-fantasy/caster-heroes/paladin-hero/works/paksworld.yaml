placement_rationale: 'Full root-down walk: Fantasy (Paksworld, no science engine) > Fantasy realms > Epic fantasy > Heroic
  fantasy (hero-centered, sorted by the protagonist''s power, not by war or court) > Caster heroes (power is sacred, not martial
  skill alone) > Paladin hero, not Warrior hero (Paksenarrion starts as a sheepfarmer''s daughter turned soldier, but her
  arc ends in Gird''s paladinhood: martial office joined to sacred power) and not Cleric hero (she fights; she is not a priest).
  Rule 11j: the Deed of Paksenarrion (1988-89) and the later Paladin''s Legacy books (2010-14: new kings, a mercenary company,
  Gird''s legacy) share one universe, so they are one fiction placed by its anchor. The omnibuses The Deed of Paksenarrion
  (MC02872) and The Legacy of Gird (MC02873) repackage these books and are held (source http://www.elizabethmoon.com/books-paksworld.html).'

placement_rationale: 'Root-down: Speculative fiction > Fantasy (gods who bless mortals, ancestral magic, dragons; no science
  engine) > Fantasy realms (invented Iyan and the Langlish empire) > Epic fantasy (a war of nations with gods in play) > Heroic
  fantasy > Caster heroes (Faron''s power is divine magic, not weapons or office) > Cleric hero: Faron Vincent''s primary
  power comes through the gods themselves - the gods-blessed heroine, their chosen vessel who channels them, an accepted divine
  burden she never asked for (author''s own framing: "a gods-blessed heroine forced to choose between saving her sister or
  protecting her homeland"). Not Paladin hero (not martial office joined to oath-magic), not Mage hero (the power is granted
  by deities, not a learned art), not Warlock hero (no bargain with dark powers). Duology verified complete against the author''s
  newsletter and Goodreads: So Let Them Burn (2024) and This Ends in Embers (2025). Jamaican-inspired world per the author''s
  interviews. Soft: sister-versus-sister war drama and dragon-riding Elara share the frame.'

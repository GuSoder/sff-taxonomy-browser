placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy
  > Caster heroes > Cleric hero. Rifkind is an invented-world goddess-empowered healer; her sacred power comes through
  service to the Bright Moon, not a Celtic cultural inference. The broad epic journey/gods/worldbuilding gate applies,
  then Heroic sorts her primary power source. Armed intimate adventure is a genuine Sword and Sorcery rival, but
  deity-granted healing supplies the more specific class. This fiction is distinct from Sanctuary/Thieves'' World.

placement_rationale: '# Glass Thorns: whole five-novel fiction,26November2026

  Intake MC06640/43/52/53/54. One shared fiction,not five separate cards. Touchstone2012;Elsewhens2013;Thornlost2014;Window
  Wall2015;Playing to the Gods2017. ISFDB author bibliography and contemporary Locus final-book listing agree allfive original
  years; Tor and Tor-distributed OpenRoad descriptions explicitly number five and final2017. Tor stale author biography calls
  trilogy and Touchstone landing page has wrong review metadata; do not use that as corpus limit. Elsewhens trade2014is reprint,not
  first2013. No additional published novel established.

  Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes > Bard hero.

  Positive literal magical theater: tregetour Cade writes and charges wands,glisker Mieka spins magic onto stage,fettler Rafe
  controls it for safety,masker Jeska speaks the words. Fae/Elven/human magical inheritance and visions are explicit; no SF
  explanation supplied. Albeyn is an invented realm,not actual Earth inferred from Shakespeare/rock-band analogues,not Earth-start
  portal. Theater audiences experience magical effects,not demonstrated authoring or rewriting of the characters experienced
  reality. No claimed Fabulation simply because art and storytelling are central.

  Temporal check: Elsewhens are prescient visions of possible futures,refused or shared and used to avert tragedy. Window
  Wall castle attack and final Mieka rescue are predicted,not confirmed traveler displacement,loop or past rewriting. This
  is Fantasy first regardless. Time magic is a genuine rival because foreknowledge matters,but its actual gate loops/rewritten
  past/history journeys is not established by possible-future visions. Do not claim all temporal weirdness absent.

  Whole-fiction progression: Touchstone forms a magical theater troupe seeking artistic success;Elsewhens expands its career
  into a foreign royal embassy;Thornlost follows rising fame,drug use,interpersonal strain and ambition;Window Wall links
  artistic and domestic demands to religious prejudice and a foreseen royal attack;Playing to the Gods combines debt from
  embezzlement,overwork,drug use,Mieka wife/family conflict and murder with the troupe greatest magical performance against
  a kingdom-threatening conspiracy and ancient otherworldly conflict. Completed final critics BookLoons and WesternSFA specifically
  tie the resolution to the troupe performing together. Not classified from bookone alone.

  Realms rivals: not brief episodic S&S blade/caper adventures,not a fairytale transformation,not a real-tradition counterpart
  culture study,not governing comedy or gothic dread. Heart fantasy is serious because friendships,creative work and family
  are foreground,but addiction,coercion,murder,political manipulation and world-threatening final performance do not deliver
  a cozy care/craft spine; no central mutual romance or horse bond governs allfive. Epic breadth includes an invented multiracial
  society,international travel,religious persecution and royal/cosmic stakes,but the persistent viewpoint and agency are the
  performers.

  Epic rivals: High fantasy quest journey is not the enduring structure;tours and embassy are career settings. Political fantasy
  strong late rival: troupe comments on prejudice,opposes court plotters and prevents war,but it is neither ruler-level statecraft,dynastic
  succession as wholefiction prize,a revolutionary movement,mass election nor public regulation of magic as main subject.
  Hard fantasy: magic has roles/wands/safety limits,but the sustained inquiry is creators lives and performances,not systematic
  rule-solving; completed final Metaphorosis critic explicitly finds the rules unclear. Military: looming war,not army/unit
  campaign story. Mythological fantasy: ancient conflict/gods at finale do not make the wholefive a myth creation/divine service
  quest. Heroic positive: Cade and fellow performers grow and act through their personal magical artistry,career,loyalties
  and dangerous gifts. Heroic here follows the actual class-based tree,not a claim they are conventional questing warriors.

  Caster comparison: no governing martial skill or combined sword/spell kit,no ordinary NPC civic power instead of magic.
  Bard hero positive: performance,words and magical artistry are both vocation and decisive collective power,including the
  final confrontation. Mage hero is genuine learned-wizard overlap,but narrower Bard fits what Cade actually does. No accepted
  sacred burden makes him Cleric hero,no demonic patron/origin establishes Warlock hero. Fae ancestry is not demon evidence.
  Existing Bard hero4checked before placement: Kingkiller2,musician Song of the Beast1,Storyman Lords of the Sky1,Bardic Voices4.
  Existing latter constable fourth-volume crossover and Lords broader war/lore wobble retained,not retrospectively broadened
  or repaired for capacity. Glass brings4to5,not a structural trigger.

  Coverage caveat: Metaphorosis finished-final reviewer calls ending intentionally disjointed and notes an author explanation,without
  specifying a reality-authorship or time-travel twist. Bounded exact ending/metafiction/epilogue searches yielded no corroborated
  alternate ontology. Other completed-final critics describe otherworldly confrontation and theatrical action. This is moderate-high
  wholefiction judgment from primary descriptions,creator excerpt and completed critics,not a claim to have read the full
  novels or decoded that unspecified coda.


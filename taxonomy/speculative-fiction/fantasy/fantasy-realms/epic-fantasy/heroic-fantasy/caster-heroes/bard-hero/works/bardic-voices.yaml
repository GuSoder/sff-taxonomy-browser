placement_rationale: 'Lackey''s Bardic Voices, the Free Bards books (Baen, 1992-1997; mercedeslackey.com): in Alanda, where
  the Church grows more hostile to non-humans, gypsies and Free Bards, the young fiddler Rune backs a brag by playing on Skull
  Hill for the ghost that lives there, wagering her soul against sunrise, and goes on to found the Free Bards; Robin and Kestrel
  and Eagle and the Nightingales follow the Bards'' music and magic against the Church and a failing High King, and Four and
  Twenty Blackbirds follows the constable Tal Rufen through a run of murder-suicides in the same world. Walk: Fantasy > Fantasy
  realms > Epic fantasy > Heroic fantasy (hero-centered, RPG-class tree by primary power) > Caster heroes (spellcraft and
  performed magic) > Bard hero (power comes through performance, words, lore and charismatic magical artistry; the Free Bards''
  music is their magic). Rejected: Fledgling mage (the gift is a craft and a guild, not a mage''s training), Rogue hero and
  Warrior hero (the bards win by performance), Court intrigue leaves (the Church and the throne are backdrop), Fairytale leaves.
  One series is one fiction (11j): the four Bardic Voices novels. Wobble moderate: Four and Twenty Blackbirds is a constable''s
  murder mystery with the Bards'' magic in the background, but it is in the same universe and is folded; the Bard hero core
  is volumes 1-3. Years from mercedeslackey.com first-published dates; queue years are reissues.'

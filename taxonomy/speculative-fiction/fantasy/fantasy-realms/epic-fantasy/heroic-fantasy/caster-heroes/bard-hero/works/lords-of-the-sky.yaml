placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes
  > Bard hero. Angus Wells, Lords of the Sky (Millennium/Orion, July 1994; ISFDB https://www.isfdb.org/cgi-bin/pl.cgi?20753=;
  the queue year 2010 is the Spectra ebook): Daviot, a fishing-village boy, is found to have a special talent for memory,
  trained at a school as a Storyman (mnemonikos) who wanders Dharbek collecting tales, history and news, and while the Ahn
  come to war in magic airships his travels show him the land''s dark side and make him a catalyst for peace (PRH https://www.penguinrandomhouse.com/books/188519/lords-of-the-sky-by-angus-wells/;
  Blackwell''s https://blackwells.co.uk/bookshop/product/Lords-of-the-Sky-by-Angus-Wells/9781857980882; Book Retorts episode
  notes: not a wizard, but he can remember). His power runs through words and lore, which is the Bard hero definition. Rejected:
  Humble origins quest (the boy''s rise is real, but his gift and trade are the story and the leaf is already at 9), Mage
  hero (he is not a spellcaster), Warrior hero, Military and Political fantasy (the Ahn war is the frame), Revolutionary and
  Messianic fantasy (no uprising). Wobble: moderate to high. Dragons, airships and a war of peoples fill the later book, and
  the sources I can see are publisher copy and a podcast. Bard hero is at 2 and takes this as the third card.'

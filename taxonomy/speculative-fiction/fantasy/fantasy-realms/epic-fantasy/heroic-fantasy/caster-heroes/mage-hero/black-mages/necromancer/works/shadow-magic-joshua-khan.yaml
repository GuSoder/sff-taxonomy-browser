placement_rationale: '# Shadow Magic trilogy, MC04967-04969, 2026-11-06


  Place the whole three-novel fiction in existing Necromancer, 3 to 4. Shadow Magic (2016), Dream Magic (2017), Burning Magic
  (2018) are one continuing fiction, not three cards. The jackets credit Joshua Khan; the author''s own current site confirms
  this is Sarwat Chadda''s pen name. Retain the published byline. Current publisher, agent, library, bibliography and author''s
  answers agree on three books. A 2017 interview hoped for book four, but later answers explain that it was not commissioned.
  Do not turn an unrealized plan into a published volume.


  ## Per-volume evidence


  Shadow Magic: the murdered royal family''s surviving daughter Lily must rule Gehenna and defy the ban on female magic. Thorn,
  an enslaved outlaw''s son, is brought by executioner Tyburn. Together they investigate the killings and betrayals; Lily''s
  learned craft is communion with and power over the dead. The author identifies the Hamlet structure. Dream Magic: her use
  of magic has brought ghosts and zombies out of their graves. Disappearances blamed on trolls are caused by Weaver''s jewel
  spiders, which imprison victims in the Dreamtime. Lily studies with her father''s ghost, loses control of her power and
  must learn wisdom as well as knowledge. Burning Magic: the pair visit K''leef''s Sultanate of Fire. A royal murder starts
  a succession crisis. Thorn, Gabriel and K''leef seek a phoenix in the Shardlands while Lily investigates and faces her own
  changing magic, betrayal and the buried history behind the prohibition on female sorcerers. The author''s detailed finished-trilogy
  interview says Lily''s story is women''s equality and the consequences of wielding power. The ghost and necromantic craft
  remain hers in the third book; fire is the other kingdom''s art, not a reason to split the series or recategorize her as
  a fire mage.


  ## Root-down walk and rivals


  Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes > Mage hero > Black Mages
  > Necromancer.


  Actual sorcery, resurrected dead, ghosts and dream magic positively establish Fantasy rather than a scientific speculation.
  These are not staged human horrors. The mapped Six Kingdoms, Gehenna, Herne''s Forest, Shardlands and Sultanate form an
  invented universe. No Earth departure, portal from our world or identifiable Earth historical setting is established. An
  author interview says he LIKES the idea of this being our ancient, ancient past, cyclic and almost future. This is an imaginative
  aside rather than an attested Earth frame in the narratives; record it rather than inventing real historical geography.
  Real earth fantasy remains a genuine setting wobble, but not the best supported branch. Dreamtime is an in-world magical
  realm, not proof of Earth or an Atemporal SF multiverse.


  Fantasy realms siblings: Epic is positive in its multiple kingdoms, founding sorcerers, geography and the heroine''s consequential
  power. Gothic realms is the strongest rival: haunted Castle Gloom, real ghosts and supernatural crimes. But the undead are
  friends, family, subjects and the protagonist''s own art. Finished reviews and the author distinguish dark from evil and
  show hopeful adventure and growing mastery, not dread as governing experience. Dark realms, isolation and technomancy fail
  for that reason; the story leaves Castle Gloom and is not sealed ritual life or occult machinery. Fantasy mystery is a real
  secondary engine across all three and was tested, not dismissed because of age. Ghost-sleuth fantasy would be justified
  if speaking to dead witnesses principally organized the cases; here the father''s ghost is a teacher and her necromancy
  drives her identity, social prohibition, power and its consequences beyond solving murders. The third book''s investigation
  shares the narrative with the phoenix quest and emancipation. Detective fantasy''s institutional office is a weaker account
  than the heroine''s craft, despite her royal duties; no hired PI business supports Private-eye fantasy. Necromancer wins
  narrowly over the mystery branch on the whole arc, with that wobble retained.


  Other realm rivals: Sword and Sorcery''s intimate combat celebration is weaker than the developed magic/world/power arc.
  Fairytale revision is not the governing form: references to relatives as fairy-tale villains are jokes, and Shakespeare
  borrowing is not a named fairy-tale retelling. Far shores has authentic Middle Eastern and other cultural inspirations,
  but there are several distinct cultures and the aboutness is women''s access to power and heroic magical responsibility,
  not primarily a counterpart culture. Comic has substantial jokes but the serious arc is not governed by parody or an absurd-world
  mechanism. Heart has friendship and emerging love but not romance, community comfort or horse bond as the organizing narrative.
  Hades is a giant bat, not a horse and not a reason to invent a bat genre.


  Epic siblings: High fantasy''s consequential quest becomes strong in book three, but the first two stay largely in Gehenna.
  A whole-trilogy fellowship-road, hidden-heir journey or fairytale-task structure would overstate one volume. The author
  explicitly trimmed the original quest to focus on the kingdom and Lily''s power. Political succession and law matter throughout,
  but the focal action remains the heroes'' powers and growth rather than primarily a chronicle of court factions or revolution.
  Military ranks and campaigns do not govern; mythological origins support the story, not an independent mythic-being narrative.
  Hard fantasy has elemental rules and costs but not a procedural scientific-like investigation of those rules. Heroic fantasy
  therefore gives the most specific whole-fiction engine.


  Heroic siblings: Lily''s active learned spellcraft is not an NPC''s civic judgment or chiefly martial skill, though Thorn
  is an equal companion with skill and courage. Caster siblings bard, cleric, paladin and warlock fail: no performance source,
  divine calling, empowered oath or demon-supplied caster power. Demon-derived character names are not evidence of a demonic
  pact. Mage hero > Black Mages is positive for her own necromancy, not a claim she is evil. Grey Mages underdescribes the
  explicit death craft; White Mages is not her primary art. Black Mages children: Necromancer positively speaks with, raises
  and works with the dead; Shadow mage is a serious title-based temptation, and Lily can use actual shadow effects, but its
  hidden-truth/slipping art is not the whole craft described in the books. Chaos mage''s mass destruction and Siphon mage''s
  living-power drain are not her primary craft. The revised hidden High Queen history does not erase the existing trilogy''s
  necromantic identity. No gate changed and no leaf seeded. Confidence moderate-high, with the mystery and ancient-Earth aside
  explicitly preserved. No full novels read; all three publisher descriptions, primary interviews and finished reviews read,
  not first-book inference.


  '

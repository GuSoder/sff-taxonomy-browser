placement_rationale: 'L. R. Lam''s Micah Grey trilogy (Pantomime 2013, Shadowplay 2014, Masquerade 2017; Lam''s site, PRH,
  Hachette, Wikipedia, ISFDB; the queue''s 2025/2026 years are reissues): Micah runs away from a debutante''s life and joins
  a circus as an aerialist, hiding that he was born between male and female and that he may have the powers of beings from
  an almost-forgotten age (Chimaera); in Shadowplay he learns two kinds of magic, stage glamours and a deadlier one; in Masquerade
  his powers and dark visions grow. Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy >
  Caster heroes > Mage hero > Grey Mages. Rejected: Black Mages (no death or blood art is his craft), White Mages (not healing),
  Bard hero (his circus craft is aerial skill, not magic). Wobble: medium; the art is glamours and visions, an undefined gift,
  which is Grey Mages by exclusion.'

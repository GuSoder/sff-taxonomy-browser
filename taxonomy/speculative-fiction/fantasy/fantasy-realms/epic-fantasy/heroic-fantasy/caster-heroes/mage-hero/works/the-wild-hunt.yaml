placement_rationale: 'Full root-down walk: Fantasy (invented lands, a church of the Goddess, no science engine) > Fantasy
  realms > Epic fantasy > Heroic fantasy (the book is built around one protagonist''s power, not a war or a court) > Caster
  heroes (his power is magic, not weapons or office; Gair is first met chained before the Order''s Rede Hall for the sin of
  the Gift) > Mage hero, not Paladin hero (the knights who judge him are his enemies, and the book''s power is song-magic
  that he learns) and not Cleric hero or Bard hero (the Gift is a sorcery of the earth he must master, not a sacred calling
  or a performer''s art). Cooper''s site (https://elspethcooper.com/songs-of-the-earth-the-wild-hunt-1). Mage hero is now
  ten fictions.'

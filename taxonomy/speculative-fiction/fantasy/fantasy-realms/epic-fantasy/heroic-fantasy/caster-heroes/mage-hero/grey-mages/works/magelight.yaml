placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster
  heroes > Mage hero > Grey mages. One fiction under rule 11j: Baen''s Magelight series, Magelight (2025) and Blood
  on the Sand (2026) - the queue row lists only the second and misdates it 2020; series completion folds book one.
  Aelys of Brionne, a mage academy graduate deemed too weak for the Imperial Battlemage Corps, flees and accidentally
  locks three hired protectors into a geas; the series runs on her coming into her true power and the bound party''s
  survival. Protagonist power source is learned arcane spellcraft: Mage hero. Her art is undefined and wild - "weak"
  magic that levels a tavern, an uncontrolled gift pinned to neither death nor healing: the Grey mages gate word for
  word. Wobble disclosed: Baen markets the series as "Romance Adventure Fantasy" and the geas is a soul-bond premise,
  but the one detailed review found (Upstream Reviews) shows an ensemble adventure engine - rotating four POVs,
  thriller pacing, explicitly not a harem novel, romance a thread rather than the spine - so the romantasy walk
  (soul-bond-romantasy) was rejected on the whole-fiction engine, not the marketing. Black mages rejected (no
  death/blood art), White mages rejected (no healing art).'

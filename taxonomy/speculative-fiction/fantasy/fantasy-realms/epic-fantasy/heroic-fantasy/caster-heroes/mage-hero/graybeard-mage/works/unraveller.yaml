placement_rationale: 'Root-down: Fantasy realms -> Epic -> Heroic -> Caster heroes -> Mage hero. Kellen''s unique direct mastery
  unravels curses, driving a journey through Raddith''s towns, markets and Deep Wilds alongside formerly cursed Nettle. Investigation
  is necessary to undo each curse, but the caster''s magical power, ethical growth and adventures are the spine, not a Gothic
  detective institution, military campaign or political overthrow. Not inherited Earth magic, a revision of a named fairy
  tale or an explicit system-building epic.'

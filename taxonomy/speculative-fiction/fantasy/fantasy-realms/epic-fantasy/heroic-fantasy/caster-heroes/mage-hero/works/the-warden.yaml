placement_rationale: 'Root-down: Fantasy realms -> Epic -> Heroic -> Caster heroes -> Mage hero. Graduate necromancer Aelis uses learned spellcraft as a rural warden
  to confront ancient evil. Tor calls it a non-stop action adventure; Locus centers her capable magical solutions. Cozy texture and community care do not govern the
  danger/adventure spine; formal education is backstory, not Magic school''s present-day setting; necromancy alone is not Gothic engineering. First Warden-series
  card, not a separate card per sequel.'

placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy
  > Caster heroes > Mage hero > Grey Mages. Young Dion Holyhands, raised by a stern foster
  father to develop her outstanding magical powers, is called to protect the Duke''s favorite
  mistress Kitten from a stalking necromancer (Mage Heart); the trilogy continues her coming
  of age against the demon Bedazzer (Fire Angels) and a necromancer conspiracy in Aramaya.
  Her own art is powerful but never pinned to death or healing: Grey, not Black (the dark
  art is the antagonists'') and not White. Romantic and intrigue strands run alongside but
  the spine is the mage''s battle, so Mage hero, not Romantasy or Court intrigue (author site
  book pages, PW quotes there).'

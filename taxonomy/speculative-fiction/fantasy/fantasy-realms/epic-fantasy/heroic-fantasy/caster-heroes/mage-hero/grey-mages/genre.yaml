definition: 'Mage hero fantasy where the hero''s art sits between the poles or is not yet defined: names, nature and beast
  bonds, wild magic, glamours and visions, a gift that is never pinned to death or healing. Colour names the art, not the
  hero''s morality. Not Black Mages (death, blood, demons, forbidden sorcery), not White Mages (healing and restoring arts),
  not Bard hero (power is performance).'

placement_rationale: 'Ongoing middle-grade series, 4 volumes published (Hachette:
  Orion/Little, Brown; Silverborn 2025). Morrigan Crow is a cursed child rescued from
  a death-date into the invented world of the Free State city Nevermoor, where she
  wins a place in the Wundrous Society and learns the Wundersmith''s craft: gathering
  and shaping Wunder, a wild living power never pinned to death or healing, mastered
  through the Wundrous Arts. Mage-hero by learned arcane mastery; the art is undefined
  wild magic -> Grey Mages (same structural slot as Earthsea: young person with an
  unusual gift schooled in a magical institution). Not Magic-school (that leaf sits
  under real-earth Contemporary fantasy; the Wintersea Republic/Free State is a wholly
  invented world, never our Earth). Not Whimsical-doors (portal-fantasy requires Earth;
  no Earth threshold exists here). Not Tournament fantasy (the trials are book 1 only;
  the series engine is schooling, society politics and the Hollowpox/Squall arcs).
  Sources: hachette.com.au series + title pages, Wikipedia series bibliography.'

placement_rationale: 'Root-down: Fantasy > Fantasy realms (the invented world of the shari''a witches and the Allemani invaders
  from beyond the sea) > Epic fantasy (a people''s survival after genocide and a world to save) > Heroic fantasy > Caster
  heroes > Mage hero > White mages. Per Tor''s own copy (Storytel/Tor edition): the young shari''a witch Brierley is a healer
  - ''keeping her healing powers a secret, but she was compelled to use them'' - and healing is what exposes her: a healer-mage
  heroine, so White mages (''the hero''s art heals, mends or undoes harm''). Soft: her people''s ancestral art is elemental
  (''guided by the elemental beings who embodied the very forces of nature'', summoned again at the reckoning), which pulls
  toward Grey mages (nature arts); Brierley''s own pinned art is healing. Rejected: Grey mages (her gift is pinned to healing,
  not undefined), Cleric hero (her power is innate to her people, not a god''s gift), Heart fantasy (the Duke Melfallan romance
  is a thread, not the spine). One card for the series (risingshadow ''The Witch of Two Suns'', FictionDB, Open Library which
  tags The Sea Lark''s Song as Book 2): Mother Ocean, Daughter Sea (2001), The Sea Lark''s Song (2002), Twilight Rising, Serpent''s
  Dream (2004 first publication; the queue''s 2007 is Tor''s ebook edition per Storytel). Years are first publication (Open
  Library).'

definition: 'Grey mage hero fantasy where the art is LEARNED as a subject - a discipline anyone with aptitude can study:
  college-taught animism, book-taught Wild Magic with its bargained prices, measured planar alchemy. The power sits in
  the learning, not the blood. Not Grey sorcerer hero (power by birth); schooling an inborn gift does not make a wizard
  - only learned access does. Colour names the art, not the hero''s morality: still not Black Mages (death, blood, demons,
  destruction) and not White Mages (healing).'

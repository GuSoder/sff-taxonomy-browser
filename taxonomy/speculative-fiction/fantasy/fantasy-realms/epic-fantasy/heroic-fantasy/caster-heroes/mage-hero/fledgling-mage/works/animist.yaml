placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes
  > Mage hero > Fledgling mage. Tor 2000 (ISFDB 2000-06; the queue''s 2001 is the paperback). Alex, a slave-born sixteen-year-old
  fresh out of the College of Animism, goes to find his first bonded animal (the rat Mote) and is drawn into a war and a genocide
  on the island of Mariposa. His power is learned craft, the Animist''s bond and perception of magic, and the book is about
  a graduate''s first use of it. Rejected: Bonded hard magic (the bond is central, but the system stays vague in reviews and
  is not the point), Magic school (the school is left behind in the first pages), Animal fantasy (the animals are companions,
  not the viewpoint), Warrior hero. Wobble: Bonded hard magic is the second-closest leaf.'

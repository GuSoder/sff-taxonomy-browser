placement_rationale: 'Lackey and Mallory''s Obsidian universe (Tor, 2003-2017; mercedeslackey.com, Wikipedia): in The Outstretched
  Shadow Kellen Tavadon, the son of an Arch-Mage of the walled City of Armethalieh, finds the City''s secrets, is banished,
  invokes Wild Magic with the Outlaw Hunt behind him, is saved by a unicorn and a Wild Mage, and has to learn Wild Magic and
  the Elven alliance before the Endarkened rise from Obsidian Mountain. The Enduring Flame trilogy, a thousand years on, has
  the young Tiercel discover he is a High Mage and his friend Harrier follow him while the Wildmage Bisochim plots to restore
  the dark; Dragon Prophecy (Blade of Empire) is set in the same world. Walk: Fantasy > Fantasy realms > Epic fantasy > Heroic
  fantasy (hero-centered, RPG-class tree by primary power) > Caster heroes > Mage hero (learned spellcraft, here High, Wild
  and Dark magic) > Fledgling mage (the gift found, tested and first put to work: Kellen learning his magic, Tiercel finding
  his). Rejected: Revival quest fantasy (9, gate; the engine is the mage''s training and choice of magic, not the party march),
  Evergreen quest fantasy (founding line to the 1980s), Hidden-heir quest fantasy (Kellen is not a lost heir), Graybeard mage
  (the mages are not established masters), Warrior hero (Kellen is a mage first). One shared universe is one fiction (11j):
  Obsidian Mountain trilogy (2003-2006), Enduring Flame trilogy (2007-2009), Dragon Prophecy (Blade of Empire, 2017); the
  two trilogy omnibus rows are skipped. Wobble moderate: Revival quest fantasy is the alternative reading, and Dragon Prophecy
  (Blade of Empire) is not a fledgling-mage story, which is why it is held in the shared-universe fold only. Years from Wikipedia
  first-publication lists; queue years are reissues.'

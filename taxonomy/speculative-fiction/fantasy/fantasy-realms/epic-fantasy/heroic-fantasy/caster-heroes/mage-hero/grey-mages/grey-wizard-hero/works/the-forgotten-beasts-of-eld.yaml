id: the-forgotten-beasts-of-eld
title: The Forgotten Beasts of Eld
authors:
- Patricia A. McKillip
first_published: 1974
canonical_genre: grey-wizard-hero
placement_status: accepted
placement_rationale: 'Re-walk 2026-11-27 under the Dynastic wars positive gate (the war takes the field and decides who holds
  the crown). Whole novel read from summaries (Wikipedia plot, EBSCO, Wizards classics review, fondbooks): Sybel, daughter
  of three generations of wizards, plots to start a war between Sirle and King Drede, then calls it off and the armies are
  lured apart; Drede dies off-page. The war is averted, no crown is decided, and the spine is Sybel''s arc, so it fails Dynastic
  wars. Path: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes > Mage hero >
  Grey Mages > Grey wizard hero. Fit: the hero''s art is the knowledge of the beasts'' True Names, learned from her father''s
  books and lore (Wizards review: ''through knowledge of their True Name'', ''researched in ancient tomes''), a names and
  beast-bond art, which the Grey Mages definition lists. Rivals rejected: Grey sorcerer hero (born power), Black Mages (the
  Blammor is not her craft), Beast master hero (a wizard, not a ranger), Romantasy leaves (the lovers are not enemies, not
  bonded by an imposed tie and not friends first), Bonded hard magic (soft magic). Wobble: real. Her telepathy with the beasts
  and her wizard lineage read as innate, which would put it in Grey sorcerer hero; I weighed the Names-as-knowledge reading
  heavier.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes
  > Mage hero > Fledgling mage. Per Tor/Macmillan and Reactor: at the Academie of the Grand Duchy of Sieuxerr, healer-mages
  have five years to master their gift before the five-day Grand Exam; on day one the exam group finds a classmate''s body,
  and five scholars with secrets must solve the murder and pass together. Invented world (the Grand Duchy and the kingdom
  of Rese), young mages whose training is the frame: Fledgling mage, where the learning is the story, with the Scholomance
  as its own shelfmate. Rejected: Detective fantasy (its test is an investigator acting from office or official duty; these
  are students, not officers), Magic school (Real-earth contemporary, wrong branch for an invented world). Wobble: the murder
  is the plot engine and a Fantasy mystery leaf is arguable. Year 2026 (Tor, 15 Sept 2026).'

placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes > Mage hero > Grey
  mages > Grey sorcerer hero. Per the author''s site and Hachette: Siyon Velo, a slum-born petty alchemist in the city of Bezim,
  accidentally commits an act of impossible magic and has to master it. Bezim''s own divide is learned alchemy (sanctioned
  trade) versus innate sorcery (notorious, born); the fiction is famous for the sorcery - his anomalous inborn power defines
  the series from its title Notorious Sorcerer on. The alchemy he trained in rides along as craft. Soft: it is also a city
  caper (Caper fantasy, Thief heroes).'

  authors:
  - Ursula K. Le Guin
  cover_url: https://covers.openlibrary.org/b/id/14608471-L.jpg
  blurb: Ged was the greatest sorcerer in Earthsea, but in his youth he was the reckless
    Sparrowhawk. In his hunger for power and knowledge, he tampered with long-held
    secrets and loosed a terrible shadow upon the world. This is the tale of his testing,
    how he mastered the mighty words of power, tamed an ancient dragon, and crossed
    death's threshold to restore the balance.

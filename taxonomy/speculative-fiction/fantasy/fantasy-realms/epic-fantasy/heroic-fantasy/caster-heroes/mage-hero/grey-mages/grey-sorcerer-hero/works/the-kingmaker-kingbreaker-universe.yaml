placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Caster heroes
  > Mage hero > Grey sorcerer hero. One shared world (Lur) across Kingmaker, Kingbreaker (The Innocent Mage, The Awakened
  Mage), Fisherman''s Children (The Prodigal Mage, The Reluctant Mage) and the prequel A Blight of Mages (Wikipedia bibliography;
  Goodreads shelves Blight as Kingmaker, Kingbreaker #0) - one card under rule 11j, queue rows MC05225/29/30 folded with the
  unlisted Innocent/Awakened as series completion. Asher the fisherman is the mage hero whose wild, unclassed power sits outside
  Lur''s sanctioned WeatherWorking: an art between the poles, which is the leaf''s definition (born with the power: Asher''s
  wild gift is innate, never schooled). Rejected: White mages (his art unmakes as much as it mends), Hard fantasy (the weather
  system is systematized but the fiction is hero-centered, not rule-exposition), Political fantasy (the kingdom stakes ride
  on one man''s gift). Wobble: real; Morgan''s turn in A Blight of Mages pulls toward Black mages, but the universe''s spine
  is Asher''s grey art.'

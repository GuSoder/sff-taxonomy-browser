id: black-mages
label: Black Mages
parent: mage-hero
children: []
image: 682-black-mages.webp
portrait: 682-black-mages.webp
definition: 'Mage hero fantasy where the hero''s art is the dark one: necromancy, death, blood, demons, forbidden or destructive
  sorcery, practised by the protagonist as his or her own craft. Colour names the art, not the hero''s morality: a kind necromancer
  is still a Black Mage. Not Grey Mages (between or undefined arts, nature and balance), not White Mages (healing and restoring
  arts), not Paladin hero or Cleric hero (power from a god or an order).'
status: accepted

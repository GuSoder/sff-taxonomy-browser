placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Heroic fantasy > NPC heroes. Gig met''Oc, youngest of an exiled
  noble family rotting on a frontier peninsula beside a colony: he has no adventuring
  class - no spellcraft in a world with none, and no combat heroics of his own (his
  brothers fence; Gig plans). His authority comes from social position (the met''Oc
  name and the family armory) and from cold ordinary judgment, and the fiction is
  the psychological power-play between the scion and his inherited frontier world
  (TheBookbag; GamesRadar: duty, morality, guns and engineering). Rejected:
  Vengeance war fantasy (no massacred house drives him; the feud is pride and
  survival, not payback), Martial statecraft (his domain is a farm and a peninsula,
  not a state run through war), Military fantasy leaves (no army, no unit - the
  violence is one household''s), Outcast knights (he is a thinker, not a masterless
  fighter). Wobble disclosed: he is an aristocrat, not smallfolk, and the study is
  villain-adjacent; the gate''s own words carry it - authority from social position
  and judgment rather than combat skill. Standalone novel, one card.'

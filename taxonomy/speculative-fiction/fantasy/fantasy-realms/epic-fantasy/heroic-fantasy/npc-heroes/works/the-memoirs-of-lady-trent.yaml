placement_rationale: '# Lady Trent, whole-six-fiction walk, 23 November 2026


  ## Decision


  Place one shared fiction, The Memoirs of Lady Trent, including Turning Darkness Into Light, in existing NPC heroes,2 to3.
  Six published novels,2013/2014/2015/2016/2017/2019. No new leaf, altered gate or structural permission. Fine-leaf confidence
  moderate, root confidence high under the later28October owner boundary. The natural-science reading is real and independently
  attested, not dismissed; it does not establish an Earth connection that the author explicitly denies.


  ## Scope and individual content


  The author''s current series index names five Memoirs and the later same-world standalone. SFE''s current bibliography independently
  lists these exact six. A standalone label does not override the shared-fiction rule. No separate card for the granddaughter.
  The author''s coloring journal, two short in-world texts and The Long Fall are not additional published novels.


  1. A Natural History of Dragons2013: Isabella''s early intellectual life, restrictive gender expectations, marriage and
  first Vystrana field expedition. Smuggling, dragon behavior and the first preservation clue intersect; her husband dies.
  This is not primarily a courtship novel despite the early marriage.

  2. The Tropic of Serpents2014: the widowed researcher, Tom Wilker and aspiring engineer Natalie travel to Eriga. Working
  with local people rather than imposing imperial assumptions enables ecological discovery. Dragonbone preservation and a
  hang-glider make material science concrete; science also creates political responsibilities.

  3. Voyage of the Basilisk2015: a world voyage studies sea serpents and other draconic forms. Field evidence challenges accepted
  taxonomy while colonial politics and competing local interests shape access. Preserved bone''s military/commercial value
  threatens draconic extinction. Sea-serpent riding is observed action, not evidence of a magical beast bond.

  4. In the Labyrinth of Drakes2016: a government-supported Akhian breeding project attempts to prevent dragons being hunted
  to extinction for bone. Scientific experimentation, sabotage, poisoning and kidnapping intersect with her partnership and
  marriage to linguist/archaeologist Suhail. A desert-ruin discovery links the biological and archaeological questions.

  5. Within the Sanctuary of Wings2017: a mountain expedition seeking a new preserved dragon specimen uncovers surviving Draconeans.
  Stranded and injured, Isabella learns their language and society, negotiates departure, and faces the consequences of bringing
  a historically persecuted people into international politics. Finished Reactor review supplies the reveal: these are surviving
  draconic people, not resurrected magical beings.

  6. Turning Darkness Into Light2019: granddaughter Audrey Camherst and Draconean colleague Kudshayn translate ancient tablets
  while confronting scholarly exploitation, forgery/conspiracy and politics over Draconean freedom. Letters, diaries and translated
  myth form the narrative. Myth is a text being interpreted; its gods are not thereby established as literally active in the
  frame world. Professional integrity, friendship and recognition carry the ending, not a romance resolution.


  Coverage: author index and individual descriptions,2013 and2019 author interviews, completed reviews of all six with especially
  strong independent paired2/3 and spoiler5 evidence. No complete novels read. Ending details are review evidence, not claims
  of primary-text completion.


  ## Root, with later-owner conflict resolved before action


  At first the natural dragons suggested SF. Brennan explicitly says the setting developed without explicit magic, describes
  the dragons as animals and the research as field biology, and says this is not our world. SFE calls its dragon lore an equipoisal
  pattern of SF explanation combining extrapolative biology/anthropology. That is a serious alternative reading, not a genre-label
  error.


  But the owner''s later28October instruction controls this taxonomy. Authenticated originals personally recovered:

  - phonemsg-01M61WBFZHYBJVT7CTS9A5VD3V: independent fantasy realms do not enter SF simply by lacking magic; SF should be
  the real-Earth universe or fabulation.

  - phonemsg-01M61WDQME0NSAHACKYC5EQEV8: invented fantasy worlds on an SF branch are root errors, not a reason to split that
  branch.

  - phonemsg-01M61XB6D7Q73P7Y6B28CWWT6J: actual magic is not required by Technofantasy when technology is central.


  The older17September hard-science-fantasy independent-universe discussion and October7 Otherworldly hard SF relocation were
  checked, not silently preferred over the later ruling. Lady Trent has no supported lost-Earth-colony, far-future Earth,
  simulation or parallel-Earth origin. The author positively says she invented a secondary world to escape real-history constraints.
  Do not invent a scientific origin for the humans. Therefore Speculative fiction > Fantasy, notwithstanding absent magic.
  Fantasy is not synonymous with spellcasting here. Existing unrelated SF placements are not reopened as part of this intake.


  Fantasy > Fantasy realms: Scirland, Akhia, Eriga and Yelang are invented counterparts, not hidden chapters of real Earth.
  Real earth fantasy fails that frame; Portal requires an Earth-inclusive crossing and no such crossing is evidenced. Analogue
  cultures are not literal alternate history.


  ## Complete plausible Fantasy walk


  Fantasy realms children:

  - Epic fantasy wins: decades of consequential worldwide expeditions, a coherent large geography and civilizational/ethical
  consequences are the whole scope, not one local drawing room. Broad scientific and social worldbuilding supports the ancestor
  even without a world-saving battle.

  - Sword and sorcery is a real pulp-adventure rival, but combat and spell-powered action do not govern. Caper, pirate and
  tournament frames fail. Technofantasy is seriously tested: dragonbone preservation, synthesis, gliding and airships have
  consequences, but machinery is not the whole-fiction focus; steam does not define it, magic does not run the machines, and
  diesel machinery is not central. No steam aesthetic shortcut to Steampunk realms.

  - Gothic realms includes a manners exception even without menace, so test it fully rather than dismissing on tone. Fantasy
  of manners is attested for book1 by WWEnd and social restriction remains important. Courtship fails because matches are
  not the six-book plot; Posh fails because elite position/performance is an obstacle to research rather than its subject;
  Gossip fails because scholarly reputation is not principally made/broken by social talk. Audrey''s conspiracy and the series''
  scientific evidence cannot honestly be relabelled village gossip. Dark realms, isolation, Technomancy and uncanny detective
  institutions do not fit the whole.

  - Far shores has strong local2/3/4 analogues but no single counterpart culture governs the whole six; the series is about
  a scholar''s discoveries and consequences, not a fantasy portrait of one non-Western tradition. Scirland and the cross-cultural
  stance remain central.

  - Fairytale revision and fairy-tale grammar are absent. Comic wit is not parody/absurdism as governing engine. Heart''s
  romantic/community/horse bonds are not the whole spine; friendships matter without turning this into Cozy fantasy.


  Epic children:

  - Heroic fantasy wins as a protagonist-career fiction: Isabella''s becoming, judgment, recognition and legacy followed by
  Audrey''s independent scholarly agency. This is not the military unit''s campaign, a struggle to control the state, an explicit
  magic system or a mythic-register saga.

  - High/quest fantasy is a strong travel rival but its existing two children require the inherited heroic-quest template:
  neither Tolkien-template company/marked-one/ancient-darkness nor refusal/aftermath of that template organizes the six novels.
  Journeys for fieldwork alone do not pass these gates.

  - Political fantasy is a strong consequence-rival, especially6, but discovery, professional integrity and intercultural
  understanding govern across all six rather than winning a throne, overthrowing an empire or organizing an election. Anti-imperial
  critique alone does not make every field expedition a revolutionary campaign.

  - Hard fantasy explicitly requires magic treated scientifically. These dragons are natural animals, so do not confuse rigorous
  observation with a magic system.

  - Mythological fantasy: translating an invented epic does not make all six mythological-register narratives. Invented worship/godhood
  is not the frame engine.

  - Military fantasy: state/military exploitation of dragonbone matters but the viewpoint and unit are scholars, not rankers
  or command tents.


  Heroic children:

  - Caster fails: no spellcraft, sacred power or magical performance supplies either protagonist''s agency.

  - Half-caster fails both steel and own-magic requirements.

  - Martial fails: dangerous travel, gliding, riding and occasional survival improvisation do not make trained combat/stealth/wilderness
  skill the protagonists'' primary authority. No naturalist-to-Beast-master shortcut: dragons are subjects of study, not a
  magical animal-bond combat kit. Hunter''s prey gate cannot be substituted for research/conservation.

  - NPC heroes passes: no adventuring class; authority comes through human observation and judgment, social standing, collaboration,
  ethical choices and civic/intercultural action. Lady Trent''s admission to the Philosophers'' Colloquium and the later professional
  integrity of Audrey are career/recognition arcs. Science is expertise, not a covert spell or martial class. This is a positive
  fit to the branch''s ordinary-human agency, not a remainder bin.


  ## Wobble and limits


  Moderate fine-leaf fit. NPC''s existing wording emphasizes ordinary judgment, social position, empathy and civic action,
  not explicitly professional scholarship. Field biology/translation are more specialized than the word ordinary may suggest.
  They remain human judgment and non-combat professions, however, and the branch deliberately contrasts adventuring classes
  rather than collecting only emperors. No definition is widened. Manners is the strongest reader-facing rival, but none of
  its actual children makes the whole story honest. Otherworldly hard SF fits scholarly rigor but loses to the later root
  boundary; Hard science fantasy also has a technology-engine mismatch. The taxonomy''s Fantasy placement is a project-specific
  ruling application, not a claim that literary critics cannot read these as SF.


  If later primary novel evidence establishes a real-Earth-universe origin or actual magic, revise the root rationale rather
  than silently changing what the author said. No literal supernatural action is currently required for this Fantasy placement.


  ## Bibliography and covers


  SFE bibliography verifies first-publication years. Author''s six image fronts actually pixel-inspected in a contact sheet:
  all English title/author fronts, first five coherent Todd Lockwood natural-history family, sixth distinct Turning Darkness
  front. No photo, spine or omnibus. Use exact author-hosted URLs, hotlinked; no cover bytes in repository. Live desktop/mobile
  QA follows publication.



placement_rationale: 'Ten-k walk (MC05099-MC05101). Whole fiction: The Chronicles of Ghadid (Tor), one trilogy per the author''s
  site and Tor: The Perfect Assassin (2019), The Impossible Contract (2019), The Unconquered City (2020) - loosely-connected
  stories following three cousins of the Basbowen family of assassins in the desert city of Ghadid, where water is dearer
  than blood and wild spirits are deadlier than knives (kadoore.com; Tor; Reactor). Root-down: speculative fiction > fantasy
  > fantasy-realms (invented secondary world) > epic-fantasy (Tor calls it high fantasy; city-spanning stakes with spirits
  and ghuls) > heroic-fantasy > martial-heroes > rogue-hero (the protagonists'' power is stealth, deception and the contract
  blade) > assassin-heroes: a family of professional killers-for-hire who correct injustice for a fee and become the city''s
  protectors. Not dynastic-assassins (they are not aimed at a ruling line or great families; Ghadid''s own order is the arena).
  assassin-heroes 8 -> 9.'

placement_rationale: 'Walk: Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Rogue hero > Assassin
  heroes > Sworn assassins. Aral Kingslayer was a Blade of Namara, temple assassin of the goddess of Justice - he killed for
  his goddess, never for money. After her murder and his order''s destruction he scrapes by as a shadow jack, but the series''
  engine is the bond: his oath to the dead goddess, the justice she stood for, and the vengeance he finally takes in her name.
  Bond, not trade.'

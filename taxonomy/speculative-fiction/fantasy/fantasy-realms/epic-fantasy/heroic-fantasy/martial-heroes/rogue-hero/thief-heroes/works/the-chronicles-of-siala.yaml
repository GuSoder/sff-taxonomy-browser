placement_rationale: 'Alexey Pehov, The Chronicles of Siala (Shadow Prowler 2002 in Russian, English 2010; Simon and Schuster):
  Shadow Harold, a self-deprecating professional thief, is bound by oath to a commission to find a long-lost artefact that
  can save the Kingdom of Siala before the Nameless One''s gathered army reaches the walls of Avendoom. The thief''s stealth
  and cunning carry the story (Simon and Schuster blurb, Publishers Weekly: a thief hero who does not believe he is the chosen
  one). Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Rogue hero
  (a protagonist whose power is stealth, infiltration and cunning). Rejected: Dark quest fantasy (the thief, not the doom,
  is the engine), Fellowship quest fantasy (the band is a means). Wobble: medium; it is also an expedition quest. Sources:
  Simon and Schuster blurb and Publishers Weekly review, not the book. Year is the English first edition; Russian original
  2002.'

placement_rationale: 'Root-down (2026-11-18 re-walk): Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Rogue hero > Thief heroes. Kinch Na Shannack is a professional thief indebted to the Takers Guild, trained in lock-picking, lying, traps and small magics; the roadside robbery he attempts launches the journey, and the wisecracking thief survives by cunning - the leaf''s exact gate (the professional thief, the cutpurse, the bandit passing as a hero). Moved out of Caper fantasy on the curator''s direction: Caper stays an established genre and the non-score books belong in the dedicated thief/rogue genres (phonemsg-01M7QBJCFS32SPR9JJ0ZNWMJQF, phonemsg-01M7QC0JAV7SJCPSTEFHBZD4DD, 2026-11-18). Rejected: caper-fantasy (no big score - the guild debt and the road drive it), pulp-sword-and-sorcery (a modern thief-hero novel, not the pulp lineage).'

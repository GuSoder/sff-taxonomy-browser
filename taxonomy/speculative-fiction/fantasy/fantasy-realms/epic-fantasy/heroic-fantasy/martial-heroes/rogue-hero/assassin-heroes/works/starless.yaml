placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Rogue hero > Assassin heroes. Starless (2018, Tor, standalone): Khai, raised by a desert warrior sect in the arts of killing and stealth, serves as the fated protector of Princess Zariya across an archipelago of living gods (jacquelinecarey.com). Rejected: Warrior hero (now an umbrella whose children, Champion knights and Outcast knights, fit neither a sect-trained killer nor an exile), Thief heroes (he does not steal). Wobble: moderate - Khai is a sworn protector, not a contract blade; but his training and function are the assassin''s art, and this leaf already holds The Realm of the Elderlings on the same protector-assassin pattern (Fitz). SOFT. Year: 2018 (Tor). Queue id MC04133.'

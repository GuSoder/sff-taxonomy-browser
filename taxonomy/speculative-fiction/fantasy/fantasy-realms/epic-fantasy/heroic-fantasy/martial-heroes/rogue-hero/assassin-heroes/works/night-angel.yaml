placement_rationale: 'Root-down walk: invented world (Midcyru, the city of Cenaria), so Fantasy realms; Epic fantasy; Heroic
  fantasy; Martial heroes; Rogue hero (power is stealth, infiltration and assassination). Sources: brentweeks.com Night Angel
  omnibus page and summarybook.net plot summary (street child Azoth in the Warrens of Cenaria asks the wetboy Durzo Blint
  to train him, must kill the bully Rat, takes the name Kylar Stern; learns poisons, disguise and killing; the black ka''kari
  bonds to him and he becomes the Night Angel; Khalidor''s coup, Sa''kage politics and war over the throne follow across the
  three books). First edition The Way of Shadows October 2008 (brentweeks.com). Folded: Shadow''s Edge, Beyond the Shadows,
  Perfect Shadow (prequel) and Night Angel Nemesis as later volumes in the same world. Wobble: the later books widen into
  war and a god-magic plot, so Dynastic or Political fantasy are cousins; the core of book one and the hero''s craft is the
  assassin''s trade, so Rogue hero. Sources are summaries, not the books. Year 2008.'

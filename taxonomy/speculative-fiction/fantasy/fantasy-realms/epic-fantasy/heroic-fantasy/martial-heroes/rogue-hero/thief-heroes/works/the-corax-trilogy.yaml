id: the-corax-trilogy
title: The Corax trilogy
authors:
- K. J. Parker
first_published: 2021
canonical_genre: thief-heroes
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic
  fantasy > Martial heroes > Rogue hero > Thief heroes. Saevus Corax, playwright turned battlefield-salvage
  contractor, steals for a living and survives by cunning across all three books: licensed plunder of
  battlefields, the endless talk of the big score, a blackmailed castle-capture commission, tomb-raiding
  by the close. He has no combat or magic class and wins nothing by the sword - the Thief heroes gate.
  Rejected: Assassin heroes (he does not kill for a living), NPC heroes (his authority is the scheme and
  the con, not judgment, empathy or civic action), Absurd realms (the world is a grounded pseudo-medieval
  one; the comedy is Corax''s unreliable voice, not the world''s institutions - the Rogue Agent distinction),
  Military fantasy leaves (he cleans up after other people''s wars; the story is the score, not the war).
  Wobble disclosed: much of the looting is licensed salvage rather than theft, and book two is a commission
  rather than a heist; the con-man spine still governs. No magic in the trilogy; Fantasy root stands on
  the invented world, same convention as the author''s Siege trilogy. Whole trilogy folded (series order
  corrected against ISFDB/Locus: Deals with the Dead, Captures the Castle, Gets Away with Murder).'

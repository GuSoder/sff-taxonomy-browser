placement_rationale: 'Root-down (2026-11-18 re-walk): Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Rogue hero > Thief heroes. In the Italianate port of Tardocco, Falco apprentices to the shadow-thief Maestro Astolfo and his henchman Mutano, learning the thieving trade itself - cons, capers and cases in a city where shadows are stolen, bought and sold. The promise is the making of a professional thief surviving by cunning: the leaf''s gate. Moved out of Caper fantasy on the curator''s direction (phonemsg-01M7QBJCFS32SPR9JJ0ZNWMJQF, phonemsg-01M7QC0JAV7SJCPSTEFHBZD4DD, 2026-11-18): episodic apprenticeship cases, not a score. Rejected: caper-fantasy (no one big job), whimsical doors and cozy fantasy (the engine is the con and the trade, not comfort).'

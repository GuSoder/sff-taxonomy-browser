placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Heroic fantasy > Martial heroes > Rogue hero > Assassin heroes.
  Sister Svangerd kills for a living: the Church of the Invincible Sun''s blade,
  a nun whose trade is knife-work and assassination, dispatched with the atheist
  forger-copyist Brother Desiderius to murder a princess at an ecclesiastical
  council; the trilogy keeps following the pair''s sanctioned missions through the
  schism''s conspiracies. The king''s killer in holy orders is the Assassin heroes
  gate (the contract blade whose stealth and deception serve the knife). Rejected:
  Dynastic assassins (the fiction is no whodunit inquiry - the protagonists ARE the
  killers), Court spies (the pair are outsiders sent in on a kill mission, not
  insider courtiers playing covert court action), Church fantasy leaves (the Church
  is the employer, not the engine). Wobble disclosed: the narrator is Desiderius,
  who kills no one; the fiction''s defining unit is the assassin-and-forger duo and
  its engine is the assassination mission, so the killer gate holds. Tenth card:
  leaf frozen for split examination on placement.'

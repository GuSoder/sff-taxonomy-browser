definition: "Ranger-hero fantasy whose protagonist is a hunter of any prey: a tracker of monsters, a slayer of the undead, a quarry chosen and followed, winning by woodcraft, speed and knowledge of what is hunted. The D&D Hunter reading, with the favored enemy of any kind. Not Beast master hero (the bond with an animal is the power), not Rogue hero (stealth and theft), and not Vampire hunt, which is the real-earth vampire-threat leaf: here the world is invented and the hunter is the protagonist."

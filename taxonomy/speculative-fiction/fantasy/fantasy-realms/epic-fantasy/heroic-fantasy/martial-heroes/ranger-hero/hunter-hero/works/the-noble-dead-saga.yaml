placement_rationale: 'Root-down walk: invented world, so Fantasy realms; Epic fantasy; Heroic fantasy; Martial heroes; Ranger
  hero; Hunter hero. Placement follows the curator''s instruction (phonemsg-01M4V19Y1HE24PW8S6ZBEAF917, 6:25 PM Oct 13): the
  saga goes into Hunter hero with Drizzt, whose definition is widened to hunters of any prey. Sources: Wikipedia Saga of the
  Noble Dead (Hendee: a dhampir, Magiere, a half-elf, Leesil, and Chap, a Fay in a majay-hi body, pass as ''vampire-hunters''
  and meet real vampires, ''the Noble Dead'', which drives them on a quest through the Forgotten History; Series 2 follows
  Wynn Hygeorht, a young sage, Chane, a young vampire, and Shade; Series 3 reunites them) and the PRH Dhampir blurb. Earlier
  walk found no better leaf: Hungry realms is dread of appetite and the books are adventure; Vampire hunt is real-earth only
  (boundary is realm: invented world here); the Warrior hero knight leaves do not fit a mercenary. Wobble: the two-and-a-half
  series widen into a war-of-ages plot with Wynn as a scholar lead, so the card rests on Series 1 and the saga''s framing
  as vampire hunting; I read the Wikipedia overview and the Dhampir blurb, not the books. Folded: all 14 Wikipedia-listed
  novels in the queue (Dhampir 2003, Thief of Lives 2004, Sister of the Dead 2005, Traitor to the Blood 2006, Rebel Fay 2007,
  Child of a Dead God 2008, In Shade and Shadow 2009, Through Stone and Sea 2010, Of Truth and Beasts 2011, Between Their
  Worlds 2012, The Dog in the Dark 2012, A Wind in the Night 2014, First and Last Sorcerer 2015, The Night Voice 2016). Not
  folded: The Mist-Torn Witches books and The Dead Seekers (separate series, not walked yet). Years from Wikipedia. Year 2003.'

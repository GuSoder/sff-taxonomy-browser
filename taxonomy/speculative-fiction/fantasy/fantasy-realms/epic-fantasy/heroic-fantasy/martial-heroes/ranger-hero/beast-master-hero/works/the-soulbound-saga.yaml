placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Heroic
  fantasy, an RPG-class tree by the hero''s primary power. Taran Matharu''s Soulbound Saga (Dragon Rider, HarperVoyager 2024;
  The Tainted Khan 2025; Goodreads series 375181): Jai of the Kidara bonds with the dragon Winter and dreams of freeing his
  people from the Sabine Empire. The hero''s power is the lifelong bond with the dragon, the Beast Master reading. Walk: Warrior
  hero and Hunter hero (the bond is the plot, not arms or the quarry), Paladin hero (no church), Mage hero (the bond is not
  spellcraft). Placed in Beast master hero beside Heralds of Valdemar and The Skybound Saga (the curator-approved Ranger hero
  split, phonemsg-01M4KNSAA0TYA10DN79G6N2053). Two volumes folded as one fiction (11j). Years from the publisher pages (HarperCollins;
  the Tainted Khan on-sale date 30 April 2025); queue years were blank. Jackets: HarperCollins Australia (Dragon Rider) and
  the author''s site (Tainted Khan), hosted locally.'

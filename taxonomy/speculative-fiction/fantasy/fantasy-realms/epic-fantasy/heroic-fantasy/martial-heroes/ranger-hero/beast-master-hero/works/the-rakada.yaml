placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Ranger hero > Beast master hero. The Rakada (The Bone Raiders 2025, Sisters of the Lizard 2026, Orbit): scout Sayana bonds a fire-breathing lizard of legend and the Rakada ride their great lizards to defend their homeland from an invading enemy (Hachette; Books Bones Buffy blurb). The bonded mount that fights is the story''s engine: Beast master hero. Rejected: Horse fantasy (sibling leaf for conventional mounts; these are bonded war-lizards, and the bond, not the cavalry, is the point), Epic fantasy and Martial heroes umbrellas (too broad). Wobble: low-moderate; the leaf def says ''lifelong bond'' and book one is the forging of that bond. Years: 2025, 2026 (Orbit; Hachette). Queue ids MC04120, MC04121.'

first_published: 1988
canonical_genre: ranger-hero
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Heroic fantasy -> Martial heroes -> Ranger hero.
  Wizards/PRH identifies Drizzt as the iconic dark-elven ranger and centers his journey with panther companion Guenhwyvar beyond Menzoberranzan; wilderness
  skill, weapons and animal partnership define the hero.'

first_published: 2010
canonical_genre: beast-master-hero
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Heroic fantasy > Martial heroes > Ranger hero > Beast master hero.
  One fiction under rule 11j: The Fallen Moon trilogy and its direct continuation
  The Risen Sun trilogy share the world of Cymria and the same griffiner line
  (Arenadd''s daughter Laela leads the second trilogy - kj-taylor.com, AustLit).
  The defining engine is the human-griffin partnership: Arenadd and the dark griffin
  Skade, a bonded pair where the griffin fights, scouts and speaks, the exact Beast
  master hero gate; the second trilogy keeps the same bond frame. Rejected:
  Military fantasy leaves (hero-centered on the pair, never ranks or units; the
  war brewing since book one is backdrop and destination, not the viewpoint),
  Vengeance war fantasy (Arenadd''s war is Northern liberation and holy war, not
  a massacred house''s payback on a dynasty). Wobble disclosed: the fiction darkens
  into a holy war with the bond-hero as its dark messiah; the partnership frame
  governs under the overarching-theme ruling.'

placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Heroic
  fantasy, an RPG-class tree by the hero''s primary power. Mercedes Lackey''s Valdemar (ISFDB series 204; Heralds of Valdemar
  from Arrows of the Queen, DAW, 1987): Heralds are chosen by horse-like Companions and serve the Kingdom of Valdemar as guards,
  judges and envoys; the lifelong bond with the Companion is the power. Caster-heroes tried and refused: Paladin hero is martial
  office joined to sacred magic, and the curator ruled a paladin is a knight of the church (Heralds have no god). Martial
  heroes tried: Warrior hero (arms and courage, not the bond), Rogue hero, Ranger hero. The curator rejected Rider hero and
  Knight hero as new Martial-heroes leaves ("that''s not a D&D class"), Paladin hero ("a paladin is a knight of church") and
  asked for a subclass. The Ranger hero split into Beast master hero and Hunter hero was approved (phonemsg-01M4KNSAA0TYA10DN79G6N2053,
  "Perfect, split approved"); Valdemar is the bonded-mount core of Beast master hero. One shared universe = one fiction (11j):
  the Heralds cycles (Heralds, Last Herald-Mage, Vows and Honor, Mage Winds and Storms, Collegium, Herald Spy, Family Spies,
  Darian''s Tale), plus Mage Wars and the Founding of Valdemar set before it; omnibus editions, collections and Tales of Valdemar
  anthologies skipped. Wobble: moderate for the Mage Wars (gryphons) and Vows and Honor (Tarma and Kethry, mercenaries) volumes,
  which are in the universe but not Herald-bond stories. Years are ISFDB first-publication years; queue years are reissue
  dates. The jacket is Arrow''s Flight (DAW); Open Library''s Arrows of the Queen cover is an audiobook CD.'

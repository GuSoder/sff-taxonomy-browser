placement_rationale: 'Richard K. Morgan''s A Land Fit for Heroes (The Steel Remains 2008, The Cold Commands 2011, The Dark
  Defiles 2014; Morgan''s site, PRH, ISFDB, Wikipedia; one series, one card): Ringil Eskiath, a washed-up mercenary and war
  hero of Gallows Gap who lives off his legend, is asked by his mother to find a cousin sold into slavery, and his main power
  is his sword. Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Warrior
  hero > Outcast knights. Rejected: Rogue hero and Ranger hero (a veteran fighter, not a thief or tracker), Champion knights
  (he serves no crown; he is hired for a cousin and estranged from his family). Wobble: low. Later volumes not read in full.'

placement_rationale: 'Andrzej Sapkowski, The Witcher saga (Blood of Elves 1994, The Time of Contempt 1995, Baptism of Fire
  1996, The Tower of the Swallow 1997, The Lady of the Lake 1999, plus the standalone Season of Storms 2013; Polish first
  publication years; Wikipedia, Gollancz): Geralt of Rivia is a mutated monster-slayer for hire, sworn to no crown, who is
  drawn through a continental war and the hunt for the girl Ciri; the saga''s later volumes follow Ciri and her pursuit, ending
  with her passage through the elven portal in The Lady of the Lake. Walk: Speculative fiction > Fantasy > Fantasy realms
  > Epic fantasy > Heroic fantasy > Martial heroes > Warrior hero > Outcast knights (a masterless fighter who fights for a
  fee, a grudge or survival). Rejected: Hunter hero (the Ranger reading is woodcraft and a chosen quarry; Geralt''s trade
  is the sword, not tracking), Champion knights (he is sworn to no one). Wobble: medium; the saga''s later books shift to
  war and Ciri''s story. Not placed on this card: the short-story collections The Last Wish and Sword of Destiny (collections)
  and the Hussite trilogy (a separate series). Sources read: Wikipedia pages for Blood of Elves and Baptism of Fire, Witcher
  wiki page for The Lady of the Lake.'

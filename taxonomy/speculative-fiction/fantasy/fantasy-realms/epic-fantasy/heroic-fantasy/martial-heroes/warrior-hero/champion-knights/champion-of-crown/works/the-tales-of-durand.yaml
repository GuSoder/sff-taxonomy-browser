placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial
  heroes > Warrior hero > Champion knights > Champion of Crown. Whole-trilogy correction approved 2026-10-29, phonemsg-01M634WJF0TCFZFT8D5T7J8YRK,
  responding to phonemsg-01M6335AWXY67791Y3XYGVGWE9. In the Eye of Heaven enters Lamoric''s service; In a Time of Treason
  explicitly makes Durand a knight of Lamoric''s household; A King in Cobwebs calls him Duke Gireth''s champion. Landless
  origin is not sustained masterlessness. Personal service to a ruler, not ruling his own domain (Champion Lord) or primarily
  army leadership for a realm (Champion of Realm). Heroic rather than Political/High/Military: becoming and living as a good
  knight, personal allegiance and divided loyalty organize the trilogy. Martial/Warrior rather than Caster/NPC/Rogue/Ranger:
  trained direct armed combat. Sources: https://lib.byu.edu/search/byu/record/cat.4186248.item.31197229809931 ; https://lib.byu.edu/search/byu/record/cat.4186244.item.31197230015544
  ; https://terribleminds.com/ramble/2018/12/06/david-keck-five-things-i-learned-writing-a-king-in-cobwebs/ . Existing book
  list and bibliographic metadata unchanged.'

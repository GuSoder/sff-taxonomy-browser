definition: 'Warrior hero fantasy where the fighter fights for someone: a people, a crown, a realm or a cause. The protagonist
  holds or earns a place in a lord''s, queen''s or nation''s service and the fighting is that allegiance in action. Not Outcast
  knights (there the fighter''s own master is gone, threw him out or never existed), not Ranger hero (tracker and wilderness
  skill), not Rogue hero (stealth and cunning).'

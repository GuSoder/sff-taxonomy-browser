placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial
  heroes > Warrior hero > Outcast knights. Secondary world (the five kingdoms, Kaer-Ise; Kirkus, SLJ). The Ankou - ''Lazarus''
  - is a cursed immortal mercenary monster-killer sworn to no crown, traveling the kingdoms and fighting for a fee and for
  his own reason (breaking his curse), the Witcher pattern this leaf already holds: masterless fighter, his own quest. Rejected:
  Hunter hero (he is no tracker winning by woodcraft; he is a swordsman for hire, cf. the Witcher call), War of immortals
  (no army or war spine; the invasion is backstory), the Romantasy subtree (the slow-burn love story is real but the marketing
  and spine are the curse quest; standalone YA fantasy, Little, Brown). Standalone novel, 2021.'

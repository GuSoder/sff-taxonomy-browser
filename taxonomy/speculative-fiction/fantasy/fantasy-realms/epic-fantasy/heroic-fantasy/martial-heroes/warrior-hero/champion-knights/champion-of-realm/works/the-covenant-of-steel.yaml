placement_rationale: 'Root-down walk: invented world (the kingdom of Albermaine), so Fantasy realms; Epic fantasy, Heroic
  fantasy, Martial heroes, Warrior hero. Sources (publisher blurbs for The Pariah, The Martyr and The Traitor, found via web
  search of anthonyryan.net and Hachette): Alwyn Scribe is raised an outlaw, trained by his band to steal, kill, spy and deceive;
  an act of betrayal sends him to a soldier''s life in the king''s army under Lady Evadine Courlain, a noblewoman beset by
  visions of a demonic apocalypse. By The Martyr he is a spymaster and sworn protector of Evadine and sent to put down a rebellion
  in the Duchy of Alundia; by The Traitor he is a knight and her most trusted advisor. The arc is outlaw to sworn service,
  so Champion knights (fights for a lord and a cause), not Outcast knights (he is sworn) and not Rogue hero (the stealth years
  are his past; the books are about his war service). Wobble: Rogue hero is the alternative for the first book alone. Years:
  The Pariah 2021, The Martyr 2021, The Traitor 2022 (first UK editions; read from the author''s pages, not isfdb). Set in
  the same world as Raven''s Shadow but a separate cast and a separate card.'

placement_rationale: 'Larry Correia''s Son of the Black Sword (Baen, 2015; Wikipedia), first of the Saga of the Forgotten
  Warrior, with House of Assassins (2019), Destroyer of Worlds, Tower of Silence, Graveyard of Demons and Heart of the Mountain
  folded in as the later volumes: on the continent of Lok, bound by the caste Law and ruled from the Capitol, with religion
  outlawed and hunted by the Inquisition, Ashok Vadal is a Protector, one of the superhuman warriors who enforce the Law and
  fight demons, and wields a black-steel ancestor blade that carries the skill of all its past bearers; Publishers Weekly
  and reviewers compare him to Conan. Walk: Fantasy > Epic fantasy > Heroic fantasy > Martial heroes > Warrior hero (the protagonist''s
  power is direct armed combat). Tried: Rebel fantasy and Overthrow fantasy (the later books turn to rebellion against the
  Capitol, but book one is a lone enforcer''s story) and Soldier fantasy (not a unit). Wobble: the later volumes lean towards
  insurgent war, I read only the first book and the series summary.'

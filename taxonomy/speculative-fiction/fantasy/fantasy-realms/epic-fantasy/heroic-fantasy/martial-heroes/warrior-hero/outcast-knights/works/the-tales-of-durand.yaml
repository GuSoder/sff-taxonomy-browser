placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial
  heroes > Warrior hero > Outcast knights. Durand is a squire trained for a lordship that is lost when the knight''s missing
  son returns; he becomes a knight errant, "a posh term for sell sword," on the tournament circuit with a duke''s son fighting
  anonymously as the Red Knight (Emerald City review, emcit.com/emcit128.php?a=6); Tor/Open Road: a good squire trying to
  become a good knight, falling in with knights working for a vicious duke''s son. Masterless and fighting for fame and fee:
  Outcast knights. Soft placement: the later books may bind him to a lord, which I did not read. Rejected: Champion knights
  (no allegiance in the sources read), Medieval fantasy (a secondary-world setting, not our Middle Ages). Sources: Emerald
  City review and Open Road page, not the novels.'

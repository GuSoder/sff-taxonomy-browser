placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Warrior hero > Outcast knights. The Godslayer Chronicles (Shadowfall 2005, Hinterland 2006, Roc; jamesclemens.com books page): Tylar de Noche, a crippled and disgraced former Shadowknight, witnesses the murder of the goddess Meeryn and is left marked by her dying breath - a mark many read as proof he killed a god - and is chased across Myrillia by enemies human and ethereal as he fights to unmask the true godslayer. Cast out and fighting for his own vindication while hunted: the Outcast knights reading. Rejected: Champion knights (he holds no one''s service when the story is his; his regency in book 2 is a trap-marked office, not an allegiance that drives the plot), Destiny quest fantasy (his rise is not from nothing; he is a broken knight, and no birthright or earned-from-scratch power is the spine). Wobble: moderate - he regains his knighthood and serves Chrismferry in book 2, so the Champion tension is real. SOFT. Years: 2005, 2006 (author site; queue''s 2006/2007 are reprints). Queue ids MC04160, MC04161.'

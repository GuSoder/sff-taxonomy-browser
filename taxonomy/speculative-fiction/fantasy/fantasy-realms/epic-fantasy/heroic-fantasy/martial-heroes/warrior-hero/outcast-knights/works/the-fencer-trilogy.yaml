id: the-fencer-trilogy
title: The Fencer trilogy
authors:
- K. J. Parker
first_published: 1998
canonical_genre: outcast-knights
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Heroic fantasy > Martial heroes > Warrior hero > Outcast knights.
  Bardas Loredan is masterless: Maxen''s Pitchfork is long disbanded, he fences court
  cases for fees in Perimadeia, survives a hired curse and is dragged against his will
  into the city''s defence against Temrai''s siege. Sworn to no one, fighting for a fee,
  a grudge and survival is the Outcast knights gate word for word; the trilogy keeps
  following the same fighter (bowcraft in The Belly of the Bow, the tempered armour
  in The Proof House), so the whole fiction walks together. The Principle (the Order''s
  magic-like philosophy) is background machinery, never the hero''s power source, so
  Martial heroes stands. Rejected: Champion knights (he holds no allegiance to crown,
  realm or lord - the city merely hires him), Ranger hero (no wilderness craft), Army
  fantasy leaves (the siege of Perimadeia is huge but the fiction stays hero-centered
  on Bardas, not the ranks or the commanders), Martial statecraft (he is no ruler''s
  instrument of rule). Wobble disclosed: the trilogy doubles as a siege epic through
  Temrai''s side; hero-centered martial line governs under the whole-fiction rule.'

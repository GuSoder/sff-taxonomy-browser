ruling: 'Split of Warrior hero at ten cards (Land Fit for Heroes held at the gate), approved by the curator''s "Approved"
  (2026-10-12 4:36:07 PM CEST, phonemsg-01M4R8NNR9VE8N9T8T2PXE3BQM, on his own names Champion knights / Outcast knights),
  after the intake''s "Approve split?" question; names are the curator''s own. Axis: whose fight it is, a people, crown or
  cause (Champion knights) vs the fighter''s own, after being cast out, defecting or going masterless (Outcast knights). Softness:
  Graceling Realm (Katsa starts as a king''s weapon), Godkiller (Kissen is an independent professional rather than cast out),
  Drenai Saga (Druss wanders), The Burning (revenge first, champion later).'

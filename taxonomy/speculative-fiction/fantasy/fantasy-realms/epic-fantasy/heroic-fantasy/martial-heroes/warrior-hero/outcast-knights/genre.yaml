definition: 'Warrior hero fantasy where the fighter is sworn to no one: cast out, defected, exiled or masterless, and fighting
  for his own reasons, a fee, a grudge or survival. Not Champion knights (there the fighter fights for a people, a crown or
  a cause), not Ranger hero (tracker and wilderness skill), not Rogue hero (stealth and cunning).'

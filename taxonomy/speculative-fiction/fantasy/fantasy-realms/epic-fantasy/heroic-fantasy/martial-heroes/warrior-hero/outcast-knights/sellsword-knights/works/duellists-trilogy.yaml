placement_rationale: 'Root-down (2026-11-18 re-walk): Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial heroes > Warrior hero > Outcast knights. Sibling duellists Kacha and Vocho are cast out of their guild after a fatal protection job and live masterless - highway robbery, gambling scams, a commissioned bandit manhunt - fighting for a fee, a grudge and survival, their primary power the duel itself. The leaf''s gate: cast out, exiled or masterless, fighting for his own reasons, a fee, a grudge or survival; The Witcher and The Fencer Trilogy are the shelf neighbors. Moved out of Caper fantasy on the curator''s direction (phonemsg-01M7QBJCFS32SPR9JJ0ZNWMJQF, phonemsg-01M7QC0JAV7SJCPSTEFHBZD4DD, 2026-11-18): the scams ride along on what is really a swordplay series. Not Rogue hero (the gate excludes stealth-and-cunning primaries: their power is the blade). This placement lands the leaf''s tenth - freeze and split proposal follow at once.'

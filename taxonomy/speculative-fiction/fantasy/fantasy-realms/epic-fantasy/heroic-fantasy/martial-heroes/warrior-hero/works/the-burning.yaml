placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Martial
  heroes > Warrior hero. One series (Burning #1-2), one fiction. Tau, a low-caste fighter, trains to kill the nobles who murdered
  his father and then becomes the Queen''s Champion; his power is trained swordsmanship, physical courage and later battlefield
  leadership, which is the Warrior hero definition. Rejected: Soldier fantasy (the unit is not the story; Tau is the story
  and the definition excludes one fighter), War fantasy (the war is the setting, not the subject), Revolutionary fantasy (a
  caste order is attacked but the books follow one fighter''s vengeance, not an uprising). Wobble: dragons and an army war
  are present, so Military fantasy is the second-closest. First publication year 2017 is the self-published edition, not the
  2019 Orbit reissue.'

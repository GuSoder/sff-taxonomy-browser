placement_rationale: SFE calls Gemmell primarily a Heroic Fantasy author and says the long-lived Drenai Saga begins with Legend,
  is built around the indomitable warrior Druss, and continues through Hero in the Shadows with the related Skilgannon books.
  Its authority and action come from armed combat, courage and battlefield leadership, matching Warrior Hero.

id: jirel-of-joiry
title: Jirel of Joiry
authors:
- C. L. Moore
first_published: 1934
canonical_genre: warrior-hero
placement_status: accepted
placement_rationale: >-
  SFE calls Jirel the first Sword-and-Sorcery series with a female hero and a swashbuckling adventuress; Hachette describes her as a fearless commander of warriors whose two-handed sword, physical courage and honor drive her journeys. Her primary power source is direct martial prowess, making Warrior Hero exact under Gustav's RPG-class rule.

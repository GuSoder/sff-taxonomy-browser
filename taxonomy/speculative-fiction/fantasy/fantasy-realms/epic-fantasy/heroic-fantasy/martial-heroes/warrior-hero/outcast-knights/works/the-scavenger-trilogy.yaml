first_published: 2001
canonical_genre: outcast-knights
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic
  fantasy > Martial heroes > Warrior hero > Outcast knights. Poldarn is the most masterless fighter in
  the tree: an amnesiac who does not know his own name, trampling through other people''s lives on lethal
  trained reflex, fighting for survival and answers rather than any crown, cause or fee-paying lord -
  the Outcast knights gate. The Principle-era world carries prophecy and a doom-god''s cult, but Poldarn''s
  power source is the sword skill his body remembers, so Martial heroes stands. Rejected: Champion knights
  (he is sworn to nothing, not even to his own past), Caster heroes (no spellcraft), Messianic fantasy
  (cults gather around the Poldarn-god but there is no uprising to lead - Revolutionary parentage fails),
  Quest fantasy (he drifts toward answers; no quest object). Wobble disclosed: the identity spine - is
  he the mortal extension of Poldarn the god, destroyer of empires - is the trilogy''s famous question;
  it never becomes a power he wields, so the hero-centered martial line governs under the whole-fiction
  rule. Whole trilogy folded (Shadow, Pattern, Memory).'

placement_rationale: 'Gwynne''s Norse-inspired trilogy (Orbit UK; ISFDB): The Shadow of the Gods (2021), The Hunger of the
  Gods (2022), The Fury of the Gods (2024); a separate world from the Banished Lands. Vigrið, where the animal gods destroyed
  each other in a cataclysmic war, leaving relic bones and the blood-born Tainted. Three masterless fighters drive the story:
  Orka, a retired warrior hunting her husband''s killers and her kidnapped son; Varg, an escaped thrall sworn to no one, seeking
  vengeance for his dead sister; Elvar, a noblewoman who rejected privilege to win her own battle-fame with the mercenary
  Battle-Grim. Their personal grudge-quests converge against the freed dragon-god Lik-Rifa - ''a tale of vengeance, of powerful
  gods, warriors and creatures'' (Fantasy Hive); the engine stays the outcast warriors'' own wars across all three books.
  outcast-knights'' gate exactly: ''the fighter is sworn to no one: cast out, defected, exiled or masterless, and fighting
  for his own reasons, a fee, a grudge or survival'' (The Witcher is the tenant archetype). Not invented-gods: the gods are
  dead backdrop/relics until Lik-Rifa''s release, not the story''s on-page drivers. Whole-fiction engine checked per the Banished
  Lands lesson: vengeance quests hold in books 2-3, no engine shift. Queue rows MC04730-32 are the three volumes; first published
  2021.'

placement_rationale: 'Talion: Revenant (Stackpole, Bantam 1997, queue MC06838 ''Talion'') is a standalone novel written in
  1986 and first published in 1997; Stackpole has only mentioned a later serial sequel (Talion: Nemesis) on his Patreon, not
  a published novel, and no other Talion book is on ISFDB. Stackpole''s other queue rows are separate worlds. Nolan ra Sinjaria,
  orphaned when Hamis conquered his country, trains as a Talion Justice, an order that polices the kingdoms of the shattered
  empire, and is later ordered to guard the king who killed his family. Justices carry a magical sword and a death''s-head
  palm tattoo that draws out a soul, conferred by the order''s ritual and checked by its purification rite. Full root path:
  Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic fantasy > Half-caster heroes > Paladin hero (5 fictions).
  Fits the definition of martial office joined to office-bound magic: the hero''s power is the Justice''s investiture, sword
  and tattoo, held under the order''s law (Hilliard, TV Tropes, SFFWorld, Elbakin). Rivals rejected: Spellsword heroes, because
  the magic is not the fighter''s own gift or learned spells but the order''s grant (and that leaf has nine cards, so adding
  would force a split, which is not a reason to pick either way); Warrior hero and Champion knights, because the hero''s kit
  includes magic; Classic quest and Destiny, because the book is a hero study with a bodyguard mission, not a prophecy quest.
  Wobble recorded: the order is secular rather than sacred, so Paladin hero''s sacred or oath-bound wording is stretched to
  an office-bound oath.'

placement_rationale: 'Talion: Revenant (Stackpole, Bantam 1997, queue MC06838 ''Talion'') is a standalone novel written in
  1986 and first published in 1997; Stackpole has only mentioned a later serial sequel (Talion: Nemesis) on his Patreon, not
  a published novel, and no other Talion book is on ISFDB. Stackpole''s other queue rows are separate worlds. Nolan ra Sinjaria,
  orphaned when Hamis conquered his country, trains as a Talion Justice, an order that polices the kingdoms of the shattered
  empire, and is later ordered to guard the king who killed his family. After the order''s ritual a Justice carries a magical
  sword he can call to his palm and a death''s-head tattoo that draws out a soul (Hilliard, TV Tropes, SFFWorld, Elbakin,
  and the novel''s opening chapters). Full root path: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Heroic
  fantasy > Half-caster heroes > Spellsword heroes (now ten fictions). Re-walked 27 Nov from Paladin hero: its definition
  requires sacred or oath-bound magic. No source read shows a vow or deity behind the Justice''s powers (the order''s law
  and a purification ritual after misuse are checks, not an oath of the magic), so Paladin fails its gate and is not widened.
  Fits Spellsword heroes: a fighter-lawman whose own kit includes magic, the sword and the tattoo, carried on his body after
  the ritual. Rivals rejected: Warrior hero and Free blades or Champion knights (the kit includes magic), Arcane trickster
  (not stealth), Classic and Destiny quest (hero study and bodyguard mission, no prophecy). Wobble recorded: the magic is
  conferred by the order''s ritual rather than being born or self-learned. Placing it takes Spellsword heroes to ten fictions,
  which stops intake until the split is proposed.'

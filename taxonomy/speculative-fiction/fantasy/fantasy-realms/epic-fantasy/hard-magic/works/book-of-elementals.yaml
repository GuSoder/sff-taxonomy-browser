placement_rationale: >-
  Root-down: SFE calls Sorcerer's Son an outright fantasy centered on an oedipal quest and magical apprenticeship, identifies its sequel The Crystal Palace, and specifically says their magic is treated as a form of science. That passes Fantasy -> Fantasy Realms -> Epic fantasy -> Hard magic: apprenticeship, systematic demon conjuration, elemental affinities and magic-as-science govern the two-volume sequence more specifically than the first volume's father-seeking journey.

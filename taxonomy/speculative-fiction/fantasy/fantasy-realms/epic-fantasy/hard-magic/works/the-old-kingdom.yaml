id: the-old-kingdom
title: The Old Kingdom
authors: [Garth Nix]
first_published: 1995
canonical_genre: hard-magic
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Hard magic. Nix’s official synopsis establishes the Old Kingdom, Charter Mages, Free Magic, the Abhorsen and a quest against forces of life and death; the official system gives seven named bells with distinct effects, Charter marks, costs and boundaries. Quest fantasy loses because the rule-bound Charter/Free Magic and necromancy system is the series’ distinctive engine.'

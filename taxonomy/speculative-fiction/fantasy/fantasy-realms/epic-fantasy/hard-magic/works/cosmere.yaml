id: cosmere
title: The Cosmere
authors: [Brandon Sanderson]
first_published: 2005
canonical_genre: hard-magic
placement_status: accepted
placement_rationale: 'Gustav’s 2026-09-21 ruling merges the separate Mistborn and Stormlight Archive cards into their shared Cosmere universe. Sanderson’s official definition calls the Cosmere one interconnected universe of epic-fantasy worlds, characters and cultures; his official Books page groups Stormlight, both Mistborn eras, Cosmere standalones, White Sand and Arcanum Unbounded beneath it. Each world has an engineered, learnable magic system governed by the shared underlying cosmology, so Hard magic remains the governing leaf.'

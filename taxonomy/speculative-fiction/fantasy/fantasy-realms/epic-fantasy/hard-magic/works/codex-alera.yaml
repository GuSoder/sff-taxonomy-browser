placement_rationale: >-
  Penguin Random House's complete six-book series page defines Alera by furycraft: bonds with elemental forces of earth, air, fire, water, wood and metal that produce specific capabilities used in war, protection and survival. Politics and empire matter, but the explicit, learnable elemental system repeatedly governs what characters and armies can do, making Hard magic closest.

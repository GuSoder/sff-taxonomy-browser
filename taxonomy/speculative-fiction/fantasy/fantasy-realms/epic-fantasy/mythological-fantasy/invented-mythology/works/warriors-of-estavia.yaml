placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented
  mythology. One trilogy in one world (Warriors of Estavia; ISFDB series 12605), so one fiction (rule 11j). Separate from
  the Branion series: the Warriors of Estavia is a different world (Anavatan on the Silver Lake) and ISFDB lists the two as
  different series. Per PRH: Anavatan sits on the lake where the gods were born, a God-Wall protects the city, the young God
  Hisar claims a place in the pantheon, and a prophesied time of change is near; a Malazan Book Review blurb says the gods
  manifest themselves to their people in physical form. The pantheon and its birth are the story, which is the Invented mythology
  definition (invented gods built from scratch). Rejected: Hidden heir and Dynastic leaves (no ruling line is the engine),
  Fifth sun and the other Far shores leaves (no matching tradition). Wobble: Mythic power struggle (real-tradition beings)
  is the nearest sibling but the gods are invented. Years are the DAW first editions (ISFDB 2005, 2008, 2011), not the queue''s
  2007 and 2009.'

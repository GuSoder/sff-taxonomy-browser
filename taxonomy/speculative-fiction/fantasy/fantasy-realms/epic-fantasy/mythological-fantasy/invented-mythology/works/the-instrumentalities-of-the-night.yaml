placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented
  mythology. In the Instrumentalities of the Night, imps, demons and dark gods rule the spaces around humanity while a wall
  of ice at the edge of the world threatens the land of the Night, and politics, religion and kingdoms collide on that scale
  (Macmillan series page, series blurb). Four novels (Tyranny, Lord of the Silent Kingdom, Surrender, Working God''s Mischief)
  are one fiction under rule 11j; the Complete Instrumentalities omnibus (MC03480) is an edition. The gods, the Night and
  the ice are invented and the book''s history is the history of that mythology, which is the leaf''s definition. Rejected:
  Army fantasy (campaigns are part of it, but the story is the gods'' struggle for the world), Mythic power struggle (the beings
  are invented, not from real tradition), Revisionist quest fantasy. Wobble: moderate; the books are as much political and
  military epic as mythology, and I read only the publisher''s series description, not the novels. Surrender has no cover
  because Open Library only has a library-stamped scan.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented
  mythology. Per Hachette/Orbit and Daphne Press: in the Warring Gods duology, two women are caught in an ancient feud between
  ruthless gods (the god of the sun, the god of the void and their monstrous creatures), a struggle for power and liberation
  on an invented-world island. A made-up pantheon and its own creation-level quarrel, not retold real myth, is the Invented
  mythology definition. Rejected: Mythic power struggle (its beings are from real tradition: angels, demons, gods), Messianic
  fantasy (no sacred figure leads the political break). Wobble: the romance and the sun-god-in-service plot could argue for
  a political or romantic leaf. Two volumes folded as one fiction: The Sun and the Void (2023, Orbit) and The River and the
  Star (7 October 2025).'

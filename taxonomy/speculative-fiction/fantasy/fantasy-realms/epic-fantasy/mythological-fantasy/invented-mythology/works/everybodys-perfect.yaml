placement_rationale: 'Standalone literary fantasy novel (Tor, 2026-06-30, 272pp): the Serenissima, an imaginary shadow-Venice
  ''built from mist and belief'' and crossroads of the nine worlds, where a laborer''s dream of a doge who will marry the
  sea settles into the city''s bones and becomes more than half-fated. Engine is an invented founding myth coming true inside
  an invented world - belief-made-reality, fate, plague and power told in a relay of non-recurring POVs. Root walk: real-earth/portal
  fail on setting (invented world, story lives in it); fantasy-realms branches fail: high fantasy (no consequential journey),
  political (not a succession-war engine), heroic/S&S (no adventure class), comic (tone), fairytale (no tale revision), far-shores
  ABOUT-NESS test (Venice is Western), gothic-realms (no menace register; Pax Britannica manners gate fails - Venetian, artisan-class
  cast, not imperial drawing-room elite), heart-fantasy (no bond spine; PW: ''elaborate worldbuilding... ambitious''). Disclosed
  friction: epic-fantasy ancestor wording lists journeys/wars/large geographies (absent) but also ''political stakes... cosmic
  systems and invented gods'' (present: nine-world crossroads, belief-built city, fated doge-sea marriage); tone is gentle/intimate,
  engine over tone. First tenant of the provisional invented-mythology leaf.'

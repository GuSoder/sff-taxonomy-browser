placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented
  mythology. One shared world (Ararat; Gears of the City is the follow-up to Thunderer per Penguin Random House), so one fiction
  (rule 11j). Per PRW/SFFWorld: Ararat is a vast invented city where the gods are visible and active, the Bird-God returns,
  Arjun comes seeking the lost Voice of his people''s god, and the god Typhon walks the plot; Gears of the City returns Arjun
  in the last days of Ararat. The engine is an imagined pantheon and its return, which is the Invented mythology definition
  (invented gods built from scratch). Rejected: New weird (Bas-Lag kinship is real and a review lists it among city novels,
  but gods and their lost voice, not grotesquerie or genre-mingling, drive the plot; New weird is also at nine works), Dark
  realms (not governed by dread), Tinderbox (Jack''s Thunderers are a thread, not the shape). Wobble: New weird is the second
  reading.'

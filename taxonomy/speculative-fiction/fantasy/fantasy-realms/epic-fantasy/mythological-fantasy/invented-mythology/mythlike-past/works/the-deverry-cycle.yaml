id: the-deverry-cycle
title: The Deverry Cycle
authors:
- Katharine Kerr
first_published: 1986
canonical_genre: mythlike-past
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented mythology > Mythlike past. Secondary
  world (the land of Deverry; Wikipedia''s Deverry Cycle). Sixteen published novels (1986-2020) told non-linearly across centuries: the dweomer cosmology and the
  souls'' prior incarnations are the inherited deep structure the human story walks through, and the gods stay distant - Evandar and the Guardians are spirit-folk,
  not the world''s creators, and the plot turns on Nevyn''s oath and the incarnated souls, never on what a god does; exactly the Mythlike past definition (invented
  myth as inherited past or backdrop, gods rarely on the page) alongside The Instrumentalities of the Night. Not Invented gods (no on-page divine actors), not Mythic
  power struggle (no real-tradition beings), not Celtic myth fantasy (invented world, not a retold real myth cycle), not Classic quest fantasy (no quest spine; a
  deep-time karmic chronicle). Bibliography verified current on Wikipedia''s Deverry Cycle: 16 published novels in five acts; two more contracted but unpublished,
  so the card folds all published volumes. A Time of Exile (1991) is book 5, the Westlands opener.'

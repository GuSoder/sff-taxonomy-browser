placement_rationale: 'Laini Taylor''s Strange the Dreamer (2017; Wikipedia, Kirkus; Muse of Nightmares is the continuation
  and is folded in): orphan librarian Lazlo Strange travels to Weep, a lost city whose six Mesarthim, who set themselves up
  as gods, were slaughtered by the Godslayer; their godspawn children survive in a citadel above the city. Walk: Speculative
  fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented mythology > Mythlike past. Rejected:
  Invented gods (the gods are already dead; what acts on the page is their aftermath and their children). Wobble: medium;
  the godspawn act on the page, so it could be argued either way, but the myth is the inherited past the story digs into.
  Muse of Nightmares outcome not verified; sources not read in full.'

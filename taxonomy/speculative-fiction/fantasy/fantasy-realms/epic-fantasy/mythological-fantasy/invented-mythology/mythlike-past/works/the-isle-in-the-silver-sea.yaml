canonical_genre: mythlike-past
placement_status: accepted
placement_rationale: 'The Isle is Britain''s legendised double kept alive by its stories under an eternal,
  gracious Queen (Bourke, Locus) - an invented patchwork Britain, not our Earth (Kirkus), and Arthuriana
  "without being explicitly indebted to it" (Bourke), so neither Arthur returned (legend alive in our present
  day) nor Arthur reimagined (the legend retold) can hold it. Placed in Mythlike past: the premise is invented
  mythology - stories keep the land alive and Vina and Simran incarnate an invented tale, "The Knight and The
  Witch" (Locus, Library Journal) - no real-world myth retold, no gods acting on the page.'

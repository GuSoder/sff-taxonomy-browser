placement_rationale: 'Standalone literary fantasy novel (Tor, 2026-06-30, 272pp): the Serenissima, an imaginary shadow-Venice
  and crossroads of the nine worlds. POSITIVE FIT to Mythlike past (2026-10-12 curator split axis: gods as actors on the page
  vs invented myth as inherited past or backdrop): no gods act in this book; what acts is the myth itself. PW (2026-03-19):
  the city is ''built on nothing but layers of magical mist and memories and dreams'', its waterways ''maintained by shared
  belief in their existence'', ''The Venetians believed the Serenissima into being first'' - and PW explicitly calls this
  the story''s ''inventive backdrop'', with ''the relatively low-stakes plot... personal and affecting'' told through nine
  human POVs: the invented myth is the world the human story walks through, which is the leaf''s own sentence. The plot engine
  is a founding legend coming true: a fisherman''s dream that the city will elect its first doge, confirmed by a mystic, after
  which ''the city itself pulls everyone around him into the rush to fulfill the prophecy'' (PW) - fate exerted by the mythic
  backdrop, not a personified god (softness precedent: Audition for the Fox sits here with a living acting god; The Spear
  Cuts Through Water with a dying goddess carried across the land). Friction kept on record: the leaf''s wording leads with
  ''inherited PAST'' (divine age, dead gods, lost cities) while this myth is live and being born; the ruling''s own gloss
  ''inherited past or backdrop'' covers it via backdrop, and the governing axis is on-page god actors, which are absent. Root
  walk: real-earth/portal fail on setting (invented world, story lives in it); fantasy-realms siblings rejected: high fantasy
  (no consequential journey), political (not a power-struggle engine), heroic/S&S, comic, fairytale, far-shores (ABOUT-NESS
  test - Venice is Western), gothic-realms (no menace register; Pax Britannica manners gate fails - Venetian artisan cast),
  heart-fantasy (no bond spine).'

placement_note: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented mythology > Mythlike past. Archaeologist Cod chases the ghost of her hero Aleya Ana-Ulai, written off as myth; her teacher uncovers the ruins of an enchanted city slumbering beneath the soil, and ancient magics stir as war brews and rival powers circle (Penguin Random House; Hachette UK: ''history and myth, magic and mystery''). An invented divine past - the legend, the buried gods, the lost city - is the backdrop the human story walks through: Mythlike past (Strange the Dreamer, another scholar chasing a lost city''s myth, is the member precedent). Rejected: Invented gods (the powers stir underfoot but stay off-page as actors), High fantasy children (no consequential journey), Political fantasy (war and rival powers are pressure, not the engine), Romantasy (a sapphic romance runs through it, but the spine is the dig and the legend). Sources: PRH, Hachette, Waterstones; not read in full.'

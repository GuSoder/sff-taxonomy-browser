ruling: 'Split of Invented mythology at ten cards (Strange the Dreamer held at the gate), approved by the curator''s "Approved"
  (2026-10-12 4:04:19 PM CEST, phonemsg-01M4R6VED1NEC7PPVQSVBN7CQ3, on his own names Invented gods / Mythlike past), after
  the intake''s "Approve split?" question; names are the curator''s own. Axis: gods as actors on the page (Invented gods)
  vs invented myth as inherited past or backdrop (Mythlike past). Softness: Audition for the Fox has a living acting god,
  The Instrumentalities of the Night has living dark gods offstage, and The Spear Cuts Through Water carries a dying goddess
  across the land, so those three sit in Mythlike past on balance. Cousin: Mythic power struggle.'

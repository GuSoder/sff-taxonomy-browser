definition: 'Invented mythology as inherited past: an invented divine age, dead or distant gods, lost cities and legends are
  the backdrop the human story walks through, and the gods rarely or only partly act on the page. Not Invented gods (there
  the gods are on-page actors), not Mythic power struggle (the beings come from real traditions).'

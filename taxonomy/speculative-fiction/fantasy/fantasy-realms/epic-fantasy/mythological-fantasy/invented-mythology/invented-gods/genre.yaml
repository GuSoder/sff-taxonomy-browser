definition: 'Invented mythology where the gods themselves are on the page: invented gods act, speak, fight or are fought as
  characters, and the plot turns on what they do. Not Mythlike past (there the invented myth is an inherited past or backdrop
  the story walks through), not Mythic power struggle (the beings come from real traditions).'

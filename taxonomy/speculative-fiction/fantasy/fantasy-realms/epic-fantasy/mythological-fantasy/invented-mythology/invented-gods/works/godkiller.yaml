placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented
  mythology > Invented gods. Whole-fiction correction approved 2026-10-29, phonemsg-01M63B34YE7F2P5RRPXS1QJT50, on proposal
  phonemsg-01M639D5F8X2M4P2KXJDSZTCA3. Shared-universe scope checked: Godkiller, Sunbringer and Faithbreaker comprise the
  published Fallen Gods fiction found in author-wide checks; A Snake Among Swans belongs to a separate world and future Fallen
  Gods returns remain plans. All three books turn on how worship creates, feeds and breaks gods across Kissen, Inara, Skedi
  and Elo, not simply Kissen as independent sword-for-hire. Gods travel, rescue, guide, invade and fight on-page. High fantasy
  is the strongest rival, but the first pilgrimage gives way to divided rebellion, divine revelations and a war shaped by
  worship, not a governing continuous journey. No single heroic class, campaign, state struggle or technical rule-solving
  governs all three. Found family is important but not Cozy safety and low intensity; romance is not the governing plot. Invented
  pantheon, not real-tradition beings or a remote Mythlike past. Sources: https://www.hannahkaner.com/books ; https://www.grimdarkmagazine.com/interview-with-author-hannah-kaner/
  ; https://www.kirkusreviews.com/book-reviews/hannah-kaner/godkiller/ ; https://fantasy-hive.co.uk/2024/01/sunbringer-by-hannah-kaner-book-review/
  ; https://reactormag.com/book-review-faithbreaker-by-hannah-kaner/ . Existing three-book list and metadata unchanged. Invented
  gods reaches ten with this approved move and freezes immediately for split examination; no eleventh placement.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented
  mythology > Invented gods. Whole-fiction correction approved 2026-10-29, phonemsg-01M636XPB168TJEVV5JXXWNRR5, direct reply
  to proposal phonemsg-01M636NVQQ10JC9VHMVXD2VXZY. Shared-universe check: all three published Crua novels covered; Barker
  explicitly calls this a different world from his prior work, not a shared setting with Tide Child or Wounded Kingdom. Across
  Gods of the Wyrdwood, Warlords of Wyrdwood and Heart of the Wyrdwood, active gods, god-linked cowl power, the ensemble and
  the origins/workings of the world govern the fiction. Not merely armed Cahan with gods as scenery. Barker says it could
  never be just Cahan''s story and rejects a chosen-one reading. Dread is a register rather than the governing Gothic engine;
  neither a continuous outer quest, sacred political movement, single martial hero, rule-solving system nor military unit
  governs all three. Invented mythology, not inherited real-world pantheons; gods act on-page rather than remaining a mythlike
  past. Sources: https://www.rjbarker.com/the-forsaken-trilogy ; https://www.runalongtheshelves.net/interviews/2025/8/26/interviewing-rj-barker
  ; https://www.runalongtheshelves.net/interviews/2024/10/4/interviewing-rj-barker ; https://fantasy-hive.co.uk/2023/06/interview-with-rj-barker-gods-of-the-wyrdwood/
  ; https://britishfantasysociety.org/review/warlords-of-wyrdwood-by-rj-barker/ . Three-book list and metadata unchanged.'

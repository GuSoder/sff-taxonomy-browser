definition: 'Invented gods fiction in which experiencing or learning divine existence is a sustained subject: divine
  identity, consciousness, duties, limits and dependence on belief. Human viewpoints may coexist. Where both sides are
  substantial, sustained experience of divinity takes priority over the human-facing relationship to gods; an occasional
  divine viewpoint alone is not enough.'

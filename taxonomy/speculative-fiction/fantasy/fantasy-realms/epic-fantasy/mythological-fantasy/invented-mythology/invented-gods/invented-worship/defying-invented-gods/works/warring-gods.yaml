  ## Approved Invented worship subdivision,25 November2026


  Root-down rewalk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented mythology
  > Invented gods > Invented worship > Defying invented gods.


  Speculative fiction: literal supernatural gods and powers, not mundane religious belief alone. Fantasy rather than SF: no
  naturalizing explanation in the read sources. Fantasy realms: invented worlds, not an Earth anchor or Earth portal. Epic
  fantasy: the existing ensemble/world stakes and divine cosmology retain priority over intimate sword-and-sorcery adventure,
  fairytale revision, Gothic dread, cultural aboutness, comedy or bond-centered alternatives. Mythological fantasy: invented
  divine order is the subject, not primarily military campaigns, institutions of state, one heroic profession, quest form
  or systematic magic inquiry. Invented mythology: made-up deities, not reuse of real-world pantheons. Invented gods: acting
  gods rather than inherited myth as backdrop. Invented worship: the mortal-facing relation to divine claims/presence, not
  sustained experience of divine existence. Existing specific ancestor evidence and rivals above are retained, not overridden
  by this subdivision.


  Reina and Eva become instruments/hosts of competing divine powers, with personal liberation central. The completed duology''s
  struggle for agency against ruthless entities wins over reading its journeys as a recovery quest. Hosting is one mechanism
  of domination, not a claim that every viewpoint is possessed.


  Sibling axis: the governing mortal undertaking is freedom from divine claims versus seeking/recovering divine presence,
  power or a concrete sacred relic. Neither requires every character to share one intention; a subplot or ending does not
  alone govern the whole fiction. All existing titles, authors, years, books and hotlinked covers unchanged.



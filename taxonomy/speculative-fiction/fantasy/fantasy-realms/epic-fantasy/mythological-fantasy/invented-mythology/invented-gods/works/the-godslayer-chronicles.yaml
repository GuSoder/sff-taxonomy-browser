placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented
  mythology > Invented gods. Whole-fiction correction approved 2026-10-29, phonemsg-01M6397C47ZYA2QFTHAD9B1V9R, on proposal
  phonemsg-01M6376MMP6GM9RSNTEF3S08PT. Shared-universe scope: Shadowfall and Hinterland are the two published Myrillia novels
  found in author-wide, publisher and bibliographic checks; planned God Sword and further drafts are not published books.
  No connected eligible novel found in the separate Alasea or Moon Fall worlds. Living gods, their bodily Graces and domains,
  their murder and conspiracy organize both novels across Tylar, Dart, Kathryn and further viewpoints. Not simply a disgraced
  knight and his changing office. Epic divine-world conflict rather than intimate sword adventure, Gothic menace, single heroic
  class, governing journey, statecraft or military unit. Hard fantasy is the strongest rival because Graces have rules, but
  technical rule-solving does not govern the story. Invented mythology rather than beings from real traditions; gods act,
  scheme and are murdered on-page, not a remote Mythlike past. Sources: https://jamesclemens.com/books/ ; https://www.penguinrandomhouse.com/series/AYP/godslayer/
  ; https://isfdb.org/cgi-bin/ea.cgi?James_Clemens= ; https://fantasybookcritic.blogspot.com/2013/08/a-paean-to-myrillia-godslayer.html
  ; https://fantasybookcritic.blogspot.com/2019/12/the-moon-fall-series-spotlight-q-with.html . Existing two-book list and
  bibliographic metadata unchanged.'

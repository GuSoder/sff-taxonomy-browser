placement_rationale: '# The Inheritance Trilogy whole-fiction correction - 2026-11-06

  Dynastic magic10->9; Invented godhood4->5. Split trigger cancelled rather than dividing a first-volume-only misplacement.
  One connected fiction: three novels2010/2010/2011 and the already included novella The Awakened Kingdom2014 retained, not
  silently deleted or counted as a novel. No extra short-story collection added.


  ## Every constituent''s own engine

  The Hundred Thousand Kingdoms: Yeine is summoned as an Arameri heir after her mother''s death; dynastic struggle at Sky
  conceals divine war, slavery and revenge. Enslaved Nahadoth/Sieh and Enefa''s remnant within Yeine drive events; ending
  transforms her from mortal to divine and frees gods. Dynastic magic is genuinely strong for this volume, not dismissed.

  The Broken Kingdoms: ten years later blind artist Oree shelters Shiny/Itempas, a punished god in exile, and investigates
  murdered godlings. His arrogance, guilt, intimacy and recognition of harm govern the divine emotional arc; Oree''s demon
  blood is lethal to gods. No court succession contest dominates. Strange Horizons completedreview explicitly calls it Itempas''s
  redemption and charts divine/human power imbalance.

  The Kingdom of Gods: divine child Sieh narrates his unexpected aging/mortality after bonding with Arameri twins Shahar/Dekarta.
  His divine nature conflicts with maturation, responsibility and intimacy; family grievances and reconciliation with Itempas
  meet Maelstrom-scale crisis and a transformed divine order. Political Arameri legacy remains substantial, but experiencing
  divine existence is sustained subject, not occasional god-viewpoint.

  The Awakened Kingdom: newborn godling Shill narrates attempts to inherit Sieh''s role, discovers her own affinity/purpose,
  learns what gods owe fragile mortals, and meets Darren man Eino''s gendered constraints. Author explicitly novella, completed
  SkiffyFanty review closely analyzes godhood learning and changing narrator voice. Already present fourth volume retained
  as novella.


  ## Actual root walk

  Speculative -> Fantasy (literal invented gods/soul/divine creation); Fantasy realms (invented HundredThousandKingdoms/Sky/Shadow,
  no real-Earth setting or Earth-crossing portal frame). Seven realm branches: Epic passes realized world empire, cosmology
  and creation; Sword&Sorcery intimate combat not governing; fairytale no identifiable inherited tale or deliberate invented
  fairy-tale mechanics; FarShores not chiefly counterpart culture aboutness; Gothic real darkness/enslavement but not dread/haunting
  register whole; Comic not governing parody/absurdity, despite Shill humor; Heart fantasy romance is a substantial rival
  but gods'' identities/natures/power across all four exceed romantic bond as single organizing spine, not cozy/horse.

  Epic: Mythological fantasy passes sustained invented cosmology and gods'' own stories. Political fantasy very strong firstbook
  and Arameri aftermath third, but not second/novella court engine; individual-grant correction does not deny politics. HighFantasy
  governing quest journey fails. Heroic-class narrative fails divine/mortal ensemble and identity subject. Military armies/ranks
  fails; HardFantasy rational-consistent magic as subject fails divine personhood/cosmology focus.

  Mythological -> Invented mythology (original Three/godlings, not real-tradition Mythic power struggle). Invented mythology
  -> Invented gods (on-page beings act and narrate; Mythlike past fails merely inherited distant lore). Invented gods -> Invented
  godhood: sustained divine consciousness, identity, duties, limits and learning across Sieh/Shill and Itempas/Yeine transformations.
  Invented worship real rival Oree and mortal dealings with gods, but existing gate explicitly gives sustained experience
  of divinity priority when both substantial. No gate widened, no newleaf, no structure changed. Whole-fiction aboutness replaces
  stale firstbook-only placement.



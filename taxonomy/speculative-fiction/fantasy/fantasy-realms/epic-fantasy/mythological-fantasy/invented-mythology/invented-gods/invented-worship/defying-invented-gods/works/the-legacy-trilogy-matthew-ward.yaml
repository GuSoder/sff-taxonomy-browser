placement_rationale: '# Legacy / Soulfire whole-fiction walk, 25 November 2026


  ## Scope correction

  Six novels: Legacy of Ash (2019), Legacy of Steel (2020), Legacy of Light (2021), The Darkness Before Them (2023), The Fire
  Within Them (2024), The Lie That Binds Them (2025). Keep the existing fiction ID stable; display title Legacy / Soulfire.
  These are connected realms in one invented cosmology, not two unrelated fictions. No additional card. The earlier Legacy-only
  note''s separate-universe inference was wrong: a different world does not mean a different universe.


  Evidence: the fetched Fable Fire Within Them page includes a reader explicitly identifying the Legacy shared-universe revelation
  and Calenne Trelan''s return. A different reader''s detailed final-volume synopsis on Goodreads describes Kat and Tanith
  crossing from Khalad to the Old Realm, explicitly the earlier works'' setting. The independent Lily Cafe final-volume review
  notes the older-trilogy reference, while also warning that its reviewer cannot fully recall it. The latter alone would not
  prove the link, but corroborates the two explicit accounts. Creator interviews explain deliberately consistent mist cosmology
  and gods forming both worlds'' basis; they distinguish the settings, not their universes. No creator statement explicitly
  denying connection found. This is triangulated reader evidence, not a claimed primary-text confirmation. Novellas, collections,
  game tie-ins and the same-world short stories The Game and The Tribute remain excluded.


  ## Whole-fiction evidence

  Legacy''s Tressian/Hadari wars, council disputes and generational damage are central, not discarded. Author recaps and completed
  criticism also establish Raven, Jack, Ashana, Malatriant, divine bargains, revenants and the Reckoning. Calenne''s death
  and attempted return, Rosa''s divine transformation, and Viktor''s pursuit of forbidden power bind mortal action to gods''
  demands. The military shelf was reasonable for the isolated first trilogy, but the connected fiction must be judged anew.


  Soulfire starts with Kat''s failed heist and rebellion but does not remain a caper. The creator describes personal agency
  versus a path laid out long before her birth. Book two follows the sisters'' origins and illnesses, the cult of Nyssa''s
  lost face, Rima''s dead kingdom, the Eternity King''s experimental designs and a released god. The final book sets rebellion
  against Tzal''s Eternity Queen, with the mist-prison, engineered divine-soul population and failed escape to the Old Realm
  central to the stakes. The ending joins Kat and Azra into a new Nyssa to restrain Tzal and preserve Khalad. The detailed
  final synopsis supports these ending details; the independent Lily Cafe review corroborates possession, the search beyond
  the Veil, the sisters'' relationship and late revelation of the world''s history. Do not reduce the whole to a king being
  killed or to a thief''s class.


  ## Root-down comparison

  Speculative fiction: actual souls, gods, resurrection, possession and spirit magic. Fantasy over SF: no evidence naturalizes
  these literal powers. Fantasy children all tested: Fantasy realms wins invented Aradane/Khalad and their divine realms.
  Real earth fantasy fails no Earth anchor. Portal fantasy fails its explicit Earth requirement; crossings among invented
  realms do not qualify.


  Fantasy realms children all tested: Epic fantasy wins the broad ensemble, states, wars, invented cosmology and divine stakes
  across both trilogies. Sword and sorcery has a real caper/action rival in the first Soulfire volume, but not an intimate
  adventure shape governing all six. Fairytale fantasy lacks deliberate tale revision or fairy-tale quest grammar. Gothic
  realms is the strongest ancestor rival for mist, undead powers, confinement and soul machinery: Technomancy fits Khalad''s
  engineering but not the human wars and divine choices throughout Aradane; Isolationist fantasy fits Khalad''s prison but
  not Aradane''s open multi-polity geography; Godforsaken realms names a real dark-power threat but the books chiefly pursue
  agency, social power, war and divine relations rather than sustained Gothic dread. Far shores fantasy fails cultural aboutness:
  Khalad''s mixed Middle-Eastern details are trappings, not the governing comparative-culture subject. Comic fantasy realms
  fails governing comedy. Heart fantasy fails a bond-as-whole-fiction spine: Kat/Azra and the sisters matter deeply but do
  not make Legacy''s entire cast a romance, cozy community or horse-bond fiction.


  Epic children all tested: Mythological fantasy wins the invented divine order and people''s freedom, service, resistance
  and survival within it. Military fantasy is the strongest rival: Army > World-at-war was convincing for the first three;
  Soulfire''s war spans the kingdom but much of its governing action is origin, curse, religion, captivity, possession and
  preservation of souls rather than field campaigns. Soldier and Command-tent narrow further. The existing War of humanity
  no longer names the whole when Khalad''s people are revealed as the imprisoned god''s soul and its war is escape/resistance
  to him. War of immortals is a serious alternative but still turns the fiction into a war-of-powers invitation instead of
  the broader human-facing relation to the invented order. Political fantasy is also substantial: Court intrigue, Revolutionary
  (Overthrow/Regicide/Proletariat, Rebel/Evil empire, Insurgent, Messianic, Outlaw and Emancipation), Election, Magic politics
  and Geopolitical all considered. They each select one contingent political operation or regime. Neither a single ruling
  throne, mass franchise, class revolt, imperial resistance, insider subversion, marked political leader, rescue network,
  emancipation mechanism, public regulation of magic nor state balance encompasses the two complete trilogies. Heroic fantasy
  fails one protagonist/class governing six ensemble novels. High fantasy''s Classic/Revisionist quest distinction selects
  journeys and escape threads, not the whole''s form. Hard fantasy fails magic-rule inquiry as primary reader experience,
  even though spirit engineering is carefully built.


  Mythological children: Invented mythology wins wholly made-up gods, spiritual histories and creation. Mythic power struggle
  fails gods from real-world traditions. Invented mythology children: Invented gods wins acting, speaking, bargaining and
  possessing divine characters whose actions turn both plots; Mythlike past fails primarily inherited/backdrop mythology because
  gods repeatedly intervene and are fought. Invented gods children: Invented worship wins the human-facing relationship with
  divine order, including refusal/resistance and search. Invented godhood is a genuine sibling rival: Rosa''s transformation,
  divine viewpoints, Tzal''s nature and Kat/Azra''s final emergence are important. But sustained experience of divine existence
  is not the overarching subject across all six: most viewpoints struggle with divine powers and their claims rather than
  living a god''s consciousness/duties/limits as the continuing story. Final apotheosis alone does not meet that priority
  test.


  Placement: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy > Invented mythology > Invented
  gods > Invented worship. War of humanity returns 8 to 7. Invented worship grows 9 to 10. No new node, definition change
  or structural action. Intake freezes at ten and a split proposal is owed immediately. Six books remain one fiction under
  the owner''s shared-universe instruction; three Soulfire books added, not another fiction.



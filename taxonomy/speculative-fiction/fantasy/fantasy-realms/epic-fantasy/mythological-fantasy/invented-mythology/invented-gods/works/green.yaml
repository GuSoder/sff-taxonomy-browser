placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Mythological fantasy
  > Invented mythology > Invented gods. Whole3novel fiction, not an assassin label shortcut. Green: sold as a child
  and trained as courtesan/assassin, she kills the Immortal Duke, confronts the God of Pain and creates the ox god
  Endurance. Endurance: rival gods claim her unborn child, godslayers threaten the deities, and the god she birthed
  struggles into existence. Kalimpura: gods from both cities claim her and her twins; she returns to rescue two
  hostages from the usurped Lily temple, receives Blackblood''s knives and calls supernatural aid to survive. The
  active invented pantheon, god creation and divine claims govern her autonomy throughout, rather than distant myth
  as backdrop. Rejected SF/Portal/Real-earth: invented secondary world and actual gods, not Earth history or a journey
  from Earth. At Fantasy realms, the epic divine system outweighs action-forward Sword and Sorcery; not comic, fairy-tale,
  Gothic dread or bond-first Heart fantasy. Far shores (South Asian-like Selistan and European Copper Downs) is
  real setting texture, but autonomy against divine/temple claims is the established engine and the about-ness rule
  sends it elsewhere. Within Epic: Heroic competes strongly (assassin training and sacred service), but her class
  is not invariant power source: blade, god-making, unwilling conduit and motherhood all matter. Assassin heroes
  would overstate contract/guild killing as the whole-fiction spine; Cleric hero would make accepted sacred service
  primary when she resists competing gods'' claims. Political/revolutionary stakes matter but not institutional
  rule as the trilogy engine; no campaign-service Military story, hard-magic law or inherited quest dominates. Mythological
  > Invented mythology: the pantheon is authored, not real-world beings; Invented gods rather than Mythlike past
  because gods act on-page and are created, hunted and fought. Wobble moderate: extremely personal first-person
  life story, not a gods-only cast, but the leaf requires gods as active plot actors, not sole narrators. All3volume
  plots independently checked; no definition widening. Years2009/2011/2013, not later paperback dates. Expansion:
  Our Lady of the Islands(2014), co-written Shannon Page, is explicitly in Green world (author, publisher, SFE,
  PW). Sian receives unwanted divine healing power, male physician-priests pursue her, a dead god stirs and an unwanted
  divine mission links her with Arian. Same-fiction expansion retains active-gods engine, original hero and leaf;
  not claimed part of the numbered trilogy. No published sequel found on coauthor publication list as checked2026-10-28.'

definition: Invented worship centered on people's struggle for agency against the claims, demands or domination of active
  invented gods. Defiance can mean refusing a divine assignment, exposing a religious order, escaping possession, restraining
  a god or overthrowing divine rule. It does not require killing every god, rejecting all faith or refusing to protect a god.
  The governing undertaking is freedom from divine claims, rather than a journey to recover divine presence, power or relics.

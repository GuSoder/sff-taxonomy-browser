placement_rationale: 'Larissa Ione''s Lords of Deliverance (Eternal Rider 2011, Immortal Rider 2011; a spinoff of the Demonica
  series; author site, Hachette): the Four Horsemen of the Apocalypse live as immortals in the modern world; in Eternal Rider
  the Horseman Ares fights his own brother''s plotting and the prophecy of Doomsday, in Immortal Rider the Horsewoman Limos,
  marked as Satan''s bride, makes a deal with the devil to save the soldier Arik Wagner from hell. Walk: Fantasy realms >
  Epic fantasy > Mythological fantasy > Mythic power struggle (Horsemen, Satan and demons from real tradition locked in personal,
  long-running struggles; the war is offstage and the story is the beings). Weak wobble: the setting is modern Earth with
  a hidden demon world, so the real-earth Paranormal fantasy side was tried, but nothing there is about the mythic beings
  themselves; Mythic power struggle already holds Earth-set angel and demon books. Sources: larissaione.com, Hachette; not
  read. Alternative: Paranormal bureau (the R-XR army unit is incidental).'

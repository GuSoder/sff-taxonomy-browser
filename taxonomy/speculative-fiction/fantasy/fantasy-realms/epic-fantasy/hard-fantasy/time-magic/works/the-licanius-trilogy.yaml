placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy
  > Time magic. In Andarra the Gifted channel Essence under the Four Tenets, but the trilogy''s spine is
  the Augurs'' time power: precognition, Davian''s transport into the past and his training under Malshash,
  and Caeden''s centuries of past lives rewinding toward the sword Licanius (Wikipedia, The Shadow of What
  Was Lost). Rejected: Channeled hard magic (Essence is rule-bound and drawn from a Reserve, but time is
  the load-bearing domain), the High fantasy quest leaves (the quest frame is not the engine). Wobble:
  moderate - the first book leans on the Essence school system before the Augur plot takes over. One fiction:
  The Shadow of What Was Lost 2014 (self-published; Orbit 2016), An Echo of Things to Come 2017, The Light
  of All That Falls 2019 (Wikipedia, James Islington).'

placement_rationale: 'Murdered at the palace steps, Mingshin begs the gods to turn back time and wakes two years earlier;
  the Divine Stone that rewound her life is the series'' load-bearing magic - she uses it to change the world''s timeline
  in book one and the Night Dragon hunts it to remake the world in book two, inside a Chinese-mythology-inspired court contest
  for the throne (katechenli.com; Kirkus: ''Thanks to the time-traveling powers of the Divine Stone...''). Walk: Fantasy (real
  magic, invented kingdom of Dazhou) > Fantasy realms > Epic fantasy > Hard fantasy > Time magic (rewritten pasts; the time
  magic is load-bearing, not a passing device). One universe, one card (rule 11j); two novels 2023-2025, series continuing
  (Kirkus: ending ''strongly hints at a sequel''). Source: author site and Kirkus; not read.'

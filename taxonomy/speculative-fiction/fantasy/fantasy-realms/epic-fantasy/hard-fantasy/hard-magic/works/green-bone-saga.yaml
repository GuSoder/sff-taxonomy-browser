placement_rationale: >-
  SFE identifies the Green Bone Saga as a complex family fantasy, while Orbit describes jade as a magical substance that grants defined enhanced abilities, traditionally controlled by trained Green Bone warriors and later broadened through a drug. Its explicit resource, users, access rules and political consequences make Hard magic the closest leaf.

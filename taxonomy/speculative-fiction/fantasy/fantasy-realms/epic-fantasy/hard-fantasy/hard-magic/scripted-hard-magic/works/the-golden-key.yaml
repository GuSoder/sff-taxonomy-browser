placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy >
  Hard magic > Scripted hard magic. Two published novels, The Golden Key1996 and same-world prequel The Diviner2011,
  one fiction. Imagined Tira Virte/Tza''ab/Rimmal Madar are counterpart cultures, not actual historical Earth or
  an Earth portal crossing. The political history, generations, geography and internally realized magical inheritance
  pass the broad Epic worldbuilding gate. Hard fantasy is positively supported by Catherine Asaro''s SF Site review:
  scrupulous system, rigorous genetic inheritance/cost and consistent spacetime consequences; this is a critic''s
  analysis, not a claim that literal magic is scientific fact. Hard magic: inheritance, sterility/early death, learned
  symbolic craft and misuse/discovery govern both books. Scripted: Grijalva painted iconography and formula-like
  symbolism alter reality, while the Shagara prequel traces protective charms/symbols into Qamar''s codified magical
  language and book. Art is symbolic inscription here, not any painting automatically qualifying as script. No bound-being
  pact or external force drawn through the body makes Bonded/Channeled a better mechanism. Time magic is a genuine
  rival because Saavedra''s painted captivity produces time dilation; it fails the whole-fiction domain test, since
  protection/healing, dynastic manipulation and the prequel''s magical origins extend beyond time. Political > Court
  intrigue > Dynastic magic is a strong genuine rival, with ducal bloodlines, the Grijalvas'' influence and Alessid''s
  magical nation-building. The two-book invariant is discovering, inheriting and misusing the symbolic magic rather
  than a continuing contest for one ruling line. This judgment is independent of Dynastic magic''s9count; no preference
  for avoiding a split. Courtly statecraft likewise is not the whole plot, and revolutionary challenge arrives late
  rather than governing both books. Heroic mage-class is less exact than system development across generations and
  multiple protagonists. Far shores/Khayal does not hold the whole Iberian/Mediterranean plus desert sequence, and
  the culture is the stage for the magic/family engine. Gothic imprisonment/obsession and tragic romance are real
  in Golden Key, not a consistent prequel menace or romance spine. Not action-forward S&S, inherited fairytale revision,
  comic/cozy/horse-bond story. Moderate classification confidence; based on full publisher summaries and detailed
  reviews, not full novel reading. No definition changes.'

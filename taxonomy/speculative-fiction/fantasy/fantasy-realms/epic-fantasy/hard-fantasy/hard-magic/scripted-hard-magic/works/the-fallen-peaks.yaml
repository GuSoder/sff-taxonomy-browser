placement_status: accepted
placement_rationale: 'Whole currently published Fallen Peaks fiction, MC06166/MC06167, 2026-11-22: one eligible novel, The
  Dollmakers2024. Author confirms Fallen Peaks as the shared-world series name in Campfire, and explicitly connects the forthcoming
  Breeze Felt at Moonrise in the October2026 Inscape interview. DAW/Astra currently gives March9 2027 for Breeze, a future
  Tuesday verified by calculation; it is not added. Master Coen''s Apprentice is expressly a prequel novella, not a second
  novel; unnamed2028 book and further manuscripts are also excluded. Literal animated dolls and Marks, not engineered robots
  or scientific explanation, make Fantasy rather than Science fiction. Fantasy > Fantasy realms: the country called One, Pearl,
  Web and the Shod inhabit an independently invented world, not our historical, contemporary or future Earth, and no Earth
  crossing is established. All realm children considered: Sword and sorcery loses because this is not an action-forward rogue/warrior
  adventure; the author calls it adventure fantasy, but completed reviews explicitly say the book is largely character, craft
  and dialogue, with one major late battle. Fairytale fantasy is a genuine tonal wobble (Ghibli and Andersen influences),
  but no particular inherited tale is being retold. Gothic realms is not established by creepy dolls alone; neither an inherited
  haunted house nor Gothic terror is the organizing plot. Far shores lacks an identified counterpart historical culture; Comic
  is not the governing mode. Heart fantasy: not a horse story, romantic relationship is secondary, and Cozy craft is a genuine
  superficial fit for dollmaking but fails the warm/low-intensity ancestor: the Shod slaughter people, Shean endangers Web
  and the major conflict is a violent disaster, not safety and comfort. Epic fantasy passes this tree''s broad worldbuilding
  gate through a country-scale system of licensed dollmakers, Marks as the infrastructure of its society, travel across One,
  and the world''s existential Shod threat. This is not a claim of a Tolkien-scale war epic: the author describes adventure,
  and completed reviews stress a relatively small stage. Within Epic, Political and Military fail (no governance or military
  campaign is the governing engine), Mythological fails (not inherited sacred myth). High fantasy is a genuine journey rival
  and Heroic > Caster > Mage > Grey wizard is a genuine learned-craft rival: Shean learns dollmaking rather than inheriting
  a blood gift. Hard fantasy/Hard magic is more exact because the inscribed mechanism, what a Breath Mark does, how doll construction
  constrains function, and discovery/application of the same Mark to the threat organize the plot and resolution. This is
  not inference from the author having studied with Sanderson. Campfire has the author specify the symbol as the final animating
  step, Realm of Reads explains symbols drawn on objects with specific effects, and Novel Notions identifies the Breath Mark
  and broader system as the central worldbuilding. The negative Every Book a Doorway completed review and AllBookedUp synopsis
  independently support the climax using the same Breath Mark on the Shod; the latter explicitly says it was written from
  memory, so it is corroboration, not a sole authority. The system has unexplained history and undiscovered Marks; no complete
  physics or numerical mana budget is asserted. Hard magic > Scripted hard magic passes: written/drawn symbols act on the
  constructed bodies. Bonded hard magic loses: no spirit/elemental bond supplies the governing power, despite emotional bonds
  with sentient dolls. Channeled loses: no force drawn through the maker''s body is established as the mechanism. Scripted
  is the existing honest leaf; no new doll/construct genre, no definition changed. Confidence moderate-to-high, with small-scale/character-arc
  and partially unexplained-system wobbles kept explicit. Scripted hard magic6to7, no tenth-card gate.'

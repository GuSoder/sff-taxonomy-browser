placement_rationale: 'Root-down walk: an invented-world wizard story, so Fantasy realms; Epic fantasy; Hard fantasy; Hard
  magic; Scripted hard magic (rule-bound power that is written and acts on the world when set down correctly). Sources: Macmillan
  (Nicodemus Weal is an aspiring wizard who works magic via written words; he is cacographic, a curse makes him misspell his
  spells, and even a small misspelling can have dangerous results; he was thought to be the Halcyon, a prophesied savior who
  would prevent the apocalyptic Disjunction, but some fear he will cause it; murder accusations and demonic plots) and Google
  Books/HarperCollins (a cacographer unable to reproduce even simple magical texts without a deadly ''misspelling''; two wizards
  closest to him are found dead and factions want to bend him to their will). The magic is text that must be written exactly
  right and the hero''s flaw is the mistake in the writing, so Scripted hard magic, not Channeled or Bonded; Hidden-heir quest
  fantasy (prophesied savior) was considered, but the spelling rule is the engine of the plot. Wobble: Destiny quest fantasy
  leaves the prophecy higher and the magic system lower than I read it. Years: Spellwright 2010, Spellbound 2011 (queue and
  Google Books), Spellbreaker 23 Aug 2016 (Kirkus).'

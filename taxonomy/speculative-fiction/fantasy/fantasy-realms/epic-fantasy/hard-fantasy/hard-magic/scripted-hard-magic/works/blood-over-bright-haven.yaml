id: blood-over-bright-haven
title: Blood Over Bright Haven
authors:
- M. L. Wang
first_published: 2023
canonical_genre: scripted-hard-magic
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy > Hard magic > Scripted
  hard magic.

  Root: literal magical mapping/siphoning and life conversion govern the story. The coded presentation does not supply a naturalistic
  scientific explanation or make the novel SF; author and publisher identify a standalone fantasy. Author explicitly makes
  the hard, cost-based magic system the trope under examination. Fantasy setting: invented Tiran, its Kwen outsiders and the
  supposedly separate Otherrealm, not our Earth. Western gaslamp is an aesthetic chosen after the premise, not proof of historical
  Earth. Real earth fantasy fails, including both Period and Alternate history; Portal fantasy fails its actual-Earth ancestor
  even though maps and portals reveal another realm.

  Full Fantasy realms sibling walk: Epic fantasy passes the broad worldbuilding gate through a whole industrial city''s political
  economy and the systematic magic that underwrites its prosperity, founding religious ideology and lethal outside Blight.
  Not a claim of a globe-spanning quest epic. Sword and Sorcery fails the action/adventure-first gate; the author explicitly
  chose a non-action scholar and describes library all-nighters, research and argument. Magitech is a substantial furniture
  rival because machines and civic infrastructure use magic, but it inherits that adventure-forward gate; steam itself is
  not the defining mechanism. Fairytale fantasy has neither recognizable tale revision nor original fairy-tale grammar as
  its engine. Gothic realms is a genuine rival: sealed Tiran, cruel academia and body horror are present. Isolationist fantasy
  is less precise because the inquiry follows an exploitative mechanism linking inside and outside, with prologue and epilogue
  beyond the wall; enclosure is a lie being technically exposed rather than the whole ritualized world. Technomancy''s necromancy-as-engineering
  gate is not supplied by killing the living for fuel; no dead/ghost machinery is established. Fantasy mystery''s investigator
  branches do not fit a magical researcher uncovering a conspiracy through her academic work rather than an official case,
  hired gumshoe or ghost witness. Godforsaken/Haunted/Hungry do not improve the fit: the cited causal source is programmed
  siphoning, not a dark god, ghost or living predator. Far shores fails the non-Western-counterpart/about-ness gate; the author
  expressly chose Western aesthetics. Comic fails governing comedy; Heart fails a romantic, comfort/community or horse-bond
  spine. Sciona and Thomil''s uncomfortable partnership reflects institutional oppression, per the author; it is not evidence
  that the novel belongs in Romantasy.

  Epic alternatives: Heroic > Caster > Mage > Black Mages > Siphon mage is a real rival because Sciona''s spells drain living
  things. It is not rejected because her art is morally bad: art, not morality, is that branch''s rule. System research, hidden
  energy costs, mapping algorithms and the final redirection of the same mechanism govern more exactly than a caster-class
  adventure. Political fantasy is also a real rival. Revolutionary > Overthrow > Proletariat catches the uprising/underclass;
  Emancipation catches the Kwen''s freedom; neither makes the entire earlier research/discovery engine into an organized mass
  movement or a born slave''s freedom quest. The climax damages the order, but no complete successful new regime is asserted.
  Magic politics is not just magic existing in a hierarchy: its public-regulation contest is less exact than uncovering how
  magic works and what it costs. Court/election/geopolitical/military branches fail their governing succession, franchise,
  state-balance or campaign engines. High fantasy''s consequential travel is not supplied by a largely academic/city story
  and the outsider''s migration frame. Mythological fantasy is a faith/ideology rival, but the main inquiry is the material
  truth of rule-bound magic beneath the sanctioned story, not lived divine experience or a mythic age. Invented worship''s9count
  does not govern this rejection; a religion or disbelief by itself is insufficient to replace the system-discovery engine
  with a mythological-register story.

  Hard fantasy positively passes: trained research, precise coordinates, mapping and siphoning on a spellograph form an explicit,
  learnable system whose unacknowledged cost becomes the discovery and moral crisis. The author confirms coding influence
  and specifically identifies cost-based hard magic as her central trope; Novel Notions explains mapping/siphoning in detail,
  and even dissenting PW/Typedwriter readers describe the sustained technical explanation. Rules are not absent because the
  true cost is initially concealed. Hard magic > Scripted: spells are typed/coded into a machine; correct formulas/maps act
  on the world, and the later revelation and final spell use that same system. Bonded loses: no bound spirit/elemental/person
  bond is the mechanism. Channeled loses: the governing operation is coded external mapping/siphoning, not world-force conducted
  through the caster''s body and limited by bodily tolerance. Time magic loses: no governing loop, historical revision or
  time journey.

  Decision: one published standalone novel, first2023, in the existing Scripted hard magic leaf7->8. No new node/definition/image,
  no shared-world consolidation with The Sword of Kaigen. Moderate-to-high confidence; Siphon mage, Magitech, Isolationist,
  Proletariat and Emancipation remain real rivals, not erased themes.'
whole_fiction_content: 'Sciona wins entry to the High Magistry, then works with Kwen assistant Thomil on magical mapping.
  Their spellograph research exposes the supposedly otherworldly source as living people and land outside Tiran: the city''s
  prosperity and Blight are the same life-extraction mechanism. Her attempt to reveal this fuels revolt; she ultimately turns
  siphoning on the knowingly complicit ruling mages at her own death. The remaining outsider viewpoints leave the city. This
  includes the ending, not just the university-entry blurb; no complete democratic settlement or specific casualty count is
  asserted.'
classification_confidence: Moderate-to-high. Direct coding and cost-based-system author evidence and completed mechanics/ending
  sources make Scripted a positive fit. Political emancipation, a draining caster art, magitech and the enclosed city are
  substantial rivals. Classification is a whole-book judgment from primary accounts and completed reviews, not a claim to
  have read the full novel.

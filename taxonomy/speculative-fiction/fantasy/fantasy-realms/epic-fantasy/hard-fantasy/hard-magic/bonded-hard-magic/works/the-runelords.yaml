placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy > Hard magic
  > Bonded hard magic. The magic is a rule-bound system of "giving an endowment": bodily attributes such as brawn, grace and
  wit are transferred from one person or animal to another, and lords who take many endowments become Runelords (Wikipedia,
  The Runelords); Macmillan: sorcerers draw the attributes from one person and grant them to another. The system is the terms
  of the transfer between giver and lord, its costs and its limits: Bonded hard magic. Soft placement: the leaf''s other cards
  bind spirits, elementals or animals, while here the bound parties are people (donors) and the power sits in the lord''s
  body, which is also Channeled hard magic territory; I chose Bonded for the donor-to-lord bond. The Runelords Series ebundle
  (MC02329) is skipped as an omnibus. Sources: Wikipedia and Macmillan series page, not the novels.'

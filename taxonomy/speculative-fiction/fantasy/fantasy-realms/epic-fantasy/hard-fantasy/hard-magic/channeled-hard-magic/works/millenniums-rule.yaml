placement_rationale: '# Millennium''s Rule whole-fiction root correction, 6 November 2026


  Required Worldhopper frozen-member interrogation, not a corpus sweep. One shared fiction, all four published novels retained
  unchanged: Thief''s Magic (2014), Angel of Storms (2015), Successor''s Promise (2017), Maker''s Curse (2020).


  Rootwalk: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy > Hard magic > Channeled hard magic.


  Fantasy rather than SF: science-like handling of magic does not turn it into a physical scientific engine. Canavan''s explicit
  premise is magic, sorcerers, magic creation and magical world-crossings. Portal''s EARTH ancestor fails: primary book-one
  interview calls this a new universe; author essay explicitly describes her invented worlds, Leratia''s postindustrial empire
  and Fyre''s desert city. All four official synopses and completed-series review give invented worlds, not actual Earth.
  The old gateway rationale skipped that ancestor. No claim of full-text proof that the word Earth never appears; the positive
  evidence supports an invented-universe setting.


  Fantasy realms: no governing Earth setting, fairy-tale revision, inherited author school, far-shore culture, comedy or bond-as-spine.
  Epic scale: interworld domination, magical depletion, wars, machines and the rebuilding/restoration of worlds. Not intimate
  sword-and-sorcery or one hero''s class adventure. Political power matters but the sustained load-bearing engine is the magic
  resource itself: who can draw it, who creates it, depletion and replenishment, inventions that spend it, immortality and
  its price. This supports Hard fantasy, not a generic quest, divine worship or court-politics shelf.


  Hard magic: official volume1 gives magic-powered industry and depletion; volume2 prohibited mechanical magic and the Raen''s
  imposed controls; volume3 machines overrunning and draining worlds and immortality; volume4 Rielle''s restoration and Tyen''s
  attempts to neutralize war machines. Newtown''s completed-four-book review follows those mechanisms and consequences across
  the whole sequence, with further consciousness-copy and creation costs. Not Time magic, written/code magic or spirit-bond
  terms. Vella''s enchanted book is not the source of Tyen and Rielle''s spell power: treating the whole fiction as Scripted
  or Bonded because of one companion would confuse an object with the engine.


  Channeled: Strange Horizons describes practitioners drawing magic from the surrounding air, leaving soot/stain; the official
  volume3 excerpt directly shows Tyen drawing ambient magic from above a city, shield formation, depletion range and return
  to the surroundings, with the cost to weaker sorcerers. Reach/capacity and bodily vulnerability are explicit; the crossing
  costs breath, and the excerpt contrasts ordinary and ageless bodily needs. This is a drawn-resource magic system, not an
  inscribed-command or spirit-bond system. Do not invent a universal exhaustion threshold absent from the read sources.


  Fictions/books stay 2774/6581, genres850. Worldhopper10->9, Channeled hard magic9->10. The Worldhopper split trigger is
  withdrawn before a proposal was served. Channeled hard magic now freezes at ten for mandatory whole-fiction split research.
  Intake remains paused before MC05055.



placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy > Hard magic
  > Channeled hard magic. One trilogy in one world (the Rojan Dizon series, Orbit; ISFDB series, Feb, Jun and Dec 2013), so
  one fiction (rule 11j). Per Kirkus, Library Journal and Reactor: in the vertical city of Mahala, Rojan Dizon is a pain mage,
  and pain magic, drawn from the body''s suffering and limited by what he can bear, is the city''s motive power and the cost
  the whole series turns on (the Ministry outlawed it for the cleaner ''Glow''). The rule-bound power run through the user''s
  body is the Channeled hard magic definition. Rejected: Private-eye fantasy (Fade to Black opens as a find-the-missing job,
  but books two and three are city crisis and siege), Army fantasy, Gothic Dark realms. Wobble: Private-eye fantasy for book
  one.'

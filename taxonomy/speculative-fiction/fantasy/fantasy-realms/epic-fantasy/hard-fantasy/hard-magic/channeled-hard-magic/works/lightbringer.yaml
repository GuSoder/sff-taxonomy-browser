placement_rationale: 'Root-down walk: invented world (the Seven Satrapies), so Fantasy realms; Epic fantasy; Hard fantasy;
  Hard magic; Channeled hard magic (force drawn from the world and run through the user''s body, limited by what the body
  can bear). Source: Wikipedia The Black Prism (2010; first of five Lightbringer books): chromaturgy, where drafters take
  light into solid ''luxin'' in seven colours; the Prism can split white light and draft all colours; a drafter who keeps
  drafting builds luxin residue in the eyes (''breaking the halo''), goes mad and turns into a wight; the plot is the False
  Prism''s War between the Guile brothers Gavin and Dazen, the Chromeria''s theocratic politics and Gavin''s discovery of
  his son Kip. The magic has a fixed rule set and a bodily limit that the plot keeps using, so Channeled hard magic. Folded:
  The Blinding Knife, The Broken Eye, The Blood Mirror, The Burning White as later volumes. Wobble: the politics (Chromeria,
  brother against brother) is large; cousins are Dynastic wars and Dynastic magic, but the magic''s rules are the series''
  signature. Only the book-one Wikipedia article was read in full. Year 2010.'

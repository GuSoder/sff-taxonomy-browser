placement_rationale: 'Source-read walk, root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Epic fantasy -> Hard
  fantasy -> Hard magic -> Channeled hard magic. L. E. Modesitt Jr.''s Saga of Recluce (Tor, 1991 to 2026; Wikipedia, ''Saga
  of Recluce''): all matter carries order and chaos, in balance by default; a rare mage pulls one force out of the surroundings
  and runs it through the body, white wizards chaos into flame, black mages order into strength. The rules and costs are explicit
  and are the story: chaos channelled through the body shortens a wizard''s life, and order carelessly drawn drains the mage
  of what sustains them. That is the Channeled hard magic definition (a force drawn from the world and run through the user''s
  body, limited by what the body can bear). Tried: Bonded hard magic (no bound being; the forces are impersonal), Scripted
  hard magic (nothing is written or coded), Hard SF and Lost colony planetary romance (the ancestors were marooned from another
  universe, but that is backstory glimpsed in Fall of Angels), Epic fantasy leaves like Mage hero (twelve protagonists across
  ten eras, so the system, not one mage''s career, is the through-line). Wobble low. 26 novels folded as one fiction (11j),
  publication order, years from the Wikipedia table (queue years are reissue dates). Skipped: Recluce Tales (collection) and
  six Saga of Recluce omnibus volumes. Jacket: The Magic of Recluce (Tor).'

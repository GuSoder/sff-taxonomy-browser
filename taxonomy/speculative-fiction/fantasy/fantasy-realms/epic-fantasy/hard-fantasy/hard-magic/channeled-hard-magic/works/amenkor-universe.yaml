placement_rationale: '# Amenkor universe, MC04970-04971, 2026-11-06


  Place the whole nine-novel shared universe in existing Channeled hard magic, 8 to 9. No definition change, seed or split.
  Three trilogies, one fiction: Throne of Amenkor (The Skewed Throne2006, The Cracked Throne2006, The Vacant Throne2008);
  Well of Sorrows (Well of Sorrows2010, Leaves of Flame2012, Breath of Heaven2016); Ley (Shattering the Ley2014, Threading
  the Needle2016, Reaping the Aurora2017). Queue2015 for Well/Leaves describes the digital reissues, not originals. The first
  two Well novels originally used Benjamin Tate, the same author; current print reissues credit Joshua Palmatier. One author,
  no duplicate attribution as two people.


  ## Scope evidence and limits


  The author''s2017 finished-Ley interview explicitly says all three previous series were connected, in the same world at
  different times. His2012 guest essay independently places Amenkor and Well on the same mapped world and ties both through
  the White Fire and an unpublished ancestral novel. The unpublished novel is not a tenth volume. A current agent bibliography
  lists all three completed trilogies. Crystal Cities is not silently included: the author says his next series is a new world,
  new characters, different from the preceding three. Current bibliography names Crystal Cities separately. No later published
  Amenkor-world sequel found. Anthologies edited by the author, Ur-Bar, collections and omnibuses are not extra novels in
  this fiction.


  ## Every trilogy''s own engine


  Amenkor: White Fire twice causes madness and ruin. Varis''s danger-sensitive river sight helps her survive the slums, become
  an assassin and overthrow the Mistress. In Cracked she controls the soul-filled throne while managing famine, treachery
  and an impending Chorl invasion. Its founding souls and accumulated rulers form a magical reservoir, with costs and constraints
  on mastery. In Vacant, the throne''s power has been sacrificed against the invasion; Varis attempts to heal Erick, learns
  the Chorl''s linked magic, seeks the sister throne in Venitte and faces political distrust and another attack. The past
  is told through a founding soul''s memories and visions; do not turn that into literal bodily time travel. Politics and
  statecraft are substantive, but the magical river/throne and how to wield/control/share its power are structural throughout.


  Well: Colin''s refugee caravan encounters rival peoples and life-eating shadows. Drinking Lifeblood changes his nature,
  lifespan and powers, including stopping/slowing time with an addictive personal cost. Decades pass in the narrative, not
  automatically time travel. Leaves takes place a century after the peace he brokered: three of five magics mastered, protective
  Trees gifted to the three races, wells reopened by the enemy, and the Source controlling the network becomes the central
  danger. Breath starts with the Autumn Tree fallen, the Source activated, a wounded Colin and armies of Wraiths. He must
  surrender himself to the Lifeblood to stop Walter and the Wraiths, at the cost of his humanity. This is a multi-magic network
  with learnable consequences and personal transformation, not just the first book''s frontier journey. Third-volume publisher
  synopsis and primary completed-trilogy scope verified; no substantial independent finished Breath review located, a material
  thinner point preserved rather than claiming the novel was read.


  Ley: author describes natural magical energy connecting nodes/rock formations, augmented by Wielders and routed to heat,
  light, transport and build cities. Its abuse shatters the network. Shattering follows Kara''s training, Allan''s suppression
  ability, baronial monopoly and terrorists until catastrophe. Threading follows refugees'' survival, rebuilding attempts
  and rival gangs/cults; frozen-in-time distortion shards and their healing are real consequences of the magical network.
  Reaping follows the Needle, Kara''s attempt to heal Tumbor with all Wielders, Morrell''s healing of people/structures/crystals,
  attacks and internal rebellion; it resolves the technical/magical-system crisis as well as political conflict. Full primary
  descriptions of all three, author explanation of their world-specific engine, Kirkus and SFRevu finished reviews read. Not
  inferred from the Well trilogy''s continuity.


  ## Root-down walk


  Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy > Hard magic > Channeled hard magic.


  Actual Lifeblood, souls in thrones, White Fire, Wraiths and ley are presented as magic. A reviewer calls Ley science fictional,
  and Kirkus says its magic obeys scientifically testable principles; neither makes this SF rather than fantasy. The author
  explicitly says it is an invented fantasy world with a modern feel. Geographic analogies to colonial America or New York
  do not make it Earth. Neither Real earth fantasy nor Portal fantasy is supported. Immortality, time slowing and in-world
  distortions remain magic-side and are tested below, not routed to Atemporal SF.


  Fantasy realms siblings: Epic positively carries multiple civilizations, centuries, large geographies, magic networks and
  world-scale consequences. Sword and Sorcery''s intimate action celebration underdescribes the system and civic stakes. Fairytale
  has no controlling revision or invented fairy-tale grammar; Far shores is not primarily counterpart-culture exploration.
  Comic fails governing joke; Heart has relationships but not romantic/community/horse bond as spine. Gothic realms is strong
  in Amenkor''s haunted throne, White Fire madness and Well''s wraith forest; however whole-fiction action focuses on mastering,
  balancing and repairing power through civic and world-scale conflict, not dread/enclosure. Technomancy is a genuine Ley
  rival because it powers cities, but the Gothic necromantic-machinery gate would overread only Amenkor''s soul throne and
  the horrific distortions. The explicit quasi-natural force laws and bodily limits provide a cleaner whole-universe Hard
  fantasy fit than menace machinery.


  Epic siblings: Heroic classes are individually present (Varis assassin/mage, Colin transformed caster, Kara Wielder, Allan
  guard), but no one class describes all protagonists or their common problem as well as the magical systems. High fantasy''s
  fellowship/marked-one journeys govern only parts; its quest tradition is not the whole shared-universe engine. Political
  fantasy is the strongest rival: Varis''s statecraft, racial empires/peace and the baron''s monopoly/terrorists. Yet no one
  political child (court legitimacy, statecraft or organized overthrow) governs all three, while managing and paying for the
  same world''s magic networks does. Military has wars but not rank/unit/campaign as whole spine. Mythological has invented
  spirits but not their mythic-being narrative. Hard fantasy is positively grounded in source-tapped force, magic''s flows
  and networks, their stabilization, costs and bodily consequences, rather than inferred merely because the author teaches
  mathematics.


  Hard fantasy children: Time magic is tested seriously. Colin''s stop/slow powers and Ley''s frozen distortion shards are
  load-bearing in their respective narratives. But loops, rewritten pasts and journeys through history do not organize the
  entire nine-novel fiction. They are domains/effects within wider Lifeblood/ley/river systems, not the whole fiction''s principal
  magical domain. Amenkor''s ancestral visions/memory are not assumed historical traversal. Magic-side time does not have
  SF''s any-element override. Hard magic is the more inclusive positive mechanism, not a way to disregard temporal consequences.
  The whole-fiction judgment is moderate, and a verified history-rewrite engine across the trilogy would change the comparison.
  No such evidence found.


  Hard magic children: Channeled is positive for tapping Lifeblood, the magical river and ley force through human bodies,
  with change, exhaustion, madness or loss of humanity as limits/costs, and collective/channel-amplifying systems. Bonded
  is a serious Amenkor rival because the throne holds souls, but the whole universe''s source is not chiefly a personal pact
  or spirit bound to each caster. Colin''s Lifeblood and Kara''s ley are not such bonds. Scripted fails written/coded sigils
  or commands as common operative mechanism; mathematical author biography is not evidence of spell formulae. Existing Channeled
  leaf accepts ninth fiction. No need to invent an infrastructure-magic seed or change a gate.


  Confidence moderate-high for Hard fantasy/Channeled, with meaningful political, time-domain and thin Breath-review caveats
  retained. No full novels read. Evidence covers every book''s official engine plus independent completed reviews in each
  of Amenkor and Ley, two Well finished reviews and official final-volume synopsis. One universe is never split by trilogy
  or volume to get cleaner shelves.


  '

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Hard fantasy > Hard magic
  > Channeled hard magic. The Cloudmaster and his stormlords keep the land alive with their power over water and rain, but
  the Cloudmaster is dying with no stormlord heir; Shale, a village lad found with the power, is kidnapped and made a tool
  in a struggle between warring factions, because whoever commands a stormlord commands the water of a nation, while Terelle,
  a runaway apprentice to a painter on water, is caught in a painted future (author''s site, glendalarke.com, synopsis of
  The Last Stormlord, Aurealis shortlist). The trilogy (The Last Stormlord, Stormlord Rising, Stormlord''s Exile; published
  2009 to 2011, the last two added to the card as the rest of the series) is one fiction under rule 11j. The power is a force
  drawn from the world and run through the body of its user, limited by what he can bear, which is the leaf''s definition.
  Rejected: Bonded hard magic (no spirit or bond), Scripted hard magic (not written or coded), Dynastic magic (the power is
  not the ruling line''s weapon). Wobble: moderate; I read only the book one synopsis, and the books are as much a political
  fight over water as a magic system, so Political fantasy leaves are neighbours. The Watergivers is the Australian series
  title.'

genre_grounding: >-
  SFE crowley_john: The Aegypt Cycle (Aegypt 1987 vt The Solitudes
  2007; Love & Sleep 1994; Daemonomania 2000; Endless Things 2007)
  "examines Renaissance neoplatonism with hallucinated concentration";
  John Dee's hegiras hint at "a transubstantiation of the last years
  of the sixteenth century" and a possible "saltatory shift into
  another Story of the world". A fantasy that reweaves documented
  history (Dee, Bruno, Hermeticism) with a hidden magical truth -
  the secret-history leaf definition (EoF-attested label).

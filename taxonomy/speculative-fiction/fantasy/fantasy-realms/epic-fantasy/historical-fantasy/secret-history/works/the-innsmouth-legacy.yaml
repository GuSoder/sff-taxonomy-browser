placement_rationale: >-
  SFE identifies a near-future Innsmouth Legacy in which the US government interned Innsmouth's hidden People of the Water; Tor places Winter Tide and Deep Roots in 1940s America as Aphra recovers her secretly persecuted community. Lovecraft's monsters become a concealed historical people whose erasure and recovery drive the sequence, making Secret history closest.

definition: Fantasy of the interwar era (roughly 1918-1939), named for the period's Art Deco aesthetic - magic and the uncanny moving through the modern twenties and thirties. Fenced from Gaslight fantasy (the long 19th century ends before WWI) and from Urban fantasy (contemporary settings). Created 2026-09-20 on Gustav's ruling.
status: accepted

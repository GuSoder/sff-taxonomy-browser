placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Antique times fantasy ->
  Andalusian fantasy. Harper Voyager explicitly calls it evocative of medieval Spain: Al-Rassan’s Asharite empire has splintered into warring city-states while a
  northern Jaddite leader and an Asharite poet-diplomat meet under divided loyalties. The invented setting is rooted in the cultures, courts and conflicts of Al-Andalus.'

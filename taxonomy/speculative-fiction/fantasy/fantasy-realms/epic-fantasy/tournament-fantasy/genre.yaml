definition: 'Epic fantasy whose governing narrative is a formal contest in an invented world: a hunt, tourney, trials or deadly
  games with rules, rivals, a prize and a deadline, where the story is the competing and the alliances and betrayals it breeds.
  Not Quest fantasy (there a consequential journey is the spine), not Military fantasy (war, not sport), not Political fantasy
  (the struggle is for rule, not a prize).'

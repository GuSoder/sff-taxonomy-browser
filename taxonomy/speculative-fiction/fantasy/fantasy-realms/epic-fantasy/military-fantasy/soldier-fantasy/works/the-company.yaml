canonical_genre: soldier-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Military fantasy > Soldier fantasy. Five war veterans, one fighting
  unit followed from the inside: after the war they buy an island colony together,
  and the company - the title puns on the military unit and the business venture -
  is the story from first page to last, their old unit bonds and fractures driving
  everything the island uncovers. The Soldier fantasy gate (one fighting unit
  followed from the inside; the unit is the story) fits. Rejected: Mud and blood
  (no whole war or campaign is fought on the page - the war is backstory), Army
  fantasy leaves (no ranks-war), Settler/colony leaves (the colony is the stage;
  the veteran unit is the fiction''s identity). Wobble disclosed: the campaigning
  is past and the page story is a post-war venture; the unit-of-veterans engine
  governs under the whole-fiction rule. Tenth card: leaf frozen for split
  examination on placement.'

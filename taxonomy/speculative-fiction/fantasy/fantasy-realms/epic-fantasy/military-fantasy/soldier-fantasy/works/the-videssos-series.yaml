placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Soldier
  fantasy. Turtledove''s Videssos books are set in one invented world (Wikipedia: the Videssos fictional universe), so one
  card (rule 11j) for the queue''s volumes: The Misplaced Legion (1987), where a Roman legion is thrown by a sword-touch magic
  into the Byzantine-like empire of Videssos and hired as mercenaries, and its sequels, followed by the Tale of Krispos (Krispos
  Rising, Krispos of Videssos, Krispos the Emperor), a peasant''s rise to the Videssian throne (Wikipedia, Videssos cycle).
  The Legion books follow one fighting unit and its tribune, Marcus Scaurus, through a war with Yezd, a civil war and a mercenary
  revolt; the unit is the story, the leaf''s definition. Rejected: Command-tent and Mud-and-blood fantasy (not the whole war,
  the legion is a unit), Court statecraft (Videssos is rife with intrigue and the Krispos books are about winning a throne,
  but the cycle that opens the world is the legion), Portal fantasy (the legion crosses once, early, and the story stays in
  Videssos). Wobble: moderate to high. Wikipedia only, no text read. The Krispos volumes (the peasant who becomes emperor)
  sit closer to Court statecraft or Destiny quest than to a fighting unit, and the Time of Troubles books are not in the queue.
  If he wants the series split by sub-series, this card is the first to re-walk. The queue omnibus entries (Videssos Cycle
  Volumes One and Two, The Tale of Krispos) are not separate cards; they duplicate the volumes here. Years: Open Library first
  publication (1987, 1991, 1991, 1994); queue years are 2008 to 2013 reissues. Queue ids MC03760, MC03753, MC03752, MC03754
  (omnibus MC03799, MC03800, MC03786 folded).'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Soldier
  fantasy. Lynx and the Cards, a company of hard-drinking mercenaries and fallen soldiers in the gunpowder-and-magic Riven
  Kingdom, take a job in the powder-keg Mage Islands (Knight of Stars), and as war between the Militant Orders looms in God
  of Night the fate of the continent rests on a gamble only a bunch of drunken lunatics will take (Hachette series and book
  pages; Stranger of Tempest, ISFDB title 2005126, Gollancz 2016). Four novels (Stranger of Tempest, Princess of Blood, Knight
  of Stars, God of Night) are one fiction under rule 11j. One fighting unit followed from the inside, which is the leaf''s
  definition. Rejected: War fantasy (the unit is the story, not the whole war), Warrior hero (the Cards are many), Caper fantasy
  (jobs and scrapes, but the war frame takes over by the last book), Pulp S&S (the Black Company line is the neighbour, but
  the register is gunpowder epic). Wobble: low to moderate; I read only publisher summaries. Years follow the UK first editions
  (2016, 2017, 2019, 2020). Hachette also lists two side titles, The Man With One Name and Honour Under Moonlight, which are
  not in the queue and are left off the card.'

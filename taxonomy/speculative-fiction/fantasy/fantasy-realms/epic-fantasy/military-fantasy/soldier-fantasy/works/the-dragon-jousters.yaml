placement_rationale: 'Lackey''s Dragon Jousters (Joust 2003, Alta 2004, Sanctuary 2005, Aerie 2006; Wikipedia, mercedeslackey.com):
  in a pre-dynastic Egypt-like world the neighboring countries Alta and Tia fight with dragon-riding Jousters, their most
  powerful weapon. Vetch, a slave boy who tends dragons, becomes a Jouster (later Kiron) and the books follow him through
  the war and its aftermath. Walk: Fantasy > Fantasy realms > Epic fantasy > Military fantasy (organized around armies and
  war) > Soldier fantasy (one fighting unit followed from the inside, the dragon corps named in the leaf''s own definition,
  as in Dragonmaster). Rejected: Army fantasy leaves (the front and the whole war are not the viewpoint; the Jousters are),
  Warrior hero (the dragon corps, not one fighter''s armed power), Beast master hero (the bond is with a war dragon in a corps,
  but the corps and the war are the story; the bonded-mount core is Valdemar''s Companions), Dynastic intrigue leaves (the
  war is the engine, not succession). One series is one fiction (11j): the four novels are one arc. Wobble moderate: Sanctuary
  and Aerie move away from the front toward Kiron''s duties and the dragons'' sanctuary, so Beast master hero is the alternative
  reading. Years from Wikipedia first-publication list.'

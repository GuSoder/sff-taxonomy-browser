placement_rationale: 'Fresh walk 2026-09-26 after his catch (''There is no high fantasy in the taxonomy'', phonemsg-01M3E602HS8GR5S68R84EWR14P): the earlier ''reclassified to High Fantasy'' note was stale - the old high-fantasy node had been relabeled Quest fantasy and the move never happened. Against the real tree: civil-revolution fails by def (foreign war against Mugen, not internal rebellion); military fantasy fits - armies, campaigns, soldiers and war seen from the ranks: Sinegard academy, the Cike, the Mugen front. Shelfmates Malazan, Siege trilogy.'


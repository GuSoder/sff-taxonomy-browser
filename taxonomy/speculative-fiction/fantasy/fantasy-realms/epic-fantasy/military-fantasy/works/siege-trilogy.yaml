placement_rationale: >-
  Root-down: Orbit/PW place the trilogy in an invented Roman-like fantasy empire and organize all three books around the siege, defending and ruling the City, and finally a war to end all wars. That passes Fantasy -> Fantasy Realms -> Epic fantasy -> Military fantasy: armies, campaigns, siegecraft and war seen through engineers, civilians and pragmatic participants rather than a quest or magic system.

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy
  > Command-tent fantasy. A fantasy-world replay of the American Civil War: King Avram of Detina and his cousin''s secession
  open a war of armies, generals and strategy over three novels, the last confirmed by ISFDB and Wikipedia as Advance and
  Retreat (ISFDB series 12386; Wikipedia). The war is the story and the commanders and their maps carry it, the leaf''s definition.
  Rejected: Mud-and-blood fantasy (the generals and kings carry it, not the ranks), World-at-war fantasy (one front and one
  war, not a tapestry of worlds). Wobble: low; Turtledove''s Darkness, already in this leaf, is the same mode. Sources: ISFDB,
  Wikipedia, Goodreads. Years: 2000, 2001, 2002.'

placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy > Command-tent
  fantasy. Turtledove''s Opening of the World trilogy (Beyond the Gap 2007, The Breath of God 2008, The Golden Shrine 2009),
  one invented world (Raumsdalia, an Iron Age empire with Pleistocene beasts): a gap opens in the glacier that bounded the
  world, Count Hamnet Thyssen, the adventurer Ulric Skakki and the Bizogot jarl Trasamund explore beyond it, meet the Rulers
  (mammoth cavalry, long bows, wizards) who then rout them and invade, and Hamnet rallies shamans, nomads and refugees and
  leads the army against the Rulers, with the cannibal shaman Marcovefa as his one counter to their magic (Wikipedia on the
  series and Beyond the Gap; Publishers Weekly on The Breath of God and The Golden Shrine; Open Road Media blurbs). Rejected:
  Soldier fantasy (not one fighting unit but the empire''s whole war), World-at-war fantasy (one front against one enemy,
  a short viewpoint list, not a tapestry of fronts), Mud-and-blood (told from counts, jarls and the emperor''s court, not
  the ranks), Warrior hero (the book is an army''s war, not one fighter''s power), Quest fantasy (the Golden Shrine quest
  is a thread, the war is the engine), Court statecraft (the court is a stop between campaigns). Same author and shape as
  Darkness in this leaf: a commander''s war against an invader, with magic. Wobble: moderate. The first volume is exploration
  before it is war, I read blurbs and review summaries, not the books, and the leaf''s other cards are about maps and strategy
  more than a wizard duel. PW calls the setting ''a parallel Bronze Age'' while the series is plainly an invented world, so
  no alternate-history branch. Years: 2007, 2008, 2009 first publication. Queue ids MC03727, MC03775, MC03781.'

placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy.
  A six-book reimagining of the Second World War in an invented world, nicknamed ''World War II with dragons'', where magic
  does the work of technology and the covers bill each book as a novel of world war and magic (Wikipedia, Darkness series;
  Into the Darkness). Armies, fronts and campaigns of a whole war are the story, the leaf''s definition. Rejected: WWII fantasy
  (the war is invented, not the historical one), Soldier fantasy (no single unit carries the books). Wobble: moderate; the
  secondary-world setting also fits Alternate-history leaves loosely. Sources: Wikipedia. Years: 1999 to 2004. Split walk
  2026-10-09 (phonemsg-01M4FVHVPC3MQ5DWP32Z6QAXC3): Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy
  > Military fantasy > Army fantasy > Command-tent fantasy. WWII with dragons: the fronts and the campaigns are the story
  and it is told across the commanders'' maps, a real war''s strategy replayed.'

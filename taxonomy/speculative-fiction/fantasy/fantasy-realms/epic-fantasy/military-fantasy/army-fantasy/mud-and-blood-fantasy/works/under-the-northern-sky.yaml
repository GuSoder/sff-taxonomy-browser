placement_rationale: 'Leo Carew''s Under the Northern Sky: the long-lived, hard northern Anakim under Roper face a southern
  army led by the general Bellamus, and the war itself, its campaigns, battles and sieges, is the story. Walked root-down:
  Epic fantasy -> Military fantasy -> Army fantasy (the whole war, not one unit). Later volumes fold onto this fiction. Split
  walk 2026-10-09 (phonemsg-01M4FVHVPC3MQ5DWP32Z6QAXC3): Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic
  fantasy > Military fantasy > Army fantasy > Mud-and-blood fantasy. The Anakim''s war with the southern army, followed through
  the fighters who take its battles and sieges. WEAK CARD: Roper and Bellamus are commanders too.'

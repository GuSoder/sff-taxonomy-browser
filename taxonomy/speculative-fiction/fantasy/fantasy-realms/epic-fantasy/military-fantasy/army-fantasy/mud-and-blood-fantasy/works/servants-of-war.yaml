placement_rationale: 'Larry Correia and Steve Diamond''s Servants of War (Baen, 2022; Baen blurb and Elitist Book Reviews),
  first of the Age of Ravens: the war between Almacia and the Empire of Kolakolvia is in its hundredth year, and Illarion
  Glaskov, torn from a quiet life on the empire''s fringe when his village is struck, is conscripted into the Tsarist army
  and sent to The Wall, an elite regiment that pilots armor made from the husks of dead golems, in a trench war the blurb
  calls horror in the trenches. Walk: Fantasy > Epic fantasy > Military fantasy > Army fantasy > Mud and blood fantasy (the
  war as the conscripts in the line live it). Tried: Soldier fantasy (one unit followed from inside, and at nine) and Technofantasy
  (the golem armor is war equipment, not the engine). Wobble: Soldier fantasy is the alternative leaf since the regiment is
  elite; I did not read the text.'

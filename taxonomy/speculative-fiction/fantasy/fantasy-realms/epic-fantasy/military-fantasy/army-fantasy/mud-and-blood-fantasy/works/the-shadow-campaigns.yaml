placement_rationale: 'Root-down: speculative-fiction > fantasy > fantasy-realms > epic-fantasy > military-fantasy > army-fantasy
  > mud-and-blood-fantasy. Invented-world musket-age fantasy: Captain Marcus d''Ivoire''s colonial garrison of the Vordanai
  empire is upended by rebellion, a demoralized force clinging to a desert fortress, ''the thunder of muskets and the clang
  of steel'' with a subtle sinister magic underneath (djangowexler.com author copy, Ace). The campaign is lived by the soldiers
  and company officers in the line - the leaf''s remit; not Command-tent even though General Janus''s strategy is a major
  thread (the POV anchors are Marcus and ranker Winter Ihernglass). Not Alt-flintlock: Vordan is an invented world, not rewritten
  history. Five novels 2013-2018 (OL first-publication years). Years are first publication.'

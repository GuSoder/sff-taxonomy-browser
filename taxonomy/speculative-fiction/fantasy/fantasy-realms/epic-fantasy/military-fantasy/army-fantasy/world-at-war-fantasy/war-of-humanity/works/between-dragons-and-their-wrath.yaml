placement_rationale: 'Root-down: Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy
  > World-at-war fantasy. Per the jamreads review and Hachette: in the old kingdom of Paicha, long ago
  split by conquest into city states, three threads run as war sweeps the land - Tesha, a glassblower''s
  apprentice made a false tribute bride to sabotage the Reacher''s court; Naili, a laundress marked by
  an alchemist''s plant magic, joining the city underworld; Ashadi, a dragon rider hunting the monsters
  of the Iipao Sands - with those who would reunite the shattered realm by force moving behind them. Many
  viewpoints and threads woven into one war: the leaf''s definition. Rejected: Palace insurgents and Dynastic
  spy games (each fits only the bride thread, one of three), Soldier fantasy (only the dragon-rider thread),
  Hard magic (the alchemy is one thread, not the engine). Soft: the war is newly sweeping in book 1 and
  the stage is one land rather than many continents. One card; book 1 of The Shattered Kingdom (Orbit,
  Aug 2024); book 2 unreleased. Cover carries a one-line blurb; no clean edition found.'

id: books-of-the-shaper
title: Books of the Shaper
authors:
- John R. Fultz
first_published: 2012
canonical_genre: war-of-immortals
placement_status: accepted
placement_rationale: 'Whole-fiction root-down walk 2026-11-05: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Military fantasy > Army fantasy > World-at-war fantasy > War of immortals. Complete three-novel
  Books of the Shaper per author interview and ISFDB: Seven Princes2012, Seven Kings2013, Seven Sorcerers2013. Early
  io9 claim of four books and some anticipated2014 dates lose to author self-contained trilogy statement, actual
  bibliography and contemporary December10 2013 on-sale report. Princes follows Dzan after the deathless sorcerer
  Elhathym murders his father/court: regaining the throne entangles six other princes, Ianthe and world-scale sorcerous
  conquest. Kings advances eight years, breaks the old heroes'' alliances and introduces runaway slave Tong, the
  underground Sydathians, rival twin kings and Vireon''s demonic family threat as an approaching greater invasion
  comes into view. Sorcerers gathers Men and Giants, southern war fleets and Iardu/Sharadza''s quest to awaken Old
  Breed allies against Zyung''s aerial armada and sorcerer legion. Publisher copy and separate independent reviews
  of all3 establish these changing engines, rather than carrying Princes traits forward by assumption. Real magic
  is decisive: author explicitly rejects a scientific system and describes blood/shadow necromancy, will-driven
  reshaping, silent ancient language and cosmic beings diminishing into mortal forms. No scientific rationalization,
  real-Earth history/counterpart culture or Earth portal. Fantasy realms > Epic over Sword and sorcery because many
  kingdoms, rulers, sorcerers, armies and histories organize the sustained conflict, not one personal adventure;
  author accepts both labels, and pulp adventure pace remains a real overlap. No governing comedy, bond/romance,
  fairytale revision, Gothic enclosure or cultural heritage retelling. Within Epic, Heroic does not have one classed
  warrior or mage hero; Sharadza''s training and Dzan''s rise are threads in an ensemble. Hard fantasy fails author''s
  explicit mystery-of-sorcery account despite one reviewer calling the system practical. High/Classic quest and
  Invented mythology are strong alternatives: the final book contains a sorcerers'' recruitment journey, and cosmic
  beings with long histories directly act; nonetheless the trilogy''s spine is the succession of open kingdom wars,
  conquest and defense, not a party''s road, marked one''s becoming, faith or sustained divine existence. Political
  fantasy catches royal blood, thrones and intrigue, but wars and magical destruction, not governance or one court,
  decide outcomes. Military > Army over Soldier: not one soldier life or unit. World-at-war over ranks/command-tent:
  many simultaneous countries, viewpoints and supernatural threads, not a single march or command post. War of immortals4
  over War of humanity: deathless Elhathym, Ianthe and Old Breed actors shape the first struggle, and immortal godlike
  Zyung''s world conquest opposed by Iardu''s awakened Old Breed gives the final war its scale. The accepted leaf
  explicitly includes godlike powers/deathless empires against ordinary humankind, so mortal princes and giants
  as prominent actors do not defeat it. War on humanity is wrong because domination and enslavement, not exterminating
  humanity, is at stake; Eldritch invasions wrong because the enemies and powers are of this world, despite some
  realm-crossing quest scenes. Wobble substantial: family heirs, personal revenge, sorceress apprenticeship and
  the final recruitment quest receive major attention; the war-world framework and deathless powers'' contests win
  whole-fiction aboutness. Author title Shaper is not proof of a uniform magic school; his interview explicitly
  corrects that idea. No definition changed. All three distinct English Orbit print jackets separately inspected
  and localized.'

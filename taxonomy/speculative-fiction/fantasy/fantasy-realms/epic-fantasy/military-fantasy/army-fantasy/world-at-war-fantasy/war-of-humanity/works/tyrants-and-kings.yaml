id: tyrants-and-kings
title: Tyrants and Kings
authors:
- John Marco
first_published: 1999
canonical_genre: war-of-humanity
placement_status: accepted
placement_rationale: 'Whole-fiction root-down walk 2026-11-05: Speculative fiction > Fantasy > Fantasy realms >
  Epic fantasy > Military fantasy > Army fantasy > World-at-war fantasy > War of humanity. All three Tyrants and
  Kings novels form one fiction: The Jackal of Nar (1999), The Grand Design (2000), The Saints of the Sword (2001),
  per publisher series page and contemporary Locus records. In Jackal, imperial Nar invades Lucel-Lor, war machines
  face the Triin leader''s magic, and commander/prince Richius changes sides amid love and conflicting loyalties.
  In Grand Design, Nar''s civil war, Biagio''s attempt to regain power, technological escalation, kidnapping, revenge
  and naval warfare spread the story across factions and viewpoints. In Saints, reformed Emperor Biagio faces usurpation,
  Alazrian must unite former enemies into an army, and Aramoor''s war resolves the opening struggle while Richius
  becomes a secondary figure. The author explicitly distinguishes the volumes'' themes of war, revenge and a new
  third-book theme, and says he expanded away from Richius toward Nar''s wider cast. This is a war-world tapestry
  rather than simply the first novel''s warrior class. Fantasy wins over SF: actual destructive, healing and god-linked
  magic is integral; industrial war technology does not supply a science-fiction explanation. Independent Nar/Lucel-Lor
  defeats real-Earth historical fantasy and Earth-origin Portal fantasy. Invented-world Epic wins over Sword and
  sorcery/Technofantasy: machines matter greatly, but wars, rival powers and many characters across countries organize
  the whole rather than machinery-led intimate adventure. No governing Gothic dread, comedy, fairy-tale revision,
  cultural counterpart study, romance/community/horse bond. Within Epic, Heroic is a strong alternative for Richius
  in vol1, but the next two novels deliberately shift to Biagio and multiple independent actors. High fantasy loses
  because no sustained quest/fellowship/chosen-one rise organizes the trilogy; mythology and hard magic are not
  the subject. Political fantasy/Martial statecraft is the strongest neighboring route: intrigue, civil legitimacy
  and ruler-level alliance making matter, especially volumes2/3. The corpus, however, sustains the ensemble consequences
  of imperial, civil and international war more than governance, finance or administration; Court spies would overread
  Biagio''s methods as the whole engine. Military > Army because the war crosses forces and theaters, not one inside-view
  squad. World-at-war rather than Mud-and-blood or Command-tent: commanders are prominent, but the fiction also
  follows families, captives, religious factions, navy, magical allies and personal revenge across the world, not
  only maps/strategy or rank soldiering. War of humanity rather than War on humanity, War of immortals or Eldritch
  invasions: mortal empires and peoples contest conquest, rule and survival; Triin magic and the emperor''s desire
  for immortality do not make this an undying-power war or human-annihilation invasion. The accepted definition
  allows inhuman threads alongside human political powers. Wobble substantial: Fantasy Cafe says Jackal is more
  about Richius than warfare, SFFWorld finds Grand Design more politically manipulative, and the author disclaims
  identical themes across volumes. The shared ensemble war setting and changing sides decide the whole-fiction shelf;
  no definition widened.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy
  > World-at-war fantasy. The Derai garrison the Wall of Night, the last barrier between the lands of Haarth and the all-devouring
  Darkswarm, fighting an unending war across worlds and time while internal strife eats at the nine Houses; the three novels
  follow Malian of Night through breach, exile and return (author site helenlowe.info; Gemmell Morningstar winner). A whole
  world''s long war carried by many threads is the leaf''s definition. Rejected: Mud-and-blood fantasy and Command-tent fantasy
  (no line of march, it is the world at war), Quest fantasy (Malian''s journey sits inside the war). Wobble: moderate; this
  is an heir-centred epic where the war is as much backdrop as story. Sources: helenlowe.info book pages. Years from Open
  Library first editions: 2010, 2012, 2016.'

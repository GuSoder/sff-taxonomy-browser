placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy
  > World-at-war fantasy. The Merdrun, a race blooded by thousands of years of war, gather on Cinnibar to invade Santhenar
  through the summon stone; when their portal fails they are stranded on the world and the allies get one chance to destroy
  them, through an alchemical quest, a mad invasion in untested sky ships and the biggest battle in the Histories (ian-irvine.com
  book pages for The Summon Stone and The Fatal Gate). A whole world''s war against void invaders carried by many threads
  is the leaf''s definition. Part of Irvine''s Three Worlds universe (Gates of Good and Evil, Santhenar); the Tainted Realm
  trilogy is a separate world and a separate card, not folded. Rejected: Mud-and-blood fantasy and Command-tent fantasy (the
  war is the world''s, not one line of march), Destiny quest fantasy (the alchemical quest sits inside the war). Wobble: moderate;
  Karan and Llian''s family story and the quest carry much of the weight, and the Three Worlds earlier series are not in the
  queue. Years from Open Library first editions: 2016, 2017.'

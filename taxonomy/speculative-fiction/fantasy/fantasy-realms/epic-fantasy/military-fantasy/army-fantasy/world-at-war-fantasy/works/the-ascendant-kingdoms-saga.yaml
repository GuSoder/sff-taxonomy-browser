placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy.
  Per the author''s series site: Blaine McFadden, a lord condemned for murder, is held in the penal colony of Velant until
  the supply ships stop; across the four books he and his band of convict heroes restore magic to the ruined kingdom of Donderath,
  then fight warlords, invaders and vengeful immortals for control of the continent, with his army the only thing between
  the kingdom and collapse. The war across the continent, from front to front, is the story: Army fantasy. Rejected: Soldier
  fantasy (one unit is not the story; the war and the kingdom are), Warrior hero (the army and campaigns, not the hero''s
  own prowess, carry it), Mage hero leaves (the magic is the stake, not the protagonist''s craft). Wobble: Ice Forged is a
  penal-colony survival book and the middle volumes read as a quest to restore magic, so Soldier fantasy is arguable. Four
  volumes folded as one fiction under the shared-universe rule. Years per ISFDB and Open Library: Ice Forged 2013, Reign of
  Ash 2014, War of Shadows 2015, Shadow and Flame 2016. Split walk 2026-10-09 (phonemsg-01M4FVHVPC3MQ5DWP32Z6QAXC3): Root-down:
  Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Military fantasy > Army fantasy > World-at-war fantasy.
  Convict heroes restore magic to a kingdom, then fight warlords, invaders and vengeance across it. WEAK CARD: the war is
  only part of the story.'

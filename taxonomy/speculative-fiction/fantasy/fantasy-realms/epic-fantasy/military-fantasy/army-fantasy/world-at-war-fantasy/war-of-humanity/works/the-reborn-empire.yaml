placement_rationale: 'Root-down: Fantasy > Fantasy realms (invented Kisia and Chiltae) > Epic fantasy > Military fantasy >
  Army fantasy > World-at-war fantasy > War of humanity. Per Hachette (shop.hachettebookgroup.com, We Ride the Storm): ''War
  built the Kisian Empire. War will tear it down. Seventeen years after rebels stormed the streets, factions divide'' - an
  empire faction-split and invaded, followed across several viewpoints (a princess, an assassin, a Levanti warrior) on two
  continents: the whole world''s tapestry, and the warring powers are human realms, so War of humanity. Per Hachette''s series
  page (hbglibrary.com), by the finale ''the fate of the world is decided when heroes and gods march into battle one last
  time''. Rejected: Vengeance war fantasy (personal vengeance is a thread, not the engine - contrast the same author''s Vengeance
  Trilogy, same world seventeen years earlier, which lives there), Overthrow/Revolutionary fantasy (the rebellion is backstory),
  War of immortals (the gods march only in the finale). Soft: the gods'' arrival at the end pulls toward immortals; the main
  war is human. One card; same world as The Vengeance Trilogy but a separate series per Hachette''s own series pages and ISFDB
  (The Reborn Empire, series record 50633). Years are first publication: 2018 (self-published original per ISFDB and devinmadson.com),
  2021, 2021, 2022 (Orbit).'

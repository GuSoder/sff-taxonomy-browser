placement_rationale: "Gwynne's whole Banished Lands universe (publisher-confirmed: Pan Macmillan's 'An introduction to John Gwynne's Banished Lands universe' groups both series in one world; Of Blood and Bone is 'set a century after the events of Wrath'; ISFDB 'The Faithful and the Fallen universe'): The Faithful and the Fallen - Malice (2012), Valour (2014), Ruin (2015), Wrath (2016); Of Blood and Bone - A Time of Dread (2018), A Time of Blood (2019), A Time of Courage (2020). WHOLE-FICTION ENGINE: the God-War between the immortal powers - the angelic Ben-Elim and the demonic Kadoshim of the fallen Asroth - fought across many fronts with human and giant allies, told as a multi-POV war tapestry in both series. The first quartet carries a strong destiny-quest thread (smith's son Corban rises as the prophesied Bright Star), but that engine does NOT continue: Fantasy Hive's A Time of Dread review explicitly praises the later trilogy for 'the lack of bloodline of destiny, foretold one or any prophecy' - its spine is the Ben-Elim's iron-fisted rule and the Kadoshim's return a century on, seen through trapper Drem, soldier Riv, hostage-prince Bleda and giant-hunter Sig. The constant across all seven books is immortal powers waging war - war-of-immortals' gate exactly ('undying races, godlike beings... against each other'), not eldritch-invasions (the Ben-Elim/Kadoshim are the world's established powers for generations, not an enemy newly come from outside). Tenants dark-moon and echoes-of-the-great-song are the same Gemmell-register god-touched war epics. Short works in the universe (The Heir Apparent 2019, Better to Live Than to Die 2015) excluded per standing orders. Queue rows MC04725-04729 are five individual volumes; first published 2012. Initially placed in calling-quest-fantasy on the first quartet's Bright Star thread; moved here the same day on the whole-fiction check."

placement_rationale: 'The Hundred, a land long at peace, is invaded by an army led by corrupt Guardians - the deathless, god-gifted
  lawgivers of the land''s own making; the murdered reeve Marit, risen by a Guardian''s cloak, must win other Guardians to
  her side while ordinary peoples across the Hundred bear the brutal war and its aftermath (Liz Bourke, Reactor ''Sleeps with
  Monsters'': ''the army invading the Hundred is led by other Guardians... It is up to Marit to recruit - to convert - Guardians
  to stop this corruption... Against a background of a WORLD AT WAR!''). Walk: Fantasy (real magic) > Fantasy realms > Epic
  fantasy > Military fantasy > Army fantasy > World-at-war fantasy (many fronts, many viewpoints, one long war) > War of immortals
  (godlike, deathless powers wage the war - Guardians against Guardians, with ordinary humankind caught in it; not War of
  humanity, the sides are not mortal; not Eldritch invasions, the Guardians are of the world). One universe, one card (rule
  11j); trilogy complete 2006-2009. Source: Reactor review; not read.'

placement_rationale: 'Root-down walk: invented world (the realm of Ascarlia and its enemy Nihlvar), so
  Fantasy realms; Epic fantasy, Military fantasy, Army fantasy. Sources (anthonyryan.net, Hachette US/UK
  pages): in A Tide of Black Steel the Sister Queens'' realm is threatened by longships of a cult of oath-breakers;
  the siblings Thera of the Blackspear and Felnir, a young scribe and a prisoner each take a thread; in
  Born of an Iron Storm the Sister Queens have fallen, the Nihlvarian plan has taken the capital Skar
  Magnol and the invaders turn on the port of Olversahl while Elvine plans resistance from inside the
  new government and Thera acts elsewhere; in Upon the Forge of Battle Thera is now a queen, Felnir has
  won a crown and forged a kingdom, and Sister Lore plots. The trilogy is one conquest and its aftermath
  followed through several viewpoints on separate fronts, so World-at-war fantasy, not Command-tent (it
  is not told from the commanders'' map), not Soldier fantasy (no single unit) and not Champion knights
  (no single fighter carries it). Wobble: the war is one realm''s invasion rather than a whole world,
  and the Norse flavour has no leaf of its own; the publisher calls it inspired by Norse mythology. Years:
  2024, 2025 (Hachette: on sale 26 Aug 2025), 2026 (published 25 Aug 2026 per the author''s site).'

placement_rationale: 'Kevin Hearne''s complete Seven Kennings trilogy (A Plague of Giants 2017, A Blight of Blackwings 2020,
  A Curse of Krakens 2024, Del Rey; kevinhearne.com confirms ''The Seven Kennings is Complete''). Giant clans cross the sea
  and fall upon the continent of Teldwen, razing cities; the human nations, each holding one kenning of magic, fight a war
  of survival across many fronts, told as a bard''s tapestry of spies, soldiers and seekers. Walk: Fantasy > Fantasy realms
  > Epic fantasy > Military fantasy > Army fantasy > World-at-war fantasy > War on humanity (the invasion threatens humankind''s
  survival and the whole world''s war is the story). Tried: War of humanity (the invaders are giants, not human powers), War
  of immortals (the giants are mortal), Eldritch invasions (the giants are of this world, not otherworldly). Wobble: the giants
  come for land and conquest as much as extermination, and the trilogy ends opening a door to a new world. Source: author
  site, publisher description, Fantastic Fiction.'

placement_rationale: >-
  Arnold and Harper describe a dark, twisted fairy tale built from the traditional prince-slays-dragon-and-rescues-damsel rite. Ama's recovered understanding overturns the assigned rescued-bride role and reveals the truth behind the kingdom's dragon-and-damsel legend. Rewriting that recognizable plot and its gender values is the engine, fitting Fairy-tale revision.

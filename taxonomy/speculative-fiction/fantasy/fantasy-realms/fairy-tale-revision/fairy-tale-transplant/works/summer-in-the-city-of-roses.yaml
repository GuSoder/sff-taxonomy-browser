first_published: 2021
canonical_genre: fairy-tale-transplant
placement_status: accepted
placement_rationale: >-
  Root-down: Soho and PRH explicitly call this early-1990s Portland novel inspired by Grimm's "Brother and Sister" and the Greek Iphigenia/Orestes complex. Sibling separation, the brother's fantastical transformation and reunion transpose that named fairy-tale armature into Portland punk life. The explicit relocated Grimm narrative makes Fairy-tale transplant closer than general Magic realism or Greek myth fantasy.

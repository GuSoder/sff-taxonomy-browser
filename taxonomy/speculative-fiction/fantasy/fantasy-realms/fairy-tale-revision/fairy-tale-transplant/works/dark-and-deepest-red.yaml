placement_rationale: McLemore calls it a deadly fairy tale linking Strasbourg's 1518
  dancing plague to a present-day pair of red shoes that fasten themselves to Rosella
  and force her to dance. The book explicitly pairs the forbidding magic of a fairy
  tale with a modern story, revising the inherited Red Shoes pattern through Romani
  family history, blame and survival. Fairy-tale revision is closest.

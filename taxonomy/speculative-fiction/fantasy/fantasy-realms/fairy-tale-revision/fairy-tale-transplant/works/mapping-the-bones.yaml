placement_rationale: Yolen describes the Holocaust novel as hung on the armature of
  Hansel and Gretel, mapping starvation, forest abandonment, the candy house, witch
  and oven into Chaim and Gittel’s story; Penguin Random House likewise calls it a
  Nazi labor-camp Hansel & Gretel tale. It deliberately rewrites a recognizable fairy
  tale through historical atrocity, making Fairy-tale revision exact.

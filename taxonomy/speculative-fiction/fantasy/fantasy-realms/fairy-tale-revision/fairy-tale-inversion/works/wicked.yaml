canonical_genre: fairy-tale-inversion
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Fairy-tale revision -> Fairy-tale inversion. Retells Baum''s
  Oz from the Wicked Witch of the West''s side, recasting her as an idealistic dissident against the Wizard''s totalitarian regime (NYT; LA Times); Kirkus
  calls it a magical telling of Oz before Dorothy. Perspective and moral alignment of a familiar fairy tale are reversed, and Oz has actual magic.'

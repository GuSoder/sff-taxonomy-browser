placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Comic fantasy realms. Circus acrobat Otto of
  Schlepsig impersonates the prince invited to rule the newly independent kingdom of Shqiperi, in a counterpart Europe of
  renamed nations (Albion, the Dual Monarchy, the Hassocki Empire) where wizards replace turn-of-the-century technology
  and dragons, vampires and sea serpents are ordinary hazards (Publishers Weekly review; SFCrowsnest review; Wikipedia).
  The invented world is the stage of the joke and the con-man romp is the governing engine, the leaf''s definition;
  siblings Discworld and Xanth. Rejected: Earthly comic fantasy branches (not our Earth: the map itself is renamed and
  magic is infrastructure), Alternate history fantasy (not a fork in our history but an invented counterpart world),
  Sword and sorcery (comedy governs, not action). Wobble: low to moderate; the Ruritanian frame sits close to alternate
  history, but the disguised map plus everyday magic makes it an invented realm. Years: first publication November 2005
  (ISFiC Press, Wikipedia); the queue''s 2007 is the Del Rey edition. Queue id MC03739.'

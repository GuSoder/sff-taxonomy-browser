placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Comic fantasy realms. Jack Heckel (Jack
  Heckel is the joint pen name of Harry Heckel and John Peck): Charming Tales, in the Kingdom of Royaume. Prince Charming''s
  one destiny was to slay the dragon and save the princess, but a farmer named Will Pickett did both and Charming had nothing
  to do with it (A Fairy-tale Ending, publisher blurb, which collects Once Upon a Rhyme and Happily Never After); the second
  book has King William Pickett and Lady Rapunzel dragged into a new dragon crisis (The Pitchfork of Destiny blurb, which
  pitches it beside Shrek, Xanth and Magic Kingdom for Sale). The fairy-tale kingdom is the stage of the joke, which is the
  leaf''s definition. Rejected: Fairytale villain, damsel and viewpoint inversion (the books are a fractured-tale comedy across
  many tales, not one tale told from the other side), Fairytale transplant (no relocation of one tale). Wobble: moderate;
  the cast is fairy-tale parody, so Fairytale fantasy could claim it. Years: Happily Never After 2014 and Pitchfork of Destiny
  2016 (FictionDB); A Fairy-tale Ending is the 2015 combined edition of Once Upon a Rhyme and Happily Never After, so it and
  Happily Never After are one card by rule 11j. Queue ids MC04061, MC04062, MC04066.'

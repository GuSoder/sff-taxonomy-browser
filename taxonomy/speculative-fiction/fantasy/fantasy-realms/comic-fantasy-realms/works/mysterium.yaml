placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Comic fantasy realms. Jack Heckel''s Mysterium
  Series: Avery Stewart, a grad student at Mysterium University, spent years as an undercover evil wizard in the enchanted
  world of Trelari, and is pulled back through interworld doors to keep the multiverse from unraveling (The Dark Lord, The
  Darker Lord, The Darkest Lord, publisher blurbs). The author''s own post says the novel parodies epic fantasy the way the
  Charming Tales parody fairy tales (harryheckel.com, 2016-10-22). The invented epic-fantasy world played for comedy is the
  leaf''s definition. Rejected: Portal fantasy leaves (the doors are the machinery, but comedy governs the book), Epic fantasy
  leaves (the genre is the target, not the vehicle). Wobble: moderate-high; the multiverse-door structure and the darker tone
  of books 2 and 3 pull away from pure comedy. Dates conflict across sources: The Dark Lord was released as an ebook on Nov
  1, 2016 per the author, Dec 27, 2016 on the author site and Jan 2017 on FictionDB; the Darker Lord is Sept 2018 on the author
  site (Jul 2018 FictionDB); the Darkest Lord is Feb 2019 on the author site (Jun 2018 FictionDB). I use 2016, 2018 and 2018
  (the earlier of the two sources in each case that I could not reconcile). Queue ids MC04063, MC04064, MC04065.'

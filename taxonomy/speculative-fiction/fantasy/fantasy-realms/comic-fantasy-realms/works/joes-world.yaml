placement_rationale: 'Root-down: Speculative fiction -> Fantasy (actual gods, sorcery and an underworld, not a scientific-engine
  disguise) -> Fantasy realms (invented Grotum and New Sfinctr, not recognizable Earth or a portal journey from Earth) ->
  Comic fantasy realms. Both novels use their invented world''s absurd institutions, pedantic wizardry, ethical assassin quandaries
  and satirical quests as the governing joke. Kirkus calls The Philosophical Strangler tongue-in-cheek; Publishers Weekly
  calls Forward the Mage a Joe''s World prequel of comic pleasure, intense satire and deliberately zany obstacles; BooksForABuck
  corroborates shared-world humorous adventure. Political revolution and sword-and-sorcery action occur, but comedy rather
  than either serious political power or swordsmanship governs the whole universe. Neither protagonist''s adventuring class
  nor cozy low stakes explains its violent satirical stories. One shared-universe fiction under rule11j: two published novels,
  excluding separately catalogued short stories.'

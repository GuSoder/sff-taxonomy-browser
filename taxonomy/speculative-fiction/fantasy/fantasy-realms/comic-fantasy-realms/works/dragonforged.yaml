placement_rationale: 'Root-down: Fantasy > Fantasy realms > Comic fantasy realms. In invented Draeland, Orin is the reincarnated
  champion who needs a mystical sword to defeat the Fiendlord. The chosen-one quest is organized as comedy: the conqueror
  is lazy, out of shape and worried about his unimpressed teenage daughter; Orin’s entrepreneurial sorceress companion tries
  to launch his heroic career while he keeps befriending the Fiends he should destroy. The publisher explicitly describes
  a humorous chosen-one take, and Kids’ Book Review says the obstacles have humorous endings. Magic, divine artifacts and
  invented-world adventure, not Earth-set reincarnation or scientific SF. One published 2025 graphic-novel volume; format
  does not supply a genre and is not excluded from the tree, which already includes Watchmen. No published sequel found in
  the current publisher series listing.'

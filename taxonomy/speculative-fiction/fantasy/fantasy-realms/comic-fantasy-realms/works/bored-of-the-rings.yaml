placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Comic fantasy realms. A 1969 Harvard Lampoon
  parody of The Lord of the Rings, written by Henry Beard and Douglas Kenney, with boggies for hobbits and the ring quest
  sent up scene by scene in an invented Middle-earth stand-in (Wikipedia). Parody is the governing engine and the invented
  world is the stage of the joke, the leaf''s definition. Rejected: Mythic farce and Earthly comic fantasy (the world is invented,
  not Earth), Epic fantasy (the quest is the butt, not the stake). Wobble: low. Sources: Wikipedia, publisher listing. The
  queue''s author field reads ''Hobbies'' (garbled); authors taken from Wikipedia.'

placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Fantasy (wizardry and sorcery with no scientific-engine frame)
  -> Fantasy realms (the invented world of New Ottosland and Melissande''s Bordeken, not recognizable Earth or a portal
  journey from Earth) -> Comic fantasy realms (comedy is the governing engine, not incidental relief: the premise is a
  Third Grade wizard accidentally powered up by a factory explosion, the voice is a World of Snark led by Reg the
  deadpan queen-turned-bird; Publishers Weekly calls book one droll and whimsical, the Dominion Post reads it as almost
  fantasy satire, the Herald Sun as Harry Potter for grown-ups) -> Absurd realms: the invented world itself carries the
  joke through absurd transposed institutions - the Ottosland Department of Thaumaturgy whose field wizards are literally
  titled janitors, the socially Serious Business Cake and Pastry Guild, the zany backwater polity of New Ottosland. Not
  Parody realms: no inherited story material, quest script or genre furniture is the thing being sent up. Sidebar
  disclosed per book: Wizard Squared (book 3) turns genuinely dark - a parallel-universe Gerald as tyrant, torture and
  character deaths - but the comic voice persists and the fiction is famous for its bumbling accidental-wizard comedy,
  so it rides under the whole-fiction main engine (curator ruling phonemsg-01M6XKB91QD65FFYNC4FDMM2H4). One series
  fiction under rule11j: the queue listed only The Accidental Sorcerer (MC05111); the remaining three novels are folded
  in as series completion.'

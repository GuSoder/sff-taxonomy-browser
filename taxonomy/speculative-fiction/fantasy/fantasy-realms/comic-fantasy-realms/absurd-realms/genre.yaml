  Not Parody realms (a familiar story shape or the genre''s furniture is the joke). Named by the curator; split from Comic
  fantasy realms at ten cards (curator approval phonemsg-01M5YNYMEG0VPS33MRRR37B0FB, 2026-10-27); a fiction that spans
  both follows its whole-fiction main engine (his caveat).'

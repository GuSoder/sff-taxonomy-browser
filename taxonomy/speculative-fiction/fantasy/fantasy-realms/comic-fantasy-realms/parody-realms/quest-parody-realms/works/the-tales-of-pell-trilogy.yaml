placement_rationale: 'Kevin Hearne & Delilah S. Dawson''s complete Tales of Pell trilogy (Kill the Farm Boy 2018, No Country
  for Old Gnomes 2019, The Princess Beard 2019, Del Rey; isfdb series record 50157). The land of Pell sends up the inherited
  furniture of fantasy: a farm boy marked as the Chosen One is eaten by his own goat in the first chapter, a band of misfits
  chases the Dark Lord''s plot through gnome politics, and a bearded pirate princess refuses every princess script. Walk:
  Fantasy > Fantasy realms > Comic fantasy realms > Parody realms (the governing joke is the genre''s own inherited story
  material - the chosen one, the quest party, the princess). Tried: Absurd realms (Pell''s world has jokes of its own, but
  the engine is trope parody, not an absurd polity). Source: publisher descriptions, Kirkus.'

  ## Corpus and evidence

  SFE explicitly treats Grunts! as a singleton and dates it1992. PublisherPRH lists the1995massmarket and2009ebook. Gateway
  has2013ebook. The creator''s June2000 interview independently calls it blackcomedy, developed out of her idea about orcs,
  fantasygenre conventions, Tolkien and fantasywargaming. No seriesbinding to Ash/Ilario, Orthe or WhiteCrow is supported.
  Existing tree checked, no Grunts card.


  Research covers more than the dragonhoard premise: independent fullreviews report LastBattle defeat, postwar armsindustry,
  electioncampaign and laterBugwar. The final pages'' precise tactical outcome is not documented by these sources, so no invented
  definitivevictory or electionwinner is claimed. The known latebook continuation is enough to test whether the mechanism
  changes and whether the wholefiction remains parody. It does, but the Parody-versus-Absurd distinction is a genuine wobble
  because later modernpoliticalinstitutions matter greatly.


  ## Whole fiction

  OrccaptainAshnak''s company are disposable troops of the Horde ofDarkness, facing the ArmyofLight''s inevitably victorious
  heroicraces. Sent to steal a dragon''shoard, they discover weapons from otherworlds, including Earth''s modernmilitary kit.
  The hoardcurse makes thieves resemble previous users, producing the OrcMarineCorps. It is a magical transformation, not
  training alone. Their borrowedtechnology does not simplywin the LastBattle: weaponfailure spells help rout them, and Lightwins.


  After defeat, Ashnak keeps the corps together and moves into armssales and manufacture with a halflingduchess, whom he marries.
  The curse spreads with weapons and otherfantasyraces acquire the marinepersona. An undeadspecialforcesunit, experimentalweapon
  systems and inheritedwarmovie types broaden the sendup. The DarkLord returns and substitutes an election for another ritualFinalBattle.
  Campaignmanipulation, industrialunrest and trialforatrocities enter the plot. A later threat by giantalienBugs adds StarshipTroopers/actionmovie
  parody. A human from Earth arrives, but the fullreview that notices him expressly treats him as an inconsequentialsubplot,
  not the organizing portalframe. The conclusion leaves the OrcMarines'' future open; no standalone sequelnovel found.


  This is extremeblackcomedy, including rape, cannibalism, torture and massacres. The brutality is not proof of a grimserious
  militarynovel: creator and criticalreviews identify the genreparody as the governingmode, although many dislike it. The
  placement is a contentclassification, not an endorsement or a claim it is lighthearted/childfriendly.


  ## Hard root-down walk

  | Gate | Decision |

  |---|---|

  | Speculativefiction | Literal hoardcurse, necromancy, magic and constructedfantasy races. |

  | Fantasy, not SF | Modern USweapons and alienBugs do not demystify the curses or spellcraft. SFE''s shorthand spoofMilitarySF
  describes a satirictarget and castmix; the owner''s strict no-magic-in-SF and inventedworld boundary decide the taxonomyroot.
  HumorousSF, SpaceMarines and MilitarySF fail these rootchecks. |

  | Fantasyrealms | Mainworld is invented Tolkien-likefantasy, not historicalEarth or a claimed distantEarth. Otherworlds/modernEarth
  supply stolenweapons and an incidental human, not the mainworld''s identity. |

  | Not Portalfantasy | Exchange with Earth is not the story''s organizingexperience: its protagonists are nativeorcs, its
  whole narrative follows their military/socialcareer, and the visitinghuman is explicitly described as unimportant by a fullreview.
  Earth-origin objects alone do not make a portalnarrative. |

  | Comicfantasyrealms | Comedy is the engine, not occasionalrelief. The creator calls it blackcomedy and a sendup of fantasy/Tolkien/wargaming;
  reviews across sharplyopposed tastes agree on parody. This governs over militarysubject, monstercreatures and gruesometone.
  |

  | Parodyrealms | Inherited genre furniture and scripts generate the premise and later transformations: expendableorcs versus
  virtuousheroes, ritualFinalBattle and DarkLord, then warmovieMarines and StarshipTroopersBugs. Not a wholly freebuilt society
  whose customs alone are the joke. |

  | Questparodyrealms | Epicfantasy''s Light/Darkscript, DarkLord and stockheroicraces are subverted through the villainousinfantry''s
  viewpoint. LastBattle remains the referencepoint even when the DarkLord rejects it for an election. Not Fairytaleparodyrealms,
  whose royalromance/PrinceCharming tales are not this book''s engine. Existinghonestleaf8to9. |


  ## Strong rivals and limits

  - Absurdrealms is strongest. The armsindustry, labourunion, election and monstroussociety satire occupy much of the laterbook,
  and the creator/inheritedmainengine caveat applies across the wholefiction. Nevertheless the moderninstitution jokes are
  mounted through the continuing genrecast and USMarine/actionfilm caricatures, while the election specifically replaces the
  inherited DarkLord''s predeterminedFinalBattle. This is sustained genreparody with expanded targets, not only an absurdpolity.
  Moderateconfidence on this tie-break; high on the parentComicfantasyrealms.

  - Militaryfantasy/Soldierfantasy and Technofantasy/Magitech offer obvious subjectmatches, but the comedyengine outranks
  subject under ownerrules27/35/63. No attempt to create a humorousmilitary subleaf.

  - Portalfantasy is a realmechanicalrival, not ignored: knownEarthcrossing investigated and minorrelative to the nativeorcfiction.
  No user ruling says every incidentalEarthvisitor requires portalplacement.

  - Fabulation/Meta-remyth: an openly parodic version of fantasyconventions does not mean namedliterarycharacters escape a
  text or that the storyworld is literally rewritten. No such mechanism established.



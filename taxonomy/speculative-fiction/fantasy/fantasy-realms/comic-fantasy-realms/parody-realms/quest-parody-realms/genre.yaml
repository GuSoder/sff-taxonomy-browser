definition: 'Parody realms whose governing joke sends up the epic-quest script: the Dark
  Lord, the chosen one, the quest party, the barbarian hero, the genre''s own heroic furniture
  (a ring quest sent up scene by scene, a time-loop heroine who becomes the Dark Lord herself,
  a reincarnated champion managed like a startup, an undercover evil wizard in a Dark Lord
  trilogy, an aged barbarian dragged out of retirement, a dragon-hoard heist that subverts
  the chosen hero, a farm-boy Chosen One eaten by his own goat). Not Fairytale parody realms
  (the fairy-tale and royal-romance script - Prince Charming''s stolen destiny, a commoner
  impersonating a prince, a dragon exterminator beset by princes and princesses), not Absurd
  realms (the invented world itself, its institutions and customs, is the joke). Split 2026-11-18
  from Parody realms at ten cards, curator "Approved" (phonemsg-01M7PZHMA67GJ2H4GS8K4VBAF1,
  2026-11-18 10:24 AM CET) of the served split proposal with the exact names Quest parody
  realms / Fairytale parody realms (serve phonemsg-01M7PZH6SMC0E5H3C0PEWEZJ2Z).'

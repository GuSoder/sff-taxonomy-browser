placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Fantasy realms > Comic fantasy realms > Parody realms. Whole published
  trilogy, not first-book tone alone. Fool''s Gold (2016) has impoverished farmer Will and four ill-suited allies rob the
  dragon rulers of Avarra. False Idols (2017) breaks the apparent happy ending: the scattered rich heroes face dragon cults,
  murderous resistance and their former mentor Firkin, revealed as the god Barph, who kills them. Bad Faith (2018) takes them
  into the Hallows; Will''s new power theft returns them to life, but belief feeds his dangerous godhood, and Quirk''s dragon
  alliance complicates the revenge/redemption struggle. All three are one continuous fiction.

  Root test: actual sorcery, gods and invented Avarra, not scientific extrapolation; the Hallows is that world''s afterlife,
  not Earth or evidence of alternate Earths, so not Portal or Real Earth fantasy. Within Fantasy realms, the story knowingly
  sends up epic-quest furniture: the farmer-savior, unreliable mentor, dragon-hoard adventure and its supposed happy-ever-after
  repeatedly go wrong; the narration draws attention to its own genre machinery. SFFWorld''s completed reviews of books 2
  and 3 document humorous metatextual chapter headings and explicitly judge the three-book story consistently self-aware despite
  the rising scale. The final book''s distributor copy still calls it a comedic adventure. Thus Comic fantasy realms rather
  than Epic fantasy or straight Sword and sorcery; Parody rather than Absurd because inherited heroic story machinery is the
  repeated joke, not a world primarily built as a transposed modern society or pun system. Dragon taxes and religion do supply
  institutional satire, but not the dominant construction. Not Fairytale fantasy (no particular tale rewritten), Gothic realms
  (late horror is not the governing register), Far shores (no counterpart culture as subject), or Heart fantasy (friendship/romance
  matter but do not supply the organizing bond-as-spine).

  Strong alternatives tested: Caper fantasy is substantial, not dismissed as incidental. In his primary interview Hollins
  says he planned a series of heists, and book 3 repeats a power heist in the afterlife. But the three-book progression extends
  beyond an intimate criminal career into cult warfare, divine betrayal and a corrupted savior, all presented through the
  same self-conscious heroic-fantasy reversals. Caper would understate that governing comic framework. Likewise Pulp S&S would
  understate the send-up. Epic/Political/Revolutionary is a real late-volume contender: overthrow, mass bloodshed and consequences
  grow central, but conventional faction/statecraft or a single war is not the stable whole-fiction engine. Mythological/Invented
  godhood describes the final power struggle, not the first two books'' whole engine. High/quest or heroic/chosen-one material
  is being knowingly bent rather than played straight.

  Wobble: moderate, explicitly unresolved tonal disagreement, not a unanimous humor claim. Jana Nyman''s finished Fantasy
  Literature reviews find book 2 less fun and book 3 darker and blood-drenched; A Rambling Reviewer says final-book humor
  is dialled back substantially. Rob Bedford''s finished SFFWorld review instead explicitly maintains continuity of snarky
  self-aware humor across all three, citing final-book headings such as ''Look, Dragons are in the Series Name, Okay?'' and
  ''The Backstory I''ve Spent Three Books Getting Around To''. The placement rests on the sustained narrative frame and actual
  mechanics, not assuming that every reader finds the late books funny. Exact final scene not independently read; finished-review
  accounts of Will''s redemption and the final conflict are the evidence, not an invented ending. Eight existing Parody fictions
  become nine; no split threshold reached. Original owner ordered-intake authority phonemsg-01M43MYMGAMQTNA3CY402KK7FB and
  individual-fiction judgment phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX re-read 2026-11-05.'

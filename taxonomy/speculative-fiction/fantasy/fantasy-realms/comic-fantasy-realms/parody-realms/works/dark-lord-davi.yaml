placement_rationale: 'Root-down: speculative-fiction > fantasy > fantasy-realms > comic-fantasy-realms. ''Groundhog Day meets
  Guardians of the Galaxy'' in a ''laugh-out-loud fantasy tale'': Davi has rallied humanity against the all-powerful Dark
  Lord a hundred times and the time loop beats her every time, so she decides to become the Dark Lord herself (djangowexler.com
  author copy, Orbit). Comedy is the governing engine, not incidental relief, and the invented Dark-Lord world is the stage
  of the joke - the leaf verbatim. The time loop is the device, not the shelf. Two novels 2024-2025 (Hachette pub dates: book
  1 May 21, 2024; book 2 2025 per OL/Orbit). Years are first US publication.'

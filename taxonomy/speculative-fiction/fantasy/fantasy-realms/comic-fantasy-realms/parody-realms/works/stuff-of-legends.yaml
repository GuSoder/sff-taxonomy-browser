placement_rationale: 'Walk: Speculative fiction > Fantasy > Fantasy realms > Comic fantasy realms > Parody realms. An aged
  barbarian hero is dragged out of retirement by an eager young man, an Elvish guardian and a bard-for-hire; PW calls it
  ''satirical, rollicking'' and Glen Cook ''a send-up of scores of fantasy novels of time past'', with comparisons to early
  Pratchett, Esther Friesner and Hines''s Goblin books (PRH page quoting PW and Cook). The governing joke sends up the
  inherited quest script and the genre''s furniture - that is Parody realms. Rejected: Absurd realms (the invented world''s
  own institutions and wordplay are not the engine; the send-up of story shapes is), Sword and sorcery (the adventure is
  played for parody, not straight). Wobble: low. Year: 2010 (PRH ebook July 27, 2010). Queue id MC03915.'

definition: 'Comic fantasy set in an invented world, where comedy, parody or satire is the governing engine rather than
  incidental relief, split by what the joke is: Parody realms (inherited story material - a text, a fairy-tale or quest
  script, the genre''s own furniture) or Absurd realms (the invented world itself - absurd institutions, customs and
  wordplay transposing our own). Split at ten cards on the curator''s approval (phonemsg-01M5YNYMEG0VPS33MRRR37B0FB,
  2026-10-27); Absurd realms is his coinage. A fiction spanning both follows its whole-fiction main engine (his caveat).
  Earlier history: lifted 2026-09-28 from under Sword and sorcery to a direct child of Fantasy realms and renamed from
  Comic fantasy; the 2026-09-22 realm-fork exception dissolved (the curator ruling, phonemsg-01M3MDGRXMYQTGHZX3RX5CGGV0).'

placement_rationale: Macmillan and Jacqueline Carey present one connected historical/epic fantasy legacy in an invented Terre d'Ange, driven across generations by courtiers, dynastic threats, conspiracy, threatened crowns and insider spies. Court politics and succession remain the shared engine, making Court intrigue closest.

definition: 'Heart fantasy in which the spine bond is with a horse or horse-kind: winged mares, Companions, soul-bound mounts - the horse is the partner, not the transport. Not Beast master hero (the bond with any other animal), not Romantasy (the love arc is the spine), not Cozy fantasy (safety governs).'

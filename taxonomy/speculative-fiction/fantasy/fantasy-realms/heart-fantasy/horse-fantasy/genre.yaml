ruling: 'Seeded under Heart fantasy on the curator''s "Do Heart fantasy" (phonemsg-01M4ZCCYWS7H2CD8A73KCG814E, 2026-10-15 10:55 AM CEST); the name and the leaf are his own call: "I want these pony book out of my martial hero fantasy! Find a place to put horse fantasy!" (phonemsg-01M4ZBPM61507CV3FRGW4VBM75, 10:43 AM). Holds Heralds of Valdemar (from Beast master hero, leaving Martial heroes on his word) and The Horsemistress Saga (from Magic school; not Earth - the Duchy of Oc, publisher description). Riders of Earth and Sky stays in Enemy lines romantasy: the romance is its axis and the bond splits horse and eagle. Rejected shelves along the way: Bonded hard magic (his "hard magic = casting systems" reading, 10:27), Beast master hero (his pony-book objection), Cozy fantasy (tone test fails - raided village, kidnapped children, a fallen flyer), Epic fantasy (duchy-scale, his "is these really epic books?", phonemsg-01M4ZBYBN9Z8J4J77JJQJ1DBWN).'

canonical_genre: polyamorous-romantasy
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Romantasy > Polyamorous
  romantasy. One fiction under rule 11j: The Age of Blood trilogy (Mistress of Lies 2024, Lord of Ruin 2025, Prince of
  Ash forthcoming Jan 19, 2027 - Hachette), one world (Aeravin: Blood Worker elite vs the Bloodless under an undying
  Eternal King) and one continuing cast. The publisher frames it as "dark fantasy romance with sizzling spice" and the
  author calls it a queer gothic fantasy - the romance is the spine. The engine is a three-person polyamorous relationship
  among Shan LeClaire, Samuel and Isaac, with all three legs mutually developed: "the three relationships between Shan,
  Samuel, and Isaac... each of the three connections got the attention it deserved" (Marked for Plot); readers confirm it
  ends in a poly romance continuing into book two, and recommend it in a "love triangle that''s actually a triangle" thread
  (all parties interested in each other). Rejected: Enemies-to-lovers romantasy (the three are never set on opposed sides;
  the Blood Worker / Bloodless class divide is setting, not enmity between the lovers), Bonded romantasy (nothing imposed
  ties the lovers together; the attraction is chosen across all three). Queue order corrected: Mistress of Lies is book 1.'

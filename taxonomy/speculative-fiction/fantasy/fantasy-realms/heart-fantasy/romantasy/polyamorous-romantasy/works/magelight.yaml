placement_rationale: 'Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Romantasy > Polyamorous romantasy.


  Scope: one continuing Kacey Ezell fiction with two published novels, Magelight (2025) and Blood on the Sand (2026). The
  author''s current series page lists both. The publisher dates the sequel 7 April 2026; the author''s individual page says
  6 April and has inconsistent ISBN/page metadata, so publisher metadata wins. No projected third volume is counted, and no
  final-series closure is claimed.


  Root and setting walk: actual supernatural spellcraft, geas, magical power and dragons in an independently invented empire
  establish Fantasy, not a technological explanation or SF-shaped universe. No scientific mechanism, space/time travel or
  alternate Earth is established in the sources read. Real earth fantasy and its Historical/Contemporary/Future descendants
  fail the Earth gate; an empire using Roman vocabulary is not historical Rome. Portal fantasy requires Earth and no such
  crossing is established. Fantasy realms is the honest setting parent.


  At Fantasy realms: Heart fantasy is selected because the quartet''s love, free choice and relationship equilibrium repeatedly
  cause the plot, with external adventure genuinely coequal. Cozy fantasy fails safety and low-intensity gates: coercion,
  betrayal, violent pursuit and arena deaths are material. Horse fantasy fails because no horse partnership governs. Far shores
  culture branches do not win merely from Roman-flavored cities or political vocabulary. Heritage/myth registers are not supported
  as governing inherited traditions. Fairytale revision or task grammar, Comic parody/absurdity and Gothic dread/enclosure/manners
  are not the governing forms. The novels have danger and a creation mythology, but not a haunted-world engine, an invented
  myth-history chronicle, a fairy-tale retelling or a comedy premise.


  Epic fantasy is the strongest rival branch. Heroic fantasy > Caster heroes > Mage hero > Grey mages > Grey sorcerer hero
  genuinely fits Aelys''s inborn family gift, magical schooling, direct power and RPG-party adventures. School trains an existing
  gift, so not Grey wizard hero. Martial/half-caster destinations do not become right because her three partners include warrior,
  forester and thief: the central sorceress is not thereby a swordswoman or stealth artist wielding her own magic. Cleric
  and Bard lack sacred service or performance as power source. Chaos mage was wrongly omitted from the old rationale: Black
  Mages includes destruction, not only death/blood. A tavern and surroundings destroyed by her surge is real evidence, but
  the two-book material does not establish mass-destruction craft as the whole governing kit; binding, freedom and relationships
  recur more centrally. No healing/necromancy/siphoning/shadow craft spine is established. Do not equate wild with Chaos.
  This remains a genuine heroic-adventure rival, not an error erased by romance marketing.


  Other Epic rivals: road journeys and a four-person party are substantial, but no one fellowship quest against an ancient
  dark, hidden-heir destiny or revisionist quest purpose governs both books. Court betrayal, an emperor''s rebellion and power
  struggles are important external stakes, but the protagonists are not chiefly governing, campaigning as armies or conducting
  dynastic/court-spy work. Hard fantasy requires an explicit rule/cost system to govern the narrative; one review praising
  internal consistency is not enough, and a human romantic geas is not automatically Bonded hard magic''s spirit/elemental
  system. No load-bearing time domain. Mythological registers do not win from background gods alone.


  Sword and sorcery/action is another genuine rival. Tournament fantasy describes the sequel arena but not the first novel''s
  escape and family betrayal. A thief''s heist side quest is not a whole-fiction Caper spine; shipwreck and coastal travel
  do not make Pirate fantasy; no central wondrous machinery or planetary-romance engine supports Technofantasy/Sword and planet.
  Classic S&S adventure does not account for the sustained romantic consent question as specifically as the selected Heart
  branch.


  Romantasy gate: not simply four spouses, jacket labels or a sex-page count. First-book completed professional criticism
  describes mental/sexual Ageon bonding and sustained four-person romantic tension through the adventure. The first ending
  breaks the accidental geas so the men can choose. The author presents the sequel around the resulting relationship dynamics
  and emotional wounds, while completed criticism ties voluntary rebonding to surviving the arena and formalizes the quartet
  in marriage. Relationship autonomy is therefore causal across both novels and reaches a relationship payoff alongside the
  external conflict. Removing the romantic relationship story would remove the premise, first-book release decision, sequel
  conflict and major climax machinery, not just incidental attraction.


  Inside current Romantasy: Polyamorous romantasy''s multi-heart equilibrium is the best whole-fiction distinction. No exclusive
  pair governs. Enemies-to-lovers branches fail because the main romantic parties do not start as opposed rulers, war sides
  or competing rivals. Friends-to-lovers and Second-chance do not describe an established friendship turned pair romance or
  one former beloved re-wooed. Soul bond romantasy is a close first-book rival, since a magical geas imposes a bond; its actual
  definition is a pair learning to live inside an imposed tie. The whole fiction releases that tie and reconstructs a freely
  chosen quartet. Court/Bride/Curse bargain bonds likewise are not the governing externally priced pair claim, and shared
  Sworn/Chance duty cannot replace the specifically multi-partner love story. Existing Polyamorous definition includes a polycule,
  not a requirement that every member romantically pair with every other member. No definition expansion is made.


  Completed-content check: first-book accounts report graduation, failed initial bond, accidental geas, family betrayal, release
  and joint escape. Second-book accounts report Romik''s former-slave/gladiator past, travel and shipwreck, Vil''s heist,
  Daen''s anger about unilateral release, voluntary rebonding and marriage, arena climax, recruitment by a disguised emperor
  against his grandmother, and a still-unresolved pursuer leading into the next book. These are source-backed completed reviews,
  not a claim to have read the full novels. Kathy Martin''s blog and Goodreads text are one review. Critics disagree about
  how much the action outweighs romance; that disagreement remains material.


  Decision: move this single whole fiction from Grey sorcerer hero to existing Polyamorous romantasy, moderate confidence.
  Strongest contrary evidence is Declan Finn''s two completed reviews favoring RPG adventure, plus community readers calling
  romance a dash. Yet even his sequel review confirms the four-person marriage, and the primary author and other completed
  readings show the relationship choices driving the continuing premise and arena resolution. The existing romantasy definition
  requires coequal external stakes, not action displaced by romance. This is a whole-fiction correction, not a capacity-driven
  transfer. Grey sorcerer hero falls ten to nine, Polyamorous romantasy two to three. No split, new node, definition change
  or portrait is justified by this correction. Restore the existing YAML''s two novels on the app card, which previously displayed
  only one book. Leave the other nine fictions untouched. Entrusted individual-fiction judgment is grounded in original owner
  message phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX; intake gate original phonemsg-01M43MYMGAMQTNA3CY402KK7FB. Resume intake only
  after repository/app validation, deployed live counts and visual QA are complete.

  '

placement_rationale: 'LJ Claren''s Selvaren series (The Silversmith, self-pub July 2025 / Second Sky October 2025; The Incendiary,
  Hachette/Forever September 2026; third volume The Nocturne announced for July 2027 - unreleased, not counted, author site
  and Amazon pre-order). Ary Gold, a hidden royal and the prophesied queen of Nyrida, is promised to the realm''s commander
  while the realm marches against the risen shadow wielder Molochai; the man she loves, Gavin Smyth, is Molochai''s own son
  and his infamous immortal assassin the Butcher, bound to the dark sorcerer by a blood oath (ursummary.com full recap; momneedsachapter.com
  recap; author site; Hachette and Second Sky pages; marketed ''slow-burn, enemies-to-lovers romantasy''). Walk: Speculative
  fiction > Fantasy (gods-lineage magic, shadow wielding, prophecy) > Fantasy realms (invented Nyrida) > Heart fantasy (the
  forbidden love is co-spine with the war) > Romantasy > Enemies-to-lovers romantasy (the lovers start on opposed sides -
  the prophesied queen and the enemy sorcerer''s son and assassin; marketing says the same) > Enemy lines romantasy (the divide
  is the war between Nyrida and Molochai, not a personal feud or the throne) > Battle lines romantasy (an open war: the realm''s
  army against the corrupted darkness; she is its destined leader, he is the enemy''s bound instrument). Rejected: Crown enemies
  and its children (the beloved is not the crown or its instrument - SHE is the crown; he belongs to the enemy power), Rivals-to-lovers
  (no peer feud), Blood lines (the line is a war front, not an inherited house/coven vendetta), Bonded leaves (his blood oath
  binds him to Molochai, not to her; their secret centuries-old marriage is the past they must recover, not an imposed tie
  the plot forces them to live inside). Wobble: medium - book two reveals a centuries-old marriage between them, so a Bonded
  read exists, but book one''s engine is the enemy-line crossing and the series'' spine is the war. One series card (11j);
  queue rows MC06098 (Incendiary), MC06100 (Silversmith); MC06099 (Nocturne) skipped as unreleased. Sources: ljclaren.com,
  hachette.co.uk, secondskybooks.com, ursummary.com, momneedsachapter.com, goodreads.'

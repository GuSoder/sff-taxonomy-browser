definition: 'Enemy lines romantasy where the lovers stand on opposite sides of an open war or a broken treaty between states
  or peoples: an exiled sea-people against the land kingdom that cast them out, a mortal kingdom defying the gods who rule
  it, empires locked in open war, a king''s war on magical peoples. The enmity comes from their warring sides, not from a
  personal rivalry or a throne. Not Blood lines romantasy (the line is an inherited enmity of house, faith or coven, not a
  war front), not Crown enemies romantasy (no lover is the crown or its instrument), not Rivals-to-lovers romantasy (a personal
  feud between peers). Split 2026-11-17 from Enemy lines romantasy at ten cards, curator "Approved" (phonemsg-01M7MPZ5VCN8B88DC3916YM2WH,

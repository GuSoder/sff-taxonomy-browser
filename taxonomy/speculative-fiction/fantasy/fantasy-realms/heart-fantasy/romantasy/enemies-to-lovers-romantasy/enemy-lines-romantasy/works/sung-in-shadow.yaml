placement_rationale: 'Tanith Lee''s Sung in Shadow (1983; Penguin Random House description and ISFDB), a retelling of Romeo
  and Juliet in the invented land of Santa Verensa, a Renaissance-Italy-like world: the great aristocratic Houses live by
  vendetta, Romulan Montargo, heir of his house, and Iuletta Chenti, the sheltered only child of the rival patriarch, fall
  in love after she charms him, though she is betrothed to the Belmorio heir and her cousin Leopardo hates the Montargos murderously,
  and the lovers must defy their families and their fates. Walk: Fantasy > Romantasy > Enemies-to-lovers romantasy > Enemy-lines
  romantasy (the lovers stand on opposite sides of a feud and the love is the plot). Tried: Dynastic wars (the houses feud,
  but no crown is at stake and no war is fought), Mediterranean Renaissance fantasy and Alt Renaissance fantasy (the land
  is invented, so it is not an Earth leaf) and Fairytale transplant (the source is a play, not a fairytale). Wobble: Dynastic
  wars is the alternative leaf; the lovers do not start as enemies, only their houses are. Source: publisher description.'

placement_rationale: 'Walk: Fantasy > Fantasy realms > Heart fantasy > Romantasy > Enemies-to-lovers romantasy > Enemy lines
  romantasy. Sicily and the Seven Circles: Emilia, a witch of a hidden coven, loses her sister to murder and binds herself
  to Wrath, a demon prince of the Wicked - the beings her coven has stood against for generations. The Kingdom trilogy and
  the Prince of Sin books pair witches and humans with the princes of Hell across the same coven divide; the enmity comes
  from their sides, not a personal feud, and the love story is what crosses it. TENTH card on Enemy lines romantasy - freezes
  the leaf. One shared universe (rule 11j): the Prince of Sin books (Throne of the Fallen, Throne of Secrets, Throne of Nightmares)
  share the Seven Circles and its princes.'

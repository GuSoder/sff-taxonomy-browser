placement_rationale: 'Lois McMaster Bujold''s Sharing Knife quartet (Beguilement 2006, Legacy 2007, Passage 2008, Horizon
  2009, Eos/HarperCollins; the companion Knife Children 2019 is a novella, not counted; bibliography current per dendarii.com,
  the author''s own biblio page, and Wikipedia). Fawn Bluefield, a farmer''s daughter, and Dag Redwing Hickory, a Lakewalker
  patroller-sorcerer, fall in love and marry, defying the deep-seated distrust between their two peoples (intheseries.com
  series summary; Locus: ''a better fantasy romance with compelling characters and the fascinating clash between their cultures,
  she a farmer''s daughter, he an adventurer on the trail of a deadly demon''). Walk: Speculative fiction > Fantasy (groundsense
  magic, malices) > Fantasy realms (the Wide Green World, an invented post-sorcery world) > Heart fantasy (the romance is
  the spine: Bujold and Locus both call it fantasy romance; the quartet is the story of a marriage) > Romantasy > Enemies-to-lovers
  romantasy in the gate''s own sense - ''the love story is what crosses the divide, and the external conflict is the wall
  it has to cross'' - > Enemy lines romantasy (the divide is between their sides, not personal) > Blood lines romantasy (an
  inherited enmity of peoples: the ancestral Lakewalker-farmer estrangement they were each born behind; ''unable to overcome
  the bigotry of their own families'', WorldCat summary of Passage; not an open war front, so not Battle lines). Rejected:
  Battle lines (no war between Lakewalkers and farmers; they share a war on malices), Rivals/Bad blood (no personal feud),
  Bonded leaves (no imposed tie; the marriage is chosen, and the quartet''s conflict is the peoples'' divide around it), Friends-to-lovers
  (courtship is not the engine), Epic (the world is stage for the marriage, not the reverse). Wobble: medium - Reactor reads
  the books as Westerns and the quartet goes domestic after Beguilement''s courtship; the romance stays the spine throughout.
  One fiction, one card (11j): the original story was split into volumes for length, and the queue''s four rows (MC06110-13)
  are its four volumes; the pass-1 skip-collection verdict was wrong for these - they are novels, not collections. Sources:
  dendarii.com (author bibliography), harpercollins.com, intheseries.com, Locus via harpercollins.com, reactormag.com, Wikipedia,
  isfdb.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy (saintly magic, an Abbey of wonder-working saints; Harper Voyager
  calls it a gothic romantasy) > Fantasy realms (the Abbey and the Goddenwood moors are an invented world) > Heart fantasy
  > Romantasy (publisher declares "sumptuous gothic romantasy"; the Maeve-Jude slow burn is the co-equal spine with the Abbey-takedown
  plot) > Enemies-to-lovers romantasy > Enemy lines romantasy: the enmity comes from their sides - Maeve arrives as the Abbey''s
  devout acolyte and spy, Jude is the Abbey''s exiled heretic saint; no throne is the wall (not Crown enemies: the Abbey is
  a religious order, not royalty, and Jude is no ruler''s instrument) and no personal contest (not Rivals: they had never
  met). Standalone debut (Little, Brown / Harper Voyager, November 2025; the author''s sophomore Copperstitched is a separate
  world).'

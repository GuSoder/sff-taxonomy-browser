definition: 'Enemies-to-lovers romantasy where the other lover is the crown or its instrument: a king, a prince, a crown guard,
  a judge who rules the city, or a spy sent into a rival royal house. The throne is the wall the love has to cross. Not Rivals-to-lovers
  romantasy (peers in a personal feud), not Enemy lines romantasy (the divide is a war or treaty between peoples, not a ruler).
  Split 2026-10-05 from Enemies-to-lovers romantasy at ten cards (curator "Approved" (phonemsg-01M4648EQ6WS79416FZNS2FEPG,
  2026-10-05 3:32 PM)). Split at ten cards into Crown-outlaw romantasy (the enemy is the crown''s own condemned subject) and
  Royal enemies romantasy (the enemy belongs to a rival royal house).'

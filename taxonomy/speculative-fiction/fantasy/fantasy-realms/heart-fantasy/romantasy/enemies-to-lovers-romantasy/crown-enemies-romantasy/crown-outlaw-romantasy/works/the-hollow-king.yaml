placement_rationale: 'Complete romantasy duology (Bookouture 2020; Hachette reissue
  2025). In the Kingdom of Larelwynn the mageborn are collared, policed and bound
  to the crown by homage; Grace Marchant is an orphan soldier with hidden, suppressed
  magic who polices her own kind, and Prince Bastien Larelwynn - the Lord of Thorns,
  heir and the crown''s own mageborn enforcer - is the beloved who wears and serves
  that same crown. Book 1 ends in open rebellion against the queen''s magic-harvesting
  court; book 2 (Nightborn) turns on a curse destroying the mageborn and the cure
  Grace and Bastien bargain for. The wall the love crosses is the throne of their
  own realm: Crown-outlaw romantasy (hunted mage + crown''s instrument), not Royal
  enemies (one crown, not two rival houses), not Crown-slave (neither lover is held
  as a slave or bondservant). Sources: hbgacademic.com The Hollow King series page;
  sobrief.com Mageborn chapter summary; Goodreads series 278603.'

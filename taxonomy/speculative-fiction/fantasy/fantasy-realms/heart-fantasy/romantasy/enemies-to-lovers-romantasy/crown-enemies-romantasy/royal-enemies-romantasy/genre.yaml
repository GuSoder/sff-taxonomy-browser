definition: 'Enemies-to-lovers romantasy where the lovers belong to two rival royal houses: the enemy is the rival crown''s
  spy, planted bride, guard or stolen child, and the beloved is that rival crown''s royal or its servant. The border between
  two thrones is the wall the love has to cross. Not Crown-outlaw romantasy (the enemy is the crown''s own subject), not Enemy
  lines romantasy (the divide is a war or treaty between peoples, not royal houses).'
status: provisional
ruling: 'Split of Crown enemies romantasy at ten cards by which side of the border the enemy lover belongs to: the crown''s
  own condemned subject, or a rival royal house''s agent or kin (curator "Approved" (phonemsg-01M5MFNXXTAH5GBHTGDXZB9VAQ,
  2026-10-23 3:37 PM CEST), on his own names Crown-outlaw romantasy and Royal enemies romantasy (phonemsg-01M5MFN1T1NBAF8K6RV486VY1Q));
  the original stays umbrella.'

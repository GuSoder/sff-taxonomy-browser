placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms (invented Coventry/Domingo, the three witch
  Houses) > Heart fantasy > Romantasy (publisher and author declare it a high-stakes romantasy; Caya''s romances are the co-equal
  spine with the revenge plot) > Enemies-to-lovers romantasy (every romance starts hostile: she means to kill the prince,
  and her childhood friend betrayed her) > Crown enemies romantasy (the throne is the wall) > Royal enemies romantasy: the
  lovers belong to two rival royal houses - Caya is the murdered Coventry royals'' ward and foster-child, planted as a spy
  in the witches'' season to kill Domingo''s heir; Prince Tomas "Teo" Castellan is that rival crown''s royal, and Bas Arroyo,
  her childhood friend turned enemy, is its guard. Not Crown outlaw (she is not the crown''s own condemned subject but the
  fallen rival house''s avenger), not Crown slave (no bondage). DISCLOSED WOBBLE: reviewers read the three-way attraction
  (Caya-Teo, Caya-Bas, Teo-Bas) as a burgeoning throuple, but book one of the duology leaves it unresolved and the publisher
  frames pairs, so the pair frames still govern; if book two resolves as a true triad whose equilibrium is the love story,
  the card belongs in Polyamorous romantasy and should move then. First published volume of the duology (Little, Brown BYR,
  September 8 2026).'

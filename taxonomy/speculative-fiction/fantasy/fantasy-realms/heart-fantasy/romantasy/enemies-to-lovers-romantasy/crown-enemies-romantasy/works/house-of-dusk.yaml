placement_rationale: 'Root-down: Fantasy > Fantasy realms > Heart fantasy > Romantasy > Enemies-to-lovers romantasy > Crown
  enemies romantasy. Per Deva Fagan''s site and PRH: a standalone romantic epic fantasy where a young spy is caught between
  her mission and a growing attraction to an enemy princess; the excerpt has her hired to guard the princess''s life. The
  love crosses a throne: the beloved is the royal of a rival house and the lover is the spy placed beside her, which is the
  leaf''s definition. Rejected: Enemy lines romantasy (the sources name an enemy princess, not a war or treaty divide between
  armies), Rivals-to-lovers (not a peer feud). Soft: the blurb also carries a second lead, a fire-wielding nun, and the rival-house
  divide is stated only as ''enemy princess''. Cover carries the tagline ''Fear not the flame.''; no clean edition found.'

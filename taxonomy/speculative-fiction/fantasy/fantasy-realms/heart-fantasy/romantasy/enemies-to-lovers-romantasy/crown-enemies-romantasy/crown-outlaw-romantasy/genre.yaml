definition: 'Enemies-to-lovers romantasy where the enemy lover is the crown''s own condemned: a subject branded traitor, a
  hunted mage, a thief, an outlaw, and the beloved wears or serves that same crown. The throne of their own realm is the wall
  the love has to cross. Not Royal enemies romantasy (the enemy belongs to a rival crown), not Rivals-to-lovers romantasy
  (a personal feud between peers).'

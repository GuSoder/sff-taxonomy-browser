placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Romantasy > Enemies-to-lovers
  romantasy > Crown enemies romantasy > Royal enemies romantasy. Transported to the magical realm of Avalon, Gwen strikes
  a deal with Mordred''s enemy: she joins the court of the Prince in Iron as effectively a planted spy, to steal his heart
  and break his enchanted crystal - and the beloved Mordred is that crown''s royal, the dark ruler of Avalon himself (Second
  Sky series copy: ''To save a kingdom, she must charm a monster''). The border between two thrones is the wall the love crosses:
  the Royal enemies romantasy gate (''the enemy is the rival crown''s spy... and the beloved is that rival crown''s royal'').
  Publisher''s own shelving is enemies-to-lovers fantasy romance. Series complete at four novels 2023-2024 (Fantastic Fiction
  series page; Second Sky box set lists books 1-4); one card folds all four.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Romantasy > Enemies-to-lovers romantasy
  > Crown enemies romantasy. Lore, a death-magic poison runner, is seized by the king''s warrior-monks and thrust into the
  Sainted King''s court, guarded by Gabriel, a duke-turned-monk, and repeatedly crossing Bastian, the king''s heir, while
  tangling in politics, religion and forbidden romance (author site description of The Foxglove King); The Hemlock Queen and
  The Nightshade God complete the Nightshade Crown trilogy. The love runs through the crown''s heir and its guard, with the
  throne as the wall. Rejected: Bonded romantasy (the lovers are not tied by an imposed bond or bargain), Rivals-to-lovers
  romantasy (the opposition is the court, not a peer rivalry). Wobble: strong; the first book is also a court and cult mystery
  with a love triangle. Sources: author site only for the first book; trilogy membership from the series titles. Years: 2023,
  2024, 2025.'

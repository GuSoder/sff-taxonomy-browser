placement_rationale: 'Kristen Ciccarelli''s The Last Namsara (2017; with The Caged Queen 2019, The Sky Weaver 2021): Asha,
  the king''s daughter and his dragon slayer the Iskari, is betrothed to the cruel commandant Jarek - the betrothal binds
  her to the villain, not to her lover. Her love interest is Torwin, a slave owned by Jarek and held under the crown she
  serves (talknerdybookblog.com 2017-11-09; BCCB review doi.org/10.1353/bcc.2017.0766). Walk: Fantasy realms > Romantasy >
  Enemies-to-lovers romantasy (the pair start on opposed sides of their own realm, not tied together by an imposed bond) >
  Crown enemies romantasy (she is the crown''s own instrument) > Crown-slave romantasy (he is the crown''s held slave; the
  bondage is the wall). Sources: reviews and author site; not read.'

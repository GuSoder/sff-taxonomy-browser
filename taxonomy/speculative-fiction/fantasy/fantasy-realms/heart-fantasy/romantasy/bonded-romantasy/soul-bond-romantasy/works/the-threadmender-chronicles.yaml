placement_rationale: '# The Threadmender Chronicles: MC06610-612

  25 November 2026


  ## Decision and scope

  One Glaes fiction, two published novels: House of Blight (8 April 2025) and Manor of Decay (7 July 2026 US, 18 August UK).
  Place Soul bond romantasy, 8 to 9. The March 2026 House paperback is not its original publication. Maiden of Silk and Thorn
  is a same-world novel about Seville Fernglove and Kara Embergrave, but current publication is 1 June 2027. It is not included
  as a published book or separate card; recheck arranged for that date. No connection to the author''s Beast Charmer/Guild
  of Night worlds established, so none inferred from authorship.


  ## Whole-fiction evidence and disagreement

  Hidden healer Edira Brillwyn sacrifices her own lifethreads whenever she heals. When both brothers contract Blight, she
  accepts immortal Orin Fernglove''s bargain: he keeps them alive while she works for a cure at his house. The dangerous family
  and Orin''s apparent kindness create a Gothic false-love-interest plot. Rorik is her trainer and a prisoner of his brother''s
  evervow, not a separate enemy nation''s warrior. At the first novel''s climax she heartbonds with Rorik, combines their
  magic, kills Orin and apparently cures the Blight. It returns in the second novel. Edira has little life left; Rorik refuses
  to save himself at her cost, while rival Ever families seek her power. Her learning to use their bond and their mutual choice
  to survive govern the continuation, with Death''s ancient grudge behind the illness.


  Library Journal calls the completed duology family-centered slow-burn romance and explicitly describes the forced heartbond.
  Just Geeking By read both novels and, despite disliking the sequel, says it shifts decisively toward Edira/Rorik''s yearning
  and relationship. This is useful evidence against choosing only the first book''s Gothic opening. All About Romance calls
  the first book fantasy with romantic elements rather than full fantasy romance, a genuine contrary emphasis retained here.
  The second book and whole-duology review tip the overall spine toward Romantasy, not a claim that every reviewer treats
  volume one alike.


  ## Full root-down walk

  Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Romantasy > Bonded romantasy > Soul bond romantasy.


  Fantasy: real threadmending, immortal Evers, magic vows, glamours, heartbonds and embodied Death. Calling Blight a virus
  does not supply scientific reduction of those marvels. No basis for an SF or ambiguous-supernatural placement.


  Setting: author explicitly names an invented fantasy world, Glaes; no Earth-origin history or portal crossing is established.
  Fantasy realms, not Real earth fantasy. Manor imagery and recognizable European social furniture do not turn it into Historical
  fantasy or Plague fantasy''s Earth-era shelf. Healing costs years of life, not literal travel through history; no temporal/reality-authorship
  event found in included novels to override this route.


  Realms: Gothic realms is the strongest rival. The first novel supplies confinement, beautiful predators, bodily rot, inherited
  bargains and an uncanny great house. The author cites Dorian Gray, Death''s Messengers and The Masque of the Red Death.
  Within Gothic, Dark realms/Godforsaken realms would capture Death''s curse better than Haunted realms (no ruling ghost enclosure)
  or Hungry realms (the everlasting families exploit healers, but the source is Death''s curse, not feeding as the principal
  horror). Isolationist fantasy would overstate a sealed society; Technomancy would confuse a costed magical system with technological
  organization; occult detection is not the pair''s vocation. These are meaningful alternatives, not dismissed by the publisher''s
  romantasy tag. However the completed duology makes a human/immortal relationship, its magical union, conflict over sacrifice,
  and eventual choice of each other co-equal with ending the Blight. Heart fantasy wins over the menace register. Epic, Far
  shores, Heritage, fairytale revision, Comic realms and action-forward Sword and Sorcery do not better describe that whole
  reading experience. The presence of one powerful healer does not alone make mage-hero training the spine.


  Heart: Romantasy, not Cozy (abuse, captivity, mortal risk and court predation are not low-stakes communal repair) or Horse
  (no horse bond). The author calls this a Gothic romantasy duology; Library Journal independently verifies the relationship
  focus through its end. Romance is not inferred solely from a retailer category.


  Romantasy: Enemies-to-lovers is publisher trope language and a real rival because Edira fears Evers and Rorik initially
  behaves harshly. But they are not opposing rulers, nations, professions or political causes whose divide is the continuing
  wall. Friends-to-lovers has no established equal friendship at the outset, Second chance has no prior lost relationship,
  and Polyamorous is not a false-love-interest triangle. The material, continuing tie after the first climax is an imposed
  magical heartbond; volume two is substantially the pair learning to live with its powers and cost. Bonded romantasy fits
  the whole fiction.


  Bonded: Soul bond, because their actual bodily/magical heartbond makes one partner''s power accessible to the other and
  gives the sequel both its intimacy and survival problem. Bargain bond is tempting from the first blurb, but the initial
  healing contract is with Orin, the false love interest, not the eventual pair. Do not assign the whole duology by that decoy.
  Duty bond/Sworn duty is also real: Orin assigns Rorik to train Edira and both want the cure. Yet removing the shared assignment
  does not remove the later heartbond or the pair''s emotional/power problem; removing the heartbond does. The bond occurs
  at the first book''s climax rather than on page one. This is a scope wobble, recorded rather than flattened into a claim
  of destined mates from the outset. Existing Soul bond definition does not require a page-one or fated bond. No definition
  widened or new leaf needed.


  ## Covers

  One sweep, actual contact-sheet pixels inspected. Clean Publishers Weekly House front selected (332x500) over the same larger
  EW artwork with an Entertainment Weekly corner mark; atmospheric colorful manor/forest painting, score 8. Manor''s 1200x1800
  Risingshadow front matches the Library Journal edition artwork, score 6: purple/gold illustrated heroine, hands/branches,
  more stylized than the preferred painted environment. It is nevertheless a valid flat English front. Titan/Agenda candidates
  returned unavailable image responses and were not called inspected fronts. Two-volume representative needs fiction-title
  overlay; both book fronts show their own English title. Hotlinks only, no cover bytes in the repository. No claim of a matching
  set or verified cover artist.



placement_rationale: '# World of the White Rat: whole-fiction correction

  6 November 2026


  ## Decision and scope

  Place World of the White Rat as one fiction, eight published novels, in existing Duty bond romantasy. Merge the Clocktaur
  War card in Revisionist quest fantasy and the incomplete Saint of Steel card in Paladin hero. The author explicitly places
  the three strands in one world. Current publisher pages independently identify Swordheart, Daggerbound and all four Saint
  of Steel books as White Rat fiction. This is a shared universe, not a collection of merely similar authorial settings.


  Published scope: Clockwork Boys (2017), The Wonder Engine (2018), Swordheart (2018), Paladin''s Grace (2020), Paladin''s
  Strength (2021), Paladin''s Hope (2021), Paladin''s Faith (2023), Daggerbound (2026). The author''s page is stale about
  Swordheart having one book; Hachette and Tor''s NetGalley listing confirm Daggerbound published 25 August 2026. The four
  Saint of Steel novels are published installments of a planned seven; do not count the remaining planned books. First-publication
  years are not the dates of the later print jackets selected here. Locus''s March 2018 Clockwork Boys print edition is not
  the first publication: ISFDB records November 2017 hardcover and ebook editions.


  ## Each strand''s own engine

  - Clockwork Boys and The Wonder Engine: condemned forger Slate, Caliban, Brenner and Edmund accept a dangerous mission to
  discover and stop the mechanical army. The shared coerced mission and Slate/Caliban''s growing romance both run across the
  duology. Anuket''s machinery, Slate''s past and Caliban''s trauma are real, not grounds to call all eight books paladin
  adventures. Titan''s second-volume synopsis makes attraction and the mission explicit; Locus reviews the complete two-volume
  story.

  - Swordheart: Halla''s inheritance and coercive relatives set her on a journey for legal help with sword-bound Sarkis. Protecting
  her, recovering her freedom and negotiating his coerced service intertwine with their romance. Reactor''s completed review
  grounds the autonomy and romance reading. The sword curse is a substantial Magic bond rival.

  - Paladin''s Grace: Stephen''s dead god has left him broken; Grace is a perfumer with her own wounds. Rescue and a murder/poisoning
  mystery throw them together. Locus calls it a fantasy romance and discusses the couple''s emotional arc, not merely a cover
  blurb.

  - Paladin''s Strength: Istvhan''s escort and clay-head investigation join Clara''s search for her kidnapped werebear sisters.
  Shared travel and attraction lead to an arena rescue and clay-head confrontation. Locus''s completed review supplies the
  rescue climax and judges it fantasy romantic adventure with sword-and-sorcery action.

  - Paladin''s Hope: Galen and lich-doctor Piper are pushed into a corpse investigation by gnole constable Earstripe. The
  murder maze puts protection and trust under pressure. Locus explicitly calls it a fantasy romance at its core and treats
  the pair and the paladins'' lost purpose together.

  - Paladin''s Faith: Shane protects spy Marguerite during her dangerous work involving an artificer''s device, court and
  demon cult. Attraction and their incompatible habits run alongside the protection/espionage plot. Both the author/publisher
  description and Locus''s finished review cover this book itself.

  - Daggerbound: transporting a relic brings Edmund into contact with sword-bound Dervish; an attack triggers the sword and
  its compulsory service. Edmund then seeks a way to release him. Publisher copy and completed advance-reader accounts on
  NetGalley ground the road adventure and romance. This is the second strong curse-bond straddle, not evidence that the other
  six lovers are magically bound.


  ## Root-down walk

  Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Romantasy > Bonded romantasy > Duty bond romantasy.


  Fantasy is positive: gods, demonic possession, magical creatures and sword curses are actual causes, not advanced technology
  or explained-away tricks. The Clockwork Boys'' artificial soldiers do not make the whole universe science fiction. These
  are internally invented lands, not Earth or Earth-to-otherworld crossings.


  At Fantasy realms, the recurring romantic bond is the whole fiction''s strongest governing engine. Heart fantasy wins over
  Epic fantasy''s large-scale worldbuilding and Sword and Sorcery''s intimate action. The duology has a war-stopping mission,
  but the other books'' murder, protection and rescue adventures do not make armies/campaigns the whole universe''s story.
  Warmth and humor are real but neither safety nor jokes govern the whole: murders, captivity, trauma, combat and mortal jeopardy
  materially shape the romances. No identifiable fairy-tale source is revised across all eight, no non-Western counterpart
  culture is the point, no horse bond is the spine, and Gothic menace is a texture rather than the whole fiction''s register.


  At Epic, considered as the strongest rival: Heroic''s power-source classes cannot honestly make this whole universe a paladin
  fiction. Forger Slate, Halla, Edmund, perfumer Grace, Piper and Marguerite matter as protagonists, not background to seven
  paladins. High/Revisionist describes the coerced Clocktaur quest well, but does not cover all the later relationship-led
  mysteries and protection stories. Political power, hard scientific magic, invented myth itself and military ranks each capture
  some furniture, not the whole eight''s organizing engine. No existing gate was widened to accommodate the universe.


  At Heart, romantic arcs are coequal with external dangers across all three strands. The primary author''s fantasy-romance
  grouping is corroborated by completed critical reviews, not used alone as a genre verdict. At Romantasy, Bonded wins: the
  couples are thrown together by missions, investigations, protection or rescue. They are not consistently on opposed sides.
  Discomfort, trauma, misunderstanding or the Dervish''s resentment of all wielders are not enough to call the whole universe
  Enemies-to-lovers.


  At Bonded, Duty is the least-distorting whole-fiction fit: a shared task brings the pair together and the romance develops
  through it. Soul bond would falsely imply an innate paired magical/soul tie. Bargain bond''s Court child would falsely impose
  an arranged or diplomatic match. Its Magic child is the strongest wobble because Swordheart and Daggerbound genuinely contain
  imposed sword curses. But those curses are not present between the lovers in the four Saint of Steel novels, and the Clocktaur
  mission is a joint assignment, not a supernatural lover''s claim. The broad shared-task engine remains positive across the
  whole. Do not split the shared universe to make the two sword books cleaner fits.


  ## Tree effect and authority

  Live pre-change census read directly from the deployed application: Revisionist quest fantasy 10, Paladin hero 4, Duty bond
  romantasy 8. Merge removes one card from each former leaf and adds one to Duty: 9, 3, 9 respectively. This corrects a duplicate
  in the leaf currently being inspected for its split. Revisionist therefore no longer has ten distinct whole fictions and
  its split trigger falls away. No new genre, umbrella, portrait or definition change is executed. No next intake row is processed
  during the correction.


  Authority is Gustav''s original message phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX, retrieved directly: he trusts judgment on single
  books/fictions and a shared universe is one fiction. His intake/split instruction phonemsg-01M43MYMGAMQTNA3CY402KK7FB was
  also reread. Project-file assertions of older structural approvals are not used as permission. Prior card records and placement
  histories are preserved in the merged card.


  ## Covers and uncertainty

  All eight distinct flat English print fronts inspected as pixels. Replaced inherited Clockwork Boys cover because it visibly
  said AUDIOBOOK / MP3 AUDIO despite its earlier metadata. Used publisher/distributor print jackets for the two Clocktaur
  books and current Hachette print jackets for the six others. Later-edition jackets are intentional; not claimed first editions.
  Publisher/distributor source and exact image URLs are recorded alongside the card. Titan''s image host did not return usable
  image bytes to the direct downloader; Simon & Schuster''s distributor jacket for the same print edition did. No account,
  sign-in, captcha or website mutation involved in retrieving them.


  Caveats: Duty versus Magic is a real whole-universe straddle, not a perfect uniform trope. Daggerbound''s detailed completed-reader
  evidence is less editorially independent than Locus/Reactor coverage of the earlier books. Saint of Steel remains unfinished.
  This correction makes no claim that every other Revisionist card already has complete scope: Goredd and After the War gaps
  were separately reported and are not silently treated as fixed.



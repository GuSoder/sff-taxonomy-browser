placement_rationale: 'Root-down: Fantasy > Fantasy realms > Heart fantasy > Romantasy > Bonded romantasy > Duty bond romantasy.
  Per Demi Winters'' site and Penguin Random House: a Viking-inspired invented world (the Kingdom of Iseldur), and the author''s
  press page calls the series romantasy. In The Road of Bones Silla must travel a thousand-mile road to Kopa and hides in
  the Bloodaxe Crew''s wagon, so the romance grows on the road to finishing one task; Kingdom of Claw and Dawn of the North
  continue it. Soft: the site speaks of a ''forbidden romance'', so the tie is a shared journey rather than a deal; Kingdom
  of Claw keeps the pair in hiding together. Roots of Darkness is a novella and Embers of Chaos is unreleased (PRH lists it
  for 18 May 2027), so neither is carded.'

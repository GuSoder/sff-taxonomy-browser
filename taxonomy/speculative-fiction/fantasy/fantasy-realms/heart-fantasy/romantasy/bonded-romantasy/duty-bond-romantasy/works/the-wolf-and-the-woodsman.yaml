  it a slow-burn love story. Evike, a pagan wolf-girl, is sent to the king''s Woodsmen, and the captain turns out to be the
  king''s disgraced heir; they must band together to find the turul and reach the capital alive, so the romance grows on the
  road to one task. Soft: it starts from hostility and persecution, so Enemy lines romantasy is the runner-up. Cover carries
  a small review quote; no clean edition found. The Deluxe Collector''s Edition row is the same book.'

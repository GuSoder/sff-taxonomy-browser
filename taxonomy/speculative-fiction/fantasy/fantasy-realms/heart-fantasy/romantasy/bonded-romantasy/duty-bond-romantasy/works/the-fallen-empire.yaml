placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Romantasy > Bonded romantasy. One shared
  universe, the Krael Empire, whose iron rule is broken by ''three women, and the men devoted to them'' (author''s series
  page; PRH series ''The Fallen Empire''), so one fiction (rule 11j). Secondary-world fantasy with the romance co-equal with
  the fight against the empire. Book 1, Phoenix Unbound, opens with the gladiator Azarion blackmailing the fire-and-illusion
  witch Gilene into helping him escape slavery, a pair tied together by something imposed; Dragon Unleashed pairs a draga
  shapeshifter with an earth-witch trader against the empress; Raven Unveiled pairs a ghost-speaker with the assassin sworn
  to kill her, who must become allies. Rejected: Enemy lines romantasy and Rivals to lovers (only the third book starts as
  a personal enmity, the first starts as a blackmail pact), Crown enemies (the empress is the antagonist, not a lover). Wobble:
  strong; the three couples do not start the same way and the leaf''s imposed-tie test fits book 1 best, with the shared duty
  of breaking the empire carrying the others. Sources: author''s page and PRH blurbs only.'

placement_rationale: 'Elise Kova''s Arcana Academy (2025; with Prince of Swords 2026; elisekova.com, Penguin Random House):
  Clara Graysword is sentenced to life in prison for inking tarot cards; the academy headmaster Prince Kaelis offers her
  escape for a price - she serves his plan and poses at the academy as his bride-to-be. The pair is bound by a deal with
  terms, and she lives under the sentence it suspends. Walk: Fantasy realms > Romantasy > Bonded romantasy > Bargain bond
  romantasy (the tie is a deal or a sentence). Rejected: Crown enemies (they start tied by the deal, not set against each
  other), Duty bond (no shared quest is the tie; the bargain is). Standalone series card. Sources: author site and PRH; not
  read in full.'

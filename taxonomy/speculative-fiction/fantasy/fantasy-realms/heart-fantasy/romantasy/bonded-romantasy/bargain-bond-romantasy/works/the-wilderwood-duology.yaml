placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Romantasy > Bonded romantasy > Bargain bond
  romantasy. Whitten''s Wilderwood duology, one setting and one pair of books (For the Wolf and For the Throne, Orbit, 2021),
  so one fiction (rule 11j): Red is the second-born daughter sacrificed to the Wolf in the Wilderwood, a Red Riding Hood and
  Beauty and the Beast retelling in which the romance with the Wolf runs through the dark-forest plot (Hachette/Orbit pages,
  publisher copy from the earlier walk). Rejected: Fairytale expansion (runner-up, at 9: the retelling frame, but the romance
  is the spine), Godforsaken realms (5; the forest''s god-torn land, again not the spine), Fairytale transplant (9; no modern-world
  move). Wobble: moderate. The sacrifice-and-bargain tie fits Bargain bond, but a Beauty and the Beast retelling could also
  be filed as retold fairy tale. Plot from publisher copy, not the books. Year 2021 (Hachette). Covers: the Orbit jackets
  for both books. Queue ids MC03672, MC03673, MC03677.'

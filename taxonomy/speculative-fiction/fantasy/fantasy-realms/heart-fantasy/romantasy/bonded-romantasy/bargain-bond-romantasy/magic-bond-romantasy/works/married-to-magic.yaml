placement_note: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Romantasy > Bonded romantasy > Bargain bond romantasy. Shared-universe standalone romances, each pairing a young woman with a magical lord she is bound to by an imposed arrangement - Luella wed to the Elf King as the century''s Human Queen, Katriane married off to the Fae Prince, Floriane bound to the Vampire Lord by a blood vow, Arya bargained to the Siren Duke, Rosalina to the Wolf Knight; the tie is a deal or sentence, not a magic soul-bond (author''s series page: "stand alone novels about young women and their unexpected romances with magical men"). Series of five (covers read "a Married to Magic novel"): A Deal with the Elf King (2020), A Dance with the Fae Prince (2021), A Duel with the Vampire Lord (2022), A Duet with the Siren Duke (2023), A Dawn with the Wolf Knight (2024).'

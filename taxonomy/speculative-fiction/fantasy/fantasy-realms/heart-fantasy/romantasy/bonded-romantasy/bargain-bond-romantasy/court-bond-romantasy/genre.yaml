definition: 'Bargain bond romantasy in which the imposed tie answers to mortal courts and their law: an arranged marriage,
  a forced diplomatic match, a prince''s bargain enforced by crown and contract. The lovers must live inside what the
  court decreed. Not Magic bond romantasy (the tie answers to a supernatural power''s claim, bargain or curse); magical
  nobles are Court bond when the marriage is enforced by law.'

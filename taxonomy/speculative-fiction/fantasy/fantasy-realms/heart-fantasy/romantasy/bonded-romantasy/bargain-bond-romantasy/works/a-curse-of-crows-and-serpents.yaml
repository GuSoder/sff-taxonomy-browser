placement_rationale: 'Lauren Dedroog''s A Curse of Crows (Gollancz, 2024) and sequel A Dance of Serpents (Crows & Serpents
  duology; Hachette UK, author site, reviews): Diana, a mortal seer whose prayers reach the gods, is sickened by a curse and
  strikes a desperate bargain with the god Keres; the deal draws her into the realm of the gods, a vengeance plot against
  its Divine King Eiran, and romances with Keres and others. Walk: Speculative fiction > Fantasy > Fantasy realms > Romantasy
  (romance co-equal with the stakes; secondary world) > Bonded romantasy (the pair are tied) > Bargain bond (the tie is a
  deal with a god, a bargain with terms). Rejected: Soul-bond (no mate bond), Duty-bond (the deal is not a shared task), Enemies-to-lovers
  leaves (Aedlynn/spy thread is a side line; Diana-Keres is bargain-first). Wobble: medium; reviews say the romantic endgame
  shifts across volumes and the cast is large. Folded two volumes into one card (shared universe). Sources: publisher blurbs
  and reviews, not read in full.'

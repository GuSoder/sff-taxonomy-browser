placement_rationale: 'Liv Zander''s Heartstring Duet (Crown Me Dead, Crown Me Yours; Ink Heart Publishing paperbacks
  April 2026, Amazon product specs; the author''s site livzander.com lists Crown Me Dead as new release - SuperSummary''s
  ''(2024)'' is wrong). Elara, a gravedigger in the rot-ravaged kingdom of Issoria, takes a bargain from the king''s
  steward Vale - seduce the dying King Kael, become his queen, and be sacrificed to the cursed crown that feeds
  on queens - to save her brother. Vale is Death himself, the curse''s maker; book two has Elara, crowned in Kael''s
  blood, hunting Death to break the curse (''I need Death, on his knees, a ring on his finger'' - Goodreads book
  description). Walk: Speculative fiction > Fantasy (a curse, a crown forged with a heartstring torn from Death,
  Death personified) > Fantasy realms (invented kingdom of Issoria) > Heart fantasy (the love story is the spine:
  villain romance, marketed as ''A Dark Fantasy Romance'') > Romantasy > Bonded romantasy (the pair are tied by
  an imposed tie - the bargain and the curse - not set on opposed sides) > Bargain bond romantasy (a deal or sentence:
  marriage, bargain, curse, sacrifice - all four literally) > Magic bond romantasy (the tie answers to a supernatural
  power: Death''s own bargain and the crown''s curse, not a mortal court''s law). Rejected: Enemies-to-lovers romantasy
  and its crown children (Elara is not the crown''s condemned, a rival crown''s servant, or a peer in a feud; she
  is a bargained bride), Court bond romantasy (no mortal-law arranged marriage; the bond is Death''s claim), Soul
  bond romantasy (no innate bond in the blood), Polyamorous romantasy (one romance across the duet, whatever its
  two faces). Wobble: low-medium; Goodreads shelves it ''enemies to lovers'' and book two courts Death himself,
  but the imposed bargain/curse - not enmity - is the tie that drives both books. One fiction, one card (11j); queue
  rows MC06085-86 are the duet''s two books. THIS IS THE TENTH CARD: magic-bond-romantasy freezes and a split is
  served. Sources: supersummary.com plot summary, Goodreads book pages, Amazon product specs, livzander.com.'

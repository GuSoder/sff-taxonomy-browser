placement_rationale: '# The Wicked Sea: whole-fiction decision

  6 November 2026, MC04932. One currently published novel, April7 2026; planned sequel The Vengeful Tide October2027 not counted.
  Author''s FAQ explicitly says different world from Bitten. No merger of author output. Verdict: Magic bond romantasy7->8,
  with a real Soul bond / Enemy lines / Crown-outlaw wobble. No gate changes.


  Speculative fiction > Fantasy: magic, mermaid transformations, warlock powers and a death god''s artifact are literal, not
  scientific speculation. Fantasy realms: author explicitly created4continents/4seas, merrow-human divisions, Mortia and lost
  undersea kingdom. Not Real earth or Earth-inclusive Portal; no actual Earth origin/exchange evidenced.


  Realms alternatives: Epic is tempting for artifact quest/gods/geography, but this is an intimate two-survivor romance rather
  than the world''s war, politics, cosmology or rigorous magic as central subject. Sword and sorcery is the strongest external-action
  rival: creator calls it heist/adventure, Mummy/Pirates/Ocean''s11 influences, shifting alliances. Yet the pair''s changing
  trust/desire through the imposed tie is coequal spine, attested by favorable and unfavorable completed reviews, not merely
  Romantasy branding. Not Pirate fantasy solely for ships/sea; a god-heart retrieval is not piracy as life. Caper''s retrieval
  is a mission inside the central romance, not enough to suppress that arc. Fairytale fantasy: mermaid on land is Little Mermaid
  furniture, but no deliberate named fairy-tale revision evidenced; invented merrow culture and survival quest alone are not
  inherited tale structure. Gothic realms has serious torment/gore/captivity, but the menace is not the whole organizing experience;
  creator''s hopeful-adventure framing and reviews'' romance/quest balance beat it. Far shores fails culture-counterpart-aboutness;
  no verified non-Western cultural reworking. Comic realms fails comedy/satire as governing plot; banter is relief/character
  interaction, not farce. Heart fantasy wins romantic bond-as-spine; Cozy fails peril/gore, Horse fails bond species.


  Romantasy: strong modern publishing cluster plus relational trust/desire coequal with quest. Enemies-to-lovers is genuine,
  not denied: her merrow kind is slaughtered by his warlock institution; he condemns her, both despise each other. Crown-outlaw
  is a real near miss (king''s warlock/condemned mermaid); Enemy lines also for species conflict. But their ongoing relationship
  begins within a binding supernatural bargain rather than remaining separated by the divide: help find death god''s heart,
  he spares her life, tether entangles their souls/desires. Neither peer-rival nor rival royal-house affiliation is evidenced;
  no invented royal identity to force a later twist into a shelf.


  Bonded: imposed tie rather than freely chosen partnership. Duty bond is a rival because shared artifact quest, but mere
  duty does not explain magically enforced terms and emotional tether. Court bond fails mortal law/arranged marriage: warlock
  condemning her is origin context, not what enforces their ongoing bargain. Soul bond is the closest rival: souls are entangled
  and they feel each other''s desires. However Magic bond''s explicit Not-line distinguishes innate magic-in-blood from an
  imposed outside claim. This tether is born from the survival bargain, not an innate mate bond. Magic bond''s positive gate
  explicitly includes a crossroads bargain sealed by magic. Place there without changing either definition. Source evidence
  does not establish a later innate mate bond overriding the bargain, so don''t invent one. Moderate wobble, not no-wobble
  label matching.


  Caveats: sources disagree on how convincingly romance develops; this affects quality, not existence. Completed Dini and
  Starcrossed ARC reviews plus PlotTwisted physical completed review are reader/blog evidence, not trade critics. Author interview
  confirms trauma/survival motives, adventure and sequel. Readalong week2 supplies concrete emotional tether detail but is
  partial, not counted as a completed review. Sequel may shift engine and needs whole-fiction reassessment when published.
  Hachette ebook page shares print image and links Hardcover format; the flat English front inspected is normal print jacket
  artwork, not audio,3D or specialedges mockup. No separate art generated.

  '

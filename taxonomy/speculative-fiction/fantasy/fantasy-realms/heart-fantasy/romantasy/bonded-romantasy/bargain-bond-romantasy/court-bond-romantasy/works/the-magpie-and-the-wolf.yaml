first_published: 2025
canonical_genre: court-bond-romantasy
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Romantasy > Bonded romantasy > Bargain
  bond romantasy > Court bond romantasy.


  Scope: one completed Magpie and the Wolf duology, Soulgazer (8 July 2025) and Wolftamer (25 August 2026), Maggie Rapier.
  Both original Ace publication dates and the two-book conclusion are explicit in current publisher pages; current series
  bibliography independently lists two primary works. No unpublished third novel, earlier rejected YA manuscript or unrelated
  fiction folded into this world. Completed sequel criticism confirms the couple''s HEA and external conflict''s conclusion,
  with repeated criticism of rushed resolution retained. This analysis reads author statements and completed reviews, not
  the full two novels.


  Root and setting: soulstones trap the dead, inherited/awakened soul sight and dangerous magic, murdered gods and relics
  operate supernaturally, not as scientific technology. Fantasy rather than SF/Science fantasy. Despite Celtic/Irish vocabulary
  and one review casually calling Saoirse an Irish princess, the primary descriptions and completed accounts describe invented
  islands, kingdoms and a sea shaped by slaughtered gods. No Earth geography, historical period or Earth crossing is established.
  Therefore Fantasy realms, not Real earth fantasy > Historical fantasy > Celtic fantasy, and not Portal fantasy. Mythic inspiration
  is not proof of historical Ireland. The portal rule requires Earth, absent here.


  At Fantasy realms: Heart fantasy wins on the actual two-book engine. The bargain marriage begins the central relationship;
  trauma and growing trust accompany the voyage; the first ending''s sacrifice overturns the marriage''s apparent promise
  of freedom; the second book''s competing wishes for love, freedom and obligation dominate both viewpoints until the couple''s
  shared future resolves. The author explicitly calls the first a marriage-of-convenience slow burn and says the sequel strips
  away the couple''s old dynamic and forced proximity to challenge his identity. Multiple completed sequel critics favor the
  romance even when they dislike his resentment, slow opening or rushed end. This is not classification by jacket word or
  pirate imagery. External pursuit, soul magic and relics are coequal stakes, consistent with the current Romantasy definition.


  Heart siblings: Cozy fantasy fails because safety and everyday comfort do not govern abuse, suppression, violent pursuit
  and world-threatening relic conflict. Found family among the crew is substantial but not a low-intensity comfort premise.
  Horse fantasy fails because no horse bond carries the plot.


  Genuine alternate branch: Sword and sorcery > Pirate fantasy. The first novel is a seafaring search with a charismatic captain/privateer,
  loyal crew, storms, underwater dangers and magical ship. The sequel includes another voyage, a relic hunt and sea-monster
  action. This is a real runner-up, not rejected because adventure is absent. However, the second begins with the ship destroyed
  and the couple''s island-bound marriage under strain; whether love can survive new roles supplies much of its conflict,
  and the emotional resolution is a major final payoff. Pirate craft/crew/sea adventure alone does not encompass the whole
  duology as precisely. Caper lacks a governing heist, Tournament lacks a formal competition, Technofantasy lacks machinery
  as central engine, Sword and planet lacks planetary romance. Classic S&S lineage is less specific than the explicit two-book
  romantic design.


  Epic rivals: Quest fantasy is substantial in both island search and relic retrieval but is subordinate to this pair''s freedom,
  sacrifice and relationship, not one inherited fellowship/chosen-one quest template across both. Political fantasy has marriages
  among crowns, dynastic coercion, the Ring of Stars, a dangerous king and island duties; the central couple are not chiefly
  pursuing rule/statecraft as the governing story. Military fantasy lacks sustained armies/campaign units. Heroic fantasy
  > Caster heroes > Mage hero > Black Mages > Necromancer honestly recognizes Saoirse seeing/touching/releasing souls; direct
  death-related magic is not generic Grey sorcery. Yet magical craft/power progression is not a stronger whole-fiction spine
  than the marriage and its emotional terms. Faolan''s maritime skill does not convert Saoirse into a martial or half-caster
  heroine, nor is a god-derived heritage alone a Cleric service office. Hard fantasy requires systematic rules/costs to govern;
  reviewers disagree about clarity and several find the magic vague. Soulstone costs and bargains matter, but not a technical
  Hard magic narrative or Time magic domain. Mythological fantasy recognizes gods, island creation and inherited power, but
  this is a living lovers'' story, not myth-history or retelling of gods as protagonists.


  Other Fantasy realms branches: Fairytale fantasy lacks a particular revised tale or governing fairy-tale task grammar; Far
  shores culture branches are not an Irish-history substitute and no corresponding non-Western cultural about-ness is established.
  Comic fantasy fails because banter or a hostile critic''s accidental-camp reading is not governing parody/satire. Gothic
  realms has real confinement, death and oppressive power at the beginning, but the duology''s adventure and tender relationship,
  not a dread/haunting/isolation premise, govern. No occult-detective investigation, haunted technological craft or Pax Britannica
  social-code engine. Mythic Celtic inspiration is not a newly licensed direct genre here.


  Romantasy branch walk: the principal lovers are not competing for a prize, living an inherited personal feud, enemy crown''s
  servants or opponents across a war/coven line. Their sniping and initial mistrust are real, and one completed reviewer uses
  enemies-to-lovers, but the imposed marriage bargain, not enmity, is what makes them partners. The cruel Stone King is the
  escaped betrothed and antagonist, not the beloved: do not misfile the story by the marriage that does not happen. Existing
  friends becoming lovers and a lost former lover re-wooed are not the premise; no polyamorous central love arc. Bonded romantasy
  is the correct start condition because circumstances force a marriage bargain rather than an unencumbered courtship.


  Within Bonded: Bargain bond romantasy is more exact than Duty bond. They do share an island quest and later sovereign/relic
  duties, but the explicit term before sailing is that Faolan must marry Saoirse so her father''s intended political marriage
  cannot claim her. The story repeatedly tests what this ostensibly nominal marriage means. Self-negotiating the bargain under
  political coercion does not make it a prior romantic choice; the branch already includes comparable escape-through-marriage
  fiction. Chance duty/sworn duty capture travel or later obligation, not the primary relationship tie.


  Soul bond romantasy is a genuine mechanism check because both protagonists have soul-related magic and Faolan has old bargains.
  However, the sources do not establish an innate mate/blood/soul bond between these two bodies as the basis of their romance.
  Soulstones contain dead souls, not evidence of a fated-mate tie. Do not substitute the word soul in the title for the actual
  gate.


  Bargain split: Court bond over Magic bond. This marriage protects a princess from an unwanted royal match, is performed
  by Faolan''s queen and is understood by completed accounts as marriage of convenience whose public status matters. Their
  own soul magic, Faolan''s older life debt, the first ending''s island oath and the sequel''s relic demands are not ignored,
  but none establishes that the initial marriage is a god/fae/monster''s imposed price rather than a political/legal protection
  bargain. The current Court definition explicitly allows magical nobles when law enforces the marriage. Bride bond would
  require the beloved heroine herself as payment to a supernatural claimant; Faolan is not that claimant. Curse bond would
  require the pair''s governing tie to be a supernatural bargain demanding a deed. The later island obligation is a strong
  rival texture, but the lovers begin married under a negotiated mortal political bargain and the sequel works out the consequences
  of that same marriage. No source claims absence of every magical oath or ritual; the classification distinguishes what enforces
  the central marriage. Moderate confidence retained on this boundary.


  Completed-content check: first novel begins with suppression, arranged royal betrothal and escape. A queen performs the
  protective handfasting; the couple''s search for the lost island and the truth of her soul power reaches a first-book conclusion,
  not complete freedom. At the sequel opening Saoirse is queen/guardian on the Isle of Lost Souls, obliged to free souls from
  stones; Faolan''s destroyed ship and new consort role undo his old identity. They separate for missions involving an alchemist
  and old godly relics, while Maccus pursues dangerous power. Completed accounts reach reunion in a major battle, resolution
  of magical/political stakes, an epilogue and the couple''s HEA. Fine final mechanism is not reconstructed from praise. Critics
  repeatedly find the opening slow, his resentment repetitive, lore uneven and the final resolution hurried; one community
  review specifically questions the late betrayal. Those reactions are retained rather than turning favorable reviews into
  unanimity. DNF and anticipation-only posts are not ending evidence. Author query is a historical draft-stage account and
  not used to overrule published-book details. No generic automated plot-summary site is used as decisive evidence.


  Decision: place one two-novel Magpie and the Wolf fiction into existing Court bond romantasy, four to five, moderate confidence.
  Pirate fantasy is the strong whole-form runner-up; Curse bond is the closest supernatural-terms rival. No new leaf, definition
  change, portrait or structural question is needed. Choice is content-based, not count-based. Both English publisher fronts
  inspected in a two-cover proof; original years 2025/2026 are from publication records, not cover editions. Entrusted individual-fiction
  judgment and standing intake are grounded in original owner messages phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX and phonemsg-01M43MYMGAMQTNA3CY402KK7FB.
  Validate live duplicate/capacity state before placement, then repository/app parity, deployment and live pixel QA before
  closeout.

  '

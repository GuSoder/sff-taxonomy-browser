definition: 'Bargain bond romantasy in which the imposed tie answers to a supernatural power: a god''s or fae''s or
  monster''s claim, a crossroads bargain sealed by magic, a prophecy or a curse that binds the lovers. The lovers must live
  inside what magic holds them to. Not Court bond romantasy (the tie is a court''s law: arranged or diplomatic marriage, a
  mortal prince''s bargain), not Soul bond romantasy (the bond is innate magic in the blood between the lovers, not an
  imposed claim from outside the pair).'
status: provisional
ruling: 'Split of Bargain bond romantasy at ten cards by what enforces the tie - a court''s law or an imposed magic claim

definition: 'Bargain bond romantasy in which the imposed tie answers to a supernatural power: a god''s or fae''s
  or monster''s claim, a crossroads bargain sealed by magic, a prophecy or a curse that binds the lovers. The lovers
  must live inside what magic holds them to. Not Court bond romantasy (the tie is a court''s law: arranged or diplomatic
  marriage, a mortal prince''s bargain), not Soul bond romantasy (the bond is innate magic in the blood between
  the lovers, not an imposed claim from outside the pair). Umbrella since 2026-11-19, partitioned by what the bargain
  takes as its price: Bride bond romantasy (the heroine herself, wed or sacrificed to the power) and Curse bond
  romantasy (a deed the bound pair must perform).'
status: umbrella

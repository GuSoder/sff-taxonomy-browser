placement_rationale: 'Logan Karlie''s Shadow Weavers Duology (Dream by the Shadows, Christy Ottaviano Books August 2025, self-pub
  origin 2023; Cursed by the Dawn, August 2026; the author''s newsletter of August 4 2026 declares the duology ''Officially
  Complete'' - bibliography check current). In the Kingdom of Noctis, dreams carry the Corruption, a soul-stealing curse;
  Esmer Havenfall loses her sister and mother to it after skipping the protective elixir, and is drawn into the Dream Realm
  and to the Shadow Bringer (Erebus), the imprisoned shadow being who first tries to take her soul to escape his five-hundred-year
  tomb. Then the higher power Somnus binds the pair to an oath-bound quest: confront three dream trials to lift the curse
  binding both their worlds (booksthatslay.com full summary; recapandruin.com; thecosmiccircus.com review). Walk: Speculative
  fiction > Fantasy (dream magic, demons, weavers) > Fantasy realms (invented Noctis and its Dream Realm) > Heart fantasy
  (the Esmer-Erebus romance is co-spine: ''NYT bestselling YA romantasy'', Hachette series page; ''Beauty and the Beast meets
  Labyrinth'', author''s own pitch) > Romantasy > Bonded romantasy (the pair are tied by an imposed tie: his soul-theft attempt
  becomes Somnus''s oath binding them together) > Bargain bond romantasy (a sentence with terms: the oath-bound quest) > Magic
  bond romantasy (the oath answers to a supernatural power: Somnus and the dream curse) > Curse bond romantasy (the price
  is deeds: three dream trials to lift the curse). Rejected: Enemies-to-lovers branch (retailer copy calls it ''enemies-to-lovers
  fantasy'' and book one opens adversarial, but the duology''s engine is the imposed oath and the trials, not a war line or
  a throne), Gothic realms (dread is the register, not the engine - The Wicked Sea precedent: menace is not the whole organizing
  experience), Fairytale quests (comps, not an inherited tale structure). Wobble: medium - the enemies-to-lovers marketing
  and book one''s first half pull that way; the oath-bound curse-lift is what the duology lives inside. One fiction, one card
  (11j); queue rows MC06101 (Cursed by the Dawn) and MC06102 (Dream by the Shadows). Sources: logankarlie.com, hbgacademic.com,
  hachette series pages, booksthatslay.com, recapandruin.com, thecosmiccircus.com, commonsensemedia.org.'

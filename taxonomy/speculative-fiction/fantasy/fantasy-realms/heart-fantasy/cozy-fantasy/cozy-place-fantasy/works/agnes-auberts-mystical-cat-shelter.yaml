placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Cozy fantasy > Cozy place fantasy. In an
  alternate Montreal, Agnes Aubert runs a cat shelter, loses her building to a magical duel and moves forty-eight rescue cats
  into a cheap shop that hides a trapdoor and the Witch King as landlord (Penguin Random House; ursummary.com, billed a cozy
  historical fantasy). The comfort is a place that takes the animals in and the keeping of it, the leaf''s definition. Rejected:
  Cozy craft fantasy (she trades her organizing for cat charms but the shelter, not the work, is the story), Cozy peeps fantasy
  (a house holds it together). Wobble: moderate; the duel, the apocalypse backstory and the time-travel ending are more plot
  than the cozy leaves usually carry. Sources: publisher page, summary site. Year: 2026 (published Feb 17, 2026).'

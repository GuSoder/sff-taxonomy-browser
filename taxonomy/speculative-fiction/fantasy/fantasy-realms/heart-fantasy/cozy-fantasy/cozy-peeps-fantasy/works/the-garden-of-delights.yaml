placement_rationale: 'Fantasy Hive: the city of Sirvassa''s Garden of Delights, whose magic flowers are given to the people
  by a gentle, kind, cursed Caretaker; ''dreamy, whimsical and full of colour'', gentle melancholic prose; scroll.in: ''kindness
  is the only antidote to hate and conflict''. Comfort, care and tending govern even as the Garden''s rot threatens: cozy-fantasy.
  Bend: melancholic register, gods-war mythos (Champions and Florrals) behind the garden. Modern-invented-myth considered
  - it is secondary-world, not contemporary. Split walk 2026-10-08 (phonemsg-01M4DYQ6Z64WSG77Y8R9PKSJP9): Root-down: Speculative
  fiction > Fantasy > Fantasy realms > Cozy fantasy > Cozy peeps fantasy. A gentle, kind, cursed Caretaker gives a city its
  magic flowers and kindness is the antidote to hate (Fantasy Hive, scroll.in). WEAK CARD: melancholic prose and a gods-war
  mythos sit behind the garden, so Cozy peeps fantasy fits it by tenderness, not by lightness.'

placement_rationale: 'Root-down walk: Speculative fiction > Fantasy > Fantasy realms > Heart fantasy > Cozy fantasy > Cozy
  peeps fantasy. Halfling Pansy Underburrow and goblin Ren each believe they inherited the same cottage and strike a bargain:
  live in it together, first one driven out forfeits ownership; forced-proximity opposites-attract gentle romance, comfort-read
  register (Orbit copy: ''cozy fantasy romance, brimming with warmth''; cottagecore x goblincore). Not Cozy place fantasy:
  the cottage is a contested private home, not a house that takes people in and keeps them; not Cozy craft fantasy: no trade
  or hand-work holds the story; the closeness between the two is the story. Not romantasy: warm low-intensity cozy register
  with safety and belonging governing, not the Fourth Wing/ACOTAR spine of co-equal external stakes. Standalone debut novel
  (PW interview with Sylva, Orbit New Voices 2026); no sequel or shared universe found (author site lists this as her sole
  Orbit title).'

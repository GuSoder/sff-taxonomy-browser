placement_status: accepted
placement_rationale: |-
  Root-down: Fantasy > Cozy fantasy > Cozy peeps fantasy. Two shared-world cozy queer romantic fantasies (Homeward is "the magical world introduced in Homegrown Magic" per blurb quotes on penguinrandomhouse.com; StoryGraph: spin-off/sequel with both leads introduced in Homegrown Magic). The series-wide constant is found family and gentle romance: Homegrown Magic is "found family, rival family drama, and cozy garden magic" (jamiepacton.com), Homeward for a Spell is a ragtag adventuring party whose members "learn to work together" around a sapphic romance (penguinrandomhouse.com). Rejected: Cozy craft fantasy (the greenhouse trade holds book 1 but book 2 has no trade; the leaf needs craft as the series' comfort), Cozy place fantasy (no house/hosting engine). Wobble mild (book 1 is garden-craft-centered) RESOLVED: the cross-book engine is the people, not the work.

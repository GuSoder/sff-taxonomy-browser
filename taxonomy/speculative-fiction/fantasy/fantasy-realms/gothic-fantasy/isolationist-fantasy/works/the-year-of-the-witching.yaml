placement_rationale: 'Penguin Random House sets it in Bethel, a sealed puritanical settlement ruled by the Prophet and walled in by the forbidden Darkwood, where
  real witches, spirits and plagues break through. Bethel''s closed-off order and what lies outside it are the premise, so isolation is the governing Gothic condition,
  as with Gormenghast. Invented world, actual magic: Fantasy Realms side.'

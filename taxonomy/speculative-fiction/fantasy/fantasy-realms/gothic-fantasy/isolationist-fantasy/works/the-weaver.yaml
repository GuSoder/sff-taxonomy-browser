placement_rationale: 'Root-down: Fantasy > Fantasy realms > Gothic fantasy > Isolationist fantasy. The author explicitly describes
  an imaginary fantasy city inspired by old European cities. Its enclosed island society, ritualized Council, craft houses,
  branded and imprisoned dreamers, hidden corruption and slowly drowning architecture make the sealed city and its order the
  governing Gothic condition. Eliana protects an injured woman and uncovers the city''s secrets; rebellion is present but
  not foreign-occupier resistance, mass class uprising or a persecuted-class extraction network. Inquiry is not hired or official
  detective work. Locus identifies Gothic nightmare imagery while noting possible biopunk readings; that vocabulary does not
  override the author''s fantasy setting. Original Finnish2015; English2016 as The City of Woven Streets (UK) and The Weaver
  (US), one standalone.'

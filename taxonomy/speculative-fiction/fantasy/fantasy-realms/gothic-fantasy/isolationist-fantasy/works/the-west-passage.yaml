first_published: 2024
canonical_genre: isolationist-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Gothic fantasy -> Isolationist fantasy. The world is a sealed city-sized decaying palace, ruled by titanic
  Ladies and meaningless inherited rituals; two young custodians cross its towers to confront failing seasons and the Beast. Locus explicitly places it beside Gormenghast.
  Confinement, architecture and exhausted hierarchy govern, not an open-world epic quest, British manners, necromantic machinery or investigation. Invented-world
  fairy whimsy does not make this a revision of an identifiable prior fairy tale.'

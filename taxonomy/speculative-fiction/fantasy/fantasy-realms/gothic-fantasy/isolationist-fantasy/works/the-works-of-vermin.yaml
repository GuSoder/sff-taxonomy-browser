first_published: 2025
canonical_genre: isolationist-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Fantasy realms -> Gothic fantasy -> Isolationist fantasy. Tiliard is an invented city carved into
  a giant tree stump over the toxic Catoptric River. Its enclosed, self-contained society, ritualized theatrical executions, debt-marked workers and decaying hierarchy
  make the city itself the Gothic governing condition. Exterminator Guy and perfumer Aster navigate its toxic bioalchemy, art and recurring regimes. Locus identifies
  exemplary New Weird and Decadent/Symbolist modes; BookPage calls the pests magical, while the publisher excerpt invokes arcane natural laws and enzymes provide
  scientific vocabulary. That ambiguity is preserved, not asserted as a categorical absence of magic. The curator heard Fantasy and chose Isolationist over the provisional
  Dark realms pick. Real earth and Portal fail setting/crossing; Epic, Sword and sorcery, fairy-tale revision, Far shores, Comic, Cozy and Romantasy do not supply
  the governing engine. Gothic alternatives: Dark realms fits dread/toxic transformation but enclosure and hierarchy win on the curator''s ear; Technomancy requires
  actual engineered magic with a necromantic register not established here; Fantasy mystery has no primary occult-detective inquiry; Fantasy of manners is less apt
  than the sealed city despite court intrigue. No SF New Weird placement: the curator resolved the root to Fantasy.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Fantasy {Real earth fantasy, Fantasy realms, Portal fantasy} -> Fantasy realms {Epic fantasy, Sword
  and sorcery, Fairy-tale revision, Gothic fantasy, Far shores fantasy, Comic fantasy realms, Cozy fantasy, Romantasy} -> Gothic fantasy {Dark realms, Technomancy,
  Isolationist fantasy, Fantasy of manners, Fantasy mystery} -> Isolationist fantasy

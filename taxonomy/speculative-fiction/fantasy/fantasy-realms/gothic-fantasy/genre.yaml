definition: 'The Gothic School of invented-world fantasy: the Walpole-to-Poe lineage of haunted architecture, ancestral dread, confinement, transgression and the
  uncanny, widened to include Pax Britannica cultural mannerisms - British imperial-era gentlemen, etiquette, class performance and social codes. Its branches range
  from Dark Fantasy and isolation to manners, occult detection and necromantic machinery.'

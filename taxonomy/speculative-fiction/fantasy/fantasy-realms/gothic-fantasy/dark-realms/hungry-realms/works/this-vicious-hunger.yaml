placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Dark realms > Hungry realms
  (the tenth fiction in Dark realms, which triggered the split; placed after it). Standalone (Orbit/Redhook, 26 Aug 2025),
  one fiction. Per Publishers Weekly, Reactor and Hachette: widowed Thora Grieve takes a place at the university of St. Elianto,
  becomes obsessed with a walled, overgrown poison garden and the toxic woman who tends it (a Rappaccini''s Daughter retelling);
  romance, body horror and dark academia in an invented world. Appetite, poison and consumption are the dread, which is the
  Hungry realms definition. Rejected: Haunted realms (no ghosts), Godforsaken realms (no dark god), Magic school (the university
  is the setting, not the craft taught), Technomancy (the botany is the horror, not an organized magic). Wobble: Magic school
  and Romantasy are the second readings; the romance is a thread of the dread, not the spine.'

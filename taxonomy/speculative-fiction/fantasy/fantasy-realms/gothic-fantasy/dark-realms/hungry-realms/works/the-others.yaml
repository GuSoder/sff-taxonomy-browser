first_published: 2013
canonical_genre: hungry-realms
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > the book states Namid, an invented world (the authors
  own geography page), so by the setting test it walks Fantasy realms > Gothic fantasy (its menace is the Gothic register:
  the terra indigene eat humans and humans are prey) > Dark realms > Hungry realms: the dread is appetite, and the story
  is what is being eaten - the Others eat humans, and PRH''s own line is the humans who are their prey. Rejected:
  Paranormal neighbours (previous shelf: right on neighbours, wrong world - Namid is invented, not Earth); Godforsaken
  realms (the Elders and the bargains are the world-frame, not the dread engine).'

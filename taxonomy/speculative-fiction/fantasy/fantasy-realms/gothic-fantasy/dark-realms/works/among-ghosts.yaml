placement_rationale: 'Seraphina-universe standalone (Goredd): a boy flees his abusive earl father''s escalating menace into a ghost-crowded abandoned abbey; the ghosts
  narrate the region''s buried history (girls sacrificed for hope, a Wise Girl and the King of the Wolves), the town''s forgotten harbor engineering kills, a dragon''s
  memories were excised (Locus/Alex Brown; Reactor/Molly Templeton). Invented-world haunting and enclosure under escalating dread. Placed via Gustav''s 12:36 ruling
  (was held #18); the leaf was renamed Dark realms in the same ruling.'

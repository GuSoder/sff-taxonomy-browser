placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Dark realms > Godforsaken
  realms. Per Orbit''s copy: in the city of Guerdon the gods are dead or dying and their remains still shape the world; a
  thief, a priest-in-training and a gutterborn mage are drawn into the fight over what is left of them (The Gutter Prayer,
  The Shadow Saint, The Broken God). The dread is a dark power, dead and fallen gods and the bargains made with their remains,
  which is the Godforsaken realms definition. Rejected: Caper fantasy (the thieves are heroes of a city-scale divine catastrophe,
  not a heist story), Haunted realms (the dread is dead gods, not the dead), Occult city (an invented world, not modern).
  Wobble: the industrial-city setting and gangs could pull toward Caper fantasy. Three volumes folded as one fiction: The
  Gutter Prayer (2019), The Shadow Saint (2020), The Broken God (2021).'

placement_rationale: 'Tanith Lee''s Volkhavaar (DAW, 1977; Penguin Random House description): Shaina, kidnapped young and
  enslaved, is a sixteen-year-old bondservant in a farming village when the touring players of Kernik, the Clever Showman,
  enchant it and vanish, and everyone forgets them but her; smitten with the actor Dasyel, she goes to the witch Barbayat,
  who teaches her to send her soul out of her body, and learns that Kernik is the dark magician Volkhavaar, who draws his
  illusions from Takerna, evil god of night and shadows, and means to subjugate the city of Arkev and make its people worship
  Takerna, with Dasyel under his control; Shaina fights his illusions with her soul and her love. Walk: Fantasy > Fantasy
  realms > Gothic fantasy > Dark realms > Godforsaken realms (the dread is a dark god and the sorcerer who serves it). Tried:
  Haunted realms (the dread is not the dead) and Hungry realms (nothing feeds). Wobble: it is a short adventure in a dark-fantasy
  register rather than a sustained Gothic realm; Fairytalesque quest fantasy (at nine) and Heroic fantasy (caster hero) are
  the alternatives. Source: publisher description only.'

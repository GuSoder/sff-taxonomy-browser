placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Dark realms > Godforsaken
  realms. Per Hachette and Simon and Schuster: in the village of Heulensee the women feed their terror to an ancient Saint
  of Fear that protects them from the monsters of the Hexenwald, and when it finds that Ilse was born unfearing it threatens
  to devour her sister unless she finds her fear. The dread is a dark power and the bargain made with it: the Godforsaken
  realms definition. Rejected: Hungry realms (the Saint feeds on fear but the bargain, not appetite, is the engine), Haunted
  wilds and Folk horror (those sit in Real-earth fantasy, and this is a folkloric invented Bavaria with a village that never
  existed), Cursed towns (same branch). Wobble: the Bavarian setting is named, so a reader could call it Real-earth; the Saint,
  the Hexenwald and the village make it a folkloric secondary world. Year per Hachette, 2 Sep 2025.'

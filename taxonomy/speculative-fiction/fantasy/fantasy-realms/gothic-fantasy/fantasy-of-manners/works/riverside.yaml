placement_rationale: 'Full root-down walk: Fantasy (the invented city of Riverside, no science engine) > Fantasy realms >
  Gothic fantasy (Pax Britannica manners branch) > Fantasy of manners, not Sword and sorcery (the swordsman Richard St Vier
  fights duels for nobles but the swords serve the politics and the wit; there is almost no magic) and not Political fantasy
  or Court intrigue (the plots live in drawing rooms and the book''s mode is etiquette and class performance, the author''s
  own subtitle is ''A Melodrama of Manners''): duels, courtship and intricate social codes among the Hill''s nobles. Author
  site (https://www.ellenkushner.com/books/swordspoint). Thomas the Rhymer (MC02890) is a different work and is not folded
  here. Fantasy of manners is now ten fictions.'

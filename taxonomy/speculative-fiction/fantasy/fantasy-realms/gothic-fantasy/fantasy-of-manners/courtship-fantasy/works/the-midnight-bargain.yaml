placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy realms -> Gothic fantasy -> Fantasy of manners.
  Erewhon sets genuine sorcery inside a Regency-like Bargaining Season where debt, marriage-market etiquette, class and courtship
  force Beatrice to choose between becoming a Magus and an advantageous match. Social codes and marriage negotiation govern
  over adventure.'

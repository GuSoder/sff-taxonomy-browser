placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Fantasy of manners > Courtship fantasy.
  Per the author''s site, Publishers Weekly and BookPage: in the preindustrial city of Glassport, Mattinesh Jay must marry
  the daughter of another prominent family to shore up his family''s wool business and hires charming con artist Luca Piere
  as a swordsman best man; the arranged marriage, the wedding and the love that grows beside it drive the story. The match
  as plot, marriage negotiation included, is the Courtship fantasy definition. Rejected: Caper fantasy (Luca''s cons are backstory,
  the engine is the match), Posh fantasy (no elite drawing-room performance as the story). Wobble: the sword-challenge plot
  and Luca''s con past give it a caper edge. Year 2024 (Bramble).'

placement_note: Speculative fiction -> Fantasy -> Fantasy realms -> Gothic fantasy -> Fantasy mystery. Actual witch magic and ghosts exclude SF; invented
  Sourdough universe Silverton/Lodellan and no Earth exclude Real earth/Portal. Ghost-assisted investigation connects disappearances, mysterious deaths,
  suppressed ghosts, lost grimoire and family conspiracy. Gothic menace and occult institutional wrongs are essential. Invented fairytales is a real rival
  (original fable/blood bargains), but investigation drives while fable is mode. Dark realms too broad; no technological magic, sealed-world premise or
  Pax manners. Realms siblings Epic/Sword and sorcery/Far shores/Comic/Cozy/Romantasy lack governing epic-scale, combat, culture-proxy, comedy, safety or
  romance engine. Owner Execute2026-10-01 11:41:34 phonemsg-01M3VDEDGTBTKJ31FWVF28XY23, answering reviewed Fantasy mystery pick.

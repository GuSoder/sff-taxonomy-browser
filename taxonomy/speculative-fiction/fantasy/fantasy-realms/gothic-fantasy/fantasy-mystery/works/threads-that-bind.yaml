first_published: 2023
canonical_genre: fantasy-mystery
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Fantasy realms -> Gothic fantasy -> Fantasy mystery. Private detective Io investigates women made into supernatural assassins
  in half-sunken Alante, exposing occult lineage and monstrous institutional conspiracy. Locus identifies the noir investigation as the page-turning engine. Greek-derived
  divine ancestry supplies powers but this is not a retelling of named Greek myth nor contemporary real-Earth myth. The fated romance is subordinate to detection,
  not Romantasy. First card of the Threads That Bind/Hearts That Cut duology.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Fantasy mystery > Ghost-sleuth
  fantasy. J. T. Greathouse, 2025, an invented world: the King of Parwys falls from his castle tower and ghosts and wraiths
  torment the land; Fola, a sorceress-scholar from the deathless City of the Wise who studies the souls of the undead, goes
  into the haunting to find what lies behind it, while the Mortal Church moves in to purge magic and a young girl with great
  power turns up (Fantasy-Hive and Grimdark Magazine reviews; Gollancz and Hachette blurbs; the author''s interview on JamReads
  calls it ''Fantasy x Mystery''). The dead are the witness and a scholar works the haunting, the leaf''s definition. Rejected:
  Detective fantasy (Fola holds no office; she is a visiting scholar), Private-eye fantasy, Insurgent and Rebel fantasy leaves
  (the Church''s purge is a second engine but the case drives the plot), War and quest branches. Wobble: moderate to high.
  Reviews and blurbs only, no text read; the church-versus-magic war carries a lot of the book, and Detective fantasy is the
  nearest alternative. Series: the author describes his books as standalones in one shared world, and The City of the Wise
  (queue id MC04034) is listed by Hachette UK with a publication date of 11 March 2027, so it is unpublished and held, not
  placed; when it appears it folds into this card (rule 11j: one shared world, one card). Year 2025 (Hachette UK lists 6 November
  2025; Open Library 2025). Queue id MC04035.'

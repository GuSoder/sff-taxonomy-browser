title: Garrett, P.I.
authors:
- Glen Cook
first_published: 1987
canonical_genre: private-eye-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Fantasy mystery > Private-eye
  fantasy. Garrett is a hired gumshoe in TunFaire, a city of humans, elves, dwarves and trolls, who takes cases for clients
  in a hardboiled first-person voice, starting with Sweet Silver Blues (Wikipedia, Roc, genre ''fantasy, mystery''; PW and
  fan lists give the fourteen novels 1987 to 2013). The fourteen novels are one fiction under rule 11j; the omnibuses Introducing
  Garrett P.I., Garrett Takes the Case, Garrett for Hire, Garrett Investigates and Garrett on the Case are editions, not separate
  volumes. A hired private eye working client cases in an invented world, which is the leaf''s definition. Rejected: Detective
  fantasy (no office or official duty; Garrett works for pay), Comic noir fantasy (Earth-set and comic), Noir fantasy (the
  register is wry, not bleak). Wobble: low; TunFaire is a fantasy city with its own politics, and the later books drift into
  large plots, but the case-and-client frame holds. Years follow first editions (the queue showed reissue years).'

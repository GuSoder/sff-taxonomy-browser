placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Fantasy mystery > Private-eye
  fantasy. Bayliss, a minor fallen angel who has taken on the persona of Philip Marlowe, watches the angel Gabriel die across
  the sky, is ordered by the Choir to recruit a replacement, kills the wrong woman, Molly Pruett, and then treats her as his
  client in a hardboiled case inside a medieval Heaven underpinned by cosmology (Kirkus starred review, 2013; the author''s
  page: a Raymond Chandler-inspired murder mystery in Aquinas''s Heaven). The hired gumshoe''s case with the noir voice is
  the leaf''s definition; Heaven stands as the invented world. Rejected: Mythic power struggle (the engine is the case, not
  the beings'' long struggle), Detective fantasy (no office or official duty), Surreal afterlife (Heaven is rendered as a
  working world, not a dream; also at 9). Wobble: moderate; it is also a theological and physics novel, and Heaven is a real
  tradition, not an invented world. First published 2013 by Tor. Queue id MC03935.'

placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Fantasy mystery > Private-eye
  fantasy. Kosara is a witch in the walled city of Chernograd, a Balkan-folklore invented world of rusalkas, kikimoras and
  lycanthropes, who trades her shadow to cross the Wall to Belograd and works a murder with a detective while hunted by the
  Tsar of Monsters; the duology is The Witch''s Compendium of Monsters (author site, Publishers Weekly). A murder case worked
  from the street, in a hardboiled and wisecracking voice, with the occult as the crime. Rejected: Detective fantasy (Kosara
  holds no office; the police detective is her partner, not her post), Ghost-sleuth fantasy (the dead are not the witness),
  Witchblood (the craft is her trade, not the family inheritance). Wobble: Kosara is a working witch on the run more than
  a hired gumshoe, so Detective fantasy is the honest neighbour; Foul Days is mystery-led, Monstrous Nights is a chase and
  finale. Ace Up Her Sleeve (MC03395) and The Monster Hunters Bargain (MC03398) are not part of the duology and are not folded;
  they are unresearched and left unplaced.'

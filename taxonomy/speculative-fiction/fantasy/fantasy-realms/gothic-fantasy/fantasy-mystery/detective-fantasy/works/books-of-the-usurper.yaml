placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Fantasy mystery > Detective
  fantasy. The published Books of the Usurper pair takes place in invented Semilla, not Earth or a portal journey. Imperial
  archivists and Inspector Richa investigate a magically compelled murder and an impossible relic theft, uncovering an uncanny
  conspiracy. Memory- and body-controlling Changelings, their iron/salt aversions, and dangerous spiraling magic make paranoia
  and supernatural menace essential to the inquiry, not mere fantasy furniture. Reactor identifies Richa as handling the murder
  mystery; the official Archives and investigator make the case institutional duty, not a hired private-eye job or a dead
  witness story. Epic politics is the genuine alternative: the old coup, empress and threats to the empire matter, but the
  published ensemble solves crimes rather than playing court power or claimant succession. Dynastic murders requires a ruler/kin
  death before succession, not these crimes; Court spies is not a generic conspiracy bucket. Magic rules serve the case rather
  than scientific magic problem-solving; no class-defined hero or consequential journey governs. One fiction for both published
  novels (2022 and 2024); the planned third is not added.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Gothic fantasy > Fantasy mystery > Detective
  fantasy. In an invented world ruled by psychic talents, Shironne Anjir, a blind sensitive, investigates for the Larossan
  army; Mikael Lee of the royal guard dreams the deaths of others; when a killer brings a reign of terror with deadly blood
  magic, only the two of them can read his dreams of the murders (Penguin Random House publisher copy). The case is the institution''s
  business, an army investigator and a royal guardsman hunting a serial killer, which is the leaf''s definition. Rejected:
  Private-eye fantasy (no hired gumshoe), Ghost-sleuth fantasy (the witness is a dreamer, not the dead). Wobble: low to moderate;
  the psychic romance and dream visions share the engine with the manhunt. Book 1 of the Palace of Dreams (Ace, February 2016);
  the later volumes are not in the queue. Queue id MC04004.'

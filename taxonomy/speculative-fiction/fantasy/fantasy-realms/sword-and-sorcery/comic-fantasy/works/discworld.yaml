placement_rationale: "SFE calls Discworld the bestselling comic Fantasy series, beginning in broad parody and growing into pun-rich satire of institutions,\
  \ technology and modernity; Pratchett\u2019s entry calls it the genre\u2019s finest set of pure comedies. Comic mode unifies all 41 novels despite their\
  \ varied fantasy and SF proportions."

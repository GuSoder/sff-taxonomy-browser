id: xanth
title: Xanth
authors:
- Piers Anthony
first_published: 1977
canonical_genre: comic-fantasy
placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and Sorcery -> Comic fantasy. Xanth is a magical Florida-shaped
  peninsula where every human has a magical talent. Wikipedia and NPR note the series'' extensive wordplay and puns: its places, creatures and plots are
  built on puns (Lake Ogre-Chobee, the Isle of View), and Anthony describes the Adult Conspiracy as parody. Comedy is the governing engine across the 49-novel
  series.'

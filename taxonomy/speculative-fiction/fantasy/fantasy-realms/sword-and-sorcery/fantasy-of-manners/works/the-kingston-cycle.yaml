placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Fantasy of manners. Aeland/Laneer are an original secondary world; class privilege, concealed magical status, family duty, marriage/courtship, reputation, institutions and social reform govern the trilogy more consistently than its mystery, battles or aether mechanism.'

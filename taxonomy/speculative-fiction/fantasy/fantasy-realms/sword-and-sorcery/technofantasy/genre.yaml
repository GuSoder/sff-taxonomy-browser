definition: 'Adventure-forward fantasy in which technology is central to the worldbuilding or story: wondrous machinery,
  artifacts, airships and impossible engineering. Actual magic is not required. Where the magic is necromancy run
  as engineering, the book belongs in Technomancy. Umbrella divided by the central technological mechanism: Steampunk
  realms, Magitech and Dieselpunk realms. Steam takes priority when combined with magic.'

first_published: 2010
canonical_genre: steampunk-realms
placement_status: accepted
placement_rationale: 'Rewalk 2026-11-28 (second): the curator''s root rule puts any literal magic on the Fantasy
  branch (2026-09-14 ruling, ''No fucking magic in my sci-fi'' 2026-09-16), and this world has demons, spirits and
  Folk magic, so the New Weird/Far weird route under Science fiction is closed despite the attested label. Root-down:
  Speculative fiction > Fantasy > Fantasy realms (the half-made world is independently invented, not Earth) > Sword
  and sorcery (adventure-forward chase across the frontier) > Technofantasy (technology central to the worldbuilding:
  the Line''s railroad and thirty-eight Engines) > Steampunk realms (steam-led industrial machinery; steam plus
  magic stays here, not Magitech). Perschon (Reactor): ''pure weird western, with a whole lot of steampunk''. Sibling
  witness: The Incorruptibles, same secondary-world demonic-western mode. Rejected: godforsaken-realms (dark powers
  present, but the leaf is dread-gothic and this is adventure-war); epic umbrella children (no engine fit); godforsaken''s
  dread gate fails ''more than adventure''. One duology in one world, one fiction (rule 11j); MC03135 Lightbringers
  and Rainmakers is a Tor.com short story in the same world, not folded.'

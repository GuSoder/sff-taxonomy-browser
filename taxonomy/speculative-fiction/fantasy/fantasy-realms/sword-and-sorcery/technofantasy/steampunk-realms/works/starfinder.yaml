id: starfinder
title: Starfinder
authors:
- John Marco
first_published: 2009
canonical_genre: steampunk-realms
placement_status: accepted
placement_rationale: 'Source-read root-down 2026-11-05: Speculative fiction > Fantasy > Fantasy realms > Sword and
  sorcery > Technofantasy > Steampunk realms. Moth and Fiona undertake an action-forward rescue and artifact mission
  across the Reach in an independent invented world. Steam trains, electricity, zeppelin-like aeroships and dragonfly
  flying machines are central to its worldbuilding; the struggle over who may fly links the human technology to
  the Skylords and the Starfinder. Magic and mythic creatures openly coexist with the industrial machinery. This
  is not Earth, so Real earth fantasy and Portal fantasy fail, despite publisher wording about crossing between
  worlds; both sides are regions of an invented setting, not an Earth-to-otherworld crossing. Fantasy wins over
  SF: transformation, wizardry and a magical artifact are actual story machinery, not a science-fiction explanation.
  Period SF Steampunk adventure thus loses at the root despite a similar aesthetic. At Fantasy realms, Epic fantasy/High
  fantasy and its burden or fairy-tale quest leaves are the strongest alternatives: there is a rescue journey and
  a uniquely usable artifact, but its airship technology, powered flight and contest over the skies supply the distinctive
  worldbuilding and adventure, which the accepted Technofantasy definition routes here. Gothic dread, inherited
  tale revision, non-Western counterpart culture, governing comedy, romance/community/horse bonds do not organize
  the fiction. Within Sword and sorcery, not a heist, pirate sea adventure, formal tournament, sword-and-planet
  or classic barbarian lineage. Technofantasy steam priority applies over Magitech, since steam and magic coexist;
  no diesel-led engine established. Wobble moderate: the latter journey is a traditional magical rescue, and PW
  calls Calio only vaguely steampunkish. Both detailed independent reviews emphasize the continuing contrast and
  integration of technology with high magic, and the publisher leads with airships. One published Skylords novel,
  Starfinder (2009); the 2010 queue date is the paperback edition. Bibliographies list no published sequel; contemporary
  reviews describe only a planned trilogy, not three existing books. YA status does not exclude it.'

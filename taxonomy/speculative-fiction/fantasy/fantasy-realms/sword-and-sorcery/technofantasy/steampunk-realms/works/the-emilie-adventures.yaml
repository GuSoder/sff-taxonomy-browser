placement_rationale: '# The Emilie Adventures, MC06500

  24 November 2026


  ## Verdict

  Place one two-novel fiction, The Emilie Adventures by Martha Wells, in existing Steampunk realms, 5 to 6. High confidence
  in root and adventure/technology route; moderate-to-high confidence in steam priority over Magitech. No structure or definition
  change. The 2025 omnibus is not a third novel. Original novels: Emilie and the Hollow World (2013), Emilie and the Sky World
  (2014).


  ## Corpus and evidence

  Both creator pages identify the original novels and dates, and the current publisher explicitly packages two novel-length
  steampunk adventures. The second continues immediately from the first with the same protagonist, crew, vessel and aetheric
  cosmology. No source establishes a shared universe with Ile-Rien or Raksura. The author''s suggestion that Cirathi would
  fit into the Three Worlds is a hypothetical comparison, not a universe confirmation. Do not merge them.


  ## Entire-fiction story

  Emilie flees a restrictive uncle, intending to reach her cousin''s school, but boards the Sovereign by mistake. Miss Marlende''s
  expedition seeks her missing father through aether currents in the Hollow World. Damage, sabotage, rival Lord Ivers and
  Queen Tath-alare''s coercion turn exploration into rescue and escape. The missing expedition is recovered, Ivers'' scheme
  defeated, and the crew returns; he is handed to magistrates. Emilie becomes Miss Marlende''s assistant.

  The sequel begins immediately. Professor Abindon''s observations reveal a disruption in the upper aether currents. An expedition
  investigates an apparently empty vessel from another plane; Emilie''s brother Efrain stows away. The crew is stranded in
  a patchwork world with a lost scientific party and entities that possess and manipulate people. Emilie, Efrain and the nonhuman
  survivor she calls Hyacinth help rescue the party. They survive, return Hyacinth to its family and descend home. Family
  reconciliation develops through the expedition rather than replacing its adventure engine. Neither book is an unresolved
  announced fragment.


  ## Hard walk from root

  1. Speculative fiction: physical aetheric planes, sorcerers and impossible vessels are real within the story, not psychological
  doubt or ordinary historical fiction.

  2. Fantasy rather than SF: independent secondary world, explicitly identified as such by Strange Horizons and James Davis
  Nicoll; creator discusses a magical alternate Victorian world. Silk Harbor, Meneport and Menean society are not established
  as Earth''s geography. Tor''s broad Science Fiction metadata does not override the tree''s root. Daniel is an apprentice
  sorcerer, and completed reviews describe magical operation. No Earth-origin or posthuman reveal established. Verne references
  and words such as space or Hollow World are not evidence of our universe.

  3. Fantasy realms rather than Real earth fantasy or Portal fantasy: travel among invented aetheric planes, not a passage
  from Earth. Reactor''s full two-book reading explicitly explains that Hollow World is below Emilie''s world but not inside
  Earth. Do not seed or route to Earth-side hollow-world SF on the title alone.

  4. Fantasy realms siblings: action and scientific expeditions drive both books, so Sword and sorcery. Epic/high-quest rivals
  have journeys, geography and rescue, but intimate exploratory crew adventures rather than an epic governing quest, cosmic
  order or war. Heroic class/power-source classification is weaker than central engineered exploration. Political/military
  stakes are obstacles, not the governing engine. Hard fantasy is a real rival because aether is studied, but the text''s
  mechanical expedition problem is more specific; no verified time travel. Fairytale revision/quest grammar is absent. Far
  shores cultural about-ness absent. Comic mode absent despite wit. Heart fantasy fails as governing spine: familial bonds
  matter, but neither romance, low-intensity comfort nor horse bond governs. Gothic realms has danger and possession, particularly
  in book two, but sustained exploratory adventure rather than dread, confinement, etiquette or uncanny detection; no necromancy-as-engineering
  demonstrated.

  5. Sword and sorcery siblings: Caper fails because no theft-job/crime crew governs; Pirate fails because sea travel and
  Ivers do not make the crew pirate/privateer naval adventurers. Sword and planet is plausible because of strange-world exploration,
  but powered ships and aetheric navigation/engines are the means and subject of both expeditions, so Technofantasy is more
  precise. No tournament; not a classic historical S&S lineage.

  6. Technofantasy: central experimental engine, steamships/airships, scientific observations and engineered travel support
  its technology-central gate across both books. Magic may coexist.

  7. Technofantasy leaves: Steampunk realms wins. Creator page establishes ordinary steamship transport; Strange Horizons
  describes steamships throughout the setting; the full Reactor duology review identifies Sovereign itself as a magic underwater
  steamship, reused for the sequel''s sky expedition. Current publisher explicitly calls both steampunk adventures. Steam
  is more than cover decoration. Magical aetheric operation makes Magitech the strongest rival, but the user''s steam-plus-magic
  priority and current leaf definition retain it here. This does not assert that steam alone powers travel across planes:
  sorcery and aetheric engineering are indispensable. Diesel mechanism absent. Necromancy engineering absent, so no Technomancy
  exception.


  ## Counts, editions and covers

  Steampunk realms contains five current fictions, no Emilie duplicate found. Add one fiction containing exactly the two original
  novels. Prospective totals 937 nodes, 3009 fictions, 7552 books. No ten-card gate reached.

  Two author-hosted original English fronts pixel-inspected, matching titles, full fronts, not portraits or omnibus cover.
  Both hotlinked only. First larger review-hosted image was rejected because it contains a prepublication placeholder blurb.
  Author fronts are 250x379 and 250x378, modest resolution disclosed, readable at shelf size.


  ## Source ledger

  Primary, high confidence:

  - Martha Wells, Emilie and the Hollow World, live creator bibliography: original April 2013 date, steamship, experimental
  engine and rescue premise. https://marthawells.com/emilie.htm

  - Martha Wells, Emilie and the Sky World, live creator bibliography: March 2014 date, same cast, aetheric plane and airship
  expedition. https://marthawells.com/emilie2.htm

  - Martha Wells YA fantasy bibliography: creator''s fantasy framing, same two novels. https://www.marthawells.com/yafantasy.htm

  - Tor Publishing Group, current omnibus: two steampunk novels, 13 May 2025 omnibus, not extra original work. Broad Science
  Fiction metadata conflicts with precise fantasy-world evidence and is not followed. https://torpublishinggroup.com/the-emilie-adventures/?format=trade&isbn=9781250873149

  - Risingshadow author interview, 10 October 2013: magical alternate Victorian setting, deliberate Verne inspiration; Cirathi
  comparison explicitly hypothetical. https://www.risingshadow.net/articles/interviews/283-an-interview-with-the-fantasy-author-martha-wells

  - AP Book Club author interview, 10 March 2014: direct sequel, no additional Emilie novels planned then, Verne intention.
  https://theapbookclub.blogspot.com/2014/03/author-interview-martha-wells-emilie.html

  Independent completed readings, high-to-moderate confidence, cross-checked:

  - Alex Brown, Reactor, 17 July 2025, both novels: steam-powered magical Sovereign, layered worlds rather than inside Earth,
  complete plot and return resolutions, family arc. https://reactormag.com/martha-wells-book-club-the-emilie-adventures/

  - Phoebe North, Strange Horizons, 17 June 2013: explicit secondary-world fantasy, steamship/aether worldbuilding, adventurous
  rather than romantic engine. https://strangehorizons.com/wordpress/non-fiction/reviews/emilie-and-the-hollow-world-by-martha-wells/

  - Liz Bourke, Reactor, 11 February 2014, second novel: sequel continuity, expedition technology, possession, rescue adventure
  and family conflict. https://reactormag.com/book-review-emilie-and-the-sky-world-martha-wells/

  - James Davis Nicoll, full review: explicit secondary world. https://jamesdavisnicoll.com/review/or-if-i-search-inside

  - Open Book Society, first novel: steam-and-steel Victorian-like world, magical engineering and adventure. https://openbooksociety.com/article/emilie-and-the-hollow-world-by-martha-wells-book-review/

  - Bill Crider, 27 April 2013, first novel: Earth-like rather than named Earth, steam-punk time, sorcerers using aether,
  rescue and return adventure. https://billcrider.blogspot.com/2013/04/emilie-and-hollow-world-martha-wells.html


  ## Boundaries and caveats

  No full-book mirror used. A search surfaced mirror snippets; they were not fetched or used as classification evidence. Exact
  thermodynamic construction of the experimental engine is not established and is not needed for the worldbuilding-or-story
  steam gate; do not invent boiler schematics. Genre labels alone did not decide the route. The complete two-book expedition
  and setting evidence did. Single-fiction judgment uses the owner''s existing grant; structural changes would require a separate
  approval and none are proposed.


placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Fantasy realms -> Sword and sorcery -> Technofantasy
  -> Steampunk realms. Senlin seeks Marya through the Tower; the later novels follow stolen-airship piracy, the
  Hod King conspiracies and the final siege engine. Steam engines and Sphinx-built machines govern the same four-novel
  world. Bancroft explicitly calls it an alternate universe, not alternate history. Steam priority applies; actual
  magic is not required. Curator Execute phonemsg-01M62829EPMQX2VJ5NKE1TNKYE on proposal phonemsg-01M6281DBDVP6D9HFMZ9PSKBN4,
  2026-10-28: three mechanism children, five existing fictions moved, existing book lists unchanged; no general
  intake.'

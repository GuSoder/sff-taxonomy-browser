placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Fantasy realms -> Sword and sorcery -> Technofantasy
  -> Magitech. The author explicitly describes magebike engines powered by mana and innate Talent, not gasoline.
  The sequel continues the same magical infrastructure through Talentless Jin, refugees, mana scarcity and the First
  City search. Curator title-specific ruling phonemsg-01M627ZSSE62HK48AMEG5GRRKA permits assuming a fantasy realm
  for this classification. Road Builder/colony provenance remains unverified, not newly established cosmology or
  a blanket root exemption. No steam-led technological world is evidenced. Existing title and book list retained;
  no Flight of the Fallen addition or relabel. Curator Execute phonemsg-01M62829EPMQX2VJ5NKE1TNKYE on proposal phonemsg-01M6281DBDVP6D9HFMZ9PSKBN4,
  2026-10-28: three mechanism children, five existing fictions moved, existing book lists unchanged; no general
  intake.'

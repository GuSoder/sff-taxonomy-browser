placement_rationale: 'Michael Moorcock''s The Jewel in the Skull (1967) opens the History of the Runestaff (Wikipedia): in
  a post-nuclear future where science and sorcery coexist, Duke Dorian Hawkmoon of Köln is taken prisoner by the Dark Empire
  of Granbretan, whose ornithopter fleets and masked beast-order lords rule by engineered sorcery. Folded in: the rest of
  the Runestaff cycle and the Count Brass omnibus (Hachette, moorcography.org) as one Hawkmoon line. Walk: Fantasy > Sword
  and Sorcery (action-forward, intimate adventure) > Technofantasy (the magic wears technological trappings: ornithopters,
  the Black Jewel, flame-lances). Tried Evergreen sword and sorcery (no machinery at the centre) and Fallen earth in Science
  fiction (magic is real, so it is fantasy). Sources: Wikipedia and Hachette; I did not read the books.'

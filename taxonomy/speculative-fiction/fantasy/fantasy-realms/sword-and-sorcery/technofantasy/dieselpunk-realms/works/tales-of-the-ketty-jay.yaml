id: tales-of-the-ketty-jay
title: Tales of the Ketty Jay
authors:
- Chris Wooding
first_published: 2009
canonical_genre: dieselpunk-realms
placement_status: accepted
placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Fantasy realms -> Sword and sorcery -> Technofantasy
  -> Dieselpunk realms. The four novels follow a framed freighter heist, lost-aircraft salvage, cursed relic/desert
  secrets and civil war in the same Vardia world. Wooding expressly calls the whole series dieselpunk; aircraft
  use aerium lift and prothane propulsion, not steam. The daemonist and golem establish fantasy but do not make
  the aircraft engines mana-powered. Thus Dieselpunk realms rather than Steampunk realms, Magitech, sea Pirate fantasy
  or an Earth-rooted SF setting. Curator Execute phonemsg-01M62829EPMQX2VJ5NKE1TNKYE on proposal phonemsg-01M6281DBDVP6D9HFMZ9PSKBN4,
  2026-10-28: three mechanism children, five existing fictions moved, existing book lists unchanged; no general
  intake.'

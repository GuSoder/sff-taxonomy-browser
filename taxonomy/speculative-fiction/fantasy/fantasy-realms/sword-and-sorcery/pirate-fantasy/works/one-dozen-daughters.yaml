placement_rationale: 'Lackey and Mallory''s The House of the Four Winds, Book One of One Dozen Daughters (Tor, Aug 2014; Macmillan,
  Google Books): the rulers of tiny Swansgaard have twelve daughters and one son; Princess Clarice disguises herself as the
  sailor Clarence to work her way to the New World, an expert with rapier and dagger, and when the crew rebels she sides with
  the navigator Dominick and kills the cruel captain; the outlawed crew sails for the secret pirate haven called the House
  of the Four Winds, where the sorceress Shamal claims Dominick and Clarice fights for him. Walk: Fantasy > Fantasy realms
  > Sword and sorcery (action-forward fantasy) > Pirate fantasy (the ship, the crew and the sea lanes are the adventure).
  Rejected: Romantasy leaves (the romance is a strand, the ship and the voyage are the adventure; Enemies-to-lovers does not
  describe the pair), Rogue hero and Warrior hero (heroic fantasy is by power, the sea adventure decides here), Pirate insurgents
  (no empire to subvert), Fairytale leaves (the twelve-princess frame is the setup only). Wobble moderate: the romance is
  a marketed core and Romantasy is the alternative reading. Queue id MC06792, first published 2014.'

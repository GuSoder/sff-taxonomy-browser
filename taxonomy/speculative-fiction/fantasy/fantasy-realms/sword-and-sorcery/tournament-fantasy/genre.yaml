definition: 'Sword and sorcery whose adventure is a formal contest: a hunt, tourney, arena or trials with rules, rivals, a
  prize and a deadline, where the story is the competing and the alliances and betrayals it breeds. Not Caper fantasy (a job,
  not a contest), not Pirate fantasy (the sea), not Quest fantasy (a journey), not Military fantasy (war, not sport).'

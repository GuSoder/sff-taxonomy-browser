placement_rationale: 'In a land ruled by Patron overlords, Jessamy trains for the Fives, a grueling athletic tournament of
  rings, pillars and traps whose victor wins glory and patronage; she enters the games under an assumed identity, and the
  trials - their rules, rivals and prizes - drive all three novels (Kirkus: a fantasy built around ''the Fives'', an athletic
  competition; Little, Brown series page). Walk: Fantasy (invented world, real magic) > Fantasy realms > Sword and sorcery
  > Tournament fantasy (a structured contest with rules, rivals and a prize is the story''s engine). One universe, one card
  (rule 11j); trilogy complete 2015-2017 (publisher). Source: Kirkus and publisher; not read.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery >
  Tournament fantasy. A team of Scherian fencers tours Permia on a goodwill mission: formal matches with
  rules, rivals and referees structure the whole novel, and the alliances and betrayals the tour breeds
  - the assassins, the planted scandals, the diplomatic traps - are the plot. That is the Tournament fantasy
  gate; the Irrigator''s war is backstory, so no Military fantasy leaf applies. Rejected: Champion of
  realm (they fight AS the realm''s team, but that gate''s battlefield-leadership flavor is war; this
  is sport as statecraft), Martial statecraft (no campaign, siege or war-finance; the lever here is the
  tour itself), Caper fantasy (no job or crew score). Wobble disclosed: the matches are exhibitions without
  a prize, and the cast is an ensemble rather than one duelist; the contest frame still governs the whole
  fiction. No magic; Fantasy root stands on the invented world, same convention as the author''s Siege
  trilogy.'

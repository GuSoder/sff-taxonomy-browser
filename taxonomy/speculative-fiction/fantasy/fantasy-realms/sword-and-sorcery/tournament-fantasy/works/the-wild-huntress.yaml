placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Epic fantasy > Tournament fantasy (seeded
  for this book on the intake''s own judgment under the curator''s standing autonomy, phonemsg-01M4K42F3EQDEGCNTQ1T3FWS29
  and phonemsg-01M4K45A5DFAAFXQS8P7XSPGT3). Emily Lloyd-Jones, The Wild Huntress (Little, Brown, 8 October 2024): every fifth
  year the mortal king of Dyfed and the immortal Otherking host the Wild Hunt on the last day of autumn, a bloody contest
  in the woods whose winner is granted a wish. Branwen, who sees and slays monsters, enters to cure her mother''s illness;
  Gwydion, who can enchant plants, to stop his violent brother Amaethon from being named heir; Pryderi, a prince raised by
  monsters, to find where he belongs. The three ally against monsters and rival players, and a betrayal threatens them (Kirkus,
  https://www.kirkusreviews.com/book-reviews/emily-lloyd-jones/the-wild-huntress/; author site, https://emilylloydjones.com/the-wild-huntress;
  Hachette, https://www.hachettebookgroup.com/titles/emily-lloyd-jones/the-wild-huntress/9780316568142/). Welsh-inspired invented
  world (the world of The Bone Houses and The Drowned Woods, all-new characters, standalone per the author interview), so
  Celtic fantasy and the Real-earth branches are out. Rejected: Fairytalesque quest fantasy (9; closest, but the story is
  a rule-bound contest in one forest, not a journey, curse or fairy-tale errand, and a tenth card would force a split on a
  weak fit), Quest fantasy generally (no consequential journey as spine), Mythic power struggle and Invented mythology (the
  Welsh names are texture, the story is not the beings or a made mythology), Ranger hero (Branwen is one of three leads of
  different kinds), Military and Political fantasy (no war or rule). No tournament or contest leaf exists anywhere in the
  tree (searched labels and definitions). Wobble: moderate; Fairytalesque quest was the runner-up.'

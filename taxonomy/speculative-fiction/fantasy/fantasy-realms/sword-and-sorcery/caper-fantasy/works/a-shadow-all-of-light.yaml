placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Caper fantasy. Per Kirkus,
  Publishers Weekly and a library catalogue record: in the Italianate port city of Tardocco, country bumpkin Falco apprentices
  to the shadow-thief Maestro Astolfo and his henchman Mutano, working a series of cons, capers and cases in a world where
  shadows are stolen, bought and sold. Thieves, schemes and intimate criminal adventure is the Caper fantasy definition. Rejected:
  Whimsical doors and Cozy fantasy (the engine is the con, not comfort). Wobble: episodic story sequence (parts ran in F&SF)
  rather than a single plot, and Kirkus found it disappointing; it is sold as a novel. Year 2016 (Tor); the cover is the 2017
  paperback. Leaf now at 7.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery >
  Caper fantasy. Disgraced heir Lukan Gardova teams with master thief Ashra ("Lady Midnight") and
  street rat Flea: in Saphrona they untangle his father''s murder through the city underworld, and in
  Korslakov they must steal back the vault key a rival thief lifted from Lukan (Kirkus reviews of both
  books; Goodreads/Penguin blurbs). The series engine is a thief crew working criminal adventures city
  to city - the leaf ("thieves, heists, gangs and intimate criminal adventure", seeded on Scott
  Lynch''s own description; The Gentleman Bastard Sequence is the direct precedent, epic connective
  arc and all). Rejected: Classic quest fantasy (no Tolkien-fellowship world-saving march - the party
  is a thief crew and the ancient-race/war arc is connective tissue, same shape as the Lynch
  precedent), Heroic fantasy (not organized by hero class), Sword and sorcery umbrella proper (Caper
  is its child for exactly this). Wobble: low. Two published novels: The Silverblood Promise (2024,
  Tor) and The Blackfire Blade (2025, Tor), one series (The Last Legacy, per both covers and Kirkus),
  one card. Sources: kirkusreviews.com (x2), goodreads.com; not read.'

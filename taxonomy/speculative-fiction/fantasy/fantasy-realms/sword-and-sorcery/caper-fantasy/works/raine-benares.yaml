placement_rationale: 'Raine Benares is a sorceress seeker from an extended family of smugglers and thieves; bonded to the
  Saghred, a soul-stealing stone, she survives nine novels of cons, heists, kidnappings and double-crosses against kings,
  goblins and demons who want the stone - sword-and-sorcery crime novels of intimate criminal adventure in the Lynch lineage:
  Caper fantasy. Complete per the author''s current bibliography (9 novels, ending Ruins & Revenge); no novellas folded.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Caper fantasy. In the
  Kingdom of Southern California, run by a Hierarch who feeds on the bones of magicians, the thief Daniel Blackland is pushed
  by his crime-boss uncle into a heist on the Hierarch''s storehouse of magical artifacts, with a crew of Moth, Jo Alverado,
  Cassandra and Emma (Tor, California Bones); Pacific Fire and Dragon Coast continue the same world (Tor), so one fiction
  (rule 11j). Thieves, heists and a crew is the leaf''s definition. Rejected: Technofantasy, Occult consultants (not Earth
  as we know it). Wobble: moderate; the setting is an alternate Los Angeles rather than an invented realm, but the leaf asks
  for the heist crew. Sources: Tor pages for California Bones and Pacific Fire; Dragon Coast is read from the series description.'

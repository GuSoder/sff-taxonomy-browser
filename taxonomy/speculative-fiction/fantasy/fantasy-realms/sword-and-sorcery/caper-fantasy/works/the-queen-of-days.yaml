placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Caper fantasy. Kelly,
  2023: in the invented city of Cothis, Balthazar Vadalen, whose parents were killed when his father''s deputy Paasch seized
  the governorship, leads his family of thieves in stealing the idol of the sea god Karanis from Paasch''s new temple, with
  the mysterious thief the Queen of Days hired as the weapon of last resort at a price of 30 days of life from each crew member;
  the ceremony is real magic that opens a portal for the god (Kirkus review; Kelly''s site). Rejected: Court or revolutionary
  fantasy (the governor''s usurpation is backstory, the job is a heist), Fairytalesque and Revisionist quest fantasy (no quest),
  Gods leaves (the fallen gods are the twist, the engine is the job). The leaf''s definition is thieves, heists, gangs and
  criminal adventure, and its cards (Gentleman Bastard, Blacktongue, Eli Monpress) are the same shape. Wobble: low to moderate;
  plot from Kirkus and the author''s page, not the book. The leaf''s status is still provisional. Year 2023 (Kirkus, release
  24 October 2023). Cover is the Harper Voyager jacket via Publishers Weekly. Leaf now at 9: the next arrival gates. Queue
  id MC03600.'

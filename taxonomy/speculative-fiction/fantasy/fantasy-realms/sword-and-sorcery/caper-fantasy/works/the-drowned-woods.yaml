placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Caper fantasy. Per the
  author''s site and Kirkus: Mererid, the last water diviner, once bound into a prince''s service and tricked into locating
  wells he poisoned, gathers a crew of misfits for a heist on a mythical treasure to bring him down. A crew, a scheme and
  a heist drive the story: the Caper fantasy definition. Rejected: Insurgent fantasy and Regicide fantasy (the revenge is
  carried by the heist, not a rising or a killing), Celtic fantasy (that leaf sits under Real-earth historical fantasy, and
  the kingdoms here are a folkloric Wales, not recorded history). Wobble: YA and Welsh-folklore register is far from Scott
  Lynch''s gangs, and the placement rests on the heist plot alone. Year per Kirkus and Hachette, 2022.'

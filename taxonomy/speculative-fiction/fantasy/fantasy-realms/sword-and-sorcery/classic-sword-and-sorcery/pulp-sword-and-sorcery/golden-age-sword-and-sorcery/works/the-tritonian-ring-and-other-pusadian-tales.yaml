placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Classic S&S -> Pulp S&S -> Golden Age S&S. SFE places de Camp’s later fantasy in sword and sorcery; Hachette follows Prince Vakar’s perilous quest through an Atlantis-like Bronze Age world of real gods, magic, savage countries and an ensorcelled queen. The 1951-53 Pusadian tales belong to the older pulp wave.'

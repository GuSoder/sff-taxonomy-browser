placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and Sorcery > Classic Sword and Sorcery
  > Pulp S&S. Tor 2025, Rising Tide #1: a laundress kills the king and runs from a bounty hunter (the Hawk, a Menagerie mercenary
  in a magical animal mask). Action-forward chase, grim mercenary world, small cast; reviewers place it in the sword-and-sorcery
  tradition and the jacket carries a Glen Cook blurb. That is the Black Company end of Pulp S&S. Rejected: Caper (not a heist
  or gang job), Pirate, Sword and planet, Technofantasy, Evergreen (foundations, not a 2025 debut), Epic > Political/Revolutionary
  fantasy (the killing is the inciting act, the book is a chase), Heroic > Rogue hero (Anji is a laundress, not trained).
  Wobble: Pulp S&S''s definition names a historical run through The Black Company; this is a modern book in that lineage,
  and the hidden Revival shelf was pulled up into Pulp by the curator''s earlier ruling.'

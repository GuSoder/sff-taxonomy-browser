placement_rationale: 'Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Classic S&S > Pulp S&S. Whole three-novel
  Lot Lands trilogy, each novel''s own publisher/finished-review engine checked. Grey Bastards (first Ballymalis print 2015,
  not the 2018 Crown relaunch): Jackal challenges the Claymaster, is cast out, travels among half-orc/halfling/elf/centaur
  threats, investigates the patrols'' real purpose, faces dark sorcery and a destroyed home. True Bastards (2019): Fetch leads
  the scattered hoof from Winsome amid famine, rival chiefs and Hisparthan pressure, struggles with illness/heritage and undertakes
  personal journeys through elven lands against an orc wizard. Not merely more of Jackal''s first-book road. Free Bastards
  (2021): Oats starts behind enemy lines on rescue, sees open war against Hispartha, then goes with the suspect Crafty to
  the human court as diplomat; battle gives way to negotiating independence, plague as leverage, and chosen-family costs.
  Completed reviewers expressly note the mid-book change from war to court. Do not classify all three as a frontline campaign
  from the third''s opening blurb. Creator explicitly says the books draw on pulp Sword & Sorcery/comics as well as epic fantasy,
  and that he deliberately reined the ''war book'' away from big sweeping battles into the Bastards'' personal relationships.
  The changing single-POV action adventures, hero/hoof survival, sorcerous confrontations, rescue and treacherous bargaining
  remain the governing form across the trilogy. This attested contemporary continuation of the pulp lineage fits Pulp beside
  contemporary Hanuvar/Anji; not a claim these were historical magazine publications or commercially perpetual Evergreen foundations.
  Fantasy positive magic/gods/creatures; invented Lots/Hispartha/Dhar''gest not Earth, counterpart historical kingdom or technological
  post-apocalypse despite Mad Max comparisons. Epic/Military is substantial late-volume wobble, acknowledged: no whole-war
  multi-front lens, and the central hoof is not primarily studied as an army unit across all three. Soldier fantasy is a serious
  alternative but the personal quest/outcast/chief/selfhood adventures precede the campaign and continue in diplomacy. Heroic
  class tree privileges one primary power, while Jackal''s divine arm, Fetch''s inherited magic, Oats'' strength and the shared
  hoof successively govern; not Beast master merely because all ride hogs. Quest lacks one sustained consequential road across
  the three; True is settlement/chief centered, Free goes battle/court. Political/Revolutionary is the strongest alternative:
  all seek the Lots'' freedom from Hisparthan tyranny and former slave status, but the works'' intimate personal adventure
  form outweighs treating them primarily as the operation of a liberating movement. No definition widened. Outlaw specifically
  requires a covert rescue network for a criminalized class; scattered rescues here do not make that the whole engine. Emancipation''s
  bondage/caste mechanism has real overlap but its gate contrasts mass uprising/occupying empire, while the final novel''s
  coalition, open war and independence negotiations make that imperfect. Overthrow''s internal state remaking not a straightforward
  fit to frontier independence; Proletariat is not generic oppressed species outside its city/class-order gate. Rebel/Evil
  empire''s systemic imperial resistance across lands is a strong thematic comparison, but the three remain successive personal
  hoof adventures rather than a panoramic wider resistance engine; not Samizdat memory or Tinderbox city uprising. Insurgent
  no governing imperial-insider machine subversion. Messianic does not organize all three around a sacred leader: Oats and
  Fetch are not reducible to Jackal''s god-touch. Caper no governing heist; Pirate no sea-raiding life; Tournament no organized
  contest; Technofantasy/Sword-and-planet no technological or planetary frame. Gothic/Comic/Heart/Fairytale/Far-shores do
  not govern: gritty jokes and real affection do not turn the series into a comedy, romance/cozy/mount bond, terror plot or
  culture-first travel. Three continuity novels confirmed by publisher/creator; no per-volume split. Author''s 2021 hope of
  future stories is not proof of a released fourth. Original years 2015/2019/2021; selected English official publisher paperback
  fronts are later 2019/2020/2022 printings, not first-jacket claims. Exact concluding constitutional terms or character deaths
  not asserted from spoiler-avoiding reviews.'

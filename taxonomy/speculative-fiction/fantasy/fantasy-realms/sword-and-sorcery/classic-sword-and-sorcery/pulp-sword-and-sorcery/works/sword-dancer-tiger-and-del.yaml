placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Classic S&S
  > Pulp S&S. Literal runesword, sorcery and magecraft in an invented North/South/Skandi world establish Fantasy
  realms, not scientific explanation, historical Earth or an Earth portal crossing. Whole eight published novels
  follow Tiger and Del through rescue, revenge, trial-by-combat, possession, origins, exile and family danger. Intimate
  action/adventure is the persistent engine, not a campaign of armies or dynastic statecraft. Epic/Heroic > Outcast
  knights is a genuine rival: the pair are exiled sword masters, but their continuing magic and Tiger''s later magecraft
  prevent a purely martial-class reduction. The broad journey/worldbuilding Epic resemblance is weaker than the
  continuing sword-and-sorcery adventure lineage. Heart/Romantasy is also real, but the established couple''s later
  heritage, magic and family adventures extend beyond forming or securing the romance. Far shores: North/South cultural
  echoes are mixed invented-world adventure rather than one sustained counterpart tradition. Gothic menace, comic
  tone and inherited fairy-tale revision do not govern the whole. Within S&S, formal sword-dances recur but the
  whole fiction is not one rules/prize/deadline tournament; pirate voyage is only book5, no scientific sword-and-planet,
  technomancy or caper-job engine. Classic lineage, not timeless foundational Evergreen: the 1986-onward revival
  continues the pulp adventure tradition. Current Pulp8->9, below structural gate. Later volumes broaden magical
  stakes and book8 has a world-threatening weather-working source, but remains the trio''s personal journey and
  magical confrontation, not a shift into war/statecraft. Confidence moderate on competing Heroic/Romantasy routes;
  no claim of unanimous genre labeling or full novel reading.'

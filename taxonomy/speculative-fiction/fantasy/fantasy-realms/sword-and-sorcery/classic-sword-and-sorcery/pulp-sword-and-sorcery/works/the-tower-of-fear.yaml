placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Classic S&S > Pulp S&S.
  The Tower of Fear is the last temple of the bloodthirsty god Gorloch in the city of Qushmarrah; after six years of occupation
  by the Herodians and their desert allies the Dartars, the dead high priest Nakar''s wife, the Witch, searches for his soul
  while the resistance, the Living, plots (Publishers Weekly review of the 1989 Tor hardcover, which calls it sword-and-sorcery
  adventure with a touch of the Arabian Nights). A grim mercenary-style tale of wizards, a vengeful god and a conquered city
  by the author of The Black Company, which sits in the same leaf. Rejected: War insurgents (the resistance is not inside
  the empire''s war machine), Invented mythology (Gorloch is a local god, not a built mythology), Court intrigue branches
  (the court is not the story). Wobble: moderate; the occupation intrigue and resurrection plot are heavier than the S&S adventure
  label suggests, and I read only the PW review. First edition 1989 (the queue showed a 2007 reissue).'

first_published: 2023
canonical_genre: pulp-sword-and-sorcery
placement_status: accepted
placement_rationale: 'Whole-fiction reinterrogation 2026-11-05. Speculative fiction > Fantasy > Fantasy realms >
  Sword and sorcery > Classic S&S > Pulp S&S retained after all three published books. Own publisher series currently
  lists Lord of a Shattered Land (August 1, 2023), The City of Marble and Blood (October 3, 2023), Shadow of the
  Smoking Mountain (October 1, 2024). These are episodic novels, with intended overarching plots from conception,
  not unconnected anthologies; the author''s old web page calls early sequences collections, a real format caveat.
  Independent Grimdark Magazine and Black Gate explain novel structure and planned metaplots. Book4 Daughters of
  the Silver Towers is not a released book: 2024 interview''s writing plan is superseded by January2026 Black Gate
  report and publisher''s current three-book list. No invented conclusion or forthcoming date. Vol1 begins after
  war lost: former general Hanuvar rescues enslaved Volani, looks for his daughter, meets playwright Antires, uses
  disguise, heists and small battles with men/monsters. Vol2 Dervan capital, allies including former enemy Ciprion,
  spy contacts, shipbuilding/extraction, rapidly deaging curse and threat of the Revenants; his daughter''s possible
  escape/murders draw pursuit. Vol3 southern provinces, niece/daughter search, Aleria ally/romance, Calenius/Vanished
  Ones ruins and volcanic magic climax, confirmation relatives alive rather than completed rescue. Root Fantasy
  positive sorcery/demons, not technological explanation. Fantasy realms: fictional Volanus/Derva/Herrenia, not
  actual Carthage/Rome with a historical divergence; author''s Hannibal analogy not sufficient for Alt antiquity
  fantasy. S&S over Epic because immediate hero''s cunning/combat/rescue episodes govern rather than institutional-worldbuilding/campaign
  study. Prior rationale''s revenge campaign corrected: he avoids gratuitous revenge, rescues people with no army.
  Political alternatives genuinely tested: Emancipation explicitly excludes rescue networks; Outlaw requires class
  criminalized by its own state rather than conquered people enslaved by occupying empire. Insurgent/Pirate overlap
  with disguises/secret rescue is strong, but overthrow/subversion of empire is not the governing goal: he works
  with a more accommodating emperor''s general to get families safe, not conquer Derva, and the principal episodes
  remain intimate monster/sorcerer/outwit adventures. Rebel/Tinderbox no central open revolt, despite separate gladiator
  rebellion complicating vol3. Military no sustained troop campaign as governing work. Vengeance no vengeance engine;
  Quest no quest-object/destiny mission governing; Far Shores no culture-first aboutness beyond Mediterranean counterpart
  texture. Existing Classic/Pulp lineage fits action-adventure form; not a claim of Evergreen commercial longevity.
  One fiction, three published novels, no definition change. Original whole-fiction authority phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX.'

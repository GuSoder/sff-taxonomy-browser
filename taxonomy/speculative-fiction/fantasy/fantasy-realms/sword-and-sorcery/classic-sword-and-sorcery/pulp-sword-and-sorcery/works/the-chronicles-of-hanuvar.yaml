placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Sword and sorcery > Classic S&S > Pulp S&S.
  Hanuvar, the last general of the razed city-state Volanus, runs hard-fought campaigns across an ancient-world-flavoured
  invented map against the Dervan Empire, whose mages cursed his city; Baen sells the series as the work of the leading sword-and-sorcery
  author of the century, and the Black Gate review reads it as a rebirth of the genre (Baen, howardandrewjones.com, Black
  Gate). The action-first revival of the pulp tradition is the leaf''s definition. Rejected: Evergreen S&S (not a foundational
  escapee), Army fantasy (one hero''s campaign, not the whole war''s armies), Classic quest fantasy (no quest object). Wobble:
  moderate; the vengeance and military-campaign engine pulls toward Army fantasy and Vengeance torment. Sources: Baen, Simon
  & Schuster, Black Gate. The queue shows 2020; first publication is Oct 3, 2023. Book one (Lord of a Shattered Land, Aug
  2023) is not in the queue and is not placed.'

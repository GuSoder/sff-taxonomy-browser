placement_rationale: 'Corum: The Prince in the Scarlet Robe (The Knight of the Swords, 1971; Gollancz and PRH blurbs): Corum
  is the last of the Vadhagh, his family slaughtered by the Mabden, who sets out on a quest of vengeance against the Lords
  of Chaos, trading his soul for the limbs of gods to replace his lost hand and eye. Folded: The Prince with the Silver Hand.
  Walk: Fantasy > Sword and Sorcery > Classic sword and sorcery > Evergreen sword and sorcery (an Eternal Champion hero''s
  sword-and-vengeance saga, the same lineage as the Elric card already there). Tried Technofantasy (the gods'' limbs are myth,
  not machinery). Sources: Gollancz, PRH; not read.'

placement_rationale: 'Root-down: Fantasy -> Fantasy Realms -> Sword and Sorcery -> Fantasy mystery. Tor grounds an alternate 1880s London where angels, vampires and werewolves are public facts; its Sherlock-Holmes incarnation follows Doyle and Crow through linked supernatural mysteries and Jack the Ripper murders. Investigation is the structure and fantastic evidence is indispensable, so Fantasy mystery governs over Gaslight atmosphere.'

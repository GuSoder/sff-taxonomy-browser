first_published: 2019
canonical_genre: fairytale-transplant
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Fantasy: the thirteen fairies'' naming-day blessings and curse
  demonstrably work - real magic, which the curator''s boundary ruling puts in Fantasy, starships notwithstanding (phonemsg-01M6XV98C5QQJMV0SG7MW59N40,
  2026-11-08) -> Fantasy realms: an invented interstellar polity (the Thorne Consortium and its neighbor worlds), not our Earth
  and no portal from Earth -> Fairytale fantasy: deliberately revises a recognizable fairy tale - Sleeping Beauty''s naming
  ceremony, the uninvited thirteenth fairy''s curse, the gender-flipped firstborn heir -> Fairytale transplant: the governing
  revision is relocation, the tale moved into a different setting, an interstellar spacefaring culture; that relocation is
  what the fiction is famous for ("The Princess Bride meets Princess Leia"; Bibliosanctum: "reads almost exactly like a fairy
  tale set in a space kingdom"), so the famous-concept license of the curator''s 2026-11-08 ruling (phonemsg-01M6XKB91QD65FFYNC4FDMM2H4)
  places it. Rejected: Fairytale inversion (flips exist - the curse is a gift, the princess rescues the prince - but the flip
  is garnish on the relocation, not the governing engine); Fairytale expansion (the tale neither becomes a cosmology nor plays
  out and then continues; its script is reworked from page one). The transplant gate reads "a different historical period,
  culture, or contemporary setting"; the engine is relocation of a familiar tale to a different setting, and membership being
  Earthbound to date is not a gate restriction. Sidebars disclosed per book: from book 2 the series outgrows the Sleeping
  Beauty script into original space adventures, and the Nightwatch (Weep) duology runs as frontier mystery with arithmancy -
  same shared universe, one card under rule11j (PRH: the duology is "set in the universe of Rory Thorne"), riding under the
  famous-concept license. DAW covers name the first pair "The Thorne Chronicles"; PRH names the duology "The Weep".'

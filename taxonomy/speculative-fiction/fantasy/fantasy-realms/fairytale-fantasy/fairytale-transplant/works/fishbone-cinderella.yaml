placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale transplant.
  Per Penguin Random House and Publishers Weekly (starred), published 28 Jul 2026: the Cinderella tale, with the fishbone
  of its East Asian tellings, relocated to 1940s Hong Kong, where Ha Yut Ying escapes Japanese soldiers by turning invisible
  and becomes her stepfamily''s servant, and 1960s San Francisco, where her daughter Marigold watches her mother vanish; a
  family curse runs through both. A familiar fairytale moved into a different period and culture is the Fairytale transplant
  definition. Rejected: Fairytale inversion (the tale is carried through, not turned over), Fairytale expansion (no larger
  invented world or mythology), the magic realism leaves (Real-earth, but the magic here is a curse and a tale, not an unstable
  reality or an impossible sense). Wobble: PRH itself calls the magic a shimmer inside a historical saga, so historical fiction
  is the nearest rival outside the scope. Year 2026.'

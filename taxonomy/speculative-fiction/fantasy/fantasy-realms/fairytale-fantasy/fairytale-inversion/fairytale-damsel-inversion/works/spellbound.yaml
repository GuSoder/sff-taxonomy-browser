placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale inversion.
  On a windswept island castle a royal heir is born and three women (Violanna, Meredyth and Sel) trick a blessing-and-curse
  ceremony with a misdirect; there is no enchanted sleep for the princess and no prince to wake her, and the tagline asks
  what if Beauty never went to sleep (author''s site, georgialeightonauthor.com/spellbound). It is Sleeping Beauty with its
  expected meaning reversed and the women, not the prince, driving the story, which is the leaf''s definition. Rejected: Fairytale
  expansion (no larger original world is built from the seed), Fairytale transplant (the setting is a castle on an island
  in a secondary world, not a relocation in period or culture), Invented fairytales (the tale is the inherited one). Wobble:
  moderate; it could also sit with expansion, but the point is the reversal of the sleep and the rescue. Also noted: the same
  author''s other books are not in the queue. Split walk 2026-10-09 (phonemsg-01M4FQFYJE8WBFFVWS6YQS0JR4): Root-down: Speculative
  fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale inversion > Fairytale damsel inversion. There is no enchanted
  sleep and no prince to wake the princess. WEAK CARD: it drops the sleep and keeps the tale''s shape.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairy-tale fantasy > Fairy-tale inversion.
  Not the same book as Elana K. Arnold''s Damsel (2018, already in this leaf): this is the 2023 novelization of Dan Mazeau''s
  Netflix screenplay. Elodie marries a prince to save her famine-struck realm and learns the kingdom sacrifices its princesses
  to a dragon; she fights it herself. The engine is the reversal of the dragon-slayer-rescues-damsel tale, so Fairy-tale inversion,
  the same leaf as Arnold''s. Tie-ins are in scope per the intake README. Rejected: Romantasy (the marriage is the trap, not
  the romance), Warrior hero (the reversal, not trained martial power, drives the plot). Title carries the author because
  of the id collision with Arnold''s Damsel. Wobble: the cover is the Netflix tie-in jacket held by Open Library; no clean
  original-jacket image was found. Split walk 2026-10-09 (phonemsg-01M4FQFYJE8WBFFVWS6YQS0JR4): Root-down: Speculative fiction
  > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale inversion > Fairytale damsel inversion. A bride married to save
  a famine-struck realm learns the kingdom sacrifices its brides: the rescue role is a trap.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale inversion.
  A darkly magical retelling of ''Sleeping Beauty'' told by the villain, the sorceress Alyce the Dark Grace, who loves the
  cursed Princess Aurora; the wicked fairy''s story reverses who is the monster (author site, heatherrwalter.com; Penguin
  Random House). It reverses a familiar tale''s perspective and moral alignment, the leaf''s definition. Rejected: Fairytale
  transplant (same Briar kingdom setting, no new period), Fairytale expansion (the tale is not a seed for a larger mythology),
  Bonded romantasy (at nine; the romance is the engine but the inverted tale is the premise). Wobble: low. The duology (Malice,
  Misrule) is one fiction. Sources: author site. Years: 2021 to 2022 (first publication; the queue lists reissue years).'

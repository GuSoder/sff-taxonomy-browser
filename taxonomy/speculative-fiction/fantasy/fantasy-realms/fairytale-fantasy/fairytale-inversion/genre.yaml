id: fairytale-inversion
label: Fairytale inversion
parent: fairytale-fantasy
definition: 'Fiction that reverses a familiar fairytale''s perspective, moral alignment, power structure, or expected meaning.
  Umbrella since 2026-10-09, partitioned by what gets turned over: Fairytale villain inversion (the villain is the protagonist),
  Fairytale damsel inversion (the rescued role is overturned) and Fairytale viewpoint inversion (the camera moves to the tale''s
  margins).'
status: umbrella
taxonomy_note: Provisional descriptive coinage for revision mode; no single established critical term cleanly covers this
  group.

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy realms -> Fairy-tale revision -> Fairy-tale
  inversion. Retells Baum''s Oz from the Wicked Witch of the West''s side, recasting her as an idealistic dissident against
  the Wizard''s totalitarian regime (NYT; LA Times); Kirkus calls it a magical telling of Oz before Dorothy. Perspective and
  moral alignment of a familiar fairy tale are reversed, and Oz has actual magic. Split walk 2026-10-09 (phonemsg-01M4FQFYJE8WBFFVWS6YQS0JR4):
  Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale inversion > Fairytale villain
  inversion. The Wicked Witch of the West becomes the heroine of Oz.'

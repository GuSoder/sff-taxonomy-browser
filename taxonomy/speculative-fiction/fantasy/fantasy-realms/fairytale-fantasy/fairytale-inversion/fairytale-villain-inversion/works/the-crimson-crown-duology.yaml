placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale inversion
  > Fairytale villain inversion. Snow White''s wicked queen tells her side of the story: the heartless villain of the tale
  is the witch who became a queen, and the second book follows her rise to her destiny (Penguin Random House; Penguin UK).
  The villain as protagonist is the leaf''s definition. Rejected: Fairytale damsel inversion (no rescued role is overturned,
  the queen''s rise is the story), Fairytale viewpoint inversion (she is the antagonist, not a bystander). Wobble: low; same
  author and mode as Malice in the same leaf. Sources: PRH book pages. Years: The Crimson Crown first published Aug 2024 (the
  queue''s 2025 is the paperback); The Witch Queen Aug 11, 2026.'

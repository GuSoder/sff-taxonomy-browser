placement_rationale: 'Leife Shallcross''s The Beast''s Heart (2018; PRH, Black Gate): a retelling of Beauty and the Beast
  in seventeenth-century France told by the Beast himself, a cursed, wild creature who has roamed his ruined chateau for over
  a century, driving everyone away, and whose own shameful act in luring Beauty''s father into his house the story owns up
  to. Walk: Fantasy realms > Fairytale fantasy > Fairytale inversion > Fairytale villain inversion (the tale''s monster, the
  figure the tale casts as the threat, becomes the protagonist and tells it from his own side). Alternatives: Fairytale viewpoint
  inversion (the camera moves to the margins, but the Beast is the centre of the tale, not the margin); Fairytale transplant
  (it is set in a real era, 1600s France, but the point is the voice). Wobble: moderate. Sources: PRH, Black Gate, Earl Grey
  Editing; not read.'

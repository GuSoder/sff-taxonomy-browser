placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale inversion
  > Fairytale viewpoint inversion. Mercedes Lackey''s The Black Swan (1999, queue row MC06782 lists the 2000 DAW reprint):
  the Swan Lake tale (Kirkus calls it a reworking of an Old Russian folk tale) retold from its margins: the sorcerer Baron
  von Rothbart''s daughter Odile, the ''black swan'' of the story, studies sorcery to win his approval while guarding his
  swan-maiden captives, and slowly doubts him; Odette schemes for freedom; the ending is happier than the folk tale (Kirkus;
  All About Romance; Lackey''s site, which files it as a standalone Retold Fairy Tale). The camera moves to Odile and the
  household at the tale''s edge, which is the Fairytale viewpoint inversion definition (not Villain inversion: the Baron is
  not the protagonist; not Epilogue: the tale is retold, not continued). Single novel, no shared universe with Firebird. Sources:
  https://www.kirkusreviews.com/book-reviews/mercedes-lackey/the-black-swan/ ; https://allaboutromance.com/book-review/the-black-swan-2/
  ; https://www.mercedeslackey.com/p/black-swan'

placement_rationale: 'Laura J. Mayo''s Cinderella trilogy (How to Summon a Fairy Godmother, How to Survive a Fairy Bargain,
  There''s Something Wrong with Prince Charming; Orbit; Publishers Weekly, author site): the ''wicked stepsister'' Lady Theodosia
  Balfour, whose stepsister Beatrice won Prince Duncan with a fairy godmother''s help and whose family is now painted as evil,
  summons a fairy godmother of her own to get her other sister out of a marriage; part humorous fairy tale, part twisty mystery.
  One heroine across the series, so one card. Walk: Fantasy realms > Fairytale fantasy > Fairytale inversion > Fairytale viewpoint
  inversion (the camera moves to someone at the tale''s margins, such as a stepsister). Sources: Publishers Weekly, laurajmayo.com;
  not read.'

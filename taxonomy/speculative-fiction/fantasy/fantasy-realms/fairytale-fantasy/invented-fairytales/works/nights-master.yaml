placement_rationale: 'Tanith Lee''s Night''s Master (DAW, 1978; Wikipedia, Tales from the Flat Earth), first of the Flat Earth
  cycle, with Death''s Master (1979), Delusion''s Master (1981), Delirium''s Mistress (1986) and Night''s Sorceries (1987)
  folded in as the later volumes: a series modelled on One Thousand and One Nights and built, like it, from interconnected
  stories, set on a flat world floating in chaos with demons beneath it, indifferent gods above and the dead within; Azhrarn,
  Prince of Demons and Night''s Master, with Uhlume (Death), Chuz (Madness) and Kheshmet (Fortune) work wonder, cruelty and
  bargains on mortals, and Azhrarn''s half-mortal daughter Azhriaz carries the later books. Walk: Fantasy > Fantasy realms
  > Fairytale fantasy > Invented fairytales (newly invented tales, a linked cycle with fable and enchantment logic). Tried:
  Godforsaken realms (demonic powers shape the world, but the books are told as tales, not as dread of an enclosed realm)
  and Invented mythology (at nine; the cosmology is the setting, the tales are the form). Wobble: Godforsaken realms is the
  alternative leaf. Source: Wikipedia series page only.'

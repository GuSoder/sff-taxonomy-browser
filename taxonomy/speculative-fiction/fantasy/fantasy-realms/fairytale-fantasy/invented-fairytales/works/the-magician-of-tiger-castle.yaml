placement_rationale: 'A newly invented fairytale, not a revision of an inherited one: an immortal court magician narrates
  from today how, in the 1500s Ruritanian kingdom of Esquaveta, his king charged him to make Princess Tullia fall out of love
  with the scribe she loves so a dynastic marriage could proceed - fable and enchantment logic organize the whole story (Library
  Journal ''cozy fantasy'', Kirkus ''heartfelt fable'', Reactor ''a fairy tale''). Cozy fantasy was rejected on the walk:
  real menace (the king''s threat hangs over everyone) and no house, trade or found-family engine; ''cozy'' is the register,
  not the structure.'

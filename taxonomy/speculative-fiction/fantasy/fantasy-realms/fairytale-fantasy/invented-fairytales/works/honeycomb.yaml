placement_status: accepted
placement_rationale: 'One fiction (rule 11j): Joanne Harris''s Honeycomb world - Honeycomb (2021) and The Moonlight Market
  (2024). The author''s own site ties them: The Moonlight Market ''is very much part of my Honeycomb world... A snapshot of
  it exists in Honeycomb, and there are nods in it to Orfeia and to my other novellas'' (joanne-harris.co.uk/the-moonlight-market);
  both feature the Silken Folk and the Spider''s web between the Nine Worlds (NZ Herald review: the Spider Mage ''spins a
  web between the Nine Worlds''). Root-down: Fantasy -> Fantasy realms -> Fairytale fantasy -> Invented fairytales: Honeycomb
  is a mosaic of 100 original fairy-story cells (Lacewing King, Silken Folk), and The Moonlight Market is an original adult
  fairytale whose engine is fable and enchantment logic - no recognizable inherited tale is revised (Reactor: ''a perfectly
  paced gem of a modern fairytale''; Library Journal: ''a consistently delightful fairy tale''; Kirkus). Rejected: Contemporary
  fantasy > Folktale (not humorous/animal-tale shaped) and Urban fantasy (the London setting is contemporary, but the story''s
  engine is fairytale enchantment, not an urban occult system; the fiction''s center is the Nine Worlds cycle). The folklore
  novellas A Pocketful of Crows, The Blue Salt Road and Orfeia share this world per the author but stay excluded as novellas
  (queue MC04601-03). Ancestor reconciliation (whole-fiction): the fantasy root splits by setting (real earth vs invented
  realms). The fiction''s speculative engine and unifying element is the invented Nine Worlds cosmology - Honeycomb (2021)
  sits wholly inside it, and The Moonlight Market''s plot is the Silken Folk''s exile from and return to the Kingdom, a Nine
  Worlds story told from the London margin (author site: the Market is ''part of my Honeycomb world''). The fairytale-fantasy
  ancestor explicitly covers fiction that ''purposely borrows fairy-tale mechanics to create an invented fairy tale'' with
  no setting constraint, and this leaf''s accepted definition holds ''one tale, a linked cycle or a novel'' - era- and setting-agnostic,
  with fable/enchantment logic as the test, which The Moonlight Market passes (Reactor, Library Journal). Rejected ancestor-level
  alternatives: modern-invented-myth under contemporary-mythic-fantasy would fit the London half but its gate (''myth alive
  in the present day'') fails Honeycomb, which is not present-day Earth - and would overturn a curator-accepted placement
  for no gain; portal fantasy fails Honeycomb (no Earth crossing) and the Market appears inside London rather than through
  a portal-quest structure. Hidden-London precedent (Neverwhere -> urban fantasy) applies to single-Earth fictions, not to
  a fiction anchored in an invented world. No gate changed; placement stands under whole-fiction aboutness. Original Honeycomb
  placement: Owner11:01:53 approval phonemsg-01M3VB5RS19WN2A3YAWQG8ZRTV of bundle phonemsg-01M3VB4DWBRJJVGAJPY2ZDEQ95.'

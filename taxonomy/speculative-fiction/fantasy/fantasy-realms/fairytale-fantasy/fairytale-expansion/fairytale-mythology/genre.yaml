definition: 'Fairytale expansion in which the tale grows into an original mythology: old gods, a demon-forged tinderbox, a
  winter realm with its own king and laws, a cosmology built around the familiar story. Not Fairytale epilogue (the tale''s
  cast or aftermath carry a new human-sized story), not Fairytale transplant (the tale keeps its own place and does not move
  to a new era or culture).'

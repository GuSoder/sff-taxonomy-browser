placement_rationale: 'Tanith Lee''s White as Snow (2000; Tor, Macmillan, Publishers Weekly): Snow White retold in an invented
  warlord land of crumbling palaces and haunted forests: Arpazia, a 14-year-old princess raped by the conquering warlord Draco,
  becomes the cold queen who wants nothing to do with her black-haired, red-lipped daughter Coira; the old gods of the woodland,
  whom a hunter courts, collide with a new religion, and the mirror, the blood and the forest take their course; the tale
  is the frame for a myth of Demeter and Persephone. Walk: Fantasy realms > Fairytale fantasy > Fairytale expansion > Fairytale
  mythology (the tale grown into an original mythology, the old gods against the new faith). Rejected: Fairytale transplant
  (an invented land, not a real era), Fairytale inversion (Arpazia gets a past but the tale is not flipped), Fairytale epilogue
  (it is not a continuation). Wobble: low. Sources: Tor, Macmillan, PW, Google Books; not read. Placed after the Fairytale
  expansion split on the curator''s Execute (phonemsg-01M4QMTYSE2ZB9FHVGRB8A3PKE).'

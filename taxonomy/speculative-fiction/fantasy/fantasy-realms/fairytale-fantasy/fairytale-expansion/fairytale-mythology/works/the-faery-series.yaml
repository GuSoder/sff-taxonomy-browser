placement_rationale: 'Root-down: Fantasy > Fantasy realms > Fairytale fantasy > Fairytale expansion > Fairytale mythology.
  Per McKiernan''s own foreword at mithgar.com and Penguin Random House: the first four books (Once Upon a Winter''s Night,
  Summer Day, Autumn Eve, Spring Morn) are known fairy tales, each retold as a long novel set in the land of Faery, a seasonal
  cycle of Winter, Spring, Summer and Autumn Woods; the fifth, Once Upon a Dreadful Time, grows out of their events, pitting
  the four heroic couples against the wizard Orbane and the witch Hradian. The tales grow into one invented realm with its
  own seasons and powers. Soft: Fairytale epilogue is the runner-up; the sources do not say which tales the books retell beyond
  calling them known tales. One card for the five-book series.'

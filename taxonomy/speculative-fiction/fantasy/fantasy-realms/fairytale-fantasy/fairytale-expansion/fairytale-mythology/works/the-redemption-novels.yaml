placement_rationale: 'Shared-universe card (one fiction, two novels). Karen Lord''s own bibliography groups them as The Redemption
  Novels (karenlord.wordpress.com menu); the same Undying cast carries both books - Chance (the indigo djombi lord of the
  first book), the Trickster, Patience - and WWEnd calls Unraveling ''a loose sequel ... appearances by some of the same characters'';
  PRH markets the matched 2024 pair (Unraveling jacket: ''Author of Redemption in Indigo''). Redemption in Indigo (2010, Small
  Beer Press; Mythopoeic Fantasy Award) openly retells the Senegalese folk tale of Ansige the glutton: Paama leaves Ansige
  and the undying djombi hand her the Chaos Stick, and the inherited tale grows into an original cosmology of undying ones,
  tricksters and chaos lore built around the story (Small Beer: ''a clever, contemporary fairy tale ... inspired by a Senegalese
  folk tale''). Unraveling (2024, Random House Worlds) continues inside that cosmology: forensic therapist Miranda Ecuovo
  is seized by Chance to hunt the rogue Undying behind a serial killer, through labyrinths of memory and dream (PRH). The
  fiction''s overarching shape is the original mythology grown out of the folk tale - the fairytale-mythology shape; same
  shelf-shape as tenant Spinning Silver. Rejected: mythic-retelling under historical fantasy (real-Earth gate; Makendha and
  the City are invented places), modern-african-myth (contemporary-present gate; Redemption''s setting is timeless folkloric),
  fairytale-epilogue (the new cosmology, not the tale''s aftermath, carries the fiction).'

placement_rationale: 'Standalone debut novel (2010, Small Beer Press; Mythopoeic Fantasy Award; 2024 Random House Worlds reissue).
  Paama leaves her glutton husband Ansige - the Senegalese folk tale the book openly retells - and the undying djombi hand
  her the Chaos Stick; the indigo-skinned djombi lord who wants it back gives the book its engine and its title redemption.
  The inherited tale grows into an original cosmology of undying ones, tricksters and quantum-chaos lore built around the
  story (Small Beer: ''a clever, contemporary fairy tale ... inspired by a Senegalese folk tale''; Small Axe review: the folktale
  retold with djombi cosmology). Same shelf-shape as tenant Spinning Silver (Rumpelstiltskin grown into a winter-king cosmology).
  Rejected: mythic-retelling under historical fantasy (the gate is real Earth; Makendha is an invented, Senegal-flavored country),
  modern-african-myth (contemporary-present gate; the setting is timeless folkloric, not present-day), fairytale-epilogue
  (the book is not the cast living past the ending; the new mythology, not the aftermath, carries the story).'

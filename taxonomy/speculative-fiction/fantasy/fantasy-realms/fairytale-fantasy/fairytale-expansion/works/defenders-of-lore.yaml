placement_rationale: 'Root-down: Speculative fiction > Fantasy > Fantasy realms > Fairytale fantasy > Fairytale expansion.
  A magical re-imagining of J. M. Barrie: grown-up Michael Darling returns to save Neverland when its god Maponos (Peter Pan)
  goes missing, then follows Captain Hook into Wonderland with Alice, now the Lady who leads the Knights of the Round, amid
  a war of six queens (author site, HarperCollins). The tales are seeds for a larger original mythology of gods, Knights and
  magical threats to the real world, which is the leaf''s definition. Rejected: Fairytale transplant (it was parked there
  at nine; the story is not the familiar tale moved to a new time, but a new world built from several), Fairytale inversion
  (no reversal of perspective or morality). Wobble: Fairytale transplant for the modern-day frame; Peter Pan and Alice are
  literary fairy tales rather than folk tales. Shared universe folded as one fiction under rule 11j: God of Neverland (2021),
  Queens of Wonderland (2023).'

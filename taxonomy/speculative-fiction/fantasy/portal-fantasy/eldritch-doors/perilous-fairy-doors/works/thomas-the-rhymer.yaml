placement_rationale: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Perilous fairy doors. Per
  Wikipedia and EBSCO: a fairytale retelling of the Scottish ballad, in which the singer Thomas Learmonth is taken into Elfland
  by its Queen, serves her there, and returns with the gift of prophecy. A crossing into Faerie itself, whose glamour and
  bargains seduce and cost, is the Perilous fairy doors definition. Rejected: Fae founders (not a modern city), the mythic-retelling
  leaves (no leaf for Scottish ballad myth; the story is the door and the realm beyond). Wobble: it is also a ballad retelling,
  so a Scottish or folk-myth retelling leaf would fit if one existed. Year is first publication 1990, not the queue''s 2004
  reissue.'

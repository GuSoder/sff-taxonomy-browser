placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Perilous fairy doors. PRH describes a marriage between
  a mortal man and an elf princess; Folio and Baen describe Alveric crossing beyond the fields we know into ageless Elfland, then a union that bridges two worlds
  while magic and mortality pull Lirazel apart. Crossing into perilous Faerie and dangerous belonging organize the novel.'

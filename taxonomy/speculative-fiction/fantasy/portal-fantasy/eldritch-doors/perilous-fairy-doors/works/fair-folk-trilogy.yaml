id: fair-folk-trilogy
title: The Fair Folk trilogy
authors:
- Lyra Selene
first_published: 2024
canonical_genre: perilous-fairy-doors
placement_status: accepted
placement_rationale: 'MC06216-18: the complete published Fair Folk trilogy by Lyra Selene, A Feather So Black2024, A Crown
  So Silver2025 and A Heart So Green2026. Author interview, publisher and literary agency all describe a three-book fiction;
  the2026 finale is published, not forthcoming. UK/NZ edition dates differ by days but year/status agree. Same cast, continuing
  action and explicit trilogy continuity. No source establishes a shared universe with the separate Amber and Dusk duology;
  common authorship is not a bridge. No existing Selene fiction found in the app.


  Mechanism and scope: Fia is the changeling left in place of Eala, a human princess stolen into Tir na nOg. A rescue/theft
  commission takes Fia and Rogan through a hidden gate, repeatedly at full moons; the fae lord Irian and Eala''s swan curse
  complicate the mission. Book2 takes Fia and her new husband Irian deeper into the fae world, to the Silver Isle and a dangerous
  Tournament of Kings for the Oak King''s Crown. Book3 follows Fia''s struggle against a celestial entity in her mind, Irian''s
  alliances and the attempt to stop Eala threatening BOTH human and fae realms. The multiple POVs, internal Deep-Dream and
  a new island are not evidence for an unrelated fiction or an itinerary through many independent universes. All three remain
  one continuing human/Faerie conflict, with desire, sacrifice, identity and the balance between realms.


  Root walk: Speculative > Fantasy. Changelings, swan transformations, magical gates, fae gifts, curses and supernatural bargains
  are literal, not a scientific/technological explanation. Historical/Modern/Futurist/Atemporal SF therefore lose. Fantasy
  > Portal is a real setting judgment, not automatic from the word gate. The primary published excerpt names the human land
  Fodla and the Aenach Tailteann. Fodla is a traditional literary name for Ireland, not in itself proof of a wholly invented
  planet; a completed-reader account explicitly identifies this book''s Ireland of mythology and distinguishes it from a loosely
  Ireland-like invented setting. The Celtic institutions and named Tir na nOg support that reading. Confidence MODERATE on
  the mythic-Earth anchor: the publisher does not date a historical century, and the story freely recombines Swan Lake, the
  Twelve Dancing Princesses and Celtic traditions. Do not invent an exact historical era, claim a contemporary Ireland, or
  claim the fictional rulers are historical people. The evidence supports mythological Ireland/Fodla rather than asserting
  that both worlds are entirely invented.


  Portal governs the whole fiction because the central relationship and threat arise from the stolen human princess, changeling
  substitution, forbidden gate traffic, magic taken between the human and fae sides and the final danger to both. This is
  not a token otherworld origin of a monster, unlike a modern-myth story whose action stays in ordinary modern life. Real
  earth/Historical mythic fantasy and Celtic tradition are genuine rivals for the mythological Irish ground, but the active
  crossing and peril of Faerie organize the story more specifically than a past retelling. Contemporary and Future fail the
  setting. Fantasy realms/Heart/Romantasy is the strongest marketing/plot rival: Fia/Irian''s bond is plainly co-equal with
  the external stakes, and their enemies-to-lovers relationship could fit Crown enemies if the entire setting were secondary-world.
  First-book Rogan/Fia childhood attraction is not the whole trilogy''s spine, so it must not drive a Friends-to-lovers placement;
  the triangle does not establish polyamory. The mythic-Earth gate frame is the earlier branch test, so do not force a secondary-world
  ancestor merely because the book is sold as romantasy. Fairytale inversion/expansion is also real: Odile/black-swan-inspired
  Fia becomes the heroine while the white-swan princess becomes the antagonist, and later books expand into a larger mythic/romantic
  conflict. Those current leaves sit under Fantasy realms; neither recognizable Swan Lake furniture nor romantic marketing
  overrules the grounded human/Faerie setting. Epic political power and war, spy skills, tournament action, Gothic danger
  and self-acceptance describe important parts, not a better world-level route.


  Portal full partition: Whimsical doors fails the adult, sensual, violent and predatory register. Transporting tomes fails
  because no text/book conveys the travelers; spell words at a gate are not automatically transporting tomes. Fantasy rifts
  is a genuine rival, but the recurring named forest Gate reached from Dun Darragh and reused month after month is a fixed
  threshold, not a free-floating rupture. Its architectural material is not verified, so no stone arch or invented object
  is asserted. The anchored-gate reading is grounded in the repeated physical site/return conditions, not in an unsupported
  gate-material claim. World bleeds fails because the protagonists actively travel into Faerie. Otherworld summonings/stumblings
  fail as the main mechanism: a queen''s commission is not a magical summoning, and the repeated journey is deliberate, not
  an accidental fall. Wainscot fails because they do cross rather than simply find hidden neighbors. Multiverse is not established
  merely because a fae land, human land and an interior dream state exist; this is one named Faerie otherworld and its relation
  to the human side, not a system of alternate selves or a worldhopping cosmology. A physical planet destination is not established,
  so Planetary portal fails.


  Eldritch doors > Perilous fairy doors. Uncanny thresholds/Quest thresholds is a real rescue-mission rival, while Visionary
  thresholds catches some of Fia''s later inner reckoning. But the destination is explicitly Faerie itself, with Gentry, glamour,
  dangerous beauty, curses, sacrifice, treacherous bargains and the seduction of crossing. The specific Faerie destination
  beats a generic uncanny quest. Nightmare doors is for nightmare realms rather than Faerie, not any dangerous adult fairy
  story. Perilous fairy doors already says this exactly. Whole fiction fits with the book2 deeper-faerie/tournament and book3
  mixed inner-vision/war wobbles retained. Existing leaf7to8, no threshold, no definition or structure change, no new portrait.
  The canonical genre membership list omitted The Bloodless Queen even though its work file and served app card already exist;
  that one local metadata omission is repaired without adding a new fiction or reclassifying it. Overall placement confidence
  moderate, limited chiefly by interpreting mythological Fodla as the Earth-side rather than an entirely invented counterpart.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Perilous fairy doors. Grossman and PRH begin
  with rigorous modern sorcery at Brakebills, but the trilogy’s governing discovery is that Fillory, the childhood-book magical land, is real; Quentin and
  friends cross into an adult, dangerous storybook realm where adventure, predation and belonging have costs.'

placement_rationale: 'Root-down: Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds, by the curator’s explicit
  2026-10-07 ruling: “I’d go eldritch then uncanny threshold”. The publisher excerpt shows a fixed magical sea doorway left
  by Manannán: a ship sinks through the seafloor and emerges at hidden Celtic Tara, an enchanted continent on Earth. Not a
  ritual summoning, accidental rift, or merely adjacent hidden market. The initial walk paused over the bright adventure versus
  darker anchored-door partition; the curator chose this route after asking about the crossing, the other side’s darkness
  and its lack of whimsy. Hereditary ghost-sight and royal identity are real, but the crossing and Tara adventure govern rather
  than ordinary-life ability development. One published 2017 novel; the hoped-for sequel is not a published volume.'

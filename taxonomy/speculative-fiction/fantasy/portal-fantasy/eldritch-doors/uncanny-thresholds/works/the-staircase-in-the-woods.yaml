canonical_genre: uncanny-thresholds
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds. An anchored physical staircase takes the
  friends out of ordinary reality into a terrifying otherworld; their entry, search and escape make the threshold journey the engine. Whimsical doors and perilous
  fairy doors fail the register and fairy-logic tests; transporting tomes and spontaneous fantasy rifts fail the portal mechanism. Unholy halls is the genuine alternative
  for the malevolent dwelling, but the curator explicitly selected Uncanny thresholds on 2026-09-30. Feral house does not fit an evil place. The crossing and return
  govern over place-dwelling horror.'

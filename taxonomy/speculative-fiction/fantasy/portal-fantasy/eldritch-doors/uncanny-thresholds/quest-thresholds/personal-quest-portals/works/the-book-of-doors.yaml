id: the-book-of-doors
title: The Book of Doors
authors:
- Gareth Brown
first_published: 2024
canonical_genre: personal-quest-portals
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest thresholds
  > Personal quest portals.

  Cassie and Izzy use magical doors and are hunted for the book; Drummond and his secret library, other magical books and
  time travel organize an escape/counterattack suspense plot.

  Child choice: Personal quest portals. Qualification: Earth/time travel dominates much of the book. Preserve existing portal
  placement rather than claiming every door goes to an invented realm.

  The approved split follows the governing stakes of the whole fiction, not a count of rescue or battle scenes. Public struggle
  must be sustained to choose Realm-saving portals; wide consequences alone do not override personal stakes. All existing
  books, authors, dates and cover references preserved. Ancestor gates unchanged. Dreamland retains its existing Portal placement
  following the November8 leave-portal-fictions instruction, phonemsg-01M6XFBNFKKVYBD6QZZ8J5N2Y1; this is not a new general
  dream-as-doorway rule. Approved4/6 distribution: phonemsg-01M84B0ESGSGKHX0BW106W5S01 on phonemsg-01M84AMWMA896F2X52GN1J71T5.


  Prior ancestor rationale retained:

  Source-read root-down: Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest thresholds.
  The inherited book turns doorways into routes for a chase, escape and struggle against pursuers. Its destinations can be
  our world and history rather than a separate otherworld; this recorded bend remains, with the dark anchored-threshold adventure
  governing.'

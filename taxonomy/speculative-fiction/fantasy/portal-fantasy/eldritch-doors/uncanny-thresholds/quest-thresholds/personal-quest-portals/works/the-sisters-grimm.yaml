placement_rationale: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest
  thresholds > Personal quest portals. Menna van Praag''s Sisters Grimm trilogy: The Sisters Grimm (2020), Night of Demons
  and Saints (first published 3 Feb 2022, Bantam Press/Transworld hardback, then US paperback 25 Oct 2022; queue MC06688 ''The
  Night of Demons and Saints'' is the title of a Harper Voyager hardback once scheduled for 22 Jun 2021 that ISFDB records
  as unpublished, so the book''s date is 2022 and its title has no ''The''; sources https://blackwells.co.uk/bookshop/product/Night-of-Demons-and-Saints-by-Menna-van-Praag/9781787631687
  , https://www.isfdb.org/cgi-bin/ea.cgi?186442= , https://www.harpercollins.com/products/night-of-demons-and-saints-menna-van-praag)
  and Child of Earth & Sky (2023), all novels (ISFDB author record 186442, FantasticFiction, author site). Whole-corpus gate
  check: four half-sisters in contemporary Cambridge cross, through the city''s ornate gateways that open as portals at 3.33am
  once a lunar month, into Everwhere, a parallel winter otherworld (author: a Narnia tribute; Velvet interview). Book 1 is
  about escaping the demon father Wilhelm Grimm''s soldiers and meeting him in Everwhere; book 2 returns to Everwhere on their
  21st birthday to resurrect Goldie''s dead lover; book 3 has Goldie reclaiming her daughter Luna, who she can only meet in
  Everwhere, while something corrupts the realm. Earth start plus a standing Cambridge threshold and a crossing in every book
  meets the Portal gate (the Magical coming-of-age reading is the identity theme, not the organizing exchange). Anchored physical
  threshold and dark, adult-leaning tone mean Eldritch doors. Personal quest portals: pursuit by the father''s soldiers, a
  resurrection, a lost daughter; the realm is affected (corruption in book 3) but no public campaign to save it governs the
  fiction. Tried: Realm-saving portals (stakes in books 1 and 2 are the sisters'' lives and a lover), Otherworld fantasy (Summonings,
  Wainscot: the doors are standing Cambridge gateways, not a summons or an adjacency), Magical coming-of-age. Wobble: Otherworld
  summonings is the second-closest. Magical Cambridge (Hope Street etc.) is a separate magical-realism series, not part of
  this universe and not queued. Sources: https://www.penguin.co.uk/books/439541/the-sisters-grimm-by-menna-van-praag/9781784164614
  ; https://www.velvetmag.co.uk/whats-on/books-menna-van-praag-talks-fantasy-and-feminism-9108040/ ; https://www.theguardian.com/books/2020/feb/16/the-sisters-grimm-menna-van-praag-review
  ; https://www.penguin.co.uk/books/439556/child-of-earth-and-sky-by-praag-menna-van/9781804991138 ; https://www.libraryjournal.com/review/night-of-demons-and-saints-1791877
  ; https://www.fantasticfiction.com/p/menna-van-praag/ ; https://www.isfdb.org/cgi-bin/ea.cgi?186442='

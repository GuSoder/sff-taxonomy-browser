id: the-sword-of-michael
title: The Sword of Michael
authors:
- Marcus Wynne
first_published: 2014
canonical_genre: personal-quest-portals
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest thresholds
  > Personal quest portals.

  Professional shaman enters Lower World through a hollow oak; later stolen souls require Hell rescue and confronting Belial.
  One verified published novel.

  Child choice: Personal quest portals. Qualification: Biblical and shamanic cosmology has larger stakes but the loved-ones
  rescue is the organizing task. Exact final Hell entry is not established in free sample; do not claim it uses the same oak.

  The approved split follows the governing stakes of the whole fiction, not a count of rescue or battle scenes. Public struggle
  must be sustained to choose Realm-saving portals; wide consequences alone do not override personal stakes. All existing
  books, authors, dates and cover references preserved. Ancestor gates unchanged. Dreamland retains its existing Portal placement
  following the November8 leave-portal-fictions instruction, phonemsg-01M6XFBNFKKVYBD6QZZ8J5N2Y1; this is not a new general
  dream-as-doorway rule. Approved4/6 distribution: phonemsg-01M84B0ESGSGKHX0BW106W5S01 on phonemsg-01M84AMWMA896F2X52GN1J71T5.


  Prior ancestor rationale retained:

  # The Sword of Michael, whole-fiction walk, 23 November2026


  Verdict: existing Quest thresholds, ninth to tenth fiction. Freeze intake and research the required split immediately, no
  eleventh. One novel2014, the only currently verified published Depossessionist title in publisher and series bibliography.
  Planned saga does not establish unpublished volumes. Wynne''s other thrillers are separate series in current bibliographies;
  shared shamanism and spiritual concerns do not prove shared universe. Exact author-name/title check found no existing Marcus
  Wynne card. John Gwynne and Diana Wynne Jones are not name matches.


  Speculative fiction > Fantasy: objectively presented spirits, magical healing, angels and an actual soul-rescue journey.
  Primary Baen sample chapters2-4 has a working supernatural cosmology and a spirit leaving its body, passing through a tree
  hollow and tunnel into a populated Lower World, then returning. Not SF: technological psychic manipulation occurs but does
  not explain away angels, Spirit World or sorcery; not a merely psychological/ambiguous haunting. Literal occult content
  wins over gun-thriller furniture.


  Fantasy > Portal fantasy is chosen on the defining rescue beyond our world, confirmed by publisher, author interview and
  two completed reviews. Marius works in modern Minneapolis and Decanter, Minnesota, but the main threat takes his loved ones''
  souls into Hell and requires entry and descent through its powers to confront Belial. Crossing is a continuing professional
  practice before the main rescue, not an incidental dream. In chapter3 his spirit uses an actual Lake Harriet oak-tree hollow
  as his regular anchored portal and emerges in the Lower World. Publisher describes storming the underworld''s gates; completed
  Bookreporter review makes the rescue the governing escalation. Spiritual rather than fleshly travel does not erase crossing.
  No wholly invented Fantasy realms route, because named modern Earth and its traffic with other realms are indispensable.
  Real earth > Contemporary remains a serious rival for its modern professional-spirit frame; its own ancestor permits excursions,
  but here the outer-realm rescue is the title''s central outward task, not a single side visit.


  Portal children: Whimsical doors fails adult violence and occult register. Transporting tomes fails: no text/book/reading
  causes the crossing. Fantasy rifts fails anchored route evidence rather than free-floating rupture. Multiverse is a cosmological
  rival because Lower/Other Realms and Hell are named, but the narrative is not a tour of counterpart worlds or a many-world
  institutional trek; the purposeful anchored spirit passage serves one rescue. Mere plurality of metaphysical layers does
  not force multiverse. Otherworld summonings/stumblings fail voluntary trained journey; Wainscot/world-bleeds fail actual
  travel; planetary fails no physical planet destination.


  Portal > Eldritch doors: dark/adult with anchored threshold. Eldritch children: not Faerie''s glamour/bargains, not nightmare
  storybook realm. Uncanny thresholds admits solemn metaphysical adventure and horror rescue. Visionary thresholds loses despite
  shamanic vision/compassion: the crossing serves finding, fighting and retrieving souls, not chiefly contemplation. Quest
  thresholds has a positive explicit rescue/mission gate and existing threshold-rescue precedents, including The Staircase
  in the Woods and The Lion of Farside.


  Counterfactual Contemporary children checked before accepting route: Modern biblical myth is strongest, actual Michael/Creator/Mary
  and Belial active alongside Lakota guides and Wiccan/NewAge practice, not a Bible-story retelling. But contemporary religious
  powers are the arsenal/cosmology through which a cross-realm rescue operates. Other Contemporary myth roots are secondary/syncretic
  rather than any named myth tradition dominating; invented myth not appropriate for inherited biblical powers. Magical coming-of-age
  fails experienced adult, domestic fails household not story site. Dark > Satanic torment competes with reincarnated possessed
  sorcerer''s targeted vengeance, but Marius is an effective healer/warrior undertaking the rescue, not chiefly a victim suffering
  intrusion. Horror place branches fail neither forbidden place as primary menace nor folk community. Supernatural > Ghost
  speakers/Paranormal competes for his profession but not whole rescue architecture. No evil bargain by protagonist, no afterlife
  residency or deathlessness quest; vampires/werewolves only incidental listed foes. Urban gates not inferred from Minneapolis
  alone; occult PI/counter-ops are jobs/assets, not defining case or agency structure, no police, knight or company appointment.
  Coming-of-age, domestic, magical realism and folktale fail adult calling, public supernatural reality and action rather
  than household/accepted marvel/comedy or animal moral tale. Future fantasy fails actual current world, not its possible
  future apocalypse.


  Wobble moderate: only first8 publisher sample chapters read, not full novel. The Hell-rescue engine is publisher plus completed-review
  evidence, while the precise late Hell entry is not directly available in the free sample. Anchored spirit-crossing method
  is directly shown in chapter3; no claim every gate is the same oak. This is a primary grounded gate fit, not a new definition
  or exception. The author''s interview and publisher marketing call it contemporary/urban fantasy, but those broad labels
  do not settle this tree''s crossing axis.


  Sources read:

  https://www.baen.com/the-sword-of-michael.html

  https://www.baen.com/Chapters/9781476736891/9781476736891__c_.htm

  https://www.baen.com/Chapters/9781476736891/9781476736891___3.htm

  https://www.baen.com/Chapters/9781476736891/9781476736891___6.htm

  https://www.baen.com/Chapters/9781476736891/9781476736891___8.htm

  https://horrorfuel.com/2014/10/19/interview-with-author-marcus-wynne/

  https://www.bookreporter.com/reviews/the-sword-of-michael

  http://practicaleschatology.blogspot.com/2018/08/book-review-sword-of-michael-by-marcus.html

  https://www.fantasticfiction.com/w/marcus-wynne/depossessionist/

  Black Gate''s coverage explicitly says just started, so not treated as completed-review evidence. Its marketing synopsis
  corroborates but adds no separate source authority.

  '

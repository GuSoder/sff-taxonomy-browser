placement_rationale: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest
  thresholds > Personal quest portals. Kelly Andrew, The Whispering Dark (Scholastic 2022). Whole-fiction re-walk against
  the Portal gate: Deaf scholarship student Delaney joins Howe University''s Godbole School program, which trains students
  to slip between parallel worlds; students die through a fissure to the land of the dead; at the climax Colton crosses into
  Hell, finds her and brings her home (OwlCrate readalong ch. 48-57; Culturefly review; author site). The earlier Magic school
  walk said the book stays on campus, which the ending contradicts: Earth start, a crossing that organizes the plot, and a
  rescue-and-return. Personal quest portals fits finding and rescuing a particular person; Visionary thresholds was tried
  and rejected because the crossing starts an active rescue. Wobble: the campus mystery fills most of the book and Magic school
  remains a plausible second home. Moved from Magic school 2026-11-27. Sources: https://www.owlcrate.com/blogs/oc/the-whispering-dark-book-club-readalong-day-7
  ; https://culturefly.co.uk/book-review-the-whispering-dark-by-kelly-andrew/ ; https://www.authorkellyandrew.com/the-whispering-dark
  .'

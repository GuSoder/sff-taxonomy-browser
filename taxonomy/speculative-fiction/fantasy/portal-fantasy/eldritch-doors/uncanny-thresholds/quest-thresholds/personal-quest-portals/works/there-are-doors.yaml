id: there-are-doors
title: There Are Doors
authors:
- Gene Wolfe
first_published: 1988
canonical_genre: personal-quest-portals
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest thresholds
  > Personal quest portals.

  Green pursues vanished lover Lara across alternate-world doorways, with hospital escapes and encounters with a goddess.

  Child choice: Personal quest portals. Qualification: Strong Visionary and SF/psychological ambiguities. Kirkus treats the
  literal pursuit and magical doll as fantasy. Gwyneth Jones reads it as myth/psychology and criticizes the thin plot. Do
  not conceal disagreement or call reliability settled.

  The approved split follows the governing stakes of the whole fiction, not a count of rescue or battle scenes. Public struggle
  must be sustained to choose Realm-saving portals; wide consequences alone do not override personal stakes. All existing
  books, authors, dates and cover references preserved. Ancestor gates unchanged. Dreamland retains its existing Portal placement
  following the November8 leave-portal-fictions instruction, phonemsg-01M6XFBNFKKVYBD6QZZ8J5N2Y1; this is not a new general
  dream-as-doorway rule. Approved4/6 distribution: phonemsg-01M84B0ESGSGKHX0BW106W5S01 on phonemsg-01M84AMWMA896F2X52GN1J71T5.


  Prior ancestor rationale retained:

  Root-down: Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest thresholds. A department-store
  salesman in our world tracks down the short-lived girlfriend who vanished, and follows her through doors into another world
  whose gods are women (Wikipedia: the title alludes to gateways between two worlds). The crossing starts the pursuit and
  the rest is a hunt through strange realms, so the threshold serves the outward task. Rejected: Visionary thresholds (the
  book is a pursuit, not contemplation), Nightmare doors (the other world is a godly, mythic order, not storybook darkness),
  Gateway multiverse fantasy (a single door pair rather than a system of realms). Wobble: Visionary thresholds, since Wolfe''s
  narrator is unreliable and half the book is perception. Published 1988; the queue''s 2001 is a reissue.'

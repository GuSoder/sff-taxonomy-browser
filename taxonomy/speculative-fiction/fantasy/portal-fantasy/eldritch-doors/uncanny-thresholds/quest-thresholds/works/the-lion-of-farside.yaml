placement_rationale: 'Dalmas''s Lion of Farside trilogy (Baen): Oregon farmer Curtis Macurdy''s wife Varia is an Ylver of
  Yuulith, a hidden world reached through cross-dimensional gates that open at anchored sites under the full moon (TV Tropes,
  Baen copy). Every volume turns on a deliberate crossing that starts an active adventure: in The Lion of Farside (7/1995,
  Baen) the Sisterhood abducts Varia back to Yuulith and Macurdy follows to win her back, becoming a war-leader; in The Bavarian
  Gate (1/1997, Baen 0-671-87764-X; ISFDB 12949) a Nazi occult project finds a second gate and Macurdy must infiltrate and
  destroy it before Hitler allies with the militaristic Voitusotar; in The Lion Returns (8/1999, Baen) he passes through the
  gate again into another Yuulith war. Root-down: Fantasy -> Portal fantasy (Earth<->hidden world exchange; wholly-invented-universe
  shelves excluded) -> Eldritch doors (adult portal fantasy, anchored physical thresholds) -> Uncanny thresholds -> Quest
  thresholds: the threshold serves rescue, pursuit and mission, never contemplation. Rejected: Otherworld summonings/stumblings/wainscot
  (Macurdy is never called across and never slips - he goes deliberately through known gates); Multiverse fantasy (one hidden
  world, not a many-world cosmology); Planetary portal fantasy (Yuulith is an alternate universe, not a planet of ours, per
  TV Tropes); WWII fantasy (the war is one volume''s stage, not the whole-fiction engine). Whole trilogy grounded per volume
  (Baen pages; ISFDB; TV Tropes Farside Trilogy). Queue row MC04709 (Bavarian Gate, 2006 reprint); vols 1 and 3 are completeness
  adds.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest
  thresholds. A department-store salesman in our world tracks down the short-lived girlfriend who vanished, and follows her
  through doors into another world whose gods are women (Wikipedia: the title alludes to gateways between two worlds). The
  crossing starts the pursuit and the rest is a hunt through strange realms, so the threshold serves the outward task. Rejected:
  Visionary thresholds (the book is a pursuit, not contemplation), Nightmare doors (the other world is a godly, mythic order,
  not storybook darkness), Gateway multiverse fantasy (a single door pair rather than a system of realms). Wobble: Visionary
  thresholds, since Wolfe''s narrator is unreliable and half the book is perception. Published 1988; the queue''s 2001 is
  a reissue.'

placement_rationale: 'Walk: Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds
  > Quest thresholds. All three volumes checked. The Hickory Staff: Colorado adults Steven and Mark cross an anchored
  tapestry found in a bank deposit box into Eldarn; Hannah follows, and the separated travelers join resistance
  to Nerak while trying to return. Lessek''s Key: Steven and Nerak cross to America to retrieve the stone needed
  for the spell table; separate parties in Eldarn seek scrolls and the portal. The Larion Senators: evil escapes
  defeated Nerak into Mark, and Steven and companions pursue him, decipher the spell book, and try to prevent annihilation
  of both worlds. Outward rescue, pursuit and world-saving mission remain central rather than contemplation. Rejected
  Science fiction: sorcery and magical portal, no scientific account. Rejected Fantasy realms: Earth and continuing
  Earth/Eldarn exchanges are essential, not wholly secondary-world quest. Real-earth fantasy loses because the other
  realm becomes the sustained destination. At Portal siblings: Whimsical doors fails adult dark register; Transporting
  tomes fails because the crossing is stepping into an artifact tapestry, not reading or interpreting text (a spell
  book later aids the mission, not the crossing). Fantasy rifts competes because Eldarn is an invented realm, but
  this is a persistent object-anchored physical threshold, not a free-floating rupture; Ship of Ishtar is the existing
  artifact-threshold precedent. Eldritch children: not Faerie glamour or bargains and not storybook/nightmare realm
  logic; Uncanny thresholds includes solemn magic worlds. Visionary thresholds loses to active pursuit, resistance
  and saving companions/worlds. Wobble moderate: epic-realm quest has substantial weight and the tapestry is portable,
  but a portable artifact is still an anchored threshold under the existing Ship of Ishtar record. No definition
  widening or move of another fiction. One complete trilogy,2005/2006/2007, not2010 ebook dates. MC04358 is book3,
  not book1.'

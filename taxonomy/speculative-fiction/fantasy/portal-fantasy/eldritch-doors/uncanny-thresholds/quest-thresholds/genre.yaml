definition: 'Uncanny anchored-threshold fantasy in which crossing starts an active adventure: rescue, pursuit, escape, a struggle
  to save others or a mission through strange realms. The threshold serves the outward task rather than chiefly contemplation
  or inner reckoning. Includes horror rescue and dark doorway chases, not only heroic quests. Not Visionary thresholds, where
  perception or transformation governs; not Destiny quest fantasy, where the invented realm and its destiny quest govern without
  the portal journey.'

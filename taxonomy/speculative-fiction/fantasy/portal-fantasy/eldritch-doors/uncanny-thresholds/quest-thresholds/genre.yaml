definition: 'Pure umbrella for uncanny anchored-threshold adventures whose crossings serve an outward task rather than chiefly
  contemplation or inner reckoning. Partitioned by governing stakes: Realm-saving portals for a sustained struggle to defend,
  free or preserve an otherworld community; Personal quest portals for particular people, relationships, pursuit, escape or
  survival. Wider consequences alone do not make a personal story realm-saving. Existing work-specific ancestor rulings and
  disclosed exceptions remain; the split adds no new general crossing rule.'

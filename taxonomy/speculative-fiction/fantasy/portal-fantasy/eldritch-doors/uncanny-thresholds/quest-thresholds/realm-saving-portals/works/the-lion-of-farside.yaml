placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest thresholds
  > Realm-saving portals.

  Lion: abducted Varia rescue becomes Macurdy raising armies. Bavarian Gate: stop occult Nazi alliance with Yuulith. Lion
  Returns: Earth tragedy, reentry, war and doomsday threat. All three volumes checked.

  Child choice: Realm-saving portals. Qualification: Rescue launches it and last volume has personal motivation, but warfare
  and defending populations govern the trilogy.

  The approved split follows the governing stakes of the whole fiction, not a count of rescue or battle scenes. Public struggle
  must be sustained to choose Realm-saving portals; wide consequences alone do not override personal stakes. All existing
  books, authors, dates and cover references preserved. Ancestor gates unchanged. Dreamland retains its existing Portal placement
  following the November8 leave-portal-fictions instruction, phonemsg-01M6XFBNFKKVYBD6QZZ8J5N2Y1; this is not a new general
  dream-as-doorway rule. Approved4/6 distribution: phonemsg-01M84B0ESGSGKHX0BW106W5S01 on phonemsg-01M84AMWMA896F2X52GN1J71T5.


  Prior ancestor rationale retained:

  Dalmas''s Lion of Farside trilogy (Baen): Oregon farmer Curtis Macurdy''s wife Varia is an Ylver of Yuulith, a hidden world
  reached through cross-dimensional gates that open at anchored sites under the full moon (TV Tropes, Baen copy). Every volume
  turns on a deliberate crossing that starts an active adventure: in The Lion of Farside (7/1995, Baen) the Sisterhood abducts
  Varia back to Yuulith and Macurdy follows to win her back, becoming a war-leader; in The Bavarian Gate (1/1997, Baen 0-671-87764-X;
  ISFDB 12949) a Nazi occult project finds a second gate and Macurdy must infiltrate and destroy it before Hitler allies with
  the militaristic Voitusotar; in The Lion Returns (8/1999, Baen) he passes through the gate again into another Yuulith war.
  Root-down: Fantasy -> Portal fantasy (Earth<->hidden world exchange; wholly-invented-universe shelves excluded) -> Eldritch
  doors (adult portal fantasy, anchored physical thresholds) -> Uncanny thresholds -> Quest thresholds: the threshold serves
  rescue, pursuit and mission, never contemplation. Rejected: Otherworld summonings/stumblings/wainscot (Macurdy is never
  called across and never slips - he goes deliberately through known gates); Multiverse fantasy (one hidden world, not a many-world
  cosmology); Planetary portal fantasy (Yuulith is an alternate universe, not a planet of ours, per TV Tropes); WWII fantasy
  (the war is one volume''s stage, not the whole-fiction engine). Whole trilogy grounded per volume (Baen pages; ISFDB; TV
  Tropes Farside Trilogy). Queue row MC04709 (Bavarian Gate, 2006 reprint); vols 1 and 3 are completeness adds.'

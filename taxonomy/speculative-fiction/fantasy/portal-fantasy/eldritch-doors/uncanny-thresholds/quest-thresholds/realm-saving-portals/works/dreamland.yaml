id: dreamland
title: Dreamland
authors:
- Jody Lynn Nye
first_published: 1998
canonical_genre: realm-saving-portals
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Portal fantasy > Eldritch doors > Uncanny thresholds > Quest thresholds
  > Realm-saving portals.

  Waking in Dreamland: native Roan pursues scientists who will wake the Seven Sleepers and erase the world. School of Light:
  native Juele must defeat an illusion-based takeover. Grand Tour: Waking visitor Chuck pursues enlightenment amid anti-Visitor
  sabotage; Roan/Bergold recur.

  Child choice: Realm-saving portals. Qualification: Weakest card. Two native public-threat stories, then inward visitor quest,
  light satirical register and no established anchored crossing. Old rationale claiming three visitor quests is false. Preserve
  actual three-book fiction and disclose caveat. November8 explicit leave-portal-fictions ruling follows an investigation
  which named Dreamland. No quiet reclassification or gate widening.

  The approved split follows the governing stakes of the whole fiction, not a count of rescue or battle scenes. Public struggle
  must be sustained to choose Realm-saving portals; wide consequences alone do not override personal stakes. All existing
  books, authors, dates and cover references preserved. Ancestor gates unchanged. Dreamland retains its existing Portal placement
  following the November8 leave-portal-fictions instruction, phonemsg-01M6XFBNFKKVYBD6QZZ8J5N2Y1; this is not a new general
  dream-as-doorway rule. Approved4/6 distribution: phonemsg-01M84B0ESGSGKHX0BW106W5S01 on phonemsg-01M84AMWMA896F2X52GN1J71T5.


  Prior ancestor rationale retained:

  A three-novel dream-fantasy series (Waking in Dreamland, 1998; School of Light, 1999; The Grand Tour, 2000) in which visitors
  from the Waking World cross into the ever-shifting Dreamland - the shared dream-world sustained by seven Sleepers - on quests
  through its strange realms, with a light satirical tone reviewers compared to Piers Anthony''s Xanth.'

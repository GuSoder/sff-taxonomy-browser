placement_rationale: 'Lora Senf''s The Losting Fountain (Union Square & Co. hardcover, December 31 2024; YA, ages 14+). Three
  teens from different decades - Ember, an abused farm girl in 1913; Sam, a boy haunted by voices in 1989; Miles, a present-day
  track star - are each summoned across dark waters to a mysterious island where time moves differently. At its center sits
  the Losting Fountain, in which all lost things are found, presided over by the Jury; the Fountain''s allure is an anglerfish''s
  light, its depths hold ''losting souls, those it won''t ever let go'', dark creatures are escaping, and the trio must repair
  the rift between the island and the real world (author''s site; Kirkus; School Library Journal; gatewaybookreviews.blogspot.com).
  Walk: Speculative fiction > Fantasy (a world-behind-the-world, monsters, time out of joint) > Portal fantasy (each teen
  crosses from Earth to the island through dark waters, an anchored crossing) > Eldritch doors (dark, not child-bright: Whimsical
  doors rejected on Kirkus''s own ''dark portal fantasy'' and the reviews'' ''definitely darker fantasy'') > Nightmare doors
  (the gate verbatim: a world built on portal-fantasy logic whose menace, predation and dangerous belonging turns the familiar
  story dark - the Fountain calls the children ''home'' and keeps the souls it catches; the Wayward Children precedent sits
  in this leaf and Seanan McGuire blurbs this book for the same tradition). Rejected: Perilous fairy doors (no Faerie, no
  glamour-and-bargain elf-realm), Uncanny thresholds (the crossing is the story''s engine, not a single visionary encounter),
  Fantasy rifts (no free-floating tear; the island is an anchored threshold), Whimsical doors (dark, predatory). Wobble: low;
  standalone, single world, clear dark-portal shape. Sources: lorasenf.com, kirkusreviews.com, slj.com, gatewaybookreviews.blogspot.com,
  crossroadreviews.com, isfdb.'

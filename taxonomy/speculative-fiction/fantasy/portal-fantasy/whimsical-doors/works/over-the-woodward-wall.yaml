first_published: 2020
canonical_genre: whimsical-doors
placement_status: accepted
placement_rationale: 'Publishers Weekly calls Seanan McGuire''s novel (written as A. Deborah Baker, originating inside her
  Middlegame) a delightful, fable-like portal fantasy: two ordinary children climb a wall that appears on their street and
  pass into the Up-and-Under, an enchanted realm of talking trees and impossible bargains. The crossing is a playful enchanted
  threshold into a fairy-tale other realm, matching Whimsical doors - shelfmates Alice in Wonderland, Narnia, Oz, Coraline
  and McGuire''s own Wayward Children.'

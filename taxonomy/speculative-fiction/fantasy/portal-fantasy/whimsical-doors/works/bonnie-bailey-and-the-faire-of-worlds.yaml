placement_rationale: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Whimsical doors. Per Hachette Book Group
  and Kirkus (age range 8-12, WorthyKids, 6 May 2025): thirteen-year-old beekeeper Bonnie takes a job at a fair that is in
  town for one night; the Faire of Worlds is a sentient, magical nomadic pocket reality whose residents were rescued from
  other realities, and Bonnie must choose between going home and staying to protect it. The crossing is the Faire itself,
  a physical threshold that arrives on her family''s land, and the story is bright and child-friendly: the Whimsical doors
  definition. Rejected: Gateway multiverse fantasy (the Faire is one pocket reality, not a border between standing realms),
  Otherworld stumblings (she is hired, not thrown in), Eldritch doors (the threats are dark forces inside a warm story). Wobble:
  the doorway is a travelling place, not a fixed door, so the ''anchored physical threshold'' fit is looser than the leaf''s
  other books.'

placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Fantasy rifts -> Otherworld fantasy. Tor explicitly sends a teenager from our world into one magical realm of seven vertical levels, where magic ages him into Sir Able. Though his knightly quest governs inside Mythgarthr, the series is organized by revelation of and life within one hidden mythic Otherworld, not an anchored door or many-world multiverse.'

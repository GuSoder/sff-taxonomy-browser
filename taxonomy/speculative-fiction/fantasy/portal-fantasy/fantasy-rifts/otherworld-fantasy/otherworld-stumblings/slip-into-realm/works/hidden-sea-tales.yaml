placement_rationale: 'A. M. Dellamonica, Hidden Sea Tales (Child of a Hidden Sea 2014, A Daughter of No Nation 2015;
  Tor, Macmillan, Publishers Weekly, author site): San Francisco biologist Sophie Hansa is flung into the sea off
  an unfamiliar shore while saving the aunt she never knew and finds she was born in Stormwrack, an alternate world
  of tall ships and sea law, where her birth parents'' marriage ended in disaster. In book two she is deported from
  it and schemes to return. Walk: Speculative fiction > Fantasy > Portal fantasy > Fantasy rifts > Otherworld fantasy
  > Otherworld stumblings (she is thrown in by accident, no one summoned her). Rejected: Otherworld summonings (no
  summoner), Borderland multiverse (one other world, not a gateway multiverse), Quest-thresholds (no anchored door).
  Wobble: low-medium, the crossing recurs by choice in book two. Sources: Tor, Macmillan, PW, author site; excerpts
  read, not the books. Re-walked on the 2026-10-15 split: Otherworld stumblings -> Slip into realm; Stormwrack is
  an invented world, not a living myth tradition.'

placement_rationale: 'Mark Anthony''s six-book Last Rune (Beyond the Pale to The Keep of Fire to The Dark Remains to Blood
  of Mystery to The Gates of Winter to The First Stone): a rift in ordinary reality in Colorado opens and saloon owner Travis
  Wilder and ER doctor Grace Beckett slip through into Eldh, a hidden land of gods, monsters and magic, where he finds a gift
  for rune magic and she learns she is a witch. Root-down: Fantasy -> Portal fantasy -> Fantasy rifts -> Otherworld fantasy;
  nobody summons them, they are carried across by a rupture, so Otherworld stumblings.'

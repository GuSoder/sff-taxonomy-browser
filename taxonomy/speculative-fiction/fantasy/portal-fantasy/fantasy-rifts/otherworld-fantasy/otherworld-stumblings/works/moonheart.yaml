placement_rationale: 'Root-down walk: starts in 1980s Ottawa and crosses to another world, so Portal fantasy, not Real-earth
  urban fantasy; Otherworld fantasy (one hidden mythic Celtic world behind ours). Sources: Wikipedia (antique-store owners
  Sara Kendell and Jamie Tamson come into possession of a peculiar ring; Kieran Foy, a wizard of sorts, is looking for his
  missing mentor while avoiding the RCMP''s Project Mindreach; when Sara and Kieran meet they end up in the other world, and
  an ancient evil threatens both worlds); charlesdelint.com and Macmillan (Sara and Jamie sense the pull of a distant place
  of mists, forests and bards and are drawn in through the portals of Tamson House, a sprawling downtown building that straddles
  two worlds). Nobody summons them: they are pulled across by the ring, the artifacts and the house, so Otherworld stumblings,
  not Summonings. Wobble: Tamson House sits in both worlds, so Wainscot fantasy was considered, but the protagonists do cross
  and the crossing is the story. First published 1 Oct 1984 (Ace, per Wikipedia); the queue''s 1994 is a reissue year. The
  sequel is the collection Spiritwalk, skipped as a collection.'

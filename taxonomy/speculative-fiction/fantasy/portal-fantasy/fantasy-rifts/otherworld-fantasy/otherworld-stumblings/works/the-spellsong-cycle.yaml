placement_rationale: 'Modesitt''s five-book Spellsong Cycle (Soprano Sorceress 1997 to Shadowsinger 2002; first three follow
  Anna Marshall, an Iowa State music instructor, the last two her adopted daughter Secca): Anna is magically transported from
  Ames, Iowa to Erde, where song is magic and her training makes her a powerful sorceress who is drawn into the war between
  Defalk and Ebra''s Dark Monks. Sources: Tor and Kirkus blurbs, Wikipedia, lemodesittjr.com. Root-down: Fantasy -> Portal
  fantasy (a modern person crosses into a secondary world) -> Fantasy rifts -> Otherworld fantasy (one hidden world reached
  from ours, not a system of many) -> nobody is shown calling her, she is simply carried across, so Otherworld stumblings,
  not summonings. Wobble moderate: the blurbs say only ''transported'' and do not name a summoner; if a summoner is later
  shown, Otherworld summonings (5) is the alternative. Not Epic fantasy: the crossing is the defining frame. Cover: Darksong
  Rising jacket (Soprano Sorceress jacket carries an archer).'

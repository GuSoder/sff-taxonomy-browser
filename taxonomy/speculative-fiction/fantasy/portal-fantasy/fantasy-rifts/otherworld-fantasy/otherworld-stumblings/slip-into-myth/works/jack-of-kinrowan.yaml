placement_rationale: 'Root-down walk: opens in present-day Ottawa and crosses into Faerie, so Portal fantasy, not
  Real-earth urban fantasy; Otherworld fantasy (one hidden mythic world behind ours). Source (charlesdelint.com
  description of Jack of Kinrowan): in Jack the Giant-Killer a faceless gang of bikers on a Wild Hunt through the
  streets of present-day Ottawa hurtles Jacky Rowan across the threshold into the perilous land of Faerie, where
  she is hailed as Jack of Kinrowan, a one-and-future trickster hero whose lot is to save the Elves; the omnibus
  also holds Drink Down the Moon (1990). Nobody calls her across: she is swept in by the Hunt, so Otherworld stumblings,
  not Summonings. Wobble: Perilous fairy doors (Faerie itself seduces and endangers those who cross) is the alternative,
  but there is no anchored door and the story is her heroic role in Faerie rather than its danger. Years: Jack the
  Giant-Killer 1987 and Drink Down the Moon 1990 (author''s publication list); the queue row is the 1997/1999 omnibus,
  so the card year is the first novel''s. Only the omnibus row is in the queue, so it stands for both novels. Re-walked
  on the 2026-10-15 split: Otherworld stumblings -> Slip into myth; the hidden world is Faerie, the folklore world
  of the Jack the Giant-Killer tradition.'

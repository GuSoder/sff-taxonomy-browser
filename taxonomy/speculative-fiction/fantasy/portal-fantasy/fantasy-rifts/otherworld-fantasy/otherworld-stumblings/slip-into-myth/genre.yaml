definition: 'Otherworld stumblings in which the world stumbled into is a living myth or story tradition - mythic
  Denmark, Faerie, the Celtic otherworld, Japanese gods and spirits, the Hamzanama or the Simurg: a world the traveler
  half knows from tales. Not Slip into realm (an invented epic world nobody has told). Split 2026-10-15 from Otherworld
  stumblings at ten cards (curator "Approved", phonemsg-01M4ZVJEVK4QR6KZB08P0VMB6Y).'
status: accepted
ruling: 'Curator split approved (curator "Approved" (phonemsg-01M4ZVJEVK4QR6KZB08P0VMB6Y, 2026-10-15 3:21 PM CEST))
  on the served block "Approve split?: Otherworld stumblings / Slip into myth / Slip into realm"; the Slip-into
  pattern is his own proposal (phonemsg-01M4ZVDPB9GZXKRX1J1CM0PRH4), plain words without the fantasy suffix ("You
  can drop the fantasy", phonemsg-01M4ZVG7SAACD4DNJ1MJNAHD4M) and without hyphens (phonemsg-01M4ZVGW6GEKB40DNW0FZ411H1).
  Axis: the kind of world stumbled into, a living myth tradition vs an invented epic world. Name rule from the workshop:
  the name alone must carry both the otherworld hint and the stumbling (phonemsg-01M4ZV4X142DHN1V6T2PJ00Q96).'

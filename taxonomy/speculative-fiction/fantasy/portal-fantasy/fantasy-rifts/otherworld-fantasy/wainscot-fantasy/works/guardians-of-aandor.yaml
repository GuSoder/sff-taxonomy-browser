placement_note: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Fantasy rifts > Otherworld fantasy > Wainscot fantasy. NYC cop Cal MacDonnell and photographer Seth Raincrest, amnesiac for thirteen years, are exiles from the world of Aandor; its war crosses into New York to kill them and seize a child who could restore the broken empire (BookBrowse/Macmillan summary). The crossing is backstory - the story lives in the adjacency, the hidden world''s people in our margins. SOFT: a reverse portal (exiles of the other world hidden here, not Earth travellers going across); Wainscot over Otherworld stumblings because the story is not a crossing story. Series of three: Awakenings (2011), The Lost Prince (2013), Blood of Ten Kings (2018) - Goodreads Guardians of Aandor series, 3 primary works.'

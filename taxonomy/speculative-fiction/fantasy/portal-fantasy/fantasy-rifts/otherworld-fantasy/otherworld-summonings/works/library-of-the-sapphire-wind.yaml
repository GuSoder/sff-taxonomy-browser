placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy
  -> Fantasy rifts -> Otherworld fantasy -> Otherworld summonings. The Hettua Shrine
  ritually summons three older women (Meg, Peg, Teg) from our world into the one hidden
  world of Over Where, and the story follows the summoned; not a stumblings (someone
  calls them) and not Wainscot (a real crossing). Adult, bright in tone; not a door
  (no anchored threshold) and not a tome (no book carries the crossing).'

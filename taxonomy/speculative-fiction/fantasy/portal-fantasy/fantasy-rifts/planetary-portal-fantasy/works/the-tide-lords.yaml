placement_rationale: '# Tide Lords: whole-fiction intake recommendation

  2026-10-29. Research only; no live changes.


  ## Recommendation

  Seed **Planetary portal fantasy** under **Fantasy rifts**, for **The Tide Lords**, one fiction/four novels. Propose one minimal widening
  of the user-owned Fantasy rifts definition from rifts ''between realities'' to rifts ''between worlds''. Do not widen Multiverse fantasy,
  an established reader term, to mean travel among planets in one universe. The new name is descriptive coinage, not an established
  headword.


  Suggested compact serve:

  Approve seed?:

  Fantasy rifts

  - Multiverse fantasy

  - Otherworld fantasy

  - World bleeds

  - Seed: Planetary portal fantasy


  ## Whole-fiction evidence

  1. The Immortal Prince (2007): Cayal survives hanging, seeks death, recounts destructive Tide Lord history to historian Arkady. Their
  true immortality and elemental Tide magic contest Amyrantha''s scientific disbelief; the Crasii were magically created hybrid servants.
  Court schemes and concealed identities complicate the discovery. https://www.harpercollins.com.au/9780732283353/the-immortal-prince/
  ; https://fantasybookcritic.blogspot.com/2009/06/personal-favorite-from-2008-immortal.html ; https://www.fantasybookreview.co.uk/Jennifer-Fallon/The-Immortal-Prince.html

  2. The Gods of Amyrantha (2007): Arkady exiled, Jaxyn seeks the throne, immortals resume power as Tide returns. Declan becomes immortal;
  the Eternal Flame story is exposed as a cover for inherited susceptibility activated by burning. The author calls this a ''quasi scientific
  basis'' and explicitly says it triggers the ability to wield Tide magic. https://www.readings.com.au/product/9780732283360/the-gods-of-amyrantha--jennifer-fallon--2007--9780732283360
  ; https://fantasybookcritic.blogspot.com/2009/07/gods-of-amyrantha-by-jeniffer-fallon.html ; https://eprints.qut.edu.au/30242/1/Jennifer_Ryan_Thesis.pdf
  pp32-33 (the full-page fetch ended at p26, but targeted indexed excerpt returns pp32-33; identify this extraction limitation, not
  pretend complete PDF read).

  3. The Palace of Impossible Dreams (2008): Arkady enslaved, Stellan survives and challenges Jaxyn, new immortal Declan seeks her,
  Cayal meets the older immortals. The Crystal and the purpose behind the immortals'' migration enter focus; prologue/epilogue seed
  the ending. https://www.kirkusreviews.com/book-reviews/jennifer-fallon/the-palace-of-impossible-dreams/ ; https://fantasybookcritic.blogspot.com/2010/07/palace-of-impossible-dreams-by-jennifer.html
  ; https://www.readings.com.au/product/9780732283377/the-palace-of-impossible-dreams--jennifer-fallon--2008--9780732283377

  4. The Chaos Crystal (2008): Crystal opens a world-crossing rift, threatens and ultimately destroys Amyrantha. Survivors arrive on
  Earth in dinosaur times; distant finale reaches near-future Earth, asteroid mining and Arkady found in Amyrantha''s remnants. Professional
  review verifies rift/artifact and world destruction stakes, detailed endpoint independently documented in whole-series and reader
  reviews. https://www.libraryjournal.com/review/the-chaos-crystal ; https://bibliophiliabookreviews.com/book-series-the-tide-lords-by-jennifer-fallon/
  ; https://app.thestorygraph.com/book_reviews/36c8c7ba-bf7c-412a-a225-7ff3a0c26c50 ; https://tvtropes.org/pmwiki/pmwiki.php/Literature/TideLords


  All four were plotted toward that conclusion from the outset. Author explains the later revelations were meant to occur there and
  foreshadowed in earlier books: https://fantasybookcritic.blogspot.com/2009/08/interview-with-jennifer-fallon.html . It is not defensible
  to classify three books as an independent invented realm and detach the fourth or ignore its finale. Four novels, not four fictions.


  ## Root-down walk and near misses

  - Speculative fiction > Fantasy: genuine elemental Tide magic, immortals, mind transfer and a magical Crystal. The heredity rule naturalizes
  who can become immortal but is not a demonstrated scientific engine behind the magic. FBC reviewer explicitly calls the quartet ''truly
  sf'' yet immediately concedes actual magic. Treat this as a serious rival interpretation, not proof of science-fantasy under this
  tree''s ''fantasy surfaces built on scientific engines'' and known-physics gate. Future spacecraft at the endpoint do not retroactively
  make the prior magical engine technology.

  - Fantasy > Portal fantasy: Earth-contact gate passes unequivocally. It includes real Earth and crossing into it, and the original
  migration/returning powers/Crystal search/final migration form one story. Portal does not require beginning on Earth under the user''s
  explicit gate. Not Fantasy realms: Earth is real, not an independently invented universe. Not Real earth fantasy: although the universe
  is ours, the other planet and consequential magical crossing govern the complete fiction; treating it as contemporary Undying would
  falsely make recognizable modern Earth its main stage. Historical/period/secret history do not cover Amyrantha''s invented cultures
  and near-future endpoint. Future fantasy applies only the epilogue, not whole four; post-apocalyptic Earth never supplies the main
  setting.

  - Portal children: no anchored door, no textual/book/map crossing, not whimsical child-friendly passage. Crystal opens an unanchored
  channel/rift. Thus Fantasy rifts, subject to explicit minimal ''worlds'' widening below.

  - Fantasy rifts > no existing honest leaf. World bleeds requires no travelers, fails. Otherworld is a hidden mythic world beside ours
  found/revealed, not another physical planet whose remnants a spacecraft later visits. Multiverse is an established many-world cosmology
  and should not be stretched to ordinary planets in one universe. Its Mirror children demand counterparts, absent. Gateway descendants
  fail independently: Borderland requires a standing border/homeground, while Amyrantha is destroyed by the crossing; Worldhopper requires
  serial visits across many realms/no homeground, while four novels largely remain on Amyrantha before one final relocation. Their earlier
  migration history is not a narrated multiverse trek. Do not push into nine-card Worldhopper on count convenience.

  - Fantasy realms rivals if one ignored the Earth reveal: Dynastic spy games (political intrigue), War of immortals, Invented worship/godhood
  (divine beings), and Destiny quest (Crystal hunt) each describe genuine strands. They lose at the root, not because their plots are
  incidental. No need to stretch any of their definitions.

  - Atemporal/time travel: the 65m-year epilogue is elapsed immortal life, not established time travel. Fabulation does not foreground
  storytelling''s arbitrariness. Hidden history SF has no verified scientific engine and covers only Earth''s retrospective catastrophes.
  Planetary romance is similarly science-fantasy gated; hiding/repressing technology alone does not establish colonists or scientific
  explanation.


  ## Proposed definitions

  Fantasy rifts (minimal user-owned widening):

  ''Portal fantasy of rifts between worlds: a free-floating tear or an opened channel may lead people across, or allow another world
  to leak into ours without human travel. Otherworld is one hidden mythic world found or revealed; Multiverse is a many-world cosmology;
  Planetary portal fantasy connects planets within our universe; World bleeds is the leak without a journey.''


  Planetary portal fantasy:

  ''Portal fantasy in which magical crossings connect Earth with another physical planet of our universe. The other world is a planet
  to reach, leave or return to, not a parallel reality or a hidden mythic realm beside ours. The crossing and its consequences organize
  the fiction, whether the journey goes outward from Earth or comes here. Not World bleeds, where nobody crosses; not Science fantasy
  or Planetary romance where a scientific engine explains the wonders.''


  This covers the entire uncovered slot, both directions, journeys/escape/migration, permanent or repeatable crossings, without requiring
  Tide Lords'' immortality, destruction, Crystal, dinosaur past or quartet structure. Single positive subject: magical interplanetary
  crossing. The parent grows 3 to4 children, none moves, no new shallow sibling.


  ## Name and ceiling

  ''Interplanetary fantasy'' is attested as a broad descriptive phrase, but does not itself imply portals and includes conventional
  space voyages. ''Planetary fantasy'' collides with Planetary romance. ''Reverse portal fantasy'' is attested among readers but would
  define direction rather than planet-versus-reality and overlap borderland travelers; also Tide Lords spends little narrated time in
  the arrival setting. ''Portal exodus'' exact phrase has no useful literary attestation and unnecessarily narrows to migration. Planetary
  portal fantasy is plain descriptive coinage that carries the nearest established Portal fantasy hint without needing the parent to
  explain it.


  Honest present ceiling: one verified fiction, four novels. No kin moved or claimed on title resemblance. A Voyage to Arcturus has
  a real-star destination but publisher evidence says a journey, not a portal; do not promise it without its full whole-fiction walk.
  Worm Ouroboros'' opening astral journey to Mercury is a genuine look-alike, but its connected Zimiamvian corpus and later frame cannot
  be inferred from the first chapter; no move proposed. Barsoom is already on SF side and its different scientific-engine ruling is
  not overturned by finding the word portal in general genre articles. The Necessary Beggar is verified reverse portal immigration from
  another dimension, not another physical planet, and is therefore excluded from this planetary carve. No opportunistic additions outside
  normal intake.

  Sources for look-alike exclusions: https://www.sfgateway.com/titles/david-lindsay/a-voyage-to-arcturus/9780575105539/ ; https://www.gutenberg.org/files/67090/67090-h/67090-h.htm
  ; https://publishersweekly.com/978-0-7653-1097-2 . These support only the described distinctions, not full reclassification.


  ## Corpus and provenance limitations

  Original Australian years 2007/2007/2008/2008. US editions 2008/2009/2010/2011 must not replace those years. Primary HarperCollins
  book pages exist and show the four ISBNs/covers; current redesigned pages often omit detailed date/plot fields. Dates corroborated
  by original publisher/retailer records and ISFDB: https://www.isfdb.org/cgi-bin/title.cgi?1016789= ; https://www.isfdb.org/cgi-bin/title.cgi?1024306=
  ; https://www.collinsbooks.com.au/p/fiction-the-chaos-crystal . The Palace original month differs among sellers, year2008 agrees.
  Detailed Earth/asteroid endpoint comes from multiple independent readers/community references, not the spoiler-avoiding publisher
  blurbs. Do not claim publisher verification of that detail. Core planetary nature has higher uncertainty than Earth contact, but explicit
  space retrieval of Amyrantha''s remnants strongly grounds physical planets rather than parallel universes.


  ## Execution

  Approved and executed 2026-10-29 under phonemsg-01M64QTMDMT9Y1K5ETKPYYD3VY, answering proposal phonemsg-01M64F2JC7HPYKGBJGJYKAPYPX.
  Only Fantasy rifts wording/children and this new leaf/card changed. Multiverse unchanged. Four complete eligible novels, four publisher
  covers inspected. Portrait A selected after both variants and final640x960 inspected. Totals804nodes/2605fictions/5985books. RowsMC04437/38/39/42
  markeddone. Subsequent intake awaits main live closeout handback.


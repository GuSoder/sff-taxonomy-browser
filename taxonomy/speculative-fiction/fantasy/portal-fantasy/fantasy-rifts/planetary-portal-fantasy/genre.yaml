definition: Portal fantasy in which magical crossings connect Earth with another physical planet of our universe. The other world is
  a planet to reach, leave or return to, not a parallel reality or a hidden mythic realm beside ours. The crossing and its consequences
  organize the fiction, whether the journey goes outward from Earth or comes here. Not World bleeds, where nobody crosses; not Science
  fantasy or Planetary romance where a scientific engine explains the wonders.

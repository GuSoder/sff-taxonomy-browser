title: The Invisible Library
authors:
- Genevieve Cogman
first_published: 2015
canonical_genre: gateway-multiverse-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Fantasy rifts > Multiverse fantasy > Gateway
  multiverse fantasy. Irene is a spy for the Library, an institution outside time and space whose agents cross into alternate
  realities (steampunk London, a 1920s USA, an 1890s Paris, a Fae court, a Vienna art heist) to retrieve dangerous books;
  the worlds range from order to chaos and are distinct realms joined by the Library''s crossing (Pan Macmillan; Tor). The
  story is the crossing and what waits at each end, which is the leaf''s definition. Rejected: Mirror multiverse fantasy (the
  worlds are not counterparts of one another, each is its own flavour of reality), Caper fantasy (heists occur in some books
  but the engine is the Library and its worlds, not one gang job). Wobble: Caper fantasy for the book-theft jobs and the Library
  as a spy agency. Series folded as one fiction (rule 11j). Scarlet (MC03382, 2023) is the first book of a separate series,
  The Scarlet Revolution, and is not folded.'

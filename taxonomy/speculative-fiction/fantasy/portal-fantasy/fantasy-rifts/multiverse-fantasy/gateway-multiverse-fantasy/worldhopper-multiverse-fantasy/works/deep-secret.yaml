placement_rationale: 'Root-down: Speculative fiction > Fantasy > Portal fantasy > Fantasy rifts > Multiverse fantasy > Gateway
  multiverse fantasy > Worldhopper multiverse fantasy. Diana Wynne Jones, Deep Secret (Gollancz, November 1997; the queue
  row is the 2013 Tor reissue, first published 1997): Rupert Venables, junior magid responsible for Earth and the Koryfonic
  Empire, a collection of Ayewards worlds in a multiverse that runs from magic-friendly Ayeward to magic-shy Nayward, must
  find a new senior magid for Earth and the lost heir of the assassinated Emperor. He gathers the candidates at a science
  fiction convention in the Escher-like Hotel Babylon, built over a magical node, then crosses to the world Thule, and Maree
  Mallory and Nick follow him through the gaps between worlds, ending in a nightmarish land that is the Deep Secret and the
  restoration of the Empire (Wikipedia, https://en.wikipedia.org/wiki/Deep_Secret; Fantasy Book Review, https://www.fantasybookreview.co.uk/Diana-Wynne-Jones/Deep-Secret.html;
  Kirkus, https://www.kirkusreviews.com/book-reviews/diana-wynne-jones/deep-secret/). A system of many worlds joined by crossings
  is Gateway multiverse fantasy; it was the tenth card, so the leaf was split (Borderland 4 / Worldhopper 5) and this book
  lands in Worldhopper: the magids range across Earth, Thule, the Empire''s worlds and the gaps between them, and the plot
  is not tethered to one home with a standing border. Rejected: Mirror multiverse fantasy (the worlds are not counterparts),
  Occult institutions (the magids are a multiverse bureaucracy, not modern-day magic inside an Earth institution), Borderland
  multiverse fantasy (runner-up: much of the action is one Earth hotel on a magical node; wobble moderate). Series (Magids)
  folded as one fiction (rule 11j); The Merlin Conspiracy is a separate book.'

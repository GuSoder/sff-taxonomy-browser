placement_rationale: 'Root-down: Fantasy -> Portal fantasy -> Fantasy rifts -> Multiverse fantasy -> Gateway multiverse fantasy
  -> Worldhopper multiverse fantasy. Thirty Years War mercenary Ulrich von Bek finds an enchanted castle in the Hartz, meets
  Lucifer''s servant Sabrina, tours Hell, and is sent on a Grail quest; the Wildgrave leads him into the Mittelmarch and he
  travels through Hell, the Mittelmarch patches and other realms (Kirkus; Worlds Without End; Wikipedia, Von Bek). Moved from
  Pulp fantasy on the curator''s instruction (phonemsg-01M4VGEG6AFEM4BQ34ZCSSRRXA). Wobble: Wikipedia describes the Mittelmarch
  as transitional regions of one Earth-and-Hell cosmology rather than separate worlds; Otherworld summonings was the other
  candidate.'

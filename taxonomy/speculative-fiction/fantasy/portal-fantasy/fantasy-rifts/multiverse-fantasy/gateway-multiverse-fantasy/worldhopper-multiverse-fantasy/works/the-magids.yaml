placement_rationale: 'Root-down: Fantasy > Portal fantasy (the story includes our Earth - the Wantchester convention - inside
  a system of worlds) > Fantasy rifts > Multiverse fantasy (a system of many worlds with order and chaos in play across them:
  the magids'' task is to urge the worlds in an Ayewards direction against the Nayward pull - Wikipedia, Deep Secret) > Gateway
  multiverse fantasy (distinct realms joined by crossings through the gaps between worlds) > Worldhopper multiverse fantasy:
  Rupert Venables is junior magid for Earth and the Koryfonic Empire, serving the magid institution and ranging across Earth,
  Thule and the Empire - ''serving an institution... each crossing lands somewhere new; the multiverse itself is the stage''
  verbatim. Not Mirror multiverse fantasy (the worlds are distinct realms, not counterparts of one another). One card for
  the Magids series (Wikipedia: Deep Secret 1997, The Merlin Conspiracy 2003). Years are first publication; the queue''s 2013
  is the Tor reissue.'

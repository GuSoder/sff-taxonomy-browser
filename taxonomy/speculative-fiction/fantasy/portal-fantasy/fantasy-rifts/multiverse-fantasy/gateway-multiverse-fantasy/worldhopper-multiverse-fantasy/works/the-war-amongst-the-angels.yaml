placement_rationale: 'The War Amongst the Angels (2014 omnibus of the Second Ether trilogy: Blood: A Southern Fantasy 1995,
  Fabulous Harbours 1995, The War Amongst the Angels 1996; moorcography.org and ISFDB), the queue''s only row for the series.
  Blood follows the gambler Jack Karaquazian across the Second Ether''s worlds, with order and chaos at play, and the cast
  keep moving through realm after realm with no home ground. Walk: Fantasy > Portal fantasy > Fantasy rifts > Multiverse fantasy
  > Gateway multiverse fantasy > Worldhopper multiverse fantasy (no single home ground). Tried Mirror multiverse fantasy (the
  worlds are not counterparts of one true world). Sources are thin: I have only catalogue entries for the plot; flag as the
  weakest placement. Alternative: Mirror multiverse fantasy.'

definition: 'Multiverse fantasy in which the many worlds are distinct realms joined by a crossing: a border strip between
  a magic world and ours, a bunker of portals, a trek through a system of realms, worlds of myth entered by symbolic logic,
  a multiverse of linked Modes. The story is the crossing and what waits at each end. Not Mirror multiverse fantasy (there
  the worlds are counterparts of one another). Umbrella since 2026-10-10, partitioned by whether the story keeps a home ground:
  Borderland multiverse fantasy (a standing border to elsewhere) and Worldhopper multiverse fantasy (the cast ranges across
  the realms). Not Mirror multiverse fantasy (counterpart worlds).'
status: umbrella
ruling: 'Split executed on the intake''s own judgment under the curator''s standing autonomy (phonemsg-01M4K42F3EQDEGCNTQ1T3FWS29,
  phonemsg-01M4K45A5DFAAFXQS8P7XSPGT3, 2026-10-10): axis is whether the story keeps a home ground with a standing border (4)
  or ranges across the realms (5 + Deep Secret as the tenth). The nine existing cards were re-walked into their children.'

placement_rationale: 'Root-down walk of the complete currently published Beautiful and Beastly fiction (one novel as of 2026-10-29):
  Speculative fiction > Fantasy, because Raine''s possession, aura-feeding and magical Wardens are literal supernatural events,
  not scientific explanation or horror as the governing promise. Fantasy > Portal fantasy: the story includes present-day
  Baltimore on our Earth and actual action in parallel realms; author calls it portal romantasy, Library Journal explicitly
  locates action in both the present-day United States and realms of dragon shifters/Tuatha De Danann. Not Fantasy realms
  or its Romantasy/Fairytale branches: the Earth inclusion fails their root rule, regardless of marketing Beauty-and-the-Beast
  inversion. Contemporary supernatural romance is a genuine surface wobble (Ana''s Attic calls it urban fantasy), but the
  standing cross-realm gateways guarded by Remy and their political dangers organise the external stakes, rather than only
  hidden beings in an otherwise single Earth. Portal fantasy > Fantasy rifts > Multiverse fantasy: multiple distinct magic
  realms connect to Earth, not one otherworld or counterpart copies; no text/reading carrier. Not Perilous fairy doors: not
  a single Faerie realm reached by one fairy-tale doorway; dragons/fae inhabit a system of parallel realms and Wardens police
  the crossings. Multiverse > Gateway multiverse fantasy > Borderland multiverse fantasy: a home-ground story tethered to
  Earth and Remy''s territory with guarded standing gateways; the other realms press upon the home side. Not Worldhopper:
  no unhomed itinerary where each new world is the stage. The author excerpt anchors nurse Raine in the city and Remy''s territory;
  publisher/author plot turns on overthrowing his rule and saving our world. Source scope: Library Journal and independent
  readers verify cross-world action, but do not supply an exact architectural account of every portal; do not claim one. One
  eligible novel only. Author reading order lists A Storm of Dragons and Sorcery in March2027 and untitled book3, not yet
  published, so excluded. Distinct new universe from Night Huntress, not combined merely by author. Sources: https://www.jeanienefrost.com/a-curse-of-beasts-and-magic/
  ; https://www.jeanienefrost.com/2026/05/a-curse-of-beasts-and-magic-is-here/ ; https://www.jeanienefrost.com/reading-order/
  ; https://www.libraryjournal.com/review/a-curse-of-beasts-and-magic-100009546 ; https://anasattic.com/a-curse-of-beasts-and-magic/
  ; https://hookedbythatbook.com/review-a-curse-of-beasts-and-magic-by-jeaniene-frost/ ; https://sloopyreadabook.ca/a-curse-of-beasts-and-magic/
  ; https://ilona-andrews.com/blog/happy-book-birthday-to-a-curse-of-beasts-and-magic/ .'

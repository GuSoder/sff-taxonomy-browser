canonical_genre: borderland-multiverse-fantasy
placement_status: accepted
placement_rationale: 'Whole-fiction repair, 2026-11-05. Root walk: Speculative fiction > Fantasy > Portal fantasy
  > Fantasy rifts > Multiverse fantasy > Gateway multiverse fantasy > Borderland multiverse fantasy. The former
  Abbey-only Sanctuary card was not a complete shared fiction. Seven direct Thieves World novels plus the four further
  actual Sacred Band novels belong together: Morris Beyond Sanctuary/Beyond the Veil/Beyond Wizardwall; Offutt Shadowspawn/The
  Shadow of Sorcery; Drake Dagger; Abbey Sanctuary; and Morris City at the Edge of Time/Tempus Unbound/Storm Seed/The
  Sacred Band. Morris and the current publisher explicitly connect these continuing characters; the last novel actually
  returns them to Sanctuary with Randal, Ischade, Jihan and old comrades. A different imprint or an absent trademark
  banner does not split a continuous universe. Original 1979-1989 anthologies and 2002/2004 relaunch anthologies
  inform the world but are not added as new novels here. Tempus is a collection of five original plus nine new/rare
  tales by the author''s own interview; The Fish the Fighters and the Song-girl is fifteen tales including a title
  novella by the publisher, despite review shorthand calling both novels. Neither added. The Sacred Band first published
  2010 (ISFDB CreateSpace April5), not its 2011/2012 editions. Sanctuary first2002 (contemporary PW review), not
  former2003paperback date. Jamie the Red only shares a borrowed character: Abbey''s account says rejected original
  story expanded separately and TW association withdrawn; no same-world continuity proved, so not silently merged.
  Beyond Dar al-Harb is three novellas. Lythande''s Gratitude of Kings is a novelette (ISFDB), not another novel.
  Deathknight disputed: RisingShadow grouping/BlackGate article associates it, but Locus marks only the two Shadowspawn
  novels TW and its Falc/Sij plot supplies no shared-world link; no verified common continuity, not merged on an
  aggregator label. No new unrelated Deathknight intake. SM Stirling''s Shadowspawn trilogy is unrelated and stays
  separate.

  Each eligible novel''s engine was checked rather than inheriting Abbey''s plot: Beyond Sanctuary brings cursed
  mercenary commander Tempus/Niko/Jihan/Cime into Tyse''s war with Datan and Mygdonian sorcerers; Beyond the Veil
  uses a killed messenger''s memories, uneasy Third Commando alliance, Niko''s abduction/witchcraft and Wizardwall
  war; Beyond Wizardwall culminates in Festival-of-Man assassination plots, Niko used against the emperor, rival
  oaths/gods and rescues. Shadowspawn leaves Sanctuary with Mignureal, eleven diminishing silver coins and magical
  vengeance; Shadow of Sorcery is the Rings of Senek/demon labyrinth and sorcerer-city rescue. Dagger follows Samlor
  protecting his niece''s inheritance and a lethal magical blade, leaving Sanctuary for an Egyptian-inspired adventure.
  Drake explicitly distinguishes the borrowed real inspiration from his secondary-world geography. Sanctuary is
  Molin Torchholder passing city history to Cauvin/Bec while Dyareela''s cult threatens, a generation later, not
  Rifkind''s fiction. City at the Edge of Time sends Tempus/Niko into immortal Meridian, prince/princess intrigue,
  demons and Death. Tempus Unbound goes via Lemuria to modern and 22nd-century New York in search of Cime, recruiting
  future warrior Mano and contemporary policeman Rath against archmage Allegro. Storm Seed reunites the Band through
  Pinnacle House portals for dying future Sandia while Jihan seeks Cyrus, Roxane kidnaps Nino and Cime must repair
  the destroyed portal; gods interact with artificial gestation/closed ecologies but magic remains literal. Sacred
  Band rescues twenty-three pairs of actual historical Thebans at Chaeronea338BCE through a dimensional portal to
  Lemuria, trains them, returns to Sanctuary, pursues Shamshi''s murders and fights Askelon as Meridian and Sanctuary
  collide; Theban trauma/Fates are load-bearing, not just classical naming.

  Fantasy wins over SF: literal gods, curses, sorcery and dream realms govern the crossings; future technology in
  Sandia does not naturalize Enlil. SF any-time-travel gate does not apply on the magic side. Fantasy realms fails
  the complete-fiction setting gate: actual Earth is included with modern New York and historical Thebans physically
  crossing. This is verified action, not hypothetical dialogue or distant-earth resemblance. Historical fantasy
  cannot contain the modern/future Earth plus invented Sanctuary/Meridian itinerary as a single past-era story.
  Magic Time''s consistent time-magic-as-whole-premise gate also weaker: most fiction is not temporal problem solving,
  crossings include distinct realms, and dream/god magic is not the hard-magic system organizing all eleven. Portal
  threshold alternatives genuine: Pinnacle House has doors/windows, but the fiction does not organize itself around
  one anchored doorway; divine transport, storm clouds, dream realm and dimensional rupture coexist. Not merely
  a book carrier or child-friendly door. Multiverse, not Otherworld: Sanctuary, Meridian, Lemuria, Sandia and Earth
  epochs form a real system rather than one hidden world. Gateway, not Mirror: they are distinct lands/times, not
  repeated counterpart Earths. Borderland rather than Worldhopper: the shared fiction retains Sanctuary as its home
  ground and the Sacred Band''s Lemuria as the standing junction, with returns to Sanctuary and elsewhere pressing
  into it. The whole eleven are not an unhomed world-after-world trek, though Tempus Unbound and Storm Seed strongly
  wobble toward Worldhopper when isolated. Do not pick Worldhopper merely for those two or count individual volumes
  as separate fictions. Sanctuary is not always ours, but current Borderland definition explicitly says home ground
  is usually ours, not obligatorily Earth. Existing Landover/MitherMages cases support a secondary-world home without
  rewriting the gate.

  Pulp and Military still describe much of the earlier narrative: rogues, Samlor, Hanse and mercenaries fight sorcerers;
  the Beyond trilogy is military and the later Sacred Band mythic/epic. Those labels cannot erase the root-level
  Earth crossings. This is not a claim that Abbey''s Sanctuary alone is a portal novel. Whole shared universe must
  remain one fiction, under owner phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX. The earlier Rifkind separation ruling concerned
  a different universe, not a command to leave Sanctuary perpetually Abbey-only. No definition change or new genre.
  Pulp9->8; Borderland5->6; no tenth-card gate.'

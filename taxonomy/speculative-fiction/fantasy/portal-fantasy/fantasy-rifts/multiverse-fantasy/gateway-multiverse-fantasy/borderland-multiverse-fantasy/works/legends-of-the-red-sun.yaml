  - Creator explicit Reef denial: http://darkwolfsfantasyreviews.blogspot.com/2009/06/interview-mark-charan-newton.html

  - Secondary contrary Reef claim: https://fantasy-faction.com/2012/the-reef-by-mark-charan-newton

  - Creator reissue announcement, no reversal found: https://markcnewton.com/2011/11/02/the-reef/

  - Contemporary original first-book publication: https://fantasybookcritic.blogspot.com/2009/04/nights-of-villjamur-by-mark-charan.html


  ## Confidence

  Moderate. Actual magic and the complete cross-world border conflict are well supported. Earth identity rests on explicit
  creator genre intent plus secondary identification, not recognizable geographical anchors. Ghost and word-magic details
  are independently supported, but the community ending account is more specific than primary synopses. No full book was retrieved
  from an unauthorized mirror. A verified creator statement making this an independent universe, or proof the later supernatural
  events are technological in the completed text, would reopen the root walk.

  '

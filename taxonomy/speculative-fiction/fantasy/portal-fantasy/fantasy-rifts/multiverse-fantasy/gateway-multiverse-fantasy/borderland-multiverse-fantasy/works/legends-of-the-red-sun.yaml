  - Book3 return across worlds and dead walking: https://www.fantasybookreview.co.uk/Mark-Charan-Newton/The-Book-of-Transformations.html

  - Completed finale, gates, two invading cultures, freeze and 2012 original: https://www.kirkusreviews.com/book-reviews/mark-charan-newton/the-broken-isles/

  - Completed finale, inter-dimensional refugees and settlement in Villiren: http://civilian-reader.blogspot.com/2012/08/the-broken-isles-by-mark-charan-newton.html

  - Completed finale corroboration: http://afantasyreader.blogspot.com/2013/12/the-broken-isles-review.html


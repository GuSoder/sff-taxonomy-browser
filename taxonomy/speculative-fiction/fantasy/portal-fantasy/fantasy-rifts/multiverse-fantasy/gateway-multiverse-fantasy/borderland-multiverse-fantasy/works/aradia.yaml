placement_rationale: 'Whole-fiction root walk, MC06163, 2026-11-22. The Questing Road and Bastet''s Daughters are one Aradia
  fiction, not two cards: McConchie explicitly calls The Questing Road her own Aradia world in Tim Jones''s interview; her
  bibliography places Bastet''s Daughters and the projected Daughter of a City in her Aradian universe; Fantastic Fiction
  groups the two published novels. The author and Wildside describe Bastet''s Daughters as alternate ancient Egypt, around1365BCE,
  now the Napata empire with real gods; the SFE independently calls it alternate-history Ancient Egypt, and the author biography
  describes its passage from that alternate Egypt into Aradia. Thus this is an Earth-counterpart connection, not a claim that
  the Napata empire was our actual history, and not merely an invented realm with Egyptian decoration. Literal gods, dimensional
  gates and demon-summoning make Fantasy, not scientific extrapolation. Fantasy > Portal fantasy wins for the complete shared
  fiction: its system includes alternate historical Earth and Aradia. The Questing Road alone does not establish Earth, and
  would be a realm quest; its two arriving groups begin in distinct invented worlds. Do not mislabel either of those origins
  Earth. Conversely, isolating that novel to avoid the other shared-world novel would violate the one-universe rule. Real
  earth fantasy > Historical cannot contain the whole fiction''s independently realized realms and interworld rescue/invasion
  engine. Fantasy realms > Epic > High > Classic quest > Fellowship > Revival > Throwback is a genuine rival for The Questing
  Road''s Norton-style company, rescue and demon threat, but not a better whole-fiction home once alternate Earth is included.
  Sword and sorcery, military, mythological, far-shores Egyptian and animal labels describe components rather than removing
  this root gate. Portal > Fantasy rifts: crossings are dimensional gates and supernatural channels, not a reading carrier,
  a bright child-friendly door, or an anchored fairy-story/uncanny household threshold. No physical furniture doorway is established
  by the available sources. Rifts > Multiverse: Khaddishar, another party''s home world, Aradia and the demon dimension constitute
  a system, with alternate Earth also present in the companion, rather than one hidden otherworld behind ours. Not World bleeds,
  because people cross; not Planetary portal, because the destinations are dimensions, not identified planets reached within
  one universe. Multiverse > Gateway: distinct realms and their different peoples, not repeated counterparts whose likeness
  and alternate selves are the story. Napata''s Earth-counterpart origin does not by itself make the entire system Mirror
  multiverse. Gateway > Borderland: Aradia is the repeated destination and common ground, with entrants from different worlds
  and outside supernatural armies threatening it; the story converges on that realm and its society, rather than an unhomed
  party touring a new realm after every crossing. The current Borderland definition says the home ground is usually ours,
  not obligatorily ours. Worldhopper is a genuine wobble because several origin worlds are named, but the completed Questing
  Road reviews describe convergence on one threatened world, not a successive-world itinerary. Placement confidence moderate:
  the detailed completed-review evidence is much stronger for The Questing Road; Bastet''s published blurb is sparse, so no
  character plot or ending has been invented for it. Its alternate-Egypt/Aradia connection is recorded at the actual source
  strength, not called a primary-author plot synopsis. Two published novels only; Daughter of a City is mentioned as submitted
  for consideration, and no publication was verified in the author/publisher/catalogue checks. No genre or definition changed.
  Borderland multiverse fantasy6to7, no tenth-card gate.'

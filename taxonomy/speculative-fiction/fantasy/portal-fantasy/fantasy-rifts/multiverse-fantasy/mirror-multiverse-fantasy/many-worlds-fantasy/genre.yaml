definition: 'Mirror multiverse fantasy whose defining stage is travel through several counterpart versions of the world: parallel
  cities, alternate countries or shadows of reality. The reader follows a chain of versions rather than one recurring central
  pair. No quantum branching or infinite-world claim is required. Not Twin worlds fantasy, where one recurring pair supplies
  the famous setting; not Parallel lives fantasy, where another version of one''s own life is the central experience.'

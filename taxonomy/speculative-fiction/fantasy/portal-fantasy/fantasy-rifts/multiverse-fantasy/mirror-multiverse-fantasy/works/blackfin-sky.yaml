placement_rationale: 'Sky Rousseau walks back into Blackfin three months after the whole town watched her drown; she remembers
  those months as ordinary life, and unravelling the discrepancy reveals she is a Pathfinder, able to move through alternate
  versions of her own life, with a circus master hunting her gift (katelliswrites.com; BCCB/Muse review). Walk: Fantasy (a
  supernatural gift, no technological frame) > Portal fantasy > Fantasy rifts > Multiverse fantasy (alternate versions of
  her life as a system of counterpart worlds) > Mirror multiverse fantasy (counterpart versions of one world and one life;
  the story turns on the likeness and difference between versions). Standalone novel; the prequel novella ''The Twins of Blackfin''
  (in the Three Strikes anthology) is short fiction, not folded. Source: author site and reviews; not read.'

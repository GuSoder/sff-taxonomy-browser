placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Portal fantasy -> Fantasy rifts -> Multiverse fantasy -> Mirror multiverse fantasy.
  Jan Palmer, a 1939 American heir, frees the Ifrit Zongri from a jar and is cursed with eternal wakefulness; whenever he
  sleeps he wakes as Tiger, his other self in a parallel Arabian-Nights world, and the two selves must fuse to save both worlds
  (Wikipedia; Galaxy Press). The crossing is a curse and sleep, not a door, so Fantasy rifts. Moved from Pulp fantasy on the
  curator''s instruction (phonemsg-01M4VEABVXWDT6MH2EW3R3CFVV). Wobble: only two worlds, not a system of many; Otherworld
  stumblings was the other candidate but sits at 9 cards.'

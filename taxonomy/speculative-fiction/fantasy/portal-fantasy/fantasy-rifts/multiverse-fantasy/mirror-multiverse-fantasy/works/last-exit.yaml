placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Portal fantasy -> Fantasy rifts -> Multiverse fantasy.
  Modern America: Zelda and college friends discovered spin, manipulating uncertainty with individual magical knacks to cross
  alternate Americas. Failed Crossroads world-repair lost lover Sal to cosmic Rot; ten years later Zelda regathers friends
  and Sal''s cousin June for rescue and world repair. Actual magic confirmed by author interview, publisher excerpt yarrow/spin,
  and reviews; math/manifolds language and PW SF-blend label do not justify SF under no-magic rule. Many worlds/Crossroads
  cosmology organize narrative, not independent world or single-Earth incidental excursion. Spin/road crossing not anchored
  doorway or textual transport; people travel, so World bleeds fails despite Rot leaking. One Otherworld fails many worlds.
  Real-earth dark horror tone, modern relationships, American archetypes do not displace portal organization; no named myth
  retold. Tone dark/heavy/horror with wit, not Adams-like comic uncertainty drive. SF multiverse odyssey/war functional candidates
  fail actual magic root. Owner2026-10-01 07:05:13 Execute Multiverse fantasy, phonemsg-01M3TXMDEZTDVC5972NDVXZQFC, verified
  original live conversation. Leaf6->7 after Book of Dust duplicate removal, not pre-dedupe7->8.'

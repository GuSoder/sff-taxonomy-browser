  ## Cover inspection

  Actual pixels inspected: contact sheets1-4, then correction sheet. Caught/replaced German Dragon and Dawn first candidates
  and Wrecks Ace-double spread. All included covers are distinct English print fronts, some reprints or revised-title jackets.
  Distant Suns candidate was a magazine cover but is excluded and never enters the card. Local files localized into repository
  before deployment. No invented English title jacket for French-only novel.


placement_rationale: '# Moorcock Multiverse whole-fiction recovery

  6 November 2026


  ## Decision

  One shared fiction, **Moorcock Multiverse**, with 68 in-scope published English-language novels. Fourteen existing cards
  consolidate into one. Mother London remains untouched because no sufficiently specific continuity binding was established.
  This is not all Moorcock books by association.


  ## Root-down walk

  Speculative fiction > Fantasy > Portal fantasy > Fantasy rifts > Multiverse fantasy > Mirror multiverse fantasy.


  At the root, actual sorcery, Chaos gods, soul-eating swords, Lucifer, Grail magic, the cosmic Balance and Champion incarnation
  are decisive. Local technological explanations in Kane, Glogauer, Dancers, Faustaff and the space novels do not make the
  shared fiction science fiction with no actual magic. Science fantasy here requires fantasy surfaces on scientific engines;
  it does not absorb an entire genuinely magical shared cosmos merely because some strands use technology. Historical, contemporary,
  far-future and mimetic strands are all present and must not be mistaken for independent whole fictions.


  Fantasy realms fails for the whole: invented Melnibone and Corum worlds are joined to twentieth-century Earth, counterfactual
  Earths, historical Europe, London, Nazi Germany, Victorian England and future Earths. Real earth fantasy fails as governing
  shelf because travel and relationships among versions, not hidden magic in one fixed Earth setting, organize the fiction.
  Portal accepts our Earth in a system of worlds. Whimsical/Eldritch doors and Transporting tomes fail as a whole: summoning,
  dreams, dimension ships, temporal currents, roads and incarnation recur; there is no one door or textual transport. Fantasy
  rifts accepts channels among worlds. World bleeds fails because people and identities travel. Otherworld fantasy fails because
  the universe is not one hidden world; planetary portal alone fails because Mars is one strand, not the shared cosmology.


  Multiverse fantasy accepts the many-world cosmology, explicit Order/Chaos and Balance. Mirror wins over Gateway: heroes
  are the same Champion in counterpart forms; Elric/Ulric merge souls, Corum/Elric/Erekose meet as incarnations, Hawkmoon
  inhabits Ilian and his history is remade, the Cornelius cast changes roles through twentieth centuries, and alternate Moorcocks
  experience different lives. Author explains adjacent universes as near-identical and distant ones as radically divergent.
  Distinct realms and roaming are real, so Worldhopper is the serious alternative, but retaining two roaming subseries there
  while separating all the other selves would miss what makes the whole cosmos one fiction. The inter-version identities,
  recurrence and differences are the stronger shared organizing principle. No ancestor definition changed to make it fit.


  ## Gate

  Mirror multiverse fantasy 9 -> 10, now frozen. Worldhopper 10 -> 8 after its two Moorcock fragments leave; its old tenth
  gate is superseded by Mirror''s real tenth. No more intake before Mirror is investigated and a split is served. No split
  executed under fiction-moving authority.


  ## Boundary and conflicts

  - Fourteen prior fragments recovered, including actual novels hidden behind Corum/Nomad/Moonbeam Roads/Von Bek/Second Ether
  omnibus rows.

  - Mother London: Quietus introduction speaks generally of recurring versions, but no specific shared character/event was
  established. Leave this existing card alone. King of the City likewise not pulled in by London branding.

  - The Distant Suns: publisher confirms Jerry/Cathy/Frank names, but Davey explicitly says no direct link and explains reusing
  characters in a didactic space adventure. Completed reviews agree only names link it. Excluded from this fold, not declared
  nonexistent.

  - The Great Rock ''n'' Roll Swindle / Gold Diggers of 1977: genuine Cornelius novel, but author confirms film job for hire.
  Omitted under standing media tie-in exclusion; parent confirmed this reading 22:23. Doctor Who/Tarzan/Sexton Blake job-for-hire
  works not folded.

  - Elric: Les Buveurs d''Âmes (2011, Fabrice Colin/Moorcock): genuine original French novel; Davey expressly says no English
  equivalent. Excluded under owner''s English-print-jacket rule, with no invented exemption; parent direction 22:27. This
  is the known completeness exception, not a claim of absolutely every novel in every language.

  - Collections/anthologies/novellas/graphic works excluded: Fabulous Harbours, The Weird of the White Wolf, The Bane of the
  Black Sword, Legends from the End of Time, Sojan collections, New Nature of the Catastrophe, The Alchemist''s Question,
  Firing the Cathedral, Modem Times 2.0, Pegging the President and other short Cornelius works. Omnibus titles never counted
  as extra novels. Stormbringer, Sailor, Entropy Tango and Citadel are retained novel/fixup units.

  - Wounds of Albion is future publication on 19 November 2026; not published at checking date. Albino''s Honour also unpublished.

  - Chinese Agent/Russian Intelligence dated to original 1966 novels; revised-title covers disclosed. Dragon in the Sword
  earliest print 1986, selected English jacket 1987; Davey distinguishes German-first and unauthorized-cut US English 1986
  from full UK 1987.

  - Tally-Ho, Cornelius! (2008) included: SFE identifies it as a Cornelius part of the same Multiverse, author announced it
  in November 2008; gallery''s 2009 edition label is not first-publication year. Whole shared universes across authors are
  one fiction.

  - The LSD Dossier retained with Roger Harris and Michael Moorcock, not misattributed as entirely Moorcock. It begins the
  Allard/Cornell continuity; copyright/reprint history is not a genre exclusion.

  - Breakfast in the Ruins not a literal linear sequel to Behold the Man, but counterpart Glogauers belong to same identity-based
  multiverse; End of All Songs primary Guild scene supplies cross-sequence binding. Wrecks binding uses Faustaff in that same
  scene, not the later withdrawn von Bek retcon alone.

  - Golden Barge binding is publisher''s explicit statement that Jephraim Tallow reappears in Gloriana, not merely shared
  boat imagery.


  ## Independent engines and bibliographic units

  All listed rows have their own English print-front image, bibliography form/year evidence and a plot-specific engine checked
  against publisher copy and/or completed reviews. The source ledger preserves 212 retrieved URLs and captures; not every
  retrieved page is used as proof.


  ### 01. Elric of Melniboné (1972)

  Elric, vulnerable sorcerer-emperor, struggles with cousin Yyrkoon, Cymoril and the fate of Melnibone; the soul-drinking
  black sword is actual supernatural agency.

  Bibliography/print jacket: https://moorcography.org/elric-of-melnibone/


  ### 02. The Sailor on the Seas of Fate (1976)

  Elric joins a ship travelling the seas between worlds; incarnations of the Champion, including Corum, Hawkmoon and Erekose,
  act together against world-devouring powers.

  Bibliography/print jacket: https://moorcography.org/elric-the-sailor-on-the-seas-of-fate/


  ### 03. The Sleeping Sorceress (1971)

  Elric pursues sorcerers Theleb Kaarna and Myshella and crosses into the Vanishing Tower; a section overlaps Corum King of
  the Swords from Elric viewpoint.

  Bibliography/print jacket: https://moorcography.org/the-sleeping-sorceress/


  ### 04. Stormbringer (1965)

  The final war of Law and Chaos destroys and remakes Elric world; Stormbringer consumes allies and master, making the Champion
  and cosmic Balance a literal plot, not a literary analogy.

  Bibliography/print jacket: https://moorcography.org/stormbringer/


  ### 05. The Fortress of the Pearl (1989)

  Poisoned Elric must retrieve the Pearl; Oone guides him through the sleeping girl Varadia dream realms. Not simply a swordsman
  quest in an isolated invented world.

  Bibliography/print jacket: https://moorcography.org/the-fortress-of-the-pearl/


  ### 06. The Revenge of the Rose (1991)

  Sadric ghost demands recovery of his boxed soul; Elric, Rose and Charion pursue competing purposes across supernatural landscapes,
  under Arioch and Mashabak interference.

  Bibliography/print jacket: https://moorcography.org/the-revenge-of-the-rose/


  ### 07. The Dreamthief’s Daughter (2001)

  Ulric von Bek in Nazi Germany and Elric in Tanelorn must merge lives and souls against Gaynor; Oona links the families and
  worlds.

  Bibliography/print jacket: https://moorcography.org/the-dreamthiefs-daughter/


  ### 08. The Skrayling Tree (2003)

  Ulric is abducted, Oona crosses a mythic America towards the Skrayling Oak containing realities, and Elric/Ulric reunite
  against destruction of the multiverse.

  Bibliography/print jacket: https://moorcography.org/the-skrayling-tree/


  ### 09. The White Wolf’s Son (2005)

  Oonagh kidnapping and Elric missing Stormbringer lead to counterpart Ulric, Oona and multiple Champions opposing Gaynor
  and Granbretan capture of the Runestaff.

  Bibliography/print jacket: https://moorcography.org/the-white-wolfs-son/


  ### 10. The Citadel of Forgotten Myths (2022)

  Elric and Moonglum journey beyond the Young Kingdoms to investigate Melnibonean origins and ancient mythic realms; two earlier
  novellas substantially revised plus a new third movement. Publisher and Davey distinguish new prose volume from omnibus.

  Bibliography/print jacket: https://moorcography.org/the-citadel-of-forgotten-myths/


  ### 11. The Eternal Champion (1970)

  John Daker is summoned into Erekose identity and a human/Eldren war; inherited human loyalty is overturned as he joins Ermizhad
  and the Eldren.

  Bibliography/print jacket: https://moorcography.org/the-eternal-champion/


  ### 12. Phoenix in Obsidian (1970)

  Daker/Erekose becomes Urlik Skarsol on an ice-bound dying Earth, frees the Lady of the Chalice and Silver Warriors, then
  the Black Sword sacrifice renews the sun.

  Bibliography/print jacket: https://moorcography.org/phoenix-in-obsidian/


  ### 13. The Dragon in the Sword (1986)

  Daker assumes Prince Flamadin, travels dimensions with Ulrich von Bek, and must free the dragon in the Black Sword to avert
  catastrophe.

  Bibliography/print jacket: https://moorcography.org/the-dragon-in-the-sword/


  ### 14. The Knight of the Swords (1971)

  Mabden destruction leaves Corum maimed and surviving alone; the Hand of Kwll and Eye of Rhynn give him supernatural means
  in conflict with Chaos.

  Bibliography/print jacket: https://moorcography.org/the-knight-of-the-swords/


  ### 15. The Queen of the Swords (1971)

  Corum and Rhalina confront Xiombarg realm and forces, moving through the ordered planes rather than a merely local kingdom.

  Bibliography/print jacket: https://moorcography.org/the-queen-of-the-swords/


  ### 16. The King of the Swords (1971)

  Corum confronts Chaos king Arioch; Elric and Erekose join him in the Vanishing Tower. Direct cross-novel shared event.

  Bibliography/print jacket: https://moorcography.org/the-king-of-the-swords/


  ### 17. The Bull and the Spear (1973)

  Summoned to a later world, Corum helps mortals resist the Fhoi Myore and seeks the Bull and Spear.

  Bibliography/print jacket: https://moorcography.org/the-bull-and-the-spear/


  ### 18. The Oak and the Ram (1973)

  Corum search for legendary aid and the Oak and Ram continues his alliance against the Fhoi Myore in a later age.

  Bibliography/print jacket: https://moorcography.org/the-oak-and-the-ram/


  ### 19. The Sword and the Stallion (1974)

  Corum seeks the Sword and Stallion for the struggle against the Fhoi Myore; supernatural cure and final defeat carry a tragic
  cost.

  Bibliography/print jacket: https://moorcography.org/the-sword-and-the-stallion/


  ### 20. The Jewel in the Skull (1967)

  Hawkmoon becomes an unwilling agent with a jewel implanted in his skull and must resist Granbretan conquest with Count Brass.

  Bibliography/print jacket: https://moorcography.org/the-jewel-in-the-skull/


  ### 21. The Mad God’s Amulet (1968)

  Hawkmoon and allies seek the Mad God amulet under pursuit by the Dark Empire, with uncanny assistance through the Runestaff.

  Bibliography/print jacket: https://moorcography.org/the-mad-gods-amulet/


  ### 22. The Sword of the Dawn (1968)

  Hawkmoon and Huillam D Averc travel across the sea, face magical ordeals and obtain the Sword of Dawn and its summoned army.

  Bibliography/print jacket: https://moorcography.org/hawkmoon-the-sword-of-the-dawn/


  ### 23. The Runestaff (1969)

  Hawkmoon final struggle against Granbretan completes the Runestaff design and the war of the first sequence.

  Bibliography/print jacket: https://moorcography.org/the-runestaff/


  ### 24. Count Brass (1973)

  The apparent peace after victory breaks into altered histories: dead allies return, Count Brass must be found, and Hawkmoon
  confronts changes in his own reality.

  Bibliography/print jacket: https://moorcography.org/count-brass/


  ### 25. The Champion of Garathorm (1973)

  Hawkmoon acts through counterpart incarnation Ilian on Garathorm, rescuing the world while seeking his lost family across
  realities.

  Bibliography/print jacket: https://moorcography.org/the-champion-of-garathorm/


  ### 26. The Quest for Tanelorn (1975)

  Hawkmoon search reaches Tanelorn, with multiple Champions and the struggle over the Black Sword and cosmic Balance.

  Bibliography/print jacket: https://moorcography.org/the-quest-for-tanelorn/


  ### 27. The War Hound and the World’s Pain (1981)

  Thirty Years War mercenary Ulrich von Bek deserts atrocity, meets Lucifer and Sabrina, and quests for the Grail through
  Earth, Hell and Mittelmarch.

  Bibliography/print jacket: https://moorcography.org/the-war-hound-and-the-worlds-pain/


  ### 28. The City in the Autumn Stars (1986)

  Manfred von Bek flees revolutionary France and travels with Libussa through Mittelmarch, pursuing the Grail and the City
  in the Autumn Stars.

  Bibliography/print jacket: https://moorcography.org/the-city-in-the-autumn-stars/


  ### 29. The Brothel in Rosenstrasse (1982)

  Rickhardt von Bek retrospectively narrates an erotic obsession during the siege of Mirenburg; politically charged, unreliable
  and primarily mimetic, but explicitly same family, not independently fantasy.

  Bibliography/print jacket: https://moorcography.org/the-brothel-in-rosenstrasse/


  ### 30. The Albino’s Secret (2025)

  Seaton Begg and Taffy Sinclair investigate the abduction of Monsieur Zenith across worlds and time; Ulric von Bek/Klosterheim
  connection explicit. Mark Hodder coauthor; first print 2025.

  Bibliography/print jacket: https://moorcography.org/the-albinos-secret/


  ### 31. Blood: A Southern Fantasy (1995)

  Counterfactual American South with reversed racial hierarchy, gamblers Jack Karaquazian/Sam Oakenhurst/Rose von Bek, and
  the Game of Time between Plurality and Singularity in the Second Ether.

  Bibliography/print jacket: https://moorcography.org/blood-a-southern-fantasy/


  ### 32. The War Amongst the Angels (1996)

  Autobiographical narration and the Second Ether cast weave together the conflict between Singularity and Plurality across
  alternate realities; not the 2014 omnibus and not Fabulous Harbours collection.

  Bibliography/print jacket: https://moorcography.org/the-war-amongst-the-angels/


  ### 33. The Whispering Swarm (2015)

  A fictional Michael Moorcock finds Alsacia, a refuge in London where historical and fictional people coexist, and becomes
  involved in attempts to change the fate of Charles I.

  Bibliography/print jacket: https://moorcography.org/the-whispering-swarm/


  ### 34. The Woods of Arcady (2023)

  A different autobiographical Moorcock travels from London/Paris into the Sahara and Moonbeam Roads alongside familiar literary
  figures and Second Ether characters; no longer one hidden enclave.

  Bibliography/print jacket: https://moorcography.org/the-woods-of-arcady/


  ### 35. The Final Programme (1968)

  Jerry Cornelius, Frank, Catherine and Miss Brunner collide in a fragmented modern world; a computer/chemical final programme
  produces a new messianic being, with catastrophe, death and transformation.

  Bibliography/print jacket: https://moorcography.org/the-final-programme/


  ### 36. A Cure for Cancer (1971)

  Jerry identity and relations change across a war-torn Europe and mutable temporal settings; Una Persson and the Cornelius
  cast repeat in different roles.

  Bibliography/print jacket: https://moorcography.org/a-cure-for-cancer/


  ### 37. The English Assassin (1972)

  The apocalypse and extreme political transformations play across Cornelius lives and surroundings; social masquerade and
  a ball gather alternate-history and multiverse figures.

  Bibliography/print jacket: https://moorcography.org/the-english-assassin/


  ### 38. The Condition of Muzak (1977)

  The quartet reorders preceding events as commedia roles and returning home; family and performance reveal Jerry as Pierrot
  and Una as Harlequin rather than one linear spy mission.

  Bibliography/print jacket: https://moorcography.org/the-condition-of-muzak/


  ### 39. The Adventures of Una Persson and Catherine Cornelius in the Twentieth Century (1976)

  Una Persson and Catherine Cornelius have distinct, changing experiences through alternative twentieth centuries; roles,
  relationships and liberation replace a single stable timeline.

  Bibliography/print jacket: https://moorcography.org/471-2/


  ### 40. The Entropy Tango (1981)

  Una-centred fragmented revolutions, Makhno and shifting twentieth-century war settings, with familiar Cornelius ensemble
  across alternate realities. Fixup novel, not collection.

  Bibliography/print jacket: https://moorcography.org/the-entropy-tango/


  ### 41. The Warlord of the Air (1971)

  Oswald Bastable displaced from 1902 encounters an alternate imperial 1973, airships, anti-imperial revolt and a catastrophic
  new weapon.

  Bibliography/print jacket: https://moorcography.org/the-warlord-of-the-air/


  ### 42. The Land Leviathan (1974)

  Bastable is stranded in a different twentieth century, with racial/political power inverted and an African technological
  military power.

  Bibliography/print jacket: https://moorcography.org/the-land-leviathan/


  ### 43. The Steel Tsar (1981)

  Bastable enters another alternative world war, technology and revolution; the Guild of Temporal Adventurers, Una and world
  changes connect the trilogy.

  Bibliography/print jacket: https://moorcography.org/the-steel-tsar/


  ### 44. An Alien Heat (1972)

  Far-future Jherek Carnelian, a reality-shaping decadent, loves Victorian Amelia Underwood and follows her into nineteenth-century
  Earth.

  Bibliography/print jacket: https://moorcography.org/596-2/


  ### 45. The Hollow Lands (1974)

  Jherek/Amelia journeys continue through time, their incompatible morals and realities under the threat of cosmic exhaustion.

  Bibliography/print jacket: https://moorcography.org/the-hollow-lands/


  ### 46. The End of All Songs (1976)

  Jherek and Amelia try to remain together while the Conjunction of the Million Spheres reorganizes worlds; Bastable, Una,
  Glogauer and Faustaff explicitly tied to temporal Guild.

  Bibliography/print jacket: https://moorcography.org/the-end-of-all-songs/


  ### 47. The Transformation of Miss Mavis Ming (1977)

  Time-displaced Mavis Ming in the far future encounters the Fireclown, who seeks her as messiah/lover; Fireclown returns
  from earlier novel. Expanded novella now full novel.

  Bibliography/print jacket: https://moorcography.org/the-transformation-of-miss-mavis-ming/


  ### 48. Warriors of Mars (1965)

  Scientist Michael Kane transported from Earth to ancient Mars becomes involved in city conflicts and love for Shizala.

  Bibliography/print jacket: https://moorcography.org/warriors-of-mars/


  ### 49. Blades of Mars (1965)

  Kane returns to Mars to confront new dangers and recover his place with Shizala, using both Earth scientific knowledge and
  sword combat.

  Bibliography/print jacket: https://moorcography.org/blades-of-mars/


  ### 50. Barbarians of Mars (1965)

  Kane third Martian adventure pits him against ancient powerful threats and weapons. A recurring Champion world with time/planetary
  travel, not hard scientific Mars.

  Bibliography/print jacket: https://moorcography.org/769-2/


  ### 51. The Sundered Worlds (1965)

  Psychic Renark and Asquiol investigate a Shifter system outside ordinary universes, learn their universe is collapsing and
  evacuate humanity into another, contested universe.

  Bibliography/print jacket: https://moorcography.org/the-sundered-worlds/


  ### 52. The Fireclown (1965)

  Civil servant Alan Powys investigates the charismatic Fireclown and political manipulation underground on future Earth,
  discovering his parentage and averting destructive Time Fire.

  Bibliography/print jacket: https://moorcography.org/the-fireclown/


  ### 53. The Ice Schooner (1969)

  Konrad Arflane sails an ice ship toward New York on a frozen future Earth; the discovery of a warming world overturns his
  traditionalist Ice Mother faith.

  Bibliography/print jacket: https://moorcography.org/the-ice-schooner/


  ### 54. The Black Corridor (1969)

  Ryan flees violent Earth with family in suspended animation, alone aboard a ship bound for a new planet; isolation, concealed
  violence and mental collapse are the engine. Hilary Bailey credited as uncredited collaborator by SFE/Davey.

  Bibliography/print jacket: https://moorcography.org/the-black-corridor/


  ### 55. The Shores of Death (1966)

  Clovis Marca, last born on a sterile, tidally locked Earth, seeks the scientist Sharvis and survival/immortality at a terrible
  cost to humanity.

  Bibliography/print jacket: https://moorcography.org/the-shores-of-death/


  ### 56. The Chinese Agent (1966)

  Cowardly spy Jerry Cornell stumbles through mistaken identities and stolen death-ray plans in London; Mavis Ming returns
  later, and Phoenix names Cornell as Champion. Retitled/revised 1970 from Somewhere in the Night (1966), not two novels.

  Bibliography/print jacket: https://moorcography.org/the-chinese-agent/


  ### 57. The Russian Intelligence (1966)

  Cornell investigates a dead agent and a comic linked to spies/Satanic threats, trying to avoid work and marital discovery;
  retitled/revised 1980 from Printer''s Devil (1966).

  Bibliography/print jacket: https://moorcography.org/the-russian-intelligence/


  ### 58. Behold the Man (1969)

  Karl Glogauer travels to first-century Palestine and, discovering Jesus cannot fulfill the expected historical role, takes
  it upon himself. Scientific time machine locally, connected Glogauer in the wider magical multiverse.

  Bibliography/print jacket: https://moorcography.org/behold-the-man/


  ### 59. Breakfast in the Ruins (1972)

  Glogauer experiences alternate lives through atrocities from Paris Commune to Vietnam and future annihilation, while a London
  sexual encounter changes his role from victim to perpetrator. A novel, not factual history or story collection.

  Bibliography/print jacket: https://moorcography.org/breakfast-in-the-ruins/


  ### 60. Byzantium Endures (1981)

  Unreliable Pyat narrates his youth in Russia, revolution and civil war, inventing and revising his own antisemitic identity;
  recurring Mrs Cornelius ties to wider cast.

  Bibliography/print jacket: https://moorcography.org/byzantium-endures/


  ### 61. The Laughter of Carthage (1984)

  Pyat flees Bolshevism, travels Europe/America, attempts aircraft projects and lectures for the Klan before finding Hollywood.

  Bibliography/print jacket: https://moorcography.org/the-laughter-of-carthage/


  ### 62. Jerusalem Commands (1992)

  Pyat from Hollywood to North Africa, fantasies and sexual exploitation, with repeated inventions, betrayals and the path
  toward European fascism.

  Bibliography/print jacket: https://moorcography.org/jerusalem-commands/


  ### 63. The Vengeance of Rome (2006)

  Pyat reaches Mussolini/Hitler circles and Dachau before later telling his life to Moorcock in London; Fromental and Cornelius
  continuity connects otherwise mimetic historical quartet.

  Bibliography/print jacket: https://moorcography.org/the-vengeance-of-rome/


  ### 64. Gloriana, or The Unfulfill’d Queen (1978)

  Gloriana Albion court balances Montfallcon secret state violence against Quire sabotage and sexual manipulation; Una and
  Jephraim Tallow recur, with a counterpart Elizabethan Earth rather than historical Elizabeth.

  Bibliography/print jacket: https://moorcography.org/gloriana-or-the-unfulfilld-queen/


  ### 65. The Wrecks of Time (1967)

  Faustaff organization opposes demolition squads destroying parallel Earths, learns of the Principals and artificial planetary
  recreation, and intervenes to break the cycle; not merely time travel.

  Bibliography/print jacket: https://moorcography.org/the-wrecks-of-time/


  ### 66. The Golden Barge (1979)

  Jephraim Tallow pursues an elusive golden barge down a river, rejecting possible satisfactions and causing harm in an allegory
  of selfhood; publisher confirms he returns in Gloriana.

  Bibliography/print jacket: https://moorcography.org/the-golden-barge/


  ### 68. The LSD Dossier (1966)

  Nick Allard investigates Latin American abduction and drug intrigue, with acid experience of many lives; Roger Harris original
  extensively rewritten by Moorcock. Same protagonist then becomes Cornell through two revised sequels, not omitted for ghostwriting.

  Bibliography/print jacket: https://moorcography.org/the-lsd-dossier/


  ### 69. Tally-Ho, Cornelius! (2008)

  New York Anglican theologian Jerry Cornelius encounters a boy/immortal corsair; alternate strand of chaos engineers leaks
  into his life, joining the origin/singularity and Second Ether ideas. Authorized continuation by Carter Kaplan, not a media
  tie-in.

  Bibliography/print jacket: https://sf-encyclopedia.com/entry/kaplan_carter



  and actualEarth)

  https://www.theguardian.com/books/2020/may/08/burn-by-patrick-ness-review-a-fire-breathing-adventure (completed review,
  claw/parallel universe)

  https://lareviewofbooks.org/article/concept-over-character (completed critical review, alternate selves)

  https://www.quillquotes.com/quill-quotes-book-club/burn-final-discussion/ (completed reader discussion, return and counterparts)


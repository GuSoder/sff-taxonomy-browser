placement_rationale: '# Burn whole-novel rootwalk correction, 6 November2026


  Move existing one-fiction/one-novel Burn (Patrick Ness2020) from Alt diesel fantasy10->9 to Mirror multiverse fantasy7->8.
  No new books, no genre/definition changes. Alt diesel tenth-card split trigger cancelled before any proposal was served.
  This is not a broad corpus sweep: discovered while interrogating the frozen leaf''s members for its required split.


  The old placement rationale used only the official opening synopsis. That is incomplete: Guardian, LARB, Locus, CCBC and
  a completed reader discussion independently describe the second half, which crosses from dragon-America into actual1957
  Earth and turns on counterpart lives, deaths and families. CCBC explicitly locates Part2 in ''1957 of our world''. Sarah
  finds her dead mother alive, while this world''s Sarah died; Kazimir becomes human, Agent Dernovich''s counterpart is alive.
  The dragon goddess threatens the destination Earth; Malcolm''s eventual return to the first world is a substantive ending
  choice, not an incidental portal cameo. Full text not read, source confidence high for this structural fact.


  ## Actual root-down walk

  Speculative fiction > Fantasy > Portal fantasy > Fantasy rifts > Multiverse fantasy > Mirror multiverse fantasy.

  Literal dragon prophecy, deity and magical claw crossing, not a scientific transfer. Earth is included, explicitly actual1957
  in the destination, so the Portal ancestor passes. Fantasy realms fails the Earth criterion. Real Earth > Historical > Alternate
  history > Alt diesel describes Part1 but misses the whole book''s organized exchange and counterfactual second chances.
  Contemporary/Future Earth fail period. No hidden-history explanation of recorded history.

  Portal children tested: not one-way Otherworld fantasy revealing a mythic realm, not Sword and planet or a transported book.
  The worlds are parallel counterparts with duplicate people and alternate outcomes, not unrelated realms joined only by a
  gateway. The Mirror definition explicitly takes parallel Americas and the traveler who meets another self; no invented minimum
  of three worlds is imposed. Borderland/Worldhopper therefore lose to Mirror. The first-half dragon-alt-history is a genuine
  moderate wobble and remains recorded, but no longer determines the whole novel''s only shelf.


  Authority: original single-fiction move grant phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX, directly reread this run. Original tenth-card
  commission phonemsg-01M43MYMGAMQTNA3CY402KK7FB. No served approval decision existed, so none is silently overridden. Existing2020
  jacket/book metadata preserved; no bibliography expanded.



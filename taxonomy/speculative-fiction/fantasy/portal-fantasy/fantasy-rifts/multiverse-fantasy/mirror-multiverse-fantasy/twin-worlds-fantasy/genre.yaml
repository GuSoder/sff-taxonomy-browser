definition: Mirror multiverse fantasy whose famous defining setting is one recurring world and its magical counterpart. Conflict,
  exchange and difference between that central pair govern the reader invitation, even where the full fiction later merges
  worlds or branches timelines. Not Many worlds fantasy, where a chain of counterpart destinations is the defining stage;
  not Parallel lives fantasy, where living another version of one's life is the central experience.

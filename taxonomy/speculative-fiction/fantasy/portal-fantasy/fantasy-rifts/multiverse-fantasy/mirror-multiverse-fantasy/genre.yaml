definition: 'Multiverse fantasy in which the many worlds are counterparts of one another: shadows of a single true world,
  four Londons, parallel Americas, a science planet and a magic planet that share a place and their people. The story turns
  on the likeness and difference between versions, and on the traveller who meets another self. Not Gateway multiverse fantasy
  (there the realms are distinct and joined by a crossing). Split 2026-10-04 from Multiverse fantasy at ten cards (curator
  "Approved", 2026-10-04 10:02 PM (after the proposal naming Mirror multiverse fantasy and Gateway multiverse fantasy), relayed
  by the parent).'

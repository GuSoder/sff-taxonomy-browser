id: the-dark-world
title: The Dark World
authors: [Henry Kuttner, C. L. Moore]
first_published: 1946
canonical_genre: otherworld-fantasy
placement_status: accepted
placement_rationale: >-
  Root-down: Fantasy -> Portal fantasy -> Eldritch rifts -> Otherworld fantasy. SFE identifies The Dark World as an archetype of hybrid science fantasy and places it in the parallel-world tradition; Hachette grounds WWII veteran Edward Bond crossing by need-fire portal into one magical mirror of Earth populated by werewolves, wizards and witches. The actual plot reveals one coherent hidden magical Otherworld rather than a navigable system of many worlds, making Otherworld fantasy the exact sibling leaf.

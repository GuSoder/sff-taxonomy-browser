placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Animal fantasy. Per ISFDB (Tag, the
  Cat series, by M. John Harrison and Jane Johnson as Gabriel King; Wild Road 1997, Golden Cat 1999) and Penguin Random House:
  cats are the people, with their own society, legends and a quest along the wild road, lightly anthropomorphized, in the
  Watership Down line (Richard Adams''s blurb on the jacket). Animals rendered on their own terms is the Animal fantasy definition.
  Rejected: Quest fantasy leaves (human or humanoid questers; the cats are not a costume). Two volumes folded as one fiction
  under the shared-universe rule: The Wild Road (1997) and The Golden Cat (1999).'

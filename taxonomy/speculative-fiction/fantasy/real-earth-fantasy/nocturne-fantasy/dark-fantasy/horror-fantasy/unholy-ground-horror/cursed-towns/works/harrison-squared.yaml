placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Horror fantasy > Unholy ground horror
  > Cursed towns. Gregory, 2015 (Tor, 24 March 2015): Harrison Harrison, a teenager who has feared water since a sea creature
  capsized his family''s boat and took his father, moves with his marine-biologist mother to Dunnsmouth, a Lovecraftian town
  above the Atlantic with a strange church, creepy teachers and the Dwellers, fish-human hybrids in the bay; his mother disappears
  at sea on his first day and he works to solve it against the town (the author''s site). Rejected: Elder god torment (the
  runner-up: the Dwellers and the church point at Lovecraft''s old gods, but the book is the boy against a town, not a being''s
  intrusion tormenting him), Folk horror (the belief is not the menace, the place is), Haunted wilds and Haunted realms (not
  wilderness, not the dead), Occult cop cases and consultants (no investigator by trade), Magic school (a school is one setting).
  Cursed towns is the leaf for a settlement that turns on its own people with the curse worked into its ground. Wobble: moderate
  to high. It is a YA adventure and mystery with humor, and the leaf''s cards are horror; plot from the author''s page, not
  the book. Year 2015 (author''s site, Open Library). Cover is the Tor jacket via Publishers Weekly (the Open Library scan
  carries a library sticker). Queue id MC02146.'

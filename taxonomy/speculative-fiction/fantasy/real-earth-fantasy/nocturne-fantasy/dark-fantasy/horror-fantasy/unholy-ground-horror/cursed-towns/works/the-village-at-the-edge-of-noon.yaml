placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Real earth fantasy -> Nocturne -> Dark -> Horror -> Unholy ground -> Cursed towns. A Russian dacha cooperative''s exit
  disappears; its settlement is severed from reality, held in perpetual summer and besieged by Slavic supernatural neighbors. Katya''s inherited power may rescue
  it. Belief and bargains help resist the menace but the people are not a cult enacting rites that create it: confinement and curse in the community''s ground govern.
  A bounded cursed settlement, not a wilderness or building.'

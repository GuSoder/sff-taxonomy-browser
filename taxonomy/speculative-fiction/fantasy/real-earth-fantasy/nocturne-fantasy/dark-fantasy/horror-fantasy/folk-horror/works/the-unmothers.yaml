canonical_genre: folk-horror
placement_status: accepted
placement_rationale: 'Root-down: Fantasy -> Real earth fantasy -> Nocturne -> Dark -> Horror -> Folk horror. A grieving reporter enters rural Raeford after a horse
  bears a human baby, and finds the community''s deeply held supernatural secrets, reproductive control and feminine rage. PW confirms a literal supernatural threat;
  Library Journal calls it a triumph of folk horror. Community belief and its residents, not a haunted building or passive cursed ground, are the menace. Contemporary
  fantasy mystery fails the governing horror experience.'

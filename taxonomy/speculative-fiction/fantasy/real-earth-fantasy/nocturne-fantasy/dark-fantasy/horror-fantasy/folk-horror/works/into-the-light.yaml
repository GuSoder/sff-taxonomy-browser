placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Dark fantasy -> Horror fantasy -> Folk horror. Mark Oshiro''s2023
  contemporary California/Southwest novel follows queer Latinx adoptee Manny, cast out of Christ''s Dominion/Reconciliation, returning with the Varela family after
  a body is found near the Idyllwild camp where sister Elena remains. Eli is obedient and amnesiac inside the compound, called a miracle. Coercive conversion, white
  saviorism, transracial adoption, trauma and found family are central. Locus calls the late reveal paranormal and outright horror; Criminal Element calls it supernatural;
  author interview confirms supernatural origins. Exact identity-twist mechanism remains unverified, not resolved by this placement. Paige Smith identifies Eli as
  Manny after Reconciliation but calls the change ambiguous; no invented cloning, soul extraction, demon or ordinary renaming claim. Curator consciously chose the
  Folk horror thematic hearing2026-09-30: Folk horror seems to fit the theme. Community belief and conversion rites are the menace rather than cursed terrain; real
  marvel independently corroborated by reviews, with its nature left caveated. Modern Christian compound is a bend against old rural rites. No scientific apparatus
  verified; no historical setting, named myth replay, portal, independent world, accepted-ordinary marvel or comedy engine. Satanic/Demonic torment requires literal
  Satan or attaching demon, not merely Christian abuse. Unholy ground is less exact because people and belief make the threat. Nonlinear chronology is not time travel.
  Full conditional alternatives and unresolved-root evidence preserved in classification note; theme ruling does not erase mechanism uncertainty.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Fantasy {Real earth fantasy, Fantasy realms, Portal fantasy} -> Real earth fantasy {Animal fantasy,

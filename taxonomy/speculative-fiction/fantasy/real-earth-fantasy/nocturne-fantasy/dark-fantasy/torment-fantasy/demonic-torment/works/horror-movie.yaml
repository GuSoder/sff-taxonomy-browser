placement_rationale: 'Actual-tree walk: Fantasy -> Real earth fantasy -> Nocturne
  -> Dark fantasy -> Torment fantasy -> Demonic torment. A cursed 1993 horror film
  torments the people who made it; the surviving kid from the original shoot is drawn
  back for a remake (NYT; NPR) - an evil attached to a creative work that will not
  let its people go. Who Made Stevie Crye? precedent: the cursed tool torments its
  users.'

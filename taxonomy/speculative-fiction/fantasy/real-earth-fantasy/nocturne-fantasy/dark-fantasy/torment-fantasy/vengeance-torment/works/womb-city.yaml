placement_rationale: 'Root-down: Fantasy -> Real earth -> Nocturne -> Dark -> Torment -> Vengeance torment. After Nelah kills Moremi to hide an affair, Moremi''s
  literal vengeful ghost stalks her and demands her loved ones as reparation; Botswana ancestral folklore and a ritual conspiracy govern the second half. Body-hopping
  technology and surveillance initially look like SF, but Locus and Reactor explicitly identify the supernatural ghost engine. No magic on the SF side: cyberpunk
  bodies are furniture, not an excuse to shelve a literal haunting as technological consciousness transfer.'

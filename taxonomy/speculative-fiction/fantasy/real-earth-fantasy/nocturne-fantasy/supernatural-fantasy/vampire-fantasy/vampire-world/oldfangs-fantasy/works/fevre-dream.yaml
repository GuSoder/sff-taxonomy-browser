placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Nocturne fantasy > Supernatural fantasy
  > Vampire fantasy > Vampire world > Oldfangs fantasy. A vampire novel set on the antebellum Mississippi from 1857, ''Bram
  Stoker meets Mark Twain'' (Wikipedia): steamboat captain Abner Marsh partners with the pale Joshua York, a vampire seeking
  a way to live without killing, and is drawn into York''s feud with the master vampire Damon Julian. The vampires'' own order,
  its laws and feuds, are the story, and they have long been what they are, which is the leaf''s definition. Rejected: Vampire
  hunt (Marsh eventually moves against Julian, but the book is about vampire society and York''s reform, not a hunt), Newfangs
  fantasy (York is not newly turned), Fangs out fantasy (the world does not know). Wobble: the point of view is the human
  captain and the setting is a historical Mississippi, so Vampire hunt is a fair neighbour.'

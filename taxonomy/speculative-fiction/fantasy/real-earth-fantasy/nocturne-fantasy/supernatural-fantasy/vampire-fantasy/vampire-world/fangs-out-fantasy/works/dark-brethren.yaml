placement_rationale: 'Tracey O''Hara''s Dark Brethren (Night''s Cold Kiss 2009, Death''s Sweet Embrace 2011, Sin''s Dark Caress
  2012; the author''s site, Amazon, Audible): after centuries of war, humans and the Aeternus vampires and other parahumans
  keep an open but fragile peace, threatened by rogue Necrodreniac vampires and killers, and elite hunters police it. Walk:
  Speculative fiction > Fantasy > Real earth fantasy > Nocturne fantasy > Supernatural fantasy > Vampire fantasy > Vampire
  world > Fangs out (the vampires are known and the whole society lives with the truce). Rejected: Vampire hunt (the engine
  is the truce and its breaking, not one hunt), Oldfangs (not told from inside their dynasties), Paranormal bureau. Wobble:
  medium, Vampire hunt is the alternative. Sources: author site, Amazon, Audible blurbs; not read in full.'

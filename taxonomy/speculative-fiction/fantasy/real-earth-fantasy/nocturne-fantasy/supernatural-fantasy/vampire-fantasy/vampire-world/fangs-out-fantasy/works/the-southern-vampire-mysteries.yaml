placement_rationale: 'Root-down walk: rural Louisiana and the modern South on recognizable Earth, so Real earth fantasy; Nocturne,
  Supernatural, Vampire fantasy, Vampire world. Source: the first novel''s opening has Sookie say vampires ''came out of the
  coffin'' four years ago, with Japanese-developed synthetic blood letting them live openly, vampires legally recognized (excerpt
  of Dead Until Dark); Wikipedia describes the series as an alternative history in which supernatural beings exist and public
  awareness of them is growing, narrated by Sookie, a telepath waitress in Bon Temps. The world is rebuilt around vampires
  being known and legal, so Fangs out. Wobble: it is also mystery and romance, but the speculative frame is the out vampires;
  Sookie is human, so Newfangs and Oldfangs do not fit. Sequence per Wikipedia is 13 novels 2001-2013; the guide After Dead
  and short stories are not listed. Midnight, Texas (Midnight Crossroad etc) and Harper Connelly are separate series and are
  not folded.'

placement_rationale: 'Root-down walk: modern Portland, Seattle, Denver and London on recognizable Earth, so Real earth fantasy;
  Nocturne, Supernatural, Vampire fantasy, Vampire world. Source (PRH series page): Eleisha is a vampire far older than she
  looks, and she and her protector Philip Brante search for isolated vampires and offer them sanctuary and a home where she
  teaches them to follow the Four Laws, against rogue vampires such as Simone Stratford who feed for sport. The books run
  on vampire laws, a household of vampires and feuds with other vampires, from inside, so Oldfangs, where the vampires have
  long been what they are. Wobble: book one''s blurb has police learning what she is, which touches Fangs out, but vampires
  are not out to the public and the story stays in the vampire community. Newfangs was ruled out because Eleisha is old, not
  newly turned. Year check per isfdb: 2008 Blood Memories, 2009 Hunting Memories, 2010 Memories of Envy, 2011 In Memories
  We Fear, 2012 Ghosts of Memories. Leaf is now 9 of 10.'

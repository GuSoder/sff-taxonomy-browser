placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Vampire world > Fangs out fantasy. Cogman,
  2022 first edition (Ace US May 2023; the queue''s 2023 is the US date): France, 1793, where the aristocrats are vampires.
  The Scarlet Pimpernel plot reworked: Sir Percy Blakeney smuggles vampire nobles from the guillotine, British vampire kin
  offer them sanctuary at a cost to London''s ordinary people, and the housemaid Eleanor Dalton is lent by the vampire Lady
  Sophie, posed as Marie Antoinette''s double, and finds the power that could stop them (Cogman''s site; Publishers Weekly;
  Straits Times review). Vampires are known, rule and are sheltered across the courts of Europe: the world is rebuilt around
  that fact, the leaf''s test. Rejected: Alt flintlock fantasy (the Revolution is the setting and the vampires are the premise,
  not magic as the engine of a rewritten history), Oldfangs (told from the maid''s side and the rescuers'', not from inside
  vampire dynasties), Vampire hunt (the book rescues vampires), Newfangs (the turning is not the story), Revolutionary fantasy
  leaves (invented-world branch). Closest card: Anno Dracula, an alternate history with open vampires. Wobble: moderate. The
  setting is alt-historical, and I read the author''s page and two reviews, not the book. Year: Open Library gives 2022 for
  the first edition, the queue and PW give 2023 (May); recorded as a conflict, card shows 2023. Queue id MC03382.'

placement_rationale: 'Root-down walk: a vampire-and-werewolf underworld on recognizable Earth (New England), so Real earth
  fantasy; Nocturne fantasy; Supernatural fantasy; Vampire fantasy; Vampire world; Newfangs (the newly turned and the misfit).
  Sources: Penguin Random House (Blood Oranges, ''Book 1 of 3: A Siobhan Quinn Novel'': Quinn, an ex-junkie with a reputation
  as New England''s most notorious demon hunter, was nearly a midnight snack for a werewolf until she was saved by a vampire
  calling itself the Bride of Quiet; already cursed by a werewolf bite, the vampire took a pint out of her too; Kirkus praise:
  a New England setting populated by supernatural beings), and the PRH pages for Red Delicious (Book 2 of 3, 4 Feb 2014) and
  Cherry Bomb (3 Feb 2015); Blood Oranges 5 Feb 2013. The story is about a person turned into a misfit between vampires and
  werewolves who has to find her place, so Newfangs, not Werewolf fantasy (the vampire turning is the second half of her state
  and the series is a vampire-world cast) and not Vampire hunt (she is not mainly a hunter in what I read). Wobble: Werewolf
  fantasy (8) and Occult PI were considered; I read only the Book 1 blurb and the series order of the other two, so the books
  after the first are placed on the shared-universe rule, not on their own blurbs. Series published under the Kathleen Tierney
  name, by Caitlin R. Kiernan.'

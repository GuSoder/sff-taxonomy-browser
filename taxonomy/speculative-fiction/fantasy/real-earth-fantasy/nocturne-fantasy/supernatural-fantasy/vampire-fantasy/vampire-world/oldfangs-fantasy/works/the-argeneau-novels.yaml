placement_rationale: 'Lynsay Sands''s Argeneau series (Dorchester then Avon, from A Quick Bite, Sept 2003, to Immortal By
  Morning, 2025; lynsaysands.net, Goodreads series page, publisher listings): the Argeneaus are a long-lived Toronto family
  of ''vampires'' whom Sands explains with science (nanos in the blood) rather than the supernatural; they feed on blood,
  keep their own laws, and send rogue hunters after immortals who break them, and each volume pairs a family member with a
  ''life mate'' (A Quick Bite: Lissianna Argeneau, who faints at the sight of blood, and the psychologist brought in to help
  her). 37 novels in one shared universe folded into the first (rule 11j). Walk: Fantasy > Real-earth fantasy > Nocturne fantasy
  > Supernatural fantasy > Vampire fantasy > Vampire world (vampires'' own lives, lineages and social orders shape the story)
  > Oldfangs fantasy (told from inside the vampires'' own dynasties, families with laws and feuds, where they have long been
  what they are). Tried and rejected: Newfangs fantasy (the turning is not the story across the series) and Fangs out fantasy
  (the world is not rebuilt around public vampires).'

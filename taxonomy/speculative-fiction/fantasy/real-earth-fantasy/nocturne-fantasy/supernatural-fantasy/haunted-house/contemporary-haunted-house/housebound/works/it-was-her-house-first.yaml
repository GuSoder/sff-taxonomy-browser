placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Supernatural fantasy -> Haunted house -> Contemporary
  haunted house -> Housebound. Present-day West Seattle renovator Ronnie Mitchell buys Rost House, haunted by conscious Venita Rost, Bartholomew Sloan and other dead
  owners. Venita kills herself and frames Oscar in1932, then poisons Sloan. Specific dead anchored to place, not autonomous house or residual replay. Sloan''s eldritch
  bargain for detective success and fatal renewal ritual killed Priscilla; persistent bargain is a MacGuffin drawing Coty, not absent. Evil deals > Wicked wishes
  is competing backstory, not Devil: unnamed eldritch counterparty. House ownership, renovation and active conscious trapped dead govern. Venita''s exact transformation/house
  link unexplained but demonstrated; do not invent it. No scientific root, generic afterlife tour, immortality, medium gift, haunted portable object, historical-era
  main story, fungus, community rite or unreliable grief.1932 is origin,2025 contemporary main setting. Architecture differs between sources; call cliffside mansion.

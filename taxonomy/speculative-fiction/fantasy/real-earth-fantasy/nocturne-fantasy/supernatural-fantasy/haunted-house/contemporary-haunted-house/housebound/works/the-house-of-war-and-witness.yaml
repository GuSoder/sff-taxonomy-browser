placement_rationale: 'FULL ROOT-DOWN WALK (redone 2026-10-06 after the first pass was found incomplete). Speculative fiction
  > Fantasy > Real earth fantasy (1740 Prussian border, real history, not an invented realm; children include Historical fantasy,
  Contemporary fantasy, Nocturne fantasy) > Nocturne fantasy (Dark fantasy, Paranormal fantasy, Supernatural fantasy) > Supernatural
  fantasy > Haunted house (the ghosts are anchored to one building, the house is the engine). Haunted house children: Classic
  haunted house (Gothic origins through The Shining 1977: no, published 2014), Contemporary haunted house (era from Bag of
  Bones 1998: yes), Eldritch fungi (no). Contemporary children by mechanism: Housebound (specific dead bound to the walls:
  yes, the ghosts live in the house and tell their stories), Feral house (the house itself is the agent: no), Residual haunting
  (trauma replayed without an agent: no, these ghosts act and speak). Also considered and rejected: Ghost stories > Revenants
  > Ghosts & grief, Ghost speakers (no medium), Historical fantasy (the haunting, not the era, is the engine). HOLD HISTORY:
  it sat on the hanging list as ''1740 haunted house, no honest haunted-house leaf - classic ends 1977, contemporary is modern'';
  that was my mistake, the contemporary branch runs by publication era, not setting era. Housebound reached ten fictions with
  this book and needs a split. Spec-fic status: a historical ghost story (geeknative, Strange Horizons reviews); the curator''s
  scope ruling is that only pure horror without speculative elements is out (phonemsg-01M48JZVFV02KN5GW2K89JKXXW, phonemsg-01M48K0QS1JH6N00EY1P6RE8EN).'

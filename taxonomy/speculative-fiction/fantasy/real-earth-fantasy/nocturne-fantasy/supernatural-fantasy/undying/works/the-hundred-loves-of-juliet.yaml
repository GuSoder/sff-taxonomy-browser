placement_rationale: 'Root-down: Speculative fiction > Fantasy > Earth-rooted fantasy > Nocturne fantasy > Supernatural fantasy
  > Undying. Del Rey, first published 2023 (the queue''s 2024 is the paperback). Helene is Juliet reincarnated and the Alaskan
  fisherman Sebastien is Romeo, cursed to live on through the ages and find her again, with every love ending in her death.
  The supernatural engine is imposed deathlessness outside a bargain, the Undying definition. Rejected: Evil deals (a curse,
  not a bargain), Surreal afterlife (death is not the setting), Greek or Roman myth retelling (Shakespeare, not myth), Time
  travel (SF only). Wobble: reincarnation is the Helene half and the immortal is the Sebastien half; I followed the lasting
  curse. Same romance caveat as MC03085.'

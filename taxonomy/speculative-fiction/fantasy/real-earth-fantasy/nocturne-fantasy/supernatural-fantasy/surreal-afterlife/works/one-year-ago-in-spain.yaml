placement_rationale: 'Root-down: Speculative fiction > Fantasy > Earth-rooted fantasy > Nocturne fantasy > Supernatural fantasy
  > Surreal afterlife. Del Rey 2024. Matias lies in a coma in a Madrid hospital and his soul, detached from the body and without
  memory of the year they spent together, can be seen and heard only by Claire. The fantasy is disembodied existence rendered
  as a lived reality, which the leaf''s definition covers (Out of Body sits beside it). Rejected: Ghost stories (he is not
  dead and not haunting), Body swap (no exchange), Domestic fantasy (no household magic), Romantasy (Earth, not an invented
  world). Wobble: it is a romance and the Earth-rooted branch has no romance leaf; the afterlife leaf is chosen for the premise,
  not the register.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Earth-rooted fantasy > Nocturne fantasy > Supernatural fantasy
  > Evil deals > Deal with the devil. Gollancz, first published April 2020 (the queue''s 2024 is a reissue; the queue author
  ''Events'' is a scrape error, author verified on the Gollancz and ISFDB records). In 1690s Paris the singer Julie d''Aubigny
  sells her soul to the Devil for the duelling skill to kill the men who ruined her; each victim must renounce God and the
  Devil collects the soul. The signed bargain with the Devil himself is the engine, which is the Deal with the devil definition.
  Rejected: Rococo fantasy and Renaissance fantasy (the era is the stage, the bargain is the plot; 1690s is Baroque anyway),
  Satanic torment (he is a bargain partner, not a pursuer), Warrior hero and Rogue hero (the bargain, not trained skill, is
  the power). Wobble: Period fantasy is the second-closest. This placement brings Deal with the devil to ten fictions, which
  triggers a split.'

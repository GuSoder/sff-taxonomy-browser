definition: 'Deal with the devil in which the soul buys power: strength, mastery of a craft, forbidden knowledge, the means
  to act on the world or to take revenge. The signer wants to be able to do something, and the Devil is the teacher or the
  weapon. Not Devilish fame deals, where the soul buys standing, talent shown to an audience, prosperity or a better life.'

placement_rationale: 'Root-down: Fantasy -> Real earth -> Nocturne -> Supernatural -> Evil deals -> Deal with the devil. Carrion''s prosperity and class divide arise
  from a founding bargain demanding sacrifice every thirteen-year cicada emergence; Sam also bargains with a demon to save her brother. The Devil and his human servants
  make supernatural contracts the mechanism. Cursed town and Folk horror are strong atmosphere matches, but a named devil''s bargain does the work rather than an
  impersonal ground curse or autonomous community rite.'

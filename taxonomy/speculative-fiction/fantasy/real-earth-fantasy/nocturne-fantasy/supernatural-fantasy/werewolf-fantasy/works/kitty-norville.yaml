placement_rationale: 'Root-down walk: real Earth (modern Denver, Las Vegas, Washington), fantasy, so Real earth fantasy; not
  Historical (modern day); then Nocturne fantasy (the night creatures are the subject). Series premise per the author''s site
  and Wikipedia: Kitty is a werewolf who hosts a late-night radio advice show for the supernaturally disadvantaged, and the
  books follow her and the Denver werewolf pack (she and Ben become its alpha pair). Under Supernatural fantasy the choice
  is werewolf, not vampire world (Rick is a supporting vampire; the pack, the wolf nature and Kitty''s balance of human and
  wolf are the spine). Wobble: the radio show and its outed supernatural society are as much the hook as lycanthropy, so Paranormal-aftermath
  was considered, but that leaf is full at 9 and the stories stay on Kitty''s own wolf identity. Low Midnight is the spin-off
  about Cormac and Amelia in the same universe, folded under shared-universe rule 11j. Series is 14 novels per carrievaughn.com;
  only the queue''s volumes are listed.'

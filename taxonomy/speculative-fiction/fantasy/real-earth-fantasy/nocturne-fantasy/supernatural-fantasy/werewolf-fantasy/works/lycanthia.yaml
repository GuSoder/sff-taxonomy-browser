placement_rationale: 'Tanith Lee''s Lycanthia, or The Children of Wolves (DAW, 1981; ISFDB back cover and a Nicoll review):
  Christian Dorse, who believes he is dying, takes back the decaying family chateau in a remote corner of France and is accepted
  as lord by the villagers; his neighbours in the wood, the siblings Luc and Gabrielle de Lagenay, are shunned and thought
  to be one with the wolves, under an ancient curse for which his own ancestors were responsible and to which he is bound,
  and the book turns on what Christian discovers he is. Walk: Fantasy > Real Earth fantasy > Nocturne fantasy > Supernatural
  fantasy > Werewolf fantasy (lycanthropy, its curse and the choice of the cursed, on recognizable Earth). Tried: Folk horror
  (the villagers'' belief is not the menace) and Cursed towns (the curse sits in a family, not a settlement). Wobble: Folk
  horror is the alternative leaf; the French setting is dated by the reviewer as feudal-backwater rural, which I read as Earth.'

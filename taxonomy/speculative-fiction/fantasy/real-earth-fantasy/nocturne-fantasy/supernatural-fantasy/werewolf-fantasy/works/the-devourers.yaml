placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Nocturne fantasy > Dark fantasy > Supernatural
  fantasy > Werewolf fantasy. A Kolkata history lecturer is told by a stranger the story of shape-shifters who devour human
  souls, moving from Mughal-era India to the modern city; Wikipedia calls the shape-shifters werewolves and the book dark
  fantasy on recognizable Earth, about love, cannibalism and what it means to be human (Wikipedia, The Devourers). Human-wolf
  transformation and the struggle between human identity and the beast is the leaf''s definition. Rejected: Primordial torment
  (the shape-shifters are the protagonists, not a hunter of chosen victims), Arcane peoples (secret history of a people, but
  the transformation and identity struggle drive it). Wobble: moderate, since the multi-layered frame and the historical sections
  lean secret history. First published 2015 by Penguin India (Wikipedia); the queue''s 2017 is a reissue, Del Rey 2016 for
  North America.'

placement_rationale: 'Seanan McGuire''s Ghost Roads (DAW: Sparrow Hill Road, May 2014; The Girl in the Green Silk Gown, July
  2018; Angel of the Overpass, May 2021; seananmcguire.com/ghostroads.php): Rose Marshall, killed at sixteen in 1952 on Sparrow
  Hill Road as the first victim of Bobby Cross, the man who sold his soul to live forever, is the Phantom Prom Date of the
  urban legend and has run the ghostroads ever since, still furious about how she died and working toward stopping Bobby Cross
  and being avenged. Three novels in one series. Walk: Fantasy > Real-earth fantasy > Nocturne fantasy > Supernatural fantasy
  > Ghost stories > Revenants (a specific dead person remains as a purposeful presence) > Vengeful spirits (returning dead
  with purpose turned outward, justice-seeking and settling scores). Tried: Unfinished business (the living do not finish
  her story, she fights her own killer) and Ghost speakers (she is the ghost, not a medium).'

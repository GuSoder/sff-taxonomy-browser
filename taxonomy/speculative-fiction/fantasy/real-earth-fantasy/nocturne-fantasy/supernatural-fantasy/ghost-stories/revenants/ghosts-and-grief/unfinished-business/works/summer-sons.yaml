placement_rationale: 'Lee Mandelo''s Summer Sons (Tordotcom, 2021; Wikipedia, Chicago Review of Books): Andrew, a Vanderbilt
  graduate student in Tennessee, tries to unravel the apparent suicide of his adopted brother Eddie while being haunted by
  Eddie''s ghost; Southern gothic with a street-racing scene and a queer romance. Walk: Speculative fiction > Fantasy > Real
  earth fantasy > Nocturne fantasy > Supernatural fantasy > Ghost stories > Revenants > Ghosts and grief > Unfinished business
  (a death unexplained, and the living work it out). Rejected: Called back (the dead is not held by Andrew''s love but by
  the unresolved death), Vengeful spirits (the haunting is purposeful but is not a menace for its own sake), Ghost speakers
  (no medium). Wobble: low-medium, Called back. Standalone. Sources: Wikipedia and two reviews; not read in full.'

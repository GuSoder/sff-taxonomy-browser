placement_rationale: 'Root-down walk: present-day American Southwest (the fictional Santa Hermosa area per Wikipedia), so
  Real-earth fantasy; Nocturne fantasy; Supernatural fantasy; Ghost stories; Lessons beyond the grave. Sources: Tor Publishing
  Group page (on the Day of the Dead Altagracia ''Grace'' Quintero, a hot-rod customizer at Sanchez Motorworks, meets John
  Burns just two weeks too late) and Publishers Weekly (after her death Grace awakens in a timeless realm inhabited by her
  recently deceased neighbors; briefly returned to our world on Halloween night she falls in love with John, a young artist,
  who returns the feeling even when he learns her condition); charlesdelint.com (an entirely self-contained story of magic,
  loss and redemption, his first book set in the Southwest). The dead are the story''s community and the love story is what
  they offer, so The comforting dead (as with Under the Whispering Door), not Surreal afterlife (full at 9; the afterlife
  here is a neighbourhood of the dead rather than a dreamlike unreality) and not Called back (nobody holds her by grief; she
  is returned for one night). Wobble: both of those are near. Year 2009 (Tor; Wikipedia and de Lint''s list).'

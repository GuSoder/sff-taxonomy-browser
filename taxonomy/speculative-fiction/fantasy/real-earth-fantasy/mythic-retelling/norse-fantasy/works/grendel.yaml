placement_rationale: >-
  The publisher explicitly calls Grendel a retelling of Beowulf from the monster's point of view. Its inherited Northern Germanic epic is the story's source material, making Norse fantasy under Mythic retelling closer than Viking fantasy, whose boundary is the historical era.

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Mythic retelling > Greek myth fantasy
  > Greek god fantasy. Latro is a Roman mercenary after the Persian Wars, around 479 BC, who loses his memory every day and
  writes his scroll anew; a head wound lets him see the gods, Muses and spirits of the Greek world, and mortals whose fates
  the immortals hold are the story (Wikipedia: historical fantasy; Soldier of the Mist 1986, Soldier of Arete 1989, Soldier
  of Sidon 2006). The gods and their world are what Latro sees and what drives the plot, which is the leaf''s definition.
  Rejected: Greek hero fantasy (Latro is not a hero of the heroic cycles, no named myth is retold), Historical fantasy (an
  umbrella split by period; its ancient stage would also pull this to Greece, but the gods carry the book). Wobble: the setting
  is real history with the gods added, so Greek hero fantasy and the ancient-world historical branch are honest neighbours;
  the leaf says retells or reimagines named figures and narratives, which the Muses, Ares and Pan satisfy. Series folded as
  one fiction (rule 11j). Latro in the Mist (MC03358, 2003) is an omnibus of the first two novels and is not listed separately.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Mythic retelling > Arthurian fantasy
  > Arthur reimagined. King''s trilogy retells the Arthurian legend through three off-centre figures, a mad Merlin, Lancelot
  and Morgan le Fey in turn; Publishers Weekly describes Mad Merlin as a retelling that sets Malory against Bradley and Le
  Morte d''Avalon as the story of Morgan, Arthur''s half-sister, lover and sworn enemy, who opposes him because of a childhood
  vision (Publishers Weekly reviews, 2000 and 2003). The retelling itself is the argument, with the legend reshaped through
  its outsiders. Rejected: Arthur classic (the register is not Camelot''s own mode), Arthur returned (the legend does not
  come back to a later world). Wobble: low to moderate. One fiction, rule 11j: Mad Merlin 2000, Lancelot du Lethe 2001, Le
  Morte d''Avalon 2003 (Publishers Weekly and Open Library).'

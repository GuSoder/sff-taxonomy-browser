placement_rationale: 'S. M. Stirling''s Emberverse (Wikipedia lists genres alternate history, science fiction, post-apocalyptic
  and fantasy): after the Change stops electricity, firearms and engines worldwide, the later books bring supernatural powers
  (a CUT High Seeker with supernatural powers in The Sword of the Lady, Wikipedia), so real magic is in the series. Moved
  from Wasteland settlements on the curator''s no-magic-in-science-fiction ruling. Walk: Fantasy > Real-earth fantasy > Future
  fantasy (Earth''s own future after a catastrophe, with magic). Soft: the supernatural arrives gradually across 15 novels.'

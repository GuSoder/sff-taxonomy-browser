definition: Future fantasy in which humanity's civilization extends beyond Earth and genuine magic, gods or supernatural agency
  act within its interplanetary or interstellar life. Space travel, inhabited worlds and their wider conflicts are sustained
  parts of the fiction, rather than a single alien visitor or a brief trip away from Earth. Not Post-apocalyptic fantasy's
  Earth-collapse aftermath, End-times fantasy's biblical apocalypse, Vampire future's future-city vampire return or Psionic
  fantasy's psychic social order. Not SF Science fantasy, where apparently fantastic effects have scientific engines; not
  independently invented Fantasy realms merely decorated with stars.

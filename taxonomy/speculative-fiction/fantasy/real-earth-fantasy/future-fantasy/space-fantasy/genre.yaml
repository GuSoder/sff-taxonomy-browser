definition: Future fantasy in which humanity's civilization extends beyond Earth and genuine magic, gods or supernatural agency
  shape life on other worlds. This includes both sustained interplanetary or interstellar civilization and the local societies
  of settled worlds where spaceflight is ancestral history rather than the ongoing life of the fiction. Not independently
  invented Fantasy realms, SF wonders with scientific or pseudoscientific engines, or Portal fantasy governed by crossings
  between Earth and another world.

placement_rationale: '# Star of the Guardians, whole-fiction walk

  23 November 2026


  ## Verdict

  Approved Space fantasy fifth child of Future fantasy for one connected seven-novel Star of the Guardians universe. Original
  textual approval phonemsg-01M84JVHRFBAZPMP1CT76D96X7 on phonemsg-01M84J9EDD8QESBRJXTCHJVX8H. The shallow-branch tension
  and parent-summary change were explicitly disclosed. No other moves or structure authorized.


  ## Scope

  SFE explicitly connects the Star of the Guardians quartet with the Mag Force 7 trio, whose enlarged mercenary team first
  appears in the earlier sequence. ISFDB groups them under one universe, and the Robot Blues publisher description explicitly
  names that universe. One fiction, not two.


  Seven original novels: The Lost King (1990), King''s Test (1991), King''s Sacrifice (1991), Ghost Legion (1993), The Knights
  of the Black Earth (1995), Robot Blues (1996), Hung Out (1998). SFE and ISFDB agree all seven years. Reprint years, excerpts,
  card game and omnibus editions are not additional novels. Kingmaker is a separate Dragon Corsairs title and is not included.


  ## Whole-fiction content

  The original trilogy follows genetically engineered royal heir Dion''s escape, return, contest over the space-rotation bomb
  and eventual coronation. Sagan''s allegiance, Maigrey''s rescue mission and sacrificial death, the rival republican regime
  and alien invasion all matter. Ghost Legion follows an illicit royal relationship, rival claimant, alien ghost army and
  Sagan''s return, but also makes Maigrey an actual dead spirit under divine law, with supernatural assistance and eventual
  reunion beyond death.


  Mag Force 7 adds three substantial technological mercenary adventures: Xris''s revenge investigation and a royal assassination
  plot by Earth-supremacist religious extremists; a stolen robotic artifact and its pursuit before Corasian exploitation;
  and a mission to revolutionize a pacifist planet that becomes a criminal and imperial power struggle. These are not being
  silently described as seven necromancy novels. The divine afterlife is a real feature of their one universe, sufficient
  for the Fantasy root under the owner''s rule, while interplanetary civilization and adventure are sustained across the whole.


  ## Root-down walk

  Speculative fiction: all seven are speculative.


  Fantasy rather than Science fiction: PRH''s authorized Ghost Legion chapter-one sample directly gives dead Maigrey''s viewpoint,
  her lack of a body, inability to touch living Sagan, continuing spiritual bond, dead Platus and a radiant celestial being
  deliberating under divine limits. This is not merely the scientifically explained alien Ghost Legion, nanobiotic bloodswords,
  genetic psi or a marketer''s fantasy adjective. The dead-spirit viewpoint independently passes the literal supernatural
  test. SFE''s normal SF/space-opera label is a documented label conflict, not controlling in this custom tree.


  Real-earth fantasy rather than Fantasy realms: Kirkus explicitly locates the Knights'' religious extremists on Earth. Their
  project is restoration of Earth supremacy, not a wholly independent invented cosmos. The existing Real-earth definition
  expressly includes Earth''s universe, other planets and the afterlife. Galactic scenery does not negate that gate. No sustained
  Earth-to-independent-world exchange governs the fiction, so Portal fantasy fails.


  Future fantasy rather than Historical or Contemporary: humanity inhabits an interplanetary galactic civilization with royal
  and republican regimes, starships, cyborgs and technologies. No past Earth era, present-day secret world or historical myth
  retelling governs.


  Future fantasy children tested:

  - Post-apocalyptic fantasy: the recent overthrow of a dynasty is a political revolution, not a civilization-ending Earth
  catastrophe. The functioning galactic government, navy, commerce and Earth-based supremacist movement do not establish a
  ruined/rebuilt Earth. Consequently neither Post Magicalypse nor Fantasy after Disaster passes its ancestor. No unverified
  collapse is inferred just to reach a deeper shelf.

  - End-times fantasy: heavenly spirits and divine law are present, but this is not the biblical end of days or an angel-demon
  apocalypse. Literal Christianity-like theology is not sufficient.

  - Vampire future: no vampire return or protected future-city vampire conflict.

  - Psi future: engineered telepaths do matter, but the existing leaf is specifically a near-future Psy/changeling/human social
  order with suppressed feeling as rebellion. Genetics do not account for Maigrey''s literal afterlife; seven books of dynastic
  space conflict and mercenary adventure do not become this sibling''s specific social engine.


  Fantasy realms'' Gothic/Technomancy is a tempting visual rival, and The Locked Tomb sits there. Its independently invented-world
  ancestor fails here: Earth is explicit. Invented worship and Dynastic magic similarly cannot be borrowed from the invented-world
  side just because religion and royal legitimacy are important. Theological space opera and Galactic courtiers on the SF
  side fail the literal-supernatural root gate. No existing definition has been changed to admit the seed.


  ## Proposed leaf

  Name: Space fantasy.

  Parent: Future fantasy.

  Definition: Future fantasy in which humanity''s civilization extends beyond Earth and genuine magic, gods or supernatural
  agency act within its interplanetary or interstellar life. Space travel, inhabited worlds and their wider conflicts are
  sustained parts of the fiction, rather than a single alien visitor or a brief trip away from Earth. Not Post-apocalyptic
  fantasy''s Earth-collapse aftermath, End-times fantasy''s biblical apocalypse, Vampire future''s future-city vampire return
  or Psi future''s psychic social order. Not SF Science fantasy, where apparently fantastic effects have scientific engines;
  not independently invented Fantasy realms merely decorated with stars.


  Scope is not limited to Christian theology, royal heirs, mercenaries, seven books, or Weis''s exact devices. It covers the
  whole positive spacefaring future-fantasy slot. The name is an attested genre phrase, not a newly invented term. Mythcreants
  (2025), Book Riot (2021) and Esprit SF independently use it. Ordinary usage overlaps science fantasy, explicitly discussed
  in Mythcreants, so the custom tree''s real-supernatural versus scientific-engine boundary must remain clear. No trademark
  clearance is claimed.


  ## Honest ceiling and structure impact

  One verified fiction, seven novels. No existing moves proposed. A full current-card scan finds no prior Guardians card or
  Mag Force 7 duplicate. Other space-magic-looking cards are not claimed as kin without fresh whole-fiction root and Earth-provenance
  research. In particular, The Locked Tomb cannot simply be moved based on a similar aesthetic; Ninefox Gambit and theological-space-opera
  cards may deserve separate future checks, not ungrounded additions to this seed.


  Future fantasy is level 3 and the proposed child is level 4, but this does not settle the shallow-seed concern. The original
  Pirate exchange explicitly preferred an honest deeper parent over a new shallow sibling. No such deeper parent passes here,
  so this is a structural tension requiring an explicit decision, not an automatic rule pass. All four current Future children
  have been tested; the only deeper child route, Post-apocalyptic fantasy, fails on an actual ancestor gate. Parent wording
  needs a minimal update: its current final partition sentence lists only four existing children, so add spacefaring future
  civilization as the fifth positive category. No sibling definitions need widening. The parent organizing summary changes
  from a world-fate partition to an explicit list of five positive categories, a disclosed parent-definition change rather
  than mere enumeration housekeeping. Four children become five; no tenth trigger.


  '

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy > Sol & Sorcery (leaf
  id space-fantasy). Meredith Ann Pierce''s three-novel Darkangel Trilogy: The Darkangel (1982), A Gathering of Gargoyles
  (1984/85, queue MC06826) and The Pearl of the Soul of the World (1990, queue MC06827); the first volume is not a queue row
  but is the same universe, so the whole fiction is placed (ISFDB author 3092, addall, Wikipedia: Darkangel Trilogy; Firebringer
  is a separate unicorn world and Pierce''s standalones are not in this universe). Setting: the Moon of our universe in the
  distant future, terraformed by long-gone colonists, where the slave Aeriel''s quest to undo the White Witch''s vampyre sons
  (''darkangels'') runs through starhorses, lons, gargoyles and a sorcery pearl (Wikipedia; author site moonandunicorn.com:
  ''the kingdoms of the Moon''; Book Smugglers and Smart Bitches reviews, ''set on the moon'', ''sad story of colonists long
  come and gone''). Magic is genuine sorcery, so Fantasy, not SF; the world is our Moon, not an invented universe, so Real
  earth fantasy, set in its future; humanity settled another world and spaceflight is ancestral history, exactly the Sol &
  Sorcery definition. Tried: Fantasy realms (the Moon is named), Dying Earth fantasy (terraformed paradise, not a terminal
  Earth), Vampire future (Earth that never fell). Wobble: the SF frame is low-key and reviewers read it as hidden SF; the
  sorcery is literal so Fantasy holds. Sources: https://en.wikipedia.org/wiki/The_Darkangel_Trilogy ; https://www.moonandunicorn.com/welcomeF/wordF/works.htm
  ; https://smartbitchestrashybooks.com/reviews/keeper-shelf-darkangel-meredith-ann-pierce/ ; https://www.thebooksmugglers.com/2012/02/book-review-the-darkangel-by-meredith-ann-pierce.html
  ; https://www.encyclopedia.com/arts/culture-magazines/pierce-meredith-ann'

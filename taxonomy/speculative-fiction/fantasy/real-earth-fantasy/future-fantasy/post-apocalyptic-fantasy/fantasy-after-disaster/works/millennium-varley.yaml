placement_rationale: 'Root-down MC04872, 2026-11-05: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy >
  Post-apocalyptic fantasy. One1983novel, not1999Ace reprint as firstyear, not1989film, not1977AirRaidshort as additionalbook.
  Author bibliography lists novel separately from screenplay. No evidence read connects it to EightWorlds/Gaea/ThunderLightning
  merely because Varley wrote them. Publisher markets SF/time travel; apparent technological agency is a strong losing route,
  not ignored. Novel''s own complete ending checked in original epilogue/prologue, independently EBSCO plot and two novel
  reviewers: BigComputer is actually the creator God, not simply human-built godlike AI. Final first-person voice invented
  free will, tried evolution then the Garden, ''this time around'' was a machine, now makes a third human creation attempt
  and hopes for seventh-day rest. It speaks of infinite capacity and of time unlike any human/machine measure. No scientific
  account explains those creation claims as simulation, metaphor or merely a robot''s belief. Final omniscient first-person
  identity changes the root despite preceding apparatus, guns, computers and SF marketing; no new magic exemption. Distinguish
  chapter11''s earlier robot Jesus comparison, which alone would be only analogy, from the final creator''s own voice.


  Whole novel: alternating LouiseBaltimore in Earth''s ninety-ninth-century LastAge and BillSmith in1983. Nineteen nuclear
  wars, other wars, toxic atmosphere and genetic decay leave an already collapsed remnant civilization. Council-run GateProject
  harvests doomed passengers from plane crashes/shipwrecks, replaces them with manufactured bodies and preserves healthy humans
  for supposed space escape. Loststunner exposes temporal interference to NTSB investigator Smith; Louise''s repeated recovery/coverup
  trips worsen his suspicions and paradox. She takes olderSmith to the LastAge while its society disintegrates and the change-wave
  approaches. BigComputer instead sends Ark and200,000rescuedhumans far forward to renewedEarth, and robotSherman waits to
  guide them; final creator''s voice frames a third try after evolution/Eden failure. Own ending, not film plot. Louise''s
  claimed removable skinsuit explicitly unreliable per Sherman''s epilogue; not stated as verified physical bodytech.


  Setting gate: Earth and its future, not autonomous FantasyRealms or an independent otherworld portal. The Gate connects
  eras of Earth, so PortalFantasy''s cross-world criterion fails. RealEarth children: Historical/Contemporary1983investigation
  is a major counterstrand, but a LastAge rescue project''s dying futureEarth, its inhabitants, collapse and divine resettlement
  govern the whole; not a retelling of past Genesis events. Therefore FutureFantasy, not ModernBiblicalMyth simply because
  God acts. The oldworld has already fallen through secular wars/environmental ruin long before the novel; ongoingparadox
  destroys the remnant, not the biblical end of days. PostApocalypticFantasy8->9 rather than EndTimesFantasy: no angel/demon
  war or Revelation apocalypse; Noah/Genesis allusion does not turn the already-secularcollapse into biblical judgment. VampireFuture/PsiFuture
  both require never-fallenEarth and respective beings/socialengine, absenthere. ScientificTimeTravel gate explicitly runs
  SF/Fantasy first and leaves magic-side travel inFantasy; apparatus and actualtwo-waytemporaltrips cannot override root.
  Strong ClassicTimeAgencies/TimeAgencyThrillers alternatives: organizedCouncil/rescueoperatives and lostweaponretrieval mystery
  would fit if scientificroot survived, but literalcreator reveal defeatsboth. Not an exception to any-SF-time-travel rule.
  Serious end-times/ModernBiblicalMyth wobbles recorded, no definitions edited or newleafproposed. English1999Ace paperbackfront
  from PRH inspected as actualpixels/localized; first1983 unchanged.


  Root-down whole-fiction split walk 2026-11-06: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy > Post-apocalyptic
  fantasy > Fantasy after Disaster. Whole novel''s Last Age was ruined by nuclear wars, pollution and genetic decay before
  its rescue project. Literal creator ending establishes fantasy, but does not recast the original secular collapse as divine
  judgment; later temporal paradox destroys the remnant separately. Owner Approved phonemsg-01M6R1CA7FDFP5DZYVRHYQC4C3; cause
  axis, no root/ancestor gate changes and no bibliography repairs bundled.'

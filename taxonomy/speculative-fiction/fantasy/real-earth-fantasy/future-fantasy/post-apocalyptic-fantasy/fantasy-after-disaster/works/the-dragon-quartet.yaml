placement_rationale: '# The Dragon Quartet whole-fiction walk

  24 November2026, MC06418-21


  ## Verdict

  One connected four-novel fiction in Fantasy after Disaster,5to6. No new genre, no existing move or definition change. Classification
  moderate, not an exact era fit: the medieval German story remains a substantial part of the whole, not merely a prologue.
  The strongest concern uniting the whole fiction is humanity''s destruction of Earth''s ecological balance, the later world
  left by that destruction and the dragons'' attempt to avert its terminal outcome. This is a future-disaster fantasy investigated
  and fought across history, not four independent era fictions.


  ## Scope and publication

  The Book of Earth1995, The Book of Water1997, The Book of Fire2000, The Book of Air2003. Current creator page for each book
  explicitly numbers it and lists the same four original years. Current PRH series calls Air the fourth and final book. SFE
  and Goodreads series independently agree four primary works;2005and2006two-volume omnibus editions are not extra novels.
  No link to Lear''s Daughters or Glimmer inferred from the author, publisher or environmental theme. Full current index searched,
  no preexisting quartet/book fiction found.


  ## What was actually read

  Creator descriptions all four; legal creator excerpts Earth/Water/Fire/Air; current publisher whole-series and Air pages;
  SFE; Don D''Ammassa checklist; independent completed Rambles finale and Brightdreamer two-omnibus reviews; completed Goodreads
  readers of all four separate novels. No full novel read and no unauthorized full-book mirror used. Search results from such
  mirrors appeared but were not opened or used for ending/cosmology claims. Two attempted omnibus Goodreads URLs resolved
  unrelated books; completely rejected, not continuity or plot evidence.


  Earth: the dragon awakens in913Germany, while Erde flees the priest Guillemo and her father''s castle. A travelling group
  and threatened women/kingdom are substantial. Earth gradually remembers the Call and his powers. The ending carries Erde
  and Earth forward rather than resolving this as a self-contained medieval tale.


  Water:2013West Africa has poisoned skies/seas, resource scarcity and corrupt power. Water''s reluctant guide N''Doch would
  rather pursue music and escape poverty. He and Erde assemble a common quest; Erde also sees and visits the earlier struggle,
  where Kothen resists the priest. Neither contemporary Africa nor the historical storyline is erased by the other. The apparent
  temporal discontinuity is actual magical travel.


  Fire: the Call takes both dragons and guides to a later devastated America, identified as2213by the completed Rambles review.
  War, disease and ecological collapse have reduced human society to remnants. Fire has made himself the God of the Apocalypse
  and Paia his high priestess, hiding her guide status. Rebels, traders, remnant technological institutions, Paia''s rejection
  of Fire and rescue/search for Air drive the whole volume. This is not merely a magical dragon visiting an otherwise intact
  future.


  Air: threatened attacks on loved ones across the centuries send the cast back to intervene as they search for the missing
  dragon. Gerrasch, encountered earlier, has lived through the centuries and become the Librarian and technological intermediary.
  The quest enters a future virtual city; nanotechnology and computers are real parts of this sequence. Completed readers
  describe discovery/communication with Air, Fire''s eventual cooperation, and a final resolution that unravels preceding
  events and returns full circle. The medieval Grove/earlier conflict remains live, not a discarded origin.


  Ending limitation: legitimate completed sources do not disclose the exact final metaphysics, every guide''s fate or how
  the reset works. A reader''s Matrix comparison is a reaction, not proof this world is an artificial simulation. Neither
  Air being encountered virtually nor Gerrasch''s technology establishes that the dragons'' powers were human-made nanotechnology
  all along. Do not invent a Nature-deity reveal or a precise restart mechanism from search snippets. Completed finale critics,
  creator and current publisher still describe literal elemental magic/dragons and a fantasy conclusion. Moderate confidence
  acknowledges this remaining detail gap. It is enough to establish an ecological world-fate conclusion across eras, not enough
  to claim exact scientific demystification.


  ## Root-down walk

  Speculative fiction > Fantasy. Four primal elemental dragons create/maintain the world, magically bond to chosen human guides,
  heal, transform and carry people through centuries. The creator explicitly says magic and high technology interface, not
  that magic is false. SFE explicitly calls this sequence fantasy. Computers, nanotechnology, environmental extrapolation
  and sci-fi comparisons make Science fantasy/Atemporal SF a substantial rival, but they do not negate actual supernatural
  agency. Owner''s root-first rule applies before the any-SF-time-travel sorting. No automatic Fantasy exception is created
  for technology, and no automatic Atemporal override is applied to magic.


  Fantasy > Real earth fantasy. Named Germany913, West Africa2013, future America and shared continuing characters establish
  our Earth''s history/universe. The elementary creation story is a fictional cosmology of this Earth, not evidence of an
  independently invented world. Thus Fantasy realms fails. Epic scale, dragon bonds, elemental rules and time magic all tempt
  its leaves, but Time magic, Hard fantasy, Channeled magic, Dragon heroic patterns and Technomancy/Technofantasy cannot bypass
  that ancestor. No independent planet, parallel realm or Faerie exchange is established. Portal fantasy fails another-world
  gate: crossing space as well as time on Earth does not create a second world. The virtual city is a technological encounter
  in the same causal world, not a whole-fiction otherworld system.


  Real earth > Future fantasy, moderate judgment. Historical fantasy is strong for the first novel and for the continuing
  German resistance, but fails to capture the complete fiction''s future ecological devastation, Earth2013and2213and end-of-history
  stakes. It is not a retelling of an inherited myth, nor chiefly a single documented historical era, nor an alternate European
  historical order. Contemporary fantasy also fails:2013was the author''s projected future when written1995-2003, not her
  present. The owner''s dual-time Contemporary ruling requires a substantial present-day strand; here there is none in the1990s/early2000s.
  Calling2013present simply because readers later passed it would silently change the author-era fantasy rule. Future is earned
  through the whole-fate concern: the dragons/companions traverse earlier eras to understand and prevent the ecological destruction
  made material in the ruined future, rather than four books of medieval life with a future epilogue. This is not a majority
  vote by volume count. Two later books inhabit the fallen Earth in depth; the earlier century is a major causal front of
  the same catastrophe/repair story. Disclose that its quest returns to the past. No claim the definition demands every scene
  in the future, and no definition widening to all cross-era fantasy.


  Future > Post-apocalyptic fantasy. The fallen civilization and remnant communities are sustained material in Fire and Air,
  with the planet''s lethal condition and its causes driving the other books'' Call. Not a never-fallen future-city vampire
  return, psychic social order or interstellar magical civilization. End-times fantasy''s biblical angel/demon apocalypse
  fails: Fire calls himself a god, but this is elemental ecology and human damage, not Christian final judgment. The whole
  is a quest to avert/repair a ruined future, with much of its action living in that future''s aftermath. The historical component
  is the placement''s real wobble, preserved without changing the branch''s gate.


  Post-apocalyptic > Fantasy after Disaster. Human pollution, greed, war and ecological mismanagement bring the ruined Earth.
  Dragons'' magic and their rescue task are material, but their attempt to restore balance does not prove they caused the
  original collapse. Fire exploits the terminal society and makes matters worse; the creator and completed critics identify
  humanity''s destruction as the governing catastrophe. Post Magicalypse requires supernatural agency materially causing civilization''s
  fall. Do not substitute the final magical intervention/reset as the cause of the earlier ruin. Both branches'' causes checked;
  choose the secular disaster with actual fantasy through its aftermath. No new curse or catastrophic deity invented. No SF
  Cli-fi leaf despite exact ecological content, because root magic gate fails it.


  ## Existing analogues and limits

  Millennium and Days of Future Past demonstrate that real magical travel to/from earlier Earth can remain Future fantasy
  when the whole is governed by the ruined future. They are analogues, not owner exceptions or permission substitutes. The
  Sipstrassi seven-novel future frame has an explicit particular owner ruling and is not treated as a reusable grant. The
  quartet''s medieval front is stronger than a simple departure frame, hence moderate confidence and the detailed disclosed
  straddle. A shallow new temporal sibling would be disproportionate while this existing whole-future/disaster route honestly
  covers its governing concern. No generic other-era remainder is proposed.


  ## Fronts

  One edition-search pass,7actual candidate fronts in two creator/publisher variants inspected; one additional creator Earth
  front found directly in its page and inspected. All four selected creator600pxEnglish flat painted jackets. Earth365x600,Water372x600,Fire365x600,Air369x600.
  Full English titles and author visible, no sticker, photographed spread or omnibus substituted. Earth green dragon/Erde,
  Water white-blue dragon/N''Doch, Fire orange-gold dragon/figure, Air blue dragon/Librarian. Publisher alternatives same
  paintings with darker/different typography at450px, lower resolution. Score8/10each. Art credit not asserted: SFE''s generic
  checklist credit and publisher-era catalogue credit conflict for later volumes. Cover bytes never committed; only hotlinks.



placement_rationale: 'Root-down MC04866 2026-11-05: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy >
  Post-apocalyptic fantasy. One complete three-novel fiction: Past Tense (2016), Present Tense (2017), Future Tense (2017),
  not queue2022Baenrerelease as a new first book, and not 2019audio omnibus as book4. Author series page lists three and Baenbook3
  calls it the last in the trilogy. Author FAQ explicitly says it is not part of Portals of Infinity; shared-author Coyote/multiverse
  motifs are not continuity evidence. Whole-fiction walk, not book1 alone: late1990s USAF Paul Young and instructor Riggs
  are taken forward by divine agency into ruined future California. Riggs is the gods'' chosen hero; unwanted passenger Paul
  becomes Coyote''s backup, is sold into slavery, rescued, gathers Sarah/Heather and reaches a surviving Marine armory/AI.
  Book2 sends them north over post-apocalyptic California on Coyote''s task, magic and shooting both necessary; finished-trilogy
  reader Douglas describes nuclear attack on dragon nesting ground, wizard/genie/elves/dwarf episodes and subsequent army
  campaign. Book3 makes Paul help Riggs defeat Aybem, then carries the enemy''s final elimination into space. Independent
  Gameindustry book3 review and multiple finished readers establish continued Coyote/Paul agency through the ending. Douglas
  alone supplies detailed cyborg rebel-leader/human-part-dead/programmed-limitations reveal and Area51/Moon automated replacement
  cleanup; these fine details are lower-confidence reader-sourced, not asserted as publisher-confirmed. They strengthen the
  science-fantasy wobble, not erase the explicit gods, goddess, magic and dragons. SF/Fantasy root is the strongest wobble:
  publisher/FF market it Science Fiction, old AI, nuclear arms, cyborg villain and lunar technology matter, but actual divine
  choice/transfer and real magical companions govern the whole three-book causal plot and are never sourced as a scientific
  disguise. Thus Fantasy first. Time travel is actual, not mere narrative chronology: Baenbook3 explicitly says brought forward
  in time, and author/goddess/Coyote supply agency. The current Time travel fiction gate explicitly runs SF/Fantasy first
  and keeps magic-side time travel in Fantasy. Therefore not Atemporal SF despite actual forward travel; no exception to the
  any-SF-time-travel rule is being invented. RealEarth over FantasyRealms/Portal: original Sacramento and later California/Reno/Marine
  armory/Area51/Moon are our Earth''s future universe, not a wholly invented cosmos or exchange with an independent world.
  Reader alternate-universe label does not establish portal-system aboutness; author and publisher identify future former
  home. Future over Contemporary/Historical: late1990s departure is framing, whole adventure is centuries later, after collapse,
  not fantasy about a recognizable1990s period. Post-apocalyptic over other Future children: fallen civilization and surviving
  high-tech remnants, monsters and rebuilt societies define all three; not biblical angels/demons EndTimes, not never-fallen
  VampireFuture/PsiFuture. PostHolocaustSurvival/RuinedEarth and SpacefaringSF lose at root; late space cleanup stays within
  this one Earth-rooted fantasy, not a second card/space-opera override. Magical quest/heroic action and harem relationship
  subplots are strong secondary flavors but don''t defeat explicit Earth-setting branch. No definition edit. Post-apocalyptic
  fantasy7->8, 835genres/2715fictions/6334books. Three distinct English CreateSpace paperback fronts linked to ISBN9781539578710/9781544668390/9781979716840
  in AbeBooks catalogue, inspected at actual pixels and localized. Author current images match these three; older diebuchsuche
  book2/3 thumbnails differ and were not substituted. Book1 diebuchsuche image was placeholder and rejected.


  Root-down whole-fiction split walk 2026-11-06: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy > Post-apocalyptic
  fantasy > Fantasy after Disaster. John Van Stry''s complete trilogy, not Marvel X-Men: Past Tense describes sky weapons,
  ruined cities, hunger and wars, then explicitly recalls nuclear winter and gods returning later. Coyote''s magical intervention
  governs the later adventure, not the initial disaster. Exact remembered durations are uncertain and not asserted. Owner
  Approved phonemsg-01M6R1CA7FDFP5DZYVRHYQC4C3; cause axis, no root/ancestor gate changes and no bibliography repairs bundled.'

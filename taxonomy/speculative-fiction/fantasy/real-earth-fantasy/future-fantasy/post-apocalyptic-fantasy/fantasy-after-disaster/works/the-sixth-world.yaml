placement_rationale: 'Rebecca Roanhorse''s Sixth World as one fiction: a drowned world remade around Dinetah, where Navajo
  gods and monsters walk beside the monster hunters.


  Root-down whole-fiction split walk 2026-11-06: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy > Post-apocalyptic
  fantasy > Fantasy after Disaster. Whole Sixth World follows Maggie/Kai''s protection and rescue after the Big Water. Roanhorse
  explicitly identifies apocalyptic climate change as the world''s ending; gods return and supernatural aid preserves Dinetah
  afterward, not proof gods caused the flood. Mixed collection and malformed history row correction remain separate. Owner
  Approved phonemsg-01M6R1CA7FDFP5DZYVRHYQC4C3; cause axis, no root/ancestor gate changes and no bibliography repairs bundled.'

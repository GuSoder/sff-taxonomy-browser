definition: Future Earth after war, nuclear devastation, climate disaster or another secular catastrophe ended the old civilization,
  with genuine magic, gods or supernatural agency shaping life in its remnants or rebuilt world. The catastrophe and the fantasy
  are both material to the whole fiction; magic need not have newly returned. Not Post Magicalypse, where supernatural agency
  materially causes the collapse, including mixed magical and technological causation. Not a destination for unverified causes,
  and not secular post-holocaust SF without a real supernatural engine. Not End-times fantasy's biblical angel-and-demon apocalypse.

definition: Future Earth in the living aftermath of a civilization-ending catastrophe materially caused by magic, gods, supernatural
  beings or a breach into the supernatural. Magical and technological causes may act together; a bomb carried through magical
  time gates belongs here. The story concerns the remnant or rebuilt world, not merely the catastrophe moment. Not Fantasy
  after Disaster, where war, climate or another secular catastrophe brings the collapse and the supernatural belongs to life
  afterward. Unknown origins do not establish a named curse or deity; the supernatural nature of Bird Box remains a disclosed
  classification judgment. Not End-times fantasy's biblical angel-and-demon apocalypse.

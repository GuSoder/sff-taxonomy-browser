canonical_genre: post-magicalypse
placement_status: accepted
placement_rationale: 'Gemmell''s Sipstrassi series: in Wolf in Shadow the world is a ruined Earth 300 years after "the fall"
  and the magic is real, the Sipstrassi stones (golden meteors that heal and create food; Wikipedia), and SFE files the sequence
  as science fantasy (sf-encyclopedia.com/entry/gemmell_david_a; middle two books set in Roman-era Britain). Moved from Wasteland
  journeys on the curator''s no-magic-in-science-fiction ruling. Walk: Fantasy > Real-earth fantasy > Future fantasy (Earth''s
  own future after a catastrophe, with magic).


  Root-down whole-fiction split walk 2026-11-06: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy > Post-apocalyptic
  fantasy > Post Magicalypse. Whole Sipstrassi spans Greek and Arthurian history plus the ruined future. The Last Guardian''s
  ending links both Falls to Pendarric''s Sipstrassi stasis field and Shannow sending the missile through time: bomb plus
  magic, not a purely secular axis tilt. Greek consolidation and Ancient Greece genre disposition remain separate. Owner Approved
  phonemsg-01M6R1CA7FDFP5DZYVRHYQC4C3; cause axis, no root/ancestor gate changes and no bibliography repairs bundled.


  Whole-fiction consolidation approved phonemsg-01M6R3B5CZRVQVGNWBVEKKB40N, 2026-11-06: Greek Series (Lion of Macedon1990,
  Dark Prince1991) folded into the existing Stones of Power/Sipstrassi card and Bloodstone1994 added, seven distinct novels
  total. Root-down: Speculative fiction > Fantasy > Real earth fantasy > Future fantasy > Post-apocalyptic fantasy > Post
  Magicalypse. Explicit owner approval accepts ruined-future framing despite four historical and three future novels, rather
  than deciding by volume majority. The late Lion continuity reveal and common Sipstrassi world are corroborated, not inferred
  from an omnibus alone. Greek Series card removed and its now-empty Ancient Greece fantasy leaf retired under the same approval.
  Classical antiquity remains a one-child umbrella over Roman fantasy, not silently dissolved. Existing card title and id
  retained. All seven English print fronts inspected and localized; Bloodstone cover is a2014Orbit reprint, not claimed as1994
  first-edition art.'

placement_rationale: 'Walk: Fantasy > Real earth fantasy > Future fantasy > Post-apocalyptic fantasy > Post magicalypse. An
  Earth so far in the future our time is not even a memory: the Named Lands live in the aftermath of the Wizard Kings'' magick-fueled
  wars, and the series opens with the spell called the Seven Cacophonic Deaths of Xhum Y''Zir destroying Windwir, greatest
  city of the remnant world. Magical and technological causes acted together in the old falls (mechoservitors and arcane science
  alongside the magick); the story is the remnant world''s wars of faith and knowledge. Real magic, so Fantasy root; five
  novels complete.'

placement_rationale: '# Wheel of Time frozen-member root correction,6November2026


  Move one whole15-novel fiction from Channeled hard magic10 to existing Post Magicalypse6->7. Channeled10->9; tenth-card
  split trigger withdrawn before a proposal was served. No genre or definition change. All15existingbooks,years,authorsandcoverspreserved.
  No broad corpus sweep. Required frozen-member root interrogation found the old placement skipped a positive Earth ancestor.


  ## Root walk

  Speculative fiction > Fantasy: actual One Power, Dark One, channeling and magical world destruction, not scientific explanation.
  Science-like magic rules are not sufficient for SF. Fantasy > Real earth fantasy rather than Fantasy realms: Jordan''s archived
  verbatim1994AOLanswer says ''The books are set in our future and in our past, depending on which way you look.'' The1996answer
  similarly says both, the characters are the sources of our myths and we of theirs. Earth is explicit, not inferred from
  a map or an Arthurian allusion. The old independently invented-universe gate fails even though the surface looks secondary-world.
  Portal fantasy is not the whole-fiction crossing engine: characters live in another age of Earth; dreamworlds and gateways
  do not make Earth-to-anotherworld travel the governing premise.

  Real earth > Future fantasy: a cyclic rather than linear chronology is a real wobble. Author explicitly permits both past
  and future; choose the future-facing turn because our events become its legends and the material stage is Earth after a
  lost highly advanced civilization''s magical collapse. This is not a claim Jordan asserted a uniquely linear future, nor
  a claim Earth loses its historical component. Historical fantasy''s recognizable past-period shelves cannot describe the
  Age-of-Legends/Third-Age social world; Contemporary fails. Future fantasy has the positively fitting after-collapse setting
  and no redefinition required.

  Future > Post-apocalyptic fantasy: the Age of Legends civilization fell in the Breaking; magical disaster literally remade
  geography and destroyed its institutions/knowledge. The books inhabit successor nations in that enduring aftermath, not
  simply a future without catastrophe. Real-world-biblical angels/demons do not govern its own invented Light/Shadow mythology,
  so End-times fails; vampires or never-fallen psychic society do not describe the whole fiction.

  Post-apocalyptic > Post Magicalypse: Dark One taints saidin, male channelers go mad and use One Power to tear world/civilization
  apart. Material supernatural causation, not a secular flood, climate or nuclear disaster with fantasy afterward. Reactor''s
  completed-series reread directly quotes the book''s Breaking passage and notes it appears again in A Memory of Light; the
  foundation and its reversal are consequential through the ending. TarValon chapter-referenced history corroborates societal
  and technological collapse, not just one mountain appearing. This meets the current leaf without broadening it.


  ## Whole-fiction integrity and limits

  Jordan''s2001Orbitinterview calls the series one very long novel with books as sections, not independent adventures. Publisher
  confirms14mainnovelsplusNewSpring, with finalthree completed by Brandon Sanderson; all15staytogether. Currentfinalvolume
  synopsis has Rand''s confrontation, allied nations'' defense and threat of renewed DarkOneascension. No claim that a separate
  volume is independently about surviving the original Breaking: the continuing social world, lost magical knowledge, tainted-source
  consequences and feared second Breaking give the whole-fiction post-collapse spine. The prologue depicts the original destruction
  and the final book reuses its pairedhistoricalverses as a frame. Existingbooksunchanged,notanoccasiontoscope-repairthem.


  Strongest alternative is former Channeled: exceptionally exact lower-level fit to flows through bodies and source limits.
  It still fails the independent-world ancestor; a precise leaf cannot override the root boundary. Time magic is not a shortcut
  to evade Earth because the circular cosmology does not erase the explicit Earth identification; chronology choice disclosed.
  A user decision would be needed to change structural gates, not for this single-fiction judgment under his grant.



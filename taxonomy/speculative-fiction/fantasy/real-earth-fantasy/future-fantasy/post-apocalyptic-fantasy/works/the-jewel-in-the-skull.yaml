canonical_genre: post-apocalyptic-fantasy
placement_status: accepted
placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Future fantasy -> Post-apocalyptic fantasy.
  Publisher locates Hawkmoon on old Earth in an alternate far future; Black Gate independently identifies post-holocaust Earth.
  Real sorcery, the Runestaff and multiverse powers govern, rather than a science-explained future. Thus not independently
  invented Fantasy realms, Historical or Contemporary. Later Castle Brass quests follow this Earth-rooted Hawkmoon through
  alternate realities to recover his wife and children; excursions do not erase the Real earth root. Within Future, the old
  civilization fell: not biblical End-times, Vampire future or Psi future on an Earth that never fell. The quartet follows
  the Dark Empire/Runestaff conflict; Castle Brass continues the same character''s reality-changing family quests. Publisher
  plot copy and specialist bibliography checked, not full-text reading of every novel. Owner Approved phonemsg-01M626T2N022Q780BNWDX1H1E2,
  2026-10-28 22:31 CET, following move plus six-entry-to-seven-distinct-novel reconciliation proposal phonemsg-01M625BZ5FB0MVM3N59YC6D5SV.
  One fiction retained; overlapping omnibus labels removed, seven unique novels listed.'

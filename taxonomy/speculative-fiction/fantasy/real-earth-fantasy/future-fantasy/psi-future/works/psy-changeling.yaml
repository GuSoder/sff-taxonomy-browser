placement_rationale: 'Nalini Singh''s Psy-Changeling series (Berkley, from Slave to Sensation, Sept 2006, and its Trinity
  continuation to Atonement Sky, 2025; nalinisingh.com, publisher pages): in a near-future Earth the telepathic Psy are held
  under the Silence protocol, which strips them of emotion, and live openly beside the changeling packs (leopards, wolves,
  bears and others) and humans, each volume following a pairing across the three peoples as the order under Silence breaks.
  24 novels, including the Trinity sequence, folded into the first as one shared universe (rule 11j); the collection Wild
  Invitation is skipped and Cold Redemption (Dec 2026) is unreleased. Walk: Fantasy > Real-earth fantasy (the story is set
  on Earth, here a near-future or alternate present) > Urban fantasy (the supernatural lives inside the modern city) > Publicly
  paranormal (the supernatural is openly known, not hidden) > Paranormal aftermath (a world already remade by a reveal, the
  stories live inside the new order). Tried and rejected: Fae founders (no Faerie peoples), Vampire world (the vampires are
  made by the archangels and are a lesser order), Hidden world leaves (nothing is hidden). Setting review 2026-10-14: real
  Earth places (San Francisco, Yosemite) and a history dated from 1969 plus over a hundred years of Silence (nalinisingh.com),
  start about 2079 per the fan timeline: Earth''s future. Wobble: Psy powers read as SF and the change is a conditioning regime,
  not a magic return; the shapeshifting changeling packs are the fantasy half.'

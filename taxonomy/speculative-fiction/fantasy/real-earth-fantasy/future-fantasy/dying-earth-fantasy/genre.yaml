definition: Future fantasy on a terminal, deep-time Earth, where world-weariness, the exhaustion of the world and its remnant
  civilizations govern the fiction, and genuine magic, gods or supernatural agency remain real. Ancient civilizations and
  lost machines may lie behind the present, but the positive subject is the world's immense age and final decline, not merely
  an unexplained disaster. Not SF Dying earth when its wonders are technological or genuinely ambiguous; not End-times fantasy's
  biblical apocalypse, Vampire future's future-city vampire return, Psionic fantasy's psychic order or Sol & Sorcery's sustained
  spacefaring civilization. Recurring Earth-to-otherworld crossings belong to Portal fantasy when that exchange governs the
  whole fiction.

definition: 'Fantasy rooted in our own Earth set in its future, whether or not a catastrophe brought it about: after
  a flood, collapse or other catastrophe, magic, gods and monsters return or persist in a remade world, or
  the supernatural simply shapes the life of a future Earth that never fell. Not Historical fantasy (the
  past) or Contemporary fantasy (the present day), and not Futurist SF (futures explained by science).
  Umbrella since 2026-10-24, partitioned by the world''s fate: Post-apocalyptic fantasy (the old world
  fell), End-times fantasy (the biblical end of days), Vampire future and Psi future (a future Earth that
  never fell).'

definition: 'Fantasy rooted in our own Earth set in its future, whether or not a catastrophe brought it about: after a flood,
  collapse or other catastrophe, magic, gods and monsters return or persist in a remade world, or the supernatural simply
  shapes the life of a future Earth that never fell. Not Historical fantasy (the past) or Contemporary fantasy (the present
  day), and not Futurist SF (futures explained by science). Partitioned into Post-apocalyptic fantasy (life after the old
  civilization fell), End-times fantasy (the biblical apocalypse), Vampire future (a future-city vampire return), Psionic
  fantasy (psychic social order), and Space fantasy (humanity''s spacefaring civilization with genuine supernatural agency).'

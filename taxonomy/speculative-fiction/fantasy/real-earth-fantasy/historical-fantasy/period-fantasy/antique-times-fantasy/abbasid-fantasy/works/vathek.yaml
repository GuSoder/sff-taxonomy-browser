placement_rationale: 'Root-down walk 2026-10-16: Speculative fiction -> Fantasy -> Real earth fantasy
  (the caliph''s court at Samarra) -> Historical fantasy (an Arabian tale of the Abbasid caliphate,
  written 1786. Wikipedia) -> Period fantasy -> Antique times fantasy -> Abbasid fantasy: the
  caliph''s court is the stage; the Giaour''s bargain and Eblis are the supernatural engine. A
  European Gothic imagining, but the stage is the caliphate, so Real earth holds. Sources:
  Wikipedia.'


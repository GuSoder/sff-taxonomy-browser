definition: 'Fantasy set in the Mughal dynasty''s South Asia, the empire years from Babur''s 1526
  victory to the empire''s end in the 1850s: emperors'' courts and caravan roads, Agra and Delhi,
  domes rising over the Yamuna, with magic in it. Mughal names the dynasty and its empire, not a
  single city; the shelf runs parallel to Europe''s late Renaissance and Rococo centuries without
  overlapping them - it is a regional era, not a European one.'

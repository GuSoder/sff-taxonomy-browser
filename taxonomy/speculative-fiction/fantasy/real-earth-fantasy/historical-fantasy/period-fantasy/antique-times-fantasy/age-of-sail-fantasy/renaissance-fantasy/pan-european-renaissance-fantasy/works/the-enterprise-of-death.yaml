placement_rationale: '## Route and alternatives

  Fantasy > Real earth fantasy > Historical fantasy > Period fantasy > Antique times fantasy > Age of sail fantasy > Renaissance
  fantasy. Documented European Renaissance figures, witch-hunting, mercenary wars and society govern. No invented universe,
  Earth/otherworld crossing, scientific explanation, present/future setting, inherited myth retelling, openly divergent timeline,
  several-era chronicle, American viceroyalty, Edo, Mughal, Abbasid, classical or prehistoric stage. Granada prologue and
  apprenticeship do not define the whole novel as medieval Andalusia. There is no plague engine. Secrecy explaining recorded
  history is not the main story: the magical source of Manuel''s Totentanz is an incident within the personal quest, not enough
  for Secret history.


  ## Whole plot and geography

  Southern-Spanish captivity and apprenticeship, escape under a ten-year curse. Awa wanders the Holy Roman Empire and is captured
  in northern Italy. Manuel is ordered to escort her to Spain, but she is freed and befriends him. Milan and Paracelsus form
  a further Italian stage. Monique and Awa move to Paris, running a brothel; Awa heals and loves Chloé. Manuel returns to
  Bern and paints his Totentanz with raised corpses as models. Awa resumes the grimoire search. The Black Forest brings vampires,
  inquisitorial pursuit and loss. The curse is defeated at Bicocca in Italy by turning battlefield spirits against the necromancer.
  The friendship has a later-life denouement. Neither northern Europe nor Italy/southern Spain is a token excursion. Approval
  phonemsg-01M66CBRKJ52Z51K11KQX891ZD on served proposal phonemsg-01M66C9BDQQSDVVBDETCRCMSZX. Moderate geographic wobble is
  addressed by the approved sustained north/south definition; no regional home is invented. Plot read through full reviews
  and synopsis, not full novel. Sources: https://buchwurm.org/bullington-jesse-vom-tode-verwest-18963/ ; https://strangehorizons.com/wordpress/non-fiction/reviews/the-enterprise-of-death-by-jesse-bullington/
  ; https://en.wikipedia.org/wiki/The_Enterprise_of_Death ; https://publishersweekly.com/978-0-316-08734-6 ; https://www.hachette.com.au/jesse-bullington/the-enterprise-of-death
  ; https://www.sffa.nz/reviews/reviewdocs/enterprise_of_death.shtml ; https://jessebullington.com/works/novels/ .'

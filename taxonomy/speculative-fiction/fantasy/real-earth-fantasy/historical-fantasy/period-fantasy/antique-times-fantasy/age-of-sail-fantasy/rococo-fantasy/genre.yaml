definition: 'Fantasy of eighteenth-century Europe before the industrial age, the whole century in all its strata: courts,
  salons and music above, guilds, slums and trades below, with the fantastic entering either world. The era''s elegance and
  its stench belong to the same shelf. Not Renaissance fantasy (the centuries before), not Industrial age fantasy (1800 on),
  not Edo fantasy (Japan''s own early modern, 1603-1868).'

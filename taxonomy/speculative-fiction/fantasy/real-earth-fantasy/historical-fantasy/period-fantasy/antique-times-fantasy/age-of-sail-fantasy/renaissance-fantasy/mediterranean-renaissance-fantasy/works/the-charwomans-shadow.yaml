placement_rationale: 'Lord Dunsany''s The Charwoman''s Shadow (G. P. Putnam''s Sons, March 1926; the queue''s 1999 is the
  Del Rey reissue with the Peter S. Beagle introduction - original year used). In the Golden Age of Spain, Ramon Alonzo, son
  of the Lord of the Tower and Rocky Forest, is sent to apprentice with a reclusive mountain magician - a graduate of the
  University of Saragossa - to learn gold-making for his sister Mirandola''s dowry; the magician pays his servants by stealing
  their shadows, and Ramon Alonzo must win back his own shadow and free the old charwoman Anemone from hers (Wikipedia; americanliterature.com
  summary; The Atlantic''s November 1926 review). Walk: Speculative fiction > Fantasy (the Philosopher''s Stone, shadow-stealing
  magic) > Real earth fantasy > Historical fantasy > Period fantasy (anchored to a documented era: Spain''s Golden Age, with
  named real institutions - Saragossa''s university, the village of Aragona) > Antique times fantasy (pre-1800) > Age of sail
  fantasy (the early modern centuries) > Renaissance fantasy > Mediterranean Renaissance fantasy (Spain is the Mediterranean
  south; the leaf''s gate names ''the Madrid of the Inquisition'' - Dunsany''s Golden Age Spain is the same shelf). Rejected:
  Portal fantasy and its doors (no crossing; the whole tale lives in Spain - contrast The King of Elfland''s Daughter, whose
  Elfland crossing organized that novel), Mythlike past (no invented divine age; this is Earth''s Spain with magic, not an
  invented mythology), Northern Renaissance (wrong side of the Pyrenees), Rococo (too late). Wobble: low-medium; Dunsany''s
  Spain is half-legendary in tone (''a tale of tales'', The Atlantic), but the era anchor is explicit and the tree files by
  setting. Sources: Wikipedia, americanliterature.com, theatlantic.com (1926 review), tvtropes.org, rambles.net, isfdb, penguinrandomhouse.com.'

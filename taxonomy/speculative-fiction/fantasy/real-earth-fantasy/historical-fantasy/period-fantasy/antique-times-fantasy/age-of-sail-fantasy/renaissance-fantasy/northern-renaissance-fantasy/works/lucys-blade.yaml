placement_rationale: 'Standalone novel (Baen 2007; no sequel in publisher or ISFDB listings). Elizabethan England: spymaster
  Sir Francis Walsingham, facing Spanish plots against Queen Elizabeth, has Dr. John Dee summon a demon for answers; the summoning
  goes wrong and the demon possesses Walsingham''s orphaned niece, Lady Lucy Dennys, who becomes the blade of the title (Baen
  publisher copy; Amazing Stories and Fantasy Literature reviews). Real earth > historical > period > antique times > age
  of sail > Renaissance; northern-renaissance-fantasy''s gate names ''Elizabethan London and Ireland'' outright - the exact
  case. Not alternate-history-fantasy (history is the stage, not a fork; the demon is the hidden element). Not mediterranean
  or pan-european (the story''s home is the English court). First published 2007.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy
  > Antique times fantasy > Renaissance fantasy > Northern Renaissance fantasy. Seth MacGregor, a young noble-born Sithe,
  and his half-brother Conal are exiled from the Sithe queen Kate NicNiven''s court and thrown among the superstitious humans
  of late 16th-century Europe, where she wants to destroy the Veil that protects the Sithe world (Publishers Weekly review
  of Firebrand); in Icefall the Sithe are still in exile in our world years later and Seth, Finn and Rory fight to go home
  and to stop her using the dying Veil (Publishers Weekly). Four books (Firebrand, Bloodstone, Wolfsbane, Icefall) are one
  fiction under rule 11j. A fae people''s story anchored to the Scotland and witch-hunting Europe of the 1500s and 1600s,
  which suits the leaf''s north of the Alps and the Atlantic isles. Rejected: Fae founders (the fae are not surviving into
  a modern city), Celtic fantasy (early-medieval Ireland, Wales and Britain, not the sixteenth century), Fairy-tale branches
  (no fairytale being retold). Wobble: real; the Veil and the war with the fae queen belong to the otherworld as much as to
  the period, and the Northern Renaissance leaf''s other members are mostly human-centred. Bloodstone''s Open Library cover
  was a title page, so its cover is left out; years follow the UK first editions. Bloodstone, Wolfsbane and Icefall plots
  not read beyond publisher and PW summaries.'

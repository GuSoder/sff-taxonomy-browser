  https://historicalnovelsociety.org/reviews/a-rose-by-any-other-name/

  - BFS review and Jamreads, supplementary finished readings: https://britishfantasysociety.org/review/a-rose-by-any-other-name-by-mary-mcmyne/
  and https://jamreads.com/reviews/a-rose-by-any-other-name-by-mary-mcmyne


  ## Caveats and changes that would alter this placement

  BookPage''s newly ascendant Elizabeth wording conflicts with the publisher''s precise1591 and is not used as chronology.
  A finding that hidden magic secretly explains the sonnets/history as the book''s dominant subject, beyond ordinary emotional
  inspiration and private spell practice, would favor Untold magic. A demonstrated shared-universe continuity would require
  whole-fiction consolidation. Neither is established by the sources read. Exact final trial mechanics remain an explicit
  limit, not silently invented research.


placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy (Revolutionary France) > Historical fantasy (set 1793 - Cogmans site; Publishers Weekly) > Period fantasy > Antique times fantasy (1793 is before the 1800 industrial line) > Rococo fantasy. France, 1793, where the aristocrats are vampires: the Scarlet Pimpernel plot reworked, Sir Percy Blakeney smuggling vampire nobles from the guillotine (Cogmans site; Publishers Weekly; Straits Times review). The leaf takes the whole eighteenth century in all its strata, and the ancien regime dying at the guillotine is that world''s end scene. Rejected: Fangs out fantasy (previous shelf: right on openness, wrong era - nothing in the book is set in our time, so it fails the bulk era test); Ember age leaves (the industrial line is 1800 now).'

placement_rationale: 'Standalone novel (Cassell 1969; reprinted in the 2014 Gollancz Fantasy Masterworks omnibus Votan and
  Other Novels). Around 600 CE, Mynyddog, king of Eiddin (Edinburgh), raises a war band of three hundred Celtic Britons -
  who still call themselves Romans two centuries after the legions left - to ride south against the Saxon marauders to the
  blood and glory of Cattraeth; narrated by Aneirin, a bard of the king''s family (publisher copy, Goodreads record; malcolmtattersall.com.au
  ''Fantasy from the Dark Ages''). It is the Gododdin heroic legend retold. celtic-fantasy reads ''Fantasy drawing on Celtic
  myth and early-medieval Ireland, Wales and Britain - bards, the sidhe and heroic legend'' - a bard narrating the founding
  Welsh heroic elegy is the gate''s exact case; The Buried Giant tenant sets the post-Roman-Britain heroic-legend precedent.
  Register disclosure: reviews describe essentially no overt supernatural content; the fantasy register is the heroic-legend
  retelling itself, and Gollancz markets it as fantasy (Fantasy Masterworks). Scope correction 2026-11-03: ISFDB lists this
  as ''Photinus 3'', but text-level evidence (Vulpes Libris: only two of the omnibus novels tell Photinus''s story; this one''s
  narrator is Aneirin, five centuries after Votan''s 2nd century) shows no character continuity with the Photinus fiction,
  so it is its own fiction here rather than a volume of Votan. First published 1969.'

first_published: 2009
canonical_genre: medieval-spiritual
placement_status: accepted
placement_rationale: 'Standalone. 1364, post-Black-Death Europe: grave-robbing twins Hegel and Manfried Grossbart
  journey toward the crypts of ''Gyptland'' believing themselves the Virgin Mary''s immaculate emissaries. Christian
  supernatural real on-page: demons possess and walk, a plague-spreading demon is hunted by the heretic priest Martyn,
  Heinrich sells his soul for vengeance; ''living saints and livelier demons'' (publisher). Fits the approved widened
  Spiritual scope (demons, curses, faith shaping the story without gods appearing). Crossover disclosed: episodic folk
  creatures (werewolf, cat-men, witch, sea-monsters, salamander) are Folklore register but not the engine. Not Plague
  fantasy: the pestilence years are past - aftermath, not stage.'

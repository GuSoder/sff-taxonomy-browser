placement_rationale: '# Sevenwaters universe, MC05056, 6 November 2026


  Expand the existing Warrior Bards fiction in Celtic fantasy to the whole shared Sevenwaters universe, twelve novels in one
  card. Retain stable ID warrior-bards; display title Sevenwaters universe. No extra fiction or genre. Celtic stays nine;
  total850genres/2775fictions/6593books. Nine novels added to the existing three. Distinct localized English fronts for all
  twelve were visually inspected. Reprint editions may differ in design, but none is audio, 3D, title-page, non-English or
  omnibus art.


  ## Scope and publication


  Author''s2014 interview answers the precise question whether Blackthorn & Grim takes place in the same universe as Sevenwaters:
  yes, Ireland a little later and north. Author''s2020 interview says Warrior Bards grows from Blackthorn & Grim in the same
  world, and that the Swan Island band first appeared in Sevenwaters. Her2021 PW interview independently confirms Swan Island''s
  creation in Sevenwaters. This is explicit continuity, not a guess from historical Ireland, family resemblance, author name
  or a common village name. Books need not share protagonists to share a universe.


  Sevenwaters six novels: Daughter of the Forest1999; Son of the Shadows2000; Child of the Prophecy2001; Heir to Sevenwaters2008;
  Seer of Sevenwaters2010; Flame of Sevenwaters2012. Author''s current series list confirms six; bibliography distinguishes
  originals from the queue''s later US/reprint dates. Blackthorn & Grim: Dreamer''s Pool2014, Tower of Thorns2015, Den of
  Wolves2016. Warrior Bards: The Harp of Kings2019, A Dance with Fate2020, A Song of Flight2021. These are the twelve published
  novels in the three linked series. Twixt Firelight and Water is a short work and excluded; Sevenwaters Trilogy omnibus is
  an edition, not three further books. No invented extra sequel. Bridei Chronicles remains separate: no positive continuity
  binding to these novels found, only forum speculation from place names; its historic Picts and the same author do not create
  shared-universe proof. Shadowfell is the author''s expressly invented Alban world, not added. Heart''s Blood is not silently
  merged without evidence.


  ## Each series'' own engine


  Sevenwaters:

  1. Daughter of the Forest is explicitly a Six Swans reimagining in early-medieval Ireland. Sorcha''s brothers are transformed,
  and silence/nettle-shirt work frees them while she suffers exile, violence and a cross-cultural romance. A genuine fairy-tale-revision
  engine for this volume, not imposed on the entire universe.

  2. Son of the Shadows follows daughter Liadan, Sight/healing, the Painted Man and mercenaries, Irish/Briton conflict and
  the prophecy of reclaiming the islands. Its original story uses Gaelic folklore rather than repeating Six Swans. Full official
  description and finished six-book reread checked.

  3. Child of the Prophecy follows Fainne''s sorcery, coercion by her grandmother and the choice to sabotage the Fair Folk''s
  reclamation of the islands versus protecting her kin and the chosen child. Not just another romance or another swan curse.

  4. Heir to Sevenwaters makes the Otherworld crossing material: newborn heir replaced by a changeling, Clodagh''s quest with
  Cathal, Mac Dara and the broken human/fey trust. Publisher synopsis plus finished review establish it independently.

  5. Seer of Sevenwaters moves to Inis Eala, shipwrecked Felix/Ardal and other survivors, murderous secrets, Sibeal''s intended
  druid vocation, Norse lore and a sea-monster rescue. Finished reviews note its different setting and register, not assumed
  from the forest books.

  6. Flame of Sevenwaters follows burned Maeve, Finbar, animal bonds, Mac Dara''s killed travelers and threat to force Cathal
  back, then their dangerous Otherworld intervention. Full author synopsis and finished reread checked, including the dog/human
  transformation endpoint. Animal bond is real, not the whole twelve-novel engine.


  Blackthorn & Grim''s own three books were checked, not inferred from Sevenwaters. Dreamer''s Pool opens prison/PTSD and
  a fey bargain requiring seven years of helping others without revenge; the healer and Grim solve Oran/Flidais''s frightening
  changed-bride puzzle. Author says it echoes a fairy tale but is not based on one, and explicitly calls this a mystery-series
  experiment. Tower of Thorns gives a howling monster in an enclosed tower, curse on land, Lady Geileis''s request and treacherous
  personal histories. Den of Wolves separates Blackthorn at court with Cara from Grim building a heartwood house with Bardan,
  solving birth/identity/fey secrets while resolving the Mathuin revenge/bargain and their partnership. Official descriptions
  plus complete-series review and Newtown finished final-book review read. Its supernatural detection and trauma/recovery
  are meaningful, not generic bard adventure.


  Warrior Bards'' three books were also checked on their own. Harp of Kings has Liobhan/Brocc/Dau''s undercover minstrel mission,
  missing coronation harp, meddling Otherworld and kingship. Dance with Fate puts blind Dau and bonded-servant Liobhan into
  abusive Oakhill while Brocc attempts Otherworld/Crow Folk communication; not just a second missing-harp quest. Song of Flight
  links Prince Aolu''s abduction, Galen''s assault, Swan Island investigation and Brocc''s dangerous Crow Folk work, ending
  with the curse/mystery''s resolution. Author''s synopses/interviews and Newtown completed second/third review plus independent
  final-book review read. Music as cross-world language matters, but these are not one invented-world bard-hero fiction detached
  from their earlier historical relatives.


  ## Whole-fiction rootwalk


  Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy > Antique times fantasy > Dark
  age fantasy > Celtic fantasy.


  Genuine fey, transformations, magic, Otherworld beings and prophecy rather than scientific engines. Real early-medieval
  Ireland/Britain/Erin/Dalriada anchor all three series; ancient-Ireland settings and modified real history are stated by
  the author. Her term alternative version means a magical historical rendering, not independently invented universe or automatically
  a counterfactual political timeline. She explicitly distinguishes historical settings from Shadowfell''s made-up world.
  Fantasy realms fails that ancestor even when books are described as epic, romance, fairytale or bard stories.


  Portal is a serious rival: Clodagh and Maeve enter the Otherworld, Brocc lives there and music communicates across the border.
  But the entire twelve-novel universe is organized around the linked historical communities, family generations, fey-human
  obligations and the evolution from Sevenwaters to Winterfalls to Swan Island. The real-Earth definition explicitly allows
  Faerie trips without leaving the branch. Several volumes'' mysteries, political coercion, survival and human relationships
  unfold on the historical stage rather than constituting a sustained crossing/return architecture. Whole-fiction aboutness
  therefore stays historical Celtic, while the portal-heavy constituent books remain named wobbles.


  Historical rather than contemporary/future. Period rather than Secret history''s hidden explanation of documented events
  or Alternate history''s explicit divergence. Myth retelling is substantial in Daughter, echoes in the Blackthorn mysteries
  and borrowed traditional lore throughout, but no single inherited myth controls all twelve. Real-era stage persists through
  different engines. The span crosses family generations but remains one early-medieval band, not Long chronicle''s straddle
  across eras. Antique rather than industrial; Dark age covers post-Roman Celtic Ireland/Britain, not classical Greece/Rome,
  Renaissance or industrial eras. Celtic is positive for druids, Fair Folk, bards, Gaelic kinship and heroic legend; not Viking
  as the governing whole just because Seer has Norse survivors, nor later feudal Medieval, Andalusian or Plague.


  The aboutness judgment is moderate: distinct series have distinct mechanics, and one exact lowest-level engine cannot be
  imposed across them. Celtic is not a miscellaneous dumping ground: it is a positive historical/mythic stage shared by all
  twelve and an existing leaf authorized for such fiction. No invented infrastructure/bard/mystery/romance leaf and no gate
  change. One universe is not split by trilogy, author-facing branding or volume.


  No full novels read. All twelve official novel descriptions read, and completed reviews cover each novel within its own
  series. Author primary continuity statements carry consolidation. Years use original rather than queue edition dates. The
  current author/publication pages are scope evidence; old interviews'' plans for additional volumes are not publication proof.



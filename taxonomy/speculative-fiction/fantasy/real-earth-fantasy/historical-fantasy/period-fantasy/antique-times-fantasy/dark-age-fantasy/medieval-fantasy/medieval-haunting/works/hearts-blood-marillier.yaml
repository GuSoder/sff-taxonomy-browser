placement_rationale: '# Heart''s Blood, MC05062, 6 November 2026


  Place Juliet Marillier''s standalone novel Heart''s Blood (2009) in Medieval haunting, three to four fictions. This is an
  ordinary single-fiction judgment, not a new genre or a definition change. Celtic fantasy remains nine. Total 850 genres,
  2,777 fictions, 6,596 books. English front jacket taken from the author''s book page and inspected at readable size.


  Scope: the author explicitly calls this a standalone, and the 2020 interview places Warrior Bards in an earlier period.
  No sourced continuity with Sevenwaters was established. A shared Irish setting and author do not prove one universe. One
  novel only; 2009 is supported by contemporary author interview, PW''s September2009 review and ISFDB''s original editions.
  Reviews that call it YA conflict with the author''s explicit adult designation; audience is not a genre gate or exclusion.


  Story: Caitrin escapes abusive relatives and works as a scribe for Anluan at Whistling Tor in twelfth-century Connacht while
  Anglo-Normans approach. She transcribes Latin family documents that expose an ancestor''s binding of dead souls, a hundred-year
  curse and the reason Anluan cannot leave without losing control of the Host. The dead are characters with their own pasts
  and wishes. Magic mirrors reveal earlier events and show Anluan''s danger; they are not doors to another world. Caitrin
  returns to confront her abusers, then returns to the Tor. A ritual and sacrifice by two members of the Host free the bond.
  Her love does not mechanically cure Anluan''s disability or break the curse by itself. His childhood stroke is not supernatural.
  The author calls this her first ghost story and explicitly contrasts it with the setting-derived mythological races of Sevenwaters
  and Wolfskin''s Norse gods.


  Root-down walk:

  - Speculative fiction > Fantasy: actual dead souls, curse and magic mirrors, not only a metaphor for trauma or staged deception.
  No scientific mechanism supports SF.

  - Fantasy > Real earth fantasy: named real twelfth-century Ireland, Connacht and Anglo-Norman advance. Fantasy realms fails
  its independently invented-world gate. Beauty and the Beast revision strongly fits a fairytale mode lower down, but Fairytale
  fantasy''s Fantasy realms ancestor fails. No shortcut to Fairytale transplant or damsel inversion. Portal fantasy also fails:
  the leading story is already Earth, the Host are summoned dead and the mirrors communicate or show past events, not a primary
  living Earth-to-otherworld crossing adventure.

  - Real earth > Historical: an explicit past era at publication, neither Contemporary nor Future.

  - Historical > Period: fictional people act within the Norman advance, not a concealed explanation for a named historical
  event or a counterfactual divergence. Mythic retelling is the strongest sibling wobble because the novel revises Beauty
  and the Beast. But its operative inherited frame is a literary fairy tale relocated into documented history, not named Celtic
  mythic figures or legendary-age history, and the author says this is not simply a fairy tale retold. The Irish territorial
  threat, local law and scribe''s work remain a concrete historical stage. No retelling leaf under a failed invented-world
  ancestor.

  - Period > Antique times: medieval, not Industrial; four generations of documents do not make this a Long chronicle spanning
  major era bands. The main narrative remains one summer''s story and the 100-year curse stays within the same medieval stage.

  - Antique > Dark age: here the umbrella explicitly includes High and late Middle Ages, not only fifth-tenth centuries. Not
  prehistoric, Classical, Age of Sail or non-European historical-cultural siblings.

  - Dark age > Medieval: twelfth-century chieftain''s household and territory, Latin documents, monastery backstory and Norman
  conquest pressure. Celtic is the real neighbor: Ireland, Irish law, original Gaelic characters, plus reviewers use Celtic
  fantasy broadly for the author''s work. I do not treat Irish geography alone as sufficient for that narrower existing leaf,
  defined around Celtic myth, early-medieval Ireland/Wales/Britain, bards, sidhe and heroic legend. Here no named Celtic myth
  or heroic legend provides the governing plot, and the author explicitly distinguishes this ghost story from her earlier
  mythological-setting fiction. This is not a date-only rule that all twelfth-century Irish stories must be Medieval; the
  actual ghost story and documented Norman-era household favor Medieval together. Viking fails its Norse seafaring/warrior
  culture; Andalusian and Plague fail their cultures or pestilence stage. No Celtic gate or Medieval definition was widened
  to make this fit, and no frozen-member sweep is needed.

  - Medieval > Medieval haunting: the living reckon with enslaved, returning dead and must free them. Medieval fey fails because
  the Host are human souls, not Fair Folk with faerie politics; Medieval folklore''s countryside creatures/witches/cursed
  men is less exact than actual ghost society; Medieval spiritual is tempting because the author considered purgatory, and
  Eichri was a monk, but there is no operative angels/devils/divine-war engine. The binding is sorcery and malicious human
  action, not an authoritative miracle or theological contest.


  Caveat: this is based on two author interviews, author synopsis, contemporary trade review and several completed reviews
  including a spoiler-level account of the curse and ending, not a fresh full-novel read. Celtic remains the strongest boundary,
  stated rather than hidden. The choice is made from the existing ancestor definitions and source distinction, not the fact
  that Celtic has nine.



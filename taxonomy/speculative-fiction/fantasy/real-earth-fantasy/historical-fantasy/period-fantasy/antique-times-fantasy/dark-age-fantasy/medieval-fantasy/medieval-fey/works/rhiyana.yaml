placement_rationale: '# MC04983 Rhiyana universe whole-fiction walk,6 November2026

  Place one fiction/five novels in existing Medieval fey,3to4. Queue1993 Hound/Falcon is a reprint omnibus, not an additional
  novel. Author-authorized publisher Alamut copy explicitly says same world, reinforced by contemporary reviews naming same
  Rhiyana princes. Count The Isle of Glass1985, The Golden Horn1985, The Hounds of God1986, Alamut1989, The Dagger and the
  Cross1991. Death and the Lady16,620word short story is acknowledged shared continuity, not a sixth novel or a separate fiction.
  No invented gate, no seed, no definitions changed.


  ## Every novel''s own engine

  Isle: seventy-year-old but youthful Alf at St Ruan''s, terrified his immortal/Fair Folk nature leaves him soulless, takes
  wounded Alun''s peace mission to Richard Lionheart and must face Church persecution and his identity. Actual published opening
  read: conjures a solid cord of fire/shadow, cat eyes, cold-iron resistance; fear and spiritual identity govern, not laboratory
  speculation.

  Golden Horn: Alf and shapechanger Thea in1203Constantinople; hospital healer and adopted family, Fourth Crusade armies/Venetians
  culminate in historical sack and adopted family''s slaughter. Romance/acceptance grows, real war not magically overturned.

  Hounds:15years later Alf is Rhiyana chancellor and father; Church heretic-hunters investigate immortal kingdom; sorcerer
  kidnaps Thea/twins/Anna to Rome, Alf/Nikki/Jehan follow to confrontation. Religious persecution and family rescue, not generic
  ghost/divine war.

  Alamut: Prince Aidan travels to BaldwinIV''s Jerusalem; nephew Gereint murdered by Sinan''s assassin, Aidan vows revenge.
  Assassin Morgiana is an immortal bound by magical oaths, mutual love across Christian/Muslim division; Joanna/family politics
  significant. Not inferred from Alf trilogy: contemporary Kirkus and completed Raymond/Olanich review independently establish
  this novel''s interpersonal/religious engine.

  Dagger: ten years later public papal marriage dispensation forged into witch denunciation. Aidan/Morgiana split and serve
  opposite sides amid Saladin''s historic victory, then reunite/return Rhiyana. Completed Kirkus and LibraryThing review read
  through outcome; women/faith/family politics substantial. Kirkus page erroneous1990 release conflicts with1991print ISFDB
  primary-verified record and library first edition; use1991.


  ## Root-down walk and explicit wobbles

  Speculativefiction: operative supernatural abilities/shapeshifting/immortality, not mundane historical.

  Fantasy versusSF is not automatic: Tarr2012 interview says her people are mutated humans with psi powers, and if she set
  the books a thousand years in the future it would be SF; she jokes she keeps writing SF. That is strong primary author evidence
  and remains explicit. But no scientific account is presented in the actual excerpt/current publishers/completed reviews;
  book-world operation is medieval enchanters/Fair Folk and soul/faith conflict. Publisher classifies Fantasy and author elsewhere
  calls this historical-fantasy method. Author''s private origin-model is not silently made a narrated scientific engine.
  Tested SF>Historical SF: Hidden historySF is strongest rival for psi people unrecorded, but no positively established scientific
  account in these novels; public royal/papal integration further weakens concealed-event reading. PeriodSF children Steampunk/Deco/Rocket
  fail medieval stage; Futurist Psionics fails past, ModernPsi fails contemporary, AtemporalScienceFantasy fails named historical
  Earth. Do not fabricate a new medieval SF leaf from interview shorthand.

  Fantasy>Realearth: RichardI/BaldwinIV/Saladin/Constantinople/Rome, not independently invented cosmos. Rhiyana is inserted
  royal country beside historical powers, not proof wholly secondary world. No Earth traveler crossing to another cosmos,
  so Portal fails. Present/future fail12th/13thcenturies.

  Historical four routes: Mythic fails inherited narrative retelling: Rhiannon/elf lore informs invention but not named myth''s
  plot; neither Roland legend nor Arthur/Grail cycle governs. SecretHistory/ArcanePeoples is serious rival for Alf hiding/denying
  his nature and persecution, but whole Alamut2 has public immortal prince, papal authorization and open religious royal conflict,
  and Rhiyana openly ruled by immortal king. Secrecy is not whole-fiction main theme or hidden explanation of a documented
  event. AlternateHistory/AltCrusade: added Rhiyana/renamedAnglia create small alternate-geography wobble, but not a lasting
  magic-caused historical fork; Hattin/Saladin/Constantinople calamity survives rather than transformed timeline. PeriodFantasy
  positive: researched historical cultural stage contains Fair Folk''s own royal/faith politics.

  Period siblings: not LongChronicle (same few historical generations), Industrial (pre1800); AntiqueTimes. Antique named
  cultures: not prehistory/classicalRome/Greekworld/AgeSail/Edo/Mughal/AbbasidEmpire. Alamut Levant/Muslim viewpoint is real
  straddle, not all ChristianEurope, but crusader era''s cross-faith dynastic relations are sustained frame across whole5.
  DarkAge broadMiddleAges; not Viking culture, postRomanCeltic stage, AndalusianIberia or pestilence. Medieval11thto15thEurope/Church/knighthood
  is positive whole-set stage, with substantial easternMediterranean strand disclosed. Not reassigning by geographic book
  halves.

  Medieval partition: not Haunting (no dead-return engine), Folklore (not countryside curse/household/waterspirit engine),
  Spiritual is strong religious concern but no confirmed operative divine order, angels/devils/openGod-war that explains the
  books; faith''s treatment of immortals is subject, not proof of literal divine causation. MedievalFey positive: Fair Folk/Rhiyana
  realm with ancient dynastic politics pressing against humans, across both series. Author''s not-elves interpretation stays
  prominent, not hidden. Whole5 cannot be sliced into MedievalFey and historicalSF/secret-history/romantasy by book.


  No time travel found in the publisher copy/completed reviews read. No other Rhiyana novel surfaced in scoped author/catalog
  research; no claim of exhaustive unpublished/archive search. One fiction shared-world rule original phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX
  read directly. Five distinct flat English print fronts visually inspected, Tor paperbacks trilogy and Doubleday Canty art
  duology, localized. Later print fronts not asserted first editions.



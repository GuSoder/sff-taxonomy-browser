canonical_genre: medieval-haunting
placement_status: accepted
placement_rationale: 'Set in 1420s Holland after the St Elizabeth flood of 1421. The supernatural is deliberately unresolved:
  a companion''s apparent return from presumed death, death visions and waking dreams, and characters described in devil or
  ghost terms that read as metaphor; the text never settles whether anything supernatural occurs. Closest honest leaf in the
  approved split is Medieval Haunting (uncanny returns of the dead), placed provisionally with the uncertainty disclosed in
  the serve.'

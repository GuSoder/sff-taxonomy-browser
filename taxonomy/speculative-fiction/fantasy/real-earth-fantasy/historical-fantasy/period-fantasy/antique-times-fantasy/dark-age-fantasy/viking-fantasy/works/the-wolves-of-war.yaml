placement_rationale: 'Book 1 of Gwynne''s third world, a standalone fiction to date (Orbit UK hardcover 9780356527864, on
  sale 2026-11-03 - released today per the publisher''s own page). Fantasy Kievan Rus, 942 CE (chapter 1 dateline, Polygon''s
  exclusive excerpt): Ingvar Ruriksson claims his dead father''s sword and a war between two rival princes brews; Ivan tries
  to protect his family while his daughter Halia escapes her body in dreams and communes with wolves and the fae - rusalka,
  domovoi, upir, leshen, striga - and must master her powers (polygon.com/wolves-of-war-fantasy-book-excerpt; polygon.com
  most-anticipated November 2026). Root-down: real earth (dated Kievan Rus, Rurikids) > historical > period > antique times
  > dark age. Era gate decides the leaf: medieval-fantasy reads ''roughly the 11th to the 15th century'' with the Church on
  stage - 942 CE pre-Christian Rus fails it; viking-fantasy covers ''medieval Scandinavian societies, seafaring, raiding,
  dynastic struggle AND THEIR NEIGHBORING CULTURES, whether or not mythic elements also appear'' - Rurikid Norse-Rus dynastic
  war with Slavic folklore texture fits exactly. medieval-folklore''s Winternight tenant (14th-c. Rus, same rusalka/domovoi
  register) noted as the alternative; the folklore engine is admitted by viking-fantasy''s own gate. First published 2026.'

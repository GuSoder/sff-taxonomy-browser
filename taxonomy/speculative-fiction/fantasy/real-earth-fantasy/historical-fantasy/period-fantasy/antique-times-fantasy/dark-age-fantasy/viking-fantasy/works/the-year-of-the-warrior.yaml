placement_rationale: 'Lars Walker''s The Year of the Warrior (2000, Books 1-2 of the Saga of Erling Skjalgsson, incorporating
  Erling''s Word; Baen, larswalker.com, VOYA quoted): in Viking-age Norway the slave Aillil of Ireland, captured in a raid,
  must pose as a priest for Erling Skjalgsson, Norway''s first Christian lord, and convert a fiercely pagan people whose gods
  are ''all too real''; the fight runs against men and against ''sendings'' from the other gods. Walk: Real-earth fantasy
  > Historical fantasy > Period fantasy > Antique times fantasy > Dark age fantasy > Viking fantasy (Viking Age society, conversion, raiding,
  dynastic feud, with real magic). Other Erling books are not in the queue. Sources: Baen, larswalker.com; not read.'

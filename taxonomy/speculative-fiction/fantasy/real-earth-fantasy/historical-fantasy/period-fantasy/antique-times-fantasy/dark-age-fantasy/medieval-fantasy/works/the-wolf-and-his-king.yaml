placement_rationale: 'Root-down walk 2026-10-16: Speculative fiction -> Fantasy -> Real earth fantasy
  (the courts and forests of medieval Britain, per the author''s page) -> Historical fantasy (a
  retelling of Bisclavret from the lais of Marie de France, twelfth-century milieu; Gollancz, Nov
  2025) -> Period fantasy -> Antique times fantasy -> Dark age fantasy -> Medieval fantasy: feudal
  courts, a king''s fealty, a baron kept from court. The werewolf curse is the book''s engine, but
  its stage is medieval Britain, not the present day. Sources: finnlongman.com, Hachette/Gollancz.'


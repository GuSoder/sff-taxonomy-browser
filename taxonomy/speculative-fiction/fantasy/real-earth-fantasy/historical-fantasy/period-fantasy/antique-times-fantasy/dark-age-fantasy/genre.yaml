definition: Umbrella for Antique times fantasy of the Middle Ages broadly, from post-Roman Britain and the
  Viking north through the feudal kingdoms and the plague years: Celtic, Viking, Medieval, Andalusian and
  Plague fantasy. "Dark age" is used in the loose popular sense of the whole medieval era, not the historians'
  narrower fifth-to-tenth-century Dark Ages.

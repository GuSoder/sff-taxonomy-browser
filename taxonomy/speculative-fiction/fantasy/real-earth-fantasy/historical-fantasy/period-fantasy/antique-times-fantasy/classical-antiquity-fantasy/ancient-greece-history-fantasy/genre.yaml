definition: Historical fantasy in the ancient Greek world, from its city-states and Sparta through Macedon and the Hellenistic
  kingdoms, where actual gods, seers or magic act inside the documented era. Greek and Macedonian people may act across the
  wider eastern Mediterranean and Alexander's empire when that historical sphere governs the fiction. Not Roman fantasy (Rome
  and its imperial society), not Greek myth fantasy (the inherited heroic age or divine stories themselves), not Secret history
  (secrecy and hidden magical explanation as the main theme), and not a generic remainder for any ancient setting or Greek
  god.

definition: Umbrella for Period fantasy set before the Western industrial age (before 1788), spanning the post-Roman, Viking,
  medieval, Renaissance, Andalusian and Rococo historical stages, and Japan's Edo period (1603-1868), which sits here because
  Japan's own industrial age began with the Meiji Restoration in 1868. The 1788 start of Industrial age fantasy is the Western
  date, so Edo books after 1788 stay in Edo fantasy.
status: umbrella
ruling: Created by the curator's 2026-09-21 Period fantasy ruling; Rococo remains here because The Kingdom of Back is set
  around 1765.

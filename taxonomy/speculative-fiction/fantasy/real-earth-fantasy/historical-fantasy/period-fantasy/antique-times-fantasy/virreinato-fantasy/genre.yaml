definition: 'Fantasy set in the Spanish viceroyalties of the Americas, the colonial centuries from
  the fall of Mexico (1521) to independence (1821): silver cities and mine country, viceroys''
  courts, missions and haciendas, with magic in it. Virreinato is Spanish for viceroyalty. A
  regional era shelf: it overlaps Europe''s late Renaissance and Rococo centuries and the Mughal
  shelf in years, separated by region, not by date.'

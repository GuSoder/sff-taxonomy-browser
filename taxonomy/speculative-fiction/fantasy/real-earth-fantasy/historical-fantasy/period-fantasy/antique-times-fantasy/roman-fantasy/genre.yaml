definition: 'Fantasy set in ancient Rome or a Rome-like empire where classical myth and magic are real: senators, legions,
  sibyls and gods act inside the imperial city and its provinces. Not Roman myth fantasy (that retells the founding myths
  and early heroes of Rome), and not Period fantasy for a documented era whose magic stays hidden.'

placement_rationale: 'Drake''s Books of the Elements (Tor, four novels, 2010-2015; david-drake.com): The Legions of Fire (2010)
  and Air and Darkness (2015) are in the queue; Out of the Waters (2011) and Monsters of the Earth (2013) are not. The series
  is set in Carce, an invented city and empire closely modelled on Rome under Tiberius, where classical myth and magic are
  real: the Sibylline Books and the Cumean Sibyl are real, and the first book mixes them with Norse myth, the later ones with
  Native American, African and Indian myth, each paired with an element and a direction. Drake himself says it is not a novel
  about Rome and not historical fiction. One shared universe, so one fiction (11j). Walk: Speculative fiction > Fantasy >
  Fantasy realms/Real-earth fantasy > Historical fantasy > Period fantasy > Antique times fantasy > Roman fantasy (seeded
  2026-10-11, curator ''Approved'' phonemsg-01M4NXXF2BJHZJD9BRDJXWRY3Q). Rejected: Roman myth fantasy (it retells the founding
  myths, which these books do not), Medieval fantasy (14th-century Europe), Mythological fantasy and Mythic retelling (the
  myths are the world''s working magic, not a retold story), Alternate history fantasy (Carce is not a changed Rome). Wobble
  moderate: the empire is Rome-like, not Rome. Queue years: Legions 2010, Air and Darkness 2015. Queue ids MC02285, MC02233.
  Jacket: Tor hardcover of The Legions of Fire (author site).'

placement_rationale: 'E. C. Ambrose''s Dark Apostle series (Elisha Barber, Elisha Magus, Elisha Rex, and the prequel tale
  The Burning) is a magical reimagining of 14th-century England: a barber-surgeon who is also a necromancer moves through

placement_rationale: 'Katherine Arden''s Winternight Trilogy (The Bear and the Nightingale, The Girl in the Tower, The Winter
  of the Witch; Del Rey): fourteenth-century Rus, from a northern forest village to Moscow and the court of the Grand Prince
  Dmitrii, where Vasya, who sees the old household spirits, is caught between the old folk gods and a rising Church, and between
  the princes of Rus and the Tatar lords. Root-down: Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy
  -> Antique times fantasy; medieval kingdoms at their height and approaching rupture, in the same century as The Dark Apostle,
  so Autumn kingdoms.'

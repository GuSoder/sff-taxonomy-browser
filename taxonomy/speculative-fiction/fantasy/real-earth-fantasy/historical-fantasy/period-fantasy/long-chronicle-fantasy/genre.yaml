definition: 'Long fantasy chronicles: one person, family or place followed across several Period fantasy eras, from the Renaissance
  to the modern line, where the long span is the point and no single-era leaf or era band is honest. Magic-agnostic: the span
  defines the leaf, not a required supernatural mode. Not the single-era Period leaves, not Industrial fantasy chronicles
  (the 1788-onward straddle), not Electric fantasy chronicles (after 1900), not Contemporary magical realism (the author''s
  present).'

placement_rationale: 'Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy > Long chronicle
  fantasy. Speculative fiction is established by real ritual magic, reincarnation, supernatural intervention and the Atlantean
  priesthood, not unverified supernatural advertising alone. Fantasy, not SF: the completed occult criticism and historical
  creator accounts describe genuine spiritual powers and reincarnation, not a technological or psychological explanation.
  Do not import SF''s Reincarnation fiction merely because the mechanism word matches.


  Fantasy > Real earth fantasy, not Fantasy realms: the named Britain, Roman and Arthurian history and modern American settings
  are our Earth; Atlantis is that Earth''s imagined prehistory. Not Portal fantasy: other planes and magical states occur,
  but the whole reading engine is recurrent souls and a continuing Earth-rooted tradition, not Earth/otherworld exchange.
  The modern occult novels alone have Gothic/occult machinery, but whole-world scope controls.


  Real earth > Historical fantasy, not Contemporary or Future: the substantial ancient-to-Arthurian half cannot honestly be
  called present-day. Seven modern occult novels do not constitute a single framing narration enclosing all historical books.
  The world''s substantial long arc begins in Atlantis and continues through Britain to modern America. Future has no substantial
  future-era narrative.


  Historical > Period fantasy > Long chronicle fantasy. No single-era band is honest: imagined prehistory, Bronze Age Britain,
  Roman Britain, Arthurian Britain and contemporary America. The priestly tradition, recurring souls, initiation, abuse of
  occult power and spiritual atonement persist through the sequence. Industrial chronicles requires an industrial-age start;
  Electric chronicles requires the substantial span after1900. Neither is true. Antique times alone excludes the modern books.


  Historical alternatives tested: Mythic retelling/Arthur reimagined fits Mists and the Arthurian part, not the Atlantis and
  seven modern occult novels. Other myth-root children do not supply a universal reincarnation shelf. Secret history/Occult
  cabals has real occult organizations and history overlays, but hidden explanation of documented history is not the whole-world
  engine, and Atlantis''s events are not that sort of historical concealment. Alternate history fails an openly divergent
  historical timeline as defining spine. Not a choice made to preserve an old placement or fill a leaf.


  Contemporary counterfactual: Occult orders is a strong fit for the modern seven, Gothic occult horror is relevant to their
  menace, and modern mythic powers are relevant. Each fails the substantial ancient and historical books. No supernatural-kind
  branch overrides its contemporary ancestor merely because reincarnation is supernatural. Historical Arthur reimagined likewise
  fails the modern books and most pre-Arthurian material.


  ## Definition wobble and precedent

  Long chronicle''s own sentence says Renaissance to modern. Its accepted Numinous World tenant explicitly begins with Troy/Egypt/Alexander
  and continues through Napoleon, using the same reincarnating-soul device. Industrial chronicles'' sibling exclusion assigns
  substantial spans beginning before industrialization to Long chronicle. Vampire Chronicles also has antiquity-to-modern
  reach. Applying that already-used span gate is an ordinary whole-fiction placement, not a silent definition widening. No
  gate text is changed. Confidence moderate because this is a broad connected world, not one continuously narrated novel;
  the original-world grouping is mandatory.


  ## Scope and evidence quality

  The Light bridge is content-based: completed Heartlight essay identifies Colin as Atlantis''s Riveda, with climax passage
  citation. Independent Ghostlight criticism supports Domaris/Viviane continuity but retains some interpretive uncertainty.
  Creator Paxson explicitly identifies Ancestors as Atlantis''s direct sequel. ISFDB''s seven-occult nesting and Edith Crowe''s
  completed review connect the earlier occult novels. This is stronger than visual resemblance, author brand or shared occult
  motifs. No primary full corpus read; exact modern reincarnation evidence is completed secondary criticism, not represented
  as direct primary reading. An unsourced fan denial claim is preserved in the ledger but does not outweigh actual cited content
  plus creator sequel evidence.


  First-publication conflicts: Witch Hill1990, not an unpublished earlier draft; Ghostlight1995, not a spurious1986 catalog
  record; Web Light1983 and Darkness1984, not later reissue dates or1983copyright for the latter. Current publisher ordinal
  labels for the Web volumes are reversed, so original bibliography controls. Four Light novels jointly credited to Rosemary
  Edghill by current publisher, Avalon collaborations/Paxson-authored continuations verified by Paxson''s bibliography.'

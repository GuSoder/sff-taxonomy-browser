placement_rationale: 'One concealed witch family followed across several period eras: five generations of Orchiere women pass
  the craft mother to daughter from 1821 Romani France to WWII London, and the prequel The Great Witch of Brittany reaches
  back to Ursule Orchiere in the late 1700s (''return to the world of A Secret History of Witches'', same bloodline - one
  card). The long generational span is the point, and no single-era leaf is honest, so the long chronicle leaf rather than
  a period band; not arcane peoples (a family line, not a hidden nonhuman people).'

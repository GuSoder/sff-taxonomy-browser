placement_rationale: 'Jo Graham''s Numinous World (ISFDB series 35464, tagged historical fantasy; rule 11j one fiction incl.
  the Elza Versfelt sub-series: 6 novels 2008-2018; the 2011 collection The Ravens of Falkenau is short fiction, excluded).
  One soul recurs across lifetimes - the Aeneid''s fall of Troy (Black Ships, a Sybil''s telling), Ptolemaic Egypt (Hand of
  Isis), Alexander''s successors (Stealing Fire), then Elza through the Napoleonic wars (The General''s Mistress, The Emperor''s
  Agent, The Marshal''s Lover). The series is one person followed across several Period fantasy eras - classical antiquity
  to the Napoleonic line - where the long span is the point and no single-era leaf is honest: the Long chronicle fantasy gate
  exact (Orlando, Addie LaRue, Vampire Chronicles shape). The chronicle family''s own accepted boundary includes it: ''not
  Long chronicle fantasy (the substantial span begins before the industrial age)'' (Industrial fantasy chronicles Not-line)
  - this span begins c.1200 BC. Wobble disclosed: the leaf''s own def phrases its band ''from the Renaissance to the modern
  line'', but its accepted sibling Not-line and the Vampire Chronicles tenant (antiquity to modern) read the operative test
  as pre-industrial start plus multi-era span, which this fiction meets exactly. Not reincarnation-fiction: mechanism matches
  (reincarnation as the linking device) but that leaf sits under science-fiction > atemporal-sf and this is fantasy - gods,
  oracles and visions are real powers (ISFDB ''historical fantasy''); the SF/fantasy root line controls. Not classical-antiquity-fantasy
  (3 of 6 novels; whole fiction includes the Napoleonic Elza arc), not mythic-retelling (only Black Ships retells a myth),
  not secret-history (the divine machinery is open, not a hidden cabal).'

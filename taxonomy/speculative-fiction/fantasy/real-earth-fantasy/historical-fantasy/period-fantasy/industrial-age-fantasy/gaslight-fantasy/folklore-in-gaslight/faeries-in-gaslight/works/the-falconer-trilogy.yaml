placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Historical fantasy > Period fantasy
  > Industrial-age fantasy > Faeries in gaslight. One series (The Falconer Trilogy per the author''s site and Chronicle),
  one fiction. Per the author''s page and Chronicle: Edinburgh 1844, where Aileana Kameron hunts the Sithichean, a faery race
  that slaughters humans, while a secret war between humans and fae runs beneath the city. Faeries crossing into nineteenth-century
  life is the Faeries in gaslight definition. Rejected: Gaslight technomancy (the fae, not engineered magic, are the subject),
  Fae founders (modern city, not gaslight). Wobble: books two and three move to an Edinburgh remade after the fae breach,
  so the gaslight frame thins; the series stays together as one shared story. Years follow the Chronicle US releases (2014,
  2016, 2017); a 2013 UK first edition may exist and is unverified.'

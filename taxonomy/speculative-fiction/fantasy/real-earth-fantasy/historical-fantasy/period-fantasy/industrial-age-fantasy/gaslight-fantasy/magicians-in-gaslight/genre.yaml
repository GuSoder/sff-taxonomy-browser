definition: Gaslight-era fantasy in which magicians - practitioners, councils, guilds, schools and lineages - share the era
  with ordinary people, and the magic is a craft, an inheritance or a resource they govern, hoard or lose, with the institutions
  of magic as the stage for power, marginalisation and coming of age. The long nineteenth century runs through the Edwardian
  years to 1914. Not Gaslight technomancy, where magic is engineered as science or machinery; not Mythology in gaslight, where
  ancient sacred myths are revived; not Folklore in gaslight, where fairies, creature-lore or wonder-tale beings enter historical
  life; not Secret history, where documented history is secretly explained by a hidden magic.
status: provisional
ruling: Seeded on the intake's own judgment under the curator's standing autonomy (phonemsg-01M4K42F3EQDEGCNTQ1T3FWS29, phonemsg-01M4K45A5DFAAFXQS8P7XSPGT3,
  2026-10-10) for H. G. Parry, The Magician's Daughter (set in 1912). Named by the pattern of its siblings (Faeries in gaslight,
  Monsters in gaslight, Circus in gaslight) with the established word magicians (the Strange and Norrell tradition).

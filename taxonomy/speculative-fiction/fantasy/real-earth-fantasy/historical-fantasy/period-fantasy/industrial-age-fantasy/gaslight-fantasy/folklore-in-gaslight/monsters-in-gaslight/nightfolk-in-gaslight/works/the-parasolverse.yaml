placement_rationale: 'One shared universe (rule 11j) across three linked series: The Parasol Protectorate (Soulless, Changeless,
  Blameless, Heartless), the Finishing School books (Etiquette & Espionage, Curtsies & Conspiracies, Waistcoats & Weaponry,
  Manners & Mutiny) and The Custard Protocol (Prudence, Imprudence, Competence, Reticence). Vampires, werewolves and a soulless
  preternatural live openly in Victorian London society, so the life and law of these nonhuman folk beside humans is the story.
  Walked root-down: Fantasy -> Real-earth fantasy -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight
  fantasy -> Folklore in gaslight -> Monsters in gaslight -> Nightfolk in gaslight.'

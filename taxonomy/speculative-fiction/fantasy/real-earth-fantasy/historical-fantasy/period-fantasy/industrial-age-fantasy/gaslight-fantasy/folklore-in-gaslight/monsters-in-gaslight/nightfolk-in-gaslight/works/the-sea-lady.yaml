placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Historical fantasy > Period fantasy
  > Gaslight fantasy > Monsters in gaslight > Nightfolk in gaslight. H. G. Wells, The Sea Lady (serialized in Pearson''s Magazine
  July-December 1901, Methuen 1902; the queue year 2013 is the Baen ebook reissue): a mermaid comes ashore at Folkestone in
  1899 during a family bathing party and asks to live among them as an ordinary mortal under the name Miss Doris Thalassia
  Waters, in pursuit of Harry Chatteris, the young man engaged to the earnest Adeline Glendower, whom she persuades to come
  away to the sea with the promise of better dreams (Wikipedia https://en.wikipedia.org/wiki/The_Sea_Lady; Oxford Reference
  https://www.oxfordreference.com/viewbydoi/10.1093/acref/9780198117605.013.1042; text on Gutenberg https://www.gutenberg.org/files/35920/35920-h/35920-h.htm;
  Baen https://www.baen.com/the-sea-lady.html). A nonhuman being living openly among people in the parlour and the seaside
  town is the Nightfolk in gaslight definition (the story is her life and the manners around her). Rejected: Elder things
  in gaslight (sea beings that stay outside human company, here she moves into the drawing room), Shapeshifters (her tail
  is a body she keeps, the shift is not the story), Faeries in gaslight, Mythology in gaslight, Magicians in gaslight, and
  Earthly comic fantasy (it is satirical, but the genre frame is the era). Wobble: low to moderate. It is a comic social satire
  first, and Nightfolk''s own examples are darker. The cover is the Baen ebook jacket, a small square image. Nightfolk is
  at 6 and takes this as the seventh card.'

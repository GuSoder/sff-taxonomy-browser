first_published: 2024
canonical_genre: wwii-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> WWII fantasy.
  Four British sisters inherit second sight; WWII Resistance missions and Nazi pursuit of the Bayeux Tapestry form the magic-bearing historical stage. Locus explicitly
  distinguishes family clairvoyance fantasy from psionic SF. No altered-history fork or scientific time travel: visions and an empowering artifact, not era crossing.
  Family relation is important but contemporary Domestic fantasy fails the wartime historical gate.'

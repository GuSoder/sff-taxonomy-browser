placement_rationale: W. M. Akers' Gilda Carr novels (Westside, Westside Saints, Westside Lights) are set in an alternate 1921
  Manhattan split by a fence, where a private eye solves 'tiny mysteries' through the supernatural. The Jazz Age city is the
  stage and the detective frame is its mode; the setting is the American 1900-1929 city, so Bowler hat fantasy is the home,
  not the invented-world Fantasy mystery.

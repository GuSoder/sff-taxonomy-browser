  Civil rights era fantasy leaf seeded for it by the Electrified fantasy era bundle (curator "Approved", phonemsg-01M4XV5ER7821A9GST2QMAS8KY) - the 1950 civil-rights-era
  setting is the stage, the haunting the supernatural engine.

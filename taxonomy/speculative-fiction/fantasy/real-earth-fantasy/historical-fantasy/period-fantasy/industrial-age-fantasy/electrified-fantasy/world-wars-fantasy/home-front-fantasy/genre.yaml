definition: 'Electrified fantasy of the war years felt from the streets of home: the draft, letters to soldiers, memorial services, surrender announced in the street. The war presses on every page without a battlefield in sight, and the supernatural walks the hometown. Not WWII fantasy (the war or its machinery as the stage), not Diesel age fantasy (the interwar decades), not Noir fantasy (the city crime story).'

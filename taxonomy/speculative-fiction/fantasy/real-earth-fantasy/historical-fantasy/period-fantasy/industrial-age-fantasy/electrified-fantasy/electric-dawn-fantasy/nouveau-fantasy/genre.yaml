definition: 'Urban, artistic and hopeful fantasy of the Art Nouveau years, roughly 1890-1914: the new modern city, its salons,
  stages, workshops and exhibitions, with a turn-of-the-century sense of optimism and wonder where Gaslight fantasy holds
  dread. Any city, any craft or art. Not Gaslight fantasy (the dread and the long nineteenth century), not Bowler hat fantasy
  (American, rural or immigrant life, not the artistic city), not Gatsby fantasy (the Jazz Age).'

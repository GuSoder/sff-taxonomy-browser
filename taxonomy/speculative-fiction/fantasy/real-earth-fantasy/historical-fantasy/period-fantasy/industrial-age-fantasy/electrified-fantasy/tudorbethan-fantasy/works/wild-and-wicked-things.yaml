placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy
  > Industrial age fantasy > Tudorbethan fantasy. Standalone (Orbit UK, 9 Feb 2023; Redhook US), one fiction. Per Strange
  Horizons, Reactor and BookPage: an alternate 1920s England just after the First World War, where magic exists but is mostly
  illegal, and Annie goes to Crow Island and into a decadent coven (a sapphic Great Gatsby retelling with blood magic). Real
  Earth (England, post-1918) is the stage, not an invented world, and the era and place define the leaf: Tudorbethan fantasy
  is interwar English fantasy, roughly 1918-1939, magic-agnostic. Rejected: Alt diesel fantasy (magic is hidden and illegal,
  history is not openly rewritten and the world does not run on magic), WWI fantasy (the war is over and offstage), Noir fantasy
  (1930s-40s hardboiled crime era). Wobble: Alt diesel fantasy is the second reading because the sources call it alternate
  history.'

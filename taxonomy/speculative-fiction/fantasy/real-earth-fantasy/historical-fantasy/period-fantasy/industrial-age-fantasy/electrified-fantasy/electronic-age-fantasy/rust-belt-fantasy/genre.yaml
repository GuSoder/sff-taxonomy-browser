definition: 'Electronic age fantasy of the postwar decades'' decaying old order: the grand house, company town,
  institution or bloodline whose time has passed, rotting on its foundations, and the haunting that comes with the
  rot - ghosts, monsters or the past itself reaching for the living. Any postwar setting, any old order; the decay
  and its haunting are the engine. Not Civil rights era fantasy (the fight against the color line is the stage,
  not decay), not Postcolonial fantasy (the end of empire as emergence, not rot), not Neon fantasy (the 1980s''
  bright surface).'
status: accepted
ruling: 'Seeded under Electronic age fantasy, curator "Approved, make the def broad" (phonemsg-01M4ZZFR6QFD58DXSE39R3G4MP,
  2026-10-15 ~4:29 PM CEST); the def is broad on his instruction (any postwar decaying old order, not only industry
  or the US). Name carries era and content together after his rejections: Atomic age, Cold War (era frame, not the
  books), Mid-century ("Lame name"), Bad blood (books, no era), Motel (era image, fits neither book). Ceiling kin
  walked, not moved: The Reformatory (1950 Florida, segregated reform school and its dead) - his call to bring it
  home. Born with Mexican Gothic (from Eldritch fungi).'

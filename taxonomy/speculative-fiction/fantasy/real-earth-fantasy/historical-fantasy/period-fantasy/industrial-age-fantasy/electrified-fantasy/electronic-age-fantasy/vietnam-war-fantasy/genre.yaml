definition: 'Fantasy set in the Vietnam War era and its aftermath, the Second Indochina War years
  of the 1960s and 1970s and the war''s long shadow after: the jungles and rivers of Vietnam, Laos
  and Cambodia, the war at home and the war carried home, with magic or the supernatural in it.
  Not US-only: the shelf belongs to the whole war and everyone it touched.'

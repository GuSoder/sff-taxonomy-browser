placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Bowler
  hat fantasy. Sacha Lamb''s2022 novel follows Uriel the angel and Little Ash the sheyd from a Jewish shtetl in the Pale of Settlement to America seeking missing
  Essie, with Rose joining their transatlantic journey. Ellis Island medical barriers, immigrant New York, garment factories and labor organizing provide the historical
  stage; literal ghosts and dybbuks bring Ashkenazi supernatural lore into it. Early twentieth century explicitly supported by Horn Book and Sydney Taylor review,
  not an exact pinned calendar year; do not infer1900s/1910s merely from Ellis Island/steamship furniture. Bowler hat''s current1900-1929 American civilian/urban-life
  definition fits; European departure is a noted geographical bend, but American immigration/community is central. Gaslight > Folklore > Monsters in gaslight is a
  close supernatural-mode alternate but its strict nineteenth-century wording fails the documented early20th setting; existing1908/1912 shelf precedents do not silently
  loosen the gate. No independent universe/portal, scientific mechanism, history fork or secret explanation of known events. Not biblical named-story retelling or
  Epic/Mythic power struggle: angel/demon partners aid immigrants rather than wage cosmic conflict. Warm/wry queer folklore adventure, not Nocturne menace or attaching
  demonic torment. Accepted-as-ordinary magic and comedy describe tone, not the stronger historical migration engine. Curator asked what dates Bowler hat, was told
  no exact year and two independent sources explicitly early20th, then instructed Execute on2026-09-30.'

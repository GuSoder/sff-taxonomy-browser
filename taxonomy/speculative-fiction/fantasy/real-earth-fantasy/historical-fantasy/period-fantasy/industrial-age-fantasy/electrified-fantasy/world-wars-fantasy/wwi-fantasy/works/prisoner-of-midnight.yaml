placement_rationale: 'Root-down walk 2026-10-15: Speculative fiction -> Fantasy -> Real earth fantasy
  -> Historical fantasy (set March 1917, written 2019; the war is the engine: every government in the
  Great War wants a vampire as a weapon, and Lydia Asher sails in pursuit across the Atlantic) ->
  Period fantasy -> Industrial age fantasy -> Electrified fantasy -> World wars fantasy -> WWI
  fantasy, beside Dry Land and The Warm Hands of Ghosts. The James Asher novels as one fiction: eight
  volumes 1988-2019, from Those Who Hunt the Night to Prisoner of Midnight; the move carries the
  series card. Sources: Severn House (publisher), FictionDB (series order).'


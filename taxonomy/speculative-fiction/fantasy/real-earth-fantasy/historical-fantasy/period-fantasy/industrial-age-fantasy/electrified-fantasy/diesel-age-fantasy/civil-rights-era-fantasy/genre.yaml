ruling: 'Seeded under Electronic age fantasy for The Reformatory (1950 Florida; Tananarive Due) by the Electrified fantasy era bundle, approved by the curator''s "Approved" (phonemsg-01M4XV5ER7821A9GST2QMAS8KY, 2026-10-14 8:35 PM CEST) on the served Electrified fantasy era block Electric dawn / World wars / Diesel age / Electronic age / Electric chronicles. Name settled by the curator: Duck-and-cover fantasy served first ("book is not about the bomb", phonemsg-01M4XTZER44N2ET86DHQTF51B7), Jim Crow era fantasy served second and rejected ("I don''t want Jim Crow anywhere, it''s an ugly name", phonemsg-01M4XV0V2D13J061232MJZ2X06), Civil rights era fantasy settled (phonemsg-01M4XV354N5AXPZHB0ZRJYQMVA). Definition scoped postwar-years-to-1968 so a 1950 book sits honestly inside the Electronic age band.'

definition: 'Diesel-age fantasy of the American civil rights era, the postwar years to 1968: segregation and the fight against it, the color line, church basements and courthouse steps as the stage for the supernatural. The leaf takes books where that setting is the stage - not every American story of those years is a civil rights story. Not Depression era fantasy (the 1930s hard-times stage), not Contemporary fantasy (the author''s present).'

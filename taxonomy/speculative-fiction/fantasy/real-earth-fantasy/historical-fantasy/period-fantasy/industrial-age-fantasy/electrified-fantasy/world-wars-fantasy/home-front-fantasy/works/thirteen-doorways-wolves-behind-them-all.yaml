placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Electrified fantasy -> World wars fantasy -> Home front fantasy. Chicago 1941-46 (Common Sense Media, NPR): Pearl Harbor is the pivot, Sam is drafted at 18, Vito fights in Italy, letters to soldiers, a memorial service, V-E Day in the street - the war felt from the streets of home, never the stage; the ghosts Pearl and Marguerite walk the hometown.'

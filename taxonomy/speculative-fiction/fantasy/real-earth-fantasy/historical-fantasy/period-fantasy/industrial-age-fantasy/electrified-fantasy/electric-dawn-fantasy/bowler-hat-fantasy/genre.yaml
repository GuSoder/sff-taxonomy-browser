definition: 'American historical fantasy of the early twentieth century, roughly 1900-1929, before the Depression: from the
  last land claims of the frontier to immigrant and small-town America. Any American region and civilian or home-front setting
  may fit; magic or the supernatural enters that period stage. The name evokes the era, not a required hat in the story. The
  years read as a cultural/technological register, not strict dates: a really rural setting where the diesel age has not yet
  spread can stay Bowler hat past 1929 (the curator, phonemsg-01M54NA7AHRP9Z6XHS2C6E5CGK, 2026-10-17). The Great War leaf
  takes works whose engine is the war or its social machinery; Weird West takes the nineteenth-century frontier, and Dust
  Bowl takes Depression-era Plains and Southwest. The Jazz Age city goes to Gatsby fantasy; the urban, artistic, hopeful turn-of-the-century
  city goes to Nouveau fantasy.'
status: accepted

placement_rationale: 'Root-down: Fantasy -> Real earth fantasy -> Historical -> Period -> Industrial age -> WWI fantasy. Laura returns to the Western Front seeking
  her brother after the 1917 Halifax explosion; Freddie and a German soldier escape the trenches into a devil''s timeless hotel. Real ghosts and devil magic work
  inside the documented Great War stage. Not a rewritten historical fork, an occult explanation for known history or present-day war haunting; period anchoring governs
  over the deal-with-the-devil furniture.'

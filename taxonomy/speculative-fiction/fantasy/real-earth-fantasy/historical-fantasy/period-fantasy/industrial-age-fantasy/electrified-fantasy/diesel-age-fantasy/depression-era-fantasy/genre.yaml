image: 692-depression-era-fantasy.webp
definition: 'Fantasy set in the United States of the 1930s, the Great Depression years: drought and dust on the Plains and Southwest, itinerant spectacle, hard-times towns, federal works and Authority dams, and the segregated South of the era. The decade and the country define the leaf, not a required supernatural mode. Not Noir fantasy (the city crime story) and not Wartime fantasy (the Second World War, 1939 on).'
status: accepted
ruling: Created by the curator's 2026-09-21 Period fantasy ruling; simplified from Dust Bowl Carnivalesque so the leaf is
  not limited to carnival stories.

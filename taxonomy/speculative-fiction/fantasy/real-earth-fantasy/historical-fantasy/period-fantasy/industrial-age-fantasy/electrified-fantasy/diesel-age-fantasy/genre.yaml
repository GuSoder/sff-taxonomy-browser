  leaf stays clean. The era split reads as a cultural/technological axis, not strict dates: really rural interwar settings
  the diesel age has not yet reached stay Bowler hat (the curator, phonemsg-01M54NA7AHRP9Z6XHS2C6E5CGK, 2026-10-17).'

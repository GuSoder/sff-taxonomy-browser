definition: 'Umbrella for Electrified fantasy of the diesel age, roughly 1918 to the end of the 1960s - the interwar decades and the postwar years before the seventies: Tudorbethan England, Depression-era America and the noir city, the civil rights years and the decolonizing world. The war years themselves sit in World wars fantasy; Noir fantasy runs on into the 1940s, parked here so the wartime leaf stays clean. Not Electronic age fantasy (the 1970s on).'

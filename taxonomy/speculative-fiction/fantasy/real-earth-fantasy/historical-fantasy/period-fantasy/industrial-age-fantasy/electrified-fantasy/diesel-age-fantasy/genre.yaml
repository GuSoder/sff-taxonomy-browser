ruling: 'Created by the Electrified fantasy era bundle, approved by the curator''s "Approved" (phonemsg-01M4XV5ER7821A9GST2QMAS8KY, 2026-10-14 8:35 PM CEST) on the served Electrified fantasy era block Electric dawn / World wars / Diesel age / Electronic age / Electric chronicles. Era words are the curator''s own: Diesel age defined as interwar 1918-39 (phonemsg-01M4XTMY84APARXF6Z5Y5M5FN9), Electronic age informally the postwar decades (phonemsg-01M4XTQNYZ9FYZFXB76DA5VY18). The curator: "our more evocative word for interwar, but technically we can define it as interwar" (phonemsg-01M4XTMY84APARXF6Z5Y5M5FN9). Noir''s 1940s edge is parked here by the block.'

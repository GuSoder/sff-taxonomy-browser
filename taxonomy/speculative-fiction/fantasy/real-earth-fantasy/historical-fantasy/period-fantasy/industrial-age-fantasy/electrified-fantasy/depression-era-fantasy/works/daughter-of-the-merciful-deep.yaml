placement_rationale: 'Root-down walk: set in the real 1935 American South with folkloric African gods and a sunken world,
  so Real earth fantasy; Historical fantasy; Period fantasy; Industrial age fantasy; Electrified fantasy (1900 on); Depression
  era fantasy (the 1930s United States). Sources: Publishers Weekly (''fuses magical realism, folklore, and African American
  history into a profound and rousing fantasy set in 1935 in the American South''; Jane Edwards, who lost her voice after
  armed men forced her family from their home, must save the all-Black town of Awenasa from a dam that threatens to bury it;
  Rob, whom she believed dead, emerges from the waters), Locus (State engineers are building a dam and the town will be flooded
  for a reservoir; Awenasa is modeled on real flooded Black towns such as Oscarville under Lake Lanier), SciFiMind (''the
  depression-era American South at a time when dams were being built by the federal government throughout the Tennessee Valley'';
  the Authority sends bureaucrats to buy or seize the land) and Reddit r/Fantasy (African gods and myth set against the Jim
  Crow South). Wobble: the leaf is held together by decade and country only, with The Circus of Dr. Lao in the Southwest;
  no source says the Depression is felt in the plot beyond the era and the federal dam, and breadlines, Dust Bowl, jazz and
  radio are unconfirmed. Year 2024 (Redhook, 4 June 2024).'

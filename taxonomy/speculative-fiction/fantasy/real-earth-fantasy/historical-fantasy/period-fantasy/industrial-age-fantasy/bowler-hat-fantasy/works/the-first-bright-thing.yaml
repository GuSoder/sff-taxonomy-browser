placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy
  > Industrial age fantasy > Bowler hat fantasy. Ringmaster Rin, who can jump to different moments in time, leads the Circus
  of the Fantasticals, a haven for magical misfits called Sparks, across the American Midwest in the years after World War
  I, while a rival circus with midnight-black tents and a dangerous ringmaster closes in (Tor Publishing Group). Early twentieth-century
  American setting with magic entering a period stage is the leaf''s definition. Rejected: WWI fantasy (the war is the backdrop
  and the shadow, not the engine), Dust bowl fantasy (the setting is before the Depression). Wobble: moderate, since Rin''s
  time-jumping and the coming second war gives it a time-travel side. First published 2023 by Tor (Open Library and Tor).'

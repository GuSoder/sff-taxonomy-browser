placement_rationale: 'Simon & Schuster''s Devil''s West series page lists the trilogy: Silver on the Road (2015, #1),
  The Cold Eye (2017, #2), Red Waters Rising (2018, #3), with Isobel, the Devil''s Left Hand, riding the magical land
  of the Territory. Simon & Schuster and Publishers Weekly place the story in an alternate nineteenth-century North
  America whose western Territory is alive, full of magic and governed by the Devil, with mad magicians, ghosts and
  twisted animal spirits. SFE attests Weird West for fusions of fantasy/horror and classic Western motifs. One trilogy
  in one world, one fiction; card folded from the Red Waters Rising row to the whole trilogy on the shared-universe
  audit of 2026-11-28 (fold authority phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX).'

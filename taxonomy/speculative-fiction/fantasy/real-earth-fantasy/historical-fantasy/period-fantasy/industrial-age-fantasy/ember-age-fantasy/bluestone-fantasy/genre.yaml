definition: 'Ember age fantasy of the Reconstruction years, 1865-1877, the decade after the Civil War: freedpeople making new lives, the wreckage of slavery and war, and the hauntings that will not stay buried as the stage for the supernatural. Named for bluestone, the era''s sidewalk and stoop stone, and for the haunted house at 124 Bluestone Road. Not Antebellum fantasy (the South before the war), not Civil rights era fantasy (the postwar fight for the color line), not Gaslight fantasy (the gaslit aesthetic).'
status: accepted

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy
  > Industrial age fantasy > Gaslight fantasy > Folklore in gaslight > Monsters in gaslight > Nightfolk in gaslight. In an
  alternate 1902 Portuguese Golden City, magical beings have been banned for decades but many live there in secret: Oriana
  Paredes, a sereia (sea folk) spy who was banished, and Duilio Ferreira, a police consultant with a seer''s gift, work against
  a killer who targets women and a missing selkie (Cheney''s series page, publisher copy). The story is the life and law of
  nonhuman folk beside humans in the town, with the ban as the plot''s pressure, which is the leaf''s definition. Rejected:
  Faeries in gaslight (sereia and selkies are sea folk, not the Fair Folk), Shapeshifters in gaslight (the selkie''s change
  is not the engine), Elder things in gaslight (the sea folk live in the city). Wobble: moderate; the ban makes the folk hidden
  rather than open, and 1902 sits at the very end of the long nineteenth century. The queue holds only The Seat of Magic (book
  2 of the Golden City novels, Ace, July 2014); the rest of the series is not in the queue. Queue id MC04005; Dreaming Death
  MC04004 is the separate Palace of Dreams series.'

placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy ->
  Industrial age fantasy -> Ember age fantasy -> Gaslight fantasy -> Gaslight technomancy. Living constellations, Hades and
  Honorine''s magical parentage establish fantasy. The legitimate OverDrive sample''s chapter 2 travel journal names the Azores
  in April 1879, resolving the Earth-root gate; an invented estate does not establish an independent universe. The late-nineteenth-century
  original adventure is not a retold named myth, a hidden explanation of recorded history or a demonstrated alternate-history
  divergence. Not Antebellum, Weird West or colonial Australia. Scientists capture living constellations and harness their
  powers with engineered devices, so Gaslight technomancy fits more specifically than Mythology in gaslight, Folklore, magician
  institutions or Gothic dread. Steam plus magic does not override the Earth root. Whole standalone plot checked through SLJ
  and Kirkus; sample supplies geographic proof. Owner approved move only in phonemsg-01M62568QVA0WD2HJFJVBZ8Y49, 2026-10-28
  22:03 CET, after proposal phonemsg-01M6213K8GTV1QQT18J6FQSW1T. Existing title, year, cover and book list retained without
  metadata repair.'

placement_rationale: 'Leanna Renee Hieber''s Strangely Beautiful series (The Strangely Beautiful Tale of Miss Percy Parker
  2009, reissued as Strangely Beautiful 2016/2020; Perilous Prophecy 2011/2017; Miss Violet and the Great War 2019; PW, author
  site, Tor): Percy Parker, a white-haired orphan who sees ghosts, comes to Athens Academy in Queen Victoria''s London, citadel
  of the Guard, an ancient order of six gifted by a goddess to hold back the restless dead and seek the prophesied seventh;
  later volumes follow the Guard in 1860s Cairo and Violet Rychman in the First World War. Walk: Speculative fiction > Fantasy
  > Real earth fantasy > Historical fantasy > Period fantasy > Industrial age fantasy > Magicians in gaslight (an order, school
  and lineage of gifted people inside the Victorian-Edwardian world). Rejected: Nightfolk in gaslight (the Guard hides among
  people; it is not a folk living openly), Mythology in gaslight (the goddess is the source, not the revived myth that drives
  the story), Gaslight technomancy (no engineered magic), and Ghost speakers (Percy is a seer, but the story is the Guard''s
  order and its mission). Wobble: medium, Ghost speakers. Folded series: one universe, one card. Sources: PW, publisher and
  author site; not read in full.'

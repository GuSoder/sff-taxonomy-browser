placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy (Victorian London) > Historical fantasy (the title volume is set in 1888, written 1992 - Wikipedia) > Period fantasy > Industrial age fantasy > Ember age fantasy > Gaslight fantasy > Gothic in gaslight. Anno Dracula is a take on the Gothic canon itself: Dracula has married Queen Victoria and vampires live openly in the gaslit world, with the canon''s figures walking through it (Wikipedia). That is the leaf''s widened center - takes on the Gothic canon in the era that made them. Rejected: Fangs out fantasy (previous shelf: right on openness, wrong era - nothing in the title volume is set in our time, so it fails the bulk era test); Nightfolk in Gaslight (beings of folklore among people, not the Gothic canon). Wobble: later volumes of the series move into the twentieth century (Wikipedia series bibliography); the shelf follows the title volume and the Gothic-canon identity of the fiction.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy (Hidalgo, Mexico, 1823 - the
  author: two years after the war ended) > Historical fantasy > Period fantasy > Industrial age fantasy > Ember
  age fantasy > Gaslight fantasy > Gothic in gaslight. A haunted hacienda on the Rebecca frame: the first wifes
  murder haunting the house, the new bride no one believes, dread as the engine - the rotting soul of colonialism
  (Shelf Awareness); PW, the Washington Post and NPR all call it Gothic outright. The leaf is Gothic register in
  the era and is not place-limited. Rejected: Inherited ghosts (previous shelf: right on the haunting, wrong era -
  nothing in the book is set in our time, so it fails the bulk era test); Virreinato fantasy (its def ends at
  independence, 1821 - 1823 is independent Mexico).'

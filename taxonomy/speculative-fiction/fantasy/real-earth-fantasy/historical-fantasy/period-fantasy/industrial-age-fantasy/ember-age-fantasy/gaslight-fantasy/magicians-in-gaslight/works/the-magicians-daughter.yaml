placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy
  > Industrial-age fantasy > Gaslight fantasy > Magicians in gaslight (seeded for this book on the intake''s own judgment
  under the curator''s standing autonomy, phonemsg-01M4K42F3EQDEGCNTQ1T3FWS29 and phonemsg-01M4K45A5DFAAFXQS8P7XSPGT3). H.
  G. Parry, The Magician''s Daughter (Orbit UK and Redhook US, 28 February 2023): 1912, sixteen-year-old Biddy has lived on
  Hy-Brasil, an island hidden by magic and open to outsiders once every seven years, with the Irish mage Rowan O''Connell
  and his rabbit-shaped familiar Hutchincroft. Magic began fading from the world seventy years ago and the Magicians'' Council
  in England, which controls magic and magicians across the British Empire, hoards it and forces mages to give up their familiars;
  Rowan, the first Irish mage on the Council, fled rather than sacrifice Hutch. Biddy carries a fragment of magic in her heart,
  goes to London to lure Council magicians, is imprisoned, and at the end magic is restored to the world and the Council''s
  head, Vaughan Carlisle, is overthrown (Liz Bourke, Locus, https://locusmag.com/review/liz-bourke-reviews-the-magicians-daughter-by-h-g-parry/;
  Wikipedia, https://en.wikipedia.org/wiki/The_Magician%27s_Daughter; Publishers Weekly, https://www.publishersweekly.com/9780316383707).
  Source conflict recorded: PW calls the London setting 19th-century, Wikipedia and Locus say 1912; Hachette says early 1900s;
  1912 taken as the date. Rejected: Occult institutions (9, modern-day magic embedded in institutions, wrong era and at the
  gate), Magic school (9, contemporary), Found magic (9, contemporary); Secret history (Arcane peoples, Occult cabals, Untold
  magic: history is not secretly explained by the hidden magic, Bourke notes the book engages none of its 1912 history, and
  public secrecy is not established in the sources); Tudorbethan fantasy (interwar 1918-1939), WWI fantasy (1914-1918), Bowler
  hat fantasy (American); Gaslight technomancy (the magic is not engineered), Mythology in gaslight (no revived sacred myth),
  Faeries in gaslight (no Fair Folk are central, though Hy-Brasil, a puca and familiars give it folkloric flavour), Monsters
  in gaslight (shapeshifting raven and rabbit familiar are texture, not the subject), Circus in gaslight. 1912 sits inside
  the long nineteenth century through 1914, so the seed widens the Gaslight umbrella line to the Edwardian years. Wobble:
  moderate; the book is also a Bildungsroman with folklore texture, and Faeries in gaslight (6) was the runner-up.'

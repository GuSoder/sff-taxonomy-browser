id: the-city-beautiful
title: The City Beautiful
authors:
- Aden Polydoros
first_published: 2021
canonical_genre: gothic-in-gaslight
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy (Chicago, 1893, the Worlds Fair)
  > Historical fantasy (set 1893 - the authors site) > Period fantasy > Industrial age fantasy > Ember age fantasy
  > Gaslight fantasy > Gothic in gaslight. Alter Rosen is possessed by the dybbuk of his murdered friend Yakov,
  bound to him by grief, love and revenge until the killer is exposed (authors site; Jewish Book Council). Gothic
  by register: haunting, dread and the uncanny, the past literally reaching for the living. Rejected: Vengeful
  spirits (previous shelf: right on the dybbuk, wrong era - nothing in the book is set in our time, so it fails
  the bulk era test); Monsters in Gaslight (the dybbuk is not creature-lore loose in the world - a Gothic-register
  haunting belongs here).'
classification_sources:

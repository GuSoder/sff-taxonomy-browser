canonical_genre: weird-west-fantasy
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Ember age
  fantasy -> Weird West fantasy. 1876 Wyoming: disgraced cavalry captain Jonas Hollister, sprung from Leavenworth by Allan Pinkerton, hunts the blood-drinking
  creatures that massacred his platoon, aided by Shania of the Archaics, an ancient pre-human race (author interview: "Hell On Wheels meets The X-Files"; Harper
  Voyager). The documented post-Civil War American frontier remade through monsters: Weird West, in the leaf''s vampire-western line with The Buffalo Hunter Hunter
  and Vampires of El Norte. Real earth over Fantasy realms/Portal (documented Wyoming, no invented or reached otherworld). Historical over Contemporary (1876, so
  modern-weird-west and contemporary vampire-fantasy fail era; vampire-future fails doubly). Period over Secret history (the Archaics are hidden but no central secret
  re-explains documented events) and Alternate history (no divergent timeline). Industrial age over Antique/Long chronicle (era exact, single era). Ember age over
  Electrified (pre-electric frontier). Weird West over Ember-age siblings: Gaslight (no gaslit city), Antebellum (post-war, frontier not plantation South), Bluestone
  (no). Standalone: author interview confirms a one-book contract, no sequel published.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Fantasy {Real earth fantasy, Fantasy realms, Portal fantasy} -> Real earth fantasy {Contemporary
  fantasy, Future fantasy, Historical fantasy} -> Historical fantasy {Alternate history fantasy, Gaslight fantasy, Mythic retelling, Period fantasy, Secret history}
  -> Period fantasy {Antique times fantasy, Industrial age fantasy, Long chronicle fantasy} -> Industrial age fantasy {Electrified fantasy, Ember age fantasy, Industrial
  fantasy chronicles} -> Ember age fantasy {Antebellum fantasy, Bluestone fantasy, Gaslight fantasy, Weird West fantasy} -> Weird West fantasy

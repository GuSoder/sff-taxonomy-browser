placement_rationale: 'Walk: Speculative fiction > Fantasy > Real-earth fantasy > Historical fantasy > Period fantasy > Industrial age fantasy > Ember age fantasy > Gaslight fantasy > Gothic in gaslight. The Delia Martin trilogy (Delia''s Shadow 2013, A Barricade in Hell 2014, Against a Brightening Sky 2015, Tor): 1915 San Francisco, where Delia Martin sees ghosts and is drawn with her detective husband into a serial-killer investigation; the past reaches for the living in a gaslit city. Rejected: Ghost sleuth fantasy (that branch, under Gothic realms, is invented-world-locked and this is real Earth), Ghost speakers (contemporary-only). Wobble: moderate - 1915 is the edge of the gaslight era and the haunting is braided with a murder investigation. SOFT. Years: 2013, 2014, 2015 (Tor). Queue ids MC04134, MC04135, MC04136.'

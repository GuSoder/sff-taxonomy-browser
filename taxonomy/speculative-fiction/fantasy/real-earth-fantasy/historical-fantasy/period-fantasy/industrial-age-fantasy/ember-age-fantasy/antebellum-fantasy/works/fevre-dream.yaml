placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy (the antebellum Mississippi) > Historical fantasy (set from 1857, written 1982) > Period fantasy > Industrial age fantasy > Ember age fantasy > Antebellum fantasy. Set on the antebellum Mississippi from 1857, Bram Stoker meets Mark Twain (Wikipedia): steamboat captain Abner Marsh partners with the pale Joshua York, a vampire seeking a way to live without killing, and is drawn into Yorks feud with the master vampire Damon Julian. The whole book is 1857 and after, so it fails the bulk era test for any contemporary shelf, and its steamboat South before the Civil War is this leafs exact center, beside The Underground Railroad and Enigmatic Pilot. Rejected: Oldfangs fantasy (previous shelf: the vampires old order is in the story, but era shelving outranks creature shelving for a historical set book).'

placement_rationale: 'Gaslight-era fantasy where magic is an inheritance: in Gilded Age New York of the 1890s two witch lineages
  descended from a woman hanged in 1692 Massachusetts feud over the craft''s use - Harriet Bishop''s hedge-witch line against
  her cousin''s dark society magic - with the family lineages and their governed craft as the stage. The long nineteenth century
  runs to 1914, so the Gilded Age sits in gaslight, and lineages make it magicians.'

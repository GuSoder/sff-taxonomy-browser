definition: 'Gaslight-era fantasy in the Gothic tradition: a decaying house, institution or bloodline, an inherited
  rot or curse, and dread as the engine - the Usher shape, where the past reaches for the living; and takes on the
  Gothic canon itself, where Dracula and his line, Frankenstein''s creature, Jekyll''s shadow and their kin return
  in the gaslit world that made them. Not Gaslight technomancy (the wonder is engineered), not Mythology or Folklore
  in gaslight (revived myth, faerie and folk beings), not Magicians in gaslight (magic as craft, gift or institution),
  not Monsters in gaslight (creature-lore loose in the world outside the Gothic canon; a Gothic-canon figure belongs
  here, whatever shape the story takes). Horror register for the Usher shape: the uncanny wins and no craft explains
  it away. Widened 2026-10-16 (curator ruling) to hold takes on the Gothic canon.'
status: accepted
ruling: 'Seeded under Gaslight fantasy, curator "Ok, approved" (phonemsg-01M4ZYT4XG40J98WNNRE9PD78Q, 2026-10-15
  ~4:17 PM CEST), after his question "Is gaslight not gothic in itself?" and his full-branch check ("Check the other
  books in Gaslight, I think you will find many being gothic", phonemsg-01M4ZYQ9Z9941N4Q9241P3AYSB): all 34 Gaslight
  cards walked, 2 gothic-engine, 6 gothic-furniture-only, 26 not gothic - gothic is not the branch''s shape but
  a real uncovered slot. Born with two walked cards: What Moves the Dead (from Eldritch fungi, 1890s era rules out
  Contemporary) and The Spirit Bares Its Teeth (from Magicians in gaslight, dread not craft). Ceiling: period gothic
  now scattered across era shelves; borderline kin walked and left in place: The Deep, My Brother''s Keeper, The
  Electric Empire, The Athena Club, Darkest London, The Somnambulist, The Anubis Gates.'

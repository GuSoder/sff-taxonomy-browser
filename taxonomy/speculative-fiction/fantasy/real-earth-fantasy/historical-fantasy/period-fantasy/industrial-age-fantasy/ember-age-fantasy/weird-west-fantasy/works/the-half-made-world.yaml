placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Period fantasy
  > Industrial age fantasy > Weird West fantasy. One duology in one world, so one fiction (rule 11j). Per Kirkus: a magic
  and steampunk Wild West where the Line (cold immortal Engines, industry, enslavement) and the Gun (demon Guns possessing
  their agents, terror and banditry) fight for the half-made West, with free settlements and the magic-powered Folk. That
  is the nineteenth-century frontier remade through magic and monsters, the Weird West tradition. Rejected: Technomancy (magic
  through machines is present in the Engines, but the leaf is Gothic and the book is a Western), Space western and steampunk
  leaves (no space, no Victorian history). Wobble: the West here is an invented-world analogue, not literal North America,
  which the leaf definition names; the leaf is the nearest Western leaf in the tree. Not folded: MC03135 Lightbringers and
  Rainmakers is a Tor.com short story in the same world.'

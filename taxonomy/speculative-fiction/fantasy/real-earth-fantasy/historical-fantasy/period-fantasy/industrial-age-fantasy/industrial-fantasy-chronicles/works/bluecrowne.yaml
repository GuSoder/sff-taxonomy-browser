placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Historical fantasy -> Period fantasy ->
  Industrial age fantasy -> Industrial fantasy chronicles. Bluecrowne belongs to Milford''s connected Roaming World: nautical
  stories in 1810-1812, The Broken Lands in 1877, The Boneshaker in 1913, The Raconteur''s Commonplace Book in the 1930s,
  and Greenglass/Rialto in roughly the present. Named Earth history and Missouri exclude Fantasy realms; no Earth-to-independent-world
  crossing governs the whole fiction, so not Portal fantasy. The connected substantial historical stories exclude a purely
  Contemporary placement; this is not Future fantasy. Original stories in documented eras are Period fantasy, not a retold
  named myth, a hidden explanation of recorded history or a demonstrated alternate-history divergence. The entire span begins
  after 1800, so Industrial rather than Antique or Long chronicle. It crosses 1900 substantially: neither Ember age nor an
  Electric chronicle honestly covers the whole continuity. Industrial fantasy chronicles now explicitly accepts connected
  stories across generations without a one-lifetime or industrialization-as-main-subject requirement. Owner approved this
  definition widening and existing Bluecrowne move in phonemsg-01M620WZA46N1CQFT4FE1KZC23, 2026-10-28 20:48 CET. No extra
  books, card rename or Long chronicle change. Sources are author interviews and setting statements, not full-text reading
  of every shared-world novel.'

definition: 'Fantasy chronicles that follow people, families or places across decades straddling the 1900 line, where the
  long industrial age (railways, telegraphs, companies, wars) arrives inside one lifetime-spanning story and the fantastic
  runs through the whole span. Magic-agnostic: the span and the era crossing define the leaf, not a required supernatural
  mode. Not Ember age fantasy (whole story ends before 1900), not Electrified fantasy (whole story from 1900 on), and not
  the single-era Electrified leaves, which take books set within one era.'

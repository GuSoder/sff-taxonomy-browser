definition: 'Fantasy chronicles that follow people, families, places or a connected shared-world community across substantial
  stories before and after 1900, beginning in the industrial age from 1800 onward and sometimes reaching the author''s present.
  The chronicle may be one long narrative or connected novels across generations; it need not fit one lifetime or make industrialization
  its main subject. Magic-agnostic: the span and era crossing define the leaf. Not Ember age fantasy (the whole fiction ends
  before 1900), not Electric fantasy chronicles (the substantial span is after 1900), and not Long chronicle fantasy (the
  substantial span begins before the industrial age).'

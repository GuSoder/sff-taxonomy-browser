placement_rationale: 'In an alternate Europa where an ice-age cold still grips the north and magic and industry advance side
  by side around 1837 of its reckoning, Catherine Hassi Barahal is married off to a cold mage and pulled into a fight among
  mage Houses, the wild Hunt and a revolution; muskets, gaslight, airships and revolutionary politics frame the sorcery (Strange
  Horizons, Cold Magic review: ''Europa, in 1837''; Orbit series page). Walk: Fantasy (real magic) > Real-earth fantasy >
  Historical fantasy > Alternate history fantasy (Europa diverges from our history - cold mages, the Hunt) > Alt flintlock
  fantasy (Regency/Napoleonic-era tech and politics with working magic). One universe, one card (rule 11j); trilogy complete
  2010-2013. Source: Strange Horizons and publisher; not read.'

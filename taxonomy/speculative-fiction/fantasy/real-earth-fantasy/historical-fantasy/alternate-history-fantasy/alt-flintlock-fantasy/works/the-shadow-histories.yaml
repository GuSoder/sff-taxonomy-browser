placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Alternate history
  fantasy > Alt flintlock fantasy. In the Age of Enlightenment of a world not quite ours, the necromancer Robespierre drives
  the French Revolution, the weather mage Toussaint L''Ouverture leads Haiti''s fight for freedom and William Pitt weighs
  legalizing magic (Hachette Book Group description of A Declaration of the Rights of Magicians); A Radical Act of Free Magic
  continues the same duology. Real musket-age history is openly rewritten with magic as its engine, the leaf''s definition.
  Rejected: Secret history (magic is public and legal-political, not hidden). Wobble: low. Sources: publisher page. Years:
  2020, 2021.'

placement_rationale: '# The Black Opera: whole-fiction walk

  24 November 2026


  Place Mary Gentle''s The Black Opera (2012; UK title Black Opera) as one standalone fiction in existing Alt European flintlock.
  This grows the leaf7to8. No genre, definition or portrait changes. Tree937/3012/7561 after placement. Research uses publisher
  descriptions, SFE bibliography, professional reviews and two independent reader reviews, including a detailed ending account.
  No full-book mirror used.


  ## Corpus and identity

  SFE lists The Black Opera among individual titles, outside Ash/Ilario and White Crow. Its2012NightShade first publication
  is corroborated by PublishersWeekly''s contemporary May notice and the June2012StrangeHorizons review. The Gollancz2013edition
  is a later paperback, not another novel. Hachette''s2012ebook likewise is an edition. One included novel only. No evidence
  ties this world to Ash/Ilario merely because their author is the same. Existing tree checked for Gentle and both title forms,
  no duplicate card found.


  ## Whole novel, not only setup

  In alternate earlynineteenthcentury Naples, ConradScalese writes opera librettos while Catholic sungMasses publicly produce
  healing and returns from death. His successful IlTerroreDiParigi is followed by a theatre-destroying lightning strike, bringing
  the Inquisition and FerdinandII into his life. The king commissions a counteropera within sixweeks to stop the Prince''sMen
  from using an emotionally overwhelming performance to trigger volcanic masssacrifice and enthrone their god. The earlier
  Tambora eruption is attributed to a musical test. A competing libretto, composerRobertoCapiraso, singers, rehearsal logistics,
  sabotage, prison, genderpassing and Conrad''s unresolved love for Roberto''swifeLeonora shape the narrative rather than
  a simple battlequest.


  The midpoint reveals Leonora is ReturnedDead and leader of the Prince''sMen. Her performances and manipulation of the central
  relationship have been undermining the counteropera. The second half follows the day of the competing performances, including
  eruption and the countering of her extraordinary voice with collaborative polyphony. The climax reaches the supernatural
  being behind the musical miracles. The detailed StrangeHorizons account makes clear that Conrad''s rationalist speculations
  are confirmed in dialogue with an omnipotent being, not a reveal of computers, engineering or psi. The closing relationship
  resolution turns the central triangle toward an accommodation rather than treating Leonora merely as a defeated monster.
  Reviews disagree strongly about effectiveness, not about the musical-miracle mechanism or these events.


  ## Hard root-down walk

  | Gate | Verdict and rivals |

  |---|---|

  | Speculative fiction | Literal resurrection, musical miracles and volcanic counterspells, not historical realism or staged
  fraud. |

  | Fantasy, not Sciencefiction | Publisher explicitly presents the magic of music. Conrad''s atheism is a character''s interpretation,
  not evidence of a scientific mechanism. Ending research does not demystify the powers as technology. Hardsciencefantasy/Ozymandiantech
  fail. No time-travel mechanism found. |

  | Not Fabulation | Opera''s plot parallels the characters and performance elicits emotion that causes magical effects. No
  character enters the libretto, no invented role escapes it, and the text does not literally rewrite reality as an authored
  manuscript. Nussbaum''s authorial-fiat criticism is evaluative rhetoric, not a diegetic author-character reveal. Textualtrespass/Retconnedworlds
  fail on mechanism, not tone. |

  | Realearthfantasy | Identifiable Naples, TwoSicilies, FerdinandII, Vesuvius, Tambora, Napoleon and European opera. Not
  inventedrealms or a portal-crossing frame. |

  | Historicalfantasy | Earlynineteenthcentury belcanto Europe, not contemporary or future. Exact calendar year varies between
  reader accounts, so no exact1835claim is needed. Broad1830sera consistent with FerdinandII and the sources. |

  | Alternatehistoryfantasy, not Periodfantasy | SFE and contemporary reviews call this an altered historical world. Public
  miracle-producing liturgy and resurrected people are established social facts. Most decisively, the independently read opera-focused
  reviewer records Napoleon winning Waterloo and appearing in this alternate Europe. It is not simply familiar history with
  a private mage inserted. |

  | Not Secrethistory | Prince''sMen are secret, and Tambora gets a secret cause, but the world''s magic itself is publicly
  acknowledged and history has diverged. The hidden-cabal plot cannot override that ancestor gate. |

  | Altflintlockfantasy | Napoleonic/Regency-adjacent European courts and church, opera and inheritedmusketage social order.
  Not later steamindustrial revolution, diesel wars, crusades, Ming, spice routes, Renaissance or swashbucklingseventeenthcentury
  as the central era. |

  | AltEuropeanflintlock | Naples/TwoSicilies and European political/religious life. Not the Americanfrontier counterpart.
  Existing directleaf,7fictionsbefore intake. |


  ## Strongest competing leaves

  1. Magiciansingaslight: serious rival because historical musicians deliberately practice miracle-making as a craft. Loses
  at the earlier Period-versus-Alternatehistory gate: this is an openly changed historical Europe with different Waterloo,
  not solely a magicalguild inside recordedhistory.

  2. Circusingaslight: opera/stage are central, but its folklore/wondertale parent is wrong. These are musicalspells and contestedmiracles,
  not a wingedperformer/fairytale-wonder intrusion.

  3. Occultcabals: Prince''sMen fit locally, but Secrethistory''s ancestor requires the hidden magical truth behind otherwise
  recordedhistory. Publicmagic and overtly divergenthistory fail that gate.

  4. Mythologyingaslight: Christianity/Gnostic theology and godawakening matter, but the driving public mechanism is musicalmiracles
  in altered Europe, not the revival of ancientmyths inside a historicalsetting. Do not let climactic goddialogue erase the
  whole novel.

  5. Fabulation: operatic structure and story/life echoes are not enough for textualbreach or realityrevision, as above.


  Confidence high on standalone corpus, firstyear and Fantasyroot; moderatehigh on the exact lower historicalleaf. The era
  can be described as earlynineteenthcentury without manufacturing an exact date. The strongest sourced distinction is publicly
  altered Europe, confirmed by the Napoleon/Waterloo divergence. No structural question.



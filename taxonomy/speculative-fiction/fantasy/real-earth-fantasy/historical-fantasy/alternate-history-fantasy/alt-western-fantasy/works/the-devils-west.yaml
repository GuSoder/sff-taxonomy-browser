placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy (alternate nineteenth-century
  North America, not an independently invented universe) > Historical fantasy > Alternate history fantasy > Alt
  western fantasy. Alternate Earth: the States exist, the Devil openly holds the living Territory, history is openly
  rewritten with magic as the engine. Fails Period fantasy''s documented-era gate, so not Weird West. Not Alt steampunk
  (no magic-powered industry), Alt flintlock (musket age to Regency) or Alt diesel (1910s-1950s). Trilogy: Silver
  on the Road (2015), The Cold Eye (2017), Red Waters Rising (2018), one fiction. Sources: Simon & Schuster series
  page https://www.simonandschuster.com/series/The-Devils-West.'

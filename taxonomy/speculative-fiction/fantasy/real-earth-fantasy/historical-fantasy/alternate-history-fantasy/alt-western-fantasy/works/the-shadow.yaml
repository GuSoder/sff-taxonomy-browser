placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy (magic, monsters) > Real earth fantasy (a divergent
  version of our Texas, not an independently invented universe) > Historical fantasy > Alternate history fantasy
  > Alt western fantasy. Author: Rhett grew up in Durango, ''an 1800s alt-history version of Texas''; ''the world
  is made up and the history is fuzzy''. A rewritten 1800s frontier running on monsters and magic, so it fails Period
  fantasy''s documented-era gate and is not Weird West. Wake of Vultures to Treason of Hawks, one fiction. Sources:
  https://www.apexbookcompany.com/blogs/apex-magazine/interview-with-author-lila-bowen and https://historicalnovelsociety.org/reviews/wake-of-vultures/.'

definition: 'Alternate history fantasy of alternate 17th-century sword-and-sail worlds, where
  magic rather than gunpowder shapes warfare: knightly orders, sword fights and sailing
  empires, and magic is the engine: history is openly rewritten and the world runs on magic.
  Not Alt flintlock fantasy (the powder age, same century), not Alt crusade fantasy (medieval),
  not Alt Renaissance fantasy (15th-16th century courts).'

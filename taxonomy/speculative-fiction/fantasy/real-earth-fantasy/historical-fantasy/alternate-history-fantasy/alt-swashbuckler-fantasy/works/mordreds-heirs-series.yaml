placement_rationale: 'Rosenberg''s Mordred''s Heirs duology (Baen; ISFDB series 11957, 2 published books): an alternate 17th-century
  Earth where Mordred defeated Arthur the Tyrant and the Pendragon dynasty rules from Londinium; the knights of the Order
  of Crown, Shield and Dragon wield soul-bearing swords against an enemy arsenal of red swords, among sword-and-sail powers
  (Crown vs Holy Roman Empire vs Dar Al Islam) where gunpowder never displaced the sword (booksforabuck review; Baen). Walk:
  Fantasy > Real earth fantasy > Historical fantasy > Alternate history fantasy > Alt swashbuckler fantasy. Not Alt flintlock
  fantasy (the powder age - this world is sail without powder), not Alt crusade fantasy (medieval), not Arthurian fantasy
  (the legend is backdrop, not retold; Arthur Returned precedent). Wobble low.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy (working wizardry and vampirism, not scientific extrapolation)
  > Real earth fantasy (our Europe deliberately rewritten, not an invented realm or a portal crossing) > Historical fantasy
  (Richard III, Medici Florence and the Wars of the Roses) > Alternate history fantasy (Julian''s surviving pagan empire and
  immortal vampire rulers change Europe''s history openly, not a hidden magical episode) > Alt Renaissance fantasy (15th-century
  Europe, Renaissance courts and competing states). Jo Walton''s Reactor review places Cynthia at Lorenzo''s Renaissance court
  and the group in Richard III''s succession struggle; Justinian and Theodora''s vampirism sustains Byzantine expansion. Locus
  confirms real wizardry and the quartet''s political/espionage campaign. Not Alt crusade fantasy: no Christendom or holy-war
  engine, Christianity has faded; the Renaissance state contest governs. Not a vampire-horror shelf: vampirism helps build
  the alternate political world rather than organizing a horror plot. Standalone novel (1983); no series implied.'

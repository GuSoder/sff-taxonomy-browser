placement_status: accepted
placement_rationale: 'Source-read root-down walk: Speculative fiction > Fantasy > Real earth fantasy (alternate Venice and
  historical Europe, not an independently invented world) > Historical fantasy > Alternate history fantasy (timeline broken
  from ours in AD 349, public magic reshapes history) > Alt Renaissance fantasy. The opening is set in Venice in 1537; later
  books extend the conflicts to Corfu, Hungary, Valahia and Constantinople. Renaissance Europe fits the approved 15th-16th-century
  boundary, rather than medieval Alt crusade or 17th-century-and-later Alt flintlock. Five queued novels are one shared-universe
  fiction under rule 11j. Seed approved by curator "Ok" on October 7 at 10:20:57, phonemsg-01M4AQ73ZDK18HV3KQHRYRZKKJ.'

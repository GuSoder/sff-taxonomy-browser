definition: 'Alt diesel fantasy of the Ottensian school (the dieselpunk community''s defined term): the Great War and the
  Depression never bite - the Roaring Twenties dream keeps evolving: pulp heroics, noir cities, jazz-age wonders, zeppelins
  and progress, history openly rewritten and running on magic. Not Piecraftian fantasy (the world war is the engine of the
  world).'

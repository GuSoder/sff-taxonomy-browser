placement_rationale: '# The Great Undead War - whole-fiction walk, 2026-11-06


  Place one fiction with three published novels in Alt diesel fantasy (8 -> 9). No gate changes or existing moves. Moderate-to-high
  wobble: the 2026 LitRPG spinoff imports a modern soldier into alternate 1918, while the older pair is a pulp military rescue
  story in an extended Great War. This is not three novels with an identical engine.


  ## Scope and every novel

  - By the Blood of Heroes (2012): Burke''s team must recover American ace Freeman from the undead Red Baron. Corpse gas is
  the public scientific explanation of zombies; the occult blood-relative assassination threat against the president is separate
  magic evidence. Reviews from Alternate History Weekly Update and Nameless Zine independently describe it. Tesla gadgets,
  clockwork arm and dirigibles are genuine steampunk machinery.

  - On Her Majesty''s Behalf (2014): direct continuation within weeks; rescue British royals from zombie London, with undead
  former squadmate opposing Burke. Nameless Zine describes mystical objects beneath the British Museum, explicitly not used
  here, so this is supporting evidence and not a claim of a demonstrated spell. Harper''s own page confirms December 2014,
  correcting misleading 2013 search labels.

  - Operation Shambling Tide (2026): creator expressly says it is set in his Great Undead War universe; current series page
  lists it; February release announcement and completed 300-page review establish publication. Solomon Drake, born 1992, is
  wounded in Afghanistan and wakes in 1918 with stats and XP. His modern knowledge and engineered response to zombie control
  collars govern the mission. Completed review identifies Madman Burke and Graves, and explicitly says the transfer/HUD cause
  is unresolved at the ending. Do not claim a literal computer simulation, time machine, divine summoning or return trip.

  The Sharp End #0.5 is a short prequel, not an added novel. Author references to a planned main trilogy or older five-book
  plan are not publication evidence. No unpublished main third volume invented.


  ## Root-down walk

  Speculative fiction -> Fantasy: not merely an assumed fantasy classification from zombies. Corpse gas by itself could be
  SF. The occult long-distance blood assassination threat and museum''s mystical artifacts support actual occult worldbuilding
  beyond the chemical premise. Both are less overt than the zombie war and that uncertainty remains visible.

  Fantasy -> Real earth fantasy: altered Europe, France, London and historical personages, not an independent secondary world.
  Fantasy realms fails at its setting gate, even though action-forward Technofantasy, Steampunk realms or Technomancy would
  describe parts of the texture. Comedy and Heart fantasy do not govern this fiction.

  Portal fantasy is a serious alternate route for Operation, including the creator''s release wording ''Portal fantasy without
  isekai power creep''. The whole shared fiction is not organized around world exchange: the original pair is about soldiers
  native to the alternate history; the spinoff adds one unexplained transfer. No anchored threshold or transporting book;
  no mythic hidden realm, planet journey or leaking world. A system of many counterpart worlds is not established, so Mirror
  multiverse is not a safe inference merely because a reviewer calls the destination an alternate universe.

  Real earth -> Historical fantasy: most action across all three novels is in the altered Great War. Contemporary fails despite
  Afghanistan in the spinoff''s opening; Future fails despite the originals being set after their historical war endpoint.

  Historical -> Alternate history fantasy: German corpse gas publicly changes the war from 1917, prolonging it into 1921,
  followed by zombie London and the Red Baron''s seizure of the Kaiser position. This is open historical divergence, not secret
  magical truth behind documented events. Secret history fails; Mythic retelling fails despite a Greek-myth twist. Period
  fantasy -> Industrial age -> Electrified -> World wars -> WWI fantasy is the closest rival, but its documented 1914-18 stage
  is less honest for a war deliberately continued and rewritten into 1921.

  Alternate history children: Alt crusade, Ming, spice route, Renaissance, flintlock and swashbuckler all fail era/place gates.
  Alt diesel matches machine-age twentieth-century Europe and an openly rewritten war with occult power alongside machinery.
  ''Diesel'' is an era label here, not a claim that these steam-led gadgets run on diesel engines. No definition widened.

  SF counterwalk: Timeslips -> Time strays -> Timestranded would describe Drake''s involuntary era crossing if the whole fiction
  passed the SF root. LitRPG would describe its stats, but cyberpunk ancestor is unproved and two novels have no game engine.
  Owner''s exact September 23 rule says ''when in sci fi, anything time travel goes Atemporal'' (phonemsg-01M36M8K4DB3B8Y8T1GAQ6ARF0).
  Fantasy root comes first. Bill and Slow Gods exceptions are not generalized. Here the crossing is substantial, not dismissed
  as a blip; it is recorded as the fiction''s main straddle.


  ## Jacket QA and limits

  Three distinct English flat fronts taken from the creator''s own current book pages, downloaded locally and inspected as
  actual pixels together. All titles and author names readable, no audio/3D/sticker/signature edition. Not proof of first
  printing. No reading of complete copyrighted novels claimed: official copy plus complete independent reviews, including
  each novel''s own review, establish the above.


  ## Authority

  Ordered intake original phonemsg-01M43MYMGAMQTNA3CY402KK7FB and individual/whole-fiction trust phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX
  re-read directly 2026-11-06. This is an existing-leaf placement, not a structural approval request.

  '

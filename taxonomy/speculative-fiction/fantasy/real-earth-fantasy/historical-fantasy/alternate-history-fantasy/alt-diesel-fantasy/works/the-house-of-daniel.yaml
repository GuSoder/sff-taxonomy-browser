placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Alternate history
  fantasy > Alt diesel fantasy. A minor-league baseball tour through a Great Depression America after ''the Big Bubble'' of
  1929, where zombies work the mills, wizards and flying carpets are everyday and magic runs the economy (Tor Publishing Group;
  billed ''a novel of wild magic, the Great Depression, and semipro ball''). The history is openly rewritten and the twentieth-century
  world runs on magic, the leaf''s definition. Rejected: Dust Bowl fantasy (that leaf is magic-agnostic and defined by the
  period and the Plains; here magic is the engine), Sports fantasy if any (the ball is the stage). Wobble: moderate; the Oklahoma
  and Plains barnstorming stage pulls toward Dust Bowl fantasy. Sources: Tor. Year: 2016.'

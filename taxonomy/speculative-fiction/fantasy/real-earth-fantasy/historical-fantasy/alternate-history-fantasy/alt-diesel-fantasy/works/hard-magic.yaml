placement_rationale: 'Larry Correia''s Hard Magic (Baen, 2011; Wikipedia author page and series description), with Spellbound
  (2011) and Warbound (2013) folded in as the trilogy''s later volumes: an alternate 1930s in which magic began to appear
  in people in 1849, about one in a hundred has a minor power and about one in a thousand is an Active, and the gravity-manipulating
  Heavy Jake Sullivan, a veteran turned enforcer, finds that the government is lying to him and joins the Grimnoir Society
  against the Japanese Imperium and the ambitions of Okubo Tokugawa. Walk: Fantasy > Real Earth fantasy > Historical fantasy
  > Alternate history fantasy > Alt diesel fantasy (the machine-age 1930s, rewritten openly by magic). Tried: Occult consultants
  (the setting is a rewritten 1930s world with an empire war, not a modern private-eye world) and Modern occult (no hidden
  contemporary occult layer: magic is public).'

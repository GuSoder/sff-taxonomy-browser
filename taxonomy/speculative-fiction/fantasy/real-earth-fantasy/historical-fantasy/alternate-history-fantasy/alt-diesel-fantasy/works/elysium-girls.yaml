placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Historical fantasy > Alternate history
  fantasy > Alt diesel fantasy. Real 1935-45 Oklahoma Panhandle (Black Sunday, the Dust Bowl) openly rewritten by magic: the
  goddesses Life and Death appear on Black Sunday 1935 and force the town of Elysium into the Game, witchcraft runs the walled
  city, Dust Soldiers walk - machine-age 20th-century America with history openly rewritten and the world running on magic,
  the Alt diesel definition (shelf-mates Rust in the Root, 1937 America; The House of Daniel, 1934 Americana; Hard Magic,
  1932). Rejected: Period fantasy / Industrial age (no open magical rewrite of history there), Mythic retelling (Life and
  Death are personified forces in an American original, not a retold myth cycle), Dystopia (the frame is fantasy alternate
  history, not SF social extrapolation). Standalone novel, 2020 (Disney-Hyperion; Kirkus, Publishers Weekly). TENTH card on
  Alt diesel fantasy: the leaf freezes and a split proposal follows at once.'

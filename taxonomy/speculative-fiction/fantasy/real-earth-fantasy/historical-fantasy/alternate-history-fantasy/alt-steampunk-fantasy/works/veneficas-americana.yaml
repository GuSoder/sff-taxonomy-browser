canonical_genre: alt-steampunk-fantasy
placement_status: accepted
placement_rationale: 'Fantasy rather than SF: literal gods, animancy, credomancy, blood sorcery, reincarnation and ancestral
  possession remain real; engineered Otherwhere devices do not establish a technology-only explanation. Real Earth rather
  than Fantasy realms: dated United States, California, New York and Detroit. No Earth-to-other-world crossing governs the
  whole family story, so not Portal; Otherwhere power alone is not a portal narrative. Historical rather than Contemporary
  or Future. Not a retelling of a named inherited myth. Secret history fails its secrecy gate because magic is publicly traded
  and institutionalized.

  Historical partition: choose Alternate history, moderate confidence at the Period boundary. Public magic alone would not
  be enough. The author''s credomancy account explicitly changes historical institutional power through mass belief and communication
  networks; the world has a magical-industrial order, a subsequent magic-allergic generation and inoculation politics. A completed
  third-book reader specifically describes a different Tesla/Edison industrial outcome. History is reengineered through magic,
  rather than merely a documented era hosting a supernatural family. No changed war/election outcome is invented.

  Industrial fantasy chronicles is the strongest rejected route: it exactly fits the substantial 1876/1910 generational span,
  but only after Period''s era-as-stage ancestor passes. That ancestor is the failure, not the chronicle definition. Existing
  Period tenants Babel and the Parasolverse supply real counterpressure: public magical industry does not automatically prove
  Alternate. The chosen result rests on the combined author and completed-whole-world historical transformation evidence,
  with moderate boundary confidence, not genre-tag counting. Romance and family saga describe the story''s form and do not
  erase its historical-world root. Contemporary Magic family and invented-world Romantasy fail their own ancestors.

  Full Alternate child walk: Crusade fails medieval Christendom/Levant; Ming fails fourteenth-century China; Spice route fails
  the medieval Indian Ocean; Renaissance fails fifteenth-/sixteenth-century Europe; Swashbuckler fails seventeenth-century
  sword-and-sail. Flintlock, including its American child, ends around the Napoleonic/Regency powder-and-sail world and cannot
  stretch to the two substantial1876 novels plus1910. Diesel, including Ottensian/Piecraftian, cannot absorb the two1876 novels
  just because the third reaches1910. No existing leaf honestly covers the whole three-book world.

  Cross-check of Period rivals: Weird West would overfit the first novel; New York society and the1910 next generation are
  substantial. Gaslight Magicians/Technomancy/Mythology capture aspects, but no one aspect covers the whole, and the Ember
  before1900 ancestor is a separate whole-world problem; Gaslight''s Edwardian wording cannot silently remove that gate. Long
  chronicle''s pre-industrial beginning is absent, Electric chronicle starts too late, and a Contemporary family route fails
  historical era. Do not split the shared world by era or count a novel twice.


  Approved placement: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Alternate history fantasy
  > Alt steampunk fantasy. The approved new leaf takes this one shared three-confirmed-novel fiction. It is not an SF Steampunk
  placement. No earlier sibling is widened or redistributed.'
whole_fiction_content: 'One shared Veneficas Americana fiction. The Native Star(2010):1876 California witch Emily Edwards
  loses local trade to patent magic, binds a lumberman through an ill-advised love spell, investigates undead industrial workers
  and acquires an embedded magical stone. A dangerous cross-country journey with Dreadnought Stanton meets industrial/ecological
  exploitation, magical institutions and romance.

  The Hidden Goddess(2011):still1876, not the publisher blurb''s wrong-century phrase. Reproduced chapter heading and completed-story
  context establish the year. New York society and Institute succession/investiture, recovered childhood memories, Russian
  Sini Mira and a bloodthirsty Aztec goddess expose the lovers'' hidden pasts. Their duology closes on stronger trust. Completed
  reviewers disagree about the increased romance; that disagreement is retained.

  The Warlock''s Curse(2012):1910 next generation, Will Edwards and Jenny Hansen/Scuff. His parents prohibit a Detroit Tesla
  apprenticeship; they flee through a marriage of convenience and her trust money. Otherwhere engineering and an altered magical
  industrial order form the context. Aebedel Cowdray''s inherited possession, harmful family secrets, the magic-allergic generation,
  an evangelist''s inoculation campaign and terrible personal consequences displace the apparent romance/adventure. Ends unresolved.
  Not cozy, not an unrelated author-world and not merely an older-character cameo.'
classification_confidence: Moderate at the Period/Alternate history boundary; high on three verified novel identities and
  one shared world.

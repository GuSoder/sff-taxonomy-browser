    fantasy, after explicit clarification that this is not alternate-history SF.
ceiling: One verified fiction with three published novels today; a broad steam-age alternate-Earth slot, not restricted to
  the seed family, America or a required romance. No extra kin claimed.
boundaries:
  alt-crusade-fantasy: Medieval Christendom and the Levant rather than the industrial nineteenth century.
  alt-ming-fantasy: Fourteenth-century Chinese dynastic history rather than the industrial nineteenth century.
  alt-spice-route-fantasy: The medieval Indian Ocean trade world rather than the industrial nineteenth century.
  alt-renaissance-fantasy: Fifteenth-/sixteenth-century Renaissance history rather than the steam-age industrial world.
  alt-swashbuckler-fantasy: Seventeenth-century sword-and-sail alternate history rather than the industrial nineteenth century.
  alt-flintlock-fantasy: Earlier powder-and-sail, through Napoleonic/Regency, rather than the later steam-age industrial world.
  alt-diesel-fantasy: Twentieth-century war/interwar machine-age order rather than a steam-age world reaching the pre-WWI
    Edwardian years.
  period-fantasy: Documented era as supernatural stage; this leaf requires openly rewritten historical order with magic as
    its engine.
  steampunk: The SF branch does not take this literal magical alternate-history world merely because both share industrial
    aesthetics.

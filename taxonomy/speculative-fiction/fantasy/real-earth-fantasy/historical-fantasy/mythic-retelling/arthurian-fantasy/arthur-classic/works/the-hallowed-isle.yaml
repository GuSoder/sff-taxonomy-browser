placement_rationale: 'Root-down: Fantasy > Real Earth fantasy (post-Roman Britain) > Historical fantasy > Mythic retelling
  > Arthurian fantasy > Arthur classic. Paxson''s four-book retelling of the Arthurian legend in the heroic classic register:
  per the books.org overview the frame is post-Roman Britain (''The Romans came, conquered, and departed, leaving behind them
  a strange new religion called Christianity''), and the series record is four primary works (Goodreads series 72430; risingshadow
  series 3128). Rejected: Arthur reimagined (the old-religion frame is a perspective but not one of the leaf''s enumerated
  argument modes - women''s, queer or satirical; the telling is straight heroic), Arthur returned (not contemporary). Soft:
  the pagan-vs-Christianity lens sits near the reimagined border; the classic register fits the telling. One card. Years from
  the author''s own bibliography (diana-paxson.com/writing/zen-list): 1999, 2000, 2000, 2001 (Avonova). Queue carries only
  Book Four (MC02584); books 1-3 folded onto the series card.'

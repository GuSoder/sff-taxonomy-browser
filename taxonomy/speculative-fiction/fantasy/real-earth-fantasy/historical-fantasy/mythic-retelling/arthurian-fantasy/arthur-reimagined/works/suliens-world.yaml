placement_status: accepted
placement_rationale: 'One fiction (rule 11j): Walton''s first three novels, one universe (author''s own series page ''Sulien''s
  World''): The King''s Peace (2000), The King''s Name (2001), The Prize in the Game (2002 prequel). A reworking of the Arthurian
  legend (SFE Walton entry) set in Tir Tanagiri - ''a fantasy alternate sixth century Europe... the alternate Britain'', same
  geography as ours, mythically connected to our world (author site) - so Earth-rooted, not an independently invented universe
  (real-earth gate passes: alternate Britain = rooted in our own Earth). Positive fit to Arthur reimagined: the legend reshaped
  through a woman''s perspective rather than told straight - Sulien ap Gwien, woman warrior, narrates her rise through Urdo''s
  (Arthur''s) cavalry while Urdo unites the island''s kingdoms and restores law (Wikipedia plot summary; Emerald City review
  title ''Alternate Arthur''); peer tenants gwenhwyfar, spear, half-sick-of-shadows share the women''s/queer-perspective reshaping.
  Rejected: warrior-hero/martial-heroes (true of Sulien''s skill but the fiction''s anchor is the inherited Arthurian story
  - mythic-retelling owns ''the source is the myth itself'' and explicitly names Arthurian Britain), alternate-history-fantasy
  (history openly rewritten with magic as engine; here the anchor is the legend, not a divergence), mythological-fantasy branches
  (invented myth; here the myth is inherited Arthurian matter). Queue years 2007/2000/2004 are reprints; first publications
  2000/2001/2002 (Wikipedia, Tor).'

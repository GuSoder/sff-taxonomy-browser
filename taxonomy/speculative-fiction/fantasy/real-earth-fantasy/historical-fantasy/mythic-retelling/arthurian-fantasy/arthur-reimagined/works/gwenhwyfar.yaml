placement_rationale: 'Lackey''s Gwenhwyfar: The White Spirit (DAW, 6 Oct 2009; mercedeslackey.com): in a world where gods
  walk among pagan worshippers and a woman has two paths, the Blessing or the rarer path of the Warrior, Gwenhwyfar, a king''s
  daughter raised as the son her father never had, chooses the Warrior and gives up her inherited power, until the Ladies
  of the Well make her Arthur''s queen, where she meets temptation, treachery and intrigue. Walk: Fantasy > Real-earth fantasy
  > Mythic retelling > Arthurian fantasy > Arthur reimagined (the legend retold through a woman''s perspective as an argument
  with the tradition, as in Avalon and Mad Merlin). Rejected: Arthur classic (the legend in its own mode from Camelot''s knights;
  here the queen''s own path and a pagan frame replace the Camelot court), Arthur returned (no modern or later world), Celtic
  fantasy (the legend, not Celtic myth, is the source), Warrior hero (the Arthurian frame decides the branch). Wobble moderate:
  Arthur classic is the alternative reading. Queue id MC06737, first published 2009. The Open Library cover used is the DAW
  paperback jacket (the edition on the main cover id is an audiobook).'

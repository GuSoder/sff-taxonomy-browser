placement_rationale: 'The Arthurian legend retold as an argument from the women''s side: Morgana, taken to the Isle of Apples
  and raised among its nine priestesses, becomes the realm''s most powerful priestess, and the sequel The Faerie Handmaid
  continues the same world after Arthur''s death through her magicless handmaid Braithe (same Camelud, same priestesses -
  one card). A reshaping through women''s perspectives in the line of the leaf''s members, so Arthur reimagined.'

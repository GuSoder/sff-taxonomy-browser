placement_rationale: 'Debut standalone (Grand Central/Hanover Square, on sale 18 June 2026): Lancelot born nameless and orphaned
  on the Isle of Women, trained as a knight alongside Galehaut, their bond set against Merlin''s grand prophecies - the legend
  rebuilt around the queer Lancelot-Galehaut thread of the 13th-century Vulgate Cycle, with Viviana the Lady of the Lake''s
  ancient magic. The author pitches it as ''Song of Achilles, but Camelot'' and says the queer thread ''upends a lot of the
  traditional beats'' (Nerd Daily interview; People cover reveal). That is Arthur reimagined''s gate exactly: the legend reshaped
  through a queer perspective rather than told straight. Single novel, no series (author interview: next project undecided).'

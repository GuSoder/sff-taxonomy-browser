definition: Fantasy retelling or reimagining inherited Irish myths, legendary figures and narrative cycles in their mythic
  or historical-age worlds, including the Ulster, Mythological, Fenian and Kings cycles. The inherited Irish story must govern,
  not merely a Celtic cultural setting. Not Arthurian fantasy (Arthur and his cycle), Greek myth fantasy, Norse fantasy, Mayan
  myth fantasy, Biblical fantasy, Roman myth fantasy, Slavic myth fantasy or Frankish myth fantasy (their other named traditions
  govern). Not Modern Celtic myth (myth alive in the present), Period Celtic fantasy (an early-medieval cultural stage), or
  Portal fantasy (an Earth outsider's crossing governs).

definition: 'Fantasy retelling or reimagining the Matter of France, the Frankish legendary cycle of Charlemagne, his paladins
  and their heirs: Roland, Oliver, Ogier, Huon and the chansons de geste, including their later epic elaborations. The inherited
  legends must be the story''s source, not simply a historical Frankish setting. Where Arthurian material is interwoven, the
  Frankish protagonist and legend must govern the whole fiction. Not Arthurian fantasy (Arthur and his own cycle govern),
  Greek myth fantasy, Norse fantasy, Mayan myth fantasy, Biblical fantasy, Roman myth fantasy or Slavic myth fantasy (those
  other named traditions govern). Not Period fantasy (a documented era as stage), Portal fantasy (an Earth person crossing
  into a legendary world), or generic medieval knight adventure.'

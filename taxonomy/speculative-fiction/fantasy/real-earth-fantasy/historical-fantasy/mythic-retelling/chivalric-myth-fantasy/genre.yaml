definition: Fantasy retelling or reimagining inherited medieval chivalric legendary cycles, including their epic antecedents
  and later elaborations. Current branches are the Matter of Britain, Arthurian fantasy, and Matter of France, Frankish myth
  fantasy. The inherited cycle is the source, including critical, feminist, queer and satirical reimaginings, not a required
  approval of knightly ideals. Not generic knight adventure, an invented medieval world, a historical era alone, or romance
  merely as a love story. Not the whole Celtic or Classical myth traditions, which extend beyond these chivalric literary
  cycles.

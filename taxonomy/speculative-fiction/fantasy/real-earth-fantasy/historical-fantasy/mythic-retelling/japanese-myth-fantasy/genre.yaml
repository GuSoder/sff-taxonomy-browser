definition: 'Fantasy that retells or reimagines the myths and legends of Japan: the kami of the Kojiki and Nihon Shoki, the
  Heike Monogatari and the other war tales, fox spirits and yokai, heroes and vengeful ghosts of legend. The inherited story
  must be the fiction''s source, not simply a Japanese historical setting. Not Edo fantasy (a documented era as stage), not
  Genso (invented East Asian worlds), not Contemporary mythic fantasy (myth alive in the present day).'

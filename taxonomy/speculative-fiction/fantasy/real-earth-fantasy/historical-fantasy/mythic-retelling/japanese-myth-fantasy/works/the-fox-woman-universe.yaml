placement_rationale: 'Kij Johnson''s Heian-Japan animal-spirit novels, one shared world (Wikipedia: Fudoki is ''a (stand-alone)
  sequel to The Fox Woman''), one card (rule 11j). The Fox Woman (Tor 2000, first published 2000; queue year 2001 is a reissue)
  retells the Japanese fox-wife legend: a kitsune falls in love with a nobleman and becomes human to win him. Fudoki (Tor
  2003; queue year 2004 is a reissue) follows a cat who becomes a woman in the same Heian world of spirits. Both take inherited
  Japanese legend as their source - fox spirits and yokai are the leaf''s own examples. Walk: Fantasy > Real Earth fantasy
  > Historical fantasy > Mythic retelling > Japanese myth fantasy. Tried: Edo fantasy (Heian court, and legend is the source,
  not the era as stage), Period fantasy (mythic retelling governs). Wobble: low.'

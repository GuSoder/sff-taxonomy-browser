placement_rationale: 'Root-down: Speculative fiction > Fantasy (real magic, openly active: the Dragon King''s daughters Benzaiten
  and Tokiko bind Kiyomori to their bargains, the war god Hachiman backs Yoritomo, ghosts and demons fight through the Genpei
  War; Kirkus, Publishers Weekly, Library Journal) > Real earth fantasy (12th-century Heian Japan, 1153-1185; the curator
  confirmed this is Earth, not far shores: phonemsg-01M72NZBDQ5S2C45K8MXR3HW61) > Historical fantasy > Mythic retelling: the
  fiction''s source is the inherited story itself - it retells the Heike Monogatari with its named figures (Kiyomori, Tokiko,
  Yoritomo, Emperor Sutoku) and the legend''s own supernatural content. Not Secret history (the magic is open and secrecy
  is not the theme), not Edo fantasy (Edo period 1603-1868; this is Heian), not Genso (invented East Asian world; this is
  real Japan), not Period fantasy generally (a documented era as stage rather than an inherited tale as source). Seed leaf
  Japanese myth fantasy approved by the curator (phonemsg-01M72NZZGK1RR1CZ1AGBSCD9HB); Frankish myth fantasy is the branch
  precedent for a semi-historical war chronicle retold as legend. Standalone novel, first published by Tor in 2001 (the queue''s
  2015 date is a reissue).'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Mythic retelling > Norse fantasy. Angrboda,
  a witch and seer burned and exiled by Odin, loves Loki and bears his monstrous children, Fenrir, Hel and Jormungandr, then
  must face what the gods'' prophecies of Ragnarok do to them (Gornichec, 2021; a retelling of the Norse sources from the
  giantess''s side). The book retells named figures and narratives of Norse myth, the leaf''s definition. Rejected: Viking
  fantasy (the gods and Ragnarok, not Viking Age society, are the source), Fantasy realms leaves (the source world is the
  mythic North, not an invented one). Wobble: Mythic retelling siblings, none closer.'

placement_rationale: 'The Photinus novels (Cassell 1966-1968): Votan and Not for All the Gold in Ireland
  - text-level evidence (Vulpes Libris) is that exactly these two of the three omnibus novels tell Photinus''s
  story; Men Went to Cattraeth (narrator Aneirin, c. 600 CE) shares no characters and is its own fiction in
  Celtic fantasy. The fiction''s engine is one man''s euhemeristic career as the mortal origin of Northern
  god-myths, and its spine is Norse: in 2nd-century Germania the Greek trader Photinus is mistaken for the
  god Votan and, keeping up the comic pretence, becomes the origin of the Odin legend (SF Gateway publisher
  copy; Neil Gaiman: ''probably the best book ever done about the Norse''; the god-identity he creates and is
  remembered by across the sequence is Votan). norse-fantasy reads ''retells or reimagines Norse and Northern
  Germanic mythic or legendary source material, rather than merely using the Viking Age as a setting''. Whole-fiction
  aboutness, not per-volume purity: the Odin-imposture is the founding and governing case; substantive cross-tradition
  straddle, not a purely Norse claim - in Not for All the Gold in Ireland (AD 70, Britain and Ireland) the same
  device engages Irish myth at equal narrative weight as Photinus takes on the role of Manannan (Reactor review),
  material celtic-fantasy would cover if the books were separable; they are not (one continuous protagonist and
  premise). No active magic: the fantasy is the mythic
  reimagining itself, as the gate wording admits. First published 1966.'

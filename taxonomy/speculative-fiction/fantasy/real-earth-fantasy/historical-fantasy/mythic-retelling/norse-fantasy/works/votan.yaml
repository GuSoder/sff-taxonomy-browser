placement_rationale: 'The Photinus sequence (Cassell 1966-1969; collected as the Gollancz Fantasy Masterworks omnibus Votan
  and Other Novels, 2014 - the queue row): Votan (1966), Not for All the Gold in Ireland (1968), Men Went to Cattraeth (1969).
  The namesake novel and series engine reimagines Norse myth material: in 2nd-century Germania the Greek merchant-adventurer
  Photinus is mistaken for the god Votan and, keeping up the comic pretence, becomes the mortal origin of the Odin legend
  (publisher copy: ''items that lead the people he encounters to think him a Norse God, a fortuitous point of view which he
  does little to dispel'', SF Gateway). norse-fantasy reads ''retells or reimagines Norse and Northern Germanic mythic or
  legendary source material, rather than merely using the Viking Age as a setting'' - the Odin-imposture premise is exactly
  that reimagining, and the Grendel tenant sets the ironic-rationalizing register precedent. Disclosed tangents: the loose
  sequence then ranges beyond Norse material - Not for All the Gold in Ireland (ISFDB Photinus #2) plays games with Irish
  legend in Roman-era Ireland and Men Went to Cattraeth retells the Welsh heroic legend of the Gododdin through Aneirin the
  bard (celtic-fantasy was the alternative for those volumes; a series is never split across leaves, and the namesake Norse-myth
  engine governs the card). No active magic: the fantasy is the mythic reimagining itself, as with the leaf''s gate wording.
  First published 1966.'

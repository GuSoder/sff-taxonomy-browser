placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Mythic retelling -> Greek
  myth fantasy. SFE describes Pallas Athene creating an island city in the ancient Mediterranean and recruiting people across
  time to test Plato’s Republic; Apollo becomes mortal and Zeus later moves the cities. Named Greek gods and their divine
  acts are the causal spine, with time travel and future robots serving Athene’s mythic experiment.'

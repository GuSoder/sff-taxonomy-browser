placement_rationale: 'Betancourt''s three-novel Hercules (Tor, 1997-2001; ISFDB series 5078): The Wrath of Poseidon (1997-06,
  Tor pb 0-812-53910-9), The Vengeance of Hera (1997), The Gates of Hades (2001). New adventures of Heracles and Atalanta
  sailing with Jason and the Argonauts - sea monsters at Troy, a cyclops and Hera''s flying myserae, the descent to Hades
  - with the gods'' debts and vendettas driving the plot (detailed per-book accounts at gwthomas.org/john-gregory-betancourts-hercules/,
  including the author''s own series history). Greek hero fantasy''s gate exactly: the heroes and their cycles retold - ''Heracles
  and his labors'', and here the Argonaut cycle. Queue row MC04722 (''Hercules'', 2013) is the Tor ebook reissue of book 1
  (ISBN 978-1-4668-5385-0, ISFDB pub 786978, 2013-09-24); the fiction is the whole trilogy, first published 1997. Not the
  Hercules: The Legendary Journeys TV tie-ins (those are by Timothy Boggs and others).'

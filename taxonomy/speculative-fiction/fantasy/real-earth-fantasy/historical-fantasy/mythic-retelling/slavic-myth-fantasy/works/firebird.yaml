placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Mythic retelling
  > Slavic myth fantasy (leaf id slavic-myth-fantasy). Mercedes Lackey''s Firebird (1996; Tor 2008 edition is the queue row
  MC06732): Ilya, despised middle son of a minor Russian tsar, meets the Firebird, with Baba Yaga-style magic, a sorcerer
  holding an enchanted princess and a rescue quest (Kirkus, ''reworking of an Old Russian folk tale''; Bookloons; Tethyan
  review). It is a single novel; the Fairy Tale grouping with The Black Swan is a publisher label, not a shared world (Lackey''s
  own site files The Black Swan as a standalone novel, no shared characters or setting), so the fictions are separate. Whole-author
  check: no other Lackey book shares this world. Slavic myth fantasy fits by its definition (firebird, the retold folklore
  of the Slavic peoples). Tried: Redated fairytales (the tale keeps its Russia), Fairytale mythology. Sources: https://www.kirkusreviews.com/book-reviews/mercedes-lackey/firebird-2/
  ; http://www.bookloons.com/cgi-bin/Review.ASP?bookid=9044 ; https://tethyanbooks.blogspot.com/2011/10/review-firebird-by-mercedes-lackey.html'

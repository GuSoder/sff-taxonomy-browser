placement_rationale: 'Lauren Wiesebron''s The House of Frost and Feathers (Hodder, 2025; Hachette UK, Goodreads, Retellings.com,
  a review): Marisha, who has lost her family to a recurring sleeping plague, takes a job as apprentice to the notorious koldunya
  Baba Zima, whose house walks on chicken legs, and joins the rival apprentice Olena''s search for a cure; the retellings
  catalogue lists the original as Baba Yaga. Walk: Speculative fiction > Fantasy > Real earth fantasy > Mythic retelling >
  Slavic myth fantasy (seeded for this card on the curator''s approval, ). Rejected: Fairytale mythology (not one named tale
  grown into a cosmology), Fairytale transplant, Romantasy (the romance is not the spine on the blurbs), Invented fairytales
  (the sources are inherited). Wobble: medium, Fairytale mythology (Spinning Silver neighbour). Sources: Hachette UK, Goodreads,
  Retellings.com, one review; not read in full.'

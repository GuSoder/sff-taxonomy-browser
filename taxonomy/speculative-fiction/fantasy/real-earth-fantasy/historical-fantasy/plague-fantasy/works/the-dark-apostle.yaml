placement_rationale: 'Root-down walk 2026-10-15: Speculative fiction -> Fantasy -> Real earth fantasy
  -> Historical fantasy -> Plague fantasy: the Dark Apostle series is a magical reimagining of
  14th-century England in which a necromancer barber-surgeon moves through plague, church and crown;
  the publisher runs ''prayer and plague'' through the series and book five opens Winter 1348 with
  plague ravaging Europe and necromancers'' power growing with every death. The plague years are the
  recurring stage, necromancy the engine. Sources: Penguin Random House, author site.'


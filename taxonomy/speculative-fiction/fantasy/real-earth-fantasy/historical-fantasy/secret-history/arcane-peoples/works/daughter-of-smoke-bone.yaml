placement_rationale: 'Laini Taylor''s Daughter of Smoke & Bone (2011; Daughter of Smoke and Bone trilogy: Days of Blood &
  Starlight 2012, Dreams of Gods & Monsters 2014; companion Night of Cake & Puppets 2013 and its Booktrack edition, folded;
  Wikipedia, Kirkus, Hachette): Karou, a blue-haired art student in Prague raised by chimaera, is pulled into the war between
  the chimaera and the angels (seraphim); Karou is a chimaera resurrected into a human body. One universe, one fiction. Walk:
  Real-earth fantasy > Secret history > Arcane peoples (a concealed people living beside humanity). Weak: later books move
  to the invented world of Eretz; alternative Mythic power struggle (angels vs chimaera). Sources: Wikipedia, Kirkus, Hachette;
  not read.'

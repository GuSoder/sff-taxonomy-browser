placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Historical fantasy > Secret history
  > Arcane peoples. Thomas the Rhymer, the twelfth-century figure of Scottish balladry, becomes near-immortal and shape-changing
  after he escapes the Yvag, an alien race thought to be elves and faeries who steal people, skinwalk into positions of power
  and mean to take the world, and fights them through the centuries as Tam Lin, Robin Hood and others; Rhymer: Hel carries
  the war into Elizabeth I''s England under Walsingham (Baen pages for both books; ISFDB title 3174162, Rhymer Trilogy). A
  concealed people living beside humanity through recorded history, with the hero''s one-man war against it, is the leaf''s
  definition. Rejected: Northern Renaissance fantasy (only the second book is Elizabethan, the series spans centuries), Occult
  cabals (the hidden hand is a people), Perilous fairy doors (the book is not a crossing into Faerie). Wobble: strong; the
  Yvag are billed as alien, and the series is also a historical adventure. Sources: Baen pages only. Years: Rhymer 2023, Rhymer:
  Hel 2025 (the queue showed 2020).'

placement_rationale: John Joseph Adams identifies a connected three-novel Diabolist's Library sequence spanning Victorian
  London, Prohibition Long Island and World War II Britain. Hidden diabolists, demons and occult institutions operate behind
  each documented era; the final novel makes the secret magical war explicit through Nazi diabolists, a demonic superweapon
  and the occult Library. Hidden magic intertwined with recorded history makes Secret history closest.

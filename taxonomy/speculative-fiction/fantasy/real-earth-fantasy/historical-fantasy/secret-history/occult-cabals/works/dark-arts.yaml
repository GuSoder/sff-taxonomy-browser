placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Historical fantasy > Secret history
  > Occult cabals. The author calls Dark Arts "secret-history fantasy set against the international geopolitics of the mid-
  to late twentieth century" (midnightfront.com/the-series/); Tor describes Nazi sorcerers against the Allies'' top-secret
  magickal warfare program, the Midnight Front, led by Cade Martin (torpublishinggroup.com/the-midnight-front). Hidden orders
  and programs contest recorded events: Occult cabals (a hand behind events). Rejected: WWII fantasy (the series runs past
  the war era and the war is not its only stage), Arcane peoples (no hidden people), Untold magic (no single movement). Sources
  read: author site and Tor page, not the novels.'

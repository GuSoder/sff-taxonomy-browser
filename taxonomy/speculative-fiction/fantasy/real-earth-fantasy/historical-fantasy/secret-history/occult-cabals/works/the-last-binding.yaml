placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Historical fantasy > Secret history
  > Occult cabals. Per the author''s site, Tor and the series wiki: Edwardian England, September 1908, where baronet Robin
  Blyth is named civil-service liaison to a hidden magical society and is drawn into its contracts and conspiracies; the trilogy
  follows the hidden order and a plot that steers events behind the recorded world (A Marvellous Light, A Restless Truth,
  A Power Unbound). Hidden orders working behind events is the Occult cabals definition. Rejected: Untold magic (no real historical
  movement or event is the frame), Posh fantasy and Courtship fantasy (the romance is a thread, the conspiracy is the engine),
  Bowler hat fantasy (American 1900-1929). Wobble: the queer romance is half the appeal. One fiction, three books (rule 11j).
  Years from first publication (Tordotcom 2021, 2022, 2023).'

placement_rationale: 'Full root-down walk: Fantasy (magic is real and open to the reader: Druidical hermits, the Horned One,
  Joan''s visions and the pagan power of kings; Booklist: ''a superbly realized magical world'') > Real earth fantasy (real
  15th-century France, the Hundred Years'' War, the documented Joan of Arc) > Historical fantasy > Secret history (not Alternate-history
  fantasy - documented history is not rewritten, Joan burns on schedule; not Gaslight - 15th century; not Period fantasy -
  that umbrella splits antique vs industrial-age and neither covers medieval; not Pulp fantasy. Secret history fits: documented
  history is secretly explained by a hidden magical truth - Joan''s voices and destiny as Merlin-prophesied pagan practice
  beneath the Christian surface - and secrecy itself is a main theme: the pagan subtext hidden in tapestries and Night Battles;
  Booklist ''magical historical realism'', PW ''the paganism lurking beneath the Christian surface''). One universe fiction
  per rule 11j (ISFDB series: Joan of Arc Tapestries); volume 3, Gloria (2005), folds on if it surfaces. Tor first editions
  1999 and 2001 (ISFDB, PW).'

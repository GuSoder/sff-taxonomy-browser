placement_rationale: 'Standalone novel (2010). Ig Perrish wakes with devil''s horns that make everyone voice their darkest
  thoughts and seek his blessing for atrocities; Satan and God work through earthly pawns as he hunts his murdered girlfriend''s
  killer (NYT: ''hellbent on using every devil reference it can''; Reactor: ''God and Satan against each other through their
  earthly pawns''; PopMatters: satanic horror, ''sympathy for the devil''). Contemporary dark fantasy on recognizable Earth;
  torment shape (the diabolic power pursues and transforms Ig specifically, not a place), and the engine is explicitly Satanic
  - horns, pitchfork, serpents, the devil''s free-will bargain - matching tenants Rosemary''s Baby and The Master and Margarita.
  Rejected: demonic-torment (generic demon attachment; here the whole iconography and theology is Satan), horror-fantasy (no
  menacing place), urban-fantasy (no hidden supernatural society).'

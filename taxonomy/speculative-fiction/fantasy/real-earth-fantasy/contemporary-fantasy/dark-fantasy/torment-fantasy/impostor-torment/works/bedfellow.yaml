placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Dark
  fantasy > Torment fantasy > Impostor torment. One standalone novel2018. Nonhuman Marv enters the Lund household
  and rewrites shared memories to become rescuer, friend, uncle and twin brother, exploiting trusted belonging and
  private vulnerabilities. Control follows the family outside the house, including school; not a house-bound haunting.
  His miracleworker and family-god roles do not establish an ancient god. Author calls him a new monster; full critic
  sources leave his nature unexplained, so no demon, Satanic identity, ancient prehuman race or past-wrong vengeance
  invented. The whole story includes helper avatars, Hendrick dying and Imani/children escaping; the monster origin
  remains uncertain. Domestic fantasy loses because household magic is not inherited or tied to a place; invented
  myth loses because no developed cosmology; magical realism loses because intrusive contested mind control is not
  accepted ordinary marvel. SF Psi, creature feature and alien infiltration lose because no science/psychic, biological
  or extraterrestrial explanation is established. Strong root/parent fit, moderate-high new positive mechanism fit,
  unknown entity nature explicitly preserved. Adult novel eligibility: current publisher says novel, ISFDB NOVEL,
  author50k+manuscript and RocketStackRank46,934words; reviewer novella labels retained as conflicting shorthand,
  not blanket exception. Seed approved phonemsg-01M6630QDARAFTFE44N306K0K6 answering exact proposal phonemsg-01M661Z81ADYZE3828EEWSCZKZ.
  Only this new child and Bedfellow; existing siblings unchanged.'

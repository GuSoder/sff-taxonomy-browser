definition: Torment fantasy where a nonhuman intruder makes itself a trusted person, relative or intimate companion
  and uses that false belonging to control and prey on particular people. Includes insertion of false shared memories,
  not only literal replacement. Not Elder god torment when an ancient god is the established identity; not Satanic
  torment when Satan or his cults and bargains drive the pursuit; not Primordial torment when an ancient prehuman
  species or multigenerational shapeshifter hunt is established; not Demonic torment when the entity is established
  as a demon; not Vengeance torment when a past wrong causes the pursuit. Not a place-bound haunting, inherited
  household magic or a scientifically established alien/body-snatcher invasion.

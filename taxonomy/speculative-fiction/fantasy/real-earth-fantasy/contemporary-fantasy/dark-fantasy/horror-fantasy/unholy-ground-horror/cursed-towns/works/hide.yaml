placement_rationale: 'Del Rey, May 2022 (queue year 2023 is a reissue). Fourteen desperate contestants are bussed to Asterion,
  a town whose amusement park has been closed since a little girl vanished decades ago, to play a hide-and-seek contest for
  $50,000. A hidden journal reveals the truth: the town''s founding families made a blood pact trading lives for prosperity,
  and every seven years the park becomes a hunting ground where the families feed the beast (Kirkus; SuperSummary). The curse
  is worked into the community''s ground and the settlement feeds on those who arrive: cursed-towns. Walk: Fantasy > Real
  Earth fantasy > Contemporary fantasy > Dark fantasy > Horror fantasy > Unholy ground horror > Cursed towns. Tried: Unholy
  halls (the park is open hunting-ground, not a building), Folk horror (the rite is background machinery; the beast in the
  ground is the engine - ground as engine stays down). Wobble: low-moderate.'

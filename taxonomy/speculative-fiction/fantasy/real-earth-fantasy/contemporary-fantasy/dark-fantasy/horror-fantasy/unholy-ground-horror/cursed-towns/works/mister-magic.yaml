placement_rationale: 'Del Rey, August 2023 (queue year 2024 is a reissue). Thirty years after the children''s TV show Mister
  Magic ended in an on-set accident, with no record of it surviving anywhere, reclusive former cast member Val rejoins the
  Circle of Friends for a reunion podcast and finds the town of Bliss has spent decades sending its problematic children through
  a dimensional rift to an entity that feeds on them, the adults holding a standing deal with it (Wikipedia plot; SuperSummary).
  A settlement that turns on its own children with the curse worked into its ground: cursed-towns. Walk: Fantasy > Real Earth
  fantasy > Contemporary fantasy > Dark fantasy > Horror fantasy > Unholy ground horror > Cursed towns. Tried: Unholy halls
  (no single haunted building), Folk horror (the entity is real and place-bound, not the belief itself). Wobble: low-moderate;
  the media-creepypasta frame is dressing.'

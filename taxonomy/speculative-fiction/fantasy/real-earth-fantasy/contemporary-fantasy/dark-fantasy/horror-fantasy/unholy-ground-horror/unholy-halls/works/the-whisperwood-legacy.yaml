placement_rationale: 'YA contemporary fantasy-horror: a shuttered Appalachian theme park built on the family''s invented German-heritage
  fairy tales, whose stories prove real and deadly when the matriarch vanishes. Engine is the place: an unholy power dwells
  and waits in Whisperwood''s rides and wooded grounds (Locus: ''an abandoned theme park is one of the best settings for monster
  stories''; Kirkus: ''stories really do have power - and can hold danger''). Invented-within-fiction tales (an ancestor wrote
  them) evoke The Hazel Wood, but the fantasy-realms ancestor gate (''Imaginary-world fantasy'') bars invented-fairytales
  for a real-Earth contemporary setting. Folk horror rejected (no rite-performing community), cursed towns rejected (not a
  settlement), haunted wilds rejected (the anchor is the built park, not wilderness), torment rejected (the menace waits in
  place). Descriptive friction disclosed: unholy-halls says ''a building''; a theme park is built grounds plus attractions,
  same built-venue family as its hotels/schools/citadels.'

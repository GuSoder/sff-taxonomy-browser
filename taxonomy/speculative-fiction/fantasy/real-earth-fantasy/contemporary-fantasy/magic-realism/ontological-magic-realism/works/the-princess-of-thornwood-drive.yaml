placement_rationale: 'Debut novel (Forever, Nov 7 2023, trade paper ISBN 978-1-5387-2526-9). Two sisters trapped on opposite
  sides of reality: Laine in contemporary Lake Forest fights predatory banks and the day center caring for her sister, while
  Alyssa - comatose and nonverbal since the car crash that killed their parents - lives as the princess of the fairy-tale
  kingdom Mirendal, under a curse that keeps her from communicating, and everything she experiences corresponds to events
  in the real world (publisher copy; Kirkus). The book deliberately never settles which reality is real - reviewers shelve
  it as fantasy that makes you question what is real - so both levels stay equally present and unstable, the ontological gate.
  Walk: Fantasy > Real Earth fantasy > Contemporary fantasy > Magic realism > Ontological magic realism. Tried: Visionary
  minds (the coma partitions the realities but the Mirendal strand is narrated as full fantasy, not one mind''s breakdown;
  correspondences cut both ways), Whimsical doors (nobody walks through a door; the worlds never physically mix). Wobble:
  moderate - if the coma frame is read as ruling the ontology, Visionary minds claims it.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Magic realism >
  Ontological magic realism. In present-day Baltimore, the Fellowship of the Anointed raised Lark to wield magic against
  monsters beyond the warded gates; the FBI raid calls it a cult, and the novel holds both realities open - Kirkus:
  "leaving it up to the reader to decide if the curious events that occur are the product of magic, delusion, or some
  murky place that draws from both possibilities" (compared to It Happened in Boston? and Somewhere in Time). Competing
  levels of reality are equally present and unstable: the gate word for word. Precedent inside the leaf: The Chosen One
  (Echo Brown''s maybe-magic). Urban fantasy rejected: the magic is never confirmed real, and the contested reality IS
  the engine. Wobble disclosed: if a reader settles the ambiguity toward delusion the book slides toward non-spec;
  the contested-reality engine governs the fit.'

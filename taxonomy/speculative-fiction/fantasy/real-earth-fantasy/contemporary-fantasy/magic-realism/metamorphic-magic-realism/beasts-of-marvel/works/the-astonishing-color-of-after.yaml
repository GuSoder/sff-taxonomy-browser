placement_rationale: 'Root-down: Fantasy -> Real earth fantasy -> Magic realism -> Metamorphic magic
  realism. Hachette grounds an otherwise ordinary contemporary family/grief story in which Leigh is certain
  her dead mother transformed into a bird; she travels to Taiwan and follows the bird while chasing ghosts
  and family memory. The impossible bodily transformation accepted into lived reality is the governing
  device.'

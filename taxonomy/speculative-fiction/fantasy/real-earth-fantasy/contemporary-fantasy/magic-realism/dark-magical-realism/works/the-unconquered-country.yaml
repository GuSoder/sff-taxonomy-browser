placement_rationale: Third Child rents her womb to incubate industrial machinery ('cheaper than the glass tanks') under an
  occupation erasing her nation's living, organic culture; spirit passage closes the book. The marvelous accepted as ordinary
  - but the ordinary is the national wound. Seed card for the Dark magical realism leaf the curator created (LA Times 'optimum
  balance between magic and realism'; Kirkus 'allegorical dark fantasy').

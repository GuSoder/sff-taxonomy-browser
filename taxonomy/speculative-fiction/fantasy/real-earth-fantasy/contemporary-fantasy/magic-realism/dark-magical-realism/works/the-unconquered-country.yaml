  reason: 'Magical-realism audit walk, 2026-10-14 (setting-flagged ''weak past-set''): stays in Dark magical realism. The
    setting is an unnamed invented country - a transfigured Cambodia analogue of the Pol Pot era and occupation - written
    1982/1984 as a contemporary response (BSFA and World Fantasy awards), not real-earth period fiction, and the tree holds
    no 1945-1980 era leaf (Cold War seed declined). Fantasy proof is pervasive and literal: living loyal stilt houses, billboard
    figures that detach at night to sing jingles, womb-incubated industrial products and weapons, and the closing spirit-world
    passage. Sources: https://www.ebsco.com/research-starters/literature-and-writing/unconquered-country-geoff-ryman/ , https://sf-encyclopedia.com/entry/ryman_geoff
    .'

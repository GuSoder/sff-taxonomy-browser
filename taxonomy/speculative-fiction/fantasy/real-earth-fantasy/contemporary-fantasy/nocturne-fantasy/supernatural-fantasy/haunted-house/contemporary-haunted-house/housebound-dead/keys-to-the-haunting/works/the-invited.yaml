placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Supernatural
  fantasy -> Ghost stories -> Haunted House -> Contemporary haunted house. Penguin Random House explicitly calls it a ghost
  story in which a couple build a haunted house; salvaged materials and the land’s violent history make the new home a place
  of menace and unfinished business. The place/building is the haunting engine.'

placement_rationale: 'Piers Anthony''s seven-book Incarnations of Immortality (On a Pale Horse to And Eternity): in an Earth
  where magic and science coexist, a mortal takes up each cosmic office - Death, Time, Fate, War, Nature, Evil, Good - and
  the story follows the office-holder through Purgatory, Heaven and Hell as souls are weighed. Root-down: Fantasy -> Real
  earth fantasy -> Nocturne fantasy -> Supernatural fantasy; death and the afterlife are rendered as a strange working reality,
  so Surreal afterlife.'

placement_note: SFE calls Pincher Martin 'as much sf as An Occurrence at Owl Creek Bridge' - a castaway clinging to a rock whose 'survival' the ending reveals as 'no more than a last flicker of pre-purgatorial consciousness'. Death and disembodied existence rendered as a strange dreamlike reality; surreal afterlife. Shelfmates The Third Policeman and How the Dead Live.

placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Supernatural fantasy -> Ghost stories -> Haunted objects.
  Night-shift workers at a Korean institute guard everyday objects carrying ghostly histories of trauma, grief and vengeance. Handkerchief, stolen shoe, ghost cat
  and dead experimental sheep carry active supernatural agency; the institute is the frame and refuge, not the magic-working engine. The author calls ordinary objects
  haunted rather than magical; Locus confirms purposeful returning dead. Curator original iMessage 2026-09-30 11:58:45: "Fine, execute", answering Haunted objects
  under Ghost stories.'

placement_rationale: 'A Gothic mansion run as a retirement home where an unexplained phenomenon turns the elderly residents
  into monsters and the building becomes a battleground; the menace dwells in the institutional building, not in a family
  ghost or a single dead person. First published 2015 (Hydra); the 2026 Del Rey edition is a reissue. Walked root-down: Fantasy
  -> Real earth fantasy -> Nocturne fantasy -> Dark fantasy -> Horror fantasy -> Unholy ground horror -> Unholy halls (not
  Haunted house: nothing dead is bound to the place; not Cursed towns).'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Earth-rooted fantasy > Nocturne fantasy > Dark fantasy >
  Horror fantasy > Unholy ground horror > Haunted wilds. Grand Central, 2019 (the Gollancz row is a 2024 UK edition; the queue
  author ''Events'' is a scrape error, author verified on the Hachette page). Christopher, seven, walks into the Mission Street
  Woods after a face in a cloud and is missing six days; the Nice Man in the woods rewards him and then demands a treehouse
  on the old tree, and the Hissing Lady pursues him and his mother. The menace lives in the woods and waits for those who
  stray in, which is the Haunted wilds definition. Rejected: Primordial torment and Vengeance torment (the entities pursue
  Christopher, but the woods are their ground and the book is built round them), Cursed towns (the town is the victim, the
  wood is the source), Supernatural fantasy''s Ghost stories (not a dead person''s return). Wobble: Primordial torment is
  the second-closest leaf.'

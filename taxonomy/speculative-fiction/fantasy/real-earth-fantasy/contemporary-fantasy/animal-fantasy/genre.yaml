definition: 'Fables: animal tales in the Aesop-to-Orwell tradition - fantasy that renders the inner life, society, and mythology
  of animals on their own terms, lightly anthropomorphized. The Encyclopedia of Fantasy treats animal fantasy as a distinct
  form; Watership Down''s rabbit society is its modern exemplar. Not Fairytale fantasy (human wonder-tales retold), not Contemporary
  magical realism (the marvelous accepted inside ordinary human life).'

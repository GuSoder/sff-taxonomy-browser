definition: 'Fantasy set in the present-day world or outside any past era: contemporary fantasy proper (the Encyclopedia of
  Fantasy''s ''Contemporary Fantasy'' category; Crowley''s Little, Big is its exemplar) plus the Earth-rooted fantasy that
  is not historical - the nocturne, urban, magic realist, comic and animal branches. Not Historical fantasy (a real past era
  or retold past myth).'

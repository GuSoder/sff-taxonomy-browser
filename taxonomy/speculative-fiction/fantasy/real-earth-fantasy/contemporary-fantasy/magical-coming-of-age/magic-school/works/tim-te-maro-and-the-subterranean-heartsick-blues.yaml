placement_rationale: 'Root-down: Fantasy -> Real earth -> Contemporary -> Magical coming-of-age -> Magic school. At New Zealand''s Fox Glacier High School for the
  Magically Adept, Tim and Elliott develop their relationship and identity through a formal class assignment caring for an enchanted egg that responds to their emotions.
  Magical school life provides the narrative structure, not an inherited-magic awakening or household fantasy. The real-Earth contemporary gate rejects secondary-world
  Romantasy despite romance being the emotional spine.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Magical coming-of-age
  > Magic school. The author''s own pitch: dark-academia urban fantasy, ''Buffy goes to the spooky Yale school of Ninth House
  with the combat college of Fourth Wing'' (castro.fm interview); Astera is a reimagined New York City (same interview), so
  the Real-earth branch governs and the secondary-world Romantasy leaves are out despite the strong demon-hunter/demon romance.
  The series is named for and famous as Harker Academy for Deviant Defense: Viv Abbot, 21, is recruited into the hunter college,
  develops her Aeon second sight through formal instruction, classes and school life (book 1 is her first year; book 2 her
  second semester, still anchored in the school''s archives, dean and students), while the syrabraxa event forges her identity
  - the Magic school definition, in the band already set by The Whispering Dark (university program teaching the craft) and
  The Incandescent (adult POV). Rejected: Occult orders (Ninth House''s slot - an initiatory secret society, not a school
  with courses and semesters), Demon counter-ops / Demon cop (Viv is no service or police operative; the academy trains her),
  the Romantasy subtree (secondary-world gate; this is reimagined NYC). Trilogy: Half City and Cursed City published 2026
  (Ace); book 3 Infernal City announced for Jul 20, 2027 (Penguin Random House) - card folds the series, published volumes
  listed.'

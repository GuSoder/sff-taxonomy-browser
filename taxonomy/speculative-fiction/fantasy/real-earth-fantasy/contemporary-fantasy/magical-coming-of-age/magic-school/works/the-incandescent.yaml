placement_rationale: 'Present-day England: Dr Walden, Director of Magic at the centuries-old Chetwood boarding school, teaches
  A-Level Invocation to four Year Thirteen pupils and holds off demons (Locus; Reactor: ''a magic school story that''s about
  kids''; Strange Horizons on her charges'' in-between state; Bookpage). Teacher is the lens, but the story follows young
  people developing their craft: the school is the guardian of the few young people who cannot help but do magic, and foster
  ward Nikki Conway is the primary student thread, so Magical coming-of-age fits. Curator''s original instruction (phonemsg-01M37W82AE5DN0NGRM4DZNG4N8,
  2026-09-23 21:35, ''could be grouped with Harry Potter?''; phonemsg-01M37WG5K31DBR71CV21PQQ7SA, 21:39: ''Put it in contemporary
  for now, keep magic school in mind for later'') grouped it with Harry Potter and banked Magic school as its leaf; Magic
  school was then created and this is its seed fiction, a standing member and not a temporary exemption. Sources: https://locusmag.com/review/the-incandescent-by-emily-tesh-review-by-liz-bourke/
  ; https://reactormag.com/book-review-the-incandescent-by-emily-tesh/ ; https://www.bookpage.com/reviews/incandescent-emily-tesh-book-review/
  .'

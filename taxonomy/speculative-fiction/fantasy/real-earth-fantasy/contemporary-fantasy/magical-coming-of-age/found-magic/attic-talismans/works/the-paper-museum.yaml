placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Magical coming-of-age
  > Found magic > Attic talismans. Twelve-year-old Lydia stumbles into the magic a place conceals: the Paper Museum, last
  home of books in a world where paper is obsolete, hides a chamber, a well and a magical book that holds the answer to her
  parents'' disappearance - the story is learning what the found place opens, the Attic talismans definition exactly (a thing
  or place carries the magic in). Not Awoken powers (the power sits in the museum and its essence, not in her). World vagueness
  handled by the Lucid precedent (near-future Birmingham): the book never names its world, only ''the world has changed''
  (ReadPlus), a near-future-flavored Earth, and middle-grade audience does not bear on placement. Standalone debut (Kirkus;
  author''s own books page lists no other novels), 2022, Union Square Kids.'

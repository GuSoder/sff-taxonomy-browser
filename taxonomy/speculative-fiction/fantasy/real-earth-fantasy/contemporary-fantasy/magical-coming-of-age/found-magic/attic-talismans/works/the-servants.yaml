placement_rationale: 'Path: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Magical coming-of-age
  > Found magic > Attic talismans. Eleven-year-old Mark moves to a Brighton townhouse with his sick mother and hated stepfather
  and stumbles into the old servants'' quarters, where long-dead servants still work and their world is falling apart in step
  with his mother''s illness; if he can help them he may save her (Publishers Weekly starred review 2007, Earthling Publications).
  A 224-page novel, 2007. The magic is a place he comes across and learns what it asks of him, so Attic talismans. Rivals
  rejected: Magic house fantasy (the house is bought, not inherited), Haunted house (the dead are not the menace, the book
  is a child''s parable), Awoken powers (nothing wakes in Mark), Ontological magic realism. Wobble: the servants are the dead
  and the setting is a house, which leans Haunted house.'

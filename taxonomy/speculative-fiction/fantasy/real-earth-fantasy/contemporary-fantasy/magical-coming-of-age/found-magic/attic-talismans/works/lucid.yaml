  the author as "Great Britain", corrected from the Gollancz and Hachette pages): Joe Jacobs, a teenager in near-future Birmingham,
  receives an unsent birthday gift, a dreamcatcher inscribed "We Are Such Stuff As Dreams Are Made On", then has dark visions
  that match a murder case near his detective mother''s work, and he and his friends are dragged in (SFFWorld https://www.sffworld.com/2025/08/lucid-by-oraine-johnson/;
  Hachette https://www.hachette.co.uk/titles/oraine-johnson/lucid/9781399610186/; Gollancz https://store.gollancz.co.uk/products/lucid).
  The magic comes in with an object he did not seek and is developed with friends: Found magic, through a thing. Rejected:
  Detective fantasy (office and duty; Joe is a teenager drawn in), Magic school, Birthright magic (an orphan, no bloodline),
  Surreal afterlife, Awoken powers (the dreamcatcher is the trigger). Wobble: low to moderate; it is also a crime story and
  the sources are a review and publisher copy.'

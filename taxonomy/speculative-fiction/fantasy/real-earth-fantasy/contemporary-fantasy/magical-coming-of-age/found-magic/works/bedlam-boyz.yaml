placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Magical coming-of-age
  > Found magic. Per the Baen blurb and two reviews: in present-day Los Angeles a teenage girl, Kayla, discovers a latent
  power to heal when a friend is shot, and healing both him and the gang member who shot him makes the city''s gangs, a pack
  of drug-dealing elves and social workers all want a piece of her; she works out her talent and her life among street friends.
  The magic is stumbled into, an erupting talent developed informally with friends, which is the Found magic definition. Rejected:
  Fae founders (the leaf was at 9; the elves are antagonists in the gang plot, Kayla is not of Faerie and no court or bargain
  shapes the city), Wildblood (no creature bloodline wakes in her, only a talent), Magic school (nobody teaches her). Wobble:
  the elves and the Bedlam''s Bard prequel frame could pull toward Fae founders; the story is hers, not theirs. Published
  April 1993 (Baen); the queue''s Second Edition is the 2012 reissue.'

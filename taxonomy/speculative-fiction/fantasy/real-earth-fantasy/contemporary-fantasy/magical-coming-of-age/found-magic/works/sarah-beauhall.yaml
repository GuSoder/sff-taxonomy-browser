placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Magical coming-of-age
  > Found magic. Sarah Beauhall, a young Seattle blacksmith, prop maker and re-enactor, repairs a broken sword that turns
  out to be magic, learns that a dwarf, secretive dragons and a hidden magical world have been beside her all along, and works
  out her own craft with friends and a smithing mentor (japitts.net, Black Blade Blues; Publishers Weekly, Honeyed Words).
  The magic is stumbled into through an artifact and developed informally, which is Found magic''s definition. Rejected: Arcane
  peoples (the concealed dragons are the world around her, but her discovery and craft drive the story), Occult consultants
  and the other occult-police leaves (no case-taking frame). Wobble: moderate, since Sarah is a twenty-something, not a teenager,
  and the dragon war grows bigger in book two. Series card, rule 11j: Black Blade Blues 2010, Honeyed Words 2011 (Open Library
  and Publishers Weekly).'

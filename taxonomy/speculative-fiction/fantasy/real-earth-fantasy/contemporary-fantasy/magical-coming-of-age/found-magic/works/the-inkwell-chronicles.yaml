placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Magical coming-of-age
  > Found magic. J. D. Peabody''s middle-grade series is one shared world, so one card: after their father vanishes in a train
  crash, Everett and his little sister Bea find a pen in his things whose magical Ink pulls them into a hidden world and a
  secret society, the Inklings, who guard the world''s dwindling supply of magic Ink; later books chase the miraculous new
  Inkanto ink around the world (author''s page; Hachette blurbs for Books 1 and 2). Magic is stumbled into through an artifact
  and developed informally with friends, the leaf''s definition. Rejected: Secret history leaves (the hidden truth is a society,
  but the series is about the children''s coming-of-age through the artifact, not a hidden hand behind recorded events), Wainscot
  and other otherworld leaves (the children do not cross into a second world; the hidden one lies inside ours), Magic school
  (nothing is taught in a school). Wobble: moderate. Blurbs only, no text read; the Inkling society side would also suit a
  Secret history shelf, so if that branch is later reshaped this card is a candidate to re-walk. Covers: the card uses the
  Book 1 audiobook cover (square) from Open Library; Book 3 uses the author''s site image; Book 2 has no verified cover (the
  site''s Book 2 image shows an underwater scene under an Ink of Elspet subtitle, so I left it out). Years: Open Library gives
  2022 for the series entry; Book 2 is listed 2023 by Hachette (queue has no years). Queue ids MC04003, MC04002, MC04001.'

placement_rationale: 'Root-down walk: set in present-day Chicago, so Real-earth fantasy; Contemporary fantasy; Magical coming-of-age.
  Sources (Penguin Random House series pages for the Dark Elite and Hexbound, via web search): Lily Parker is new at St. Sophia''s
  School for Girls in Chicago and has to learn to control her newly discovered paranormal abilities, fighting with her roommate
  Scout and a group of rebel teens who defend Chicago against vampires, demons and the corrupted magic users known as Reapers;
  in Charmfall her firespell fails when a Reaper crashes the party prep. The power wakes in the girl herself and a teen band
  forms around it, so Awoken powers, not Magic school (the school is the setting; the craft is not taught there, the rebel
  group is where she learns) and not Birthright magic (no bloodline is claimed in the sources I read). Wobble: Magic school
  is the alternative if later books make St. Sophia''s the teacher. Same author as Chicagoland Vampires but a separate world
  (that series is a shared-universe fold only for its own books). Years: Firespell 5 Jan 2010 (PRH), Hexbound 4 Jan 2011 (isfdb),
  Charmfall 3 Jan 2012 (Amazon listing).'

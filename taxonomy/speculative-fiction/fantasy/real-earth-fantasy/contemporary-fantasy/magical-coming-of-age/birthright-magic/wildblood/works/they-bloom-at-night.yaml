placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Contemporary fantasy -> Magical coming-of-age
  -> Birthright magic. Near-future Mercy, Louisiana, and its red algae/body horror are organized around Noon claiming a changed
  body, gender selfhood and family-linked Vietnamese water-deity heritage. Author interviews explicitly blend the supernatural
  and describe the family''s guardian deity tradition; Locus says the family water-spirit myth proves truer than expected.
  The curator chose Birthright magic after asking whether that guardian is central: the inherited heritage/guardian connection,
  rather than a verified genetic ability, is this leaf''s edge. Timing caveat: reviewers call the setting near-future without
  a precise calendar date or quantified offset, so Contemporary''s present-day wording is a curator-accepted stretch; no source
  establishes ''months''. Mother''s reincarnation belief alone does not prove relatives literally reincarnate. Full horror-place
  alternate: Real earth -> Nocturne -> Dark -> Horror -> Unholy ground -> Cursed towns or Haunted wilds; those fit ecology
  but calling the liberating spirit an unholy curse stretches the engine. Elder god torment is less apt because the deity
  is not chiefly a persecutor. No inherited named-myth retelling, urban institutional engine, ordinary accepted magic-realism,
  portal or invented realm. Coming-of-age siblings: Magic school fails no institution; Found magic loses to the curator''s
  family-heritage hearing. Root Fantasy, not purely biological SF mutation.'
placement_walk: Speculative fiction {Fantasy, Science fiction} -> Fantasy {Real earth fantasy, Fantasy realms, Portal fantasy}
  -> Real earth fantasy {Animal fantasy, Contemporary fantasy, Historical fantasy, Magic realism, Mythic retelling, Nocturne

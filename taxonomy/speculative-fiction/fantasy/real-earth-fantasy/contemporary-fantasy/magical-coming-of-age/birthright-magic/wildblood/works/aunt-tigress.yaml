placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Magical coming
  of age > Birthright magic > Wildblood. Per Kirkus and Penguin Random House: Tamara Lin, a young woman whose tiger bloodline
  came from her father and his sister, Aunt Tigress, who brought it from China to Canada, has severed her mystical bond with
  her aunt and tried to live as human; when Aunt Tigress is found murdered and a creature stalks her, Tam must embrace the
  tiger in her to avert an apocalypse. The nature she carries is a creature bloodline and the story turns on its waking: the
  Wildblood definition. Rejected: Modern Chinese myth (that leaf holds Chinese myth figures like Chang''e and Houyi, not an
  immigrant tiger family), Mageblood and Witchblood (craft or witch lineages), Occult consultants (the murder is the way in,
  not the engine). Wobble: the Tam Lin ballad and First Nations powers in the plot widen the folklore far past the leaf''s
  bloodline core. Year per Kirkus, 18 Mar 2025.'

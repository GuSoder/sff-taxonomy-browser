placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Magical coming-of-age
  > Birthright magic > Witchblood. Sequel to The Hawkweed Prophecy: Poppy Hawkweed, a young witch of the Hawkweed coven, is
  discovering a purpose for her powers in Africa while haunted by a vision of her own death; a boy and his healer great-grandmother
  take her in (Hachette; Kirkus 2017). The inheritance is a witch family''s craft and a witch queen''s legacy that the young
  protagonist is born into and struggles with, which is Witchblood''s definition. Rejected: Wildblood (the gift is craft,
  not a creature nature), Magic family fantasy (the ties are not the story, the coven legacy and the choice between love and
  magic are). Wobble: moderate, since the first book is not in the queue and this is a sequel standing alone; the card carries
  only the Legacy. First published Aug 15 2017 (Kirkus).'

placement_rationale: 'Root-down: Speculative fiction > Fantasy (the Caster world: Light and Dark Casters, Seers, Incubi, real
  magic in an otherwise ordinary town) > Real earth fantasy (Gatlin, South Carolina) > Contemporary fantasy (present-day setting
  of the 2009-2015 novels) > Magical coming-of-age (the engine is Lena Duchannes'' sixteenth birthday, when her powers will
  be Claimed for Light or Dark) > Birthright magic (Caster power is inherited blood: the Duchannes and Ravenwood family legacies,
  covens and councils she is born into and struggles against) > Witchblood (the inheritance is a witch family''s craft: spellwork,
  the Claiming, the great Caster families). One card for the whole shared universe (rule 11j): the four Caster Chronicles
  novels plus the Dangerous Creatures spinoff novels (Link and Ridley in New York), verified complete against the current
  isfdb records (series 27929 + the Garcia bibliography: 6 novels; the e-novellas Dream Dark, Dangerous Dream and the four
  Untold Stories are skipped short work). Soft: it is also the defining YA paranormal romance of its wave (Ethan and Lena''s
  romance is the frame), but no real-earth paranormal-romance branch exists and the walk follows the magic concept.'

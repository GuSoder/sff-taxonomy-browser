placement_rationale: 'Full root-down walk: Fantasy (working magic: matchmaker sight, sirens, fairies, a magical community)
  > Real earth fantasy (contemporary Chicago, not a secondary world) > Contemporary fantasy (present-day setting and voice;
  not Urban fantasy - no occult police, fae founders or paranormal-public frame, this is a teen life-with-magic story; not
  Nocturne - nothing dark) > Magical coming-of-age (Amber Sand is graduating high school, her powers on the fritz, identity,
  first love and an adult place in the world are the engine; publisher: ''romantic conclusion to the Windy City Magic trilogy'',
  Disney-Hyperion 2019) > Birthright magic (not Magic school - no academy; not Found magic - nothing stumbled into: Amber
  was born to her matchmaker sight in a magical family and has worked it half her life; inheriting and keeping her heritage
  is the story). Only volume 3, The Fairest Kind of Love (2019), is on the intake list; volumes 1-2 (The Best Kind of Magic,
  The Sweetest Kind of Fate) fold on if they surface. One universe fiction per rule 11j.'

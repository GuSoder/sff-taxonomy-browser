name: Body swap
definition: 'Contemporary fantasy in which a one-time magical event trades a person into someone else''s ordinary present-day
  life: the swapped life is the story''s site and the swap is the problem to survive or undo, the price never damnation. The
  magic is a premise lived inside, not an ability grown into; no mythic power is awake, and the household is not its site.'

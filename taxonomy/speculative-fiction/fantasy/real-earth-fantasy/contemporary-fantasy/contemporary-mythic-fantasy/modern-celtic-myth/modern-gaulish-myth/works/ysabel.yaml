placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Contemporary
  mythic fantasy > Modern Celtic myth > Modern Gaulish myth (seeded for this card). Kay, 2007: Ned Marriner, 15, in Aix-en-Provence
  with his photographer father, and an American exchange student, Kate, surprise a scarred man with a knife lifting a grate
  over the Roman paving in the cathedral and are drawn into a 2,500-year-old Celtic-and-Roman love triangle whose figures
  return around the Celtic night of April 30, when the border between the living and the dead is down (Penguin Random House,
  BrightWeavings). Rejected: Modern Albion myth (Britain''s powers, not Gaul), Modern Greek myth (Greeks only as the founders
  of Massalia), the other inherited-myth leaves, Modern invented myth (the myth is inherited, not invented), Ghost-sleuth
  and haunted-place leaves (the figures are mythic, not a haunting). Wobble: low; it is the book''s own engine and the leaf
  was seeded for it. Year 2007 (Penguin, Open Library). Cover is the English ''The past is never dead'' edition, seen. Queue
  id MC03607.'

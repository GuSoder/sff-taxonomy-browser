definition: Contemporary fantasy in which the Celtic and Roman powers of old Gaul - hill-fort kings, sacred nights, ancient
  rivalries under a Roman city - remain alive within ordinary present-day life, the continental side that Modern Albion myth
  leaves out.
status: provisional
ruling: 'Curator ruling ("Execute" phonemsg-01M4JS149E5JX87808WVW8DGAJ, 2026-10-10 1:26 PM CEST; shape agreed in phonemsg-01M4JS02JJ9488ZT8A3G4PE2AM):
  Modern Celtic myth is a new umbrella over Modern Albion myth (moved in unchanged, 7 cards) and the seeded Modern Gaulish
  myth (Ysabel). A flat Celtic leaf beside Albion was rejected because British myth is Celtic too and would be swallowed.
  Seeded for Ysabel (Kay, 2007).'

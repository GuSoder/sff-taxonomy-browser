placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Contemporary
  mythic fantasy > Modern Greek myth. Nera has spent her whole life in a lighthouse at the edge of present-day Chicago that
  guides her father as he ferries dead souls across Lake Michigan to the underworld; Charlie, a grieving Chicagoan who sees
  ghosts after her sister''s death, finds the place, and the two work to make sure the sister crossed over while a dark force
  threatens the city''s ghosts (Publishers Weekly review, 2025). Charon''s ferry and the underworld alive inside ordinary
  present-day Chicago is the leaf''s definition. Rejected: Surreal afterlife (the afterlife is a working myth, not a dreamlike
  state), Ghost speakers (Charlie''s gift is the entry, not the engine). Wobble: moderate, since Jewish tradition is woven
  in alongside Greek myth and the book is also a queer romance. First published 2025 by Tor (Publishers Weekly).'

placement_rationale: 'Lauren Palphreyman''s Cupid''s Match (Wattpad Books, 2019; PRH, author site): teenager Lila Black is
  hassled by the Cupids Matchmaking Service, which turns out to be run by real cupids; her true-love match is Cupid himself,
  and her ordinary world fills with crime-lord sirens, cupid hit men and the love god. Walk: Speculative fiction > Fantasy
  > Real earth fantasy > Contemporary fantasy (present day) > Contemporary mythic fantasy (myth active in ordinary life) >
  Modern Greek myth (Cupid/Eros and sirens). Rejected: Roman myth fantasy (retells Rome''s founding, not modern life), Urban
  fantasy leaves (the engine is the god, not a city''s hidden folk), Modern invented myth (the gods are inherited). Wobble:
  medium; Cupid is the Roman name, but the sirens and the Eros figure are Greek-rooted. YA. Sources: PRH and author-site descriptions.'

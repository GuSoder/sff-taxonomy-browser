placement_rationale: 'Lars Walker''s Wolf Time (1999; Baen, larswalker.com, Goodreads): an October north wind brings dark
  thoughts and bizarre dreams to the college town of Epsom, Minnesota, under a comet; a witch dreads it, a Norwegian poet
  greets it with triumph, and Professor Carl Martell, who cannot tell a lie, is the only one who can stop it - a reviewer
  calls it an eruption of Scandinavian myth into present-day life. Walk: Real-earth fantasy > Mythic retelling > Norse fantasy
  (Norse legendary material reworked, rather than the Viking Age as a setting). Weak: sources are thin on exactly which myths;
  alternative Arcane peoples or Occult institutions (a college campus). Sources: Baen, Goodreads reader review; not read.'

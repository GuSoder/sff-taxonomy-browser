placement_rationale: 'Ten-k walk (MC05093/MC05094). Whole fiction: the Oath of Fire series (Forever/Grand Central), two novels
  in one shared divine-Courts world: Oath of Fire (2024), a Psyche-and-Eros retelling set in present-day New York City - Library
  Journal: Psyche Dimitriou, a modern therapist, drawn into Eros''s Wine-Dark Court, ''set in New York City'' - and Daughter
  of the Hunt (2026), an Iphigenia-and-Artemis reimagining: Iphigenia Pelops surrendered under a family curse to Artemis,
  queen of the Court of the Wild (Hachette publisher copy). One series per publisher and Goodreads branding; the shared Courts
  world makes one fiction. Root-down: speculative fiction > fantasy (gods, divine courts, an inherited curse; LJ calls it
  urban fantasy with fae-esque elements) > real-earth-fantasy (anchored in present-day NYC and the mortal Pelops family, not
  an invented realm) > contemporary-fantasy (present-day, not heroic-age) > contemporary-mythic-fantasy > modern-european-myth
  > modern-greek-myth: the powers and bloodlines of Greek myth remain active within ordinary present-day life - Eros''s and
  Artemis''s courts and the Pelops curse operating among modern mortals. Not greek-god-fantasy (historical-fantasy > mythic-retelling:
  heroic-age retellings like Circe; this series is present-day). Not romantasy: romance is the mode, but the honest leaf is
  the modern Greek-myth engine - same furniture and placement as Cupid''s Match already in this leaf. modern-greek-myth 5
  -> 6.'

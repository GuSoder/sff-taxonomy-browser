placement_rationale: 'Contemporary-set Greek-myth fantasy: five schoolchildren at an eccentric boarding school in Wales discover
  they are gods of Greek/Titan blood, imprisoned by the Olympian order; fully released, each commands a unique alternate cosmos,
  and a war in heaven between ultimate Order and ultimate Chaos follows (SFE entry ''Wright, John C'': the mode ''shifts between
  heroic fantasy and space opera''; Orphans was a 2005 Nebula nominee, per Wikipedia). Fits the Modern Greek myth gate - the
  powers and bloodlines of Greek myth remain active within ordinary present-day life - and the umbrella''s Not-Mythic-retelling
  line: an original story using the figures, not a retold named myth. Walk: Speculative fiction > Fantasy > Real earth fantasy
  > Contemporary fantasy > Contemporary mythic fantasy > Modern European myth > Modern Greek myth. Wobble disclosed: the final
  volume escalates to cosmic war in space-opera vocabulary (SFE); the present-day Earth frame holds. Queue-year note: MC04693
  lists Orphans as 2007 (reprint); first publication Nov 2005 (SFE; ISFDB hc 0-765-31131-3).'

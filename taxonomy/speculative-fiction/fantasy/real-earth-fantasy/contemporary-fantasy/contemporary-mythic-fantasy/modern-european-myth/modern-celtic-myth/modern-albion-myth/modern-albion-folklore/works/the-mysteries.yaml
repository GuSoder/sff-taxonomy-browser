placement_rationale: 'Lisa Tuttle, The Mysteries (Bantam 2005; standalone). Ian Kennedy, an American tutor in present-day
  Scotland, is drawn into the disappearance of Peronel, a girl whose family believes she was taken by the fairies, and into
  the old folk beliefs still alive in the Highlands. The stakes are particular lives, not the modern world''s fate. Walk:
  Speculative fiction > Fantasy > Real earth fantasy (present-day Scotland) > Contemporary fantasy > Contemporary mythic fantasy
  > Modern European myth > Modern Celtic myth > Modern Albion myth (Scotland is the island side of the water; the Celtic partition
  runs Albion = Britain vs Ireland vs Gaul) > Modern Albion folklore (old powers met within ordinary present-day life, stakes
  are particular lives and communities). Rejected: Modern Albion epics (no world''s-fate struggle), Modern Irish myth (Scotland,
  not Ireland), Urban fantasy (rural Highlands, no city engine). Standalone novel; sources: publisher page and reviews (2005,
  Bantam).'

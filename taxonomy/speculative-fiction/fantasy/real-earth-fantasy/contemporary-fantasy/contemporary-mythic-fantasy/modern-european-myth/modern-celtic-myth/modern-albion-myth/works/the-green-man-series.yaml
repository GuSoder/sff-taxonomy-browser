placement_rationale: |-
  Daniel Mackmain, son of a human man and a dryad, sees the supernatural creatures ordinary mortals
  miss; the Green Man sends him to resolve clashes between people and the uncanny across present-day
  England (Wizard's Tower Press series page). A contemporary-folklore casebook on inherited dryad
  blood, uniform across all eight novels. Series card per the standing series rule; the list item
  was book 6, the BSFA-winning The Green Man's Quarry.

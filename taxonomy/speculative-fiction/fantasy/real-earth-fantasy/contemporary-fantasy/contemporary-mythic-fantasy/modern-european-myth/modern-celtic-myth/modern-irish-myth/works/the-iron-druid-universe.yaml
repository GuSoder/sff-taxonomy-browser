placement_rationale: 'Kevin Hearne''s Iron Druid universe, one shared-world card (rule 11j): the complete Iron Druid Chronicles
  (Hounded 2011, Hexed 2011, Hammered 2011, Tricked 2012, Trapped 2012, Hunted 2013, Shattered 2014, Staked 2016, Scourged
  2018) plus the Ink & Sigil trilogy (Ink & Sigil 2020, Paper & Blood 2021, Candle & Crow 2024), which kevinhearne.com describes
  as a spin-off ''in the world of his beloved Iron Druid Chronicles''. Atticus O''Sullivan, the last of the Druids, hides
  in modern Tempe, Arizona while the Tuatha De Danann - the Morrigan, Brighid, Aenghus Og - and the gods of every pantheon
  walk the present-day world; Al MacBharrais fights rogue minions of the same pantheons, especially the Fae, in modern Scotland.
  Walk: Fantasy > Real-Earth fantasy > Contemporary fantasy > Contemporary mythic fantasy > Modern European myth > Modern
  Celtic myth > Modern Irish myth (the old gods of Ireland alive in ordinary present-day life, wherever they wake; seeded
  for this card, curator approval phonemsg-01M7NPCDG7JZ1HQM1FBN4XNQ5Y). Tried: Modern Albion myth (Britain''s powers, not
  Ireland''s), Modern Gaulish myth (the continent), Arthur returned (not Arthur), Fae founders (the series is famous for all
  pantheons and the Druid himself, not fae courts alone). Source: author site, publisher descriptions.'

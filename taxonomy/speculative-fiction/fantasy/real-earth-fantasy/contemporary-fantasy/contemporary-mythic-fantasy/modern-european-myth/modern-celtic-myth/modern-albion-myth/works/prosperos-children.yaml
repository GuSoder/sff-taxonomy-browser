canonical_genre: modern-albion-myth
placement_status: accepted
placement_rationale: |-
  Root-down: Fantasy > Contemporary fantasy > Contemporary mythic fantasy > Modern European myth > Modern Celtic myth > Modern Albion myth. The old powers of mythic Britain act inside ordinary present-day England: an Atlantis-forged key surfaces in present-day Yorkshire and remakes young Fern Capel's life (book 1 blurb, penguinrandomhouse.com/series/A5A/); the ghostly Otherworld, Ragginbone, goblins and the witch-queen Morgus - returned to "rule the ancient kingdom of Logrez, now modern Britain", stalking twenty-first-century London "in her Prada stilettos" (The Witch Queen blurb) - are Albion's mythic matter alive now. Logrez is Arthurian Logres. Same lineage as the leaf's Cooper and Garner cards. Rejected: Otherworld stumblings (the crossings serve the mythic-Britain story; book 3 is the Otherworld invading modern London, not a crossing tale), Portal fantasy (pure umbrella; the Celtic-British root is the specific claim), Lost race (Atlantis is prologue furniture, not an explored hidden people). 3 novels (Prospero's Children 1999, The Dragon Charmer 2000, The Witch Queen 2002 - Voyager/Del Rey; intake-list years are reissues). PRH markets the trilogy as the Fern Capel series; card named for book 1, the trilogy's common name.

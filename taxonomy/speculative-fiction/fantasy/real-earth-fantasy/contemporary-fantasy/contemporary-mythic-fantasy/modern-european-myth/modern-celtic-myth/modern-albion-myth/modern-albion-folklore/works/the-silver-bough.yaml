placement_rationale: 'Lisa Tuttle, The Silver Bough (Bantam 2006; standalone). In the present-day Scottish coastal town of
  Appleton, an old enchantment wakes: the townspeople are caught in a repeating pattern of legend (the town''s vanished library,
  the silver bough, the fairy-land bargain), and the stakes are the community and the people in it, not the modern world''s
  fate. Walk: Speculative fiction > Fantasy > Real earth fantasy (present-day Scotland) > Contemporary fantasy > Contemporary
  mythic fantasy > Modern European myth > Modern Celtic myth > Modern Albion myth (the island, Britain; the partition runs
  Albion vs Ireland vs Gaul) > Modern Albion folklore (the old powers are met within ordinary present-day life and particular
  communities). Rejected: Modern Albion epics (no world''s-fate struggle), Modern Irish myth (Scotland), Urban fantasy (a
  small coastal town, no city engine). Standalone novel; sources: publisher page and reviews (2006, Bantam).'

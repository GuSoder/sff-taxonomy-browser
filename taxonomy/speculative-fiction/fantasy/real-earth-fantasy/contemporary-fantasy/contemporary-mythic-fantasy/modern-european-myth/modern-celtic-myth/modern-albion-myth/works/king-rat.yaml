placement_rationale: 'Mieville''s King Rat (1998): Saul Garamond learns he is half rat and
  heir to London''s rat kingdom, while the Pied Piper returns to claim the city''s animal
  courts through drum-and-bass London. The Piper (Browning''s canonical English telling) and
  the old animal royalty are inherited folk-myth alive in ordinary present-day life - the
  Albion shape (shelf: The Albion Triptych''s Gog, the green men). Walk: Fantasy > Real earth
  fantasy > Contemporary fantasy > Contemporary mythic fantasy > Modern Celtic myth > Modern
  Albion myth. Sources: en.wikipedia.org, panmacmillan.com.'

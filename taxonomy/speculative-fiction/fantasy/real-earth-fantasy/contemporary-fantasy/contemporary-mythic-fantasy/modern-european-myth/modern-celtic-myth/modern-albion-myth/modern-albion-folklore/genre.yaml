definition: 'Modern Albion myth in which the old powers are met within ordinary present-day life: a valley''s pattern that must be re-enacted, a green presence in the village wood, animal courts under London, a summoned mystery in the family forest, a dryad''s son working for the Green Man, folklore kept alive on a midwinter island, a giant walking England''s modern history. However dangerous the powers, the stakes are particular lives and communities. Not Modern Albion epics (there the struggle decides the modern world''s fate).'

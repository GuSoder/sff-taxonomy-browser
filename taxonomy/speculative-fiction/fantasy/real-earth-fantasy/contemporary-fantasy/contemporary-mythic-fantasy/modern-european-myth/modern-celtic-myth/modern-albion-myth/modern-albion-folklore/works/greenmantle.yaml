placement_rationale: 'De Lint''s Greenmantle (1988): in present-day Lanark County, Ontario,
  a horned wild god the book calls the Mystery wakes in the woods behind a lottery winner''s
  house, summoned by pipe music, while her violent ex-husband and a retired Mafia hitman
  close in; a hidden pagan village in the forest, New Wolding, is part of the story. The
  engine is the Green Man - one of Modern Albion myth''s named powers - alive in ordinary
  present-day life, woken on the far side of the Atlantic. Placed here on the curator''s
  "Drop it" ruling (phonemsg-01M54PMX2NTE897C20QPRQ2203, 2026-10-17): the def names where the
  powers come from, not where the story sits. Sources: charlesdelint.com, rambles.net.'

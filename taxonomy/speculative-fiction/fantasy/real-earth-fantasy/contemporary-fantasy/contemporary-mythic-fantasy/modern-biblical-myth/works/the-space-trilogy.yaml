placement_note: 'SFE (lewis_c_s) names the Ransom sequence Lewis''s primary contribution to SF; SFE planetary_romance
  covers tales whose venue is an alien planet and whose plot turns on its nature - Ransom is taken by spaceship
  to Malacandra (Mars) and the story turns on its peoples and cosmic order. Shelfmates: Pern, Majipoor. Series conversion
  2026-09-23 (#876): HarperCollins names the three Ransom books as the Space Trilogy. Note: book 3 is Earth-set;
  series placement kept from the book-1 card.'

first_published: 1938
canonical_genre: modern-biblical-myth
placement_status: accepted
placement_rationale: 'Bounded leaf repair 2026-11-05: whole Ransom/Space trilogy, not Out of the Silent Planet alone.
  Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Contemporary mythic fantasy > Modern
  biblical myth. Out of the Silent Planet1938: human kidnapping/rocket to Mars, three rational species, tutelary
  eldil and Earth''s fallen ruler identified with biblical Satan. Perelandra1943: Ransom sent to Venus by angelic
  agency in an ice-like casket; new Adam/Eve face demon-possessed Weston, divine prohibition and physical struggle
  over a second Fall. That Hideous Strength1945: contemporary Earth N.I.C.E. technocrats directed by dark eldils
  through severed head; Ransom''s company and awakened Merlin host the planetary powers that destroy the demonic
  institution. SFE whole3 account corroborated by each own Scribner book description/excerpt. Literal Christian
  angels/demons/divine governance are active causal powers, not merely alien technology or unconfirmed beliefs.
  Hence SF marketing/first-book spaceship does not pass strict root gate; no new exception for later magic. Earth-rooted
  universe remains despite two planetary excursions: Real earth fantasy expressly allows off-Earth planets; bulk
  is writer''s present-world human mission in contemporary Solar System, no retold historical era or autonomous
  invented realm. Present-day setting includes near-future Earth of third book, not reader-relative historical relabeling.
  Modern biblical myth: continuing biblical powers act in humans'' present; Perelandra mirrors Eden on Venus but
  is not a retelling of named Genesis events. Arthur returned loses whole3: Merlin is final-volume ally, not governing
  two earlier planetary conflicts. Mythic power struggle loses deity viewpoint: human Ransom/Studdock/Jane and their
  moral agency govern, not myths'' own protagonist lives. Portal fantasy loses Earth-universe gate; Space/theological
  opera loses Fantasy root; no invented allowance to rationalize explicit working magic. Strong wobble: SFE calls
  contribution SF proper, first2 planetary romances and third scientific romance, publisher markets SF; our ontology''s
  explicit supernatural gate decides, not marketing. Only these three completed novels; Dark Tower is unfinished
  posthumous fragment, not another novel to append. SFE firstyears1938/43/45 prevail over publisher first-volume
  copy''s erroneous1943; 2003 Scribner English print reprint jackets localized and actual pixels inspected. No gate
  change, Modern biblical myth2->3.'

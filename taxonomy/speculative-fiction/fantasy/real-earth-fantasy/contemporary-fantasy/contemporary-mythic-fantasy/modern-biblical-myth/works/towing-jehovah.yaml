placement_note: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Contemporary
  mythic fantasy > Modern biblical myth. Per Wikipedia (en.wikipedia.org/wiki/Towing_Jehovah): a 1994 FANTASY novel
  - God is dead and his two-mile cadaver floats in the Atlantic off Africa; the Archangel Raphael hires supertanker
  captain Anthony Van Horne to tow the body into the Arctic for cold preservation; followed by Blameless in Abaddon
  (1996) and The Eternal Footman (1999); won the 1995 World Fantasy Award for best novel. God''s dead body and his
  archangel act openly within ordinary present-day life: the Modern biblical myth definition verbatim (''God, angels,
  the prophets, the End-Days apparatus ... active and act openly''). Rejected: Biblical fantasy under Mythic retelling
  (not a retold named biblical narrative - the End-Days apparatus acts now), theological-space-opera (Earthbound
  sea voyage, no space opera), SF apocalyptic branches (classified fantasy by Wikipedia and the World Fantasy Award;
  no science apparatus), satirical-sf (mechanism is the door: the premise is the biblical God''s literal body, not
  a secular satire). Trilogy ONE card: Towing Jehovah 1994, Blameless in Abaddon 1996 (God''s corpse revealed after
  an earthquake, commercialized in a religious theme park; per EBSCO), The Eternal Footman 1999 (a plague of death
  awareness after God''s demise; per EBSCO). Sources: Wikipedia, EBSCO research-starter; not read in full.'

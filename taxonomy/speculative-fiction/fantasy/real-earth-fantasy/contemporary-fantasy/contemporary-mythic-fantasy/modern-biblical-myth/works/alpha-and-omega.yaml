placement_note: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Contemporary mythic fantasy > Modern biblical myth. A red heifer is confirmed ritually pure in Arkansas, archaeologists under the Temple Mount find the Ark of the Covenant FLOATING above the ground, a dirty bomb hits Tel Aviv, Iranian missiles vanish mid-flight and ''Mene, mene, tekel, upharsin'' appears in ancient Aramaic on a dead president''s wall - the biblical End of Days unfolds and God is provably real in present-day Jerusalem (Penguin Random House; Turtledove wiki; Del Rey July 2019, the 10k row''s 2020 is the paperback). The biblical tradition''s God, prophecies and End-Days apparatus act openly in ordinary present-day life: Modern biblical myth, seeded for this fiction (curator ''Approved, seed then propose bundles'' phonemsg-01M5YKMAZQD90MVZY5MZJZSVMQ). Rejected: Biblical fantasy (mythic retelling of named biblical narratives - this is the End of Days enacted now, not retold figures), hellscape-horror (no damnation-scape; God intervenes and order holds), satanic/demonic torment (God acts, no pursuing tormentor), magic realism (the world reacts with shock, not acceptance), SF apocalyptic-fiction (secular catastrophes), godgame (no rival powers, no game). Sources: PRH, author wiki; not read in full.'

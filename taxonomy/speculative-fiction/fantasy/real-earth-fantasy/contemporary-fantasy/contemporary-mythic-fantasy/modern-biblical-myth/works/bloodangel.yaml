placement_rationale: 'Ten-k walk (MC05091, MC05092). Whole fiction: the BloodAngel duology (Penguin Random House series page:
  BloodAngel 2005 + Lord of Bones 2008). Present-day Manhattan, small-town Minnesota, California: an angel trapped inside
  a teenage boy, demons pouring through an opened gate and wearing human bodies, a rock singer''s voice breaking the barriers
  between heaven and hell, the End-Days coming. Root-down: fantasy > real-earth-fantasy (present-day Earth) > contemporary-fantasy
  > contemporary-mythic-fantasy (biblical figures and powers drive it) > modern-biblical-myth: angels, demons and the End-Days
  apparatus active within ordinary present-day life. Not biblical fantasy (no retelling of a named narrative), not demonic-torment
  (personal-torment horror register; this is an apocalyptic urban fantasy), not eldritch-invasions (fails the ancestor: epic
  fantasy in invented realms).'

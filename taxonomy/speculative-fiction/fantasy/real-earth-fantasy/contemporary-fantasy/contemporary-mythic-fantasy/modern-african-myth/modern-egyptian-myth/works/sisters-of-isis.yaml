placement_status: accepted
placement_rationale: 'MC06178 is The Summoning by Lynne Ewing, not the Kelley Armstrong novel of the same title. Whole fiction:
  the four published Sisters of Isis novels, The Summoning2007, Divine One2007, Enchantress2007 and The Haunting2008. ISFDB
  author bibliography and individual first editions corroborate the four-book boundary. Sisters of Isis Volume1 (2011) is
  an omnibus containing the first two novels, not a fifth novel. Wikipedia''s Divine One section heading says2008, contradicted
  by its own2007 publication field, the2007 Hyperion first edition and Spokane''s2007 MARC record; use2007. No claim that
  the unfinished series has a resolved ending. Publisher-distributed Hoopla description calls this an all-new series following
  Daughters of the Moon. A common author and that marketing comparison do not establish a literal bridge to Daughters of the
  Moon/Sons of the Dark; no source found establishes one, so do not fold the author''s entire bibliography.


  Literal speculative engine: three fifteen-year-olds in modern Washington, D.C. inherit pharaonic powers of transformation,
  learn spells from the Book of Thoth and confront Egyptian supernatural forces. The mythology is active, not merely historical
  decoration: Divine One brings Apep from the Netherworld into D.C. through the Cult of Anubis; Enchantress concerns lost/control
  of powerful Egyptian magic and the adversary Shaitan; The Haunting''s apparently useful ghost is a dangerous Egyptian mut.
  The series uses a fictionalized modern adaptation of Egyptian tradition, not a claim of historical religious accuracy.


  Root walk: Speculative fiction > Fantasy, rather than Science fiction. Magic, pharaonic gifts, divine powers and dangerous
  dead are the literal explanation; no scientific or technological mechanism is asserted. Modern day SF has the right time
  but the wrong mechanism; Historical SF, Futurist SF and Atemporal SF likewise cannot account for this engine. Fantasy >
  Real earth fantasy: named Washington, D.C. and ordinary present-day schools/family life anchor the world. Fantasy realms
  fails that setting. Portal is a genuine rival because Apep comes from the Netherworld, and Fantasy rifts/World bleeds explicitly
  allows leakage without a human journey. However, the whole fiction''s engine is living Egyptian powers, bloodlines and mythology
  active in everyday D.C., not the opening/crossing/management of a threshold as the recurring organizing premise. An underworld
  origin or a summoned serpent alone does not move every modern myth fiction to Portal. Book of Thoth is a spell source, not
  established as a transporting tome. Real-earth''s own definition explicitly permits afterlife/parallel-dimension excursions.


  Real earth > Contemporary rather than Historical or Future: the teenagers'' everyday world is the author''s modern capital,
  not a retelling set in ancient Egypt, a real past era or a speculative future. Ancient ancestors and gods are not a historical
  setting. Contemporary''s full eight-way partition: Contemporary mythic wins because named inherited Egyptian cosmology remains
  a living causal force. Magical coming-of-age is the strongest rival: teens discover inherited transformation and spellcraft,
  so Birthright magic/Wildblood has a genuine local fit. But all four books'' world is defined more specifically by surviving
  Egyptian powers and adversaries, not just adolescent self-discovery. Domestic/Magic family also fits their sisterhood and
  growing mutual support, but these are initially unrelated girls, and the recurring public supernatural threats are not centered
  on running a household or multigenerational home. Urban fantasy fits D.C. as stage, but no municipal secret-double/living-city,
  public integration, fae ecology, professional criminal caseload, state occult service or weird-science protection agency
  governs the fiction. Modern Goth/Occult city is not a catch-all for an ancient cult in a modern city: here the inherited
  myth is the engine rather than a Gothic city''s particular historical debt or occult economy. Dark fantasy has threat/pursuit,
  especially book4, but dread/torment is not the whole series'' organizing mode. Supernatural/Ghost stories fits The Haunting
  alone, while the other novels concern pharaonic gifts, Apep and Egyptian magic rather than a recurring generic haunting;
  no vampire, werewolf, dragon, undying or soul-bargain engine. Contemporary magical realism fails the explicit discovery,
  named spellcraft and struggle over supernatural forces. Folktale fails the repeated teen/mythic adventure form rather than
  a humorous/animal tale and its moral engine. Confidence high for the specific modern-myth leaf, with coming-of-age and portal-leakage
  wobbles preserved.


  Contemporary mythic''s full tradition partition: Egyptian inherited tradition, not an original cosmology, Chinese, Navajo,
  biblical, or European myth. Modern African myth already has an explicit Modern Egyptian myth child. The umbrella''s older
  West-Africa/Caribbean-only description is stale, not an exclusion: original curator message phonemsg-01M7HD0D4GKV9X56YTJKE6A4W1
  on2026-11-16 explicitly says Egyptian belongs inside Africa; the existing leaf YAML records that ruling. Follow that specific
  current structure without inventing a fresh seed or changing ancestor definitions. Within Africa, Orisha/Yoruba, Anansi
  and Jamaican traditions do not supply this fiction''s pharaonic/Book-of-Thoth/Apep engine. Existing Modern Egyptian myth''s
  canonical definition expressly covers ancient Egypt''s gods, powers and revenants active in ordinary present-day life. Exact
  fit,1to2 fictions. The embedded node omitted that already-approved canonical definition, so sync its existing wording as
  metadata only, not a broadened/new definition. No new node, structure, portrait or human decision required.'

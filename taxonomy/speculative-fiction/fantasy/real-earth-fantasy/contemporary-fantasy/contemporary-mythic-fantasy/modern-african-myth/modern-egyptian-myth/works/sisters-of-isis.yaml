  - https://www.hoopladigital.com/ebook/the-summoning-lynne-ewing/13791692
- title: Divine One
  year: 2007
  engine: The girls confront Apep, a Netherworld serpent brought into Washington by the Cult of Anubis. Meri family/political
    and romantic troubles do not displace that Egyptian supernatural engine.
  sources:

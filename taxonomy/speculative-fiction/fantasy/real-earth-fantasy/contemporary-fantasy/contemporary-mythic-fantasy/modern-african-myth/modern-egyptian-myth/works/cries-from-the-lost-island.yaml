placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Contemporary
  mythic fantasy > Modern African myth > Modern Egyptian myth. Present-day Colorado: sixteen-year-old Hal Stevens, budding
  historian obsessed with Egypt, and Cleo Mallawi, who believes she is the reincarnation of Cleopatra; ancient Egyptian powers
  and the mystery of a lost island press into ordinary modern life (PRH description: ''this standalone fantasy brings an ancient
  Egyptian [mystery]''; Black Gate review). Ancient mythic beings and powers active within ordinary present-day life = Contemporary
  mythic fantasy; Egyptian tradition = Modern Egyptian myth, seeded by the curator inside Modern African myth (phonemsg-01M7HD0D4GKV9X56YTJKE6A4W1).
  Standalone novel (DAW 2020, 320pp). First card of the seed.'

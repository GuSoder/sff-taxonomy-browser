id: modern-african-myth
name: Modern African myth
definition: 'Contemporary mythic fantasy rooted in African traditions and their diaspora: the Orisha of the Yoruba tradition, the Anansi spider-trickster tradition of West Africa and the Caribbean, the figures of Jamaican myth and folklore, and the gods and revenants of ancient Egypt. Bundled from the tradition leaves on the curator''s approval (phonemsg-01M5YMZ8N3YH8ADVH2CFPX9GRB, 2026-10-27), grouping the umbrella''s children by their ethnical or geographical roots; Egyptian moved inside the African umbrella by his ruling (phonemsg-01M7HD0D4GKV9X56YTJKE6A4W1, 2026-11-16).'

placement_note: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Contemporary mythic fantasy > Modern invented myth. A journalist investigates the ritual murder of a rock promoter and is drawn into a reunion tour that a hidden manipulator means to end in an occult ritual - a resurrected rock messiah, demonism and mind control loosing a dark apocalyptic power on the world (georgerrmartin.com; Wikipedia). Martin''s cosmology is authored, not inherited - no named tradition - and mythic powers work under ordinary present-day America: Modern invented myth (The Book of Love precedent). Rejected: Occult mystery (a case leaf for police/PIs; Sandy Blair is a journalist), Horror fantasy branches (no cursed place, no hellscape). SOFT: the fantasy elements stay subdued and hidden for most of the book (Wikipedia) and the engine is a murder mystery; the supernatural convergence is the payoff.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Contemporary
  mythic fantasy > Modern invented myth. In 2017 angels and demons walk the earth, once human and now ''unkin'', transformed
  by the machine-code language of reality, and seek the Book of All Hours, the blueprint of reality, lost somewhere in the
  Vellum, the realm of eternity on which our world is a skin (Penguin Random House description of Vellum); Ink is the second
  volume of the same Book of All Hours (Wikipedia). An author''s own cosmology of unkin, Vellum and Book anchors the story
  in the present day, the leaf''s definition. Rejected: Modern Greek myth and other inherited-myth leaves (the Sumerian and
  Biblical figures are reworked into an original cosmology), Occult cabals (the powers are mythic, not a hidden society).
  Wobble: strong; it is also a multiverse tale across eras. Sources: PRH page, Wikipedia. Years: 2005 (UK first edition),
  2007.'

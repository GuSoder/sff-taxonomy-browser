id: contemporary-mythic-fantasy
name: Contemporary mythic fantasy
definition: 'Contemporary fantasy in which ancient mythic beings, archetypes or powers remain active within ordinary present-day life,
  making myth a living force, bundled by the ethnical or geographical roots of the traditions: Modern European myth (Celtic,
  Greek and Norse) and Modern African myth (West African roots and their Caribbean diaspora), with the Chinese, Navajo and
  biblical traditions and invented cosmologies standing as direct children. Not Mythic retelling (a retold myth or legend,
  under Historical fantasy).'
parent: contemporary-fantasy
label: Contemporary mythic fantasy
children:
- modern-european-myth
- modern-african-myth
- modern-invented-myth
- modern-chinese-myth
- modern-navajo-myth
- modern-biblical-myth

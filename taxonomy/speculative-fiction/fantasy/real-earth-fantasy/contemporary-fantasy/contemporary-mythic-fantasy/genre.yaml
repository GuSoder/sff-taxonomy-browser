name: Contemporary mythic fantasy
definition: 'Contemporary fantasy in which ancient mythic beings, archetypes or powers remain active within ordinary present-day
  life, making myth a living force, partitioned by which mythology stays alive: the inherited traditions of Celtic myth (Albion

  Creator bibliography, current through2026collection, lists seven Felix novels2006/2007/2008/2009/2010/2015/2018. Goodreads
  and ISFDB agree; apparent eighth is Killing the Cobra graphic narrative, separately labeled graphic novel by creator. No
  further eligible Felix novel established. The original five entries already exist and are not added again.


  Rescue date conflict resolved as editions, not averaged: creator lists2015; contemporary2016review cites2015 and ISBN9781614753070;
  ISFDB distinguishes2015-05-03 original from2016-01-26 later edition ISBN9781614753865. Current publisher page gives2016
  while repeating the older ISBN in copy. Record original2015 separately and selected current publisher edition2016, flag
  publisher ISBN inconsistency rather than asserting a precise new ISBN. Steampunk publisher gives19August2018, corroborated
  creator''s25August2018release essay. First novel2006 established by creator/ISFDB/Kirkus, not existing2005.


  Five existing flat illustrated English fronts individually pixel inspected333x500/309x500/330x500/308x500/375x500. Correct
  titles/authors, some old fronts have small source watermark but title/edition identity sound. Two current publisher flat
  illustrated fronts640x1000 individually inspected: correct title/author, no omnibus, audio or 3D. Hotlinks only, no repository
  image storage. New publisher URLs observed as http; verify rendered loading under browser before final completion.


  Moderate confidence in current whole-fiction home; high scope/metadata confidence. No full primary novel reading. Creator
  endpoint explanation plus detailed completed reviews support the late crossover and sustained comic-detective frame. The
  seventh is not brushed aside as nonexistent or excluded. A later continuing alternate-past series or a creator-established
  end-frame could change the whole-fiction home and would prompt another full walk.



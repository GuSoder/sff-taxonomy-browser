placement_rationale: '# Felix Gomez whole-fiction completion, MC06387-91, 23 November 2026


  Retain the existing Felix Gomez fiction in Comic noir fantasy, three fictions unchanged. Complete its missing sixth and
  seventh eligible novels, Rescue From Planet Pleasure (2015 original, selected current publisher edition2016) and Steampunk
  Banditos: Sex Slaves of Shark Island (2018). Correct first novel''s erroneous2005 to2006. The eight-entry Goodreads series
  count includes the graphic novel Killing the Cobra, excluded by current intake. No new fiction, leaf, split or definition
  change.


  ## Root-down walk


  Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Folktale > Earthly comic fantasy > Comic noir
  fantasy.


  Supernatural vampires are joined by skin-walkers, Coyote, La Llorona and explicit Hopi magic. Later aliens, wormholes, psychic
  powers and mad science do not demystify all this. Current publisher explicitly names telepathic magic in bookseven. Magic
  wins the Fantasy ancestor; no AtemporalSF placement based on its science-fiction furniture.


  The frame is an Iraqi-war veteran returned as a vampire PI to modern Denver and other real US locations. The sixth expands
  into a rescue on an alien planet and back to NewMexico; the seventh swaps him with an alternate-past version of himself
  in a steampunk Southwest/Aztlan and Gulf of California. The creator explicitly confirms the alternate-world swap, while
  publisher and independent critic describe Coyote time travel. Do not hide this included novel''s actual temporal displacement
  or label it merely a decorative steampunk aesthetic.


  Whole-fiction placement is not the local setting of the last novel. The continuing protagonist, six-volume modern-Earth
  arc, recurring cast, supernatural enforcement and humorous hardboiled cases define the fiction. Earth-rooted worlds may
  leave for space, planets and parallel dimensions under Real earth fantasy''s definition. Six modern-framed novels and a
  single alternate-past adventure do not make the whole fiction a historical chronicle. Earthly comic fantasy explicitly covers
  modern or period. The modern-Earth frame remains the strongest parent, while the late alternate-past swap is a substantial
  recorded overlap. The owner clarified in original phonemsg-01M36M8K4DB3B8Y8T1GAQ6ARF0 that the any-time-travel-to-Atemporal
  rule is when in SF, and magic still walks Fantasy. This is not an invented general waiver for SF, nor an extension of Bill''s
  personal comic-SF exception. Whole-universe frame reasoning also has the source-grounded Sipstrassi instance, original phonemsg-01M6R3B5CZRVQVGNWBVEKKB40N
  and preceding exchange, personally read. No new temporal umbrella is created.


  The series'' comic mode is independently explicit, not inferred just from punning titles. Creator describes skewering sexual
  myths, conspiracies and bureaucracy. Reviewers call the first six action-filled hilarity and the seventh a deliberately
  excessive pulp/drive-in mashup. The seventh retains a missing-daughter investigation, witnesses, clues, hidden agendas and
  double-crosses despite the alternate setting; author confirms his love of mysteries. Book six is more rescue/action than
  gumshoe case, a genuine straddle, but connects and closes the existing supernatural-underworld arc. Comic noir remains the
  closest whole-fiction leaf rather than splitting off the two late books.


  ## Sibling audit


  - Vampire fantasy describes the lead species, but comedy as governing mode and the hardboiled frame are more precise. No
  claim all vampires automatically live here.

  - Urban occult detective is a serious-mode rival, but the cases are deliberately excessive comic genre collisions. Ordinary
  dark-noir mood does not govern.

  - Earthly comic Mythic farce loses: Coyote/La Llorona do not turn the seven novels into a primarily gods-and-myth farce.
  Screwball''s romantic-chaos engine loses despite sex and love interests. Corporate fantasy loses: bureaucracy/corruption
  are targets, not magic run as a business.

  - Portal fantasy/Multiverse is a strong late-book mechanism, not the organizing subject of the full fiction. No anchored
  door/text crossing or growing many-world itinerary governs all seven. Planetary portal is book six only. A history/steampunk
  leaf fails the whole modern frame, and Fantasy realms fails the actual Earth protagonist and real geography. No Far-shore
  culture counterpart inference from Aztlan.

  - Dark fantasy loses as governing register to the comic action/mystery frame. Domestic, coming-of-age, magic realism and
  serious supernatural-being shelves do not describe this adult detective''s ongoing mode. Animal tale is not implied by werewolves.

  - Time magic under invented-realm Hard fantasy fails ancestor/whole-spine tests even though Coyote''s swap is literal magical
  temporal displacement. Do not widen that leaf to capture an isolated late genre excursion.



placement_rationale: 'Three retired Chosen Ones - a retired Hunter of Artemis, a half-succubus ex-PI and a 99-year-old wizard
  - run a Salem, MA bookstore and come back for one last job. The governing joke is the fond send-up of the Chosen One script
  and the genre''s own furniture (PRH: ''Buffy the Vampire Slayer meets Golden Girls''; WSJ: ''Buffy meets Thursday Murder
  Club''; psillustrated: ''an obvious homage'' to the retired Chosen One trope). Seed leaf approved by the curator phonemsg-01M6DXPT3F6ZNZXEKTA0Y72HR6.'

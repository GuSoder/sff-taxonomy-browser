definition: Earthly comic fantasy whose governing joke sends up inherited story material - the Chosen One script, the hero's quest, the dark lord, the genre's own furniture - played on our Earth as fond parody or homage. The trope inversion is the comic engine, not an ornament on a straight adventure. Not Mythic farce (gods and myths loose among mortals are the comedy); not Screwball fantasy (a supernatural device scrambles a love life into farce); not Comic noir fantasy (the hardboiled detective frame is the joke); not Corporate fantasy (magic runs as a business). Same engine as Parody realms; invented-world parody belongs there. Seeded 2026-11-02 for Slayers of Old (curator approval phonemsg-01M6DXPT3F6ZNZXEKTA0Y72HR6).

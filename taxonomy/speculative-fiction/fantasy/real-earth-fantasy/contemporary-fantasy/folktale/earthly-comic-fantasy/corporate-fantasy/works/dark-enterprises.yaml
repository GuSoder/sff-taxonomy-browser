placement_rationale: '# Dark Enterprises, whole-fiction walk

  24 November 2026. MC06482; future sibling MC06483.


  ## Verdict and included corpus

  Place one connected fiction Dark Enterprises in existing Corporate fantasy,1to2. Include Colin Gets Promoted and Dooms the
  World, Mark Waddell, first published7October2025,384pages. Exclude future Messy As Hell, publisher12January2027,384pages.
  Both primary descriptions explicitly name the same Dark Enterprises firm, respectively New York and Denver branches. Shared-universe
  rule means one fiction despite different protagonists. Mark ongoing series so one published book does not display as a standalone.
  Future row remains unprocessed and has a publication follow-up, not a new intake pile. No extra novella, adaptation, omnibus
  or speculative invented book is included.


  ## Whole story and evidence limits

  Colin is a low-ranking employee of an explicitly occult corporation, where ritual sacrifice and lethal termination are office
  routines. A sabotaging superior threatens his job and life. He exchanges blood and an unspecified favor with an entity for
  promotion. Now assistant to the CEO, he discovers his bargain released a devouring ancient evil. He tries to save New York
  and the world while keeping his position, gaining power and pursuing Eric. Finished-reader criticism establishes that his
  ethical movement is from resentful passivity to accepting the need to save other people, without losing his unpleasant ambition.
  Corporate satire, casually lethal office politics and Colin''s self-deceiving career climb remain the narrative engine rather
  than incidental comic relief on a straight horror story.


  The lawful reviews read do not establish the precise final defeat mechanism, and this report does not invent it. That uncertainty
  does not change the positive corporate-comedy evidence, which is unusually direct across publisher, Kirkus, Criminal Element
  and a full romance-reader review. The British Columbia Review loosely calls the tale sci-fi before calling it fantasy; that
  critic''s analogy is not evidence of a scientific mechanism. No source read establishes actual time travel. No unauthorized
  complete-book mirror used.


  ## Full root-down walk and rivals

  Speculative fiction > Fantasy: real dark magicks, blood bargains, eldritch entity and sacrifices govern causality. A corporation
  and other dimensions are not SF mechanisms by themselves. Not Science fiction; no advanced technology or demystification
  established.

  Fantasy > Real earth fantasy: New York is expressly named. Not Fantasy realms, no independently invented geography. Not
  Portal fantasy, no Earth-to-otherworld exchange journey organizes the included novel; corporate interdimensional origins
  are not a portal narrative.

  Real earth fantasy > Contemporary fantasy: recognizable present corporate New York, not an actual historical era and not
  a future remade Earth. Thus neither Historical nor Future fantasy; threatened apocalypse has not become a post-apocalyptic
  setting.

  Contemporary fantasy > Folktale > Earthly comic fantasy: career bargain and satirical humorous-tale structure dominate.
  Not Animal fantasy. The broad Folktale ancestor explicitly contains humorous tales, not only traditional oral stories. Urban
  fantasy is the strongest setting rival, but the specific admitted comic route describes the book''s governing engine better
  than city geography. Dark fantasy / Torment / Satanic torment is the strongest tonal rival: blood deal, personal danger
  and devouring evil are real, but repeated finished criticism identifies a corporate dark comedy whose horrors are routine
  office jokes, not sustained personal torment as its purpose. Supernatural fantasy likewise names ingredients but misses
  governing comic form. Not Contemporary mythic fantasy, no traditional pantheon is the principal organizing force. Not Domestic
  fantasy, workplace rather than household. Not Magical coming-of-age, adult promotion rather than youth identity. Not Magic
  realism, consciously supernatural rules and an exceptional bargain propel a plotted crisis.

  Earthly comic fantasy > Corporate fantasy: magic runs as a multinational business, and office hierarchy, advancement, sabotage
  and executive politics are the joke. Existing definition expressly admits sorcery conglomerates, not only inherited family
  firms. Not Mythic farce: ancient evil is a device in a business satire, not gods or inherited myth loose among mortals as
  the comic subject. Not Screwball fantasy: romance is substantial but the deal is for promotion, corporate stakes and world
  rescue persist independently of Eric. Not Comic noir fantasy: no gumshoe-case narrative. Not Parody fantasy: no inherited
  hero/quest/dark-lord script is the principal comic target. No seed, split, definition or ancestor change. Corporate fantasy1to2,
  tree remains937nodes.



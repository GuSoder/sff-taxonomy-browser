placement_rationale: 'Greg van Eekhout''s California Bones (Tor, tor page; Macmillan excerpt): Los Angeles is the capital
  of the Kingdom of Southern California, ruled by a Hierarch who devours the bones of magicians, in an Earth that has phones,
  helicopters, police windbreakers, Santa Monica Beach and Disneyland, so the setting is our Earth remade by public magic,
  not an invented realm. The thief Daniel Blackland''s heist on the Hierarch''s storehouse is the plot (Pacific Fire and Dragon
  Coast continue in the same world, so one fiction). Magic is a known part of public life under the regime, so Paranormal
  aftermath (an alternate Earth remade by magic, as with the alternate Cincinnati of Dead Witch Walking). Walk: Fantasy >
  Real-earth fantasy > Contemporary fantasy > Urban fantasy > Publicly paranormal > Paranormal aftermath. Moved from Caper
  fantasy on the curator''s question that it is not a fantasy realm (phonemsg phonemsg-01M5FXXT9Z0ZMV1QHQM46RHJTS). Soft:
  no heist leaf exists on Earth, so the setting wins; Occult city (hidden magical economy) was the alternative.'

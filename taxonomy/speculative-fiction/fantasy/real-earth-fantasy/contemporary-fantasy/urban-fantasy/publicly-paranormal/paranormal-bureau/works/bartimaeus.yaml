first_published: 2003
canonical_genre: paranormal-bureau
placement_status: accepted
placement_rationale: 'Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Urban fantasy > Publicly
  paranormal > Paranormal bureau. One fiction, all four published novels, including The Ring of Solomon prequel. Moderate
  wobble: the supernatural state is a ruling caste and system of enslavement, not a neutral regulatory workplace. No definition
  changed.


  Root: spirits, essence and summoning are literal magic. The modern trilogy is explicitly an alternative present-day London;
  the prequel is ancient Jerusalem. Real earth beats independent Fantasy realms. Historical fantasy / Alternate history is
  a substantial prequel straddle, but three modern novels govern the whole fiction. No time travel: a long-lived spirit''s
  remembered past and a chronological prequel are not time travel. Future fantasy fails the contemporary bulk. Portal fantasy
  is a serious rival because all spirits come from the Other Place and Kitty enters it in the finale. Yet the organizing conflict
  is the Earth-side masters/slaves system, state power and resistance, not travel or exchange between worlds. The Other Place
  supplies its ethical climax without making the four books a world-crossing itinerary.


  Contemporary alternatives: Magical coming-of-age is real for Nathaniel and Kitty, but Nathaniel''s government career, the
  ancient djinni''s perspective, resistance and the ancient prequel are not governed by a magical school, inherited ability,
  found ability or one identity swap. Domestic fantasy fails the household-as-site engine. Contemporary mythic fantasy is
  a prequel surface rival (Solomon and his ring), not the governing inherited myth of the three modern books. Dark fantasy''s
  fear/torment engine loses to political control and resistance; slavery is terrible but not enough to make every political
  plot a personal supernatural horror. Supernatural fantasy''s ghost/vampire/werewolf/afterlife identities do not describe
  the djinni''s state-controlled magical system. Contemporary magical realism fails named, explained supernatural mechanics.
  Fables fails human/spirit political adventure rather than animal fable.


  Earthly comic fantasy is the strongest tonal wobble. The creator explicitly inverted good wizards / bad demons, and Bartimaeus''s
  voice and footnotes are comic. But the books pay enslavement, ambition, revolt, trust and Nathaniel''s final sacrifice straight.
  Satire and wit do not govern the whole as farce. Mythic farce fails gods disrupting mortals as the sustained motor; Screwball
  fails romantic complication; Comic noir fails a detective caseload; Corporate fantasy fails magic-as-business office life;
  Parody fantasy fails genre furniture as the governing joke, despite the deliberate wizard inversion. This is not an audience-based
  exclusion.


  Urban alternatives: openly known magic is the foundation of government and ordinary civic power. Modern Goth fails ancestral/colonial
  haunting, occult profession, haunted community or war ghosts as the central threat; this is an active political order. Fae
  founders fails Faerie identity/courts. Paranormal bricks fails the city as supernatural protagonist rather than setting
  and state arena. Occult mystery fails a recurring criminal/client caseload; there are investigations, but conspiracy, resistance
  and enslavement govern the arc. Occult secret service fails secret protection against occult threats: the magicians publicly
  rule and exploit spirits. Freakbusters fails weaponized science; Modern Weird West fails frontier frame.


  Publicly paranormal siblings: Paranormal aftermath requires an already-remade order after a reveal, magic wave or demon
  victory. The author FAQ instead makes spirit enslavement part of civilization from Sumer onward; no modern reveal/wave/victory
  is evidenced. Paranormal neighbours fails ordinary community life as the governing engine. Paranormal bureau explicitly
  includes agencies, departments and the state running the supernatural, not only police cases. Nathaniel''s ministry/cabinet
  career, the government''s command of enslaved spirits and Kitty''s opposition to that system meet the positive gate. The
  prequel similarly contests sovereign control of supernatural power, though ancient and court-centered. Bureau is the least-distorting
  existing whole-fiction home, not a claim every volume is a bureau investigation.


  Each novel checked separately: Amulet''s revenge theft uncovers a prime-ministerial conspiracy; Golem puts Nathaniel''s
  government career beside Kitty''s Resistance and attacks on London; Gate centers the exhausted enslaved Bartimaeus, an arrogant
  minister, Kitty''s discovery, spirit revolt and sacrifice; Ring adds Asmira''s assassination mission, Khaba''s ambitions
  and Solomon''s coercive ring. No first-volume engine was silently projected onto all four. UK Ptolemy''s Gate is 2005; US
  review year 2006 is not its first publication. Sources disagree on the prequel''s exact ancient year (author 960 BC, Kirkus
  950 BC), so no exact ancient year is asserted as settled.


  Source quality: author pages and FAQ, creator interview, independent completed Kirkus reviews of all four, completed trilogy
  and prequel reviews. English print jackets are author-site Corgi fronts, later printings, not claimed first-edition jackets.
  Four distinct fronts visually inspected on 2026-11-06.'

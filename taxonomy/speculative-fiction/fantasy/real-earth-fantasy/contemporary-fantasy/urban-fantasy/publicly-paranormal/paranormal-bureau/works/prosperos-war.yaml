placement_rationale: 'Root-down walk: Speculative fiction > Fantasy (real potion magic, not a technological SF explanation)
  > Real earth fantasy (Babylon, Ohio, in a recognisable US world, not a secondary realm or portal crossing) > Contemporary
  fantasy (modern policing, urban drug trade and industry, not a historical era) > Urban fantasy (magic operates through the
  city''s civic institutions) > Publicly paranormal (clean magic is sold openly and legally; dirty magic is a regulated illegal
  drug; this is not a concealed supernatural enclave or unnamed magical realism) > Paranormal bureau. All four novels keep
  Kate Prospero and the Magic Enforcement Agency in police casework: Dirty Magic investigates a deadly new potion after an
  informant''s death; Cursed Moon hunts a wizard''s dirty-magic bomb during a public Blue Moon crisis; Deadly Spells investigates
  a coven leader''s murder with local police; Volatile Bonds investigates a lab explosion, a shot body and coven murders.
  Agency law enforcement of publicly acknowledged magic is the whole-fiction spine. Not Paranormal aftermath (no originating
  revelation/disaster rebuilding spine), nor Paranormal neighbours (ordinary mixed-community life is not the central work).
  Occult cop is a plausible broad alternative, but its case-world children do not fit this potion-policing world as specifically
  as the already-existing public-agency leaf. Book-one werewolf is a potion casualty, not a whole-series werewolf case-world.
  Not a PI, secret service, vampire lineage story or a romance-first sequence. No definition changes needed. Author lists
  four main novels; Fire Water and The Chosen Ones are novella/collection exclusions.'

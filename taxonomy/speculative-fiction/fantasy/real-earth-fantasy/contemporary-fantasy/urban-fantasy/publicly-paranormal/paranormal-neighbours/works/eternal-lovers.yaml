placement_rationale: '# Eternal Lovers, whole-two walk,23November2026


  ## Decision and scope


  Existing Paranormal neighbours6to7. One shared fiction, two novels: The Witching Hour2012, retitled Death''s Lover2013,
  and Death''s Redemption2014. Display the familiar publisher title Death''s Lover with original2012year and explicit retitle
  note. The first is not a third novel. No structural change. Fine-leaf confidence moderate; the public-reveal Aftermath and
  fae-court alternatives are material.


  Current author book index labels Eternal Lovers books1and2; author series page describes both, Fantastic Fiction and Goodreads
  independently list2. Author''s2014reply says no additional publisher option then, but this is historical scope evidence,
  not proof she can never publish another. No current third established. Her Kingdom and Night series are separately indexed,
  with no source establishing their shared universe with Eternal Lovers. Do not merge on common author/fae vocabulary. A2012announcement
  originally predicted no sequels, superseded by actual2014second novel.


  ## Each novel, including whole-arc evidence


  Death''s Lover: witch Eve Philips loses her human husband in a hit-and-run. Years later, the witch and potion-shop owner
  falls for Cian, a fae grim reaper sent to collect her soul who had also reaped her husband. He defies his orders and queen;
  she must confront his identity and the concealed truth of her bereavement. Witch sisters, grief, healing and a forbidden
  relationship organize the plot. Finished reviews agree romance is foreground and public human/supernatural tensions backdrop;
  they disagree on effectiveness of the ending. Primary promotional excerpt actually read: California permitted supernatural
  beings to live openly ten years earlier; Eve''s coven faces a werewolf/human domestic-violence judgment, she shops at a
  modern San Francisco mall with her husband, and werewolves/vampires/witches are known categories. Cian hides his reaper
  task, not the existence of every supernatural being.


  Death''s Redemption: human Seer Mila O''Fallen has secretly assisted an elite San Francisco taskforce; leaked identity exposes
  her to vampires seeking her powers. Reaper Frenzy sees in her the eyes of the lover he lost centuries earlier. Their protection/romantic
  relationship grows while fae powers, the Morrigan, the dark queen and a consuming Darkness pursue their own ends. Finished
  OBS and Shameless reviews independently establish supernatural powers, desire and mostly human-realm action. Mila''s undercover
  identity is not evidence the entire society hides magic. No complete novel read; final ending mechanics are not invented
  from blurbs. Both published volume plots independently researched, rather than classifying the sequel from the first cover.


  ## Dates and retitles


  Author launch2September2012 explicitly announces The Witching Hour live, following29August2012 formatter announcement. This
  beats FictionDB''s December2012month, while all agree2012year. RNIB/Bookshare publisher record explicitly says Death''s
  Lover was previously The Witching Hour, copyright2013; contemporary promotional tour gives3September2013 reissue. Current
  FantasticFiction''s2013 is the retitle date, not the first existence of the novel. Death''s Redemption author''s3June2014launch
  and retailer metadata agree2014. Use years2012/2014; note first cover displays the later title. No reissue double-counting.


  ## Root-down full walk


  Speculative fiction > Fantasy: literal witch spells, emotional magic, fae soul-reaping, reincarnated-lover implications
  and prophetic visions, not scientific technology. Psychic vocabulary alone does not overcome explicit magic. No real scientific
  rationale or simulation supplied. Visions of past/future are supernatural perception, not an SF time-travel premise. Deathly
  romance is not non-speculative erotica.


  Fantasy > Real earth fantasy: San Francisco/California and modern Earth institutions explicitly anchor both novels; excursions
  to fae realms remain Earth-rooted. Independent Fantasy realms fails; Portal does not govern a couple''s modern life merely
  because a fae character can cross realms.


  Real earth > Contemporary: shopping malls, contemporary policing, shops, phones and California public law. A reaper''s centuries-old
  lover is backstory, not a historical primary setting or dual-era series. No future apocalypse shapes it. Historical/alternate-history
  is an honest worldbuilding rival because of the law and war, but the primary experience is a contemporary paranormal society,
  not a historical divergence studied as such.


  Contemporary children:

  - Urban fantasy wins: witch shops, covens, mixed society and a San Francisco supernatural underworld provide recurring institutions
  for both romances.

  - Contemporary mythic: named Morrigan and Dagda are present, but no retelling or exploration of one inherited mythology
  governs both. Reapers are the author''s fae caste, not automatic Biblical/Demonic classification.

  - Coming of age: these are adult lovers, not youth forming an adult identity through growing magic.

  - Domestic: Eve''s sisters/shop matter, but the household''s multigenerational magic is not the primary site across both
  couples.

  - Dark fantasy: danger and Darkness are genuine but menace is the obstacle within a romantic paranormal narrative, not sustained
  horror/torment as the governing reading experience.

  - Supernatural: no single vampire/werewolf/dragon species dominates; these are mixed communities with fae reapers. Ghost
  stories fails haunting, Surreal afterlife fails a dreamlike dead realm, Undying fails unnatural deathlessness as whole subject,
  Evil deals fails a soul-for-worldly-advantage bargain. The legacy blank Paranormal fantasy leaf is not used as an undefined
  leftovers bucket.

  - Magic realism: supernatural categories are named, regulated and argued over, not unexplained ordinary marvels.

  - Folktale: no governing comic/fable tale-shape.


  Urban children:

  - Publicly paranormal wins with positive primary excerpt and both finished-review accounts: humans know witches/vampires/werewolves,
  law permits open life, mixed shopping/work/relationships are routine but contested. Individual secrecy persists in public
  worlds.

  - Fae founders is a real rival: Cian/Frenzy are fae; courts and queens constrain their lives. Big-city rather than Small-town;
  City changelings fails divided-child-inheritance engine. City fae courts is strongest alternate, but the whole plots are
  forbidden romantic/protective relationships, not an outsider''s court-war, gangland, succession or bargain-politics campaign
  for the metropolis. An antagonistic queen alone cannot replace whole-fiction aboutness. Keep the overlap visible.

  - Paranormal bricks: city is stage, not living/metaphysical fantastical subject.

  - Occult mystery: no recurring sworn-officer/PI caseload. Mila''s taskforce connection belongs to2 and precipitates exposure;
  Cian/Eve do not become detectives. Occult secret service likewise fails recurring state containment mission.

  - Modern goth: no governing ancestral/colonial haunting, institutional occult investigation or war-dead return. Past Great
  War references do not create War ghosts.

  - Weird West: metropolitan San Francisco, not ranch/desert/frontier social world.

  - Freakbusters: magic/fae powers, not weaponized weird science.


  Publicly paranormal children:

  - Paranormal neighbours wins, public everyday mixed society through jobs, sisters, witch shop, love and vulnerable individuals.
  Both novels'' romance is lived within this civic community; community need not be harmonious or low-stakes. Publicness is
  not inferred from a cover or supernatural-reader expectation.

  - Paranormal bureau: state agency is a strand of Mila''s background, not the recurring whole2narrative. Eve''s coven justice
  does not turn her love story into a governmental procedural.

  - Paranormal aftermath: explicit law/reveal and earlier war make this substantial, not a straw rival. Yet the novels do
  not chiefly explore the transformation/remaking or rule of a new political order; characters already work/shop/love in an
  established mixed sanctuary. Finished first criticism expressly calls political conflict backdrop. This distinguishes the
  community experience from a regime/remade-world engine. Moderate fine-leaf confidence, boundary with Aftermath not perfectly
  exclusive.


  ## Evidence quality and visual work


  Primary current publisher pages for both, author launches/index/series, promotional excerpt, library publisher data for
  retitle, finished independent reviews of each and current bibliography consulted. No claim full primary novels read. The
  excerpt was obtained from the2013promotional tour, not an unauthorized full-novel mirror surfaced in search, which was not
  fetched.


  Both exact publisher flat English fronts actually pixel-inspected in a contact sheet, titles/authors clear, matching series
  typography. First title is reissue Death''s Lover; year reflects original novel2012. External hotlinks only, no cover files
  added to repository. Live desktop/mobile QA follows deployment.



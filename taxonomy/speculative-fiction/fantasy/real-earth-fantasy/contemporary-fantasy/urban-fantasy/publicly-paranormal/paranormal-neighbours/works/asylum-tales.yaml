placement_rationale: 'Jocelynn Drake''s Asylum Tales (Angel''s Ink 2012 to Demon''s Vengeance 2015): elves, faeries, trolls,
  werewolves and vampires "mingle freely with humans" (author''s site, jocelynndrake.com/angels-ink) and walk "among humanity"
  (Smexy Books review); humans live "side by side" with them (Goodreads series page). Gage, a former warlock turned magical
  tattoo artist in Low Town, hides only from the Ivory Tower warlocks and witches. Walk: Speculative fiction > Fantasy > Real
  earth fantasy > Urban fantasy > Publicly paranormal > Paranormal neighbours (the supernatural is a known category the society
  names and lives with). Moved from Occult city (curator ''Approved'' phonemsg-01M5FAHJX5FG6G7GSPQCQRX3RZ): the creatures
  are not hidden. Sources: author site, Smexy Books, Goodreads; not read in full.'

  ## Walk and rejected alternatives

  - SF rejected by the owner''s existence-of-magic root rule. Pine Deep has literal ghosts/vampires, Sam Hunter is folkloric
  benandanti, Ink''s tattoos carry dead souls, NecroTek explicitly resurrects ghost pilots through necromancy. This is not
  extrapolated from zombie science or a reviewer''s loose ''vampire'' label. Do not move Joe''s fifteen nominal technothrillers
  separately from the connected fiction.

  - Fantasy realms fails recognizable Earth and its actual universe. Real earth fantasy expressly permits space, parallel
  dimensions and afterlife excursions. Portal fantasy fails organizing engine: the whole fiction is not about repeated exchange/crossing;
  one interdimensional God Machine operation does not dominate it. Kill Switch does NOT establish travel between historical
  eras; neither flashbacks nor alternate zombie timelines triggers a factual time-travel claim.

  - Contemporary is dominant continuing present-day frame: mainline15, PineDeep3, Glimpse/Ink2, Sam1 =21. Alternate zombie
  future9 and NecroTek future3 are substantial straddles, openly retained as one fiction. Red Empire historical origins are
  flashbacks, not whole-fiction era.

  - Mythic: no inherited or invented cosmology is the mainline organizing engine. Magical coming-of-age describes some Rot/Ruin
  growth, not the whole. Domestic, Nocturne, magic realist, folktale/comic/animal fail site, acceptance, dream/liminal or
  tale form.

  - Dark fantasy: horror substantial, but not one menacing place nor pursued personal torment governing fifteen continuing
  covert mission novels. PineDeep and Ink are genuine subseries straddles, not falsely rewritten as service cases. Supernatural
  fantasy is a genuine rival, but mainline engine is not a particular supernatural being, cheating mortality, soul bargain
  or dream afterlife. Paranormal has no written definition; its mixed creatures membership cannot override the stronger institutional
  action engine merely because the existing leaf is available. No Hero''s old placement is NOT an approved precedent to ignore
  newer service partitions.

  - Urban fantasy: contemporary supernatural facts and clandestine protection institutions coexist with ordinary society.
  Government lab/spy services face weaponized extreme science, rather than publicly settled monsters, a fantastical city as
  subject, Faerie survival, Western frontier, occult inheritance or campus/profession life.

  - Occult secret service fails recurring enemy gate: many Joe books'' threats are engineered prions/genetics/drones/nanites,
  not magical effects. No proposal to broaden this parent. Eldritch is serious alternative for KillSwitch/DeepSilence/NecroTek,
  but not the fifteen-book mainline predominance. Demon/magic counter ops likewise distort biological and technical conspiracies.
  Occult cop/PI fail protected-world clandestine defence vs criminal/client case; Sam Hunter alone does not turn the universe
  into a PI series. Modern technomancy fails ordinary technology vs magic-through-machine: literal necromantic tech is NecroTek''s
  mechanism, not most Ledger weapons.



  Whole connected fiction33published novels: Ledger15, PineDeep3, Glimpse/Ink2, SamHunter1, DeadNight3, Rot/Ruin/BrokenLands6,
  NecroTek3. Literal folklore/ghosts/necromancy require Fantasy, not speculative scientific explanation invented for all threats.
  Mainline contemporary covert defence is the weighted organizing engine; personal/community supernatural horror, postapocalyptic
  survival/coming-of-age and cosmic space war remain substantial straddles, not claimed covert missions. Author confirms sameGodMachine
  link toNecroTek and alternate Ledgerzombietimeline. No allLovecraft/unrelatedcameo merger. Each mainline and side volume
  own material/reviews checked, per-volume notes recorded. No verified time-era travel claimed. The Unlearnable Truths40,570wordnovel2016
  is represented with Beneath the Skin collection jacket and explicit container caption; collectionnotcounted. StillofNight
  originalnovel2018 countedonce despite collection packaging. Excludes DarkofNightnovella, Bits&Pieces, Ledgerstorycollections,
  AvalonStation2027unpublished andRPGtieins. Still completedreaderreviews rather than strong independentcritic, explicit source-qualitywobble.
  Full scope and year corrections in supporting walk record.'

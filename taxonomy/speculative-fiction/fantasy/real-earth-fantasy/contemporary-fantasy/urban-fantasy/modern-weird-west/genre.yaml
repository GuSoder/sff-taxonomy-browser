definition: Urban fantasy set in the contemporary American West, where the old Weird West frontier survives as a modern small
  town, ranch country or desert road, and its vampires, witches, ghosts and monsters live in a society that does not know.
  The counterpart of Weird West fantasy, which is the nineteenth-century frontier. Not Weird West fantasy (nineteenth century),
  not Publicly paranormal (there the supernatural is publicly known), not Small-town fae (Faerie peoples).

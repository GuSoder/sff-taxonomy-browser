placement_rationale: Re-walked 2026-10-12 at the curator's instruction ("Do it", 9:05 AM, after he asked why it did not walk
  to Occult secret service). Henry Lamb, a London civil-service archive clerk, is drawn into the Directorate, a covert government
  agency running a secret war against the House of Windsor, over Queen Victoria's 1857 pact handing London's souls to the
  Leviathan. A hidden state service whose work is secrecy and defence against an occult threat is the Occult secret service
  gate. The 2026-10-04 placement in Occult institutions predated the 2026-10-05 split of Occult mystery that created Occult
  secret service and was never re-walked. Split of Occult secret service 2026-10-27 by what the service fights - its enemy is cosmic outsiders pressing into the world, so Eldritch counter ops, not the diabolic (Demon counter ops) or dangerous magic (Magic counter ops) (curator "Approved" phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP).

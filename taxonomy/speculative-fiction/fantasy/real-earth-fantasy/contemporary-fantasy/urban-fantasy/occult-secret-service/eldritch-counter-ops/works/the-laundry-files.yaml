placement_rationale: 'Stross''s Laundry Files, thirteen novels folded (The Atrocity Archives 2004 to The Regicide Report 2026;
  years per the Wikipedia series list): Bob Howard, a former IT worker turned field agent of the Laundry, a top secret British
  intelligence agency that protects the world from Lovecraftian entities reached through mathematics (Macmillan, antipope.org
  series guide, Wikipedia). Root-down: Fantasy -> Real-earth fantasy (our contemporary world) -> Urban fantasy -> Occult mystery
  fiction (a formal service works occult threats) -> Occult secret service (a hidden state supernatural service whose work
  is secrecy and defence), not Occult cop (no badge caseload) or Occult PI (not freelance). Later books shift
  to other agents and a post-Laundry order (New Management) but stay inside the same service and setting. Wobble low. Skipped
  as novellas, novelettes or collections: A Conventional Boy, Escape from Yokai Land, Equoid, Overtime, Down on the Farm,
  A Tall Tail, Three Tales from the Laundry Files, Wireless. Split of Occult secret service 2026-10-27 by what the service fights: its enemy is cosmic outsiders pressing into the world, so Eldritch counter ops, not the diabolic (Demon counter ops) or dangerous magic (Magic counter ops) (curator "Approved" phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP).'

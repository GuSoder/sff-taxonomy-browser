placement_rationale: 'MC04806/07 whole Special Circumstances2 rewalk2026-11-05: Speculative fiction > Fantasy >
  Real earth fantasy > Contemporary fantasy > Urban fantasy > Occult secret service > Demon counter ops. Retain3
  no move/seed. Scope2 publisher Princess2006/Queen2012 corroborated SFE/ISFDB/Goodreads, no missing novel. Form
  caveat explicit: Princess primaryTOC three internal books Almadu Sanction, Necromancy Option, Broken Sabbath;
  PW says less a novel than three linked episodes, SFRevu calls3stories, Rosboch calls episodic novel; Queen primaryTOC
  two internal books, first Mother''s/Maiden''s parallel tales, second Old Time Religion, Locus explicitly fantasy
  novel and no separate earlier constituent publication established. Retain existing integrated2 fiction volumes,
  not multiply internal books into cards or silently label conventional unbroken novels. No unrelated novel, anthology
  or Warehouse13 cameo merged. Princess housewife Barbara''s first bayou murder/cult case kills Lovecraft-like Almadu
  avatar, recruited hidden ecumenical Foundation/SC, longest convention case necromancer summons demon, final family
  soccer coach Satanism defeated. Queen Barbara''s new Sight/hearing, soul-stripped hospital patients, hidden Chattanooga
  demoness investigation with FBI, parallel rescuers enter comatose Janea''s astral DragonCon, later Tennessee killing/kidnap
  Old One threat and national stakes. Read own publisher+completed reviews each, primary Princess ending and Queen
  chapters6/7 verify hidden recruitment and demoness exorcist federal response, Old One final episode secondary
  reviewer/community grounded not primary finished entire novel claim. Fantasy overSF faith powers/gods/angels/demons
  actual not rational biomedical explanation. Real Earth US with spirit realm excursions, not invented realm. Portal
  fantasy substantial Queen astral-rescue strand but no anchored physical threshold/text system or whole2 world-crossing
  engine, first book terrestrial occult response, astral realm part of rescue operation. Contemporary author''s
  modern US, not historical mythology retelling or remade future world; apocalypse a threat fought rather than established
  aftermath. Mythic fantasy gods/Asatru/Christianity real, but operation against varied threats not sustained tradition
  retelling; emerging Gifts adult not magical-coming-of-age; domestic mother role framing not magic household/family
  site whole; dark horror menace but empowered proactive counter-service rather than horror/torment contract; supernatural
  afterlife Janea real but only strand, vampire/werewolf/incidental necromancy not whole subject. Urban institutions
  crime scenes/FBI/hospitals/conventions govern, not rural Western frontier, fae courts or personified city. Publicly
  paranormal no ordinary civic integration despite President''s finale exposure, most story hidden response and
  first hospital disbelieves Barbara. Occult secret service now directly Urban sibling, old note obsolete Occult
  mystery ancestor corrected; FBI liaison and ecumenical spiritual SWAT recruitment/assignment/containment rather
  than civilian PI/hired cases or sworn officer caseload, Lockhart initial cop dies and Barbara central. Not occult
  institution campus/membership story, operational service governs. Demon counter ops faith against damnation/demons/Satan/cults/exorcism
  strongest recurring mode. Primary Queen7 explicit demoness of anger/murder possessing sinners, hooks in soul/Satan
  versusGod, OpusDei undercover federal anti-terror response; first long Necromancy Option and Broken Sabbath similarly
  demonic. Eldritch counter ops very strong straddle: first Almadu Old One and second finale Old One/spawn sanity
  threat real, not erased by calling every creature generic demon; but not whole cosmic-outside containment register
  as Laundry, religious spiritual warfare and damnation recur throughout. Magic counter ops multi-faith power/witches
  real but service not policing rogue magic as primary enemy. Theological faith-source alone not classifier; operational
  recurring foe/mode decides after full walk. Original two fronts replaced with distinct English Baen print fronts160x240/160x243
  pixel-inspected/localized; no count change, no definition edits.'

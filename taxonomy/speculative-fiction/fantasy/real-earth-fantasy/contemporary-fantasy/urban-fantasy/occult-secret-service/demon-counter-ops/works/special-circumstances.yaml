placement_rationale: 'Ringo''s Special Circumstances (Princess of Wands 2006, Queen of Wands 2012; one fiction): Barbara Everette,
  a Mississippi soccer mom and kung-fu teacher, is recruited into the Foundation for Love and Universal Faith (FLUF), a hidden
  network of Wiccans, Druids, Asatru and other practitioners that handles ''Special Circumstances'' for the FBI, fighting
  demons, werewolves and necromancers alongside New Orleans homicide detective Kelly Lockhart (Simon & Schuster; Baen; Wikipedia
  Ringo bibliography). Walk: Fantasy > Real earth fantasy > Urban fantasy > Occult mystery > Occult secret service (a hidden
  service policing occult threats for the state''s law enforcement), not Occult PI (full, and FLUF is an organization,
  not a freelancer) and not Occult cop (no sworn detective at the centre) or Paranormal bureau (the supernatural is
  secret, not state-run and public). Wobble moderate; alternative Occult PI (9, at the gate). Split of Occult secret service 2026-10-27 by what the service fights: its enemy is the diabolic - demons, damnation and apocalyptic plots - so Demon counter ops, not cosmic outsiders (Eldritch counter ops) or dangerous magic (Magic counter ops) (curator "Approved" phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP).'

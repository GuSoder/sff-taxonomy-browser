  cop cases (sworn officers working criminal cases) and not Occult PI (private or freelance investigators); not Occult institutions
  (campuses, societies and professions). Split 2026-10-05 from Occult mystery at ten cards (curator "Approved" (phonemsg-01M46C5ZHZNA8VVZ39X6625QKF,
  2026-10-05 5:51 PM)). Umbrella since 2026-10-27: Eldritch counter ops, Demon counter ops, Magic counter ops (curator approval phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP, 2026-10-27; the counter ops names are his, refined from his Threat Unit coinages in the same thread).'

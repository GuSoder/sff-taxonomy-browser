placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-Earth fantasy > Contemporary fantasy
  > Urban fantasy > Occult secret service. In modern Boston the Department of Unorthodox Affairs keeps the
  paranormal Unorthodox from the ordinary Usuals; its Auditors are "government-sanctioned witches... enforcing
  laws about magic", a state supernatural service whose work is secrecy and containment, not a police caseload
  (PRH series page and book blurbs). Grimsby flunks out of the Auditor program in book one, then becomes the
  Department''s newest, then junior Auditor working cases with veteran Huntsman Mayflower. Rejected: the
  Occult cop leaves (Auditors are not sworn police), Occult PI (the service frames the whole series). One
  fiction: Dead Man''s Hand 2022, Long Past Dues 2023, Cold Iron Task 2025 (Open Library; PRH book page).
  Book four, Grim Folk Tale, is announced for Jan 5, 2027 (PRH) - unreleased at intake, excluded. Split of Occult secret service 2026-10-27 by what the service fights: its enemy is dangerous magic itself - rogue sorcerers, magical outbreaks and mythic creatures - so Magic counter ops, not cosmic outsiders (Eldritch counter ops) or the diabolic (Demon counter ops) (curator "Approved" phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP).'

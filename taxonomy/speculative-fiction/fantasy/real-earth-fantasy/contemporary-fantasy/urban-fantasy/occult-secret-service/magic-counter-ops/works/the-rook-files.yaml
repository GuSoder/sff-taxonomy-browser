placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Urban fantasy -> Occult mystery
  fiction. Hachette centers the Checquy, a formal supernatural intelligence agency protecting Britain from supernatural threats,
  with operatives investigating an internal mole, attacks and rogue agents. Institutional occult enforcement and investigation
  govern the series. Split of Occult secret service 2026-10-27 by what the service fights: its enemy is dangerous magic itself - rogue sorcerers, magical outbreaks and mythic creatures - so Magic counter ops, not cosmic outsiders (Eldritch counter ops) or the diabolic (Demon counter ops) (curator "Approved" phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP).'

placement_rationale: 'Lisa Shearin''s SPI Files (author site lisashearin.com/the-spi-files/ lists all 8 novels in order; first
  publication years: The Grendel Affair 2013, The Dragon Conspiracy 2015, The Brimstone Deception 2016, The Ghoul Vendetta
  2017, Myth Manifestation 2018, The Phoenix Illusion 2018, Solstice Countdown 2021, The Gorgon Agenda 2023). Mac Fraser,
  a seer who can see through supernatural glamour, is an agent of SPI - Supernatural Protection & Investigations - a private
  New York organization founded in 1647 by the dragon Vivienne Sagadraco to police the hidden supernatural community and keep
  its secret from humans (worldswithoutend.com/novel.asp?ID=15294: ''those in the know consisted of the supernatural community'').
  Each book is a counter-ops case for the agency: stopping a Grendel-kin serial killer, recovering cursed diamonds, breaking
  a brimstone cartel. Walk: Speculative fiction > Fantasy > Real earth fantasy (contemporary New York, the masquerade holds)
  > Contemporary fantasy > Urban fantasy > Occult secret service (an organization policing the supernatural) > Magic counter-ops
  > Sorcerer''s society (a private, non-state, non-knightly organization policing its own kind and guarding the secret). Rejected:
  Spook fantasy (no government badge; SPI is private), Templar fantasy (no knightly religious order), Corpo monsterhunt (SPI
  agents are not bounty hunters; the books are protection-and-investigation cases, not for-pay monster kills - the business
  is not the gate), Private eye fantasy (she is an agent of an organization, not an independent investigator). Wobble: SPI
  is a mixed-species company (dragon founder, werewolf and vampire agents) rather than strictly a society of sorcerers, so
  the ''of sorcerers'' word in the gate sits loosely; the gate''s engine - a private society policing its own kind and executing
  what endangers the secret - matches exactly. Whole series one card (11j); queue rows MC06068-71 are books 1-4, books 5-8
  folded as later volumes of the same fiction. Sources: lisashearin.com SPI page (book list and blurbs), fantasticfiction
  for years, worldswithoutend for the org premise.'

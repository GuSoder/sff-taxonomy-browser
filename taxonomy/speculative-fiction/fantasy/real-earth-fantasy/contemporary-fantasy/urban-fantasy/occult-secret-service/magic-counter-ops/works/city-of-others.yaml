placement_rationale: 'Root-down: Fantasy > Real-earth fantasy > Contemporary fantasy > Urban
  fantasy > Occult secret service > Magic counter ops. DEUS Files book 1: in contemporary
  Singapore, civil servant Benjamin Toh and his three-person department investigate and manage
  the city''s supernatural denizens - folklore beings and magical outbreaks "that most people
  don''t notice" (PW, on the author''s site), a hidden state service buried in red tape (LJ:
  "every supernatural problem in Singapore must be investigated by a three-person department so
  wrapped in red tape they can hardly breathe"). Not Paranormal bureau (the supernatural is not
  publicly known - "most people don''t notice"); the enemy is general dangerous magic and
  mythic creatures, so Magic counter ops, not Demon or Eldritch counter ops.'

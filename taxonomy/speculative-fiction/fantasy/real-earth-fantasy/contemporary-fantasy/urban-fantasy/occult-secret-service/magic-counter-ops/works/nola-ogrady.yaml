placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Urban fantasy
  > Occult secret service > Magic counter ops. Present-day San Francisco: Nola O''Grady is a psychic agent of an Agency ''so
  obscure even the CIA doesn''t know it exists'' (PRH book description), partnered with Israeli agent Ari Nathan; the casework
  is rogue magic and mythic creatures - a serial killer murdering actual werewolves, apocalypse cults, Chaos (Jennifer Rardin''s
  cover quote: ''magic, cults, and Chaos''). The service''s enemy is dangerous magic itself, the Magic counter ops definition.
  Not Demon counter ops (no diabolic register), not Eldritch counter ops (no cosmic outsiders), not Occult cop (she is an
  agency operative, not police). Series complete at four novels (Goodreads series page: 4 primary works, 2011-2012, DAW);
  one card folds all four. TENTH card on Magic counter ops: the leaf freezes and a split proposal follows at once.'

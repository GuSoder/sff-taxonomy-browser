    world; as bodies litter the streets, The Commission - a hidden supernatural service - dispatches its enforcers (Karla,
    not human; Jameson, an ex-soldier) to contain the outbreak, while Rhian, a girl from the Welsh valleys, is hunted by the
    wolf in her shadow (Baen publisher copy). Occult secret service gate: a hidden service investigates and contains occult
    threats, its work secrecy and defence rather than a police caseload - The Commission is exactly that. Of the counter-ops
    children the enemy here is dangerous magic itself: historical eruptions warping reality and mythic creatures (the wolf)
    crossing into the world, magic-counter-ops'' ''magical outbreaks and mythic creatures'' - not eldritch (no cosmic outsider)
    and not demon counter ops (the blurb''s ''demons in human form'' is rhetorical texture about bankers, no Hell-register
    plot). Disclosed tangent: the layered-London city-as-subject texture (paranormal-bricks'' shadow-city neighbor) is setting,

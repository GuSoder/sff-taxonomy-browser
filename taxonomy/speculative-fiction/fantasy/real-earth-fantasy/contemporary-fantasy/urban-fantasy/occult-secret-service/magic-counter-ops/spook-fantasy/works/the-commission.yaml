  ## Covers and preservation

  Use the existing Wolf card as the canonical card in Spook fantasy, rename it The Commission (Lucy Universe), and retain
  both existing novels. Replace only these two legacy repository-local cover references with publisher-observed hotlinks,
  after pixel inspection: Lucy''s https://www.baen.com/Chapters/1416521216/1416521216.jpg and Wolf''s https://www.baen.com/media/catalog/product/9/7/9781451639100-med.jpg
  . No cover bytes committed. No unrelated card, genre definition or portrait changed. Existing historical rationales retained
  as history with corrections clearly stated.


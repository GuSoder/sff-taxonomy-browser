placement_rationale: '# The Commission (Lucy Universe): whole-fiction repair

  24 November 2026


  ## Result

  Consolidate the existing Lucy''s Blade (2007) and Wolf in Shadow (2013) cards as one fiction, The Commission (Lucy Universe),
  in existing Spook fantasy. Northern Renaissance fantasy falls 9 to 8; Spook fantasy stays at 6. No novel is added or removed:
  937 nodes, 3013 fictions, 7563 books. No definition or structure changes.


  ## Corpus and authority

  The original normal-intake commission and individual-fiction/shared-universe grant were recovered directly from the authenticated
  conversation before this repair: phonemsg-01M43MYMGAMQTNA3CY402KK7FB and phonemsg-01M66AQB0JEGYRYN8Q7XTWHVDX. The latter
  entrusts individual fiction judgment and says a shared universe is one fiction.


  ISFDB''s Lucy Universe bibliography lists exactly these two novels, plus short fiction and London Days, Demon Nights (2019),
  a collection. LibraryThing independently calls the shared series The Commission and numbers Lucy''s Blade 1, Wolf in Shadow
  2. This is not a same-author inference. The author''s 2009 and 2011 essays explicitly identify Lucy''s modern-frame Jameson
  and Karla as Commission enforcers, connect the service to Walsingham, and trace the shared modern stories. The authorized
  Wolf chapter6 features the same enforcers and institution. The previous two standalone claims were wrong.


  Eligible books: Lucy''s Blade, first printing May2007; Wolf in Shadow, 2013 (ISFDB''s ebook June15 precedes its July print
  release; the year is unchanged). As Black As Hell, Night of the Wolf, Siren Tears, Beauty Is a Witch and Haunts of Guilty
  Minds are short works, excluded. The 2019 collection is excluded, not a third novel. The author''s 2017 reply says no Wolf
  sequel will appear; current bibliographies show no later novel. Neither Citizen nor Venus, Mars and Hell is attached without
  shared-world evidence.


  ## Whole narrative and the root audit

  Lucy''s Blade has an Elizabethan main narrative and a modern London frame. Walsingham has Dee summon a supposed demon to
  investigate threats against Elizabeth. Lilith is actually a created information/energy being from a far-future dark universe,
  launched by dimensional engineers through the Shadow Worlds. Authorized chapter2 explicitly calls the transit backwards
  time travel, shows a black-hole launch apparatus and an internet stop, then Isabella''s sea-diamond mirror and Dee''s containment
  interrupt it. Chapter5 describes Lucy''s enhanced biology, Lilith''s refusal to kill her host by departing, and their developing
  negotiation over bodily control. Finished criticism confirms the late plot moves away from the expected palace assassination
  climax into an Atlantic voyage. The publisher TOC names Bimini and Endings And Beginnings. The author confirms the book
  starts and ends in modern London and introduces Jameson/Karla there. Do not invent the exact final duel or claim all apparent
  magic has been demystified.


  Wolf in Shadow follows Rhian, fleeing a violent tragedy in Wales, into contemporary East London, her wolf-pendant transformations,
  consulting witch Frankie, vampire/elf-like beings and the Commission''s Jameson and Karla. The freelance and state-service
  threads converge on the same danger. Completed criticism describes the institutional obstacle as a suspect protected by
  MI6, and the larger stakes as stopping an Otherworld portal releasing destruction into London. Its city layers are memory-like
  magical Otherworld spaces, not simply an SF future expedition. No exact final killing, romance outcome or portal-closing
  procedure is invented here.


  The original Lucy SF lead was genuine and cannot be suppressed: Lilith is not a traditional supernatural demon. However
  the whole fiction is not justified as SF merely by her future origin. Authorized Wolf chapter4 shows practical geomantic/elemental
  spellwork. Chapter6 explicitly describes Frankie''s reciprocal love-geas experiment binding Karla and Jameson, later failed
  repetitions, and sunlight''s spiritual rather than merely photochemical harm to daemons. Finished reviews likewise treat
  working witchcraft, enchanted objects and Otherworld as real. This supplies positive magic evidence, not only unexplained
  anomalies. The owner''s no-magic-in-SF rule therefore keeps the shared fiction Fantasy-side; the any-SF-time-travel rule
  is downstream of that root decision and does not override it. The scientific flavour in Lucy remains an explicit mixed-ontology
  caveat, not erased.


  ## Root-down walk and rivals

  Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Urban fantasy > Occult secret service > Magic
  counter ops > Spook fantasy.


  Fantasy beats Science fiction because the shared corpus contains actual operative witchcraft and a spiritual supernatural
  order. Real earth beats an independently invented realm: England, Elizabeth''s court, modern London and its institutions
  are explicit. Portal fantasy is a serious rival because Wolf uses Otherworld crossings and a portal threat, while Lucy crosses
  times/dimensions. The shared through-line is the British occult service and threats intruding into its Earth jurisdiction,
  not a continuing journey through a system of worlds. Earth-rooted excursions are allowed by Real earth''s existing gate.


  Historical fantasy > Northern Renaissance fits much of Lucy alone, but cannot describe Wolf or Lucy''s modern institutional
  frame. Contemporary has the broader recurring Commission setting and the entire later novel. This is a whole-fiction choice
  with a genuine substantial historical-volume strain, not a claim every scene is contemporary. The owner''s whole-fiction
  rule allows an overarching hook or, if none covers every book strictly, the defining setting/concept of a subset. The occult
  state-service lineage supplies that hook across both: Walsingham''s earlier defence and the modern Commission.


  Urban beats Contemporary mythic (not a retold national myth), magical coming of age (Rhian''s awakening is not the whole
  corpus), Domestic (no household/family spine), Dark (horror menace not the governing contract), Supernatural creature shelves
  (not primarily vampire or werewolf society), magical realism (marvels are investigated/controlled, not ordinary) and Folktale
  (no governing moral-tale form).


  Occult secret service beats Paranormal bricks/Shadow city: London''s layered history is a strong Wolf setting and mechanism,
  but not a better shared two-novel identity than the service. It also beats Fae founders (not Faerie peoples as the whole
  subject), Publicly paranormal (secrecy retained), Modern goth/Occult institutions (not chiefly a campus, profession or haunted
  institution), Occult cop (not police caseload), and Occult PI (Frankie''s paid jobs are one thread; Walsingham/Commission
  defence is the cross-book hook). Freakbusters fails: Lilith is futuristic, but the recurring enemy is occult intrusion and
  rogue magic, not weaponized scientific inventions.


  Magic counter ops beats Eldritch counter ops: entities are not established Lovecraft-scale cosmic outsiders, and a multiverse
  alone does not make that register. Demon counter ops is a real naming resemblance, but daemons, Lilith and the wolf are
  not a shared Hell/damnation/apocalypse hierarchy. Rogue witchcraft, mythic creatures and magical incursions govern. Within
  Magic counter ops, the British state-service origin and Commission place it in Spook fantasy, not a knightly order, a society
  of sorcerers policing itself, or private commercial monster hunters. Frankie freelances but the whole-fiction card is not
  solely her business.


  Confidence: high on shared corpus and consolidation; moderate on the exact shelf because one major novel is purposefully
  Elizabethan and the series mixes SF explanation with literal magic. No full-novel read claimed. Authorized openings, creator
  accounts, multiple completed reviews and bibliographies support the decision. A future explicit author revision making all
  spellwork technological would reopen the root, not justify hiding today''s evidence.



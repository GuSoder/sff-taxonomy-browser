  bounties, contracts, company loyalty - outside any government badge, knightly order
  or sorcerers'' society. The business is the gate. Not Spook fantasy (state services),
  not Templar fantasy (knightly orders), not Sorcerer''s society (sorcerers policing
  their own), not Freakbusters (the recurring enemy is weaponized weird science, not
  mythic creatures). Seeded on the curator''s approval (phonemsg-01M7Q32YVNB8TWVRC59E6BKK4V,

placement_rationale: Tim Akers' Knight Watch is a hidden agency that protects the mundane world from real monsters of myth
  (a LARP fighter joins it in book 1; Valhellions and The Eccentrics follow). The agency's monster-hunting work for the modern
  world is the engine, the same ground as The Rook Files, so Occult mystery is the nearest home. Split of Occult secret service 2026-10-27 by what the service fights - its enemy is dangerous magic itself - rogue sorcerers, magical outbreaks and mythic creatures - so Magic counter ops, not cosmic outsiders (Eldritch counter ops) or the diabolic (Demon counter ops) (curator "Approved" phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP).

placement_rationale: 'Larry Correia''s Monster Hunter International universe, one shared-world card (rule 11j): the 8 mainline
  novels (MHI 2009 through Bloodlines 2021; Guardian with Sarah A. Hoyt) plus the 4 Monster Hunter Memoirs novels in the same
  world (Grunge, Sinners, Saints 2016-2018 with John Ringo; Fever 2020 with Jason Cordova). MHI is a private, family-founded
  company of professional monster hunters - Owen Pitt is recruited after killing his werewolf boss - killing mythic creatures
  (werewolves, vampires, wights, an Old-Ones cult arc) for PUFF bounties, with the supernatural hidden from the public (Baen;
  publisher copy). The enemy sorts under Magic counter ops (mythic creatures), and the outfit is a business, not a state service,
  knightly order or sorcerers'' society: Corpo monsterhunt, seeded for this card (curator approval phonemsg-01M7Q32YVNB8TWVRC59E6BKK4V).
  Walk: Fantasy > Real Earth fantasy > Contemporary fantasy > Urban fantasy > Occult secret service > Magic counter ops >
  Corpo monsterhunt. Tried: Spook fantasy (MHI holds no badge; federal agents are rivals as much as allies), Templar fantasy
  (no knightly order - a company with a payroll), Eldritch counter ops (the Old Ones are one arc, not the recurring enemy).
  Wobble: low. Queue row MC05825 (MHI Second Edition 2015) is the revised reissue of book 1, folded here as the same novel.'

placement_rationale: 'Full root-down walk: Fantasy (hidden monsters in the present day) > Real earth fantasy > Urban fantasy
  (modern cities, a supernatural world kept out of sight, so not Publicly paranormal) > Occult mystery fiction (formal body
  of enforcers, not a modern-goth haunting) > Occult secret service, not Occult cop (no badge or precinct) and not Occult
  consultants (John Charming left the order but the work is still the Knights'' secret war): a Knights Templar-style order
  of monster hunters, updated with Kevlar and shotguns, hides the Pax Arcana from the world; Charming, a former hunter turned
  werewolf, works against and beside it. Hachette (https://www.littlebrown.co.uk/titles/elliott-james/charming/9780316253390/). Split of Occult secret service 2026-10-27 by what the service fights: its enemy is dangerous magic itself - rogue sorcerers, magical outbreaks and mythic creatures - so Magic counter ops, not cosmic outsiders (Eldritch counter ops) or the diabolic (Demon counter ops) (curator "Approved" phonemsg-01M5YY46GJ4DNZSJYN0CTAD9EP).'

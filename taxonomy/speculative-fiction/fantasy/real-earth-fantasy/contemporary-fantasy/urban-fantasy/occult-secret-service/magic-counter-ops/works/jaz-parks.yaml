placement_rationale: '# Jaz Parks: normal intake, MC04452-60

  2026-10-29


  Place Jennifer Rardin''s complete eight-novel Jaz Parks fiction in Magic counter ops, 7 to 8. Exclude Paul and Brady Get Hoodoo with
  the Voodoo as a short story. No seed, split, definition change or reassignment of another fiction. The strongest rival is Demon counter
  ops because possession and Hell become major stakes in the concluding arc. They do not turn the whole eight-volume service into a
  specialist diabolic agency.


  ## Corpus, sources and publication dates

  One fiction, eight novels: Once Bitten, Twice Shy (2007); Another One Bites the Dust (2007); Biting the Bullet (2008); Bitten to Death
  (2008); One More Bite (2009); Bite Marks (2009); Bitten in Two (2010); The Deadliest Bite (2011). The primary author page lists all
  eight in order and no ninth novel: https://www.jenniferrardin.com/books . ISFDB''s series bibliography independently distinguishes
  the novels from short fiction and the 2008 excerpt of One More Bite: https://www.isfdb.org/cgi-bin/pe.cgi?23957= . Goodreads agrees
  on eight primary works: https://www.goodreads.com/series/44695-jaz-parks . No separate card for each mission.


  Date caveat: Goodreads and BingeBooks put One More Bite in 2008, the latter December15. Hachette UK gives January29,2009. ISFDB title
  record gives January2009 for both initial print editions and January5,2009 for the US ebook; FictionDB also gives January2009. Use
  bibliographic first-novel year2009, not the 2008 excerpt or contradictory vendor-feed date. This is a documented disagreement, not
  proof no early release ever occurred. https://www.isfdb.org/cgi-bin/title.cgi?876857= ; https://www.hachette.co.uk/titles/jennifer-rardin/one-more-bite/9781841497099/
  ; https://www.fictiondb.com/book/one-more-bite~jennifer-rardin~244960.htm ; https://bingebooks.com/book/one-more-bite . Bite Marks
  UK selected print page gives2010, but US2009 editions are independently listed in ISFDB and Fantastic Fiction; use2009. https://www.isfdb.org/cgi-bin/publisheryear.cgi?25520+2009=
  ; https://www.fantasticfiction.com/r/jennifer-rardin/bite-marks.htm . Do not copy the previously encountered Hachette Australia 2006
  metadata for the eighth novel: series bibliography and UK publisher agree2011.


  Paul and Brady is explicitly named among five short stories in publisher Quick Bites contents. Those other short stories and that
  collection are excluded too, not missing novels. https://www.hachette.co.uk/titles/jennifer-rardin/quick-bites-a-short-story-collection/9781405520805/
  ; individual ebook: https://www.hachette.co.uk/titles/jennifer-rardin/paul-and-brady-get-hoodoo-with-the-voodoo/9781405520768/ . MC04459
  is therefore skipped, not placed.


  ## Every-volume whole-fiction check

  1. Once Bitten, Twice Shy: contemporary CIA vampire assassin Vayl and human operative Jaz investigate Miami surgeon Assan''s terrorist
  links; Jaz''s blackouts and concealed supernatural survival complicate the assignment. Vampires and occult world domination, not an
  agency exclusively fighting Hell. Author synopsis and publisher independently establish the service, and SFFWorld''s full review confirms
  the hidden CIA group and vampire Edward Samos/Raptor background. https://www.hachette.co.uk/titles/jennifer-rardin/once-bitten-twice-shy/9781841496375/
  ; https://www.sffworld.com/2007/11/bookreview410/

  2. Another One Bites the Dust: steal back biotechnology from armoured vampire Chien-Lung while undercover at Corpus Christi festival;
  soul-eating reavers and Jaz''s nightmares intersect. Independent reader confirms mission, armour bonding at cellular level and reapers
  as soul-stealing demons, alongside evolving personal relationships. There is a genuine diabolic ingredient already, not an assertion
  that first books contain no demons. https://www.hachette.co.uk/titles/jennifer-rardin/another-one-bites-the-dust/9781841496399/ ;
  https://bookdout.wordpress.com/2011/04/08/review-another-one-bites-the-dust-by-jennifer-rardin/

  3. Biting the Bullet: Iran special-ops/terrorist mission, mole in team, reavers, parasitic monsters and Seer manipulating Vayl through
  hope of finding his sons. Review describes supernatural terrorism, necromancy, zombies and a trip through Hell, but the mission remains
  broad covert supernatural counter-ops. https://www.hachette.co.uk/titles/jennifer-rardin/biting-the-bullet/9781841496405/ ; http://www.lovevampires.com/jerbullet.html

  4. Bitten to Death: Greek vampire Trust, Vayl''s past allies, Samos confrontation and Jaz''s brother''s unstable military situation.
  Publisher and full Bookbag review establish the series'' Raptor arc moving toward confrontation, not a detachable demon-slaying episode.
  https://www.hachette.co.uk/titles/jennifer-rardin/bitten-to-death/9781841497082/ ; https://www.thebookbag.co.uk/reviews/Bitten_to_Death_(Jaz_Parks)_by_Jennifer_Rardin

  5. One More Bite: following Raptor''s death, CIA tries to preserve balance among Flock vampires, Valencian Weres and Inverness witches.
  Jaz/Vayl must stop another assassin killing the coven leader. Demons and family complications are present, but mission engine is supernatural-faction
  covert action. Author page gives these factions explicitly, publisher agrees: https://www.hachette.co.uk/titles/jennifer-rardin/one-more-bite/9781841497099/
  . Publisher US store agrees: https://shop.hachettebookgroup.com/products/one-more-bite . BingeBooks'' substantial sample independently
  shows briefing and mission rationale, not just synopsis.

  6. Bite Marks: prevent gnome larvae sabotage at NASA Canberra communications complex while Jaz''s possession worsens, Kyphas seeks
  Cassandra''s soul and team tensions compound the mission. Publisher gives gnome god''s annihilation plan and the personal demons;
  reader distinguishes mission from intersecting demonic stakes. https://www.hachette.co.uk/titles/jennifer-rardin/bite-marks/9780316043823/
  ; https://shop.hachettebookgroup.com/products/bite-marks ; https://www.readingbetweenthewinesbookclub.com/2010/11/book-review-bite-marks-by-jennifer.html
  ; http://alphareader.blogspot.com/2010/03/bite-marks-jaz-parks-6-by-jennifer.html

  7. Bitten in Two: Morocco artifact to free Jaz from Lucifer''s assassin Brude, while a curse makes Vayl treat his teammates as people
  from his eighteenth-century past. Reviewer confirms bodily possession symptoms, recovery of Vayl and resolution of earlier plot strands.
  This is the most serious Demon counter ops fit. Vayl''s altered perceptions are false memories, not literal historical relocation
  or an SF Mind over time mechanism. https://www.hachette.co.uk/titles/jennifer-rardin/bitten-in-two/9780316043786/ ; https://hiddeninpages.com/2010/11/19/review-bitten-in-two-jaz-parks-book-7-by-jennifer-rardin-55-stars/

  8. The Deadliest Bite: final Brude/Hell soul rescue intersects an attack on Vayl, his reincarnated sons, Roldan the werewolf and the
  old team''s relationships. Publisher calls Jaz a consultant able to refuse CIA jobs, a real shift from salaried missions, not something
  to conceal. Entire series still revolves around the established covert team; finale ties up personal consequences rather than introducing
  an independent private-investigator practice. Full-series reader overview''s final-volume review confirms Hell, lost children, Roldan,
  Sthenno and Kyphas, and final resolutions. https://www.hachette.co.uk/titles/jennifer-rardin/the-deadliest-bite/9780316043816/ ; http://fangfiction.blogspot.com/2010/11/jennifer-rardin-jaz-parks.html


  ## Root-down hard walk and rival rejection

  Speculative fiction > Fantasy: actual vampires, soul-eaters, reincarnation, curses and Hell are supernatural facts, not scientistic
  explanations. Spy technology and NASA do not make it SF. Fantasy > Real earth fantasy: recognizable CIA, Miami, Texas, Iran, Greece,
  Scotland, Canberra, Morocco and Romania; travel to Hell is in Earth''s supernatural cosmology, not an independently invented primary
  universe. Contemporary fantasy: present-day institutions and computers, not a historical-era story; Vayl''s old memories are not the
  setting of the whole fiction.


  Contemporary fantasy > Urban fantasy: occult systems inhabit modern human institutions and settlements. Not Contemporary mythic retelling,
  magic realism''s ambiguous everyday marvel, magical childhood education, domestic familial marvel, folktale or animal viewpoint. Dark/supernatural
  fantasy are descriptive resemblances, but the repeating plot apparatus is occult operational investigation and containment, not horror
  atmosphere or suffering as the organizing end. Romance is sustained but the source-reviewed missions supply a persistent independent
  engine.


  Urban fantasy > Occult secret service: CIA hidden supernatural assassination/protection unit, covert missions against threats to the
  human world. Not sworn police criminal caseload, not a private detective business, not an occult campus or profession where institutional
  life is the focus. Jaz''s consultant status in book8 does not erase seven volumes of that operational unit or change the final team''s
  identity.


  Occult secret service > Magic counter ops: varied dangerous magic and supernatural/mythic creatures are the recurring enemy field,
  with vampires and other non-diabolic factions central to the Raptor arc and later gnome sabotage. Demon counter ops is a genuine moderate
  wobble, not a token rejection: demons, damnation, soul contracts and Hell are major in6-8 and occur earlier. But the whole fiction
  is not a service defined by fighting the diabolic rather than magic. Making the Brude resolution stand for all eight would misdescribe
  vampire terrorism, witches/weres balance and the mixed agency missions. Eldritch counter ops fails: no Lovecraft-scale cosmic outsider
  as the controlling foe. Vampire hunt would overread the partner''s species and early enemies; Vayl is an ally, later witches/gnomes/Brude
  matter centrally. Shapechanger shelves likewise mistake one antagonist/faction for the whole. Portal fantasy would mistake Hell missions
  for the fiction''s primary engine.


  This is a placement judgment under the user''s original individual-move grant, phonemsg-01M63B6PTVDTX8TZVYPSWGTJGP. No changed definition
  and no structural execution. Existing leaf7 becomes8, safely below the split gate.


  ## Visual and limitations

  All eight covers downloaded directly from image URLs exposed by https://www.jenniferrardin.com/books . Inspected actual contact-sheet
  pixels at1000x820: matching eight title/author fronts, coherent English series designs, no placeholders/stickers/back-cover images.
  Local selected files cover-jaz-1.jpg through cover-jaz-8.jpg. Source URLs preserved in sources.md. No new genre portrait.


  Classification is source-supported interpretation, not a claim to have read full novels. Primary blurbs were checked for every volume,
  with substantive independent reviews for1-4 and6-8 and a substantial sample for5. Date5 remains a documented metadata disagreement;2009
  follows bibliographic title/edition records and the publisher. The strongest classification uncertainty is the genuinely diabolic
  late arc, explicitly retained above.


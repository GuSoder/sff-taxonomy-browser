placement_note: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Urban fantasy
  > Modern goth > Modern occult > Occult institutions. Per the author''s site
  (jamespblaylock.com/book/the-knights-of-the-cornerstone/) and Penguin Random House
  (penguinrandomhouse.com/books/289051): a contemporary fantasy thriller - cartoonist Calvin Bryson is
  called to the isolated town of New Cyprus and discovers the Knights of the Cornerstone, a secret
  order guarding the Veil of Veronica, a relic with real magical properties. Working magic embedded in
  a secret society with a religious charge: the leaf definition''s ''secret societies ... or
  religion''. Rejected: Modern biblical myth (no God, angels, prophets or End-Days acting openly - a
  guarded relic is not open divine action), Occult city (an isolated small town, no urban magical
  economy), Occult bloodline (an initiatory order, not inherited family practice), arthurian/grail
  branches (contemporary setting, no retold named narrative). Wobble: low. Standalone (Ace 2008).
  Sources: author site, PRH; not read.'

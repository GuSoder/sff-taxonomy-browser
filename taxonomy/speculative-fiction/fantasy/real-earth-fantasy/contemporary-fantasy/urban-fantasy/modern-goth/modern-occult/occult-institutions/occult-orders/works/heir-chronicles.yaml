first_published: 2006
canonical_genre: occult-orders
placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-Earth fantasy
  > Contemporary fantasy > Urban fantasy > Modern goth > Modern occult > Occult
  institutions. In present-day Ohio the Weir - wizards, warriors, enchanters,
  sorcerers and seers - live under the Rules of Engagement while the wizard houses
  (the Roses) fight for control of the guilds; Jack, a born warrior made wizard, is
  pulled into the tournament law and guild politics the institutions run on (series
  copy). Working magic embedded in institutions and professions, the leaf definition.
  Rejected: Occult bloodline and its lines (the engine is guild law and institutional
  control, not family inheritance), hidden-world quest lines (no quest spine).
  Wobble: moderate; the leads are teenagers and school frames parts of the story.
  One shared world (rule 11j): the five Heir novels fold as one fiction; the Books
  I-III omnibus row (MC01849) is skipped.'

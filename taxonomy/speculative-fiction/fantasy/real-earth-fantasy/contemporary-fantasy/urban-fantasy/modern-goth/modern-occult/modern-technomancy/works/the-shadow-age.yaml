placement_rationale: 'Kim Harrison''s The Shadow Age (Three Kinds of Lucky, Mar 2024; Secondhand Luck, Feb 10, 2026; PRH,
  ISFDB, author interview): Petra Grady has no talent for magic but is a sweeper first-class who handles dross, the magical
  waste of other people''s spells, at the mages'' university; she bonds with a shadow, Pluck, and in book two makes a place
  at St. Unoc University as the first weaver to use shadow magic in a thousand years, against an ancient shadow with a deadly
  agenda. Walk: Fantasy > Real-earth fantasy > Urban fantasy > Modern goth > Modern occult > Occult institutions (working
  magic embedded in a university and its profession). Alternatives tried: Magic school (no one is being taught; she works
  there as staff) and Occult city (the setting is an institution, not the city''s magical economy). Placed 2026-10-12 after
  the curator dissolved the Occult institutions split question (no split; 8 became 9). Sources: PRH, ISFDB; not read.'

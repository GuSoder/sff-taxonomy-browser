placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Urban fantasy
  > Modern Goth > Modern occult > Occult bloodline > Occult legacy. Zo Grey inherits the Gothic mansion on Watch Hill from
  distant Cameron kin and learns she is heir to a powerful Divinity coven, her dormant witch powers surfacing (Smexy Books
  2024-10-09, Gizmo''s Reviews 2024-10-16, Hachette). The bloodline''s claim, not a practiced art, opens the occult world:
  the leaf''s definition. Book 1 of The Watch Hill Trilogy (author''s own series name, HarperCollins series page); as of 2026-11-10
  only volume 1 is published, book 2 TBA, so the card holds the published volume. Rejected: Romantasy (gate requires secondary
  world; this is contemporary Louisiana), Occult tradition (no family art was handed down; her mother hid it), Occult city
  (one house and one small town, not an urban magical economy). Wobble: real; paranormal-romance marketing and the Gothic
  mansion pull toward a gothic-romance leaf the taxonomy does not have, and the coven brushes Occult institutions, but the
  inheritance is the engine.'

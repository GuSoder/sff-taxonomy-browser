placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Urban fantasy > Modern goth > Modern occult > Occult
  city. One shared universe (curator rule 11j): the Matthew Swift novels and their sequel series Magicals Anonymous share the same magical London (felixonline 2013;
  urbanfantasy.fandom series page; Publishers Weekly author page). Modern London where the city itself is the magic: Matthew Swift, resurrected sorcerer, becomes
  the Midnight Mayor, the city''s occult protector; the plots run on London''s soul, spirits and hidden magical economy, and Magicals Anonymous opens with London''s
  soul missing - the Occult city definition exactly (shelf-mates Kraken, Sandman Slim). Rejected: Occult mystery (no detective spine), Occult institutions / Occult
  orders (no initiatory society recruits him; the office of Midnight Mayor is the city''s, not an order''s), Magical coming-of-age (adult protagonists, no formation
  arc). Bibliography verified current via Publishers Weekly''s Kate Griffin author page: Matthew Swift complete at 4 (A Madness of Angels 2009, The Midnight Mayor
  2010, The Neon Court 2011, The Minority Council 2012), Magicals Anonymous complete at 2 (Stray Souls 2012, The Glass God 2013); the unlisted volumes are folded
  into this card.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary
  fantasy > Urban fantasy > Modern goth > Modern occult > Occult institutions. The Apkallu are a
  secret society of sorcerers who rule the modern world from the shadows, concealing themselves from
  ordinary humanity; Sam Arquero, whose family was killed by an Apkallu-sent demon, learns magic under
  a new identity to infiltrate the order and bring it down (Baen book description, 9781982125332;
  author site: "a modern-day noir fantasy, with magic and demons and a secret society of wizards in
  Manhattan"). Working magic embedded in a secret society - the leaf definition, with Ninth House and
  The Atlas Series as direct precedents. Rejected: Occult city (the organizer is the society, not the
  city or its hidden economy), Magic counter ops / Occult secret service (Sam is a lone infiltrator,
  not a hidden or state service), Dark fantasy (menace organized as an institution, not places or
  tormentors). Wobble: low. Standalone - the author lists it as "my only urban fantasy novel", no
  series (jamescambias.com). Sources: baen.com, jamescambias.com; not read.'

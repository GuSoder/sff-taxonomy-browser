id: arcane-underworld
title: The Arcane Underworld series
authors:
- Jamie Schultz
first_published: 2014
canonical_genre: occult-city
placement_status: accepted
placement_rationale: |-
  Root-down: Fantasy > Urban fantasy > Modern occult > Occult city. A crew of occult thieves works heists through the arcane underworld of contemporary Los Angeles - back-alley magic practitioners, a crimelord magus "condemned to Hell", demonic forces (jamieschultz.net/books; penguinrandomhouse.com/series/725/). Library Journal: "a cross between the TV show Leverage and Jim Butcher's Dresden Files". The hidden magical economy of the city organizes the story - the series is named for it. Rejected: Caper fantasy (Sword and Sorcery-bound, secondary world; this is contemporary LA), Occult PI / Occult mystery (the crew are thieves, not investigators), Wainscot fantasy (they live in the underworld, not at its threshold). 3 novels (Premonitions 2014, Splintered 2015, Sacrifices 2016 - Roc; Sacrifices ebook-only per Black Gate); only the first two are in the intake list.

placement_status: accepted
placement_rationale: 'Seanan McGuire''s InCryptid series (DAW, then Tor, from Discount Armageddon, March 2012, to Butterfly
  Effects, March 2026; seananmcguire.com InCryptid FAQ, Wikipedia bibliography): humanity is not alone, the ''ghoulies and
  ghosties'' are real and cryptozoology is a real science, humans are only the dominant species thanks to centuries of work
  by a monster-hunting organization, the Covenant of St. George, and the Price family, a multi-generational line of cryptozoologists
  and monster-sympathizers (Verity, a ballroom dancer and urban cryptid specialist; Alex; Antimony), shelter the cryptids
  the Covenant would kill. 15 novels folded into the first as one shared universe (rule 11j); the Ghost Roads books are set
  in the same universe but are a separate series with their own heroine and sit as their own card. Walk: Fantasy > Real-earth
  fantasy > Urban fantasy > Modern Gothic > Modern occult (occult systems inside contemporary life) > Occult bloodline (family
  inheritance and practiced ancestral trade open the occult world). Tried: Occult institutions (the Covenant is the antagonist,
  the story is the Price family), Occult PI (not hired cases) and Paranormal aftermath (the world is not publicly
  remade). Wobble: the Price inheritance is trained craft and family loyalty more than ancestral magic.'

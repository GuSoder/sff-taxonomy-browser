id: build-your-house-around-my-body
title: Build Your House Around My Body
authors:
- Violet Kupersmith
first_published: 2021
canonical_genre: postcolonial-gothic
placement_status: accepted
placement_rationale: Penguin Random House calls it part ghost story and follows women bound through generations by ghosts, ancestors, possessed bodies and possessed lands; Oneworld ties their revenge to Vietnam's colonial past. Occult forces carry accumulated historical and familial darkness into modern Saigon, making Modern Goth the engine-level fit.

placement_rationale: 'Shared-universe card (one fiction, 11 novels, 2006-2021; PRH series page and karenmoning.com series
  list: Darkfever, Bloodfever, Faefever, Dreamfever, Shadowfever, Iced, Burned, Feverborn, Feversong, High Voltage, Kingdom
  of Shadow and Light; graphic novel Fever Moon and the bonus scene excluded). MacKayla Lane, a sidhe-seer, goes to Dublin
  to hunt her sister''s murderer as the walls between our world and Faerie fail; Seelie and Unseelie courts, the Sinsar Dubh,
  Barrons and the Nine; the middle books follow Dani O''Malley; the war of the courts closes with Mac as High Queen. Old Faerie
  courts and their bargains surviving inside a modern metropolis, the city as stage - the big-city-fae shape; shelf-mate October
  Daye. Rejected: occult-mystery (no formal caseload; the hunt is personal and the engine is the fae war, not solved cases),
  publicly-paranormal (the fae are hidden until the wall crash mid-series; public uptake is not the fiction''s frame), modern-goth
  (no haunting-by-debt Gothic engine). Moning''s Highlander romances share the world (the Keltar bridge; Goodreads series
  note) but are a separate romance-first series on the author''s own bibliography and not in this queue window; the card is
  the Fever fiction.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy (elves and magic are literal) > Real earth fantasy (Chicago
  transformed by the return of Faerie) > Contemporary fantasy (the WELL author interview calls it contemporary; the Roaring
  Twenties imagery is a borrowed gangster style, not an actual historical Capone-era setting) > Urban fantasy (gangland Chicago
  and its Levee institutions organize Danny''s coming of age) > Fae founders > Big-city fae (returned Faerie peoples, exiled
  elven royalty, magic and bargains shape the modern metropolis). The WELL interview with Ford explains the contrast with
  a hypothetical historical Capone-era novel; James Walton describes the Levee as mixing the 1920s and 1990s, with elves as
  gangsters and spells imported from Elfland; Green Man Review confirms the human/elf society and conflict with Whisper Who
  Dares. Genuine wobble: the Levee is a standing borderworld between Earth and Faerie, near Borderland multiverse fantasy.
  But the sources describe Danny joining and living in the urban community, not a crossing itinerary or a many-world cosmology;
  city fae society is the sustained engine. Not Noir fantasy because the actual setting is not the 1930s/1940s. Not Paranormal
  neighbours: fae power and gangster bargains, not ordinary supernatural domestic community. Standalone novel, not a Bordertown
  franchise book despite deliberate resemblance (Green Man explicitly distinguishes it). First published December 2000 (ISFDB);
  2001 and 2025 queue rows are editions.'

placement_rationale: 'Lackey and Rosemary Edghill''s Bedlam''s Bard books of the Elves on the Road universe (Baen, 2001-2019;
  mercedeslackey.com, Wikipedia, ISFDB): the New York flute-player and bardic mage Eric Banyon, with the elves of Elfhame,
  a Seleighe Court and the malevolent Unseleighe, in the modern world. In Mad Maudlin (2003) Eric, about to graduate from
  Juilliard, is hunted by Bloody Mary, a street legend that took on a life among homeless children in New York''s shelters;
  in Music to My Sorrow he fights an evangelist who is a tool of the Unseleighe, who feed on human sorrow, to get his brother
  Magnus away from their parents; The Waters and the Wild (2019, SERRAted Edge, with Edghill) has a lake resort in the Adirondacks
  and something not of this world under the water. Walk: Fantasy > Real-earth fantasy > Urban fantasy > Fae founders (old
  Faerie peoples, courts and bargains survive into and shape the modern world) > Big-city fae (the metropolis is the stage;
  New York here). Rejected: Small-town fae (the city is the setting), Perilous fairy doors and other Portal fantasy leaves
  (the elves are in our world, not behind a door), Bard hero (the bard is a modern musician whose magic works against elves
  and street legends, but the elves'' court and the city decide the branch), Fairytale transplant. One series is one fiction
  (11j): Beyond World''s End, Spirits White as Lightning, Mad Maudlin, Music to My Sorrow and the SERRAted Edge sibling The
  Waters and the Wild; the earlier Knight of Ghosts and Shadows, Summoned to Tourney and Bedlam Boyz are not in the queue,
  and the compilations A Host of Furious Fancies and Bedlam''s Edge are skipped. Wobble moderate: for Beyond World''s End
  and Spirits White as Lightning the sources are only series descriptions, so those two are folded by series; The Waters and
  the Wild is a lake resort, not a city, and is the weakest fit. Years from Wikipedia and ISFDB.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Urban fantasy
  > Fae founders > Small-town fae. Finn Sullivan moves to Fair Hollow, a small college town in upstate New York, where the
  Fata family and the faery folk - ''the children of nothing and night'', the Gentry - rule the abandoned places; a modern
  gothic retelling of the Tam Lin ballad (publisher copy, Dijkstra Agency and Goodreads series page). Fae peoples living on
  in a small town where the woods are close: the Small-town fae gate. Not Big-city fae children (no city); series complete
  at three novels 2014-2016 (author''s agency page, isfdb); one card folds all three. Queue companions: Bones and Heart is
  a short tale (skip), Briar Queen and Nettle King fold here.'

  it contains threats for the state rather than working cases; mirrors Space mystery and Fantasy mystery (the curator''s "Ok,
  do it" (2026-10-12 12:01:10 PM CEST, phonemsg-01M4QRY7C26VC7338KJSM56RQ3, on the proposal to lift Occult secret service one level and rename Occult police to
  Occult mystery)).'

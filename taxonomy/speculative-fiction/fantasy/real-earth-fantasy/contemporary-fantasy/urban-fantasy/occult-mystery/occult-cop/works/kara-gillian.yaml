placement_status: accepted
placement_rationale: 'Root-down: Fantasy > Real-earth fantasy > Contemporary fantasy > Urban fantasy > Occult mystery > Occult
  cop. Kara Gillian is a sworn homicide detective in Beaulac, Louisiana who is also a secret Summoner of Demons: ''she must
  draw on her skills as a police officer and master of the arcane to stop the Symbol Man'' (dianarowland.com/demons.html,
  DAW). Badge, boss and case file with every case shaped by the arcane - the leaf definition verbatim. Not Occult secret service
  (ordinary municipal police, not a state occult service) and not Occult PI (she carries a badge). The supernatural stays
  hidden from the public. One card for the Kara Gillian series: nine novels 2009-2022; the 2012 ''Kara Gillian'' Open Library
  entry is an omnibus of the first books and is skipped. Years are first publication (Open Library; Secrets of the Demon is
  2010 there against the queue''s 2011).'

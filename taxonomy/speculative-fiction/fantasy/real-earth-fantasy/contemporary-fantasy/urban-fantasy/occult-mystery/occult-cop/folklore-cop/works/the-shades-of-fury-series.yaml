placement_rationale: 'Boston PD''s Chief Magical Investigator Riss Holloway - herself a Fury - works supernatural cases: a
  murdered sister Fury, shapeshifter killings, a civil war among the gods (kaseymackenzie.com, ''The Shades of Fury Series'';
  Penguin Random House series page). Walk: Fantasy (real magic) > Real-earth fantasy > Contemporary fantasy > Urban fantasy
  > Occult mystery (a case drives the story) > Occult cop (sworn Boston PD officer: badge, boss, case file) > Folklore cop
  (Furies, Harpies, Oracles and Sidhe - beings of Greek myth drive the cases; the arcane world is hidden from mortals, so
  not Monster cop''s openly nonhuman city). One universe, one card (rule 11j); series completion verified against the author-site
  and ISFDB bibliographies (three published novels; the fourth, White-Knuckled Fear, was never published). Source: author
  site; not read.'

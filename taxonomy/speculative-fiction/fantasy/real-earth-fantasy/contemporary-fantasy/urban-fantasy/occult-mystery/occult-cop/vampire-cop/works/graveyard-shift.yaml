placement_rationale: 'Path: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Urban fantasy > Occult
  mystery > Occult cop > Vampire cop. A single novel (2017, Tor): Alex Menkaure, a revived pharaoh, and his vampire partner
  Marcus work vice in a special Miami police unit, and the case is poisoned artificial blood that drives vampires to murder,
  which opens onto an ancient vampire conspiracy (Tor Publishing Group page, Booklist quote there, author interviews). The
  author has published no further novel in the series (a sequel is only planned), and shorter stories in the universe are
  excluded as novels-only. Sworn officers on a case file, so Occult cop; vampires drive the cases, so Vampire cop. Rivals
  rejected: Monster cop (the city is a human one with a nonhuman minority, not an openly nonhuman city), Folklore cop (the
  engine is vampires, the mummy is the hero not the quarry), Paranormal bureau (the unit is a police squad working cases,
  not a state registry of the supernatural). Wobble: Monster cop, because the cast mixes mummies, vampires and shapeshifters.'

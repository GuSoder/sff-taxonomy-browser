placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary
  fantasy > Urban fantasy > Occult mystery > Occult cop > Folklore cop. Detective Tohru Takuda
  is a sworn police detective in modern Japan whose cases are driven by the Drowning God, a
  supernatural being with a centuries-long reign of terror; joined by a junior officer and a
  Buddhist priest, he hunts the gods of the series across The Drowning God (2015) and The
  Devouring God (2016) (author site kendley.com series page). Gods and spirits of folklore drive
  the cases - the leaf definition. Rejected: Occult cop umbrella proper (leaf shelves by
  case-world; folklore beings fit here), Curse cop (an artifact drives The Devouring God''s
  murders, but the series engine is the god-beings, not objects), Monster cop (the folklore is
  hidden - "modern Japan''s darkest secret" - not an openly nonhuman city), Demon cop (Japanese
  gods/spirits, not demons). Wobble: low. Three published novels: The Drowning God (2015,
  Harper Voyager Impulse), The Devouring God (2016, Harper Voyager Impulse), The Fox Bride
  (2020, "A Drowning God Tale" on the cover), one series (ISFDB "Tohru Takuda" series), one
  card. Sources: kendley.com, isfdb.org; not read.'

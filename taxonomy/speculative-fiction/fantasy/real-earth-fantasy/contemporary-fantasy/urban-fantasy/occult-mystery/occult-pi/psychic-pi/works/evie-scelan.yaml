placement_rationale: '# Evie Scelan whole-fiction walk,23November2026


  Verdict: existing Psychic PI,3to4fictions. One connected fiction, Margaret Ronald''s Spiral Hunt2009, Wild Hunt2010, Soul
  Hunt2010. QueueMC06321-22 supplies only the last two; first novel folded in. No seed, definition change, other-fiction move
  or threshold. No existing Ronald/Evie/Spiral duplicate found in active YAML or serialized corpus.


  ## Scope and dates

  Publisher author bio identifies the earlier two novels; current author/genre-magazine bibliography, Fantastic Fiction and
  completed trilogy reviews agree on three. NetGalley''s HarperCollins listing explicitly dates Soul Hunt28December2010, corroborated
  by contemporary author interview and release-day review. FictionDB''s January2011 is a market-edition discrepancy, not first
  publication. Short Evie stories Christmas Apples and Knight of Coins are excluded from novel count. Ronald''s invented-world
  industrial and Ageless mystery short fiction is not assumed part of Evie''s universe.


  ## Root-down walk

  Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Urban fantasy > Occult mystery > Occult PI >
  Psychic PI.


  Fantasy not Science fiction: operative supernatural scent, Celtic figures, water spirits, the Wild Hunt, curses and magical
  bargains, without technological explanation. The author''s interview explicitly traces Evie''s gift to a mythic ancestor,
  not scientific genetics. Historical/Modern/Futurist/Atemporal SF all lose that root test. Real earth passes actual Boston,
  Fenway, Back Bay, MIT, bike-courier work and contemporary institutions. Fantasy realms fails invented-world ancestor; Portal
  fantasy fails governing Earth/otherworld crossing adventure, notwithstanding uncanny sites or spirit encounters. Contemporary
  passes modern working Boston; Historical fails past setting despite inherited old myths; Future fails projected setting.


  Contemporary siblings: Urban passes more than a city backdrop. Retrieval jobs, courier work, magical organized crime, a
  power vacuum, neighborhood-watch organization and city landmarks are the machinery of the stories. Contemporary mythic >
  Modern European > Modern Celtic > Modern Irish is the genuine rival: the author explicitly means to explore mutable myth,
  Fionn is an active family connection, and Sceolang''s story underlies Evie''s gift. This is not dismissed as decorative
  folklore. But each novel is organized around Evie''s finder/investigative work and Boston''s contemporary undercurrent,
  not simply the persistence of Irish gods. Later Wild Hunt adds wider European folklore and Soul Hunt Boston/New England
  history, as the author confirms. Occult case engine is the closer whole-fiction frame. Modern Albion/Gaulish/Arthur returned
  do not match the Irish-family source, and no new Mythic leaf is needed.


  Magical coming-of-age fails adult established working life, not adolescence/school or a first identity-forming magic event.
  Domestic fails household/family as primary magic site, even though relationships matter. Dark fantasy''s Horror/Torment
  are serious tonal straddles but neither a horror place nor pursuing tormentor defines the hired-finder series. Supernatural
  genres such as Werewolf, Ghosts, Evil deals and Undying overselect secondary boyfriend, revenant, bargain or threatened
  soul threads. Folktale''s comedy/fable and Contemporary magical realism fail consciously investigated, named magical rules
  and suspense.


  ## Urban sibling test

  Fae founders/Big-city fae is a substantial rival in Spiral Hunt because the Fiana misuse old mythic authority and fae beings/bargains
  operate. But a fae court or changeling''s identity is not the continuing organizing engine: client jobs, disappeared people,
  stolen artifacts and city mysteries are. Paranormal bricks fails a separate/living city as the subject; a hidden social
  undercurrent is not automatically a literal double-city ontology, and Boston itself is not established as a living being.
  Publicly paranormal fails the secrecy of magic from ordinary society. Modern Gothic/Modern occult fails Gothic haunting/debt
  as the main experience; occult institutions/city/bloodline are genuine furniture but the investigator''s case is more exact.
  Occult secret service fails a state/hidden defence-service role; her friend''s neighborhood watch does not turn Evie into
  a secret agent. Freakbusters fails weaponized weird science; Modern Weird West fails Boston''s region and frontier register.


  Occult mystery passes converging clues and retrieval cases: Spiral Hunt missing former lover, stolen items and carved bodies;
  Wild Hunt returning stolen property and intertwined clients; Soul Hunt client job amidst a magical debt and fear spreading
  through the city. Completed reviewers differ on how cleanly the mysteries work, not on their existence. One reviewer says
  Wild Hunt initially lacks a clear single goal, while Soul Hunt''s fragmented obligations are a real whole-fiction wobble.
  The author explicitly describes laying clues and tying the threads together. Occult cop fails no badge/force: Rena is the
  cop friend, not Evie. Occult PI passes advertised paid finder/retrieval work and informal investigations, no need to invent
  a formal detective license.


  ## Investigator''s tool

  Psychic PI passes the inherited intuitive supernatural sense of scent, used to find persons, things and magical traces.
  The gift is inward and untrained rather than a taught ritual/casting craft. The author directly describes both its inheritance
  and its use to earn rent. Scent fits the leaf''s open examples of inborn inward gifts, not a new definition. Evocation fails
  direct force/flame/wards; Illusionist fails woven appearances; Necromancer fails the dead as her professional working tool,
  despite ghosts and a horn commanding hounds; Witchcraft and Shaman fail a learned living ritual/medicine tradition.


  Monster PI is checked carefully, not ignored because of the nickname. Author says Sceolang returned to human form and had
  a family, with canine traits carried down to Evie. No read source makes Evie a nonhuman species, shapeshifter or actual
  dog. A transformed-then-human ancestor and inherited gifted human are not equivalent to Jane Yellowrock''s skinwalker or
  Gwen''s revealed elf identity. PI meets Magic is the other real boundary: Evie is unschooled and wary of the undercurrent.
  Yet she already knowingly advertises and uses her own inherited magical sense as the retrieval tool. Unlike an ordinary
  investigator encountering magic outside her practice, that sense is the practice. Existing Psychic PI explicitly covers
  inward Sight without learned craft; requiring Evie to learn spells would contradict that leaf. Confidence moderate-high,
  with later hound-command/bargain and identity/mythic straddles recorded.


  ## Covers and execution

  Three actual English flat fronts inspected as pixels: Spiral green Boston face/city front247x400, Wild Hunt1246x2000, Soul
  Hunt1233x2000. Correct author/titles; Spiral lower resolution but legible and not a placeholder. Retailer-observed hotlinks
  only, no cover bytes in repo. Existing Psychic PI portrait unchanged. Final expected totals926nodes/2968fictions/7302books.

  '

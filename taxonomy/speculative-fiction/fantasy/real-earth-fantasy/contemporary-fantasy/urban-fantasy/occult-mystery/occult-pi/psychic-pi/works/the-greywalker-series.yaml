placement_rationale: 'Seattle PI Harper Blaine died for two minutes and came back a Greywalker, able to see and move through
  the Grey between the living world and the paranormal; her cases run on that inward Sight - ghosts, vampires, witches - not
  a learned craft (Penguin Random House series page; Publishers Weekly calls her ''psychic Seattle PI Harper Blaine''; Wikipedia
  bibliography). Walk: Fantasy (real supernatural) > Real-earth fantasy > Contemporary fantasy > Urban fantasy > Occult mystery
  (cases) > Occult PI (private investigator, no badge) > Psychic PI (the gift is inborn and inward - Sight - not a learned
  craft; not Monster PI, she stays human; not Necromancer PI, she does not work necromancy). One universe, one card (rule
  11j); series completion fold verified against the PRH series page and author-stated finale: nine novels, 2006-2014, Revenant
  the last; queue listed seven, Underground and Vanished folded in. Source: publisher and bibliography pages; not read.'

first_published: 2005
canonical_genre: monster-pi
placement_status: accepted
placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Contemporary fantasy -> Urban fantasy
  -> Occult mystery -> Occult PI -> Monster PI. Whole five-volume fiction correction, not a count-driven move. Author
  describes the completed five-book story as contemporary vampire noir and calls Joe a vampire detective. Publisher individual
  descriptions keep assignments central throughout: Already Dead missing heiress and shambler; No Dominion drug-source
  case; Half the Blood of Brooklyn clan inquiry; Every Last Drop infiltration assignment; My Dead Body missing pregnant
  girl. Joe works privately as investigator/enforcer outside police or state service; his vampire condition rather than
  learned spellcraft is the working identity. Vampire clans and civil war are the cases environment and stakes, not a
  reason to discard the investigator engine. Monster PI already covers freelance vampire-related work and faction politics
  (Jane Yellowrock). Not Occult cop (no badge), secret service (not state secrecy/defence), Mage PI (not a human trained
  practitioner), PI meets Magic (not human outsider), Vampire hunt (vampire investigator, not merely hunted threat),
  or Oldfangs (casework is the stronger whole-fiction spine). Sources read: https://www.charliehustonwrites.com/buy-books
  ; https://www.penguinrandomhouse.com/series/ZJC/joe-pitt-casebooks/ . Authority: user individual fiction/book move
  grant phonemsg-01M63B6PTVDTX8TZVYPSWGTJGP,2026-10-29. Existing five-book list and metadata unchanged.'

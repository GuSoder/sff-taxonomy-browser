placement_note: 'Root-down: Speculative fiction > Fantasy > Real-Earth fantasy > Contemporary fantasy > Urban fantasy > Occult mystery > Occult PI > Monster PI. Gwen Gelman, an ex-cop working private cases in Providence, discovers she is an elf changeling - her too-young looks and flashes of insight are elven blood, and the hidden elves of the city mean to reclaim her (author''s series page, elainecunningham.com). What the investigator IS, not a learned craft, is the tool of the case: Monster PI, not Mage PI (no trained craft) or PI meets Magic (she is not human). Series: Shadows in the Darkness (2004), Shadows in the Starlight (2006).'

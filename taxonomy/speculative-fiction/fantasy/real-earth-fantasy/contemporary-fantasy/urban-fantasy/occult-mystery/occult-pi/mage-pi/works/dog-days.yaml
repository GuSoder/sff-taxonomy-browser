placement_rationale: 'San Francisco urban fantasy: Mason, a trained magic practitioner (mentored by Eli) and jazz guitarist,
  does freelance enforcement case-work for Victor, the Bay Area''s chief magical enforcer, with his ifrit familiar Lou. Each
  volume is a case: Dog Days (2007) - missing ifrits and a power-hungry practitioner bidding to control the magical world;
  New Tricks (2008) - an energy pool Mason opens lets supernatural monsters into the city; Unleashed (2009) - hunting the
  shape-shifters that came through; Play Dead (2011) - a black-magic practitioner hires Mason to find another black practitioner
  and retrieve stolen materials (fangfiction.blogspot.com series review; penguinrandomhouse.com series page, 4 volumes 2007-2011,
  Ace). The investigator''s own craft is the working tool of the case -> mage-pi verbatim. Not occult-cop (no badge: freelance
  hire, not a sworn officer), not occult-secret-service (Victor enforces for the magical community, not a hidden state service),
  not monster-pi (Mason is human; Lou is the familiar, not the investigator), not pi-meets-magic (Mason is a trained practitioner,
  not an ordinary human). 10TH WORK - LEAF FREEZES pending split proposal.'

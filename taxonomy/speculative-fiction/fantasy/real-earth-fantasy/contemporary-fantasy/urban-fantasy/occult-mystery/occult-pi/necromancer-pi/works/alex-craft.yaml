placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Urban fantasy >
  Occult mystery > Occult PI > Necromancer PI. One fiction under rule 11j: Roc/Ace''s Alex Craft series, seven novels
  (Grave Witch 2010, Grave Dance 2011, Grave Memory 2012, Grave Visions 2016, Grave Ransom 2017, Grave Destiny 2019,
  Grave War 2020; isfdb series record 27907, verified against the queue''s single Grave Dance row - series completion
  folds the rest; the 2013 series-linked short Ruby Red excluded as short fiction). Alex Craft is a grave witch working
  as a private investigator in Nekros City, raising shades of the dead to solve crimes - Wikipedia: "an urban fantasy
  series about a witch who solves crimes by speaking to the dead". Her working tool IS the dead: the Necromancer PI
  gate word for word. Not Witchcraft PI: her case tool is necromancy (shade-raising), not a witch''s craft of ritual
  and will; "grave witch" names her kind, not her method.'

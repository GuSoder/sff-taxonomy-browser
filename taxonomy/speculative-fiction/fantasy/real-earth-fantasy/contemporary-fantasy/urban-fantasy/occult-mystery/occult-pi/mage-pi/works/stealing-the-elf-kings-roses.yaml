placement_rationale: 'Root-down: speculative-fiction > fantasy > real-earth-fantasy > contemporary-fantasy > urban-fantasy
  > occult-mystery > occult-pi > mage-pi. Lee Enfield is a lanthanomancer - a trained magic-worker in Seeing and revealing
  the truth - hired as a psychoforensics specialist by the LA District Attorney''s office to do discovery on the murder of
  the elf Omren dil''Sorden, with her fayhound partner Gelert (dianeduane.com author copy). Occult PI subtree, not Occult
  cop: she is freelance, not a sworn officer on the force - the same shape as The Dresden Files (consultant to Chicago PD)
  already on Mage PI. Within the subtree: Mage PI verbatim - a trained practitioner whose own craft is the working tool of
  the case; not Monster PI (she is human) and not PI meets magic (she is trained). The openly nonhuman city (Alfen live openly,
  anti-elf hate crimes commonplace) is setting; the case engine plus her craft decides the shelf. Single standalone novel
  2002 (Warner Aspect; ISFDB title record 23582). Year is first publication.'

placement_rationale: 'Ciel Halligan is an aura adaptor - born able to become an exact copy of another person - working as
  a freelance facilitator on client jobs that keep turning into cases (a kidnapping at the National Zoo, an astronaut impersonation
  gone wrong). Comic urban fantasy casework outside any police force: Occult PI, and the investigator''s non-human-in-kind
  gift is the tool of every case: Monster PI (Jane Yellowrock precedent). Complete series per FictionDB: In a Fix (2012),
  Quick Fix (2013), The Big Fix (2015), All Fixed Up (2016); Pre-Fix is a prequel short story, skipped.'

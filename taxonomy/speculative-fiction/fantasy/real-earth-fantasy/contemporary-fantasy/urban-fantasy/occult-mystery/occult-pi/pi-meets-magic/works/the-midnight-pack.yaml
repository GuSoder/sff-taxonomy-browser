placement_rationale: 'Root-down: Fantasy > Real-earth fantasy > Contemporary fantasy > Urban
  fantasy > Occult mystery > Occult PI > PI meets magic. Jericho James series: an ordinary
  human private investigator famed for DEBUNKING mythical creature sightings keeps finding the
  real thing - a reclusive family hiding a werewolf secret in Stillbridge, Maine (book 1,
  "A Werewolf Romantic Urban Fantasy") and something big and real behind a town''s Bigfoot
  sightings (book 2, "A Bigfoot Romantic Urban Fantasy", the standalone second book). An
  untrained human PI whose cases run into real cryptids and magic: not Mage PI (no craft of
  her own) and not Monster PI (human). Romantic-urban-fantasy register noted (Hachette/Orbit,
  author site, NetGalley).'

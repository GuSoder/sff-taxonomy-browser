placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth
  universe -> Contemporary fantasy. Jenna Chen, 17, wishes on a shooting star to be
  her effortlessly perfect cousin Jessica and wakes in Jessica''s body; everyone forgets
  Jenna existed except one childhood friend. The engine is surviving the traded life,
  the price erasure rather than damnation. Siblings fail: no mythic power grants the
  wish (contemporary-mythic-fantasy); she develops no ability (magical-coming-of-age,
  also frozen); the site is the academy and social world, not the household (domestic-fantasy).
  Warm, sincere register rules out nocturne; the swap is fought, not accepted as ordinary,
  ruling out metamorphic magic realism. New leaf created and seeded (the curator,
  phonemsg-01M3KS8AAZRA6WWW7FCDPH92FJ, ''Execute'' 12:34 CEST 2026-09-28).'

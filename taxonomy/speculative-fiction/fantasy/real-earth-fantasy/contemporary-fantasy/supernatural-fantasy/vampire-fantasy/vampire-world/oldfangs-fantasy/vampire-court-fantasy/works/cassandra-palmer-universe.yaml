placement_rationale: 'Root-down: Speculative fiction > Fantasy (real magic throughout: clairvoyance, time travel, vampires,
  mages, ghosts, fae, demons and gods) > Real earth fantasy > Contemporary fantasy (present-day America, above all Las Vegas;
  Masks is a fifteenth-century Venice prequel inside the same universe, a disclosed sidebar, not the engine) > Urban fantasy
  (the hidden supernatural community - the Vampire Senate, the Silver Circle, the Pythian Court, Faerie - operates through
  modern city life and its institutions) > Supernatural fantasy > Vampire fantasy > Vampire world (vampires'' own lineages,
  laws and feuds shape the story: the Senate''s politics and the Basarab dynasty anchor all three series) > Oldfangs fantasy:
  the card is told substantially from inside the vampires'' own dynasty - Mircea Basarab, the Senate, Dorina the dhampir daughter,
  Dracula himself - with centuries-old lineages, laws and feuds; the Night Huntress universe and Sabina Kane, already here,
  are the same wave and shape. DISCLOSED WOBBLE: Cassie herself is no vampire but the Pythia, the supernatural world''s chief
  seer, and her clairvoyance/time-travel engine co-drives the main series; vampire society is the constant co-pillar across
  every sub-series, which is why the vampire-world walk is the honest one. Not Fangs out (the world is hidden, not public),
  not Newfangs (no fresh turning is the story), not Occult mystery/counter-ops (no case or agency engine), not Publicly paranormal
  (masquerade holds). One card for the whole shared universe (rule 11j): the author herself has ''always viewed'' the Cassie
  Palmer and Dorina Basarab series as one (karenchance.com/timeline), and isfdb groups all of it under the Cassandra Palmer
  Universe super-series. Completeness verified against the author''s own current bibliography (karenchance.com/timeline and
  /books, fetched 2026-11-10): 14 Cassie Palmer novels (through Hijack the Seas: Seismic and Tsunami, 2024), 7 Dorina Basarab
  novels (through Fortune''s Blade, 2024), plus the universe novels Masks (2014), Siren''s Song (2019), Junk Magic (2022)
  and the new Weird Magic (2025) - 25 novels total; novellas and shorts excluded per the skip rules. Series completion: the
  queue lists only Touch the Dark, Claimed by Shadow and Embrace the Night; the other 22 novels are folded per rule 11j.'

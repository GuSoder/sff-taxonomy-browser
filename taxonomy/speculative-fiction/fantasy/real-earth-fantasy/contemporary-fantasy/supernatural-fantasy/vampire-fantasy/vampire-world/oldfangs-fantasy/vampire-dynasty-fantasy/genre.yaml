definition: 'Oldfangs fantasy where the vampire order is a dynasty: old houses, clans and lines of vampires - kin made by
  the bite, adopted into the house or born to it - with their elders, heirs, grudges and succession, told from inside the
  house. Not Vampire court fantasy (a senate, coven or crown governs and its politics drive the story), not Newfangs fantasy
  (a fresh turning is the story; these houses are old).'

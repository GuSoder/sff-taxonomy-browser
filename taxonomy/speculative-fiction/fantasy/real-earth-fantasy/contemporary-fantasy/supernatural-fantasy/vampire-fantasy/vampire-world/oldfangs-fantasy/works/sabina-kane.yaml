id: sabina-kane
title: Sabina Kane
authors:
- Jaye Wells
first_published: 2009
canonical_genre: oldfangs-fantasy
placement_status: accepted
placement_rationale: 'Walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Contemporary fantasy -> Supernatural
  fantasy -> Vampire fantasy -> Vampire world -> Oldfangs fantasy. Five-novel Sabina Kane fiction, not just first assassin
  mission: Red-Headed Stepchild exposes vampire grandmother/mage-family political web; The Mage in Black brings New York
  mage relatives and proposed unification of Dark Races; Green-Eyed Demon takes the sister rescue into grandmother/Caste
  of Nod conflict in New Orleans; Silver-Tongued Devil murder investigation threatens vampire-mage peace talks; Blue-Blooded
  Vamp brings Cain, Abel, Lilith, vampire origins and family revenge in Rome. Hidden long-established vampire lineage,
  laws and inter-race feuds govern the whole. Born half-vampire/half-mage, not a newly turned story (Newfangs), and final-volume
  reviewer explicitly says the Dark Races remain off human radar (not Fangs out). Not Vampire hunt as humans confronting
  a monster; Sabina is within the vampire lineage. Urban fantasy is a strong register rival, but city is not itself fantastical
  subject (Paranormal bricks), supernatural not public (Publicly paranormal), not Faerie community (Fae founders), no
  police badge/state service/hired PI occupation across the five (Occult mystery/secret service); book4 case cannot stand
  for whole. Modern goth institutional haunting, folk/comic/magic-realist/domestic frames, coming-of-age and contemporary
  myth retelling are not the spine. Romantasy is not the primary genre engine; assassins under Fantasy realms fails Earth
  root. Scope: author lists five novels and separately identifies Chosen Ones as three Sabina novellas with Prospero
  Fire Water bonus; excluded short forms not added. Sources: https://www.jayewells.com/sabina-kane-series ; https://www.jayewells.com/_files/ugd/b50c51_e62c24dfe9d341bb8b6ddddcdd1b1672.pdf
  ; https://www.littlebrown.co.uk/titles/jaye-wells/red-headed-stepchild/9781841497563/ ; https://www.littlebrown.co.uk/titles/jaye-wells/the-mage-in-black/9781841497570/
  ; https://www.littlebrown.co.uk/titles/jaye-wells/green-eyed-demon/9781841497587/ ; https://www.littlebrown.co.uk/titles/jaye-wells/silver-tongued-devil/9780748129966/
  ; https://shop.hachettebookgroup.com/products/blue-blooded-vamp ; https://freshfiction.com/review.php?id=33235 . Original
  intake commission phonemsg-01M43MYMGAMQTNA3CY402KK7FB, resume phonemsg-01M632RASZYPC1W919GK4S58CY. Oldfangs8to9 after
  independent Joe Pitt whole-fiction correction. No definition change.'

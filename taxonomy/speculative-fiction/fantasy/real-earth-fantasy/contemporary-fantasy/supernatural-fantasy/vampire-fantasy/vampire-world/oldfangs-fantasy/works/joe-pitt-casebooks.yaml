placement_rationale: 'Huston''s Joe Pitt books: Manhattan''s vampyres are real and organized
  into clans - the Coalition, the Society, the Enclave - with turf, laws and feuds; Pitt,
  long turned and unaffiliated, works the cracks between them as a fixer. Told from inside
  the dynasties'' world where the vampires have long been what they are: Oldfangs. Walk:
  Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural fantasy > Vampire
  fantasy > Vampire world > Oldfangs fantasy. Not Fangs out (the world at large does not
  know); not Newfangs (his turning is backstory, not the story). Sources:
  penguinrandomhouse.com series page and book descriptions.'

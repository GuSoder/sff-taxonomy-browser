placement_rationale: 'Kristen Painter''s House of Comarré (Orbit, 5 novels 2011-2013): Chrysabelle, a comarré - one of the
  bred blood-servant caste of the vampire aristocracy - flees her murdered patron and, with the outcast vampire Malkolm, is
  pulled into the houses'' laws and the comarré''s hidden plan to seize freedom; the vampire order is a stratified STATE of
  noble houses and servant castes. Walk: Real-earth fantasy > Contemporary fantasy > Supernatural fantasy > Vampire fantasy
  > Vampire world > Oldfangs fantasy > Vampire court fantasy (senates, covens and aristocratic houses; darkmatterzine series
  essay). Card completed 2026-11-10 from the single queued book 5 (Last Blood) to the whole five-novel series per the whole-fiction
  rule, inside the approved Oldfangs split (curator phonemsg-01M72PTF4V8MGB1AG51FN9ZM4Y); the split block disclosed the completion.
  Near-future 2067 setting with the supernatural hidden by covenant: disclosed sidebar, the register is gothic paranormal
  vampire society.'

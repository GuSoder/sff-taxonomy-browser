placement_rationale: 'Root-down walk: modern Chicago on recognizable Earth, so Real earth fantasy; Nocturne fantasy, Supernatural
  fantasy, Vampire fantasy, Vampire world (the books run on vampire houses, Masters and politics, not a single hunt or a hidden-bloodline
  inheritance). Source: the first-chapter excerpt on chloeneill.com says the vampires made a public coming-out via a manifesto
  in the Sun-Times and Trib, followed by a press conference, riots and public fear, and that Merit is made a vampire and initiated
  into Cadogan House, one of twelve American Houses; the PRH blurb for Some Girls Bite agrees. That is a world rebuilt around
  vampires being known, so Fangs out fits. Wobble: Merit is newly turned in book one (Newfangs), but the turning is only the
  opening and the 13 books are about House politics in the open. Oldfangs was ruled out because the Houses are newly public
  rather than told from inside long-settled dynasties. Heirs of Chicagoland (Wild Hunger, Wicked Hour, Shadowed Steel, Devouring
  Darkness, Cold Curses) is the next-generation spin-off per Library Journal as quoted on the PRH page, folded under the shared-universe
  rule. Dark Elite (Firespell etc) and Devil''s Isle (The Veil etc) are separate series and are not folded.'

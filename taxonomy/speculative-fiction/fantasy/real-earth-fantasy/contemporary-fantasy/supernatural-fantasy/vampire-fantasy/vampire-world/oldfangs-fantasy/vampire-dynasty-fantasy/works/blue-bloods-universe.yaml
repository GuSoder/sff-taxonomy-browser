placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural
  fantasy > Vampire fantasy > Vampire world > Oldfangs fantasy > Vampire dynasty fantasy. Queue MC06669-72 are four novels
  from Melissa de la Cruz''s Blue Bloods universe: the three Beauchamp Family witch novels (Witches of East End 2011, Serpent''s
  Kiss 2012, Winds of Salem 2013) and the adult vampire spin-off Vampires of Manhattan (2014). ISFDB records The Beauchamp
  Family as a sub-series of Blue Bloods Universe, Kirkus (2011) and the Blue Bloods fan wiki call it a spin-off in the Blue
  Bloods world, and Wikipedia lists Witches of East End and Vampires of Manhattan as spin-offs of Blue Bloods. By the consolidation
  rule one shared universe is one fiction, so they are held together here. The universe''s engine is the old-money Manhattan
  vampire families, the Blue Bloods (Van Alen, Force, Llewellyn), secretly reborn angels with ancestral bonds, lines and feuds;
  the witches and werewolves live alongside them. The unqueued core Blue Bloods novels (Blue Bloods 2006 onward) and Wolf
  Pact are part of this same fiction but were not in the candidate queue, so only the four queued books are itemised. Magic
  is literal in every volume (vampire and witch powers are real), so Fantasy, and set in contemporary New York and the Hamptons
  with the supernatural hidden, so not Publicly paranormal. Alternatives tested: Vampire court fantasy (the Conclave is one
  institution, but the books are told from inside the families, not the senate); Newfangs fantasy (Sky''s first turning is
  only the opening of book 1 of nine); Magic family fantasy would fit the Beauchamp trilogy alone but would split the shared
  universe and cannot take Vampires of Manhattan; Paranormal neighbours requires an open society and this world is secret.
  Soft spots: the Beauchamp books sit in a vampire leaf because the universe, not the single series, is the fiction; and the
  OL year for Vampires of Manhattan (2014) was not checked against a publisher page. Sources: https://isfdb.stoecker.eu/cgi-bin/pe.cgi?29287=
  ; https://isfdb.org/cgi-bin/pe.cgi?32742= ; https://en.wikipedia.org/wiki/Blue_Bloods_(novel_series) ; https://www.kirkusreviews.com/news-and-features/articles/melissa-de-la-cruz-witches-east-end/
  ; https://bluebloodsuniverse.fandom.com/wiki/Beauchamp_Family_series ; https://publishersweekly.com/pw/authorpage/melissa-de-la-cruz.html
  ; Open Library editions for covers. Not a full-novel read.'

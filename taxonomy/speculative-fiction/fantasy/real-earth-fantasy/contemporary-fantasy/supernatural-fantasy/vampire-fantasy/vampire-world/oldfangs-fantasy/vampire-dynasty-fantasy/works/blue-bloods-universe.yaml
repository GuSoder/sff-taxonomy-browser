placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural fantasy > Vampire fantasy > Vampire world
  > Oldfangs fantasy > Vampire dynasty fantasy. One shared universe is one fiction, so fifteen of the seventeen titles of ISFDB''s Blue Bloods Universe (https://isfdb.org/cgi-bin/pe.cgi?32742=)
  are itemised: the nine-book core (Blue Bloods 2006 to After Death 2023; Wikipedia counts seven in the original run, then After Life 2022 and After Death 2023 as
  a new duology on ISFDB and the author''s site), the werewolf spin-off Wolf Pact (2012, issued in four parts, itemised as one book), the Beauchamp Family witch trilogy
  (Witches of East End 2011, Serpent''s Kiss 2012, Winds of Salem 2013) and the adult spin-off The New Blue Bloods Coven (Vampires of Manhattan 2014, White Nights
  2017). Left out under the project''s standing scope (novels only: no novellas, short-story collections, reference guides, editions or reprints): Bloody Valentine
  (2010, a novella of three stories, per Wikipedia), Keys to the Repository (2010, a character and history guide framed as Repository files, with a few short stories),
  the Blue Bloods Books I-III omnibus (2014), the four Wolf Pact serial parts, the short story Shelter Island (2007) and the graphic novel adaptation. Content decides
  the leaf. The Blue Bloods are an old-money Manhattan society of vampires, secretly angels reborn across the centuries, bound in houses and families (Van Alen, Force,
  Llewellyn, Duchesne) with elders, heirs, bondings, feuds and succession, and the stories are told from inside those houses (Schuyler, Mimi, Bliss, Jack). So the
  vampires long have been what they are (Oldfangs), and the houses, not a senate, drive the plot (Dynasty over Court: the Conclave and the Committee are a backdrop,
  not the engine). Magic is literal throughout (vampire, angel and witch powers are real), so Fantasy; the supernatural is hidden in contemporary New York and the
  Hamptons, so not Publicly paranormal or Fangs out. Alternatives tested: Vampire court fantasy (politics is not the engine); Newfangs fantasy (Schuyler''s awakening
  opens book 1 of sixteen and the arc is bigger than the turning); Magic family fantasy (fits only the Beauchamp trilogy and would split the shared universe); Paranormal
  neighbours (the world is secret). Leaf wording: the leaf definition used to say the kin were ''made and adopted by the bite, never born''. Blue Bloods (reborn angels
  who awaken by blood and carry bloodlines) and Sabina Kane are born into their houses, so the curator approved a one-phrase revision on 2026-11-27 (phonemsg-01M8E76HZTB12YH0102BGQ0EEV):
  ''made by the bite, adopted into the house or born to it''. This placement follows the revised definition. Sources: https://isfdb.org/cgi-bin/pe.cgi?32742= ; https://isfdb.stoecker.eu/cgi-bin/pe.cgi?29287=
  ; https://en.wikipedia.org/wiki/Blue_Bloods_(novel_series) ; https://melissa-delacruz.com/book-series/blue-bloods/ ; https://melissa-delacruz.com/book/white-nights/
  ; https://www.kirkusreviews.com/book-reviews/melissa-de-la-cruz/vampires-of-manhattan/ ; https://www.kirkusreviews.com/news-and-features/articles/melissa-de-la-cruz-witches-east-end/
  ; https://bluebloodsuniverse.fandom.com/wiki/Beauchamp_Family_series ; Open Library for covers. Reference-level audit, not a full read of all sixteen.'

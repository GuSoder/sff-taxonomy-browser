placement_rationale: 'One fiction (rule 11j): the Dark Days series - Nightwalker (2008), Dayhunter (2009), Dawnbreaker (2009),
  Pray for Dawn (2010), Wait for Dusk (2010), Burn the Night (2011). Bibliography per FictionDB and Fantastic Fiction series
  listings (six novels; queue rows MC04609-11 and MC04613 carried four, and Nightwalker plus Wait for Dusk were surfaced as
  the missing series volumes under the standing completeness rule). Root-down: Fantasy -> Real earth fantasy -> Contemporary
  fantasy -> Supernatural fantasy -> Vampire fantasy -> Vampire world -> Oldfangs fantasy: Mira is a centuries-old nightwalker
  and the secret Coven''s enforcer, and the series is told from inside vampire society - the Triad''s laws, the Venice nightwalker
  rulers, coven lineages and feuds - with vampires long established and hidden from ordinary humanity (catalog copy: ''she
  has secretly enforced the history-altering edicts of the Triad... Venice, home of the nightwalker rulers''). The leaf''s
  accepted definition is ''told from inside the vampires'' own dynasties: families, covens and orders with lineages, laws
  and feuds, where the vampires have long been what they are''; tenants Night Huntress Universe and Sabina Kane are the same
  enforcer-insider shape. Rejected: Fangs out fantasy (vampires are hidden in Dark Days, not public), Newfangs fantasy (Mira
  is ancient, not newly turned), Occult mystery branches (not case-driven police fiction; the engine is coven politics and
  the naturi war), Publicly paranormal (the supernatural is concealed). Wobble: low - the naturi share the plot, but the vampire-society
  frame governs. First publications 2008-2011 (FictionDB).'

placement_rationale: 'Root-down: speculative-fiction > fantasy > real-earth-fantasy > contemporary-fantasy > supernatural-fantasy
  > vampire-fantasy > vampire-world > oldfangs-fantasy. The Shadow World is a hidden society of vampires in the dark corners
  of our world, headquartered in Austin, Texas: Primes and Queens hold territories under the Circle of Signets, with lineages,
  laws and feuds reaching back to the first days of the vampire race and the subduing of Morningstar (penguinrandomhouse.com
  series and book pages). Told from inside the dynasty - Miranda Grey becomes Queen of the South beside her Prime David Solomon
  - which is the leaf verbatim: dynasties with lineages, laws and feuds, vampires long established. Not Fangs-out (the Shadow
  World is hidden, not open) and not Newfangs (Miranda''s turning starts book 1, but the series engine is the court and its
  wars). Not Vampire hunt (the vampires are the protagonists, not the quarry). Seven novels 2010-2017 (PRH series page; OL
  first-publication years). Years are first publication.'

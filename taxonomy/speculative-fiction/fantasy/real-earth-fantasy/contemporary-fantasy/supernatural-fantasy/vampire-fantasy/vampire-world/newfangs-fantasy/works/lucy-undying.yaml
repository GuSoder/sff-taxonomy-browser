placement_rationale: 'Del Rey, September 2024 (queue year 2025 is a reissue). A Dracula retelling centered on Lucy Westenra:
  her human diary through the events of Stoker''s novel, her modern voice talking to a therapist, and Iris, a young woman
  fleeing a manipulative family; Dracula made her, and the book is her long reckoning with what her turning made of her (Library
  Journal; Grimdark Magazine). A fresh/outcast vampire finding what she is after the turning - the turning is the story -
  with no dynasty politics: newfangs. Walk: Fantasy > Real Earth fantasy > Contemporary fantasy > Supernatural fantasy > Vampire
  fantasy > Vampire world > Newfangs fantasy. Tried: Oldfangs fantasy (no coven, lineage law or feud; Lucy is Dracula''s cast-off,
  not a dynasty), Vampire hunt (Dracula is confronted, but the engine is Lucy''s own unlife, not the pursuit), Vampire fringe
  (she is unambiguously a vampire). Wobble: low.'

  ; https://www.jeanienefrost.com/both-feet-in-the-grave/ ; https://www.jeanienefrost.com/night-huntress-world-books/first-drop-of-crimson/
  ; https://www.jeanienefrost.com/night-huntress-world-books/eternal-kiss-of-darkness/ ; https://jeanienefrost.com/night-prince-books/once-burned/

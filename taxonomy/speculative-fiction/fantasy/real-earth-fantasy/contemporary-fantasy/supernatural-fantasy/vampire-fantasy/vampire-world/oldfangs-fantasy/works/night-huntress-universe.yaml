placement_rationale: 'Root-down walk of the complete Night Huntress shared universe,18 published novels: Speculative fiction
  > Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural fantasy > Vampire fantasy > Vampire world > Oldfangs
  fantasy. Modern Ohio, Chicago and other Earth settings, literal vampires, ghouls, ghosts and forbidden magic, no scientific
  explanation; not historical merely because vampire heroes are centuries old, not invented-world Romantasy. Author reading
  order explicitly combines original Night Huntress7, Bones POV2, World standalones2, Night Prince4 and Night Rebel3 as one
  universe. Bones retellings are separately published novels with changed viewpoint/context, not editions. Exclude all novellas,
  novelettes and Outtakes anthology. Whole18plot evidence: Halfway trains half-vampire Cat with ancient bountyhunter Bones
  against vampire killers; One Foot reunites specialagentCat/Bones against assassination; At Grave''s End pits them against
  Bones''s vengeful past and lethal magic; Destined adds Gregor''s old claim and their bloodbond; This Side turns their marriage
  and Cat''s powers into vampire/ghoul political war; One Grave at a Time fights a witchhunter ghost through vampirecouplecontinuity;
  UpFrom pursues rogueCIAsecrets threatening human/undeadwar. OtherHalf and BothFeet retell firsttwo through centuriesoldBones
  with deeper vampireworld perspective. FirstDrop joins Spade/Denise against her demon-marked familypast, EternalKiss joins
  ancientMasterMencheres/Kira against his immortal enemy. OnceBurned joins Vlad/Leila against vampire enemies; TwiceTempted
  tests their relationship under assassination; BoundbyFlames their vampiremarriage under centuriesoldenemy; IntoFire forbiddenmagic
  binds Leila to Mircea and threatens the marriedvampires. ShadesofWicked joins MasterIan/LawGuardianVeritas against Dagon;
  WickedBite makes Veritas break vampirelaw to protectIan; WickedAllNight opposes escapedancientgods while vampirecouncil
  threatens execution and their relationship. Sources read for each volume, no firstvolume proxy for wholefiction. Vampireworld
  rather than Vampirehunt: these are vampires'' own established lineage, laws, rivalries, relationships and councils, not
  merely outside hunters confronting monsters. Oldfangs rather than Newfangs: some heroines start mortal or change into vampires,
  but established ancientvampires and their orders/feuds govern the entire multi-couple universe, not one newcomer''s turning
  story. Fangsout fails: vampires operate as a hidden order in modernEarth, not public society rebuilt around universal disclosure.
  Urbanpolice/Paranormalbureau failwhole18: Cat''s governmentjob and Veritas''s LawGuardian status do not govern the Spade/Mencheres/Vlad
  romances, and no publicsupernatural-category evidence. MonsterPI failswhole18: KiraPI and bountyhunterBones are not an invariant
  casework premise. Genuine broadness: OneGraveAtATime ghostvillain and WickedAllNight gods widen antagonists, but the same
  vampireinsider couples/laws/orders persist. ExistingOldfangs9 becomes10, immediately frozen for split; no11th placement.
  Sources: https://www.jeanienefrost.com/reading-order/ ; https://jeanienefrost.com/books/halfway-to-the-grave/ ; https://jeanienefrost.com/books/one-foot-in-the-grave/

placement_rationale: "## Whole-fiction evidence\n1. The Becoming: bounty hunter attacked and becomes vampire, human DEA lover\
  \ and vampire lover, good/evil and new state.\n2. Blood Drive: saves niece from human predators while living new vampire\
  \ life.\n3. The Watcher: newly made vampire enlisted as Watcher while controlling vampiric rage; dangerous incidents and\
  \ enforced leave.\n4. Legacy: sire's fortune and werewolf widow, keeping humanity against new supernatural inheritance.\n\
  5. Retribution: newly turned Anna asked to investigate drained young vampires by supernatural enforcer, estranged mentor.\n\
  6. Chosen: controls primitive instincts, discovers Chosen destiny governing vampires and humans.\n7. Crossroads: mentor's\
  \ death threatens secrecy, border bodies; chance to regain mortality, chooses vampire identity (review).\n8. Haunted: shapeshifter\
  \ friend's past, cartel/missing girls in Mexico, shifting family and love ties while accepting vampire life.\n9. Blood Bond:\
  \ marriage to shapeshifter, mother's death and European vampires rejecting her Chosen status.\n10. Paradox: achieved human/vampire\
  \ balance but author threatens disclosure unless turned, simultaneous investor murders with business partner. Publisher\
  \ calls it Book10 and novel,264pages.\n\n## Route and wobble\nFantasy not SF: literal supernatural vampire/shapeshifter/witch\
  \ mythology, no technological explanation. Real earth not fantasy realms/portal: modern San Diego, Mexico, Arizona, France;\
  \ old vampire ages not historical setting. Contemporary not past/future. Contemporary children inspected: mythic, coming-of-age,\
  \ domestic, dark, supernatural, urban, magic realism, folktale. Supernatural is exact; other broad routes fail central premise.\
  \ Supernatural's eight children: evil-deals, surreal-afterlife, vampire, ghost, undying, haunted-house, werewolf, paranormal.\
  \ Vampire central; shapeshifters and witches supporting, not the whole fiction engine.\n\nVampire's children Hunt/World/Fringe:\
  \ Anna's lived vampire identity, community, Watchers and Chosen status rather than external hunter or formal ambiguity.\
  \ World's Oldfangs/Fangsout/Newfangs: Newfangs; one freshly turned focal protagonist struggles for humanity then accepts\
  \ place. All first7 occur firstyearafterturning (review). Oldfangs genuinely present as supporting elders and final European\
  \ politics, but unlike Night Huntress's multiple ancient master protagonists, this whole fiction follows the newcomer's\
  \ own transformation/settlement. Fangsout fails actual secrecy through book10 disclosure threat.\n\nUrban rival inspected\
  \ completely: fae-founders/paranormal-bricks/publicly-paranormal/modern-goth/occult-mystery/occult-secret-service/modern-weird-west.\
  \ Only mystery plausible. Occult cop fails no sworn police heroine; Occult PI > Monster PI genuine rival because vampire\
  \ bountyhunter and repeated investigations, but whole10 not invariant hired-case spine: Chosen is destiny/instinct, Legacy\
  \ inheritance, Blood Bond family/marriage and vampire acceptance. Publisher/independent reviewer emphasize holding humanity\
  \ rather than profession alone. Other PI children mage/ordinaryhuman fail creaturekind; cop's six case-world children don't\
  \ fix missing badge. Occult secretservice not state service. No public-supernatural civicworld. Newfangs is more specific\
  \ to whole identityarc without forcing everyplot into hiredcasework.\n\n Sources read: ## Sources read\n- https://www.penguinrandomhouse.com/series/AJ2/an-anna-strong-vampire-novel/\
  \ : allfirstnineplots/officialcovers\n- https://www.hexpublishers.com/publications_paradox-an-anna-strong-vampire-novel.html\
  \ : tenthplot/cover/book10\n- https://sjharper.me/paradox/ : authorplot/excerpt, contemporaryCalifornia and identitybalance\n\
  - http://fangfiction.blogspot.com/2010/10/jeanne-c-stein-anna-strong-chronicles.html : independentfirstnineplotreviews,\
  \ chronology, humanityarc, novellaexclusion\n- https://www.goodreads.com/series/42972-anna-strong-chronicles : readercatalogue10primary,\
  \ laternovella vs novel distinction\n- https://www.hexpublishers.com/publications_anna-and-the-vampire-prince.html : sameworld90pagestale,\
  \ excluded\n- http://sjharper.me/jeanne-c-stein/ : authororiginalnineAcebibliography, shortfictionseparate\n- https://catalog.ocls.org/Record/.b16431340\
  \ : Becomingoriginal2004\n- https://www.books-by-isbn.com/1-933417/193341782X-Blood-Drive-Jeanne-C.-Stein-1-933417-82-X.html\
  \ : BloodDriveoriginal2006\n- https://www.isfdb.org/cgi-bin/title.cgi?2631745= : Paradox2019NOVEL\n\nCaveat: many catalogue\
  \ dates show Ace reprints instead of originalpublication. Firsttwo years resolved rather than copied from queue. Laterbooks\
  \ broaden conflict beyond turning itself, but continuing newlymadevampire's acceptance/identity and communityfit remains\
  \ the wholefictionarc, not an invariant firstbook premise claim.\n"

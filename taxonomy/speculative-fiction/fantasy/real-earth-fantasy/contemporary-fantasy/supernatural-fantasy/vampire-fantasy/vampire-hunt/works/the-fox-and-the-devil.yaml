placement_rationale: 'UK Michael Joseph 2025 (Del Rey US 2026; original year used). Anneke Van Helsing, daughter of Stoker''s
  vampire hunter, is a forensic investigator in 1890s Amsterdam; she finds a strange woman standing over her murdered father
  and spends years hunting the same vampire across Europe, receiving her blood-stained letters (Locus, Liz Bourke; Bloody
  Disgusting). A Van Helsing legacy hunt: the vampire is the predatory threat the protagonist tracks and confronts, even with
  the sapphic gothic charge between hunter and quarry. Walk: Fantasy > Real Earth fantasy > Contemporary fantasy > Supernatural
  fantasy > Vampire fantasy > Vampire hunt. Tried: Vampire world (no vampire social order shapes the world; the hunt is the
  engine), Oldfangs (no dynasty view). Wobble: low-moderate; the obsession cuts both ways but the pursuit drives the plot.'

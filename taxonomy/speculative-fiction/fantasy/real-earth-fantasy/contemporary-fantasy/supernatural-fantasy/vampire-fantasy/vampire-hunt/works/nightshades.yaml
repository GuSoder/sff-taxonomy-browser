placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural
  fantasy > Vampire fantasy > Vampire hunt. Queue MC06673-75, the whole Nightshades trilogy (Nightshades 2016, Switchback
  2017, Outbreak 2018; ISFDB lists exactly these three as the Nightshades series and Wikipedia calls it a Tor.com trilogy
  unrelated to the author''s Old World books, so no wider universe to fold in). Special Agent Alex McKenna runs the Chicago
  office of the Bureau of Paranormal Investigations, an FBI division that investigates crimes by shades (vampires), a vicious
  predator the feds track, raid and kill; the series is a procedural manhunt (missing children, slaughtered agents, a misfit
  arrested as a shade in Switchback, an outbreak in the finale). Magic or supernatural agency is literal, so Fantasy; modern
  Earth, so Real earth fantasy. The vampires are publicly known (Reactor calls them recently outed), so Fangs out fantasy
  is the rival leaf, but that leaf is for worlds rebuilt around vampires as a society, whereas here the vampires matter as
  the quarry of an investigation and the story is the hunt. Not Vampire world (no vampire lives or houses from inside). Sources:
  https://torpublishinggroup.com/nightshades/?format=trade&isbn=9780765388506 ; https://reactormag.com/vampires-the-feds-and-melissa-f-olson/
  ; https://www.publishersweekly.com/978-0-7653-8849-0 ; http://www.publishersweekly.com/9780765398277 ; https://mikefinnsfiction.com/2019/01/14/outbreak-nightshades-3-by-melissa-f-olson/
  ; https://www.isfdb.org/cgi-bin/ea.cgi?179994= . Soft spot: public vampires could also read as Fangs out. Reference level,
  not a full read.'

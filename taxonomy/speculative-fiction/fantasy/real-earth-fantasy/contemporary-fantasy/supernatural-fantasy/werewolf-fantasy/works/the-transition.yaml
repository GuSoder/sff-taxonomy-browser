placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Supernatural fantasy -> Werewolf fantasy. Hunter, a trans
  teen recovering from top surgery in contemporary Chicago, is bitten by a werewolf; involuntary lycanthropy threatens the body and identity he has fought for. Friends
  seek to kill the attacker and stop the change while its voice urges him toward pack life and revenge. Literal supernatural transformation governs over romance or
  school bullying. Science fiction/Cryptid horror fails the natural-species gate; Magic realism/Beasts of marvel and Flesh of marvel fail accepted-as-ordinary marvel;
  Contemporary fantasy/Found magic fails magical-craft development; Urban fantasy/Suburban Gothic fails community-as-uncanny-engine. Dark fantasy/Torment children
  lack an ancient prehuman, demonic, Satanic, elder-god or past-wrong origin. Existing Supernatural fantasy children exclude werewolves. Curator approved new Werewolf
  fantasy leaf with The Transition on 2026-09-30: Yes! Werewolf fantasy lets go!'

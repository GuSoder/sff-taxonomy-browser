id: celtic-wolves
title: The Celtic Wolves series
authors:
- Jan DeLima
first_published: 2013
canonical_genre: werewolf-fantasy
placement_status: accepted
placement_rationale: |-
  Root-down: Fantasy > Supernatural fantasy > Werewolf fantasy. Contemporary Maine: Dylan Black, "one of the few of his clan who can still shift into a wolf", protects an ancient Celtic tribe in Rhuddin Village from the Guardians, "vicious warriors who seek to destroy them" (penguinrandomhouse.com series page, Celtic Moon blurb); the series is "her great werewolf world" (USA Today quoted on the Autumn Moon blurb) where "war looms" between shapeshifting tribes. Recognizable Earth, lycanthropy as transmission and identity, human-wolf struggle - the leaf's gate. Rejected: Shapeshifters in gaslight (contemporary Maine, not a gaslight era), Romantasy (romance is co-lead but the leaf's siblings - Mercy Thompson, Kitty Norville - show paranormal-romance werewolf series land here; the struggle between human identity and the wolf plus the tribe wars carry the series). 3 novels (Celtic Moon 2013, Summer Moon 2014, Autumn Moon 2015 - Ace).

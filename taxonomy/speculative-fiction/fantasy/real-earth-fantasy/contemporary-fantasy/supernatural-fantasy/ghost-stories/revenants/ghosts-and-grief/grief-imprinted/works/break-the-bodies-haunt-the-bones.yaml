placement_rationale: 'Break the Bodies, Haunt the Bones (Micah Dean Hicks, HMH/John Joseph Adams, 5 Feb 2019; ISFDB lists
  no earlier edition) is his only novel; his other book is the later collection Vulture Gold (2026), excluded as a collection
  pending the open collections question, and short fiction is out of scope. Swine Hill is a dying pork-plant town where the
  dead outnumber the living: Jane carries a ghost girl, her brother Henry a genius inventor ghost, their mother a lonely burning
  spirit, and the ghosts linger in the places that mattered to them. Full root path: Speculative fiction > Fantasy > Real
  earth fantasy > Contemporary fantasy > Supernatural fantasy > Ghost stories > Revenants > Ghosts & grief > Grief imprinted.
  The town''s long decline and collective grief keep the dead present and the place is the anchor (Publishers Weekly, Locus,
  sff180, Criminal Element). Rivals rejected: Cursed towns, because the force is ghosts rooted in grief and loss rather than
  a curse waiting for arrivals (and that leaf has nine cards); Vengeful spirits, because the sff180 review calls the ghosts
  more pitiful than scary and clinging to old routines, with rage only at the climax (and that leaf has nine cards); Called
  back, because no single living person''s love summons them; Ghost speakers, because the possessed are not mediums by gift.
  Wobbles recorded: the pig-men, robots and New Weird register and the Southern gothic horror framing; possession is central
  and no leaf is built for it.'

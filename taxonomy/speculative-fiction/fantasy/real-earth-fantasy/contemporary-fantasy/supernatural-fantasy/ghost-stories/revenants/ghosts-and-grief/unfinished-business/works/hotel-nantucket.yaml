placement_rationale: 'Elin Hilderbrand''s The Hotel Nantucket (Little, Brown 2022; NYT review 2022-05-26): the ghost of
  Grace Hadley, a chambermaid who died at the hotel in 1922, actively haunts the reopened hotel - she sniffs out "rotten"
  guests and quietly helps the deserving - while her unexplained death is the mystery the living (the child Wanda) finally
  solve. Walk: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural fantasy > Ghost
  stories > Revenants > Ghosts & grief > Unfinished business (a death unexplained, and the living finish it). Rejected:
  Housebound dead branch (haunted-house register; here the haunting is one subplot and the engine is the unexplained death,
  not the walls), Vengeful spirits (Grace helps, she does not menace), Ghost speakers (no medium), Lessons beyond the grave
  (Grace carries no lesson-relationship), Grief-imprinted (the place anchors her, but the plot engine is the death mystery).
  Wobble: medium - mainstream summer drama with a load-bearing ghost subplot; soft eligibility, not centered on the haunting.
  Standalone. Sources: NYT review and study guide; not read in full.'

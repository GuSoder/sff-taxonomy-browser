placement_rationale: 'Root-down walk: Speculative fiction > Fantasy > (recognizable Earth) supernatural-fantasy > Ghost stories
  (umbrella) > Ghost speakers. Born with a caul, 12-year-old Lanesha can see and sometimes communicate with spirits (Kirkus);
  her guardian Mama Ya-Ya has the sight too; Lanesha''s spirit-sight is the defining speculative element from page one and
  carries the Katrina survival story (PW: ''a mix of magical and gritty realism''). Ghost-speakers gate: living mediums whose
  defining gift is to speak with, through or for the dead - exact fit. Not Ghosts-and-grief (mother''s ghost is present but
  the engine is her gift and the storm, not elegy); not Lessons beyond the grave (the dead guide, but the relationship across
  death is not the engine; her living gift is). Middle-grade (9-12) standalone (Little, Brown 2010; no sequel/shared universe);
  tree is content-organized with no age axis in this branch, so MG sits alongside adult tenant Riddance.'

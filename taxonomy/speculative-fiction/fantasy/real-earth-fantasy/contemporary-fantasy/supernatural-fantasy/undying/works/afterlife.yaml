placement_rationale: 'Afterlife (Destefano, 2010, Resurrection Chronicles 1) is a standalone novel: no sequel exists on ISFDB
  or FantasticFiction; the author''s other series (Crescent Moon Bay, Fair Folk, Valiant, Shelley Frankenstein) are separate
  worlds and out of scope. Chaz Dominguez, a ''Babysitter'' for the Fresh Start resurrection program in New Orleans, guards
  the newly resurrected against Nine-Timers, people who hoard repeated returns from death. Full root path: Speculative fiction
  > Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural fantasy > Undying. Fits Undying (deathlessness through
  return from death, not through a bargain). Rivals: Surreal afterlife fails because the story stays among the living in contemporary
  New Orleans, not in a dreamlike beyond; Evil deals fails because resurrection is a service, not a bargain. Wobble recorded:
  the Fresh Start company framing could read as hidden near-future SF, but the publisher and author call it urban fantasy
  and nothing is explained by technology. Cover is hotlinked from the author''s site; the Open Library cover is a title page.'

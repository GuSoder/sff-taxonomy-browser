placement_rationale: 'Root-down: Fantasy > Real-earth fantasy (the swamps and parish morgue of southern Louisiana) > Contemporary
  fantasy > Supernatural fantasy (the supernatural in the modern world, hidden from it) > Undying: Angel Crawford dies in
  a car crash and wakes in the ER without a mark - returned from death as a zombie with an overpowering craving for brains,
  staying undead and healing only while she feeds (dianarowland.com/zombies.html, DAW). Necromantic return from the grave
  outside any bargain: the leaf mechanism verbatim. Soft: the register is rowdy and warm where this shelf runs darker, and
  her undeath is hunger-bound rather than clean deathlessness. Rejected: Zombie apocalypse (SF pandemic fiction - no outbreak
  frame until late and the mechanism is supernatural, not science), Occult PI (each book has a mystery, but Angel is a morgue
  tech, not an investigator), Earthly comic fantasy (funny voice, comedy not the governing engine), vampire leaves (no vampires).
  One card for the White Trash Zombie series: six novels 2011-2017. Years are first publication (Open Library).'

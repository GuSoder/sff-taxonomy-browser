placement_rationale: '# Rewalk after Urban objection, 2026-11-23 14:26 CET


  No approval. User challenged Urban at 14:24 and corrected dictation explicitly. Prior Urban ninth-child recommendation withdrawn.


  Route: Fantasy > Real earth fantasy > Contemporary fantasy > Supernatural fantasy > Paranormal fantasy. Existing seven-fictions
  leaf would become eight. No split, no new seed, no boundary edit, no definition repair without authorization. Monster salvage
  remains a useful hook description, not a promised category.


  Urban actual gate requires supernatural machinery operating through urban life/institutions. Author''s seven-book page establishes
  varied rural/city/midwestern/small-town/global settings and hunter conflict, not city life as series subject. Generic publisher
  or author use of urban fantasy does not override project''s narrower gate.


  Supernatural''s actual gate explicitly allows monsters walking modern world. Paranormal definition is blank, status candidate,
  but tenants establish mixed supernatural communities and roles: Greta, Messenger, Black Wings, No Hero, Griffen, American
  Gods, Good Omens. Messenger/Griffen notes explicitly recognize same ancestor gate plus member pattern and reject forced
  urban specific frames. Earlier dismissal as undefined dump was anchoring on operations, not a principled exclusion. Skinners''
  mixed supernatural human hunters fit existing positive member pattern. No whole-corpus kin move inferred.


  Vampire hunt too vampire-specific; werewolf gate human/wolf transformation/identity, not mixed-species human hunting. Dark
  fantasy partitions place-bound horror and chosen-victim pursuit, neither hunter-led cycle. Other Contemporary child gates
  fail on subject. Post Magicalypse endpoint remains substantial last-volume straddle, not endpoint routing rule.


  Re-fetched sources:

  https://meanderingentertainer.com/2009/01/27/interview-with-marcus-pelegrimas-author-of-blood-blade/

  http://digitaldreamersinc.blogspot.com/p/skinners.html

  https://meanderingentertainer.com/2009/01/27/review-of-blood-blade/


  Research-only. No tree edits or next intake.


  Seven published novels, one connected fiction, 2009-2013. Ordinary trained hunters exploit the hides, blood, flesh and abilities
  of supernatural prey against further threats. Hunting and monster society span wilderness, cities, Midwest and western town.
  Urban city-life subject not evidenced. No species-specific whole-fiction focus. Final volume is a genuine post-collapse
  straddle, not an automatic endpoint rule. Existing fit inspected before any new naming or carve.

  '

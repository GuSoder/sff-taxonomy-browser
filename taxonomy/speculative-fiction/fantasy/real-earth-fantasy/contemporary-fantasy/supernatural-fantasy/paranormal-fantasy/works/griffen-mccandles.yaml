placement_rationale: 'One fiction (rule 11j): the Griffen McCandles series - Dragons Wild (2008, Asprin solo), Dragons Luck
  (2009, Asprin solo), Dragons Deal (2010, Asprin with Nye), Dragons Run (2013, Nye solo); series membership and authorship
  per SFE''s Nye entry and the author''s own bibliography (jodynye.com), FictionDB. Root-down: Fantasy -> Real earth fantasy
  -> Contemporary fantasy -> Supernatural fantasy -> Paranormal fantasy: dragons are an ancient hidden race living as humans
  in present-day New Orleans - the accepted supernatural-fantasy gate is ''supernatural beings with their own genres..., gods,
  angels and monsters walking the modern world'', and the fiction is exactly monsters (dragons) walking the modern world on
  recognizable Earth: Griffen runs a gambling operation, leads the Krewe of Fafnir''s Mardi Gras parade, and faces a rival
  dragon faction (publisher copy). Paranormal fantasy''s tenants are the same shape - hidden supernatural communities in the
  modern world (Dr. Greta Helsing, Black Wings, Good Omens). Rejected: Werewolf fantasy (its accepted def is wolf-specific),
  Beasts of marvel (magic realism where transformation is accepted inside ordinary life; here the dragons are concealed and
  organized, in an action-crime frame), Fae founders / Big-city fae (Faerie peoples specifically; these are dragons), Occult
  mystery (not case-driven PI/cop fiction; Griffen is a boss, not a detective). Wobble: low-moderate - paranormal-fantasy''s
  own definition is still a candidate (empty text), so the fit rests on the accepted supernatural-fantasy ancestor gate plus
  the leaf''s tenant pattern; the comic-crime tone is secondary. First pubs 2008/2009/2010/2013 (author bibliography, SFE).'

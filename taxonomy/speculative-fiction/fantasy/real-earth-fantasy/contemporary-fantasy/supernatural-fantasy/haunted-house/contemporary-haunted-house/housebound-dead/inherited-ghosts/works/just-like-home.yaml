placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Supernatural
  fantasy -> Haunted House -> Contemporary haunted house -> Housebound. Bookreporter: ''the ghost that allegedly haunts the
  Crowder house: the father Vera has not spoken to since the day he was arrested'', and ''something in the house is equally
  reluctant to let go of her... it lives under her bed, where the floorboards part just enough to expose her father''s basement
  of horrors''; Paste calls it ''a good old-fashioned haunting''. The revenant is the dead father bound to the house he built
  - anchored to walls, not to a living person: the housebound brief.'

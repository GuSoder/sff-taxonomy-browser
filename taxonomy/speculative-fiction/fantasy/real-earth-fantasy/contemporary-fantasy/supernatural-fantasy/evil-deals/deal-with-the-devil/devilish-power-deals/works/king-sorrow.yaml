placement_status: accepted
placement_rationale: 'Actual-tree walk: Speculative fiction -> Fantasy -> Real earth fantasy -> Nocturne fantasy -> Supernatural
  fantasy -> Evil Deals -> Deal with the devil. Students use a stolen grimoire ''to summon King Sorrow, a Dragon from Long
  Dark beyond our reality''; the King ''promises to eliminate their enemies'' but ''wants a victim every Easter, for the rest
  of their lives'' and ''finds loopholes to create increasing carnage'' (Wikipedia plot); Ruth Ware''s cover blurb calls it
  ''a brilliantly Faustian fable''. A soul-price bargain with a summoned demonic entity - the leaf''s established idiom, counterparty
  routed through a non-Satanic folklore-demon figure per the definition.'

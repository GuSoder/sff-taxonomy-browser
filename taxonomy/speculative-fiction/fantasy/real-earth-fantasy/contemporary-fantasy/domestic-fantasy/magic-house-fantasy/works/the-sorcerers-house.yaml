placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Domestic fantasy
  > Magic house fantasy. Gene Wolfe''s 2010 epistolary novel: the ex-convict Baxter Dunn squats in an abandoned house in the
  town of Medicine Man and finds he has been retroactively declared its legal owner, and the strange and supernatural phenomena
  belong to the house and to his own family (Wikipedia, Tor edition). The inherited house is the object the book is built
  around, which is the leaf''s definition. Rejected: Magic family fantasy (Dunn''s kin carry the plot, but the house does
  the magic; this is the weaker axis for the card). Wobble: moderate; both axes apply and I read it from the blurb and Wikipedia
  summary only. Held in Domestic fantasy until the split, then seated by the curator''s own names (phonemsg-01M4EB23ZEG2G6833YKK7FX1YQ,
  ''Ok, execute'').'

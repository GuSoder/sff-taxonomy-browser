placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Domestic fantasy
  > Magic house fantasy. In present-day Salem a woman learns her family''s survival depends on a bookstore that vanished in
  1692 and no one has seen for generations; she finds it through thorn and fern behind a blue door (Hachette Book Group).
  The inherited place, a hidden bookstore carrying the family''s witch past, is what comes down the line, the leaf''s definition.
  Rejected: Witchblood (the craft is not the focus; the place is), Magic family fantasy (the magic sits in the shop, not in
  the relatives). Wobble: moderate; a mother-and-daughter secret and a family curse also pull toward the family leaf. Sources:
  publisher page. Year: 2026 (on sale Feb 17, 2026).'

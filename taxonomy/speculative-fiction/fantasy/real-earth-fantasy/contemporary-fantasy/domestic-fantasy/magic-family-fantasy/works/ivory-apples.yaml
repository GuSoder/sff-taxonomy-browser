placement_rationale: 'Tachyon centers a present-day family protecting real, untamable magic connected to a famous fantasy
  novel; Kirkus identifies a sprite entering Ivy and a disruptive, dangerous faery world. Actual magic invading ordinary contemporary
  family life makes Contemporary fantasy the closest existing leaf. Split walk 2026-10-08 (phonemsg-01M4EB23ZEG2G6833YKK7FX1YQ):
  Root-down: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Domestic fantasy > Magic family fantasy.
  A family protecting real magic from a faery intrusion: the magic is theirs to guard, not an inherited object.'

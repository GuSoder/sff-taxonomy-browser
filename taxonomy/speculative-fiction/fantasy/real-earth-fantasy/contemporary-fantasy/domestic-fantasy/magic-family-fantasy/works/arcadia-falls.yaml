placement_rationale: 'Walk: Speculative fiction > Fantasy > Real earth fantasy > Contemporary fantasy > Domestic fantasy >
  Magic family fantasy. Rhea Wolfe inherits her estranged grandmother''s estate in small-town Alabama ''including a magical
  heritage Rhea never knew she carried''; the mystery is the grandmother''s terrible choice, the love interest is the grandson
  of her grandmother''s sworn enemy in witchcraft, and two immature younger sisters lean on her (PRH blurb for Books and
  Bewitchment). The magic lives in the bloodline and the relatives who carry it - the leaf''s carrier test. Rejected: Magic
  house fantasy (the defunct video store is inherited too, but it is real estate; the magic sits in the people, not the
  place), Cozy fantasy (realm-set leaves; Arcadia Falls, Alabama is real Earth), Magical coming of age (an adult inheriting
  a birthright, not a child''s initiation). Wobble: moderate; the cozy-romance register is new on this shelf, and the
  inherited shop is prominent. Year: book 1 Books and Bewitchment, February 3, 2026 (PRH); book 2 Coffee and Conjuring
  (2027) unreleased at intake. Author writes as Delilah S. Dawson. Queue id MC03990.'

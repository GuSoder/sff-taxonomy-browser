placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real-earth fantasy > Contemporary fantasy > Domestic fantasy
  > Magic family fantasy. Bond, 2024: Dani Poissant, magically gifted daughter and former accomplice of the world''s most
  famous art thief, Maria, who turned her mother in to the FBI as a teenager, is offered a job in the present day only Maria
  and her old crew can pull, and has to win back the estranged crew, her mother, the love of her life and her former best
  friend for a year-long art heist. Magic is kept secret from the non-magical world and lives in the crew (Penguin Random
  House description and blurbs). Rejected: Caper fantasy (an invented-world sword-and-sorcery leaf, and at 9), Arcane peoples
  (the secret is a magical people, but the book is about one crew and one family, not an old concealed community), Occult
  cabals and Occult secret service (no order steering events, no service), Untold magic (no historical movement), Paranormal
  bureau (no state office), Magic house fantasy (no inherited place). Magic family fantasy is the leaf where the ties between
  mother, daughter and the crew who count as kin are the story and the magic lives in the people, with the heist as the frame.
  Wobble: moderate to high. The engine is the heist, and the leaf''s other cards (Eastwick, Fallow Sisters, Lessons in Magic
  and Disaster) are domestic, not a caper. Plot from publisher copy, not the book. Year 2024 (PRH, February 2024). Cover from
  the author''s site (publisher jacket, verified visually). Queue id MC03610.'

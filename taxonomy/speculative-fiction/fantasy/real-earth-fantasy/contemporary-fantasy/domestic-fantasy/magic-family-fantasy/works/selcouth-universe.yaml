placement_rationale: 'Whole-fiction walk, MC06147-49: actual witchcraft excludes Science fiction; modern London, its countryside
  and a small-town museum place the fiction on Real earth fantasy, not Fantasy realms. Contemporary, not Historical or Future.
  All eight Contemporary children tested: Contemporary mythic fails (no inherited named mythic power governs the shared fiction);
  Magical coming-of-age is a genuine rival for Belle''s thirtieth-birthday trial and Maeve''s training, but Annie and Sage
  are established adult witches, and the whole fiction follows different generations'' supportive relationships rather than
  one young protagonist''s arrival at adulthood. This is not an invented hard age cutoff. Domestic fantasy passes through
  the kinship/found-household engine: Belle''s mother, best friend and magical mentor form her support circle; Annie, Maeve
  and Hal form a surrogate family in a cottage; Sage''s siblings and colleague help her protect those she loves. Magic family
  fantasy explicitly includes coven-mates whose ties carry the story, not only blood relatives. The magic lives in the people,
  not an inherited house or pact, so Magic house fails. Dark fantasy fails as governing mode (danger appears, but menace is
  not the organizing condition). Supernatural fantasy''s creature, ghost, afterlife and deathlessness branches do not describe
  these living human witches; a ghost in Disenchanted is not the whole-fiction engine. Urban fantasy is a geographic near-fit,
  but its children fail: not Faerie peoples, a fantastic city, public supernatural integration, modern Gothic haunting, an
  investigator''s caseload, a protection service, the modern American West or weaponized weird science. Magic realism fails
  because witchcraft is named, systematized and concealed from non-wicches. Folktale fails: neither an animal society nor
  comedy/farce/satire is the governing engine; Disenchanted''s fairytale curse does not make the whole world a fairytale retelling.
  The cozy realm leaves fail their Fantasy realms ancestor; no exception made. Whole-fiction choice: Magic family fantasy,
  unchanged definition, 6 to 7 fictions. Wobble moderate: Rewitched also has a personal trial/workplace plot, Disenchanted
  a town-wide curse; Uncharmed is the strongest domestic member. This is a found-kin placement supported by author, publisher
  and completed reviews, not a claim that every book is principally about a bloodline or inherited home. All three are author-confirmed
  same Selcouth world, so one fiction, not three cards.'

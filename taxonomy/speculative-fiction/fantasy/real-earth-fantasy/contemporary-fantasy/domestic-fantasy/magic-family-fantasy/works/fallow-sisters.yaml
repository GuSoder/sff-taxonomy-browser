placement_rationale: 'SFE identifies the Fallow Sisters sequence as fantasy. NewCon Press calls it a completed four-volume
  magical quartet about four fey sisters whose lives straddle present-day London and rural Somerset with an otherworld of
  past and alternative realms, aided by star spirits and the dead. Open magic crossing ordinary current life makes Contemporary
  fantasy the closest fit. Split walk 2026-10-08 (phonemsg-01M4EB23ZEG2G6833YKK7FX1YQ): Root-down: Speculative fiction > Fantasy
  > Real earth fantasy > Contemporary fantasy > Domestic fantasy > Magic family fantasy. Four fey sisters across London and
  Somerset: the magic is in the sisters and their ties.'

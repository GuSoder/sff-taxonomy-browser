definition: 'Fantasy rooted in our own Earth and its universe rather than an independently invented fantasy universe, partitioned by when: Historical fantasy (the past), Contemporary fantasy (the present day), Future fantasy (the future). Earth-rooted stories may leave Earth for space, other planets, parallel dimensions, Faerie or the afterlife without leaving this branch.'

placement_rationale: 'Root-down: Fantasy -> Real earth -> Earthly comic fantasy. MFA students form a coven and turn real rabbits into imperfect male Darlings/Drafts,
  a literal supernatural workshop used for savage academic satire. We Love You, Bunny revisits the same coven, protagonist and created First Boy, expanding the shared
  events; coalesced on the first book''s card. Kirkus centers hilarious grotesquerie and satire. Not SF Written worlds: drafting is figurative language for physical
  witchcraft, not proof the world is made of text, and literal magic excludes the SF side.'

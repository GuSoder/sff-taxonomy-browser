placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Paranormal bricks. The
  ageing drag queen Luci LaBang, an occult practitioner, teaches the young Luda ''the Glamour'', a mix of shamanism, acting
  class and makeup tutorial, and the two journey through ''Gasglow'', a thinly disguised hyperreal Glasgow, to a nightmare
  map in a sex-club basement of ''another Gasglow'', a mirage town hung suspended over the original (Guardian review, 28 December
  2023). The city itself is the fantastical subject with a hidden double, which is the leaf''s definition. Rejected: Occult
  city (that is the hidden magical economy of the streets, not the double), Occult institutions (the haunted panto is only
  the stage). Wobble: strong; the review itself cannot say if it is thriller, horror or romance, and my only source is that
  review plus the Del Rey listing; the ending reads the Glamour as fiction itself. 2023 first edition.'

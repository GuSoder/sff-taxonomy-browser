placement_rationale: 'Root-down walk: real Earth, contemporary Texas, so Real-earth fantasy; Urban fantasy; the supernatural
  is hidden from the world, so Modern Weird West (seeded this session; curator phonemsg-01M4V5KK77JVE3EQ0WABST581D). Rejected:
  Publicly paranormal and its three children (the supernatural is publicly known there); Occult secret service (a service,
  not a town); Suburban Gothic (the community is the menace; in Midnight the neighbours protect each other); Small-town fae
  (Faerie peoples); Paranormal bricks (the city itself). Source: charlaineharris.com Midnight, Texas pages: the small town
  of Midnight, at a Texas crossroads, is home to a vampire, witches, a werewolf and psychics who stay hidden from passers-through;
  first book Midnight Crossroad (2014), then Day Shift (2015) and Night Shift (2016). I read the author''s site pages, not
  the books. Wobble: the books are also murder mysteries solved by the neighbours (Occult mystery is a cousin), but the town
  is what holds the series together. Years from the author''s site and Open Library editions: 2014, 2015, 2016.'

placement_rationale: 'Kim Harrison''s The Hollows (Rachel Morgan), from Dead Witch Walking (2004): in an alternate-history
  Cincinnati remade by the Turn, a pandemic from engineered tomatoes that killed much of humanity and brought witches, vampires
  and other Inderlanders into the open (Wikipedia), the witch Rachel Morgan quits the Inderland Security agency as a runner
  to freelance, and the series follows her demon-entangled life inside that publicly known supernatural order. Folded in:
  the later Hollows novels in the queue (Good, Bad and Undead to Demon''s Bluff) and the two bonus-material editions; the
  Hollows Insider guide, the shorts and novellas, and the unreleased Absolute Demon are skipped. Walk: Fantasy > Real-earth
  > Urban fantasy > Publicly paranormal (the supernatural is publicly known) > Paranormal aftermath (a world remade by a reveal,
  stories live inside the new order). Tried Paranormal bureau (3; Rachel leaves the state agency in book one and the series
  is not about the bureau) and Occult PI (hidden-world private cases; this world is open). Source: Wikipedia; I did
  not read the books. Alternative leaf if challenged: Paranormal bureau.'

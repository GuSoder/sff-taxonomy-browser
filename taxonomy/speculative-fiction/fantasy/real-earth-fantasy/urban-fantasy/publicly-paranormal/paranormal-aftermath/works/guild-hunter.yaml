placement_rationale: 'Nalini Singh''s Guild Hunter series (Berkley, from Angels'' Blood, March 2009, to Archangel''s Eternity,
  May 2026; nalinisingh.com, Wikipedia, publisher pages): in a New York where ten archangels rule openly over a world of angels,
  vampires (made by angels, bound to service) and humans, the Guild Hunter Elena Deveraux is hired by the archangel Raphael
  to hunt a rogue vampire, and is drawn into the courts and wars of the archangels. 18 novels in one shared setting folded
  into the first; the novella collection Angels'' Flight is skipped. Walk: Fantasy > Real-earth fantasy (the story is set
  on Earth, here a near-future or alternate present) > Urban fantasy (the supernatural lives inside the modern city) > Publicly
  paranormal (the supernatural is openly known, not hidden) > Paranormal aftermath (a world already remade by a reveal, the
  stories live inside the new order). Tried and rejected: Fae founders (no Faerie peoples), Vampire world (the vampires are
  made by the archangels and are a lesser order), Hidden world leaves (nothing is hidden).'

placement_rationale: 'Root-down walk: set in contemporary America with a real-world supernatural gift, so Real earth fantasy;
  Urban fantasy; Occult mystery; Occult PI. Sources: Wikipedia (Harper Connelly Mysteries, ''a series of fantasy mystery novels'';
  at 15 Harper was struck by lightning, which left her able to sense dead people and see how they died, not who killed them;
  her stepbrother Tolliver Lang manages her bookings) and charlaineharris.com (a woman who finds dead people for pay; Grave
  Sight: she and Tolliver arrive in Sarne, Arkansas and are embroiled in a murder mystery; Grave Surprise: in Memphis, asked
  by an anthropology professor to demonstrate her talent in an old cemetery, she finds two bodies in one grave and a third
  turns up; An Ice Cold Grave: Doraville, North Carolina, several missing teenage boys, she is attacked and becomes part of
  the investigation; Grave Secret: a trip to Texas, family secrets, and what happened to her missing sister Cameron). She
  is an untrained human whose accidental gift is hired out and whose cases run into murder, so Pi meets magic (ordinary or
  untrained humans), not Mage PI (no craft) and not Ghost speakers (she senses bodies and cause of death, she does not speak
  with the dead). Wobble: Ghost speakers and Occult cop were considered; the gift is corpse-sensing and she is a hired finder,
  not police. Years per Wikipedia: 2005, 2006, 2007, 2009.'

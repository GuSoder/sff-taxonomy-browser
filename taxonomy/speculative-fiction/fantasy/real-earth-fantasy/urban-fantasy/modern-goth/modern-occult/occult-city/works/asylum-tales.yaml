placement_rationale: 'Jocelynn Drake''s Asylum Tales (Angel''s Ink 2012, Dead Man''s Deal 2013, Demon''s Vow 2014, Demon''s
  Vengeance 2015; Kirkus, the author''s site, Amazon): in Asylum, the seedy quarter of Low Town where humans share the streets
  with elves, werewolves, vampires and trolls, the warlock tattoo artist Gage sells magic in ink, hunted by the Ivory Towers.
  Walk: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Modern goth > Modern occult > Occult city (the
  city''s hidden magical economy and occult dealings on its streets organize the story). Rejected: Mage PI (Gage is no investigator),
  Paranormal neighbours (the engine is magic for hire, not community life), Occult institutions. Wobble: medium, Paranormal
  neighbours is the alternative. Sources: Kirkus, author site, Amazon blurbs; not read in full.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Modern Goth > Modern
  occult > Occult city. Cassandra Fairfax, an ink-magic reader and book thief working as Cass Holt, inherits her dead mentor
  Chiron''s London bookshop and finds herself defending London''s hidden source of ink magic from a rival bookseller and from
  secrets in a world of magical booksellers (Kirkus review; Hachette). Recognizable present-day London with hidden magic organized
  around a hidden magical economy of books and ink, which is the leaf''s definition (urban arcana, occult dealings). Rejected:
  Occult institutions (the bookshop is a trade, not a campus or society), Paranormal bricks (the city is not itself the fantastical
  subject), Found magic (Cass is an adult practitioner). Wobble: moderate; the shop and its guild could read as an institution,
  and Book of Night in the same leaf is the closest neighbour. Not folded: The City of Stardust, a separate standalone by
  the same author; The Door of Shadows is announced for April 2027 and is held as unpublished.'

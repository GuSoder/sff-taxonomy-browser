placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Modern Goth > Modern
  occult > Occult bloodline. Violet Everly is the last of a line whose best and brightest have been taken for centuries as
  punishment for a forgotten crime; she has ten years to find her mother Marianne, the latest victim, or take her place, and
  the hunt leads through a hidden magical underworld of scholars, gods and monsters toward the city of stardust where the
  Everly story began (Hachette). The family curse is what opens the occult world to her, which is the leaf''s definition (family
  inheritance opening the occult world in contemporary life). Rejected: Occult institutions (the scholars are antagonists
  she meets, not her institution), Occult city (the quest criss-crosses the globe, not one city''s economy), Contemporary
  mythic fantasy (the gods are an invented mythos, not an active ancient pantheon). Wobble: real; the leaf speaks of practiced
  ancestral magic and Violet practices none, so the inherited curse is the link, and the scholars'' cabal pulls toward Occult
  institutions.'

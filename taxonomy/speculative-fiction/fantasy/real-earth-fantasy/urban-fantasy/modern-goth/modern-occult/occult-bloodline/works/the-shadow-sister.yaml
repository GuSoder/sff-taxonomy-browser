placement_rationale: 'Root-down: Speculative fiction -> Fantasy -> Real earth fantasy -> Urban fantasy -> Modern Goth -> Modern occult -> Occult bloodline. Present-day
  Seattle sisters investigate an uncanny return and missing Black girls. Inherited family hoodoo/rootwork and protective paternal ancestry supply the confirmed magic;
  sisterhood and the missing-person thriller are the plot bend. Author identifies hoodoo and deliberate fantasy; Locus confirms a magic-based ending; Kirkus confirms
  paternal legacy protects Sutton. No literal resurrection or bracelet mechanism asserted from unreliable spoilers. Domestic fantasy is the strongest alternative,
  but curator chose ancestral occult practice. Original 2026-09-30 12:28:45 iMessage "Ok, sure" answers the Occult bloodline recommendation after Griot was rejected
  as invented-world fantasy.'

first_published: 2019
canonical_genre: occult-institutions
placement_status: accepted
placement_rationale: Alex Stern, who can see the dead (Grays), is recruited to police Yale's eight secret societies, whose
  tombs run real occult rites - portal surgery, shape-shifting, drug-fueled communion with the other side. Occult systems
  operating inside a contemporary institution fit Modern occult exactly (cf. Conjure Wife's campus witchcraft); the ghost
  sight serves the occult-institution frame rather than a haunting-centered story.

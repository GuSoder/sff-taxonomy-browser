id: frankenstein-in-baghdad
title: Frankenstein in Baghdad
authors:
- Ahmed Saadawi
first_published: 2013
canonical_genre: war-gothic
placement_status: accepted
placement_rationale: SFE identifies a corpse assembled from bombing victims and possessed by a dead guard's soul; PRH confirms the unkillable flesh-eating monster stalking occupied Baghdad. A contemporary city haunted by war's accumulated dead makes Modern Goth the closest leaf.

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Occult police > Occult
  secret service. Ray Lilly drives for Annalise Powliss of the Twenty Palace Society, a group of sorcerers devoted to hunting
  down and executing rogue magicians, and in Child of Fire must finish her mission alone against a sorcerer sacrificing innocents
  for power (Penguin Random House description); Game of Cages and Circle of Enemies are further Twenty Palaces novels. A hidden
  service whose work is containing occult threats in secret, the leaf''s definition. Rejected: Occult consultants (Ray is
  bound to the Society, not freelance), Occult cop cases (no badge or case file). Wobble: moderate; the Society is private,
  not state-run. Sources: PRH page for book one; series membership from the cover lines. Years: 2009, 2010, 2011.'

placement_status: accepted
placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Occult police fiction
  > Occult consultants. One shared universe, so one fiction (rule 11j): Jane Yellowrock (15 novels, Roc/Ace), the Soulwood
  spinoff (6 novels, Nell Ingram; Hunter says Soulwood is set in the same universe as Jane Yellowrock, with crossover characters
  and an interlaced timeline) and Unpredictable Magic (2026, the Everhart Investigations PI firm; the blurb names Angie''s
  aunt Jane). Jane Yellowrock is a Cherokee skinwalker who hunts rogue vampires as a freelancer, then takes a contract with
  the Master of the City of New Orleans; she works outside any force. Nell is hired to help PsyLED find a missing child and
  is a consultant before she is staff; Angie and Evan run a private paranormal PI firm. That is private and freelance investigators
  taking occult cases, the Occult consultants definition. Rejected: Occult cop cases (no badge on the main line), Occult secret
  service (PsyLED is a Homeland Security division and Soulwood leans there, but it is the minority of the books), Vampire
  hunt (the vampires are a cast and a politics, not the whole shape, and a vampire leaf cannot hold the Soulwood and Everhart
  books). Wobble: Soulwood on its own would read Occult secret service. Unfolded on purpose: the story and omnibus rows MC03103
  Blood in Her Veins, MC03108 Cat Tales, MC03117 Have Stakes Will Travel, MC03119 Kicking It, MC03121 Of Claws and Fangs are
  collections, anthologies or short stories. Rogue Mage (Bloodring, Host, Seraphs) is a separate universe and gets its own
  fiction.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Occult police > Occult
  cop cases. Per Tor''s copy: DCI Holly Craig, who can see the evil in people''s souls, returns to her Welsh coastal hometown
  of Pontyrhudd to investigate what starts as a hit-and-run and turns deadlier and personal. A sworn detective chief inspector
  with a badge and a case file works a case shaped by the supernatural, which is the Occult cop cases definition. Rejected:
  Occult consultants (she is on the force, not freelance), Occult secret service (no hidden state service; ordinary police),
  Noir or Gothic leaves (the case procedure is the engine). Wobble: it is a small Welsh seaside town, not a city, so the Urban
  fantasy parent stretches; the leaf is the only home for a sworn-detective occult procedural. Published 2019 (Titan; Tor
  trade edition later).'

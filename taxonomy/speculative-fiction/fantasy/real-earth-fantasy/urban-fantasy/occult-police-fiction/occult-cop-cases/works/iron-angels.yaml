placement_rationale: 'Fantasy > Real-earth fantasy > Urban fantasy > Occult police fiction > Occult cop cases: in contemporary
  Chicago and northwest Indiana, FBI agents Jasper Wilde and Temple Black investigate kidnapping, mutilated corpses and warring
  cults around an otherworldly evil. Kimble calls it urban fantasy and, at its heart, an FBI procedural. The Scientific Anomalies
  Group is a specialist FBI unit, but the criminal case and sworn investigators govern: Occult cop cases, not an independent
  hidden service. The alien/demon description is not evidence for a technological extraterrestrial invasion; horror and dimensional
  menace are the register of the case, not a traveller adventure.'

placement_rationale: 'Root-down: Speculative fiction > Fantasy > Real earth fantasy > Urban fantasy > Fae founders. In Castleview,
  Illinois, factory manager Tom Howard is murdered; the newcomer Will Shields glimpses from an attic window the phantom castle
  that gives the town its name and nearly runs down a gigantic horseman in the rain, the first of a series of collisions with
  the mythological, Arthurian and Faerie, that Wolfe plays out around the town (ISFDB title record 2271, back-cover synopsis;
  Kirkus). Old Faerie courts and champions survive in a present-day town and shape its events, which is the leaf''s definition.
  Rejected: Contemporary mythic fantasy (the Faerie court and the Arthurian frame are one Faerie story, not an ancient pantheon
  in daily life), Perilous fairy doors (Faerie is already in the town, not behind a door), Occult institutions (no society
  or profession). Wobble: real; it is a town more than a city, and Wolfe works the Arthurian and vampiric strands as much
  as the Faerie one. The earlier parked gate is gone since The Dresden Files left this leaf on 2026-10-08 (curator, phonemsg-01M4E8YC7MFDJQ2ZWZW0AFG1CK).'

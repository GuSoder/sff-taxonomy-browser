  save the Ten Acre Wood from developers, arsonists and predatory Faeries (Publishers Weekly review; Metropolitan Library
  series page; Book View Cafe copy). A Faerie people entering and shaping the modern human world is Fae founders; the small
  town is the stage. Rejected: Perilous fairy doors (no portal), Faeries in gaslight (not the 19th century), Big-city fae
  (small town). Wobble: moderate; Publishers Weekly calls it a paranormal romance and the pixie is the protagonist, not a
  mortal among the fae. Book 1 of The Pixie Chronicles, DAW June 2011 (Publishers Weekly). Queue id MC03970.'

placement_rationale: 'Lackey and Cody Martin''s Silence (Baen, 5 Apr 2016, SERRAted Edge) and Breaking Silence (Baen, 2020;
  baen.com, Simon & Schuster, mercedeslackey.com): the teenager Staci is sent to live with her alcoholic mother in the dying
  Maine town of Silence, which has no cell service and almost no internet, and finds that its first family, the Blackthorns,
  are dark elves who feed on the misery of the residents; with a bookstore gang she defeats them, and in Breaking Silence,
  now a mage in training, she fights the remnants for the soul of the town. Walk: Fantasy > Real-earth fantasy > Urban fantasy
  > Fae founders (old Faerie peoples, courts and bargains survive into and shape the modern world) > Small-town fae (Faerie
  peoples living on in a village, a county or a hollow). Rejected: Big-city fae (the town is the setting, not a metropolis),
  Magic school and Witchblood (Staci learns magic but the elves'' hold on the town is the plot), Occult PI (no investigators
  for hire), Paranormal neighbours (the elves are predators, not ordinary neighbours). One series is one fiction (11j): Silence
  and Breaking Silence. Wobble low. Years from Baen and mercedeslackey.com first-publication dates.'

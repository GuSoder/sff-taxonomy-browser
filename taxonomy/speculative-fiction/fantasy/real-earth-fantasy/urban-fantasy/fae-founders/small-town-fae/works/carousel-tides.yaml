placement_rationale: 'Sharon Lee''s Carousel books (Baen: Carousel Tides, 2010; Carousel Sun, 2014; Carousel Seas, 2015; Baen,
  Simon & Schuster, sharonleewriter.com ''About the Carousel Books''): in the small Maine resort town of Archers Beach, Kate
  Archer comes home after years away when her grandmother vanishes and leaves her the family carousel and the Land, with the
  powers and duties of its guardian, in a hidden world of Black Dogs, selkies and the spirits of land and sea. Three novels
  in one setting folded into the first (rule 11j). Walk: Fantasy > Real-earth fantasy > Urban fantasy > Fae founders (old
  Faerie peoples, courts and bargains survive into and shape the modern world) > Small-town fae (Faerie peoples living on
  in a village or county where everyone knows everyone). Tried: Occult bloodline (the inheritance is a guardianship of one
  town''s land, not urban occult life) and Paranormal neighbours (the beings are not publicly known). Wobble: the beings are
  selkies, spirits and Black Dogs rather than a Faerie court; Small-town fae is the nearest honest home.'

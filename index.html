function path(n){let a=[];while(n){a.unshift(n.label);n=n.parent?by[n.parent]:null}return a.join(' › ')}
function render(id){current=id;let n=by[id],bg=document.querySelector('#bg');bg.style.backgroundImage=n.image?`url(${n.image})`:'';bg.innerHTML=n.image?'':'<div class="placeholder">✦</div>';title.textContent=n.label;crumb.textContent=path(n);back.style.visibility=n.parent?'visible':'hidden';count.textContent=`${n.children.length} subgenre${n.children.length===1?'':'s'} · ${n.works.length} book${n.works.length===1?'':'s'}`;hint.textContent=n.children.length?'Tap a branch, or swipe left/right between sibling genres.':(n.works.length?'Leaf genre · swipe left/right between siblings.':'Portrait pending · swipe left/right between siblings.');content.innerHTML=n.children.length?`<div class="grid">${n.children.map(c=>{let x=by[c];return `<button class="card ${x.image?'':'placeholder-card'}" data-id="${c}" ${x.image?`style="background-image:url(${x.image})"`:''}>${x.image?'':'<span class="card-star">✦</span>'}<span class="card-label">${x.label}</span></button>`}).join('')}</div>`:`<div class="works">${n.works.map(w=>`<div class="work" id="book-${w.title.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}">${w.cover_url?`<img src="${w.cover_url}" alt="${w.title} cover" loading="lazy" referrerpolicy="no-referrer">`:'<div class="work-placeholder">◇</div>'}<div class="work-label ${w.cover_url&&w.shows_english_title?'hidden':''}"><b>${w.title}</b>${w.authors.length?' · '+w.authors.join(', '):''}${w.year?' ('+w.year+')':''}</div></div>`).join('')}</div>`;content.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>render(b.dataset.id));let sib=n.parent?by[n.parent].children:[n.id];dots.innerHTML=sib.length<=10?sib.map(x=>`<span class="dot ${x===id?'on':''}"></span>`).join(''):'';history.replaceState(null,'','#'+id)}
function shift(d){let n=by[current],s=n.parent?by[n.parent].children:[current],i=s.indexOf(current);if(s.length>1)render(s[(i+d+s.length)%s.length])}
back.onclick=()=>{let n=by[current];if(n.parent)render(n.parent)};home.onclick=()=>render('speculative-fiction');app.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});app.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)shift(dx<0?1:-1)},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowRight')shift(1);if(e.key==='ArrowLeft')shift(-1);if(e.key==='ArrowUp')back.click()});let hp=location.hash.slice(1).split('/'), start=by[hp[0]]?hp[0]:current;render(start);if(hp[1])requestAnimationFrame(()=>document.querySelector('#book-'+hp[1])?.scrollIntoView({block:'center'}));

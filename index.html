ocieties and collisions with humanity - divided by embodiment. Embodiment test: if the story centers a machine in a body, it is Robots; if it centers a disembodied or distributed intelligence, it is AI."},{"id":"psionics","label":"Psionics","parent":"future-of-earth-fiction","children":[],"works":[{"title":"The Demolished Man","cover_url":"https://covers.openlibrary.org/b/id/14911212-L.jpg","shows_english_title":true,"authors":["Alfred Bester"],"year":1953},{"title":"Ubik","cover_url":"https://covers.openlibrary.org/b/id/10455926-L.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1969},{"title":"Slan","cover_url":"https://covers.openlibrary.org/b/id/5543912-L.jpg","shows_english_title":true,"authors":["A. E. van Vogt"],"year":1940,"books":[{"title":"Slan","year":1940,"authors":["A. E. van Vogt"],"cover_url":"https://covers.openlibrary.org/b/id/5543912-L.jpg"},{"title":"Slan Hunter","year":2007,"authors":["A. E. van Vogt","Kevin J. Anderson"],"cover_url":"https://covers.openlibrary.org/b/id/6936338-L.jpg"}]},{"title":"The Lathe of Heaven","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-the-lathe-of-heaven-303.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":1971},{"title":"Gabriel's Body","cover_url":"https://www.worldswithoutend.com/covers/cs_gabriels.jpg","shows_english_title":true,"authors":["Curt Siodmak"],"year":1992,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Psionics. Locus calls it an SF/medical thriller: biochemist Patrick Cory plans to restore his disfigured self through a perfect brain-dead body, only to find bodies have wills of their own. SFE links it to the Cory trilogy’s studied identity transfer. Under Gustav’s 2026-09-22 15:16 reader-relative Futurist doctrine, this psi-as-science from 1992 reads as an alternate future’s science even without a future date."},{"title":"Hauser's Memory","cover_url":"https://covers.openlibrary.org/b/id/11036159-L.jpg","shows_english_title":true,"authors":["Curt Siodmak"],"year":1968,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Psionics. The CIA transfers a dying Cold War scientist’s memory/personality through RNA, producing possession and an East-West chase. Under Gustav’s 2026-09-22 15:20 doctrine, Cold War-era speculative psi/science written before the Cold War ended is Futurist Psionics."}],"image":"33-telepathy-fiction.webp","definition":"Science fiction in which psi is treated as a studiable science - including telepathy, precognition, telekinesis, effective dreaming or consciousness/identity transfer - and shapes society or the story. It includes future settings and reader-relative alternate futures of speculative science that did not pan out. Cold War-era speculative psi/science written before the Cold War ended tests as Futurist Psionics; if analogous Cold War Psionics written after the Cold War ended appears, hold for Gustav to consider a Retro Psionics split.","status":"provisional"},{"id":"orbital-mechanics","label":"Orbital Mechanics","parent":"hard-sf","children":[],"image":"74-orbital-mechanics.webp","definition":"Hard SF of orbital engineering and spaceflight mechanics - stations, ships, and orbits worked out with real physics. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"2001: A Space Odyssey","cover_url":"https://covers.openlibrary.org/b/id/15222145-L.jpg","shows_english_title":true,"authors":["Arthur C. Clarke"],"year":1968,"books":[{"title":"2001: A Space Odyssey","year":1968,"cover_url":"https://covers.openlibrary.org/b/id/15222145-L.jpg"},{"title":"2010: Odyssey Two","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/14831059-L.jpg"},{"title":"2061: Odyssey Three","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/14922581-L.jpg"},{"title":"3001: The Final Odyssey","year":1997}]},{"title":"Ringworld","cover_url":"https://covers.openlibrary.org/b/id/7111777-L.jpg","shows_english_title":true,"authors":["Larry Niven"],"year":1970,"books":[{"title":"Ringworld","year":1970,"cover_url":"https://covers.openlibrary.org/b/id/14999410-L.jpg"},{"title":"The Ringworld Engineers","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/7892550-L.jpg"},{"title":"The Ringworld Throne","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/7892551-L.jpg"},{"title":"Ringworld's Children","year":2004,"cover_url":"https://covers.openlibrary.org/b/id/7892556-L.jpg"}]},{"title":"The Moon Is a Harsh Mistress","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-the-moon-is-a-harsh-mistress-93.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1966},{"title":"From the Earth to the Moon / Around the Moon","cover_url":"https://covers.openlibrary.org/b/id/10209170-L.jpg","shows_english_title":true,"authors":["Jules Verne"],"year":1865,"books":[{"title":"From the Earth to the Moon","year":1865,"cover_url":"https://covers.openlibrary.org/b/id/10209170-L.jpg"},{"title":"Around the Moon","year":1870,"cover_url":"https://covers.openlibrary.org/b/id/10209170-L.jpg"}],"placement_note":"SFE treats the pair as Verne's Around the Moon sequence; Simon & Schuster says the first is the engineering challenge of launching a projectile and the second follows its crew to the Moon and back. Worked-through launch and orbital travel make Orbital Mechanics closest."},{"title":"Orbitsville","authors":["Bob Shaw"],"year":1975,"cover_url":"https://covers.openlibrary.org/b/id/14616407-L.jpg","shows_english_title":true,"placement_note":"Wikipedia: discovery of a Dyson sphere-like artefact surrounding a star; SFE pairs it with Ringworld and Rendezvous with Rama as vast-alien-artefact fiction - shelfed beside Ringworld in orbital mechanics."}]},{"id":"planetary-science","label":"Planetary Science","parent":"hard-sf","children":[],"image":"75-planetary-science.webp","definition":"Hard SF built on planetary geology, climate, and exploration. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"The Mars Trilogy","cover_url":"https://covers.openlibrary.org/b/id/8281636-L.jpg","shows_english_title":false,"authors":["Kim Stanley Robinson"],"year":1992,"books":[{"title":"Red Mars","year":1992,"cover_url":"https://covers.openlibrary.org/b/id/382552-L.jpg"},{"title":"Green Mars","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/372391-L.jpg"},{"title":"Blue Mars","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/3818726-L.jpg"}]},{"title":"Mission of Gravity","cover_url":"https://covers.openlibrary.org/b/id/8328571-L.jpg","shows_english_title":true,"authors":["Hal Clement"],"year":1954},{"title":"The Martian","cover_url":"https://covers.openlibrary.org/b/id/11446888-L.jpg","shows_english_title":true,"authors":["Andy Weir"],"year":2014},{"title":"Plutoshine","cover_url":"https://covers.openlibrary.org/b/id/14718115-L.jpg","shows_english_title":true,"authors":["Lucy Kissick"],"year":2022,"placement_note":"Terraforming Pluto: a scientist's plan to light the dwarf planet with orbital mirrors (SFBook, Oxford Student)."}]},{"id":"matter-transmission","label":"Matter Transmission","parent":"hard-sf","children":[],"works":[{"title":"Rogue Moon","cover_url":"https://covers.openlibrary.org/b/id/8651995-L.jpg","shows_english_title":true,"authors":["Algis Budrys"],"year":1960}],"image":"113-matter-transmission.webp","definition":"Hard SF centered on transmitting or duplicating matter, and on the physical or identity problems created by that process (SFE Matter Transmission / Matter Duplication).","status":"candidate"},{"id":"classic-space-opera","label":"Classic space opera","parent":"spacefaring-fiction","children":["pulp-space-opera","evergreen-space-opera"],"image":"44-classic-space-opera.webp","definition":"Umbrella for the classic space-opera tradition, partitioned by pulp mode and enduring evergreen status.","status":"candidate","works":[]},{"id":"pulp-space-opera","label":"Pulp space opera","parent":"classic-space-opera","children":["golden-age-space-opera","retro-space-opera"],"image":"170-pulp-space-opera.webp","definition":"Umbrella for space opera in the pulp tradition, partitioned into its original wave and deliberate modern throwbacks.","status":"candidate","works":[]},{"id":"golden-age-space-opera","label":"Golden Age space opera","parent":"pulp-space-opera","children":["pulp-space-odyssey","pulp-space-empire"],"image":"172-golden-age-space-opera.webp","definition":"Pure umbrella for the original pulp-space-opera wave, partitioned by whether personal journey or rival-power structure drives the story.","status":"umbrella","works":[]},{"id":"pulp-space-odyssey","label":"Pulp Space Odyssey","parent":"golden-age-space-opera","children":[],"works":[{"title":"The Heechee Saga","cover_url":"https://covers.openlibrary.org/b/isbn/9780575094239-L.jpg","shows_english_title":true,"authors":["Frederik Pohl"],"year":1977,"books":[{"title":"Gateway","year":1977,"cover_url":"https://covers.openlibrary.org/b/id/9424523-L.jpg"},{"title":"Beyond the Blue Event Horizon","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/13531911-L.jpg"},{"title":"Heechee Rendezvous","year":1984,"cover_url":"https://covers.openlibrary.org/b/isbn/0345300556-L.jpg"},{"title":"The Annals of the Heechee","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/6817548-L.jpg"},{"title":"The Gateway Trip","year":1990,"cover_url":"https://covers.openlibrary.org/b/id/7022115-L.jpg"},{"title":"The Boy Who Would Live Forever","year":2004,"cover_url":"https://covers.openlibrary.org/b/id/9320867-L.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Odyssey. A small group’s high-risk Heechee-gateway exploration and Robinette Broadhead’s survival/guilt remain the engine rather than governance of galactic power."},{"title":"The Stars My Destination","cover_url":"https://covers.openlibrary.org/b/id/8599758-L.jpg","shows_english_title":true,"authors":["Alfred Bester"],"year":1956,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Odyssey. Gully Foyle’s revenge journey remains the engine across the Solar System rather than governance of rival galactic powers."},{"title":"The Witches of Karres","cover_url":"https://covers.openlibrary.org/b/id/8740044-L.jpg","shows_english_title":true,"authors":["James H. Schmitz"],"year":1966,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Odyssey. A captain and three witch children flee and roam through comic space adventures as a small party."},{"title":"Have Space Suit -- Will Travel","year":1958,"authors":["Robert A. Heinlein"],"cover_url":"https://covers.openlibrary.org/b/id/15243049-L.jpg","shows_english_title":true,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Odyssey. Kip’s personal escalation from recovered suit to alien abduction, Moon/Pluto travel and galactic trial is an individual odyssey."}],"image":"280-pulp-space-odyssey.webp","definition":"A protagonist or small party propelled across space by exploration, revenge, flight or adventure rather than governing galactic power. Boundary test: remove the rival-power structure; if a person’s journey remains, it belongs here.","status":"accepted"},{"id":"pulp-space-empire","label":"Pulp Space Empire","parent":"golden-age-space-opera","children":[],"works":[{"title":"Judgment Night","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/02/hbg-title-judgment-night-a-selection-of-science-fiction-3-53.jpg","shows_english_title":true,"authors":["C. L. Moore"],"year":1943,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Empire. A dying Galactic Empire, war-trained princess, rebels, ancient weapons and imperial war make the rival-power structure indispensable."},{"title":"Double Star","cover_url":"https://covers.openlibrary.org/b/id/13511002-L.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1956,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Empire. Political impersonation of a kidnapped statesman preserves a governing coalition; remove the polity conflict and the plot collapses."},{"title":"Nova","cover_url":"https://covers.openlibrary.org/b/id/10191692-L.jpg","shows_english_title":true,"authors":["Samuel R. Delany"],"year":1968,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Empire. Rival industrial dynasties contest Illyrion and galactic economic power; the rival-power structure drives the stellar quest."},{"title":"Canopus in Argos","cover_url":"https://covers.openlibrary.org/b/id/6612965-L.jpg","shows_english_title":true,"authors":["Doris Lessing"],"year":1979,"books":[{"title":"Re: Colonised Planet 5, Shikasta","year":1979,"cover_url":"https://covers.openlibrary.org/b/id/8260597-L.jpg","shows_english_title":true,"authors":["Doris Lessing"]},{"title":"The Marriages Between Zones Three, Four, and Five","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/6568-L.jpg","shows_english_title":true},{"title":"The Sirian Experiments","year":1981,"cover_url":"https://covers.openlibrary.org/b/id/6569-L.jpg","shows_english_title":true},{"title":"The Making of the Representative for Planet 8","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/6563-L.jpg","shows_english_title":true},{"title":"Documents Relating to the Sentimental Agents in the Volyen Empire","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/6571-L.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Empire. Canopus, Sirius and rival advanced empires intervene in and administer subject worlds across the sequence; imperial systems govern."},{"title":"Cities in Flight","cover_url":"https://covers.openlibrary.org/b/id/5540855-L.jpg","shows_english_title":true,"authors":["James Blish"],"year":1956,"books":[{"title":"They Shall Have Stars","year":1956,"cover_url":"https://covers.openlibrary.org/b/id/5540855-L.jpg"},{"title":"A Life for the Stars","year":1962,"cover_url":"https://covers.openlibrary.org/b/id/5542304-L.jpg"},{"title":"Earthman, Come Home","year":1955,"cover_url":"https://covers.openlibrary.org/b/id/5540824-L.jpg"},{"title":"The Triumph of Time","year":1958,"cover_url":"https://covers.openlibrary.org/b/id/10616266-L.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Empire. Mobile cities operate as interstellar migrant polities across a future history; civic power, economics and historical rise and fall govern."},{"title":"The Centauri Device","cover_url":"https://covers.openlibrary.org/b/id/13252965-L.jpg","shows_english_title":true,"authors":["M. John Harrison"],"year":1974,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Classic space opera -> Pulp space opera -> Golden Age space opera -> Pulp Space Empire. Interstellar war factions pursue a doomsday weapon and its unwilling human key; military-political rival powers drive the plot."}],"image":"281-pulp-space-empire.webp","definition":"Space opera driven by rule, war, diplomacy, political impersonation, imperial systems or rival powers. Boundary test: remove the rival-power structure; if the plot collapses, it belongs here.","status":"accepted"},{"id":"retro-space-opera","label":"Retro space opera","parent":"pulp-space-opera","children":[],"image":"173-retro-space-opera.webp","definition":"Twenty-first-century space opera that deliberately looks backward, channeling the pulp era’s style. Unlike New space opera - the 1990s-2000s movement that modernized the form - Retro space opera is the throwback.","status":"candidate","works":[{"title":"Revenger","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316555623.jpg","shows_english_title":true,"authors":["Alastair Reynolds"],"year":2016,"books":[{"title":"Revenger","year":2016,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316555623.jpg"},{"title":"Shadow Captain","year":2019,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316555685.jpg"},{"title":"Bone Silence","year":2020,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2020/04/9780316462754.jpg"}]},{"title":"The Finder Chronicles","cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756421069","shows_english_title":true,"authors":["Suzanne Palmer"],"year":2019,"books":[{"title":"Finder","year":2019,"cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756421069"},{"title":"Driving the Deep","year":2020,"cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756421076"},{"title":"The Scavenger Door","year":2021,"cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756421083"},{"title":"Ghostdrift","year":2024,"cover_url":"https://images1.penguinrandomhouse.com/smedia/9780756419752"}],"placement_note":"SFE calls the four-book Finder Chronicles a lively, light-hearted Space Opera about an interstellar repo man; PRH describes action-packed capers spanning deep-space colonies, AI ships, aliens and heists. Its episodic pulp-adventure shape fits Classic space opera better than the political or alien-archaeology branches of New space opera."},{"title":"Radiance","cover_url":"https://covers.openlibrary.org/b/id/8577773-L.jpg","shows_english_title":true,"authors":["Catherynne M. Valente"],"year":2015,"placement_note":"SFE valente_catherynne_m: set in an Alternate Cosmos where the Solar System has been freely available since the mid-nineteenth century; baroque spoof with sharp satire of the film industry, decadent societies on Moon, Venus, Mars. A 2015 novel deliberately channeling pulp-era planetary romance - retro space opera."},{"title":"The Space Opera","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781481497503/space-opera-9781481497503_lg.jpg","shows_english_title":true,"authors":["Catherynne M. Valente"],"year":2018,"books":[{"title":"Space Opera","year":2018,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781481497503/space-opera-9781481497503_lg.jpg"},{"title":"Space Oddity","year":2024,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781668063019/space-oddity-9781668063019.jpg"}],"placement_note":"SFE calls this two-volume sequence an adroitly baroque space-opera spoof that transforms traditional SF forms: humanity faces a galactic-civilization judgment through the Metagalactic Grand Prix, followed by a victory tour and new First Contact competition. Its deliberate comic recasting of old galactic-council and contact tropes makes Retro space opera the closest leaf."}]},{"id":"evergreen-space-opera","label":"Evergreen space opera","parent":"classic-space-opera","children":[],"image":"171-evergreen-space-opera.webp","definition":"Space opera that escaped its era: perpetually current rather than dated, in publishing’s evergreen sense.","status":"candidate","works":[{"title":"Dune","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-dune-5-163.jpg","shows_english_title":true,"authors":["Frank Herbert"],"year":1965,"books":[{"title":"Dune","year":1965,"cover_url":"https://covers.openlibrary.org/b/isbn/0450042308-L.jpg"},{"title":"Dune Messiah","year":1969,"cover_url":"https://covers.openlibrary.org/b/isbn/9780441172696-L.jpg"},{"title":"Children of Dune","year":1976,"cover_url":"https://covers.openlibrary.org/b/isbn/9780425071793-L.jpg"},{"title":"God Emperor of Dune","year":1981,"cover_url":"https://covers.openlibrary.org/b/id/6711531-L.jpg"},{"title":"Heretics of Dune","year":1984,"cover_url":"https://covers.openlibrary.org/b/isbn/9780425076699-L.jpg"},{"title":"Chapterhouse: Dune","year":1985,"cover_url":"https://covers.openlibrary.org/b/isbn/0575035765-L.jpg"}]}]},{"id":"generation-starships","label":"Generation Starships","parent":"spacefaring-fiction","children":[],"works":[{"title":"Non-Stop","cover_url":"https://covers.openlibrary.org/b/id/6544849-L.jpg","shows_english_title":true,"authors":["Brian W. Aldiss"],"year":1958},{"title":"Escaping Exodus","cover_url":"https://covers.openlibrary.org/b/id/10325949-L.jpg","shows_english_title":true,"authors":["Nicky Drayden"],"year":2019,"books":[{"title":"Escaping Exodus","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10325949-L.jpg"},{"title":"Escaping Exodus: Symbiosis","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/12000734-L.jpg"}],"placement_note":"Harper describes a society living in the belly of a spacefaring beast whose civilization depends on maintaining that living vessel. The multigenerational enclosed society and survival of its mobile home make Generation starships the closest existing category, with the bioship as a biological variant."},{"title":"Rite of Passage","cover_url":"https://covers.openlibrary.org/b/id/15053182-L.jpg","shows_english_title":true,"authors":["Alexei Panshin"],"year":1968,"placement_note":"Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Generation Starships. SFE calls its World Ship venue a generation-starship rite-of-passage structure, while noting its FTL capability makes it an impure example. Other Spacefaring siblings fail because the closed ship society and heroine’s maturation within it are the engine."},{"title":"Calypso","cover_url":"https://covers.openlibrary.org/b/id/14851929-L.jpg","shows_english_title":true,"authors":["Oliver K. Langmead"],"year":2024,"placement_note":"Verse novel: a gardener wakes aboard a colony ship and grows a world inside it (Reactor, Newtown Review)."}],"image":"111-generation-starships.webp","definition":"Societies living aboard multigenerational spacecraft, often after the ship’s true nature or mission has been forgotten.","status":"candidate"},{"id":"anthropological-science-fiction","label":"Anthropological science fiction","parent":"alien-fiction","children":["earthborn","xenanthropology","xenolinguistics","xenocolonial"],"works":[],"image":"6-anthropological-science-fiction.webp","definition":"Umbrella for science fiction that uses cultural encounter to examine societies and the observer’s assumptions, partitioned by whether the estrangement is human or explicitly alien.","status":"accepted"},{"id":"earthborn","label":"Earthborn","parent":"anthropological-science-fiction","children":[],"image":"174-earthborn.webp","definition":"Anthropological science fiction where the society under the microscope is human or human-descended; the alien element is cultural estrangement. Gustav chose the name; Earthborn is attested SF vocabulary for originating on Earth.","status":"candidate","works":[{"title":"Ammonite","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-ammonite-2-143.jpg","shows_english_title":true,"authors":["Nicola Griffith"],"year":1993},{"title":"Hainish Cycle","cover_url":"https://covers.openlibrary.org/b/id/1926090-L.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":1966,"books":[{"title":"Rocannon's World","year":1966,"cover_url":"https://covers.openlibrary.org/b/id/1926090-L.jpg","shows_english_title":true},{"title":"Planet of Exile","year":1966,"cover_url":"https://static1.squarespace.com/static/5cad42ef90f904e520359371/t/61c182f24375676c474f4166/1640071922550/planet-of-exile-ace-paperback.jpg?format=1500w","shows_english_title":true},{"title":"City of Illusions","year":1967,"cover_url":"https://covers.openlibrary.org/b/id/1926091-L.jpg","shows_english_title":true},{"title":"The Left Hand of Darkness","year":1969,"cover_url":"https://covers.openlibrary.org/b/id/10618463-L.jpg","shows_english_title":true},{"title":"The Word for World Is Forest","year":1972,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765324641.jpg","shows_english_title":true},{"title":"The Dispossessed","year":1974,"cover_url":"https://covers.openlibrary.org/b/id/6979680-L.jpg","shows_english_title":true},{"title":"Four Ways to Forgiveness","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/43991-L.jpg","shows_english_title":true},{"title":"The Telling","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/283945-L.jpg","shows_english_title":true}]},{"title":"Citizen of the Galaxy","cover_url":"https://covers.openlibrary.org/b/isbn/9781416505525-L.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1957}]},{"id":"xenanthropology","label":"Xenanthropology","parent":"anthropological-science-fiction","children":[],"image":"175-xenanthropology.webp","definition":"Anthropological science fiction where alien societies are observed without interference; pure xenological fieldwork and the observer’s gaze.","status":"candidate","works":[{"title":"A Mirror for Observers","cover_url":"https://upload.wikimedia.org/wikipedia/en/0/0a/A_Mirror_for_Observers.jpg","shows_english_title":true,"authors":["Edgar Pangborn"],"year":1954},{"title":"Hard to Be a God","cover_url":"https://images.booksense.com/images/282/748/9781613748282.jpg","shows_english_title":true,"authors":["Arkady Strugatsky","Boris Strugatsky"],"year":1964,"placement_note":"The Strugatskys place an Earth historian undercover in Arkanar’s medieval human society, constrained to observe rather than intervene as oppression rises. Cultural observation, estrangement and the observer’s assumptions are the novel’s central problem, making Xenanthropology exact."},{"title":"Pallahaxi","cover_url":"https://files.ekmcdn.com/appleworld/images/hello-summer-goodbye-ebook-by-michael-coney-992-1-p.jpg?w=1000&h=1000&v=52BBA392-EBFA-4691-A32B-E8BDEFE12536","shows_english_title":true,"authors":["Michael G. Coney"],"year":1975,"books":[{"title":"Hello Summer, Goodbye","year":1975,"cover_url":"https://files.ekmcdn.com/appleworld/images/hello-summer-goodbye-ebook-by-michael-coney-992-1-p.jpg?w=1000&h=1000&v=52BBA392-EBFA-4691-A32B-E8BDEFE12536","shows_english_title":true},{"title":"I Remember Pallahaxi","year":2007,"cover_url":"http://lesedwards.com/cdn/shop/products/975693.jpg?v=1648061408"}],"placement_note":"SFE identifies these as the two Pallahaxi novels: adolescent members of a human-like species on a distant planet, followed by the arrival of human colonists. The alien society and ensuing cross-species encounter make Xenanthropology exact."},{"title":"Planet of the Apes","cover_url":"https://covers.openlibrary.org/b/id/8042215-L.jpg","shows_english_title":true,"authors":["Pierre Boulle"],"year":1963,"placement_note":"Xenanthropology with the observer's gaze inverted: astronaut Ulysse Merou is caged and studied by Soror's civilized apes while the reader observes the ape society through his eyes. SFE calls it a witty philosophical tale a la Voltaire whose satirical point is a reversal of the usual Apes-as-Human narrative (see also Devolution). Shelfmates A Mirror for Observers and Hard to Be a God. Original French 'La planete des singes' 1963; English translation 1963."},{"title":"Beautyland","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1529964393.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Marie-Helene Bertino"],"year":2024,"placement_note":"Adina, born as Voyager 1 launches, lives as an alien observer faxing field reports on humanity home; the pure observer's gaze in the Mirror for Observers line."}]},{"id":"first-contact","label":"First Contact","parent":"alien-fiction","children":["alien-expedition","far-future-first-contact","near-future-first-contact"],"works":[],"image":"14-first-contact-fiction.webp","definition":"Futurist alien fiction centered on humanity’s first consequential encounter with extraterrestrial intelligence, whether humans travel outward to meet it or the encounter unfolds during future expansion among the stars.","status":"accepted"},{"id":"near-future-first-contact","label":"Near-future first contact","parent":"first-contact","children":[],"works":[{"title":"Wormwood trilogy","cover_url":"https://covers.openlibrary.org/b/id/14330969-L.jpg","shows_english_title":true,"authors":["Tade Thompson"],"year":2016,"books":[{"title":"Rosewater","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/14330969-L.jpg"}],"placement_note":"Root-down: Science fiction -> Futurist -> Alien fiction -> First Contact -> Near-future first contact. SFE calls Wormwood a First Contact/Invasion sequence set several decades into the near future: an alien macrostructure erupts near Lagos, generates healing portals and a fungal techno-noosphere accessed by sensitives. Alien Expedition fails because humanity does not travel outward; Far-future first contact fails because this is near-future Earth."},{"title":"A Half-Built Garden","cover_url":"https://covers.openlibrary.org/b/isbn/9781250210982-L.jpg","shows_english_title":true,"authors":["Ruthanna Emrys"],"year":2022,"placement_note":"Aliens arrive in 2083 to judge a climate-recovering Earth of watershed communes and dandelion networks: first contact on a near-future, post-collapse Earth."},{"title":"Beyond the Light Horizon","cover_url":"https://images-na.ssl-images-amazon.com/images/P/035651482X.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Ken MacLeod"],"year":2024,"placement_note":"Lightspeed trilogy close: near-future Earth transformed by the Fermi contact and gifted FTL, before any far-future expansion among the stars."}],"definition":"First-contact stories set on near-future Earth, where alien presence transforms a recognizable human world before any far-future expansion among the stars. The label mirrors the review-community phrase near-future first contact and the sibling Far-future first contact.","image":"235-near-future-first-contact.webp","representative_cover":"https://covers.openlibrary.org/b/id/14330969-L.jpg"},{"id":"far-future-first-contact","label":"Far-future first contact","parent":"first-contact","children":[],"works":[{"title":"Blindsight","cover_url":"https://covers.openlibrary.org/b/id/524560-L.jpg","shows_english_title":true,"authors":["Peter Watts"],"year":2006,"books":[{"title":"Blindsight","year":2006,"cover_url":"https://covers.openlibrary.org/b/id/524560-L.jpg"},{"title":"Echopraxia","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/8457790-L.jpg"}]},{"title":"Embassytown","cover_url":"https://images.penguinrandomhouse.com/cover/9780345524508","shows_english_title":true,"authors":["China Miéville"],"year":2011},{"title":"Lilith's Brood","cover_url":"https://covers.openlibrary.org/b/id/6790479-L.jpg","shows_english_title":false,"authors":["Octavia E. Butler"],"year":1987,"books":[{"title":"Dawn","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/285158-L.jpg"},{"title":"Adulthood Rites","year":1988,"cover_url":"https://covers.openlibrary.org/b/id/5307026-L.jpg"},{"title":"Imago","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/8029475-L.jpg"}]},{"title":"Rama","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-rendezvous-with-rama-2-236.jpg","shows_english_title":false,"authors":["Arthur C. Clarke"],"year":1973,"books":[{"title":"Rendezvous with Rama","year":1973,"cover_url":"https://covers.openlibrary.org/b/id/1286944-L.jpg","shows_english_title":true},{"title":"Rama II","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/369123-L.jpg","shows_english_title":true},{"title":"The Garden of Rama","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/11414593-L.jpg","shows_english_title":true},{"title":"Rama Revealed","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/372217-L.jpg","shows_english_title":true}]},{"title":"Solaris","cover_url":"https://covers.openlibrary.org/b/id/12313764-L.jpg","shows_english_title":true,"authors":["Stanisław Lem"],"year":1961},{"title":"The Mote in God's Eye","cover_url":"https://covers.openlibrary.org/b/id/9261060-L.jpg","shows_english_title":true,"authors":["Larry Niven","Jerry Pournelle"],"year":1974,"books":[{"title":"The Mote in God's Eye","year":1974,"cover_url":"https://covers.openlibrary.org/b/id/408133-L.jpg"},{"title":"The Gripping Hand","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/6689695-L.jpg"}]},{"title":"Chercher La Femme","cover_url":"https://www.aqueductpress.com/images/covers/978-1-61976-147-6.jpg","shows_english_title":true,"authors":["L. Timmel Duchamp"],"year":2018,"placement_note":"Aqueduct and Publishers Weekly center a far-future diplomatic mission to retrieve a failed first-contact crew and establish meaningful contact with the humanoid inhabitants of La Femme."}],"image":"56-far-future-first-contact.webp","definition":"First-contact stories set in humanity's far-future expansion among the stars. (Coined label for the four-genre time-axis reorganization.)","status":"provisional"},{"id":"hard-alien","label":"Hard Alien","parent":"alien-fiction","children":[],"image":"83-hard-alien.webp","definition":"New space opera built around genuinely alien beings and hard-edged cosmology - uplifted species, zones of thought, ancient artifacts, alien plagues (Brin's Uplift, Vinge's Zones of Thought, the Expanse's protomolecule, Harrison's Kefahuchi Tract). Gustav-coined label; split 2026-09-14 from new space opera under the ten-work cap.","status":"provisional","works":[{"title":"Uplift","cover_url":"https://covers.openlibrary.org/b/id/13527094-L.jpg","shows_english_title":false,"authors":["David Brin"],"year":1980,"books":[{"title":"Sundiver","year":1980,"authors":["David Brin"],"cover_url":"https://covers.openlibrary.org/b/id/1467048-L.jpg"},{"title":"Startide Rising","year":1983,"cover_url":"https://covers.openlibrary.org/b/isbn/055327418X-L.jpg"},{"title":"The Uplift War","year":1987,"cover_url":"https://covers.openlibrary.org/b/isbn/0932096441-L.jpg"},{"title":"Brightness Reef","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/6817756-L.jpg"},{"title":"Infinity's Shore","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/368017-L.jpg"},{"title":"Heaven's Reach","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/368018-L.jpg"}]},{"title":"A Fire Upon the Deep","cover_url":"https://covers.openlibrary.org/b/id/9261465-L.jpg","shows_english_title":true,"authors":["Vernor Vinge"],"year":1992,"books":[{"title":"A Fire Upon the Deep","year":1992,"authors":["Vernor Vinge"],"cover_url":"https://covers.openlibrary.org/b/id/9261466-L.jpg"},{"title":"A Deepness in the Sky","year":1999},{"title":"The Children of the Sky","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/9348568-L.jpg"}]},{"title":"The Expanse","cover_url":"https://covers.openlibrary.org/b/id/7314237-L.jpg","shows_english_title":true,"authors":["James S. A. Corey"],"year":2011,"books":[{"title":"Leviathan Wakes","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/7314237-L.jpg","shows_english_title":true},{"title":"Caliban's War","year":2012,"cover_url":"https://covers.openlibrary.org/b/id/7314238-L.jpg","shows_english_title":true},{"title":"Abaddon's Gate","year":2013,"cover_url":"https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1653774333i/61183016.jpg","shows_english_title":true},{"title":"Cibola Burn","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/7610576-L.jpg","shows_english_title":true},{"title":"Nemesis Games","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/8036735-L.jpg","shows_english_title":true},{"title":"Babylon's Ashes","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8417833-L.jpg","shows_english_title":true},{"title":"Persepolis Rising","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8402849-L.jpg","shows_english_title":true},{"title":"Tiamat's Wrath","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/8600919-L.jpg","shows_english_title":true},{"title":"Leviathan Falls","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/14424717-L.jpg","shows_english_title":true}]},{"title":"Kefahuchi Tract","cover_url":"https://covers.openlibrary.org/b/id/380152-L.jpg","shows_english_title":false,"authors":["M. John Harrison"],"year":2002,"books":[{"title":"Light","year":2002,"authors":["M. John Harrison"],"cover_url":"https://covers.openlibrary.org/b/id/370096-L.jpg"},{"title":"Nova Swing","year":2006,"cover_url":"https://covers.openlibrary.org/b/id/4673282-L.jpg"},{"title":"Empty Space: A Haunting","year":2012,"cover_url":"https://covers.openlibrary.org/b/id/8737935-L.jpg"}]},{"title":"The Final Architecture","cover_url":"https://covers.openlibrary.org/b/id/11093784-L.jpg","shows_english_title":true,"authors":["Adrian Tchaikovsky"],"year":2021,"placement_note":"The Final Architecture (Locus, PW): moon-sized Architects remake planets and the Intermediaries fight back through unspace. Genuinely alien beings and hard cosmology. Series card: Shards of Earth (2021), Eyes of the Void (2022), Lords of Uncreation (2023).","books":[{"title":"Shards of Earth","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/11093784-L.jpg"},{"title":"Eyes of the Void","year":2022,"cover_url":"https://covers.openlibrary.org/b/id/13195348-L.jpg"},{"title":"Lords of Uncreation","year":2023,"cover_url":"https://covers.openlibrary.org/b/id/14820497-L.jpg"}]}]},{"id":"techno-fiction","label":"Techno Fiction","parent":"future-of-earth-fiction","children":["machine-minds","cyberpunk","technomorphosis"],"works":[],"image":"87-techno-fiction.webp","definition":"Future-of-Earth fiction organized around technologies that remake minds, bodies, networks and social order.","status":"accepted"},{"id":"cyberpunk","label":"Cyberpunk","parent":"techno-fiction","children":["metaverse","litrpg","neural-fiction","postcyberpunk"],"works":[],"image":"8-cyberpunk.webp","definition":"Pure umbrella for futures shaped by invasive network technology: immersive avatar worlds, direct brain-computer interfaces, and postcyberpunk life embedded in pervasive systems.","status":"accepted"},{"id":"metaverse","label":"Metaverse","parent":"cyberpunk","children":[],"works":[{"title":"Snow Crash","cover_url":"https://covers.openlibrary.org/b/id/10514880-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":1992},{"title":"Ready Player One","cover_url":"https://covers.openlibrary.org/b/id/10287476-L.jpg","shows_english_title":true,"authors":["Ernest Cline"],"year":2011,"placement_note":"SFE sets the novel in a degraded near-future where people retreat into the total-immersion OASIS, a Cyberspace-style virtual reality governed by corporate technology and contested through avatars and a world-spanning game. Networked altered reality, an unpleasant social order and control of the platform make Cyberpunk the closest leaf."},{"title":"Alma sequence","cover_url":"https://covers.openlibrary.org/b/id/10856892-L.jpg","shows_english_title":true,"authors":["Adam Roberts"],"year":2017,"books":[{"title":"The Real-Town Murders","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/10856892-L.jpg"},{"title":"By the Pricking of Her Thumb","year":2018,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-by-the-pricking-of-her-thumb-3-12.jpg"}],"placement_note":"SFE defines The Real-Town Murders as near-future noir in a world threatened with immersion into a Virtual Reality maze by a sophisticated Internet and identifies By the Pricking of Her Thumb as its loose sequel with the same detective. Networked virtual reality, concentrated power and street-level investigation make Cyberpunk closest."}],"image":"234-metaverse.webp","definition":"Cyberpunk centered on persistent, shared, immersive virtual worlds inhabited through avatars. Stephenson coined Metaverse in Snow Crash; SFE treats it as a defining virtual-world concept.","status":"accepted"},{"id":"litrpg","label":"LitRPG","parent":"cyberpunk","children":[],"image":"324-litrpg.webp","definition":"Cyberpunk in which game mechanics are the literal laws of the world: levels, stats, loot, classes and respawn govern what characters can do, and the numbers are part of the reading. Sibling test against Metaverse: if the point is the place, it is Metaverse; if the point is the mechanics, it is LitRPG. The term was coined in late 2013 in the Russian scene (EKSMO's LitRPG series).","status":"accepted","works":[{"title":"Dungeon Crawler Carl","cover_url":"https://covers.openlibrary.org/b/id/15143022-L.jpg","shows_english_title":true,"authors":["Matt Dinniman"],"year":2020,"placement_note":"Earth is strip-mined by an alien corporation and rebuilt as an eighteen-level dungeon for an intergalactic reality show; Carl and Princess Donut pick races and classes, earn experience and loot, and level up to survive (Wikipedia; Clarke Award 2026 shortlist). Game mechanics are the world's literal law. Series card: 8 books. Placed by Gustav's 22:16 ruling.","books":[{"title":"Dungeon Crawler Carl","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/15143022-L.jpg"},{"title":"Carl's Doomsday Scenario","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/11702962-L.jpg"},{"title":"The Dungeon Anarchist's Cookbook","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/15233609-L.jpg"},{"title":"The Gate of the Feral Gods","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/15232581-L.jpg"},{"title":"The Butcher's Masquerade","year":2022,"cover_url":"https://covers.openlibrary.org/b/id/15231958-L.jpg"},{"title":"The Eye of the Bedlam Bride","year":2023,"cover_url":"https://covers.openlibrary.org/b/id/15231488-L.jpg"},{"title":"This Inevitable Ruin","year":2024,"cover_url":"https://covers.openlibrary.org/b/id/15142977-L.jpg"},{"title":"A Parade of Horribles","year":2026,"cover_url":"https://covers.openlibrary.org/b/id/15221497-L.jpg"}]}]},{"id":"neural-fiction","label":"Neural fiction","parent":"cyberpunk","children":[],"works":[{"title":"The Sprawl Trilogy","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-count-zero-296.jpg","shows_english_title":false,"authors":["William Gibson"],"year":1984,"books":[{"title":"Neuromancer","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/13838027-L.jpg"},{"title":"Count Zero","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/284322-L.jpg"},{"title":"Mona Lisa Overdrive","year":1988}]},{"title":"Vurt","cover_url":"https://covers.openlibrary.org/b/id/8760605-L.jpg","shows_english_title":true,"authors":["Jeff Noon"],"year":1993,"books":[{"title":"Vurt","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/8226901-L.jpg"},{"title":"Pollen","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/908150-L.jpg"}]},{"title":"All That We See or Seem","cover_url":"https://covers.openlibrary.org/b/id/15135954-L.jpg","shows_english_title":true,"authors":["Ken Liu"],"year":2025,"placement_note":"Near-future thriller in which a hacker enters dreams through dream technology (New Scientist 'cyberpunk thriller'; Locus on dream-technology tales). Brain access is the passage into altered reality."}],"image":"235-neural-fiction.webp","definition":"Cyberpunk in which direct-to-brain access is the central passage into altered reality, regardless of medium: electronic neural decks or biological interfaces such as Vurt feathers. A taxonomy coinage, not an established genre term.","status":"accepted"},{"id":"postcyberpunk","label":"Postcyberpunk","parent":"cyberpunk","children":[],"works":[{"title":"Rainbows End","cover_url":"https://covers.openlibrary.org/b/id/182444-L.jpg","shows_english_title":true,"authors":["Vernor Vinge"],"year":2006,"placement_note":"SFE describes near-future California transformed by pervasive Internet presence, 3D holographic avatars, possible AI and a plot about suppressing a mass mind-control system. Networked altered reality, invasive technology and concentrated control make Cyberpunk the closest leaf."},{"title":"Chosen Spirits","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9789386797810/chosen-spirits-9789386797810_hr.jpg","shows_english_title":true,"authors":["Samit Basu"],"year":2020,"placement_note":"SFE and Simon & Schuster place a Reality Controller amid networked celebrity media, pervasive surveillance, corporate/elite power and precarious lives in near-future Delhi, making Cyberpunk the closest leaf."},{"title":"Infinite Detail","cover_url":"https://s3.amazonaws.com/mcdbookimages/books/cover_images/000/000/118/reg/9780374718602_FC.jpg?1651584877","shows_english_title":true,"authors":["Tim Maughan"],"year":2019,"placement_note":"SFE describes proactive bondage to omnipresent electronic networks and their surveillance, followed by sabotage that destroys the Internet and leaves far-right governments taking over; FSG centers Big Data dependence, corporate hegemony, cyberterrorism and post-network collapse. Networked power and radical outsiders make Cyberpunk the closest engine-level leaf."},{"title":"Stealing Worlds","cover_url":"https://book-assets.openroadmedia.com/9780765399977.jpg","shows_english_title":true,"authors":["Karl Schroeder"],"year":2019,"placement_note":"SFE and Macmillan place it in mid-21st-century America, where pervasive surveillance, smart glasses, VR/LARP worlds, blockchain economies and gamified cooperation reshape social power. It passes Science fiction -> Futurist -> Future of Earth -> Techno-fiction -> Cyberpunk; its socially embedded resistance and institution-building rather than noir alienation make Postcyberpunk closest."},{"id":"this-is-not-the-jess-show","title":"This Is Not the Jess Show","authors":["Anna Carey"],"year":2021,"books":[{"title":"This Is Not the Jess Show","year":2021,"cover_url":"cover-this-is-not-the-jess-show.jpg"},{"title":"This Is Not the Real World","year":2022,"cover_url":"cover-this-is-not-the-real-world.jpg"}],"cover_url":"cover-this-is-not-the-jess-show.jpg"},{"title":"The Jinn-Bot of Shantiport","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250827515.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Samit Basu"],"year":2023,"placement_note":"Aladdin in a sinking far-future city run by a crime clan, full of drones and bots (Reactor, Library Journal)."},{"title":"Extremophile","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1804545848.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Ian Green"],"year":2024,"placement_note":"Near-future cyberpunk: everyday people fight a faceless corporate system (Big Issue, SFBook)."},{"title":"The Ten Percent Thief","cover_url":"https://covers.openlibrary.org/b/id/13302343-L.jpg","shows_english_title":true,"authors":["Lavanya Lakshminarayan"],"year":2023,"placement_note":"Bengaluru is now Apex City, run by Bell Corp: every citizen ranked on a productivity Bell Curve, the top 10% live Virtual, failures deported to the Analog outside - a mosaic of ordinary lives navigating an algorithmic caste order (PW, Fantasy Hive, Grimdark). Postcyberpunk on Person's own criteria: socially embedded protagonists, near-now surveillance and institutional power, no noir alienation ('technology is society'). Gustav ruling 2026-09-24 16:13 'Execute' after the tree walk (Orwellianesque rejected: last-resort leaf, algorithmic caste isn't Orwell's apparatus; Huxleyan rejected: control by ranking/deportation, not consent engineering). Clarke 2024 shortlist; first published India 2020 as Analog/Virtual."},{"title":"A Philosophy of Thieves","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1645661946.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Fran Wilde"],"year":2025,"placement_note":"Near-future stratified society where heists are engineered against the system from inside it: postcyberpunk caper with body tech and class warfare."}],"image":"236-postcyberpunk.webp","definition":"Cyberpunk technology without classic noir alienation: socially embedded protagonists confront near-now networks, surveillance, augmented reality and institutional power. Term attested by Lawrence Person’s 1998 Notes Toward a Postcyberpunk Manifesto.","status":"accepted"},{"id":"technomorphosis","label":"Technomorphosis","parent":"techno-fiction","children":["posthuman","post-society"],"works":[],"image":"126-technomorphosis.webp","definition":"Umbrella for fiction in which technology ceases to be a discrete tool and transforms either human embodiment and identity or the organization of collective life.","status":"accepted"},{"id":"posthuman","label":"Posthuman","parent":"technomorphosis","children":["remade-bodies","remade-minds"],"works":[],"image":"179-posthuman.webp","definition":"Technomorphosis centered on transformed bodies, minds, selves or species: technology and engineered systems change what a human being is, divided between remade bodies and remade minds.","status":"accepted"},{"id":"post-society","label":"Post-society","parent":"technomorphosis","children":[],"works":[{"title":"The Diamond Age","cover_url":"https://covers.openlibrary.org/b/id/12749400-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":1995},{"title":"The Dervish House","cover_url":"https://covers.openlibrary.org/b/id/8777419-L.jpg","shows_english_title":true,"authors":["Ian McDonald"],"year":2010},{"title":"Air (Or, Have Not Have)","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-air-26.jpg","shows_english_title":true,"authors":["Geoff Ryman"],"year":2004,"placement_note":"SFE describes Air as networked information technology that embeds itself in Mae until she in a sense becomes Air, forcing her to guide a traditional village into a transformed world. Hachette likewise centers the technology, information overload and social change. Technology merging with mind and reorganizing community makes Technomorphosis closest."},{"title":"Anthropocene Rag","cover_url":"https://mpd-biblio-covers.imgix.net/9781250269270.jpg","shows_english_title":true,"authors":["Alex Irvine"],"year":2020},{"title":"CatNet","cover_url":"https://covers.openlibrary.org/b/id/10104877-L.jpg","shows_english_title":true,"authors":["Naomi Kritzer"],"year":2019,"books":[{"title":"Catfishing on CatNet","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10104877-L.jpg"},{"title":"Chaos on CatNet","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250165213.jpg"}],"placement_note":"SFE identifies the same benevolent emergent AI across both novels. Publisher sources center a sentient AI administering an ordinary social network, then a rival AI hacking networks to trigger real-world violence. Technology reorganizing friendship, mutual aid, privacy and everyday social life makes Technomorphosis closest."},{"title":"Little Eyes","cover_url":"https://images3.penguinrandomhouse.com/smedia/9780525541370","shows_english_title":true,"authors":["Samanta Schweblin"],"year":2018,"placement_note":"SFE sets the novel across a near-future Earth shaped by kentukis: remote-controlled animal-like devices whose anonymous users inhabit owners’ lives, producing a commodified media landscape. Oneworld centers their worldwide infiltration and the social effects of anonymous technological connection. Technology reorganizing intimacy, privacy and shared life makes Post-society exact."},{"id":"waste-tide","title":"Waste Tide","authors":["Chen Qiufan"],"year":2013,"cover_url":"cover-waste-tide.jpg","shows_english_title":true,"books":[{"title":"Waste Tide","year":2013,"cover_url":"cover-waste-tide.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Post-society. The Verge and Kirkus set it on near-future Silicon Isle, where the e-waste trade organizes native clans, migrant 'waste people' and a foreign recycling venture into class war; Mimi's transformation is one strand of that shared order. Technology remaking a community, class system and landscape governs."}],"image":"180-post-society.webp","definition":"Technomorphosis centered on transformed collectives, classes, communities or landscapes: technology changes how shared life is organized.","status":"accepted"},{"id":"future-war","label":"Future War","parent":"future-of-earth-fiction","children":[],"works":[{"title":"Rogue Sequence","cover_url":"https://mpd-biblio-covers.imgix.net/9781250322432.jpg","shows_english_title":true,"authors":["Zac Topping"],"year":2025},{"id":"war-girls","title":"War Girls","authors":["Tochi Onyebuchi"],"year":2019,"cover_url":"cover-war-girls.jpg","shows_english_title":true,"books":[{"title":"War Girls","year":2019,"cover_url":"cover-war-girls.jpg"},{"title":"Rebel Sisters","year":2020,"cover_url":"cover-rebel-sisters.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future War. SFE sets the sequence in a Near Future Nigeria devastated by Climate Change; NYT, Kirkus and Black Gate center a reimagined Nigerian civil war in 2172 fought by augmented child soldiers and giant mechs. Technology-transformed war on Earth governs over the climate backdrop. Complete duology."}],"image":"123-earthbound-military-sf.webp","definition":"War transformed by technology and fought on Earth. Near-future and modern entries are included; Earthbound conflict remains the core.","status":"accepted"},{"id":"future-history-of-earth","label":"Future history of Earth","parent":"future-of-earth-fiction","children":[],"works":[{"title":"Journey Beyond Tomorrow","cover_url":"https://covers.openlibrary.org/b/id/6979228-L.jpg","shows_english_title":true,"authors":["Robert Sheckley"],"year":1962,"placement_note":"SFE frames its near-future satire a millennium later as garbled founding myths explaining ruined Earth. That retrospective construction of Earth history makes Future history of Earth closest."},{"title":"City","cover_url":"https://covers.openlibrary.org/b/id/15219495-L.jpg","shows_english_title":true,"authors":["Clifford D. Simak"],"year":1952},{"title":"Last and First Men","cover_url":"https://covers.openlibrary.org/b/id/911106-L.jpg","shows_english_title":true,"authors":["Olaf Stapledon"],"year":1930},{"title":"Bold as Love","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-bold-as-love-2-30.jpg?w=436","shows_english_title":true,"authors":["Gwyneth Jones"],"year":2001,"books":[{"title":"Bold as Love","year":2001,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-bold-as-love-2-30.jpg?w=436"},{"title":"Castles Made of Sand","year":2002,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2020/07/hbg-title-castles-made-of-sand-20.jpg?w=440"},{"title":"Midnight Lamp","year":2003,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/02/hbg-title-midnight-lamp-11.jpg?w=440"},{"title":"Band of Gypsys","year":2005,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/02/hbg-title-band-of-gypsys-11.jpg?w=438"},{"title":"Rainbow Bridge","year":2006,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/02/hbg-title-rainbow-bridge-11.jpg?w=439"}]},{"title":"The Old Drift","cover_url":"cover-the-old-drift.jpg","shows_english_title":true,"authors":["Namwali Serpell"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future history of Earth. Penguin and Serpell trace three Zambian families and the nation from 1904 through the present and beyond into Afronauts, microdrones, viral vaccines, embedded Beads and state surveillance. The sustained course of Earthbound society across generations governs."},{"title":"The Walking Shadow","cover_url":"https://covers.openlibrary.org/b/id/8055506-L.jpg","shows_english_title":true,"authors":["Brian Stableford"],"year":1979,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Future history of Earth. Spontaneous jumps carry humanity across a sustained billion-year course of war, alien reshaping and Earthly evolution; the future history governs over the mechanism."}],"image":"124-future-history-of-earth.webp","definition":"Works tracing a sustained future course of Earth and Earthbound humanity.","status":"accepted"},{"id":"hard-conceptual-sf","label":"Hard Conceptual SF","parent":"hard-sf","children":[],"works":[{"title":"Inverted World","year":1974,"authors":["Christopher Priest"],"cover_url":"https://covers.openlibrary.org/b/id/2950338-L.jpg","shows_english_title":true,"placement_note":"SFE Priest calls it a major pure-SF novel whose hyperboloid world, hard-SF time distortion, and pocket-universe geometry drive the conceptual breakthrough. Its mathematical topology is the engine, so Mathematics is the exact existing leaf."},{"title":"Observer","cover_url":"https://cdn.waterstones.com/bookjackets/large/9781/2503/9781250376466.jpg","shows_english_title":true,"authors":["Robert Lanza","Nancy Kress"],"year":2023},{"title":"Brain Wave","cover_url":"https://book-assets.openroadmedia.com/9781504053679.jpg","shows_english_title":true,"authors":["Poul Anderson"],"year":1954},{"title":"Exhalation","cover_url":"https://covers.openlibrary.org/b/id/8793546-L.jpg","shows_english_title":true,"authors":["Ted Chiang"],"year":2019,"placement_note":"Penguin Random House describes nine idea-driven stories tackling humanity's oldest questions and new quandaries; SFE emphasizes Chiang's formal intellectual control across time, artificial intelligence, entropy and free will. The rigorous thought-experiment is the common engine, making Hard Conceptual SF the closest leaf."},{"title":"Galaxies","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/11/hbg-title-galaxies-10.jpg","shows_english_title":true,"authors":["Barry N. Malzberg"],"year":1975,"placement_note":"SFE describes a corpse-laden ship falling into a galaxy-sized black hole and the novel's self-conscious critique of SF; Anti-Oedipus calls it metafictional and absurdist, entwining technology, cyborgs, bureaucracy and tachyons. Its rigorous recursion between impossible cosmic premise and the act of writing it makes Hard Conceptual SF closest."},{"title":"Stories of Your Life and Others","cover_url":"https://images1.penguinrandomhouse.com/cover/9781101972120","shows_english_title":true,"authors":["Ted Chiang"],"year":2002,"placement_note":"SFE calls this one of the field’s most remarkable collections and emphasizes lucid cognitive rigor across topology, mathematics, linguistics, time, intelligence, golems and theological world-models; Pan Macmillan describes scientific rationalism across eight diverse stories. The shared engine is the rigorous thought experiment, making Hard Conceptual SF closest despite some fantasy cosmologies."},{"title":"Tau Zero","cover_url":"https://book-assets.openroadmedia.com/9781504053709.jpg","shows_english_title":true,"authors":["Poul Anderson"],"year":1970,"placement_note":"SFE calls its cosmological thought experiment strikingly conceived: a damaged relativistic starship accelerates through galaxies, the universe’s contraction and a new Big Bang. Open Road details real relativity, time dilation and a non-FTL Bussard voyage. The rigorous conceptual model of physics and cosmology governs, making Hard Conceptual SF exact."},{"title":"The Gods Themselves","cover_url":"cover-the-gods-themselves.jpg","shows_english_title":true,"authors":["Isaac Asimov"],"year":1972,"placement_note":"PRH and Hachette ground the Electron Pump as matter exchange with a parallel universe governed by different physical laws; the imbalance will drive the Sun to explode. The rigorous cross-universe energy model and its physical consequence govern over the alien-contact plot."},{"title":"There Is No Antimemetics Division","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1529953170.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["qntm"],"year":2025,"placement_note":"A secret unit fights antimemes, ideas that erase themselves from memory; the rules of the concept drive the story (Locus)."}],"image":"89-mathematics.webp","definition":"Hard science fiction built around a rigorous conceptual world-model whose recognition drives the story.","status":"accepted"},{"id":"military-science-fiction","label":"Military science fiction","parent":"spacefaring-fiction","children":["ground-pounders","space-navy","space-academy","space-command"],"works":[],"image":"17-military-science-fiction.webp","definition":"Military science fiction across every warfare mode: the infantry's mud, the navy's ship, the academy's formation and the command's campaign. Umbrella since 2026-09-25: split-with-umbrella into Ground-pounders, Space Navy, Space Academy and Space Command by warfare mode (Gustav ruling phonemsg-01M3CEG3ECB1QSW6TRRV8KAFX6).","status":"accepted"},{"id":"ground-pounders","label":"Ground-pounders","parent":"military-science-fiction","children":[],"works":[{"title":"Starship Troopers","cover_url":"https://www.orionbooks.co.uk/wp-content/uploads/2018/07/hbg-title-starship-troopers-167.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1959},{"title":"The Forever War","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-the-forever-war-2-178.jpg","shows_english_title":true,"authors":["Joe Haldeman"],"year":1974,"books":[{"title":"The Forever War","year":1974,"cover_url":"https://covers.openlibrary.org/b/id/10693768-L.jpg"},{"title":"Forever Free","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/283818-L.jpg"}]},{"title":"Old Man's War","cover_url":"https://ik.imagekit.io/panmac/tr:di-placeholder_portrait_aMjPtD9YZ.jpg,tr:w-350,f-jpg,pr-true/edition/9780330538169.jpg","shows_english_title":true,"authors":["John Scalzi"],"year":2005,"books":[{"title":"Old Man's War","year":2005,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765309402-L.jpg"},{"title":"The Ghost Brigades","year":2006,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765315021-L.jpg"},{"title":"The Last Colony","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/10376230-L.jpg"},{"title":"Zoe's Tale","year":2008,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765356192-L.jpg"},{"title":"The Human Division","year":2013,"cover_url":"https://www.publishersweekly.com/cover/9780765333513"},{"title":"The End of All Things","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/10317952-L.jpg"},{"title":"The Shattering Peace","year":2025,"cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250348447.01.LZZZZZZZ.jpg"}]},{"title":"The Light Brigade","cover_url":"cover-the-light-brigade.jpg","shows_english_title":true,"authors":["Kameron Hurley"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist ->

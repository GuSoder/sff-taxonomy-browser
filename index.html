"id":"apocalyptic-fiction","label":"Apocalyptic fiction","parent":"modern-day","children":["chemical-catastrophe","climate-catastrophe","cosmic-catastrophe","pandemic","unknown-catastrophe"],"image":"34-apocalyptic-fiction.webp","definition":"Tales of the catastrophe as it unfolds - the end of the world in progress (SFE 'Apocalypse' theme). Split 2026-09-13 from apocalyptic and post-apocalyptic fiction; became an umbrella 2026-09-14 over the five catastrophe leaves on Gustav's directive.","status":"candidate","works":[]},{"id":"chemical-catastrophe","label":"Chemical Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"77-chemical-catastrophe.webp","definition":"The world ends through chemistry or matter itself - a new form of ice freezing the oceans, crystallization consuming the world. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"Cat's Cradle","cover_url":"https://covers.openlibrary.org/b/id/14572638-L.jpg","shows_english_title":true,"authors":["Kurt Vonnegut"],"year":1963},{"title":"The Crystal World","cover_url":"https://covers.openlibrary.org/b/id/8443804-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1966}]},{"id":"climate-catastrophe","label":"Climate Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"79-climate-catastrophe.webp","definition":"The climate itself turns against civilization - drowned tropical cities, an America unravelling under ecological collapse. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"The Drowned World","cover_url":"https://covers.openlibrary.org/b/id/15143833-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1962},{"title":"Parable","cover_url":"https://images.penguinrandomhouse.com/cover/9781609807191","shows_english_title":false,"authors":["Octavia E. Butler"],"year":1993,"books":[{"title":"Parable of the Sower","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/10466266-L.jpg"},{"title":"Parable of the Talents","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/12384358-L.jpg"}]},{"title":"A Children's Bible","cover_url":"https://covers.openlibrary.org/b/id/9426320-L.jpg","shows_english_title":true,"authors":["Lydia Millet"],"year":2020},{"id":"theory-of-bastards","title":"Theory of Bastards","authors":["Audrey Schulman"],"year":2018,"books":[{"title":"Theory of Bastards","year":2018,"cover_url":"cover-theory-of-bastards.jpg"}],"cover_url":"cover-theory-of-bastards.jpg"},{"title":"Private Rites","cover_url":"https://covers.openlibrary.org/b/id/14802955-L.jpg","shows_english_title":true,"authors":["Julia Armfield"],"year":2024,"placement_note":"King Lear retold in a near-future London where the rain never stops, infrastructure has collapsed and the end of the world draws near (NYT, PW, Guardian)."},{"title":"The Coral Bones","cover_url":"https://covers.openlibrary.org/b/id/14539443-L.jpg","shows_english_title":true,"authors":["E. J. Swift"],"year":2022,"placement_note":"Three women across past, present and future watch the Great Barrier Reef die and the climate turn (The Blurb, Salon Futura; Clarke finalist)."},{"title":"Awake in the Floating City","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0593701402.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Susanna Kwan"],"year":2025,"placement_note":"Near-future San Francisco drowned by endless rain; the climate itself turns against the city, elegiac rather than dystopian conflict."}]},{"id":"cosmic-catastrophe","label":"Cosmic Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"78-cosmic-catastrophe.webp","definition":"Disaster falls from the sky - the Moon shatters and its debris begins to rain down. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"Seveneves","cover_url":"https://images.isbndb.com/covers/3108233482210.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2015},{"title":"Lucifer's Hammer","cover_url":"https://images2.penguinrandomhouse.com/smedia/9780449208137","shows_english_title":true,"authors":["Larry Niven","Jerry Pournelle"],"year":1977,"placement_note":"SFE calls it a Disaster novel whose carefully worked-out comet impact and aftermath are central; Penguin Random House describes the comet strike, earthquakes, tidal waves, ice age and civilization’s end. Disaster literally falling from the sky makes Cosmic Catastrophe exact."},{"title":"The End of the World News","cover_url":"274-the-end-of-the-world-news.jpg","shows_english_title":true,"authors":["Anthony Burgess"],"year":1982,"placement_note":"SFE grounds three filmed/intercut narratives whose future frame escapes Earth just before a wandering planet destroys it. Freud/Trotsky pastiches supply the fabular form; the active extrasolar collision makes Cosmic catastrophe the governing speculative engine."},{"title":"The Wanderer","cover_url":"cover-the-wanderer.jpg","shows_english_title":true,"authors":["Fritz Leiber"],"year":1964,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Apocalyptic fiction -> Cosmic Catastrophe. An artificial world-ship destroys the Moon and causes worldwide tidal and seismic disaster as the catastrophe unfolds."}]},{"id":"pandemic","label":"Pandemic","parent":"apocalyptic-fiction","children":["zombie-apocalypse","mystery-plague","die-off"],"image":"80-pandemic.webp","definition":"Civilization ends by plague - superflu, zombie outbreak, engineered virus. Coined by Gustav 2026-09-14; not an SFE/EoF headword. Umbrella since 2026-09-25: split-with-umbrella into Zombie apocalypse, Mystery plague and The Die-off by plague mode (Gustav ruling phonemsg-01M3D543ZBP2R9WMQH420W2D1P).","status":"provisional","works":[]},{"id":"zombie-apocalypse","label":"Zombie apocalypse","parent":"pandemic","children":[],"works":[{"title":"World War Z","cover_url":"https://images.penguinrandomhouse.com/cover/9780307346612","shows_english_title":true,"authors":["Max Brooks"],"year":2006},{"title":"Survivor Song","cover_url":"https://www.harpercollins.com/cdn/shop/files/9780062679161_bb750afa-894a-497b-b8d0-fee01ecabef4_1200x1200.jpg?v=1781187244","shows_english_title":true,"authors":["Paul Tremblay"],"year":2020,"placement_note":"SFE explicitly identifies a near-future zombie-creating pandemic; the publisher synopsis grounds a rabies-like saliva virus overrunning Massachusetts, collapsing hospitals and emergency protocols while an infected pregnant woman races for a vaccine. Biological outbreak and systemic collapse make Pandemic exact."},{"title":"Severance","cover_url":"https://mpd-biblio-covers.imgix.net/9781250214997.jpg","shows_english_title":true,"authors":["Ling Ma"],"year":2018,"placement_note":"Macmillan centers Shen Fever spreading while New York companies and transit cease and Candace joins a survivor group; the plague-driven collapse in progress makes Pandemic closest."}],"image":"358-zombie-apocalypse.webp","definition":"Pandemic fiction in which the plague turns people: the infected, the risen dead, the fevered - the monster is the victim. Split 2026-09-25 from Pandemic (Gustav ruling).","status":"accepted"},{"id":"mystery-plague","label":"Mystery plague","parent":"pandemic","children":[],"works":[{"title":"Blindness","cover_url":"https://covers.openlibrary.org/b/id/115428-L.jpg","shows_english_title":true,"authors":["José Saramago"],"year":1995},{"title":"The Migration","cover_url":"cover-the-migration.jpg","shows_english_title":true,"authors":["Helen Marshall"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Apocalyptic fiction -> Pandemic. Penguin Random House and Marshall center a mysterious immune disorder afflicting young people as mortality rises and the dead begin moving again. Storms and flooding intensify the crisis, but epidemic death, treatment and uncanny return govern the catastrophe in progress."},{"title":"Animals","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1914953959.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Geoff Ryman"],"year":2025,"placement_note":"A transformative epidemic with a pseudo-scientific rationale engulfs an Oxfordshire village; horror in tone but plague-driven like the leaf's zombie-outbreak entries."}],"image":"359-mystery-plague.webp","definition":"Pandemic fiction of the inexplicable affliction: an epidemic with no certain cause or nature, the collapse unfolding under a mystery. Split 2026-09-25 from Pandemic (Gustav ruling).","status":"accepted"},{"id":"die-off","label":"The Die-off","parent":"pandemic","children":[],"works":[{"title":"The Stand","cover_url":"https://covers.openlibrary.org/b/id/14914282-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1978},{"id":"wanderers","title":"Wanderers","authors":["Chuck Wendig"],"year":2019,"cover_url":"cover-wanderers.jpg","shows_english_title":true,"books":[{"title":"Wanderers","year":2019,"cover_url":"cover-wanderers.jpg"},{"title":"Wayward","year":2022,"cover_url":"cover-wayward.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Apocalyptic fiction -> Pandemic. SFE calls Wanderers a Near Future tale of the immediate aftermath of a planetary Disaster; NPR and Kirkus center a plague of sleepwalkers and the fungal pandemic that kills most of humanity while a recognizable America tears itself apart. The end of the world by plague, in progress, governs. Two published books; not treated as complete."},{"title":"MaddAddam","cover_url":"https://images.penguinrandomhouse.com/cover/9780385721677","shows_english_title":false,"authors":["Margaret Atwood"],"year":2003,"books":[{"title":"Oryx and Crake","year":2003},{"title":"The Year of the Flood","year":2009,"cover_url":"https://covers.openlibrary.org/b/id/12816870-L.jpg"},{"title":"MaddAddam","year":2013}]}],"image":"360-die-off.webp","definition":"Pandemic fiction of the mass dying and the world after: most of humanity dies in one short span and the survivors inherit the emptied world. Split 2026-09-25 from Pandemic (Gustav ruling).","status":"accepted"},{"id":"unknown-catastrophe","label":"Unknown Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"81-unknown-catastrophe.webp","definition":"The catastrophe has no name - a green flash blinds the world and nobody proves why, a city is cut off under a changed sky with no cause ever given. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"Dhalgren","cover_url":"https://covers.openlibrary.org/b/id/9590542-L.jpg","shows_english_title":true,"authors":["Samuel R. Delany"],"year":1975},{"title":"The Day of the Triffids","cover_url":"https://covers.openlibrary.org/b/id/380101-L.jpg","shows_english_title":true,"authors":["John Wyndham"],"year":1951},{"title":"Girlfriend in a Coma","cover_url":"https://covers.openlibrary.org/b/isbn/9780060987329-L.jpg","shows_english_title":true,"authors":["Douglas Coupland"],"year":1998,"placement_note":"The Guardian describes Karen’s prophetic coma and awakening before the world abruptly ends; reviews identify the apocalypse and a guiding ghost. With no defined material cause for the sudden extinction event, Unknown Catastrophe is the closest existing leaf."}]},{"id":"science-fantasy","label":"Science fantasy","parent":"atemporal","children":["hard-science-fantasy","planetary-romance","old-mars","ozymandian-tech"],"image":"39-science-fantasy.webp","definition":"Umbrella for atemporal science fantasy: fantasy surfaces built on scientific engines. Atemporal by construction - keeping known physics intact while making the world read as fantasy requires exile from our usable timeline into invented worlds or unplaceable futures.","status":"candidate","works":[]},{"id":"hard-science-fantasy","label":"Hard science fantasy","parent":"science-fantasy","children":[],"works":[{"title":"Jack of Shadows","cover_url":"https://covers.openlibrary.org/b/id/7029508-L.jpg","shows_english_title":true,"authors":["Roger Zelazny"],"year":1971,"placement_note":"SFE says its tidally locked Earth divides fantasy-governed night from science-governed day, making imaginative use of Technofantasy. The magic/science opposition rests on planetary mechanics, fitting Hard science fantasy."},{"title":"Lord of Light","cover_url":"https://covers.openlibrary.org/b/id/8762437-L.jpg","shows_english_title":true,"authors":["Roger Zelazny"],"year":1967},{"title":"Riverworld","cover_url":"https://covers.openlibrary.org/b/id/13125240-L.jpg","shows_english_title":false,"authors":["Philip José Farmer"],"year":1971,"books":[{"title":"To Your Scattered Bodies Go","year":1971,"cover_url":"https://covers.openlibrary.org/b/id/209084-L.jpg","shows_english_title":true},{"title":"The Fabulous Riverboat","year":1971,"cover_url":"https://covers.openlibrary.org/b/id/10157678-L.jpg","shows_english_title":true},{"title":"The Dark Design","year":1977,"cover_url":"https://covers.openlibrary.org/b/id/209086-L.jpg","shows_english_title":true},{"title":"The Magic Labyrinth","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/10180421-L.jpg","shows_english_title":true},{"title":"Gods of Riverworld","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/9492508-L.jpg","shows_english_title":true}]},{"title":"City Under the Stars","cover_url":"https://covers.openlibrary.org/b/isbn/9781250756589-L.jpg","shows_english_title":true,"authors":["Gardner Dozois","Michael Swanwick"],"year":2020},{"title":"The Siege of Burning Grass","cover_url":"cover-the-siege-of-burning-grass.jpg","shows_english_title":true,"authors":["Premee Mohamed"],"year":2024,"placement_note":"Pacifist Alefret, jailed and tortured by his own warring nation Varkal, is sent with fanatical soldier Qhudur to infiltrate the enemy's floating capital: healing wasps, tank-pillbugs, trained pteranodons, a camp in a giant skeleton (Reactor, Locus/Brookins, Ancillary). Reviewers split SF/Fantasy shelving; late in the book the world is admitted to be a lost colony - descendants of (presumably) Earth colonists, the floating cities plausibly repurposed colony-ship tech (Redheaded Femme; The Blurb calls it a 'rational explanation' of the world's history). No magic anywhere: fantasy surface, technology engine - the masquerade pattern. Locus Award 2025 + Locus Rec Fantasy. Placed by Gustav's 2026-09-24 13:28 ruling ('*wanted hard science fantasy*'): the hidden lost-Earth-colony reveal is what the leaf was built for, while Earthborn's cards are all open-origin books."},{"title":"The Wings Upon Her Back","cover_url":"https://covers.openlibrary.org/b/id/14744077-L.jpg","shows_english_title":true,"authors":["Samantha Mills"],"year":2024,"placement_note":"Radezhda, a tower city built around portals to five sleeping gods whose boons were technology; Zenya joins the militaristic mecha sect and earns 'mechanical wings that connect to ports surgically opened in her back' (Kirkus); decades later, stripped of them, she joins the resistance against her abusive mentor Vodaya. Wolfe (Locus): in-text scholars 'speculate that these may not be gods at all, but visitors of some sort' - the book keeps 'genre equipoise'. Gustav ruling 2026-09-24 16:38: 'the visitor notes opens up the whole sci fan branch and the author goes through lengths to fit fantasy elements like wings in a scientific setting (surgery etc). So hard science fantasy may be executed.' Mythological branch ruled out by him (invented pantheon, mythology kept light). WFA 2025 nominee."}],"image":"167-hard-science-fantasy.webp","definition":"Science fantasy whose surface reads as fantasy but whose engine is technology and known physics holds: no faster-than-light travel and no teleportation.","status":"accepted"},{"id":"planetary-romance","label":"Planetary romance","parent":"science-fantasy","children":[],"works":[{"title":"The Dragonriders of Pern","cover_url":"https://covers.openlibrary.org/b/id/9289913-L.jpg","shows_english_title":true,"authors":["Anne McCaffrey"],"year":1968,"books":[{"title":"Dragonflight","year":1968,"cover_url":"https://covers.openlibrary.org/b/id/10306696-L.jpg","shows_english_title":true},{"title":"Dragonquest","year":1971,"cover_url":"https://covers.openlibrary.org/b/id/12077053-L.jpg","shows_english_title":true},{"title":"The White Dragon","year":1978,"cover_url":"https://covers.openlibrary.org/b/id/207388-L.jpg","shows_english_title":true},{"title":"Dragondrums","year":1979,"cover_url":"https://covers.openlibrary.org/b/id/11882293-L.jpg","shows_english_title":true},{"title":"Moreta: Dragonlady of Pern","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/206957-L.jpg","shows_english_title":true},{"title":"Nerilka's Story","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/5921330-L.jpg","shows_english_title":true},{"title":"Dragonsdawn","year":1988,"cover_url":"https://covers.openlibrary.org/b/isbn/9780345362551-L.jpg","shows_english_title":true},{"title":"The Renegades of Pern","year":1989,"cover_url":"https://archive.org/download/renegadesofpern0000anne/page/cover.jpg","shows_english_title":true},{"title":"All the Weyrs of Pern","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/5921258-L.jpg","shows_english_title":true},{"title":"The Chronicles of Pern: First Fall","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/366221-L.jpg","shows_english_title":true},{"title":"The Dolphins of Pern","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/538388-L.jpg","shows_english_title":true},{"title":"The Masterharper of Pern","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/208173-L.jpg","shows_english_title":true},{"title":"The Skies of Pern","year":2001,"cover_url":"https://covers.openlibrary.org/b/isbn/9780345434685-L.jpg","shows_english_title":true}]},{"title":"Majipoor","year":1980,"authors":["Robert Silverberg"],"cover_url":"https://archive.org/download/lordvalentinesca0000robe/page/cover.jpg","shows_english_title":true,"books":[{"title":"Lord Valentine's Castle","year":1980,"authors":["Robert Silverberg"],"cover_url":"https://archive.org/download/lordvalentinesca0000robe/page/cover.jpg","shows_english_title":true},{"title":"Majipoor Chronicles","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/44160-L.jpg","shows_english_title":true},{"title":"Valentine Pontifex","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/13124076-L.jpg","shows_english_title":true},{"title":"The Mountains of Majipoor","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/372435-L.jpg","shows_english_title":true},{"title":"Sorcerers of Majipoor","year":1997,"cover_url":"https://covers.openlibrary.org/b/id/44010-L.jpg","shows_english_title":true},{"title":"Lord Prestimion","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/3203662-L.jpg","shows_english_title":true},{"title":"The King of Dreams","year":2001,"cover_url":"https://covers.openlibrary.org/b/id/1054-L.jpg","shows_english_title":true},{"title":"Tales of Majipoor","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/7535834-L.jpg","shows_english_title":true}],"placement_note":"SFE calls Lord Valentine’s Castle a luxuriant Planetary Romance and explicitly cross-references Science Fantasy; Majipoor’s giant alien world blends planetary SF with fantasy modes."},{"title":"Aetherbound","cover_url":"https://covers.openlibrary.org/b/id/10840472-L.jpg","shows_english_title":true,"authors":["E. K. Johnston"],"year":2021,"placement_note":"SFE says the novel equipoises Space Opera and magic: Pendt is a gene mage escaping an interstellar freighter into rebellion on a space habitat. Penguin likewise centers her genetic mutation and escape aboard a long-haul space cruiser. Its explicit magic-and-space blend makes Science fantasy the closest current leaf."},{"title":"Northwest Smith","cover_url":"https://covers.openlibrary.org/b/id/8761043-L.jpg","shows_english_title":true,"authors":["C. L. Moore"],"year":1933,"placement_note":"SFE (entry moore_c_l): from Shambleau (Weird Tales 1933), a psychic-vampire tale set on a Planetary Romance version of Mars, Moore chronicled Northwest Smith, a Western-model adventurer across a weird-fantasy solar system. SFE's explicit Planetary Romance tag and the fantasy furniture on alien worlds place it here rather than in the space-opera leaves."},{"title":"The Space Trilogy","cover_url":"https://covers.openlibrary.org/b/id/8445245-L.jpg","shows_english_title":true,"authors":["C. S. Lewis"],"year":1938,"placement_note":"SFE (lewis_c_s) names the Ransom sequence Lewis's primary contribution to SF; SFE planetary_romance covers tales whose venue is an alien planet and whose plot turns on its nature - Ransom is taken by spaceship to Malacandra (Mars) and the story turns on its peoples and cosmic order. Shelfmates: Pern, Majipoor. Series conversion 2026-09-23 (#876): HarperCollins names the three Ransom books as the Space Trilogy. Note: book 3 is Earth-set; series placement kept from the book-1 card.","books":[{"title":"Out of the Silent Planet","year":1938,"cover_url":"https://covers.openlibrary.org/b/id/8445245-L.jpg"},{"title":"Perelandra","year":1943,"cover_url":"https://covers.openlibrary.org/b/id/9186044-L.jpg"},{"title":"That Hideous Strength","year":1945,"cover_url":"https://covers.openlibrary.org/b/id/9184879-L.jpg"}]},{"title":"The Sword of Rhiannon","cover_url":"cover-the-sword-of-rhiannon.jpg","shows_english_title":true,"authors":["Leigh Brackett"],"year":1949,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Science fantasy -> Planetary romance. SFE calls it a Mars novel that combines adventure with a strongly romantic vision of a deeply ancient Martian civilization; the exotic planet supplies fantasy-like sweep without actual magic."},{"id":"war-of-the-maps","title":"War of the Maps","authors":["Paul McAuley"],"year":2020,"cover_url":"cover-war-of-the-maps.jpg","shows_english_title":true,"books":[{"title":"War of the Maps","year":2020,"cover_url":"cover-war-of-the-maps.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Science fantasy -> Planetary romance. SFE calls it a fantastic journey across the outer surface of a Dyson Sphere, with genetically engineered 'maps' as domains; Locus places it in the ancient-far-future Vance/Wolfe tradition. A lawman's manhunt across a giant artificial habitat with fantasy sweep governs."}],"image":"168-planetary-romance.webp","definition":"Science fantasy organized around adventure on an exotic alien world or habitat, where the setting carries the sweep and furniture of fantasy without meeting the Hard science fantasy bar.","status":"accepted"},{"id":"old-mars","label":"Old Mars","parent":"science-fantasy","children":[],"works":[{"title":"Barsoom","cover_url":"https://covers.openlibrary.org/b/id/11481174-L.jpg","shows_english_title":true,"authors":["Edgar Rice Burroughs"],"year":1917,"books":[{"title":"A Princess of Mars","year":1917,"cover_url":"https://archive.org/download/princessofmars0000edga_b7c1/page/cover.jpg","shows_english_title":true},{"title":"The Gods of Mars","year":1918,"cover_url":"https://archive.org/download/godofmars0000unse/page/cover.jpg","shows_english_title":true},{"title":"The Warlord of Mars","year":1919,"cover_url":"https://archive.org/download/warlordofmars0000edga_y3z3/page/cover.jpg","shows_english_title":true},{"title":"Thuvia, Maid of Mars","year":1920,"cover_url":"https://archive.org/download/thuviamaidofmars00edga/page/cover.jpg","shows_english_title":true},{"title":"The Chessmen of Mars","year":1922,"cover_url":"https://archive.org/download/chessmenofmars0000edga_e5d9/page/cover.jpg","shows_english_title":true},{"title":"The Master Mind of Mars","year":1928,"cover_url":"https://archive.org/download/mastermindofmars0000edga/page/cover.jpg","shows_english_title":true},{"title":"A Fighting Man of Mars","year":1930,"cover_url":"https://archive.org/download/fightingmanofmar0000edga_h4r5/page/cover.jpg","shows_english_title":true},{"title":"Swords of Mars","year":1936,"cover_url":"https://archive.org/download/swordsofmars0000edga/page/cover.jpg","shows_english_title":true},{"title":"Synthetic Men of Mars","year":1940,"cover_url":"https://archive.org/download/syntheticmenofma0000edga_d4y4/page/cover.jpg","shows_english_title":true},{"title":"Llana of Gathol","year":1948,"cover_url":"https://archive.org/download/llanaofgathol0000edga/page/cover.jpg","shows_english_title":true},{"title":"John Carter of Mars","year":1964,"cover_url":"https://covers.openlibrary.org/b/id/6698861-L.jpg","shows_english_title":true}]}],"image":"169-old-mars.webp","definition":"Pre-Mariner 4 romantic Mars: the habitable, ancient, canal-crossed planet imagined before the 1965 flyby replaced it with the observed world.","status":"accepted"},{"id":"humorous-science-fiction","label":"Humorous science fiction","parent":"modern-day","children":[],"image":"40-humorous-science-fiction.webp","definition":"Comic and satirical SF (SFE 'Humour': Douglas Adams was the first great success story of written SF humour in the 1980s).","status":"candidate","works":[{"title":"The Hitchhiker's Guide to the Galaxy","cover_url":"https://covers.openlibrary.org/b/id/8594912-L.jpg","shows_english_title":true,"authors":["Douglas Adams"],"year":1979,"books":[{"title":"The Hitchhiker's Guide to the Galaxy","year":1979,"cover_url":"https://covers.openlibrary.org/b/id/11464254-L.jpg","shows_english_title":true},{"title":"The Restaurant at the End of the Universe","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/12714921-L.jpg","shows_english_title":true},{"title":"Life, the Universe and Everything","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/8569242-L.jpg","shows_english_title":true},{"title":"So Long, and Thanks for All the Fish","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/12391241-L.jpg","shows_english_title":true},{"title":"Mostly Harmless","year":1992,"cover_url":"https://covers.openlibrary.org/b/id/11465755-L.jpg","shows_english_title":true}]},{"title":"The Sirens of Titan","cover_url":"https://covers.openlibrary.org/b/id/15063413-L.jpg","shows_english_title":true,"authors":["Kurt Vonnegut Jr."],"year":1959,"placement_note":"SFE calls it a complex satire in Widescreen Baroque mode and repeatedly treats its black comedy, mock religion and absurd cosmic manipulation as its defining effect."},{"title":"Condomnauts","cover_url":"https://images1.penguinrandomhouse.com/cover/9781632061867","shows_english_title":true,"authors":["Yoss"],"year":2013},{"title":"The Complete Roderick","cover_url":"https://covers.openlibrary.org/b/id/910983-L.jpg","shows_english_title":true,"authors":["John Sladek"],"year":1980,"books":[{"title":"Roderick; Or The Education of a Young Machine","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/7007254-L.jpg"},{"title":"Roderick at Random","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/4744851-L.jpg"}],"placement_note":"Root-down: Science fiction -> Modern day -> Humorous science fiction. SFE says the two texts were conceived as one novel and presents the complete tale as the autobiography of a robot with Candide-like innocence; SFE also identifies Sladek as a major satirist. The robot is the innocent observer through which contemporary America is exposed, so satire is the engine. Robots and AI fails its Futurist/Future-of-Earth gate."},{"title":"The Kaiju Preservation Society","cover_url":"https://covers.openlibrary.org/b/id/13204838-L.jpg","shows_english_title":true,"authors":["John Scalzi"],"year":2022,"placement_note":"Comic Scalzi (Kirkus 'fun but with a purpose'; Locus): a laid-off delivery driver joins a team caring for kaiju on a parallel Earth. Humor governs, so Humorous SF."},{"title":"The Road to Roswell","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0593499859.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Connie Willis"],"year":2023,"placement_note":"A skeptic at a Roswell wedding is abducted by an alien and dragged on a comic road trip (Kirkus, PW: romantic comedy)."},{"id":"the-cyberiad","title":"The Cyberiad","authors":["Stanisław Lem"],"year":1965,"cover_url":"cover-the-cyberiad.webp","shows_english_title":true,"placement_note":"SFE identifies Lem's Trurl-Klapaucius cycle as robotic fables; philosophical satire is the mode. Mode wins over subject: moved from Robots to Humorous science fiction by Gustav's 22:38 ruling.","sources":["https://sf-encyclopedia.com/entry/lem_stanislaw","https://sf-encyclopedia.com/entry/robots","https://www.penguin.co.uk/books/256135/the-cyberiad-by-lem-stanislaw/9780241467992"]},{"title":"Acts of God","cover_url":"https://covers.openlibrary.org/b/id/14860780-L.jpg","shows_english_title":true,"authors":["Kanan Gill"],"year":2025,"placement_note":"Comic SF: an underachiever is told the universe is ending; absurdist humor in a science-fictional frame. Flag: if the ending reveals an authored reality, Scripted books in books may claim it later."}]},{"id":"contemporary-fantasy","label":"Contemporary fantasy","parent":"real-earth-universe","children":["contemporary-mythic-fantasy","magical-coming-of-age","domestic-fantasy"],"image":"47-contemporary-fantasy.webp","definition":"Fantasy set in the present-day world (the Encyclopedia of Fantasy's 'Contemporary Fantasy' category; Crowley's Little, Big is its exemplar).","status":"provisional","works":[]},{"id":"nocturne-fantasy","label":"Nocturne fantasy","parent":"real-earth-universe","children":["dark-fantasy","paranormal-fantasy","supernatural-fantasy"],"image":"48-nocturne-fantasy.webp","definition":"Umbrella for menacing and supernatural fantasy on recognizable Earth, from the spooky through the horrifying: dark fantasy, paranormal fantasy, and supernatural fantasy with its being- and power-specific branches. 'Nocturne fantasy' was coined by Gustav Söderström on 2026-09-22, drawing on the established nocturne or night-piece in music and painting.","status":"provisional","works":[]},{"id":"isolationist-fantasy","label":"Isolationist fantasy","parent":"gothic-fantasy","children":[],"works":[{"title":"Gormenghast","cover_url":"https://covers.openlibrary.org/b/id/6623928-L.jpg","shows_english_title":false,"authors":["Mervyn Peake"],"year":1946,"books":[{"title":"Titus Groan","year":1946,"cover_url":"https://covers.openlibrary.org/b/id/11730146-L.jpg"},{"title":"Gormenghast","year":1950,"cover_url":"https://covers.openlibrary.org/b/id/11572290-L.jpg"},{"title":"Titus Alone","year":1959,"cover_url":"https://covers.openlibrary.org/b/id/11730144-L.jpg"}],"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Isolationist fantasy. Gormenghast’s sealed castle, ritual, confinement and decaying hierarchy make isolation a Gothic governing condition."},{"title":"The Year of the Witching","cover_url":"https://covers.openlibrary.org/b/id/10306583-L.jpg","shows_english_title":true,"authors":["Alexis Henderson"],"year":2020,"placement_note":"Penguin Random House sets it in Bethel, a sealed puritanical settlement ruled by the Prophet and walled in by the forbidden Darkwood, where real witches, spirits and plagues break through. Bethel's closed-off order and what lies outside it are the premise, so isolation is the governing Gothic condition, as with Gormenghast. Invented world, actual magic: Fantasy Realms side."}],"image":"49-isolationist-fantasy.webp","definition":"Fantasy of sealed, self-contained worlds whose isolation is the premise. Gormenghast's confinement, ritual and decaying hierarchy make isolation a Gothic governing condition.","status":"accepted"},{"id":"historical","label":"Historical","parent":"science-fiction","children":["proto-sf","period-sf","alternate-history","hidden-history-sf"],"works":[],"image":"51-historical.webp","definition":"Science fiction set in a past era as experienced by the present-day reader: real history, alternate timelines or a reimagined past. Partitioned into Proto SF (written in its own era), Period SF (modern books set in the past, marked by period aesthetics, SF elements open or hidden), Alternate history (a fork, not an era) and Hidden history SF (extraordinary events history never recorded). A writer-present or writer-future setting must also be tested here once it now feels clearly historical.","status":"accepted"},{"id":"proto-sf","label":"Proto SF","parent":"historical","children":["lost-world-fiction","scientific-adventure","fantastic-voyage","gothic-science-fiction"],"image":"315-proto-sf.webp","definition":"Proto SF: science fiction written in its own era, before or at the birth of the genre - voyages, lost worlds, scientific romances and Gothic experiments whose then-contemporary settings now read as historical. Mirrors SFE's Proto SF. Named by Gustav 2026-09-23.","status":"umbrella","works":[]},{"id":"period-sf","label":"Period SF","parent":"historical","children":["steampunk","deco-sf"],"image":"316-period-sf.webp","definition":"Period SF: modern science fiction deliberately set in a past era - retro-futurist steam ages, Art Deco interwar cities. The marker is period aesthetics, not concealment: the SF elements may be openly revealed or kept hidden. Its direct subgenres are named for the era. Events that went unrecorded by history belong to Hidden history SF. The SF mirror of Period fantasy. Named by Gustav 2026-09-23.","status":"umbrella","works":[]},{"id":"futurist","label":"Futurist","parent":"science-fiction","children":["hard-sf","future-of-earth-fiction","spacefaring-fiction","alien-fiction","otherworldly-fiction"],"works":[],"image":"52-futurist.webp","definition":"Science fiction organized by rigorous science, Earth futures, spacefaring, alien life or otherworldly cosmology. Reader-relative test: speculative science from a writer’s present that did not pan out can qualify when it now reads as an alternate future’s science.","status":"accepted"},{"id":"modern-day","label":"Modern day","parent":"science-fiction","children":["alien-invasion-fiction","apocalyptic-fiction","first-contact-fiction","genetic-engineering","humorous-science-fiction","soft-science-fiction","technothriller","social-dystopia-modern"],"works":[],"image":"53-modern-day.webp","definition":"Science fiction set in the recognizable present.","status":"accepted"},{"id":"psi-powers","label":"Psi powers","parent":"soft-science-fiction","children":[],"works":[{"title":"Dying Inside","cover_url":"https://covers.openlibrary.org/b/id/10130176-L.jpg","shows_english_title":true,"authors":["Robert Silverberg"],"year":1972},{"title":"Carrie","cover_url":"https://covers.openlibrary.org/b/id/15228374-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1974,"placement_note":"SFE describes King's first novel as focused on Psi Powers, notably Telekinesis. King's official synopsis centers Carrie White gradually discovering telekinetic powers and using them in the prom confrontation; her mind-driven physical power is the engine."},{"title":"Mother London","cover_url":"https://covers.openlibrary.org/b/id/6709940-L.jpg","shows_english_title":true,"authors":["Michael Moorcock"],"year":1988,"placement_note":"SFE: possibly Moorcock's finest single novel, its grasp making pigeonholing impossible 'despite touches of Telepathy and other psi phenomena' (cross-referencing ESP and Psi Powers). The fantastic content is the three outpatients' psi perception of present-day London; psi counts as pseudoscience, not magic."},{"title":"Riot Baby","cover_url":"https://covers.openlibrary.org/b/id/9258941-L.jpg","shows_english_title":true,"authors":["Tochi Onyebuchi"],"year":2020,"placement_note":"Root-down: Science fiction -> Modern day -> Soft science fiction -> Psi powers. Pan Macmillan centers Ella’s precognition and city-wrecking power amid the recognizable Black American present, including Kev’s incarceration; the global-dystopian language describes social experience, not a separately extrapolated future regime. Social dystopia is rejected because psi power, not the social order alone, is the speculative engine."},{"title":"The Institute","cover_url":"cover-the-institute.jpg","shows_english_title":true,"authors":["Stephen King"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Psi powers. Contemporary abducted children with telepathy and telekinesis are experimented on for their extranormal gifts; established psi is pseudoscience under Gustav’s 2026-09-14 ruling."},{"title":"The Philosopher's Stone","cover_url":"cover-the-philosophers-stone.jpg","shows_english_title":true,"authors":["Colin Wilson"],"year":1969,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Psi powers. Valancourt centers a brain operation that expands consciousness and grants time vision, letting scientists see Shakespeare, the Maya and Stonehenge before awakening an ancient power. The era treated psychic consciousness as investigable speculative science; the acquired mental power governs."},{"title":"The Sending","cover_url":"cover-the-sending.jpg","shows_english_title":true,"authors":["Geoffrey Household"],"year":1980,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Psi powers. Open Road centers a contemporary English estate owner with psychic powers receiving preternatural animal-like danger sensations while hunted by an evil presence. The established extrasensory perception is the operative speculative mechanism."},{"title":"The Man Who Saw Seconds","cover_url":"https://boldizar.com/assets/man-who-saw-seconds-C-sSqUDP.jpg","shows_english_title":true,"authors":["Alexander Boldizar"],"year":2024,"placement_note":"Preble Jefferson can see five seconds ahead and is hunted by the NSA (Locus, author's page). Present-day psi thriller."}],"image":"159-psi-powers.webp","definition":"Contemporary-set psi stories in the recognizable present.","status":"accepted"},{"id":"atemporal","label":"Atemporal","parent":"science-fiction","children":["fabulation","new-weird","reincarnation-fiction","science-fantasy","time-travel-fiction","parallel-world-fiction"],"works":[],"image":"54-unplaceable.webp","definition":"Science fiction unplaceable as modern-day, historical, or futuristic: stories that cross eras, worlds with no Earth-time anchor, and realities that resist a stable place in time. Any science-fiction time travel, as premise or element, sorts here under Time travel fiction, regardless of setting dates.","status":"accepted"},{"id":"parallel-world-fiction","label":"Parallel World fiction","parent":"atemporal","children":[],"works":[{"title":"The Space Between Worlds","cover_url":"https://covers.openlibrary.org/b/id/10723957-L.jpg","shows_english_title":true,"authors":["Micaiah Johnson"],"year":2020,"placement_note":"SFE centers its 380 interacting Parallel Worlds and travel possible only where the traveler’s Doppelganger is dead; cross-world identity and movement are the governing mechanism."},{"title":"Million Mile Road Trip","cover_url":"https://skyhorse-us.imgix.net/covers/9781597809924.jpg?auto=format&w=900","shows_english_title":true,"authors":["Rudy Rucker"],"year":2019,"placement_note":"Skyhorse and SFE center a transdimensional crossing into Mappyworld, an endless parallel universe whose basin-worlds contain contrasting alien civilizations; the teens’ road trip and Earth-invasion defense depend on travel across that alternate reality."},{"title":"Ring Around the Sun","cover_url":"https://covers.openlibrary.org/b/id/678934-L.jpg","shows_english_title":true,"authors":["Clifford D. Simak"],"year":1953,"placement_note":"Root-down: Science fiction -> Atemporal -> Parallel World fiction. SFE says the novel discovers a chain of parallel Earths and centers mutants using everlasting goods while empty alternate Earths become available for colonization. Futurist siblings fail because crossing parallel realities, not one future Earth or an other cosmos, is the mechanism."},{"title":"The Need","cover_url":"cover-the-need.jpg","shows_english_title":true,"authors":["Helen Phillips"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Parallel World fiction. Penguin explicitly frames the novel through alternative universes; impossible variant artifacts from a fossil quarry and an intruder who shares Molly’s life make identity across parallel realities the governing speculative mechanism. Motherhood gives the stakes, but parallel-world collision drives them."},{"id":"unholy-land","title":"Unholy Land","authors":["Lavie Tidhar"],"year":2018,"books":[{"title":"Unholy Land","year":2018,"cover_url":"cover-unholy-land.jpg"}],"cover_url":"cover-unholy-land.jpg"},{"title":"Rabbit in the Moon","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1734648678.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Fiona Moore"],"year":2024,"placement_note":"Two heroes on parallel versions of Earth work to undo the damage to their worlds (publisher page, Scalzi's Big Idea)."},{"title":"The Possibilities","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0593446488.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Yael Goldstein-Love"],"year":2023,"placement_note":"A new mother discovers her son is slipping between versions of reality and crosses the multiverse after him (PW, Kirkus)."},{"title":"Archive of Unknown Universes","cover_url":"https://covers.openlibrary.org/b/isbn/9780063336315-L.jpg","shows_english_title":true,"authors":["Ruben Reyes Jr."],"year":2025,"placement_note":"A device called the Defractor lets users glimpse alternate timelines; two families traced across parallel versions of the Salvadoran civil war."}],"image":"135-parallel-world-fiction.webp","definition":"Science fiction whose central mechanism is travel, communication or identity across multiple parallel versions of reality (SFE Parallel Worlds).","status":"accepted"},{"id":"hidden-history-sf","label":"Hidden history SF","parent":"historical","children":[],"image":"319-hidden-history-sf.webp","definition":"Hidden history SF: scientifically extraordinary events - aliens, psi powers, lost contacts - that happened in the past but went unrecorded. The events are undocumented by real history; concealment from the record is the marker. Covers both recorded-era settings (events that slipped past the chronicles) and prehistoric ones (before any record existed). The SF counterpart of Fantasy's Secret history. Coined by Gustav 2026-09-23.","status":"accepted","works":[{"title":"Eifelheim","cover_url":"https://mpd-biblio-covers.imgix.net/9780765319104.jpg","shows_english_title":true,"authors":["Michael Flynn"],"year":2006,"placement_note":"Flynn's 2006 novel: alien Krenken crash-land near a Black Forest village in 1348, and their presence goes unrecorded - the village vanishes from history, rediscovered only by a modern historian. Extraordinary contact the record never kept: Hidden history SF. Moved from Historical first contact (retired) 2026-09-23 (Gustav 16:35)."},{"title":"The Inheritors","cover_url":"cover-the-inheritors.jpg","shows_english_title":true,"authors":["William Golding"],"year":1955,"placement_note":"Golding's 1955 novel: a band of Neanderthals encounters the Homo sapiens who will displace them - a first contact between human kinds in prehistory, before any record could exist. Hidden history SF (prehistoric setting). Moved from Historical first contact (retired) 2026-09-23 (Gustav 16:35)."},{"title":"Wild Seed","cover_url":"https://covers.openlibrary.org/b/id/10279447-L.jpg","shows_english_title":true,"authors":["Octavia E. Butler"],"year":1980,"placement_note":"Butler's 1980 Patternist novel (EBSCO, ISFDB): Doro, a body-jumping immortal, and Anyanwu, an Onitsha-Ibo shapeshifter and healer, span 1690-1840 from Africa to the American colonies while Doro secretly breeds a people with psychic powers. Psi, not magic (SF); extraordinary powers living inside documented centuries without ever entering the record: Hidden history SF. Placed by Gustav 2026-09-23 16:35."},{"title":"51","cover_url":"https://covers.openlibrary.org/b/isbn/9781616963484-L.jpg","shows_english_title":true,"authors":["Patrick O'Leary"],"year":2022,"placement_note":"A portal found at the Trinity test site before WWII ends, invisible visitors, memory erasure and a government cover story (the crashed saucer is itself the cover): a secret history of the 20th century told from present-day Detroit."}]},{"id":"reincarnation-fiction","label":"Reincarnation fiction","parent":"atemporal","children":[],"works":[{"title":"Cloud Atlas","cover_url":"https://covers.openlibrary.org/b/id/8764871-L.jpg","shows_english_title":true,"authors":["David Mitchell"],"year":2004},{"title":"The Book of Ptath","cover_url":"https://covers.openlibrary.org/b/id/678924-L.jpg","shows_english_title":true,"authors":["A. E. van Vogt"],"year":1943},{"title":"Downward to the Earth","cover_url":"https://book-assets.openroadmedia.com/9781504074056.jpg","shows_english_title":true,"authors":["Robert Silverberg"],"year":1970,"placement_note":"SFE makes this a notable case of alien biology permitting reincarnation within an explicitly religious frame; the nildoror rebirth rite and Gundersen’s pursuit of it are the linking device, making Reincarnation fiction more specific than Anthropological SF."},{"title":"Rakesfall","cover_url":"https://covers.openlibrary.org/b/id/15212956-L.jpg","shows_english_title":true,"authors":["Vajra Chandrasekera"],"year":2024,"placement_note":"Annelid and Leelee meet again across lifetimes and eras, from the colonial past to the far future (Library Journal, PW). Reincarnation is the linking device."}],"image":"57-reincarnation-fiction.webp","definition":"Stories in which a soul or consciousness recurs across multiple lifetimes and eras, reincarnation serving as the linking device.","status":"provisional"},{"id":"technothriller","label":"Technothriller","parent":"modern-day","children":[],"works":[{"title":"Cryptonomicon","cover_url":"https://covers.openlibrary.org/b/id/11540410-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":1999},{"title":"Little Brother","year":2008,"authors":["Cory Doctorow"],"cover_url":"https://mpd-biblio-covers.imgix.net/9780765323118.jpg","shows_english_title":true,"books":[{"title":"Little Brother","year":2008,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765323118.jpg"},{"title":"Homeland","year":2013,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765333704.jpg"},{"title":"Attack Surface","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250757517.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Technothriller. The sequence is set in a recognizable present-day San Francisco (and California): real networks, cryptography, hacking and counter-surveillance drive the thriller plot, so the Modern day gate is met before any Futurist branch. Gustav's no-duplicates rule (2026-09-23 11:51): the duplicate Postcyberpunk card was removed and this is the book's only home."},{"title":"Pattern Recognition","cover_url":"https://covers.openlibrary.org/b/id/7997178-L.jpg","shows_english_title":true,"authors":["William Gibson"],"year":2003},{"title":"Pacific Storm","cover_url":"https://covers.openlibrary.org/b/id/12996604-L.jpg","shows_english_title":true,"authors":["Linda Nagata"],"year":2020,"placement_note":"Locus (Letson, Dec 2020): near-future-nightmare intrigue-thriller-disaster shelved beside Christopher Brown, Greg Egan, Nancy Kress - Honolulu cop in the autonomous Waikiki District relies on behavior-predicting AI HADAFA, which glitches as a Category 5 hurricane and a terrorist conspiracy converge. Technothriller core: the near-future tech (autonomous district, predictive AI) drives the thriller. Shelfmates: Little Brother, Pattern Recognition."},{"title":"The Andromeda Strain","cover_url":"https://images1.penguinrandomhouse.com/cover/9781101974490","shows_english_title":true,"authors":["Michael Crichton"],"year":1969,"placement_note":"Root-down: Science fiction -> Modern day -> Technothriller. SFE calls Crichton a master of the Technothriller and treats laboratory containment technology and human fallibility as the engine. Pandemic loses because this is a contained technical crisis, not civilization ending by plague."},{"title":"The Night Sessions","cover_url":"cover-the-night-sessions.jpg","shows_english_title":true,"authors":["Ken MacLeod"],"year":2008,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Technothriller. Pyr and Publishers Weekly center a near-future bombing investigation, sentient robotic police partner, robot consciousness and a global terrorist conspiracy in a secularized society. The police-thriller investigation through plausible near-future technology governs."}],"image":"58-technothriller.webp","definition":"Present-day or near-future thrillers built around technology and technical detail, occupying an essentially mundane narrative world (SFE theme Technothriller).","status":"provisional"},{"id":"lost-world-fiction","label":"Lost world fiction","parent":"proto-sf","children":[],"works":[{"title":"Journey to the Center of the Earth","year":1864,"authors":["Jules Verne"],"cover_url":"https://covers.openlibrary.org/b/id/13904963-L.jpg","shows_english_title":true,"score":8,"placement_note":"Forced call: coined provisional leaf 'lost-world-fiction' (SFE Lost Worlds theme cites Verne). Set in 1863 -> Historical axis.","buy":[{"label":"Adlibris","url":"https://www.adlibris.com/se/sok?q=journey+to+the+center+of+the+earth+verne"},{"l edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Foreign Legion(1).jpg?_t=1705801588","shows_english_title":true},{"title":"Tarzan and the Madman","year":1964,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Madman(1).jpg?_t=1705801588","shows_english_title":true},{"title":"Tarzan and the Castaways","year":1965,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Castaways(1).jpg?_t=1705801592","shows_english_title":true}]},{"title":"The Dwellers in the Mirage","cover_url":"https://covers.openlibrary.org/b/id/8535842-L.jpg","shows_english_title":true,"authors":["A. Merritt"],"year":1932,"placement_note":"SFE describes a remote Alaskan valley with a hidden prehistory and a cosmic horror entity. The geographically isolated archaic society and its discovery are the defining Lost World structure; published and framed in 1932, so Historical."},{"title":"Land Under England","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-land-under-england-75.jpg","shows_english_title":true,"authors":["Joseph O'Neill"],"year":1935,"placement_note":"SFE explicitly calls Land Under England a Dystopia in a Lost-World setting: an enormous underground cave system beneath Cumberland holds descendants of a Roman army under telepathic totalitarian rule. The expedition into an isolated surviving civilization makes Lost world fiction the closest leaf; dystopia is its internal society."},{"title":"Mistress Masham's Repose","cover_url":"https://covers.openlibrary.org/b/id/898768-L.jpg","shows_english_title":true,"authors":["T. H. White"],"year":1946,"placement_note":"SFE files the novel under White's sf interest: Lilliputians carried to England by Gulliver have survived hidden on the vast Malplaquet estate for 200 years until a girl discovers them. A hidden surviving people discovered in isolation is the Lost World structure in miniature; Lilliputian anthropology is pseudoscience rather than magic."},{"title":"The Lost World","cover_url":"cover-the-lost-world.jpg","shows_english_title":true,"authors":["Arthur Conan Doyle"],"year":1912,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Lost world fiction. PRH and Penguin send Professor Challenger’s expedition to an inaccessible Amazon plateau where dinosaurs, prehistoric creatures and ape-men survive. It is the foundational hidden-plateau lost-world adventure and fits the leaf exactly."},{"id":"valley-of-the-flame","title":"Valley of the Flame","authors":["Henry Kuttner"],"year":1946,"books":[{"title":"Valley of the Flame","year":1946,"cover_url":"cover-valley-of-the-flame.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Lost world fiction. SFE calls the 1946 Kuttner/Moore novel a Lost World tale set Underground: a period expedition finds an isolated hidden valley whose flame-driven evolution sustains a vanished people. The then-present setting is now historical, and the hidden-world discovery governs.","cover_url":"cover-valley-of-the-flame.jpg"}],"image":"59-lost-world-fiction.webp","status":"provisional","definition":"Adventure fiction in which explorers discover a surviving prehistoric or otherwise isolated world: hidden plateaus, hollow-earth caverns and lost valleys where dinosaurs, ancient peoples or vanished civilizations endure. Coined from the SFE Lost Worlds theme entry; Verne's Journey to the Center of the Earth (1864) is the genre's founding text."},{"id":"gaslight-fantasy","label":"Gaslight fantasy","parent":"industrial-age-fantasy","children":["gaslight-technomancy","mythology-in-gaslight","folklore-in-gaslight"],"works":[],"image":"60-gaslight-fantasy.webp","definition":"Fantasy set in the gaslit long nineteenth century, partitioned by how magic enters the historical setting: engineered wonder, revived mythology, or living folklore.","status":"umbrella"},{"id":"gaslight-technomancy","label":"Gaslight Technomancy","parent":"gaslight-fantasy","children":[],"works":[{"title":"Babel","cover_url":"https://cdn.waterstones.com/bookjackets/large/9780/0085/9780008501853.jpg","shows_english_title":true,"authors":["R. F. Kuang"],"year":2022,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Gaslight Technomancy. Translation-powered silver-working is a learned industrial system that runs the British Empire, so engineered magical infrastructure governs."},{"title":"The Extraordinary Adventures of the Athena Club","cover_url":"https://covers.openlibrary.org/b/id/8762813-L.jpg","shows_english_title":true,"authors":["Theodora Goss"],"year":2017,"books":[{"title":"The Strange Case of the Alchemist's Daughter","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8762813-L.jpg"},{"title":"European Travel for the Monstrous Gentlewoman","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/11241076-L.jpg"},{"title":"The Sinister Mystery of the Mesmerizing Girl","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/9320944-L.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Gaslight Technomancy. The daughters of literature's mad scientists are products of experiments and scientific artifice; investigative plots are secondary to their engineered fantastic origins."},{"title":"Fata Morgana","cover_url":"https://book-assets.openroadmedia.com/9781497631007.jpg","shows_english_title":true,"authors":["William Kotzwinkle"],"year":1977,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Gaslight Technomancy. An apparently infallible fortune-telling machine makes magical apparatus the governing source of wonder in 1871 Paris."}],"image":"270-gaslight-technomancy.webp","definition":"Gaslight-era fantasy where magic is engineered as science, machinery, experiment or industrial system.","status":"accepted"},{"id":"mythology-in-gaslight","label":"Mythology in Gaslight","parent":"gaslight-fantasy","children":[],"works":[{"title":"The Anubis Gates","cover_url":"https://covers.openlibrary.org/b/id/77712-L.jpg","shows_english_title":true,"authors":["Tim Powers"],"year":1983,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Mythology in Gaslight. Ancient Egyptian sorcery and homunculi are revived inside 1810 London, importing old mythology into the industrial era."},{"title":"The Gilded Wolves trilogy","cover_url":"cover-gilded-wolves.jpg","shows_english_title":true,"authors":["Roshani Chokshi"],"year":2019,"books":[{"title":"The Gilded Wolves","year":2019,"cover_url":"cover-gilded-wolves.jpg","shows_english_title":true},{"title":"The Silvered Serpents","year":2020,"cover_url":"cover-silvered-serpents.jpg","shows_english_title":true},{"title":"The Bronzed Beasts","year":2021,"cover_url":"cover-bronzed-beasts.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Mythology in Gaslight. Forging descends from the shattered Tower of Babel, importing an ancient sacred myth into 1889 Exposition Paris."}],"image":"271-mythology-in-gaslight.webp","definition":"Gaslight-era fantasy where ancient sacred myths and their powers are revived inside the nineteenth-century world.","status":"accepted"},{"id":"folklore-in-gaslight","label":"Folklore in Gaslight","parent":"gaslight-fantasy","children":["faeries-in-gaslight","monsters-in-gaslight","circus-in-gaslight"],"works":[],"image":"272-folklore-in-gaslight.webp","definition":"Gaslight-era fantasy where fairies, folk beings, oral wonders and traditional supernatural lore enter historical life, partitioned by the kind of lore: the Fair Folk, creature-lore, or the wonder-tale.","status":"accepted"},{"id":"faeries-in-gaslight","label":"Faeries in Gaslight","parent":"folklore-in-gaslight","children":[],"works":[{"title":"Jonathan Strange & Mr Norrell","cover_url":"https://res.cloudinary.com/bloomsbury-atlas/image/upload/w_360,c_scale,dpr_1.5/jackets/9781526679055.jpg","shows_english_title":true,"authors":["Susanna Clarke"],"year":2004,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Folklore in Gaslight. English Faerie, the Raven King and gentleman-magicians bring native folklore back into Regency England."},{"title":"At the Back of the North Wind","cover_url":"https://covers.openlibrary.org/b/id/8245161-L.jpg","shows_english_title":true,"authors":["George MacDonald"],"year":1871,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Folklore in Gaslight. A Victorian cabman’s son meets the personified North Wind, placing folktale wonder inside ordinary nineteenth-century domestic life."},{"title":"The Adventures of Mary Darling","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1616964383.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Pat Murphy"],"year":2025,"placement_note":"Edwardian London: Mary Darling, the mother of the children Peter Pan lured away, enlists Holmes and Watson to get them back from Neverland (Library Journal, Fantasy Literature)."},{"title":"Emily Wilde's Encyclopaedia of Faeries","cover_url":"https://images-na.ssl-images-amazon.com/images/P/059350013X.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Heather Fawcett"],"year":2023,"placement_note":"1909: a Cambridge dryadologist keeps a field journal while studying the hidden folk of a remote northern island (Kirkus, Library Journal)."},{"title":"A Market of Dreams and Destiny","cover_url":"https://images2.penguinrandomhouse.com/cover/9781803363684","shows_english_title":true,"authors":["Trip Galey"],"year":2023,"placement_note":"Below Covent Garden lies the Untermarkt, a hidden faerie market where anything has a price: English Faerie bargained with in gaslit London. Placed via Gustav's 18:38 split of Folklore in Gaslight (was held #6)."}],"definition":"Gaslight-era fantasy where faeries - the Fair Folk, hidden people and their realms - cross into nineteenth-century life.","status":"accepted","image":"336-faeries-in-gaslight.webp"},{"id":"monsters-in-gaslight","label":"Monsters in Gaslight","parent":"folklore-in-gaslight","children":[],"works":[{"title":"The Golem and the Jinni","cover_url":"cover-the-golem-and-the-jinni.jpg","shows_english_title":true,"authors":["Helene Wecker"],"year":2013,"books":[{"title":"The Golem and the Jinni","year":2013,"cover_url":"cover-the-golem-and-the-jinni.jpg","shows_english_title":true},{"title":"The Hidden Palace","year":2021,"cover_url":"cover-the-hidden-palace.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Folklore in Gaslight. A Jewish golem and an Arabian jinni carry two living folk traditions into immigrant New York beginning in 1899; their folkloric identities govern the historical setting."},{"title":"The Angel of the Crows","cover_url":"https://mpd-biblio-covers.imgix.net/9780765387400.jpg","shows_english_title":true,"authors":["Katherine Addison"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Folklore in Gaslight. Angels, vampires and werewolves form the public supernatural bestiary of alternate 1880s London; folklore governs over the Sherlockian investigation."},{"title":"The Deep","cover_url":"cover-the-deep-alma-katsu.webp","shows_english_title":true,"authors":["Alma Katsu"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Folklore in Gaslight. Sirens, selkies, haunting and occult rites bring water-folk and supernatural tradition aboard Titanic and Britannic."},{"title":"My Brother's Keeper","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1982192860.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Tim Powers"],"year":2023,"placement_note":"The Brontë siblings in 1840s Yorkshire against werewolves out of British folklore (PW, Historical Novel Society). Queue listed it as 'My Mother's Keeper'; the real title is My Brother's Keeper."},{"title":"The Fox Wife","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250266017.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Yangsze Choo"],"year":2024,"placement_note":"1908 Manchuria: a detective hunts a woman who may be a fox spirit, in Chinese fox folklore (Kirkus, Straits Times)."}],"definition":"Gaslight-era fantasy where creature-lore - golems, jinn, angels, vampires, sea beings, werewolves, fox spirits - walks the nineteenth-century world.","status":"accepted","image":"337-monsters-in-gaslight.webp"},{"id":"circus-in-gaslight","label":"Circus in Gaslight","parent":"folklore-in-gaslight","children":[],"works":[{"title":"Nights at the Circus","year":1984,"authors":["Angela Carter"],"cover_url":"https://covers.openlibrary.org/b/id/8259229-L.jpg","shows_english_title":true,"score":8.5,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Folklore in Gaslight. A possibly supernatural winged aerialist carries circus wonder and oral tall-tale logic through the gaslit world of 1899.","buy":[{"label":"Adlibris","url":"https://www.adlibris.com/se/sok?q=nights+at+the+circus+carter"},{"label":"Amazon","url":"https://www.amazon.com/s?k=nights+at+the+circus+carter"}],"versions":[{"cover_url":"https://covers.openlibrary.org/b/id/8259229-L.jpg","credit":"Penguin, 1986"},{"cover_url":"https://covers.openlibrary.org/b/id/9920504-L.jpg","credit":"Penguin, 1993"}]}],"definition":"Gaslight-era fantasy where the circus and the stage carry the marvelous - winged performers, wonders and curiosities - into nineteenth-century life.","status":"accepted","image":"338-circus-in-gaslight.webp"},{"id":"viking-fantasy","label":"Viking fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"The Last Light of the Sun","cover_url":"https://images.penguinrandomhouse.com/cover/9780451459855","shows_english_title":true,"authors":["Guy Gavriel Kay"],"year":2004},{"title":"The Weaver and the Witch Queen","cover_url":"https://images.booksense.com/images/244/438/9780593438244.jpg","shows_english_title":true,"authors":["Genevieve Gornichec"],"year":2023},{"title":"The Broken Sword","cover_url":"https://covers.openlibrary.org/b/id/11023834-L.jpg","shows_english_title":true,"authors":["Poul Anderson"],"year":1954}],"image":"62-nordic-fantasy.webp","definition":"Historical fantasy anchored in the Viking Age: medieval Scandinavian societies, seafaring, raiding, dynastic struggle and their neighboring cultures, whether or not mythic elements also appear."},{"id":"celtic-fantasy","label":"Celtic fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"Warrior Bards","cover_url":"https://julietmarillier.com/wp-content/uploads/2024/04/Harp-of-Kings.jpg","shows_english_title":false,"authors":["Juliet Marillier"],"year":2019,"books":[{"title":"The Harp of Kings","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/8997082-L.jpg"},{"title":"A Dance with Fate","year":2020},{"title":"A Song of Flight","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/10931795-L.jpg"}]},{"title":"Sistersong","cover_url":"https://ik.imagekit.io/panmac/tr:f-auto,di-placeholder_portrait_aMjPtD9YZ.jpg,w-640/edition/9781529039030.jpg","shows_english_title":true,"authors":["Lucy Holland"],"year":2021,"placement_note":"Magical ancient Britain after Roman withdrawal, with bards, warring tribes, land magic and Myrdhin; post-Roman Celtic-British culture is the historical stage."},{"title":"The Buried Giant","cover_url":"https://images1.penguinrandomhouse.com/cover/9780307455796","shows_english_title":true,"authors":["Kazuo Ishiguro"],"year":2015,"placement_note":"Post-Arthurian Britain, Britons and Saxons, aged Gawain, ogres and a dragon-induced amnesia make the Celtic-British legendary-historical stage governing."}],"image":"63-celtic-fantasy.webp","definition":"Fantasy drawing on Celtic myth and early-medieval Ireland, Wales and Britain - bards, the sidhe and heroic legend. Label attested by the Encyclopedia of Fantasy's Celtic Fantasy theme entry. Split from historical fantasy 2026-09-13 on Gustav's time-period decision."},{"id":"real-earth-universe","label":"Real Earth Universe","parent":"fantasy","children":["animal-fantasy","contemporary-fantasy","historical-fantasy","magic-realism","mythic-retelling","nocturne-fantasy","urban-fantasy"],"works":[],"status":"umbrella","definition":"Fantasy set on our own Earth - past, present, or future - where the fantastic intrudes on the world we know: magic realism, historical and contemporary fantasy, urban fantasy, mythic retellings, animal fables, and the supernatural.","image":"65-real-earth-universe.webp"},{"id":"fantasy-realms","label":"Fantasy Realms","parent":"fantasy","children":["epic-fantasy","sword-and-sorcery","fairy-tale-revision","gothic-fantasy","far-shores-fantasy","cozy-fantasy"],"works":[],"status":"umbrella","definition":"Imaginary-world fantasy organized by epic worldbuilding, action-forward Sword and Sorcery, fairy-tale revision, inherited Heritage schools, Far shores counterpart cultures, or Cozy fantasy. New direct children require Gustav’s ruling.","image":"66-fantasy-realms.webp"},{"id":"shenmo","label":"Shenmo","parent":"chuanqi","children":[],"works":[{"title":"The Chronicles of Master Li and Number Ten Ox","cover_url":"https://images3.penguinrandomhouse.com/cover/9780345321381","shows_english_title":true,"authors":["Barry Hughart"],"year":1984,"books":[{"title":"Bridge of Birds","year":1984,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780345321381"},{"title":"The Story of the Stone","year":1988,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780307800978"},{"title":"Eight Skilled Gentlemen","year":1991,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780385417105"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Fairy-tale revision -> Shenmo. Gods, ghosts, monsters, Heaven and Chinese folklore govern; martial training or combat do not, so this is Shenmo rather than Wuxia."}],"image":"278-shenmo.webp","definition":"神魔 (shenmo), the Ming-era Chinese gods-and-demons tradition descending from Journey to the West: mythic adventures shaped by deities, demons, ghosts, animal spirits, celestial bureaucracy and the mingling of Buddhist, Daoist and folk cosmologies. The classical parent tradition of Xuanhuan and Xianxia.","status":"accepted"},{"id":"far-shores-fantasy","label":"Far shores fantasy","parent":"fantasy-realms","children":["chuanqi","khayal"],"image":"311-far-shores-fantasy.webp","definition":"Fantasy Realms set in invented worlds that are counterparts of non-Western cultures, histories and myth traditions - veiled stand-in lands rather than the real places, which live under Real Earth Universe's Period fantasy. Children carry each culture's own word for fantasy. Named by Gustav 2026-09-23.","status":"umbrella","works":[]},{"id":"chuanqi","label":"Chuanqi","parent":"far-shores-fantasy","children":["shenmo","xuanhuan","wuxia"],"image":"312-chuanqi.webp","definition":"传奇 (chuanqi), the Tang-dynasty word for wonder-tales that still means legend and saga: Chinese-tradition fantasy in invented worlds, from classical gods-and-demons myth to modern mystic fantasy. Shenmo is the Ming-era classical tradition, Xuanhuan its modern heir, Wuxia the martial-heroes tradition of the jianghu; Xianxia is banked for later. Named by Gustav 2026-09-23.","status":"umbrella","works":[]},{"id":"xuanhuan","label":"Xuanhuan","parent":"chuanqi","children":[],"image":"313-xuanhuan.webp","definition":"玄幻 (xuanhuan), 'mysterious fantasy': broad modern Chinese mystic fantasy - Daoist and folk cosmology, ghosts, fox spirits, shamans and immortals in invented worlds drawn from Chinese history and legend. The modern heir of the Shenmo tradition. Named by Gustav 2026-09-23.","status":"accepted","works":[{"title":"Under Heaven","cover_url":"https://covers.openlibrary.org/b/id/9946446-L.jpg","shows_english_title":true,"authors":["Guy Gavriel Kay"],"year":2010,"placement_note":"Penguin Random House: Kay evokes the Tang dynasty of 8th-century China in Kitai, an invented stand-in empire. Shen Tai, honouring his dead father at a haunted battlefield, is given 250 Sardian horses - a gift that makes him a target at court. Ghosts, fox-women and shamans are real. Mystic Chinese-history fantasy in a veiled world: Xuanhuan."}]},{"id":"wuxia","label":"Wuxia","parent":"chuanqi","children":[],"image":"321-wuxia.webp","definition":"武侠 (wuxia), 'martial heroes': Chinese-tradition fantasy of the jianghu, the outlaw world of wandering martial artists, sworn brotherhoods and righteous rebels, where sword arts, qi and lightness skill reach beyond the humanly possible, in a legendary or veiled imperial China. Created by Gustav's 2026-09-23 21:26 ruling.","status":"accepted","works":[{"title":"The Water Outlaws","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250180422.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["S. L. Huang"],"year":2023,"placement_note":"A gender-flipped retelling of the Water Margin: the outlaws of Liangshan, led by women and genderqueer heroes, fight a corrupt empire in an alternative imperial China (BookPage). Huang's note calls it a mix of wuxia and epic fantasy with fantastical sword fights (Locus). Jianghu rebels and martial arts past human limits: Wuxia."}]},{"id":"khayal","label":"Khayal","parent":"far-shores-fantasy","children":[],"image":"314-khayal.webp","definition":"خيال (khayal), Arabic for imagination and fantasy, with the classical double sense of shadow and phantom: fantasy of invented worlds drawn from Arabic, Islamic and Andalusi cultures and histories. Alf Layla is banked for a future classical Nights leaf. Named by Gustav 2026-09-23.","status":"accepted","works":[{"title":"The Lions of Al-Rassan","cover_url":"cover-the-lions-of-al-rassan-v2.jpg","shows_english_title":true,"authors":["Guy Gavriel Kay"],"year":1995,"placement_note":"Harper Voyager calls it evocative of medieval Spain: in the invented land of Al-Rassan the Asharite empire has broken into warring city-states, and a Jaddite captain and an Asharite poet-diplomat meet under divided loyalties. A veiled stand-in for Al-Andalus rather than the real place, so it moved from Andalusian fantasy to Khayal (Gustav 2026-09-23 14:02)."}]},{"id":"cozy-fantasy","label":"Cozy fantasy","parent":"fantasy-realms","children":[],"works":[{"title":"A Wizard's Guide to Defensive Baking","cover_url":"https://covers.openlibrary.org/b/id/10296774-L.jpg","shows_english_title":true,"authors":["T. Kingfisher"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Cozy fantasy. A small-scale magical bakery, young bread wizard, humorous enchanted dough and community-centered defense create a warm, comforting register."},{"title":"Legends & Lattes","cover_url":"https://covers.openlibrary.org/b/id/13028635-L.jpg","shows_english_title":true,"authors":["Travis Baldree"],"year":2022,"placement_note":"'High fantasy and low stakes' (Shelf Awareness): an orc mercenary retires to open a coffee shop. Craft, community, comfort. Series volumes Bookshops & Bonedust and Brigands & Breadknives pending."},{"title":"A Letter to the Luminous Deep","cover_url":"https://covers.openlibrary.org/b/id/14835998-L.jpg","shows_english_title":true,"authors":["Sylvie Cathrall"],"year":2024,"placement_note":"Epistolary whimsy: two scholars fall in love by letter across an underwater world; gentle stakes, academic coziness, charm over peril."}],"image":"279-cozy-fantasy.webp","definition":"Warm, low-intensity fantasy centered on comfort, community, craft, food, home and everyday care, where safety and belonging govern even when adventure or danger appears.","status":"accepted"},{"id":"comic-fantasy","label":"Comic fantasy","parent":"sword-and-sorcery","children":[],"works":[{"title":"Discworld","cover_url":"https://i0.wp.com/terrypratchett.com/management/wp-content/uploads/2021/05/Colour-of-magic.jpg?fit=192%2C300&ssl=1","shows_english_title":true,"authors":["Terry Pratchett"],"year":1983,"books":[{"title":"The Colour of Magic","year":1983,"cover_url":"https://discworld.com/wp-content/uploads/2026/07/discworld-novels-nikoll-cover-editions-01.png","shows_english_title":true},{"title":"The Light Fantastic","year":1986,"cover_url":"https://discworld.com/wp-content/uploads/2026/07/discworld-novels-nikoll-cover-editions-02.png","shows_english_title":true},{"title":"Equal Rites","year":1987,"cover_url":"https://discworld.com/wp-content/uploads/2026/07/discworld-novels-nikoll-cover-editions-03.png","shows_english_title":true},{"title":"Mort","year":1987,"cover_url":"https://discworld.com/wp-content/uploads/2026/07/dis s1.penguinrandomhouse.com/cover/9780441012688","shows_english_title":true,"authors":["Jim Butcher"],"year":2004,"books":[{"title":"Furies of Calderon","year":2004,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441012688"},{"title":"Academ's Fury","year":2005,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441013401"},{"title":"Cursor's Fury","year":2006,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441015474"},{"title":"Captain's Fury","year":2007,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441016556"},{"title":"Princeps' Fury","year":2008,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441017966"},{"title":"First Lord's Fury","year":2009,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441019625"}]},{"title":"The Founders Trilogy","cover_url":"https://covers.openlibrary.org/b/id/9252092-L.jpg","shows_english_title":true,"authors":["Robert Jackson Bennett"],"year":2018,"books":[{"title":"Foundryside","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/9252092-L.jpg"},{"title":"Shorefall","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/13789045-L.jpg"},{"title":"Locklands","year":2022,"cover_url":"https://covers.openlibrary.org/b/id/13249338-L.jpg"}],"placement_note":"Penguin Random House describes scriving as an engineered magic technology that rewrites objects, minds and reality through explicit commands, rules and constraints. Its rule-bound system drives the trilogy, making Hard magic the closest leaf."},{"title":"Middlegame","cover_url":"https://x.sf-encyclopedia.com/gal/dreamhaven/McGuire-Middlegame.jpg","shows_english_title":true,"authors":["Seanan McGuire"],"year":2019,"placement_note":"Tor centers an alchemist’s engineered twins embodying language and mathematics, a plan to raise them to a higher power, and an attainable path to godhood; Publishers Weekly identifies their powers as incarnating the Doctrine of Ethos and commanding nature. Its alchemy is an explicit system of powers, creation, ascent and cost."},{"title":"The Old Kingdom","cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-sabriel-pichi.jpg","shows_english_title":true,"authors":["Garth Nix"],"year":1995,"books":[{"title":"Sabriel","year":1995,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-sabriel-pichi.jpg"},{"title":"Lirael","year":2001,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-lireal-pichi.jpg"},{"title":"Abhorsen","year":2003,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-abhorsen-pichi-1.jpg"},{"title":"Clariel","year":2014,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-clariel-pichi.jpg"},{"title":"Goldenhand","year":2016,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-goldenhand-pichi.jpg"},{"title":"Terciel & Elinor","year":2021,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-terciel-and-elinor-pichi.jpg"}],"placement_note":"Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Hard magic. Nix’s official synopsis establishes the Old Kingdom, Charter Mages, Free Magic, the Abhorsen and a quest against forces of life and death; the official system gives seven named bells with distinct effects, Charter marks, costs and boundaries. Quest fantasy loses because the rule-bound Charter/Free Magic and necromancy system is the series’ distinctive engine."},{"title":"The Book of Elementals","cover_url":"https://covers.openlibrary.org/b/id/8021202-L.jpg","shows_english_title":true,"authors":["Phyllis Eisenstein"],"year":1979,"books":[{"title":"Sorcerer's Son","year":1979,"cover_url":"https://covers.openlibrary.org/b/id/8021202-L.jpg"},{"title":"The Crystal Palace","year":1988}],"placement_note":"SFE specifically treats the sequence's apprenticeship, demon conjuration and elemental magic as magic practiced as a form of science; the systematic magical method governs

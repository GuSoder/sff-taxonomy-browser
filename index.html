*{box-sizing:border-box}html,body{margin:0;background:#05070b;color:white;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;height:100%;overflow:hidden}.app{height:100dvh;position:relative;overflow:hidden;touch-action:pan-y}.bg{position:absolute;inset:0;background:#10151e center/cover no-repeat;transition:opacity .18s}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.05) 42%,rgba(3,5,9,.96) 82%)}.placeholder{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#31405b,#111722 48%,#05070b);font-size:96px;color:#8ea4c6}.top{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(#000b,transparent 14%)}.crumb{position:absolute;top:calc(env(safe-area-inset-top) + 50px);left:18px;right:18px;text-align:center;font-size:13px;color:#d3d9e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{position:absolute;right:16px;border:0;background:#151a24dd;color:white;border-radius:999px;width:44px;height:44px;font-size:20px;pointer-events:auto;box-shadow:0 4px 18px #0005}.icon#back{top:calc(50% - 48px)}.icon#home{top:calc(50% + 4px)}.panel{position:absolute;left:0;right:0;bottom:0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);z-index:2;max-height:46dvh;overflow:auto;overflow-anchor:none}.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b4c1d2}.title{font-size:clamp(34px,10vw,54px);line-height:.94;margin:7px 0 12px;text-wrap:balance;text-shadow:0 2px 14px #000}.hint{font-size:13px;color:#c5ceda;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;border:1px solid #ffffff2b;background:#151b25 center/cover no-repeat;color:white;border-radius:18px;padding:0;text-align:left;font-size:15px;min-height:142px;overflow:hidden;box-shadow:0 8px 24px #0005}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0001 24%,#05070bee 100%)}.card.placeholder-card{background:radial-gradient(circle at 50% 34%,#31405b,#111722 58%,#05070b)}.card .card-star{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;color:#8ea4c6}.card .card-label{position:absolute;left:13px;right:13px;bottom:12px;z-index:1;font-weight:650;line-height:1.12;text-shadow:0 2px 10px #000}.works{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:#dae0e8}.work{position:relative;aspect-ratio:2/3;border:1px solid #ffffff22;border-radius:16px;overflow:hidden;background:#ffffff0b}.work img{width:100%;height:100%;object-fit:cover;display:block}.work-placeholder{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff0b,#ffffff03);color:#ffffff55;font-size:34px}.work-label{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 10px;background:linear-gradient(transparent,#05070bee);font-size:13px;line-height:1.2}.work-label.hidden{display:none}.dots{position:absolute;top:calc(env(safe-area-inset-top) + 19px);left:50%;transform:translateX(-50%);z-index:4;display:flex;flex-direction:row;gap:7px}.dot{width:5px;height:5px;background:#fff6;border-radius:50%}.dot.on{background:white;transform:scale(1.5)}@media(min-width:700px){.panel{max-width:560px;left:50%;transform:translateX(-50%)}.bg{background-size:contain}}
.booklist{display:flex;flex-direction:column;gap:8px}.bookrow{display:flex;gap:10px;align-items:center;background:#0d111add;border:1px solid #ffffff1c;border-radius:12px;padding:8px 10px;text-align:left}.bookrow img{width:34px;height:51px;object-fit:cover;border-radius:4px}.bookph{width:34px;height:51px;flex:none;display:grid;place-items:center;color:#8ea4c6;background:#ffffff0a;border-radius:4px}.bookrow b{display:block;font-size:14px;line-height:1.15}.bookrow span{font-size:12px;color:#aeb8c6}.work{cursor:pointer}.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bookcard{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;border:1px solid #ffffff22;cursor:pointer;background:#ffffff0b}.bookcard img{width:100%;height:100%;object-fit:cover;display:block}.bookcard .bc-label{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 6px;background:linear-gradient(transparent,#05070bee);font-size:11px;line-height:1.15}.blurb{font-size:13.5px;line-height:1.5;color:#dde4ee;background:#0d111acc;border:1px solid #ffffff1c;border-radius:12px;padding:10px 12px}.blurb a{color:#9fc1ff}.buy{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.buy a{font-size:12.5px;color:#0b0e14;background:#e8eef8;border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:600}.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b4c1d2;margin:14px 0 6px}.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}.strip .v{flex:0 0 auto;width:66px;cursor:pointer;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left}.strip .v img{width:66px;height:99px;object-fit:cover;border-radius:6px;border:2px solid transparent;display:block}.strip .v.on img{border-color:#fff}.strip .v{opacity:0;transition:opacity .25s ease-in}.strip .v.ld{opacity:1}.work img,.bookcard img{opacity:0;transition:opacity .25s ease-in}.work.ld img,.bookcard.ld img{opacity:1}.work:not(.ld),.bookcard:not(.ld){border-color:transparent;background:transparent}.work:not(.ld) .work-label.hidden{display:block}@keyframes ltr{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.title .w{display:inline-block;white-space:nowrap}.title .l{display:inline-block;opacity:0;animation:ltr .3s ease forwards}.panel.hero .count,.panel.hero .hint,.panel.hero #content{opacity:0;transition:opacity .35s}.panel.hero.revealed .count,.panel.hero.revealed .hint,.panel.hero.revealed #content{opacity:1}.bookcard.dim img{filter:grayscale(.7)}.bookcard.dim.ld img{opacity:.32}.strip .v small{display:block;font-size:9.5px;color:#b9c3d1;margin-top:3px;line-height:1.25;width:70px}</style></head><body><main class="app" id="app"><div class="bg" id="bg"></div><div class="top"><button class="icon" id="back" aria-label="Parent">‹</button><div class="crumb" id="crumb"></div><button class="icon" id="home" aria-label="Home">⌂</button></div><div class="dots" id="dots"></div><section class="panel"><div class="count" id="count"></div><h1 class="title" id="title"></h1><div class="hint" id="hint"></div><div id="content"></div></section></main><script>
const nodes=[{"id":"dark-fantasy","label":"Dark fantasy","parent":"supernatural-and-dark-fiction","children":[],"works":[{"title":"Between Two Fires","cover_url":"https://covers.openlibrary.org/b/id/8441116-L.jpg","shows_english_title":true,"authors":["Christopher Buehlman"],"year":2012},{"title":"Something Wicked This Way Comes","cover_url":"https://covers.openlibrary.org/b/id/12376825-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1962},{"title":"Black Easter","cover_url":"https://covers.openlibrary.org/b/isbn/9780140034165-L.jpg","shows_english_title":true,"authors":["James Blish"],"year":1968,"books":[{"title":"Black Easter","year":1968,"cover_url":"https://covers.openlibrary.org/b/isbn/9780140034165-L.jpg"},{"title":"The Day After Judgment","year":1971,"cover_url":"https://covers.openlibrary.org/b/id/9396106-L.jpg"}]},{"title":"I Am the River","cover_url":"https://tegrau.com/wp-content/uploads/2018/05/i-am-the-river-cover-may-15-2018.jpg?w=1366","shows_english_title":true,"authors":["T. E. Grau"],"year":2018,"placement_note":"Publishers Weekly follows a traumatized Vietnam veteran back into the Laotian jungle through visions of Black Shuck and a rising supernatural river; the author calls it a Vietnam-era cosmic-horror novel. Historical war trauma becoming an inescapable supernatural nightmare makes Dark fantasy closest."},{"title":"Soul Eater","cover_url":"https://www.worldswithoutend.com/covers/kwj_souleate.jpg","shows_english_title":true,"authors":["K. W. Jeter"],"year":1983,"placement_note":"SFE calls the novel an accomplished work without SF consolations; the grounded synopsis centers a comatose mother using occult soul-transfer to possess her daughter and destroy her former husband. It passes Fantasy -> Real Earth Universe -> Supernatural and dark fiction; the human occult predator is neither a demon nor an ancient tormentor, and the grim possession/family nightmare makes Dark fantasy the closest existing pure leaf."},{"title":"Temper","cover_url":"https://www.nickydrayden.com/images/books/temper.jpg","shows_english_title":true,"authors":["Nicky Drayden"],"year":2018,"placement_note":"The author explicitly calls it genre-blending dark fantasy in an alternate Cape Town: twin brothers are branded by socially assigned virtues/vices and battle literal demons amid oppression. Publishers Weekly confirms violent mystical forces, twisted prophecy and cataclysmic change. It passes Fantasy -> Real Earth Universe -> Supernatural dark; demonic possession and moral horror make Dark fantasy closest."},{"title":"The Bridge","cover_url":"https://meerkatpress.com/wp-content/uploads/2019/10/9781946154453-533x800.jpg","shows_english_title":true,"authors":["J. S. Breukelaar"],"year":2021}],"image":"9-dark-fantasy.webp","definition":"","status":"candidate"},{"id":"epic-fantasy","label":"Epic fantasy","parent":"fantasy-realms","children":["heroic-fantasy","high-fantasy","political-fantasy","hard-magic","invented-mythology","military-fantasy"],"works":[],"image":"11-epic-fantasy.webp","definition":"Fantasy driven by worldbuilding at epic scale: long journeys, wars, political stakes, large geographies, cosmic systems and invented gods.","status":"candidate"},{"id":"military-fantasy","label":"Military fantasy","parent":"epic-fantasy","children":[],"works":[{"title":"Malazan Book of the Fallen","cover_url":"https://covers.openlibrary.org/b/id/374277-L.jpg","shows_english_title":true,"authors":["Steven Erikson"],"year":1999,"books":[{"title":"Gardens of the Moon","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/374277-L.jpg"},{"title":"Deadhouse Gates","year":2000,"cover_url":"https://covers.openlibrary.org/b/isbn/9780553813111-L.jpg"},{"title":"Memories of Ice","year":2001,"cover_url":"https://covers.openlibrary.org/b/id/524439-L.jpg"},{"title":"House of Chains","year":2002,"cover_url":"https://covers.openlibrary.org/b/id/374327-L.jpg"},{"title":"Midnight Tides","year":2004,"cover_url":"https://covers.openlibrary.org/b/id/524762-L.jpg"},{"title":"The Bonehunters","year":2006,"cover_url":"https://covers.openlibrary.org/b/isbn/9780593046302-L.jpg"},{"title":"Reaper's Gale","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/386149-L.jpg"},{"title":"Toll the Hounds","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/6684006-L.jpg"},{"title":"Dust of Dreams","year":2009,"cover_url":"https://covers.openlibrary.org/b/id/6304352-L.jpg"},{"title":"The Crippled God","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/9720396-L.jpg"}]},{"title":"Siege trilogy","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316270793.jpg?w=640","shows_english_title":true,"authors":["K. J. Parker"],"year":2019,"books":[{"title":"Sixteen Ways to Defend a Walled City","year":2019,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316270793.jpg?w=640"},{"title":"How to Rule an Empire and Get Away with It","year":2020,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2020/08/9780316498678-1.jpg"},{"title":"A Practical Guide to Conquering the World","year":2022,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2022/01/9780316498616.jpg"}],"placement_note":"An invented Roman-like empire; the trilogy is organized around siegecraft, defense, rule, and finally a war to end all wars, seen through engineers and pragmatic participants."}],"image":"232-military-fantasy.webp","definition":"Epic fantasy organized around armies, campaigns, soldiers and war seen from the ranks. Military fantasy is an established reader term, with The Black Company widely treated as a codifier.","status":"accepted"},{"id":"heroic-fantasy","label":"Heroic fantasy","parent":"epic-fantasy","children":["caster-heroes","martial-heroes","npc-heroes"],"works":[],"image":"1-3-heroic-fantasy.webp","definition":"Hero-centered fantasy organized as an RPG-class tree by the protagonist’s primary power source: spellcraft, martial skill, or no adventuring class.","status":"accepted"},{"id":"caster-heroes","label":"Caster Heroes","parent":"heroic-fantasy","children":["bard-hero","mage-hero","cleric-hero","paladin-hero"],"works":[],"image":"189-caster-heroes.webp","definition":"Heroic fantasy whose protagonist’s primary power source is spellcraft, sacred power, magical performance or an empowered oath; setting and tone do not decide the class.","status":"accepted"},{"id":"martial-heroes","label":"Martial Heroes","parent":"heroic-fantasy","children":["warrior-hero","rogue-hero","ranger-hero"],"works":[],"image":"190-martial-heroes.webp","definition":"Heroic fantasy whose protagonist’s primary power source is trained physical skill, weapons, stealth or wilderness craft; setting and tone do not decide the class.","status":"accepted"},{"id":"npc-heroes","label":"NPC Heroes","parent":"heroic-fantasy","children":[],"works":[{"title":"The Goblin Emperor","cover_url":"https://covers.openlibrary.org/b/id/9319294-L.jpg","shows_english_title":true,"authors":["Katherine Addison"],"year":2014,"books":[{"title":"The Goblin Emperor","year":2014},{"title":"The Witness for the Dead","year":2021},{"title":"The Grief of Stones","year":2022}]}],"image":"191-npc-heroes.webp","definition":"Heroic fantasy whose protagonist has no adventuring class: authority comes from ordinary judgment, social position, empathy or civic action rather than spellcraft or combat skill.","status":"accepted"},{"id":"bard-hero","label":"Bard Hero","parent":"caster-heroes","children":[],"works":[{"title":"The Kingkiller Chronicle","cover_url":"https://covers.openlibrary.org/b/id/12065980-L.jpg","shows_english_title":false,"authors":["Patrick Rothfuss"],"year":2007,"books":[{"title":"The Name of the Wind","year":2007},{"title":"The Wise Man's Fear","year":2011}]}],"image":"192-bard-hero.webp","definition":"Caster-hero fantasy whose protagonist’s primary power comes through performance, words, lore and charismatic magical artistry.","status":"accepted"},{"id":"mage-hero","label":"Mage Hero","parent":"caster-heroes","children":[],"works":[{"title":"Earthsea","cover_url":"https://covers.openlibrary.org/b/id/8784027-L.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":1968,"books":[{"title":"A Wizard of Earthsea","year":1968,"authors":["Ursula K. Le Guin"],"cover_url":"https://covers.openlibrary.org/b/id/14608471-L.jpg","blurb":"Ged was the greatest sorcerer in Earthsea, but in his youth he was the reckless Sparrowhawk. In his hunger for power and knowledge, he tampered with long-held secrets and loosed a terrible shadow upon the world. This is the tale of his testing, how he mastered the mighty words of power, tamed an ancient dragon, and crossed death's threshold to restore the balance.","blurb_source":"https://openlibrary.org/works/OL59798W","buy":[{"label":"Adlibris","url":"https://www.adlibris.com/se/sok?q=A%20Wizard%20of%20Earthsea%20Ursula%20K.%20Le%20Guin"},{"label":"Amazon","url":"https://www.amazon.com/s?k=A%20Wizard%20of%20Earthsea%20Ursula%20K.%20Le%20Guin"}],"versions":[{"cover_url":"https://covers.openlibrary.org/b/id/14608471-L.jpg","credit":"Parnassus Press / Ruth Robbins, 1968"},{"cover_url":"https://covers.openlibrary.org/b/id/101298-L.jpg","credit":"Puffin, 1971"},{"cover_url":"https://covers.openlibrary.org/b/id/8902652-L.jpg","credit":"Puffin, 1973"},{"cover_url":"https://covers.openlibrary.org/b/id/15226829-L.jpg","credit":"Bantam, 1979"},{"cover_url":"https://covers.openlibrary.org/b/id/4672639-L.jpg","credit":"Bantam, 1984"},{"cover_url":"https://covers.openlibrary.org/b/id/9641870-L.jpg","credit":"Penguin, 1986"},{"cover_url":"https://covers.openlibrary.org/b/id/10509685-L.jpg","credit":"HMH, 2012"},{"cover_url":"https://covers.openlibrary.org/b/id/14322315-L.jpg","credit":"Gollancz / Charles Vess, 2019"},{"cover_url":"https://covers.openlibrary.org/b/id/7269371-L.jpg","credit":"Bantam / Ruth Robbins"}]},{"title":"The Tombs of Atuan","year":1971,"authors":["Ursula K. Le Guin"],"cover_url":"https://covers.openlibrary.org/b/id/101325-L.jpg","blurb":"Arha's isolated existence as high priestess in the tombs of Atuan is jarred by a thief who seeks a special treasure.","blurb_source":"https://openlibrary.org/works/OL59801W","buy":[{"label":"Adlibris","url":"https://www.adlibris.com/se/sok?q=The%20Tombs%20of%20Atuan%20Ursula%20K.%20Le%20Guin"},{"label":"Amazon","url":"https://www.amazon.com/s?k=The%20Tombs%20of%20Atuan%20Ursula%20K.%20Le%20Guin"}],"versions":[{"cover_url":"https://covers.openlibrary.org/b/id/101325-L.jpg","credit":"Puffin, 1974"},{"cover_url":"https://covers.openlibrary.org/b/id/10768657-L.jpg","credit":"Bantam"},{"cover_url":"https://covers.openlibrary.org/b/id/368884-L.jpg","credit":"Bantam, 1984"},{"cover_url":"https://covers.openlibrary.org/b/id/433335-L.jpg","credit":"Atheneum, 2001"},{"cover_url":"https://covers.openlibrary.org/b/id/436612-L.jpg","credit":"Simon Pulse, 2001"},{"cover_url":"https://covers.openlibrary.org/b/id/9070742-L.jpg","credit":"Saga Press, 2012"}]},{"title":"The Farthest Shore","year":1972,"authors":["Ursula K. Le Guin"],"cover_url":"https://covers.openlibrary.org/b/id/368813-L.jpg","blurb":"Darkness threatens to overtake Earthsea. As the world and its wizards are losing their magic, Ged - powerful Archmage, wizard, and dragonlord - embarks on a sailing journey with highborn young prince Arren. They travel far beyond the realm of death to discover the cause.","blurb_source":"https://openlibrary.org/works/OL59855W","buy":[{"label":"Adlibris","url":"https://www.adlibris.com/se/sok?q=The%20Farthest%20Shore%20Ursula%20K.%20Le%20Guin"},{"label":"Amazon","url":"https://www.amazon.com/s?k=The%20Farthest%20Shore%20Ursula%20K.%20Le%20Guin"}],"versions":[{"cover_url":"https://covers.openlibrary.org/b/id/9463227-L.jpg","credit":"Atheneum / Gail Garraty, 1972"},{"cover_url":"https://covers.openlibrary.org/b/id/6938505-L.jpg","credit":"Bantam, 1975"},{"cover_url":"https://covers.openlibrary.org/b/ thors":["James Thurber"],"year":1950,"placement_note":"Gustav's 2026-09-21 ruling. PRH grounds an original fairy tale in which Prince Zorn and the magical Golux must rescue Saralinda from the wicked Duke by completing impossible conditions and restarting thirteen enchanted clocks. Fairy-tale grammar and impossible-task quest govern; comic wordplay is the mode, not the shelf."}],"image":"256-fairytalesque-quest-fantasy.webp","definition":"Original-world quests shaped by fairy-tale grammar - curses, impossible tasks, witches and enchanted objects - without retelling a specific inherited tale.","status":"accepted"},{"id":"sword-and-sorcery","label":"Sword and sorcery","parent":"fantasy-realms","children":["caper-fantasy","sword-and-planet","fantasy-mystery","comic-fantasy","isolationist-fantasy","fantasy-of-manners","technofantasy","classic-sword-and-sorcery"],"works":[],"image":"7-sword-and-sorcery.webp","definition":"Action-forward fantasy celebrating combat, glistening spells, clashing swords and the thrill of battle, while retaining the intimate, less solemn and broadly adventurous pulp tradition named by its literal “and”.","status":"accepted"},{"id":"fairy-tale-revision","label":"Fairy-tale revision","parent":"fantasy-realms","children":["fairy-tale-inversion","fairy-tale-transplant","fairy-tale-expansion"],"works":[],"image":"1-fairy-tale-revision.webp","definition":"An umbrella for fiction that deliberately revises a recognizable fairy tale through inversion, transplantation, or expansion.","status":"accepted"},{"id":"mythic-retelling","label":"Mythic retelling","parent":"real-earth-universe","children":["arthurian-fantasy","greek-myth-fantasy","norse-fantasy","mayan-myth-fantasy","navajo-myth-fantasy"],"works":[],"image":"5-mythic-retelling.webp","definition":"Fantasy anchored to an inherited story, whose source is the myth itself: it retells or reimagines named figures and narratives from mythology or legend. Mythic-age settings such as Homeric Greece and Arthurian Britain count as retelling territory.","status":"umbrella"},{"id":"arthurian-fantasy","label":"Arthurian fantasy","parent":"mythic-retelling","children":[],"works":[{"title":"Avalon","cover_url":"https://covers.openlibrary.org/b/id/14648001-L.jpg","shows_english_title":false,"authors":["Marion Zimmer Bradley"],"year":1982,"books":[{"title":"The Mists of Avalon","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/14648001-L.jpg","shows_english_title":true},{"title":"The Forest House","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/6411361-L.jpg","shows_english_title":true},{"title":"Lady of Avalon","year":1997,"cover_url":"https://covers.openlibrary.org/b/id/8773510-L.jpg","shows_english_title":true},{"title":"Priestess of Avalon","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/13859344-L.jpg","shows_english_title":true},{"title":"Ancestors of Avalon","year":2004,"cover_url":"https://covers.openlibrary.org/b/id/10134-L.jpg","shows_english_title":true}]},{"title":"The Once and Future King","cover_url":"https://covers.openlibrary.org/b/id/15029718-L.jpg","shows_english_title":false,"authors":["T. H. White"],"year":1958,"books":[{"title":"The Sword in the Stone","year":1938,"cover_url":"https://covers.openlibrary.org/b/id/283473-L.jpg","shows_english_title":true},{"title":"The Queen of Air and Darkness","year":1939},{"title":"The Ill-Made Knight","year":1940},{"title":"The Candle in the Wind","year":1958}]},{"title":"Arthurian Saga","cover_url":"https://covers.openlibrary.org/b/id/592134-L.jpg","shows_english_title":true,"authors":["Mary Stewart"],"year":1970,"books":[{"title":"The Crystal Cave","year":1970,"cover_url":"https://covers.openlibrary.org/b/id/592134-L.jpg"},{"title":"The Hollow Hills","year":1973,"cover_url":"https://covers.openlibrary.org/b/id/4987866-L.jpg"},{"title":"The Last Enchantment","year":1979,"cover_url":"https://covers.openlibrary.org/b/id/4982059-L.jpg"},{"title":"The Wicked Day","year":1983,"cover_url" es Arthur, Avalon, Camelot, the Grail and the Matter of Britain.","status":"accepted"},{"id":"greek-myth-fantasy","label":"Greek myth fantasy","parent":"mythic-retelling","children":[],"works":[{"title":"Circe","cover_url":"https://res.cloudinary.com/bloomsbury-atlas/image/upload/w_360,c_scale/jackets/9781408890073.jpg","shows_english_title":true,"authors":["Madeline Miller"],"year":2018},{"title":"Phaedra","cover_url":"https://img.fablecdn.net/images/cdn.fable.co/covers/9781639101542.jpg?w=600","shows_english_title":true,"authors":["Laura Shepperson"],"year":2023},{"title":"The Song of Achilles","cover_url":"https://cdn.waterstones.com/bookjackets/large/9781/5266/9781526648174.jpg","shows_english_title":true,"authors":["Madeline Miller"],"year":2011},{"title":"The Minotaur Trilogy","cover_url":"https://covers.openlibrary.org/b/id/10186823-L.jpg","shows_english_title":true,"authors":["Thomas Burnett Swann"],"year":1966,"books":[{"title":"Cry Silver Bells","year":1977},{"title":"The Forest of Forever","year":1971},{"title":"Day of the Minotaur","year":1966,"cover_url":"https://covers.openlibrary.org/b/id/10186823-L.jpg"}],"placement_note":"SFE places Swann's three-book sequence in Mycenaean Crete among legendary peoples; Day retells the Minotaur as Eunostos, defender of the mythic old world, matching this leaf's mythic-age rule."},{"title":"Lovely War","cover_url":"https://images1.penguinrandomhouse.com/smedia/9780147512970","shows_english_title":true,"authors":["Julie Berry"],"year":2019,"placement_note":"Penguin Random House frames the World War love stories as testimony narrated by Aphrodite before a Mount Olympus judgment, with Greek gods holding mortal fates; Berry names Aphrodite, Ares, Hephaestus, Apollo and Hades as active narrators and witnesses. Reimagining named Greek gods through modern war stories makes Greek myth fantasy exact."}],"image":"165-greek-myth-fantasy.webp","definition":"Fantasy that retells or reimagines named figures and narratives from ancient Greek mythology and its heroic age.","status":"accepted"},{"id":"norse-fantasy","label":"Norse fantasy","parent":"mythic-retelling","children":[],"works":[{"title":"Grendel","cover_url":"https://covers.openlibrary.org/b/id/9948473-L.jpg","shows_english_title":true,"authors":["John Gardner"],"year":1971}],"image":"166-norse-fantasy.webp","definition":"Fantasy that retells or reimagines Norse and Northern Germanic mythic or legendary source material, rather than merely using the Viking Age as a setting.","status":"accepted"},{"id":"fantasy-mystery","label":"Fantasy mystery","parent":"sword-and-sorcery","children":[],"works":[{"title":"Shadow of the Leviathan","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/09/hbg-title-a-drop-of-corruption-7-115.jpg","shows_english_title":false,"authors":["Robert Jackson Bennett"],"year":2024,"books":[{"title":"The Tainted Cup","year":2024},{"title":"A Drop of Corruption","year":2025}]},{"title":"A Wizard's Guide to Defensive Baking","cover_url":"https://covers.openlibrary.org/b/id/10296774-L.jpg","shows_english_title":true,"authors":["T. Kingfisher"],"year":2020},{"title":"The Chronicles of Master Li and Number Ten Ox","cover_url":"https://images3.penguinrandomhouse.com/cover/9780345321381","shows_english_title":true,"authors":["Barry Hughart"],"year":1984,"books":[{"title":"Bridge of Birds","year":1984,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780345321381"},{"title":"The Story of the Stone","year":1988,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780307800978"},{"title":"Eight Skilled Gentlemen","year":1991,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780385417105"}]}],"image":"2-fantasy-mystery.webp","definition":"Fantasy fiction structured around investigating and solving a mystery whose evidence or solution depends on the fantastic world.","status":"provisional"},{"id":"fantasy","label":"Fantasy","parent":"speculative-fiction","children":["real-earth-universe","fantasy-realms","portal-fantasy"],"works":[],"image":"13-fantasy.webp","definition":"","status":"accepted"},{"id":"historical-fantasy","label":"Historical fantasy","parent":"real-earth-universe","children":["period-fantasy","secret-history","alternate-history-fantasy","pulp-fantasy"],"works":[],"image":"16-historical-fantasy.webp","definition":" Converted to an umbrella 2026-09-13 (Gustav: split by time period).","status":"umbrella"},{"id":"pulp-fantasy","label":"Pulp fantasy","parent":"historical-fantasy","children":[],"works":[{"title":"Roads","cover_url":"https://covers.openlibrary.org/b/id/740772-L.jpg","shows_english_title":true,"authors":["Seabury Quinn"],"year":1938,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. Quinn turns Christian legend into a Weird Tales Viking-gladiator Santa origin: religious/mythic material is used as knockabout pulp adventure rather than serious mythic retelling. Gustav’s 2026-09-20 gate routes unserious pulp retellings here, not to Mythic retelling."},{"title":"The Albion Triptych","cover_url":"https://www.valancourtbooks.com/uploads/2/7/0/1/27017582/7577186.jpg","shows_english_title":true,"authors":["Andrew Sinclair"],"year":1967,"books":[{"title":"Gog","year":1967,"cover_url":"https://www.valancourtbooks.com/uploads/2/7/0/1/27017582/7577186.jpg"},{"title":"Magog","year":1972},{"title":"King Ludd","year":1988,"cover_url":"https://covers.openlibrary.org/b/id/9434194-L.jpg"}],"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. SFE calls the Albion Triptych half satire and half mythopoesis; Valancourt describes its hilarious, horrific, bawdy and bizarre picaresque. Gustav’s 2026-09-20 seriousness gate routes unserious/knockabout treatments of mythic national history to Pulp fantasy rather than Mythic retelling."},{"title":"Slaves of Sleep","cover_url":"https://galaxypress.com/wp-content/uploads/2021/05/Print_Slaves-Masters-of-Sleep-Book.jpg","shows_english_title":true,"authors":["L. Ron Hubbard"],"year":1939,"books":[{"title":"Slaves of Sleep","year":1939},{"title":"The Masters of Sleep","year":1950}],"placement_note":"SFE's screwball pulp-fantasy Arabian Nights environment and the publisher's genie mythology make inherited myth in knockabout pulp mode governing; the dream-world crossing is the device."},{"title":"The Hood","cover_url":"cover-hood.jpg","shows_english_title":true,"authors":["Lavie Tidhar"],"year":2021,"placement_note":"Walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. Tidhar grounds Norman England in 1145, then remixes Robin Hood with resurrection from body parts, a monster-killing bone harpist and fae conversion. The author calls it playful, subversive, profane and ambitious; the savage knockabout remix of English legend matches the existing Pulp fantasy gate rather than the serious Mythic retelling branch."}],"definition":"Historical fantasy in the pulp-adventure mode: fast, sensational, knockabout treatments of past eras, religious legends or mythic material that use history as a lurid stage rather than treating inherited myth with seriousness. “Pulp fantasy” is a taxonomy coinage built on an attested descriptive phrase, not an established shelf headword.","image":"236-pulp-fantasy.webp","representative_cover":"https://covers.openlibrary.org/b/id/740772-L.jpg"},{"id":"paranormal-fantasy","label":"Paranormal fantasy","parent":"supernatural-and-dark-fiction","children":[],"works":[{"title":"American Gods","cover_url":"https://www.fictiondb.com/covers/0380789035.jpg","shows_english_title":true,"authors":["Neil Gaiman"],"year":2001,"books":[{"title":"American Gods","year":2001},{"title":"Anansi Boys","year":2005}]},{"title":"Good Omens","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/11/hbg-title-the-illustrated-good-omens-112.jpg","shows_english_title":true,"authors":["Terry Pratchett","Neil Gaiman"],"year":1990},{"title":"The Invisible Life of Addie LaRue","cover_url":"https://mpd-biblio-covers.imgix.net/9780765387561.jpg","shows_english_title":true,"authors":["V. E. Schwab"],"year":2020},{"title":"No Hero","cover_url":"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1344102132i/10708694.jpg","shows_english_title":true,"authors":["Jonathan Wood"],"year":2014,"books":[{"title":"No Hero","year":2014},{"title":"Yesterday's Hero","year":2014}]},{"title":"Dr. Greta Helsing","cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1522680744925-5VXHVR2DFMFH5IIHASC5/97803164346141.jpg","shows_english_title":true,"authors":["Vivian Shaw"],"year":2017,"books":[{"title":"Strange Practice","year":2017,"cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1522680744925-5VXHVR2DFMFH5IIHASC5/97803164346141.jpg"},{"title":"Dreadful Company","year":2018,"cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1601568309288-RHYOI8MM40HJL8LBCL7Y/Shaw_Dreadful-Company_PB.jpg"},{"title":"Grave Importance","year":2019,"cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1601568636778-9E3FW5JVWEIYIXB5IAL2/Grave-Importance-cover-660x1017.jpg"}],"placement_note":"The author and Hachette define a world adjacent to ours where monsters are real and Greta treats vampires, mummies, ghouls and other undead patients. Its contemporary supernatural society and creature ensemble make Paranormal fantasy closest."},{"title":"The Sixth World","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534413504/trail-of-lightning-9781534413504_lg.jpg","shows_english_title":true,"authors":["Rebecca Roanhorse"],"year":2018,"books":[{"title":"Trail of Lightning","year":2018,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534413504/trail-of-lightning-9781534413504_lg.jpg"},{"title":"Storm of Locusts","year":2019,"cover_url":"https://d28hgpri8 "Thomas M. Disch"],"year":1984,"books":[{"title":"The Businessman","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/8272034-L.jpg"},{"title":"The M.D.","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/4037504-L.jpg"},{"title":"The Priest","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/417652-L.jpg"},{"title":"The Sub","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/418441-L.jpg"}]},{"title":"Ninth House","cover_url":"https://covers.openlibrary.org/b/id/12667414-L.jpg","shows_english_title":true,"authors":["Leigh Bardugo"],"year":2019,"placement_note":"Alex Stern can see the dead and is recruited to police Yale secret societies whose tombs run real occult rites - portal surgery, shape-shifting, drug-fueled communion. Occult systems operating inside a contemporary institution make Modern occult the closest leaf (cf. Conjure Wife campus witchcraft). Ghost presence is strong but serves the occult-institution frame."},{"title":"Sandman Slim","cover_url":"https://covers.openlibrary.org/b/id/8429564-L.jpg","shows_english_title":true,"authors":["Richard Kadrey"],"year":2009,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Urban fantasy -> Modern Goth -> Modern Occult. SFE places the sequence in monster-irradiated modern Los Angeles with horror, Hell and occult violence; Publishers Weekly centers a returned Hell hitman pursuing a black magician through magic-riddled LA. Modern Occult wins because occult systems and actors operate through the contemporary city; Occult police fails because Stark is a vigilante, not law enforcement."}],"definition":"Modern Gothic in which occult systems operate inside contemporary institutions, professions, cities and organized social life.","status":"accepted","image":"200-modern-occult.webp"},{"id":"suburban-gothic","label":"Suburban Gothic","parent":"modern-goth","children":[],"works":[{"title":"Fear","cover_url":"https://covers.openlibrary.org/b/id/6821701-L.jpg","shows_english_title":true,"authors":["L. Ron Hubbard"],"year":1940,"placement_note":"SFE calls Fear a classic psychological study of a man tortured by repressed hours and the demons of guilt; Galaxy Press describes a contemporary skeptic pursued by an evil that turns his familiar town against him. Its modern everyday world becoming a persecutory supernatural labyrinth fits Modern Goth."},{"title":"Good Neighbors","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781982144371/good-neighbors-9781982144371_lg.jpg","shows_english_title":true,"authors":["Sarah Langan"],"year":2021,"placement_note":"SFE calls it a near-future Horror in SF tale about a Long Island community disintegrating after a sinkhole appears; Simon & Schuster frames suburban deception, exclusion and collective menace. Contemporary social life curdling into uncanny horror makes Modern Goth closest."},{"title":"Pet","cover_url":"https://covers.openlibrary.org/b/id/8793960-L.jpg","shows_english_title":true,"authors":["Akwaeke Emezi"],"year":2019,"placement_note":"Lucille is a utopian town taught that angels destroyed all monsters; the creature Pet steps out of a painting to hunt a monster - an abuser hidden inside an ordinary family the community refuses to see. The ordinary community is the source of hidden persecution and uncanny menace: the suburban-gothic thesis. Runner-up contemporary-fantasy (left at 9; would have forced a partition proposal). Shelfmates: Fear, Good Neighbors. National Book Award finalist; Stonewall winner."}],"definition":"Modern Gothic in which the neighborhood or ordinary community becomes the source of persecution, exclusion and uncanny menace.","status":"accepted","image":"201-suburban-gothic.webp"},{"id":"war-gothic","label":"War Gothic","parent":"modern-goth","children":[],"works":[{"title":"Frankenstein in Baghdad","cover_url":"https://images1.penguinrandomhouse.com/cover/9780143128793","shows_english_title":true,"authors":["Ahmed Saadawi"],"year":2013,"placement_note":"SFE identifies a corpse assembled from bombing victims and possessed by a dead guard's soul; PRH confirms the unkillable flesh-eating monster stalking occupied Baghdad. A contemporary city haunted by war's accumulated dead makes Modern Goth the closest leaf."}],"definition":"Modern Gothic in which war's unresolved dead and accumulated violence return to haunt the contemporary world.","status":"accepted","image":"202-war-gothic.webp"},{"id":"speculative-fiction","label":"Speculative fiction","parent":null,"children":["fantasy","science-fiction"],"works":[],"image":"23-speculative-fiction.webp","definition":"Working project root; exact scope is an open decision.","status":"provisional"},{"id":"fabulation","label":"Fabulation","parent":"atemporal","children":["books-in-books","classic-fabulation","inner-space","body-myth","alternate-worlds","godgame"],"works":[],"image":"109-fabulation.webp","definition":"Experimental speculative fiction that foregrounds the act and arbitrariness of storytelling, using fantastic devices to challenge whether a world can be seen or reliably told (SFE Fabulation).","status":"accepted"},{"id":"new-weird","label":"New Weird","parent":"atemporal","children":[],"works":[{"title":"Bas-Lag","cover_url":"https://images.penguinrandomhouse.com/cover/9780345443021","shows_english_title":false,"authors":["China Miéville"],"year":2000,"books":[{"title":"Perdido Street Station","year":2000},{"title":"The Scar","year":2002},{"title":"Iron Council","year":2004}]},{"title":"The Southern Reach Trilogy","cover_url":"https://images.booksense.com/images/042/824/9781250824042.jpg","shows_english_title":false,"authors":["Jeff VanderMeer"],"year":2014,"books":[{"title":"Annihilation","year":2014},{"title":"Authority","year":2014},{"title":"Acceptance","year":2014}]},{"title":"The Iron Dragon","cover_url":"https://covers.openlibrary.org/b/id/10031333-L.jpg","shows_english_title":true,"authors":["Michael Swanwick"],"year":1993,"books":[{"title":"The Iron Dragon's Daughter","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/10031333-L.jpg"},{"title":"The Dragons of Babel","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/2615790-L.jpg"},{"title":"The Iron Dragon's Mother","year":2019}]},{"title":"Cyber Mage","cover_url":"https://images.squarespace-cdn.com/content/v1/669172a9220c0d23ff8b86f1/ed55ee60-d1ea-4f3a-a865-eb073da1e977/CyberMage.jpg","shows_english_title":true,"authors":["Saad Z. Hossain"],"year":2021},{"title":"Dead Astronauts","cover_url":"https://s3.amazonaws.com/mcdbookimages/books/cover_images/000/000/162/reg/9780374720704_FC.jpg?1647524192","shows_english_title":true,"authors":["Jeff VanderMeer"],"year":2019,"placement_note":"SFE describes a surrealized SF Western and Time Opera whose typographical games enact bodily chaos across ruined worlds; SF, fantasy, ecological horror and formal mutation make New Weird closest."},{"title":"Her Body and Other Parties","cover_url":"https://images.squarespace-cdn.com/content/v1/58c1cee25016e17d84e3a1b8/1513195149247-V4C3H5Z51Q182NELWQF9/GW-HerBodyandOtherParties-Frontcover.jpg","shows_english_title":true,"authors":["Carmen Maria Machado"],"year":2017,"placement_note":"Graywolf says the collection deliberately collapses psychological realism, science fiction, horror, fantasy and fabulism; the Guardian likewise finds horror, SF and fairy tale merging across bodily transformations and formally daring stories. That radical hybrid of contemporary horror and speculative estrangement makes New Weird the closest existing leaf."}],"image":"18-new-weird.webp","definition":"Cross-genre speculative fiction that freely mingles science-fiction, dark-fantasy, and horror modes, often using strange, materially detailed settings, grotesquerie, ecological unease, or transformations that resist a single explanatory genre.","status":"accepted"},{"id":"alien-invasion-fiction","label":"Alien invasion fiction","parent":"modern-day","children":[],"works":[{"title":"The Aleutian Trilogy","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/03/hbg-title-white-queen-2-28.jpg","shows_english_title":false,"authors":["Gwyneth Jones"],"year":1991,"books":[{"title":"White Queen","year":1991},{"title":"North Wind","year":1994},{"title":"Phoenix Café","year":1997}]},{"title":"Footfall","cover_url":"https://upload.wikimedia.org/wikipedia/en/b/b0/Footfall%281stEd%29.jpg","shows_english_title":true,"authors":["Larry Niven","Jerry Pournelle"],"year":1985},{"title":"The War of the Worlds","cover_url":"https://images.penguinrandomhouse.com/cover/9780451530653","shows_english_title":true,"authors":["H. G. Wells"],"year":1898},{"title":"The Midwich Cuckoos","cover_url":"https://covers.openlibrary.org/b/id/8037293-L.jpg","shows_english_title":true,"authors":["John Wyndham"],"year":1957},{"title":"Annex","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/05/hbg-title-annex-2.jpg?w=450","shows_english_title":true,"authors":["Rich Larson"],"year":2018},{"title":"Nova Express","cover_url":"https://covers.openlibrary.org/b/id/14303348-L.jpg","shows_english_title":true,"authors":["William S. Burroughs"],"year":1964,"placement_note":"SFE burroughs_william_s: Nova Express brings sf metaphors into lurid perspective - the 'Nova Mob', galactic gangsters taking over our planet; images of space flight and biomorphic horror. Alien occupation of Earth -> alien-invasion-fiction."}],"image":"4-alien-invasion-fiction.webp","definition":"Science fiction centered on extraterrestrial forces attacking, occupying, colonizing, or attempting to conquer Earth or another human world.","status":"accepted"},{"id":"genetic-engineering","label":"Genetic Engineering","parent":"modern-day","children":[],"works":[{"title":"Jurassic Park","year":1990,"authors":["Michael Crichton"],"cover_url":"https://covers.openlibrary.org/b/id/8749000-L.jpg","shows_english_title":true,"books":[{"title":"Jurassic Park","year":1990,"authors":["Michael Crichton"],"cover_url":"https://covers.openlibrary.org/b/id/8749000-L.jpg"},{"title":"The Lost World","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/10656102-L.jpg"}],"placement_note":"SFE Crichton says the Jurassic Park sequence argues the risks of uncontrolled genetic engineering, with dinosaurs reconstructed from genetic scraps; the science is the story engine."},{"title":"Never Let Me Go","cover_url":"https://covers.openlibrary.org/b/id/6543832-L.jpg","shows_english_title":true,"authors":["Kazuo Ishiguro"],"year":2005},{"title":"Ghost Species","cover_url":"https://cdn2.penguin.com.au/covers/400/9781926428666.jpg","shows_english_title":true,"authors":["James Bradley"],"year":2020,"placement_note":"SFE and Penguin describe a secret project using genetic reconstruction to resurrect extinct species and create a Neanderthal child. Deliberate reconstruction of an extinct human genome drives the premise, making Genetic Engineering closest."},{"title":"Sorrowland","cover_url":"https://mpd-biblio-covers.imgix.net/9780374266776.jpg","shows_english_title":true,"authors":["Rivers Solomon"],"year":2021,"placement_note":"A secret government experiment implants Cainland's residents with a fungal organism; Vern develops superhuman healing, strength and an exoskeleton. Gothic/cult horror is the mode, deliberate biological reconstruction the engine."},{"title":"The Echo Wife","cover_url":"271-the-echo-wife.jpg","shows_english_title":true,"authors":["Sarah Gailey"],"year":2021,"placement_note":"SFE and Macmillan center cloning researcher Evelyn Caldwell and Martine, a genetically cloned replica made from her work. Deliberate human genetic replication drives the domestic thriller, making Genetic Engineering exact."}],"image":"110-genetic-engineering.webp","definition":"Science fiction in which deliberate manipulation, reconstruction, or design of genes and living organisms drives the premise (SFE Genetic Engineering).","status":"accepted"},{"id":"first-contact-fiction","label":"Earthbound 1st Contact","parent":"modern-day","children":["alien-arrival","alien-message"],"works":[],"image":"211-earthbound-first-contact.webp","definition":"First-contact fiction whose defining encounter reaches humanity on recognizable present-day Earth, whether through physical arrival or a message, voice, mind, signal, or artifact.","status":"accepted"},{"id":"alien-arrival","label":"Alien Arrival","parent":"first-contact-fiction","children":[],"works":[{"title":"Agent to the Stars","cover_url":"https://www.scalzi.com/whatever/a2scover2.jpg","shows_english_title":true,"authors":["John Scalzi"],"year":2005},{"title":"Childhood's End","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-childhoods-end-2-159.jpg","shows_english_title":true,"authors":["Arthur C. Clarke"],"year":1953},{"title":"Way Station","cover_url":"https://covers.openlibrary.org/b/id/15220517-L.jpg","shows_english_title":true,"authors":["Clifford D. Simak"],"year":1963},{"title":"Yesterday's Kin","cover_url":"https://nancykress.com/wp-content/uploads/2018/04/tomorrows-kin-329x4991.jpg","shows_english_title":true,"authors":["Nancy Kress"],"year":2017,"books":[{"title":"Tomorrow's Kin","year":2017,"cover_url":"https://nancykress.com/wp-content/uploads/2018/04/tomorrows-kin-329x4991.jpg","shows_english_title":true},{"title":"If Tomorrow Comes","year":2018,"cover_url":"https://nancykress.com/wp-content/uploads/2018/04/if-tomorrow-comes-329x500.jpg","shows_english_title":true},{"title":"Terran Tomorrow","year":2018,"cover_url":"https://book-assets.openroadmedia.com/9780765390370.jpg","shows_english_title":true}],"placement_note":"Tor identifies this as a hard-SF trilogy about human genetics and cultures on two distant planets. The aliens first arrive at New York, then humans follow them home and face an unexpected society before the consequences return to Earth. The full arc is driven by first contact and its cultural aftermath."}],"image":"208-alien-arrival.webp","definition":"First-contact fiction in which extraterrestrials physically arrive on Earth, so humanity’s first consequential encounter happens on our own world.","status":"accepted"},{"id":"alien-expedition","label":"Alien Expedition","parent":"first-contact","children":[],"works":[{"title":"A Case of Conscience","cover_url":"https://covers.openlibrary.org/b/id/14924819-L.jpg","shows_english_title":true,"authors":["James Blish"],"year":1958},{"title":"The Sparrow","cover_url":"https://covers.openlibrary.org/b/id/418903-L.jpg","shows_english_title":true,"authors":["Mary Doria Russell"],"year":1996,"books":[{"title":"The Sparrow","year":1996},{"title":"Children of God","year":1998}]},{"title":"Binti","cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756416935","shows_english_title":true,"authors":["Nnedi Okorafor"],"year":2015,"books":[{"title":"Binti","year":2015},{"title":"Binti: Home","year":2017},{"title":"Binti: The Night Masquerade","year":2018}]},{"id":"semiosis","title":"Semiosis","authors":["Sue Burke"],"year":2018,"cover":"https://covers.openlibrary.org/b/id/13806290-L.jpg","placement_note":"Root-down: Science fiction -> Futurist -> Alien fiction -> First Contact -> Alien Expedition. Harper Voyager explicitly calls it a first-contact novel: settlers travel to distant Pax and must communicate and coexist with its intelligent plants. Space colonies is rejected because the first consequential encounter and negotiated coexistence, not an already-established colony’s civic life, is the engine.","sources":["https://harpervoyagerbooks.co.uk/products/semiosis-a-novel-of-first-contact-sue-burke-9780008300777/","https://www.theverge.com/2018/2/10/16994952/sue-burke-semiosis-first-contact-science-fiction-intelligenet-plants-book-review"]}],"image":"209-alien-expedition.webp","definition":"First-contact fiction in which humans travel outward on a mission or voyage and encounter an extraterrestrial intelligence or society away from Earth.","status":"accepted"},{"id":"alien-message","label":"Alien Message","parent":"first-contact-fiction","children":[],"works":[{"title":"Contact","cover_url":"https://covers.openlibrary.org/b/id/13110389-L.jpg","shows_english_title":true,"authors":["Carl Sagan"],"year":1985},{"title":"Chocky","cover_url":"https://covers.openlibrary.org/b/id/12215385-L.jpg","shows_english_title":true,"authors":["John Wyndham"],"year":1968,"placement_note":"Penguin explicitly calls this alien contact: an unseen extraterrestrial intelligence communicates through Matthew, teaching alien mathematics and anti-gravity ideas and experimenting from afar."},{"title":"Juniper Time","cover_url":"https://covers.openlibrary.org/b/id/14642898-L.jpg","shows_english_title":true,"authors":["Kate Wilhelm"],"year":1979,"placement_note":"Hachette sets Earth's survival against catastrophic western drought, refugee camps and an orbital artifact that may be humanity's first contact with aliens, which only Jean can decode. The consequential alien artifact and attempted communication, rather than the climate backdrop alone, make First contact fiction the central engine."},{"title":"Remembrance of Earth's Past","cover_url":"https://mpd-biblio-covers.imgix.net/9780765377067.jpg","shows_english_title":false,"authors":["Liu Cixin"],"year":2006,"books":[{"title":"The Three-Body Problem","year":2006},{"title":"The Dark Forest","year":2008},{"title":"Death's End","year":2010}],"placement_note":"Gustav’s ruling places the series by its famous first book: The Three-Body Problem unfolds chiefly on modern-day Earth, and the Red Coast telescope message exchange with Trisolaris is the defining first-contact act for the whole sequence, despite later future eras and physical conflict."},{"title":"Roadside Picnic","cover_url":"https://covers.openlibrary.org/b/id/6752719-L.jpg","shows_english_title":true,"authors":["Arkady Strugatsky","Boris Strugatsky"],"year":1972,"placement_note":"Root-down: Science fiction -> Modern day -> Earthbound 1st Contact -> Alien Message. SFE places it in a near-future recognizable Earth after an unexplained alien interference whose artifacts are humanity’s only consequential contact. Alien Arrival fails because no alien appears; Alien Invasion fails because the visitation is apparently accidental, not conquest."}],"image":"210-alien-message.webp","definition":"First-contact fiction in which the first consequential encounter is mediated at a distance through a signal, voice, mind, or artifact rather than a physical visit.","status":"accepted"},{"id":"alternate-history","label":"Alternate history","parent":"historical","children":["period-alterations","deep-alterations"],"works":[],"image":"5-alternate-history.webp","definition":"Fiction set in a history that diverges from the known world at an identifiable or implied turning point.","status":"accepted"},{"id":"period-alterations","label":"Period alterations","parent":"alternate-history","children":["alt-postwar","alt-civil-war","alt-cold-war","alt-present"],"works":[],"definition":"Alternate histories in which the alteration starts within living memory of the story being depicted, roughly less than a lifetime before its present.","status":"accepted","image":"145-period-alterations.webp"},{"id":"alt-postwar","label":"Alt Postwar","parent":"period-alterations","children":[],"works":[{"title":"Fatherland","cover_url":"https://images.penguinrandomhouse.com/cover/9780812977219","shows_english_title":true,"authors":["Robert Harris"],"year":1992},{"title":"The Man in the High Castle","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/05/hbg-title-the-man-in-the-high-castle-2-141.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1962},{"title":"The Yiddish Policemen's Union","cover_url":"https://covers.openlibrary.org/b/id/12745212-L.jpg","shows_english_title":true,"authors":["Michael Chabon"],"year":2007,"placement_note":"SFE explicitly calls it an Alternate History SF novel: a Jewish homeland in Alaska follows a changed WWII and the collapse of Israel."},{"title":"Ascent","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9780743298230/ascent-9780743298230_lg.jpg","shows_english_title":true,"authors":["Jed Mercurio"],"year":2007,"placement_note":"A Soviet Korean War ace survives where his counterpart did not and becomes the first man on the Moon; the altered wartime fork is viewed through the postwar space race."}],"definition":"Alternate histories whose fork occurs during the Second World War and whose changed world is depicted after it.","status":"accepted","image":"146-alt-postwar.webp"},{"id":"alt-civil-war","label":"Alt Civil War","parent":"period-alterations","children":[],"works":[{"title":"The Guns of the South","cover_url":"https://cdn2.penguin.com.au/covers/400/9780345384683.jpg","shows_english_title":true,"authors":["Harry Turtledove"],"year":1992},{"title":"River of Teeth","cover_url":"https://mpd-biblio-covers.imgix.net/9780765395238.jpg","shows_english_title":true,"authors":["Sarah Gailey"],"year":2017,"books":[{"title":"River of Teeth","year":2017},{"title":"Taste of Marrow","year":2017}]},{"title":"Bring the Jubilee","cover_url":"https://book-assets.openroadmedia.com/9781504044639.jpg","shows_english_title":true,"authors":["Ward Moore"],"year":1953,"placement_note":"SFE calls it the first significant alternate-history tale in which the South wins the American Civil War, then sends its historian back to Gettysburg where his intervention changes the battle and timeline. The fork and central historical substance are the Civil War, exactly matching Alt Civil War."},{"title":"Dread Nation","cover_url":"https://covers.openlibrary.org/b/isbn/9780062570604-L.jpg","shows_english_title":true,"authors":["Justina Ireland"],"year":2018,"books":[{"title":"Dread Nation","year":2018,"cover_url":"https://covers.openlibrary.org/b/isbn/9780062570604-L.jpg","shows_english_title":true},{"title":"Deathless Divide","year":2020,"cover_url":"https://covers.openlibrary.org/b/isbn/9780062570635-L.jpg","shows_english_title":true}]}],"definition":"Alternate histories whose fork occurs on the eve of or during the United States Civil War era.","status":"accepted","image":"147-alt-civil-war.webp"},{"id":"alt-cold-war","label":"Alt Cold War","parent":"period-alterations","children":[],"works":[{"title":"Watchmen","cover_url":"https://covers.openlibrary.org/b/id/14613329-L.jpg","shows_english_title":false,"authors":["Alan Moore","Dave Gibbons"],"year":1986,"placement_note":"SFE calls it an Alternate History superhero story: costumed heroes alter twentieth-century politics and technology, producing a 1985 where America won Vietnam, Nixon remains president and nuclear war looms."},{"title":"Lady Astronaut","cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/CalculatingStars_comp_v7_final.jpg","shows_english_title":true,"authors":["Mary Robinette Kowal"],"year":2018,"books":[{"title":"The Calculating Stars","year":2018,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/CalculatingStars_comp_v7_final.jpg"},{"title":"The Fated Sky","year":2018,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/Fated-Sky.jpg"},{"title":"The Relentless Moon","year":2020,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/The-Relentless-Moon.jpg"},{"title":"The Martian Contingency","year":2025,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2024/08/MartianContingency_comp2.jpg"}]}],"definition":"Alternate histories whose fork and central historical substance belong to the Cold War.","status":"accepted","image":"148-alt-cold-war.webp"},{"id":"alt-present","label":"Alt Present","parent":"period-alterations","children":[],"works":[{"title":"Peripheral","cover_url":"https://covers.openlibrary.org/b/id/8787492-L.jpg","shows_english_title":true,"authors":["William Gibson"],"year":2014,"books":[{"title":"The Peripheral","year":2014,"authors":["William Gibson"],"cover_url":"https://covers.openlibrary.org/b/id/8787492-L.jpg"},{"title":"Agency","year":2020,"authors":["William Gibson"],"cover_url":"https://covers.openlibrary.org/b/id/13090570-L.jpg"}],"placement_note":"SFE identifies Agency as volume two of the Peripheral sequence and says manipulation of Alternate Histories is central: its Hillary Clinton timeline is influenced from a later post-Jackpot London. Penguin confirms the different timelines and deliberate nudging of alternate pasts. Alternate history is the defining mechanism."}],"definition":"Alternate histories that alter the near-present rather than a named historical period.","status":"accepted","image":"149-alt-present.webp"},{"id":"deep-alterations","label":"Deep alterations","parent":"alternate-history","children":[],"works":[{"title":"The Alteration","cover_url":"https://images.penguinrandomhouse.com/cover/9781590176177","shows_english_title":true,"authors":["Kingsley Amis"],"year":1976},{"title":"The Years of Rice and Salt","cover_url":"https://www.qbd.com.au/img/products/0/9780002257480.jpg","shows_english_title":true,"authors":["Kim Stanley Robinson"],"year":2002},{"title":"Lest Darkness Fall","cover_url":"https://covers.openlibrary.org/b/id/7401260-L.jpg","shows_english_title":true,"authors":["L. Sprague de Camp"],"year":1939,"placement_note":"SFE and ISFDB describe a modern archaeologist transported to sixth-century Rome who uses knowledge and inventions to prevent the Dark Ages and redirect history. Because his intervention changes the fall of Rome and therefore centuries of world development, Deep alterations is the closest alternate-history leaf."},{"title":"Pavane","cover_url":"https://covers.openlibrary.org/b/id/8667089-L.jpg","shows_english_title":true,"authors":["Keith Roberts"],"year":1968,"placement_note":"SFE (roberts_keith): superb Alternate History - Elizabeth I assassinated, the Armada victorious, no Protestant capitalism; a technologically backward 20th-century England still under the Church, with steam traction engines and the old guilds. Divergence 1588, story c.1968 - the alteration runs four centuries deep and produces a transformed world order: exactly deep-alterations. Shelfmates: The Alteration (another Catholic-dominated 20th century), Lest Darkness Fall, The Years of Rice and Salt."}],"definition":"Alternate histories whose alterations run centuries deep and produce transformed world orders.","status":"accepted","image":"150-deep-alterations.webp"},{"id":"science-fiction","label":"Science fiction","parent":"speculative-fiction","children":["historical","futurist","modern-day","atemporal"],"works":[],"image":"20-science-fiction.webp","definition":"","status":"accepted"},{"id":"steampunk","label":"Steampunk","parent":"historical","children":[],"works":[{"title":"A Transatlantic Tunnel, Hurrah!","cover_url":"https://covers.openlibrary.org/b/isbn/9780765327864-L.jpg","shows_english_title":true,"authors":["Harry Harrison"],"year":1972},{"title":"The Clockwork Century","cover_url":"https://covers.openlibrary.org/b/id/15233576-L.jpg","shows_english_title":true,"authors":["Cherie Priest"],"year":2009,"books":[{"title":"Boneshaker","year":2009,"cover_url":"https://covers.openlibrary.org/b/id/15233576-L.jpg"},{"title":"Clementine","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/6657545-L.jpg"},{"title":"Dreadnought","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/9374005-L.jpg"},{"title":"Ganymede","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/11021290-L.jpg"},{"title":"Inexplicables","year":2012,"cover_url":"https://covers.openlibrary.org/b/id/14541291-L.jpg"},{"title":"Fiddlehead","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/9382271-L.jpg"}]},{"title":"The Difference Engine","cover_url":"https://covers.openlibrary.org/b/isbn/0575099402-L.jpg","shows_english_title":true,"authors":["William Gibson","Bruce Sterling"],"year":1990},{"title":"Leviathan","cover_url":"https://covers.openlibrary.org/b/isbn/9781416971733-L.jpg",

*{box-sizing:border-box}html,body{margin:0;background:#05070b;color:white;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;height:100%;overflow:hidden}.app{height:100dvh;position:relative;overflow:hidden;touch-action:pan-y}.bg{position:absolute;inset:0;background:#10151e center/cover no-repeat;transition:opacity .18s}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.05) 42%,rgba(3,5,9,.96) 82%)}.placeholder{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#31405b,#111722 48%,#05070b);font-size:96px;color:#8ea4c6}.top{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(#000b,transparent 14%)}.crumb{position:absolute;top:calc(env(safe-area-inset-top) + 50px);left:18px;right:18px;text-align:center;font-size:13px;color:#d3d9e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{position:absolute;right:16px;border:0;background:#151a24dd;color:white;border-radius:999px;width:44px;height:44px;font-size:20px;pointer-events:auto;box-shadow:0 4px 18px #0005}.icon#back{top:calc(50% - 48px)}.icon#home{top:calc(50% + 4px)}.panel{position:absolute;left:0;right:0;bottom:0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);z-index:2;max-height:46dvh;overflow:auto;overflow-anchor:none}.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b4c1d2}.title{font-size:clamp(34px,10vw,54px);line-height:.94;margin:7px 0 12px;text-wrap:balance;text-shadow:0 2px 14px #000}.hint{font-size:13px;color:#c5ceda;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;border:1px solid #ffffff2b;background:#151b25 center/cover no-repeat;color:white;border-radius:18px;padding:0;text-align:left;font-size:15px;min-height:142px;overflow:hidden;box-shadow:0 8px 24px #0005}.card:before{content:"";position:absolute;inset:0;background:linear-gradient( .booklist{display:flex;flex-direction:column;gap:8px}.bookrow{display:flex;gap:10px;align-items:center;background:#0d111add;border:1px solid #ffffff1c;border-radius:12px;padding:8px 10px;text-align:left}.bookrow img{width:34px;height:51px;object-fit:cover;border-radius:4px}.bookph{width:34px;height:51px;flex:none;display:grid;place-items:center;color:#8ea4c6;background:#ffffff0a;border-radius:4px}.bookrow b{display:block;font-size:14px;line-height:1.15}.bookrow span{font-size:12px;color:#aeb8c6}.work{cursor:pointer}.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bookcard{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;border:1px solid #ffffff22;cursor:pointer;background:#ffffff0b}.bookcard img{width:100%;height:100%;object-fit:cover;display:block}.bookcard .bc-label{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 6px;background:linear-gradient(transparent,#05070bee);font-size:11px;line-height:1.15}.blurb{font-size:13.5px;line-height:1.5;color:#dde4ee;background:#0d111acc;border:1px solid #ffffff1c;border-radius:12px;padding:10px 12px}.blurb a{color:#9fc1ff}.buy{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.buy a{font-size:12.5px;color:#0b0e14;background:#e8eef8;border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:600}.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b4c1d2;margin:14px 0 6px}.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}.strip .v{flex:0 0 auto;width:66px;cursor:pointer;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left}.strip .v img{width:66px;height:99px;object-fit:cover;border-radius:6px;border:2px solid transparent;display:block}.strip .v.on img{border-color:#fff}.strip .v{opacity:0;transition:opacity .25s ease-in}.strip .v.ld{opacity:1}.work img,.bookcard img{opacity:0;transition:opacity .25s ease-in}.work.ld img,.bookcard.ld img{opacity:1}.work:not(.ld),.bookcard:not(.ld){borde const nodes=[{"id":"dark-fantasy","label":"Dark fantasy","parent":"nocturne-fantasy","children":["horror-fantasy","torment-fantasy"],"works":[],"image":"9-dark-fantasy.webp","definition":"Menacing dark fantasy on recognizable Earth, divided between horror, where the menace lies in the places the characters end up, and torment, where tormentors follow the main characters around.","status":"candidate"},{"id":"epic-fantasy","label":"Epic fantasy","parent":"fantasy-realms","children":["heroic-fantasy","high-fantasy","political-fantasy","hard-fantasy","mythological-fantasy","military-fantasy"],"works":[],"image":"11-epic-fantasy.webp","definition":"Fantasy driven by worldbuilding at epic scale: long journeys, wars, political stakes, large geographies, cosmic systems and invented gods.","status":"candidate"},{"id":"military-fantasy","label":"Military fantasy","parent":"epic-fantasy","children":[],"works":[{"title":"Malazan Book of the Fallen","cover_url":"https://covers.openlibrary.org/b/id/374277-L.jpg","shows_english_title":true,"authors":["Steven Erikson"],"year":1999,"books":[{"title":"Gardens of the Moon","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/374277-L.jpg"},{"title":"Deadhouse Gates","year":2000,"cover_url":"https://covers.openlibrary.org/b/isbn/9780553813111-L.jpg"},{"title":"Memories of Ice","year":2001,"cover_url":"https://covers.openlibrary.org/b/id/524439-L.jpg"},{"title":"House of Chains","year":2002,"cover_url":"https://covers.openlibrary.org/b/id/374327-L.jpg"},{"title":"Midnight Tides","year":2004,"cover_url":"https://covers.openlibrary.org/b/id/524762-L.jpg"},{"title":"The Bonehunters","year":2006,"cover_url":"https://covers.openlibrary.org/b/isbn/9780593046302-L.jpg"},{"title":"Reaper's Gale","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/386149-L.jpg"},{"title":"Toll the Hounds","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/6684006-L.jpg"},{"title":"Dust of Dreams","year":2009,"cover_url":"https://covers.openlibrary.org/b/id/6304352-L.jpg"},{"title":"The Crippled God","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/9720396-L.jpg"}]},{"title":"Siege trilogy","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316270793.jpg?w=640","shows_english_title":true,"authors":["K. J. Parker"],"year":2019,"books":[{"title":"Sixteen Ways to Defend a Walled City","year":2019,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316270793.jpg?w=640"},{"title":"How to Rule an Empire and Get Away with It","year":2020,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2020/08/9780316498678-1.jpg"},{"title":"A Practical Guide to Conquering the World","year":2022,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2022/01/9780316498616.jpg"}],"placement_note":"An invented Roman-like empire; the trilogy is organized around siegecraft, defense, rule, and finally a war to end all wars, seen through engineers and pragmatic participants."},{"title":"The Ascendant Trilogy","cover_url":"cover-9780765392558.jpg","shows_english_title":true,"authors":["K Arsenault Rivera"],"year":2017,"books":[{"title":"The Tiger's Daughter","year":2017,"cover_url":"cover-9780765392558.jpg"},{"title":"The Phoenix Empress","year":2018,"cover_url":"cover-9780765392572.jpg"},{"title":"The Warrior Moon","year":2019,"cover_url":"cover-9780765392596.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Military fantasy. Tor identifies a complete epic fantasy trilogy centered on warrior Shefali and divine warrior-empress Shizuka; imperial armies, war trauma, a demonic invasion and a looming civil war drive the sequence. Prophecy and romance matter, but campaigns, command and defense of the empire govern."}],"image":"232-military-fantasy.webp","definition":"Epic fantasy organized around armies, campaigns, soldiers and war seen from the ranks. Military fantasy is an established reader term, with The Black Company widely treated as a codifier.","status":"accepted"},{"id":"heroic-fantasy","label":"Heroic fantasy","parent":"epic-fantasy","children":["caster-heroes","martial-heroes","npc-heroes"],"works":[],"image":"1-3-heroic-fantasy.webp","definition":"Hero-centered fantasy organized as an RPG-class tree by the protagonist’s primary power source: spellcraft, martial skill, or no adventuring class.","status":"accepted"},{"id":"caster-heroes","label":"Caster Heroes","parent":"heroic-fantasy","children":["bard-hero","mage-hero","cleric-hero","paladin-hero"],"works":[],"image":"189-caster-heroes.webp","definition":"Heroic fantasy whose protagonist’s primary power source is spellcraft, sacred power, magical performance or an empowered oath; setting and tone do not decide the class.","status":"accepted"},{"id":"martial-heroes","label":"Martial Heroes","parent":"heroic-fantasy","children":["warrior-hero","rogue-hero","ranger-hero"],"works":[],"image":"190-martial-heroes.webp","definition":"Heroic fantasy whose protagonist’s primary power source is trained physical skill, weapons, stealth or wilderness craft; setting and tone do not decide the class.","status":"accepted"},{"id":"npc-heroes","label":"NPC Heroes","parent":"heroic-fantasy","children":[],"works":[{"title":"The Goblin Emperor","cover_url":"https://covers.openlibrary.org/b/id/9319294-L.jpg","shows_english_title":true,"authors":["Katherine Addison"],"year":2014,"books":[{"title":"The Goblin Emperor","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/9319294-L.jpg"},{"title":"The Witness for the Dead","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/11710274-L.jpg"},{"title":"The Grief of Stones","year":2022,"cover_url":"https://covers.openlibrary.org/b/id/13131608-L.jpg"},{"title":"The Tomb of Dragons","year":2025,"cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250821029.01.LZZZZZZZ.jpg"}]}],"image":"191-npc-heroes.webp","definition":"Heroic fantasy whose protagonist has no adventuring class: authority comes from ordinary judgment, social position, empathy or civic action rather than spellcraft or combat skill.","status":"accepted"},{"id":"bard-hero","label":"Bard Hero","parent":"caster-heroes","children":[],"works":[{"title":"The Kingkiller Chronicle","cover_url":"cover-the-kingkiller-chronicle.jpg","shows_english_title":true,"authors":["Patrick Rothfuss"],"year":2007,"books":[{"title":"The Name of the Wind","year":2007,"cover_url":"cover-the-kingkiller-chronicle.jpg"},{"title":"The Wise Man’s Fear","year":2011}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Heroic fantasy -> Caster heroes -> Bard hero. Penguin Random House describes Kvothe telling his own heroic story: a notorious magician who writes songs that make minstrels weep, with performance, words, lore and magical artistry central to both his power and identity."}],"image":"192-bard-hero.webp","definition":"Caster-hero fantasy whose protagonist’s primary power comes through performance, words, lore and charismatic magical artistry.","status":"accepted"},{"id":"mage-hero","label":"Mage Hero","parent":"caster-heroes","children":[],"works":[{"title":"Earthsea","cover_url":"https://covers.openlibrary.org/b/id/8784027-L.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":1968,"books":[{"title":"A Wizard of Earthsea","year":1968,"authors":["Ursula K. Le Guin"],"cover_url":"https://covers.openlibrary.org/b/id/14608471-L.jpg","blurb":"Ged was the greatest sorcerer in Earthsea, but in his youth he was the reckless Sparrowhawk. In his hunger for power and knowledge, he tampered with long-held secrets and loosed a terrible shadow upon the world. This is the tale of his testing, how he mastered the mighty words of power, tamed an ancient dragon, and crossed death's threshold to restore the balance.","blurb_source":"https://openlibrary.org/works/OL59798W","buy":[{"label":"Adlibris","ur  original East-Asian-influenced fantasy world to break the spell amid war and blood magic. The quest governs; no specific familiar fairy tale is revised."},{"title":"The 13 Clocks","cover_url":"https://images1.penguinrandomhouse.com/cover/9780143110149","shows_english_title":true,"authors":["James Thurber"],"year":1950,"placement_note":"Gustav's 2026-09-21 ruling. PRH grounds an original fairy tale in which Prince Zorn and the magical Golux must rescue Saralinda from the wicked Duke by completing impossible conditions and restarting thirteen enchanted clocks. Fairy-tale grammar and impossible-task quest govern; comic wordplay is the mode, not the shelf."},{"title":"The Story of the Glittering Plain","cover_url":"cover-the-story-of-the-glittering-plain.jpg","shows_english_title":true,"authors":["William Morris"],"year":1891,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> High fantasy -> Fairytalesque quest fantasy. The Morris Archive places Hallblithe in a wholly imagined romance-world; his stolen beloved sends him through northern islands to the immortal Glittering Plain. Abduction, enchanted undying land and impossible rescue quest supply original fairy-tale grammar."},{"title":"Nettle & Bone","cover_url":"https://covers.openlibrary.org/b/id/11135584-L.jpg","shows_english_title":true,"authors":["T. Kingfisher"],"year":2022,"placement_note":"Original fairy-tale quest (BookPage, Locus): a princess, a dust-wife, a fairy godmother and a demon-possessed hen set out to kill a prince, through impossible tasks and curses, without retelling a specific tale."}],"image":"256-fairytalesque-quest-fantasy.webp","definition":"Original-world quests shaped by fairy-tale grammar - curses, impossible tasks, witches and enchanted objects - without retelling a specific inherited tale.","status":"accepted"},{"id":"sword-and-sorcery","label":"Sword and sorcery","parent":"fantasy-realms","children":["caper-fantasy","sword-and-planet" rkus, Locus)."},{"title":"The Bright Sword","cover_url":"https://covers.openlibrary.org/b/id/14657934-L.jpg","shows_english_title":true,"authors":["Lev Grossman"],"year":2024,"placement_note":"The knights of Camelot after Arthur's death search for a new king (AP, BookPage)."}],"image":"164-arthurian-fantasy.webp","definition":"Fantasy that retells or reimagines Arthur, Avalon, Camelot, the Grail and the Matter of Britain.","status":"accepted"},{"id":"greek-myth-fantasy","label":"Greek myth fantasy","parent":"mythic-retelling","children":[],"works":[{"title":"Circe","cover_url":"https://res.cloudinary.com/bloomsbury-atlas/image/upload/w_360,c_scale/jackets/9781408890073.jpg","shows_english_title":true,"authors":["Madeline Miller"],"year":2018},{"title":"Phaedra","cover_url":"https://img.fablecdn.net/images/cdn.fable.co/covers/9781639101542.jpg?w=600","shows_english_title":true,"authors":["Laura Shepperson"],"year":2023},{"title":"The Song of Achilles","cover_url":"https://cdn.waterstones.com/bookjackets/large/9781/5266/9781526648174.jpg","shows_english_title":true,"authors":["Madeline Miller"],"year":2011},{"title":"The Minotaur Trilogy","cover_url":"https://covers.openlibrary.org/b/id/10186823-L.jpg","shows_english_title":true,"authors":["Thomas Burnett Swann"],"year":1966,"books":[{"title":"Cry Silver Bells","year":1977,"cover_url":"https://covers.openlibrary.org/b/id/14939536-L.jpg"},{"title":"The Forest of Forever","year":1971},{"title":"Day of the Minotaur","year":1966,"cover_url":"https://covers.openlibrary.org/b/id/10186823-L.jpg"}],"placement_note":"SFE places Swann's three-book sequence in Mycenaean Crete among legendary peoples; Day retells the Minotaur as Eunostos, defender of the mythic old world, matching this leaf's mythic-age rule."},{"title":"Lovely War","cover_url":"https://images1.penguinrandomhouse.com/smedia/9780147512970","shows_english_title":true,"authors":["Julie Berry"],"year":2019,"placement_note":"Penguin Random House frames the World War love stories as testimony narrated by Aphrodite before a Mount Olympus judgment, with Greek gods holding mortal fates; Berry names Aphrodite, Ares, Hephaestus, Apollo and Hades as active narrators and witnesses. Reimagining named Greek gods through modern war stories makes Greek myth fantasy exact."},{"title":"The Just City","cover_url":"cover-the-just-city.jpg","shows_english_title":true,"authors":["Jo Walton"],"year":2015,"books":[{"title":"The Just City","year":2015,"cover_url":"cover-the-just-city.jpg"},{"title":"The Philosopher Kings","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/8572834-L.jpg"},{"title":"Necessity","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8737297-L.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Mythic retelling -> Greek myth fantasy. SFE describes Pallas Athene creating an island city in the ancient Mediterranean and recruiting people across time to test Plato’s Republic; Apollo becomes mortal and Zeus later moves the cities. Named Greek gods and their divine acts are the causal spine, with time travel and future robots serving Athene’s mythic experiment."},{"title":"The Phoenix and the Mirror","cover_url":"cover-the-phoenix-and-the-mirror.jpg","shows_english_title":true,"authors":["Avram Davidson"],"year":1969,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Mythic retelling -> Greek myth fantasy. Hachette reimagines Virgil through medieval legend as magus, alchemist and adventurer, sending him across an impossible ancient world to make a magic mirror amid gods, monsters and prophecy. A named classical figure and inherited legends govern."},{"title":"Wearing the Lion","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0756419549.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["John Wiswell"],"year":2025,"placement_note":"The labors of Heracles retold, with Hera fed up with Zeus (PW, Newtown Review)."}],"image":"165-greek-myth-fantasy.webp","definition":"Fantasy that retells or reimagines named figures and narratives from ancient Greek mythology and its heroic age.","status":"accepted"},{"id":"norse-fantasy","label":"Norse fantasy","parent":"mythic-retelling","children":[],"works":[{"title":"Grendel","cover_url":"https://covers.openlibrary.org/b/id/9948473-L.jpg","shows_english_title":true,"authors":["John Gardner"],"year":1971},{"title":"The Mere Wife","cover_url":"cover-the-mere-wife.jpg","shows_english_title":true,"authors":["Maria Dahvana Headley"],"year":2018,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Mythic retelling -> Norse fantasy. Macmillan/MCD explicitly calls it a modern retelling of Beowulf in American suburbia, recasting Grendel, his mother and Herot through two protective mothers and a gated community. The inherited Northern Germanic story is the organizing source."}],"image":"166-norse-fantasy.webp","definition":"Fantasy that retells or reimagines Norse and Northern Germanic mythic or legendary source material, rather than merely using the Viking Age as a setting.","status":"accepted"},{"id":"fantasy-mystery","label":"Fantasy mystery","parent":"gothic-fantasy","children":[],"works":[{"title":"Shadow of the Leviathan","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/09/hbg-title-a-drop-of-corruption-7-115.jpg","shows_english_title":false,"authors":["Robert Jackson Bennett"],"year":2024,"books":[{"title":"The Tainted Cup","year":2024,"cover_url":"https://covers.openlibrary.org/b/id/15251529-L.jpg"},{"title":"A Drop of Corruption","year":2025,"cover_url":"https://covers.openlibrary.org/b/id/14870214-L.jpg"}],"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Fantasy mystery. The detective inquiry unfolds through monstrous biological alteration, imperial menace and uncanny crimes; its Gothic mode is essential to the mystery."},{"title":"The Raven Scholar","cover_url":"https://covers.openlibrary.org/b/id/15067081-L.jpg","shows_english_title":true,"authors":["Antonia Hodgson"],"year":2025,"placement_note":"The 24-yearly trial for the throne of Orrun in a realm of absent gods, with scholar Neema investigating a candidate's murder (SFFWorld, Fantasy Hive). Invented-world investigation under menace."}],"image":"2-fantasy-mystery.webp","definition":"The occult-detective branch of the Gothic School: investigation into uncanny crimes, monstrous institutions or occult systems in an invented world, where Gothic menace is essential to the mystery.","status":"accepted"},{"id":"fantasy","label":"Fantasy","parent":"speculative-fiction","children":["real-earth-universe","fantasy-realms","portal-fantasy"],"works":[],"image":"13-fantasy.webp","definition":"","status":"accepted"},{"id":"historical-fantasy","label":"Historical fantasy","parent":"real-earth-universe","children":["period-fantasy","secret-history","alternate-history-fantasy","pulp-fantasy"],"works":[],"image":"16-historical-fantasy.webp","definition":" Converted to an umbrella 2026-09-13 (Gustav: split by time period).","status":"umbrella"},{"id":"pulp-fantasy","label":"Pulp fantasy","parent":"historical-fantasy","children":[],"works":[{"title":"Roads","cover_url":"https://covers.openlibrary.org/b/id/740772-L.jpg","shows_english_title":true,"authors":["Seabury Quinn"],"year":1938,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. Quinn turns Christian legend into a Weird Tales Viking-gladiator Santa origin: religious/mythic material is used as knockabout pulp adventure rather than serious mythic retelling. Gustav’s 2026-09-20 gate routes unserious pulp retellings here, not to Mythic retelling."},{"title":"The Albion Triptych","cover_url":"https://www.valancourtbooks.com/uploads/2/7/0/1/27017582/7577186.jpg","shows_english_title":true,"authors":["Andrew Sinclair"],"year":1967,"books":[{"title":" Fantasy -> Real Earth Universe -> Historical fantasy -> Pulp fantasy. A Thirty Years War veteran encounters Lucifer and pursues the Grail through colorful, cinematic knightly adventure on a supernatural-religious historical stage."}],"definition":"Historical fantasy in the pulp-adventure mode: fast, sensational, knockabout treatments of past eras, religious legends or mythic material that use history as a lurid stage rather than treating inherited myth with seriousness. “Pulp fantasy” is a taxonomy coinage built on an attested descriptive phrase, not an established shelf headword.","image":"236-pulp-fantasy.webp","representative_cover":"https://covers.openlibrary.org/b/id/740772-L.jpg"},{"id":"paranormal-fantasy","label":"Paranormal fantasy","parent":"nocturne-fantasy","children":[],"works":[{"title":"American Gods","cover_url":"https://www.fictiondb.com/covers/0380789035.jpg","shows_english_title":true,"authors":["Neil Gaiman"],"year":2001,"books":[{"title":"American Gods","year":2001,"cover_url":"https://covers.openlibrary.org/b/id/8494659-L.jpg"},{"title":"Anansi Boys","year":2005,"cover_url":"https://covers.openlibrary.org/b/id/12049134-L.jpg"}]},{"title":"Good Omens","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/11/hbg-title-the-illustrated-good-omens-112.jpg","shows_english_title":true,"authors":["Terry Pratchett","Neil Gaiman"],"year":1990},{"title":"No Hero","cover_url":"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1344102132i/10708694.jpg","shows_english_title":true,"authors":["Jonathan Wood"],"year":2014,"books":[{"title":"No Hero","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/9530799-L.jpg"},{"title":"Yesterday's Hero","year":2014}]},{"title":"Dr. Greta Helsing","cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1522680744925-5VXHVR2DFMFH5IIHASC5/97803164346141.jpg","shows_english_title":true,"authors":["Vivian Shaw"],"year":2017,"books":[{"title":"Strange Practice","year":2017,"cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1522680744925-5VXHVR2DFMFH5IIHASC5/97803164346141.jpg"},{"title":"Dreadful Company","year":2018,"cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1601568309288-RHYOI8MM40HJL8LBCL7Y/Shaw_Dreadful-Company_PB.jpg"},{"title":"Grave Importance","year":2019,"cover_url":"https://images.squarespace-cdn.com/content/v1/5ac0f23ffcf7fd318b9ee078/1601568636778-9E3FW5JVWEIYIXB5IAL2/Grave-Importance-cover-660x1017.jpg"}],"placement_note":"The author and Hachette define a world adjacent to ours where monsters are real and Greta treats vampires, mummies, ghouls and other undead patients. Its contemporary supernatural society and creature ensemble make Paranormal fantasy closest."},{"title":"The Sixth World","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534413504/trail-of-lightning-9781534413504_lg.jpg","shows_english_title":true,"authors":["Rebecca Roanhorse"],"year":2018,"books":[{"title":"Trail of Lightning","year":2018,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534413504/trail-of-lightning-9781534413504_lg.jpg"},{"title":"Storm of Locusts","year":2019,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534413535/storm-of-locusts-9781534413535_lg.jpg"}],"placement_note":"SFE grounds a climate-drowned near-future America where Dinétah is haunted by literal monsters; Simon & Schuster adds clan powers, Navajo-legend figures and newborn gods. Gustav’s actual-magic boundary sends the sequence to Fantasy despite its ruined-world setting. It passes Real Earth Universe -> Supernatural dark; a living society of monsters, gods and powered humans makes Paranormal fantasy closer than Dark fantasy or one horror-specific supernatural child."}],"image":"19-paranormal-fantasy.webp","definition":"","status":"candidate"},{"id":"supernatural-fantasy","label":"Supernatural fantasy","par tle":"We Sold Our Souls","authors":["Grady Hendrix"],"year":2018,"cover_url":"cover-we-sold-our-souls.jpg","shows_english_title":true,"books":[{"title":"We Sold Our Souls","year":2018,"cover_url":"cover-we-sold-our-souls.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Evil Deals. Quirk calls it supernatural horror and dark fantasy; the author calls it a darkly comic riff on the Faust legend. Singer Terry Hunt's soul bargain buys his stardom at his bandmates' cost, and guitarist Kris fights to take her soul back. The deal with evil governs."},{"title":"The Invisible Life of Addie LaRue","cover_url":"https://mpd-biblio-covers.imgix.net/9780765387561.jpg","shows_english_title":true,"authors":["V. E. Schwab"],"year":2020,"placement_note":"Nocturne restructure 2026-09-23 (Gustav ruling: a central theme of cheating death or aging goes Supernatural): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Evil Deals."},{"title":"Something Wicked This Way Comes","cover_url":"https://covers.openlibrary.org/b/id/12376825-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1962,"placement_note":"Nocturne restructure 2026-09-23 (Gustav ruling: a central theme of cheating death or aging goes Supernatural): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Evil Deals."}],"definition":"Supernatural fiction in which a bargain with evil trades the soul, conscience, or humanity for worldly advantage.","status":"accepted","image":"94-evil-deals.webp"},{"id":"surreal-afterlife","label":"Surreal Afterlife","parent":"supernatural-fantasy","children":[],"works":[{"title":"The Third Policeman","cover_url":"https://covers.openlibrary.org/b/id/801560-L.jpg","shows_english_title":true,"authors":["Flann O'Brien"],"year":1967},{"title":"Out of Body","cover_url":"https://mpd-biblio-covers.imgix.net/9781250250155.jpg","shows_english_title":true,"authors":["Jeffrey Ford"],"year":2020},{"title":"How the Dead Live","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780141040172/9780141040172-jacket-large.jpg","shows_english_title":true,"authors":["Will Self"],"year":2000,"placement_note":"Penguin follows the newly dead Lily Bloom into Dulston, London’s borough of the dead, alongside embodiments of her discarded foetus and unwanted fat; the author describes the other world as remarkably like this one. Its grotesque, dreamlike continuation of personality after death makes Surreal Afterlife exact."},{"title":"Pincher Martin","cover_url":"https://covers.openlibrary.org/b/id/6551221-L.jpg","shows_english_title":true,"authors":["William Golding"],"year":1956,"placement_note":"Surreal afterlife: SFE calls it 'as much sf as An Occurrence at Owl Creek Bridge' - a castaway clinging to a rock whose 'survival' the ending reveals as 'no more than a last flicker of pre-purgatorial consciousness'. Death and disembodied existence rendered as a strange dreamlike reality; shelfmates The Third Policeman and How the Dead Live."},{"title":"Sweet Dreams","cover_url":"https://www.faber.co.uk/wp-content/uploads/2025/12/Sweet-Dreams-1.jpg","shows_english_title":true,"authors":["Michael Frayn"],"year":1973,"placement_note":"SFE explicitly identifies an afterlife fantasy whose megalopolitan Heaven is a skewed utopia; Faber follows Howard Baker after death into a radically modernized celestial metropolis and comic moral-intellectual challenge. Its satirically bureaucratic disembodied Heaven makes Surreal afterlife exact."},{"title":"Katabasis","cover_url":"https://covers.openlibrary.org/b/id/15117021-L.jpg","shows_english_title":true,"authors":["R.F. Kuang"],"year":2025,"placement_note":"Two Cambridge graduate students of Analytic Magick descend into Hell to bring back their dead advisor; Hell is rendered as a strange, logic-bound academic afterlife they must cross (Guardian, L t","cover_url":"https://images2.penguinrandomhouse.com/cover/9780515150896","shows_english_title":true},{"title":"Kiss the Dead","cover_url":"https://images4.penguinrandomhouse.com/cover/9780515153002","shows_english_title":true},{"title":"Affliction","cover_url":"https://images3.penguinrandomhouse.com/cover/9780515154276","shows_english_title":true},{"title":"Jason","cover_url":"https://images3.penguinrandomhouse.com/cover/9780515156072","shows_english_title":true},{"title":"Dead Ice","cover_url":"https://images4.penguinrandomhouse.com/cover/9780515155662","shows_english_title":true},{"title":"Crimson Death","cover_url":"https://images3.penguinrandomhouse.com/cover/9781101987742","shows_english_title":true},{"title":"Serpentine","cover_url":"https://images4.penguinrandomhouse.com/cover/9781101989005","shows_english_title":true},{"title":"Sucker Punch","cover_url":"https://images4.penguinrandomhouse.com/cover/9781984804440","shows_english_title":true},{"title":"Rafael","cover_url":"https://images4.penguinrandomhouse.com/cover/9780593332917","shows_english_title":true},{"title":"Smolder","cover_url":"https://images3.penguinrandomhouse.com/cover/9781984804501","shows_english_title":true},{"title":"Slay","cover_url":"https://images1.penguinrandomhouse.com/cover/9780593637845","shows_english_title":true}],"placement_note":"The official series lists thirty core novels through Slay. PRH establishes Anita as a St. Louis animator and later federal Preternatural Marshal in a world where vampire law enforcement, undead citizens and supernatural power structures are public institutions. This civic normalization makes Publicly Paranormal more specific than generic vampire fiction."},{"title":"No Gods, No Monsters","cover_url":"https://upload.wikimedia.org/wikipedia/en/5/5f/No_Gods%2C_No_Monsters.jpg","shows_english_title":true,"authors":["Cadwell Turnbull"],"year":2021,"books":[{"title":"No Gods, No Monsters","year":2021,"cover_url":"https://upload.wikimedia.org/wikipedia/en/5/5f/No_Gods%2C_No_Monsters.jpg"},{"title":"We Are the Crisis","year":2023},{"title":"Ruin, Great and Free","year":2025}],"placement_note":"Wikipedia: the Convergence Saga opener tells of monsters making their existence known to find protection in visibility, told from multiple perspectives amid societal and political unrest. Supernatural beings publicly emerging into ordinary civic life is the Publicly paranormal trait (cf. A Song Below Water)."},{"title":"Elatsoe","cover_url":"http://www.levinequerido.com/cdn/shop/files/LQ_Elatsoepbk_CVR_9781646142767.jpg?v=1764398661","shows_english_title":true,"authors":["Darcie Little Badger"],"year":2020,"placement_note":"Gustav ruled 2026-09-22 that Fantasy must be traversed in user order: Real Earth vs invented world first. Ghosts and magic are publicly known and absorbed into civic life in a recognizable America, making Publicly Paranormal exact."},{"title":"The Cerulean Chronicles","cover_url":"https://covers.openlibrary.org/b/id/9312772-L.jpg","shows_english_title":true,"authors":["TJ Klune"],"year":2020,"placement_note":"Magical youth are registered and policed by a government department; a caseworker and an orphanage of magical children push back (BookPage, Locus). Magic public and bureaucratized. Series card: The House in the Cerulean Sea (2020), Somewhere Beyond the Sea (2024).","books":[{"title":"The House in the Cerulean Sea","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/9312772-L.jpg"},{"title":"Somewhere Beyond the Sea","year":2024,"cover_url":"https://covers.openlibrary.org/b/isbn/9781250881212-L.jpg"}]}],"definition":"Urban fantasy where supernatural beings and phenomena are publicly known and absorbed into ordinary civic life.","status":"accepted","image":"98-publicly-paranormal.webp"},{"id":"modern-goth","label":"Modern Goth","parent":"urban-fantasy","children":["postcolonial-gothic","modern-occult","suburban-gothic","war-gothic"],"works":[],"definition":"Umbrella for contemporary Gothic fiction classified by the source of its haunting: colonial or ancestral debt, occult systems within modern institutions, the community itself, or war’s unresolved dead.","status":"accepted","image":"99-modern-goth.webp"},{"id":"postcolonial-gothic","label":"Postcolonial Gothic","parent":"modern-goth","children":[],"works":[{"title":"Black Water Sister","cover_url":"https://covers.openlibrary.org/b/id/11062263-L.jpg","shows_english_title":true,"authors":["Zen Cho"],"year":2021},{"title":"Build Your House Around My Body","cover_url":"https://covers.openlibrary.org/b/id/11556283-L.jpg","shows_english_title":true,"authors":["Violet Kupersmith"],"year":2021,"placement_note":"Penguin Random House calls it part ghost story and follows women bound through generations by ghosts, ancestors, possessed bodies and possessed lands; Oneworld ties their revenge to Vietnam's colonial past. Occult forces carry accumulated historical and familial darkness into modern Saigon, making Modern Goth the engine-level fit."},{"title":"Coyote Songs","cover_url":"https://covers.openlibrary.org/b/id/9192133-L.jpg","shows_english_title":true,"authors":["Gabino Iglesias"],"year":2018},{"title":"Empire of Wild","cover_url":"https://covers.openlibrary.org/b/id/10286612-L.jpg","shows_english_title":true,"authors":["Cherie Dimaline"],"year":2019,"placement_note":"SFE calls it a werewolf tale in which a Métis man is transformed into a white Christian preacher and his wife must bring him back to the real world to save her people. Its contemporary social world is haunted by predatory religious and colonial occult power, making Modern Gothic more specific than general paranormal fantasy."}],"definition":"Modern Gothic in which colonial violence and ancestral debt return as active hauntings of contemporary people, lands and identities.","status":"accepted","image":"199-postcolonial-gothic.webp"},{"id":"modern-occult","label":"Modern Occult","parent":"modern-goth","children":[],"works":[{"title":"Conjure Wife","cover_url":"https://covers.openlibrary.org/b/id/10943149-L.jpg","shows_english_title":true,"authors":["Fritz Leiber"],"year":1943},{"title":"Our Lady of Darkness","cover_url":"https://covers.openlibrary.org/b/id/10304918-L.jpg","shows_english_title":true,"authors":["Fritz Leiber"],"year":1977},{"title":"Supernatural Minnesota","cover_url":"https://covers.openlibrary.org/b/id/8272034-L.jpg","shows_english_title":true,"authors":["Thomas M. Disch"],"year":1984,"books":[{"title":"The Businessman","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/8272034-L.jpg"},{"title":"The M.D.","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/4037504-L.jpg"},{"title":"The Priest","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/417652-L.jpg"},{"title":"The Sub","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/418441-L.jpg"}]},{"title":"Ninth House","cover_url":"https://covers.openlibrary.org/b/id/12667414-L.jpg","shows_english_title":true,"authors":["Leigh Bardugo"],"year":2019,"placement_note":"Alex Stern can see the dead and is recruited to police Yale secret societies whose tombs run real occult rites - portal surgery, shape-shifting, drug-fueled communion. Occult systems operating inside a contemporary institution make Modern occult the closest leaf (cf. Conjure Wife campus witchcraft). Ghost presence is strong but serves the occult-institution frame."},{"title":"Sandman Slim","cover_url":"https://covers.openlibrary.org/b/id/8429564-L.jpg","shows_english_title":true,"authors":["Richard Kadrey"],"year":2009,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Urban fantasy -> Modern Goth -> Modern Occult. SFE places the sequence in monster-irradiated modern Los Angeles with horror, Hell and occult violence; Publishers Weekly centers a returned Hell hitman pursuing a black magician through magic-riddled LA. Modern Occult wins because occult systems and actors operate through the contemporary city; Occult police fails because Stark is a vigilante, not law enforcement."},{"title":"Blood Debts","cover_url":"https://covers.openlibrary.org/b/isbn/9781250825926-L.jpg","shows_english_title":true,"authors":["Terry J. Benton-Walker"],"year":2023,"placement_note":"Twin heirs of a secret magical dynasty operate inside contemporary New Orleans' organized magical community."},{"title":"Blood Justice","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250825954.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Terry J. Benton-Walker"],"year":2024,"placement_note":"Blood Debts sequel; the twins defend their throne within New Orleans' organized magical world - no vampire engine found in reviews."}],"definition":"Modern Gothic in which occult systems operate inside contemporary institutions, professions, cities and organized social life.","status":"accepted","image":"200-modern-occult.webp"},{"id":"suburban-gothic","label":"Suburban Gothic","parent":"modern-goth","children":[],"works":[{"title":"Fear","cover_url":"https://covers.openlibrary.org/b/id/6821701-L.jpg","shows_english_title":true,"authors":["L. Ron Hubbard"],"year":1940,"placement_note":"SFE calls Fear a classic psychological study of a man tortured by repressed hours and the demons of guilt; Galaxy Press describes a contemporary skeptic pursued by an evil that turns his familiar town against him. Its modern everyday world becoming a persecutory supernatural labyrinth fits Modern Goth."},{"title":"Good Neighbors","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781982144371/good-neighbors-9781982144371_lg.jpg","shows_english_title":true,"authors":["Sarah Langan"],"year":2021,"placement_note":"SFE calls it a near-future Horror in SF tale about a Long Island community disintegrating after a sinkhole appears; Simon & Schuster frames suburban deception, exclusion and collective menace. Contemporary social life curdling into uncanny horror makes Modern Goth closest."},{"title":"Pet","cover_url":"https://covers.openlibrary.org/b/id/8793960-L.jpg","shows_english_title":true,"authors":["Akwaeke Emezi"],"year":2019,"placement_note":"Lucille is a utopian town taught that angels destroyed all monsters; the creature Pet steps out of a painting to hunt a monster - an abuser hidden inside an ordinary family the community refuses to see. The ordinary community is the source of hidden persecution and uncanny menace: the suburban-gothic thesis. Runner-up contemporary-fantasy (left at 9; would have forced a partition proposal). Shelfmates: Fear, Good Neighbors. National Book Award finalist; Stonewall winner."}],"definition":"Modern Gothic in which the neighborhood or ordinary community becomes the source of persecution, exclusion and uncanny menace.","status":"accepted","image":"201-suburban-gothic.webp"},{"id":"war-gothic","label":"War Gothic","parent":"modern-goth","children":[],"works":[{"title":"Frankenstein in Baghdad","cover_url":"https://images1.penguinrandomhouse.com/cover/9780143128793","shows_english_title":true,"authors":["Ahmed Saadawi"],"year":2013,"placement_note":"SFE identifies a corpse assembled from bombing victims and possessed by a dead guard's soul; PRH confirms the unkillable flesh-eating monster stalking occupied Baghdad. A contemporary city haunted by war's accumulated dead makes Modern Goth the closest leaf."}],"definition":"Modern Gothic in which war's unresolved dead and accumulated violence return to haunt the contemporary world.","status":"accepted","image":"202-war-gothic.webp"},{"id":"speculative-fiction","label":"Speculative fiction","parent":null,"children":["fantasy","science-fiction"],"works":[],"image":"23-speculative-fiction.webp","definition":"Working project root; exact scope is an open decision.","status":"provisional"},{"id":"fabulation","label":"Fabulation","parent":"atemporal","children":["books-in-books","classic-fabulation","inner-space","body-myth","alternate-worlds","godgame"],"works":[],"image":"109-fabulation.webp","definition":"Experimental speculative fiction that foregrounds the act and arbitrariness of storytelling, using fantastic devices to challenge whether a world can be seen or reliably told (SFE Fabulation).","status":"accepted"},{"id":"new-weird","label":"New Weird","parent":"atemporal","children":[],"works":[{"title":"Bas-Lag","cover_url":"https://images.penguinrandomhouse.com/cover/9780345443021","shows_english_title":false,"authors":["China Miéville"],"year":2000,"books":[{"title":"Perdido Street Station","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/6375226-L.jpg"},{"title":"The Scar","year":2002,"cover_url":"https://covers.openlibrary.org/b/id/210923-L.jpg"},{"title":"Iron Council","year":2004,"cover_url":"https://covers.openlibrary.org/b/id/11950425-L.jpg"}]},{"title":"The Southern Reach Trilogy","cover_url":"https://images.booksense.com/images/042/824/9781250824042.jpg","shows_english_title":false,"authors":["Jeff VanderMeer"],"year":2014,"books":[{"title":"Annihilation","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/8408974-L.jpg"},{"title":"Authority","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/10526739-L.jpg"},{"title":"Acceptance","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/8441678-L.jpg"},{"title":"Absolution","year":2024,"cover_url":"https://covers.openlibrary.org/b/id/15174269-L.jpg"}]},{"title":"The Iron Dragon","cover_url":"https://covers.openlibrary.org/b/id/10031333-L.jpg","shows_english_title":true,"authors":["Michael Swanwick"],"year":1993,"books":[{"title":"The Iron Dragon's Daughter","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/10031333-L.jpg"},{"title":"The Dragons of Babel","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/2615790-L.jpg"},{"title":"The Iron Dragon's Mother","year":2019}]},{"title":"Cyber Mage","cover_url":"https://images.squarespace-cdn.com/content/v1/669172a9220c0d23ff8b86f1/ed55ee60-d1ea-4f3a-a865-eb073da1e977/CyberMage.jpg","shows_english_title":true,"authors":["Saad Z. Hossain"],"year":2021},{"title":"Dead Astronauts","cover_url":"https://s3.amazonaws.com/mcdbookimages/books/cover_images/000/000/162/reg/9780374720704_FC.jpg?1647524192","shows_english_title":true,"authors":["Jeff VanderMeer"],"year":2019,"placement_note":"SFE describes a surrealized SF Western and Time Opera whose typographical games enact bodily chaos across ruined worlds; SF, fantasy, ecological horror and formal mutation make New Weird closest."},{"title":"Her Body and Other Parties","cover_url":"https://images.squarespace-cdn.com/content/v1/58c1cee25016e17d84e3a1b8/1513195149247-V4C3H5Z51Q182NELWQF9/GW-HerBodyandOtherParties-Frontcover.jpg","shows_english_title":true,"authors":["Carmen Maria Machado"],"year":2017,"placement_note":"Graywolf says the collection deliberately collapses psychological realism, science fiction, horror, fantasy and fabulism; the Guardian likewise finds horror, SF and fairy tale merging across bodily transformations and formally daring stories. That radical hybrid of contemporary horror and speculative estrangement makes New Weird the closest existing leaf."},{"title":"Sleeping Worlds Have No Memory","cover_url":"https://static.wixstatic.com/media/fb3cf1_ac14fe8c87014de99887e636dd732fe1~mv2.jpg/v1/fit/w_500,h_500,q_90/file.jpg","shows_english_title":true,"authors":["Yaroslav Barsukov"],"year":2024,"placement_note":"In an invented kingdom edging toward steampunk, an exiled minister must finish a border tower held up by the Drakiri's incomprehensible tech - anti-gravity 'tulips' that can implode into mini black holes - and learns its completion would open an interdimensional rift to the Mimic Tower (Locus: 'an almost New Weird science fantasy'; Kirkus: 'fantasy and SF'). No magic; strange technology in a mixed-mode world. Nebula 2025 shortlist. Placed by Gustav's 23:33 ruling."}],"image":"18-new-weird.webp","definition":"Cross-genre speculative fiction that freely mingles science-fiction, dark-fantasy, and horror modes, often using strange, materially detailed settings, grotesquerie, ecological unease, or transformations that resist a single explanatory genre.","status":"accepted"},{"id":"alien-invasion-fiction","label":"Alien invasion fiction","parent":"modern-day","children":[],"works":[{"title":"The Aleutian Trilogy","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/03/hbg-title-white-queen-2-28.jpg","shows_english_title":false,"authors":["Gwyneth Jones"],"year":1991,"books":[{"title":"White Queen","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/183621-L.jpg"},{"title":"North Wind","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/182772-L.jpg"},{"title":"Phoenix Café","year":1997}]},{"title":"Footfall","cover_url":"https://upload.wikimedia.org/wikipedia/en/b/b0/Footfall%281stEd%29.jpg","shows_english_title":true,"authors":["Larry Niven","Jerry Pournelle"],"year":1985},{"title":"The War of the Worlds","cover_url":"https://images.penguinrandomhouse.com/cover/9780451530653","shows_english_title":true,"authors":["H. G. Wells"],"year":1898},{"title":"The Midwich Cuckoos","cover_url":"https://covers.openlibrary.org/b/id/8037293-L.jpg","shows_english_title":true,"authors":["John Wyndham"],"year":1957},{"title":"Annex","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/05/hbg-title-annex-2.jpg?w=450","shows_english_title":true,"authors":["Rich Larson"],"year":2018},{"title":"Nova Express","cover_url":"https://covers.openlibrary.org/b/id/14303348-L.jpg","shows_english_title":true,"authors":["William S. Burroughs"],"year":1964,"placement_note":"SFE burroughs_william_s: Nova Express brings sf metaphors into lurid perspective - the 'Nova Mob', galactic gangsters taking over our planet; images of space flight and biomorphic horror. Alien occupation of Earth -> alien-invasion-fiction."},{"title":"The Puppet Masters","cover_url":"cover-the-puppet-masters.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1951,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Alien invasion fiction. Baen centers slug-like aliens landing in Iowa, taking complete control of human hosts, infiltrating government and threatening the nation. Extraterrestrial occupation through parasitic possession is the direct governing engine."},{"title":"The Wormwood Trilogy","cover_url":"cover-rosewater.jpg","shows_english_title":true,"authors":["Tade Thompson"],"year":2016,"books":[{"title":"Rosewater","year":2016,"cover_url":"cover-rosewater.jpg","shows_english_title":true},{"title":"The Rosewater Insurrection","year":2019,"cover_url":"cover-the-rosewater-insurrection.jpg","shows_english_title":true},{"title":"The Rosewater Redemption","year":2019,"cover_url":"cover-the-rosewater-redemption.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Alien invasion fiction. Orbit/Hachette centers the Nigerian city of Rosewater around alien Wormwood while a hidden invasion advances from biodome and xenoform assimilation to open warfare and alien plans to take human bodies. Extraterrestrial colonization and replacement govern the trilogy."}],"image":"4-alien-invasion-fiction.webp","definition":"Science fiction centered on extraterrestrial forces attacking, occupying, colonizing, or attempting to conquer Earth or another human world.","status":"accepted"},{"id":"genetic-engineering","label":"Genetic Engineering","parent":"modern-day","children":[],"works":[{"title":"Jurassic Park","year":1990,"authors":["Michael Crichton"],"cover_url":"https://covers.openlibrary.org/b/id/8749000-L.jpg","shows_english_title":true,"books":[{"title":"Jurassic Park","year":1990,"authors":["Michael Crichton"],"cover_url":"https://covers.openlibrary.org/b/id/8749000-L.jpg"},{"title":"The Lost World","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/10656102-L.jpg"}],"placement_note":"SFE Crichton says the Jurassic Park sequence argues the risks of uncontrolled genetic engineering, with dinosaurs reconstructed from genetic scraps; the science is the story engine."},{"title":"Never Let Me Go","cover_url":"https://covers.openlibrary.org/b/id/6543832-L.jpg","shows_english_title":true,"authors":["Kazuo Ishiguro"],"year":2005},{"title":"Ghost Species","cover_url":"https://cdn2.penguin.com.au/covers/400/9781926428666.jpg","shows_english_title":true,"authors":["James Bradley"],"year":2020,"placement_note":"SFE and Penguin describe a secret project using genetic reconstruction to resurrect extinct species and create a Neanderthal child. Deliberate reconstruction of an extinct human genome drives the premise, making Genetic Engineering closest."},{"title":"Sorrowland","cover_url":"https://mpd-biblio-covers.imgix.net/9780374266776.jpg","shows_english_title":true,"authors":["Rivers Solomon"],"year":2021,"placement_note":"A secret government experiment implants Cainland's residents with a fungal organism; Vern develops superhuman healing, strength and an exoskeleton. Gothic/cult horror is the mode, deliberate biological reconstruction the engine."},{"title":"The Echo Wife","cover_url":"271-the-echo-wife.jpg","shows_english_title":true,"authors":["Sarah Gailey"],"year":2021,"placement_note":"SFE and Macmillan center cloning researcher Evelyn Caldwell and Martine, a genetically cloned replica made from her work. Deliberate human genetic replication drives the domestic thriller, making Genetic Engineering exact."},{"title":"Thirteen Ways to Kill Lulabelle Rock","cover_url":"https://images4.penguinrandomhouse.com/cover/700jpg/9781915202901","shows_english_title":true,"authors":["Maud Woolf"],"year":2023,"placement_note":"A clone made to stand in for a celebrity is sent to kill the star's other clones (Scotsman, LoveReading)."}],"image":"110-genetic-engineering.webp","definition":"Science fiction in which deliberate manipulation, reconstruction, or design of genes and living organisms drives the premise (SFE Genetic Engineering).","status":"accepted"},{"id":"first-contact-fiction","label":"Earthbound 1st Contact","parent":"modern-day","children":["alien-arrival","alien-message"],"works":[],"image":"211-earthbound-first-contact.webp","definition":"First-contact fiction whose defining encounter reaches humanity on recognizable present-day Earth, whether through physical arrival or a message, voice, mind, signal, or artifact.","status":"accepted"},{"id":"alien-arrival","label":"Alien Arrival","parent":"first-contact-fiction","children":[],"works":[{"title":"Agent to the Stars","cover_url":"https://www.scalzi.com/whatever/a2scover2.jpg","shows_english_title":true,"authors":["John Scalzi"],"year":2005},{"title":"Childhood's End","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-childhoods-end-2-159.jpg","shows_english_title":true,"authors":["Arthur C. Clarke"],"year":1953},{"title":"Way Station","cover_url":"https://covers.openlibrary.org/b/id/15220517-L.jpg","shows_english_title":true,"authors":["Clifford D. Simak"],"year":1963},{"title":"Yesterday's Kin","cover_url":"https://nancykress.com/wp-content/uploads/2018/04/tomorrows-kin-329x4991.jpg","shows_english_title":true,"authors":["Nancy Kress"],"year":2017,"books":[{"title":"Tomorrow's Kin","year":2017,"cover_url":"https://nancykress.com/wp-content/uploads/2018/04/tomorrows-kin-329x4991.jpg","shows_english_title":true},{"title":"If Tomorrow Comes","year":2018,"cover_url":"https://nancykress.com/wp-content/uploads/2018/04/if-tomorrow-comes-329x500.jpg","shows_english_title":true},{"title":"Terran Tomorrow","year":2018,"cover_url":"https://book-assets.openroadmedia.com/9780765390370.jpg","shows_english_title":true}],"placement_note":"Tor identifies this as a hard-SF trilogy about human genetics and cultures on two distant planets. The aliens first arrive at New York, then humans follow them home and face an unexpected society before the consequences return to Earth. The full arc is driven by first contact and its cultural aftermath."},{"id":"to-walk-the-night","title":"To Walk the Night","authors":["William Sloane"],"year":1937,"books":[{"title":"To Walk the Night","year":1937,"cover_url":"cover-to-walk-the-night.jpg"}],"cover_url":"cover-to-walk-the-night.jpg"}],"image":"208-alien-arrival.webp","definition":"First-contact fiction in which extraterrestrials physically arrive on Earth, so humanity’s first consequential encounter happens on our own world.","status":"accepted"},{"id":"alien-expedition","label":"Alien Expedition","parent":"first-contact","children":[],"works":[{"title":"A Case of Conscience","cover_url":"https://covers.openlibrary.org/b/id/14924819-L.jpg","shows_english_title":true,"authors":["James Blish"],"year":1958},{"title":"The Sparrow","cover_url":"https://covers.openlibrary.org/b/id/418903-L.jpg","shows_english_title":true,"authors":["Mary Doria Russell"],"year":1996,"books":[{"title":"The Sparrow","year":1996},{"title":"Children of God","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/225523-L.jpg"}]},{"title":"Binti","cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756416935","shows_english_title":true,"authors":["Nnedi Okorafor"],"year":2015,"books":[{"title":"Binti","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/8441703-L.jpg"},{"title":"Binti: Home","year":2017},{"title":"Binti: The Night Masquerade","year":2018}]},{"id":"semiosis","title":"Semiosis","authors":["Sue Burke"],"year":2018,"cover":"https://covers.openlibrary.org/b/id/13806290-L.jpg","placement_note":"Root-down: Science fiction -> Futurist -> Alien fiction -> First Contact -> Alien Expedition. Harper Voyager explicitly calls it a first-contact novel: settlers travel to distant Pax and must communicate and coexist with its intelligent plants. Space colonies is rejected because the first consequential encounter and negotiated coexistence, not an already-established colony’s civic life, is the engine.","sources":["https://harpervoyagerbooks.co.uk/products/semiosis-a-novel-of-first-contact-sue-burke-9780008300777/","https://www.theverge.com/2018/2/10/16994952/sue-burke-semiosis-first-contact-science-fiction-intelligenet-plants-book-review"],"cover_url":"https://covers.openlibrary.org/b/id/13806290-L.jpg","shows_english_title":true},{"title":"Shroud","cover_url":"https://covers.openlibrary.org/b/id/15093927-L.jpg","shows_english_title":true,"authors":["Adrian Tchaikovsky"],"year":2025,"placement_note":"A survey crew on the lightless alien moon Shroud meets life beyond understanding (Locus, IGN: cosmic-horror SF). Humans travel out and meet the alien."}],"image":"209-alien-expedition.webp","definition":"First-contact fiction in which humans travel outward on a mission or voyage and encounter an extraterrestrial intelligence or society away from Earth.","status":"accepted"},{"id":"alien-message","label":"Alien Message","parent":"first-contact-fiction","children":[],"works":[{"title":"Contact","cover_url":"https://covers.openlibrary.org/b/id/13110389-L.jpg","shows_english_title":true,"authors":["Carl Sagan"],"year":1985},{"title":"Chocky","cover_url":"https://covers.openlibrary.org/b/id/12215385-L.jpg","shows_english_title":true,"authors":["John Wyndham"],"year":1968,"placement_note":"Penguin explicitly calls this alien contact: an unseen extraterrestrial intelligence communicates through Matthew, teaching alien mathematics and anti-gravity ideas and experimenting from afar."},{"title":"Juniper Time","cover_url":"https://covers.openlibrary.org/b/id/14642898-L.jpg","shows_english_title":true,"authors":["Kate Wilhelm"],"year":1979,"placement_note":"Hachette sets Earth's survival against catastrophic western drought, refugee camps and an orbital artifact that may be humanity's first contact with aliens, which only Jean can decode. The consequential alien artifact and attempted communication, rather than the climate backdrop alone, make First contact fiction the central engine."},{"title":"Remembrance of Earth's Past","cover_url":"https://mpd-biblio-covers.imgix.net/9780765377067.jpg","shows_english_title":false,"authors":["Liu Cixin"],"year":2006,"books":[{"title":"The Three-Body Problem","year":2006},{"title":"The Dark Forest","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/10526598-L.jpg"},{"title":"Death's End","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/7893958-L.jpg"}],"placement_note":"Gustav’s ruling places the series by its famous first book: The Three-Body Problem unfolds chiefly on modern-day Earth, and the Red Coast telescope message exchange with Trisolaris is the defining first-contact act for the whole sequence, despite later future eras and physical conflict."},{"title":"Roadside Picnic","cover_url":"https://covers.openlibrary.org/b/id/6752719-L.jpg","shows_english_title":true,"authors":["Arkady Strugatsky","Boris Strugatsky"],"year":1972,"placement_note":"Root-down: Science fiction -> Modern day -> Earthbound 1st Contact -> Alien Message. SFE places it in a near-future recognizable Earth after an unexplained alien interference whose artifacts are humanity’s only consequential contact. Alien Arrival fails because no alien appears; Alien Invasion fails because the visitation is apparently accidental, not conquest."},{"title":"In Ascension","cover_url":"https://covers.openlibrary.org/b/id/14577092-L.jpg","shows_english_title":true,"authors":["Martin MacInnes"],"year":2023,"placement_note":"A marine biologist follows an anomalous deep-sea trench and then a space mission toward an object sending an inexplicable signal (Guardian: 'from the ocean floor to outer space'). The encounter comes through a distant signal and artifact."}],"image":"210-alien-message.webp","definition":"First-contact fiction in which the first consequential encounter is mediated at a distance through a signal, voice, mind, or artifact rather than a physical visit.","status":"accepted"},{"id":"alternate-history","label":"Alternate history","parent":"historical","children":["period-alterations","deep-alterations"],"works":[],"image":"5-alternate-history.webp","definition":"Fiction set in a history that diverges from the known world at an identifiable or implied turning point.","status":"accepted"},{"id":"period-alterations","label":"Period alterations","parent":"alternate-history","children":["alt-prewar","alt-postwar","alt-civil-war","alt-cold-war","alt-present"],"works":[],"definition":"Alternate histories in which the alteration starts within living memory of the story being depicted, roughly less than a lifetime before its present.","status":"accepted","image":"145-period-alterations.webp"},{"id":"alt-postwar","label":"Alt Postwar","parent":"period-alterations","children":[],"works":[{"title":"Fatherland","cover_url":"https://images.penguinrandomhouse.com/cover/9780812977219","shows_english_title":true,"authors":["Robert Harris"],"year":1992},{"title":"The Man in the High Castle","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/05/hbg-title-the-man-in-the-high-castle-2-141.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1962},{"title":"The Yiddish Policemen's Union","cover_url":"https://covers.openlibrary.org/b/id/12745212-L.jpg","shows_english_title":true,"authors":["Michael Chabon"],"year":2007,"placement_note":"SFE explicitly calls it an Alternate History SF novel: a Jewish homeland in Alaska follows a changed WWII and the collapse of Israel."},{"title":"Ascent","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9780743298230/ascent-9780743298230_lg.jpg","shows_english_title":true,"authors":["Jed Mercurio"],"year":2007,"placement_note":"A Soviet Korean War ace survives where his counterpart did not and becomes the first man on the Moon; the altered wartime fork is viewed through the postwar space race."},{"title":"The Sound of His Horn","cover_url":"cover-the-sound-of-his-horn.jpg","shows_english_title":true,"authors":["Sarban"],"year":1952,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Alternate history -> Period alterations -> Alt postwar. Tartarus Press sends a WWII POW into an alternate future where Nazis won the war and rule a century later, using genetic experiments to make human hunting prey. The changed postwar Nazi victory world governs."},{"title":"Biography of X","cover_url":"https://covers.openlibrary.org/b/isbn/9780374606176-L.jpg","shows_english_title":true,"authors":["Catherine Lacey"],"year":2023,"placement_note":"The South secedes in 1945 into a fascist theocracy; the changed America is depicted across the postwar decades."}],"definition":"Alternate histories whose fork occurs during the Second World War and whose changed world is depicted after it.","status":"accepted","image":"146-alt-postwar.webp"},{"id":"alt-civil-war","label":"Alt Civil War","parent":"period-alterations","children":[],"works":[{"title":"The Guns of the South","cover_url":"https://cdn2.penguin.com.au/covers/400/9780345384683.jpg","shows_english_title":true,"authors":["Harry Turtledove"],"year":1992},{"title":"River of Teeth","cover_url":"https://mpd-biblio-covers.imgix.net/9780765395238.jpg","shows_english_title":true,"authors":["Sarah Gailey"],"year":2017,"books":[{"title":"River of Teeth","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8447432-L.jpg"},{"title":"Taste of Marrow","year":2017}]},{"title":"Bring the Jubilee","cover_url":"https://book-assets.openroadmedia.com/9781504044639.jpg","shows_english_title":true,"authors":["Ward Moore"],"year":1953,"placement_note":"SFE calls it the first significant alternate-history tale in which the South wins the American Civil War, then sends its historian back to Gettysburg where his intervention changes the battle and timeline. The fork and central historical substance are the Civil War, exactly matching Alt Civil War."},{"title":"Dread Nation","cover_url":"https://covers.openlibrary.org/b/isbn/9780062570604-L.jpg","shows_english_title":true,"authors":["Justina Ireland"],"year":2018,"books":[{"title":"Dread Nation","year":2018,"cover_url":"https://covers.openlibrary.org/b/isbn/9780062570604-L.jpg","shows_english_title":true},{"title":"Deathless Divide","year":2020,"cover_url":"https://covers.openlibrary.org/b/isbn/9780062570635-L.jpg","shows_english_title":true}]}],"definition":"Alternate histories whose fork occurs on the eve of or during the United States Civil War era.","status":"accepted","image":"147-alt-civil-war.webp"},{"id":"alt-cold-war","label":"Alt Cold War","parent":"period-alterations","children":[],"works":[{"title":"Watchmen","cover_url":"https://covers.openlibrary.org/b/id/14613329-L.jpg","shows_english_title":false,"authors":["Alan Moore","Dave Gibbons"],"year":1986,"placement_note":"SFE calls it an Alternate History superhero story: costumed heroes alter twentieth-century politics and technology, producing a 1985 where America won Vietnam, Nixon remains president and nuclear war looms."},{"title":"Lady Astronaut","cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/CalculatingStars_comp_v7_final.jpg","shows_english_title":true,"authors":["Mary Robinette Kowal"],"year":2018,"books":[{"title":"The Calculating Stars","year":2018,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/CalculatingStars_comp_v7_final.jpg"},{"title":"The Fated Sky","year":2018,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/Fated-Sky.jpg"},{"title":"The Relentless Moon","year":2020,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2020/07/The-Relentless-Moon.jpg"},{"title":"The Martian Contingency","year":2025,"cover_url":"https://maryrobinettekowal.com/wp-content/uploads/2024/08/MartianContingency_comp2.jpg"}]}],"definition":"Alternate histories whose fork and central historical substance belong to the Cold War.","status":"accepted","image":"148-alt-cold-war.webp"},{"id":"alt-present","label":"Alt Present","parent":"peri der-relative and author-relative sorting. Gustav 2026-09-23: \"Always do the walk, I meant, when in sci fi, anything time travel goes Atemporal.\" and \"I prefer any, if someone travels over the border of historical eras, it can mess up sorting in the other genres, this is what Atemporal is for.\"","status":"candidate"},{"id":"time-machines","label":"Time Machines","parent":"time-travel-fiction","children":["homebrew-time-machines","time-travel-agency"],"works":[],"definition":"Time travel enabled by a built device or institutional apparatus, divided by who owns the machine: an individual's homebrew device or an organization's apparatus. Owner test: take away the organization; if the time travel has no owner left, it is Time travel agency.","status":"accepted","image":"102-time-machines.webp"},{"id":"hard-time-travel","label":"Hard Time Travel","parent":"time-travel-fiction","children":[],"works":[{"title":"Timescape","cover_url":"https://x.sf-encyclopedia.com/gal/clute/Benford-Timescape.jpg","shows_english_title":true,"authors":["Gregory Benford"],"year":1980}],"definition":"Time travel or communication made central through a rigorously developed physical mechanism.","status":"accepted","image":"103-hard-time-travel.webp"},{"id":"ancestral-time-travel","label":"Ancestral Time Travel","parent":"time-travel-fiction","children":[],"works":[{"title":"Kindred","cover_url":"https://covers.openlibrary.org/b/isbn/9780704341623-L.jpg","shows_english_title":true,"authors":["Octavia E. Butler"],"year":1979},{"title":"Outlander","cover_url":"https://covers.openlibrary.org/b/id/6548767-L.jpg","shows_english_title":true,"authors":["Diana Gabaldon"],"year":1991,"books":[{"title":"Outlander","year":1991,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/6548767-L.jpg","shows_english_title":true},{"title":"Dragonfly in Amber","year":1992,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/6920490-L.jpg","shows_english_title":true ry.org/b/id/432217-L.jpg","shows_english_title":true,"authors":["Ken Grimwood"],"year":1987},{"title":"This Time Tomorrow","cover_url":"https://covers.openlibrary.org/b/isbn/9780525539018-L.jpg","shows_english_title":true,"authors":["Emma Straub"],"year":2022},{"title":"How to Live Safely in a Science Fictional Universe","cover_url":"https://www.charlesyuauthor.com/wp-content/uploads/2019/07/Cover-How-To.jpg","shows_english_title":true,"authors":["Charles Yu"],"year":2010,"placement_note":"SFE follows a time-travel repairman through loops and impasses as he revisits personal triumphs and traumas; PRH centers the son’s search for his vanished time-machine-inventor father through quantum space-time. Recurrence and self-encounter make Time Loops exact."},{"title":"Opposite of Always","authors":["Justin A. Reynolds"],"year":2019,"cover_url":"https://covers.openlibrary.org/b/id/8797533-L.jpg","shows_english_title":true,"placement_note":"Locus (Mondor): Jack travels back over the same months again and again to save Kate, Groundhog Day explicitly name-checked - the repeated reliving of a span of life is the time-loops definition."},{"title":"The Paradox Men","cover_url":"cover-the-paradox-men.jpg","shows_english_title":true,"authors":["Charles L. Harness"],"year":1953,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Time travel fiction -> Time loops. SFE identifies the novel as explicitly built on cyclic history, with a hero undergoing transcendental metamorphosis to return in time and remake the world. Imperial revolution and space-opera spectacle are carried by the closed temporal cycle, so looping history governs."},{"title":"Edge of Oblivion","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1836285469.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Kirk Weddell"],"year":2025,"placement_note":"After watching Earth explode, a scientist and his AI are thrown back 24 hours to find out why (author site, Troubador)."}],"definition":"Time travel structured as the repeated reliving of a span of life or history.","status":"accepted","image":"105-time-loops.webp"},{"id":"extra-dimensional-awareness","label":"Extra dimensional awareness","parent":"time-travel-fiction","children":[],"works":[{"title":"Slaughterhouse-Five","cover_url":"https://covers.openlibrary.org/b/id/15118509-L.jpg","shows_english_title":true,"authors":["Kurt Vonnegut"],"year":1969}],"definition":"Time travel experienced as awareness of time as an additional dimension, with moments perceived and revisited across a whole lifespan.","status":"accepted","image":"106-extra-dimensional-awareness.webp"},{"id":"time-travel-disorders","label":"Time Travel Disorders","parent":"time-travel-fiction","children":[],"works":[{"title":"The Time Traveler's Wife","cover_url":"https://covers.openlibrary.org/b/isbn/9781476764832-L.jpg","shows_english_title":true,"authors":["Audrey Niffenegger"],"year":2003},{"id":"yesterday-is-history","title":"Yesterday Is History","authors":["Kosoko Jackson"],"year":2021,"cover_url":"cover-yesterday-is-history.jpg","shows_english_title":true,"books":[{"title":"Yesterday Is History","year":2021,"cover_url":"cover-yesterday-is-history.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Time travel fiction -> Time Travel Disorders. After a liver transplant, Boston teen Andre learns that his donor's ability to time travel came with the organ, and he keeps waking up in 1969 (Kirkus; SLJ; Bulletin of the Center for Children's Books). The time travel is an inherited biological condition of the traveler."}],"definition":"Time travel caused by an intrinsic medical or biological condition of the traveler.","status":"accepted","image":"107-time-travel-disorders.webp"},{"id":"timeslips","label":"Timeslips","parent":"time-travel-fiction","children":[],"works":[{"title":"The Dream Years","cover_url":"cover-the-dream-years.webp","shows_english_title":true,"author ":"A Wrinkle in Time","year":1962,"cover_url":"https://covers.openlibrary.org/b/id/8737958-L.jpg","shows_english_title":true},{"title":"A Wind in the Door","year":1973,"cover_url":"https://covers.openlibrary.org/b/id/8276481-L.jpg","shows_english_title":true},{"title":"A Swiftly Tilting Planet","year":1978,"cover_url":"https://covers.openlibrary.org/b/id/1170041-L.jpg","shows_english_title":true},{"title":"Many Waters","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/6536498-L.jpg","shows_english_title":true},{"title":"An Acceptable Time","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/223658-L.jpg","shows_english_title":true}],"placement_note":"The sequence repeatedly crosses time without a stable built time machine: A Swiftly Tilting Planet rides through centuries, Many Waters sends the twins to the world of Noah, and An Acceptable Time opens into another era. Its varied, psychologically and cosmologically entangled transfers fit Timeslips best among the existing time-travel leaves."},{"title":"Lest Darkness Fall","cover_url":"https://covers.openlibrary.org/b/id/7401260-L.jpg","shows_english_title":true,"authors":["L. Sprague de Camp"],"year":1939,"placement_note":"Speculative fiction -> Science fiction -> Atemporal -> Time travel fiction -> Timeslips. Gustav ruling 2026-09-23 09:48: any time travel goes Atemporal. A modern archaeologist is thrown back to sixth-century Rome by a lightning storm, with no built machine; previously Historical -> Alternate history -> Deep alterations."},{"title":"Woman on the Edge of Time","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9781529100570/9781529100570-jacket-large.jpg","shows_english_title":true,"authors":["Marge Piercy"],"year":1976,"placement_note":"Speculative fiction -> Science fiction -> Atemporal -> Time travel fiction -> Timeslips. Gustav rulings 2026-09-23 09:48/09:56: any SF-side time travel, premise or element, goes Atemporal -> Time travel fiction. Connie Ramos, a mind receptive to contact, crosses into the 2137 of Mattapoisett with no machine on her side; the crossing is psychologically entangled with her confinement, which is the Timeslips gate. Previously Futurist -> Future of Earth fiction -> Utopian fiction -> Hopepunk -> Feminist utopia."}],"image":"112-timeslips.webp","definition":"Time transfer through an unexplained or natural shift rather than a built machine, often one-off and psychologically entangled (SFE Timeslip).","status":"candidate"},{"id":"time-distortion","label":"Time Distortion","parent":"time-travel-fiction","children":[],"works":[{"title":"Spin","cover_url":"https://covers.openlibrary.org/b/id/6632328-L.jpg","shows_english_title":true,"authors":["Robert Charles Wilson"],"year":2005,"books":[{"title":"Spin","year":2005,"authors":["Robert Charles Wilson"],"cover_url":"https://covers.openlibrary.org/b/id/6632328-L.jpg"},{"title":"Axis","year":2007,"authors":["Robert Charles Wilson"],"cover_url":"https://covers.openlibrary.org/b/id/1443032-L.jpg"},{"title":"Vortex","year":2011,"authors":["Robert Charles Wilson"],"cover_url":"https://covers.openlibrary.org/b/id/9348869-L.jpg"}]}],"image":"114-time-distortion.webp","definition":"SF in which different regions or worlds run at radically different rates of time, and that unequal passage shapes the story (SFE Time Distortion).","status":"candidate"},{"id":"gothic-science-fiction","label":"Gothic science fiction","parent":"proto-sf","children":["mad-science-gothic","cosmic-gothic"],"works":[],"image":"29-gothic-science-fiction.webp","definition":"In this taxonomy, Gothic science fiction is historical science fiction: period-set tales of Promethean creation, mad scientists, doubles and the monstrous, where mystery and terror outweigh cognition. Modern-set Gothic-science-fiction spins live elsewhere in the tree.","status":"umbrella"},{"id":"portal-fantasy","label":"Portal fantasy","parent":"fantasy","children":["whimsical-doors","eldritch-doors","transporting-tomes","fantasy-rifts"],"works":[],"image":"30-portal-fantasy.webp","definition":"Fantasy organized by the mechanics of crossing: an anchored physical threshold, a book or text, or an unanchored tear between realities.","status":"provisional"},{"id":"animal-fantasy","label":"Animal fantasy","parent":"real-earth-universe","children":[],"works":[{"title":"Animal Farm","cover_url":"https://covers.openlibrary.org/b/id/12408412-L.jpg","shows_english_title":true,"authors":["George Orwell"],"year":1945},{"title":"Watership Down","cover_url":"https://covers.openlibrary.org/b/id/93454-L.jpg","shows_english_title":true,"authors":["Richard Adams"],"year":1972},{"title":"The Wind in the Willows","cover_url":"https://covers.openlibrary.org/b/id/8451347-L.jpg","shows_english_title":true,"authors":["Kenneth Grahame"],"year":1908},{"title":"The Little Prince","cover_url":"https://covers.openlibrary.org/b/id/12381932-L.jpg","shows_english_title":true,"authors":["Antoine de Saint-Exupéry"],"year":1943},{"title":"Doctor Dolittle","cover_url":"cover-the-story-of-doctor-dolittle.jpg","shows_english_title":true,"authors":["Hugh Lofting"],"year":1920,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Animal fantasy. The official Simon & Schuster complete collection establishes the thirteen-text sequence. Animal speech, agency, friendship and cross-species society govern.","books":[{"title":"The Story of Doctor Dolittle","year":1920,"cover_url":"cover-the-story-of-doctor-dolittle.jpg","shows_english_title":true},{"title":"The Voyages of Doctor Dolittle","year":1922,"cover_url":"https://covers.openlibrary.org/b/id/281218-L.jpg","shows_english_title":true},{"title":"Doctor Dolittle's Post Office","year":1923,"cover_url":"https://covers.openlibrary.org/b/id/8442100-L.jpg","shows_english_title":true},{"title":"Doctor Dolittle's Circus","year":1924,"cover_url":"https://covers.openlibrary.org/b/id/14947199-L.jpg","shows_english_title":true},{"title":"Doctor Dolittle's Zoo"

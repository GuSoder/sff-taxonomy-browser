g/b/id/10320442-L.jpg","shows_english_title":true,"authors":["Daniel Keyes"],"year":1966},{"title":"More Than Human","cover_url":"https://covers.openlibrary.org/b/id/8765093-L.jpg","shows_english_title":true,"authors":["Theodore Sturgeon"],"year":1953},{"title":"The Three Stigmata of Palmer Eldritch","cover_url":"https://covers.openlibrary.org/b/id/14588882-L.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1965},{"title":"Crash","cover_url":"https://covers.openlibrary.org/b/id/6484321-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1973},{"title":"Her Smoke Rose Up Forever","cover_url":"https://tachyonpublications.com/wp-content/uploads/2004/12/Her-Smoke-RGB.jpg","shows_english_title":true,"authors":["James Tiptree Jr."],"year":1990,"placement_note":"SFE calls this a retrospective collection of Tiptree’s major stories and identifies her extraordinary 1970s genre-SF short fiction as her lasting achievement. Tachyon says its eighteen stories explore alienation and gender alongside major SF concerns. Social science fiction is the closest leaf because human psychology and social identity drive its speculative premises."},{"title":"Catherine House","cover_url":"https://covers.openlibrary.org/b/id/9830444-L.jpg","shows_english_title":true,"authors":["Elisabeth Thomas"],"year":2020,"placement_note":"Set explicitly in 1996; a closed college uses plasm, mass hypnosis and psychosexual healing to reshape memory and identity. Modern-day Social science fiction is the closest existing leaf after historical Gothic enforcement."},{"title":"The Embedding","cover_url":"273-the-embedding.jpg","shows_english_title":true,"authors":["Ian Watson"],"year":1973,"placement_note":"SFE calls it the SF linguistics novel par excellence: three linked experiments test Whorfian language/perception through children, an Amazonian people and visiting aliens. Linguistics and anthropology govern over the First Contact subplot."},{"title":"The Weight of the Stars","cover_url":"cover-the-weight-of-the-stars.jpg","shows_english_title":true,"authors":["K. Ancrum"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Social science fiction. A one-way astronaut mission supplies the premise, while class, chosen family, grief, romance and the human price of exploration govern."}],"image":"32-social-science-fiction.webp","definition":"Science fiction driven by psychology, sociology, anthropology, linguistics and other social sciences rather than by physical or engineering problems.","status":"provisional"},{"id":"xenolinguistics","label":"Xenolinguistics","parent":"anthropological-science-fiction","children":[],"image":"176-xenolinguistics.webp","definition":"Anthropological science fiction where the encounter runs through language: translation, alien speech, and the ways language shapes thought and culture.","status":"candidate","works":[{"title":"Babel-17","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-babel-17-2-163.jpg","shows_english_title":true,"authors":["Samuel R. Delany"],"year":1966},{"title":"Foreigner","cover_url":"https://covers.openlibrary.org/b/id/503794-L.jpg","shows_english_title":true,"authors":["C. J. Cherryh"],"year":1994,"books":[{"title":"Foreigner","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/503794-L.jpg","shows_english_title":true},{"title":"Invader","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/3838455-L.jpg","shows_english_title":true},{"title":"Inheritor","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/683334-L.jpg","shows_english_title":true},{"title":"Precursor","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/683447-L.jpg","shows_english_title":true},{"title":"Defender","year":2001,"cover_url":"https://covers.openlibrary.org/b/id/503636-L.jpg","shows_english_title":true},{"title":"Explorer","year":2002,"cover_url":"https://covers.openlibrary.org/b/id/503682-L.jpg","shows_english_title":true},{"title":"Destroyer","year":2005,"cover_url":"https://covers.openlibrary.org/b/id/6962803-L.jpg","shows_english_title":true},{"title":"Pretender","year":2005,"cover_url":"https://covers.openlibrary.org/b/id/503901-L.jpg","shows_english_title":true},{"title":"Deliverer","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/1413233-L.jpg","shows_english_title":true},{"title":"Conspirator","year":2009,"cover_url":"https://covers.openlibrary.org/b/id/6378345-L.jpg","shows_english_title":true},{"title":"Deceiver","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/7247995-L.jpg","shows_english_title":true},{"title":"Betrayer","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/13095902-L.jpg","shows_english_title":true},{"title":"Intruder","year":2012,"cover_url":"https://covers.openlibrary.org/b/id/7572096-L.jpg","shows_english_title":true},{"title":"Protector","year":2013,"cover_url":"https://images.penguinrandomhouse.com/cover/9780756408534","shows_english_title":true},{"title":"Peacemaker","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/7352861-L.jpg","shows_english_title":true},{"title":"Tracker","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/10651397-L.jpg","shows_english_title":true},{"title":"Visitor","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/10484921-L.jpg","shows_english_title":true},{"title":"Convergence","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8422796-L.jpg","shows_english_title":true},{"title":"Emergence","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/8804221-L.jpg","shows_english_title":true},{"title":"Resurgence","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/9248606-L.jpg","shows_english_title":true},{"title":"Divergence","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10239694-L.jpg","shows_english_title":true},{"title":"Defiance","year":2023,"cover_url":"https://images.penguinrandomhouse.com/cover/9780756415914","shows_english_title":true}],"placement_note":"SFE identifies the long Foreigner sequence as Planetary Romance focused on an alien civilization and says Emergence places Bren Cameron as adviser to its crown prince. PRH explicitly calls the series anthropological SF and centers diplomacy plus detailed human/atevi cultural interaction."},{"title":"Stranger in a Strange Land","cover_url":"https://covers.openlibrary.org/b/id/15243051-L.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1961},{"title":"The Mountain in the Sea","cover_url":"https://covers.openlibrary.org/b/id/14642507-L.jpg","shows_english_title":true,"authors":["Ray Nayler"],"year":2022,"placement_note":"A marine biologist tries to talk with an octopus species that has developed language and culture (New Scientist: a study of consciousness; Kirkus). A nonhuman-intelligence encounter run through language and sign."}]},{"id":"xenocolonial","label":"Xenocolonial","parent":"anthropological-science-fiction","children":[],"image":"177-xenocolonial.webp","definition":"Anthropological science fiction where the alien encounter takes the form of colonization, occupation, or cultural erasure.","status":"candidate","works":[{"title":"The Martian Chronicles","cover_url":"https://covers.openlibrary.org/b/id/14828149-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1950},{"title":"Exo","cover_url":"https://www.fondalee.com/wp-content/uploads/2019/07/EXO_422x638.jpg","shows_english_title":true,"authors":["Fonda Lee"],"year":2017,"books":[{"title":"Exo","year":2017,"cover_url":"https://www.fondalee.com/wp-content/uploads/2019/07/EXO_422x638.jpg","shows_english_title":true},{"title":"Cross Fire","year":2018,"cover_url":"https://www.fondalee.com/wp-content/uploads/2017/09/CROSSFIRE_FNL2-723x1024.jpg","shows_english_title":true}]},{"title":"The Fifth Head of Cerberus","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2024/12/hbg-title-the-fifth-head-of-cerberus-158.jpg","shows_english_title":true,"authors":["Gene Wolfe"],"year":1972},{"title":"The City in the Middle of the Night","cover_url":"https://covers.openlibrary.org/b/isbn/9780765379962-L.jpg","shows_english_title":true,"authors":["Charlie Jane Anders"],"year":2019,"placement_note":"Macmillan and Anders set the novel on tidally locked January, where human colonists hunt and misread the native Gelet until Sophie's bond reveals an alien culture whose survival is tied to humanity's. Planetary climate structures the setting, but colonization and cultural violence govern the encounter, making Xenocolonial most specific."},{"title":"The Lesson","cover_url":"cover-the-lesson.jpg","shows_english_title":true,"authors":["Cadwell Turnbull"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Alien fiction -> Anthropological science fiction -> Xenocolonial. SFE calls the Ynaa mission an alien occupation of the US Virgin Islands and reads the novel as an analysis of colonialism; Blackstone describes a superadvanced alien research presence whose secrecy and disproportionate violence poison relations with local island families."},{"title":"Alien Clay","cover_url":"https://covers.openlibrary.org/b/id/15237914-L.jpg","shows_english_title":true,"authors":["Adrian Tchaikovsky"],"year":2024,"placement_note":"Political prisoners shipped to the alien world Kiln to serve a colonial science regime whose planet's life rewrites them (Locus, BookPage). The alien encounter is framed as colonization and forced labor, so Xenocolonial."},{"title":"The Mercy of Gods","cover_url":"https://covers.openlibrary.org/b/id/14649358-L.jpg","shows_english_title":true,"authors":["James S. A. Corey"],"year":2024,"placement_note":"An alien empire, the Carryx, takes a human world and carries off its researchers as captives (Kirkus, PW). First of the Captive's War."}]},{"id":"alien-horror","label":"Alien horror","parent":"alien-fiction","children":[],"image":"178-alien-horror.webp","definition":"Alien fiction whose primary engine is horror: dread, bodily violation, predation, and the terror of encountering nonhuman life.","status":"candidate","works":[{"title":"Under the Skin","cover_url":"https://covers.openlibrary.org/b/id/8260688-L.jpg","shows_english_title":true,"authors":["Michel Faber"],"year":2000,"placement_note":"SFE describes an alien hunter surgically altered to pass as human who abducts humans as livestock; Canongate foregrounds Isserley’s dangerous roadside encounters. The novel’s engine is the slow bodily dread of humans being processed as meat, making Alien horror closer than anthropological study."},{"id":"who-goes-there","title":"Who Goes There?","authors":["John W. Campbell, Jr."],"year":1938,"cover_url":"cover-who-goes-there.jpg","shows_english_title":true,"books":[{"title":"Who Goes There?","year":1938,"cover_url":"cover-who-goes-there.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Alien fiction -> Alien horror. SFE calls it a classic sf Horror story about an Antarctic research station menaced by an Alien invader and Shapeshifter. Paranoia, predation and bodily imitation by a nonhuman life-form govern, as with Under the Skin on this leaf."}]},{"id":"communal-magic-realism","label":"Communal magic realism","parent":"magic-realism","children":[],"works":[{"title":"One Hundred Years of Solitude","cover_url":"https://covers.openlibrary.org/b/id/10499988-L.jpg","shows_english_title":true,"authors":["Gabriel García Márquez"],"year":1967},{"title":"Midnight's Children","cover_url":"https://covers.openlibrary.org/b/id/14590546-L.jpg","shows_english_title":true,"authors":["Salman Rushdie"],"year":1981},{"title":"Green Town","cover_url":"https://covers.openlibrary.org/b/id/14831327-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1957,"books":[{"title":"Dandelion Wine","year":1957,"cover_url":"https://covers.openlibrary.org/b/id/14831327-L.jpg","shows_english_title":true},{"title":"Farewell Summer","year":2006,"cover_url":"https://covers.openlibrary.org/b/id/8291544-L.jpg","shows_english_title":true},{"title":"Summer Morning, Summer Night","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/9345445-L.jpg","shows_english_title":true}]},{"title":"The Famished Road","cover_url":"278-the-famished-road.jpg","shows_english_title":true,"authors":["Ben Okri"],"year":1991,"placement_note":"Okri, PRH and Booker ground Azaro as a Yoruba abiku spirit-child moving between spirit and living worlds in independence-era Nigeria, where family, neighborhood and political struggle accept spirits as part of shared reality. The community’s marvelous world governs."},{"title":"The Shipbuilder of Bellfairie","cover_url":"cover-the-shipbuilder-of-bellfairie.jpg","shows_english_title":true,"authors":["M. Rickert"],"year":2021,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Magic realism -> Communal magic realism. Undertow centers giant Quark returning to haunted coastal Bellfairie, while Locus and review evidence describe the town, its origin stories, naturalized ghosts and submerged bells as shared community reality. The marvelous belongs to Bellfairie’s collective memory and ordinary life."},{"title":"The Twilight of the Gods and Other Tales","cover_url":"cover-the-twilight-of-the-gods-and-other-tales.jpg","shows_english_title":true,"authors":["Richard Garnett"],"year":1888,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Magic realism -> Communal magic realism. SFE calls it a collection of fables and fantasies; Gutenberg spans Arabic and Chinese tales, Roman history and Greek mythology with gods, miracles, demons and talismans treated as shared cultural reality. Community-scale inherited belief governs across the collection."}],"status":"provisional","definition":"Magic realism in which the marvelous belongs to a community, town or nation’s shared memory.","image":"215-communal-magic-realism.webp"},{"id":"metamorphic-magic-realism","label":"Metamorphic magic realism","parent":"magic-realism","children":[],"works":[{"title":"Grimus","cover_url":"https://images.penguinrandomhouse.com/cover/9781784878924","shows_english_title":true,"authors":["Salman Rushdie"],"year":1975},{"title":"The Satanic Verses","cover_url":"https://covers.openlibrary.org/b/id/8312209-L.jpg","shows_english_title":true,"authors":["Salman Rushdie"],"year":1988,"placement_note":"SFE describes Rushdie novels as Fabulation and Magic Realism and says The Satanic Verses anatomizes religion in fantasy terms; its miraculous transformations inhabit recognizable modern reality as ordinary narrative fact."},{"title":"Lady into Fox","cover_url":"https://covers.openlibrary.org/b/id/9285590-L.jpg","shows_english_title":true,"authors":["David Garnett"],"year":1922,"placement_note":"SFE calls Lady into Fox a fantasy and an allegory of metamorphosis in which a demure wife is transformed inexorably into a vixen. Garnett presents the impossible change as an established, unexplained fact inside ordinary English domestic life, making Magic realism the closest existing leaf."},{"title":"Orlando","authors":["Virginia Woolf"],"year":1928,"cover_url":"https://covers.openlibrary.org/b/id/6980533-L.jpg","shows_english_title":true,"placement_note":"Orlando lives three centuries and changes from man to woman mid-life, an impossible bodily transformation accepted inside ordinary literary life - the metamorphic magic realism definition (shelfmates Lady into Fox, The Satanic Verses)."},{"title":"Pig Tales","cover_url":"https://covers.openlibrary.org/b/id/6874726-L.jpg","shows_english_title":true,"authors":["Marie Darrieussecq"],"year":1996,"placement_note":"Metamorphic magic realism: the narrator's gradual transformation into a sow unfolds as a Kafkaesque parable accepted inside ordinary contemporary life (Kirkus; publisher synopsis). Original French 'Truismes' 1996; English translation 1997. Shelfmates Lady into Fox and Orlando."},{"title":"The Astonishing Color of After","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2019/03/9780316464017.jpg","shows_english_title":true,"authors":["Emily X. R. Pan"],"year":2018,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Magic realism -> Metamorphic magic realism. Hachette grounds an ordinary contemporary grief/family story in which Leigh is certain her dead mother transformed into a bird; she follows the bird in Taiwan while chasing ghosts and family memory. The impossible bodily transformation accepted into lived reality governs."},{"title":"The Inheritance of Orquídea Divina","cover_url":"cover-the-inheritance-of-orquidea-divina.jpg","shows_english_title":true,"authors":["Zoraida Córdova"],"year":2021,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Magic realism -> Metamorphic magic realism. Orquídea literally transforms into a ceiba tree amid marvelous gifts accepted within ordinary multigenerational family life."},{"title":"The Tin Drum","cover_url":"cover-the-tin-drum.jpg","shows_english_title":true,"authors":["Günter Grass"],"year":1959,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Magic realism -> Metamorphic magic realism. Penguin/Britannica center Oskar consciously stopping his bodily growth at three and using a glass-shattering voice amid otherwise historical Danzig; impossible bodily state is treated as his ordinary lived reality."},{"title":"When Women Were Dragons","cover_url":"https://covers.openlibrary.org/b/id/12685140-L.jpg","shows_english_title":true,"authors":["Kelly Barnhill"],"year":2022,"placement_note":"1950s America after thousands of women turn into dragons at once, and the silence around it (Kirkus, Star Tribune)."}],"status":"provisional","definition":"Magic realism centered on impossible bodily transformation accepted inside ordinary life.","image":"216-metamorphic-magic-realism.webp"},{"id":"sensory-magic-realism","label":"Sensory magic realism","parent":"magic-realism","children":[],"works":[{"title":"Perfume","cover_url":"https://covers.openlibrary.org/b/id/10910286-L.jpg","shows_english_title":true,"authors":["Patrick Süskind"],"year":1985},{"title":"Eartheater","cover_url":"https://covers.openlibrary.org/b/id/10405787-L.jpg","shows_english_title":true,"authors":["Dolores Reyes"],"year":2019,"placement_note":"SFE says the protagonist literally eats earth to gain knowledge of murdered women and explicitly applies Magic Realism on a non-metaphorical understanding. The marvelous power enters contemporary Argentine life as ordinary lived fact."},{"title":"The Book of Form and Emptiness","cover_url":"https://images4.penguinrandomhouse.com/smedia/9780399563669","shows_english_title":true,"authors":["Ruth Ozeki"],"year":2021}],"status":"provisional","definition":"Magic realism in which an impossible sense reveals knowledge hidden from ordinary perception.","image":"217-sensory-magic-realism.webp"},{"id":"ontological-magic-realism","label":"Ontological magic realism","parent":"magic-realism","children":[],"works":[{"title":"The Magus","cover_url":"https://covers.openlibrary.org/b/id/15156511-L.jpg","shows_english_title":true,"authors":["John Fowles"],"year":1965},{"title":"Kafka on the Shore","cover_url":"https://images1.penguinrandomhouse.com/cover/9781400079278","shows_english_title":true,"authors":["Haruki Murakami"],"year":2002,"placement_note":"SFE identifies its dovetailed trajectories; Penguin presents talking cats, fish falling from the sky, spirits leaving bodies and ageless wartime soldiers inside recognizable modern Japan. The marvelous arrives as ordinary narrative fact without a technological mechanism, making Magic realism closest."},{"title":"The Book of Hidden Things","cover_url":"https://images4.penguinrandomhouse.com/smedia/9781785657078","shows_english_title":true,"authors":["Francesco Dimitri"],"year":2018},{"title":"The Great Victorian Collection","cover_url":"cover-great-victorian-collection.jpg","shows_english_title":true,"authors":["Brian Moore"],"year":1975,"placement_note":"SFE describes a professor dreaming a collection of Victorian antiques into durable reality; Valancourt confirms the dream manifests physically in an ordinary California motel parking lot and then becomes impossible to contain or dismiss. Dream and waking reality become equally present and unstable, making Ontological magic realism exact."},{"title":"The Hole","cover_url":"cover-the-hole.jpg","shows_english_title":true,"authors":["Hiroko Oyamada"],"year":2014,"placement_note":"Walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Magic realism -> Ontological magic realism. New Directions/Granta ground ordinary rural Japan, family and domestic routine slipping into a creature-led fall through a personally shaped hole and increasingly bizarre experiences; reality, mirage and deadpan realism remain unresolved and equally present."}],"status":"provisional","definition":"Magic realism in which competing levels of reality become equally present and unstable.","image":"218-ontological-magic-realism.webp"},{"id":"occult-police-fiction","label":"Occult police","parent":"urban-fantasy","children":[],"works":[{"title":"Rivers of London","cover_url":"https://images3.penguinrandomhouse.com/cover/9780756411350","shows_english_title":true,"authors":["Ben Aaronovitch"],"year":2011,"books":[{"title":"Rivers of London","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/8472420-L.jpg"},{"title":"Moon Over Soho","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/13883591-L.jpg"},{"title":"Whispers Under Ground","year":2012,"cover_url":"https://covers.openlibrary.org/b/isbn/9780575097643-L.jpg"},{"title":"Broken Homes","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/8600681-L.jpg"},{"title":"Foxglove Summer","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/8472472-L.jpg"},{"title":"The Hanging Tree","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8472473-L.jpg"},{"title":"Lies Sleeping","year":2018,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780756411350","shows_english_title":true}],"placement_note":"SFE describes the Peter Grant sequence as Urban Fantasy featuring a Metropolitan Police detective in police-procedural investigations complicated by magic and supernatural creatures. Aaronovitch describes Lies Sleeping as a Metropolitan Police joint operation led by Detective Constable and apprentice wizard Peter Grant. Contemporary formal police work investigating magical crimes makes Occult police exact."},{"title":"Magic for Liars","cover_url":"https://covers.openlibrary.org/b/id/10180749-L.jpg","shows_english_title":true,"authors":["Sarah Gailey"],"year":2019,"placement_note":"Gustav ruled 2026-09-22 that Fantasy must be traversed in user order: Real Earth vs invented world first. A contemporary real-Earth magical school murder investigation belongs on the Urban fantasy side; investigation of occult crime makes Occult police exact."},{"title":"Grave Reservations","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781982168902/grave-reservations-9781982168902_lg.jpg","shows_english_title":true,"authors":["Cherie Priest"],"year":2021,"placement_note":"Gustav ruled 2026-09-22 that Fantasy must be traversed in user order: Real Earth vs invented world first. A contemporary real-Earth psychic travel-agent investigation belongs on the Urban fantasy side; solving crime through paranormal evidence makes Occult police exact."},{"title":"The Outsider","cover_url":"cover-the-outsider.jpg","shows_english_title":true,"authors":["Stephen King"],"year":2018,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Urban fantasy -> Occult police fiction. Hachette explicitly describes a present-day police procedural that becomes a supernatural thriller as Detective Ralph Anderson investigates impossible duplicate evidence and a face-wearing entity. Formal police investigation of supernatural crime governs."},{"title":"The Rook Files","cover_url":"cover-the-rook.jpg","shows_english_title":true,"authors":["Daniel O'Malley"],"year":2012,"books":[{"title":"The Rook","year":2012,"cover_url":"cover-the-rook.jpg","shows_english_title":true},{"title":"Stiletto","year":2016,"cover_url":"cover-stiletto.jpg","shows_english_title":true},{"title":"Blitz","year":2022,"cover_url":"cover-blitz.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Urban fantasy -> Occult police fiction. Hachette centers the Checquy, a formal supernatural intelligence agency protecting Britain from supernatural threats, with operatives investigating an internal mole, attacks and rogue agents. Institutional occult enforcement and investigation govern the series."}],"image":"219-occult-police-fiction.webp","definition":"Contemporary urban fantasy centered on police officers or formal law-enforcement units investigating crimes shaped by magic, supernatural beings or occult forces.","status":"accepted"},{"id":"fairy-tale-inversion","label":"Fairy-tale inversion","parent":"fairy-tale-revision","children":[],"works":[{"title":"Rump","cover_url":"https://images.penguinrandomhouse.com/cover/9780804168045","shows_english_title":false,"authors":["Liesl Shurtliff"],"year":2013,"books":[{"title":"Rump: The (Fairly) True Tale of Rumpelstiltskin","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/7303733-L.jpg","shows_english_title":true},{"title":"Jack: The True Story of Jack and the Beanstalk","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/12180453-L.jpg","shows_english_title":true},{"title":"Red: The True Story of Red Riding Hood","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8474633-L.jpg","shows_english_title":true},{"title":"Grump: The (Fairly) True Tale of Snow White and the Seven Dwarves","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/8807575-L.jpg","shows_english_title":true}]},{"title":"We Kept Her in the Cellar","cover_url":"https://images.penguinrandomhouse.com/cover/9781639109142","shows_english_title":true,"authors":["W. R. Gorman"],"year":2024},{"title":"The Bloody Chamber and Other Stories","cover_url":"https://angelacarteronline.com/wp-content/uploads/2016/11/cover-small.jpg","shows_english_title":true,"authors":["Angela Carter"],"year":1979},{"title":"Damsel","cover_url":"https://covers.openlibrary.org/b/id/12850837-L.jpg","shows_english_title":true,"authors":["Elana K. Arnold"],"year":2018},{"id":"wicked","title":"Wicked","authors":["Gregory Maguire"],"year":1995,"cover_url":"cover-wicked.jpg","shows_english_title":true,"books":[{"title":"Wicked","year":1995,"cover_url":"cover-wicked.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Fairy-tale revision -> Fairy-tale inversion. Retells Baum's Oz from the Wicked Witch of the West's side, recasting her as an idealistic dissident against the Wizard's totalitarian regime (NYT; LA Times); Kirkus calls it a magical telling of Oz before Dorothy. Perspective and moral alignment of a familiar fairy tale are reversed, and Oz has actual magic."},{"title":"Sour Cherry","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1035416182.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Natalia Theodoridou"],"year":2025,"placement_note":"Bluebeard retold from inside the household, through a wet nurse and the women around the lord (AP, Chicago Review of Books)."}],"image":"225-fairy-tale-inversion.webp","definition":"Fiction that reverses a familiar fairy tale’s perspective, moral alignment, power structure, or expected meaning.","status":"accepted","taxonomy_note":"Provisional descriptive coinage for revision mode; no single established critical term cleanly covers this group."},{"id":"fairy-tale-transplant","label":"Fairy-tale transplant","parent":"fairy-tale-revision","children":[],"works":[{"title":"Mapping the Bones","cover_url":"https://images1.penguinrandomhouse.com/smedia/9780399546679","shows_english_title":true,"authors":["Jane Yolen"],"year":2018,"placement_note":"Yolen describes the Holocaust novel as hung on the armature of Hansel and Gretel, mapping starvation, forest abandonment, the candy house, witch and oven into Chaim and Gittel’s story; Penguin Random House likewise calls it a Nazi labor-camp Hansel & Gretel tale. It deliberately rewrites a recognizable fairy tale through historical atrocity, making Fairy-tale revision exact."},{"title":"Dark and Deepest Red","cover_url":"https://images1.penguinrandomhouse.com/cover/9781250162748","shows_english_title":true,"authors":["Anna-Marie McLemore"],"year":2020},{"title":"Gingerbread","cover_url":"https://covers.openlibrary.org/b/id/8792936-L.jpg","shows_english_title":true,"authors":["Helen Oyeyemi"],"year":2019,"placement_note":"SFE says Hansel-and-Gretel motifs circulate through the novel; the Guardian describes its fabulous everyday elements, unmappable Druhástrana, family gingerbread and a lost Gretel friendship. The contemporary mother-daughter tale rewrites a recognizable fairy-tale complex."},{"title":"Red Hood","cover_url":"https://elanakarnold.com/wp-content/uploads/2019/06/RedHood_Cover-684x1024.jpg","shows_english_title":true,"authors":["Elana K. Arnold"],"year":2020,"placement_note":"Arnold’s Little Red Riding Hood revision moves the tale to modern Seattle, where inherited female power and predatory wolves recast its danger in a contemporary setting."},{"title":"Summer in the City of Roses","cover_url":"https://sohopress.com/wp-content/uploads/2021/03/Summer-in-the-City-of-Roses-low-res.jpg","shows_english_title":true,"authors":["Michelle Ruiz Keil"],"year":2021,"placement_note":"Soho and PRH explicitly call this early-1990s Portland novel inspired by Grimm’s “Brother and Sister” and the Greek Iphigenia/Orestes complex; sibling separation, the brother’s fantastical transformation and reunion transpose that named fairy-tale armature into Portland punk life. The explicit relocated Grimm narrative makes Fairy-tale transplant closer than general Magic realism or Greek myth fantasy."}],"image":"226-fairy-tale-transplant.webp","definition":"Fiction that relocates a familiar fairy tale into a different historical period, culture, or contemporary setting.","status":"accepted","taxonomy_note":"Provisional descriptive coinage for revision mode; no single established critical term cleanly covers this group."},{"id":"fairy-tale-expansion","label":"Fairy-tale expansion","parent":"fairy-tale-revision","children":[],"works":[{"title":"Uprooted","cover_url":"https://images.penguinrandomhouse.com/cover/9780804179058","shows_english_title":true,"authors":["Naomi Novik"],"year":2015},{"title":"Spinning Silver","cover_url":"http://grimoakpress.com/cdn/shop/products/novik-spinningsilver.jpg?v=1613603659","shows_english_title":true,"authors":["Naomi Novik"],"year":2018},{"title":"Blanca & Roja","cover_url":"https://covers.openlibrary.org/b/id/10118728-L.jpg","shows_english_title":true,"authors":["Anna-Marie McLemore"],"year":2018},{"title":"Hemlock & Silver","cover_url":"https://covers.openlibrary.org/b/id/15111947-L.jpg","shows_english_title":true,"authors":["T. Kingfisher"],"year":2025,"placement_note":"Snow White as the seed: a poison-studying healer investigates a princess who keeps being poisoned, and a mirror world behind it (Locus, BookPage)."},{"title":"After the Forest","cover_url":"https://images-na.ssl-images-amazon.com/images/P/125085248X.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Kell Woods"],"year":2023,"placement_note":"Hansel and Gretel twenty years on: adult Gretel in the gingerbread aftermath, the fairy tale expanded into a novel-length world."}],"image":"227-fairy-tale-expansion.webp","definition":"Fiction that uses a familiar fairy tale as the seed for a larger original world, mythology, or interwoven narrative.","status":"accepted","taxonomy_note":"Provisional descriptive coinage for revision mode; no single established critical term cleanly covers this group."},{"id":"weird-west-fantasy","label":"Weird West fantasy","parent":"industrial-age-fantasy","children":[],"works":[{"title":"Red Waters Rising","cover_url":"https://www.publishersweekly.com/cover/9781481429757","shows_english_title":true,"authors":["Laura Anne Gilman"],"year":2018,"placement_note":"An alternate nineteenth-century North America whose western Territory is literally magical and ruled by the Devil, combining frontier-Western structures with ghosts, magicians and animal spirits."},{"title":"The Hunger","cover_url":"cover-the-hunger.jpg","shows_english_title":true,"authors":["Alma Katsu"],"year":2018,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Weird West fantasy. Penguin grounds a supernatural reimagining of the 1846 Donner Party wagon train, where a hungry force stalks pioneers on the North American frontier; the nineteenth-century Western journey and monster intrusion make Weird West exact."},{"title":"The Buffalo Hunter Hunter","cover_url":"https://covers.openlibrary.org/b/id/14853611-L.jpg","shows_english_title":true,"authors":["Stephen Graham Jones"],"year":2025,"placement_note":"A Blackfeet vampire's confession to a Montana pastor avenges the 1870 Marias Massacre (PW 'weird western reimagining of the vampire'; NPR). Frontier remade through a monster; frame dated 1912."}],"image":"228-weird-west-fantasy.webp","definition":"Fantasy that remakes the nineteenth-century North American frontier through magic, ghosts, monsters and alternate history, in the attested Weird West tradition.","status":"accepted"},{"id":"ghost-speakers","label":"Ghost Speakers","parent":"ghost-stories","children":[],"works":[{"id":"riddance","title":"Riddance","authors":["Shelley Jackson"],"year":2018,"cover":"https://s37710.pcdn.co/wp-content/uploads/sites/3/2021/08/9781936787999.jpg","placement_note":"Root-down: Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Ghost Speakers. Catapult centers the 1890 Sybil Joines Vocational School for Ghost Speakers, where children whose stutters channel ghost voices are trained; the headmistress visits the land of the dead. Communication through living mediums is the engine, not a haunted place, lesson-giving dead companion or purposeful revenant.","sources":["https://books.catapult.co/books/riddance/","https://www.penguinrandomhouse.com/books/673534/riddance-by-shelley-jackson/"],"cover_url":"https://s37710.pcdn.co/wp-content/uploads/sites/3/2021/08/9781936787999.jpg","shows_english_title":true},{"title":"Beyond Black","cover_url":"cover-beyond-black.jpg","shows_english_title":true,"authors":["Hilary Mantel"],"year":2005,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Ghost Speakers. Fourth Estate centers Alison Hart, a medium by trade: dead people talk to her and she talks back, passing messages from dead ancestors while wicked spirits plague her. Living mediumship is the governing engine."},{"title":"The Reformatory","cover_url":"https://covers.openlibrary.org/b/id/14546667-L.jpg","shows_english_title":true,"authors":["Tananarive Due"],"year":2023,"placement_note":"In 1950 Jim Crow Florida, twelve-year-old Robbie Stephens is sent to the Gracetown School for Boys, where his gift for seeing and talking with 'haints' - the ghosts of boys who died there - makes him the warden's tool and the dead boys' witness (NYT, NPR, Kirkus, Observer). The living boy who speaks with the dead is the engine. Placed after Gustav unfroze Supernatural fantasy (22:41)."}],"image":"237-ghost-speakers.webp","status":"leaf","label_status":"source-coinage","label_note":"Riddance's own term, from the Sybil Joines Vocational School for Ghost Speakers.","definition":"Ghost stories centered on living mediums whose defining gift is to speak with, through or for the dead."},{"id":"mad-science-gothic","label":"Mad-science Gothic","parent":"gothic-science-fiction","children":[],"works":[{"title":"Frankenstein; or, The Modern Prometheus","cover_url":"https://covers.openlibrary.org/b/isbn/9780143131847-L.jpg","shows_english_title":true,"authors":["Mary Shelley"],"year":1818},{"title":"Strange Case of Dr Jekyll and Mr Hyde","cover_url":"https://covers.openlibrary.org/b/id/10767433-L.jpg","shows_english_title":true,"authors":["Robert Louis Stevenson"],"year":1886},{"title":"The Invisible Man","cover_url":"https://covers.openlibrary.org/b/id/6419199-L.jpg","shows_english_title":true,"authors":["H. G. Wells"],"year":1897},{"title":"Donovan's Brain","cover_url":"https://covers.openlibrary.org/b/id/15178384-L.jpg","shows_english_title":true,"authors":["Curt Siodmak"],"year":1942,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Gothic science fiction -> Mad-science Gothic. The 1942 frame is clearly historical to today’s reader, while forbidden brain preservation becomes psi possession, bodily takeover and terror. Hauser’s Memory and Gabriel’s Body leave this leaf for reader-relative Futurist Psionics."},{"title":"The Daughter of Doctor Moreau","cover_url":"https://covers.openlibrary.org/b/id/12861583-L.jpg","shows_english_title":true,"authors":["Silvia Moreno-Garcia"],"year":2022,"placement_note":"Moreau's hybrids on a nineteenth-century Yucatán estate, retold through his daughter (Washington Post, Locus). Forbidden experiment and manufactured beings."}],"image":"238-mad-science-gothic.webp","status":"leaf","definition":"Gothic science fiction in which forbidden experiment, Promethean creation, bodily transformation or manufactured doubles unleash terror."},{"id":"cosmic-gothic","label":"Cosmic Gothic","parent":"gothic-science-fiction","children":[],"works":[{"title":"At the Mountains of Madness","cover_url":"https://covers.openlibrary.org/b/id/8565081-L.jpg","shows_english_title":true,"authors":["H. P. Lovecraft"],"year":1936},{"title":"The House on the Borderland","authors":["William Hope Hodgson"],"year":1908,"cover_url":"https://covers.openlibrary.org/b/id/7317588-L.jpg","shows_english_title":true}],"image":"239-cosmic-gothic.webp","status":"leaf","definition":"Gothic science fiction in which sublime terror comes from impossible worlds, cosmic immensities and realities beyond human comprehension."},{"id":"elder-god-torment","label":"Elder god torment","parent":"torment-fantasy","children":[],"works":[{"title":"Beneath the Rising","cover_url":"https://covers.openlibrary.org/b/id/10208841-L.jpg","shows_english_title":true,"authors":["Premee Mohamed"],"year":2020,"books":[{"title":"Beneath the Rising","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10208841-L.jpg"},{"title":"A Broken Darkness","year":2021,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781781088753/a-broken-darkness-9781781088753.jpg"},{"title":"The Void Ascendant","year":2021,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781786185204/the-void-ascendant-9781786185204.jpg"}],"placement_note":"Nocturne restructure 2026-09-23 (Gustav ruling): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Dark fantasy -> Torment fantasy -> Elder god torment."},{"title":"Providence","cover_url":"https://covers.openlibrary.org/b/id/14847576-L.jpg","shows_english_title":true,"authors":["Caroline Kepnes"],"year":2018,"placement_note":"Supernatural thriller: Jon Bronson returns from a four-year abduction with an involuntary lethal power and a Lovecraftian explanation he pursues (PW, Kirkus) - an ancient intruding entity tormenting a human life. Shelfmates It, T

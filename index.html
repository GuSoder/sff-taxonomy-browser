 more than the opening father-quest."}]},{"id":"time-magic","label":"Time magic","parent":"hard-fantasy","children":[],"image":"323-time-magic.webp","definition":"Hard fantasy in which time itself is the magic's domain: loops, rewritten pasts and journeys through history run by magic that behaves consistently even when its mechanism stays unexplained. A book belongs here when the time magic is load-bearing, not a passing device. Coined by Gustav 2026-09-23; not an SFE/EoF headword.","status":"accepted","works":[{"title":"The Everlasting","cover_url":"https://covers.openlibrary.org/b/id/15149875-L.jpg","shows_english_title":true,"authors":["Alix E. Harrow"],"year":2025,"placement_note":"In the invented nation of Dominion, a historian is sent back through a magical yew tree and manuscript to steer the knight Una Everlasting into her legend, while the Minister of War loops and rewrites the past until the story comes out as she wants (Kirkus, Locus, Bookishelf). The time magic is the book: consistent loop, unexplained mechanism. Placed by Gustav's 22:00 ruling."}]},{"id":"scientific-adventure","label":"Scientific adventure","parent":"proto-sf","children":[],"status":"provisional","definition":"Nineteenth-century speculative fiction built on a technological marvel and the fantastic voyage it enables (SFE headword SCIENTIFIC ROMANCE; Verne's prime-years novels are consanguineous with the form). New leaf created 2026-09-13 for Verne; hard science fiction is at the 10-work cap. Renamed from Scientific romance to Scientific adventure 2026-09-14 at Gustav's direction; SFE attests 'scientific romance' as the period term and the two are treated as interchangeable in grounding.","image":"70-scientific-adventure.webp","works":[{"title":"Twenty Thousand Leagues Under the Sea","cover_url":"https://covers.openlibrary.org/b/id/14891090-L.jpg","shows_english_title":true,"authors":["Jules Verne"],"year":1870},{"title":"The Island of Dr. Moreau","authors":["H. G. Wells"],"year":1896,"cover_url":"https://covers.openlibrary.org/b/id/2750879-L.jpg","shows_english_title":true},{"title":"Two Planets","cover_url":"cover-two-planets.jpg","shows_english_title":true,"authors":["Kurd Lasswitz"],"year":1897,"placement_note":"Lasswitz's 1897 novel: a German polar balloon expedition finds a Martian base at the North Pole, and the Martians' spacecraft carry the story to Mars. Written in its own era, so it is Proto SF; a technological marvel and the voyage it enables make it Scientific adventure. Moved from Historical first contact 2026-09-23 (Gustav 15:05)."}]},{"id":"ghost-stories","label":"Ghost stories","parent":"supernatural-fantasy","children":["lessons-beyond-the-grave","revenants","ghost-speakers"],"works":[],"image":"73-ghost-stories.webp","status":"umbrella","definition":"Supernatural fantasy on recognizable Earth specifically centered on ghosts and hauntings: the dead returning to a house, a place or a mind. Label grounded in the Encyclopedia of Fantasy Ghost Stories entry."},{"id":"revenants","label":"Revenants","parent":"ghost-stories","children":[],"works":[{"title":"Neither the Sea nor the Sand","cover_url":"https://covers.openlibrary.org/b/isbn/0330027530-L.jpg","shows_english_title":true,"authors":["Gordon Honeycombe"],"year":1969,"placement_note":"Supernatural revenant love story: after Hugh drowns off Jersey, Anna's obsessive love calls him back reanimated but deteriorating. The actual return of the dead passes the speculative-event boundary; the dead returning to a lover is the central presence, so Ghost story (cf. Cold Heaven) is closest."},{"title":"Cold Heaven","cover_url":"https://images1.penguinrandomhouse.com/cover/9780452278677","shows_english_title":true,"authors":["Brian Moore"],"year":1983},{"title":"Melmoth","cover_url":"https://x.sf-encyclopedia.com/gal/clute/PerryS-Melmoth.jpg","shows_english_title":true,"authors":["Sarah Perry"],"year":2018,"placement_note":"HarperCollins and Perry center the centuries-wandering Melmoth the Witness, whose sightings haunt confessions and who approaches the guilty; the publisher explicitly frames its ambiguity through the tradition of ghost stories. The ghostly witness is the novel’s central presence."},{"title":"On Fragile Waves","cover_url":"https://covers.openlibrary.org/b/id/10832554-L.jpg","shows_english_title":true,"authors":["E. Lily Yu"],"year":2021,"placement_note":"SFE yu_e_lily: refugee family novel, 'some of the fantasy elements rendered literally'; Horton/Locus: Nasima drowns in the typhoon and returns as a ghost who haunts Firuzeh, sometimes hinting at the future. The dead returning to haunt -> ghost-story."},{"title":"Peace","cover_url":"https://covers.openlibrary.org/b/id/8791136-L.jpg","shows_english_title":true,"authors":["Gene Wolfe"],"year":1975,"placement_note":"Wikipedia/Publisher: psychological fantasy and mastercrafted ghost story - old Alden Dennis Weer relives and reshapes memories that haunt his house like a memory palace; the dead (possibly Weer himself) return into a mind and a place. EoF-attested ghost-story shelf. Shelfmates: Melmoth, Cold Heaven."},{"title":"Sisters","cover_url":"https://images3.penguinrandomhouse.com/cover/9780593188965","shows_english_title":true,"authors":["Daisy Johnson"],"year":2020,"placement_note":"July's dead sister remains through a supernatural bond of grief, guilt, memory and love; the relationship with the specific dead person makes Revenants exact."},{"title":"The City Beautiful","cover_url":"https://www.jewishbookcouncil.org/sites/default/files/styles/book/public/images/51O9OAC%2BrFL._SX328_BO1%2C204%2C203%2C200_.jpg","shows_english_title":true,"authors":["Aden Polydoros"],"year":2021,"placement_note":"Polydoros and the Jewish Book Council ground actual possession by the murdered friend Yakov's dybbuk, whose afterlife is driven by revenge and who remains bound to Alter until they expose the killer. The specific dead friend returning purposefully through grief, love and vengeance makes Revenants more exact than the historical-era frame."},{"title":"The Influence","cover_url":"cover-the-influence.jpg","shows_english_title":true,"authors":["Ramsey Campbell"],"year":1988,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Revenants. A specific dead matriarch returns purposefully through family control and attempted possession."},{"title":"The Things She’s Seen","cover_url":"cover-the-things-shes-seen.jpg","shows_english_title":true,"authors":["Ambelin Kwaymullina","Ezekiel Kwaymullina"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Ghost stories -> Revenants. PRH follows recently dead Beth Teller, visible and audible to her grieving detective father, staying to solve a suspicious-fire mystery and reconnect him to the living; a specific dead daughter purposefully bound by love and grief makes Revenants exact."},{"title":"Annie LeBlanc Is Not Dead Yet","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250290066.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Molly Morris"],"year":2024,"placement_note":"A dead best friend is resurrected for a brief return in a town where one person per decade comes back; a specific dead person bound to the living through friendship and grief. 10th card; leaf freezes."}],"definition":"Ghost stories in which a specific dead person returns or remains as a purposeful presence bound to the living through love, guilt, grief or memory. “Revenants” is a taxonomy coinage built on the established folklore term revenant for one who returns after death.","image":"234-revenants.webp","representative_cover":"https://covers.openlibrary.org/b/isbn/0330027530-L.jpg"},{"id":"haunted-house","label":"Haunted House","parent":"supernatural-fantasy","children":["classic-haunted-house","contemporary-haunted-house","fungal-horror"],"image":"157-haunted-house.webp","definition":"Ghost stories where the haunting is anchored to a place: the building is the engine. Lifted out of Ghost stories to sit directly under Supernatural fantasy and given Eldritch Fungi as third child 2026-09-25 (Gustav ruling phonemsg-01M3CBN7GVGQD6W543B28YXWHX): place-anchored haunting spans ghosted and ghost-less houses alike.","status":"umbrella","works":[]},{"id":"classic-haunted-house","label":"Classic haunted house","parent":"haunted-house","children":[],"works":[{"title":"The Haunting of Hill House","cover_url":"https://covers.openlibrary.org/b/id/14812399-L.jpg","shows_english_title":true,"authors":["Shirley Jackson"],"year":1959},{"title":"The Shining","cover_url":"https://covers.openlibrary.org/b/id/14817043-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1977,"books":[{"title":"The Shining","year":1977,"cover_url":"https://covers.openlibrary.org/b/id/12376585-L.jpg"},{"title":"Doctor Sleep","year":2013}]},{"title":"The Green Man","cover_url":"https://covers.openlibrary.org/b/id/14555050-L.jpg","shows_english_title":true,"authors":["Kingsley Amis"],"year":1969},{"title":"The Turn of the Screw","cover_url":"https://covers.openlibrary.org/b/id/3065023-L.jpg","shows_english_title":true,"authors":["Henry James"],"year":1898},{"title":"The Castle of Otranto","cover_url":"https://images3.penguinrandomhouse.com/cover/9780140437676","shows_english_title":true,"authors":["Horace Walpole"],"year":1764,"placement_note":"PRH calls it the founding Gothic novel: supernatural omens, a dynastic curse and the return of Otranto’s lawful prince unfold inside the usurped castle. The place-bound family haunting and castle machinery govern, making Haunted House the deepest fit."}],"image":"268-classic-haunted-house.webp","definition":"Place-anchored haunted-house fiction from the Gothic origins through the late twentieth-century classics, ending with The Shining (1977).","status":"accepted"},{"id":"contemporary-haunted-house","label":"Contemporary haunted house","parent":"haunted-house","children":["housebound","feral-house","residual-haunting"],"works":[],"image":"269-contemporary-haunted-house.webp","definition":"Place-anchored haunted-house fiction in the contemporary era, beginning with Bag of Bones (1998). Umbrella since 2026-09-25: split-with-umbrella into Housebound, Feral house and Residual haunting by haunting mechanism (Gustav ruling phonemsg-01M3CD9BVMX13FWZ3CTZ30325Z).","status":"accepted"},{"id":"housebound","label":"Housebound","parent":"contemporary-haunted-house","children":[],"works":[{"title":"Bag of Bones","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781501198892/bag-of-bones-9781501198892_lg.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1998},{"title":"lost boy lost girl","cover_url":"https://images4.penguinrandomhouse.com/smedia/9780593975909","shows_english_title":true,"authors":["Peter Straub"],"year":2003,"placement_note":"Penguin Random House calls it a layered reworking of the haunted-house story: an abandoned house whispers with a hidden history and contains a ghostly lost girl who draws the missing boy into her domain. The place and its haunting drive the mystery, making Haunted House exact."},{"title":"The Agony House","cover_url":"https://www.juniorlibraryguild.com/media/catalog/product/cache/2eab14bc73bbaab25cecc22b3f357ec3/A/g/Agony_20House_1_1.jpg","shows_english_title":true,"authors":["Cherie Priest"],"year":2018,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Haunted house. Scholastic calls it a haunted-house story with a killer ghost, and its cited reviews say the ramshackle New Orleans house is as much a character as the people, with the haunting and the building’s violent past driving the mystery. The place-anchored haunting therefore governs over a general ghost shelf."},{"title":"The Invited","cover_url":"cover-the-invited.jpg","shows_english_title":true,"authors":["Jennifer McMahon"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Supernatural dark -> Ghost story -> Haunted House -> Contemporary haunted house. Penguin Random House explicitly calls it a ghost story in which a couple build a haunted house; salvaged materials and the land’s violent history make the new home a place of menace and unfinished business. The place/building is the haunting engine."}],"definition":"Contemporary haunted-house fiction in which a specific dead person is bound to the place: the revenant anchored to walls or ground rather than to a living person. Split 2026-09-25 from Contemporary haunted house (Gustav ruling).","status":"accepted","image":"351-housebound.webp"},{"id":"feral-house","label":"Feral house","parent":"contemporary-haunted-house","children":[],"works":[{"title":"A Haunting on the Hill","cover_url":"https://covers.openlibrary.org/b/isbn/9780316527323-L.jpg","shows_english_title":true,"authors":["Elizabeth Hand"],"year":2023,"placement_note":"Authorized return to Shirley Jackson's Hill House: a playwright and her actors rent the house in the present day, and the house itself does the haunting."},{"title":"Starling House","cover_url":"https://covers.openlibrary.org/b/id/14428784-L.jpg","shows_english_title":true,"authors":["Alix E. Harrow"],"year":2023,"placement_note":"A living Gothic house in a dying Kentucky coal town holds back the beasts beneath it, and the woman drawn to it becomes bound to the place (NPR, Locus, Kirkus). The house is the engine, so place-anchored haunted-house fiction fits, although its horrors are Underland beasts more than ghosts. Placed after Gustav unfroze Supernatural fantasy (22:41)."},{"id":"white-smoke","title":"White Smoke","authors":["Tiffany D. Jackson"],"year":2021,"cover_url":"cover-white-smoke.jpg","shows_english_title":true,"books":[{"title":"White Smoke","year":2021,"cover_url":"cover-white-smoke.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Ghost stories -> Haunted House -> Contemporary haunted house. Kirkus frames a family trying to survive a haunted house, with a forbidden basement and genuinely creepy haunts; Locus says it follows haunted-house rules while the real villain is the racist system behind the being haunting the house. The haunting is anchored to the house, which is the engine. Contemporary era (2021), after the leaf's Bag of Bones (1998) start."}],"definition":"Contemporary haunted-house fiction in which the house itself is the agent: a domestic place gone wild - dangerous but not evil, guarding or devouring its own. Split 2026-09-25 from Contemporary haunted house (Gustav ruling).","status":"accepted","image":"352-feral-house.webp"},{"id":"residual-haunting","label":"Residual haunting","parent":"contemporary-haunted-house","children":[],"works":[{"title":"Plain Bad Heroines","cover_url":"https://covers.openlibrary.org/b/id/10332578-L.jpg","shows_english_title":true,"authors":["Emily M. Danforth"],"year":2020,"placement_note":"Haunted house: 'two girls in love and a fog of wasps cursed the place forever after' - deaths at the Brookhants School for Girls from 1902 onward, with a present-day film shoot at the school spooked by the same curse; the haunting is anchored to the place and the building is the engine (Kirkus; Guardian calls it gothic horror). Shelfmates The Haunting of Hill House and The Shining."},{"title":"A House with Good Bones","cover_url":"https://covers.openlibrary.org/b/id/13251679-L.jpg","shows_english_title":true,"authors":["T. Kingfisher"],"year":2023,"placement_note":"Southern Gothic haunted house: the family home and rose garden carry Gran Mae's malice, a place-anchored haunting in the present day."},{"title":"A Room Away From the Wolves","cover_url":"https://covers.openlibrary.org/b/id/8567714-L.jpg","shows_english_title":true,"authors":["Nova Ren Suma"],"year":2018}],"definition":"Contemporary haunted-house fiction in which trauma replays in the place without an agent: the event recorded and played back, the paranormal field's residual haunting (the Stone Tape pattern). Split 2026-09-25 from Contemporary haunted house (Gustav ruling).","status":"accepted","image":"353-residual-haunting.webp"},{"id":"lessons-beyond-the-grave","label":"Lessons beyond the grave","parent":"ghost-stories","children":[],"works":[{"title":"A Christmas Carol","cover_url":"https://covers.openlibrary.org/b/id/13122277-L.jpg","shows_english_title":true,"authors":["Charles Dickens"],"year":1843},{"title":"Beloved","cover_url":"https://covers.openlibrary.org/b/isbn/9780394535975-L.jpg","shows_english_title":true,"authors":["Toni Morrison"],"year":1987},{"title":"The Graveyard Book","cover_url":"https://covers.openlibrary.org/b/id/7099583-L.jpg","shows_english_title":true,"authors":["Neil Gaiman"],"year":2008},{"title":"A Fine and Private Place","cover_url":"https://covers.openlibrary.org/b/id/294663-L.jpg","shows_english_title":true,"authors":["Peter S. Beagle"],"year":1960},{"title":"Cemetery Boys","cover_url":"https://covers.openlibrary.org/b/id/10860590-L.jpg","shows_english_title":true,"authors":["Aiden Thomas"],"year":2020,"books":[{"title":"Cemetery Boys","year":2020,"authors":["Aiden Thomas"],"cover_url":"https://covers.openlibrary.org/b/id/10860590-L.jpg"},{"title":"Cemetery Boys: Espíritu","year":2026,"authors":["Aiden Thomas"],"cover_url":"https://mpd-biblio-covers.imgix.net/9781250894939.jpg"}]},{"title":"The Blade Between","cover_url":"https://samjmiller.com/wp-content/uploads/2020/04/BladeBetween-hc-c-1060x1600.jpg","shows_english_title":true,"authors":["Sam J. Miller"],"year":2020,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Supernatural and dark -> Ghost story -> Lessons beyond the grave. Enraged whale/human ghosts drive a returning son to confront gentrification, buried violence and his bond to Hudson; no building anchors the haunting."},{"title":"The Gone Away Place","cover_url":"cover-gone-away-place.jpg","shows_english_title":true,"authors":["Christopher Barzak"],"year":2018,"placement_note":"PRH grounds a town-wide epidemic of ghosts after tornadoes kill half a school; Ellie and other survivors see the dead, and her chance encounter reveals how to free spirits lingering in grief. Sustained relationships across death and helping the dead move on govern."},{"id":"thirteen-doorways-wolves-behind-them-all","title":"Thirteen Doorways, Wolves Behind Them All","authors":["Laura Ruby"],"year":2019,"books":[{"title":"Thirteen Doorways, Wolves Behind Them All","year":2019,"cover_url":"cover-thirteen-doorways-wolves-behind-them-all.jpg"}],"cover_url":"cover-thirteen-doorways-wolves-behind-them-all.jpg"},{"id":"under-the-whispering-door","title":"Under the Whispering Door","authors":["TJ Klune"],"year":2021,"books":[{"title":"Under the Whispering Door","year":2021,"cover_url":"cover-under-the-whispering-door.jpg"}],"cover_url":"cover-under-the-whispering-door.jpg"}],"image":"158-lessons-beyond-the-grave.webp","definition":"The dead remain in the story as company and carry a lesson, taught by them or taught to them; the relationship across death is the engine.","status":"accepted"},{"id":"invented-mythology","label":"Invented Mythology","parent":"mythological-fantasy","children":[],"image":"82-invented-mythology.webp","definition":"Fantasy that builds its own mythology from scratch - invented gods, creation legends and deep-time chronicles of an imaginary world rather than retellings of real-world myth. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"The Silmarillion","cover_url":"https://covers.openlibrary.org/b/id/10721368-L.jpg","shows_english_title":true,"authors":["J. R. R. Tolkien"],"year":1977},{"title":"Honeycomb","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534433052/honeycomb-9781534433052_lg.jpg","shows_english_title":true,"authors":["Joanne M. Harris"],"year":2021,"placement_note":"The author describes a hundred linked story-cells following the magical Lacewing King through many worlds and peoples, while Simon & Schuster calls it a mosaic novel of original fairy tales. Its Silken Folk, rulers, worlds and recurring legends form an original mythology rather than retelling a received one."},{"title":"The Raven Tower","cover_url":"cover-the-raven-tower.jpg","shows_english_title":true,"authors":["Ann Leckie"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Invented Mythology. Secondary world (Iraden, Vastai, Ard Vusktia) whose core is its own invented theology: gods whose speech makes things true at the cost of their power, narrated by an ancient stone god across deep time. The Hamlet-shaped succession plot is scaffolding; the gods carry the book. Moved from Dynastic intrigues by Gustav's ruling 2026-09-23 12:20."},{"title":"Audition for the Fox","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1616964448.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Martin Cahill"],"year":2025,"placement_note":"Secondary world held up by the Ninety-Nine Pillars of Heaven, the animal gods who shaped it (Reactor). A godblooded acolyte who has failed 96 auditions turns to the trickster Fox, who throws her 300 years back into the revolution that became her people's founding myth (PW, Shelf Awareness). Invented gods and creation legend drive it; placed by Gustav's 21:48 ruling."}]},{"id":"fantasy-of-manners","label":"Fantasy of manners","parent":"gothic-fantasy","children":[],"works":[{"title":"Olondria","cover_url":"https://covers.openlibrary.org/b/isbn/9781931520775-L.jpg","shows_english_title":true,"authors":["Sofia Samatar"],"year":2013,"books":[{"title":"A Stranger in Olondria","year":2013,"cover_url":"https://covers.openlibrary.org/b/isbn/9781931520775-L.jpg"},{"title":"The Winged Histories","year":2016,"cover_url":"https://covers.openlibrary.org/b/isbn/9781618731371-L.jpg"}],"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Fantasy of manners. Etiquette, class performance, courtship and social codes govern, matching the school’s Pax Britannica manners branch."},{"title":"Howl's Moving Castle","year":1986,"authors":["Diana Wynne Jones"],"cover_url":"https://covers.openlibrary.org/b/id/8783945-L.jpg","shows_english_title":true,"books":[{"title":"Howl's Moving Castle","year":1986,"authors":["Diana Wynne Jones"],"cover_url":"https://covers.openlibrary.org/b/id/8783945-L.jpg"},{"title":"Castle in the Air","year":1990,"cover_url":"https://covers.openlibrary.org/b/id/8783953-L.jpg"},{"title":"House of Many Ways","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/6303056-L.jpg"}],"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Fantasy of manners. Etiquette, class performance, courtship and social codes govern, matching the school’s Pax Britannica manners branch."},{"title":"The Kingston Cycle","cover_url":"https://mpd-biblio-covers.imgix.net/9781250162687.jpg","shows_english_title":true,"authors":["C. L. Polk"],"year":2018,"books":[{"title":"Witchmark","year":2018,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250162687.jpg"},{"title":"Stormsong","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765398994.jpg"},{"title":"Soulstar","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250203571.jpg"}],"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Fantasy of manners. Etiquette, class performance, courtship and social codes govern, matching the school’s Pax Britannica manners branch."},{"title":"The Midnight Bargain","cover_url":"cover-the-midnight-bargain.jpg","shows_english_title":true,"authors":["C. L. Polk"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Fantasy of manners. Erewhon sets genuine sorcery inside a Regency-like Bargaining Season where debt, marriage-market etiquette, class and courtship force Beatrice to choose between becoming a Magus and an advantageous match. Social codes and marriage negotiation govern over adventure."},{"title":"A Sorceress Comes to Call","cover_url":"https://covers.openlibrary.org/b/id/14649359-L.jpg","shows_english_title":true,"authors":["T. Kingfisher"],"year":2024,"placement_note":"Regency-style secondary world (Fantasy Literature: 'magical regency-style romance'), a daughter trapped by her sorceress mother's control inside a country-house social round of courtship and etiquette. Manners and class codes govern, so Fantasy of manners."},{"title":"Aspects","cover_url":"https://covers.openlibrary.org/b/isbn/9781473232846-L.jpg","shows_english_title":true,"authors":["John M. Ford"],"year":2022,"placement_note":"Ford's sociopolitical epic of constitutional politics, dueling and theater in a secondary world governed by intricate social codes rather than battlefield heroics."}],"definition":"The Pax Britannica manners branch of the Gothic School: secondary-world fantasy governed by British imperial-era gentlemen, etiquette, class performance, courtship and intricate social codes rather than battlefield heroics.","image":"86-fantasy-of-manners.webp"},{"id":"technofantasy","label":"Technofantasy","parent":"sword-and-sorcery","children":[],"definition":"Bright, adventure-forward fantasy whose actual magic wears technological trappings: wondrous machinery, artifacts, airships and impossible engineering. Dark necromantic or ominous forms belong in Technomancy.","works":[{"title":"Bluecrowne","cover_url":"https://target.scene7.com/is/image/Target/GUEST_6ba49ae6-d8fc-4db4-9818-0eb88820f387","shows_english_title":true,"authors":["Kate Milford"],"year":2014,"placement_note":"Walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Technofantasy. Kate Milford grounds invented Nagspeake and an action plot mixing literal magic with a pyrotechnical prodigy, artifacts, chemistry, science, time travel and nautical technology; the magic/science machinery blend governs."},{"title":"The Books of Babel","cover_url":"cover-senlin.jpg","shows_english_title":true,"authors":["Josiah Bancroft"],"year":2013,"books":[{"title":"Senlin Ascends","year":2013,"cover_url":"cover-senlin.jpg","shows_english_title":true},{"title":"Arm of the Sphinx","year":2018,"cover_url":"cover-arm-sphinx.jpg","shows_english_title":true},{"title":"The Hod King","year":2019,"cover_url":"cover-hod-king.jpg","shows_english_title":true},{"title":"The Fall of Babel","year":2021,"cover_url":"cover-fall-babel.jpg","shows_english_title":true}],"placement_note":"Walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Technofantasy. Orbit calls the complete four-book sequence fantasy and grounds an impossible invented Tower of stacked ringdoms, Sphinx-built machinery, airships and siege engines. The fantastical world plus its governing technological marvels make Technofantasy exact; The Hod King is book 3, consolidated into one complete-series card."},{"title":"The Iron Dragon’s Mother","cover_url":"cover-the-iron-dragons-mother.jpg","shows_english_title":true,"authors":["Michael Swanwick"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Technofantasy. Tor calls it an adventure fantasy in Industrialized Faerie: a half-human pilot flies a sentient mechanical dragon after a soul-stealing raid. Actual faerie magic wears bright industrial and mechanical trappings, and the framed pilot’s flight drives an action-forward adventure."}],"image":"90-technofantasy.webp"},{"id":"fantastic-voyage","label":"Fantastic voyage","parent":"proto-sf","children":[],"works":[{"title":"Gulliver's Travels","cover_url":"https://archive.org/download/gulliverstravels00jona_0/page/cover.jpg","shows_english_title":true,"authors":["Jonathan Swift"],"year":1726}],"definition":"Pre-novelistic speculative journeys to unknown lands and peoples - the Proto SF form named in SFE 'Fantastic Voyages', from Lucian's True History through Gulliver.","status":"provisional","image":"92-fantastic-voyage.webp"},{"id":"hard-sf","label":"Hard Sci-fi","parent":"futurist","children":["orbital-mechanics","planetary-science","matter-transmission","hard-conceptual-sf"],"works":[],"image":"15-hard-sf.webp","definition":"Science fiction whose central reading experience is rigorous scientific constraint, extrapolation, engineering or conceptual problem-solving.","status":"accepted"},{"id":"future-of-earth-fiction","label":"Future of Earth fiction","parent":"futurist","children":["dystopian-fiction","psionics","techno-fiction","future-war","future-history-of-earth","utopian-fiction"],"works":[],"image":"117-future-of-earth-fiction.webp","definition":"Science fiction fundamentally about possible futures of Earth, human society and Earth-descended life, including once-proposed speculative sciences that now read as an alternate path for Earth.","status":"accepted"},{"id":"spacefaring-fiction","label":"Spacefaring fiction","parent":"futurist","children":["classic-space-opera","military-science-fiction","new-space-opera","future-history-in-space","techno-fiction-in-space","generation-starships","space-dystopias","space-colonies"],"works":[],"image":"118-spacefaring-fiction.webp","definition":"Science fiction fundamentally about travel, settlement, conflict and civilization beyond Earth.","status":"accepted"},{"id":"space-colonies","label":"Space colonies","parent":"spacefaring-fiction","children":[],"works":[{"title":"Red Moon","cover_url":"https://covers.openlibrary.org/b/id/10292083-L.jpg","shows_english_title":true,"authors":["Kim Stanley Robinson"],"year":2018,"placement_note":"Root-down: a permanent, working lunar settlement passes Spacefaring fiction. SFE and Hachette center a colonized Moon under Chinese influence, while Kirkus calls the novel a political thriller in which the Moon is backdrop and game piece. Space colonies is exact because the established colony is the arena for murder, surveillance and revolution; the story is neither about founding the colony nor a dystopian nightmare-state."},{"id":"vagabonds","title":"Vagabonds","authors":["Hao Jingfang"],"year":2020,"books":[{"title":"Vagabonds","year":2020,"cover_url":"cover-vagabonds.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Space colonies. Locus sets the novel in 2201 after an Earth-Mars war: the Mercury Group returns from Earth to an established collectivist Martian republic of ateliers, assigned housing and inherited political secrets. Mars as a lived settlement, with its institutions and quiet revolution, is the arena.","cover_url":"cover-vagabonds.jpg"},{"title":"The Investigations of Mossa & Pleiti","cover_url":"https://covers.openlibrary.org/b/id/14561407-L.jpg","shows_english_title":true,"authors":["Malka Older"],"year":2023,"placement_note":"Gaslamp mysteries in the settlements on Jupiter's rings, with an investigator and a scholar working cases through its institutions (PW, Library Journal). Series card: The Mimicking of Known Successes (2023), The Imposition of Unnecessary Obstacles (2024).","books":[{"title":"The Mimicking of Known Successes","year":2023,"cover_url":"https://covers.openlibrary.org/b/id/14561407-L.jpg"},{"title":"The Imposition of Unnecessary Obstacles","year":2024,"cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250906792.01.LZZZZZZZ.jpg"}]},{"title":"Marjorie Westriding","cover_url":"https://covers.openlibrary.org/b/id/4673084-L.jpg","shows_english_title":true,"authors":["Sheri S. Tepper"],"year":1989,"books":[{"title":"Grass","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/4673084-L.jpg"},{"title":"Raising the Stones","year":1990,"cover_url":"https://covers.openlibrary.org/b/id/7279595-L.jpg"},{"title":"Sideshow","year":1992,"cover_url":"https://covers.openlibrary.org/b/id/3973055-L.jpg"}],"placement_note":"Full algorithmic walk 2026-09-25 (Gustav ruling): fails the Modern day gate ('recognizable present' vs galaxy-spanning far-future) and the Pandemic def (plague is backwash; civilization wounded, not ended). Deepest def-fit: established off-Earth settlements whose civic life and institutions form the arena - Grass's ossified aristocratic colony, Hobbs Land remade by the dead Arbai's legacy, Elsewhere. Chosen over xenocolonial (fits Grass best, weaker on books 2-3)."}],"image":"233-space-colonies.webp","definition":"Science fiction set in established off-Earth settlements whose civic life, institutions and politics form the story’s arena. This leaf is about colonies as lived places, not the process of colonization itself.","status":"accepted"},{"id":"space-dystopias","label":"Space dystopias","parent":"spacefaring-fiction","children":[],"works":[{"title":"Red Rising","cover_url":"https://covers.openlibrary.org/b/id/8407136-L.jpg","shows_english_title":true,"authors":["Pierce Brown"],"year":2014,"placement_note":"Root-down: Mars and the settled Solar System make Spacefaring the required branch; its caste order, forced labor, founding lie and governing spectacle make Space dystopias the existing exact leaf."},{"title":"A Time of Changes","cover_url":"https://store.gollancz.co.uk/cdn/shop/products/9781473229235-original.jpg?v=1757037150","shows_english_title":true,"authors":["Robert Silverberg"],"year":1971},{"title":"An Unkindness of Ghosts","cover_url":"https://www.akashicbooks.com/uploads/UnkindnessofGhosts-509x800.jpg","shows_english_title":true,"authors":["Rivers Solomon"],"year":2017}],"image":"153-space-dystopias.webp","definition":"Spacefaring human futures where the social order itself is the horror: closed, oppressive societies off Earth.","status":"accepted"},{"id":"alien-fiction","label":"Alien fiction","parent":"futurist","children":["anthropological-science-fiction","first-contact","hard-alien","alien-cosmic-history","alien-horror"],"works":[],"image":"119-alien-fiction.webp","definition":"Science fiction fundamentally about alien minds, species, cultures, contact and nonhuman civilization.","status":"accepted"},{"id":"otherworldly-fiction","label":"Otherworldly fiction","parent":"futurist","children":["otherworldly-hard-sf"],"works":[],"image":"120-otherworldly-fiction.webp","definition":"Science fiction set in an unanchored or fundamentally other cosmos where the world-model itself is central.","status":"accepted"},{"id":"dystopian-fiction","label":"Dystopian Futures","parent":"future-of-earth-fiction","children":["totalitarian-dystopia","social-dystopia","post-holocaust-survival","ruined-earth","dying-earth"],"works":[],"image":"10-dystopian-fiction.webp","definition":"Branch for designed, broken, surviving, renewed and terminal futures of Earth.","status":"accepted"},{"id":"totalitarian-dystopia","label":"Totalitarian dystopia","parent":"dystopian-fiction","children":["huxleyan-dystopia","orwellian-dystopia","dystopian-rebellion"],"image":"42-totalitarian-dystopia.webp","definition":"Umbrella for totalitarian dystopia in three modes: Huxleyan control through pleasure, conditioning, drugs and engineered bodies; Orwellian control through surveillance, censorship, law and force; and Dystopian rebellion, where the story is the fight against a totalitarian regime already in power.","status":"umbrella","works":[]},{"id":"huxleyan-dystopia","label":"Huxleyan dystopia","parent":"totalitarian-dystopia","children":[],"works":[{"title":"A Clockwork Orange","cover_url":"https://covers.openlibrary.org/b/id/14430517-L.jpg","shows_english_title":true,"authors":["Anthony Burgess"],"year":1962},{"title":"Brave New World","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780099518471/9780099518471-jacket-large.jpg","shows_english_title":true,"authors":["Aldous Huxley"],"year":1932},{"title":"Camp Concentration","cover_url":"https://covers.openlibrary.org/b/isbn/9780586028469-L.jpg","shows_english_title":true,"authors":["Thomas M. Disch"],"year":1968},{"title":"Dealing in Dreams","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781481472166/dealing-in-dreams-9781481472166_lg.jpg","shows_english_title":true,"authors":["Lilliam Rivera"],"year":2019,"placement_note":"Simon & Schuster and Publishers Weekly describe a dystopian Mega City governed through violent loyalty, guardian gangs, hierarchy, state-sponsored drugs and enforced gender rules; institutional coercion makes Totalitarian dystopia closest."},{"id":"uglies","title":"Uglies","authors":["Scott Westerfeld"],"year":2005,"books":[{"title":"Uglies","year":2005,"cover_url":"cover-uglies.jpg"},{"title":"Pretties","year":2005,"cover_url":"cover-pretties.jpg"},{"title":"Specials","year":2006,"cover_url":"cover-specials.jpg"},{"title":"Extras","year":2007,"cover_url":"cover-extras.jpg"}],"cover_url":"cover-uglies.jpg"}],"image":"161-huxleyan-dystopia.webp","definition":"Dystopias where power engineers consent and conformity through pleasure, conditioning, drugs, psychological manipulation or control of the body - the Huxleyan side of Neil Postman’s Huxley-versus-Orwell contrast.","status":"accepted"},{"id":"orwellian-dystopia","label":"Orwellian dystopia","parent":"totalitarian-dystopia","children":["classic-orwellian","orwellian-propaganda","orwellian-statesmanship","orwellian-assimilation","orwellianesque"],"works":[],"image":"162-orwellian-dystopia.webp","definition":"Umbrella for coercive dystopias descended from the 1984 formula and its extensions through media, law, identity and related state methods. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"classic-orwellian","label":"Classic Orwellian","parent":"orwellian-dystopia","children":[],"works":[{"title":"Nineteen Eighty-Four","cover_url":"https://covers.openlibrary.org/b/id/10740454-L.jpg","shows_english_title":true,"authors":["George Orwell"],"year":1949},{"title":"We","cover_url":"https://covers.openlibrary.org/b/isbn/9781554814107-L.jpg","shows_english_title":true,"authors":["Yevgeny Zamyatin"],"year":1924},{"title":"Tender Is the Flesh","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781982150921/tender-is-the-flesh-9781982150921.jpg","shows_english_title":true,"authors":["Agustina Bazterrica"],"year":2017,"placement_note":"Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Totalitarian dystopia -> Orwellian dystopia -> Classic Orwellian. The pandemic is only the official origin story; the governing engine is a normalized state system of human livestock, censorship, curfews, euphemistic controlled language and compulsory acceptance of the Transition. That direct coercion and truth control outrank Pandemic and the Social dystopia branches."},{"title":"The Memory Police","cover_url":"cover-the-memory-police.jpg","shows_english_title":true,"authors":["Yoko Ogawa"],"year":1994,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Totalitarian dystopia -> Orwellian dystopia -> Classic Orwellian. Penguin Random House calls it an Orwellian novel of state surveillance: objects disappear, most inhabitants forget them, and the Memory Police persecute the few who remember. Enforced forgetting, controlled reality and coercive surveillance run the 1984 formula directly."}],"image":"184-classic-orwellian.webp","definition":"Dystopias that run the 1984 formula as written in the book - total surveillance, controlled language or history, regimented life and compulsory belief. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellian-propaganda","label":"Orwellian Propaganda","parent":"orwellian-dystopia","children":[],"works":[{"title":"Fahrenheit 451","cover_url":"https://covers.openlibrary.org/b/id/14411344-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1953},{"title":"The Hunger Games","cover_url":"https://covers.openlibrary.org/b/id/14819483-L.jpg","shows_english_title":true,"authors":["Suzanne Collins"],"year":2008,"books":[{"title":"The Hunger Games","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/14819483-L.jpg","shows_english_title":true},{"title":"Catching Fire","year":2009,"cover_url":"https://covers.openlibrary.org/b/id/15229610-L.jpg","shows_english_title":true},{"title":"Mockingjay","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/7460236-L.jpg","shows_english_title":true},{"title":"The Ballad of Songbirds and Snakes","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/13342995-L.jpg","shows_english_title":true},{"title":"Sunrise on the Reaping","year":2025,"cover_url":"https://covers.openlibrary.org/b/id/14847912-L.jpg","shows_english_title":true}]}],"image":"185-orwellian-propaganda.webp","definition":"Extensions of Orwell's media control through state distraction, censorship and governing spectacle. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellian-statesmanship","label":"Orwellian Statesmanship","parent":"orwellian-dystopia","children":[],"works":[{"title":"China Mountain Zhang","cover_url":"https://covers.openlibrary.org/b/id/8779578-L.jpg","shows_english_title":true,"authors":["Maureen F. McHugh"],"year":1992,"placement_note":"SFE and Tor place ordinary life in a regimented China-dominated twenty-second century where homosexuality is a capital offence; lived political and social coercion make Totalitarian dystopia the closest future leaf."},{"title":"Tropic of Kansas universe","cover_url":"https://covers.openlibrary.org/b/id/10237276-L.jpg","shows_english_title":true,"authors":["Christopher Brown"],"year":2017,"books":[{"title":"Tropic of Kansas","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/10237276-L.jpg"},{"title":"Rule of Capture","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10223899-L.jpg"},{"title":"Failed State","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10394133-L.jpg"}],"placement_note":"SFE treats the books as one near-future American sequence: authoritarian rule and resistance, secret trials of state enemies and extrajudicial murder, then national collapse and a tribunal attempting new law. The sequence's defining pressure is overt political coercion through law, police power and punishment, making Orwellian dystopia closest."}],"image":"186-orwellian-statesmanship.webp","definition":"Extensions of Orwell's bureaucratic and legal machinery through administration, ideological law, secret process and lawfare. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellian-assimilation","label":"Orwellian Assimilation","parent":"orwellian-dystopia","children":[],"works":[{"title":"Impostors","cover_url":"https://images.booksense.com/images/510/151/9781338151510.jpg","shows_english_title":true,"authors":["Scott Westerfeld"],"year":2018,"books":[{"title":"Impostors","year":2018,"cover_url":"https://images.booksense.com/images/510/151/9781338151510.jpg","shows_english_title":true},{"title":"Shatter City","year":2019,"cover_url":"https://images.booksense.com/images/421/150/9781338150421.jpg","shows_english_title":true},{"title":"Mirror's Edge","year":2021,"cover_url":"https://images.booksense.com/images/589/151/9781338151589.jpg","shows_english_title":true},{"title":"Youngbloods","year":2022,"cover_url":"https://img2.snapplify.com/86bea372e1f2ed87a8b0f2a3ccdd1d42/scholasticdistrib/9781338151572.jpg","shows_english_title":true}],"placement_note":"Westerfeld says this four-book continuation occurs after the Pretty Regime falls, in unstable cities where bad rulers, failed revolutions and imposed identities shape young lives. Power is overtly political and coercive, making Orwellian dystopia the closest existing leaf."},{"title":"Golden State","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316505406.jpg","shows_english_title":true,"authors":["Ben H. Winters"],"year":2019,"placement_note":"Hachette describes an alternate California where contradicting official truth is the greatest crime and a panopticon records, verifies and enforces reality. Surveillance, law and punishment maintain state power, making Orwellian dystopia exact."}],"image":"187-orwellian-assimilation.webp","definition":"Extensions of Orwell's state-remakes-the-person thread through manufactured identity and enforced conformity to certified truth. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellianesque","label":"Orwellianesque","parent":"orwellian-dystopia","children":[],"works":[{"title":"Internment","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/06/9780316522700.jpg","shows_english_title":true,"authors":["Samira Ahmed"],"year":2019,"placement_note":"SFE and Little, Brown place Muslim Americans in near-future government internment camps, where Layla resists the Director and guards. State classification, incarceration and overt coercive force make Orwellian dystopia exact."},{"title":"A Song for a New Day","cover_url":"https://covers.openlibrary.org/b/id/8780333-L.jpg","shows_english_title":true,"authors":["Sarah Pinsker"],"year":2019},{"title":"On Wings of Song","authors":["Thomas M. Disch"],"year":1979,"cover_url":"https://covers.openlibrary.org/b/id/678888-L.jpg","shows_english_title":true}],"image":"188-orwellianesque.webp","definition":"Last-resort intake leaf for dystopias resembling Orwell's coercive methods but matching no sibling thread yet; it is meant to crystallize into a more specific pattern, not absorb convenient leftovers. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"dystopian-rebellion","label":"Dystopian rebellion","parent":"totalitarian-dystopia","children":[],"image":"310-dystopian-rebellion.webp","definition":"Totalitarian dystopias told from the rebellion: the regime has already taken power, and the story follows those who fight to bring it down - guerrillas, insurgents, resistance cells. Named by Gustav 2026-09-23.","status":"accepted","works":[{"title":"The Wild Boys","cover_url":"https://covers.openlibrary.org/b/id/568697-L.jpg","shows_english_title":true,"authors":["William S. Burroughs"],"year":1971,"placement_note":"Grove calls it a futuristic global war: repressive police states and their armies across a fascist world, fought by guerrilla bands of mutated wild boys. SFE stresses the surveillance-state power and the cut-up, hallucinatory form. The totalitarian order is already in power and the book's foreground is the boys' insurgency against it."},{"title":"Notes from a Regicide","cover_url":"https://covers.openlibrary.org/b/id/15173108-L.jpg","shows_english_title":true,"authors":["Isaac Fellman"],"year":2025,"placement_note":"In a monarchist New York some thousand years ahead, trans journalist Griffon Keming reads the prison memoir his adoptive father Etoine wrote while awaiting execution for killing the prince, and learns his parents' revolutionary past (Kirkus, Locus, PW 'dystopian trans saga'). The regicide is the rebellion's defining act, told in memory. Locus Award 2026 SF Novel shortlist. Placed by Gustav's 23:58 ruling."}]},{"id":"social-dystopia","label":"Social dystopian future","parent":"dystopian-fiction","children":["crowded-dystopias","childless-dystopias","cli-fi-dystopia","patriarchal-dystopias"],"image":"43-social-dystopia.webp","definition":"Dystopias of a sick society rather than a single police state - collapsing reproduction, media saturation, bioengineered economies (the broader line of SFE 'Dystopias'). Split 2026-09-13 from dystopian fiction to keep leaves under ten works. Set in an extrapolated future; renamed 2026-09-14 when the present-day line split off as Social dystopia under Modern day.","status":"umbrella","works":[]},{"id":"crowded-dystopias","label":"Crowded Dystopias","parent":"social-dystopia","children":[],"works":[{"title":"Stand on Zanzibar","cover_url":"https://covers.openlibrary.org/b/id/14193908-L.jpg","shows_english_title":true,"authors":["John Brunner"],"year":1968},{"title":"334","cover_url":"https://covers.openlibrary.org/b/id/228652-L.jpg","shows_english_title":true,"authors":["Thomas M. Disch"],"year":1972},{"title":"The Space Merchants","cover_url":"https://covers.openlibrary.org/b/id/12375902-L.jpg","shows_english_title":true,"authors":["Frederik Pohl","C. M. Kornbluth"],"year":1953,"books":[{"title":"The Space Merchants","year":1953,"authors":["Frederik Pohl","C. M. Kornbluth"],"cover_url":"https://covers.openlibrary.org/b/id/12375902-L.jpg"},{"title":"The Merchants' War","year":1984,"authors":["Frederik Pohl"],"cover_url":"https://covers.openlibrary.org/b/id/9320638-L.jpg"}],"placement_note":"SFE calls it a dark satire of a world dominated by ruthless advertising agencies, addictive consumer products and manipulation; its designed corporate-consumer social order is the central dystopia."},{"title":"Make Room! Make Room!","cover_url":"https://covers.openlibrary.org/b/id/7266013-L.jpg","shows_english_title":true,"authors":["Harry Harrison"],"year":1966,"placement_note":"Macmillan calls it classic dystopian SF about an overpopulated future: 35 million people in New York, mass hunger, scarce water and social breakdown; Open Road likewise centers population pressure and dwindling resources. Mass population breaking society makes Crowded Dystopias exact."}],"image":"154-crowded-dystopias.webp","definition":"Dystopian futures where too many people and the pressures of mass population break society.","status":"accepted"},{"id":"childless-dystopias","label":"Childless Dystopias","parent":"social-dystopia","children":[],"works":[{"title":"The Children of Men","cover_url":"https://pdjames.co.uk/wp-content/uploads/sites/38/2017/07/getimage-17.jpeg","shows_english_title":true,"authors":["P. D. James"],"year":1992},{"title":"Atomized","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780099283362/9780099283362-jacket-large.jpg","shows_english_title":true,"authors":["Michel Houellebecq"],"year":1998},{"title":"Greybeard","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-greybeard-2-81.jpg","shows_english_title":true,"authors":["Brian W. Aldiss"],"year":1964,"placement_note":"SFE describes a future where biological-weapons fallout makes humanity sterile and nearly every survivor is elderly as the species approaches extinction. A world without a next generation makes Childless Dystopias exact."}],"image":"155-childless-dystopias.webp","definition":"Dystopian futures with no next generation: societies made barren or voluntarily childless.","status":"accepted"},{"id":"patriarchal-dystopias","label":"Patriarchal Dystopias","parent":"social-dystopia","children":[],"image":"320-patriarchal-dystopias.webp","definition":"Patriarchal Dystopias: dystopian futures whose engine is patriarchy - male rule as the organizing principle of the oppression, women held as property, breeding stock or scapegoats. Falling fertility may trigger it, but the subject is the rule of men. Named by Gustav 2026-09-23.","status":"accepted","works":[{"title":"The Handmaid's Tale","cover_url":"https://cdn2.penguin.com.au/covers/400/9781784871444.jpg","shows_english_title":true,"authors":["Margaret Atwood"],"year":1985,"books":[{"title":"The Handmaid's Tale","year":1985,"cover_url":"https://covers.openlibrary.org/b/id/8231851-L.jpg"},{"title":"The Testaments","year":2019,"cover_url":"cover-the-testaments.jpg","shows_english_title":true}],"placement_note":"Offred is enslaved for reproduction in the patriarchal totalitarian Republic of Gilead; SFE and the publisher identify the dystopian structure. Infertility is the trigger, male rule the engine. Moved from Childless Dystopias 2026-09-23 (Gustav 17:43)."},{"title":"The Holdfast Chronicles","cover_url":"https://covers.openlibrary.org/b/id/13266505-L.jpg","shows_english_title":false,"authors":["Suzy McKee Charnas"],"year":1974,"books":[{"title":"Walk to the End of the World","year":1974,"cover_url":"https://covers.openlibrary.org/b/id/13266505-L.jpg","shows_english_title":true},{"title":"Motherlines","year":1978,"cover_url":"https://covers.openlibrary.org/b/id/10290090-L.jpg","shows_english_title":true},{"title":"The Furies","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/3871354-L.jpg","shows_english_title":true},{"title":"The Conqueror's Child","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/182451-L.jpg","shows_english_title":true}],"placement_note":"SFE (Charnas): Holdfast is 'a misogynist Dystopia' on a post-holocaust Ruined Earth, where the ruling males treat women ('Fems') as scapegoats for the Wasting, with breeding as an act of disgust and the dominance of elder males. The four Holdfast Chronicles examine gender relations under and after that rule (The Conqueror's Child won the Tiptree Award). Placed by Gustav 2026-09-23 17:43."}]},{"id":"cli-fi-dystopia","label":"Cli-fi dystopia","parent":"social-dystopia","children":[],"works":[{"title":"The Windup Girl","cover_url":"https://cloud.start-publishing.com/public/content/module/public-website/files/2016/01/19/9781597805742_fc-1784.jpg","shows_english_title":true,"authors":["Paolo Bacigalupi"],"year":2009},{"title":"American War","cover_url":"https://images2.penguinrandomhouse.com/smedia/9781101973134","shows_english_title":true,"authors":["Omar El Akkad"],"year":2017},{"title":"Blackfish City","cover_url":"https://covers.openlibrary.org/b/id/8595548-L.jpg","shows_english_title":true,"authors":["Sam J. Miller"],"year":2018},{"title":"Bridge 108","cover_url":"https://images.leslibraires.ca/books/9781542006071/front/9781542006071_large.webp","shows_english_title":true,"authors":["Anne Charnock"],"year":2020},{"title":"Rise of the Red Hand","cover_url":"https://covers.openlibrary.org/b/id/10838422-L.jpg","shows_english_title":true,"authors":["Olivia Chadha"],"year":2021,"placement_note":"Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Social dystopian future -> Cli-fi dystopia. SFE says climate change has enabled a dystopian tyranny separating wealthy Uplanders from threatened slums; Erewhon centers a climate-controlled biodome, rising seas, unbreathable air and deadly superbugs. Orwellian and Techno Fiction siblings are rejected because algorithmic rule and cyborg tools serve the climate-stratified social collapse."},{"title":"The Sheep Look Up","cover_url":"cover-the-sheep-look-up.jpg","shows_english_title":true,"authors":["John Brunner"],"year":1972,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Social dystopia -> Cli-fi dystopia. Open Road centers near-future poisoned air and water, disease, birth defects, corporate profiteering and political collapse caused by environmental disaster. Ecological breakdown drives the dystopia."},{"title":"Venomous Lumpsucker","cover_url":"https://covers.openlibrary.org/b/id/13571608-L.jpg","shows_english_title":true,"authors":["Ned Beauman"],"year":2022,"placement_note":"A few decades on, with extinction credits traded as a market, two people chase the last of an endangered fish through a warming world (Guardian, Telegraph)."},{"title":"Metronome","cover_url":"https://covers.openlibrary.org/b/isbn/9781526639547-L.jpg","shows_english_title":true,"authors":["Tom Watson"],"year":2022,"placement_note":"Aina and Whitney had a child without state permission and serve 12 years' exile on a northern island croft, tethered by a pill clock against toxic spores from melting permafrost; on parole day the Warden doesn't come (Guardian x2). Climate collapse and scarcity sit behind the birth licensing and the croft exile - the dystopia runs on a broken climate. Clarke 2023 shortlist. Placed by Gustav's 2026-09-24 14:15 ruling ('Ok, execute')."}],"image":"156-cli-fi-dystopia.webp","definition":"Dystopian futures where climate change is the engine of social collapse and conflict.","status":"accepted"},{"id":"post-holocaust-survival","label":"Post-Holocaust Survival","parent":"dystopian-fiction","children":["post-pandemic-survival","post-nuclear-survival","terminal-wastelands"],"image":"115-post-holocaust-survival.webp","definition":"Pure umbrella for survival fiction set in the catastrophe’s living aftermath, partitioned by defining cause where named and by the governing wasteland condition where causes are mixed or unspecified.","status":"umbrella","works":[]},{"id":"post-pandemic-survival","label":"Post-pandemic survival","parent":"post-holocaust-survival","children":[],"image":"257-post-pandemic.webp","definition":"Post-Holocaust survival fiction whose living aftermath is caused by pandemic disease, following survivors as communities endure, adapt or rebuild.","status":"accepted","works":[{"title":"The Death of Grass","cover_url":"cover-the-death-of-grass.webp","shows_english_title":true,"authors":["John Christopher"],"year":1956,"placement_note":"SFE identifies a defining UK Disaster novel: a virus extinguishes grasses and food crops, collapsing civilization while Custance hardens through the grim business of survival in a post-Holocaust world. Penguin confirms the crop virus, mass starvation, social barbarism and the family's flight to sanctuary. The named pandemic cause governs."},{"title":"Earth Abides","cover_url":"https://covers.openlibrary.org/b/id/911121-L.jpg","shows_english_title":true,"authors":["George R. Stewart"],"year":1949},{"title":"I Am Legend","cover_url":"https://covers.openlibrary.org/b/id/6462252-L.jpg","shows_english_title":true,"authors":["Richard Matheson"],"year":1954},{"title":"Station Eleven","cover_url":"https://images.booksense.com/images/304/353/9780385353304.jpg","shows_english_title":true,"authors":["Emily St. John Mandel"],"year":2014},{"id":"wilder-girls","title":"Wilder Girls","authors":["Rory Power"],"year":2019,"cover_url":"cover-wilder-girls.jpg","shows_english_title":true,"books":[{"title":"Wilder Girls","year":2019,"cover_url":"cover-wilder-girls.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Post-Holocaust Survival -> Post-pandemic survival. Near-future (Kirkus) boarding school on an island off Maine, 18 months into the Tox, a disease that has killed or mutated half the school and corrupted the island's plants and animals, under Navy and CDC quarantine (SLJ; Publishers Weekly). NPR and Kirkus read it as post-apocalypse survival. Caveat: the catastrophe is confined to the quarantined island rather than worldwide."}]},{"id":"post-nuclear-survival","label":"Post-nuclear survival","parent":"post-holocaust-survival","children":[],"image":"258-post-nuclear.webp","definition":"Post-Holocaust survival fiction whose living aftermath is caused by nuclear war, following survivors through fallout, social collapse and reconstruction.","status":"accepted","works":[{"title":"Alas, Babylon","cover_url":"https://covers.openlibrary.org/b/id/2540438-L.jpg","shows_english_title":true,"authors":["Pat Frank"],"year":1959,"placement_note":"SFE says full-scale nuclear war leaves Fort Repose surviving the first consequences, then follows the small town coping and modestly flourishing. The lived aftermath and community survival, rather than the strike itself, make Post-Holocaust Survival closest."},{"title":"Dr. Bloodmoney","cover_url":"https://covers.openlibrary.org/b/id/8422913-L.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1965,"placement_note":"SFE calls it a Post-Holocaust USA and Hachette sets it seven years after the bombs in a Point Reyes barter community. The survivors adapting and getting along in the lived aftermath make Post-Holocaust Survival closest."}]},{"id":"terminal-wastelands","label":"Terminal wastelands","parent":"post-holocaust-survival","children":[],"image":"259-terminal-wastelands.webp","definition":"Mixed-cause or unspecified collapses whose defining condition is traversing or enduring a devastated landscape, rather than one named catastrophic cause. Recovery may exist, but the wasteland remains the governing condition.","status":"accepted","works":[{"title":"Lost Everything","cover_url":"https://mpd-biblio-covers.imgix.net/9780765329127.jpg","shows_english_title":true,"authors":["Brian Francis Slattery"],"year":2012},{"title":"The Road","cover_url":"https://images.booksense.com/images/899/387/9780307387899.jpg","shows_english_title":true,"authors":["Cormac McCarthy"],"year":2006},{"title":"These Prisoning Hills","cover_url":"https://cdn.shopify.com/s/files/1/0674/5433/7265/files/9781250804488_p0.jpg?v=1765212425","shows_english_title":true,"authors":["Christopher Rowe"],"year":2022},{"title":"In the Country of Last Things","cover_url":"https://covers.openlibrary.org/b/id/9598402-L.jpg","shows_english_title":true,"authors":["Paul Auster"],"year":1987,"placement_note":"SFE identifies a near-future New York reduced to a nightmarishly entropic landscape, imprisoned by a vast Sea Wall Project; Penguin calls it dystopian and post-apocalyptic and follows Anna scavenging food and shelter in a devastated city. Immediate endurance inside the catastrophe’s living aftermath makes Post-Holocaust Survival closest."},{"title":"Shelter","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781781085042/shelter-9781781085042_lg.jpg","shows_english_title":true,"authors":["Dave Hutchinson"],"year":2018,"placement_note":"Almost a century after the Sisters, survivors scavenge ruined England while communities rebuild and contest who inherits the world; lived aftermath makes Post-Holocaust Survival exact."}]},{"id":"ruined-earth","label":"Ruined Earth","parent":"dystopian-fiction","children":["lost-knowledge","wild-ruins"],"image":"116-ruined-earth.webp","definition":"Farther-future tales where civilization’s ruins have become the landscape, relics, myths and foundations of successor societies, divided between societies that guard or recover lost knowledge and peoples living wild among the ruins.","status":"candidate","works":[]},{"id":"utopian-fiction","label":"Utopian fiction","parent":"future-of-earth-fiction","children":["satirical-utopia","secluded-utopias","hopepunk"],"works":[],"image":"27-utopian-fiction.webp","definition":"Fiction that constructs and tests an imagined society organized as a better, alternative, or deliberately ambiguous social order.","status":"accepted"},{"id":"satirical-utopia","label":"Satirical Utopia","parent":"utopian-fiction","children":[],"works":[{"title":"Erewhon","cover_url":"https://covers.openlibrary.org/b/id/8494792-L.jpg","shows_english_title":true,"authors":["Samuel Butler"],"year":1872,"books":[{"title":"Erewhon","year":1872,"authors":["Samuel Butler"],"cover_url":"https://covers.openlibrary.org/b/id/825789-L.jpg"},{"title":"Erewhon Revisited","year":1901,"cover_url":"https://covers.openlibrary.org/b/id/1844002-L.jpg"}]},{"title":"A Strange Manuscript Found in a Copper Cylinder","cover_url":"https://covers.openlibrary.org/b/id/5647709-L.jpg","shows_english_title":true,"authors":["James De Mille"],"year":1888},{"title":"Gargantua and Pantagruel","cover_url":"https://covers.openlibrary.org/b/id/11989067-L.jpg","shows_english_title":true,"authors":["François Rabelais"],"year":1532,"placement_note":"SFE treats the linked giant narratives as one immense, adventurous satire whose carnivalesque misrule exposes medieval hierarchy and makes a non-hierarchical utopia conceivable. Its imagined social inversions make Satirical Utopia the closest leaf."},{"title":"Giles Goat-Boy","cover_url":"https://images1.penguinrandomhouse.com/cover/9780385240864","shows_english_title":true,"authors":["John Barth"],"year":1966,"placement_note":"SFE calls it a literalized world-university and complex satire of education, human nature, knowledge and the Cold War; PRH describes authoritarian and open campuses threatened by a tyrannical computer. Its imagined institution satirizes contemporary systems, making Satirical Utopia closest."},{"title":"Looking Backward, From The Year 2000","cover_url":"https://covers.openlibrary.org/b/id/6999940-L.jpg","shows_english_title":true,"authors":["Mack Reynolds"],"year":1973,"placement_note":"SFE calls this a reprise of Bellamy’s classic utopian novel displaying Reynolds’s political and economic ideas about an energy-abundant society, with later books increasingly subverting and doubting its outcome. Its constructed ideal society is used to test contemporary socioeconomic assumptions, making Satirical Utopia closest."},{"id":"seven-days-in-new-crete","title":"Seven Days in New Crete","authors":["Robert Graves"],"year":1949,"cover":"https://covers.openlibrary.org/b/id/12690733-L.jpg","placement_note":"Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Satirical Utopia. SFE calls it a Utopian Scientific Romance in a post-World War Three future: the poet-magicians’ apparently ideal New Crete is deliberately destabilized to expose its sterile timelessness. Literal goddess and poet-magicians are real within the book, but its constructed future society and ambivalent utopian test are the organizing engine.","sources":["https://sf-encyclopedia.com/entry/graves_robert","https://sf-encyclopedia.com/entry/utopias"],"cover_url":"https://covers.openlibrary.org/b/id/12690733-L.jpg","shows_english_title":true},{"id":"utopia","title":"Utopia","authors":["Thomas More"],"year":1516,"cover_url":"cover-utopia.jpg","shows_english_title":true,"books":[{"title":"Utopia","year":1516,"cover_url":"cover-utopia.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Satirical Utopia. SFE treats More's book as the founding rationally designed utopia and stresses its satire of contemporary England and its deliberately unstable advocacy. Same-period imagined societies already sit on this leaf (Gargantua and Pantagruel 1532, Erewhon), so the contemporary island setting does not block the Futurist path. Reopened from the #956 hold on that precedent."}],"image":"130-satirical-utopia.webp","definition":"Utopian fiction that uses an apparently ideal society to satirize the customs, institutions and assumptions of its readers own world.","status":"accepted"},{"id":"secluded-utopias","label":"Secluded Utopias","parent":"utopian-fiction","children":[],"works":[{"title":"Islandia","cover_url":"https://covers.openlibrary.org/b/id/7890744-L.jpg","shows_english_title":true,"authors":["Austin Tappan Wright"],"year":1942,"placement_note":"SFE describes Islandia as a densely imagined utopian culture on a great island near Antarctica, separated from and scathingly critical of business-oriented modernity. Its social ideal depends on geographical and cultural separation from the wider world, making Secluded Utopias closest."},{"title":"Lost Horizon","cover_url":"https://covers.openlibrary.org/b/id/6532933-L.jpg","shows_english_title":true,"authors":["James Hilton"],"year":1933},{"title":"The Glass Bead Game","cover_url":"https://covers.openlibrary.org/b/id/14771809-L.jpg","shows_english_title":true,"authors":["Hermann Hesse"],"year":1943},{"title":"Oath of Fealty","cover_url":"https://covers.openlibrary.org/b/id/1786964-L.jpg","shows_english_title":true,"authors":["Larry Niven","Jerry Pournelle"],"year":1981,"placement_note":"SFE pournelle_jerry: near-future Los Angeles arcology (Todos Santos) defends its wealthy inhabitants from ecology activists and terrorists, ignoring government interference; SFE tags it Keep. A protected, self-secluded enclave whose ideals depend on separation -> secluded-utopias."},{"title":"Chronicles of Sumer","cover_url":"https://covers.openlibrary.org/b/id/11956932-L.jpg","shows_english_title":true,"authors":["Gautam Bhatia"],"year":2020,"books":[{"title":"The Wall","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/11956932-L.jpg","shows_english_title":true},{"title":"The Horizon","year":2021,"cover_url":"https://harpercollins.co.in/wp-content/uploads/2025/12/9789354227639-4.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Secluded Utopias. Sumer is a designed ambiguous society whose population, class, law and worldview depend on two thousand years of engineered isolation."},{"id":"venus-plus-x","title":"Venus Plus X","authors":["Theodore Sturgeon"],"year":1960,"cover_url":"cover-venus-plus-x.jpg","shows_english_title":true,"books":[{"title":"Venus Plus X","year":1960,"cover_url":"cover-venus-plus-x.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Secluded Utopias. SFE calls it as close to a traditional Utopia as American genre SF had come; PRH presents Ledom's genderless, post-scarcity society, and the plot's reveal places Ledom in a hiding place cut off from the wider world. Separation is what keeps the utopia going, as with Lost Horizon and Islandia on this leaf."}],"image":"131-secluded-utopias.webp","definition":"Utopian fiction centered on protected, geographically or institutionally secluded communities whose ideals depend on separation from the wider world.","status":"accepted"},{"id":"hopepunk","label":"Hopepunk","parent":"utopian-fiction","children":["ecotopian","feminist-utopia"],"works":[],"image":"132-hopepunk.webp","definition":"Fiction in which hope, mutual care and collective resistance are active forces for building a better society rather than passive optimism.","status":"accepted"},{"id":"ecotopian","label":"Ecotopian","parent":"hopepunk","children":[],"works":[{"title":"Ecotopia","cover_url":"https://images2.penguinrandomhouse.com/cover/9780553348477","shows_english_title":false,"authors":["Ernest Callenbach"],"year":1975,"books":[{"title":"Ecotopia: The Notebooks and Reports of William Weston","year":1975},{"title":"Ecotopia Emerging","year":1981,"cover_url":"https://covers.openlibrary.org/b/id/4381574-L.jpg"}]},{"title":"Always Coming Home","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-always-coming-home-249.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":1985},{"title":"News from Nowhere","cover_url":"https://covers.openlibrary.org/b/id/103204-L.jpg","shows_english_title":true,"authors":["William Morris"],"year":1890},{"title":"The Bounceback","cover_url":"https://covers.openlibrary.org/b/id/10252953-L.jpg","shows_english_title":true,"authors":["L. X. Beckett"],"year":2019,"books":[{"title":"Gamechanger","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10252953-L.jpg"},{"title":"Dealbreaker","year":2021,"cover_url":"http://www.lxbeckett.com/wp-content/uploads/2020/07/Dealbreaker-cover-663x1024.jpg"}],"placement_note":"SFE places the duology after humanity survives its climate gauntlet and begins restoring Earth; the author centers the Bounceback Generation and planetary recovery. A society organized around ecological repair makes Ecotopian the closest leaf."},{"title":"The Ministry for the Future","cover_url":"cover-the-ministry-for-the-future.jpg","shows_english_title":true,"authors":["Kim Stanley Robinson"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Hopepunk -> Ecotopian. Orbit describes a near future where an institution founded in 2025 represents future generations and protects all living creatures, tracing collective efforts to turn the climate crisis before collapse. Ecological repair and institutional transformation build the better order."},{"title":"The Bannerless Saga","cover_url":"cover-bannerless.jpg","shows_english_title":true,"authors":["Carrie Vaughn"],"year":2017,"books":[{"title":"Bannerless","year":2017,"cover_url":"cover-bannerless.jpg","shows_english_title":true},{"title":"The Wild Dead","year":2018,"cover_url":"cover-the-wild-dead.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Hopepunk -> Ecotopian. A post-collapse cooperative society organizes households, resources and reproduction around ecological sustainability; mysteries test its compact while hope and collective responsibility govern."},{"title":"The Terraformers","cover_url":"https://covers.openlibrary.org/b/id/13239812-L.jpg","shows_english_title":true,"authors":["Annalee Newitz"],"year":2023,"placement_note":"Far-future terraforming of the planet Sask-E, where ranger Destry and sentient animals fight a corporation for a sustainable, shared world (Locus, Scientific American). Better society founded on ecological balance."},{"title":"When There Are Wolves Again","cover_url":"https://covers.openlibrary.org/b/id/15227287-L.jpg","shows_english_title":true,"authors":["E. J. Swift"],"year":2025,"placement_note":"Braided past-present-future story of rewilding wolves in Scotland and a climate-altered future (Locus, Fantasy Hive). The people-nature relationship is the core, so Ecotopian."}],"image":"133-ecotopian.webp","definition":"Utopian fiction whose better society is founded on ecological balance, sustainable lifeways and a transformed relationship between people and the natural world.","status":"accepted"},{"id":"feminist-utopia","label":"Feminist Utopia","parent":"hopepunk","children":[],"works":[{"title":"Herland","year":1915,"authors":["Charlotte Perkins Gilman"],"cover_url":"https://archive.org/download/herland0000gilm/page/cover.jpg","shows_english_title":true,"placement_note":"SFE Gilman calls Herland a book-length feminist Utopia: an isolated parthenogenetic society of 2,000 years visited by three men."},{"title":"The Female Man","cover_url":"https://covers.openlibrary.org/b/id/448143-L.jpg","shows_english_title":true,"authors":["Joanna Russ"],"year":1975}],"image":"134-feminist-utopia.webp","definition":"Utopian fiction that imagines social orders transformed by feminism, gender equality, womens autonomy or alternatives to patriarchal institutions.","status":"accepted"},{"id":"dying-earth","label":"Dying earth","parent":"dystopian-fiction","children":[],"image":"37-dying-earth.webp","definition":"Far-future tales under a moribund sun, where magic and science meld (SFE 'Dying Earth': named by Vance's 1950 sequence; Wolfe's Book of the New Sun is its most significant inheritor).","status":"candidate","works":[{"title":"The Book of the New Sun","cover_url":"https://covers.openlibrary.org/b/id/14836065-L.jpg","shows_english_title":false,"authors":["Gene Wolfe"],"year":1980,"books":[{"title":"The Shadow of the Torturer","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/7150677-L.jpg","shows_english_title":true},{"title":"The Claw of the Conciliator","year":1981,"cover_url":"https://covers.openlibrary.org/b/id/6623051-L.jpg","shows_english_title":true},{"title":"The Sword of the Lictor","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/72358-L.jpg","shows_english_title":true},{"title":"The Citadel of the Autarch","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/10290461-L.jpg","shows_english_title":true},{"title":"The Urth of the New Sun","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/10155842-L.jpg","shows_english_title":true}]},{"title":"The City and the Stars","cover_url":"https://covers.openlibrary.org/b/id/15170832-L.jpg","shows_english_title":true,"authors":["Arthur C. Clarke"],"year":1956},{"title":"The Dying Earth","cover_url":"https://covers.openlibrary.org/b/id/183396-L.jpg","shows_english_title":true,"authors":["Jack Vance"],"year":1950,"books":[{"title":"The Dying Earth","year":1950,"cover_url":"https://covers.openlibrary.org/b/id/8035157-L.jpg","shows_english_title":true},{"title":"The Eyes of the Overworld","year":1966,"cover_url":"https://covers.openlibrary.org/b/id/9317366-L.jpg","shows_english_title":true},{"title":"Cugel's Saga","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/7897020-L.jpg","shows_english_title":true},{"title":"Rhialto the Marvellous","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/10922925-L.jpg","shows_english_title":true}]},{"title":"Hothouse","year":1962,"authors":["Brian W. Aldiss"],"cover_url":"https://archive.org/download/hothouse00bria/page/cover.jpg","shows_english_title":true,"placement_note":"SFE Aldiss and Far Future entries identify Hothouse (preferred title of The Long Afternoon of Earth) as Far Future fiction: a stopped Earth beneath a swollen sun, with devolved human remnants in a continent-spanning tree; its end-of-Earth entropy makes it a direct Dying Earth fit."},{"title":"Viriconium","cover_url":"https://images.penguinrandomhouse.com/cover/9780553383157","shows_english_title":true,"authors":["M. John Harrison"],"year":1971,"books":[{"title":"The Pastel City","year":1971,"cover_url":"https://covers.openlibrary.org/b/id/9410274-L.jpg"},{"title":"A Storm of Wings","year":1980,"cover_url":"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1294860893i/304254.jpg"},{"title":"In Viriconium","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/8586480-L.jpg"},{"title":"Viriconium Nights","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/13507449-L.jpg"}]},{"title":"Mordew","cover_url":"https://images.squarespace-cdn.com/content/v1/591373983a041126bc4478a6/1582829007464-YAOSHSFMQ48W740KN856/GBP_PHEBY_Mordew_Cover_new+170220JN+2.jpg","shows_english_title":true,"authors":["Alex Pheby"],"year":2020,"placement_note":"SFE: a Steampunk-ish fantasy tale unpacked within a manifestly Far Future Dying Earth frame; the Edificial city draws its substance from the dead god it is built upon, with hints of Genetic Engineering in the deep past. SFE explicitly evokes leaf-mate Viriconium. Magic and science meld in the far-future frame."},{"title":"The Night Land","cover_url":"cover-the-night-land.jpg","shows_english_title":true,"authors":["William Hope Hodgson"],"year":1912,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Dying Earth. SFE identifies it as a major Dying Earth precursor: the Sun is extinguished, monsters inherit a decaying far-future world and humanity retreats into the Last Redoubt. The exhausted world under a dead sun is the governing engine."},{"id":"zothique","title":"Zothique","authors":["Clark Ashton Smith"],"year":1970,"cover_url":"cover-zothique.jpg","shows_english_title":true,"books":[{"title":"Zothique","year":1970,"cover_url":"cover-zothique.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Dying earth. Lin Carter's 1970 Ballantine Adult Fantasy collection of linked tales set on Zothique, the last continent of a far-future Earth under a dying sun. SFE credits Smith's 'highly influential Dying Earth tales' with making the Far Future a setting that Jack Vance then built on, which puts Zothique at the root of this leaf."}]},{"id":"machine-minds","label":"Machine minds","parent":"techno-fiction","children":["robots","ai"],"works":[],"image":"72-robots-and-ai.webp","status":"provisional","definition":"Science fiction in which machine minds are the central subject - their laws, s

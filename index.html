r_url":"https://covers.openlibrary.org/b/isbn/9780812577563-L.jpg","shows_english_title":true},{"title":"The Gathering Storm","year":2009,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765302304-L.jpg","shows_english_title":true},{"title":"Towers of Midnight","year":2010,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765325945-L.jpg","shows_english_title":true},{"title":"A Memory of Light","year":2013,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765325952-L.jpg","shows_english_title":true},{"title":"New Spring","year":2004,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765306296-L.jpg","shows_english_title":true}]},{"title":"The Broken Earth","cover_url":"https://covers.openlibrary.org/b/id/14428463-L.jpg","shows_english_title":false,"authors":["N. K. Jemisin"],"year":2015,"books":[{"title":"The Fifth Season","year":2015},{"title":"The Obelisk Gate","year":2016},{"title":"The Stone Sky","year":2017}]},{"title":"The Cosmere","cover_url":"https://covers.openlibrary.org/b/id/15158368-L.jpg","shows_english_title":true,"authors":["Brandon Sanderson"],"year":2005,"books":[{"title":"Elantris","year":2005,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765350374.jpg"},{"title":"Mistborn: The Final Empire","year":2006,"cover_url":"https://covers.openlibrary.org/b/id/15158368-L.jpg"},{"title":"The Well of Ascension","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/14658341-L.jpg"},{"title":"The Hero of Ages","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/14658094-L.jpg"},{"title":"Warbreaker","year":2009,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765320308.jpg"},{"title":"The Way of Kings","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/14658316-L.jpg"},{"title":"The Alloy of Law","year":2011,"cover_url":"https://mpd-biblio-covers.imgix.net/9781429994897.jpg"},{"title":"Words of Radiance","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/14658334-L.jpg"},{"title":"Shadows of Self","year":2015,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765378569.jpg"},{"title":"The Bands of Mourning","year":2016,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765378583.jpg"},{"title":"Arcanum Unbounded: The Cosmere Collection","year":2016,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765391186.jpg"},{"title":"Edgedancer","year":2016,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250166548.jpg"},{"title":"Oathbringer","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/14658111-L.jpg"},{"title":"White Sand Omnibus","year":2019,"cover_url":"https://cdn11.bigcommerce.com/s-fle6qzf7oq/images/stencil/608x608/products/57689/57462/TNWhiteSandOmnibusTPBcvr__89835.1772816124.jpg?c=1"},{"title":"Dawnshard","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250850553.jpg"},{"title":"Rhythm of War","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/14658361-L.jpg"},{"title":"Mistborn: Secret History","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250859143.jpg"},{"title":"The Lost Metal","year":2022,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765391193.jpg"},{"title":"Tress of the Emerald Sea","year":2023,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250899668.jpg"},{"title":"Yumi and the Nightmare Painter","year":2023,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250899699.jpg"},{"title":"The Sunlit Man","year":2023,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250899712.jpg"},{"title":"Wind and Truth","year":2024,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250319180.jpg"},{"title":"Isles of the Emberdark","year":2026,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250415394.jpg"}],"placement_note":"Gustav’s 2026-09-21 ruling merges Mistborn and Stormlight into their shared Cosmere card. Sanderson officially defines it as one interconnected epic-fantasy universe and groups both series, two Mistborn eras, standalones, White Sand and Arcanum Unbounded beneath it. Shared engineered magic physics keeps it in Hard magic."},{"title":"Codex Alera","cover_url":"https://images1.penguinrandomhouse.com/cover/9780441012688","shows_english_title":true,"authors":["Jim Butcher"],"year":2004,"books":[{"title":"Furies of Calderon","year":2004,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441012688"},{"title":"Academ's Fury","year":2005,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441013401"},{"title":"Cursor's Fury","year":2006,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441015474"},{"title":"Captain's Fury","year":2007,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441016556"},{"title":"Princeps' Fury","year":2008,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441017966"},{"title":"First Lord's Fury","year":2009,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780441019625"}]},{"title":"The Founders Trilogy","cover_url":"https://covers.openlibrary.org/b/id/9252092-L.jpg","shows_english_title":true,"authors":["Robert Jackson Bennett"],"year":2018,"books":[{"title":"Foundryside","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/9252092-L.jpg"},{"title":"Shorefall","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/13789045-L.jpg"},{"title":"Locklands","year":2022,"cover_url":"https://covers.openlibrary.org/b/id/13249338-L.jpg"}],"placement_note":"Penguin Random House describes scriving as an engineered magic technology that rewrites objects, minds and reality through explicit commands, rules and constraints. Its rule-bound system drives the trilogy, making Hard magic the closest leaf."},{"title":"Middlegame","cover_url":"https://x.sf-encyclopedia.com/gal/dreamhaven/McGuire-Middlegame.jpg","shows_english_title":true,"authors":["Seanan McGuire"],"year":2019,"placement_note":"Tor centers an alchemist’s engineered twins embodying language and mathematics, a plan to raise them to a higher power, and an attainable path to godhood; Publishers Weekly identifies their powers as incarnating the Doctrine of Ethos and commanding nature. Its alchemy is an explicit system of powers, creation, ascent and cost."},{"title":"The Old Kingdom","cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-sabriel-pichi.jpg","shows_english_title":true,"authors":["Garth Nix"],"year":1995,"books":[{"title":"Sabriel","year":1995,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-sabriel-pichi.jpg"},{"title":"Lirael","year":2001,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-lireal-pichi.jpg"},{"title":"Abhorsen","year":2003,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-abhorsen-pichi-1.jpg"},{"title":"Clariel","year":2014,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-clariel-pichi.jpg"},{"title":"Goldenhand","year":2016,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-goldenhand-pichi.jpg"},{"title":"Terciel & Elinor","year":2021,"cover_url":"https://www.garthnix.com/wp-content/uploads/2022/01/us-cover-terciel-and-elinor-pichi.jpg"}],"placement_note":"Root-down: Fantasy -> Fantasy Realms -> Epic fantasy -> Hard magic. Nix’s official synopsis establishes the Old Kingdom, Charter Mages, Free Magic, the Abhorsen and a quest against forces of life and death; the official system gives seven named bells with distinct effects, Charter marks, costs and boundaries. Quest fantasy loses because the rule-bound Charter/Free Magic and necromancy system is the series’ distinctive engine."},{"title":"The Book of Elementals","cover_url":"https://covers.openlibrary.org/b/id/8021202-L.jpg","shows_english_title":true,"authors":["Phyllis Eisenstein"],"year":1979,"books":[{"title":"Sorcerer's Son","year":1979,"cover_url":"https://covers.openlibrary.org/b/id/8021202-L.jpg"},{"title":"The Crystal Palace","year":1988}],"placement_note":"SFE specifically treats the sequence's apprenticeship, demon conjuration and elemental magic as magic practiced as a form of science; the systematic magical method governs more than the opening father-quest."}]},{"id":"scientific-adventure","label":"Scientific adventure","parent":"historical","children":[],"status":"provisional","definition":"Nineteenth-century speculative fiction built on a technological marvel and the fantastic voyage it enables (SFE headword SCIENTIFIC ROMANCE; Verne's prime-years novels are consanguineous with the form). New leaf created 2026-09-13 for Verne; hard science fiction is at the 10-work cap. Renamed from Scientific romance to Scientific adventure 2026-09-14 at Gustav's direction; SFE attests 'scientific romance' as the period term and the two are treated as interchangeable in grounding.","image":"70-scientific-adventure.webp","works":[{"title":"Twenty Thousand Leagues Under the Sea","cover_url":"https://covers.openlibrary.org/b/id/14891090-L.jpg","shows_english_title":true,"authors":["Jules Verne"],"year":1870},{"title":"The Island of Dr. Moreau","authors":["H. G. Wells"],"year":1896,"cover_url":"https://covers.openlibrary.org/b/id/2750879-L.jpg","shows_english_title":true}]},{"id":"ghost-story","label":"Ghost story","parent":"supernatural-and-dark-fiction","children":["haunted-house","lessons-beyond-the-grave","revenants","ghost-speakers"],"works":[],"image":"73-ghost-story.webp","status":"umbrella","definition":"Supernatural fiction in which a ghost or haunting is the central presence: the dead returning to a house, a place or a mind. Label attested by the Encyclopedia of Fantasy Ghost Stories entry. Split out of supernatural-fiction 2026-09-14 at Gustav's direction."},{"id":"revenants","label":"Revenants","parent":"ghost-story","children":[],"works":[{"title":"Neither the Sea nor the Sand","cover_url":"https://covers.openlibrary.org/b/isbn/0330027530-L.jpg","shows_english_title":true,"authors":["Gordon Honeycombe"],"year":1969,"placement_note":"Supernatural revenant love story: after Hugh drowns off Jersey, Anna's obsessive love calls him back reanimated but deteriorating. The actual return of the dead passes the speculative-event boundary; the dead returning to a lover is the central presence, so Ghost story (cf. Cold Heaven) is closest."},{"title":"Cold Heaven","cover_url":"https://images1.penguinrandomhouse.com/cover/9780452278677","shows_english_title":true,"authors":["Brian Moore"],"year":1983},{"title":"Melmoth","cover_url":"https://x.sf-encyclopedia.com/gal/clute/PerryS-Melmoth.jpg","shows_english_title":true,"authors":["Sarah Perry"],"year":2018,"placement_note":"HarperCollins and Perry center the centuries-wandering Melmoth the Witness, whose sightings haunt confessions and who approaches the guilty; the publisher explicitly frames its ambiguity through the tradition of ghost stories. The ghostly witness is the novel’s central presence."},{"title":"On Fragile Waves","cover_url":"https://covers.openlibrary.org/b/id/10832554-L.jpg","shows_english_title":true,"authors":["E. Lily Yu"],"year":2021,"placement_note":"SFE yu_e_lily: refugee family novel, 'some of the fantasy elements rendered literally'; Horton/Locus: Nasima drowns in the typhoon and returns as a ghost who haunts Firuzeh, sometimes hinting at the future. The dead returning to haunt -> ghost-story."},{"title":"Peace","cover_url":"https://covers.openlibrary.org/b/id/8791136-L.jpg","shows_english_title":true,"authors":["Gene Wolfe"],"year":1975,"placement_note":"Wikipedia/Publisher: psychological fantasy and mastercrafted ghost story - old Alden Dennis Weer relives and reshapes memories that haunt his house like a memory palace; the dead (possibly Weer himself) return into a mind and a place. EoF-attested ghost-story shelf. Shelfmates: Melmoth, Cold Heaven."},{"title":"Sisters","cover_url":"https://images3.penguinrandomhouse.com/cover/9780593188965","shows_english_title":true,"authors":["Daisy Johnson"],"year":2020,"placement_note":"July's dead sister remains through a supernatural bond of grief, guilt, memory and love; the relationship with the specific dead person makes Revenants exact."},{"title":"The City Beautiful","cover_url":"https://www.jewishbookcouncil.org/sites/default/files/styles/book/public/images/51O9OAC%2BrFL._SX328_BO1%2C204%2C203%2C200_.jpg","shows_english_title":true,"authors":["Aden Polydoros"],"year":2021,"placement_note":"Polydoros and the Jewish Book Council ground actual possession by the murdered friend Yakov's dybbuk, whose afterlife is driven by revenge and who remains bound to Alter until they expose the killer. The specific dead friend returning purposefully through grief, love and vengeance makes Revenants more exact than the historical-era frame."}],"definition":"Ghost stories in which a specific dead person returns or remains as a purposeful presence bound to the living through love, guilt, grief or memory. “Revenants” is a taxonomy coinage built on the established folklore term revenant for one who returns after death.","image":"234-revenants.webp","representative_cover":"https://covers.openlibrary.org/b/isbn/0330027530-L.jpg"},{"id":"haunted-house","label":"Haunted House","parent":"ghost-story","children":["classic-haunted-house","contemporary-haunted-house"],"image":"157-haunted-house.webp","definition":"Ghost stories where the haunting is anchored to a place: the building is the engine.","status":"umbrella","works":[]},{"id":"classic-haunted-house","label":"Classic haunted house","parent":"haunted-house","children":[],"works":[{"title":"The Haunting of Hill House","cover_url":"https://covers.openlibrary.org/b/id/14812399-L.jpg","shows_english_title":true,"authors":["Shirley Jackson"],"year":1959},{"title":"The Shining","cover_url":"https://covers.openlibrary.org/b/id/14817043-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1977,"books":[{"title":"The Shining","year":1977},{"title":"Doctor Sleep","year":2013}]},{"title":"The Green Man","cover_url":"https://covers.openlibrary.org/b/id/14555050-L.jpg","shows_english_title":true,"authors":["Kingsley Amis"],"year":1969},{"title":"The Turn of the Screw","cover_url":"https://covers.openlibrary.org/b/id/3065023-L.jpg","shows_english_title":true,"authors":["Henry James"],"year":1898},{"title":"The Castle of Otranto","cover_url":"https://images3.penguinrandomhouse.com/cover/9780140437676","shows_english_title":true,"authors":["Horace Walpole"],"year":1764,"placement_note":"PRH calls it the founding Gothic novel: supernatural omens, a dynastic curse and the return of Otranto’s lawful prince unfold inside the usurped castle. The place-bound family haunting and castle machinery govern, making Haunted House the deepest fit."}],"image":"268-classic-haunted-house.webp","definition":"Place-anchored haunted-house fiction from the Gothic origins through the late twentieth-century classics, ending with The Shining (1977).","status":"accepted"},{"id":"contemporary-haunted-house","label":"Contemporary haunted house","parent":"haunted-house","children":[],"works":[{"title":"A Room Away From the Wolves","cover_url":"https://covers.openlibrary.org/b/id/8567714-L.jpg","shows_english_title":true,"authors":["Nova Ren Suma"],"year":2018},{"title":"Bag of Bones","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781501198892/bag-of-bones-9781501198892_lg.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1998},{"title":"lost boy lost girl","cover_url":"https://images4.penguinrandomhouse.com/smedia/9780593975909","shows_english_title":true,"authors":["Peter Straub"],"year":2003,"placement_note":"Penguin Random House calls it a layered reworking of the haunted-house story: an abandoned house whispers with a hidden history and contains a ghostly lost girl who draws the missing boy into her domain. The place and its haunting drive the mystery, making Haunted House exact."},{"title":"Plain Bad Heroines","cover_url":"https://covers.openlibrary.org/b/id/10332578-L.jpg","shows_english_title":true,"authors":["Emily M. Danforth"],"year":2020,"placement_note":"Haunted house: 'two girls in love and a fog of wasps cursed the place forever after' - deaths at the Brookhants School for Girls from 1902 onward, with a present-day film shoot at the school spooked by the same curse; the haunting is anchored to the place and the building is the engine (Kirkus; Guardian calls it gothic horror). Shelfmates The Haunting of Hill House and The Shining."},{"title":"The Agony House","cover_url":"https://www.juniorlibraryguild.com/media/catalog/product/cache/2eab14bc73bbaab25cecc22b3f357ec3/A/g/Agony_20House_1_1.jpg","shows_english_title":true,"authors":["Cherie Priest"],"year":2018,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Haunted house. Scholastic calls it a haunted-house story with a killer ghost, and its cited reviews say the ramshackle New Orleans house is as much a character as the people, with the haunting and the building’s violent past driving the mystery. The place-anchored haunting therefore governs over a general ghost shelf."}],"image":"269-contemporary-haunted-house.webp","definition":"Place-anchored haunted-house fiction in the contemporary era, beginning with Bag of Bones (1998).","status":"accepted"},{"id":"lessons-beyond-the-grave","label":"Lessons beyond the grave","parent":"ghost-story","children":[],"works":[{"title":"A Christmas Carol","cover_url":"https://covers.openlibrary.org/b/id/13122277-L.jpg","shows_english_title":true,"authors":["Charles Dickens"],"year":1843},{"title":"Beloved","cover_url":"https://covers.openlibrary.org/b/isbn/9780394535975-L.jpg","shows_english_title":true,"authors":["Toni Morrison"],"year":1987},{"title":"The Graveyard Book","cover_url":"https://covers.openlibrary.org/b/id/7099583-L.jpg","shows_english_title":true,"authors":["Neil Gaiman"],"year":2008},{"title":"A Fine and Private Place","cover_url":"https://covers.openlibrary.org/b/id/294663-L.jpg","shows_english_title":true,"authors":["Peter S. Beagle"],"year":1960},{"title":"Cemetery Boys","cover_url":"https://covers.openlibrary.org/b/id/10860590-L.jpg","shows_english_title":true,"authors":["Aiden Thomas"],"year":2020,"books":[{"title":"Cemetery Boys","year":2020,"authors":["Aiden Thomas"],"cover_url":"https://covers.openlibrary.org/b/id/10860590-L.jpg"},{"title":"Cemetery Boys: Espíritu","year":2026,"authors":["Aiden Thomas"],"cover_url":"https://mpd-biblio-covers.imgix.net/9781250894939.jpg"}]},{"title":"The Blade Between","cover_url":"https://samjmiller.com/wp-content/uploads/2020/04/BladeBetween-hc-c-1060x1600.jpg","shows_english_title":true,"authors":["Sam J. Miller"],"year":2020,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Supernatural and dark -> Ghost story -> Lessons beyond the grave. Enraged whale/human ghosts drive a returning son to confront gentrification, buried violence and his bond to Hudson; no building anchors the haunting."},{"title":"The Gone Away Place","cover_url":"cover-gone-away-place.jpg","shows_english_title":true,"authors":["Christopher Barzak"],"year":2018,"placement_note":"PRH grounds a town-wide epidemic of ghosts after tornadoes kill half a school; Ellie and other survivors see the dead, and her chance encounter reveals how to free spirits lingering in grief. Sustained relationships across death and helping the dead move on govern."}],"image":"158-lessons-beyond-the-grave.webp","definition":"The dead remain in the story as company and carry a lesson, taught by them or taught to them; the relationship across death is the engine.","status":"accepted"},{"id":"invented-mythology","label":"Invented Mythology","parent":"epic-fantasy","children":[],"image":"82-invented-mythology.webp","definition":"Fantasy that builds its own mythology from scratch - invented gods, creation legends and deep-time chronicles of an imaginary world rather than retellings of real-world myth. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"The Silmarillion","cover_url":"https://covers.openlibrary.org/b/id/10721368-L.jpg","shows_english_title":true,"authors":["J. R. R. Tolkien"],"year":1977},{"title":"Honeycomb","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534433052/honeycomb-9781534433052_lg.jpg","shows_english_title":true,"authors":["Joanne M. Harris"],"year":2021,"placement_note":"The author describes a hundred linked story-cells following the magical Lacewing King through many worlds and peoples, while Simon & Schuster calls it a mosaic novel of original fairy tales. Its Silken Folk, rulers, worlds and recurring legends form an original mythology rather than retelling a received one."}]},{"id":"fantasy-of-manners","label":"Fantasy of manners","parent":"sword-and-sorcery","children":[],"works":[{"title":"Olondria","cover_url":"https://covers.openlibrary.org/b/isbn/9781931520775-L.jpg","shows_english_title":true,"authors":["Sofia Samatar"],"year":2013,"books":[{"title":"A Stranger in Olondria","year":2013,"cover_url":"https://covers.openlibrary.org/b/isbn/9781931520775-L.jpg"},{"title":"The Winged Histories","year":2016,"cover_url":"https://covers.openlibrary.org/b/isbn/9781618731371-L.jpg"}]},{"title":"Howl's Moving Castle","year":1986,"authors":["Diana Wynne Jones"],"cover_url":"https://covers.openlibrary.org/b/id/8783945-L.jpg","shows_english_title":true,"books":[{"title":"Howl's Moving Castle","year":1986,"authors":["Diana Wynne Jones"],"cover_url":"https://covers.openlibrary.org/b/id/8783945-L.jpg"},{"title":"Castle in the Air","year":1990},{"title":"House of Many Ways","year":2008}],"placement_note":"SFE identifies the three-book Howl sequence and its intricately interacting cast; the first book is a comic secondary-world fantasy driven by domestic bargains, vanity, courtship, and social wit, making Fantasy of manners the strongest existing fit."},{"title":"The Kingston Cycle","cover_url":"https://mpd-biblio-covers.imgix.net/9781250162687.jpg","shows_english_title":true,"authors":["C. L. Polk"],"year":2018,"books":[{"title":"Witchmark","year":2018,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250162687.jpg"},{"title":"Stormsong","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765398994.jpg"},{"title":"Soulstar","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250203571.jpg"}],"placement_note":"Walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Fantasy of manners. Aeland/Laneer are an original secondary world; class privilege, concealed magical status, family duty, marriage/courtship, reputation, institutions and social reform govern the trilogy more consistently than its mystery, battles or aether mechanism."}],"definition":"Secondary-world fantasy whose drama turns on wit, etiquette and intricate social codes - court intrigue and drawing-room stakes rather than battlefield heroics. Label attested by the Encyclopedia of Fantasy's Fantasy of Manners theme entry.","image":"86-fantasy-of-manners.webp"},{"id":"technofantasy","label":"Technofantasy","parent":"sword-and-sorcery","children":[],"definition":"Fantasy whose essentially magical nature wears the trappings of technology - haunted machinery, industrial magic, necromancy run like engineering - with no serious scientific justification. Term attested by the SFE Technofantasy theme entry (coined for The Encyclopedia of Fantasy). Gustav's rule 2026-09-14: the existence of actual magic divides the Fantasy side from the SF side.","works":[{"title":"A Voyage to Arcturus","cover_url":"https://covers.openlibrary.org/b/id/380212-L.jpg","shows_english_title":true,"authors":["David Lindsay"],"year":1920},{"title":"The Locked Tomb","cover_url":"https://covers.openlibrary.org/b/isbn/9781250313188-L.jpg","shows_english_title":true,"authors":["Tamsyn Muir"],"year":2019,"books":[{"title":"Gideon the Ninth","year":2019,"cover_url":"https://covers.openlibrary.org/b/isbn/9781250313188-L.jpg"},{"title":"Harrow the Ninth","year":2020,"cover_url":"https://covers.openlibrary.org/b/isbn/9781250313218-L.jpg"},{"title":"Nona the Ninth","year":2022,"cover_url":"https://covers.openlibrary.org/b/isbn/9781250854117-L.jpg"}]},{"title":"The Thousand Worlds","cover_url":"http://books.disney.com/content/uploads/2018/08/136801335X.jpg","shows_english_title":true,"authors":["Yoon Ha Lee"],"year":2019,"books":[{"title":"Dragon Pearl","year":2019,"cover_url":"http://books.disney.com/content/uploads/2018/08/136801335X.jpg"},{"title":"Tiger Honor","year":2022,"cover_url":"http://books.disney.com/content/uploads/2021/11/1368055540-3.jpg"},{"title":"Fox Snare","year":2023,"cover_url":"http://books.disney.com/content/uploads/2023/06/9781368081818.jpg"}],"placement_note":"SFE identifies the completed Thousand Worlds trilogy as YA space opera increasingly patterned by Korean mythology; Disney describes literal fox magic, shape-shifting, ghosts and spaceships powered by technological and spiritual energy. Under Gustav’s actual-magic dividing rule, its magical nature in SF trappings makes Technofantasy closest."},{"title":"Bluecrowne","cover_url":"https://target.scene7.com/is/image/Target/GUEST_6ba49ae6-d8fc-4db4-9818-0eb88820f387","shows_english_title":true,"authors":["Kate Milford"],"year":2014,"placement_note":"Walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Technofantasy. Kate Milford grounds invented Nagspeake and an action plot mixing literal magic with a pyrotechnical prodigy, artifacts, chemistry, science, time travel and nautical technology; the magic/science machinery blend governs."},{"title":"The Books of Babel","cover_url":"cover-senlin.jpg","shows_english_title":true,"authors":["Josiah Bancroft"],"year":2013,"books":[{"title":"Senlin Ascends","year":2013,"cover_url":"cover-senlin.jpg","shows_english_title":true},{"title":"Arm of the Sphinx","year":2018,"cover_url":"cover-arm-sphinx.jpg","shows_english_title":true},{"title":"The Hod King","year":2019,"cover_url":"cover-hod-king.jpg","shows_english_title":true},{"title":"The Fall of Babel","year":2021,"cover_url":"cover-fall-babel.jpg","shows_english_title":true}],"placement_note":"Walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Sword and sorcery -> Technofantasy. Orbit calls the complete four-book sequence fantasy and grounds an impossible invented Tower of stacked ringdoms, Sphinx-built machinery, airships and siege engines. The fantastical world plus its governing technological marvels make Technofantasy exact; The Hod King is book 3, consolidated into one complete-series card."}],"image":"90-technofantasy.webp"},{"id":"social-dystopia-modern","label":"Social dystopia","parent":"modern-day","children":[],"works":[{"title":"Lord of the Flies","cover_url":"https://covers.openlibrary.org/b/id/10470497-L.jpg","shows_english_title":true,"authors":["William Golding"],"year":1954},{"title":"The Power","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780670919963/9780670919963-jacket-large.jpg","shows_english_title":true,"authors":["Naomi Alderman"],"year":2016},{"title":"Naked Lunch","cover_url":"https://covers.openlibrary.org/b/id/10298340-L.jpg","shows_english_title":true,"authors":["William S. Burroughs"],"year":1959},{"title":"Atlas Shrugged","cover_url":"https://covers.openlibrary.org/b/isbn/9780525948926-L.jpg","shows_english_title":true,"authors":["Ayn Rand"],"year":1957},{"title":"High-Rise","year":1975,"authors":["J. G. Ballard"],"cover_url":"https://archive.org/download/highrise00ball/page/cover.jpg","shows_english_title":true,"placement_note":"SFE Ballard calls High-Rise a present-set urban disaster novel about the breakdown of social life in an apartment block, reflecting society's worst desires: a social dystopia in the recognizable present."},{"title":"Bug Jack Barron","cover_url":"https://covers.openlibrary.org/b/id/13852618-L.jpg","shows_english_title":true,"authors":["Norman Spinrad"],"year":1969,"placement_note":"SFE describes a near-future America as a politically corrupt, sex-obsessed media spectacle, viewed through television host Jack Barron's confrontation with industrial and political power, and says the result feels less like predictive SF than fabulation. Its engine is a recognizable society made sick by media and power rather than a separate future regime, matching Social dystopia's present-facing test."},{"title":"Cocaine Nights","cover_url":"https://images1.penguinrandomhouse.com/cover/9781582435701","shows_english_title":true,"authors":["J. G. Ballard"],"year":1996},{"title":"Super-Cannes","cover_url":"https://i.harperapps.com/hcanz/covers/9780006551607/x145.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":2000,"placement_note":"SFE places it among Ballard’s contemporary Mediterranean corporate enclaves; Harper grounds Eden-Olympia as a high-tech business park whose psychiatrist cultivates elite crime and brutality as therapy. Technology is setting, not technical plot engine; the designed pathology of a recognizable present-day closed society makes Social dystopia modern closest."}],"definition":"Dystopias of a sick society rather than a single police state, set in the recognizable present instead of an extrapolated future (the broader line of SFE 'Dystopias'). Split 2026-09-14 from social dystopian future on setting, not theme.","status":"provisional","image":"91-social-dystopia-modern.webp"},{"id":"fantastic-voyage","label":"Fantastic voyage","parent":"historical","children":[],"works":[{"title":"Gulliver's Travels","cover_url":"https://archive.org/download/gulliverstravels00jona_0/page/cover.jpg","shows_english_title":true,"authors":["Jonathan Swift"],"year":1726}],"definition":"Pre-novelistic speculative journeys to unknown lands and peoples - the Proto SF form named in SFE 'Fantastic Voyages', from Lucian's True History through Gulliver.","status":"provisional","image":"92-fantastic-voyage.webp"},{"id":"hard-sf","label":"Hard Sci-fi","parent":"futurist","children":["orbital-mechanics","planetary-science","matter-transmission","hard-conceptual-sf"],"works":[],"image":"15-hard-sf.webp","definition":"Science fiction whose central reading experience is rigorous scientific constraint, extrapolation, engineering or conceptual problem-solving.","status":"accepted"},{"id":"future-of-earth-fiction","label":"Future of Earth fiction","parent":"futurist","children":["dystopian-fiction","psionics","techno-fiction","future-war","future-history-of-earth","utopian-fiction"],"works":[],"image":"117-future-of-earth-fiction.webp","definition":"Science fiction fundamentally about possible futures of Earth, human society and Earth-descended life.","status":"accepted"},{"id":"spacefaring-fiction","label":"Spacefaring fiction","parent":"futurist","children":["classic-space-opera","military-science-fiction","new-space-opera","future-history-in-space","techno-fiction-in-space","generation-starships","space-dystopias","space-colonies"],"works":[],"image":"118-spacefaring-fiction.webp","definition":"Science fiction fundamentally about travel, settlement, conflict and civilization beyond Earth.","status":"accepted"},{"id":"space-colonies","label":"Space colonies","parent":"spacefaring-fiction","children":[],"works":[{"title":"Red Moon","cover_url":"https://covers.openlibrary.org/b/id/10292083-L.jpg","shows_english_title":true,"authors":["Kim Stanley Robinson"],"year":2018,"placement_note":"Root-down: a permanent, working lunar settlement passes Spacefaring fiction. SFE and Hachette center a colonized Moon under Chinese influence, while Kirkus calls the novel a political thriller in which the Moon is backdrop and game piece. Space colonies is exact because the established colony is the arena for murder, surveillance and revolution; the story is neither about founding the colony nor a dystopian nightmare-state."}],"image":"233-space-colonies.webp","definition":"Science fiction set in established off-Earth settlements whose civic life, institutions and politics form the story’s arena. This leaf is about colonies as lived places, not the process of colonization itself.","status":"accepted"},{"id":"space-dystopias","label":"Space dystopias","parent":"spacefaring-fiction","children":[],"works":[{"title":"Red Rising","cover_url":"https://covers.openlibrary.org/b/id/8407136-L.jpg","shows_english_title":true,"authors":["Pierce Brown"],"year":2014,"placement_note":"Root-down: Mars and the settled Solar System make Spacefaring the required branch; its caste order, forced labor, founding lie and governing spectacle make Space dystopias the existing exact leaf."},{"title":"A Time of Changes","cover_url":"https://store.gollancz.co.uk/cdn/shop/products/9781473229235-original.jpg?v=1757037150","shows_english_title":true,"authors":["Robert Silverberg"],"year":1971},{"title":"An Unkindness of Ghosts","cover_url":"https://www.akashicbooks.com/uploads/UnkindnessofGhosts-509x800.jpg","shows_english_title":true,"authors":["Rivers Solomon"],"year":2017}],"image":"153-space-dystopias.webp","definition":"Spacefaring human futures where the social order itself is the horror: closed, oppressive societies off Earth.","status":"accepted"},{"id":"alien-fiction","label":"Alien fiction","parent":"futurist","children":["anthropological-science-fiction","first-contact","hard-alien","alien-cosmic-history","alien-horror"],"works":[],"image":"119-alien-fiction.webp","definition":"Science fiction fundamentally about alien minds, species, cultures, contact and nonhuman civilization.","status":"accepted"},{"id":"otherworldly-fiction","label":"Otherworldly fiction","parent":"futurist","children":["otherworldly-hard-sf"],"works":[],"image":"120-otherworldly-fiction.webp","definition":"Science fiction set in an unanchored or fundamentally other cosmos where the world-model itself is central.","status":"accepted"},{"id":"dystopian-fiction","label":"Dystopian Futures","parent":"future-of-earth-fiction","children":["totalitarian-dystopia","social-dystopia","post-holocaust-survival","ruined-earth","dying-earth"],"works":[],"image":"10-dystopian-fiction.webp","definition":"Branch for designed, broken, surviving, renewed and terminal futures of Earth.","status":"accepted"},{"id":"totalitarian-dystopia","label":"Totalitarian dystopia","parent":"dystopian-fiction","children":["huxleyan-dystopia","orwellian-dystopia"],"image":"42-totalitarian-dystopia.webp","definition":"Umbrella for two classic modes of totalitarian dystopia: Huxleyan control through pleasure, conditioning, drugs and engineered bodies, and Orwellian control through surveillance, censorship, law and force.","status":"umbrella","works":[]},{"id":"huxleyan-dystopia","label":"Huxleyan dystopia","parent":"totalitarian-dystopia","children":[],"works":[{"title":"A Clockwork Orange","cover_url":"https://covers.openlibrary.org/b/id/14430517-L.jpg","shows_english_title":true,"authors":["Anthony Burgess"],"year":1962},{"title":"Brave New World","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780099518471/9780099518471-jacket-large.jpg","shows_english_title":true,"authors":["Aldous Huxley"],"year":1932},{"title":"Camp Concentration","cover_url":"https://covers.openlibrary.org/b/isbn/9780586028469-L.jpg","shows_english_title":true,"authors":["Thomas M. Disch"],"year":1968},{"title":"Dealing in Dreams","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781481472166/dealing-in-dreams-9781481472166_lg.jpg","shows_english_title":true,"authors":["Lilliam Rivera"],"year":2019,"placement_note":"Simon & Schuster and Publishers Weekly describe a dystopian Mega City governed through violent loyalty, guardian gangs, hierarchy, state-sponsored drugs and enforced gender rules; institutional coercion makes Totalitarian dystopia closest."}],"image":"161-huxleyan-dystopia.webp","definition":"Dystopias where power engineers consent and conformity through pleasure, conditioning, drugs, psychological manipulation or control of the body - the Huxleyan side of Neil Postman’s Huxley-versus-Orwell contrast.","status":"accepted"},{"id":"orwellian-dystopia","label":"Orwellian dystopia","parent":"totalitarian-dystopia","children":["classic-orwellian","orwellian-propaganda","orwellian-statesmanship","orwellian-assimilation","orwellianesque"],"works":[],"image":"162-orwellian-dystopia.webp","definition":"Umbrella for coercive dystopias descended from the 1984 formula and its extensions through media, law, identity and related state methods. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"classic-orwellian","label":"Classic Orwellian","parent":"orwellian-dystopia","children":[],"works":[{"title":"Nineteen Eighty-Four","cover_url":"https://covers.openlibrary.org/b/id/10740454-L.jpg","shows_english_title":true,"authors":["George Orwell"],"year":1949},{"title":"We","cover_url":"https://covers.openlibrary.org/b/isbn/9781554814107-L.jpg","shows_english_title":true,"authors":["Yevgeny Zamyatin"],"year":1924},{"title":"Tender Is the Flesh","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781982150921/tender-is-the-flesh-9781982150921.jpg","shows_english_title":true,"authors":["Agustina Bazterrica"],"year":2017,"placement_note":"Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Totalitarian dystopia -> Orwellian dystopia -> Classic Orwellian. The pandemic is only the official origin story; the governing engine is a normalized state system of human livestock, censorship, curfews, euphemistic controlled language and compulsory acceptance of the Transition. That direct coercion and truth control outrank Pandemic and the Social dystopia branches."}],"image":"184-classic-orwellian.webp","definition":"Dystopias that run the 1984 formula as written in the book - total surveillance, controlled language or history, regimented life and compulsory belief. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellian-propaganda","label":"Orwellian Propaganda","parent":"orwellian-dystopia","children":[],"works":[{"title":"Fahrenheit 451","cover_url":"https://covers.openlibrary.org/b/id/14411344-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1953},{"title":"The Hunger Games","cover_url":"https://covers.openlibrary.org/b/id/14819483-L.jpg","shows_english_title":true,"authors":["Suzanne Collins"],"year":2008,"books":[{"title":"The Hunger Games","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/14819483-L.jpg","shows_english_title":true},{"title":"Catching Fire","year":2009,"cover_url":"https://covers.openlibrary.org/b/id/15229610-L.jpg","shows_english_title":true},{"title":"Mockingjay","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/7460236-L.jpg","shows_english_title":true},{"title":"The Ballad of Songbirds and Snakes","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/13342995-L.jpg","shows_english_title":true},{"title":"Sunrise on the Reaping","year":2025,"cover_url":"https://covers.openlibrary.org/b/id/14847912-L.jpg","shows_english_title":true}]}],"image":"185-orwellian-propaganda.webp","definition":"Extensions of Orwell's media control through state distraction, censorship and governing spectacle. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellian-statesmanship","label":"Orwellian Statesmanship","parent":"orwellian-dystopia","children":[],"works":[{"title":"China Mountain Zhang","cover_url":"https://covers.openlibrary.org/b/id/8779578-L.jpg","shows_english_title":true,"authors":["Maureen F. McHugh"],"year":1992,"placement_note":"SFE and Tor place ordinary life in a regimented China-dominated twenty-second century where homosexuality is a capital offence; lived political and social coercion make Totalitarian dystopia the closest future leaf."},{"title":"Tropic of Kansas universe","cover_url":"https://covers.openlibrary.org/b/id/10237276-L.jpg","shows_english_title":true,"authors":["Christopher Brown"],"year":2017,"books":[{"title":"Tropic of Kansas","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/10237276-L.jpg"},{"title":"Rule of Capture","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10223899-L.jpg"},{"title":"Failed State","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10394133-L.jpg"}],"placement_note":"SFE treats the books as one near-future American sequence: authoritarian rule and resistance, secret trials of state enemies and extrajudicial murder, then national collapse and a tribunal attempting new law. The sequence's defining pressure is overt political coercion through law, police power and punishment, making Orwellian dystopia closest."}],"image":"186-orwellian-statesmanship.webp","definition":"Extensions of Orwell's bureaucratic and legal machinery through administration, ideological law, secret process and lawfare. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellian-assimilation","label":"Orwellian Assimilation","parent":"orwellian-dystopia","children":[],"works":[{"title":"Impostors","cover_url":"https://images.booksense.com/images/510/151/9781338151510.jpg","shows_english_title":true,"authors":["Scott Westerfeld"],"year":2018,"books":[{"title":"Impostors","year":2018,"cover_url":"https://images.booksense.com/images/510/151/9781338151510.jpg","shows_english_title":true},{"title":"Shatter City","year":2019,"cover_url":"https://images.booksense.com/images/421/150/9781338150421.jpg","shows_english_title":true},{"title":"Mirror's Edge","year":2021,"cover_url":"https://images.booksense.com/images/589/151/9781338151589.jpg","shows_english_title":true},{"title":"Youngbloods","year":2022,"cover_url":"https://img2.snapplify.com/86bea372e1f2ed87a8b0f2a3ccdd1d42/scholasticdistrib/9781338151572.jpg","shows_english_title":true}],"placement_note":"Westerfeld says this four-book continuation occurs after the Pretty Regime falls, in unstable cities where bad rulers, failed revolutions and imposed identities shape young lives. Power is overtly political and coercive, making Orwellian dystopia the closest existing leaf."},{"title":"Golden State","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316505406.jpg","shows_english_title":true,"authors":["Ben H. Winters"],"year":2019,"placement_note":"Hachette describes an alternate California where contradicting official truth is the greatest crime and a panopticon records, verifies and enforces reality. Surveillance, law and punishment maintain state power, making Orwellian dystopia exact."}],"image":"187-orwellian-assimilation.webp","definition":"Extensions of Orwell's state-remakes-the-person thread through manufactured identity and enforced conformity to certified truth. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"orwellianesque","label":"Orwellianesque","parent":"orwellian-dystopia","children":[],"works":[{"title":"Internment","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/06/9780316522700.jpg","shows_english_title":true,"authors":["Samira Ahmed"],"year":2019,"placement_note":"SFE and Little, Brown place Muslim Americans in near-future government internment camps, where Layla resists the Director and guards. State classification, incarceration and overt coercive force make Orwellian dystopia exact."},{"title":"A Song for a New Day","cover_url":"https://covers.openlibrary.org/b/id/8780333-L.jpg","shows_english_title":true,"authors":["Sarah Pinsker"],"year":2019},{"title":"On Wings of Song","authors":["Thomas M. Disch"],"year":1979,"cover_url":"https://covers.openlibrary.org/b/id/678888-L.jpg","shows_english_title":true}],"image":"188-orwellianesque.webp","definition":"Last-resort intake leaf for dystopias resembling Orwell's coercive methods but matching no sibling thread yet; it is meant to crystallize into a more specific pattern, not absorb convenient leftovers. Coercion, never pleasure or sedation - Huxleyan dystopia is the sibling shelf.","status":"accepted"},{"id":"social-dystopia","label":"Social dystopian future","parent":"dystopian-fiction","children":["crowded-dystopias","childless-dystopias","cli-fi-dystopia"],"image":"43-social-dystopia.webp","definition":"Dystopias of a sick society rather than a single police state - collapsing reproduction, media saturation, bioengineered economies (the broader line of SFE 'Dystopias'). Split 2026-09-13 from dystopian fiction to keep leaves under ten works. Set in an extrapolated future; renamed 2026-09-14 when the present-day line split off as Social dystopia under Modern day.","status":"umbrella","works":[]},{"id":"crowded-dystopias","label":"Crowded Dystopias","parent":"social-dystopia","children":[],"works":[{"title":"Stand on Zanzibar","cover_url":"https://covers.openlibrary.org/b/id/14193908-L.jpg","shows_english_title":true,"authors":["John Brunner"],"year":1968},{"title":"334","cover_url":"https://covers.openlibrary.org/b/id/228652-L.jpg","shows_english_title":true,"authors":["Thomas M. Disch"],"year":1972},{"title":"The Space Merchants","cover_url":"https://covers.openlibrary.org/b/id/12375902-L.jpg","shows_english_title":true,"authors":["Frederik Pohl","C. M. Kornbluth"],"year":1953,"books":[{"title":"The Space Merchants","year":1953,"authors":["Frederik Pohl","C. M. Kornbluth"],"cover_url":"https://covers.openlibrary.org/b/id/12375902-L.jpg"},{"title":"The Merchants' War","year":1984,"authors":["Frederik Pohl"]}],"placement_note":"SFE calls it a dark satire of a world dominated by ruthless advertising agencies, addictive consumer products and manipulation; its designed corporate-consumer social order is the central dystopia."},{"title":"Make Room! Make Room!","cover_url":"https://covers.openlibrary.org/b/id/7266013-L.jpg","shows_english_title":true,"authors":["Harry Harrison"],"year":1966,"placement_note":"Macmillan calls it classic dystopian SF about an overpopulated future: 35 million people in New York, mass hunger, scarce water and social breakdown; Open Road likewise centers population pressure and dwindling resources. Mass population breaking society makes Crowded Dystopias exact."}],"image":"154-crowded-dystopias.webp","definition":"Dystopian futures where too many people and the pressures of mass population break society.","status":"accepted"},{"id":"childless-dystopias","label":"Childless Dystopias","parent":"social-dystopia","children":[],"works":[{"title":"The Children of Men","cover_url":"https://pdjames.co.uk/wp-content/uploads/sites/38/2017/07/getimage-17.jpeg","shows_english_title":true,"authors":["P. D. James"],"year":1992},{"title":"The Handmaid's Tale","cover_url":"https://cdn2.penguin.com.au/covers/400/9781784871444.jpg","shows_english_title":true,"authors":["Margaret Atwood"],"year":1985,"books":[{"title":"The Handmaid's Tale","year":1985},{"title":"The Testaments","year":2019}]},{"title":"Atomized","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780099283362/9780099283362-jacket-large.jpg","shows_english_title":true,"authors":["Michel Houellebecq"],"year":1998},{"title":"Greybeard","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-greybeard-2-81.jpg","shows_english_title":true,"authors":["Brian W. Aldiss"],"year":1964,"placement_note":"SFE describes a future where biological-weapons fallout makes humanity sterile and nearly every survivor is elderly as the species approaches extinction. A world without a next generation makes Childless Dystopias exact."}],"image":"155-childless-dystopias.webp","definition":"Dystopian futures with no next generation: societies made barren or voluntarily childless.","status":"accepted"},{"id":"cli-fi-dystopia","label":"Cli-fi dystopia","parent":"social-dystopia","children":[],"works":[{"title":"The Windup Girl","cover_url":"https://cloud.start-publishing.com/public/content/module/public-website/files/2016/01/19/9781597805742_fc-1784.jpg","shows_english_title":true,"authors":["Paolo Bacigalupi"],"year":2009},{"title":"American War","cover_url":"https://images2.penguinrandomhouse.com/smedia/9781101973134","shows_english_title":true,"authors":["Omar El Akkad"],"year":2017},{"title":"Blackfish City","cover_url":"https://covers.openlibrary.org/b/id/8595548-L.jpg","shows_english_title":true,"authors":["Sam J. Miller"],"year":2018},{"title":"Bridge 108","cover_url":"https://images.leslibraires.ca/books/9781542006071/front/9781542006071_large.webp","shows_english_title":true,"authors":["Anne Charnock"],"year":2020},{"title":"Rise of the Red Hand","cover_url":"https://covers.openlibrary.org/b/id/10838422-L.jpg","shows_english_title":true,"authors":["Olivia Chadha"],"year":2021,"placement_note":"Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Social dystopian future -> Cli-fi dystopia. SFE says climate change has enabled a dystopian tyranny separating wealthy Uplanders from threatened slums; Erewhon centers a climate-controlled biodome, rising seas, unbreathable air and deadly superbugs. Orwellian and Techno Fiction siblings are rejected because algorithmic rule and cyborg tools serve the climate-stratified social collapse."}],"image":"156-cli-fi-dystopia.webp","definition":"Dystopian futures where climate change is the engine of social collapse and conflict.","status":"accepted"},{"id":"post-holocaust-survival","label":"Post-Holocaust Survival","parent":"dystopian-fiction","children":["post-pandemic-survival","post-nuclear-survival","terminal-wastelands"],"image":"115-post-holocaust-survival.webp","definition":"Pure umbrella for survival fiction set in the catastrophe’s living aftermath, partitioned by defining cause where named and by the governing wasteland condition where causes are mixed or unspecified.","status":"umbrella","works":[]},{"id":"post-pandemic-survival","label":"Post-pandemic survival","parent":"post-holocaust-survival","children":[],"image":"257-post-pandemic.webp","definition":"Post-Holocaust survival fiction whose living aftermath is caused by pandemic disease, following survivors as communities endure, adapt or rebuild.","status":"accepted","works":[{"title":"The Death of Grass","cover_url":"cover-the-death-of-grass.webp","shows_english_title":true,"authors":["John Christopher"],"year":1956,"placement_note":"SFE identifies a defining UK Disaster novel: a virus extinguishes grasses and food crops, collapsing civilization while Custance hardens through the grim business of survival in a post-Holocaust world. Penguin confirms the crop virus, mass starvation, social barbarism and the family's flight to sanctuary. The named pandemic cause governs."},{"title":"Earth Abides","cover_url":"https://covers.openlibrary.org/b/id/911121-L.jpg","shows_english_title":true,"authors":["George R. Stewart"],"year":1949},{"title":"I Am Legend","cover_url":"https://covers.openlibrary.org/b/id/6462252-L.jpg","shows_english_title":true,"authors":["Richard Matheson"],"year":1954},{"title":"Station Eleven","cover_url":"https://images.booksense.com/images/304/353/9780385353304.jpg","shows_english_title":true,"authors":["Emily St. John Mandel"],"year":2014}]},{"id":"post-nuclear-survival","label":"Post-nuclear survival","parent":"post-holocaust-survival","children":[],"image":"258-post-nuclear.webp","definition":"Post-Holocaust survival fiction whose living aftermath is caused by nuclear war, following survivors through fallout, social collapse and reconstruction.","status":"accepted","works":[{"title":"Alas, Babylon","cover_url":"https://covers.openlibrary.org/b/id/2540438-L.jpg","shows_english_title":true,"authors":["Pat Frank"],"year":1959,"placement_note":"SFE says full-scale nuclear war leaves Fort Repose surviving the first consequences, then follows the small town coping and modestly flourishing. The lived aftermath and community survival, rather than the strike itself, make Post-Holocaust Survival closest."},{"title":"Dr. Bloodmoney","cover_url":"https://covers.openlibrary.org/b/id/8422913-L.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1965,"placement_note":"SFE calls it a Post-Holocaust USA and Hachette sets it seven years after the bombs in a Point Reyes barter community. The survivors adapting and getting along in the lived aftermath make Post-Holocaust Survival closest."}]},{"id":"terminal-wastelands","label":"Terminal wastelands","parent":"post-holocaust-survival","children":[],"image":"259-terminal-wastelands.webp","definition":"Mixed-cause or unspecified collapses whose defining condition is traversing or enduring a devastated landscape, rather than one named catastrophic cause. Recovery may exist, but the wasteland remains the governing condition.","status":"accepted","works":[{"title":"Lost Everything","cover_url":"https://mpd-biblio-covers.imgix.net/9780765329127.jpg","shows_english_title":true,"authors":["Brian Francis Slattery"],"year":2012},{"title":"The Road","cover_url":"https://images.booksense.com/images/899/387/9780307387899.jpg","shows_english_title":true,"authors":["Cormac McCarthy"],"year":2006},{"title":"These Prisoning Hills","cover_url":"https://cdn.shopify.com/s/files/1/0674/5433/7265/files/9781250804488_p0.jpg?v=1765212425","shows_english_title":true,"authors":["Christopher Rowe"],"year":2022},{"title":"In the Country of Last Things","cover_url":"https://covers.openlibrary.org/b/id/9598402-L.jpg","shows_english_title":true,"authors":["Paul Auster"],"year":1987,"placement_note":"SFE identifies a near-future New York reduced to a nightmarishly entropic landscape, imprisoned by a vast Sea Wall Project; Penguin calls it dystopian and post-apocalyptic and follows Anna scavenging food and shelter in a devastated city. Immediate endurance inside the catastrophe’s living aftermath makes Post-Holocaust Survival closest."},{"title":"Shelter","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781781085042/shelter-9781781085042_lg.jpg","shows_english_title":true,"authors":["Dave Hutchinson"],"year":2018,"placement_note":"Almost a century after the Sisters, survivors scavenge ruined England while communities rebuild and contest who inherits the world; lived aftermath makes Post-Holocaust Survival exact."}]},{"id":"ruined-earth","label":"Ruined Earth","parent":"dystopian-fiction","children":[],"image":"116-ruined-earth.webp","definition":"Farther-future tales where civilization’s ruins have become the landscape, relics, myths, and foundations of successor societies.","status":"candidate","works":[{"title":"A Canticle for Leibowitz","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-9780575073579-14.jpg","shows_english_title":true,"authors":["Walter M. Miller Jr."],"year":1959},{"title":"Silo","cover_url":"https://images.thenile.io/r1000/9781804940822.jpg","shows_english_title":false,"authors":["Hugh Howey"],"year":2011,"books":[{"title":"Wool","year":2011},{"title":"Shift","year":2013},{"title":"Dust","year":2013}]},{"title":"Davy","cover_url":"https://covers.openlibrary.org/b/id/929120-L.jpg","shows_english_title":true,"authors":["Edgar Pangborn"],"year":1964},{"title":"Riddley Walker","cover_url":"https://covers.openlibrary.org/b/id/8435360-L.jpg","shows_english_title":true,"authors":["Russell Hoban"],"year":1980},{"title":"After London; or, Wild England","cover_url":"https://covers.openlibrary.org/b/id/10242194-L.jpg","shows_english_title":true,"authors":["Richard Jefferies"],"year":1885,"placement_note":"SFE calls this an early Scientific Romance and Ruined Earth tale: England has reverted to wilderness and barbarism after an unspecified disaster, with a great inland lake over polluted London. Hachette likewise calls it early post-apocalyptic fiction. The successor society living amid transformed ruins makes Ruined Earth closest."},{"title":"Heroes and Villains","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780141192383/9780141192383-jacket-large.jpg","shows_english_title":true,"authors":["Angela Carter"],"year":1969,"placement_note":"SFE calls this a recognizably SF displacement set in a ruined England divided between stratified city enclaves and Barbarians in mutated forests, and explicitly lists it in the Ruined Earth entry. The ruins and successor societies make Ruined Earth exact."},{"title":"Archivist Wasp Saga","cover_url":"https://indiepubs.com/cdn/shop/files/CoreSourceHub_ac1b97fe-7087-4e68-933e-b9f17d615e06.jpg?v=1771578741","shows_english_title":true,"authors":["Nicole Kornher-Stace"],"year":2015,"books":[{"title":"Archivist Wasp","year":2015,"cover_url":"https://indiepubs.com/cdn/shop/files/CoreSourceHub_ac1b97fe-7087-4e68-933e-b9f17d615e06.jpg?v=1771578741","shows_english_title":true},{"title":"Latchkey","year":2018,"cover_url":"https://mythicdelirium.com/wp-content/uploads/2018/03/Check_this_out.jpg","shows_english_title":true}],"placement_note":"SFE locates the Archivist Wasp Saga on a Ruined Earth in a recognizable medieval-futurist context; the author and publishers establish Latchkey as the second and final volume, set in the ruins of high-tech civilization with ghosts and relic weapons. The successor society built among deep-time ruins makes Ruined Earth closest."},{"title":"Seafire","cover_url":"https://images.penguinrandomhouse.com/cover/9780451478825","shows_english_title":true,"authors":["Natalie C. Parker"],"year":2018,"books":[{"title":"Seafire","year":2018,"cover_url":"https://images.penguinrandomhouse.com/cover/9780451478825"},{"title":"Steel Tide","year":2019,"cover_url":"https://images.penguinrandomhouse.com/cover/9780451478856"},{"title":"Stormbreak","year":2021,"cover_url":"https://images.penguinrandomhouse.com/cover/9780451478863"}],"placement_note":"Kirkus identifies a future in which only shreds of the old world’s technology remain; PRH follows a tyrant’s drug-dependent army and armored fleet across the Bullet Seas through a complete three-volume rebellion. With no grounded magic, this passes Science fiction -> Futurist -> Future of Earth -> Dystopian fiction; a successor maritime society built from lost technological remnants makes Ruined Earth closer than active-catastrophe survival."},{"title":"The Rampart Trilogy","cover_url":"https://www.hbgacademic.com/wp-content/uploads/2020/04/9780316477536.jpg","shows_english_title":true,"authors":["M. R. Carey"],"year":2020,"books":[{"title":"The Book of Koli","year":2020,"authors":["M. R. Carey"],"cover_url":"https://www.hbgacademic.com/wp-content/uploads/2020/04/9780316477536.jpg"},{"title":"The Trials of Koli","year":2020,"authors":["M. R. Carey"],"cover_url":"https://www.hbgacademic.com/wp-content/uploads/2024/01/9780316458665.jpg"},{"title":"The Fall of Koli","year":2021,"authors":["M. R. Carey"],"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/11/9780316458726.jpg"}]}]},{"id":"utopian-fiction","label":"Utopian fiction","parent":"future-of-earth-fiction","children":["satirical-utopia","secluded-utopias","hopepunk"],"works":[],"image":"27-utopian-fiction.webp","definition":"Fiction that constructs and tests an imagined society organized as a better, alternative, or deliberately ambiguous social order.","status":"accepted"},{"id":"satirical-utopia","label":"Satirical Utopia","parent":"utopian-fiction","children":[],"works":[{"title":"Erewhon","cover_url":"https://covers.openlibrary.org/b/id/8494792-L.jpg","shows_english_title":true,"authors":["Samuel Butler"],"year":1872,"books":[{"title":"Erewhon","year":1872,"authors":["Samuel Butler"]},{"title":"Erewhon Revisited","year":1901}]},{"title":"A Strange Manuscript Found in a Copper Cylinder","cover_url":"https://covers.openlibrary.org/b/id/5647709-L.jpg","shows_english_title":true,"authors":["James De Mille"],"year":1888},{"title":"Gargantua and Pantagruel","cover_url":"https://covers.openlibrary.org/b/id/11989067-L.jpg","shows_english_title":true,"authors":["François Rabelais"],"year":1532,"placement_note":"SFE treats the linked giant narratives as one immense, adventurous satire whose carnivalesque misrule exposes medieval hierarchy and makes a non-hierarchical utopia conceivable. Its imagined social inversions make Satirical Utopia the closest leaf."},{"title":"Giles Goat-Boy","cover_url":"https://images1.penguinrandomhouse.com/cover/9780385240864","shows_english_title":true,"authors":["John Barth"],"year":1966,"placement_note":"SFE calls it a literalized world-university and complex satire of education, human nature, knowledge and the Cold War; PRH describes authoritarian and open campuses threatened by a tyrannical computer. Its imagined institution satirizes contemporary systems, making Satirical Utopia closest."},{"title":"Looking Backward, From The Year 2000","cover_url":"https://covers.openlibrary.org/b/id/6999940-L.jpg","shows_english_title":true,"authors":["Mack Reynolds"],"year":1973,"placement_note":"SFE calls this a reprise of Bellamy’s classic utopian novel displaying Reynolds’s political and economic ideas about an energy-abundant society, with later books increasingly subverting and doubting its outcome. Its constructed ideal society is used to test contemporary socioeconomic assumptions, making Satirical Utopia closest."},{"id":"seven-days-in-new-crete","title":"Seven Days in New Crete","authors":["Robert Graves"],"year":1949,"cover":"https://covers.openlibrary.org/b/id/12690733-L.jpg","placement_note":"Root-down: Science fiction -> Futurist -> Future of Earth fiction -> Utopian fiction -> Satirical Utopia. SFE calls it a Utopian Scientific Romance in a post-World War Three future: the poet-magicians’ apparently ideal New Crete is deliberately destabilized to expose its sterile timelessness. Literal goddess and poet-magicians are real within the book, but its constructed future society and ambivalent utopian test are the organizing engine.","sources":["https://sf-encyclopedia.com/entry/graves_robert","https://sf-encyclopedia.com/entry/utopias"]},{"id":"the-dancers-at-the-end-of-time","title":"The Dancers at the End of Time","authors":["Michael Moorcock"],"year":1972,"cover_url":"cover-an-alien-heat.webp","shows_english_title":true,"books":[{"title":"An Alien Heat","year":1972,"cover_url":"cover-an-alien-heat.webp","shows_english_title":true},{"title":"The Hollow Lands","year":1974,"cover_url":"cover-the-hollow-lands.webp","shows_english_title":true},{"title":"The End of All Songs","year":1976,"cover_url":"cover-the-end-of-all-songs.webp","shows_english_title":true}],"placement_note":"SFE describes godlike far-future humans seeking diversion from limitless existence; Gollancz calls the decaying anything-is-possible society sharp fin-de-siècle satire. Its post-scarcity social design tests morality, love, boredom and decadence.","sources":["https://sf-encyclopedia.com/entry/moorcock_michael","https://sf-encyclopedia.com/entry/far_future","https://store.gollancz.co.uk/products/the-dancers-at-the-end-of-time"]}],"image":"130-satirical-utopia.webp","definition":"Utopian fiction that uses an apparently ideal society to satirize the customs, institutions and assumptions of its readers own world.","status":"accepted"},{"id":"secluded-utopias","label":"Secluded Utopias","parent":"utopian-fiction","children":[],"works":[{"title":"Islandia","cover_url":"https://covers.openlibrary.org/b/id/7890744-L.jpg","shows_english_title":true,"authors":["Austin Tappan Wright"],"year":1942,"placement_note":"SFE describes Islandia as a densely imagined utopian culture on a great island near Antarctica, separated from and scathingly critical of business-oriented modernity. Its social ideal depends on geographical and cultural separation from the wider world, making Secluded Utopias closest."},{"title":"Lost Horizon","cover_url":"https://covers.openlibrary.org/b/id/6532933-L.jpg","shows_english_title":true,"authors":["James Hilton"],"year":1 g/b/id/10252953-L.jpg","shows_english_title":true,"authors":["L. X. Beckett"],"year":2019,"books":[{"title":"Gamechanger","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10252953-L.jpg"},{"title":"Dealbreaker","year":2021,"cover_url":"http://www.lxbeckett.com/wp-content/uploads/2020/07/Dealbreaker-cover-663x1024.jpg"}],"placement_note":"SFE places the duology after humanity survives its climate gauntlet and begins restoring Earth; the author centers the Bounceback Generation and planetary recovery. A society organized around ecological repair makes Ecotopian the closest leaf."}],"image":"133-ecotopian.webp","definition":"Utopian fiction whose better society is founded on ecological balance, sustainable lifeways and a transformed relationship between people and the natural world.","status":"accepted"},{"id":"feminist-utopia","label":"Feminist Utopia","parent":"hopepunk","children":[],"works":[{"title":"Herland","year":1915,"authors":["Charlotte Perkins Gilman"],"cover_url":"https://archive.org/download/herland0000gilm/page/cover.jpg","shows_english_title":true,"placement_note":"SFE Gilman calls Herland a book-length feminist Utopia: an isolated parthenogenetic society of 2,000 years visited by three men."},{"title":"The Female Man","cover_url":"https://covers.openlibrary.org/b/id/448143-L.jpg","shows_english_title":true,"authors":["Joanna Russ"],"year":1975},{"title":"Woman on the Edge of Time","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9781529100570/9781529100570-jacket-large.jpg","shows_english_title":true,"authors":["Marge Piercy"],"year":1976}],"image":"134-feminist-utopia.webp","definition":"Utopian fiction that imagines social orders transformed by feminism, gender equality, womens autonomy or alternatives to patriarchal institutions.","status":"accepted"},{"id":"dying-earth","label":"Dying earth","parent":"dystopian-fiction","children":[],"image":"37-dying-earth.webp","definition":"Far-future tales under a moribund sun, where magic an r":2020,"cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756421076"},{"title":"The Scavenger Door","year":2021,"cover_url":"https://images2.penguinrandomhouse.com/smedia/9780756421083"},{"title":"Ghostdrift","year":2024,"cover_url":"https://images1.penguinrandomhouse.com/smedia/9780756419752"}],"placement_note":"SFE calls the four-book Finder Chronicles a lively, light-hearted Space Opera about an interstellar repo man; PRH describes action-packed capers spanning deep-space colonies, AI ships, aliens and heists. Its episodic pulp-adventure shape fits Classic space opera better than the political or alien-archaeology branches of New space opera."},{"title":"Radiance","cover_url":"https://covers.openlibrary.org/b/id/8577773-L.jpg","shows_english_title":true,"authors":["Catherynne M. Valente"],"year":2015,"placement_note":"SFE valente_catherynne_m: set in an Alternate Cosmos where the Solar System has been freely available since the mid-nineteenth century; baroque spoof with sharp satire of the film industry, decadent societies on Moon, Venus, Mars. A 2015 novel deliberately channeling pulp-era planetary romance - retro space opera."},{"title":"The Space Opera","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781481497503/space-opera-9781481497503_lg.jpg","shows_english_title":true,"authors":["Catherynne M. Valente"],"year":2018,"books":[{"title":"Space Opera","year":2018,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781481497503/space-opera-9781481497503_lg.jpg"},{"title":"Space Oddity","year":2024,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781668063019/space-oddity-9781668063019.jpg"}],"placement_note":"SFE calls this two-volume sequence an adroitly baroque space-opera spoof that transforms traditional SF forms: humanity faces a galactic-civilization judgment through the Metagalactic Grand Prix, followed by a victory tour and new First Contact competition. Its deliberate comic recasting of old galactic-council and contact tropes makes Retro space opera the closest leaf."}]},{"id":"evergreen-space-opera","label":"Evergreen space opera","parent":"classic-space-opera","children":[],"image":"171-evergreen-space-opera.webp","definition":"Space opera that escaped its era: perpetually current rather than dated, in publishing’s evergreen sense.","status":"candidate","works":[{"title":"Dune","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-dune-5-163.jpg","shows_english_title":true,"authors":["Frank Herbert"],"year":1965,"books":[{"title":"Dune","year":1965,"cover_url":"https://covers.openlibrary.org/b/isbn/0450042308-L.jpg"},{"title":"Dune Messiah","year":1969,"cover_url":"https://covers.openlibrary.org/b/isbn/9780441172696-L.jpg"},{"title":"Children of Dune","year":1976,"cover_url":"https://covers.openlibrary.org/b/isbn/9780425071793-L.jpg"},{"title":"God Emperor of Dune","year":1981,"cover_url":"https://covers.openlibrary.org/b/id/6711531-L.jpg"},{"title":"Heretics of Dune","year":1984,"cover_url":"https://covers.openlibrary.org/b/isbn/9780425076699-L.jpg"},{"title":"Chapterhouse: Dune","year":1985,"cover_url":"https://covers.openlibrary.org/b/isbn/0575035765-L.jpg"}]}]},{"id":"generation-starships","label":"Generation Starships","parent":"spacefaring-fiction","children":[],"works":[{"title":"Non-Stop","cover_url":"https://covers.openlibrary.org/b/id/6544849-L.jpg","shows_english_title":true,"authors":["Brian W. Aldiss"],"year":1958},{"title":"Escaping Exodus","cover_url":"https://covers.openlibrary.org/b/id/10325949-L.jpg","shows_english_title":true,"authors":["Nicky Drayden"],"year":2019,"books":[{"title":"Escaping Exodus","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10325949-L.jpg"},{"title":"Escaping Exodus: Symbiosis","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/12000734-L.jpg"}],"placement_note":"Harper describes a society living in the belly of a spacefaring beast whose civilization depends on maintaining that living vessel. The multigenerational enclosed society and survival of its mobile home make Generation starships the closest existing category, with the bioship as a biological variant."},{"title":"Record of a Spaceborn Few","cover_url":"https://covers.openlibrary.org/b/id/14653900-L.jpg","shows_english_title":true,"authors":["Becky Chambers"],"year":2018,"placement_note":"SFE says the novel centers on humanity's Exodus Fleet of Generation Starships, which left Earth before it became uninhabitable, and on how migration to friendly alien worlds threatens the fleet's integrity. This is a direct fit for Generation starships."},{"title":"Rite of Passage","cover_url":"https://covers.openlibrary.org/b/id/15053182-L.jpg","shows_english_title":true,"authors":["Alexei Panshin"],"year":1968,"placement_note":"Root-down: Science fiction -> Futurist -> Spacefaring fiction -> Generation Starships. SFE calls its World Ship venue a generation-starship rite-of-passage structure, while noting its FTL capability makes it an impure example. Other Spacefaring siblings fail because the closed ship society and heroine’s maturation within it are the engine."}],"image":"111-generation-starships.webp","definition":"Societies living aboard multigenerational spacecraft, often after the ship’s true nature or mission has been forgotten.","status":"candidate"},{"id":"anthropological-science-fiction","label":"Anthropological science fiction","parent":"alien-fiction","children":["earthborn","xenanthropology","xenolinguistics","xenocolonial"],"works":[],"image":"6-anthropological-science-fiction.webp","definition":"Umbrella for science fiction that uses cultural encounter to examine societies and the observer’s assumptions, partitioned by whether the estrangement is human or explicitly alien.","status":"accepted"},{"id":"earthborn","label":"Earthborn","parent":"anthropological-science-fiction","children":[],"image":"174-earthborn.webp","definition":"Anthropological science fiction where the society under the microscope is human or human-descended; the alien element is cultural estrangement. Gustav chose the name; Earthborn is attested SF vocabulary for originating on Earth.","status":"candidate","works":[{"title":"Ammonite","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-ammonite-2-143.jpg","shows_english_title":true,"authors":["Nicola Griffith"],"year":1993},{"title":"Hainish Cycle","cover_url":"https://covers.openlibrary.org/b/id/1926090-L.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":1966,"books":[{"title":"Rocannon's World","year":1966,"cover_url":"https://covers.openlibrary.org/b/id/1926090-L.jpg","shows_english_title":true},{"title":"Planet of Exile","year":1966,"cover_url":"https://static1.squarespace.com/static/5cad42ef90f904e520359371/t/61c182f24375676c474f4166/1640071922550/planet-of-exile-ace-paperback.jpg?format=1500w","shows_english_title":true},{"title":"City of Illusions","year":1967,"cover_url":"https://covers.openlibrary.org/b/id/1926091-L.jpg","shows_english_title":true},{"title":"The Left Hand of Darkness","year":1969,"cover_url":"https://covers.openlibrary.org/b/id/10618463-L.jpg","shows_english_title":true},{"title":"The Word for World Is Forest","year":1972,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765324641.jpg","shows_english_title":true},{"title":"The Dispossessed","year":1974,"cover_url":"https://covers.openlibrary.org/b/id/6979680-L.jpg","shows_english_title":true},{"title":"Four Ways to Forgiveness","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/43991-L.jpg","shows_english_title":true},{"title":"The Telling","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/283945-L.jpg","shows_english_title":true}]},{"title":"Citizen of the Galaxy","cover_url":"https://covers.openlibrary.org/b/isbn/9781416505525-L.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1957}]},{"id":"xenanthropology","label":"Xenanthropology","parent":"anthropological-science-fiction","children":[],"image":"175-xenanthropology.webp","definition":"Anthropological science fiction where alien societies are observed without interference; pure xenological fieldwork and the observer’s gaze.","status":"candidate","works":[{"title":"A Mirror for Observers","cover_url":"https://upload.wikimedia.org/wikipedia/en/0/0a/A_Mirror_for_Observers.jpg","shows_english_title":true,"authors":["Edgar Pangborn"],"year":1954},{"title":"Hard to Be a God","cover_url":"https://images.booksense.com/images/282/748/9781613748282.jpg","shows_english_title":true,"authors":["Arkady Strugatsky","Boris Strugatsky"],"year":1964,"placement_note":"The Strugatskys place an Earth historian undercover in Arkanar’s medieval human society, constrained to observe rather than intervene as oppression rises. Cultural observation, estrangement and the observer’s assumptions are the novel’s central problem, making Xenanthropology exact."},{"title":"Pallahaxi","cover_url":"https://files.ekmcdn.com/appleworld/images/hello-summer-goodbye-ebook-by-michael-coney-992-1-p.jpg?w=1000&h=1000&v=52BBA392-EBFA-4691-A32B-E8BDEFE12536","shows_english_title":true,"authors":["Michael G. Coney"],"year":1975,"books":[{"title":"Hello Summer, Goodbye","year":1975,"cover_url":"https://files.ekmcdn.com/appleworld/images/hello-summer-goodbye-ebook-by-michael-coney-992-1-p.jpg?w=1000&h=1000&v=52BBA392-EBFA-4691-A32B-E8BDEFE12536","shows_english_title":true},{"title":"I Remember Pallahaxi","year":2007,"cover_url":"http://lesedwards.com/cdn/shop/products/975693.jpg?v=1648061408"}],"placement_note":"SFE identifies these as the two Pallahaxi novels: adolescent members of a human-like species on a distant planet, followed by the arrival of human colonists. The alien society and ensuing cross-species encounter make Xenanthropology exact."},{"title":"Planet of the Apes","cover_url":"https://covers.openlibrary.org/b/id/8042215-L.jpg","shows_english_title":true,"authors":["Pierre Boulle"],"year":1963,"placement_note":"Xenanthropology with the observer's gaze inverted: astronaut Ulysse Merou is caged and studied by Soror's civilized apes while the reader observes the ape society through his eyes. SFE calls it a witty philosophical tale a la Voltaire whose satirical point is a reversal of the usual Apes-as-Human narrative (see also Devolution). Shelfmates A Mirror for Observers and Hard to Be a God. Original French 'La planete des singes' 1963; English translation 1963."}]},{"id":"first-contact","label":"First Contact","parent":"alien-fiction","children":["alien-expedition","far-future-first-contact","near-future-first-contact"],"works":[],"image":"14-first-contact-fiction.webp","definition":"Futurist alien fiction centered on humanity’s first consequential encounter with extraterrestrial intelligence, whether humans travel outward to meet it or the encounter unfolds during future expansion among the stars.","status":"accepted"},{"id":"near-future-first-contact","label":"Near-future first contact","parent":"first-contact","children":[],"works":[{"title":"Wormwood trilogy","cover_url":"https://covers.openlibrary.org/b/id/14330969-L.jpg","shows_english_title":true,"authors":["Tade Thompson"],"year":2016,"books":[{"title":"Rosewater","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/14330969-L.jpg"}],"placement_note":"Root-down: Science fiction -> Futurist -> Alien fiction -> First Contact -> Near-future first contact. SFE calls Wormwood a First Contact/Invasion sequence set several decades into the near future: an alien macrostructure erupts near Lagos, generates healing portals and a fungal techno-noosphere accessed by sensitives. Alien Expedition fails because humanity does not travel outward; Far-future first contact fails because this is near-future Earth."}],"definition":"First-contact stories set on near-future Earth, where alien presence transforms a recognizable human world before any far-future expansion among the

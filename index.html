e Award 2025 winner. Moved in from the hanging list by Gustav's 22:38 ruling."}]},{"id":"sentient-robots","label":"Sentient Robots","parent":"robots","children":[],"image":"326-sentient-robots.webp","definition":"Robots whose personhood is the engine: the book's claim is that the machine is someone - with an inner life, a will and a claim to be treated as a person, whatever it looks like.","status":"accepted","works":[{"title":"I, Robot","year":1950,"authors":["Isaac Asimov"],"cover_url":"https://covers.openlibrary.org/b/id/15106264-L.jpg","shows_english_title":true,"score":8.5,"placement_note":"Judgment call: SFE hard_sf entry does not cite Asimov; Three Laws extrapolation puzzles fit the hard-SF definition SFE quotes (Allen Steele). Robots and AI split 2026-09-23 (Gustav): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Machine minds -> Robots.","buy":[{"label":"Adlibris","url":"https://www.adlibris.com/se/sok?q=i+robot+asimov"},{"label":"Amazon","url":"https://www.amazon.com/s?k=i+robot+asimov"}],"versions":[{"cover_url":"https://covers.openlibrary.org/b/id/15106264-L.jpg","credit":"Signet, 1956"}]},{"title":"The Murderbot Diaries","cover_url":"https://mpd-biblio-covers.imgix.net/9780765397539.jpg","shows_english_title":true,"authors":["Martha Wells"],"year":2017,"books":[{"title":"All Systems Red","year":2017,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765397539.jpg","shows_english_title":true},{"title":"Artificial Condition","year":2018,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250186928.jpg","shows_english_title":true},{"title":"Rogue Protocol","year":2018,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250191786.jpg","shows_english_title":true},{"title":"Exit Strategy","year":2018,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250191854.jpg","shows_english_title":true},{"title":"Network Effect","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250229861.jpg","shows_english_title":true},{"title":"Fugitive Telemetry","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250765383.jpg","shows_english_title":true},{"title":"System Collapse","year":2023,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250826978.jpg","shows_english_title":true},{"title":"Platform Decay","year":2026,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250827005.jpg","shows_english_title":true}],"placement_note":"SFE identifies the series as centered on a humanoid Robot-cum-Cyborg SecUnit that hacks its governor module, develops independent agency and repeatedly protects humans. Macmillan likewise frames All Systems Red around an android discovering itself and consciousness through AI. Machine personhood is the sustained subject, making Robots and AI closest. Robots and AI split 2026-09-23 (Gustav): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Machine minds -> Robots."},{"title":"Service Model","cover_url":"https://covers.openlibrary.org/b/id/15098528-L.jpg","shows_english_title":true,"authors":["Adrian Tchaikovsky"],"year":2024,"placement_note":"An android valet wanders a post-apocalyptic world after murdering its master (PW; Book and Film Globe). Embodied machine at the center, so Robots."},{"title":"Neom","cover_url":"https://covers.openlibrary.org/b/id/13195357-L.jpg","shows_english_title":true,"authors":["Lavie Tidhar"],"year":2022,"placement_note":"Far-future desert city in the Central Station world; an old robot crosses the desert to find a lost love (PW, Fantasy Literature)."},{"title":"The Robots of Gotham","cover_url":"cover-the-robots-of-gotham.jpg","shows_english_title":true,"authors":["Todd McAulty"],"year":2018,"placement_note":"Load-bearing test (22:38 ruling): the machines are the story's persons - benevolent robot monarchs, tyrants and god-like minds with their own wills, and Barry Simcoe's plot turns on saving and serving the robot 19 Black Winter (The Verge, Black Gate). None is a humanoid replica, so Androids fails; machines-as-people carries it. Judgment call, vetoable."},{"title":"A Thousand Blues","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1529938023.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Cheon Seon-Ran"],"year":2025,"placement_note":"A decommissioned robot jockey given feeling, a worn-out racehorse, and the humans who aid them: machine consciousness and inter-species solidarity."}]},{"id":"ai","label":"AI","parent":"machine-minds","children":[],"works":[{"title":"Dual Memory","cover_url":"https://mpd-biblio-covers.imgix.net/9781250809131.jpg","shows_english_title":true,"authors":["Sue Burke"],"year":2023,"placement_note":"Robots and AI split 2026-09-23 (Gustav): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Machine minds -> AI."},{"title":"River of Gods","cover_url":"https://covers.openlibrary.org/b/id/474065-L.jpg","shows_english_title":true,"authors":["Ian McDonald"],"year":2004,"placement_note":"Robots and AI split 2026-09-23 (Gustav): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Machine minds -> AI."},{"title":"Michaelmas","cover_url":"https://book-assets.openroadmedia.com/9781497652989.jpg","shows_english_title":true,"authors":["Algis Budrys"],"year":1977,"placement_note":"SFE centers the immensely sophisticated AI Domino, its access to the entire world-net and autonomous participation in secret governance; Hachette describes Michaelmas and Domino as linked to Earth’s complete database and virtually ruling the world. The machine mind is central. Robots and AI split 2026-09-23 (Gustav): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Machine minds -> AI."},{"title":"The Outside","cover_url":"cover-the-outside.jpg","shows_english_title":true,"authors":["Ada Hoffmann"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno-fiction -> Robots and AI. Angry Robot centers super-intelligent AI Gods ruling humanity, policing technology and reality through posthuman agents, then coercing a scientist to hunt her mentor. Cosmic horror supplies the register, but machine minds and their domination of human science and society govern. Robots and AI split 2026-09-23 (Gustav): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Machine minds -> AI."},{"title":"Where the Axe Is Buried","cover_url":"https://covers.openlibrary.org/b/id/15238009-L.jpg","shows_english_title":true,"authors":["Ray Nayler"],"year":2025,"placement_note":"A near future split between a surveillance-state Federation and Western states run by AI 'Prime Ministers' (Kirkus, Locus). The distributed machine governors carry the book."},{"title":"Artificial Truth","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1662529589.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["J.M. Lee"],"year":2025,"placement_note":"A murdered man wakes as a disembodied consciousness inside a networked system and investigates his own death; a mind living in systems rather than a body."}],"image":"304-ai.webp","definition":"Disembodied or distributed machine intelligences: minds living in networks, databases and systems rather than a single body. Embodiment test: if the story centers a machine in a body, it is Robots; if it centers a disembodied or distributed intelligence, it is AI.","status":"accepted"},{"id":"rebel-fantasy","label":"Rebel fantasy","parent":"revolutionary-fantasy","children":[],"works":[{"title":"Tigana","cover_url":"https://covers.openlibrary.org/b/id/6821480-L.jpg","shows_english_title":true,"authors":["Guy Gavriel Kay"],"year":1990,"placement_note":"Penguin Random House describes a magically cursed homeland struggling against a despotic conqueror, with rebels seeking to overthrow him and restore its erased name. Tyranny, conquest and liberation drive the secondary-world fantasy. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Rebel fantasy."},{"title":"Phoenix Extravagant","cover_url":"https://covers.openlibrary.org/b/id/10169497-L.jpg","shows_english_title":true,"authors":["Yoon Ha Lee"],"year":2020,"placement_note":"Anti-colonial fantasy per core premise: an artist in occupied Hwaguk, colonized by the Razan empire and stripped of its magic pigments, is conscripted to paint for the occupier's automata and joins the resistance (Locus reviews by Di Filippo and Bourke; Reactor; Strange Horizons, 'set in an alternate version of Korea'). Shelfmates Tigana and The Books of Ambha. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Rebel fantasy."},{"title":"Shadow Players","cover_url":"https://covers.openlibrary.org/b/id/14921567-L.jpg","shows_english_title":true,"authors":["Heidi Heilig"],"year":2018,"books":[{"title":"For a Muse of Fire","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/14921567-L.jpg"},{"title":"A Kingdom for a Stage","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/9159572-L.jpg"},{"title":"On This Unworthy Scaffold","year":2021,"cover_url":"https://images.leslibraires.ca/books/9780062652003/front/9780062652003_large.webp"}],"placement_note":"HarperCollins frames the trilogy around forbidden necromancy, colonial occupation, rebellion, civil war, palace riots and the struggle to stop rulers who weaponize blood magic. The overthrow and remaking of oppressive rule make Revolutionary fantasy the closest leaf. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Rebel fantasy."},{"title":"The Unconquered Country","cover_url":"cover-the-unconquered-country.jpg","shows_english_title":true,"authors":["Geoff Ryman"],"year":1984,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy. SFE calls the setting a transfigured Cambodia and centers a young woman exploited by industrial womb-rental amid invasion; living houses and grown machinery make the colonized country fantastic, while occupation and survival govern. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Rebel fantasy."},{"title":"The Jasmine Throne","cover_url":"cover-the-jasmine-throne.jpg","shows_english_title":true,"authors":["Tasha Suri"],"year":2021,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy. Hachette/Orbit describes an India-inspired epic fantasy in which an imprisoned princess and a priestess with forbidden magic unite to change an empire; the Hirana was the conquered Ahiranyi source of magical deathless waters, and Priya’s hidden people resist imperial erasure. Empire, resistance and liberation organize the fantasy. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Rebel fantasy. Dual-viewpoint caveat: Malini is an imperial princess and her thread runs through the empire's court, but the main thread is Priya's and the Ahiranyi's open revolt, so it is placed on Rebel fantasy."},{"title":"The Nameless Republic trilogy","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316428941.jpg","shows_english_title":true,"authors":["Suyi Davies Okungbowa"],"year":2021,"books":[{"title":"Son of the Storm","year":2021,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316428941.jpg"},{"title":"Warrior of the Wind","year":2023,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316428958.jpg"},{"title":"Season of the Serpent","year":2026,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/05/9780316428996_34580b.jpg"}],"placement_note":"West-Africa-inspired epic fantasy driven by violent conquest, suppressed outlander histories, imperial collapse, and the resistant Nameless Republic confronting a conquering power. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Rebel fantasy."},{"title":"The Books of Ambha","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316449694.jpg","shows_english_title":true,"authors":["Tasha Suri"],"year":2018,"books":[{"title":"Empire of Sand","year":2018,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316449694.jpg"},{"title":"Realm of Ash","year":2019,"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/01/9780316449724.jpg"}],"placement_note":"Hachette describes an oppressed Amrithi heroine resisting imperial mystics in Empire of Sand, then a crumbling empire, looming succession war and a choice over whether the empire should be saved in Realm of Ash. Resistance to and remaking of imperial power drive the duology. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Rebel fantasy."},{"title":"City of Last Chances","cover_url":"https://covers.openlibrary.org/b/id/13509614-L.jpg","shows_english_title":true,"authors":["Adrian Tchaikovsky"],"year":2022,"placement_note":"The occupied city of Ilmar under the Palleseen empire's rule, with its factions pushed toward uprising (Locus, GeekDad). Open revolt against a foreign occupier, so Rebel fantasy. First of the Tyrant Philosophers books; later volumes pending."},{"title":"Blackheart Man","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1668005115.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Nalo Hopkinson"],"year":2024,"placement_note":"The formerly enslaved people of Chynchin resist reconquest by their returning colonizers with magic and open defiance."},{"title":"Blood for the Undying Throne","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250895367.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Sung-il Kim"],"year":2025,"placement_note":"An empire powered by sorcerers' corpses; subjugated peoples rise in open revolt to tear it down. 10th card; leaf freezes."}],"image":"305-rebel-fantasy.webp","definition":"Anti-colonial fantasy of open revolt: colonized peoples take up arms, magic and banners against the occupying empire. Resistance-mode test: if the colonized fight the empire in open revolt, it is Rebel fantasy; if the story's resistance works by subversion from within the imperial order (infiltration, conspiracy, turning), it is Insurgent fantasy.","status":"accepted"},{"id":"insurgent-fantasy","label":"Insurgent fantasy","parent":"revolutionary-fantasy","children":[],"works":[{"title":"The Masquerade","cover_url":"cover-the-traitor-baru-cormorant.jpg","shows_english_title":true,"authors":["Seth Dickinson"],"year":2015,"books":[{"title":"The Traitor Baru Cormorant","year":2015,"cover_url":"cover-the-traitor-baru-cormorant.jpg","shows_english_title":true},{"title":"The Monster Baru Cormorant","year":2018,"cover_url":"cover-the-monster-baru-cormorant.jpg","shows_english_title":true},{"title":"The Tyrant Baru Cormorant","year":2020,"cover_url":"cover-the-tyrant-baru-cormorant.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy. Gustav Söderström explicitly ruled The Monster Baru Cormorant into Anti-colonial fantasy on 2026-09-22: reader experience governs for this secondary-world geopolitical epic despite no confirmed actual magic. Tor centers colonized Baru infiltrating the Empire of Masks to destroy it, triggering war against the imperial order. Anti-colonial resistance governs the series. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Insurgent fantasy."},{"title":"Divine Cities","cover_url":"https://images1.penguinrandomhouse.com/cover/9780804137171","shows_english_title":true,"authors":["Robert Jackson Bennett"],"year":2014,"books":[{"title":"City of Stairs","year":2014,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780804137171"},{"title":"City of Blades","year":2016,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780553419719"},{"title":"City of Miracles","year":2017,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780553419733"}],"placement_note":"Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Insurgent fantasy."},{"title":"The Mermaid, the Witch, and the Sea","cover_url":"cover-the-mermaid-the-witch-and-the-sea.jpg","shows_english_title":true,"authors":["Maggie Tokuda-Hall"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy. Candlewick explicitly sets the magical maritime story in a world divided by colonialism: an Imperial daughter bound for a forced marriage in colonized islands encounters pirates, slavery, stolen memories and mermaid blood. Imperial domination, captivity and resistance govern. Anti-colonial fantasy split 2026-09-23 (Gustav): Speculative fiction -> Fantasy -> Fantasy Realms -> Epic fantasy -> Political fantasy -> Revolutionary fantasy -> Anti-colonial fantasy -> Insurgent fantasy. Dual-viewpoint caveat: Evelyn is an Imperial daughter and Flora sails with pirates; the story turns on both working against the empire from inside its own ships and marriages, so it is placed on Insurgent fantasy."},{"title":"To Shape a Dragon's Breath","cover_url":"https://covers.openlibrary.org/b/id/13200842-L.jpg","shows_english_title":true,"authors":["Moniquill Blackgoose"],"year":2023,"placement_note":"An alternate colonized New England: an Indigenous girl bonds a dragon and must train inside the colonizers' academy (Locus, Grimdark Magazine)."}],"image":"306-insurgent-fantasy.webp","definition":"Anti-colonial fantasy of subversion from within: agents, officials and insiders who work the imperial machine against itself through infiltration, conspiracy and turning. Resistance-mode test: if the colonized fight the empire in open revolt, it is Rebel fantasy; if the story's resistance works by subversion from within the imperial order (infiltration, conspiracy, turning), it is Insurgent fantasy.","status":"accepted"},{"id":"alt-prewar","label":"Alt Prewar","parent":"period-alterations","children":[],"works":[{"title":"The Plot Against America","cover_url":"cover-the-plot-against-america.jpg","shows_english_title":true,"authors":["Philip Roth"],"year":2004,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Historical -> Alternate history -> Period alterations -> Alt Prewar. Penguin centers a counterfactual 1940 election in which Lindbergh defeats Roosevelt and aligns the US with Hitler; the divergence runs 1940-1943 and history returns to course through ordinary events (no time travel, so not Atemporal) before Pearl Harbor. Gustav created Alt Prewar for it 2026-09-23 12:03."}],"image":"307-alt-prewar.webp","definition":"Alternate histories whose fork occurs in the run-up to the Second World War and whose changed world is depicted before the war reaches it.","status":"accepted"},{"id":"mythological-fantasy","label":"Mythological Fantasy","parent":"epic-fantasy","children":["invented-mythology","mythic-power-struggle"],"image":"334-mythological-fantasy.webp","definition":"Epic fantasy that works the mythological register itself: invented mythologies built from scratch, and mythic beings from real tradition carrying their own stories. Umbrella created by Gustav 2026-09-24.","status":"umbrella","works":[]},{"id":"mythic-power-struggle","label":"Mythic Power Struggle","parent":"mythological-fantasy","children":[],"works":[{"title":"The City in Glass","cover_url":"https://covers.openlibrary.org/b/isbn/9781250348272-L.jpg","shows_english_title":true,"authors":["Nghi Vo"],"year":2024,"placement_note":"The demon Vitrine loves and shapes her invented city Azril; angels raze it, she curses one angel and binds him to the ruins, and over three centuries the two enemies grieve and the city regrows (BookPage; Locus: Wolfe, Bourke). A demon and an angel from real tradition locked in a personal centuries-long struggle, the war itself offstage - the leaf's definition. Locus Award 2025 + Locus Rec Fantasy. First card of Mythic Power Struggle by Gustav's 2026-09-24 11:39 ruling ('Execute with Mythic power struggle')."}],"image":"333-mythic-power-struggle.webp","definition":"Mythic beings from real tradition - angels, demons, gods, spirits - locked in personal, long-running struggles; the war may be offstage, the story is the beings. Coined by Gustav 2026-09-24; not an SFE/EoF headword.","status":"provisional"},{"id":"scripted-books-in-books","label":"Scripted books in books","parent":"books-in-books","children":[],"works":[{"title":"The Anomaly","cover_url":"https://covers.openlibrary.org/b/id/12379951-L.jpg","shows_english_title":true,"authors":["Hervé Le Tellier"],"year":2020,"placement_note":"Air France 006 flies through a storm in March 2021 and lands twice, months apart, with identical passengers; governments debate the simulation hypothesis while each person meets their double, and a passenger-novelist's manuscript 'The anomaly' turns out to be the book being read, the text finally disintegrating on the last page (LRB/Lennon, Telegraph, sffworld, NYT). Reality revealed as authored text, written from inside - the leaf's definition. Clarke 2023 shortlist; Prix Goncourt 2020. Seed card of Scripted books in books by Gustav's 2026-09-24 15:51 ruling ('Ok execute')."}],"image":"335-scripted-books-in-books.webp","definition":"Books-in-books fiction where reality itself turns out to be authored - a world written, narrated or computed from inside, whose inhabitants discover their lives are someone else's text. Coined by Gustav 2026-09-24 (workshop: 'Ebooks in books' -> 'Scripted books in books'); not an SFE/EoF headword.","status":"provisional"},{"id":"modern-invented-myth","label":"Modern Invented Myth","parent":"contemporary-mythic-fantasy","children":[],"definition":"Contemporary fantasy in which an author's invented cosmology - beings, realms and rules with mythic weight - anchors the story; the mythology is original, not inherited.","status":"accepted","image":"343-modern-invented-myth.webp","works":[{"title":"The Book of Love","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0812986504.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Kelly Link"],"year":2024,"placement_note":"Three teenagers come back from the dead in a Massachusetts town, bound to a bargain between old powers still at work in ordinary life (NYT, Guardian: 'life after life'). Link's cosmology - Malo Mogge, Bogomil's death-realm, the bargain rules - is authored, not inherited. Seeded Modern invented myth via Gustav's 22:07 ruling."}]},{"id":"ozymandian-tech","label":"Ozymandian tech","parent":"science-fantasy","children":[],"definition":"Science fantasy whose fantasy surface is built on the buried remains of an ancient high-tech culture, whose surviving technology is worshipped, mistaken for magic, or rivals it - the colossal wreck of a mighty civilization, its Works still running.","status":"accepted","image":"344-ozymandian-tech.webp","works":[{"title":"A Song of Legends Lost","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781668086841/a-song-of-legends-lost-9781668086841_hr.jpg","shows_english_title":true,"authors":["M. H. Ayinde"],"year":2025,"placement_note":"Epic fantasy surface built on the buried remains of the Scathed, an ancient high-tech culture destroyed by its own creation; the ancestor-voices \"could be spirits or some of the Scathed's old technology\" (SFFWorld); reviewed as science fantasy (JamReads, Fantasy Book Critic). Seeded Ozymandian tech via Gustav's 11:21 ruling (was held #9). REVISIT on Invoker book 2: confirmed tech engine -> Hard science fantasy; confirmed real magic -> fantasy side."}]},{"id":"modern-chinese-myth","label":"Modern Chinese Myth","parent":"contemporary-mythic-fantasy","children":[],"definition":"Contemporary fantasy in which the figures and powers of Chinese myth - Chang'e, Houyi, the moon, celestial and ancestral legend - remain alive within ordinary present-day life.","status":"accepted","image":"345-modern-chinese-myth.webp","works":[{"title":"An Arrow to the Moon","cover_url":"https://covers.openlibrary.org/b/isbn/9780316464055-L.jpg","shows_english_title":true,"authors":["Emily X.R. Pan"],"year":2022,"placement_note":"\"Romeo and Juliet meets Chinese mythology\" (publisher): 1991 Montana, two teens across feuding families as the Chang'e and Houyi myth gathers - a named-figure Chinese myth playing out in the modern world (Kirkus). Seeded Modern Chinese Myth via Gustav's 12:47 ruling (was held #19)."}]},{"id":"social-dystopia-modern","label":"Social dystopia","parent":"modern-day","children":["classic-social-dystopias","ballardian-dystopias","bread-and-circus-dystopias","algorithmic-surveillance-dystopias","power-inversion-dystopias"],"works":[],"definition":"Dystopias of a sick society rather than a single police state, set in the recognizable present instead of an extrapolated future (the broader line of SFE 'Dystopias'). Split 2026-09-14 from social dystopian future on setting, not theme. Umbrella since 2026-09-25: five-way split into named leaves (Gustav's split-with-umbrella rule; the original stays as umbrella to relieve trunk pressure).","status":"provisional","image":"91-social-dystopia-modern.webp"},{"id":"classic-social-dystopias","label":"Classic social dystopias","parent":"social-dystopia-modern","children":[],"works":[{"title":"Lord of the Flies","cover_url":"https://covers.openlibrary.org/b/id/10470497-L.jpg","shows_english_title":true,"authors":["William Golding"],"year":1954},{"title":"Atlas Shrugged","cover_url":"https://covers.openlibrary.org/b/isbn/9780525948926-L.jpg","shows_english_title":true,"authors":["Ayn Rand"],"year":1957},{"title":"Naked Lunch","cover_url":"https://covers.openlibrary.org/b/id/10298340-L.jpg","shows_english_title":true,"authors":["William S. Burroughs"],"year":1959},{"title":"Bug Jack Barron","cover_url":"https://covers.openlibrary.org/b/id/13852618-L.jpg","shows_english_title":true,"authors":["Norman Spinrad"],"year":1969,"placement_note":"SFE describes a near-future America as a politically corrupt, sex-obsessed media spectacle, viewed through television host Jack Barron's confrontation with industrial and political power, and says the result feels less like predictive SF than fabulation. Its engine is a recognizable society made sick by media and power rather than a separate future regime, matching Social dystopia's present-facing test."}],"definition":"The founding mid-century canon of social dystopia: society-as-such fails in the recognizable present - an island, an economy, the junk economy, the airwaves - in the works that defined the mode. Split 2026-09-25 from social-dystopia-modern (Gustav ruling).","status":"accepted","image":"346-classic-social-dystopias.webp"},{"id":"ballardian-dystopias","label":"Ballardian dystopias","parent":"social-dystopia-modern","children":[],"works":[{"title":"High-Rise","year":1975,"authors":["J. G. Ballard"],"cover_url":"https://archive.org/download/highrise00ball/page/cover.jpg","shows_english_title":true,"placement_note":"SFE Ballard calls High-Rise a present-set urban disaster novel about the breakdown of social life in an apartment block, reflecting society's worst desires: a social dystopia in the recognizable present."},{"title":"Cocaine Nights","cover_url":"https://images1.penguinrandomhouse.com/cover/9781582435701","shows_english_title":true,"authors":["J. G. Ballard"],"year":1996},{"title":"Super-Cannes","cover_url":"https://i.harperapps.com/hcanz/covers/9780006551607/x145.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":2000,"placement_note":"SFE places it among Ballard’s contemporary Mediterranean corporate enclaves; Harper grounds Eden-Olympia as a high-tech business park whose psychiatrist cultivates elite crime and brutality as therapy. Technology is setting, not technical plot engine; the designed pathology of a recognizable present-day closed society makes Social dystopia modern closest."}],"definition":"Closed enclaves of the recognizable present - tower blocks, leisure resorts, business parks - whose designed order rots into tribal violence; named for J.G. Ballard's signature mode, the dictionary-attested eponym for dystopian modernity. Split 2026-09-25 from social-dystopia-modern (Gustav ruling).","status":"accepted","image":"347-ballardian-dystopias.webp"},{"id":"bread-and-circus-dystopias","label":"Bread & Circus dystopias","parent":"social-dystopia-modern","children":[],"works":[{"title":"Chain-Gang All-Stars","cover_url":"https://covers.openlibrary.org/b/id/13334374-L.jpg","shows_english_title":true,"authors":["Nana Kwame Adjei-Brenyah"],"year":2023,"placement_note":"Prisoners fight to the death for freedom in a televised American blood sport (Atlantic: 'Gladiator meets the American prison system'; Washington Post: satire). A sick present-day society, not a single police state."}],"definition":"Social dystopias of the recognizable present whose engine is spectacle as social control: state and media fuse punishment into mass entertainment. Split 2026-09-25 from social-dystopia-modern (Gustav ruling).","status":"accepted","image":"348-bread-and-circus-dystopias.webp"},{"id":"algorithmic-surveillance-dystopias","label":"Algorithmic surveillance dystopias","parent":"social-dystopia-modern","children":[],"works":[{"title":"The Dream Hotel","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1526687143.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Laila Lalami"],"year":2025,"placement_note":"A near-present America where an algorithm reads dreams and a woman is detained for what hers predict (NYT, AP)."}],"definition":"Social dystopias of the recognizable present whose engine is algorithmic surveillance: data systems read, score and detain citizens for what prediction says they will do. Split 2026-09-25 from social-dystopia-modern (Gustav ruling).","status":"accepted","image":"349-algorithmic-surveillance-dystopias.webp"},{"id":"power-inversion-dystopias","label":"Power inversion dystopias","parent":"social-dystopia-modern","children":[],"works":[{"title":"The Power","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780670919963/9780670919963-jacket-large.jpg","shows_english_title":true,"authors":["Naomi Alderman"],"year":2016}],"definition":"Social dystopias of the recognizable present in which one axis of the social power balance flips to totality: the formerly powerless dominate and the inverted hierarchy repeats the old one's oppression. Split 2026-09-25 from social-dystopia-modern (Gustav ruling).","status":"accepted","image":"350-power-inversion-dystopias.webp"}], by=Object.fromEntries(nodes.map(x=>[x.id,x]));let current='speculative-fiction',curFic=-1,curEd=-1,sx=0,sy=0;const app=document.querySelector('#app');

function renderFic(id,idx){current=id;curFic=idx;curBook=-1;curEd=-1;heroSeq++;document.querySelector('.panel').classList.remove('hero','revealed');let hs=document.getElementById('herospacer');if(hs)hs.remove();let n=by[id],w=n.works[idx];setBg(w.cover_url);title.textContent=w.title;crumb.textContent=path(n)+' › '+w.title;back.style.visibility='visible';let books=w.books&&w.books.length?w.books:[{title:w.title,authors:w.authors,year:w.year,cover_url:w.cover_url}];ficPreload.length=0;ficShelf=null;books.forEach(b=>{if(b.cover_url){['M','L'].forEach(t=>{let pi=new Image();pi.src=sz(b.cover_url,t);ficPreload.push(pi)})}});(w.editions||[]).forEach(e=>Object.values(e.covers||{}).forEach(c=>{if(c&&c.cover_url){let pi=new Image();pi.src=sz(c.cover_url,'M');ficPreload.push(pi)}}));count.textContent=`${books.length} book${books.length===1?'':'s'} in this fiction`;hint.textContent=books.length>1?'Series / shared universe · tap a book to open its page.':'Standalone fiction.';let eds=w.editions||[];let edHtml='';if(books.length>1&&eds.length)edHtml=`<div class="sec">Editions · tap to dress every book in one edition; tap again to reset</div><div class="strip">${eds.map((e,ei)=>{let first=books.find(b=>e.covers[slug(b.title)]);let rep=first?e.covers[slug(first.title)].cover_url:'';return `<button class="v" data-ed="${ei}"><img src="${sz(rep,'S')}" alt="${e.label}" loading="lazy" decoding="async" referrerpolicy="no-referrer"><small>${e.label}</small></button>`}).join('')}</div>`;content.innerHTML=(books.length>1?`<div class="bookgrid">${books.map((b,i)=>`<div class="bookcard" data-book="${i}">${b.cover_url?`<img src="${sz(b.cover_url,'M')}" alt="${b.title} cover" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:'<div class="work-placeholder">◇</div>'}<span class="bc-label"><b>${b.title}</b>${b.year?' ('+b.year+')':''}</span></div>`).join('')}</div>`:'')+edHtml;content.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>renderBook(id,idx,+b.dataset.book));content.querySelectorAll('[data-ed]').forEach(el=>el.onclick=()=>{let e=eds[+el.dataset.ed];let wasOn=el.classList.contains('on');content.querySelectorAll('[data-ed]').forEach(x=>x.classList.remove('on'));books.forEach((b,bi)=>{let card=content.querySelector(`[data-book="${bi}"]`);let img=card.querySelector('img');if(!img)return;let nc=sz(b.cover_url,'M'),dm=false;if(!wasOn){let cov=e.covers[slug(b.title)];if(cov)nc=sz(cov.cover_url,'M');else dm=true}if(img.getAttribute('src')!==nc){card.classList.remove('ld');img.src=nc;if(img.complete&&img.naturalWidth)card.classList.add('ld')}card.classList.toggle('dim',dm)});if(!wasOn)el.classList.add('on');curEd=wasOn?-1:+el.dataset.ed});fade(content);resetScroll(document.querySelector('.panel'));if(eds.length){let best=-1,bn=0;eds.forEach((e,ei)=>{let cc=Object.keys(e.covers).length;if(cc>bn){bn=cc;best=ei}});if(best>=0){let de=content.querySelector('[data-ed="'+best+'"]');if(de)de.click()}}dots.innerHTML='';history.replaceState(null,'','#'+id+'/'+slug(w.title))}
function renderBook(id,idx,bi){let fromGrid=curBook<0;current=id;curFic=idx;curBook=bi;heroSeq++;document.querySelector('.panel').classList.remove('hero','revealed');let hs=document.getElementById('herospacer');if(hs)hs.remove();let n=by[id],w=n.works[idx],books=w.books,b=books[bi];let eds=w.editions||[],ei=curEd;if(ei<0||!eds[ei]){let bn=0;ei=-1;eds.forEach((e,k)=>{let cc=Object.keys(e.covers).length;if(cc>bn){bn=cc;ei=k}})}let bslug=slug(b.title),hero=b.cover_url||w.cover_url;if(ei>=0&&eds[ei].covers[bslug])hero=eds[ei].covers[bslug].cover_url;setBg(hero);title.textContent=b.title;crumb.textContent=path(n)+' › '+w.title+' › '+b.title;back.style.visibility='visible';count.textContent=`Book ${bi+1} of ${books.length} · ${w.title}`;hint.textContent=(b.authors||w.authors||[]).join(', ')+(b.year?' · '+b.year:'');let vs=b.versions||[];let html='';if(b.blurb)html+=`<div class="blurb">${b.blurb} <a href="${b.blurb_source}" target="_blank" rel="noopener">Source</a></div>`;if(b.buy&&b.buy.length)html+=`<div class="buy">${b.buy.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${x.label}</a>`).join('')}</div>`;if(vs.length>1)html+=`<div class="sec">Cover versions · tap to preview</div><div class="strip">${vs.map((v,i)=>`<button class="v ${v.cover_url===hero?'on':''}" data-v="${i}"><img src="${sz(v.cover_url,'S')}" alt="cover version" loading="lazy" decoding="async" referrerpolicy="no-referrer"><small>${v.credit||''}</small></button>`).join('')}</div>`;if(fromGrid){ficShelf=document.createElement('div');while(content.firstChild)ficShelf.appendChild(content.firstChild)}content.innerHTML=html;content.querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>{let v=vs[+el.dataset.v];setBg(v.cover_url);content.querySelectorAll('.v').forEach(x=>x.classList.remove('on'));el.classList.add('on')});fade(content);resetScroll(document.querySelector('.panel'));dots.innerHTML='';history.replaceState(null,'','#'+id+'/'+slug(w.title)+'/'+slug(b.title))}
function shift(d){let n=by[current],s=n.parent?by[n.parent].children:[current],i=s.indexOf(current);if(s.length>1)render(s[(i+d+s.length)%s.length])}
back.onclick=()=>{if(curBook>=0){curBook=-1;heroSeq++;if(ficShelf){let n=by[current],w=n.works[curFic];setBg(w.cover_url);title.textContent=w.title;crumb.textContent=path(n)+' › '+w.title;let bks=w.books&&w.books.length?w.books:[w];count.textContent=bks.length+' book'+(bks.length===1?'':'s')+' in this fiction';hint.textContent=bks.length>1?'Series / shared universe · tap a book to open its page.':'Standalone fiction.';while(ficShelf.firstChild)content.appendChild(ficShelf.firstChild);ficShelf=null;resetScroll(document.querySelector('.panel'));dots.innerHTML='';history.replaceState(null,'','#'+current+'/'+slug(w.title))}else renderFic(current,curFic);return}if(curFic>=0){render(current);return}let n=by[current];if(n.parent)render(n.parent)};home.onclick=()=>render('speculative-fiction');app.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});app.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,sw=Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3;if(curBook>=0){if(sw){let w2=by[current].works[curFic],nb=curBook+(dx<0?1:-1);if(w2.books&&nb>=0&&nb<w2.books.length)renderBook(current,curFic,nb)}return}if(curFic>=0)return;if(sw)shift(dx<0?1:-1)},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowRight')shift(1);if(e.key==='ArrowLeft')shift(-1);if(e.key==='ArrowUp')back.click()});document.querySelector('.panel').addEventListener('scroll',function(){if(this.classList.contains('hero')&&this.scrollTop>30)this.classList.add('revealed')},{passive:true});const redirects={'unplaceable':'atemporal','space-opera':'spacefaring-fiction','upbeat-sci-fi':'future-of-earth-fiction','far-future-fiction':'future-of-earth-fiction','post-apocalyptic-fiction':'dystopian-fiction','cyberpunk':'cyberpunk','singularity-fiction':'techno-fiction','mathematics':'hard-conceptual-sf','quantum':'hard-conceptual-sf','galactic':'new-space-opera','transhuman':'new-space-opera','future-history':'f

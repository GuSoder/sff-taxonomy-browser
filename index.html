":"https://covers.openlibrary.org/b/id/7352861-L.jpg","shows_english_title":true},{"title":"Tracker","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/10651397-L.jpg","shows_english_title":true},{"title":"Visitor","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/10484921-L.jpg","shows_english_title":true},{"title":"Convergence","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8422796-L.jpg","shows_english_title":true},{"title":"Emergence","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/8804221-L.jpg","shows_english_title":true},{"title":"Resurgence","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/9248606-L.jpg","shows_english_title":true},{"title":"Divergence","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10239694-L.jpg","shows_english_title":true},{"title":"Defiance","year":2023,"cover_url":"https://images.penguinrandomhouse.com/cover/9780756415914","shows_english_title":true}],"placement_note":"SFE identifies the long Foreigner sequence as Planetary Romance focused on an alien civilization and says Emergence places Bren Cameron as adviser to its crown prince. PRH explicitly calls the series anthropological SF and centers diplomacy plus detailed human/atevi cultural interaction."},{"title":"Stranger in a Strange Land","cover_url":"https://covers.openlibrary.org/b/id/15243051-L.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1961}]},{"id":"xenocolonial","label":"Xenocolonial","parent":"anthropological-science-fiction","children":[],"image":"177-xenocolonial.webp","definition":"Anthropological science fiction where the alien encounter takes the form of colonization, occupation, or cultural erasure.","status":"candidate","works":[{"title":"The Martian Chronicles","cover_url":"https://covers.openlibrary.org/b/id/14828149-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1950},{"title":"Exo","cover_url":"https://www.fondalee.com/wp-content/uploads/2019/07/EXO_422x638.jpg","shows_english_title":true,"authors":["Fonda Lee"],"year":2017,"books":[{"title":"Exo","year":2017,"cover_url":"https://www.fondalee.com/wp-content/uploads/2019/07/EXO_422x638.jpg","shows_english_title":true},{"title":"Cross Fire","year":2018,"cover_url":"https://www.fondalee.com/wp-content/uploads/2017/09/CROSSFIRE_FNL2-723x1024.jpg","shows_english_title":true}]},{"title":"The Fifth Head of Cerberus","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2024/12/hbg-title-the-fifth-head-of-cerberus-158.jpg","shows_english_title":true,"authors":["Gene Wolfe"],"year":1972},{"title":"The City in the Middle of the Night","cover_url":"https://covers.openlibrary.org/b/isbn/9780765379962-L.jpg","shows_english_title":true,"authors":["Charlie Jane Anders"],"year":2019,"placement_note":"Macmillan and Anders set the novel on tidally locked January, where human colonists hunt and misread the native Gelet until Sophie's bond reveals an alien culture whose survival is tied to humanity's. Planetary climate structures the setting, but colonization and cultural violence govern the encounter, making Xenocolonial most specific."}]},{"id":"alien-horror","label":"Alien horror","parent":"alien-fiction","children":[],"image":"178-alien-horror.webp","definition":"Alien fiction whose primary engine is horror: dread, bodily violation, predation, and the terror of encountering nonhuman life.","status":"candidate","works":[{"title":"Under the Skin","cover_url":"https://covers.openlibrary.org/b/id/8260688-L.jpg","shows_english_title":true,"authors":["Michel Faber"],"year":2000,"placement_note":"SFE describes an alien hunter surgically altered to pass as human who abducts humans as livestock; Canongate foregrounds Isserley’s dangerous roadside encounters. The novel’s engine is the slow bodily dread of humans being processed as meat, making Alien horror closer than anthropological study."}]},{"id":"communal-magic-realism","label":"Communal magic realism","parent":"magic-realism","children":[],"works":[{"title":"One Hundred Years of Solitude","cover_url":"https://covers.openlibrary.org/b/id/10499988-L.jpg","shows_english_title":true,"authors":["Gabriel García Márquez"],"year":1967},{"title":"Midnight's Children","cover_url":"https://covers.openlibrary.org/b/id/14590546-L.jpg","shows_english_title":true,"authors":["Salman Rushdie"],"year":1981},{"title":"Green Town","cover_url":"https://covers.openlibrary.org/b/id/14831327-L.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1957,"books":[{"title":"Dandelion Wine","year":1957,"cover_url":"https://covers.openlibrary.org/b/id/14831327-L.jpg","shows_english_title":true},{"title":"Farewell Summer","year":2006,"cover_url":"https://covers.openlibrary.org/b/id/8291544-L.jpg","shows_english_title":true},{"title":"Summer Morning, Summer Night","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/9345445-L.jpg","shows_english_title":true}]},{"title":"The Famished Road","cover_url":"278-the-famished-road.jpg","shows_english_title":true,"authors":["Ben Okri"],"year":1991,"placement_note":"Okri, PRH and Booker ground Azaro as a Yoruba abiku spirit-child moving between spirit and living worlds in independence-era Nigeria, where family, neighborhood and political struggle accept spirits as part of shared reality. The community’s marvelous world governs."}],"status":"provisional","definition":"Magic realism in which the marvelous belongs to a community, town or nation’s shared memory.","image":"215-communal-magic-realism.webp"},{"id":"metamorphic-magic-realism","label":"Metamorphic magic realism","parent":"magic-realism","children":[],"works":[{"title":"Grimus","cover_url":"https://images.penguinrandomhouse.com/cover/9781784878924","shows_english_title":true,"authors":["Salman Rushdie"],"year":1975},{"title":"The Satanic Verses","cover_url":"https://covers.openlibrary.org/b/id/8312209-L.jpg","shows_english_title":true,"authors":["Salman Rushdie"],"year":1988,"placement_note":"SFE describes Rushdie novels as Fabulation and Magic Realism and says The Satanic Verses anatomizes religion in fantasy terms; its miraculous transformations inhabit recognizable modern reality as ordinary narrative fact."},{"title":"Lady into Fox","cover_url":"https://covers.openlibrary.org/b/id/9285590-L.jpg","shows_english_title":true,"authors":["David Garnett"],"year":1922,"placement_note":"SFE calls Lady into Fox a fantasy and an allegory of metamorphosis in which a demure wife is transformed inexorably into a vixen. Garnett presents the impossible change as an established, unexplained fact inside ordinary English domestic life, making Magic realism the closest existing leaf."},{"title":"Orlando","authors":["Virginia Woolf"],"year":1928,"cover_url":"https://covers.openlibrary.org/b/id/6980533-L.jpg","shows_english_title":true,"placement_note":"Orlando lives three centuries and changes from man to woman mid-life, an impossible bodily transformation accepted inside ordinary literary life - the metamorphic magic realism definition (shelfmates Lady into Fox, The Satanic Verses)."},{"title":"Pig Tales","cover_url":"https://covers.openlibrary.org/b/id/6874726-L.jpg","shows_english_title":true,"authors":["Marie Darrieussecq"],"year":1996,"placement_note":"Metamorphic magic realism: the narrator's gradual transformation into a sow unfolds as a Kafkaesque parable accepted inside ordinary contemporary life (Kirkus; publisher synopsis). Original French 'Truismes' 1996; English translation 1997. Shelfmates Lady into Fox and Orlando."},{"title":"The Astonishing Color of After","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2019/03/9780316464017.jpg","shows_english_title":true,"authors":["Emily X. R. Pan"],"year":2018,"placement_note":"Root-down: Fantasy -> Real Earth Universe -> Magic realism -> Metamorphic magic realism. Hachette grounds an ordinary contemporary grief/family story in which Leigh is certain her dead mother transformed into a bird; she follows the bird in Taiwan while chasing ghosts and family memory. The impossible bodily transformation accepted into lived reality governs."}],"status":"provisional","definition":"Magic realism centered on impossible bodily transformation accepted inside ordinary life.","image":"216-metamorphic-magic-realism.webp"},{"id":"sensory-magic-realism","label":"Sensory magic realism","parent":"magic-realism","children":[],"works":[{"title":"Perfume","cover_url":"https://covers.openlibrary.org/b/id/10910286-L.jpg","shows_english_title":true,"authors":["Patrick Süskind"],"year":1985},{"title":"Eartheater","cover_url":"https://covers.openlibrary.org/b/id/10405787-L.jpg","shows_english_title":true,"authors":["Dolores Reyes"],"year":2019,"placement_note":"SFE says the protagonist literally eats earth to gain knowledge of murdered women and explicitly applies Magic Realism on a non-metaphorical understanding. The marvelous power enters contemporary Argentine life as ordinary lived fact."},{"title":"The Book of Form and Emptiness","cover_url":"https://images4.penguinrandomhouse.com/smedia/9780399563669","shows_english_title":true,"authors":["Ruth Ozeki"],"year":2021}],"status":"provisional","definition":"Magic realism in which an impossible sense reveals knowledge hidden from ordinary perception.","image":"217-sensory-magic-realism.webp"},{"id":"ontological-magic-realism","label":"Ontological magic realism","parent":"magic-realism","children":[],"works":[{"title":"The Magus","cover_url":"https://covers.openlibrary.org/b/id/15156511-L.jpg","shows_english_title":true,"authors":["John Fowles"],"year":1965},{"title":"Kafka on the Shore","cover_url":"https://images1.penguinrandomhouse.com/cover/9781400079278","shows_english_title":true,"authors":["Haruki Murakami"],"year":2002,"placement_note":"SFE identifies its dovetailed trajectories; Penguin presents talking cats, fish falling from the sky, spirits leaving bodies and ageless wartime soldiers inside recognizable modern Japan. The marvelous arrives as ordinary narrative fact without a technological mechanism, making Magic realism closest."},{"title":"The Book of Hidden Things","cover_url":"https://images4.penguinrandomhouse.com/smedia/9781785657078","shows_english_title":true,"authors":["Francesco Dimitri"],"year":2018},{"title":"The Great Victorian Collection","cover_url":"cover-great-victorian-collection.jpg","shows_english_title":true,"authors":["Brian Moore"],"year":1975,"placement_note":"SFE describes a professor dreaming a collection of Victorian antiques into durable reality; Valancourt confirms the dream manifests physically in an ordinary California motel parking lot and then becomes impossible to contain or dismiss. Dream and waking reality become equally present and unstable, making Ontological magic realism exact."},{"title":"The Hole","cover_url":"cover-the-hole.jpg","shows_english_title":true,"authors":["Hiroko Oyamada"],"year":2014,"placement_note":"Walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Magic realism -> Ontological magic realism. New Directions/Granta ground ordinary rural Japan, family and domestic routine slipping into a creature-led fall through a personally shaped hole and increasingly bizarre experiences; reality, mirage and deadpan realism remain unresolved and equally present."}],"status":"provisional","definition":"Magic realism in which competing levels of reality become equally present and unstable.","image":"218-ontological-magic-realism.webp"},{"id":"occult-police-fiction","label":"Occult police","parent":"urban-fantasy","children":[],"works":[{"title":"Rivers of London","cover_url":"https://images3.penguinrandomhouse.com/cover/9780756411350","shows_english_title":true,"authors":["Ben Aaronovitch"],"year":2011,"books":[{"title":"Rivers of London","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/8472420-L.jpg"},{"title":"Moon Over Soho","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/13883591-L.jpg"},{"title":"Whispers Under Ground","year":2012,"cover_url":"https://covers.openlibrary.org/b/isbn/9780575097643-L.jpg"},{"title":"Broken Homes","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/8600681-L.jpg"},{"title":"Foxglove Summer","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/8472472-L.jpg"},{"title":"The Hanging Tree","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8472473-L.jpg"},{"title":"Lies Sleeping","year":2018,"cover_url":"https://images3.penguinrandomhouse.com/cover/9780756411350","shows_english_title":true}],"placement_note":"SFE describes the Peter Grant sequence as Urban Fantasy featuring a Metropolitan Police detective in police-procedural investigations complicated by magic and supernatural creatures. Aaronovitch describes Lies Sleeping as a Metropolitan Police joint operation led by Detective Constable and apprentice wizard Peter Grant. Contemporary formal police work investigating magical crimes makes Occult police exact."},{"title":"Magic for Liars","cover_url":"https://covers.openlibrary.org/b/id/10180749-L.jpg","shows_english_title":true,"authors":["Sarah Gailey"],"year":2019,"placement_note":"Gustav ruled 2026-09-22 that Fantasy must be traversed in user order: Real Earth vs invented world first. A contemporary real-Earth magical school murder investigation belongs on the Urban fantasy side; investigation of occult crime makes Occult police exact."},{"title":"Grave Reservations","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781982168902/grave-reservations-9781982168902_lg.jpg","shows_english_title":true,"authors":["Cherie Priest"],"year":2021,"placement_note":"Gustav ruled 2026-09-22 that Fantasy must be traversed in user order: Real Earth vs invented world first. A contemporary real-Earth psychic travel-agent investigation belongs on the Urban fantasy side; solving crime through paranormal evidence makes Occult police exact."}],"image":"219-occult-police-fiction.webp","definition":"Contemporary urban fantasy centered on police officers or formal law-enforcement units investigating crimes shaped by magic, supernatural beings or occult forces.","status":"accepted"},{"id":"fairy-tale-inversion","label":"Fairy-tale inversion","parent":"fairy-tale-revision","children":[],"works":[{"title":"Rump","cover_url":"https://images.penguinrandomhouse.com/cover/9780804168045","shows_english_title":false,"authors":["Liesl Shurtliff"],"year":2013,"books":[{"title":"Rump: The (Fairly) True Tale of Rumpelstiltskin","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/7303733-L.jpg","shows_english_title":true},{"title":"Jack: The True Story of Jack and the Beanstalk","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/12180453-L.jpg","shows_english_title":true},{"title":"Red: The True Story of Red Riding Hood","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8474633-L.jpg","shows_english_title":true},{"title":"Grump: The (Fairly) True Tale of Snow White and the Seven Dwarves","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/8807575-L.jpg","shows_english_title":true}]},{"title":"We Kept Her in the Cellar","cover_url":"https://images.penguinrandomhouse.com/cover/9781639109142","shows_english_title":true,"authors":["W. R. Gorman"],"year":2024},{"title":"The Bloody Chamber and Other Stories","cover_url":"https://angelacarteronline.com/wp-content/uploads/2016/11/cover-small.jpg","shows_english_title":true,"authors":["Angela Carter"],"year":1979},{"title":"Damsel","cover_url":"https://covers.openlibrary.org/b/id/12850837-L.jpg","shows_english_title":true,"authors":["Elana K. Arnold"],"year":2018}],"image":"225-fairy-tale-inversion.webp","definition":"Fiction that reverses a familiar fairy tale’s perspective, moral alignment, power structure, or expected meaning.","status":"accepted","taxonomy_note":"Provisional descriptive coinage for revision mode; no single established critical term cleanly covers this group."},{"id":"fairy-tale-transplant","label":"Fairy-tale transplant","parent":"fairy-tale-revision","children":[],"works":[{"title":"Mapping the Bones","cover_url":"https://images1.penguinrandomhouse.com/smedia/9780399546679","shows_english_title":true,"authors":["Jane Yolen"],"year":2018,"placement_note":"Yolen describes the Holocaust novel as hung on the armature of Hansel and Gretel, mapping starvation, forest abandonment, the candy house, witch and oven into Chaim and Gittel’s story; Penguin Random House likewise calls it a Nazi labor-camp Hansel & Gretel tale. It deliberately rewrites a recognizable fairy tale through historical atrocity, making Fairy-tale revision exact."},{"title":"Dark and Deepest Red","cover_url":"https://images1.penguinrandomhouse.com/cover/9781250162748","shows_english_title":true,"authors":["Anna-Marie McLemore"],"year":2020},{"title":"Gingerbread","cover_url":"https://covers.openlibrary.org/b/id/8792936-L.jpg","shows_english_title":true,"authors":["Helen Oyeyemi"],"year":2019,"placement_note":"SFE says Hansel-and-Gretel motifs circulate through the novel; the Guardian describes its fabulous everyday elements, unmappable Druhástrana, family gingerbread and a lost Gretel friendship. The contemporary mother-daughter tale rewrites a recognizable fairy-tale complex."},{"title":"Red Hood","cover_url":"https://elanakarnold.com/wp-content/uploads/2019/06/RedHood_Cover-684x1024.jpg","shows_english_title":true,"authors":["Elana K. Arnold"],"year":2020,"placement_note":"Arnold’s Little Red Riding Hood revision moves the tale to modern Seattle, where inherited female power and predatory wolves recast its danger in a contemporary setting."},{"title":"Summer in the City of Roses","cover_url":"https://sohopress.com/wp-content/uploads/2021/03/Summer-in-the-City-of-Roses-low-res.jpg","shows_english_title":true,"authors":["Michelle Ruiz Keil"],"year":2021,"placement_note":"Soho and PRH explicitly call this early-1990s Portland novel inspired by Grimm’s “Brother and Sister” and the Greek Iphigenia/Orestes complex; sibling separation, the brother’s fantastical transformation and reunion transpose that named fairy-tale armature into Portland punk life. The explicit relocated Grimm narrative makes Fairy-tale transplant closer than general Magic realism or Greek myth fantasy."}],"image":"226-fairy-tale-transplant.webp","definition":"Fiction that relocates a familiar fairy tale into a different historical period, culture, or contemporary setting.","status":"accepted","taxonomy_note":"Provisional descriptive coinage for revision mode; no single established critical term cleanly covers this group."},{"id":"fairy-tale-expansion","label":"Fairy-tale expansion","parent":"fairy-tale-revision","children":[],"works":[{"title":"Uprooted","cover_url":"https://images.penguinrandomhouse.com/cover/9780804179058","shows_english_title":true,"authors":["Naomi Novik"],"year":2015},{"title":"Spinning Silver","cover_url":"http://grimoakpress.com/cdn/shop/products/novik-spinningsilver.jpg?v=1613603659","shows_english_title":true,"authors":["Naomi Novik"],"year":2018},{"title":"Blanca & Roja","cover_url":"https://covers.openlibrary.org/b/id/10118728-L.jpg","shows_english_title":true,"authors":["Anna-Marie McLemore"],"year":2018}],"image":"227-fairy-tale-expansion.webp","definition":"Fiction that uses a familiar fairy tale as the seed for a larger original world, mythology, or interwoven narrative.","status":"accepted","taxonomy_note":"Provisional descriptive coinage for revision mode; no single established critical term cleanly covers this group."},{"id":"weird-west-fantasy","label":"Weird West fantasy","parent":"industrial-age-fantasy","children":[],"works":[{"title":"Red Waters Rising","cover_url":"https://www.publishersweekly.com/cover/9781481429757","shows_english_title":true,"authors":["Laura Anne Gilman"],"year":2018,"placement_note":"An alternate nineteenth-century North America whose western Territory is literally magical and ruled by the Devil, combining frontier-Western structures with ghosts, magicians and animal spirits."},{"title":"The Hunger","cover_url":"cover-the-hunger.jpg","shows_english_title":true,"authors":["Alma Katsu"],"year":2018,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Weird West fantasy. Penguin grounds a supernatural reimagining of the 1846 Donner Party wagon train, where a hungry force stalks pioneers on the North American frontier; the nineteenth-century Western journey and monster intrusion make Weird West exact."}],"image":"228-weird-west-fantasy.webp","definition":"Fantasy that remakes the nineteenth-century North American frontier through magic, ghosts, monsters and alternate history, in the attested Weird West tradition.","status":"accepted"},{"id":"ghost-speakers","label":"Ghost Speakers","parent":"ghost-story","children":[],"works":[{"id":"riddance","title":"Riddance","authors":["Shelley Jackson"],"year":2018,"cover":"https://s37710.pcdn.co/wp-content/uploads/sites/3/2021/08/9781936787999.jpg","placement_note":"Root-down: Fantasy -> Real Earth Universe -> Supernatural and dark fiction -> Ghost story -> Ghost Speakers. Catapult centers the 1890 Sybil Joines Vocational School for Ghost Speakers, where children whose stutters channel ghost voices are trained; the headmistress visits the land of the dead. Communication through living mediums is the engine, not a haunted place, lesson-giving dead companion or purposeful revenant.","sources":["https://books.catapult.co/books/riddance/","https://www.penguinrandomhouse.com/books/673534/riddance-by-shelley-jackson/"]}],"image":"237-ghost-speakers.webp","status":"leaf","label_status":"source-coinage","label_note":"Riddance's own term, from the Sybil Joines Vocational School for Ghost Speakers.","definition":"Ghost stories centered on living mediums whose defining gift is to speak with, through or for the dead."},{"id":"mad-science-gothic","label":"Mad-science Gothic","parent":"gothic-science-fiction","children":[],"works":[{"title":"Frankenstein; or, The Modern Prometheus","cover_url":"https://covers.openlibrary.org/b/isbn/9780143131847-L.jpg","shows_english_title":true,"authors":["Mary Shelley"],"year":1818},{"title":"Strange Case of Dr Jekyll and Mr Hyde","cover_url":"https://covers.openlibrary.org/b/id/10767433-L.jpg","shows_english_title":true,"authors":["Robert Louis Stevenson"],"year":1886},{"title":"The Invisible Man","cover_url":"https://covers.openlibrary.org/b/id/6419199-L.jpg","shows_english_title":true,"authors":["H. G. Wells"],"year":1897},{"title":"Mem","cover_url":"http://static1.squarespace.com/static/669172a9220c0d23ff8b86f1/66955d83710d5f2ad9dea154/66d78e1f0169ae647d23a02b/1787910930032/MEM.jpg?format=1500w","shows_english_title":true,"authors":["Bethany C. Morrow"],"year":2018,"placement_note":"Unnamed Press and Publishers Weekly center a 1920s scientist’s procedure that extracts memories into corporeal mirror-images kept in a Vault, and the one extract who becomes an autonomous person. Promethean creation, doubles, memory, personhood and terror outweigh mechanism, making Gothic science fiction exact."}],"image":"238-mad-science-gothic.webp","status":"leaf","definition":"Gothic science fiction in which forbidden experiment, Promethean creation, bodily transformation or manufactured doubles unleash terror."},{"id":"cosmic-gothic","label":"Cosmic Gothic","parent":"gothic-science-fiction","children":[],"works":[{"title":"At the Mountains of Madness","cover_url":"https://covers.openlibrary.org/b/id/8565081-L.jpg","shows_english_title":true,"authors":["H. P. Lovecraft"],"year":1936},{"title":"The House on the Borderland","authors":["William Hope Hodgson"],"year":1908,"cover_url":"https://covers.openlibrary.org/b/id/7317588-L.jpg","shows_english_title":true}],"image":"239-cosmic-gothic.webp","status":"leaf","definition":"Gothic science fiction in which sublime terror comes from impossible worlds, cosmic immensities and realities beyond human comprehension."},{"id":"elder-gods","label":"Elder gods","parent":"ancient-tormentors","children":[],"works":[{"title":"Beneath the Rising","cover_url":"https://covers.openlibrary.org/b/id/10208841-L.jpg","shows_english_title":true,"authors":["Premee Mohamed"],"year":2020,"books":[{"title":"Beneath the Rising","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10208841-L.jpg"},{"title":"A Broken Darkness","year":2021,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781781088753/a-broken-darkness-9781781088753.jpg"},{"title":"The Void Ascendant","year":2021,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781786185204/the-void-ascendant-9781786185204.jpg"}]},{"title":"Providence","cover_url":"https://covers.openlibrary.org/b/id/14847576-L.jpg","shows_english_title":true,"authors":["Caroline Kepnes"],"year":2018,"placement_note":"Supernatural thriller: Jon Bronson returns from a four-year abduction with an involuntary lethal power and a Lovecraftian explanation he pursues (PW, Kirkus) - an ancient intruding entity tormenting a human life. Shelfmates It, The Case of Charles Dexter Ward."},{"title":"Revelator","cover_url":"https://images1.penguinrandomhouse.com/cover/9781984898487","shows_english_title":true,"authors":["Daryl Gregory"],"year":2021,"placement_note":"Root-down: actual supernatural power in recognizable 1930s Tennessee passes Fantasy -> Real Earth Universe -> Supernatural dark -> Supernatural; the family’s ancient cavern god, its secret religion and generational torment make Ancient Tormentors the deepest existing leaf."},{"title":"The Citadel of Fear","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781804171714/the-citadel-of-fear-9781804171714.jpg","shows_english_title":true,"authors":["Francis Stevens"],"year":1918,"placement_note":"Root-down: actual gods and dark magic make this Fantasy under Gustav’s 2026-09-19 magic/SF dividing rule; its recognizable Mexico/US setting passes Real Earth Universe. Flame Tree grounds a hidden Aztec city, disturbed ancient gods, nightmare creatures and dark magic unleashed into the modern world. The ancient worshipped being intrudes into human lives and drives supernatural horror, matching Elder gods rather than the SF Lost world branch."}],"image":"241-elder-gods.webp","status":"leaf","definition":"Supernatural horror driven by ancient beings worshipped as gods, whose awakening or intrusion exposes humanity to powers older than civilization."},{"id":"satanic-horror","label":"Satanic horror","parent":"ancient-tormentors","children":[],"works":[{"title":"The Master and Margarita","cover_url":"https://covers.openlibrary.org/b/id/14428415-L.jpg","shows_english_title":true,"authors":["Mikhail Bulgakov"],"year":1967},{"title":"Rosemary's Baby","cover_url":"https://covers.openlibrary.org/b/id/14642549-L.jpg","shows_english_title":true,"authors":["Ira Levin"],"year":1967}],"image":"242-satanic-horror.webp","status":"leaf","definition":"Supernatural horror centered on Satan, his cults, bargains, offspring or direct worldly designs."},{"id":"primordial-predators","label":"Primordial predators","parent":"ancient-tormentors","children":[],"works":[{"title":"It","cover_url":"https://covers.openlibrary.org/b/id/14656132-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1986},{"title":"Darker Than You Think","cover_url":"https://archive.org/download/darkerthanyouthi0000jack/page/cover.jpg","shows_english_title":true,"authors":["Jack Williamson"],"year":1948}],"image":"243-primordial-predators.webp","status":"leaf","definition":"Supernatural horror driven by an ancient prehuman species or shapeshifting being that has hunted humanity across generations."},{"id":"necrotic-horror","label":"Necrotic horror","parent":"ancient-tormentors","children":[],"works":[{"title":"The Case of Charles Dexter Ward","cover_url":"https://covers.openlibrary.org/b/id/8443336-L.jpg","shows_english_title":true,"authors":["H. P. Lovecraft"],"year":1927}],"image":"244-necrotic-horror.webp","status":"leaf","definition":"Supernatural horror in which preserved remains, grave matter or necromancy restore a dead human evil to bodily agency."},{"id":"demonic-horror","label":"Demonic horror","parent":"ancient-tormentors","children":[],"works":[{"title":"Old House of Fear","cover_url":"https://covers.openlibrary.org/b/id/14647443-L.jpg","shows_english_title":true,"authors":["Russell Kirk"],"year":1961,"placement_note":"New Criterion ('The Ghosts of Russell Kirk'): beneath the sham bogles, the island's legends come true - Jackman is shown to be a demon, 'the Firgower, the Goat-Man', seeing all things through his Third Eye; Kirk Center review confirms the occult Dr. Jackman controlling the island. An ancient demonic entity tied to place legend -> ancient-tormentors."}],"image":"245-demonic-horror.webp","status":"leaf","definition":"Supernatural horror driven by a demon or place-bound demonic entity that torments human lives without necessarily being Satanic."},{"id":"psychogeographic-fabulation","label":"Psychogeographic fabulation","parent":"inner-space","children":[],"works":[{"title":"The Day of Creation","cover_url":"cover-the-day-of-creation.webp","shows_english_title":true,"authors":["J. G. Ballard"],"year":1987,"placement_note":"SFE calls it less overtly fantastic: Mallory inadvertently causes a new river across an imaginary African war zone; Harper centers his obsessive journey to the source of his own creation. The impossible river and transformed landscape externalize obsession, making mind and place inseparable."},{"title":"Lanark: A Life in Four Books","cover_url":"https://canongate.co.uk/wp-content/uploads/2026/06/lanark-642x1024.jpg","shows_english_title":true,"authors":["Alasdair Gray"],"year":1981,"placement_note":"SFE describes Lanark as equipoisal Fantastika whose Alice-like intercalendrical Zone and Time Distortion emphasize its non-SF character; Canongate calls it a modern vision of hell interweaving realistic Glasgow with disintegrating Unthank. Its double protagonist and unstable boundary between damaged psyche, autobiography and impossible city make Inner Space the closest leaf."},{"title":"Only Forward","authors":["Michael Marshall Smith"],"year":1994,"cover_url":"https://covers.openlibrary.org/b/id/372870-L.jpg","shows_english_title":true},{"title":"The Infernal Desire Machines of Doctor Hoffman","cover_url":"https://covers.openlibrary.org/b/id/12699047-L.jpg","shows_english_title":true,"authors":["Angela Carter"],"year":1972},{"title":"The Bridge","cover_url":"https://iainbanks.co.uk/wp-content/uploads/featured-bridge.webp","shows_english_title":true,"authors":["Iain Banks"],"year":1986},{"title":"The Escapement","cover_url":"275-the-escapement.jpg","shows_english_title":true,"authors":["Lavie Tidhar"],"year":2021,"placement_note":"SFE and Tachyon ground a father leaving his dying son’s hospital bedside for a shifting parallel Western dreamscape whose clowns, toys, monsters and quest for a healing flower externalize grief. Impossible journey and damaged psyche are inseparable, making Psychogeographic fabulation exact."},{"title":"The Evidence","cover_url":"276-the-evidence.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":2020,"placement_note":"SFE identifies the Dream Archipelago as psychic terrain and The Evidence’s trip to Dearth as entangling narrator Todd Fremde in a displaced murder. Gollancz grounds unstable time, contradictory institutions and forgotten crime; island geography and perception make the mystery possible."}],"image":"246-psychogeographic-fabulation.webp","status":"leaf","definition":"Fabulation in which an impossible city or journey externalizes a character's damaged psyche, desire or dream life until place and mind become inseparable."},{"id":"consciousness-fiction","label":"Consciousness fiction","parent":"inner-space","children":[],"works":[{"title":"Briefing for a Descent Into Hell","cover_url":"https://covers.openlibrary.org/b/id/11406742-L.jpg","shows_english_title":true,"authors":["Doris Lessing"],"year":1971,"placement_note":"SFE and Penguin hold the protagonist between a contemporary psychiatric ward and an unresolved mythic-cosmic voyage. Because the book never stabilizes whether its other world is delusion, memory or cosmic truth, its reality stays visibly mutable, fitting Worlds in flux under Fabulation."},{"title":"Love and Other Thought Experiments","cover_url":"https://images3.penguinrandomhouse.com/smedia/9780593314302","shows_english_title":true,"authors":["Sophie Ward"],"year":2020,"placement_note":"Penguin Random House structures the novel as interconnected philosophical thought experiments about reality, consciousness and love; Publishers Weekly describes its metaphysical turn into the ant’s consciousness, while the Guardian centers its debate over whether an impossible perception is real. Mind, perception and competing realities destabilize the narrated world, making Inner Space closest."},{"title":"Martian Time-Slip","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-martian-time-slip-3-24.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1964,"placement_note":"SFE says schizophrenic perception irradiates the novel’s world and describes Mars chiefly as background for a reality-shifting plot; Hachette centers Manfred’s stopped time, Bleekmen precognition and the bizarre repercussions. Subjective time and unstable perception remake experienced reality, making Inner Space exact."},{"title":"Miracle Visitors","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-miracle-visitors-10.jpg","shows_english_title":true,"authors":["Ian Watson"],"year":1978,"placement_note":"SFE calls this the leading UFO novel and explicitly roots its contacts in altered consciousness and the split between subjective and objective reality; Hachette asks whether collective unconscious and mind project physically real yet illusory beings. Unstable perception remakes experienced reality."},{"title":"The Atrocity Exhibition","cover_url":"https://covers.openlibrary.org/b/id/14373591-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1970,"placement_note":"Root-down: Speculative fiction -> Atemporal -> Fabulation -> Inner space -> Consciousness fiction. SFE calls these nonlinear condensed novels a fusion of media landscape with private memories, fantasies, medical reports and astronomical data. Destabilized consciousness that fuses external media and inner reality governs."},{"title":"The Glamour","cover_url":"cover-the-glamour.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":1984,"placement_note":"SFE calls the novel inward and resistant to reliable readings; Priest describes psychological invisibility, while Hachette grounds amnesia, contradictory recollections and glimpses of a twilight world. Unstable memory and perception determine who exists to whom, so Consciousness fiction governs."}],"image":"247-consciousness-fiction.webp","status":"leaf","definition":"Speculative fiction in which altered, divided or nonordinary consciousness destabilizes time, identity and the reality experienced by the mind."},{"id":"projected-realities","label":"Projected realities","parent":"inner-space","children":[],"works":[{"title":"Destroy All Monsters","cover_url":"https://images.booksense.com/images/748/456/9780062456748.jpg","shows_english_title":true,"authors":["Sam J. Miller"],"year":2019,"placement_note":"SFE describes Darkside as either a parallel world or a trauma-born delusion, while Harper presents two overlapping realities whose friends rescue each other through recovered memory. Its reality remains visibly unstable rather than settling into a literal SF mechanism."},{"title":"Peaces","cover_url":"https://covers.openlibrary.org/b/id/10478791-L.jpg","shows_english_title":true,"authors":["Helen Oyeyemi"],"year":2021,"placement_note":"NPR: a bizarre interstitial space between a surrealist narrative and a real one; Kirkus: surrealist tale of being haunted by the past. Otto and Xavier Shin board the sleeper train The Lucky Day and reality stops cohering - no stable boundary between psyche and world, memory projecting a competing reality: exactly inner-space. NYT stresses it is NOT a fairy tale (kept out of fairy-tale-revision where Gingerbread sits). Shelfmates: Lanark, Only Forward."}],"image":"248-projected-realities.webp","status":"leaf","definition":"Fabulation in which trauma, memory or desire projects a competing shared reality whose boundary with the ordinary world cannot be stabilized."},{"id":"cryptid-horror","label":"Cryptid horror","parent":"soft-science-fiction","children":[],"works":[{"title":"Devolution","cover_url":"https://images.penguinrandomhouse.com/cover/9781984826800","shows_english_title":true,"authors":["Max Brooks"],"year":2020,"placement_note":"A materially real terrestrial Sasquatch species besieges a recognizable-present eco-community; speculative biology rather than aliens or magic, with predation and isolation supplying the horror."}],"image":"240-cryptid-horror.webp","definition":"Modern-day soft science fiction and horror in which an alleged hidden animal or folkloric species becomes materially real, with the creature's biological possibility supplying the speculative premise and its attack, pursuit or discovery supplying the horror.","status":"accepted"},{"id":"interstellar-court-politics","label":"Interstellar court politics","parent":"political-space-opera","children":[],"works":[{"title":"Teixcalaan","cover_url":"https://cdn11.bigcommerce.com/s-65f8qukrjx/images/stencil/1280x1280/products/6465/17120/Martine_A-Memory_of_Empire_cover__37765.1687451116.jpg?c=1","shows_english_title":false,"authors":["Arkady Martine"],"year":2019,"books":[{"title":"A Memory Called Empire","year":2019,"cover_url":"https://cdn11.b

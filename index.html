 by dreams of the Pleistocene is enlisted into a Time-Travel project and goes back in Mysterious Stranger equipage to the Africa of his vision - a built institutional apparatus (prehistoric SF), so Time machines over Timeslips."},{"title":"The Future of Another Timeline","cover_url":"cover-future-another-timeline.jpg","shows_english_title":true,"authors":["Annalee Newitz"],"year":2019,"placement_note":"Tor grounds Tess as using ancient Machines and an institutional Chronology Academy to visit key historical moments, edit one mutable timeline and wage a cross-era political war. The built/institutional apparatus governs, making Time machines stronger than Timeslips or alternate-world fabulation."}],"definition":"Time travel enabled by a built device or institutional apparatus that transports people through time.","status":"accepted","image":"102-time-machines.webp"},{"id":"hard-time-travel","label":"Hard Time Travel","parent":"time-travel-fiction","children":[],"works":[{"title":"Timescape","cover_url":"https://x.sf-encyclopedia.com/gal/clute/Benford-Timescape.jpg","shows_english_title":true,"authors":["Gregory Benford"],"year":1980}],"definition":"Time travel or communication made central through a rigorously developed physical mechanism.","status":"accepted","image":"103-hard-time-travel.webp"},{"id":"ancestral-time-travel","label":"Ancestral Time Travel","parent":"time-travel-fiction","children":[],"works":[{"title":"Kindred","cover_url":"https://covers.openlibrary.org/b/isbn/9780704341623-L.jpg","shows_english_title":true,"authors":["Octavia E. Butler"],"year":1979},{"title":"Outlander","cover_url":"https://covers.openlibrary.org/b/id/6548767-L.jpg","shows_english_title":true,"authors":["Diana Gabaldon"],"year":1991,"books":[{"title":"Outlander","year":1991,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/6548767-L.jpg","shows_english_title":true},{"title":"Dragonfly in Amber","year":1992,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/6920490-L.jpg","shows_english_title":true},{"title":"Voyager","year":1993,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/238962-L.jpg","shows_english_title":true},{"title":"Drums of Autumn","year":1996,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/10710402-L.jpg","shows_english_title":true},{"title":"The Fiery Cross","year":2001,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/280733-L.jpg","shows_english_title":true},{"title":"A Breath of Snow and Ashes","year":2005,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/239469-L.jpg","shows_english_title":true},{"title":"An Echo in the Bone","year":2009,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/10664958-L.jpg","shows_english_title":true},{"title":"Written in My Own Heart's Blood","year":2014,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/10864039-L.jpg","shows_english_title":true},{"title":"Go Tell the Bees That I Am Gone","year":2021,"authors":["Diana Gabaldon"],"cover_url":"https://covers.openlibrary.org/b/id/10860237-L.jpg","shows_english_title":true}]}],"definition":"Time travel into family history, where kinship and ancestry determine the destination and stakes.","status":"accepted","image":"104-ancestral-time-travel.webp"},{"id":"time-loops","label":"Time Loops","parent":"time-travel-fiction","children":[],"works":[{"title":"Replay","cover_url":"https://covers.openlibrary.org/b/id/432217-L.jpg","shows_english_title":true,"authors":["Ken Grimwood"],"year":1987},{"title":"This Time Tomorrow","cover_url":"https://covers.openlibrary.org/b/isbn/9780525539018-L.jpg","shows_english_title":true,"authors":["Emma Straub"],"year":2022},{"title":"How to Live Safely in a Science Fictional Universe","cover_url":"https://www.charlesyuauthor.com/wp-content/uploads/2019/07/Cover-How-To.jpg","shows_english_title":true,"authors":["Charles Yu"],"year":2010,"placement_note":"SFE follows a time-travel repairman through loops and impasses as he revisits personal triumphs and traumas; PRH centers the son’s search for his vanished time-machine-inventor father through quantum space-time. Recurrence and self-encounter make Time Loops exact."},{"title":"Opposite of Always","authors":["Justin A. Reynolds"],"year":2019,"cover_url":"https://covers.openlibrary.org/b/id/8797533-L.jpg","shows_english_title":true,"placement_note":"Locus (Mondor): Jack travels back over the same months again and again to save Kate, Groundhog Day explicitly name-checked - the repeated reliving of a span of life is the time-loops definition."}],"definition":"Time travel structured as the repeated reliving of a span of life or history.","status":"accepted","image":"105-time-loops.webp"},{"id":"extra-dimensional-awareness","label":"Extra dimensional awareness","parent":"time-travel-fiction","children":[],"works":[{"title":"Slaughterhouse-Five","cover_url":"https://covers.openlibrary.org/b/id/15118509-L.jpg","shows_english_title":true,"authors":["Kurt Vonnegut"],"year":1969}],"definition":"Time travel experienced as awareness of time as an additional dimension, with moments perceived and revisited across a whole lifespan.","status":"accepted","image":"106-extra-dimensional-awareness.webp"},{"id":"time-travel-disorders","label":"Time Travel Disorders","parent":"time-travel-fiction","children":[],"works":[{"title":"The Time Traveler's Wife","cover_url":"https://covers.openlibrary.org/b/isbn/9781476764832-L.jpg","shows_english_title":true,"authors":["Audrey Niffenegger"],"year":2003}],"definition":"Time travel caused by an intrinsic medical or biological condition of the traveler.","status":"accepted","image":"107-time-travel-disorders.webp"},{"id":"timeslips","label":"Timeslips","parent":"time-travel-fiction","children":[],"works":[{"title":"The Dream Years","cover_url":"cover-the-dream-years.webp","shows_english_title":true,"authors":["Lisa Goldstein"],"year":1985,"placement_note":"SFE explicitly calls it a timeslip romance alternating between 1920s surrealist Paris and the Events of 1968, conflating two historical moments of attempted reality-transformation; SFE Time Travel lists it among notable timeslip romances. Arbitrary cross-era movement governs."},{"title":"Red Shift","cover_url":"https://covers.openlibrary.org/b/id/241-L.jpg","shows_english_title":true,"authors":["Alan Garner"],"year":1973},{"title":"Time and Again","cover_url":"https://covers.openlibrary.org/b/id/3841920-L.jpg","shows_english_title":true,"authors":["Jack Finney"],"year":1970,"books":[{"title":"Time and Again","year":1970,"authors":["Jack Finney"],"cover_url":"https://covers.openlibrary.org/b/id/3841920-L.jpg"},{"title":"From Time to Time","year":1995,"authors":["Jack Finney"],"cover_url":"https://covers.openlibrary.org/b/id/405925-L.jpg"}],"placement_note":"SFE calls it Time Travel equipoising SF and fantasy, and separately identifies self-hypnosis as its key. The psychological, non-machine transit into 1882 fits Timeslips; the card includes its direct sequel."},{"title":"11/22/63","cover_url":"https://covers.openlibrary.org/b/id/10713447-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":2011,"placement_note":"A diner storeroom is an unexplained portal fixed to 1958; repeated one-way entries and attempts to prevent Kennedy’s assassination make non-machine timeslip travel the core mechanism."},{"title":"A Connecticut Yankee in King Arthur's Court","cover_url":"https://covers.openlibrary.org/b/id/9168732-L.jpg","shows_english_title":true,"authors":["Mark Twain"],"year":1889},{"title":"Darkmans","cover_url":"https://covers.openlibrary.org/b/id/6945541-L.jpg","shows_english_title":true,"authors":["Nicola Barker"],"year":2007},{"title":"The Time Quintet","cover_url":"https://covers.openlibrary.org/b/id/8732056-L.jpg","shows_english_title":true,"authors":["Madeleine L'Engle"],"year":1962,"books":[{"title":"A Wrinkle in Time","year":1962,"cover_url":"https://covers.openlibrary.org/b/id/8737958-L.jpg","shows_english_title":true},{"title":"A Wind in the Door","year":1973,"cover_url":"https://covers.openlibrary.org/b/id/8276481-L.jpg","shows_english_title":true},{"title":"A Swiftly Tilting Planet","year":1978,"cover_url":"https://covers.openlibrary.org/b/id/1170041-L.jpg","shows_english_title":true},{"title":"Many Waters","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/6536498-L.jpg","shows_english_title":true},{"title":"An Acceptable Time","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/223658-L.jpg","shows_english_title":true}],"placement_note":"The sequence repeatedly crosses time without a stable built time machine: A Swiftly Tilting Planet rides through centuries, Many Waters sends the twins to the world of Noah, and An Acceptable Time opens into another era. Its varied, psychologically and cosmologically entangled transfers fit Timeslips best among the existing time-travel leaves."}],"image":"112-timeslips.webp","definition":"Time transfer through an unexplained or natural shift rather than a built machine, often one-off and psychologically entangled (SFE Timeslip).","status":"candidate"},{"id":"time-distortion","label":"Time Distortion","parent":"time-travel-fiction","children":[],"works":[{"title":"Spin","cover_url":"https://covers.openlibrary.org/b/id/6632328-L.jpg","shows_english_title":true,"authors":["Robert Charles Wilson"],"year":2005,"books":[{"title":"Spin","year":2005,"authors":["Robert Charles Wilson"],"cover_url":"https://covers.openlibrary.org/b/id/6632328-L.jpg"},{"title":"Axis","year":2007,"authors":["Robert Charles Wilson"],"cover_url":"https://covers.openlibrary.org/b/id/1443032-L.jpg"},{"title":"Vortex","year":2011,"authors":["Robert Charles Wilson"],"cover_url":"https://covers.openlibrary.org/b/id/9348869-L.jpg"}]}],"image":"114-time-distortion.webp","definition":"SF in which different regions or worlds run at radically different rates of time, and that unequal passage shapes the story (SFE Time Distortion).","status":"candidate"},{"id":"gothic-science-fiction","label":"Gothic science fiction","parent":"historical","children":["mad-science-gothic","cosmic-gothic"],"works":[],"image":"29-gothic-science-fiction.webp","definition":"In this taxonomy, Gothic science fiction is historical science fiction: period-set tales of Promethean creation, mad scientists, doubles and the monstrous, where mystery and terror outweigh cognition. Modern-set Gothic-science-fiction spins live elsewhere in the tree.","status":"umbrella"},{"id":"portal-fantasy","label":"Portal fantasy","parent":"fantasy","children":["whimsical-doors","transporting-tomes","fantasy-rifts"],"works":[],"image":"30-portal-fantasy.webp","definition":"Fantasy organized by the mechanics of crossing: an anchored physical threshold, a book or text, or an unanchored tear between realities.","status":"provisional"},{"id":"animal-fantasy","label":"Animal fantasy","parent":"real-earth-universe","children":[],"works":[{"title":"Animal Farm","cover_url":"https://covers.openlibrary.org/b/id/12408412-L.jpg","shows_english_title":true,"authors":["George Orwell"],"year":1945},{"title":"Watership Down","cover_url":"https://covers.openlibrary.org/b/id/93454-L.jpg","shows_english_title":true,"authors":["Richard Adams"],"year":1972},{"title":"The Wind in the Willows","cover_url":"https://covers.openlibrary.org/b/id/8451347-L.jpg","shows_english_title":true,"authors":["Kenneth Grahame"],"year":1908},{"title":"The Little Prince","cover_url":"https://covers.openlibrary.org/b/id/12381932-L.jpg","shows_english_title":true,"authors":["Antoine de Saint-Exupéry"],"year":1943}],"image":"31-animal-fantasy.webp","definition":"Fantasy that renders the inner life, society, and mythology of animals on their own terms, lightly anthropomorphized. The Encyclopedia of Fantasy treats animal fantasy as a distinct form; Watership Down's rabbit society is its modern exemplar.","status":"provisional"},{"id":"soft-science-fiction","label":"Soft science fiction","parent":"modern-day","children":["social-science-fiction","psi-powers","superhero-fiction","cryptid-horror"],"works":[],"image":"32-soft-science-fiction.webp","definition":"The broad counterpoint to hard SF: speculative fiction not driven by physical science or engineering, including social-science stories, psi powers and superhero fiction.","status":"accepted"},{"id":"apocalyptic-fiction","label":"Apocalyptic fiction","parent":"modern-day","children":["chemical-catastrophe","climate-catastrophe","cosmic-catastrophe","pandemic","unknown-catastrophe"],"image":"34-apocalyptic-fiction.webp","definition":"Tales of the catastrophe as it unfolds - the end of the world in progress (SFE 'Apocalypse' theme). Split 2026-09-13 from apocalyptic and post-apocalyptic fiction; became an umbrella 2026-09-14 over the five catastrophe leaves on Gustav's directive.","status":"candidate","works":[]},{"id":"chemical-catastrophe","label":"Chemical Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"77-chemical-catastrophe.webp","definition":"The world ends through chemistry or matter itself - a new form of ice freezing the oceans, crystallization consuming the world. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"Cat's Cradle","cover_url":"https://covers.openlibrary.org/b/id/14572638-L.jpg","shows_english_title":true,"authors":["Kurt Vonnegut"],"year":1963},{"title":"The Crystal World","cover_url":"https://covers.openlibrary.org/b/id/8443804-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1966}]},{"id":"climate-catastrophe","label":"Climate Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"79-climate-catastrophe.webp","definition":"The climate itself turns against civilization - drowned tropical cities, an America unravelling under ecological collapse. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"The Drowned World","cover_url":"https://covers.openlibrary.org/b/id/15143833-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1962},{"title":"Parable","cover_url":"https://images.penguinrandomhouse.com/cover/9781609807191","shows_english_title":false,"authors":["Octavia E. Butler"],"year":1993,"books":[{"title":"Parable of the Sower","year":1993},{"title":"Parable of the Talents","year":1998}]},{"title":"A Children's Bible","cover_url":"https://covers.openlibrary.org/b/id/9426320-L.jpg","shows_english_title":true,"authors":["Lydia Millet"],"year":2020}]},{"id":"cosmic-catastrophe","label":"Cosmic Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"78-cosmic-catastrophe.webp","definition":"Disaster falls from the sky - the Moon shatters and its debris begins to rain down. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"Seveneves","cover_url":"https://images.isbndb.com/covers/3108233482210.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2015},{"title":"Lucifer's Hammer","cover_url":"https://images2.penguinrandomhouse.com/smedia/9780449208137","shows_english_title":true,"authors":["Larry Niven","Jerry Pournelle"],"year":1977,"placement_note":"SFE calls it a Disaster novel whose carefully worked-out comet impact and aftermath are central; Penguin Random House describes the comet strike, earthquakes, tidal waves, ice age and civilization’s end. Disaster literally falling from the sky makes Cosmic Catastrophe exact."},{"title":"The End of the World News","cover_url":"274-the-end-of-the-world-news.jpg","shows_english_title":true,"authors":["Anthony Burgess"],"year":1982,"placement_note":"SFE grounds three filmed/intercut narratives whose future frame escapes Earth just before a wandering planet destroys it. Freud/Trotsky pastiches supply the fabular form; the active extrasolar collision makes Cosmic catastrophe the governing speculative engine."}]},{"id":"pandemic","label":"Pandemic","parent":"apocalyptic-fiction","children":[],"image":"80-pandemic.webp","definition":"Civilization ends by plague - superflu, zombie outbreak, engineered virus. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"The Stand","cover_url":"https://covers.openlibrary.org/b/id/14914282-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1978},{"title":"World War Z","cover_url":"https://images.penguinrandomhouse.com/cover/9780307346612","shows_english_title":true,"authors":["Max Brooks"],"year":2006},{"title":"MaddAddam","cover_url":"https://images.penguinrandomhouse.com/cover/9780385721677","shows_english_title":false,"authors":["Margaret Atwood"],"year":2003,"books":[{"title":"Oryx and Crake","year":2003},{"title":"The Year of the Flood","year":2009},{"title":"MaddAddam","year":2013}]},{"title":"Blindness","cover_url":"https://covers.openlibrary.org/b/id/115428-L.jpg","shows_english_title":true,"authors":["José Saramago"],"year":1995},{"title":"Marjorie Westriding","cover_url":"https://covers.openlibrary.org/b/id/4673084-L.jpg","shows_english_title":true,"authors":["Sheri S. Tepper"],"year":1989,"books":[{"title":"Grass","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/4673084-L.jpg"},{"title":"Raising the Stones","year":1990,"cover_url":"https://covers.openlibrary.org/b/id/7279595-L.jpg"},{"title":"Sideshow","year":1992,"cover_url":"https://covers.openlibrary.org/b/id/3973055-L.jpg"}],"placement_note":"SFE identifies the three-book Marjorie Westriding sequence as set in the backwash of a galaxy-spanning pandemic. Its cross-planet plague frame connects the trilogy and makes Pandemic the closest existing leaf."},{"title":"Severance","cover_url":"https://mpd-biblio-covers.imgix.net/9781250214997.jpg","shows_english_title":true,"authors":["Ling Ma"],"year":2018,"placement_note":"Macmillan centers Shen Fever spreading while New York companies and transit cease and Candace joins a survivor group; the plague-driven collapse in progress makes Pandemic closest."},{"title":"Survivor Song","cover_url":"https://www.harpercollins.com/cdn/shop/files/9780062679161_bb750afa-894a-497b-b8d0-fee01ecabef4_1200x1200.jpg?v=1781187244","shows_english_title":true,"authors":["Paul Tremblay"],"year":2020,"placement_note":"SFE explicitly identifies a near-future zombie-creating pandemic; the publisher synopsis grounds a rabies-like saliva virus overrunning Massachusetts, collapsing hospitals and emergency protocols while an infected pregnant woman races for a vaccine. Biological outbreak and systemic collapse make Pandemic exact."}]},{"id":"unknown-catastrophe","label":"Unknown Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"81-unknown-catastrophe.webp","definition":"The catastrophe has no name - a green flash blinds the world and nobody proves why, a city is cut off under a changed sky with no cause ever given. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"Dhalgren","cover_url":"https://covers.openlibrary.org/b/id/9590542-L.jpg","shows_english_title":true,"authors":["Samuel R. Delany"],"year":1975},{"title":"The Day of the Triffids","cover_url":"https://covers.openlibrary.org/b/id/380101-L.jpg","shows_english_title":true,"authors":["John Wyndham"],"year":1951},{"title":"Girlfriend in a Coma","cover_url":"https://covers.openlibrary.org/b/isbn/9780060987329-L.jpg","shows_english_title":true,"authors":["Douglas Coupland"],"year":1998,"placement_note":"The Guardian describes Karen’s prophetic coma and awakening before the world abruptly ends; reviews identify the apocalypse and a guiding ghost. With no defined material cause for the sudden extinction event, Unknown Catastrophe is the closest existing leaf."}]},{"id":"science-fantasy","label":"Science fantasy","parent":"atemporal","children":["hard-science-fantasy","planetary-romance","old-mars"],"image":"39-science-fantasy.webp","definition":"Umbrella for atemporal science fantasy: fantasy surfaces built on scientific engines. Atemporal by construction - keeping known physics intact while making the world read as fantasy requires exile from our usable timeline into invented worlds or unplaceable futures.","status":"candidate","works":[]},{"id":"hard-science-fantasy","label":"Hard science fantasy","parent":"science-fantasy","children":[],"works":[{"title":"Jack of Shadows","cover_url":"https://covers.openlibrary.org/b/id/7029508-L.jpg","shows_english_title":true,"authors":["Roger Zelazny"],"year":1971,"placement_note":"SFE says its tidally locked Earth divides fantasy-governed night from science-governed day, making imaginative use of Technofantasy. The magic/science opposition rests on planetary mechanics, fitting Hard science fantasy."},{"title":"Lord of Light","cover_url":"https://covers.openlibrary.org/b/id/8762437-L.jpg","shows_english_title":true,"authors":["Roger Zelazny"],"year":1967},{"title":"Riverworld","cover_url":"https://covers.openlibrary.org/b/id/13125240-L.jpg","shows_english_title":false,"authors":["Philip José Farmer"],"year":1971,"books":[{"title":"To Your Scattered Bodies Go","year":1971,"cover_url":"https://covers.openlibrary.org/b/id/209084-L.jpg","shows_english_title":true},{"title":"The Fabulous Riverboat","year":1971,"cover_url":"https://covers.openlibrary.org/b/id/10157678-L.jpg","shows_english_title":true},{"title":"The Dark Design","year":1977,"cover_url":"https://covers.openlibrary.org/b/id/209086-L.jpg","shows_english_title":true},{"title":"The Magic Labyrinth","year":1980,"cover_url":"https://covers.openlibrary.org/b/id/10180421-L.jpg","shows_english_title":true},{"title":"Gods of Riverworld","year":1983,"cover_url":"https://covers.openlibrary.org/b/id/9492508-L.jpg","shows_english_title":true}]},{"title":"City Under the Stars","cover_url":"https://covers.openlibrary.org/b/isbn/9781250756589-L.jpg","shows_english_ ry-mythic-fantasy","magical-coming-of-age","domestic-fantasy"],"image":"47-contemporary-fantasy.webp","definition":"Fantasy set in the present-day world (the Encyclopedia of Fantasy's 'Contemporary Fantasy' category; Crowley's Little, Big is its exemplar).","status":"provisional","works":[]},{"id":"supernatural-and-dark-fiction","label":"Supernatural dark","parent":"real-earth-universe","children":["dark-fantasy","paranormal-fantasy","supernatural-fiction","vampire-fiction","ghost-story"],"image":"48-supernatural-and-dark-fiction.webp","definition":"Umbrella for the darker shades of fantasy: dark fantasy, paranormal fantasy and supernatural fiction. Created 2026-09-13 under Gustav's umbrella ruling.","status":"provisional","works":[]},{"id":"isolationist-fantasy","label":"Isolationist fantasy","parent":"sword-and-sorcery","children":[],"works":[{"title":"Gormenghast","cover_url":"https://covers.openlibrary.org/b/id/6623928-L.jpg","shows_english_title":false,"authors":["Mervyn Peake"],"year":1946,"books":[{"title":"Titus Groan","year":1946},{"title":"Gormenghast","year":1950},{"title":"Titus Alone","year":1959,"cover_url":"https://covers.openlibrary.org/b/id/11730144-L.jpg"}]}],"image":"49-isolationist-fantasy.webp","definition":"Fantasy of sealed, self-contained worlds whose isolation is the premise: societies cut off from any outside, knowing nothing beyond their own bounds. Created 2026-09-13 at Gustav's direction for the Gormenghast castle books, whose world is isolation by unknowing, not refusal.","status":"provisional"},{"id":"historical","label":"Historical","parent":"science-fiction","children":["alternate-history","gothic-science-fiction","historical-first-contact","lost-world-fiction","steampunk","scientific-adventure","fantastic-voyage"],"works":[],"image":"51-historical.webp","definition":"Science fiction set in a past era: real history, alternate timelines, or a reimagined past.","status":"accepted"},{"id":"futurist","label":"Futurist","parent":"science-fiction","children":["hard-sf","future-of-earth-fiction","spacefaring-fiction","alien-fiction","otherworldly-fiction"],"works":[],"image":"52-futurist.webp","definition":"Science fiction organized by core theme: rigorous science, Earth futures, spacefaring, alien life, or otherworldly cosmology.","status":"accepted"},{"id":"modern-day","label":"Modern day","parent":"science-fiction","children":["alien-invasion-fiction","apocalyptic-fiction","first-contact-fiction","genetic-engineering","humorous-science-fiction","soft-science-fiction","technothriller","social-dystopia-modern"],"works":[],"image":"53-modern-day.webp","definition":"Science fiction set in the recognizable present.","status":"accepted"},{"id":"psi-powers","label":"Psi powers","parent":"soft-science-fiction","children":[],"works":[{"title":"Dying Inside","cover_url":"https://covers.openlibrary.org/b/id/10130176-L.jpg","shows_english_title":true,"authors":["Robert Silverberg"],"year":1972},{"title":"Carrie","cover_url":"https://covers.openlibrary.org/b/id/15228374-L.jpg","shows_english_title":true,"authors":["Stephen King"],"year":1974,"placement_note":"SFE describes King's first novel as focused on Psi Powers, notably Telekinesis. King's official synopsis centers Carrie White gradually discovering telekinetic powers and using them in the prom confrontation; her mind-driven physical power is the engine."},{"title":"Mother London","cover_url":"https://covers.openlibrary.org/b/id/6709940-L.jpg","shows_english_title":true,"authors":["Michael Moorcock"],"year":1988,"placement_note":"SFE: possibly Moorcock's finest single novel, its grasp making pigeonholing impossible 'despite touches of Telepathy and other psi phenomena' (cross-referencing ESP and Psi Powers). The fantastic content is the three outpatients' psi perception of present-day London; psi counts as pseudoscience, not magic."},{"title":"Riot Baby","cover_url":"https://covers.openlibrary.org/b/id/9258941-L.jpg","shows_english_title":true,"authors":["Tochi Onyebuchi"],"year":2020,"placement_note":"Root-down: Science fiction -> Modern day -> Soft science fiction -> Psi powers. Pan Macmillan centers Ella’s precognition and city-wrecking power amid the recognizable Black American present, including Kev’s incarceration; the global-dystopian language describes social experience, not a separately extrapolated future regime. Social dystopia is rejected because psi power, not the social order alone, is the speculative engine."}],"image":"159-psi-powers.webp","definition":"Contemporary-set psi stories in the recognizable present.","status":"accepted"},{"id":"atemporal","label":"Atemporal","parent":"science-fiction","children":["fabulation","new-weird","reincarnation-fiction","science-fantasy","time-travel-fiction","parallel-world-fiction"],"works":[],"image":"54-unplaceable.webp","definition":"Science fiction unplaceable as modern-day, historical, or futuristic: stories that cross eras, worlds with no Earth-time anchor, and realities that resist a stable place in time.","status":"accepted"},{"id":"parallel-world-fiction","label":"Parallel World fiction","parent":"atemporal","children":[],"works":[{"title":"The Space Between Worlds","cover_url":"https://covers.openlibrary.org/b/id/10723957-L.jpg","shows_english_title":true,"authors":["Micaiah Johnson"],"year":2020,"placement_note":"SFE centers its 380 interacting Parallel Worlds and travel possible only where the traveler’s Doppelganger is dead; cross-world identity and movement are the governing mechanism."},{"title":"Million Mile Road Trip","cover_url":"https://skyhorse-us.imgix.net/covers/9781597809924.jpg?auto=format&w=900","shows_english_title":true,"authors":["Rudy Rucker"],"year":2019,"placement_note":"Skyhorse and SFE center a transdimensional crossing into Mappyworld, an endless parallel universe whose basin-worlds contain contrasting alien civilizations; the teens’ road trip and Earth-invasion defense depend on travel across that alternate reality."},{"title":"Ring Around the Sun","cover_url":"https://covers.openlibrary.org/b/id/678934-L.jpg","shows_english_title":true,"authors":["Clifford D. Simak"],"year":1953,"placement_note":"Root-down: Science fiction -> Atemporal -> Parallel World fiction. SFE says the novel discovers a chain of parallel Earths and centers mutants using everlasting goods while empty alternate Earths become available for colonization. Futurist siblings fail because crossing parallel realities, not one future Earth or an other cosmos, is the mechanism."}],"image":"135-parallel-world-fiction.webp","definition":"Science fiction whose central mechanism is travel, communication or identity across multiple parallel versions of reality (SFE Parallel Worlds).","status":"accepted"},{"id":"historical-first-contact","label":"Historical first contact","parent":"historical","children":[],"works":[{"title":"Eifelheim","cover_url":"https://mpd-biblio-covers.imgix.net/9780765319104.jpg","shows_english_title":true,"authors":["Michael Flynn"],"year":2006}],"image":"55-historical-first-contact.webp","definition":"First-contact stories set in the historical past. (Coined label for the four-genre time-axis reorganization.)","status":"provisional"},{"id":"reincarnation-fiction","label":"Reincarnation fiction","parent":"atemporal","children":[],"works":[{"title":"Cloud Atlas","cover_url":"https://covers.openlibrary.org/b/id/8764871-L.jpg","shows_english_title":true,"authors":["David Mitchell"],"year":2004},{"title":"The Book of Ptath","cover_url":"https://covers.openlibrary.org/b/id/678924-L.jpg","shows_english_title":true,"authors":["A. E. van Vogt"],"year":1943},{"title":"Downward to the Earth","cover_url":"https://book-assets.openroadmedia.com/9781504074056.jpg","shows_english_title":true,"authors":["Robert Silverberg"],"year":1970,"placement_note":"SFE makes this a notable case of alien biology permitting reincarnation within an explicitly religious frame; the nildoror rebirth rite and Gundersen’s pursuit of it are the linking device, making Reincarnation fiction more specific than Anthropological SF."}],"image":"57-reincarnation-fiction.webp","definition":"Stories in which a soul or consciousness recurs across multiple lifetimes and eras, reincarnation serving as the linking device.","status":"provisional"},{"id":"technothriller","label":"Technothriller","parent":"modern-day","children":[],"works":[{"title":"Cryptonomicon","cover_url":"https://covers.openlibrary.org/b/id/11540410-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":1999},{"title":"Little Brother","year":2008,"authors":["Cory Doctorow"],"cover_url":"https://archive.org/download/littlebrother00doct/page/cover.jpg","shows_english_title":true,"books":[{"title":"Little Brother","year":2008,"authors":["Cory Doctorow"],"cover_url":"https://archive.org/download/littlebrother00doct/page/cover.jpg"},{"title":"Homeland","year":2013},{"title":"Attack Surface","year":2020}],"placement_note":"SFE follows the Little Brother sequence through a teenage hacker resisting near-future surveillance and information control. Its thriller action depends on real hacking, networks, cryptography, and counter-surveillance, fitting Technothriller."},{"title":"Pattern Recognition","cover_url":"https://covers.openlibrary.org/b/id/7997178-L.jpg","shows_english_title":true,"authors":["William Gibson"],"year":2003},{"title":"Pacific Storm","cover_url":"https://covers.openlibrary.org/b/id/12996604-L.jpg","shows_english_title":true,"authors":["Linda Nagata"],"year":2020,"placement_note":"Locus (Letson, Dec 2020): near-future-nightmare intrigue-thriller-disaster shelved beside Christopher Brown, Greg Egan, Nancy Kress - Honolulu cop in the autonomous Waikiki District relies on behavior-predicting AI HADAFA, which glitches as a Category 5 hurricane and a terrorist conspiracy converge. Technothriller core: the near-future tech (autonomous district, predictive AI) drives the thriller. Shelfmates: Little Brother, Pattern Recognition."}, x1024.jpg","shows_english_title":true},{"title":"Tarzan and the Lion Man","year":1933,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Lion Man.jpg?_t=1705690666","shows_english_title":true},{"title":"Tarzan and the Leopard Men","year":1935,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Leopard Men.jpg?_t=1705800648","shows_english_title":true},{"title":"Tarzan’s Quest","year":1935,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Quest.jpg?_t=1705801591","shows_english_title":true},{"title":"Tarzan and the Forbidden City","year":1938,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Forbidden.jpg?_t=1705801592","shows_english_title":true},{"title":"Tarzan the Magnificent","year":1939,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Magnificent(1).jpg?_t=1705801591","shows_english_title":true},{"title":"Tarzan and the Foreign Legion","year":1947,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Foreign Legion(1).jpg?_t=1705801588","shows_english_title":true},{"title":"Tarzan and the Madman","year":1964,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Madman(1).jpg?_t=1705801588","shows_english_title":true},{"title":"Tarzan and the Castaways","year":1965,"authors":["Edgar Rice Burroughs"],"cover_url":"https://www.edgarriceburroughs.com/erbauthorizedlibrary/images/TARZAN Castaways(1).jpg?_t=1705801592","shows_english_title":true}]},{"title":"The Dwellers in the Mirage","cover_url":"https://covers.openlibrary.org/b/id/8535842-L.jpg","shows_english_title":true,"authors":["A. Merritt"],"year":1932,"placement_note":"SFE describes a remote Alaskan valley with a hidden prehistory and a cosmic horror entity. The geographically isolated archaic society and its discovery are the defining Lost World structure; published and framed in 1932, so Historical."},{"title":"Land Under England","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-land-under-england-75.jpg","shows_english_title":true,"authors":["Joseph O'Neill"],"year":1935,"placement_note":"SFE explicitly calls Land Under England a Dystopia in a Lost-World setting: an enormous underground cave system beneath Cumberland holds descendants of a Roman army under telepathic totalitarian rule. The expedition into an isolated surviving civilization makes Lost world fiction the closest leaf; dystopia is its internal society."},{"title":"Mistress Masham's Repose","cover_url":"https://covers.openlibrary.org/b/id/898768-L.jpg","shows_english_title":true,"authors":["T. H. White"],"year":1946,"placement_note":"SFE files the novel under White's sf interest: Lilliputians carried to England by Gulliver have survived hidden on the vast Malplaquet estate for 200 years until a girl discovers them. A hidden surviving people discovered in isolation is the Lost World structure in miniature; Lilliputian anthropology is pseudoscience rather than magic."}],"image":"59-lost-world-fiction.webp","status":"provisional","definition":"Adventure fiction in which explorers discover a surviving prehistoric or otherwise isolated world: hidden plateaus, hollow-earth caverns and lost valleys where dinosaurs, ancient peoples or vanished civilizations endure. Coined from the SFE Lost Worlds theme entry; Verne's Journey to the Center of the Earth (1864) is the genre's founding text."},{"id":"gaslight-fantasy","label":"Gaslight fantasy","parent":"industrial-age-fantasy","children":["gaslight-technomancy","mythology-in-gaslight","folklore-in-gaslight"],"works":[],"image":"60-gaslight-fantasy.webp","definition":"Fantasy set in the gaslit long nineteenth century, partitioned by how magic enters the historical setting: engineered wonder, revived mythology, or living folklore.","status":"umbrella"},{"id":"gaslight-technomancy","label":"Gaslight Technomancy","parent":"gaslight-fantasy","children":[],"works":[{"title":"Babel","cover_url":"https://cdn.waterstones.com/bookjackets/large/9780/0085/9780008501853.jpg","shows_english_title":true,"authors":["R. F. Kuang"],"year":2022,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Gaslight Technomancy. Translation-powered silver-working is a learned industrial system that runs the British Empire, so engineered magical infrastructure governs."},{"title":"The Extraordinary Adventures of the Athena Club","cover_url":"https://covers.openlibrary.org/b/id/8762813-L.jpg","shows_english_title":true,"authors":["Theodora Goss"],"year":2017,"books":[{"title":"The Strange Case of the Alchemist's Daughter","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8762813-L.jpg"},{"title":"European Travel for the Monstrous Gentlewoman","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/11241076-L.jpg"},{"title":"The Sinister Mystery of the Mesmerizing Girl","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/9320944-L.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Gaslight Technomancy. The daughters of literature's mad scientists are products of experiments and scientific artifice; investigative plots are secondary to their engineered fantastic origins."},{"title":"Fata Morgana","cover_url":"https://book-assets.openroadmedia.com/9781497631007.jpg","shows_english_title":true,"authors":["William Kotzwinkle"],"year":1977,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Gaslight Technomancy. An apparently infallible fortune-telling machine makes magical apparatus the governing source of wonder in 1871 Paris."}],"image":"270-gaslight-technomancy.webp","definition":"Gaslight-era fantasy where magic is engineered as science, machinery, experiment or industrial system.","status":"accepted"},{"id":"mythology-in-gaslight","label":"Mythology in Gaslight","parent":"gaslight-fantasy","children":[],"works":[{"title":"The Anubis Gates","cover_url":"https://covers.openlibrary.org/b/id/77712-L.jpg","shows_english_title":true,"authors":["Tim Powers"],"year":1983,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Mythology in Gaslight. Ancient Egyptian sorcery and homunculi are revived inside 1810 London, importing old mythology into the industrial era."},{"title":"The Gilded Wolves trilogy","cover_url":"cover-gilded-wolves.jpg","shows_english_title":true,"authors":["Roshani Chokshi"],"year":2019,"books":[{"title":"The Gilded Wolves","year":2019,"cover_url":"cover-gilded-wolves.jpg","shows_english_title":true},{"title":"The Silvered Serpents","year":2020,"cover_url":"cover-silvered-serpents.jpg","shows_english_title":true},{"title":"The Bronzed Beasts","year":2021,"cover_url":"cover-bronzed-beasts.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial age fantasy -> Gaslight fantasy -> Mythology in Gaslight. Forging descends from the shattered Tower of Babel, importing an ancient sacred myth into 1889 Exposition Paris."}],"image":"271-mythology-in-gaslight.webp","definition":"Gaslight-era fantasy where ancient sacred myths and their powers are revived inside the nineteenth-century wo

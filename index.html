title":"Light","year":2002,"authors":["M. John Harrison"]},{"title":"Nova Swing","year":2006},{"title":"Empty Space: A Haunting","year":2012}]}]},{"id":"techno-fiction","label":"Techno Fiction","parent":"future-of-earth-fiction","children":["robots-and-ai","cyberpunk","technomorphosis"],"works":[],"image":"87-techno-fiction.webp","definition":"Future-of-Earth fiction organized around technologies that remake minds, bodies, networks and social order.","status":"accepted"},{"id":"cyberpunk","label":"Cyberpunk","parent":"techno-fiction","children":["metaverse","neural-fiction","postcyberpunk"],"works":[],"image":"8-cyberpunk.webp","definition":"Pure umbrella for futures shaped by invasive network technology: immersive avatar worlds, direct brain-computer interfaces, and postcyberpunk life embedded in pervasive systems.","status":"accepted"},{"id":"metaverse","label":"Metaverse","parent":"cyberpunk","children":[],"works":[{"title":"Snow Crash","cover_url":"https://covers.openlibrary.org/b/id/10514880-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":1992},{"title":"Ready Player One","cover_url":"https://covers.openlibrary.org/b/id/10287476-L.jpg","shows_english_title":true,"authors":["Ernest Cline"],"year":2011,"placement_note":"SFE sets the novel in a degraded near-future where people retreat into the total-immersion OASIS, a Cyberspace-style virtual reality governed by corporate technology and contested through avatars and a world-spanning game. Networked altered reality, an unpleasant social order and control of the platform make Cyberpunk the closest leaf."},{"title":"Alma sequence","cover_url":"https://covers.openlibrary.org/b/id/10856892-L.jpg","shows_english_title":true,"authors":["Adam Roberts"],"year":2017,"books":[{"title":"The Real-Town Murders","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/10856892-L.jpg"},{"title":"By the Pricking of Her Thumb","year":2018,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-by-the-pricking-of-her-thumb-3-12.jpg"}],"placement_note":"SFE defines The Real-Town Murders as near-future noir in a world threatened with immersion into a Virtual Reality maze by a sophisticated Internet and identifies By the Pricking of Her Thumb as its loose sequel with the same detective. Networked virtual reality, concentrated power and street-level investigation make Cyberpunk closest."}],"image":"234-metaverse.webp","definition":"Cyberpunk centered on persistent, shared, immersive virtual worlds inhabited through avatars. Stephenson coined Metaverse in Snow Crash; SFE treats it as a defining virtual-world concept.","status":"accepted"},{"id":"neural-fiction","label":"Neural fiction","parent":"cyberpunk","children":[],"works":[{"title":"The Sprawl Trilogy","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-count-zero-296.jpg","shows_english_title":false,"authors":["William Gibson"],"year":1984,"books":[{"title":"Neuromancer","year":1984},{"title":"Count Zero","year":1986},{"title":"Mona Lisa Overdrive","year":1988}]},{"title":"Vurt","cover_url":"https://covers.openlibrary.org/b/id/8760605-L.jpg","shows_english_title":true,"authors":["Jeff Noon"],"year":1993,"books":[{"title":"Vurt","year":1993},{"title":"Pollen","year":1995}]}],"image":"235-neural-fiction.webp","definition":"Cyberpunk in which direct-to-brain access is the central passage into altered reality, regardless of medium: electronic neural decks or biological interfaces such as Vurt feathers. A taxonomy coinage, not an established genre term.","status":"accepted"},{"id":"postcyberpunk","label":"Postcyberpunk","parent":"cyberpunk","children":[],"works":[{"title":"Rainbows End","cover_url":"https://covers.openlibrary.org/b/id/182444-L.jpg","shows_english_title":true,"authors":["Vernor Vinge"],"year":2006,"placement_note":"SFE describes near-future California transformed by pervasive Internet presence, 3D holographic avatars, possible AI and a plot about suppressing a mass mind-control system. Networked altered reality, invasive technology and concentrated control make Cyberpunk the closest leaf."},{"title":"Little Brother","cover_url":"https://mpd-biblio-covers.imgix.net/9780765323118.jpg","shows_english_title":true,"authors":["Cory Doctorow"],"year":2008,"books":[{"title":"Little Brother","year":2008,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765323118.jpg"},{"title":"Homeland","year":2013,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765333704.jpg"},{"title":"Attack Surface","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250757517.jpg"}]},{"title":"Chosen Spirits","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9789386797810/chosen-spirits-9789386797810_hr.jpg","shows_english_title":true,"authors":["Samit Basu"],"year":2020,"placement_note":"SFE and Simon & Schuster place a Reality Controller amid networked celebrity media, pervasive surveillance, corporate/elite power and precarious lives in near-future Delhi, making Cyberpunk the closest leaf."},{"title":"Infinite Detail","cover_url":"https://s3.amazonaws.com/mcdbookimages/books/cover_images/000/000/118/reg/9780374718602_FC.jpg?1651584877","shows_english_title":true,"authors":["Tim Maughan"],"year":2019,"placement_note":"SFE describes proactive bondage to omnipresent electronic networks and their surveillance, followed by sabotage that destroys the Internet and leaves far-right governments taking over; FSG centers Big Data dependence, corporate hegemony, cyberterrorism and post-network collapse. Networked power and radical outsiders make Cyberpunk the closest engine-level leaf."},{"title":"Stealing Worlds","cover_url":"https://book-assets.openroadmedia.com/9780765399977.jpg","shows_english_title":true,"authors":["Karl Schroeder"],"year":2019,"placement_note":"SFE and Macmillan place it in mid-21st-century America, where pervasive surveillance, smart glasses, VR/LARP worlds, blockchain economies and gamified cooperation reshape social power. It passes Science fiction -> Futurist -> Future of Earth -> Techno-fiction -> Cyberpunk; its socially embedded resistance and institution-building rather than noir alienation make Postcyberpunk closest."}],"image":"236-postcyberpunk.webp","definition":"Cyberpunk technology without classic noir alienation: socially embedded protagonists confront near-now networks, surveillance, augmented reality and institutional power. Term attested by Lawrence Person’s 1998 Notes Toward a Postcyberpunk Manifesto.","status":"accepted"},{"id":"technomorphosis","label":"Technomorphosis","parent":"techno-fiction","children":["posthuman","post-society"],"works":[],"image":"126-technomorphosis.webp","definition":"Umbrella for fiction in which technology ceases to be a discrete tool and transforms either human embodiment and identity or the organization of collective life.","status":"accepted"},{"id":"posthuman","label":"Posthuman","parent":"technomorphosis","children":[],"works":[{"title":"Blood Music","cover_url":"https://covers.openlibrary.org/b/isbn/9780877957201-L.jpg","shows_english_title":true,"authors":["Greg Bear"],"year":1985},{"title":"A Scanner Darkly","cover_url":"https://covers.openlibrary.org/b/id/911131-L.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1977},{"title":"Darwin","cover_url":"https://covers.openlibrary.org/b/id/210914-L.jpg","shows_english_title":true,"authors":["Greg Bear"],"year":1999,"books":[{"title":"Darwin's Radio","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/210914-L.jpg","shows_english_title":true},{"title":"Darwin's Children","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/5598801-L.jpg","shows_english_title":true}]},{"title":"Fall; or, Dodge in Hell","cover_url":"https://covers.openlibrary.org/b/id/8742303-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2019,"placement_note":"Harper describes technology turning a dead man's scanned brain into a digital consciousness and ultimately creating Bitworld, an eternal afterlife for humanity. The technology does not remain a tool: it transforms death, mind, society and the form of human existence, making Technomorphosis the closest leaf."},{"title":"Frankissstein","cover_url":"https://covers.openlibrary.org/b/id/9047532-L.jpg","shows_english_title":true,"authors":["Jeanette Winterson"],"year":2019,"placement_note":"SFE places AI ascension, posthuman identity and cryonics at the center of its near-future frame; Penguin describes its inquiry into AI, bodies and what it means to be human. Technology remaking bodily and human identity makes Technomorphosis the closest leaf."},{"title":"Borrowed Man","cover_url":"https://mpd-biblio-covers.imgix.net/9780765381156.jpg","shows_english_title":true,"authors":["Gene Wolfe"],"year":2015,"books":[{"title":"A Borrowed Man","year":2015,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765381156.jpg","shows_english_title":true},{"title":"Interlibrary Loan","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250242679.jpg","shows_english_title":true}],"placement_note":"SFE identifies the two-book Borrowed Man sequence and its protagonist as a cloned, uploaded personality who is legally a library book: medium and message become identical. Tor likewise centers Smithe as the recorded personality of a dead writer, property rather than a legal human. Technology transforms personhood, embodiment and legal identity, making Posthuman exact."},{"title":"Limbo","cover_url":"https://covers.openlibrary.org/b/id/4910623-L.jpg","shows_english_title":true,"authors":["Bernard Wolfe"],"year":1952,"placement_note":"SFE describes men amputating their own limbs and replacing them with cybernetic prostheses to suppress warlike impulses; Orion likewise centers voluntary amputation, prosthetics and the society built around them. Engineered bodies changing human identity and behavior make Posthuman exact."},{"title":"Man Plus","cover_url":"https://covers.openlibrary.org/b/id/6905749-L.jpg","shows_english_title":true,"authors":["Frederik Pohl"],"year":1976,"placement_note":"Macmillan centers astronaut Roger Torraway’s biological and cybernetic transformation into a new being adapted to Mars, explicitly testing whether his humanity survives; Hachette likewise calls him a biologically engineered machine. Technology remaking the body and human identity makes Posthuman exact."}],"image":"179-posthuman.webp","definition":"Technomorphosis centered on transformed bodies, minds, selves or species: technology and engineered systems change what a human being is.","status":"accepted"},{"id":"post-society","label":"Post-society","parent":"technomorphosis","children":[],"works":[{"title":"The Diamond Age","cover_url":"https://covers.openlibrary.org/b/id/12749400-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":1995},{"title":"The Dervish House","cover_url":"https://covers.openlibrary.org/b/id/8777419-L.jpg","shows_english_title":true,"authors":["Ian McDonald"],"year":2010},{"title":"Air (Or, Have Not Have)","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-air-26.jpg","shows_english_title":true,"authors":["Geoff Ryman"],"year":2004,"placement_note":"SFE describes Air as networked information technology that embeds itself in Mae until she in a sense becomes Air, forcing her to guide a traditional village into a transformed world. Hachette likewise centers the technology, information overload and social change. Technology merging with mind and reorganizing community makes Technomorphosis closest."},{"title":"Anthropocene Rag","cover_url":"https://mpd-biblio-covers.imgix.net/9781250269270.jpg","shows_english_title":true,"authors":["Alex Irvine"],"year":2020},{"title":"CatNet","cover_url":"https://covers.openlibrary.org/b/id/10104877-L.jpg","shows_english_title":true,"authors":["Naomi Kritzer"],"year":2019,"books":[{"title":"Catfishing on CatNet","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10104877-L.jpg"},{"title":"Chaos on CatNet","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250165213.jpg"}],"placement_note":"SFE identifies the same benevolent emergent AI across both novels. Publisher sources center a sentient AI administering an ordinary social network, then a rival AI hacking networks to trigger real-world violence. Technology reorganizing friendship, mutual aid, privacy and everyday social life makes Technomorphosis closest."},{"title":"Little Eyes","cover_url":"https://images3.penguinrandomhouse.com/smedia/9780525541370","shows_english_title":true,"authors":["Samanta Schweblin"],"year":2018,"placement_note":"SFE sets the novel across a near-future Earth shaped by kentukis: remote-controlled animal-like devices whose anonymous users inhabit owners’ lives, producing a commodified media landscape. Oneworld centers their worldwide infiltration and the social effects of anonymous technological connection. Technology reorganizing intimacy, privacy and shared life makes Post-society exact."}],"image":"180-post-society.webp","definition":"Technomorphosis centered on transformed collectives, classes, communities or landscapes: technology changes how shared life is organized.","status":"accepted"},{"id":"future-war","label":"Future War","parent":"future-of-earth-fiction","children":[],"works":[{"title":"Rogue Sequence","cover_url":"https://mpd-biblio-covers.imgix.net/9781250322432.jpg","shows_english_title":true,"authors":["Zac Topping"],"year":2025}],"image":"123-earthbound-military-sf.webp","definition":"War transformed by technology and fought on Earth. Near-future and modern entries are included; Earthbound conflict remains the core.","status":"accepted"},{"id":"future-history-of-earth","label":"Future history of Earth","parent":"future-of-earth-fiction","children":[],"works":[{"title":"Journey Beyond Tomorrow","cover_url":"https://covers.openlibrary.org/b/id/6979228-L.jpg","shows_english_title":true,"authors":["Robert Sheckley"],"year":1962,"placement_note":"SFE frames its near-future satire a millennium later as garbled founding myths explaining ruined Earth. That retrospective construction of Earth history makes Future history of Earth closest."},{"title":"City","cover_url":"https://covers.openlibrary.org/b/id/15219495-L.jpg","shows_english_title":true,"authors":["Clifford D. Simak"],"year":1952},{"title":"Last and First Men","cover_url":"https://covers.openlibrary.org/b/id/911106-L.jpg","shows_english_title":true,"authors":["Olaf Stapledon"],"year":1930},{"title":"The End of Eternity","cover_url":"https://covers.openlibrary.org/b/id/6622699-L.jpg","shows_english_title":true,"authors":["Isaac Asimov"],"year":1955},{"title":"Bold as Love","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-bold-as-love-2-30.jpg?w=436","shows_english_title":true,"authors":["Gwyneth Jones"],"year":2001,"books":[{"title":"Bold as Love","year":2001,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-bold-as-love-2-30.jpg?w=436"},{"title":"Castles Made of Sand","year":2002,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2020/07/hbg-title-castles-made-of-sand-20.jpg?w=440"},{"title":"Midnight Lamp","year":2003,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/02/hbg-title-midnight-lamp-11.jpg?w=440"},{"title":"Band of Gypsys","year":2005,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/02/hbg-title-band-of-gypsys-11.jpg?w=438"},{"title":"Rainbow Bridge","year":2006,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2021/02/hbg-title-rainbow-bridge-11.jpg?w=439"}]}],"image":"124-future-history-of-earth.webp","definition":"Works tracing a sustained future course of Earth and Earthbound humanity.","status":"accepted"},{"id":"hard-conceptual-sf","label":"Hard Conceptual SF","parent":"hard-sf","children":[],"works":[{"title":"Inverted World","year":1974,"authors":["Christopher Priest"],"cover_url":"https://covers.openlibrary.org/b/id/2950338-L.jpg","shows_english_title":true,"placement_note":"SFE Priest calls it a major pure-SF novel whose hyperboloid world, hard-SF time distortion, and pocket-universe geometry drive the conceptual breakthrough. Its mathematical topology is the engine, so Mathematics is the exact existing leaf."},{"title":"Observer","cover_url":"https://cdn.waterstones.com/bookjackets/large/9781/2503/9781250376466.jpg","shows_english_title":true,"authors":["Robert Lanza","Nancy Kress"],"year":2023},{"title":"Brain Wave","cover_url":"https://book-assets.openroadmedia.com/9781504053679.jpg","shows_english_title":true,"authors":["Poul Anderson"],"year":1954},{"title":"Exhalation","cover_url":"https://covers.openlibrary.org/b/id/8793546-L.jpg","shows_english_title":true,"authors":["Ted Chiang"],"year":2019,"placement_note":"Penguin Random House describes nine idea-driven stories tackling humanity's oldest questions and new quandaries; SFE emphasizes Chiang's formal intellectual control across time, artificial intelligence, entropy and free will. The rigorous thought-experiment is the common engine, making Hard Conceptual SF the closest leaf."},{"title":"Galaxies","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/11/hbg-title-galaxies-10.jpg","shows_english_title":true,"authors":["Barry N. Malzberg"],"year":1975,"placement_note":"SFE describes a corpse-laden ship falling into a galaxy-sized black hole and the novel's self-conscious critique of SF; Anti-Oedipus calls it metafictional and absurdist, entwining technology, cyborgs, bureaucracy and tachyons. Its rigorous recursion between impossible cosmic premise and the act of writing it makes Hard Conceptual SF closest."},{"title":"Stories of Your Life and Others","cover_url":"https://images1.penguinrandomhouse.com/cover/9781101972120","shows_english_title":true,"authors":["Ted Chiang"],"year":2002,"placement_note":"SFE calls this one of the field’s most remarkable collections and emphasizes lucid cognitive rigor across topology, mathematics, linguistics, time, intelligence, golems and theological world-models; Pan Macmillan describes scientific rationalism across eight diverse stories. The shared engine is the rigorous thought experiment, making Hard Conceptual SF closest despite some fantasy cosmologies."},{"title":"Tau Zero","cover_url":"https://book-assets.openroadmedia.com/9781504053709.jpg","shows_english_title":true,"authors":["Poul Anderson"],"year":1970,"placement_note":"SFE calls its cosmological thought experiment strikingly conceived: a damaged relativistic starship accelerates through galaxies, the universe’s contraction and a new Big Bang. Open Road details real relativity, time dilation and a non-FTL Bussard voyage. The rigorous conceptual model of physics and cosmology governs, making Hard Conceptual SF exact."},{"title":"The Gods Themselves","cover_url":"cover-the-gods-themselves.jpg","shows_english_title":true,"authors":["Isaac Asimov"],"year":1972,"placement_note":"PRH and Hachette ground the Electron Pump as matter exchange with a parallel universe governed by different physical laws; the imbalance will drive the Sun to explode. The rigorous cross-universe energy model and its physical consequence govern over the alien-contact plot."}],"image":"89-mathematics.webp","definition":"Hard science fiction built around a rigorous conceptual world-model whose recognition drives the story.","status":"accepted"},{"id":"military-science-fiction","label":"Military science fiction","parent":"spacefaring-fiction","children":[],"works":[{"title":"Ender's Game","cover_url":"https://mpd-biblio-covers.imgix.net/9780765394866.jpg","shows_english_title":true,"authors":["Orson Scott Card"],"year":1985,"books":[{"title":"Ender's Game","year":1985,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765394866.jpg","shows_english_title":true},{"title":"Speaker for the Dead","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/183878-L.jpg","shows_english_title":true},{"title":"Xenocide","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/14525021-L.jpg","shows_english_title":true},{"title":"Children of the Mind","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/10162706-L.jpg","shows_english_title":true}]},{"title":"In the Black","cover_url":"https://mpd-biblio-covers.imgix.net/9781250302755.jpg","shows_english_title":true,"authors":["Patrick S. Tomlinson"],"year":2020},{"title":"Old Man's War","cover_url":"https://ik.imagekit.io/panmac/tr:di-placeholder_portrait_aMjPtD9YZ.jpg,tr:w-350,f-jpg,pr-true/edition/9780330538169.jpg","shows_english_title":true,"authors":["John Scalzi"],"year":2005,"books":[{"title":"Old Man's War","year":2005,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765309402-L.jpg"},{"title":"The Ghost Brigades","year":2006,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765315021-L.jpg"},{"title":"The Last Colony","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/10376230-L.jpg"},{"title":"Zoe's Tale","year":2008,"cover_url":"https://covers.openlibrary.org/b/isbn/9780765356192-L.jpg"},{"title":"The Human Division","year":2013,"cover_url":"https://www.publishersweekly.com/cover/9780765333513"},{"title":"The End of All Things","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/10317952-L.jpg"}]},{"title":"Starship Troopers","cover_url":"https://www.orionbooks.co.uk/wp-content/uploads/2018/07/hbg-title-starship-troopers-167.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1959},{"title":"The Forever War","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-the-forever-war-2-178.jpg","shows_english_title":true,"authors":["Joe Haldeman"],"year":1974,"books":[{"title":"The Forever War","year":1974},{"title":"Forever Free","year":1999}]},{"title":"Ninefox Gambit","cover_url":"https://covers.openlibrary.org/b/id/13354287-L.jpg","shows_english_title":true,"authors":["Yoon Ha Lee"],"year": de of Magic","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/7410930-L.jpg"},{"title":"A Gathering of Shadows","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/7990183-L.jpg"},{"title":"A Conjuring of Light","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/7990184-L.jpg"}]},{"title":"The Hollow Places","cover_url":"cover-hollow-places.jpg","shows_english_title":true,"authors":["T. Kingfisher"],"year":2020,"placement_note":"Walk: Speculative fiction -> Fantasy -> Portal fantasy -> Fantasy rifts -> Multiverse fantasy. Simon & Schuster grounds a hole in a contemporary museum wall opening into a liminal bunker with portals to countless alternate realities haunted by thought-hearing creatures. The system of many worlds, reached through an uncanny rupture, makes Multiverse fantasy exact."}],"image":"222-multiverse-fantasy.webp","definition":"Portal fantasy whose premise is a system of many worlds - shadow realms, parallel Londons, the multiverse as cosmology - with order and chaos in play across them (Moorcock's line; SFE 'Multiverse'). One hidden world revealed is the sibling shelf, Otherworld fantasy.","status":"accepted"},{"id":"otherworld-fantasy","label":"Otherworld fantasy","parent":"fantasy-rifts","children":[],"works":[{"title":"Piranesi","cover_url":"https://covers.openlibrary.org/b/id/10226290-L.jpg","shows_english_title":true,"authors":["Susanna Clarke"],"year":2020},{"title":"The Fionavar Tapestry","cover_url":"https://covers.openlibrary.org/b/id/295003-L.jpg","shows_english_title":true,"authors":["Guy Gavriel Kay"],"year":1984,"books":[{"title":"The Summer Tree","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/295003-L.jpg"},{"title":"The Wandering Fire","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/295006-L.jpg"},{"title":"The Darkest Road","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/295011-L.jpg"}],"placement_note":"Kay’s official site calls the trilogy High Fantasy in the Tolkien tradition but also states that five young Canadians are taken to Fionavar, the first of all worlds. Cross-world transport structures the trilogy, making Portal fantasy its highest defining fit."},{"title":"Three Hearts and Three Lions","cover_url":"https://covers.openlibrary.org/b/id/407701-L.jpg","shows_english_title":true,"authors":["Poul Anderson"],"year":1961,"placement_note":"SFE calls it a Parallel World fantasy in which a WWII Earthman is translated into Faerie; the rupture from wartime Denmark to the magical Middle World structures the story."},{"title":"A Peculiar Peril","cover_url":"https://covers.openlibrary.org/b/id/10520614-L.jpg","shows_english_title":true,"authors":["Jeff VanderMeer"],"year":2020},{"title":"Imajica","cover_url":"https://cdn.waterstones.com/bookjackets/large/9780/0061/9780006178040.jpg","shows_english_title":true,"authors":["Clive Barker"],"year":1991,"placement_note":"Barker describes Earth as one of five Dominions, cut off from its magical siblings, while Harper calls the novel a voyage to worlds beyond ours through mythic horror, ghosts, the human and the divine. Passage from Earth into the hidden Dominions occurs through uncanny ruptures, making Eldritch Rifts closest."},{"title":"Lilith","cover_url":"https://eerdmans-publishing-us.imgix.net/covers/9780802860613.jpg?auto=format&w=1200","shows_english_title":true,"authors":["George MacDonald"],"year":1895,"placement_note":"Eerdmans describes Mr. Vane passing through a large old mirror into another world five times; SFE describes parallel universes in a four-dimensional frame, with mirrors and doppelgangers central. An occult mirror crossing between realities makes Fantasy rifts exact."},{"title":"Lud-in-the-Mist","authors":["Hope Mirrlees"],"year":1926,"cover_url":"https://store.gollancz.co.uk/cdn/shop/products/9781473225565-original.jpg?v=1770801448","shows_english_title":true,"placement_note":"Hachette/Gollancz: practical Lud borders Faerie; smuggled fairy-fruit bewilders children into disappearing there and the mayor must confront the hidden realm. One hidden mythic world behind ours - the Otherworld fantasy pattern exactly. Placed under Gustav's 2026-09-20 Fantasy rifts partition ruling."},{"title":"Red Moon and Black Mountain","cover_url":"https://covers.openlibrary.org/b/id/6450072-L.jpg","shows_english_title":true,"authors":["Joy Chant"],"year":1970,"placement_note":"Three children cross from our world into the hidden Starlit Land of Kendrinh, where sorcery and a struggle for rule await; one coherent mythic Otherworld rather than a system of many worlds."},{"id":"the-coming-race","title":"The Coming Race","authors":["Edward Bulwer-Lytton"],"year":1871,"cover_url":"cover-the-coming-race.webp","shows_english_title":true,"placement_note":"The narrator begins on Victorian Earth, descends through a mine and cavern, and discovers one concealed subterranean Vril-ya world. Gustav ruled Vril is magic on 2026-09-21 because no real-world scientists ever studied it. One hidden magical world behind ours makes Otherworld fantasy exact.","sources":["https://sf-encyclopedia.com/entry/bulwer_lytton_edward","https://sf-encyclopedia.com/entry/vril"]},{"id":"the-dark-world","title":"The Dark World","authors":["Henry Kuttner","C. L. Moore"],"year":1946,"cover_url":"cover-the-dark-world.webp","shows_english_title":true,"placement_note":"SFE identifies it as archetypal hybrid science fantasy in the parallel-world tradition; Hachette sends WWII veteran Edward Bond through the need-fire portal into one magical mirror of Earth populated by werewolves, wizards and witches. One coherent hidden magical Otherworld makes this leaf exact.","sources":["https://sf-encyclopedia.com/entry/kuttner_henry","https://sf-encyclopedia.com/entry/parallel_worlds","https://www.hachette.co.uk/titles/henry-kuttner/the-dark-world/9780575128897/"]}],"image":"223-otherworld-fantasy.webp","definition":"Portal fantasy in which one hidden mythic world lies behind ours, waiting to be found, revealed or reconciled (Encyclopedia of Fantasy 'Otherworld', the Faerie line). A system of many worlds is the sibling shelf, Multiverse fantasy.","status":"accepted"},{"id":"secret-history","label":"Secret history","parent":"historical-fantasy","children":[],"works":[{"title":"Declare","cover_url":"https://www.topshelfbooks.com/assets/images/product/9645762fc7953cafd8f201131046ebd6.jpg","shows_english_title":true,"authors":["Tim Powers"],"year":2000},{"title":"The Aegypt Cycle","cover_url":"https://covers.openlibrary.org/b/id/14550542-L.jpg","shows_english_title":true,"authors":["John Crowley"],"year":1987,"books":[{"title":"Aegypt","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/10137373-L.jpg"},{"title":"Love & Sleep","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/13240156-L.jpg"},{"title":"Daemonomania","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/8281535-L.jpg"},{"title":"Endless Things","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/957060-L.jpg"}]},{"title":"The Once and Future Witches","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316422017.jpg","shows_english_title":true,"authors":["Alix E. Harrow"],"year":2020},{"title":"The Diabolist's Library","cover_url":"https://covers.openlibrary.org/b/id/14454987-L.jpg","shows_english_title":true,"authors":["Molly Tanzer"],"year":2017,"books":[{"title":"Creatures of Will and Temper","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/14454987-L.jpg","shows_english_title":true},{"title":"Creatures of Want and Ruin","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/8813142-L.jpg","shows_english_title":true},{"title":"Creatures of Charm and Hunger","year":2020,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780358065210","shows_english_title":true}]},{"title":"The Innsmouth Legacy","cover_url":"https://mpd-biblio-covers.imgix.net/9780765390905.jpg","shows_english_title":true,"authors":["Ruthanna Emrys"],"year":2017,"books":[{"title":"Winter Tide","year":2017,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765390905.jpg","shows_english_title":true},{"title":"Deep Roots","year":2018,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765398093.jpg","shows_english_title":true}]},{"title":"The Baroque Cycle","cover_url":"https://covers.openlibrary.org/b/id/274243-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2003,"placement_note":"SFE stephenson_neal: the Baroque Cycle is couched as historical novels but 'do have fantastical elements' - the possibly Immortal Enoch Root, who may be a Secret Master monitoring the creation of modernity. Hidden fantastical thread beneath documented Enlightenment history. Shelfmates Declare, The Aegypt Cycle.","books":[{"title":"Quicksilver","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/274243-L.jpg"},{"title":"The Confusion","year":2004,"cover_url":"https://sf-encyclopedia.com/gallery.php?id=Stephenson-Baroque2.jpg"},{"title":"The System of the World","year":2004,"cover_url":"https://sf-encyclopedia.com/gallery.php?id=Stephenson-Baroque3.jpg"}]}],"image":"136-secret-history.webp","definition":"Historical fantasy in which documented history is secretly explained by a hidden magical truth, and secrecy itself is a main theme. Open or publicly known magic does not qualify.","status":"accepted"},{"id":"rococo-fantasy","label":"Rococo fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"The Kingdom of Back","cover_url":"https://images.booksense.com/images/010/739/9781524739010.jpg","shows_english_title":true,"authors":["Marie Lu"],"year":2020}],"image":"137-rococo-fantasy.webp","definition":"Fantasy of the Rococo world: eighteenth-century courtly and musical Europe, with its ornate salons, manners, artifice and fairy-tale elegance.","status":"accepted"},{"id":"andalusian-fantasy","label":"Andalusian fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"The Bird King","cover_url":"https://groveatlantic.com/core/wp-content/uploads/2018/03/BirdKingHC_Front.jpg","shows_english_title":true,"authors":["G. Willow Wilson"],"year":2019}],"image":"138-andalusian-fantasy.webp","definition":"Historical fantasy rooted in medieval Muslim Iberia and the cultures, courts and conflicts of Al-Andalus, including the final Kingdom of Granada.","status":"accepted"},{"id":"period-fantasy","label":"Period fantasy","parent":"historical-fantasy","children":["antique-times-fantasy","industrial-age-fantasy"],"works":[],"image":"140-period-fantasy.webp","definition":"Historical fantasy anchored to a documented era, whose source is chronicles and recorded history; the era is the stage, not a puzzle secretly explained or rewritten.","status":"umbrella"},{"id":"antique-times-fantasy","label":"Antique times fantasy","parent":"period-fantasy","children":["celtic-fantasy","viking-fantasy","autumn-kingdoms","andalusian-fantasy","renaissance-fantasy","rococo-fantasy"],"works":[],"image":"265-antique-times-fantasy.webp","definition":"Umbrella for Period fantasy set before 1788, spanning the post-Roman, Viking, medieval, Renaissance, Andalusian and Rococo historical stages.","status":"umbrella"},{"id":"industrial-age-fantasy","label":"Industrial age fantasy","parent":"period-fantasy","children":["gaslight-fantasy","weird-west-fantasy","tudorbethan-fantasy","dust-bowl-fantasy","neon-fantasy"],"works":[],"image":"266-industrial-age-fantasy.webp","definition":"Umbrella for Period fantasy set from 1788 onward, from the Regency and industrial nineteenth century through the interwar, Depression and late-twentieth-century eras.","status":"umbrella"},{"id":"neon-fantasy","label":"Neon fantasy","parent":"industrial-age-fantasy","children":[],"works":[{"id":"the-angels-of-l19","title":"The Angels of L19","authors":["Jonathan Walker"],"year":2021,"cover_url":"cover-the-angels-of-l19.webp","shows_english_title":true,"placement_note":"Weather Glass Books sets the novel in Liverpool in 1984, amid Thatcher-era politics, youth culture and evangelical life, with angelic and demonic visitations. Its specific 1980s social texture and supernatural intrusion make Neon fantasy the exact leaf.","sources":["https://weatherglassbooks.com/shop/the-angels-of-l19"]}],"image":"263-neon-fantasy.webp","definition":"1980s-era historical fantasy in which neon, analogue media, youth culture and late-Cold-War social textures form the stage for supernatural intrusion - the Stranger Things texture.","status":"accepted"},{"id":"alternate-history-fantasy","label":"Alternate history fantasy","parent":"historical-fantasy","children":[],"works":[{"title":"The Tales of Alvin Maker","cover_url":"https://covers.openlibrary.org/b/id/9315050-L.jpg","shows_english_title":true,"authors":["Orson Scott Card"],"year":1987,"books":[{"title":"Seventh Son","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/9315050-L.jpg","shows_english_title":true},{"title":"Red Prophet","year":1988,"cover_url":"https://covers.openlibrary.org/b/id/9315058-L.jpg","shows_english_title":true},{"title":"Prentice Alvin","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/14476036-L.jpg","shows_english_title":true},{"title":"Alvin Journeyman","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/6382372-L.jpg","shows_english_title":true},{"title":"Heartfire","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/10620724-L.jpg","shows_english_title":true},{"title":"The Crystal City","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/9315019-L.jpg","shows_english_title":true}],"placement_note":"SFE describes this as an Alternate-History early nineteenth-century USA where folk magic is efficacious; Macmillan likewise centers frontier America transformed by working magic."},{"title":"Temeraire","cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359549","shows_english_title":true,"authors":["Naomi Novik"],"year":2006,"books":[{"title":"His Majesty's Dragon","year":2006,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359549","shows_english_title":true},{"title":"Throne of Jade","year":2006,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359556","shows_english_title":true},{"title":"Black Powder War","year":2006,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359563","shows_english_title":true},{"title":"Empire of Ivory","year":2007,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359570","shows_english_title":true},{"title":"Victory of Eagles","year":2008,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359587","shows_english_title":true},{"title":"Tongues of Serpents","year":2010,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359594","shows_english_title":true},{"title":"Crucible of Gold","year":2012,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359600","shows_english_title":true},{"title":"Blood of Tyrants","year":2013,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359617","shows_english_title":true},{"title":"League of Dragons","year":2016,"cover_url":"https://images2.penguinrandomhouse.com/cover/9780593359624","shows_english_title":true}]},{"title":"Dead Djinn Universe","cover_url":"https://covers.openlibrary.org/b/id/10457293-L.jpg","shows_english_title":true,"authors":["P. Djèlí Clark"],"year":2016,"books":[{"title":"A Dead Djinn in Cairo","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8542858-L.jpg"},{"title":"The Haunting of Tram Car 015","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/8566730-L.jpg"},{"title":"A Master of Djinn","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/10457293-L.jpg"}]},{"title":"Angel Mage","cover_url":"https://covers.openlibrary.org/b/id/8792047-L.jpg","shows_english_title":true,"authors":["Garth Nix"],"year":2019},{"title":"Burn","cover_url":"https://covers.openlibrary.org/b/id/10097446-L.jpg","shows_english_title":true,"authors":["Patrick Ness"],"year":2020,"placement_note":"Ness's official synopsis sets the novel in 1957 with farm-working dragons, prophecy, a dragon-worshipping cult, an assassin and FBI agents. Working dragons and prophecy openly transform mid-century America, so magic is the history-rewriting engine."},{"title":"Sorcerer Royal","cover_url":"https://images4.penguinrandomhouse.com/cover/9780425283400","shows_english_title":true,"authors":["Zen Cho"],"year":2015,"books":[{"title":"Sorcerer to the Crown","year":2015,"cover_url":"https://images4.penguinrandomhouse.com/cover/9780425283400"},{"title":"The True Queen","year":2019,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780425283417"}],"placement_note":"SFE identifies an Alternate History Regency Britain with publicly practiced magic and trade with Fairyland; magical institutions and Faerie politics openly restructure the world."},{"title":"Summerland","cover_url":"https://mpd-biblio-covers.imgix.net/9781250178947.jpg","shows_english_title":true,"authors":["Hannu Rajaniemi"],"year":2018,"placement_note":"SFE explicitly calls it an Alternate History Europe before World War II; Tor sets it in 1938 after discovery of an exploitable afterlife lets the British Empire colonize the dead and the USSR build a god. The public supernatural order rewrites geopolitics and history, making Alternate-history fantasy exact rather than period atmosphere or secret history."},{"title":"Dominion of the Fallen","cover_url":"cover-house-shattered-wings.jpg","shows_english_title":true,"authors":["Aliette de Bodard"],"year":2015,"books":[{"title":"The House of Shattered Wings","year":2015,"cover_url":"cover-house-shattered-wings.jpg","shows_english_title":true},{"title":"The House of Binding Thorns","year":2017,"cover_url":"cover-house-binding-thorns.jpg","shows_english_title":true},{"title":"The House of Sundering Flames","year":2019,"cover_url":"cover-house-sundering-flames.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Alternate history fantasy. The author grounds a Paris devastated by a magical war, governed by rival Houses of Fallen angels, magicians and dragons; the openly rewritten world and magical politics govern over Gothic atmosphere. The House of Sundering Flames is book 3, so one complete three-novel series card prevents duplication."}],"image":"139-alternate-history-fantasy.webp","definition":"Divergent timelines where magic is the engine: history is openly rewritten and the world runs on magic.","status":"accepted"},{"id":"books-in-books","label":"Books in Books","parent":"fabulation","children":["contradiction-fiction","meta-remyth","textual-trespass"],"works":[],"image":"141-books-in-books.webp","definition":"Umbrella for fabulations in which texts destabilize reality, whether invented documents contradict their own worlds or inherited stories are entered, rewritten and replayed.","status":"accepted"},{"id":"contradiction-fiction","label":"Contradiction fiction","parent":"books-in-books","children":[],"works":[{"title":"The Blind Assassin","cover_url":"https://covers.openlibrary.org/b/id/11041760-L.jpg","shows_english_title":true,"authors":["Margaret Atwood"],"year":2000},{"title":"The Prestige","cover_url":"https://covers.openlibrary.org/b/id/8419414-L.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":1995,"placement_note":"SFE calls it sui generis late-twentieth-century Fantastika whose equipoisal stage/literal magic, Tesla matter transmission and unreliable inward narration refuse a stable SF-or-fantasy reading; its self-conscious misdirection makes Fabulation the closest current leaf."},{"title":"A Sick Gray Laugh","cover_url":"https://wordhorde.com/wp-content/uploads/2019/06/sgl_cover_sm-518x800.jpg","shows_english_title":true,"authors":["Nicole Cushing"],"year":2019},{"title":"An American Story","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/01/hbg-title-an-american-story-2-33.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":2018},{"title":"Confessions of the Fox","cover_url":"https://images1.penguinrandomhouse.com/cover/9780399592287","shows_english_title":true,"authors":["Jordy Rosenberg"],"year":2018}],"image":"181-contradiction-fiction.webp","definition":"Books-in-books fiction built around invented documents whose conflicting accounts, omissions or false authority put text and reality at war.","status":"accepted"},{"id":"meta-remyth","label":"Meta Remyth","parent":"books-in-books","children":[],"works":[{"title":"Lord Grandrith / Doc Caliban","cover_url":"https://covers.openlibrary.org/b/id/7376512-L.jpg","shows_english_title":true,"authors":["Philip José Farmer"],"year":1969,"books":[{"title":"A Feast Unknown","year":1969,"cover_url":"https://covers.openlibrary.org/b/id/7376512-L.jpg"},{"title":"Lord of the Trees","year":1970,"cover_url":"https://covers.openlibrary.org/b/id/7748239-L.jpg"},{"title":"The Mad Goblin","year":1970,"cover_url":"https://covers.openlibrary.org/b/id/10370591-L.jpg"}]},{"title":"Ahab's Return; or, The Last Voyage","cover_url":"https://covers.openlibrary.org/b/id/14290189-L.jpg","shows_english_title":true,"authors":["Jeffrey Ford"],"year":2018,"placement_note":"SFE says Ahab survives while Ishmael has written Moby-Dick, then enters a fantasticated New York. Publishers Weekly frames the premise as Moby-Dick being a fictionalized version of reality. By making a canonical novel an unreliable artifact inside its own rewritten continuation, it foregrounds storytelling as the fantastic device, making Fabulation closest."},{"title":"Engine Summer","cover_url":"https://covers.openlibrary.org/b/id/6744965-L.jpg","shows_english_title":true,"authors":["John Crowley"],"year":1979,"placement_note":"SFE reveals that Rush That Speaks and the life he narrates are a memory embedded in a crystal device, replayed on command: the protagonist is the recorded story artifact. That nested narration and ontological reversal make Books in Books more specific than its pastoral post-Holocaust setting."},{"title":"Lavinia","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-lavinia-3-52.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":2008,"placement_note":"SFE says Lavinia depicts Aeneas’s wife, uniquely aware that she is Virgil’s fictional creation; Le Guin’s site says the novel gives the silent Aeneid character a voice in ancient Italy. Because it consciously re-enters and rewrites an inherited text from inside, Meta Remyth is more exact than a general myth retelling."},{"title":"Pride and Prometheus","cover_url":"https://covers.openlibrary.org/b/id/14619682-L.jpg","shows_english_title":true,"authors":["John Kessel"],"year":2018,"placement_note":"Meta-remyth: enters and merges two inherited texts - Pride and Prejudice and Frankenstein - following Mary Bennet into Victor Frankenstein's story and making both live differently (Saga Press; Nebula-winning 2008 story expanded). Shelfmates Lavinia and Ahab's Return."}],"image":"182-meta-remyth.webp","definition":"Second-order books-in-books fiction that enters, rewrites or replays inherited texts and cultural stories, making an existing myth live differently.","status":"accepted"},{"id":"textual-trespass","label":"Textual trespass","parent":"books-in-books","children":[],"works":[{"title":"Thursday Next","cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-eyre-affair-224.jpg","shows_english_title":true,"authors":["Jasper Fforde"],"year":2001,"books":[{"title":"The Eyre Affair","year":2001,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-eyre-affair-224.jpg","shows_english_title":true},{"title":"Lost in a Good Book","year":2002,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-lost-in-a-good-book-129.jpg","shows_english_title":true},{"title":"The Well of Lost Plots","year":2003,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-well-of-lost-plots-122.jpg","shows_english_title":true},{"title":"Something Rotten","year":2004,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-something-rotten-116.jpg","shows_english_title":true},{"title":"First Among Sequels","year":2007,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-first-among-sequels-111.jpg","shows_english_title":true},{"title":"One of Our Thursdays Is Missing","year":2011,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-one-of-our-thursdays-is-missing-128.jpg","shows_english_title":true},{"title":"The Woman Who Died a Lot","year":2012,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-woman-who-died-a-lot-2-28.jpg","shows_english_title":true},{"title":"Dark Reading Matter","year":2026,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2025/12/hbg-title-dark-reading-matter-77.jpg","shows_english_title":true}],"placement_note":"SFE calls Thursday Next an Alternate World sequence whose metafictional topoi interpenetrate its setting: characters enter books, alter them from within, and thereby alter the real world. That story-world feedback makes Fabulation the highest defining trait."},{"title":"Breakfast of Champions","cover_url":"https://images4.penguinrandomhouse.com/cover/9780385334204","shows_english_title":true,"authors":["Kurt Vonnegut"],"year":1973},{"title":"Or What You Will","authors":["Jo Walton"],"year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10126592-L.jpg","shows_english_title":true,"placement_note":"Wikipedia/Tor: Sylvia Harrison's imaginary-friend narrator - the basis of all her characters - plans their immortality through the very book she is writing; a written fiction breaching into lived reality is textual trespass (cf. Thursday Next, Breakfast of Champions)."}],"image":"183-textual-trespass.webp","definition":"Books-in-books fiction where the boundary between a specific text and lived reality is breached, with people entering and altering books or written fictions escaping into the world.","status":"accepted"},{"id":"classic-fabulation","label":"Classic Fabulation","parent":"fabulation","children":[],"works":[{"title":"The Dead Father","cover_url":"cover-the-dead-father.webp","shows_english_title":true,"authors":["Donald Barthelme"],"year":1975,"placement_note":"Macmillan describes a gargantuan half-dead, half-alive, partly mechanical father dragged by cable on an absurdist journey, stressing Barthelme's freedom to reshape or ignore the world. The impossible world is openly composed by postmodern storytelling, matching Classic Fabulation."},{"title":"Invisible Cities","year":1972,"authors":["Italo Calvino"],"cover_url":"https://archive.org/download/invisiblecitie00calv/page/cover.jpg","shows_english_title":true,"placement_note":"SFE Calvino describes the book as fragmented Marco Polo voyages to surreal cities not actually visited; SFE Fabulation explicitly lists Calvino and defines the mode by foregrounding how stories construct worlds."},{"title":"Cosmicomics","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780241573709/9780241573709-jacket-large.jpg","shows_english_title":true,"authors":["Italo Calvino"],"year":1965},{"title":"Labyrinths","cover_url":"https://covers.openlibrary.org/b/id/12856936-L.jpg","shows_english_title":true,"authors":["Jorge Luis Borges"],"year":1962,"placement_note":"SFE identifies Labyrinths as a major English selection combining Ficciones and El Aleph stories, including the Library of Babel, Tlön and other metaphysical inventions; New Directions calls it trans-genre, multi-layered and self-referential. Its fictions make imagined books, libraries, branching time and invented worlds into the machinery of storytelling itself, matching foundational Classic Fabulation."},{"title":"The Castle","cover_url":"https://images3.penguinrandomhouse.com/cover/9780241678916","shows_english_title":true,"authors":["Franz Kafka"],"year":1926,"placement_note":"SFE identifies Kafka’s unfinished novel as Absurdist SF: K assaults the fog-shrouded Castle bureaucracy while the world becomes an endless office of transaction. Its inaccessible center and administrative logic compose reality itself."},{"title":"The Cornelius Quartet","cover_url":"cover-final-programme.jpg","shows_english_title":true,"authors":["Michael Moorcock"],"year":1968,"books":[{"title":"The Final Programme","year":1968,"cover_url":"cover-final-programme.jpg","shows_english_title":true},{"title":"A Cure for Cancer","year":1971,"cover_url":"cover-cure-for-cancer.jpg","shows_english_title":true},{"title":"The English Assassin","year":1972,"cover_url":"cover-english-assassin.jpg","shows_english_title":true},{"title":"The Condition of Muzak","year":1977,"cover_url":"cover-condition-of-muzak.jpg","shows_english_title":true}],"placement_note":"SFE treats the revised central quartet as formally cumulative: Jerry and his recurring troupe move through increasingly unstable Londons under SF/fantasy manipulation, Law/Chaos and multiversal escape. Narrative revision and shifting world-making govern more than the opening novel’s super-science plot, fitting Classic Fabulation."}],"image":"203-classic-fabulation.webp","definition":"Foundational fabulations in which storytelling and cosmological invention openly compose the world, rather than merely describing a stable reality.","status":"accepted"},{"id":"inner-space","label":"Inner Space","parent":"fabulation","children":["psychogeographic-fabulation","consciousness-fiction","projected-realities"],"works":[],"image":"204-inner-space.webp","definition":"Fabulations in which desire, memory, trauma or altered perception projects a competing reality, with no stable boundary between psyche and world.","status":"umbrella"},{"id":"body-myth","label":"Body Myth","parent":"fabulation","children":[],"works":[{"title":"The Passion of New Eve","cover_url":"https://covers.openlibrary.org/b/id/11949528-L.jpg","shows_english_title":true,"authors":["Angela Carter"],"year":1977},{"title":"Every Bone a Prayer","cover_url":"https://covers.openlibrary.org/b/id/10373432-L.jpg","shows_english_title":true,"authors":["Ashley Blooms"],"year":2020,"placement_note":"Blooms describes Misty's literal empathic speech with animals, buildings and the land, alongside unexplained objects and transformations in an Appalachian holler. The author calls the work fabulism or slipstream rather than magical realism; its unstable exchange between trauma, landscape and impossible material change fits Worlds in flux."},{"title":"The Breast","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780099477518/9780099477518-jacket-large.jpg","shows_english_title":true,"authors":["Philip Roth"],"year":1972},{"title":"The Einstein Intersection","cover_url":"272-the-einstein-intersection.jpg","shows_english_title":true,"authors":["Samuel R. Delany"],"year":1967,"placement_note":"SFE and Wesleyan ground posthuman aliens inhabiting transformed human bodies while replaying Orpheus, Theseus, Christ and other human myths. Bodily difference and inherited myth remake this emptied Earth together, making Body myth exact."}],"image":"205-body-myth.webp","definition":"Fabulations in which bodily identity and transformation become a mythic or cosmological force that remakes the surrounding world.","status":"accepted"},{"id":"alternate-worlds","label":"Alternate Worlds","parent":"fabulation","children":[],"works":[{"title":"Ada or Ardor","cover_url":"https://covers.openlibrary.org/b/id/14381967-L.jpg","shows_english_title":true,"authors":["Vladimir Nabokov"],"year":1969},{"title":"Cities of the Red Night","cover_url":"https://covers.openlibrary.org/b/isbn/9780141189932-L.jpg","shows_english_title":true,"authors":["William S. Burroughs"],"year":1981,"books":[{"title":"Cities of the Red Night","year":1981,"cover_url":"https://covers.openlibrary.org/b/isbn/9780141189932-L.jpg"},{"title":"The Place of Dead Roads","year":1984,"cover_url":"https://covers.openlibrary.org/b/isbn/9780141189796-L.jpg"},{"title":"The Western Lands","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/2385910-L.jpg"}]}],"image":"206-alternate-worlds.webp","definition":"Literary fabulations whose alternate Earths destabilize memory, geography and history, rather than mechanism-centered parallel-world travel or conventional counterfactual history.","status":"accepted"},{"id":"godgame","label":"Godgame","parent":"fabulation","children":[],"works":[{"title":"Fourth Mansions","cover_url":"https://covers.openlibrary.org/b/id/926710-L.jpg","shows_english_title":true,"authors":["R. A. Lafferty"],"year":1969,"placement_note":"SFE describes dreamlike arcane clues, competing supernatural cabals, mythic archetypes and a Godgame whose outcome changes the moral nature of reality. The visibly unstable pattern of reality makes Worlds in flux the closest leaf."}],"image":"207-godgame.webp","definition":"Fabulations in which rival occult or godlike powers contest and alter the hidden moral pattern of reality as a game.","status":"accepted"},{"id":"renaissance-fantasy","label":"Renaissance fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"The Drawing of the Dark","cover_url":"cover-the-drawing-of-the-dark.webp","shows_english_title":true,"authors":["Tim Powers"],"year":1979,"placement_note":"SFE calls it outright fantasy and grounds Merlin, a reborn Fisher King and Arthur's avatar defending sixteenth-century Vienna; Penguin places Duffy amid the historical Ottoman siege, ifrits, dwarfs, Vikings and ancient supernatural forces. The documented 1529 Renaissance setting governs."},{"title":"Ariosto","cover_url":"https://covers.openlibrary.org/b/id/7424286-L.jpg","shows_english_title":true,"authors":["Chelsea Quinn Yarbro"],"year":1980},{"title":"Black Magic","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9781529956351/9781529956351-jacket-large.jpg","shows_english_title":true,"authors":["Marjorie Bowen"],"year":1909},{"title":"Lent","cover_url":"https://mpd-biblio-covers.imgix.net/9780765379078.jpg","shows_english_title":true,"authors":["Jo Walton"],"year":2019,"placement_note":"SFE describes real Savonarola in a richly conceived fantasy Florence where supernatural creatures and true prophecies exist, later branching into alternate versions; Tor calls it a magical reimagining of the man who remade fifteenth-century Florence. Actual demons, miracles and magic anchored to Renaissance history make Renaissance fantasy the closest leaf."}],"image":"144-renaissance-fantasy.webp","definition":"Fantasy anchored to Renaissance history, culture and personalities.","status":"accepted"},{"id":"autumn-kingdoms","label":"Autumn Kingdoms","parent":"antique-times-fantasy","children":[],"works":[{"title":"Armed in Her Fashion","cover_url":"https://covers.openlibrary.org/b/id/8841142-L.jpg","shows_english_title":true,"authors":["Kate Heartfield"],"year":2018}],"image":"143-medieval-fantasy.webp","definition":"Fantasy set in fourteenth-century Europe before the Black Death, framed as Huizinga's autumn of the Middle Ages: medieval kingdoms at their ornate height, already approaching rupture.","status":"accepted"},{"id":"tudorbethan-fantasy","label":"Tudorbethan fantasy","parent":"industrial-age-fantasy","children":[],"works":[{"title":"Lolly Willowes","cover_url":"https://covers.openlibrary.org/b/id/705788-L.jpg","shows_english_title":true,"authors":["Sylvia Townsend Warner"],"year":1926,"placement_note":"Penguin/PRH: in the 1920s Laura Willowes leaves her family for an English country village, turns to witchcraft and makes a pact with the Devil - a founding work of Tudorbethan fantasy under Gustav's 2026-09-21 rename ruling."}],"image":"221-tudorbethan-fantasy.webp","definition":"Interwar English fantasy, roughly 1918-1939, in which the social and regional texture of England anchors the fantastic. Magic-agnostic: the era and place define the leaf, not a required supernatural mode.","status":"accepted"},{"id":"dust-bowl-fantasy","label":"Dust Bowl fantasy","parent":"industrial-age-fantasy","children":[],"works":[{"id":"the-circus-of-dr-lao","title":"The Circus of Dr. Lao","authors":["Charles G. Finney"],"year":1935,"cover_url":"cover-the-circus-of-dr-lao.webp","shows_english_title":true,"placement_note":"Nebraska Press sets the novel in Depression-era Abalone, Arizona, where a strange circus confronts the town with mythical beings made real. Its Southwest setting, Great Depression texture and fantasy spectacle make it the founding work of Dust Bowl fantasy.","sources":["https://www.nebraskapress.unl.edu/bison-books/9780803234949/the-circus-of-dr-lao/","https://sf-encyclopedia.com/entry/finney_charles_g"]}],"image":"264-dust-bowl-fantasy.webp","definition":"Depression-era fantasy of the American Plains and Southwest, where drought, dust, itinerant spectacle and hard-times communities form the historical stage. Magic-agnostic: the period and region define the leaf, not a required supernatural mode.","status":"accepted"},{"id":"court-intrigue","label":"Court intrigue","parent":"political-fantasy","children":["dynastic-intrigues","court-spies","court-statecraft"],"works":[],"image":"159-court-intrigue.webp","definition":"Political fantasy driven by insider struggles within courts, partitioned by whether the engine is dynastic legitimacy, covert court action, or ruler-level statecraft.","status":"accepted"},{"id":"dynastic-intrigues","label":"Dynastic intrigues","parent":"court-intrigue","children":["medieval-dynastic-intrigue","renaissance-dynastic-intrigue","early-modern-dynastic-intrigue"],"works":[],"image":"229-dynastic-intrigues.webp","definition":"Court intrigue driven by succession, contested legitimacy, dynastic rivalry and threats to a ruling house. The label is a provisional descriptive coinage.","status":"umbrella"},{"id":"medieval-dynastic-intrigue","label":"Medieval dynastic intrigue","parent":"dynastic-intrigues","children":[],"works":[{"title":"A Song of Ice and Fire","cover_url":"https://covers.openlibrary.org/b/id/8134208-L.jpg","shows_english_title":false,"authors":["George R. R. Martin"],"year":1996,"books":[{"title":"A Game of Thrones","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/15128814-L.jpg","shows_english_title":true},{"title":"A Clash of Kings","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/8231751-L.jpg"},{"title":"A Storm of Swords","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/14818051-L.jpg","shows_english_title":true},{"title":"A Feast for Crows","year":2005,"cover_url":"https://covers.openlibrary.org/b/id/15141358-L.jpg","shows_english_title":true},{"title":"A Dance with Dragons","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/14818070-L.jpg","shows_english_title":true}]},{"title":"The Forgotten Beasts of Eld","cover_url":"https://covers.openlibrary.org/b/id/11633915-L.jpg","shows_english_title":true,"authors":["Patricia A. McKillip"],"year":1974},{"title":"The Inheritance Trilogy","cover_url":"https://covers.openlibrary.org/b/id/7716902-L.jpg","shows_english_title":true,"authors":["N. K. Jemisin"],"year":2010,"books":[{"title":"The Hundred Thousand Kingdoms","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/7716902-L.jpg"},{"title":"The Broken Kingdoms","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/7360457-L.jpg"},{"title":"The Kingdom of Gods","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/7623354-L.jpg"},{"title":"The Awakened Kingdom","year":2014}]},{"title":"The Folk of the Air","cover_url":"270-the-folk-of-the-air-1.jpg","shows_english_title":true,"authors":["Holly Black"],"year":2018,"books":[{"title":"The Cruel Prince","year":2018,"cover_url":"270-the-folk-of-the-air-1.jpg"},{"title":"The Wicked King","year":2019,"cover_url":"270 ":"Superhero fiction","parent":"soft-science-fiction","children":[],"image":"176-superhero-fiction.webp","definition":"Fiction about extraordinary powered heroes and villains, the institutions around them, and the social consequences of their actions. SFE describes the genre as crystallizing in comics before spreading to books.","status":"candidate","works":[{"title":"Hench","cover_url":"http://www.harpercollins.com/cdn/shop/files/9780062978592_1200x1200.jpg?v=1783604827","shows_english_title":true,"authors":["Natalie Zina Walschots"],"year":2020,"books":[{"title":"Hench","year":2020,"cover_url":"http://www.harpercollins.com/cdn/shop/files/9780062978592_1200x1200.jpg?v=1783604827","shows_english_title":true},{"title":"Villain","year":2026,"cover_url":"https://images.booksense.com/images/936/236/9780063236936.jpg","shows_english_title":true}],"placement_note":"Kirkus describes Anna as an injured supervillain temp who weaponizes data about superhero collateral damage; the sequel continues her story. Superhero systems, villain labor and the consequences of superhuman action are the sequence’s defining machinery."}]},{"id":"social-science-fiction","label":"Social science fiction","parent":"soft-science-fiction","children":[],"works":[{"title":"Flowers for Algernon","cover_url":"https://covers.openlibrary.org/b/id/10320442-L.jpg","shows_english_title":true,"authors":["Daniel Keyes"],"year":1966},{"title":"More Than Human","cover_url":"https://covers.openlibrary.org/b/id/8765093-L.jpg","shows_english_title":true,"authors":["Theodore Sturgeon"],"year":1953},{"title":"The Three Stigmata of Palmer Eldritch","cover_url":"https://covers.openlibrary.org/b/id/14588882-L.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1965},{"title":"Crash","cover_url":"https://covers.openlibrary.org/b/id/6484321-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1973},{"title":"Her Smoke Rose Up Forever","cover_url":"https://tachyonpublications.com/wp-content/uploads/2004/12/Her-Smoke-RGB.jpg","shows_english_title":true,"authors":["James Tiptree Jr."],"year":1990,"placement_note":"SFE calls this a retrospective collection of Tiptree’s major stories and identifies her extraordinary 1970s genre-SF short fiction as her lasting achievement. Tachyon says its eighteen stories explore alienation and gender alongside major SF concerns. Social science fiction is the closest leaf because human psychology and social identity drive its speculative premises."},{"title":"Catherine House","cover_url":"https://covers.openlibrary.org/b/id/9830444-L.jpg","shows_english_title":true,"authors":["Elisabeth Thomas"],"year":2020,"placement_note":"Set explicitly in 1996; a closed college uses plasm, mass hypnosis and psychosexual healing to reshape memory and identity. Modern-day Social science fiction is the closest existing leaf after historical Gothic enforcement."},{"title":"The Embedding","cover_url":"273-the-embedding.jpg","shows_english_title":true,"authors":["Ian Watson"],"year":1973,"placement_note":"SFE calls it the SF linguistics novel par excellence: three linked experiments test Whorfian language/perception through children, an Amazonian people and visiting aliens. Linguistics and anthropology govern over the First Contact subplot."}],"image":"32-social-science-fiction.webp","definition":"Science fiction driven by psychology, sociology, anthropology, linguistics and other social sciences rather than by physical or engineering problems.","status":"provisional"},{"id":"xenolinguistics","label":"Xenolinguistics","parent":"anthropological-science-fiction","children":[],"image":"176-xenolinguistics.webp","definition":"Anthropological science fiction where the encounter runs through language: translation, alien speech, and the ways language shapes thought and culture.","status":"candidate","works":[{"title":"Babel-17","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-babel-17-2-163.jpg","shows_english_title":t

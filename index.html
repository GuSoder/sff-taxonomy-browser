,"shows_english_title":true,"authors":["Jack Williamson"],"year":1948,"placement_note":"Nocturne restructure 2026-09-23 (Gustav ruling): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Dark fantasy -> Torment fantasy -> Primordial torment."}],"image":"243-primordial-predators.webp","status":"accepted","definition":"Torment fantasy driven by an ancient prehuman species or shapeshifting being that hunts its chosen victims across years and generations."},{"id":"undying","label":"Undying","parent":"supernatural-fantasy","children":[],"works":[{"title":"The Case of Charles Dexter Ward","cover_url":"https://covers.openlibrary.org/b/id/8443336-L.jpg","shows_english_title":true,"authors":["H. P. Lovecraft"],"year":1927,"placement_note":"Nocturne restructure 2026-09-23 (Gustav ruling): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Undying."},{"id":"tide-of-stone","title":"Tide of Stone","authors":["Kaaron Warren"],"year":2018,"books":[{"title":"Tide of Stone","year":2018,"cover_url":"cover-tide-of-stone.jpg"}],"cover_url":"cover-tide-of-stone.jpg","placement_note":"Nocturne restructure 2026-09-23 (Gustav ruling): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Undying."},{"title":"Once Was Willem","cover_url":"cover-once-was-willem.jpg","shows_english_title":true,"authors":["M. R. Carey"],"year":2025,"placement_note":"Cosham, 1152, during the Anarchy: grieving parents pay sorcerer Cain Carodoc to raise their dead 12-year-old, and Willem comes back from the grave as a 'monster', then joins other woodland monsters to stop Carodoc's child sacrifices (PW, Locus/Mondor). Necromantic return from the grave, the exact Undying definition. WFA 2026 + Locus Rec Fantasy. Placed by Gustav's 2026-09-24 11:08 ruling."}],"image":"300-undying-v2.webp","status":"accepted","definition":"Supernatural fantasy of unnatural deathlessness gained outside a bargain: necromantic return from the grave, preservation or imposed eternal life."},{"id":"demonic-torment","label":"Demonic torment","parent":"torment-fantasy","children":[],"works":[{"id":"who-made-stevie-crye","title":"Who Made Stevie Crye?","authors":["Michael Bishop"],"year":1984,"cover_url":"cover-who-made-stevie-crye.jpg","shows_english_title":true,"books":[{"title":"Who Made Stevie Crye?","year":1984,"cover_url":"cover-who-made-stevie-crye.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Supernatural fantasy -> Ancient Tormentors -> Demonic horror. A newly widowed Georgia freelance writer's typewriter is demonically possessed and drags her into occult events, typing on its own and transcribing her dreams (Wikipedia; Bookmonkey review). SFE calls it a horror novel with laughs and elements of Recursion; the parody of 1980s horror and the metafiction ride on the demonic torment, which drives the story. Nocturne restructure 2026-09-23 (Gustav ruling): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Dark fantasy -> Torment fantasy -> Demonic torment."},{"title":"Temper","cover_url":"https://www.nickydrayden.com/images/books/temper.jpg","shows_english_title":true,"authors":["Nicky Drayden"],"year":2018,"placement_note":"The author explicitly calls it genre-blending dark fantasy in an alternate Cape Town: twin brothers are branded by socially assigned virtues/vices and battle literal demons amid oppression. Publishers Weekly confirms violent mystical forces, twisted prophecy and cataclysmic change. It passes Fantasy -> Real Earth Universe -> Supernatural dark; demonic possession and moral horror make Dark fantasy closest. Nocturne restructure 2026-09-23 (Gustav ruling): Speculative fiction -> Fantasy -> Real Earth Universe -> Nocturne fantasy -> Dark fantasy -> Torment fantasy -> Demonic torment."}],"image":"245-demonic-horror.webp","status":"accepted","definition":"Torment fantasy driven by a demon that attaches to and torments specific people without necessarily being Satanic."},{"id":"psychogeographic-fabulation","label":"Psychogeographic fabulation","parent":"inner-space","children":[],"works":[{"title":"The Day of Creation","cover_url":"cover-the-day-of-creation.webp","shows_english_title":true,"authors":["J. G. Ballard"],"year":1987,"placement_note":"SFE calls it less overtly fantastic: Mallory inadvertently causes a new river across an imaginary African war zone; Harper centers his obsessive journey to the source of his own creation. The impossible river and transformed landscape externalize obsession, making mind and place inseparable."},{"title":"Lanark: A Life in Four Books","cover_url":"https://canongate.co.uk/wp-content/uploads/2026/06/lanark-642x1024.jpg","shows_english_title":true,"authors":["Alasdair Gray"],"year":1981,"placement_note":"SFE describes Lanark as equipoisal Fantastika whose Alice-like intercalendrical Zone and Time Distortion emphasize its non-SF character; Canongate calls it a modern vision of hell interweaving realistic Glasgow with disintegrating Unthank. Its double protagonist and unstable boundary between damaged psyche, autobiography and impossible city make Inner Space the closest leaf."},{"title":"Only Forward","authors":["Michael Marshall Smith"],"year":1994,"cover_url":"https://covers.openlibrary.org/b/id/372870-L.jpg","shows_english_title":true},{"title":"The Infernal Desire Machines of Doctor Hoffman","cover_url":"https://covers.openlibrary.org/b/id/12699047-L.jpg","shows_english_title":true,"authors":["Angela Carter"],"year":1972},{"title":"The Bridge","cover_url":"https://iainbanks.co.uk/wp-content/uploads/featured-bridge.webp","shows_english_title":true,"authors":["Iain Banks"],"year":1986},{"title":"The Escapement","cover_url":"275-the-escapement.jpg","shows_english_title":true,"authors":["Lavie Tidhar"],"year":2021,"placement_note":"SFE and Tachyon ground a father leaving his dying son’s hospital bedside for a shifting parallel Western dreamscape whose clowns, toys, monsters and quest for a healing flower externalize grief. Impossible journey and damaged psyche are inseparable, making Psychogeographic fabulation exact."},{"title":"The Evidence","cover_url":"276-the-evidence.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":2020,"placement_note":"SFE identifies the Dream Archipelago as psychic terrain and The Evidence’s trip to Dearth as entangling narrator Todd Fremde in a displaced murder. Gollancz grounds unstable time, contradictory institutions and forgotten crime; island geography and perception make the mystery possible."},{"title":"Airside","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1399608835.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":2023,"placement_note":"A 1949 Hollywood star vanishes airside at Heathrow; airports as liminal null space (LA Review of Books, Locus). Place-driven Priest fabulation beside The Evidence."}],"image":"246-psychogeographic-fabulation.webp","status":"leaf","definition":"Fabulation in which an impossible city or journey externalizes a character's damaged psyche, desire or dream life until place and mind become inseparable."},{"id":"consciousness-fiction","label":"Consciousness fiction","parent":"inner-space","children":["visionary-minds","unmoored-selves"],"works":[],"image":"247-consciousness-fiction.webp","status":"leaf","definition":"Speculative fiction in which altered, divided or nonordinary consciousness destabilizes time, identity and the reality experienced by the mind, divided between visionary perception and unmoored selves."},{"id":"projected-realities","label":"Projected realities","parent":"inner-space","children":[],"works":[{"title":"Destroy All Monsters","cover_url":"https://images.booksense.com/images/748/456/9780062456748.jpg","shows_english_title":true,"authors":["Sam J. Miller"],"year":2019,"placement_note":"SFE describes Darkside as either a parallel world or a trauma-born delusion, while Harper presents two overlapping realities whose friends rescue each other through recovered memory. Its reality remains visibly unstable rather than settling into a literal SF mechanism."},{"title":"Peaces","cover_url":"https://covers.openlibrary.org/b/id/10478791-L.jpg","shows_english_title":true,"authors":["Helen Oyeyemi"],"year":2021,"placement_note":"NPR: a bizarre interstitial space between a surrealist narrative and a real one; Kirkus: surrealist tale of being haunted by the past. Otto and Xavier Shin board the sleeper train The Lucky Day and reality stops cohering - no stable boundary between psyche and world, memory projecting a competing reality: exactly inner-space. NYT stresses it is NOT a fairy tale (kept out of fairy-tale-revision where Gingerbread sits). Shelfmates: Lanark, Only Forward."},{"title":"The Unconsoled","cover_url":"cover-the-unconsoled.jpg","shows_english_title":true,"authors":["Kazuo Ishiguro"],"year":1995,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Projected realities. SFE says the protagonist’s memory-deranged state manifests as a dreamlike city; criticism identifies dream logic, unstable time/space and surreal perception. Ryder’s guilt, memory and anxiety project the competing reality."},{"title":"The Unlimited Dream Company","cover_url":"cover-the-unlimited-dream-company.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1979,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Projected realities. Harper says the apparently resurrected pilot’s urgent visions transform suburban Shepperton into an exotic dreamworld of tropical growth, vultures and ecstatic ritual; his desire projects a shared reality over the familiar town."},{"title":"The Wind-Up Bird Chronicle","cover_url":"cover-the-wind-up-bird-chronicle.jpg","shows_english_title":true,"authors":["Haruki Murakami"],"year":1994,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Projected realities. Dream state, well, memory and buried war trauma form a competing netherworld beneath ordinary Tokyo whose boundary with reality cannot be stabilized."},{"id":"time-out-of-joint","title":"Time Out of Joint","authors":["Philip K. Dick"],"year":1959,"books":[{"title":"Time Out of Joint","year":1959,"cover_url":"cover-time-out-of-joint.jpg"}],"cover_url":"cover-time-out-of-joint.jpg"}],"image":"248-projected-realities.webp","status":"leaf","definition":"Fabulation in which trauma, memory or desire projects a competing shared reality whose boundary with the ordinary world cannot be stabilized."},{"id":"cryptid-horror","label":"Cryptid horror","parent":"soft-science-fiction","children":[],"works":[{"title":"Devolution","cover_url":"https://images.penguinrandomhouse.com/cover/9781984826800","shows_english_title":true,"authors":["Max Brooks"],"year":2020,"placement_note":"A materially real terrestrial Sasquatch species besieges a recognizable-present eco-community; speculative biology rather than aliens or magic, with predation and isolation supplying the horror."},{"title":"The Sunken Land Begins to Rise Again","cover_url":"cover-the-sunken-land-begins-to-rise-again.jpg","shows_english_title":true,"authors":["M. John Harrison"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Cryptid horror. Goldsmiths/Hachette center an uncanny biological presence in British rivers and canals; vanished people, shallow pools, Water Babies and rumors/sightings of a green part-human species progressively materialize. Discovery of a hidden aquatic humanoid species supplies the horror."},{"title":"The Vampire Tapestry","cover_url":"cover-the-vampire-tapestry.jpg","shows_english_title":true,"authors":["Suzy McKee Charnas"],"year":1980,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Modern day -> Soft science fiction -> Cryptid horror. Tor and SFE explicitly make Weyland a biological, non-supernatural vampire: an evolved predator in the natural order, hiding as an anthropologist in contemporary America. The hidden species and predation govern, not magic."}],"image":"240-cryptid-horror.webp","definition":"Modern-day soft science fiction and horror in which an alleged hidden animal or folkloric species becomes materially real, with the creature's biological possibility supplying the speculative premise and its attack, pursuit or discovery supplying the horror.","status":"accepted"},{"id":"interstellar-court-politics","label":"Interstellar court politics","parent":"political-space-opera","children":[],"works":[{"title":"Teixcalaan","cover_url":"https://cdn11.bigcommerce.com/s-65f8qukrjx/images/stencil/1280x1280/products/6465/17120/Martine_A-Memory_of_Empire_cover__37765.1687451116.jpg?c=1","shows_english_title":false,"authors":["Arkady Martine"],"year":2019,"books":[{"title":"A Memory Called Empire","year":2019,"cover_url":"https://cdn11.bigcommerce.com/s-65f8qukrjx/images/stencil/1280x1280/products/6465/17120/Martine_A-Memory_of_Empire_cover__37765.1687451116.jpg?c=1"},{"title":"A Desolation Called Peace","year":2021,"cover_url":"https://cdn11.bigcommerce.com/s-65f8qukrjx/images/stencil/1280x1280/products/6464/17119/Martine_A_Desolation_Called_Peace_cover__53488.1687451116.jpg?c=1"}]},{"title":"The Vorkosigan Saga","cover_url":"https://covers.openlibrary.org/b/isbn/0743468422-L.jpg","shows_english_title":true,"authors":["Lois McMaster Bujold"],"year":1986,"books":[{"title":"Shards of Honor","year":1986,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671655747-L.jpg","shows_english_title":true},{"title":"The Warrior's Apprentice","year":1986,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671655877-L.jpg","shows_english_title":true},{"title":"Ethan of Athos","year":1986,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671656041-L.jpg","shows_english_title":true},{"title":"Falling Free","year":1988,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671653989-L.jpg","shows_english_title":true},{"title":"Borders of Infinity","year":1989,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671720933-L.jpg","shows_english_title":true},{"title":"Brothers in Arms","year":1989,"cover_url":"https://covers.openlibrary.org/b/isbn/9781416555445-L.jpg","shows_english_title":true},{"title":"The Vor Game","year":1990,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671720148-L.jpg","shows_english_title":true},{"title":"Barrayar","year":1991,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671720834-L.jpg","shows_english_title":true},{"title":"Mirror Dance","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/3943745-L.jpg","shows_english_title":true},{"title":"Cetaganda","year":1996,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671877446-L.jpg","shows_english_title":true},{"title":"Memory","year":1996,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671878450-L.jpg","shows_english_title":true},{"title":"Komarr","year":1998,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671878771-L.jpg","shows_english_title":true},{"title":"A Civil Campaign","year":1999,"cover_url":"https://covers.openlibrary.org/b/isbn/9780671578275-L.jpg","shows_english_title":true},{"title":"Diplomatic Immunity","year":2002,"cover_url":"https://covers.openlibrary.org/b/isbn/9780743436120-L.jpg","shows_english_title":true},{"title":"Cryoburn","year":2010,"cover_url":"https://covers.openlibrary.org/b/isbn/9781451637502-L.jpg","shows_english_title":true},{"title":"Gentleman Jole and the Red Queen","year":2016,"cover_url":"https://covers.openlibrary.org/b/isbn/9781481482899-L.jpg","shows_english_title":true}]},{"id":"the-interdependency","title":"The Interdependency","authors":["John Scalzi"],"year":2017,"cover":"https://covers.openlibrary.org/b/id/8443364-L.jpg","books":[{"title":"The Collapsing Empire","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8443364-L.jpg","shows_english_title":true},{"title":"The Consuming Fire","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/8788885-L.jpg","shows_english_title":true},{"title":"The Last Emperox","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/9423954-L.jpg","shows_english_title":true}],"placement_note":"Macmillan describes a collapsing interstellar travel network and a starship owner, scientist and Emperox racing to preserve political control across the colonies through political skulduggery. The imperial court and elite personal networks are the main arena, making Interstellar court politics the closest leaf.","sources":["https://us.macmillan.com/series/theinterdependency","https://sf-encyclopedia.com/entry/scalzi_john"],"cover_url":"https://covers.openlibrary.org/b/id/8443364-L.jpg"},{"title":"A Fire Born of Exile","cover_url":"https://covers.openlibrary.org/b/id/14796299-L.jpg","shows_english_title":true,"authors":["Aliette de Bodard"],"year":2023,"placement_note":"Standalone Xuya space opera (PW, Locus): a scholar returns to the Scattered Pearls Belt for Monte Cristo-style revenge among its elite households. Politics through courts and personal networks."}],"image":"249-interstellar-court-politics.webp","definition":"Interstellar politics conducted through courts, diplomatic missions and elite personal networks.","status":"accepted"},{"id":"revolutionary-space-opera","label":"Revolutionary space opera","parent":"political-space-opera","children":[],"works":[{"title":"Seven Devils","cover_url":"https://covers.openlibrary.org/b/isbn/9780756415808-L.jpg","shows_english_title":true,"authors":["L. R. Lam","Elizabeth May"],"year":2020,"books":[{"title":"Seven Devils","year":2020},{"title":"Seven Mercenaries","year":2022}]},{"title":"The Sun Chronicles","cover_url":"https://covers.openlibrary.org/b/isbn/9781250197245-L.jpg","shows_english_title":false,"authors":["Kate Elliott"],"year":2020,"books":[{"title":"Unconquerable Sun","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10117508-L.jpg"},{"title":"Furious Heaven","year":2023,"cover_url":"https://covers.openlibrary.org/b/id/13730675-L.jpg"}]},{"title":"Empress of Forever","cover_url":"https://covers.openlibrary.org/b/id/8598460-L.jpg","shows_english_title":true,"authors":["Max Gladstone"],"year":2019,"placement_note":"SFE calls it baroque space opera and centers conflict with a galaxy-ruling totalitarian empress; Macmillan makes rebellion against that ruler the mission of its rag-tag team. Relations to galactic power, rebellion and rule are the primary field, so Political space opera is closest."},{"title":"Sweep of Stars","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250264936.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Maurice Broaddus"],"year":2022,"placement_note":"Muungano, a pan-African cooperative spread through the solar system after breaking from Earth's order, faces that old power again (PW, Library Journal: political space opera)."}],"image":"250-revolutionary-space-opera.webp","definition":"Space opera driven by overthrow of, or liberation from, an imperial order.","status":"accepted"},{"id":"post-scarcity-politics","label":"Post-scarcity politics","parent":"political-space-opera","children":[],"works":[{"title":"Culture","cover_url":"https://covers.openlibrary.org/b/id/6872572-L.jpg","shows_english_title":true,"authors":["Iain M. Banks"],"year":1987,"books":[{"title":"Consider Phlebas","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/6872572-L.jpg","shows_english_title":true},{"title":"The Player of Games","year":1988,"cover_url":"https://covers.openlibrary.org/b/id/44077-L.jpg","shows_english_title":true},{"title":"Use of Weapons","year":1990,"cover_url":"https://covers.openlibrary.org/b/id/6797757-L.jpg","shows_english_title":true},{"title":"The State of the Art","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/941423-L.jpg","shows_english_title":true},{"title":"Excession","year":1996,"cover_url":"https://www.littlebrown.co.uk/wp-content/uploads/2023/05/hbg-title-excession-2-34.jpg","shows_english_title":true},{"title":"Inversions","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/13334421-L.jpg","shows_english_title":true},{"title":"Look to Windward","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/476421-L.jpg","shows_english_title":true},{"title":"Matter","year":2008,"cover_url":"https://covers.openlibrary.org/b/id/1174791-L.jpg","shows_english_title":true},{"title":"Surface Detail","year":2010,"cover_url":"https://covers.openlibrary.org/b/id/6672209-L.jpg","shows_english_title":true},{"title":"The Hydrogen Sonata","year":2012,"cover_url":"https://www.hachette.co.uk/wp-content/uploads/2023/05/hbg-title-the-hydrogen-sonata-3-29.jpg","shows_english_title":true}]}],"image":"251-post-scarcity-politics.webp","definition":"Political space opera about intervention, moral authority and collective choice under material abundance.","status":"accepted"},{"id":"space-succession-opera","label":"Space Succession Opera","parent":"political-space-opera","children":[],"works":[{"title":"Dread Empire's Fall","cover_url":"https://covers.openlibrary.org/b/id/8797394-L.jpg","shows_english_title":true,"authors":["Walter Jon Williams"],"year":2002,"books":[{"title":"The Praxis","year":2002,"cover_url":"https://covers.openlibrary.org/b/id/8797394-L.jpg"},{"title":"The Sundering","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/8512457-L.jpg"},{"title":"Conventions of War","year":2005,"cover_url":"https://covers.openlibrary.org/b/id/8797692-L.jpg"},{"title":"The Accidental War","year":2018,"cover_url":"https://www.publishersweekly.com/cover/9780062467027"},{"title":"Fleet Elements","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/11335780-L.jpg"},{"title":"Imperium Restored","year":2022,"cover_url":"https://covers.openlibrary.org/b/id/13136309-L.jpg"}],"placement_note":"SFE and Harper describe a six-novel space-opera sequence about the collapse of the Shaa empire, struggles over its multispecies ruling Convocation, civil war and restoration. Governance, succession and competing species' claims to imperial power drive both trilogies, making Political space opera closest."},{"title":"The Imperial Radch","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2017/06/9780316246620.jpg","shows_english_title":false,"authors":["Ann Leckie"],"year":2013,"books":[{"title":"Ancillary Justice","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/7355949-L.jpg"},{"title":"Ancillary Sword","year":2014,"cover_url":"https://covers.openlibrary.org/b/id/7422984-L.jpg"},{"title":"Ancillary Mercy","year":2015,"cover_url":"https://covers.openlibrary.org/b/id/7436540-L.jpg"},{"title":"Translation State","year":2023,"cover_url":"https://covers.openlibrary.org/b/id/13240199-L.jpg"}]},{"id":"thrawn-trilogy","title":"The Thrawn Trilogy","authors":["Timothy Zahn"],"year":1991,"books":[{"title":"Heir to the Empire","year":1991,"cover_url":"cover-heir-to-the-empire.jpg"},{"title":"Dark Force Rising","year":1992,"cover_url":"cover-dark-force-rising.jpg"},{"title":"The Last Command","year":1993,"cover_url":"cover-the-last-command.jpg"}],"cover_url":"cover-heir-to-the-empire.jpg"}],"image":"252-space-succession-opera.webp","definition":"Political space opera about the succession of orders after imperial collapse or fracture, rather than the succession of dynastic heirs.","status":"accepted"},{"id":"contemporary-mythic-fantasy","label":"Contemporary mythic fantasy","parent":"contemporary-fantasy","children":["modern-albion-myth","modern-greek-myth","modern-anansi-myth","modern-orisha-myth","modern-invented-myth","modern-chinese-myth"],"image":"260-contemporary-mythic-fantasy.webp","definition":"Contemporary fantasy in which ancient mythic beings, archetypes or powers remain active within ordinary present-day life, making myth a living force, partitioned by which mythology stays alive: the inherited traditions of Albion, Greek, Anansi, Chinese and orisha, or an invented cosmology an author built outright.","status":"provisional","works":[]},{"id":"modern-albion-myth","label":"Modern Albion Myth","parent":"contemporary-mythic-fantasy","children":[],"works":[{"title":"Mythago Wood","year":1984,"authors":["Robert Holdstock"],"cover_url":"https://covers.openlibrary.org/b/id/524259-L.jpg","shows_english_title":true,"score":8.5,"placement_note":"SFE holdstock_robert_p: contemporary protagonist, mythic archetypes made animate, 'a classic Little Big heartwood'; follows the Little, Big precedent -> contemporary-fantasy.","buy":[{"label":"Adlibris","url":"https://www.adlibris.com/se/sok?q=mythago+wood+holdstock"},{"label":"Amazon","url":"https://www.amazon.com/s?k=mythago+wood+holdstock"}],"versions":[{"cover_url":"https://covers.openlibrary.org/b/id/524259-L.jpg","credit":"Tor, 2003"},{"cover_url":"https://covers.openlibrary.org/b/id/10719180-L.jpg","credit":"Berkley, 1986"}]},{"title":"Lanny","cover_url":"https://covers.openlibrary.org/b/id/8760252-L.jpg","shows_english_title":true,"authors":["Max Porter"],"year":2019,"placement_note":"Faber places an ordinary present-day English village alongside its mysterious past and the listening folkloric figure Dead Papa Toothwort; Graywolf describes the same living village and ancient green presence. A mythic being inhabiting contemporary village life makes Contemporary fantasy the closest current leaf."},{"id":"the-dark-is-rising-sequence","title":"The Dark Is Rising Sequence","authors":["Susan Cooper"],"year":1965,"cover_url":"cover-over-sea-under-stone.webp","shows_english_title":true,"books":[{"title":"Over Sea, Under Stone","year":1965,"cover_url":"cover-over-sea-under-stone.webp","shows_english_title":true},{"title":"The Dark Is Rising","year":1973,"cover_url":"cover-the-dark-is-rising.webp","shows_english_title":true},{"title":"Greenwitch","year":1974,"cover_url":"cover-greenwitch.webp","shows_english_title":true},{"title":"The Grey King","year":1975,"cover_url":"cover-the-grey-king.webp","shows_english_title":true},{"title":"Silver on the Tree","year":1977,"cover_url":"cover-silver-on-the-tree.webp","shows_english_title":true}],"placement_note":"SFE calls the sequence a mythological fantasy epic set in the modern world, with a contemporary child carrying the ancient Old Ones and active Anglo-Saxon, Celtic and Arthurian powers. Inherited myth operating in ordinary modern Earth governs.","sources":["https://sf-encyclopedia.com/entry/cooper_susan","https://www.simonandschuster.com/books/The-Dark-Is-Rising-Sequence-(Boxed-Set)/Susan-Cooper/The-Dark-Is-Rising-Sequence/9781665935487"]},{"title":"The Owl Service","cover_url":"cover-the-owl-service.jpg","shows_english_title":true,"authors":["Alan Garner"],"year":1967,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Contemporary mythic fantasy. HarperCollins sets present-day young people into the compulsory replay of an ancient Welsh legend through an uncanny owl-patterned dinner service. The Blodeuwedd triangle from the Mabinogion remains active inside ordinary modern life, making inherited myth the living force."},{"title":"The Weirdstone Trilogy","cover_url":"cover-the-weirdstone-of-brisingamen.jpg","shows_english_title":true,"authors":["Alan Garner"],"year":1960,"books":[{"title":"The Weirdstone of Brisingamen","year":1960,"cover_url":"cover-the-weirdstone-of-brisingamen.jpg","shows_english_title":true},{"title":"The Moon of Gomrath","year":1963,"cover_url":"cover-the-moon-of-gomrath.jpg","shows_english_title":true},{"title":"Boneland","year":2012,"cover_url":"cover-boneland.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Contemporary mythic fantasy. Ancient Northern and Cheshire legend remains active within modern life at Alderley Edge across the complete trilogy."},{"title":"The Green Man's Quarry","cover_url":"https://wizardstowerpress.com/wp-content/uploads/TheGeenMansQuarry_300.jpg","shows_english_title":true,"authors":["Juliet E. McKenna"],"year":2023,"placement_note":"Sixth Green Man novel: the dryad's son who serves the Green Man handles folklore creatures loose in present-day England (Thomas Wrightson, The Middle Shelf)."},{"title":"A Midwinter's Tail","cover_url":"https://covers.openlibrary.org/b/isbn/9781408729557-L.jpg","shows_english_title":true,"authors":["Lili Hayward"],"year":2023,"placement_note":"A Londoner returns to a Cornish village at Christmas; an extraordinary cat and a town in need of miracles - Cornish midwinter folk-magic alive in the present day ('A town in need. An extraordinary cat. A season for miracles', Sphere; Fantasy-Hive tags it Cosy Folk). Placed via Gustav's 19:56 four-way split of Contemporary mythic fantasy (was held #7)."}],"definition":"Contemporary fantasy in which the old powers of Albion - mythagos, green men, the Old Ones, Welsh and Cheshire legend, midwinter folk-magic - remain alive within ordinary present-day life.","status":"accepted","image":"339-modern-albion-myth.webp"},{"id":"modern-greek-myth","label":"Modern Greek Myth","parent":"contemporary-mythic-fantasy","children":[],"works":[{"id":"this-poison-heart","title":"This Poison Heart","authors":["Kalynn Bayron"],"year":2021,"books":[{"title":"This Poison Heart","year":2021,"cover_url":"cover-this-poison-heart.jpg"},{"title":"This Wicked Fate","year":2022,"cover_url":"cover-this-wicked-fate.jpg"}],"cover_url":"cover-this-poison-heart.jpg"}],"definition":"Contemporary fantasy in which the powers and bloodlines of Greek myth remain active within ordinary present-day life.","status":"accepted","image":"340-modern-greek-myth.webp"},{"id":"modern-anansi-myth","label":"Modern Anansi Myth","parent":"contemporary-mythic-fantasy","children":[],"works":[{"title":"Anansi Boys","cover_url":"https://covers.openlibrary.org/b/isbn/9780062564337-L.jpg","shows_english_title":true,"authors":["Neil Gaiman"],"year":2005}],"definition":"Contemporary fantasy in which Anansi and the West African and Caribbean spider-trickster tradition remain active within ordinary present-day life.","status":"accepted","image":"341-modern-anansi-myth.webp"},{"id":"modern-orisha-myth","label":"Modern Orisha Myth","parent":"contemporary-mythic-fantasy","children":[],"works":[{"title":"Shigidi and the Brass Head of Obalufon","cover_url":"https://covers.openlibrary.org/b/id/14401457-L.jpg","shows_english_title":true,"authors":["Wole Talabi"],"year":2023,"placement_note":"Yoruba nightmare god Shigidi and his partner run a heist in present-day London's spirit-side (PW, Locus). Ancient gods active in the contemporary world."},{"title":"Ballad & Dagger","cover_url":"https://covers.openlibrary.org/b/isbn/9781368070874-L.jpg","shows_english_title":true,"authors":["Daniel José Older"],"year":2022,"placement_note":"Santeros of sunken San Madrigal rebuild in Brooklyn; the orisha of the Santeria (Yoruba-derived) tradition act within ordinary present-day life."}],"definition":"Contemporary fantasy in which the orisha of the Yoruba tradition remain active within ordinary present-day life.","status":"accepted","image":"342-modern-orisha-myth.webp"},{"id":"magical-coming-of-age","label":"Magical coming-of-age","parent":"contemporary-fantasy","children":[],"image":"261-magical-coming-of-age.webp","definition":"Contemporary fantasy in which young people discover or develop magical abilities while forming identity, relationships and an adult place in the world.","status":"provisional","works":[{"title":"Harry Potter","cover_url":"https://covers.openlibrary.org/b/id/15155833-L.jpg","shows_english_title":true,"authors":["J. K. Rowling"],"year":1997,"books":[{"title":"Harry Potter and the Philosopher's Stone","year":1997,"cover_url":"https://covers.openlibrary.org/b/id/15155833-L.jpg","shows_english_title":true},{"title":"Harry Potter and the Chamber of Secrets","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/15158664-L.jpg","shows_english_title":true},{"title":"Harry Potter and the Prisoner of Azkaban","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/10580435-L.jpg","shows_english_title":true},{"title":"Harry Potter and the Goblet of Fire","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/12059372-L.jpg","shows_english_title":true},{"title":"Harry Potter and the Order of the Phoenix","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/15158666-L.jpg","shows_english_title":true},{"title":"Harry Potter and the Half-Blood Prince","year":2005,"cover_url":"https://covers.openlibrary.org/b/id/10716273-L.jpg","shows_english_title":true},{"title":"Harry Potter and the Deathly Hallows","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/15158660-L.jpg","shows_english_title":true}]},{"title":"Among Others","cover_url":"https://covers.openlibrary.org/b/id/6998632-L.jpg","shows_english_title":true,"authors":["Jo Walton"],"year":2011},{"title":"All Our Hidden Gifts","cover_url":"https://walker-books-uk.imgix.net/covers/9781406393095.jpg","shows_english_title":true,"authors":["Caroline O'Donoghue"],"year":2021,"books":[{"title":"All Our Hidden Gifts","year":2021,"cover_url":"https://walker-books-uk.imgix.net/covers/9781406393095.jpg"},{"title":"The Gifts That Bind Us","year":2022,"cover_url":"https://walker-books-uk.imgix.net/covers/9781406393101.jpg"},{"title":"Every Gift a Curse","year":2023,"cover_url":"https://walker-books-uk.imgix.net/covers/9781529507973.jpg"}],"placement_note":"Walker identifies a completed contemporary trilogy: tarot awakens Maeve’s supernatural powers and Book 2 follows her coven’s telepathy, telekinesis, sparks and healing in present-day Ireland. Magic openly enters ordinary teenage and civic life, making Contemporary fantasy closest."},{"title":"The Shadowshaper Cypher","cover_url":"https://covers.openlibrary.org/b/isbn/9781338032475-L.jpg","shows_english_title":true,"authors":["Daniel José Older"],"year":2015,"books":[{"title":"Shadowshaper","year":2015,"cover_url":"https://covers.openlibrary.org/b/isbn/9781338032475-L.jpg"},{"title":"Shadowhouse Fall","year":2017,"cover_url":"https://covers.openlibrary.org/b/isbn/9780545952828-L.jpg"},{"title":"Shadowshaper Legacy","year":2020,"cover_url":"https://covers.openlibrary.org/b/isbn/9780545953009-L.jpg"}],"placement_note":"Scholastic centers present-day Brooklyn ancestral-spirit magic infused into art and stories. Contemporary fantasy is exact; Urban fantasy is rejected because none of its pure child gates fits."},{"title":"The Mirror Season","cover_url":"cover-the-mirror-season.jpg","shows_english_title":true,"authors":["Anna-Marie McLemore"],"year":2021,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Magical coming-of-age. Macmillan centers two present-day teens healing after assault through Ciela’s inherited gift for enchanted pan dulce, impossible mirrored glass and Lock’s otherworldly trees. Their developing magic and relationship shape identity, recovery and the passage toward adult self-possession."},{"title":"The Scapegracers","cover_url":"cover-the-scapegracers.jpg","shows_english_title":true,"authors":["H. A. Clarke"],"year":2020,"books":[{"title":"The Scapegracers","year":2020,"cover_url":"cover-the-scapegracers.jpg","shows_english_title":true},{"title":"The Scratch Daughters","year":2022,"cover_url":"cover-the-scratch-daughters.jpg","shows_english_title":true},{"title":"The Feast Makers","year":2024,"cover_url":"cover-the-feast-makers.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Magical coming-of-age. PRH/Kensington centers contemporary teen witch Sideways building a coven, developing and restoring magical power, queer friendship, chosen family, senior year and college decisions. Magic and adolescent identity develop together across the trilogy."},{"title":"The Incandescent","cover_url":"https://covers.openlibrary.org/b/id/15116173-L.jpg","shows_english_title":true,"authors":["Emily Tesh"],"year":2025,"placement_note":"Present-day England: Dr Walden, Director of Magic at the centuries-old Chetwood boarding school, teaches A-Level Invocation to her sixth formers and holds off demons (Locus, sffworld: 'Think Harry Potter'). Teacher POV; placed here for now by Gustav's 21:39 ruling, magic-school leaf banked."},{"title":"Bitter","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0571371191.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Akwaeke Emezi"],"year":2022,"placement_note":"Teen artists in Lucille discover that art can birth living creatures while forming identity amid youth-led upheaval; prequel to Pet."}]},{"id":"domestic-fantasy","label":"Domestic fantasy","parent":"contemporary-fantasy","children":[],"image":"262-domestic-fantasy.webp","definition":"Contemporary fantasy in which a household, family or multigenerational domestic life is the primary site through which magic enters and reshapes the everyday world.","status":"provisional","works":[{"title":"Ivory Apples","cover_url":"https://covers.openlibrary.org/b/id/8981684-L.jpg","shows_english_title":true,"authors":["Lisa Goldstein"],"year":2019,"placement_note":"Tachyon centers a present-day family protecting real, untamable magic; Kirkus identifies a sprite entering Ivy and a disruptive, dangerous faery world. Actual magic invading ordinary contemporary life makes Contemporary fantasy closest."},{"title":"Little, Big","cover_url":"https://covers.openlibrary.org/b/id/911055-L.jpg","shows_english_title":true,"authors":["John Crowley"],"year":1981},{"title":"Fallow Sisters","cover_url":"https://www.newconpress.co.uk/images/book_comet_front_2d.jpg","shows_english_title":true,"authors":["Liz Williams"],"year":2020,"books":[{"title":"Comet Weather","year":2020,"cover_url":"https://www.newconpress.co.uk/images/book_comet_front_2d.jpg"},{"title":"Blackthorn Winter","year":2021,"cover_url":"https://www.newconpress.co.uk/images/book_blackthorn_front_6.jpg"},{"title":"Embertide","year":2022,"cover_url":"https://www.newconpress.co.uk/images/book_embertide_cover_4.jpg"},{"title":"Salt on the Midnight Fire","year":2023,"cover_url":"https://www.newconpress.co.uk/images/book_salt_front_4.jpg"}]},{"title":"Eastwick","cover_url":"cover-the-witches-of-eastwick.jpg","shows_english_title":true,"authors":["John Updike"],"year":1984,"books":[{"title":"The Witches of Eastwick","year":1984,"cover_url":"cover-the-witches-of-eastwick.jpg","shows_english_title":true},{"title":"The Widows of Eastwick","year":2008,"cover_url":"cover-the-widows-of-eastwick.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Contemporary fantasy -> Domestic fantasy. Three women’s real household magic and coven bonds reshape intimate and community life, then return in widowhood to confront lingering enchantment and consequences."},{"title":"Lessons in Magic and Disaster","cover_url":"https://covers.openlibrary.org/b/id/15111944-L.jpg","shows_english_title":true,"authors":["Charlie Jane Anders"],"year":2025,"placement_note":"A literature grad student who is secretly a witch teaches her grieving mother magic; the family is where the magic lands (PW 'contemporary fantasy', Kirkus)."},{"title":"The Bog Wife","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1640096620.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Kay Chronister"],"year":2024,"placement_note":"A West Virginia family bound by a sacred pact with a bog, until the bog gives them a wife (NYT, Kirkus)."}]},{"id":"gothic-fantasy","label":"Gothic fantasy","parent":"fantasy-realms","children":["dark-realms","technomancy","isolationist-fantasy","fantasy-of-manners","fantasy-mystery"],"works":[],"image":"274-gothic-fantasy.webp","definition":"The Gothic School of invented-world fantasy: the Walpole-to-Poe lineage of haunted architecture, ancestral dread, confinement, transgression and the uncanny, widened to include Pax Britannica cultural mannerisms - British imperial-era gentlemen, etiquette, class performance and social codes. Its branches range from Dark Fantasy and isolation to manners, occult detection and necromantic machinery.","status":"accepted"},{"id":"dark-realms","label":"Dark realms","parent":"gothic-fantasy","children":[],"works":[{"title":"The Death of Jane Lawrence","cover_url":"cover-the-death-of-jane-lawrence.jpg","shows_english_title":true,"authors":["Caitlin Starling"],"year":2021,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Dark Fantasy. Great Bretlain is an invented Britain-cipher; haunted architecture, ghosts, dark magic and dread govern."},{"title":"Someone You Can Build a Nest In","cover_url":"https://covers.openlibrary.org/b/id/15137468-L.jpg","shows_english_title":true,"authors":["John Wiswell"],"year":2024,"placement_note":"A shapeshifting monster living under a cursed noble family's manor falls for her would-be killer (Kirkus, BookPage: 'horrific and fun'). Invented-world Gothic of curse and enclosure, so Dark Fantasy."},{"title":"Asunder","cover_url":"https://covers.openlibrary.org/b/id/14815090-L.jpg","shows_english_title":true,"authors":["Kerstin Hall"],"year":2024,"placement_note":"The old gods are dead and the new ones horrific; Karys is bound to one (Library Journal: horror, found family, mythology; Reactor). Invented-world dark fantasy of dread."},{"title":"Among Ghosts","cover_url":"https://images2.penguinrandomhouse.com/cover/9780593813720","shows_english_title":true,"authors":["Rachel Hartman"],"year":2025,"placement_note":"Seraphina-universe standalone: a boy flees his abusive earl father's escalating menace into a ghost-crowded abandoned abbey whose ghosts narrate the region's buried history (Locus, Reactor). Placed via Gustav's 12:36 ruling (was held #18)."}],"image":"275-dark-fantasy.webp","definition":"Invented-world Gothic fantasy governed by dread, haunting, enclosure and dark magic more than adventure, etiquette or investigation.","status":"accepted"},{"id":"technomancy","label":"Technomancy","parent":"gothic-fantasy","children":[],"works":[{"title":"A Voyage to Arcturus","cover_url":"https://covers.openlibrary.org/b/id/380212-L.jpg","shows_english_title":true,"authors":["David Lindsay"],"year":1920,"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Technomancy. Actual magic wears technological forms in a dark, ominous or necromantic register."},{"title":"The Locked Tomb","cover_url":"https://covers.openlibrary.org/b/isbn/9781250313188-L.jpg","shows_english_title":true,"authors":["Tamsyn Muir"],"year":2019,"books":[{"title":"Gideon the Ninth","year":2019,"cover_url":"https://covers.openlibrary.org/b/isbn/9781250313188-L.jpg"},{"title":"Harrow the Ninth","year":2020,"cover_url":"https://covers.openlibrary.org/b/isbn/9781250313218-L.jpg"},{"title":"Nona the Ninth","year":2022,"cover_url":"https://covers.openlibrary.org/b/isbn/9781250854117-L.jpg"}],"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Technomancy. Actual magic wears technological forms in a dark, ominous or necromantic register."},{"title":"The Thousand Worlds","cover_url":"http://books.disney.com/content/uploads/2018/08/136801335X.jpg","shows_english_title":true,"authors":["Yoon Ha Lee"],"year":2019,"books":[{"title":"Dragon Pearl","year":2019,"cover_url":"http://books.disney.com/content/uploads/2018/08/136801335X.jpg"},{"title":"Tiger Honor","year":2022,"cover_url":"http://books.disney.com/content/uploads/2021/11/1368055540-3.jpg"},{"title":"Fox Snare","year":2023,"cover_url":"http://books.disney.com/content/uploads/2023/06/9781368081818.jpg"}],"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Fantasy Realms -> Gothic fantasy -> Technomancy. Actual magic wears technological forms in a dark, ominous or necromantic register."},{"title":"Dead Country","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0765395916.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Max Gladstone"],"year":2023,"placement_note":"Craft Wars 1 (PW, Locus): the Craft Sequence world where soul-stuff is currency and necromancer-lawyers run a magic organized like engineering. Craft Sequence volumes not yet in the tree."}],"image":"276-technomancy.webp","definition":"Gothic fantasy where actual magic is organized through technological forms: necromancy as engineering, haunted apparatus, occult systems and ominous science-fantasy. The “-mancy” postfix carries Gustav’s intended necromancy connotation.","status":"accepted"},{"id":"metafictional-worldmaking","name":"Metafictional worldmaking","label":"Metafictional worldmaking","parent":"classic-fabulation","children":[],"works":[{"title":"Invisible Cities","year":1972,"authors":["Italo Calvino"],"cover_url":"https://archive.org/download/invisiblecitie00calv/page/cover.jpg","shows_english_title":true,"placement_note":"SFE Calvino describes the book as fragmented Marco Polo voyages to surreal cities not actually visited; SFE Fabulation explicitly lists Calvino and defines the mode by foregrounding how stories construct worlds."},{"title":"Cosmicomics","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780241573709/9780241573709-jacket-large.jpg","shows_english_title":true,"authors":["Italo Calvino"],"year":1965,"placement_note":""},{"title":"Labyrinths","cover_url":"https://covers.openlibrary.org/b/id/12856936-L.jpg","shows_english_title":true,"authors":["Jorge Luis Borges"],"year":1962,"placement_note":"SFE identifies Labyrinths as a major English selection combining Ficciones and El Aleph stories, including the Library of Babel, Tlön and other metaphysical inventions; New Directions calls it trans-genre, multi-layered and self-referential. Its fictions make imagined books, libraries, branching time and invented worlds into the machinery of storytelling itself, matching foundational Classic Fabulation."},{"title":"The Cornelius Quartet","cover_url":"cover-final-programme.jpg","shows_english_title":true,"authors":["Michael Moorcock"],"year":1968,"books":[{"title":"The Final Programme","year":1968,"cover_url":"cover-final-programme.jpg","shows_english_title":true},{"title":"A Cure for Cancer","year":1971,"cover_url":"cover-cure-for-cancer.jpg","shows_english_title":true},{"title":"The English Assassin","year":1972,"cover_url":"cover-english-assassin.jpg","shows_english_title":true},{"title":"The Condition of Muzak","year":1977,"cover_url":"cover-condition-of-muzak.jpg","shows_english_title":true}],"placement_note":"SFE treats the revised central quartet as formally cumulative: Jerry and his recurring troupe move through increasingly unstable Londons under SF/fantasy manipulation, Law/Chaos and multiversal escape. Narrative revision and shifting world-making govern more than the opening novel’s super-science plot, fitting Classic Fabulation."},{"title":"The Illustrated Man","cover_url":"cover-the-illustrated-man.jpg","shows_english_title":true,"authors":["Ray Bradbury"],"year":1951,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Classic Fabulation -> Metafictional worldmaking. Eighteen SF stories across worlds and eras spring to life as magical tattoos, an openly composed storytelling frame."},{"title":"The Invention of Morel","cover_url":"cover-the-invention-of-morel.jpg","shows_english_title":true,"authors":["Adolfo Bioy Casares"],"year":1940,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Classic Fabulation -> Metafictional worldmaking. SFE describes an abstract, parodic and metaphysical use of SF: Morel’s machine kills its models to make eternal three-dimensional projected avatars, composing an island reality around chimerical copies, invisibility and immortality. The story-making machine openly constructs the world."},{"title":"The Land of Laughs","cover_url":"cover-the-land-of-laughs.jpg","shows_english_title":true,"authors":["Jonathan Carroll"],"year":1980,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Classic Fabulation -> Metafictional worldmaking. Kirkus reveals that author Marshall France literally wrote the town of Galen, created its people, set births, marriages and deaths, and transformed disobedient characters; Thomas must write France back into the town. Storytelling openly composes the world."},{"id":"unlanguage","title":"Unlanguage","authors":["Michael Cisco"],"year":2018,"books":[{"title":"Unlanguage","year":2018,"cover_url":"cover-unlanguage.jpg"}],"cover_url":"cover-unlanguage.jpg"},{"title":"Three Eight One","cover_url":"https://covers.openlibrary.org/b/id/14844421-L.jpg","shows_english_title":true,"authors":["Aliya Whiteley"],"year":2024,"placement_note":"In 2314 a teenager serializes an ancient text about a quest whose world bends to its telling (PW 'genre-bending metafictional narrative'). The narration visibly makes the world."}],"image":"284-metafictional-worldmaking.webp","definition":"Fabulations where narration, books, frames, revision, recording or projection visibly make the experienced world."},{"id":"absurdist-constructed-realities","name":"Absurdist constructed realities","label":"Absurdist constructed realities","parent":"classic-fabulation","children":[],"works":[{"title":"The Dead Father","cover_url":"cover-the-dead-father.webp","shows_english_title":true,"authors":["Donald Barthelme"],"year":1975,"placement_note":"Macmillan describes a gargantuan half-dead, half-alive, partly mechanical father dragged by cable on an absurdist journey, stressing Barthelme's freedom to reshape or ignore the world. The impossible world is openly composed by postmodern storytelling, matching Classic Fabulation."},{"title":"The Castle","cover_url":"https://images3.penguinrandomhouse.com/cover/9780241678916","shows_english_title":true,"authors":["Franz Kafka"],"year":1926,"placement_note":"SFE identifies Kafka’s unfinished novel as Absurdist SF: K assaults the fog-shrouded Castle bureaucracy while the world becomes an endless office of transaction. Its inaccessible center and administrative logic compose reality itself."},{"title":"The Malacia Tapestry","cover_url":"cover-the-malacia-tapestry.jpg","shows_english_title":true,"authors":["Brian W. Aldiss"],"year":1976,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Classic Fabulation -> Absurdist constructed realities. SFE calls Malacia a mysterious never-changing city and a restatement of entropy and the role of the artist; Aldiss frames its citizens through an actor who sees the embalmed city-state as art and artifice until reality catches him. The city’s ornate invented reality openly behaves as a composed tapestry."},{"title":"The Sinful Ones","cover_url":"https://archive.org/download/sinfulones0000leib/page/cover.jpg","shows_english_title":true,"authors":["Fritz Leiber"],"year":1950,"placement_note":"One novel, one card: first published 1950 in Fantastic Adventures as \"You're All Alone\", later expanded as The Sinful Ones (ISFDB, SFE). In Leiber's Chicago nearly everyone is a scripted automaton and only a few people are awake to it; neither magic nor science explains the condition, which simply rules the city-world. That impossible governing condition is this leaf's test."},{"title":"The Unpleasant Profession of Jonathan Hoag","cover_url":"https://covers.openlibrary.org/b/id/5728006-L.jpg","shows_english_title":true,"authors":["Robert A. Heinlein"],"year":1942,"placement_note":"Heinlein's 1942 novella (Unknown Worlds, as John Riverside; ISFDB): Hoag hires detectives to learn what he does all day, and the everyday world turns out to be a created artwork, with Hoag one of its critics and the Sons of the Bird its rival hidden makers. Gustav 17:47: not supernatural but fabulation - the same rigged-construction premise as The Sinful Ones on this leaf, with the world itself as the impossible ruling condition."},{"title":"When We Were Real","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1668060043.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Daryl Gregory"],"year":2025,"placement_note":"After the 'Simulation Announcement' reveals that the world is a simulation, a tour group travels a reality that glitches (Kirkus, BookPage: 'What if we all live in a simulation'). Same premise as Hoag and The Sinful Ones: the everyday world is a rigged construction."},{"title":"Corey Fah Does Social Mobility","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0241632536.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Isabel Waidner"],"year":2023,"placement_note":"A working-class, non-binary writer wins the Award for the Fictionalisation of Social Evils but cannot collect: the trophy is a sentient flying saucer that keeps teleporting away, while a fawn-spider from another dimension, a wormhole trip and a time-loop finale pile up (NYT, Guardian, PW 'queer Kafkaesque romp'). The prize system is the impossible institution ruling the world. Clarke 2024 shortlist. Placed by Gustav's 23:22 ruling."}],"image":"285-absurdist-constructed-realities.webp","definition":"Fabulations whose reality is governed by an impossible figure, institution or city sustained as the world’s ruling condition."},{"id":"deco-sf","label":"Deco SF","parent":"period-sf","children":[],"image":"317-deco-sf.webp","definition":"Deco SF: science fiction set in the Art Deco interwar era (roughly 1918-1939) - jazz-age and Depression-era cities of chrome, glamour and rot underneath, where a single scientific or psychic marvel breaks into the period. Rhymes with the banked Deco fantasy name. Named by Gustav 2026-09-23.","status":"accepted","works":[{"title":"Mem","cover_url":"http://static1.squarespace.com/static/669172a9220c0d23ff8b86f1/66955d83710d5f2ad9dea154/66d78e1f0169ae647d23a02b/1787910930032/MEM.jpg?format=1500w","shows_english_title":true,"authors":["Bethany C. Morrow"],"year":2018,"placement_note":"Unnamed Press and Publishers Weekly: in 1920s Montreal a scientist's procedure extracts memories into corporeal mirror-images, and one extract becomes an autonomous person. Written in 2018 and set in the jazz-age city, so Period SF; the interwar setting makes it Deco SF. Moved from Mad-science Gothic 2026-09-23 (Gustav 16:00)."},{"title":"The Listener","cover_url":"cover-the-listener.jpg","shows_english_title":true,"authors":["Robert McCammon"],"year":2018,"placement_note":"Cemetery Dance and Publishers Weekly set the story in 1934 New Orleans, where Curtis and kidnapped child Nilla share genuine psychic rapport. Written in 2018, set in the Depression-era 1930s: Deco SF. Moved from Psi noir (retired) 2026-09-23 (Gustav 16:00)."}]},{"id":"spaceship-drama","label":"Spaceship drama","parent":"new-space-opera","children":[],"works":[{"title":"Wayfarers","cover_url":"cover-the-wayfarers.jpg","shows_english_title":true,"authors":["Becky Chambers"],"year":2014,"books":[{"title":"The Long Way to a Small, Angry Planet","year":2014,"cover_url":"cover-the-wayfarers.jpg"},{"title":"A Closed and Common Orbit","year":2016,"cover_url":"cover-a-closed-and-common-orbit.jpg"},{"title":"Record of a Spaceborn Few","year":2018,"cover_url":"cover-record-of-a-spaceborn-few.jpg"},{"title":"The Galaxy, and the Ground Within","year":2021,"cover_url":"cover-the-galaxy-and-the-ground-within.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Spaceship drama. SFE and Harper/Hachette describe humane, character-driven space opera whose crews and communities act as family and meet crises through cooperation and diplomacy, often without weapons. Mutual aid, care and found family govern rather than conquest or Western frontier grammar."},{"title":"The Vanished Birds","cover_url":"cover-the-vanished-birds.jpg","shows_english_title":true,"authors":["Simon Jimenez"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Spaceship drama. PRH centers a solitary ship captain, a mute child and the unexpected family formed aboard; FTL time-dilation causes separation, but care, connection and found family govern over the mechanism."},{"id":"unstoppable","title":"Unstoppable","authors":["Charlie Jane Anders"],"year":2021,"cover_url":"cover-victories-greater-than-death.jpg","shows_english_title":true,"books":[{"title":"Victories Greater Than Death","year":2021,"cover_url":"cover-victories-greater-than-death.jpg"},{"title":"Dreams Bigger Than Heartbreak","year":2022,"cover_url":"cover-dreams-bigger-than-heartbreak.jpg"},{"title":"Promises Stronger Than Darkness","year":2023,"cover_url":"cover-promises-stronger-than-darkness.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Spaceship drama. SFE calls the Unstoppable sequence Young Adult coming-of-age Space Opera; BookPage and Reactor center a queer found-family crew aboard the starship Indomitable. Crew bonds, care and belonging drive the story more than conquest. Complete trilogy."},{"title":"The Red Scholar's Wake","cover_url":"https://covers.openlibrary.org/b/id/13212490-L.jpg","shows_english_title":true,"authors":["Aliette de Bodard"],"year":2022,"placement_note":"Xuya space opera romance (BSFA Review, Locus): a scholar captured by pirates enters a marriage alliance with the mindship who leads them. Intimate relationships aboard a ship-community drive it."}],"image":"286-spaceship-drama.webp","definition":"Character-driven new space opera focused on intimate interpersonal drama among a spaceship crew or close spacefaring community; cooperation, mutual aid, care and found family drive the story, with diplomacy favored over conquest. Search aliases: cozy space opera, iyashikei (the Japanese healing slice-of-life tradition), found family, Hearthship. Western frontier grammar belongs elsewhere. Named by Gustav Söderström on 2026-09-22; Hearthship is reserved as a possible child if this genre later splits.","status":"accepted"},{"id":"lost-knowledge","label":"Lost Knowledge","parent":"ruined-earth","children":[],"works":[{"title":"A Canticle for Leibowitz","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-9780575073579-14.jpg","shows_english_title":true,"authors":["Walter M. Miller Jr."],"year":1959,"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Lost Knowledge."},{"title":"The Long Tomorrow","cover_url":"cover-the-long-tomorrow.jpg","shows_english_title":true,"authors":["Leigh Brackett"],"year":1955,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian fiction -> Ruined Earth. SFE and Hachette describe a post-nuclear technophobic United States two generations after ruined cities, where boys seek the legendary Bartorstown and secretly revived science. The ruins have become the landscape, law and foundation of successor society; technology’s reconstruction unfolds inside that Ruined Earth. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Lost Knowledge."},{"title":"Riddley Walker","cover_url":"https://covers.openlibrary.org/b/id/8435360-L.jpg","shows_english_title":true,"authors":["Russell Hoban"],"year":1980,"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Lost Knowledge."},{"title":"Silo","cover_url":"https://images.thenile.io/r1000/9781804940822.jpg","shows_english_title":false,"authors":["Hugh Howey"],"year":2011,"books":[{"title":"Wool","year":2011,"cover_url":"https://covers.openlibrary.org/b/id/14369537-L.jpg"},{"title":"Shift","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/11712987-L.jpg"},{"title":"Dust","year":2013,"cover_url":"https://covers.openlibrary.org/b/id/10054840-L.jpg"}],"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Lost Knowledge."},{"title":"The Rampart Trilogy","cover_url":"https://www.hbgacademic.com/wp-content/uploads/2020/04/9780316477536.jpg","shows_english_title":true,"authors":["M. R. Carey"],"year":2020,"books":[{"title":"The Book of Koli","year":2020,"authors":["M. R. Carey"],"cover_url":"https://www.hbgacademic.com/wp-content/uploads/2020/04/9780316477536.jpg"},{"title":"The Trials of Koli","year":2020,"authors":["M. R. Carey"],"cover_url":"https://www.hbgacademic.com/wp-content/uploads/2024/01/9780316458665.jpg"},{"title":"The Fall of Koli","year":2021,"authors":["M. R. Carey"],"cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2024/11/9780316458726.jpg"}],"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Lost Knowledge."},{"title":"Archivist Wasp Saga","cover_url":"https://indiepubs.com/cdn/shop/files/CoreSourceHub_ac1b97fe-7087-4e68-933e-b9f17d615e06.jpg?v=1771578741","shows_english_title":true,"authors":["Nicole Kornher-Stace"],"year":2015,"books":[{"title":"Archivist Wasp","year":2015,"cover_url":"https://indiepubs.com/cdn/shop/files/CoreSourceHub_ac1b97fe-7087-4e68-933e-b9f17d615e06.jpg?v=1771578741","shows_english_title":true},{"title":"Latchkey","year":2018,"cover_url":"https://mythicdelirium.com/wp-content/uploads/2018/03/Check_this_out.jpg","shows_english_title":true}],"placement_note":"SFE locates the Archivist Wasp Saga on a Ruined Earth in a recognizable medieval-futurist context; the author and publishers establish Latchkey as the second and final volume, set in the ruins of high-tech civilization with ghosts and relic weapons. The successor society built among deep-time ruins makes Ruined Earth closest. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Lost Knowledge."},{"title":"A Stranger in the Citadel","cover_url":"https://covers.openlibrary.org/b/isbn/9781616963989-L.jpg","shows_english_title":true,"authors":["Tobias S. Buckell"],"year":2023,"placement_note":"A young lord turned fugitive librarian in a world where books are forbidden ('You shall not suffer a librarian to live'); suppressed knowledge is the treasure."},{"title":"Beyond the Burn Line","cover_url":"https://covers.openlibrary.org/b/isbn/9781399603713-L.jpg","shows_english_title":true,"authors":["Paul McAuley"],"year":2022,"placement_note":"Post-Anthropocene successor people seek out the fallen human civilization's maps, relics and feared knowledge."}],"image":"287-lost-knowledge.webp","definition":"Ruined Earth tales where successor societies guard, rediscover or fear the fallen civilization’s knowledge and technology: archives, enclaves, relic science and its dangerous return.","status":"accepted"},{"id":"wild-ruins","label":"Wild Ruins","parent":"ruined-earth","children":[],"works":[{"title":"After London; or, Wild England","cover_url":"https://covers.openlibrary.org/b/id/10242194-L.jpg","shows_english_title":true,"authors":["Richard Jefferies"],"year":1885,"placement_note":"SFE calls this an early Scientific Romance and Ruined Earth tale: England has reverted to wilderness and barbarism after an unspecified disaster, with a great inland lake over polluted London. Hachette likewise calls it early post-apocalyptic fiction. The successor society living amid transformed ruins makes Ruined Earth closest. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Wild Ruins."},{"title":"Heroes and Villains","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9780141192383/9780141192383-jacket-large.jpg","shows_english_title":true,"authors":["Angela Carter"],"year":1969,"placement_note":"SFE calls this a recognizably SF displacement set in a ruined England divided between stratified city enclaves and Barbarians in mutated forests, and explicitly lists it in the Ruined Earth entry. The ruins and successor societies make Ruined Earth exact. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Wild Ruins."},{"title":"Davy","cover_url":"https://covers.openlibrary.org/b/id/929120-L.jpg","shows_english_title":true,"authors":["Edgar Pangborn"],"year":1964,"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Wild Ruins."},{"title":"Seafire","cover_url":"https://images.penguinrandomhouse.com/cover/9780451478825","shows_english_title":true,"authors":["Natalie C. Parker"],"year":2018,"books":[{"title":"Seafire","year":2018,"cover_url":"https://images.penguinrandomhouse.com/cover/9780451478825"},{"title":"Steel Tide","year":2019,"cover_url":"https://images.penguinrandomhouse.com/cover/9780451478856"},{"title":"Stormbreak","year":2021,"cover_url":"https://images.penguinrandomhouse.com/cover/9780451478863"}],"placement_note":"Kirkus identifies a future in which only shreds of the old world’s technology remain; PRH follows a tyrant’s drug-dependent army and armored fleet across the Bullet Seas through a complete three-volume rebellion. With no grounded magic, this passes Science fiction -> Futurist -> Future of Earth -> Dystopian fiction; a successor maritime society built from lost technological remnants makes Ruined Earth closer than active-catastrophe survival. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Dystopian Futures -> Ruined Earth -> Wild Ruins."},{"title":"Goliath","cover_url":"https://covers.openlibrary.org/b/id/12588366-L.jpg","shows_english_title":true,"authors":["Tochi Onyebuchi"],"year":2022,"placement_note":"The rich have left a broken Earth for space colonies; the people left behind live in the ruins of New Haven, salvaging bricks for the colonists (New Scientist, NPR). Life among the ruins without recovery. Not Westerfeld's Leviathan book of the same title."}],"image":"288-wild-ruins.webp","definition":"Ruined Earth tales where wilderness and barbarism have reclaimed the old world and people live among its ruins without recovering what was lost.","status":"accepted"},{"id":"remade-bodies","label":"Remade Bodies","parent":"posthuman","children":[],"works":[{"title":"Blood Music","cover_url":"https://covers.openlibrary.org/b/isbn/9780877957201-L.jpg","shows_english_title":true,"authors":["Greg Bear"],"year":1985,"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Bodies."},{"title":"Darwin","cover_url":"https://covers.openlibrary.org/b/id/210914-L.jpg","shows_english_title":true,"authors":["Greg Bear"],"year":1999,"books":[{"title":"Darwin's Radio","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/210914-L.jpg","shows_english_title":true},{"title":"Darwin's Children","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/5598801-L.jpg","shows_english_title":true}],"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Bodies."},{"title":"Limbo","cover_url":"https://covers.openlibrary.org/b/id/4910623-L.jpg","shows_english_title":true,"authors":["Bernard Wolfe"],"year":1952,"placement_note":"SFE describes men amputating their own limbs and replacing them with cybernetic prostheses to suppress warlike impulses; Orion likewise centers voluntary amputation, prosthetics and the society built around them. Engineered bodies changing human identity and behavior make Posthuman exact. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Bodies."},{"title":"Man Plus","cover_url":"https://covers.openlibrary.org/b/id/6905749-L.jpg","shows_english_title":true,"authors":["Frederik Pohl"],"year":1976,"placement_note":"Macmillan centers astronaut Roger Torraway’s biological and cybernetic transformation into a new being adapted to Mars, explicitly testing whether his humanity survives; Hachette likewise calls him a biologically engineered machine. Technology remaking the body and human identity makes Posthuman exact. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Bodies."},{"title":"The Ophiuchi Hotline","cover_url":"cover-the-ophiuchi-hotline.jpg","shows_english_title":true,"authors":["John Varley"],"year":1977,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno-fiction -> Technomorphosis -> Posthuman. Penguin centers alien-transmitted biological and medical technologies that remake exiled humanity by the twenty-fifth century; repeated cloned bodies and memory recordings destabilize the protagonist’s identity. Technological transformation of body, self and species governs. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Bodies."},{"title":"The Shrinking Man","cover_url":"cover-the-shrinking-man.jpg","shows_english_title":true,"authors":["Richard Matheson"],"year":1956,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno fiction -> Technomorphosis -> Posthuman. Hachette centers radioactive exposure causing Scott Carey’s irreversible bodily transformation, progressively separating him from ordinary human scale, family and society. Technological/radiological change to human embodiment governs. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Bodies."}],"image":"289-remade-bodies.webp","definition":"Posthuman fiction where technology or engineered biology transforms the human body or species: cyborg redesign, engineered cells, retroviral evolution and bodily metamorphosis.","status":"accepted"},{"id":"remade-minds","label":"Remade Minds","parent":"posthuman","children":[],"works":[{"title":"Fall; or, Dodge in Hell","cover_url":"https://covers.openlibrary.org/b/id/8742303-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2019,"placement_note":"Harper describes technology turning a dead man's scanned brain into a digital consciousness and ultimately creating Bitworld, an eternal afterlife for humanity. The technology does not remain a tool: it transforms death, mind, society and the form of human existence, making Technomorphosis the closest leaf. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Minds."},{"title":"Frankissstein","cover_url":"https://covers.openlibrary.org/b/id/9047532-L.jpg","shows_english_title":true,"authors":["Jeanette Winterson"],"year":2019,"placement_note":"SFE places AI ascension, posthuman identity and cryonics at the center of its near-future frame; Penguin describes its inquiry into AI, bodies and what it means to be human. Technology remaking bodily and human identity makes Technomorphosis the closest leaf. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Minds."},{"title":"Borrowed Man","cover_url":"https://mpd-biblio-covers.imgix.net/9780765381156.jpg","shows_english_title":true,"authors":["Gene Wolfe"],"year":2015,"books":[{"title":"A Borrowed Man","year":2015,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765381156.jpg","shows_english_title":true},{"title":"Interlibrary Loan","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250242679.jpg","shows_english_title":true}],"placement_note":"SFE identifies the two-book Borrowed Man sequence and its protagonist as a cloned, uploaded personality who is legally a library book: medium and message become identical. Tor likewise centers Smithe as the recorded personality of a dead writer, property rather than a legal human. Technology transforms personhood, embodiment and legal identity, making Posthuman exact. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Minds."},{"title":"A Scanner Darkly","cover_url":"https://covers.openlibrary.org/b/id/911131-L.jpg","shows_english_title":true,"authors":["Philip K. Dick"],"year":1977,"placement_note":"Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno Fiction -> Technomorphosis -> Posthuman -> Remade Minds."},{"title":"The Speed of Dark","cover_url":"https://covers.openlibrary.org/b/id/210339-L.jpg","shows_english_title":true,"authors":["Elizabeth Moon"],"year":2002,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Future of Earth fiction -> Techno fiction -> Technomorphosis -> Posthuman -> Remade Minds. Penguin Random House centers an experimental neurological treatment that could rewrite autistic Lou Arrendale's brain, perceptions and selfhood - would he still be himself? Technology remaking a human mind and identity fits Remade Minds. Held as #877 behind the Posthuman 10-card freeze; placed after Gustav approved the split 2026-09-23."},{"title":"The This","cover_url":"https://covers.openlibrary.org/b/id/13256578-L.jpg","shows_english_title":true,"authors":["Adam Roberts"],"year":2022,"placement_note":"A brain-to-brain network, the This, turns its users into a hive mind (Locus x2)."},{"title":"Project Hanuman","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1915998948.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Stewart Hotston"],"year":2025,"placement_note":"Humanity lives almost wholly in information space, the Arcology, with no work or death; Indian myth meets space opera (Library Journal, JAM Reads)."}],"image":"290-remade-minds.webp","definition":"Posthuman fiction where technology transforms the mind, identity or self: uploads, copied minds, and neurological or chemical rewriting of consciousness.","status":"accepted"},{"id":"visionary-minds","label":"Visionary Minds","parent":"consciousness-fiction","children":[],"works":[{"title":"Briefing for a Descent Into Hell","cover_url":"https://covers.openlibrary.org/b/id/11406742-L.jpg","shows_english_title":true,"authors":[ 1996,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction. SFE and PRH hold Martin Blom’s night sight between miraculous recovery and delusion after a brain injury; the world becomes a consensual hallucination. Altered perception destabilizes experienced reality, and the novel refuses a stable objective explanation. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction -> Visionary Minds."},{"title":"The Memoirs of a Survivor","cover_url":"cover-the-memoirs-of-a-survivor.jpg","shows_english_title":true,"authors":["Doris Lessing"],"year":1974,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction. Harper and PRH pair social collapse with the narrator’s hidden inner world where the wall dissolves, reality fades and the past is revisited; scholarship explicitly calls it an inner-space threshold work eroding sanity/madness and personal/impersonal experience. Altered consciousness destabilizes experienced reality more than the future breakdown alone. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction -> Visionary Minds."},{"title":"The White Hotel","cover_url":"cover-the-white-hotel.jpg","shows_english_title":true,"authors":["D. M. Thomas"],"year":1981,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction. Freud-inspired surreal psychic association becomes prophetic of the Holocaust; nonordinary consciousness destabilizes time and experienced reality. Split 2026-09-23 (Gustav approved): Speculative fiction -> Science fiction -> Atemporal -> Fabulation -> Inner Space -> Consciousness fiction -> Visionary Minds."},{"title":"Black Brane"," > Time Machines -> Time travel agency. Previously Speculative fiction -> Science fiction -> Atemporal -> Science fantasy -> Hard science fantasy."},{"title":"The Ministry of Time","cover_url":"https://covers.openlibrary.org/b/id/14621125-L.jpg","shows_english_title":true,"authors":["Kaliane Bradley"],"year":2024,"placement_note":"A British government ministry pulls people out of history, among them a Franklin-expedition officer, and assigns modern 'bridges' to them (Guardian, Kirkus). The organization owns the time travel."},{"title":"Sea of Tranquility","cover_url":"https://images-na.ssl-images-amazon.com/images/P/0593321448.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Emily St. John Mandel"],"year":2022,"placement_note":"An investigator from the Time Institute travels from a 25th-century moon colony to look into an anomaly across 1912, 2020 and 2203 (NYT, Wired). The institute owns the travel."}],"image":"302-time-travel-agency.webp","definition":"Time Machines owned by an organization: agencies, government projects, institutions or factions run the apparatus and send their people through time. Owner test: take away the organization; if the time travel has no owner left, it is Time travel agency.","status":"accepted"},{"id":"robots","label":"Robots","parent":"machine-minds","children":["androids","sentient-robots"],"works":[],"image":"303-robots.webp","definition":"Pure umbrella for machine minds in bodies, split by what the body is for: humanoid replicas that pass as human (Androids) and robots whose personhood is the story (Sentient Robots). Embodiment test against AI still holds: a machine in a body is Robots; a disembodied or distributed intelligence is AI.","status":"accepted"},{"id":"androids","label":"Androids","parent":"robots","children":[],"image":"325-androids.webp","definition":"Robots built as humanoid replicas indistinguishable from humans: the story turns on passing, detection and what separates the copy from the person (SFE 'Androids')."

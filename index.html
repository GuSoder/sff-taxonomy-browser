ish_title":true},{"title":"Xenocide","year":1991,"cover_url":"https://covers.openlibrary.org/b/id/14525021-L.jpg","shows_english_title":true},{"title":"Children of the Mind","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/10162706-L.jpg","shows_english_title":true}]},{"title":"Some Desperate Glory","cover_url":"https://covers.openlibrary.org/b/id/13462488-L.jpg","shows_english_title":true,"authors":["Emily Tesh"],"year":2023,"placement_note":"Kyr trains on Gaea Station, a militarized remnant of humanity at war with the alien Majoda (PW, BookPage). Military space fiction. Tenth card: the leaf is now frozen."}],"image":"356-space-academy.webp","definition":"Military SF of training and formation: academies, cadets and the making of soldiers and commanders. Split 2026-09-25 from Military science fiction (Gustav ruling).","status":"accepted"},{"id":"space-command","label":"Space Command","parent":"military-science-fiction","children":[],"works":[{"title":"Ninefox Gambit","cover_url":"https://covers.openlibrary.org/b/id/13354287-L.jpg","shows_english_title":true,"authors":["Yoon Ha Lee"],"year":2016,"books":[{"title":"Ninefox Gambit","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/13354287-L.jpg"},{"title":"Raven Stratagem","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/8424165-L.jpg"},{"title":"Revenant Gun","year":2018,"cover_url":"https://covers.openlibrary.org/b/isbn/9781781086070-L.jpg"}],"placement_note":"SFE calls the Machineries of Empire sequence complex Military SF in a Space Opera frame with equipoisal action-fantasy figures (the undead strategist Jedao); the plot is a Kel military campaign of formation tactics and the siege of the Fortress of Scattered Needles, so Military science fiction is closest."},{"title":"The Palace of Eternity","cover_url":"cover-the-palace-of-eternity.jpg","shows_english_title":true,"authors":["Bob Shaw"],"year":1969,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> Military science fiction. Hachette/Orion centers a losing interstellar war against the Syccans, military high command converting refuge-world Mnemosyne into a colony, and veteran Mack Taverner choosing between brutal occupation and resistance. Identity and transcendence deepen the conflict, but military coercion and war govern."}],"image":"357-space-command.webp","definition":"Military SF of the command view: campaigns, sieges and wars directed from the top rather than fought in the ranks. Split 2026-09-25 from Military science fiction (Gustav ruling).","status":"accepted"},{"id":"new-space-opera","label":"New space opera","parent":"spacefaring-fiction","children":["political-space-opera","theological-space-opera","alien-delving","spaceship-drama"],"works":[],"image":"45-new-space-opera.webp","definition":"The self-aware revival of space opera from the 1980s on - Banks and his heirs (SFE 'Space Opera' on the New Space Opera; the Dozois/Strahan anthologies). Split 2026-09-13 from space opera to keep leaves under ten works.","status":"accepted"},{"id":"political-space-opera","label":"Political space opera","parent":"new-space-opera","children":["interstellar-court-politics","revolutionary-space-opera","post-scarcity-politics","space-succession-opera"],"works":[],"definition":"Umbrella for new space opera in which relations among large interstellar powers are the primary field of action, partitioned by the political engine.","status":"accepted","image":"151-political-space-opera.webp"},{"id":"theological-space-opera","label":"Theological space opera","parent":"new-space-opera","children":[],"image":"318-theological-space-opera.webp","definition":"Theological space opera: new space opera driven by the search for God, transcendence or a sacred order - pilgrimages to cosmic powers, starship captains drawn into holy quests, churches and messiahs on a galactic stage. Religion is the engine of the story, not background. Named by Gustav 2026-09-23.","status":"accepted","works":[{"title":"The Hyperion Cantos","cover_url":"https://covers.openlibrary.org/b/isbn/1596064692-L.jpg","shows_english_title":false,"authors":["Dan Simmons"],"year":1989,"books":[{"title":"Hyperion","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/238840-L.jpg","shows_english_title":true},{"title":"The Fall of Hyperion","year":1990,"cover_url":"https://covers.openlibrary.org/b/id/238895-L.jpg","shows_english_title":true},{"title":"Endymion","year":1996,"cover_url":"https://covers.openlibrary.org/b/id/15240278-L.jpg","shows_english_title":true},{"title":"The Rise of Endymion","year":1997,"cover_url":"https://covers.openlibrary.org/b/id/368123-L.jpg","shows_english_title":true}],"placement_note":"SFE (Dan Simmons): seven pilgrims, on the Canterbury Tales model, travel to the Time Tombs where the Shrike 'promises a dreadful Transcendence' and answers their prayers; in Endymion order returns through 'a renewed Papacy', and Aenea is 'a final Messiah' whose martyrdom is the agent for Transcendence. The theology carries all four books; the factional war mainly the first two. Moved from Cosmological politics (retired) 2026-09-23 (Gustav 16:15)."},{"title":"The Unreasoning Mask","cover_url":"https://covers.openlibrary.org/b/id/10176146-L.jpg","shows_english_title":true,"authors":["Philip José Farmer"],"year":1981,"placement_note":"Captain Hûd Ramstan of the living starship al-Buraq, struggling to hold an atheist identity against his religious upbringing, finds a planet's god in his cabin and is drawn into a metaphysical, many-sided battle against a creature destroying intelligent life (inka.de review; SF Crowsnest). Academic reading: Farmer reconciles science and religion in a single paradigm. A personal quest for God rather than a factional contest: Theological space opera."},{"title":"A Song of Salvation","cover_url":"https://covers.openlibrary.org/b/isbn/9781335453723-L.jpg","shows_english_title":true,"authors":["Alechia Dow"],"year":2023,"placement_note":"Space opera where a girl's music may save the universe: divinity, prophecy and song as cosmic forces."}]},{"id":"alien-delving","label":"Alien Delving","parent":"new-space-opera","children":[],"works":[{"title":"White Space","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534402997/ancestral-night-9781534402997.jpg","shows_english_title":true,"authors":["Elizabeth Bear"],"year":2019,"books":[{"title":"Ancestral Night","year":2019,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534402997/ancestral-night-9781534402997.jpg"},{"title":"Machine","year":2020,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781534403024/machine-9781534403024.jpg"},{"title":"The Folded Sky","year":2025,"cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781668078112/the-folded-sky-9781668078112_lg.jpg"}]},{"title":"The Memory War","cover_url":"https://mpd-biblio-covers.imgix.net/9781250215475.jpg","shows_english_title":true,"authors":["Karen Osborne"],"year":2020,"books":[{"title":"Architects of Memory","year":2020,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250215475.jpg"},{"title":"Engines of Oblivion","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250215505.jpg"}]},{"title":"Planetfall","cover_url":"https://images4.penguinrandomhouse.com/smedia/9780425282397","shows_english_title":true,"authors":["Emma Newman"],"year":2015,"books":[{"title":"Planetfall","year":2015,"cover_url":"https://images4.penguinrandomhouse.com/smedia/9780425282397"},{"title":"After Atlas","year":2016,"cover_url":"https://images3.penguinrandomhouse.com/smedia/9780425282403"},{"title":"Before Mars","year":2018,"cover_url":"https://images3.penguinrandomhouse.com/smedia/9780399587320"},{"title":"Atlas Alone","year":2019,"cover_url":"https://images2.penguinrandomhouse.com/smedia/9780399587344"}]},{"title":"Embers of War","cover_url":"https://covers.openlibrary.org/b/id/10131776-L.jpg","shows_english_title":true,"authors":["Gareth L. Powell"],"year":2018,"books":[{"title":"Embers of War","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/10131776-L.jpg"},{"title":"Fleet of Knives","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10188733-L.jpg"},{"title":"Light of Impossible Stars","year":2020,"cover_url":"https://covers.openlibrary.org/b/id/11321586-L.jpg"}],"placement_note":"SFE calls the trilogy Space Opera driven by alien artefacts that carve planets into memorial art, an approaching Forerunner species and the mysteries they leave. Entering and interpreting alien works is the trilogy’s engine, so Alien Delving is more specific than Political space opera."},{"title":"Revelation Space","cover_url":"https://covers.openlibrary.org/b/id/911071-L.jpg","shows_english_title":true,"authors":["Alastair Reynolds"],"year":2000,"placement_note":"Root-down: an interstellar human civilization passes Spacefaring fiction; Hachette and Reynolds identify it as modern space opera, so it passes New space opera; colonists and scientist Dan Sylveste excavate an extinct alien city and artifact to solve the Amarantin extinction, making Alien Delving the exact engine."},{"title":"The Luminous Dead","cover_url":"cover-the-luminous-dead.jpg","shows_english_title":true,"authors":["Caitlin Starling"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Spacefaring fiction -> New space opera -> Alien delving. SFE and Harper center a contracted caver penetrating unknown underground structures on a colonized foreign planet for mineral exploration, discovering prior expeditions and chthonic monsters. Human entry into an alien-world cave system is the engine."},{"title":"The Continuance","cover_url":"https://covers.openlibrary.org/b/id/11750083-L.jpg","shows_english_title":true,"authors":["Gareth L. Powell"],"year":2022,"placement_note":"The Continuance (Locus; FanFiAddict): scout crews probe the alien Nemesis entity and the machine-built Descendant. Humans going into alien structures drives both books. Series card: Stars and Bones (2022), Descendant Machine (2023).","books":[{"title":"Stars and Bones","year":2022,"cover_url":"https://covers.openlibrary.org/b/id/11750083-L.jpg"},{"title":"Descendant Machine","year":2023,"cover_url":"https://images-na.ssl-images-amazon.com/images/P/1789094313.01.LZZZZZZZ.jpg"}]},{"title":"Eversion","cover_url":"https://covers.openlibrary.org/b/id/13213939-L.jpg","shows_english_title":true,"authors":["Alastair Reynolds"],"year":2022,"placement_note":"An expedition into an alien structure that repeats across eras, from sailing ship to starship (PW, Locus). Delving into the alien artifact is the engine."}],"definition":"New space opera in which humans going into alien things - wrecks, derelicts, artifacts and structures - is the engine of the story.","status":"accepted","image":"152-alien-delving.webp"},{"id":"future-history-in-space","label":"Future history in space","parent":"spacefaring-fiction","children":[],"works":[{"title":"Cyteen","cover_url":"https://covers.openlibrary.org/b/id/287829-L.jpg","shows_english_title":true,"authors":["C. J. Cherryh"],"year":1988,"books":[{"title":"Cyteen","year":1988,"authors":["C. J. Cherryh"],"cover_url":"https://covers.openlibrary.org/b/id/4125331-L.jpg"},{"title":"Regenesis","year":2009}]},{"title":"Downbelow Station","cover_url":"https://covers.openlibrary.org/b/id/14948178-L.jpg","shows_english_title":true,"authors":["C. J. Cherryh"],"year":1981},{"title":"Foundation","cover_url":"https://covers.openlibrary.org/b/id/14612610-L.jpg","shows_english_title":true,"authors":["Isaac Asimov"],"year":1951,"books":[{"title":"Foundation","year":1951,"cover_url":"https://covers.openlibrary.org/b/id/14612610-L.jpg","shows_english_title":true},{"title":"Foundation and Empire","year":1952,"cover_url":"https://covers.openlibrary.org/b/id/9300695-L.jpg","shows_english_title":true},{"title":"Second Foundation","year":1953,"cover_url":"https://covers.openlibrary.org/b/id/9261324-L.jpg","shows_english_title":true},{"title":"Foundation's Edge","year":1982,"cover_url":"https://covers.openlibrary.org/b/id/6700720-L.jpg","shows_english_title":true},{"title":"Foundation and Earth","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/9304027-L.jpg","shows_english_title":true},{"title":"Prelude to Foundation","year":1988,"cover_url":"https://covers.openlibrary.org/b/id/12816973-L.jpg","shows_english_title":true},{"title":"Forward the Foundation","year":1993,"cover_url":"https://covers.openlibrary.org/b/id/9300894-L.jpg","shows_english_title":true}]},{"title":"Norstrilia","cover_url":"https://covers.openlibrary.org/b/id/477772-L.jpg","shows_english_title":true,"authors":["Cordwainer Smith"],"year":1975},{"title":"Slow Gods","cover_url":"https://covers.openlibrary.org/b/id/15215660-L.jpg","shows_english_title":true,"authors":["Claire North"],"year":2025,"placement_note":"In the corrupt Shine polity, laborer Maw becomes an FTL pilot; a jump kills everyone else and remakes him as a copy of himself, and the machine-god Slow warns a binary star will collapse in a century and wipe out worlds within 83 light-years. Maw lives on through centuries of politics and evacuation (Kirkus, Locus/Pierce, New Scientist). One long life spanning a civilization-scale timeline - future history in space. Locus Award 2026 SF shortlist + Locus Rec SF. Placed by Gustav's 2026-09-24 11:13 ruling."}],"image":"38-future-history.webp","definition":"Works tracing a sustained future course of interstellar human civilization.","status":"accepted"},{"id":"techno-fiction-in-space","label":"Space Techno Fiction","parent":"spacefaring-fiction","children":[],"works":[{"title":"Accelerando","cover_url":"https://covers.openlibrary.org/b/id/284259-L.jpg","shows_english_title":true,"authors":["Charles Stross"],"year":2005},{"title":"Takeshi Kovacs","cover_url":"https://covers.openlibrary.org/b/id/210813-L.jpg","shows_english_title":false,"authors":["Richard K. Morgan"],"year":2002,"books":[{"title":"Altered Carbon","year":2002},{"title":"Broken Angels","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/210814-L.jpg"},{"title":"Woken Furies","year":2005,"cover_url":"https://covers.openlibrary.org/b/id/211838-L.jpg"}]},{"title":"Prefect Dreyfus Emergencies","cover_url":"https://covers.openlibrary.org/b/id/1286941-L.jpg","shows_english_title":true,"authors":["Alastair Reynolds"],"year":2007,"books":[{"title":"The Prefect","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/1286941-L.jpg"},{"title":"Elysium Fire","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/11087255-L.jpg"},{"title":"Machine Vendetta","year":2024,"cover_url":"https://covers.openlibrary.org/b/id/13564806-L.jpg"}],"placement_note":"SFE identifies the trilogy as police procedurals in Yellowstone’s thousands of advanced orbital habitats before the Melding Plague; Hachette makes Elysium Fire’s neural-implant deaths and digitally mediated habitat democracy the engine. Space Techno Fiction is closest because networked cognition and habitat technology organize the crimes and society."},{"title":"Metal Trilogy","cover_url":"https://images3.penguinrandomhouse.com/smedia/9781101656099","shows_english_title":true,"authors":["John Varley"],"year":1992,"books":[{"title":"Steel Beach","year":1992,"cover_url":"https://images3.penguinrandomhouse.com/smedia/9781101656099","shows_english_title":true},{"title":"The Golden Globe","year":1998,"cover_url":"https://images4.penguinrandomhouse.com/smedia/9780441006434","shows_english_title":true},{"title":"Irontown Blues","year":2018,"cover_url":"https://images2.penguinrandomhouse.com/smedia/9781101989371","shows_english_title":true}],"placement_note":"SFE identifies Steel Beach, The Golden Globe and Irontown Blues as the Metal Trilogy within the Eight Worlds sequence, portraying complex lunar society shaped by advanced engineering and a central AI. Penguin centers Irontown Blues on Lunar life, an AI breakdown, biohackers and a genetically altered dog. Space-habitat computation, identity and bioengineering make Space Techno Fiction closest."},{"title":"The Spare Man","cover_url":"https://covers.openlibrary.org/b/id/13257893-L.jpg","shows_english_title":true,"authors":["Mary Robinette Kowal"],"year":2022,"placement_note":"A murder mystery aboard a luxury interplanetary liner, investigated by an engineering magnate (PW 'vibrant space mystery'; Library Journal). Procedural investigation in space, beside Prefect Dreyfus."}],"image":"121-techno-fiction-in-space.webp","definition":"Spacefaring fiction whose core is interstellar identity transfer, computation, networks and posthuman technology.","status":"accepted"},{"id":"alien-cosmic-history","label":"Alien cosmic history","parent":"alien-fiction","children":[],"works":[{"title":"Star Maker","cover_url":"https://covers.openlibrary.org/b/id/911107-L.jpg","shows_english_title":true,"authors":["Olaf Stapledon"],"year":1937},{"title":"Children of Time","cover_url":"https://covers.openlibrary.org/b/id/8264706-L.jpg","shows_english_title":true,"authors":["Adrian Tchaikovsky"],"year":2015,"books":[{"title":"Children of Time","year":2015,"authors":["Adrian Tchaikovsky"],"cover_url":"https://covers.openlibrary.org/b/id/8264706-L.jpg"},{"title":"Children of Ruin","year":2019,"authors":["Adrian Tchaikovsky"],"cover_url":"https://covers.openlibrary.org/b/id/8750923-L.jpg"},{"title":"Children of Memory","year":2022,"authors":["Adrian Tchaikovsky"],"cover_url":"https://covers.openlibrary.org/b/id/14633285-L.jpg"},{"title":"Children of Strife","year":2026,"authors":["Adrian Tchaikovsky"],"cover_url":"https://covers.openlibrary.org/b/id/15164053-L.jpg"}],"placement_note":"SFE follows the uplifted-spider civilization and later successor species across deep time; Pan Macmillan lists four published volumes through Children of Strife. Nonhuman civilizations emerging and meeting make Alien cosmic history the closest leaf."}],"image":"125-alien-cosmic-history.webp","definition":"Cosmic history centered on the emergence and development of radically nonhuman minds and civilizations.","status":"accepted"},{"id":"otherworldly-hard-sf","label":"Otherworldly Hard SF","parent":"otherworldly-fiction","children":[],"works":[{"title":"Anathem","cover_url":"https://covers.openlibrary.org/b/id/15242494-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2008},{"title":"Flatland","cover_url":"https://archive.org/download/flatlandromanceo0000edwi_x0a2/page/cover.jpg","shows_english_title":true,"authors":["Edwin A. Abbott"],"year":1884},{"id":"white-light","title":"White Light","authors":["Rudy Rucker"],"year":1980,"cover_url":"cover-white-light.jpg","shows_english_title":true,"books":[{"title":"White Light","year":1980,"cover_url":"cover-white-light.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Science fiction -> Futurist -> Otherworldly fiction -> Otherworldly Hard SF. SFE describes a mathematician gripped by Cantor's continuum problem speeding through transreal spacetimes that reify mathematical infinities, including Hilbert's Hotel. The rigorous mathematical world-model of a wholly other realm governs, as with Flatland on this leaf; there is no magic."}],"image":"122-otherworldly-hard-sf.webp","definition":"Rigorous speculative world-models set in an unanchored or wholly other cosmos.","status":"accepted"},{"id":"whimsical-doors","label":"Whimsical doors","parent":"portal-fantasy","children":[],"works":[{"title":"Alice in Wonderland","cover_url":"https://covers.openlibrary.org/b/id/14572004-L.jpg","shows_english_title":false,"authors":["Lewis Carroll"],"year":1865,"books":[{"title":"Alice's Adventures in Wonderland","year":1865},{"title":"Through the Looking-Glass","year":1871,"cover_url":"https://covers.openlibrary.org/b/id/14625433-L.jpg"}]},{"title":"The Chronicles of Narnia","cover_url":"https://covers.openlibrary.org/b/id/8441376-L.jpg","shows_english_title":true,"authors":["C. S. Lewis"],"year":1950,"books":[{"title":"The Lion, the Witch and the Wardrobe","year":1950,"cover_url":"https://covers.openlibrary.org/b/id/8441376-L.jpg","shows_english_title":true},{"title":"Prince Caspian","year":1951,"cover_url":"https://covers.openlibrary.org/b/id/45897-L.jpg","shows_english_title":true},{"title":"The Voyage of the Dawn Treader","year":1952,"cover_url":"https://covers.openlibrary.org/b/id/9184719-L.jpg","shows_english_title":true},{"title":"The Silver Chair","year":1953,"cover_url":"https://covers.openlibrary.org/b/id/6950992-L.jpg","shows_english_title":true},{"title":"The Horse and His Boy","year":1954,"cover_url":"https://covers.openlibrary.org/b/id/9184792-L.jpg","shows_english_title":true},{"title":"The Magician's Nephew","year":1955,"cover_url":"https://covers.openlibrary.org/b/id/1072931-L.jpg","shows_english_title":true},{"title":"The Last Battle","year":1956,"cover_url":"https://covers.openlibrary.org/b/id/6529226-L.jpg","shows_english_title":true}]},{"title":"Oz","cover_url":"https://archive.org/services/img/wonderfulwizardo00baumiala","shows_english_title":true,"authors":["L. Frank Baum"],"year":1900,"books":[{"title":"The Wonderful Wizard of Oz","year":1900,"cover_url":"https://archive.org/services/img/wonderfulwizardo00baumiala","shows_english_title":true},{"title":"The Marvelous Land of Oz","year":1904,"cover_url":"https://covers.openlibrary.org/b/id/12648656-L.jpg","shows_english_title":true},{"title":"Ozma of Oz","year":1907,"cover_url":"https://covers.openlibrary.org/b/id/12648657-L.jpg","shows_english_title":true},{"title":"Dorothy and the Wizard in Oz","year":1908,"cover_url":"https://covers.openlibrary.org/b/id/12648659-L.jpg","shows_english_title":true},{"title":"The Road to Oz","year":1909,"cover_url":"https://covers.openlibrary.org/b/id/8243922-L.jpg","shows_english_title":true},{"title":"The Emerald City of Oz","year":1910,"cover_url":"https://archive.org/services/img/TheEmeraldCityOfOz","shows_english_title":true},{"title":"The Patchwork Girl of Oz","year":1913,"cover_url":"https://archive.org/services/img/bwb_Y0-AEF-389","shows_english_title":true},{"title":"Tik-Tok of Oz","year":1914,"cover_url":"https://covers.openlibrary.org/b/id/8243277-L.jpg","shows_english_title":true},{"title":"The Scarecrow of Oz","year":1915,"cover_url":"https://covers.openlibrary.org/b/id/431586-L.jpg","shows_english_title":true},{"title":"Rinkitink in Oz","year":1916,"cover_url":"https://archive.org/services/img/rinkitinkinoz00baum","shows_english_title":true},{"title":"The Lost Princess of Oz","year":1917,"cover_url":"https://covers.openlibrary.org/b/id/854819-L.jpg","shows_english_title":true},{"title":"The Tin Woodman of Oz","year":1918,"cover_url":"https://archive.org/services/img/tinwoodmanofoz0000lfra","shows_english_title":true},{"title":"The Magic of Oz","year":1919,"cover_url":"https://covers.openlibrary.org/b/id/14919873-L.jpg","shows_english_title":true},{"title":"Glinda of Oz","year":1920,"cover_url":"https://archive.org/services/img/glindaofoz0000unse","shows_english_title":true}]},{"title":"Over the Woodward Wall","cover_url":"https://covers.openlibrary.org/b/id/10123283-L.jpg","shows_english_title":true,"authors":["A. Deborah Baker"],"year":2020,"placement_note":"Publishers Weekly calls McGuire's (as A. Deborah Baker) novel a fable-like portal fantasy: two ordinary children climb a wall that appears on their street into the Up-and-Under, an enchanted realm of talking trees and impossible roads. Playful enchanted threshold - shelfmates Alice, Narnia, Oz, Coraline, Wayward Children."},{"title":"Peter Pan","cover_url":"https://covers.openlibrary.org/b/id/7140081-L.jpg","shows_english_title":true,"authors":["J. M. Barrie"],"year":1911,"placement_note":"Intake candidates 576 (Peter and Wendy, 1000_Books) and 577 (Peter Pan, 501_MustReads) are one work: play 1904, novelized as Peter and Wendy 1911. Peter flies the Darling children out the nursery window to Neverland - the playful, wondrous threshold into another realm that defines whimsical-doors. Shelfmates: Alice, Narnia, Oz. Added once, both candidates marked processed."},{"title":"A Peculiar Peril","cover_url":"https://covers.openlibrary.org/b/id/10520614-L.jpg","shows_english_title":true,"authors":["Jeff VanderMeer"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Whimsical doors. An inherited house full of literal doors opens into Aurora; the comic YA adventure makes the anchored thresholds wondrous and playful."},{"title":"The Phantom Tollbooth","cover_url":"cover-the-phantom-tollbooth.jpg","shows_english_title":true,"authors":["Norton Juster"],"year":1961,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Whimsical doors. Penguin Random House centers a bored child driving through a mysterious physical tollbooth from his room into the bright Lands Beyond, then returning home transformed. The anchored threshold and playful child-friendly quest make Whimsical doors exact."}],"image":"127-whimsical-doors.webp","definition":"Portal fantasy with an anchored physical threshold and a child-friendly, bright story. Scary, dark or adult stories go to Eldritch doors.","status":"provisional"},{"id":"eldritch-doors","label":"Eldritch doors","parent":"portal-fantasy","children":["uncanny-thresholds","perilous-fairy-doors"],"works":[],"image":"273-eldritch-doors.webp","definition":"Pure umbrella for dark or adult portal fantasy with an anchored physical threshold, partitioned by uncanny metaphysical encounter versus perilous fairy-story or nightmare realms.","status":"umbrella"},{"id":"uncanny-thresholds","label":"Uncanny thresholds","parent":"eldritch-doors","children":[],"works":[{"title":"Piranesi","cover_url":"https://covers.openlibrary.org/b/id/10226290-L.jpg","shows_english_title":true,"authors":["Susanna Clarke"],"year":2020,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors. The House is the place-bound otherworld and its corridors connect back to ours; its monumental, uncanny solemnity governs. Split re-walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds; its solemn, philosophical, Gothic or ontologically strange crossing governs."},{"title":"The Haunted Woman","cover_url":"cover-the-haunted-woman.jpg","shows_english_title":true,"authors":["David Lindsay"],"year":1922,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors. A staircase and rooms that appear only at certain times inside a Sussex house form an anchored physical threshold into another reality; the uncanny, solemn tone makes Eldritch doors exact. Split re-walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds; its solemn, philosophical, Gothic or ontologically strange crossing governs."},{"id":"the-coming-race","title":"The Coming Race","authors":["Edward Bulwer-Lytton"],"year":1871,"cover_url":"cover-the-coming-race.webp","shows_english_title":true,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors. A mine chasm and cavern descent physically anchor the crossing into the Vril-ya world; the subterranean encounter is solemn and uncanny. Split re-walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds; its solemn, philosophical, Gothic or ontologically strange crossing governs.","sources":["https://sf-encyclopedia.com/entry/bulwer_lytton_edward","https://sf-encyclopedia.com/entry/vril"]},{"title":"The Green Child","cover_url":"cover-the-green-child.jpg","shows_english_title":true,"authors":["Herbert Read"],"year":1935,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors. New Directions grounds a quicksand portal beneath a mill-stream pool into a solemn subterranean world; the anchored physical opening and philosophical-Gothic tone make Eldritch doors exact. Split re-walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds; its solemn, philosophical, Gothic or ontologically strange crossing governs."},{"title":"Lilith","cover_url":"https://eerdmans-publishing-us.imgix.net/covers/9780802860613.jpg?auto=format&w=1200","shows_english_title":true,"authors":["George MacDonald"],"year":1895,"placement_note":"Actual-tree re-walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors. The library mirror is anchored; the adult metaphysical story is solemn and dark. Split re-walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds; its solemn, philosophical, Gothic or ontologically strange crossing governs."},{"title":"The Ship of Ishtar","cover_url":"cover-the-ship-of-ishtar.jpg","shows_english_title":true,"authors":["A. Merritt"],"year":1924,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds. ISFDB describes modern John Kenton striking open a Babylonian stone ship-model and being physically swept onto its full-size vessel beyond ordinary time and space, amid living priests of Ishtar and Nergal. The anchored artifact-crossing into a solemn metaphysical conflict governs."},{"title":"The Ten Thousand Doors of January","cover_url":"cover-the-ten-thousand-doors-of-january.jpg","shows_english_title":true,"authors":["Alix E. Harrow"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Eldritch doors -> Uncanny thresholds. Hachette/Subterranean ground January’s crossing in a physical blue Door in a Kentucky field and a mysterious book about secret doors; adult identity, power and metaphysical many-world transformation govern more than fairy-story peril."}],"image":"282-uncanny-thresholds.webp","definition":"Anchored crossings into solemn, philosophical or Gothic otherworlds where ontological strangeness, metaphysical encounter or transformation governs.","status":"accepted"},{"id":"perilous-fairy-doors","label":"Perilous fairy doors","parent":"eldritch-doors","children":["faerie-doors","nightmare-doors"],"works":[],"image":"283-perilous-fairy-doors.webp","definition":"Anchored crossings into Faerie, nightmare or storybook-derived realms where seduction, predation, combat or dangerous belonging governs, divided between doors into Faerie and doors into nightmare or storybook-derived realms.","status":"accepted"},{"id":"transporting-tomes","label":"Transporting Tomes","parent":"portal-fantasy","children":[],"works":[{"title":"The Neverending Story","cover_url":"https://covers.openlibrary.org/b/id/13200934-L.jpg","shows_english_title":true,"authors":["Michael Ende"],"year":1979},{"title":"Silverlock","cover_url":"https://covers.openlibrary.org/b/id/8260665-L.jpg","shows_english_title":true,"authors":["John Myers Myers"],"year":1949},{"title":"The Starless Sea","cover_url":"cover-the-starless-sea.jpg","shows_english_title":true,"authors":["Erin Morgenstern"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Transporting tomes. PRH follows Zachary finding a mysterious book that records his own childhood; clues inside lead him through a physical doorway to an ancient underground library and story-filled Starless Sea. The book/text initiates and governs the crossing."},{"title":"Long Live Evil","cover_url":"https://covers.openlibrary.org/b/id/14810053-L.jpg","shows_english_title":true,"authors":["Sarah Rees Brennan"],"year":2024,"placement_note":"A young woman with cancer is offered a way into her favorite fantasy series and wakes as its villainess (Kirkus, Paste). The crossing runs through the book."}],"image":"128-transporting-tomes.webp","definition":"Portal fantasy whose crossing is carried by a book, text or act ched through an uncanny rupture, makes Multiverse fantasy exact."},{"title":"The Keeper's Six","cover_url":"https://images-na.ssl-images-amazon.com/images/P/1250769078.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Kate Elliott"],"year":2024,"placement_note":"A Hex of six trekkers crosses a system of realms with dragon lords to rescue a son (PW, Reactor)."}],"image":"222-multiverse-fantasy.webp","definition":"Portal fantasy whose premise is a system of many worlds - shadow realms, parallel Londons, the multiverse as cosmology - with order and chaos in play across them (Moorcock's line; SFE 'Multiverse'). One hidden world revealed is the sibling shelf, Otherworld fantasy.","status":"accepted"},{"id":"otherworld-fantasy","label":"Otherworld fantasy","parent":"fantasy-rifts","children":[],"works":[{"title":"The Fionavar Tapestry","cover_url":"https://covers.openlibrary.org/b/id/295003-L.jpg","shows_english_title":true,"authors":["Guy Gavriel Kay"],"year":1984,"books":[{"title":"The Summer Tree","year":1984,"cover_url":"https://covers.openlibrary.org/b/id/295003-L.jpg"},{"title":"The Wandering Fire","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/295006-L.jpg"},{"title":"The Darkest Road","year":1986,"cover_url":"https://covers.openlibrary.org/b/id/295011-L.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Fantasy rifts -> Otherworld fantasy. A mage summons five Canadians across without a place- or object-bound threshold into one coherent hidden world."},{"title":"Red Moon and Black Mountain","cover_url":"https://covers.openlibrary.org/b/id/6450072-L.jpg","shows_english_title":true,"authors":["Joy Chant"],"year":1970,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Portal fantasy -> Fantasy rifts -> Otherworld fantasy. A sorcerer summons three children across without an anchored threshold into one coherent hidden world."},{"title":"Three Hearts and Three Lions","cover_url":"https://c /images/P/0759557195.01.LZZZZZZZ.jpg","shows_english_title":true,"authors":["Alex Jennings"],"year":2022,"placement_note":"Nola, a magic New Orleans where songs are power, lies beside our city; escaped songs spill between the two (Reactor, Paste: 'a tale of two Nolas')."},{"title":"The Secret Market of the Dead","cover_url":"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781668077368/the-secret-market-of-the-dead-9781668077368_hr.jpg","shows_english_title":true,"authors":["Giovanni De Feo"],"year":2025,"placement_note":"Luceria, a fictional Neapolitan town, 1747: Oriana fights her twin to inherit their father's smithy while crossing into the Night, a hidden shadow realm of seven Nocturnals and phantoms who rule destiny - one mythic Otherworld behind ours, the EoF Faerie line (PW, LJ, BookPage, FantasyLiterature; 'for those who loved Neverwhere'). Gustav ruling 2026-09-24 16:02: 'Execute otherworld', after the full tree walk (Rococo rejected: courts and salons, not artisan village; Multiverse rejected: one hidden world). WFA 2026 nominee."}],"image":"223-otherworld-fantasy.webp","definition":"Portal fantasy in which one hidden mythic world lies behind ours, waiting to be found, revealed or reconciled (Encyclopedia of Fantasy 'Otherworld', the Faerie line). A system of many worlds is the sibling shelf, Multiverse fantasy.","status":"accepted"},{"id":"secret-history","label":"Secret history","parent":"historical-fantasy","children":[],"works":[{"title":"Declare","cover_url":"https://www.topshelfbooks.com/assets/images/product/9645762fc7953cafd8f201131046ebd6.jpg","shows_english_title":true,"authors":["Tim Powers"],"year":2000},{"title":"The Aegypt Cycle","cover_url":"https://covers.openlibrary.org/b/id/14550542-L.jpg","shows_english_title":true,"authors":["John Crowley"],"year":1987,"books":[{"title":"Aegypt","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/10137373-L.jpg"},{"title":"Love & Sleep","year":1994,"cover_url":"https://covers.openlibrary.org/b/id/13240156-L.jpg"},{"title":"Daemonomania","year":2000,"cover_url":"https://covers.openlibrary.org/b/id/8281535-L.jpg"},{"title":"Endless Things","year":2007,"cover_url":"https://covers.openlibrary.org/b/id/957060-L.jpg"}]},{"title":"The Once and Future Witches","cover_url":"https://www.hachettebookgroup.com/wp-content/uploads/2026/02/9780316422017.jpg","shows_english_title":true,"authors":["Alix E. Harrow"],"year":2020},{"title":"The Diabolist's Library","cover_url":"https://covers.openlibrary.org/b/id/14454987-L.jpg","shows_english_title":true,"authors":["Molly Tanzer"],"year":2017,"books":[{"title":"Creatures of Will and Temper","year":2017,"cover_url":"https://covers.openlibrary.org/b/id/14454987-L.jpg","shows_english_title":true},{"title":"Creatures of Want and Ruin","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/8813142-L.jpg","shows_english_title":true},{"title":"Creatures of Charm and Hunger","year":2020,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780358065210","shows_english_title":true}]},{"title":"The Innsmouth Legacy","cover_url":"https://mpd-biblio-covers.imgix.net/9780765390905.jpg","shows_english_title":true,"authors":["Ruthanna Emrys"],"year":2017,"books":[{"title":"Winter Tide","year":2017,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765390905.jpg","shows_english_title":true},{"title":"Deep Roots","year":2018,"cover_url":"https://mpd-biblio-covers.imgix.net/9780765398093.jpg","shows_english_title":true}]},{"title":"The Baroque Cycle","cover_url":"https://covers.openlibrary.org/b/id/274243-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2003,"placement_note":"SFE stephenson_neal: the Baroque Cycle is couched as historical novels but 'do have fantastical elements' - the possibly Immortal Enoch Root, who may be a Secret Master monitoring the creation of modernity. Hidden fantastical thread beneath documented Enlightenment history. Shelfmates Declare, The Aegypt Cycle.","books":[{"title":"Quicksilver","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/274243-L.jpg"},{"title":"The Confusion","year":2004,"cover_url":"https://sf-encyclopedia.com/gallery.php?id=Stephenson-Baroque2.jpg"},{"title":"The System of the World","year":2004,"cover_url":"https://sf-encyclopedia.com/gallery.php?id=Stephenson-Baroque3.jpg"}]},{"title":"The Water Dancer","cover_url":"cover-the-water-dancer.jpg","shows_english_title":true,"authors":["Ta-Nehisi Coates"],"year":2019,"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Secret history. Memory-and-water magic covertly transports enslaved people within antebellum Virginia and the historical Underground Railroad, supplying a hidden magical mechanism behind documented history."}],"image":"136-secret-history.webp","definition":"Historical fantasy in which documented history is secretly explained by a hidden magical truth, and secrecy itself is a main theme. Open or publicly known magic does not qualify.","status":"accepted"},{"id":"rococo-fantasy","label":"Rococo fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"The Kingdom of Back","cover_url":"https://images.booksense.com/images/010/739/9781524739010.jpg","shows_english_title":true,"authors":["Marie Lu"],"year":2020}],"image":"137-rococo-fantasy.webp","definition":"Fantasy of the Rococo world: eighteenth-century courtly and musical Europe, with its ornate salons, manners, artifice and fairy-tale elegance.","status":"accepted"},{"id":"andalusian-fantasy","label":"Andalusian fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"The Bird King","cover_url":"https://groveatlantic.com/core/wp-content/uploads/2018/03/BirdKingHC_Front.jpg","shows_english_title":true,"authors":["G. Willow Wilson"],"year":2019}],"image":"138-andalusian-fantasy.webp","definition":"Historical fantasy rooted in medieval Muslim Iberia and the cultures, courts and conflicts of Al-Andalus, including the final Kingdom of Granada.","status":"accepted"},{"id":"period-fantasy","label":"Period fantasy","parent":"historical-fantasy","children":["antique-times-fantasy","industrial-age-fantasy"],"works":[],"image":"140-period-fantasy.webp","definition":"Historical fantasy anchored to a documented era, whose source is chronicles and recorded history; the era is the stage, not a puzzle secretly explained or rewritten.","status":"umbrella"},{"id":"antique-times-fantasy","label":"Antique times fantasy","parent":"period-fantasy","children":["celtic-fantasy","viking-fantasy","autumn-kingdoms","andalusian-fantasy","renaissance-fantasy","rococo-fantasy"],"works":[],"image":"265-antique-times-fantasy.webp","definition":"Umbrella for Period fantasy set before 1788, spanning the post-Roman, Viking, medieval, Renaissance, Andalusian and Rococo historical stages.","status":"umbrella"},{"id":"industrial-age-fantasy","label":"Industrial age fantasy","parent":"period-fantasy","children":["gaslight-fantasy","antebellum-fantasy","weird-west-fantasy","tudorbethan-fantasy","dust-bowl-fantasy","noir-fantasy","neon-fantasy"],"works":[],"image":"266-industrial-age-fantasy.webp","definition":"Umbrella for Period fantasy set from 1788 onward, from the Regency and industrial nineteenth century through the interwar, Depression and late-twentieth-century eras.","status":"umbrella"},{"id":"antebellum-fantasy","label":"Antebellum fantasy","parent":"industrial-age-fantasy","children":[],"image":"309-antebellum-fantasy.webp","definition":"Fantasy of the American South in the decades before the Civil War (roughly 1800-1861), where slavery, flight and the struggle for freedom form the historical stage for the impossible. Named by Gustav 2026-09-23.","status":"accepted","works":[{"title":"The Underground Railroad","cover_url":"https://covers.openlibrary.org/b/isbn/9780385542364-L.jpg","shows_english_title":true,"authors":["Colson Whitehead"],"year":2016,"placement_note":"Penguin Random House follows Cora's escape from a Georgia plantation in the antebellum South; the Underground Railroad is a literal impossible network of tracks and tunnels beneath the earth. That impossibility puts it on the Fantasy side under Gustav's divider, and the slavery-era South is the defining historical stage."}]},{"id":"noir-fantasy","label":"Noir fantasy","parent":"industrial-age-fantasy","children":[],"image":"308-noir-fantasy.webp","definition":"Fantasy set in the hardboiled urban crime era of roughly the 1930s and 1940s, where gangsters, nightclubs, moral shadow and the approach of war form the stage for real magic. Named by Gustav 2026-09-23; future siblings banked: Gatsby fantasy, Deco fantasy.","status":"accepted","works":[{"title":"Trouble the Saints","cover_url":"https://covers.openlibrary.org/b/id/10288337-L.jpg","shows_english_title":true,"authors":["Alaya Dawn Johnson"],"year":2020,"placement_note":"Tor sets it in 1940s New York on the eve of WWII: Phyllis, an assassin with a juju gift for knives, works for a Harlem crime boss, and gifts of prophecy and power are real. Crime underworld, nightclubs, moral shadow and racial violence in that era make it hardboiled noir with actual magic."},{"title":"Siren Queen","cover_url":"https://covers.openlibrary.org/b/id/12738606-L.jpg","shows_english_title":true,"authors":["Nghi Vo"],"year":2022,"placement_note":"A young Chinese-American actress fights for stardom in a 1930s Hollywood run on real, bloody magic (BookPage, Lightspeed). Hardboiled-era stage for actual magic."}]},{"id":"neon-fantasy","label":"Neon fantasy","parent":"industrial-age-fantasy","children":[],"works":[{"id":"the-angels-of-l19","title":"The Angels of L19","authors":["Jonathan Walker"],"year":2021,"cover_url":"cover-the-angels-of-l19.webp","shows_english_title":true,"placement_note":"Weather Glass Books sets the novel in Liverpool in 1984, amid Thatcher-era politics, youth culture and evangelical life, with angelic and demonic visitations. Its specific 1980s social texture and supernatural intrusion make Neon fantasy the exact leaf.","sources":["https://weatherglassbooks.com/shop/the-angels-of-l19"]},{"title":"Left-Handed Booksellers of London","cover_url":"cover-left-handed-booksellers.jpg","shows_english_title":true,"authors":["Garth Nix"],"year":2020,"books":[{"title":"The Left-Handed Booksellers of London","year":2020,"cover_url":"cover-left-handed-booksellers.jpg"},{"title":"The Sinister Booksellers of Bath","year":2023,"cover_url":"https://covers.openlibrary.org/b/id/13204034-L.jpg"}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Period fantasy -> Industrial Age fantasy -> Neon fantasy. Nix sets the series in a slightly alternate London in 1983, where magical fighting booksellers police the mythic Old World when it intrudes on the modern city. The specific 1980s setting and magical intrusion fit Neon fantasy."}],"image":"263-neon-fantasy.webp","definition":"1980s-era historical fantasy in which neon, analogue media, youth culture and late-Cold-War social textures form the stage for supernatural intrusion - the Stranger Things texture.","status":"accepted"},{"id":"alternate-history-fantasy","label":"Alternate history fantasy","parent":"historical-fantasy","children":["alt-crusade-fantasy","alt-ming-fantasy","alt-spice-route-fantasy","alt-flintlock-fantasy","alt-diesel-fantasy"],"works":[],"image":"139-alternate-history-fantasy.webp","definition":"Pure umbrella for divergent timelines where magic is the engine: history is openly rewritten and the world runs on magic. Split by era and geography: Alt Crusade, Alt Ming, Alt Spice Route, Alt Flintlock and Alt Diesel fantasy.","status":"accepted"},{"id":"alt-crusade-fantasy","label":"Alt Crusade fantasy","parent":"alternate-history-fantasy","children":[],"image":"327-alt-crusade-fantasy.webp","definition":"Alternate history fantasy of medieval Christendom and the crusading age, Europe and the  sailors, merchants, pirates and djinn, and magic is the engine: history is openly rewritten and the world runs on magic.","status":"accepted","works":[{"title":"The Adventures of Amina al-Sirafi","cover_url":"https://covers.openlibrary.org/b/id/13236045-L.jpg","shows_english_title":true,"authors":["Shannon Chakraborty"],"year":2023,"placement_note":"A retired pirate captain is pulled back to sea in the 12th-century Indian Ocean, from Aden across the monsoon trade routes, into a quest thick with djinn, sorcery and sea monsters (NYT, BookPage, Lightspeed). The medieval spice-route world with working magic is the engine. First card of Alt Spice Route fantasy by Gustav's 23:01 ruling."}]},{"id":"alt-flintlock-fantasy","label":"Alt Flintlock fantasy","parent":"alternate-history-fantasy","children":[],"image":"330-alt-flintlock-fantasy.webp","definition":"Alternate history fantasy of the musket age, roughly the 17th century to the Napoleonic and Regency years, in Europe and the early American frontier: armies, courts and empires of powder and sail, and magic is the engine: history is openly rewritten and the world runs on magic.","status":"accepted","works":[{"title":"The Tales of Alvin Maker","cover_url":"https://covers.openlibrary.org/b/id/9315050-L.jpg","shows_english_title":true,"authors":["Orson Scott Card"],"year":1987,"books":[{"title":"Seventh Son","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/9315050-L.jpg","shows_english_title":true},{"title":"Red Prophet","year":1988,"cover_url":"https://covers.openlibrary.org/b/id/9315058-L.jpg","shows_english_title":true},{"title":"Prentice Alvin","year":1989,"cover_url":"https://covers.openlibrary.org/b/id/14476036-L.jpg","shows_english_title":true},{"title":"Alvin Journeyman","year":1995,"cover_url":"https://covers.openlibrary.org/b/id/6382372-L.jpg","shows_english_title":true},{"title":"Heartfire","year":1998,"cover_url":"https://covers.openlibrary.org/b/id/10620724-L.jpg","shows_english_title":true},{"titl tps://images4.penguinrandomhouse.com/cover/9780425283400"},{"title":"The True Queen","year":2019,"cover_url":"https://images1.penguinrandomhouse.com/cover/9780425283417"}],"placement_note":"SFE identifies an Alternate History Regency Britain with publicly practiced magic and trade with Fairyland; magical institutions and Faerie politics openly restructure the world."},{"title":"Angel Mage","cover_url":"https://covers.openlibrary.org/b/id/8792047-L.jpg","shows_english_title":true,"authors":["Garth Nix"],"year":2019}]},{"id":"alt-diesel-fantasy","label":"Alt Diesel fantasy","parent":"alternate-history-fantasy","children":[],"image":"331-alt-diesel-fantasy.webp","definition":"Alternate history fantasy of the machine-age 20th century, roughly the 1910s to the 1950s, from Cairo and Europe to America: world wars, airships, empires and cities of steel, and magic is the engine: history is openly rewritten and the world runs on magic.","status":"accepted","works":[{"title":"Dead Djinn Universe","cover_url":"https://covers.openlibrary.org/b/id/10457293-L.jpg","shows_english_title":true,"authors":["P. Djèlí Clark"],"year":2016,"books":[{"title":"A Dead Djinn in Cairo","year":2016,"cover_url":"https://covers.openlibrary.org/b/id/8542858-L.jpg"},{"title":"The Haunting of Tram Car 015","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/8566730-L.jpg"},{"title":"A Master of Djinn","year":2021,"cover_url":"https://covers.openlibrary.org/b/id/10457293-L.jpg"}]},{"title":"Summerland","cover_url":"https://mpd-biblio-covers.imgix.net/9781250178947.jpg","shows_english_title":true,"authors":["Hannu Rajaniemi"],"year":2018,"placement_note":"SFE explicitly calls it an Alternate History Europe before World War II; Tor sets it in 1938 after discovery of an exploitable afterlife lets the British Empire colonize the dead and the USSR build a god. The public supernatural order rewrites geopolitics and history, making Alternate-history fantasy exact rather than period atmosphere or secret history."},{"title":"Burn","cover_url":"https://covers.openlibrary.org/b/id/10097446-L.jpg","shows_english_title":true,"authors":["Patrick Ness"],"year":2020,"placement_note":"Ness's official synopsis sets the novel in 1957 with farm-working dragons, prophecy, a dragon-worshipping cult, an assassin and FBI agents. Working dragons and prophecy openly transform mid-century America, so magic is the history-rewriting engine."},{"title":"Dominion of the Fallen","cover_url":"cover-house-shattered-wings.jpg","shows_english_title":true,"authors":["Aliette de Bodard"],"year":2015,"books":[{"title":"The House of Shattered Wings","year":2015,"cover_url":"cover-house-shattered-wings.jpg","shows_english_title":true},{"title":"The House of Binding Thorns","year":2017,"cover_url":"cover-house-binding-thorns.jpg","shows_english_title":true},{"title":"The House of Sundering Flames","year":2019,"cover_url":"cover-house-sundering-flames.jpg","shows_english_title":true}],"placement_note":"Actual-tree walk: Speculative fiction -> Fantasy -> Real Earth Universe -> Historical fantasy -> Alternate history fantasy. The author grounds a Paris devastated by a magical war, governed by rival Houses of Fallen angels, magicians and dragons; the openly rewritten world and magical politics govern over Gothic atmosphere. The House of Sundering Flames is book 3, so one complete three-novel series card prevents duplication."}]},{"id":"books-in-books","label":"Books in Books","parent":"fabulation","children":["contradiction-fiction","meta-remyth","textual-trespass","scripted-books-in-books"],"works":[],"image":"141-books-in-books.webp","definition":"Umbrella for fabulations in which texts destabilize reality, whether invented documents contradict their own worlds or inherited stories are entered, rewritten and replayed.","status":"accepted"},{"id":"contradiction-fiction","label":"Contradiction fiction","parent":"books-in-books","children":[],"works":[{"title":"The Blind Assassin","cover_url":"https://covers.openlibrary.org/b/id/11041760-L.jpg","shows_english_title":true,"authors":["Margaret Atwood"],"year":2000},{"title":"The Prestige","cover_url":"https://covers.openlibrary.org/b/id/8419414-L.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":1995,"placement_note":"SFE calls it sui generis late-twentieth-century Fantastika whose equipoisal stage/literal magic, Tesla matter transmission and unreliable inward narration refuse a stable SF-or-fantasy reading; its self-conscious misdirection makes Fabulation the closest current leaf."},{"title":"A Sick Gray Laugh","cover_url":"https://wordhorde.com/wp-content/uploads/2019/06/sgl_cover_sm-518x800.jpg","shows_english_title":true,"authors":["Nicole Cushing"],"year":2019},{"title":"An American Story","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2019/01/hbg-title-an-american-story-2-33.jpg","shows_english_title":true,"authors":["Christopher Priest"],"year":2018},{"title":"Confessions of the Fox","cover_url":"https://images1.penguinrandomhouse.com/cover/9780399592287","shows_english_title":true,"authors":["Jordy Rosenberg"],"year":2018}],"image":"181-contradiction-fiction.webp","definition":"Books-in-books fiction built around invented documents whose conflicting accounts, omissions or false authority put text and reality at war.","status":"accepted"},{"id":"meta-remyth","label":"Meta Remyth","parent":"books-in-books","children":[],"works":[{"title":"Lord Grandrith / Doc Caliban","cover_url":"https://covers.openlibrary.org/b/id/7376512-L.jpg","shows_english_title":true,"authors":["Philip José Farmer"],"year":1969,"books":[{"title":"A Feast Unknown","year":1969,"cover_url":"https://covers.openlibrary.org/b/id/7376512-L.jpg"},{"title":"Lord of the Trees","year":1970,"cover_url":"https://covers.openlibrary.org/b/id/7748239-L.jpg"},{"title":"The Mad Goblin","year":1970,"cover_url":"https://covers.openlibrary.org/b/id/10370591-L.jpg"}]},{"title":"Ahab's Return; or, The Last Voyage","cover_url":"https://covers.openlibrary.org/b/id/14290189-L.jpg","shows_english_title":true,"authors":["Jeffrey Ford"],"year":2018,"placement_note":"SFE says Ahab survives while Ishmael has written Moby-Dick, then enters a fantasticated New York. Publishers Weekly frames the premise as Moby-Dick being a fictionalized version of reality. By making a canonical novel an unreliable artifact inside its own rewritten continuation, it foregrounds storytelling as the fantastic device, making Fabulation closest."},{"title":"Engine Summer","cover_url":"https://covers.openlibrary.org/b/id/6744965-L.jpg","shows_english_title":true,"authors":["John Crowley"],"year":1979,"placement_note":"SFE reveals that Rush That Speaks and the life he narrates are a memory embedded in a crystal device, replayed on command: the protagonist is the recorded story artifact. That nested narration and ontological reversal make Books in Books more specific than its pastoral post-Holocaust setting."},{"title":"Lavinia","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2025/02/hbg-title-lavinia-3-52.jpg","shows_english_title":true,"authors":["Ursula K. Le Guin"],"year":2008,"placement_note":"SFE says Lavinia depicts Aeneas’s wife, uniquely aware that she is Virgil’s fictional creation; Le Guin’s site says the novel gives the silent Aeneid character a voice in ancient Italy. Because it consciously re-enters and rewrites an inherited text from inside, Meta Remyth is more exact than a general myth retelling."},{"title":"Pride and Prometheus","cover_url":"https://covers.openlibrary.org/b/id/14619682-L.jpg","shows_english_title":true,"authors":["John Kessel"],"year":2018,"placement_note":"Meta-remyth: enters and merges two inherited texts - Pride and Prejudice and Frankenstein - following Mary Bennet into Victor Frankenstein's story and making both live differently (Saga Press; Nebula-winning 2008 story expanded). Shelfmates Lavinia and Ahab's Return."}],"image":"182-meta-remyth.webp","definition":"Second-order books-in-books fiction that enters, rewrites or replays inherited texts and cultural stories, making an existing myth live differently.","status":"accepted"},{"id":"textual-trespass","label":"Textual trespass","parent":"books-in-books","children":[],"works":[{"title":"Thursday Next","cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-eyre-affair-224.jpg","shows_english_title":true,"authors":["Jasper Fforde"],"year":2001,"books":[{"title":"The Eyre Affair","year":2001,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-eyre-affair-224.jpg","shows_english_title":true},{"title":"Lost in a Good Book","year":2002,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-lost-in-a-good-book-129.jpg","shows_english_title":true},{"title":"The Well of Lost Plots","year":2003,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-well-of-lost-plots-122.jpg","shows_english_title":true},{"title":"Something Rotten","year":2004,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-something-rotten-116.jpg","shows_english_title":true},{"title":"First Among Sequels","year":2007,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-first-among-sequels-111.jpg","shows_english_title":true},{"title":"One of Our Thursdays Is Missing","year":2011,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-one-of-our-thursdays-is-missing-128.jpg","shows_english_title":true},{"title":"The Woman Who Died a Lot","year":2012,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2019/04/hbg-title-the-woman-who-died-a-lot-2-28.jpg","shows_english_title":true},{"title":"Dark Reading Matter","year":2026,"cover_url":"https://www.hodder.co.uk/wp-content/uploads/2025/12/hbg-title-dark-reading-matter-77.jpg","shows_english_title":true}],"placement_note":"SFE calls Thursday Next an Alternate World sequence whose metafictional topoi interpenetrate its setting: characters enter books, alter them from within, and thereby alter the real world. That story-world feedback makes Fabulation the highest defining trait."},{"title":"Breakfast of Champions","cover_url":"https://images4.penguinrandomhouse.com/cover/9780385334204","shows_english_title":true,"authors":["Kurt Vonnegut"],"year":1973},{"title":"Or What You Will","authors":["Jo Walton"],"year":2020,"cover_url":"https://covers.openlibrary.org/b/id/10126592-L.jpg","shows_english_title":true,"placement_note":"Wikipedia/Tor: Sylvia Harrison's imaginary-friend narrator - the basis of all her characters - plans their immortality through the very book she is writing; a written fiction breaching into lived reality is textual trespass (cf. Thursday Next, Breakfast of Champions)."}],"image":"183-textual-trespass.webp","definition":"Books-in-books fiction where the boundary between a specific text and lived reality is breached, with people entering and altering books or written fictions escaping into the world.","status":"accepted"},{"id":"classic-fabulation","label":"Classic Fabulation","parent":"fabulation","children":["metafictional-worldmaking","absurdist-constructed-realities"],"works":[],"image":"203-classic-fabulation.webp","definition":"Foundational fabulations in which openly constructed worlds divide between storytelling that makes reality and impossible systems that govern it.","status":"accepted"},{"id":"inner-space","label":"Inner Space","parent":"fabulation","children":["psychogeographic-fabulation","consciousness-fiction","projected-realities"],"works":[],"image":"204-inner-space.webp","definition":"Fabulations in which desire, memory, trauma or altered perception projects a competing reality, with no stable boundary between psyche and world.","status":"umbrella"},{"id":"body-myth","label":"Body Myth","parent":"fabulation","children":[],"works":[{"title":"The Passion of New Eve","cover_url":"https://covers.openlibrary.org/b/id/11949528-L.jpg","shows_en er_url":"https://covers.openlibrary.org/b/isbn/9780141189796-L.jpg"},{"title":"The Western Lands","year":1987,"cover_url":"https://covers.openlibrary.org/b/id/2385910-L.jpg"}]}],"image":"206-alternate-worlds.webp","definition":"Literary fabulations whose alternate Earths destabilize memory, geography and history, rather than mechanism-centered parallel-world travel or conventional counterfactual history.","status":"accepted"},{"id":"godgame","label":"Godgame","parent":"fabulation","children":[],"works":[{"title":"Fourth Mansions","cover_url":"https://covers.openlibrary.org/b/id/926710-L.jpg","shows_english_title":true,"authors":["R. A. Lafferty"],"year":1969,"placement_note":"SFE describes dreamlike arcane clues, competing supernatural cabals, mythic archetypes and a Godgame whose outcome changes the moral nature of reality. The visibly unstable pattern of reality makes Worlds in flux the closest leaf."}],"image":"207-godgame.webp","definition":"Fabulations in which rival occult or godlike powers contest and alter the hidden moral pattern of reality as a game.","status":"accepted"},{"id":"renaissance-fantasy","label":"Renaissance fantasy","parent":"antique-times-fantasy","children":[],"works":[{"title":"The Drawing of the Dark","cover_url":"cover-the-drawing-of-the-dark.webp","shows_english_title":true,"authors":["Tim Powers"],"year":1979,"placement_note":"SFE calls it outright fantasy and grounds Merlin, a reborn Fisher King and Arthur's avatar defending sixteenth-century Vienna; Penguin places Duffy amid the historical Ottoman siege, ifrits, dwarfs, Vikings and ancient supernatural forces. The documented 1529 Renaissance setting governs."},{"title":"Ariosto","cover_url":"https://covers.openlibrary.org/b/id/7424286-L.jpg","shows_english_title":true,"authors":["Chelsea Quinn Yarbro"],"year":1980},{"title":"Black Magic","cover_url":"https://cdn.penguin.co.uk/dam-assets/books/9781529956351/9781529956351-jacket-large.jpg","shows_english_title":true,"authors":["Marjorie n ensorcelled queen. The 1951-53 Pusadian tales belong to the older pulp wave."}],"image":"golden-age-sword-and-sorcery.webp","definition":"The older pulp Sword and Sorcery wave and its direct late-century continuation, from Fafhrd and the Gray Mouser through The Black Company.","status":"provisional"},{"id":"sword-and-sorcery-revival","label":"S&S Revival","parent":"pulp-sword-and-sorcery","children":[],"works":[{"title":"The Dark Star Trilogy","cover_url":"https://images.penguinrandomhouse.com/cover/700jpg/9780735220171","shows_english_title":true,"authors":["Marlon James"],"year":2019,"books":[{"title":"Black Leopard, Red Wolf","year":2019,"cover_url":"https://images.penguinrandomhouse.com/cover/700jpg/9780735220171"},{"title":"Moon Witch, Spider King","year":2022,"cover_url":"https://images.penguinrandomhouse.com/cover/700jpg/9780735220201"}]}],"image":"sword-and-sorcery-revival.webp","definition":"Contemporary revival of the pulp Sword and Sorcery tradition; seeded by Marlon James’s 2019 Dark Star Trilogy.","status":"provisional"},{"id":"mayan-myth-fantasy","label":"Mayan myth fantasy","parent":"mythic-retelling","children":[],"works":[{"title":"Gods of Jade and Shadow","cover_url":"https://images.booksense.com/images/754/620/9780525620754.jpg","shows_english_title":true,"authors":["Silvia Moreno-Garcia"],"year":2019,"placement_note":"SFE calls it a Jazz Age fantasy replete with Mayan gods, centered on the death god reclaiming his kingdom; PRH follows Casiopea through Mexico and the Mayan underworld. It reimagines named figures and cosmology from Mayan mythology."}],"image":"171-mayan-myth-fantasy.webp","definition":"Fantasy that retells or reimagines named figures, narratives and cosmology from Mayan mythology.","status":"accepted"},{"id":"navajo-myth-fantasy","label":"Navajo myth fantasy","parent":"mythic-retelling","children":[],"image":"224-navajo-myth-fantasy.webp","definition":"Fantasy that retells or reimagines named figures, narratives and cosmology from Navajo (Diné) mythology.","status":"accepted","works":[{"title":"Race to the Sun","cover_url":"https://covers.openlibrary.org/b/id/9261764-L.jpg","shows_english_title":true,"authors":["Rebecca Roanhorse"],"year":2020,"placement_note":"SFE roanhorse_rebecca: 'fantasy irradiated by the Navajo cauldron of story'. Nizhoni Begay, the Hero Twins (Monster Slayer and Born-for-Water) and Changing Woman from Diné cosmology drive the plot. Sibling leaf to mayan-myth-fantasy under mythic-retelling."},{"title":"Trail of Lightning","cover_url":"https://covers.openlibrary.org/b/id/9384029-L.jpg","shows_english_title":true,"authors":["Rebecca Roanhorse"],"year":2018,"books":[{"title":"Trail of Lightning","year":2018,"cover_url":"https://covers.openlibrary.org/b/id/9384029-L.jpg"},{"title":"Storm of Locusts","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/8795608-L.jpg"}],"placement_note":"Complete two-book Sixth World sequence. Simon & Schuster sets it in Dinetah after climate catastrophe, where Dine gods, heroes and monsters walk again: monster hunter Maggie Hoskie, the immortal Neizghani (Monster Slayer), Coyote and clan powers drive both books. Named figures and cosmology from Navajo (Dine) mythology govern the story, which is this leaf's test; the future setting doesn't change that. Sibling card to Race to the Sun."}]},{"id":"biblical-fantasy","label":"Biblical fantasy","parent":"mythic-retelling","children":[],"image":"332-biblical-fantasy.webp","definition":"Fantasy that retells or reimagines named figures and narratives from the Bible, with its miracles as real magic: prophets, patriarchs, the Gospels and their people told as working myth.","status":"accepted","works":[{"title":"HIM","cover_url":"https://images1.penguinrandomhouse.com/cover/9781915202673","shows_english_title":true,"authors":["Geoff Ryman"],"year":2023,"placement_note":"The life of Jesus retold through his mother Maryam, with Aramaic names: a parthenogenetic virgin birth yields a child born fe

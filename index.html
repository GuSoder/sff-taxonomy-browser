al"},{"id":"soft-science-fiction","label":"Soft science fiction","parent":"modern-day","children":["social-science-fiction","psi-powers","superhero-fiction"],"works":[],"image":"32-soft-science-fiction.webp","definition":"The broad counterpoint to hard SF: speculative fiction not driven by physical science or engineering, including social-science stories, psi powers and superhero fiction.","status":"accepted"},{"id":"apocalyptic-fiction","label":"Apocalyptic fiction","parent":"modern-day","children":["chemical-catastrophe","climate-catastrophe","cosmic-catastrophe","pandemic","unknown-catastrophe"],"image":"34-apocalyptic-fiction.webp","definition":"Tales of the catastrophe as it unfolds - the end of the world in progress (SFE 'Apocalypse' theme). Split 2026-09-13 from apocalyptic and post-apocalyptic fiction; became an umbrella 2026-09-14 over the five catastrophe leaves on Gustav's directive.","status":"candidate","works":[]},{"id":"chemical-catastrophe","label":"Chemical Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"77-chemical-catastrophe.webp","definition":"The world ends through chemistry or matter itself - a new form of ice freezing the oceans, crystallization consuming the world. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[{"title":"Cat's Cradle","cover_url":"https://covers.openlibrary.org/b/id/14572638-L.jpg","shows_english_title":true,"authors":["Kurt Vonnegut"],"year":1963},{"title":"The Crystal World","cover_url":"https://covers.openlibrary.org/b/id/8443804-L.jpg","shows_english_title":true,"authors":["J. G. Ballard"],"year":1966}]},{"id":"climate-catastrophe","label":"Climate Catastrophe","parent":"apocalyptic-fiction","children":[],"image":"79-climate-catastrophe.webp","definition":"The climate itself turns against civilization - drowned tropical cities, an America unravelling under ecological collapse. Coined by Gustav 2026-09-14; not an SFE/EoF headword.","status":"provisional","works":[ le":true,"authors":["Philip K. Dick"],"year":1977},{"title":"Air (Or, Have Not Have)","cover_url":"https://www.hachette.co.uk/wp-content/uploads/2018/07/hbg-title-air-26.jpg","shows_english_title":true,"authors":["Geoff Ryman"],"year":2004,"placement_note":"SFE describes Air as networked information technology that embeds itself in Mae until she in a sense becomes Air, forcing her to guide a traditional village into a transformed world. Hachette likewise centers the technology, information overload and social change. Technology merging with mind and reorganizing community makes Technomorphosis closest."},{"title":"Anthropocene Rag","cover_url":"https://mpd-biblio-covers.imgix.net/9781250269270.jpg","shows_english_title":true,"authors":["Alex Irvine"],"year":2020},{"title":"CatNet","cover_url":"https://covers.openlibrary.org/b/id/10104877-L.jpg","shows_english_title":true,"authors":["Naomi Kritzer"],"year":2019,"books":[{"title":"Catfishing on CatNet","year":2019,"cover_url":"https://covers.openlibrary.org/b/id/10104877-L.jpg"},{"title":"Chaos on CatNet","year":2021,"cover_url":"https://mpd-biblio-covers.imgix.net/9781250165213.jpg"}],"placement_note":"SFE identifies the same benevolent emergent AI across both novels. Publisher sources center a sentient AI administering an ordinary social network, then a rival AI hacking networks to trigger real-world violence. Technology reorganizing friendship, mutual aid, privacy and everyday social life makes Technomorphosis closest."},{"title":"Darwin","cover_url":"https://covers.openlibrary.org/b/id/210914-L.jpg","shows_english_title":true,"authors":["Greg Bear"],"year":1999,"books":[{"title":"Darwin's Radio","year":1999,"cover_url":"https://covers.openlibrary.org/b/id/210914-L.jpg","shows_english_title":true},{"title":"Darwin's Children","year":2003,"cover_url":"https://covers.openlibrary.org/b/id/5598801-L.jpg","shows_english_title":true}]},{"title":"Fall; or, Dodge in Hell","cover_url":"https://covers.openlibrary.org/b/id/8742303-L.jpg","shows_english_title":true,"authors":["Neal Stephenson"],"year":2019,"placement_note":"Harper describes technology turning a dead man's scanned brain into a digital consciousness and ultimately creating Bitworld, an eternal afterlife for humanity. The technology does not remain a tool: it transforms death, mind, society and the form of human existence, making Technomorphosis the closest leaf."},{"title":"Frankissstein","cover_url":"https://covers.openlibrary.org/b/id/9047532-L.jpg","shows_english_title":true,"authors":["Jeanette Winterson"],"year":2019,"placement_note":"SFE places AI ascension, posthuman identity and cryonics at the center of its near-future frame; Penguin describes its inquiry into AI, bodies and what it means to be human. Technology remaking bodily and human identity makes Technomorphosis the closest leaf."}],"image":"126-technomorphosis.webp","definition":"Fiction in which technology ceases to be a discrete tool and transforms the form of human bodies, minds, social organization or everyday life.","status":"accepted"},{"id":"future-war","label":"Future War","parent":"future-of-earth-fiction","children":[],"works":[{"title":"Rogue Sequence","cover_url":"https://mpd-biblio-covers.imgix.net/9781250322432.jpg","shows_english_title":true,"authors":["Zac Topping"],"year":2025}],"image":"123-earthbound-military-sf.webp","definition":"War transformed by technology and fought on Earth. Near-future and modern entries are included; Earthbound conflict remains the core.","status":"accepted"},{"id":"future-history-of-earth","label":"Future history of Earth","parent":"future-of-earth-fiction","children":[],"works":[{"title":"City","cover_url":"https://covers.openlibrary.org/b/id/15219495-L.jpg","shows_english_title":true,"authors":["Clifford D. Simak"],"year":1952},{"title":"Last and First Men","cover_url":"https://covers.openlibrary.org/b/id/911106-L.jpg","shows_english_title":true,"authors":["Olaf Stapledon"],"year":1930},{"title":"The End of Et function renderFic(id,idx){current=id;curFic=idx;curBook=-1;curEd=-1;heroSeq++;document.querySelector('.panel').classList.remove('hero','revealed');let hs=document.getElementById('herospacer');if(hs)hs.remove();let n=by[id],w=n.works[idx];setBg(w.cover_url);title.textContent=w.title;crumb.textContent=path(n)+' › '+w.title;back.style.visibility='visible';let books=w.books&&w.books.length?w.books:[{title:w.title,authors:w.authors,year:w.year,cover_url:w.cover_url}];ficPreload.length=0;ficShelf=null;books.forEach(b=>{if(b.cover_url){['M','L'].forEach(t=>{let pi=new Image();pi.src=sz(b.cover_url,t);ficPreload.push(pi)})}});(w.editions||[]).forEach(e=>Object.values(e.covers||{}).forEach(c=>{if(c&&c.cover_url){let pi=new Image();pi.src=sz(c.cover_url,'M');ficPreload.push(pi)}}));count.textContent=`${books.length} book${books.length===1?'':'s'} in this fiction`;hint.textContent=books.length>1?'Series / shared universe · tap a book to open its page.':'Standalone fiction.';let eds=w.editions||[];let edHtml='';if(books.length>1&&eds.length)edHtml=`<div class="sec">Editions · tap to dress every book in one edition; tap again to reset</div><div class="strip">${eds.map((e,ei)=>{let first=books.find(b=>e.covers[slug(b.title)]);let rep=first?e.covers[slug(first.title)].cover_url:'';return `<button class="v" data-ed="${ei}"><img src="${sz(rep,'S')}" alt="${e.label}" loading="lazy" decoding="async" referrerpolicy="no-referrer"><small>${e.label}</small></button>`}).join('')}</div>`;content.innerHTML=(books.length>1?`<div class="bookgrid">${books.map((b,i)=>`<div class="bookcard" data-book="${i}">${b.cover_url?`<img src="${sz(b.cover_url,'M')}" alt="${b.title} cover" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:'<div class="work-placeholder">◇</div>'}<span class="bc-label"><b>${b.title}</b>${b.year?' ('+b.year+')':''}</span></div>`).join('')}</div>`:'')+edHtml;content.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>renderBook(id,idx,+b.dataset.book));content.querySelectorAll('[data-ed]').forEach(el=>el.onclick=()=>{let e=eds[+el.dataset.ed];let wasOn=el.classList.contains('on');content.querySelectorAll('[data-ed]').forEach(x=>x.classList.remove('on'));books.forEach((b,bi)=>{let card=content.querySelector(`[data-book="${bi}"]`);let img=card.querySelector('img');if(!img)return;let nc=sz(b.cover_url,'M'),dm=false;if(!wasOn){let cov=e.covers[slug(b.title)];if(cov)nc=sz(cov.cover_url,'M');else dm=true}if(img.getAttribute('src')!==nc){card.classList.remove('ld');img.src=nc;if(img.complete&&img.naturalWidth)card.classList.add('ld')}card.classList.toggle('dim',dm)});if(!wasOn)el.classList.add('on');curEd=wasOn?-1:+el.dataset.ed});fade(content);resetScroll(document.querySelector('.panel'));if(eds.length){let best=-1,bn=0;eds.forEach((e,ei)=>{let cc=Object.keys(e.covers).length;if(cc>bn){bn=cc;best=ei}});if(best>=0){let de=content.querySelector('[data-ed="'+best+'"]');if(de)de.click()}}dots.innerHTML='';history.replaceState(null,'','#'+id+'/'+slug(w.title))}
function renderBook(id,idx,bi){let fromGrid=curBook<0;current=id;curFic=idx;curBook=bi;heroSeq++;document.querySelector('.panel').classList.remove('hero','revealed');let hs=document.getElementById('herospacer');if(hs)hs.remove();let n=by[id],w=n.works[idx],books=w.books,b=books[bi];let eds=w.editions||[],ei=curEd;if(ei<0||!eds[ei]){let bn=0;ei=-1;eds.forEach((e,k)=>{let cc=Object.keys(e.covers).length;if(cc>bn){bn=cc;ei=k}})}let bslug=slug(b.title),hero=b.cover_url||w.cover_url;if(ei>=0&&eds[ei].covers[bslug])hero=eds[ei].covers[bslug].cover_url;setBg(hero);title.textContent=b.title;crumb.textContent=path(n)+' › '+w.title+' › '+b.title;back.style.visibility='visible';count.textContent=`Book ${bi+1} of ${books.length} · ${w.title}`;hint.textContent=(b.authors||w.authors||[]).join(', ')+(b.year?' · '+b.year:'');let vs=b.versions||[];let html='';if(b.blurb)html+=`<div class="blurb">${b.blurb} <a href="${b.blurb_source}" target="_blank" rel="noopener">Source</a></div>`;if(b.buy&&b.buy.length)html+=`<div class="buy">${b.buy.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${x.label}</a>`).join('')}</div>`;if(vs.length>1)html+=`<div class="sec">Cover versions · tap to preview</div><div class="strip">${vs.map((v,i)=>`<button class="v ${v.cover_url===hero?'on':''}" data-v="${i}"><img src="${sz(v.cover_url,'S')}" alt="cover version" loading="lazy" decoding="async" referrerpolicy="no-referrer"><small>${v.credit||''}</small></button>`).join('')}</div>`;if(fromGrid){ficShelf=document.createElement('div');while(content.firstChild)ficShelf.appendChild(content.firstChild)}content.innerHTML=html;content.querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>{let v=vs[+el.dataset.v];setBg(v.cover_url);content.querySelectorAll('.v').forEach(x=>x.classList.remove('on'));el.classList.add('on')});fade(content);resetScroll(document.querySelector('.panel'));dots.innerHTML='';history.replaceState(null,'','#'+id+'/'+slug(w.title)+'/'+slug(b.title))}
function shift(d){let n=by[current],s=n.parent?by[n.parent].children:[current],i=s.indexOf(current);if(s.length>1)render(s[(i+d+s.length)%s.length])}
back.onclick=()=>{if(curBook>=0){curBook=-1;heroSeq++;if(ficShelf){let n=by[current],w=n.works[curFic];setBg(w.cover_url);title.textContent=w.title;crumb.textContent=path(n)+' › '+w.title;let bks=w.books&&w.books.length?w.books:[w];count.textContent=bks.length+' book'+(bks.length===1?'':'s')+' in this fiction';hint.textContent=bks.length>1?'Series / shared universe · tap a book to open its page.':'Standalone fiction.';while(ficShelf.firstChild)content.appendChild(ficShelf.firstChild);ficShelf=null;resetScroll(document.querySelector('.panel'));dots.innerHTML='';history.replaceState(null,'','#'+current+'/'+slug(w.title))}else renderFic(current,curFic);return}if(curFic>=0){render(current);return}let n=by[current];if(n.parent)render(n.parent)};home.onclick=()=>render('speculative-fiction');app.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});app.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,sw=Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3;if(curBook>=0){if(sw){let w2=by[current].works[curFic],nb=curBook+(dx<0?1:-1);if(w2.books&&nb>=0&&nb<w2.books.length)renderBook(current,curFic,nb)}return}if(curFic>=0)return;if(sw)shift(dx<0?1:-1)},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowRight')shift(1);if(e.key==='ArrowLeft')shift(-1);if(e.key==='ArrowUp')back.click()});document.querySelector('.panel').addEventListener('scroll',function(){if(this.classList.contains('hero')&&this.scrollTop>30)this.classList.add('revealed')},{passive:true});const redirects={'unplaceable':'atemporal','space-opera':'spacefaring-fiction','upbeat-sci-fi':'future-of-earth-fiction','far-future-fiction':'future-of-earth-fiction','post-apocalyptic-fiction':'dystopian-fiction','cyberpunk':'cyberpunk','singularity-fiction':'techno-fiction','mathematics':'hard-conceptual-sf','quantum':'hard-conceptual-sf','galactic':'new-space-opera','transhuman':'new-space-opera','future-history':'f
